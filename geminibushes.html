<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gemini Bushes — Leaf cards only</title>
<style>
    body { margin:0; overflow:hidden; background:#a4d3ff; font-family: sans-serif; }
    #panel { position:fixed; top:20px; left:20px; z-index:10; max-height: 90vh; overflow-y: auto; }
    #upload-container { position:fixed; bottom:20px; left:20px; z-index:10; background:rgba(255,255,255,0.8); padding:12px; border-radius:8px; backdrop-filter: blur(10px); font-size: 11px; border: 1px solid #ccc; display: flex; flex-direction: column; gap: 5px;}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
    "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js"
  }
}
</script>
</head>
<body>

<div id="panel"></div>
<div id="upload-container">
    <div><strong>Leaf SDF:</strong> <input type="file" id="leafInput" accept="image/png"></div>
</div>

<script type="module">
import * as THREE from 'three/webgpu';
import { vec3, uv, positionLocal, normalLocal, uniform, sin, normalize, mix, texture, modelWorldMatrix, time, smoothstep, color, dot, cameraPosition, clamp, pow, oneMinus, normalWorld, instanceIndex, fract, float } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Pane } from 'tweakpane';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(8, 4, 12);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setAnimationLoop(animate);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.position.set(15, 30, 15);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdef1ff, 0x556633, 1.2));

const params = {
    seed: 1234,
    bushRadius: 2.2,
    bushHeight: 2.4,
    radiusSquash: 1.0,
    leafCount: 420,
    leafSize: 1.1,
    shellBias: 0.55,
    shellThickness: 0.42,
    lobeAmount: 0.32,
    verticalBias: 0.35,
    varAmount: 0.065,
    scaleVar: 0.16,
    leafRoughness: 0.88,
    orientationMode: 'yawTilt',
    maxTiltDeg: 32,
    randomOutlier: 0.08,
    alphaCutoff: 0.5,
    normalBias: 0.8,
    leafWarp: 0.3,
    aoStrength: 0.65,
    sssStrength: 0,
    groundEnabled: true,
    groundStrength: 0.38,
    groundFalloff: 0.55,
    rimEnabled: false,
    rimStrength: 2.0,
    rimPower: 4.0,
    windEnabled: false,
    windStrength: 0.25,
    windSpeed: 1.8,
    topColor: '#a8e360',
    bottomColor: '#1d4d22',
    sssColor: '#ffea00',
    rimColor: '#ffffff',
};

const uAlphaCutoff = uniform(params.alphaCutoff);
const uNormalBias = uniform(params.normalBias);
const uLeafWarp = uniform(params.leafWarp);
const uAO = uniform(params.aoStrength);
const uSSS = uniform(params.sssStrength);
const uRimS = uniform(0);
const uRimP = uniform(params.rimPower);
const uWindS = uniform(0);
const uWindSpeed = uniform(params.windSpeed);
const uTopC = uniform(color(params.topColor));
const uBotC = uniform(color(params.bottomColor));
const uSSSC = uniform(color(params.sssColor));
const uRimC = uniform(color(params.rimColor));
const uBushMidY = uniform(1.2);
const uCanopyCenter = vec3(0, uBushMidY, 0);
const uAOFalloff = uniform(4.5);
const uGroundStrength = uniform(params.groundStrength);
const uGroundFalloff = uniform(Math.max(0.05, params.groundFalloff));
const uVarAmount = uniform(params.varAmount);
const leafMap = texture(new THREE.Texture());

const idf = float(instanceIndex);
const hA = fract(sin(idf.mul(127.1)).mul(311.7));
const hB = fract(sin(idf.mul(269.5).add(hA)).mul(183.3));
const hC = fract(sin(idf.mul(419.2).add(hB)).mul(271.9));
const varLo = oneMinus(uVarAmount);
const varHi = uVarAmount.add(1);
const instTint = vec3(mix(varLo, varHi, hA), mix(varLo, varHi, hB), mix(varLo, varHi, hC));

const t = time.mul(uWindSpeed);
const wPos = modelWorldMatrix.mul(positionLocal);

const mainWave = sin(t.add(wPos.x.mul(0.12)));
const flutter = sin(t.mul(4.5).add(wPos.y.mul(0.6))).mul(0.25);
const windNode = positionLocal.add(vec3(mainWave.add(flutter).mul(uWindS), 0, 0).mul(uv().y));

const sphereDir = normalize(wPos.xyz.sub(uCanopyCenter));
const warpedNormal = normalize(normalLocal.add(sin(uv().x.mul(10)).mul(uLeafWarp)));
const finalNormal = normalize(mix(warpedNormal, sphereDir, uNormalBias));

const leafMat = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, alphaTest: 0.5, transparent: true });
leafMat.metalness = 0;
leafMat.roughness = params.leafRoughness;
leafMat.positionNode = windNode;
leafMat.normalNode = finalNormal;

const distCenter = clamp(wPos.xyz.distance(uCanopyCenter).div(uAOFalloff), 0, 1);
const ao = mix(uAO.oneMinus(), 1.0, distCenter);
const groundBlend = smoothstep(0, uGroundFalloff, wPos.y);
const groundMul = mix(oneMinus(uGroundStrength), 1.0, groundBlend);
const sss = pow(clamp(dot(normalWorld, normalize(sun.position)).negate(), 0, 1), 2.0).mul(uSSS);
const viewDir = normalize(cameraPosition.sub(wPos.xyz));
const rim = pow(oneMinus(clamp(dot(viewDir, finalNormal), 0, 1)), uRimP).mul(uRimS).mul(uRimC);

const baseLeafCol = mix(uBotC, uTopC, uv().y).mul(instTint);
leafMat.colorNode = baseLeafCol.mul(ao).mul(groundMul).add(uSSSC.mul(sss)).add(rim);
leafMat.opacityNode = smoothstep(uAlphaCutoff.sub(0.05), uAlphaCutoff.add(0.05), leafMap.r);

let leavesMesh;

function sampleEllipsoid(rx, ry, rz, rnd, biasUp, shellBias, shellThickness, lobeAmount, seedOff) {
    const innerR = Math.max(0.001, 1 - shellThickness * shellBias);
    for (let k = 0; k < 280; k++) {
        let x = (rnd() * 2 - 1) * rx;
        let y = (rnd() * 2 - 1) * ry;
        let z = (rnd() * 2 - 1) * rz;
        if (lobeAmount > 0.001) {
            const lob = Math.floor(rnd() * 3);
            const ang = lob * (Math.PI * 2 / 3) + seedOff * 0.01;
            const lr = Math.min(rx, rz) * 0.32 * lobeAmount;
            x += Math.cos(ang) * lr;
            z += Math.sin(ang) * lr;
        }
        const d = Math.sqrt((x / rx) ** 2 + (y / ry) ** 2 + (z / rz) ** 2);
        if (d > 1) continue;
        if (shellBias > 0.001 && d < innerR) {
            const keepInterior = 0.06 + 0.35 * (1 - shellBias);
            if (rnd() > keepInterior) continue;
        }
        const u = rnd();
        const skew = 1 / (1 + biasUp * 3);
        const t = Math.pow(u, skew);
        const yLift = ry * (2 * t - 1);
        const yOut = y * (1 - biasUp) + yLift * biasUp;
        return new THREE.Vector3(x, yOut, z);
    }
    return new THREE.Vector3(0, ry * 0.5, 0);
}

const TAU = Math.PI * 2;

function applyLeafOrientation(dummy, rnd) {
    const outlier = params.randomOutlier > 0 && rnd() < params.randomOutlier;
    if (outlier || params.orientationMode === 'random') {
        dummy.rotation.order = 'XYZ';
        dummy.rotation.set(rnd() * TAU, rnd() * TAU, rnd() * TAU);
        return;
    }
    if (params.orientationMode === 'yawOnly') {
        dummy.rotation.order = 'XYZ';
        dummy.rotation.set(0, rnd() * TAU, 0);
        return;
    }
    const maxT = (params.maxTiltDeg * Math.PI) / 180;
    dummy.rotation.order = 'YXZ';
    dummy.rotation.set(
        (rnd() - 0.5) * 2 * maxT,
        rnd() * TAU,
        (rnd() - 0.5) * 2 * maxT
    );
}

function buildBush() {
    if (leavesMesh) {
        leavesMesh.geometry.dispose();
        scene.remove(leavesMesh);
    }

    let currentSeed = params.seed;
    const rnd = () => {
        const x = Math.sin(currentSeed++) * 10000;
        return x - Math.floor(x);
    };

    const rx = params.bushRadius * params.radiusSquash;
    const rz = params.bushRadius / Math.max(0.15, params.radiusSquash);
    const ry = params.bushHeight * 0.5;
    const centerY = ry;

    uBushMidY.value = centerY;
    const extent = Math.max(rx, rz, params.bushHeight) * 1.15;
    uAOFalloff.value = extent;

    const n = Math.max(1, Math.floor(params.leafCount));
    const leafGeo = new THREE.PlaneGeometry(params.leafSize, params.leafSize);
    leavesMesh = new THREE.InstancedMesh(leafGeo, leafMat, n);
    const dummy = new THREE.Object3D();

    const sv = params.scaleVar;
    for (let i = 0; i < n; i++) {
        const p = sampleEllipsoid(
            rx, ry, rz, rnd, params.verticalBias,
            params.shellBias, params.shellThickness, params.lobeAmount, params.seed
        );
        dummy.position.set(p.x, p.y + centerY, p.z);
        applyLeafOrientation(dummy, rnd);
        const sc = 1 + (rnd() - 0.5) * 2 * sv;
        dummy.scale.setScalar(Math.max(0.35, sc));
        dummy.updateMatrix();
        leavesMesh.setMatrixAt(i, dummy.matrix);
    }
    dummy.scale.set(1, 1, 1);
    dummy.rotation.order = 'XYZ';
    dummy.rotation.set(0, 0, 0);
    leavesMesh.instanceMatrix.needsUpdate = true;
    scene.add(leavesMesh);
}
buildBush();

const pane = new Pane({ container: document.getElementById('panel') });

const fVol = pane.addFolder({ title: 'Bush volume' });
fVol.addBinding(params, 'seed', { min: 0, max: 9999, step: 1 }).on('change', buildBush);
fVol.addBinding(params, 'bushRadius', { min: 0.4, max: 8 }).on('change', buildBush);
fVol.addBinding(params, 'bushHeight', { min: 0.3, max: 6 }).on('change', buildBush);
fVol.addBinding(params, 'radiusSquash', { min: 0.35, max: 2.5, label: 'XZ squash' }).on('change', buildBush);
fVol.addBinding(params, 'leafCount', { min: 40, max: 4000, step: 10 }).on('change', buildBush);
fVol.addBinding(params, 'verticalBias', { min: 0, max: 1, label: 'Lift to top' }).on('change', buildBush);
fVol.addBinding(params, 'shellBias', { min: 0, max: 1, label: 'Shell (surface)' }).on('change', buildBush);
fVol.addBinding(params, 'shellThickness', { min: 0.12, max: 0.85, label: 'Shell depth' }).on('change', buildBush);
fVol.addBinding(params, 'lobeAmount', { min: 0, max: 1, label: 'Lobe spread' }).on('change', buildBush);

const fCards = pane.addFolder({ title: 'Leaf cards' });
fCards.addBinding(params, 'leafSize', { min: 0.3, max: 6 }).on('change', buildBush);
fCards.addBinding(params, 'scaleVar', { min: 0, max: 0.45, label: 'Size jitter' }).on('change', buildBush);
fCards.addBinding(params, 'varAmount', { min: 0, max: 0.2, label: 'RGB variation' }).on('change', () => { uVarAmount.value = params.varAmount; });
fCards.addBinding(params, 'leafRoughness', { min: 0.35, max: 1, label: 'Roughness' });
fCards.addBinding(params, 'orientationMode', {
    label: 'Orientation',
    options: {
        Random: 'random',
        'Yaw only': 'yawOnly',
        'Yaw + tilt': 'yawTilt',
    },
}).on('change', buildBush);
fCards.addBinding(params, 'maxTiltDeg', { min: 0, max: 75, label: 'Max tilt (°)' }).on('change', buildBush);
fCards.addBinding(params, 'randomOutlier', { min: 0, max: 0.35, label: 'Random outlier' }).on('change', buildBush);

const fShading = pane.addFolder({ title: 'Atmospheric shading' });
fShading.addBinding(params, 'alphaCutoff', { min: 0, max: 1 }).on('change', v => { uAlphaCutoff.value = v.value; });
fShading.addBinding(params, 'normalBias', { min: 0, max: 1 }).on('change', v => { uNormalBias.value = v.value; });
fShading.addBinding(params, 'leafWarp', { min: 0, max: 1 }).on('change', v => { uLeafWarp.value = v.value; });
fShading.addBinding(params, 'aoStrength', { min: 0, max: 1 }).on('change', v => { uAO.value = v.value; });
fShading.addBinding(params, 'groundEnabled', { label: 'Ground dark' });
fShading.addBinding(params, 'groundStrength', { min: 0, max: 0.85 });
fShading.addBinding(params, 'groundFalloff', { min: 0.08, max: 2.5, label: 'Ground fade (Y)' });
fShading.addBinding(params, 'sssStrength', { min: 0, max: 2 }).on('change', v => { uSSS.value = v.value; });
fShading.addBinding(params, 'rimEnabled', { label: 'Rim on' });
fShading.addBinding(params, 'rimStrength', { min: 0, max: 5 });
fShading.addBinding(params, 'rimPower', { min: 1, max: 10 }).on('change', v => { uRimP.value = v.value; });

const fWind = pane.addFolder({ title: 'Wind' });
fWind.addBinding(params, 'windEnabled', { label: 'Wind on' });
fWind.addBinding(params, 'windStrength', { min: 0, max: 1 });
fWind.addBinding(params, 'windSpeed', { min: 0, max: 5 }).on('change', v => { uWindSpeed.value = v.value; });

const fColors = pane.addFolder({ title: 'Colors' });
fColors.addBinding(params, 'topColor');
fColors.addBinding(params, 'bottomColor');
fColors.addBinding(params, 'sssColor');
fColors.addBinding(params, 'rimColor');

document.getElementById('leafInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            leafMap.value = tex;
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
    controls.update();
    uWindS.value = params.windEnabled ? params.windStrength : 0;
    uRimS.value = params.rimEnabled ? params.rimStrength : 0;
    uGroundStrength.value = params.groundEnabled ? params.groundStrength : 0;
    uGroundFalloff.value = Math.max(0.05, params.groundFalloff);
    uVarAmount.value = params.varAmount;
    leafMat.roughness = params.leafRoughness;
    uTopC.value.set(params.topColor);
    uBotC.value.set(params.bottomColor);
    uSSSC.value.set(params.sssColor);
    uRimC.value.set(params.rimColor);
    renderer.render(scene, camera);
}
</script>
</body>
</html>
