            // center. Scrolling the trail buffer here caused stepped “slab” artifacts and
            // mismatched resync; full scene still uses shiftSnowWindow / shiftSnowTrailBySphereDelta.

            if (parkourParams.snow.recoveryPerSecond > 0) {
              const relax = Math.min(1, parkourParams.snow.recoveryPerSecond * dt);
              if (relax > 0) {
                const inv = 128;
                for (let i = 0; i < snowDispSize * snowDispSize; i++) {
                  const idx = i * 4;
                  const cur = snowTrailData[idx];
                  snowTrailData[idx] = (cur + (inv - cur) * relax) | 0;
                }
                snowTrailDirty = true;
              }
            }

            const moveStep = Math.hypot(sphereVel.x * dt, sphereVel.z * dt);
            stampAccum += moveStep;
            if (stampAccum >= parkourParams.snow.trailSpacing) {
              stampAccum = 0;
              const writes = stampSnowTrailCenterDeep();
              if (writes > 0) snowTrailDirty = true;
            }

            if (snowTrailDirty) {
              snowTrailTex.needsUpdate = true;
              if (!SIMPLE_SNOW_SPHERE_DEBUG) {
                snowOverlayMat.needsUpdate = true;
              }
              snowTrailDirty = false;
            }
            syncSnowOverlayCpuFromTrail();

            snowOverlay.position.y = FLOOR_Y + snowOverlayLift;

            camDesired
              .copy(sphere.position)
              .addScaledVector(sphereDir, -6.0)
              .add(new THREE.Vector3(0, 3.0, 0));
            camera.position.lerp(camDesired, 0.14);
            camLook.copy(sphere.position).add(new THREE.Vector3(0, 0.35, 0));
            orbitControls.target.lerp(camLook, 0.2);
            orbitControls.update();
            renderer.render(scene, camera);
            stats.update();
            document.getElementById("stats").textContent =

        const uHazeColor = uniform(new THREE.Color(hazeParams.hazeColor));
        const uNoiseScaleA = uniform(hazeParams.noiseScaleA);
        const uNoiseScaleB = uniform(hazeParams.noiseScaleB);
        const uNoiseAmountA = uniform(hazeParams.noiseAmountA);
        const uNoiseAmountB = uniform(hazeParams.noiseAmountB);
        const uNoiseDetail = uniform(hazeParams.noiseDetail);
        const uNoiseSpeed = uniform(hazeParams.noiseSpeed);
        const hazeTimer = uniform(0).onFrameUpdate((frame) => frame.time);

        function applyVolumetricHaze() {
          if (!hazeParams.enabled) {
            scene.fogNode = null;
            return;

          const fogNoiseDistance = positionView.z
            .negate()
            .smoothstep(0, camera.far - 200);
          const distance = fogNoiseDistance.mul(uHazeThickness).max(8);
          const heightAboveFloor = positionWorld.y.sub(float(FLOOR_Y));

            .sub(heightAboveFloor)
            .div(distance)
            .pow(uHazeFalloff)
            .saturate()
            .mul(uHazeOpacity);
          const fogNoiseA = triNoise3D(
            positionWorld.mul(uNoiseScaleA),
            uNoiseAmountA,
            hazeTimer,
          );
          const fogNoiseB = triNoise3D(
            positionWorld.mul(uNoiseScaleB),
            uNoiseAmountB,
            hazeTimer.mul(uNoiseSpeed),
          );
          const fogNoiseC = triNoise3D(
            positionWorld.mul(0.015),
            uNoiseDetail,
            hazeTimer.mul(0.5),
          );
          const fogNoise = fogNoiseA
            .add(fogNoiseB)
            .add(fogNoiseC)
            .mul(color(uHazeColor));
          const groundColor = color(
            new THREE.Color(parkourParams.light.ambientColor),

          scene.fogNode = fog(

        const postDofFolder = postFolder.addFolder({

        const postGtaoFolder = postFolder.addFolder({

        postGtaoFolder.addBinding(postParams.gtao, "denoiseEnabled", {

        // ── RENDER PIPELINE (full post-processing) ──
        const renderPipeline = new THREE.RenderPipeline(renderer);
        renderPipeline.outputColorTransform = false;
        // MRT: output (beauty), emissive (glow), normal (GTAO)
        const scenePass = pass(scene, camera);
        scenePass.setMRT(
          mrt({
            output,

        const scenePassColor = scenePass.getTextureNode("output");
        const emissivePass = scenePass.getTextureNode("emissive");
        const scenePassDepth = scenePass.getTextureNode("depth");
        const scenePassNormalEncoded = scenePass.getTextureNode("normal");
        const scenePassNormal = sample((uvCoord) =>
          colorToDirection(scenePassNormalEncoded.sample(uvCoord)),
        );
        const normalTexture = scenePass.getTexture("normal");
        if (normalTexture) normalTexture.type = THREE.UnsignedByteType;

        // Emissive bloom (glowing elements)
        const emissiveBloomPass = bloom(emissivePass, 2);
        let baseColor = scenePassColor.add(emissiveBloomPass);

        // GTAO (screen-space ambient occlusion)
        const uGtaoEnabled = uniform(
          postParams.enabled && postParams.gtao.enabled ? 1 : 0,
        );
        const uGtaoIntensity = uniform(postParams.gtao.intensity);
        const aoPass = ao(scenePassDepth, scenePassNormal, camera);
        aoPass.resolutionScale = postParams.gtao.resolutionScale;
        aoPass.radius.value = postParams.gtao.radius;
        aoPass.samples.value = postParams.gtao.samples;
        aoPass.scale.value = postParams.gtao.scale;
        aoPass.distanceFallOff.value = postParams.gtao.distanceFallOff;
        aoPass.distanceExponent.value = postParams.gtao.distanceExponent;
        aoPass.thickness.value = postParams.gtao.thickness;
        const aoTex = aoPass.getTextureNode();
        const denoisePass = denoise(
          aoTex,
          scenePassDepth,
          scenePassNormal,
          camera,
        );
        denoisePass.updateBefore = () => {};
        denoisePass.radius.value = postParams.gtao.denoiseRadius;
        denoisePass.lumaPhi.value = postParams.gtao.denoiseLumaPhi;
        denoisePass.depthPhi.value = postParams.gtao.denoiseDepthPhi;
        denoisePass.normalPhi.value = postParams.gtao.denoiseNormalPhi;
        const uGtaoDenoiseEnabled = uniform(
          postParams.gtao.denoiseEnabled ? 1 : 0,
        );
        const rawAoVal = aoTex.sample(screenUV).r;
        const denoisedAoVal = denoisePass.r;
        const aoVal = mix(rawAoVal, denoisedAoVal, uGtaoDenoiseEnabled);
        baseColor = vec4(
          baseColor.rgb.mul(
            sub(1, mul(mul(aoVal, uGtaoIntensity), uGtaoEnabled)),
          ),
          baseColor.a,
        );

        // Depth for DoF, sky mask, god rays
        const linearDepth = scenePass.getLinearDepthNode
          ? scenePass.getLinearDepthNode()
          : float(0.5);
        const uCameraFar = uniform(camera.far);
        const worldDepth = mul(linearDepth, uCameraFar);
        const skyMask = step(float(0.999), linearDepth);

        // DoF (depth of field)
        const uDofEnabled = uniform(
          postParams.enabled && postParams.dof.enabled ? 1 : 0,
        );
        const uDofFocusDistance = uniform(postParams.dof.focusDistance);
        const uDofBlurStart = uniform(postParams.dof.blurStart);
        const uDofBlurEnd = uniform(postParams.dof.blurEnd);
        const uDofBlurSize = uniform(postParams.dof.blurSize);
        const uDofBlurSpread = uniform(postParams.dof.blurSpread);
        const sceneBlurred = boxBlur(baseColor, {
          size: uDofBlurSize,
          separation: uDofBlurSpread,
        });
        const dofBlurAmount = smoothstep(
          uDofBlurStart,
          uDofBlurEnd,
          abs(sub(worldDepth, uDofFocusDistance)),
        );
        baseColor = mix(
          baseColor,
          sceneBlurred,
          mul(dofBlurAmount, uDofEnabled),

        // Scene bloom (full scene glow)
        const uBloomEnabled = uniform(

        const bloomScenePass = bloom(
          baseColor,

        // Lens flare: bloom sky only (sun/sky at far depth)
        const skyOnlyColor = mix(vec4(0, 0, 0, 0), baseColor, skyMask);
        const skyBloomPass = bloom(
          skyOnlyColor,
          1,
          0.5,
          postParams.lensflare.bloomThreshold,
        );
        const flareThreshold = uniform(postParams.lensflare.threshold);
        const flareGhostAttenuation = uniform(
          postParams.lensflare.ghostAttenuation,
        );
        const flareGhostSpacing = uniform(postParams.lensflare.ghostSpacing);
        const flarePass = lensflare(skyBloomPass, {
          threshold: flareThreshold,
          ghostAttenuationFactor: flareGhostAttenuation,
          ghostSpacing: flareGhostSpacing,
        });
        const flareBlurPass = gaussianBlur(flarePass, null, 8);
        const uLensflareEnabled = uniform(
          postParams.enabled && postParams.lensflare.enabled ? 1 : 0,

        // God rays (volumetric sunlight)
        const uSunScreenPos = uniform(new THREE.Vector2(0.5, 0.5));
        const uGodRaysEnabled = uniform(
          postParams.enabled && postParams.godRays.enabled ? 1 : 0,
        );
        const uGodRaysStrength = uniform(postParams.godRays.strength);
        const uGodRaysDecay = uniform(postParams.godRays.decay);
        const uGodRaysDensity = uniform(postParams.godRays.density);
        const uGodRaysSamples = uniform(postParams.godRays.samples);
        const sceneTex = convertToTexture(baseColor);
        const godRaysFn = Fn(() => {
          const uvNode = uv();
          const stepUV = sub(nodeObject(uSunScreenPos), uvNode)
            .mul(uGodRaysDensity)
            .div(uGodRaysSamples);
          const illumination = float(0).toVar();
          const decayVar = float(1).toVar();
          Loop(
            {
              start: int(0),
              end: int(uGodRaysSamples),
              type: "int",
              condition: "<",
            },
            ({ i }) => {
              const sampleUV = add(uvNode, stepUV.mul(float(i)));
              const s = sceneTex.sample(sampleUV);
              const lum = add(
                add(mul(s.r, 0.299), mul(s.g, 0.587)),
                mul(s.b, 0.114),
              );
              illumination.addAssign(mul(lum, decayVar));
              decayVar.mulAssign(uGodRaysDecay);
            },
          );
          const normalized = illumination.div(uGodRaysSamples);
          return vec4(normalized, normalized, normalized, 1)
            .mul(uGodRaysStrength)
            .mul(uGodRaysEnabled);
        });
        const godRaysNode = godRaysFn();

        // ── Atmosphere fog (post-process, independent of scene.fogNode / volumetric haze) ──
        const uAtmosFogEnabled = uniform(atmosphereFogParams.enabled ? 1 : 0);
        const uAtmosFogColor = uniform(

        const uAtmosFogNear = uniform(atmosphereFogParams.near);
        const uAtmosFogFar = uniform(atmosphereFogParams.far);
        const uAtmosFogIntensity = uniform(atmosphereFogParams.intensity);
        const uAtmosDistanceCurve = uniform(atmosphereFogParams.distanceCurve);
        const uAtmosHeightBlend = uniform(atmosphereFogParams.heightBlend);
        const uAtmosHeightFactor = uniform(atmosphereFogParams.heightFactor);
        const uAtmosDensity = uniform(atmosphereFogParams.atmosphereDensity);
        const uAtmosNoiseEnabled = uniform(
          atmosphereFogParams.noiseEnabled ? 1 : 0,
        );
        const uAtmosNoiseScale = uniform(atmosphereFogParams.noiseScale);
        const uAtmosNoiseWarp = uniform(atmosphereFogParams.noiseWarp);
        const uAtmosNoiseTimeScale = uniform(
          atmosphereFogParams.noiseTimeScale,
        );
        const uAtmosNoiseDepthMix = uniform(atmosphereFogParams.noiseDepthMix);
        const uAtmosNoiseSwirl = uniform(atmosphereFogParams.noiseSwirl);
        const uAtmosNoiseFarStart = uniform(atmosphereFogParams.noiseFarStart);
        const uAtmosNoiseFarEnd = uniform(atmosphereFogParams.noiseFarEnd);
        const uAtmosNoiseOctaves = uniform(atmosphereFogParams.noiseOctaves);
        const uAtmosNoiseLacunarity = uniform(
          atmosphereFogParams.noiseLacunarity,
        );
        const uAtmosNoiseDiminish = uniform(atmosphereFogParams.noiseDiminish);
        const atmosFogTime = uniform(0).onFrameUpdate((frame) => frame.time);

        const applyAtmosphereFogPost = Fn(([inputColor]) => {
          const ld = linearDepth;
          const isSky = step(float(0.999), ld);
          const viewZ = orthographicDepthToViewZ(ld, cameraNear, cameraFar);
          const perspD = viewZToPerspectiveDepth(viewZ, cameraNear, cameraFar);
          const viewPos = getViewPosition(
            screenUV,
            perspD,
            cameraProjectionMatrixInverse,
          );
          const worldPos = cameraWorldMatrix.mul(vec4(viewPos, 1)).xyz;
          const camPos = cameraPosition;
          const fogDelta = sub(worldPos, camPos);
          const fogDepthRaw = length(fogDelta);
          const fogDir = normalize(fogDelta);
          const nOct = int(
            tslFloor(clamp(uAtmosNoiseOctaves, float(2), float(6))),
          );
          const t = mul(atmosFogTime, uAtmosNoiseTimeScale);
          const noiseCoord = add(
            mul(worldPos, uAtmosNoiseScale),
            vec3(0, 0, t),
          );
          const nInner = mx_fractal_noise_float(
            noiseCoord,
            nOct,
            uAtmosNoiseLacunarity,
            uAtmosNoiseDiminish,
            float(0.5),
          );
          const nWarped = mx_fractal_noise_float(
            add(noiseCoord, mul(vec3(nInner, nInner, nInner), uAtmosNoiseWarp)),
            nOct,
            uAtmosNoiseLacunarity,
            uAtmosNoiseDiminish,
            float(0.5),
          );
          const noise01 = nWarped.mul(0.5).add(0.5).clamp(0, 1);
          const noiseFarFade = smoothstep(
            uAtmosNoiseFarStart,
            uAtmosNoiseFarEnd,
            fogDepthRaw,
          );
          const noiseSampleSimon = mix(noise01, float(1), noiseFarFade);
          const depthMult = mix(
            float(1),
            noiseSampleSimon,
            mul(uAtmosNoiseDepthMix, uAtmosNoiseEnabled),
          );
          const dMixed = mul(fogDepthRaw, depthMult);
          const dOptical = mul(dMixed, dMixed);
          const distCurve = pow(
            max(fogDepthRaw, float(0.001)),
            uAtmosDistanceCurve,
          );
          const distAmt = smoothstep(
            uAtmosFogNear,
            uAtmosFogFar,
            distCurve,
          ).mul(uAtmosFogIntensity);
          const swirlRaw = sub(mul(noise01, float(1.75)), float(0.35));
          const swirlMul = mix(
            float(1),
            swirlRaw,
            mul(uAtmosNoiseSwirl, uAtmosNoiseEnabled),
          ).clamp(0.35, 1.85);
          const den = max(uAtmosDensity, float(1e-8));
          const heightNumer = sub(
            1,
            exp(sub(0, mul(mul(dOptical, fogDir.y), den))),
          );
          const denom = add(fogDir.y, mul(sign(fogDir.y), float(0.02)));
          const heightTerm = mul(
            mul(uAtmosHeightFactor, exp(sub(0, mul(camPos.y, den)))),
            div(heightNumer, denom),
          ).clamp(0, 1);
          const heightCombined = mix(float(1), heightTerm, uAtmosHeightBlend);
          const fogAmt = clamp(
            mul(mul(distAmt, swirlMul), heightCombined),
            0,
            1,
          );
          const wt = mul(mul(fogAmt, uAtmosFogEnabled), sub(1, isSky));
          const outRgb = mix(inputColor.rgb, color(uAtmosFogColor), wt);
          return vec4(outRgb, inputColor.a);
        });

        // Final composite (each effect gated by postParams.enabled && effect.enabled)
        const finalOutput = baseColor
          .add(bloomScenePass.mul(uBloomEnabled))
          .add(flareBlurPass.mul(uLensflareEnabled))

        const finalWithAtmosFog = applyAtmosphereFogPost(finalOutput);

        renderPipeline.outputNode = fxaa(renderOutput(finalWithAtmosFog));

        const atmosFogFolder = pane.addFolder({

        atmosFogFolder

          })

          });
        atmosFogFolder
          .addBinding(atmosphereFogParams, "heightBlend", {
            min: 0,

          })
          .on("change", (e) => {

        atmosFogFolder

          })

        atmosFogFolder

          })

        atmosFogFolder

          .on("change", (e) => {

        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseScale", {

          })
          .on("change", (e) => {

        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseOctaves", {
            min: 2,
            max: 6,

            label: "noise octaves",
          })
          .on("change", (e) => {

        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseLacunarity", {
            min: 1.5,
            max: 3,
            step: 0.05,
            label: "lacunarity",
          })
          .on("change", (e) => {
            uAtmosNoiseLacunarity.value = e.value;
          });
        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseDiminish", {
            min: 0.25,
            max: 0.75,
            step: 0.02,
            label: "diminish",
          })
          .on("change", (e) => {
            uAtmosNoiseDiminish.value = e.value;
          });
        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseWarp", {
            min: 0,

          })
          .on("change", (e) => {

        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseTimeScale", {

          })

        atmosFogFolder

        atmosFogFolder

        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseFarStart", {

          })
          .on("change", (e) => {

        atmosFogFolder
          .addBinding(atmosphereFogParams, "noiseFarEnd", {
            min: 50,
            max: 8000,
            step: 50,

          })
          .on("change", (e) => {
            uAtmosNoiseFarEnd.value = e.value;
          });

        await renderer.compileAsync(scene, camera);
        csm.camera = camera;
        csm.updateFrustums();

        const timer = new THREE.Timer();
        let lastTime = 0;
        let lastPlaneSize = parkourParams.ground.planeSize;
        const _snowFootPosL = new THREE.Vector3();
        const _snowFootPosR = new THREE.Vector3();
        const _snowFootPrevL = new THREE.Vector3();
        const _snowFootPrevR = new THREE.Vector3();
        const _snowPrevCharPos = new THREE.Vector3(charPos.x, charPos.y, charPos.z);
        let _snowFeetInit = false;
        let _snowCharAccum = 0;
        const smoothCamPos = new THREE.Vector3();
        const smoothLookAt = new THREE.Vector3();
        const smoothCharPos = new THREE.Vector3();
        let camSmoothInit = false;
        let charSmoothInit = false;
        const CAM_SMOOTH = 12; // higher = snappier, lower = smoother (filters jitter)
        const CHAR_SMOOTH = 14; // character visual smoothing
        let lastCsmCascades = parkourParams.csm.cascades;
        let lastCsmMaxFar = parkourParams.csm.maxFar;

        const _towerAimOrigin = new THREE.Vector3();
        const _towerAimDeer = new THREE.Vector3();
        const _towerAimRayDir = new THREE.Vector3();

        const towerLosRaycaster = new THREE.Raycaster();
        towerLosRaycaster.firstHitOnly = true;

        const _towerLosMeshesScratch = [];

        /** Ray vs deer BVH meshes; first hit must be `targetDeer` (uses shared mesh list). */
        function towerGunLosToDeer(
          origin,
          aimPoint,
          targetDeer,
          deerBvhMeshes,
        ) {
          if (!targetDeer.bvhMesh) return true;
          _towerAimRayDir.subVectors(aimPoint, origin);
          const dist = _towerAimRayDir.length();
          if (dist < 0.02) return true;
          _towerAimRayDir.multiplyScalar(1 / dist);
          towerLosRaycaster.set(origin, _towerAimRayDir);
          towerLosRaycaster.near = 0.05;
          towerLosRaycaster.far = dist + 0.35;
          if (deerBvhMeshes.length === 0) return true;
          const hits = towerLosRaycaster.intersectObjects(deerBvhMeshes, false);
          if (hits.length === 0) return false;
          return hits[0].object === targetDeer.bvhMesh;
        }

        function collectTowerGunDeerBvhMeshes() {
          _towerLosMeshesScratch.length = 0;
          for (const d of deerTargets) {
            if (!d || d.isDead || !d.bvhMesh) continue;
            _towerLosMeshesScratch.push(d.bvhMesh);
          }
          return _towerLosMeshesScratch;
        }

        /** Nearest in range; with LOS, try sorted candidates so we raycast at most a few times per call (not every frame × every deer). */
        function pickTowerGunTargetDeer(origin, rSq) {
          const p = parkourParams.towerGun;
          const candidates = [];
          for (const deer of deerTargets) {
            if (!deer || deer.isDead) continue;
            deer.root.getWorldPosition(_towerAimDeer);
            _towerAimDeer.y += p.aimDeerYOffset;
            const distSq = origin.distanceToSquared(_towerAimDeer);
            if (distSq > rSq) continue;
            candidates.push({ deer, distSq });
          }
          candidates.sort((a, b) => a.distSq - b.distSq);
          if (candidates.length === 0) return null;
          if (!p.aimRequireLos) return candidates[0].deer;

          const losMeshes = collectTowerGunDeerBvhMeshes();
          for (const c of candidates) {
            c.deer.root.getWorldPosition(_towerAimDeer);
            _towerAimDeer.y += p.aimDeerYOffset;
            if (towerGunLosToDeer(origin, _towerAimDeer, c.deer, losMeshes))
              return c.deer;
          }
          return null;
        }

        let towerGunLockedDeer = null;
        let towerGunAimRetargetAcc = 0;
        let towerGunShootAcc = 0;
        let towerGunIdlePause = false;
        let towerGunIdlePhaseT = 0;
        let towerGunIdleSpinRate = 0;

        /** Slow scan + random pauses when no deer is locked (searching). */
        function updateTowerGunIdleSearch(dt) {
          if (!towerGunRotateGroup) return;
          towerGunIdlePhaseT -= dt;
          if (towerGunIdlePhaseT <= 0) {
            if (towerGunIdlePause) {
              towerGunIdlePause = false;
              towerGunIdleSpinRate = (Math.random() - 0.5) * 1.15;
              towerGunIdlePhaseT = 0.65 + Math.random() * 2.0;
            } else {
              if (Math.random() < 0.42) {
                towerGunIdlePause = true;
                towerGunIdleSpinRate = 0;
                towerGunIdlePhaseT = 0.4 + Math.random() * 1.6;
              } else {
                towerGunIdleSpinRate = (Math.random() - 0.5) * 1.15;
                towerGunIdlePhaseT = 0.55 + Math.random() * 1.9;
              }
            }
          }
          if (!towerGunIdlePause) {
            towerGunRotateGroup.rotation.y += towerGunIdleSpinRate * dt;
          }
        }

        function updateTowerGunTargeting(dt) {
          if (
            !towerGunRotateGroup ||
            !parkourParams.towerGun.enabled ||
            !towerGunRoot?.visible
          )
            return;
          const p = parkourParams.towerGun;
          if (!p.aimEnabled) {
            towerGunLockedDeer = null;
            towerGunShootAcc = 0;
            updateTowerGunIdleSearch(dt);
            return;
          }

          towerGunRotateGroup.getWorldPosition(_towerAimOrigin);
          _towerAimOrigin.y += p.aimPivotYOffset;

          const rSq = p.aimMaxRange * p.aimMaxRange;

          if (towerGunLockedDeer) {
            if (towerGunLockedDeer.isDead) towerGunLockedDeer = null;
            else {
              towerGunLockedDeer.root.getWorldPosition(_towerAimDeer);
              _towerAimDeer.y += p.aimDeerYOffset;
              if (_towerAimOrigin.distanceToSquared(_towerAimDeer) > rSq)
                towerGunLockedDeer = null;
            }
          }

          towerGunAimRetargetAcc += dt;
          const interval = Math.max(0.04, p.aimRetargetInterval);
          if (!towerGunLockedDeer || towerGunAimRetargetAcc >= interval) {
            towerGunAimRetargetAcc = 0;
            towerGunLockedDeer = pickTowerGunTargetDeer(_towerAimOrigin, rSq);
          }

          if (!towerGunLockedDeer) {
            updateTowerGunIdleSearch(dt);
            return;
          }

          towerGunLockedDeer.root.getWorldPosition(_towerAimDeer);
          _towerAimDeer.y += p.aimDeerYOffset;

          const dx = _towerAimDeer.x - _towerAimOrigin.x;
          const dz = _towerAimDeer.z - _towerAimOrigin.z;
          const targetYaw = Math.atan2(dx, dz) + p.aimYawOffset;

          let cur = towerGunRotateGroup.rotation.y;
          let delta = targetYaw - cur;
          delta = Math.atan2(Math.sin(delta), Math.cos(delta));
          const maxStep = p.aimTurnSpeed * dt;
          towerGunRotateGroup.rotation.y +=
            Math.sign(delta) * Math.min(Math.abs(delta), maxStep);

          // Same projectile pool + hit logic as player spell (checkProjectileHits).
          if (
            p.shootEnabled &&
            parkourParams.spellVFX.enabled &&
            spellVfx.initialized
          ) {
            towerGunShootAcc += dt;
            const lenSqH = dx * dx + dz * dz;
            if (lenSqH >= 0.04 && towerGunShootAcc >= p.shootCooldown) {
              _towerShootDir
                .set(dx, 0, dz)
                .multiplyScalar(1 / Math.sqrt(lenSqH));
              const curYaw = towerGunRotateGroup.rotation.y;
              let aimErr = targetYaw - curYaw;
              aimErr = Math.atan2(Math.sin(aimErr), Math.cos(aimErr));
              if (Math.abs(aimErr) <= p.shootYawTolerance) {
                towerGunShootAcc = 0;
                const bm = towerGunRotateGroup.userData.barrelMuzzleLocal;
                if (bm) {
                  _towerMuzzlePos.copy(bm);
                  towerGunRotateGroup.localToWorld(_towerMuzzlePos);
                } else {
                  _towerMuzzlePos
                    .copy(_towerAimOrigin)
                    .addScaledVector(_towerShootDir, 0.35);
                }
                _towerMuzzlePos.addScaledVector(
                  _towerShootDir,
                  p.shootMuzzleAlongAim,
                );
                spawnProjectile(_towerMuzzlePos, _towerShootDir);
              }
            }
          }
        }

        function trySpellHit() {
          const ud = player.characterGroup.userData;
          const handBone = ud.leftHandBone;
          const charPos = player.characterGroup.position;
          const yaw = player.state.camYaw;
          const dir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
          let origin;
          if (handBone) {
            origin = new THREE.Vector3();
            handBone.getWorldPosition(origin);
            const sp = parkourParams.spellVFX;
            origin.x += sp.orbOffsetX;
            origin.y += sp.orbOffsetY;
            origin.z += sp.orbOffsetZ;
          } else {
            origin = new THREE.Vector3(
              charPos.x,
              charPos.y + 0.9,
              charPos.z,
            ).addScaledVector(dir, 0.4);
          }
          spawnProjectile(origin, dir);
        }

        const _deerPosHit = new THREE.Vector3();
        function checkProjectileHits() {
          for (const proj of spellVfx.projPool) {
            if (!proj.alive) continue;
            const pos = proj.pos;
            const hitRadius = 1.8;
            for (const deer of deerTargets) {
              if (!deer || deer.isDead) continue;
              deer.root.getWorldPosition(_deerPosHit);
              _deerPosHit.y += 0.8;
              const distSq = pos.distanceToSquared(_deerPosHit);
              if (distSq <= hitRadius * hitRadius) {
                deer.isDead = true;
                deer.state = "dead";
                if (deer.deathAction) {
                  if (deer.idleAction) deer.idleAction.stop();
                  if (deer.walkAction) deer.walkAction.stop();
                  if (deer.runAction) deer.runAction.stop();
                  if (deer.grazeAction) deer.grazeAction.stop();
                  if (deer.lookAction) deer.lookAction.stop();
                  deer.deathAction.reset();
                  deer.deathAction.play();
                }
                spawnBloodBurst(_deerPosHit, FLOOR_Y);
                flashDeerRed(deer);
                spawnImpact(pos.clone());
                releaseProjectile(proj);
                break;
              }
            }
          }
        }

        renderer.setAnimationLoop(() => {
          timer.update();
          const elapsed = timer.getElapsed();
          const dt = Math.min(elapsed - lastTime, 0.05);
          lastTime = elapsed;

          // ─── PRE-STEP: kinematic body updates ─────────────────────────────────
          // setNextKinematicTranslation MUST be called before physicsWorld.step()
          // (which runs inside player.update). This way Rapier sees the correct
          // frame-N target positions during collision detection and computes
          // accurate linvel() for platform-riding.

          // Moving platforms / pendulums removed for simplified layout
          // ──────────────────────────────────────────────────────────────────────

          player.update(dt);

          // When a spell shoot is happening, fire a hit test once per shoot phase
          const udPlayer = player.characterGroup.userData;
          if (!udPlayer._spellHitMarker) udPlayer._spellHitMarker = false;
          if (udPlayer.isCastingSpell && udPlayer.spellPhase === "shoot") {
            if (!udPlayer._spellHitMarker) {
              udPlayer._spellHitMarker = true;
              trySpellHit();
            }
          } else {
            udPlayer._spellHitMarker = false;
          }

          if (towerGunRoot)
            towerGunRoot.visible = parkourParams.towerGun.enabled;
          if (tankRoot) tankRoot.visible = parkourParams.tank.enabled;
          updateTankPatrol(dt, tankRoot, tankState);
          updateTowerGunTargeting(dt);

          updateSpellVFX(dt, camera, udPlayer);
          checkProjectileHits();

          const swordGroup = player.characterGroup.userData.sword;
          if (swordGroup && parkourParams.katana) {
            const k = parkourParams.katana;
            swordGroup.position.set(k.posX, k.posY, k.posZ);
            swordGroup.rotation.set(k.rotX, k.rotY, k.rotZ);

            if (!swordTrail.initialized) initSwordTrail(scene);
            const udForVfx = player.characterGroup.userData;
            updateSwordTrail(dt, swordGroup, !!udForVfx.isAttacking);

            // Simple sword → deer hit: check distance from sword tip to each deer center
            if (deerTargets.length) {
              const ud = player.characterGroup.userData;
              if (ud.isAttacking) {
                const localTip = new THREE.Vector3(0, 0, 0.9);
                const worldTip = swordGroup.localToWorld(localTip.clone());
                const hitRadius = 2.2;
                const deerPos = new THREE.Vector3();
                for (const deer of deerTargets) {
                  if (!deer || deer.isDead) continue;
                  deer.root.getWorldPosition(deerPos);
                  const distSq = worldTip.distanceToSquared(deerPos);
                  if (distSq <= hitRadius * hitRadius) {
                    deer.isDead = true;
                    deer.state = "dead";
                    if (deer.deathAction) {
                      if (deer.idleAction) deer.idleAction.stop();
                      if (deer.walkAction) deer.walkAction.stop();
                      if (deer.runAction) deer.runAction.stop();
                      if (deer.grazeAction) deer.grazeAction.stop();
                      if (deer.lookAction) deer.lookAction.stop();
                      deer.deathAction.reset();
                      deer.deathAction.play();
                    }
                    const bloodPos = deerPos.clone();
                    bloodPos.y += 0.8;
                    spawnBloodBurst(bloodPos, FLOOR_Y);
                    flashDeerRed(deer);
                  }
                }
              }
            }
          }

          // Sync dynamic props visual → physics
          for (const { body, mesh } of dynamicObjects) {
            const t = body.translation();
            const r = body.rotation();
            mesh.position.set(t.x, t.y, t.z);
            mesh.quaternion.set(r.x, r.y, r.z, r.w);
          }

          windParams.uTime.value = elapsed;
          windParams.uWindStr.value = parkourParams.foliage.windStr;
          windParams.uWindSpeed.value = parkourParams.foliage.windSpeed;
          leaves.params.enabled = parkourParams.foliage.floatingLeaves;
          leaves.params.count = parkourParams.foliage.count;
          leaves.params.areaSize = parkourParams.foliage.areaSize;
          leaves.params.spawnHeight = parkourParams.foliage.spawnHeight;
          leaves.params.leafSize = parkourParams.foliage.leafSize;
          leaves.params.scale = parkourParams.foliage.scale;
          leaves.params.opacity = parkourParams.foliage.opacity;
          leaves.params.windInfluence = parkourParams.foliage.windInfluence;
          leaves.params.gravity = parkourParams.foliage.gravity;
          leaves.params.terminalVelocity =
            parkourParams.foliage.terminalVelocity;
          leaves.params.rotationSpeed = parkourParams.foliage.rotationSpeed;
          leaves.params.airResistance = parkourParams.foliage.airResistance;
          leaves.params.maxAge = parkourParams.foliage.maxAge;
          leaves.params.terrainFloorOffset =
            parkourParams.foliage.terrainFloorOffset;
          leaves.update();

          flowing.params.enabled = parkourParams.flowingLines.enabled;
          flowing.params.heightOffset = parkourParams.flowingLines.heightOffset;
          flowing.params.verticalWave = parkourParams.flowingLines.verticalWave;
          flowing.params.animationSpeed =
            parkourParams.flowingLines.animationSpeed;
          flowing.params.pathRadius = parkourParams.flowingLines.pathRadius;
          flowing.params.pathFrequency =
            parkourParams.flowingLines.pathFrequency;
          flowing.group.visible = parkourParams.flowingLines.enabled;
          flowing.setParams({
            lineColor: parkourParams.flowingLines.lineColor,
            lineOpacity: parkourParams.flowingLines.lineOpacity,
          });
          flowing.update(elapsed);

          // Update deer animation mixers + simple ambient behavior
          for (const deer of deerTargets) {
            if (!deer || !deer.mixer) continue;

            if (!deer.isDead) {
              deer.stateTime += dt;

              // Decide on next state when timer expires
              if (deer.state === "idle" || deer.state === "graze") {
                if (deer.stateTime > 4 + Math.random() * 3) {
                  deer.stateTime = 0;
                  const r = Math.random();
                  if (r < 0.4 && deer.grazeAction) {
                    // Stay in place and graze
                    if (deer.idleAction) deer.idleAction.stop();
                    if (deer.lookAction) deer.lookAction.stop();
                    deer.grazeAction.reset();
                    deer.grazeAction.play();
                    deer.state = "graze";
                  } else {
                    // Pick a new wander target near home
                    const radius = 10;
                    const angle = Math.random() * Math.PI * 2;
                    deer.targetPos.set(
                      deer.homePos.x + Math.cos(angle) * radius,
                      FLOOR_Y,
                      deer.homePos.z + Math.sin(angle) * radius,
                    );
                    const useRun = r > 0.8 && deer.runAction;
                    deer.state = useRun ? "run" : "walk";
                    if (deer.idleAction) deer.idleAction.stop();
                    if (deer.grazeAction) deer.grazeAction.stop();
                    if (useRun) {
                      deer.runAction.reset();
                      deer.runAction.play();
                    } else if (deer.walkAction) {
                      deer.walkAction.reset();
                      deer.walkAction.play();
                    }
                  }
                }
              } else if (deer.state === "walk" || deer.state === "run") {
                // Move toward target
                const pos = deer.root.position;
                const dir = deer.targetPos.clone().sub(pos);
                const dist = dir.length();
                if (dist < 0.2) {
                  // Arrived
                  deer.state = "idle";
                  deer.stateTime = 0;
                  if (deer.walkAction) deer.walkAction.stop();
                  if (deer.runAction) deer.runAction.stop();
                  if (deer.idleAction) {
                    deer.idleAction.reset();
                    deer.idleAction.play();
                  }
                } else {
                  dir.normalize();
                  const speed =
                    deer.state === "run" ? deer.runSpeed : deer.walkSpeed;
                  pos.addScaledVector(dir, speed * dt);
                  // Face movement direction
                  const yaw = Math.atan2(dir.x, dir.z);
                  deer.root.rotation.y = yaw;
                }
              }
            }

            deer.mixer.update(dt);
            updateDeerFlash(deer, dt);
          }
          updateBloodFX(dt);

          // Smooth character visual + camera to filter physics jitter (ground appears to shake otherwise)
          const inAir = !player.state.isGrounded;
          if (!charSmoothInit) {
            smoothCharPos.copy(charPos);
            charSmoothInit = true;
          }
          if (inAir) {
            smoothCharPos.copy(charPos);
            player.characterGroup.position.copy(charPos);
          } else {
            const charAlpha = 1 - Math.exp(-CHAR_SMOOTH * dt);
            smoothCharPos.lerp(charPos, charAlpha);
            player.characterGroup.position.copy(smoothCharPos);
          }

          if (parkourParams.snow.enabled) {
            const charDX = charPos.x - _snowPrevCharPos.x;
            const charDZ = charPos.z - _snowPrevCharPos.z;
            _snowCharAccum += Math.hypot(charDX, charDZ);
            _snowPrevCharPos.copy(charPos);

            // Shift the displacement window to follow the character
            const winDX = charPos.x - snowWinCX;
            const winDZ = charPos.z - snowWinCZ;
            if (Math.abs(winDX) > SNOW_WINDOW * 0.25 || Math.abs(winDZ) > SNOW_WINDOW * 0.25) {
              shiftSnowWindow(charPos.x, charPos.z);
              snowTrailDirty = true;
            }

            // Move overlay to track the displacement window center
            snowOverlay.position.set(snowWinCX, FLOOR_Y, snowWinCZ);
            if (uOverlayPos) {
              uOverlayPos.value.set(snowWinCX, snowWinCZ);
            }

            // Resolve foot bones once
            const udSnow = player.characterGroup.userData;
            if (!udSnow._snowFootBonesResolved) {
              const bones = [];
              player.characterGroup.traverse((o) => {
                if (o.isBone && o.name) bones.push(o);
              });
              const pickBone = (tests) =>
                bones.find((b) => tests.every((re) => re.test(b.name))) || null;
              udSnow.leftFootBone =
                udSnow.leftFootBone ||
                pickBone([/left|l/i, /foot/i]) ||
                pickBone([/left|l/i, /ankle/i]);
              udSnow.rightFootBone =
                udSnow.rightFootBone ||
                pickBone([/right|r/i, /foot/i]) ||
                pickBone([/right|r/i, /ankle/i]);
              udSnow.leftToeBone =
                udSnow.leftToeBone || pickBone([/left|l/i, /toe/i]);
              udSnow.rightToeBone =
                udSnow.rightToeBone || pickBone([/right|r/i, /toe/i]);
              udSnow._snowFootBonesResolved = true;
            }
            const leftFootBone =
              udSnow.leftFootBone || udSnow.leftToeBone || null;
            const rightFootBone =
              udSnow.rightFootBone || udSnow.rightToeBone || null;

            // Get foot world positions (fallback: synthesize from character yaw)
            if (!leftFootBone || !rightFootBone) {
              const yaw = player.characterGroup.rotation.y || player.state.camYaw || 0;
              const side = 0.18, fwd = 0.06;
              const s = Math.sin(yaw), c = Math.cos(yaw);
              _snowFootPosL.set(
                charPos.x + c * -side + s * fwd, FLOOR_Y,
                charPos.z + -s * -side + c * fwd,
              );
              _snowFootPosR.set(
                charPos.x + c * side + s * fwd, FLOOR_Y,
                charPos.z + -s * side + c * fwd,
              );
            } else {
              leftFootBone.getWorldPosition(_snowFootPosL);
              rightFootBone.getWorldPosition(_snowFootPosR);
              _snowFootPosL.y = FLOOR_Y;
              _snowFootPosR.y = FLOOR_Y;
            }

            if (!_snowFeetInit) {
              _snowFootPrevL.copy(_snowFootPosL);
              _snowFootPrevR.copy(_snowFootPosR);
              _snowFeetInit = true;
            }
            _snowFootPrevL.copy(_snowFootPosL);
            _snowFootPrevR.copy(_snowFootPosR);

            // Stamp DataTexture at foot positions when grounded + moved enough
            const doStamp =
              player.state.isGrounded &&
              _snowCharAccum >= parkourParams.snow.trailSpacing;
            if (doStamp) {
              _snowCharAccum = 0;
              stampSnowData(_snowFootPosL.x, _snowFootPosL.z, parkourParams.snow.stampStrength);
              stampSnowData(_snowFootPosR.x, _snowFootPosR.z, parkourParams.snow.stampStrength);
              snowTrailDirty = true;
            }

            // Recovery: slowly blend all texels back toward 128 (neutral)
            if (parkourParams.snow.recoveryPerSecond > 0) {
              const rec = Math.min(1, parkourParams.snow.recoveryPerSecond * dt * 0.6);
              if (rec > 0.0001) {
                const len = snowDispSize * snowDispSize;
                const step = Math.max(1, (rec * 128) | 0);
                for (let i = 0; i < len; i++) {
                  const idx = i * 4;
                  const v = snowTrailData[idx];
                  if (v < 128) snowTrailData[idx] = Math.min(128, v + step);
                }
                snowTrailDirty = true;
              }
            }

            if (snowTrailDirty) {
              snowTrailTex.needsUpdate = true;
              snowTrailDirty = false;
            }
          }

          const syncTileMat = (mat) => {
            const u = mat._tileUniforms;
            if (u) {
              u.textureScale.value = parkourParams.tile.textureScale;
              u.gradientIntensity.value = parkourParams.tile.gradientIntensity;
              u.gradientBias.value = parkourParams.tile.gradientBias;
              u.tileColor.value.copy(
                srgbToLinear(parkourParams.tile.tileColor),
              );
              u.gridColor.value.copy(
                srgbToLinear(parkourParams.tile.gridColor),
              );
              u.gridLineColor.value.copy(
                srgbToLinear(parkourParams.tile.gridLineColor),
              );
              mat.roughness = parkourParams.tile.roughness;
              mat.metalness = parkourParams.tile.metalness;
            }
          };
          syncTileMat(floorMat);
          syncTileMat(towerMat);

          if (parkourParams.ground.planeSize !== lastPlaneSize) {
            lastPlaneSize = parkourParams.ground.planeSize;
            const scale = lastPlaneSize / PARKOUR_SIZE;
            floor.scale.set(scale, 1, scale);
          }

          if (PARAMS.cameraMode === "thirdPerson") {
            const camDist = PARAMS.camDist;
            const cx =
              smoothCharPos.x -
              Math.sin(player.state.camYaw) *
                Math.cos(player.state.camPitch) *
                camDist;
            const cy =
              smoothCharPos.y +
              Math.sin(player.state.camPitch) * camDist +
              PARAMS.camHeight;
            const cz =
              smoothCharPos.z -
              Math.cos(player.state.camYaw) *
                Math.cos(player.state.camPitch) *
                camDist;
            const camTerrainY = sampleHeight(cx, cz) + 1.5;
            const targetPos = new THREE.Vector3(
              cx,
              Math.max(cy, camTerrainY),
              cz,
            );
            const targetLook = new THREE.Vector3(
              smoothCharPos.x,
              smoothCharPos.y + 0.5,
              smoothCharPos.z,
            );
            if (!camSmoothInit) {
              smoothCamPos.copy(targetPos);
              smoothLookAt.copy(targetLook);
              camSmoothInit = true;
            }
            const alpha = 1 - Math.exp(-CAM_SMOOTH * dt);
            smoothCamPos.lerp(targetPos, alpha);
            smoothLookAt.lerp(targetLook, alpha);
            camera.position.copy(smoothCamPos);
            camera.lookAt(smoothLookAt);
            orbitControls.enabled = false;
          } else {
            orbitControls.target.set(
              smoothCharPos.x,
              smoothCharPos.y + 0.5,
              smoothCharPos.z,
            );
            orbitControls.enabled = true;
            orbitControls.update();
          }

          camera.updateMatrixWorld();

          dirLight.shadow.bias = parkourParams.light.shadowBias;
          dirLight.shadow.normalBias = parkourParams.light.shadowNormalBias;

          // Apply lighting params
          const sunDir = sunDirectionFromAngles(
            parkourParams.light.sunAzimuth,
            parkourParams.light.sunElevation,
          );
          dirLight.position.copy(sunDir.clone().multiplyScalar(50));
          dirLight.color.set(parkourParams.light.dirColor);
          dirLight.intensity = parkourParams.light.dirIntensity;
          ambientLight.color.set(parkourParams.light.ambientColor);
          ambientLight.intensity = parkourParams.light.ambientIntensity;

          horizonSky.mesh.visible = parkourParams.horizonGradient.enabled;
          horizonSky.mesh.renderOrder = parkourParams.horizonGradient.drawOnTop
            ? 5
            : -10;
          horizonSky.uniforms.topColor.value
            .set(parkourParams.horizonGradient.topColor)
            .convertSRGBToLinear();
          horizonSky.uniforms.bottomColor.value
            .set(parkourParams.horizonGradient.bottomColor)
            .convertSRGBToLinear();
          horizonSky.uniforms.offset.value =
            parkourParams.horizonGradient.offset;
          horizonSky.uniforms.exponent.value =
            parkourParams.horizonGradient.exponent;
          horizonSky.uniforms.ringStrength.value =
            parkourParams.horizonGradient.ringStrength;
          horizonSky.uniforms.ringWidth.value =
            parkourParams.horizonGradient.ringWidth;
          horizonSky.uniforms.ringColor.value
            .set(parkourParams.horizonGradient.ringColor)
            .convertSRGBToLinear();
          horizonSky.setRadius(parkourParams.horizonGradient.radius);
          horizonSky.update(camera);

          scene.environmentIntensity = parkourParams.light.envIntensity;
          scene.backgroundIntensity = parkourParams.light.backgroundIntensity;
          renderer.toneMappingExposure = parkourParams.light.exposure;

          // Post-processing uniform sync
          uGtaoEnabled.value =
            postParams.enabled && postParams.gtao.enabled ? 1 : 0;
          uGtaoIntensity.value = postParams.gtao.intensity;
          aoPass.radius.value = postParams.gtao.radius;
          aoPass.samples.value = postParams.gtao.samples;
          aoPass.scale.value = postParams.gtao.scale;
          aoPass.distanceFallOff.value = postParams.gtao.distanceFallOff;
          aoPass.distanceExponent.value = postParams.gtao.distanceExponent;
          aoPass.thickness.value = postParams.gtao.thickness;
          denoisePass.radius.value = postParams.gtao.denoiseRadius;
          denoisePass.lumaPhi.value = postParams.gtao.denoiseLumaPhi;
          denoisePass.depthPhi.value = postParams.gtao.denoiseDepthPhi;
          denoisePass.normalPhi.value = postParams.gtao.denoiseNormalPhi;
          uGtaoDenoiseEnabled.value = postParams.gtao.denoiseEnabled ? 1 : 0;
          if (denoisePass._resolution) {
            const size = renderer.getDrawingBufferSize(new THREE.Vector2());
            denoisePass._resolution.value.set(size.x, size.y);
          }

          uDofEnabled.value =
            postParams.enabled && postParams.dof.enabled ? 1 : 0;
          uDofFocusDistance.value = postParams.dof.focusDistance;
          uDofBlurStart.value = postParams.dof.blurStart;
          uDofBlurEnd.value = postParams.dof.blurEnd;
          uDofBlurSize.value = postParams.dof.blurSize;
          uDofBlurSpread.value = postParams.dof.blurSpread;

          uBloomEnabled.value =
            postParams.enabled && postParams.bloom.enabled ? 1 : 0;
          bloomScenePass.strength.value = postParams.bloom.strength;
          bloomScenePass.radius.value = postParams.bloom.radius;
          bloomScenePass.threshold.value = postParams.bloom.threshold;

          uLensflareEnabled.value =
            postParams.enabled && postParams.lensflare.enabled ? 1 : 0;
          skyBloomPass.threshold.value = postParams.lensflare.bloomThreshold;
          flareThreshold.value = postParams.lensflare.threshold;
          flareGhostAttenuation.value = postParams.lensflare.ghostAttenuation;
          flareGhostSpacing.value = postParams.lensflare.ghostSpacing;

          uGodRaysEnabled.value =
            postParams.enabled && postParams.godRays.enabled ? 1 : 0;
          uGodRaysStrength.value = postParams.godRays.strength;
          uGodRaysDecay.value = postParams.godRays.decay;
          uGodRaysDensity.value = postParams.godRays.density;
          uGodRaysSamples.value = postParams.godRays.samples;

          // Sun screen position for god rays (project sun direction to NDC)
          const sunWorld = camera.position
            .clone()
            .add(sunDir.clone().multiplyScalar(500000));
          const v4 = new THREE.Vector4(sunWorld.x, sunWorld.y, sunWorld.z, 1);
          v4.applyMatrix4(camera.matrixWorldInverse);
          v4.applyMatrix4(camera.projectionMatrix);
          const ndcX = v4.x / v4.w;
          const ndcY = v4.y / v4.w;
          uSunScreenPos.value.set(ndcX * 0.5 + 0.5, ndcY * 0.5 + 0.5);

          physicsDebugGroup.visible = !!parkourParams.debug.rapierDebug;
          if (parkourParams.debug.rapierDebug) buildRapierDebugMeshes();

          // Apply CSM param changes (only when changed — updateFrustums is expensive)
          const csmChanged =
            parkourParams.csm.cascades !== lastCsmCascades ||
            parkourParams.csm.maxFar !== lastCsmMaxFar ||
            parkourParams.csm.lightMargin !== lastCsmLightMargin ||
            parkourParams.csm.mapSize !== lastCsmMapSize;
          if (csmChanged) {
            lastCsmCascades = parkourParams.csm.cascades;
            lastCsmMaxFar = parkourParams.csm.maxFar;
            lastCsmLightMargin = parkourParams.csm.lightMargin;
            lastCsmMapSize = parkourParams.csm.mapSize;
            csm.cascades = parkourParams.csm.cascades;
            csm.maxFar = parkourParams.csm.maxFar;
            csm.lightMargin = parkourParams.csm.lightMargin;
            dirLight.shadow.mapSize.width = parkourParams.csm.mapSize;
            dirLight.shadow.mapSize.height = parkourParams.csm.mapSize;
            if (csm.frustums) csm.updateFrustums();
          }

          // Update frustums every frame when enabled — CSM is camera-relative
          if (parkourParams.csm.updateEveryFrame && csm.frustums) {
            csm.updateFrustums();
          }

          renderPipeline.render();
          stats.update();
        });

        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          camera.updateMatrixWorld();
          renderer.setSize(innerWidth, innerHeight);
          if (csm.frustums) csm.updateFrustums(); // Only on resize
        });
        } // end if (!SIMPLE_SNOW_SPHERE_DEBUG) — full parkour / post stack
      }

      init().catch((e) => {
        console.error("Init failed:", e);
        document.getElementById("backend").textContent = "Error: " + e.message;
      });
    </script>
  </body>
</html>
