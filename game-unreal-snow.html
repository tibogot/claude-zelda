      function sunDirectionFromAngles(azimuthDeg, elevationDeg) {
        const az = (azimuthDeg * Math.PI) / 180;
        const el = (elevationDeg * Math.PI) / 180;
        const cosEl = Math.cos(el);
        return new THREE.Vector3(
          cosEl * Math.cos(az),
          Math.sin(el),
          cosEl * Math.sin(az),
        ).normalize();
      }

      /* ── Sword Trail VFX (ribbon trail, zero shader compilation) ─ */
      function makeTrailTexture(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(0.15, "rgba(255,255,255,0.6)");
        g.addColorStop(0.5, "rgba(255,255,255,1)");
        g.addColorStop(0.85, "rgba(255,255,255,0.6)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const swordTrail = {
        mesh: null,
        geo: null,
        mat: null,
        edgeMat: null,
        edgeMesh: null,
        light: null,
        history: [],
        maxSamples: 12,
        wasAttacking: false,
        fadeTimer: 0,
        currentOpacity: 0,
        initialized: false,
        _tipLocal: new THREE.Vector3(),
        _baseLocal: new THREE.Vector3(),
        _tipWorld: new THREE.Vector3(),
        _baseWorld: new THREE.Vector3(),
      };

      function initSwordTrail(scene) {
        if (swordTrail.initialized) return;
        swordTrail.initialized = true;
        const p = parkourParams.swordTrail;
        swordTrail.maxSamples = p.trailLength + 2;

        const maxVerts = swordTrail.maxSamples * 2;
        const maxTris = (swordTrail.maxSamples - 1) * 2;
        const positions = new Float32Array(maxVerts * 3);
        const uvs = new Float32Array(maxVerts * 2);
        const colors = new Float32Array(maxVerts * 4);
        const indices = new Uint16Array(maxTris * 3);

        swordTrail.geo = new THREE.BufferGeometry();
        swordTrail.geo.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        swordTrail.geo.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
        swordTrail.geo.setAttribute(
          "color",
          new THREE.BufferAttribute(colors, 4),
        );
        swordTrail.geo.setIndex(new THREE.BufferAttribute(indices, 1));
        swordTrail.geo.setDrawRange(0, 0);

        const trailTex = makeTrailTexture(4, 64);

        swordTrail.mat = new THREE.MeshBasicMaterial({
          vertexColors: true,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          map: trailTex,
          color: new THREE.Color(p.trailColor),
        });

        swordTrail.mesh = new THREE.Mesh(swordTrail.geo, swordTrail.mat);
        swordTrail.mesh.frustumCulled = false;
        swordTrail.mesh.renderOrder = 998;
        swordTrail.mesh.visible = false;
        scene.add(swordTrail.mesh);

        swordTrail.edgeMat = new THREE.MeshBasicMaterial({
          vertexColors: true,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          color: new THREE.Color(p.edgeColor),
        });

        const edgeGeo = new THREE.BufferGeometry();
        edgeGeo.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(maxVerts * 3), 3),
        );
        edgeGeo.setAttribute(
          "color",
          new THREE.BufferAttribute(new Float32Array(maxVerts * 4), 4),
        );
        edgeGeo.setIndex(
          new THREE.BufferAttribute(new Uint16Array(maxTris * 3), 1),
        );
        edgeGeo.setDrawRange(0, 0);
        swordTrail.edgeMesh = new THREE.Mesh(edgeGeo, swordTrail.edgeMat);
        swordTrail.edgeMesh.frustumCulled = false;
        swordTrail.edgeMesh.renderOrder = 999;
        swordTrail.edgeMesh.visible = false;
        scene.add(swordTrail.edgeMesh);

        swordTrail.light = new THREE.PointLight(0x33ccff, 0, p.lightRange);
        scene.add(swordTrail.light);
      }

      function updateSwordTrail(dt, swordGroup, isAttacking) {
        if (!swordTrail.initialized) return;
        const p = parkourParams.swordTrail;
        if (!p.enabled) {
          swordTrail.geo.setDrawRange(0, 0);
          swordTrail.edgeMesh.geometry.setDrawRange(0, 0);
          swordTrail.mesh.visible = false;
          swordTrail.edgeMesh.visible = false;
          swordTrail.light.intensity = 0;
          swordTrail.history.length = 0;
          return;
        }

        swordTrail.mat.color.set(p.trailColor);
        swordTrail.edgeMat.color.set(p.edgeColor);
        swordTrail.maxSamples = p.trailLength + 2;

        if (isAttacking) {
          swordTrail.currentOpacity = Math.min(
            swordTrail.currentOpacity + dt * 16,
            1,
          );
          swordTrail._tipLocal.set(0, 0, p.tipOffset);
          swordTrail._baseLocal.set(0, 0, p.baseOffset);
          swordGroup.localToWorld(
            swordTrail._tipWorld.copy(swordTrail._tipLocal),
          );
          swordGroup.localToWorld(
            swordTrail._baseWorld.copy(swordTrail._baseLocal),
          );
          swordTrail.history.unshift({
            tip: swordTrail._tipWorld.clone(),
            base: swordTrail._baseWorld.clone(),
          });
          if (swordTrail.history.length > swordTrail.maxSamples) {
            swordTrail.history.length = swordTrail.maxSamples;
          }
          swordTrail.wasAttacking = true;
          swordTrail.fadeTimer = 0;
        } else {
          if (swordTrail.wasAttacking) {
            swordTrail.fadeTimer += dt;
            swordTrail.currentOpacity = Math.max(
              1 - swordTrail.fadeTimer / Math.max(p.fadeOutTime, 0.01),
              0,
            );
            if (swordTrail.currentOpacity <= 0) {
              swordTrail.wasAttacking = false;
              swordTrail.history.length = 0;
            }
          }
        }

        const n = swordTrail.history.length;
        if (n < 2) {
          swordTrail.geo.setDrawRange(0, 0);
          swordTrail.edgeMesh.geometry.setDrawRange(0, 0);
          swordTrail.mesh.visible = false;
          swordTrail.edgeMesh.visible = false;
          swordTrail.light.intensity = 0;
          return;
        }

        const posAttr = swordTrail.geo.attributes.position;
        const uvAttr = swordTrail.geo.attributes.uv;
        const colAttr = swordTrail.geo.attributes.color;
        const idxAttr = swordTrail.geo.index;
        const eposAttr = swordTrail.edgeMesh.geometry.attributes.position;
        const ecolAttr = swordTrail.edgeMesh.geometry.attributes.color;
        const eidxAttr = swordTrail.edgeMesh.geometry.index;
        const trailCol = new THREE.Color(p.trailColor);

        for (let i = 0; i < n; i++) {
          const { tip, base } = swordTrail.history[i];
          const frac = i / (n - 1);
          const alpha = (1 - frac) * p.opacity * swordTrail.currentOpacity;
          const edgeAlpha = (1 - frac * frac) * swordTrail.currentOpacity;
          const ws = p.widthScale;

          const vi = i * 2;
          posAttr.array[vi * 3] = base.x;
          posAttr.array[vi * 3 + 1] = base.y;
          posAttr.array[vi * 3 + 2] = base.z;
          posAttr.array[(vi + 1) * 3] = tip.x;
          posAttr.array[(vi + 1) * 3 + 1] = tip.y;
          posAttr.array[(vi + 1) * 3 + 2] = tip.z;

          uvAttr.array[vi * 2] = frac;
          uvAttr.array[vi * 2 + 1] = 0;
          uvAttr.array[(vi + 1) * 2] = frac;
          uvAttr.array[(vi + 1) * 2 + 1] = 1;

          colAttr.array[vi * 4] = trailCol.r;
          colAttr.array[vi * 4 + 1] = trailCol.g;
          colAttr.array[vi * 4 + 2] = trailCol.b;
          colAttr.array[vi * 4 + 3] = alpha;
          colAttr.array[(vi + 1) * 4] = 1;
          colAttr.array[(vi + 1) * 4 + 1] = 1;
          colAttr.array[(vi + 1) * 4 + 2] = 1;
          colAttr.array[(vi + 1) * 4 + 3] = alpha * 1.2;

          eposAttr.array[vi * 3] = tip.x;
          eposAttr.array[vi * 3 + 1] = tip.y;
          eposAttr.array[vi * 3 + 2] = tip.z;
          eposAttr.array[(vi + 1) * 3] = tip.x;
          eposAttr.array[(vi + 1) * 3 + 1] = tip.y;
          eposAttr.array[(vi + 1) * 3 + 2] = tip.z;

          ecolAttr.array[vi * 4] = 1;
          ecolAttr.array[vi * 4 + 1] = 1;
          ecolAttr.array[vi * 4 + 2] = 1;
          ecolAttr.array[vi * 4 + 3] = edgeAlpha * 0.8;
          ecolAttr.array[(vi + 1) * 4] = trailCol.r;
          ecolAttr.array[(vi + 1) * 4 + 1] = trailCol.g;
          ecolAttr.array[(vi + 1) * 4 + 2] = trailCol.b;
          ecolAttr.array[(vi + 1) * 4 + 3] = edgeAlpha * 0.3;
        }

        let triIdx = 0;
        for (let i = 0; i < n - 1; i++) {
          const a = i * 2,
            b = a + 1,
            c = (i + 1) * 2,
            d = c + 1;
          idxAttr.array[triIdx++] = a;
          idxAttr.array[triIdx++] = b;
          idxAttr.array[triIdx++] = c;
          idxAttr.array[triIdx++] = b;
          idxAttr.array[triIdx++] = d;
          idxAttr.array[triIdx++] = c;
          eidxAttr.array[i * 6] = a;
          eidxAttr.array[i * 6 + 1] = b;
          eidxAttr.array[i * 6 + 2] = c;
          eidxAttr.array[i * 6 + 3] = b;
          eidxAttr.array[i * 6 + 4] = d;
          eidxAttr.array[i * 6 + 5] = c;
        }

        posAttr.needsUpdate = true;
        uvAttr.needsUpdate = true;
        colAttr.needsUpdate = true;
        idxAttr.needsUpdate = true;
        eposAttr.needsUpdate = true;
        ecolAttr.needsUpdate = true;
        eidxAttr.needsUpdate = true;

        swordTrail.geo.setDrawRange(0, (n - 1) * 6);
        swordTrail.edgeMesh.geometry.setDrawRange(0, (n - 1) * 6);
        swordTrail.mesh.visible = true;
        swordTrail.edgeMesh.visible = true;

        const midTip = swordTrail.history[0].tip;
        swordTrail.light.position.copy(midTip);
        swordTrail.light.intensity =
          p.lightIntensity * swordTrail.currentOpacity;
        swordTrail.light.distance = p.lightRange;
        swordTrail.light.color.set(p.trailColor);
      }

      /* ── Blood FX: burst sprites (canvas) + floor pools (atlas or fallback) ─ */
      function makeBloodTexture(size) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(
          size / 2,
          size / 2,
          0,
          size / 2,
          size / 2,
          size / 2,
        );
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.3, "rgba(255,200,200,0.8)");
        g.addColorStop(0.6, "rgba(200,50,50,0.4)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      function applyBloodPoolTextureFilters(tex, linear) {
        const f = linear ? THREE.LinearFilter : THREE.NearestFilter;
        tex.magFilter = f;
        tex.minFilter = f;
        tex.needsUpdate = true;
      }

      function createBloodPoolAtlasMaterial(colorMap, alphaMap) {
        const p0 = parkourParams.bloodFX;
        const uCellScale = uniform(
          new THREE.Vector2(1 / p0.poolAtlasCols, 1 / p0.poolAtlasRows),
        );
        const uCellOffset = uniform(new THREE.Vector2(0, 0));
        const uTint = uniform(new THREE.Color(p0.poolColor));
        const uBrightness = uniform(1);
        const uCut = uniform(p0.poolAlphaCutoff);
        const uInvertMask = uniform(p0.poolInvertAlphaMask ? 1 : 0);
        const atlasUv = uv().mul(uCellScale).add(uCellOffset);
        const samp = texture(colorMap, atlasUv);
        const maskSamp = texture(alphaMap, atlasUv);
        const maskR = maskSamp.r;
        const invR = float(1).sub(maskR);
        const a = mix(maskR, invR, uInvertMask);
        const rgb = samp.rgb.mul(uTint).mul(uBrightness);
        const mat = new THREE.MeshBasicNodeMaterial({
          transparent: true,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide,
        });
        mat.colorNode = vec4(rgb, a);
        mat.alphaTestNode = uCut;
        return {
          mat,
          uCellScale,
          uCellOffset,
          uTint,
          uBrightness,
          uCut,
          uInvertMask,
        };
      }

      const MAX_BLOOD_PARTICLES = 60;
      const MAX_BLOOD_POOLS = 12;

      const bloodFx = {
        particles: [],
        pools: [],
        mat: null,
        poolMat: null,
        poolMeshMat: null,
        poolPlaneGeo: null,
        poolAtlasOk: false,
        poolColorTex: null,
        poolAlphaTex: null,
        initialized: false,
      };

      async function initBloodFX(scene) {
        if (bloodFx.initialized) return;
        bloodFx.initialized = true;
        const tex = makeBloodTexture(32);

        bloodFx.mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          blending: THREE.NormalBlending,
          color: 0x8b0000,
        });
        bloodFx.poolMat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          blending: THREE.NormalBlending,
          color: 0x550000,
        });
        bloodFx.poolMeshMat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          blending: THREE.NormalBlending,
          color: 0x550000,
        });
        bloodFx.poolPlaneGeo = new THREE.PlaneGeometry(1, 1);

        for (let i = 0; i < MAX_BLOOD_PARTICLES; i++) {
          const s = new THREE.Sprite(bloodFx.mat);
          s.renderOrder = 990;
          s.scale.set(0.001, 0.001, 1);
          scene.add(s);
          bloodFx.particles.push({
            sprite: s,
            alive: false,
            timer: 0,
            lifetime: 0,
            vx: 0,
            vy: 0,
            vz: 0,
            size: 0,
          });
        }

        const p = parkourParams.bloodFX;
        const loader = new THREE.TextureLoader();
        const base = p.poolAtlasBasePath.endsWith("/")
          ? p.poolAtlasBasePath
          : `${p.poolAtlasBasePath}/`;
        const colorUrl = base + p.poolColorAtlasFile;
        const alphaUrl = base + p.poolAlphaAtlasFile;

        let colorTex = null;
        let alphaTex = null;
        try {
          colorTex = await loader.loadAsync(colorUrl);
          alphaTex = await loader.loadAsync(alphaUrl);
        } catch (err) {
          console.warn(
            "[bloodFX] Pool atlas load failed (using soft blob fallback). Expected:",
            colorUrl,
            alphaUrl,
            err,
          );
        }

        if (colorTex && alphaTex) {
          bloodFx.poolAtlasOk = true;
          bloodFx.poolColorTex = colorTex;
          bloodFx.poolAlphaTex = alphaTex;
          colorTex.colorSpace = THREE.SRGBColorSpace;
          colorTex.wrapS = colorTex.wrapT = THREE.ClampToEdgeWrapping;
          alphaTex.colorSpace = THREE.NoColorSpace;
          alphaTex.wrapS = alphaTex.wrapT = THREE.ClampToEdgeWrapping;
          applyBloodPoolTextureFilters(colorTex, p.poolAtlasLinear);
          applyBloodPoolTextureFilters(alphaTex, p.poolAtlasLinear);

          for (let i = 0; i < MAX_BLOOD_POOLS; i++) {
            const u = createBloodPoolAtlasMaterial(colorTex, alphaTex);
            const s = new THREE.Mesh(bloodFx.poolPlaneGeo, u.mat);
            s.rotation.x = -Math.PI / 2;
            s.renderOrder = 989;
            s.scale.set(0.001, 0.001, 0.001);
            scene.add(s);
            bloodFx.pools.push({
              sprite: s,
              alive: false,
              animTimer: 0,
              lifetime: 0,
              size: 0,
              uni: u,
            });
          }
        } else {
          for (let i = 0; i < MAX_BLOOD_POOLS; i++) {
            const s = new THREE.Mesh(bloodFx.poolPlaneGeo, bloodFx.poolMeshMat);
            s.rotation.x = -Math.PI / 2;
            s.renderOrder = 989;
            s.scale.set(0.001, 0.001, 0.001);
            scene.add(s);
            bloodFx.pools.push({
              sprite: s,
              alive: false,
              animTimer: 0,
              lifetime: 0,
              size: 0,
              uni: null,
            });
          }
        }
      }

      function spawnBloodBurst(position, floorY) {
        const p = parkourParams.bloodFX;
        if (!p.enabled) return;
        const col1 = new THREE.Color(p.bloodColor);
        const col2 = new THREE.Color(p.bloodColor2);

        for (let i = 0; i < p.burstCount; i++) {
          const part = bloodFx.particles.find((x) => !x.alive);
          if (!part) break;
          part.alive = true;
          part.timer = 0;
          part.lifetime = p.lifetime * (0.6 + Math.random() * 0.8);
          part.size = p.spriteSize * (0.5 + Math.random());
          const angle = Math.random() * Math.PI * 2;
          const upward = 0.5 + Math.random() * 1.0;
          const spread = p.burstSpread * (0.3 + Math.random() * 0.7);
          part.vx = Math.cos(angle) * spread * p.burstSpeed;
          part.vy = upward * p.burstSpeed;
          part.vz = Math.sin(angle) * spread * p.burstSpeed;
          part.sprite.position.copy(position);
          part.floorY = floorY;
          const t = Math.random();
          part.sprite.material = bloodFx.mat;
        }

        const pool = bloodFx.pools.find((x) => !x.alive);
        if (pool) {
          pool.alive = true;
          pool.animTimer = 0;
          pool.lifetime = p.poolLifetime;
          pool.size = p.poolSize * (0.7 + Math.random() * 0.6);
          pool.sprite.position.set(
            position.x + (Math.random() - 0.5) * 0.5,
            floorY + p.poolYOffset,
            position.z + (Math.random() - 0.5) * 0.5,
          );
          pool.sprite.scale.set(0.001, 0.001, 0.001);
          if (bloodFx.poolAtlasOk && pool.uni) {
            setBloodPoolAtlasFrame(pool, 0);
            pool.uni.uTint.value.set(p.poolColor);
            pool.uni.uBrightness.value = 1;
            pool.uni.uCut.value = p.poolAlphaCutoff;
            pool.uni.uInvertMask.value = p.poolInvertAlphaMask ? 1 : 0;
          }
        }
      }

      const _bloodHideScale = new THREE.Vector3(0.001, 0.001, 1);
      const _bloodPoolHideScale = new THREE.Vector3(0.001, 0.001, 0.001);

      function setBloodPoolAtlasFrame(pool, frameIndex) {
        if (!bloodFx.poolAtlasOk || !pool.uni) return;
        const p = parkourParams.bloodFX;
        const cols = Math.max(1, p.poolAtlasCols);
        const rows = Math.max(1, p.poolAtlasRows);
        const n = cols * rows;
        const fi = Math.max(0, Math.min(n - 1, Math.floor(frameIndex)));
        const cw = 1 / cols;
        const ch = 1 / rows;
        pool.uni.uCellScale.value.set(cw, ch);
        const col = fi % cols;
        const row = Math.floor(fi / cols);
        const u = col * cw;
        const v = p.poolFlipRowUV ? row * ch : 1 - (row + 1) * ch;
        pool.uni.uCellOffset.value.set(u, v);
      }

      function updateBloodFX(dt) {
        if (!bloodFx.initialized) return;
        const p = parkourParams.bloodFX;
        bloodFx.mat.color.set(p.bloodColor);
        bloodFx.poolMat.color.set(p.poolColor);
        if (bloodFx.poolMeshMat) bloodFx.poolMeshMat.color.set(p.poolColor);

        for (const part of bloodFx.particles) {
          if (!part.alive) continue;
          part.timer += dt;
          if (part.timer >= part.lifetime) {
            part.alive = false;
            part.sprite.scale.copy(_bloodHideScale);
            continue;
          }
          part.vy -= p.gravity * dt;
          part.sprite.position.x += part.vx * dt;
          part.sprite.position.y += part.vy * dt;
          part.sprite.position.z += part.vz * dt;
          if (part.sprite.position.y < part.floorY + 0.05) {
            part.sprite.position.y = part.floorY + 0.05;
            part.vy = 0;
            part.vx *= 0.5;
            part.vz *= 0.5;
          }
          const t = part.timer / part.lifetime;
          const fade = t < 0.1 ? t / 0.1 : 1 - (t - 0.1) / 0.9;
          const sz = part.size * fade;
          part.sprite.scale.set(sz, sz, 1);
        }

        for (const pool of bloodFx.pools) {
          if (!pool.alive) continue;
          pool.animTimer += dt;

          if (!p.poolPersist && pool.animTimer >= pool.lifetime) {
            pool.alive = false;
            pool.sprite.scale.copy(_bloodPoolHideScale);
            continue;
          }

          const growT = Math.min(pool.animTimer / 0.28, 1);
          let sz = pool.size * growT;
          sz = Math.max(sz, p.poolMinWorldScale, 0.05);
          pool.sprite.scale.set(sz, sz, 1);

          let fadeT = 1;
          if (!p.poolPersist && pool.lifetime > 0) {
            const t = pool.animTimer / pool.lifetime;
            fadeT = t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1;
          }

          if (bloodFx.poolAtlasOk && pool.uni) {
            const cols = Math.max(1, p.poolAtlasCols);
            const rows = Math.max(1, p.poolAtlasRows);
            const n = cols * rows;
            let fi;
            if (p.poolFlipbookByFps) {
              fi = Math.min(n - 1, Math.floor(pool.animTimer * p.poolAnimFps));
            } else {
              const dur = Math.max(0.04, p.poolAnimDuration);
              const ap = Math.min(1, pool.animTimer / dur);
              fi = Math.min(n - 1, Math.round((n - 1) * ap));
            }
            setBloodPoolAtlasFrame(pool, fi);
            pool.uni.uTint.value.set(p.poolColor);
            pool.uni.uBrightness.value = p.poolPersist ? 1 : fadeT;
            pool.uni.uCut.value = p.poolAlphaCutoff;
            pool.uni.uInvertMask.value = p.poolInvertAlphaMask ? 1 : 0;
          }
        }
      }

      function flashDeerRed(deer) {
        const p = parkourParams.bloodFX;
        if (!p.enabled || !deer.root) return;
        deer._flashTimer = p.flashDuration;
        deer._origColors = deer._origColors || new Map();
        deer.root.traverse((child) => {
          if (!child.isMesh || !child.material) return;
          if (!deer._origColors.has(child)) {
            deer._origColors.set(
              child,
              child.material.color
                ? child.material.color.clone()
                : new THREE.Color(1, 1, 1),
            );
          }
          if (child.material.color) child.material.color.set(p.flashColor);
        });
      }

      function updateDeerFlash(deer, dt) {
        if (!deer._flashTimer || deer._flashTimer <= 0) return;
        deer._flashTimer -= dt;
        if (deer._flashTimer <= 0) {
          deer._flashTimer = 0;
          if (deer._origColors) {
            deer._origColors.forEach((origCol, child) => {
              if (child.material && child.material.color)
                child.material.color.copy(origCol);
            });
          }
        }
      }

      /* ── Spell VFX System ────────────────────────────────────── */
      /* ── Spell VFX: 2 shared Sprites, zero shader compilation ──── */
      function makeGlowTexture(size) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(
          size / 2,
          size / 2,
          0,
          size / 2,
          size / 2,
          size / 2,
        );
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.15, "rgba(200,240,255,0.9)");
        g.addColorStop(0.4, "rgba(80,200,255,0.4)");
        g.addColorStop(0.7, "rgba(40,140,255,0.1)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const MAX_PROJECTILES = 4;
      const MAX_TRAIL = 8;
      const MAX_IMPACTS = 3;
      let _spellTime = 0;

      const spellVfx = {
        orbSprite: null,
        orbInner: null,
        orbLight: null,
        sparks: [],
        projPool: [],
        impactPool: [],
        glowMat: null,
        brightMat: null,
        scene: null,
        initialized: false,
        orbOpacity: 0,
      };

      function initSpellVFX(scene, camera) {
        if (spellVfx.initialized) return;
        spellVfx.scene = scene;
        spellVfx.initialized = true;
        const p = parkourParams.spellVFX;
        const glowTex = makeGlowTexture(64);

        spellVfx.glowMat = new THREE.SpriteMaterial({
          map: glowTex,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          color: 0x33ccff,
        });
        spellVfx.brightMat = new THREE.SpriteMaterial({
          map: glowTex,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          color: 0xffffff,
        });

        spellVfx.orbSprite = new THREE.Sprite(spellVfx.glowMat);
        spellVfx.orbSprite.renderOrder = 1000;
        spellVfx.orbSprite.scale.set(0.001, 0.001, 1);
        scene.add(spellVfx.orbSprite);

        spellVfx.orbInner = new THREE.Sprite(spellVfx.brightMat);
        spellVfx.orbInner.renderOrder = 1001;
        spellVfx.orbInner.scale.set(0.001, 0.001, 1);
        scene.add(spellVfx.orbInner);

        spellVfx.orbLight = new THREE.PointLight(0x33ccff, 0, p.orbLightRange);
        scene.add(spellVfx.orbLight);

        for (let i = 0; i < p.sparkCount; i++) {
          const spark = new THREE.Sprite(spellVfx.brightMat);
          spark.renderOrder = 1002;
          spark.scale.set(0.001, 0.001, 1);
          spark.userData.phase = Math.random() * Math.PI * 2;
          spark.userData.yOffset = (Math.random() - 0.5) * 0.3;
          spark.userData.radiusScale = 0.7 + Math.random() * 0.6;
          scene.add(spark);
          spellVfx.sparks.push(spark);
        }

        for (let i = 0; i < MAX_PROJECTILES; i++) {
          const outer = new THREE.Sprite(spellVfx.glowMat);
          outer.renderOrder = 1000;
          outer.scale.set(0.001, 0.001, 1);
          scene.add(outer);
          const inner = new THREE.Sprite(spellVfx.brightMat);
          inner.renderOrder = 1001;
          inner.scale.set(0.001, 0.001, 1);
          scene.add(inner);
          const light = new THREE.PointLight(
            0x33ccff,
            0,
            p.orbLightRange * 0.6,
          );
          scene.add(light);

          const trail = [];
          for (let j = 0; j < MAX_TRAIL; j++) {
            const t = new THREE.Sprite(spellVfx.glowMat);
            t.renderOrder = 999;
            t.scale.set(0.001, 0.001, 1);
            scene.add(t);
            trail.push(t);
          }

          spellVfx.projPool.push({
            outer,
            inner,
            light,
            trail,
            pos: new THREE.Vector3(),
            dir: new THREE.Vector3(),
            speed: 0,
            distance: 0,
            maxDist: 0,
            alive: false,
            trailPositions: [],
            _trailTimer: 0,
          });
        }

        for (let i = 0; i < MAX_IMPACTS; i++) {
          const outer = new THREE.Sprite(spellVfx.glowMat);
          outer.renderOrder = 1002;
          outer.scale.set(0.001, 0.001, 1);
          scene.add(outer);
          const inner = new THREE.Sprite(spellVfx.brightMat);
          inner.renderOrder = 1003;
          inner.scale.set(0.001, 0.001, 1);
          scene.add(inner);
          const light = new THREE.PointLight(
            0x33ccff,
            0,
            p.orbLightRange * 1.5,
          );
          scene.add(light);
          spellVfx.impactPool.push({
            outer,
            inner,
            light,
            timer: 0,
            duration: 0,
            alive: false,
          });
        }
      }

      const _hideScale = new THREE.Vector3(0.001, 0.001, 1);
      const _handWorldPos = new THREE.Vector3();

      function spawnProjectile(origin, direction) {
        const p = parkourParams.spellVFX;
        const proj = spellVfx.projPool.find((x) => !x.alive);
        if (!proj) return;
        proj.alive = true;
        proj.distance = 0;
        proj.speed = p.projectileSpeed;
        proj.maxDist = p.projectileMaxDist;
        proj.dir.copy(direction).normalize();
        proj.pos.copy(origin);
        const sz = p.projectileSize * 2;
        proj.outer.position.copy(origin);
        proj.outer.scale.set(sz * 2.5, sz * 2.5, 1);
        proj.inner.position.copy(origin);
        proj.inner.scale.set(sz, sz, 1);
        proj.light.position.copy(origin);
        proj.light.intensity = p.orbLightIntensity * 0.8;
        proj.trailPositions.length = 0;
        proj.trailPositions.push(origin.clone());
        proj._trailTimer = 0;
        for (const t of proj.trail) t.scale.copy(_hideScale);
      }

      function spawnImpact(position) {
        const p = parkourParams.spellVFX;
        const imp = spellVfx.impactPool.find((x) => !x.alive);
        if (!imp) return;
        imp.alive = true;
        imp.timer = 0;
        imp.duration = p.impactDuration;
        imp.outer.position.copy(position);
        imp.inner.position.copy(position);
        imp.light.position.copy(position);
        imp.light.intensity = p.orbLightIntensity * 3;
      }

      function updateSpellVFX(dt, camera, udPlayer) {
        if (!spellVfx.initialized) return;
        const p = parkourParams.spellVFX;
        if (!p.enabled) {
          spellVfx.orbSprite.scale.copy(_hideScale);
          spellVfx.orbInner.scale.copy(_hideScale);
          spellVfx.orbLight.intensity = 0;
          for (const s of spellVfx.sparks) s.scale.copy(_hideScale);
          return;
        }

        _spellTime += dt;
        spellVfx.glowMat.color.set(p.orbColor);
        spellVfx.brightMat.color.set(p.orbCoreColor);

        const isCasting = udPlayer.isCastingSpell;
        const phase = udPlayer.spellPhase || "none";
        const handBone = udPlayer.leftHandBone;
        const showOrb =
          isCasting &&
          handBone &&
          (phase === "enter" || phase === "idle" || phase === "shoot");

        if (showOrb) {
          const targetOp = phase === "enter" ? 0.6 : 1;
          spellVfx.orbOpacity +=
            (targetOp - spellVfx.orbOpacity) * Math.min(dt * 8, 1);
        } else {
          spellVfx.orbOpacity *= Math.max(1 - dt * 12, 0);
          if (spellVfx.orbOpacity < 0.01) spellVfx.orbOpacity = 0;
        }

        if (spellVfx.orbOpacity > 0 && handBone) {
          handBone.getWorldPosition(_handWorldPos);
          _handWorldPos.x += p.orbOffsetX;
          _handWorldPos.y += p.orbOffsetY;
          _handWorldPos.z += p.orbOffsetZ;

          const pulse =
            1 + Math.sin(_spellTime * p.orbPulseSpeed) * p.orbPulseAmount;
          const os = p.orbSize * 2 * pulse * spellVfx.orbOpacity;

          spellVfx.orbSprite.position.copy(_handWorldPos);
          spellVfx.orbSprite.scale.set(os * 2.5, os * 2.5, 1);
          spellVfx.orbInner.position.copy(_handWorldPos);
          spellVfx.orbInner.scale.set(os, os, 1);
          spellVfx.orbLight.position.copy(_handWorldPos);
          spellVfx.orbLight.intensity =
            p.orbLightIntensity * pulse * spellVfx.orbOpacity;
          spellVfx.orbLight.distance = p.orbLightRange;

          for (const spark of spellVfx.sparks) {
            const angle = _spellTime * p.sparkOrbitSpeed + spark.userData.phase;
            const r = p.sparkOrbitRadius * spark.userData.radiusScale * pulse;
            spark.position.set(
              _handWorldPos.x + Math.cos(angle) * r,
              _handWorldPos.y + spark.userData.yOffset * pulse,
              _handWorldPos.z + Math.sin(angle) * r,
            );
            const ss = p.sparkSize * 2 * spellVfx.orbOpacity;
            spark.scale.set(ss, ss, 1);
          }
        } else {
          spellVfx.orbSprite.scale.copy(_hideScale);
          spellVfx.orbInner.scale.copy(_hideScale);
          spellVfx.orbLight.intensity = 0;
          for (const s of spellVfx.sparks) s.scale.copy(_hideScale);
        }

        for (const proj of spellVfx.projPool) {
          if (!proj.alive) continue;
          const moveStep = proj.speed * dt;
          proj.pos.addScaledVector(proj.dir, moveStep);
          proj.distance += moveStep;

          proj.outer.position.copy(proj.pos);
          proj.inner.position.copy(proj.pos);
          proj.light.position.copy(proj.pos);

          proj._trailTimer += dt;
          if (proj._trailTimer >= p.trailSpacing) {
            proj._trailTimer = 0;
            proj.trailPositions.push(proj.pos.clone());
            if (proj.trailPositions.length > MAX_TRAIL + 1)
              proj.trailPositions.shift();
          }

          const sz = p.projectileSize * 2;
          for (let i = 0; i < proj.trail.length; i++) {
            const tIdx = proj.trailPositions.length - 2 - i;
            if (tIdx >= 0) {
              const tm = proj.trail[i];
              tm.position.copy(proj.trailPositions[tIdx]);
              const frac = (i + 1) / MAX_TRAIL;
              const ts = sz * (2.5 - frac * 2);
              tm.scale.set(ts, ts, 1);
            } else {
              proj.trail[i].scale.copy(_hideScale);
            }
          }

          if (proj.distance >= proj.maxDist) {
            releaseProjectile(proj);
            spawnImpact(proj.pos.clone());
          }
        }

        for (const imp of spellVfx.impactPool) {
          if (!imp.alive) continue;
          imp.timer += dt;
          const t = imp.timer / imp.duration;
          if (t >= 1) {
            imp.alive = false;
            imp.outer.scale.copy(_hideScale);
            imp.inner.scale.copy(_hideScale);
            imp.light.intensity = 0;
            continue;
          }
          const ease = 1 - t;
          const scale = p.impactSize * (1 + t * 3) * ease;
          imp.outer.scale.set(scale, scale, 1);
          const innerScale = p.impactSize * (0.5 + t) * ease;
          imp.inner.scale.set(innerScale, innerScale, 1);
          imp.light.intensity = p.orbLightIntensity * 3 * ease;
        }
      }

      function releaseProjectile(proj) {
        proj.alive = false;
        proj.outer.scale.copy(_hideScale);
        proj.inner.scale.copy(_hideScale);
        proj.light.intensity = 0;
        for (const t of proj.trail) t.scale.copy(_hideScale);
      }

      // Flat terrain: sampleHeight returns floor height for player ground checks
      const sampleHeight = () => FLOOR_Y;

      const DEER_MAX_COUNT = 30;
      const DEER_DEFAULT_SPAWNS = [
        new THREE.Vector3(6, FLOOR_Y, -4),
        new THREE.Vector3(-4, FLOOR_Y, -8),
        new THREE.Vector3(10, FLOOR_Y, 6),
        new THREE.Vector3(-10, FLOOR_Y, 10),
        new THREE.Vector3(14, FLOOR_Y, -12),
        new THREE.Vector3(-16, FLOOR_Y, -6),
        new THREE.Vector3(4, FLOOR_Y, 14),
        new THREE.Vector3(-12, FLOOR_Y, 4),
        new THREE.Vector3(18, FLOOR_Y, 2),
        new THREE.Vector3(-18, FLOOR_Y, -2),
      ];

      function clampDeerCount(n) {
        return Math.max(
          1,
          Math.min(DEER_MAX_COUNT, Math.round(Number(n) || 0)),
        );
      }

      function randomDeerSpawnXZ() {
        const half = PARKOUR_SIZE * 0.42;
        const x = (Math.random() * 2 - 1) * half;
        const z = (Math.random() * 2 - 1) * half;
        return new THREE.Vector3(x, FLOOR_Y, z);
      }

      function disposeDeerTarget(scene, d) {
        if (!d?.root) return;
        d.mixer?.stopAllAction();
        scene.remove(d.root);
        d.root.traverse((o) => {
          if (o.isMesh) {
            o.geometry?.dispose();
            const m = o.material;
            if (Array.isArray(m)) m.forEach((mat) => mat?.dispose?.());
            else m?.dispose?.();
          }
        });
      }

      /** Grow/shrink `deerTargets` to match `parkourParams.deer.count` (slider); only runs when applied, not every frame. */
      async function syncDeerPopulation(scene, deerTargets) {
        let want = clampDeerCount(parkourParams.deer.count);
        parkourParams.deer.count = want;

        while (deerTargets.length > want) {
          const d = deerTargets.pop();
          disposeDeerTarget(scene, d);
        }

        while (deerTargets.length < want) {
          want = clampDeerCount(parkourParams.deer.count);
          if (deerTargets.length >= want) break;

          const i = deerTargets.length;
          const pos =
            i < DEER_DEFAULT_SPAWNS.length
              ? DEER_DEFAULT_SPAWNS[i].clone()
              : randomDeerSpawnXZ();

          let d;
          try {
            d = await loadDeerTarget(scene);
          } catch (e) {
            console.warn("Deer load failed", e);
            break;
          }

          want = clampDeerCount(parkourParams.deer.count);
          if (deerTargets.length >= want) {
            disposeDeerTarget(scene, d);
            break;
          }

          d.root.position.copy(pos);
          d.homePos.copy(pos);
          d.targetPos.copy(pos);
          deerTargets.push(d);
        }
      }

      // Load a simple deer target (for testing spells + ambient life)
      async function loadDeerTarget(scene) {
        const loader = new GLTFLoader();
        return new Promise((resolve, reject) => {
          loader.load(
            "models/deer.gltf",
            (gltf) => {
              const root = gltf.scene;
              let deerMesh = null;
              root.traverse((o) => {
                if (o.isMesh) {
                  o.castShadow = true;
                  o.receiveShadow = true;
                  // Use a single combined skinned mesh for BVH if possible
                  if (!deerMesh) deerMesh = o;
                }
              });
              // Scale and place the deer near origin
              root.scale.setScalar(0.8);
              root.position.set(6, FLOOR_Y, -4);
              scene.add(root);

              const mixer = new THREE.AnimationMixer(root);
              const anims = gltf.animations || [];
              const findClip = (candidates) =>
                anims.find((a) => candidates.some((n) => a.name === n)) || null;
              const idleClip =
                findClip([
                  "Idle",
                  "idle",
                  "Idle_Loop",
                  "Idle_Loop_Armature",
                  "Idle_01",
                ]) ||
                anims[0] ||
                null;
              const walkClip = findClip([
                "Walk",
                "Walk_Loop",
                "Walk_Fwd",
                "Walk_Fwd_Loop",
              ]);
              const runClip = findClip([
                "Run",
                "Run_Loop",
                "Run_Fwd",
                "Gallop",
              ]);
              const grazeClip = findClip([
                "Graze",
                "Eat",
                "Eat_Loop",
                "Idle_Eat",
              ]);
              const lookClip = findClip(["Look", "Look_Around"]);
              const deathClip = findClip([
                "Die",
                "Death",
                "Death_Armature",
                "Death01",
              ]);

              const idleAction = idleClip
                ? mixer.clipAction(idleClip).setLoop(THREE.LoopRepeat)
                : null;
              const walkAction = walkClip
                ? mixer.clipAction(walkClip).setLoop(THREE.LoopRepeat)
                : null;
              const runAction = runClip
                ? mixer.clipAction(runClip).setLoop(THREE.LoopRepeat)
                : null;
              const grazeAction = grazeClip
                ? mixer.clipAction(grazeClip).setLoop(THREE.LoopRepeat)
                : null;
              const lookAction = lookClip
                ? mixer.clipAction(lookClip).setLoop(THREE.LoopRepeat)
                : null;
              const deathAction = deathClip
                ? mixer.clipAction(deathClip).setLoop(THREE.LoopOnce)
                : null;
              if (deathAction) deathAction.clampWhenFinished = true;

              if (idleAction) idleAction.play();

              // Build BVH for precise ray hits if we found a mesh
              let deerBvh = null;
              if (deerMesh && deerMesh.geometry) {
                // Ensure geometry is non-indexed for best BVH behavior
                if (deerMesh.geometry.index) {
                  deerMesh.geometry = deerMesh.geometry.toNonIndexed();
                }
                deerMesh.geometry.computeBoundsTree?.();
                if (!deerMesh.geometry.boundsTree) {
                  deerMesh.geometry.boundsTree = new MeshBVH(
                    deerMesh.geometry,
                    { lazyGeneration: false },
                  );
                }
                deerBvh = deerMesh;
              }

              const homePos = root.position.clone();

              resolve({
                root,
                mixer,
                idleAction,
                walkAction,
                runAction,
                grazeAction,
                lookAction,
                deathAction,
                isDead: false,
                bvhMesh: deerBvh,
                // Simple ambient state machine
                state: "idle", // "idle" | "graze" | "walk" | "run" | "dead"
                stateTime: 0,
                homePos,
                targetPos: homePos.clone(),
                walkSpeed: 1.5,
                runSpeed: 4.0,
              });
            },
            undefined,
            (err) => reject(err),
          );
        });
      }

      /** `newtowergun.glb`: node names with `base` (e.g. `base_low_glow_0_1`) stay on the plinth; `body1_*` meshes rotate under `rotateGroup`. */
      function isTowerGunBasePartName(name) {
        if (!name) return false;
        return name.toLowerCase().includes("base");
      }

      /** Base parts (name contains `base`) and their descendants stay on the root; all other meshes (e.g. `body1_*`) attach under `rotateGroup` for yaw. */
      function reparentTowerGunRotatingParts(root, rotateGroup, fixedSet) {
        function subtreeMeshFlags(obj) {
          let fixed = false;
          let other = false;
          obj.traverse((o) => {
            if (!o.isMesh) return;
            if (fixedSet.has(o)) fixed = true;
            else other = true;
          });
          return { fixed, other };
        }

        function processParent(parent) {
          for (const child of [...parent.children]) {
            if (child === rotateGroup) continue;
            const { fixed, other } = subtreeMeshFlags(child);
            if (!fixed && !other) {
              processParent(child);
              continue;
            }
            if (fixed && !other) continue;
            if (!fixed && other) {
              rotateGroup.attach(child);
              continue;
            }
            processParent(child);
          }
        }

        processParent(root);
      }

      /**
       * Barrel muzzle in `towerGun_turret` local space: furthest horizontal rim of the
       * turret mesh AABB (avoids firing from the pivot at the bottom).
       */
      function recomputeTowerGunBarrelMuzzleLocal(rotateGroup) {
        if (!rotateGroup) return;
        const corner = new THREE.Vector3();
        const box = new THREE.Box3().makeEmpty();
        rotateGroup.updateMatrixWorld(true);
        rotateGroup.traverse((o) => {
          if (!o.isMesh || !o.geometry) return;
          const g = o.geometry;
          if (!g.boundingBox) g.computeBoundingBox();
          const { min: mn, max: mx } = g.boundingBox;
          const xs = [mn.x, mx.x];
          const ys = [mn.y, mx.y];
          const zs = [mn.z, mx.z];
          for (const x of xs) {
            for (const y of ys) {
              for (const z of zs) {
                corner.set(x, y, z);
                o.localToWorld(corner);
                rotateGroup.worldToLocal(corner);
                box.expandByPoint(corner);
              }
            }
          }
        });
        if (box.isEmpty()) {
          rotateGroup.userData.barrelMuzzleLocal = new THREE.Vector3(
            0,
            0.35,
            0.55,
          );
          return;
        }
        const cx = (box.min.x + box.max.x) * 0.5;
        const cy = (box.min.y + box.max.y) * 0.5;
        const cz = (box.min.z + box.max.z) * 0.5;
        const candidates = [
          [cx, cy, box.max.z],
          [cx, cy, box.min.z],
          [box.max.x, cy, cz],
          [box.min.x, cy, cz],
        ];
        let bestD2 = -1;
        const tip = new THREE.Vector3();
        for (const [x, y, z] of candidates) {
          const d2 = x * x + z * z;
          if (d2 > bestD2) {
            bestD2 = d2;
            tip.set(x, y, z);
          }
        }
        rotateGroup.userData.barrelMuzzleLocal = tip;
      }

      /** Uniform scale + keep world AABB bottom on `FLOOR_Y` and center XZ on spawn. */
      function syncTowerGunScaleAndGround(root) {
        if (!root) return;
        root.scale.setScalar(parkourParams.towerGun.scale);
        root.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(root);
        const midX = (box.min.x + box.max.x) * 0.5;
        const midZ = (box.min.z + box.max.z) * 0.5;
        root.position.set(
          TOWER_GUN_SPAWN_X - midX,
          FLOOR_Y - box.min.y,
          TOWER_GUN_SPAWN_Z - midZ,
        );
        root.updateMatrixWorld(true);
        const rg = root.getObjectByName("towerGun_turret");
        if (rg) recomputeTowerGunBarrelMuzzleLocal(rg);
      }

      /**
       * Lowest world Y of visible mesh hulls (geometry AABB corners × matrixWorld).
       * Avoids Box3.setFromObject(), which can jitter each frame on some GLTFs (skins/helpers).
       */
      function computeTankHullMinWorldY(root) {
        if (!root) return null;
        const box = new THREE.Box3().makeEmpty();
        let any = false;
        root.traverse((o) => {
          if (!o.isMesh || !o.geometry || o.visible === false) return;
          const g = o.geometry;
          if (!g.boundingBox) g.computeBoundingBox();
          const b = g.boundingBox;
          if (!b) return;
          any = true;
          const { min, max } = b;
          for (let i = 0; i < 8; i++) {
            _tankFootCorner.set(
              i & 1 ? max.x : min.x,
              i & 2 ? max.y : min.y,
              i & 4 ? max.z : min.z,
            );
            _tankFootCorner.applyMatrix4(o.matrixWorld);
            box.expandByPoint(_tankFootCorner);
          }
        });
        return any ? box.min.y : null;
      }

      function applyTankGroundY(root) {
        if (!root) return;
        root.updateMatrixWorld(true);
        let minY = computeTankHullMinWorldY(root);
        if (minY == null || !Number.isFinite(minY)) {
          const box = new THREE.Box3().setFromObject(root);
          if (box.isEmpty()) return;
          minY = box.min.y;
        }
        // Additive snap: once the hull bottom is on FLOOR_Y, minY ≈ FLOOR_Y and delta → 0.
        // Using `y = FLOOR_Y - minY` every frame wrongly drives y → 0 after the first good frame.
        const d = FLOOR_Y - minY;
        if (Math.abs(d) > 1e-6) root.position.y += d;
        root.updateMatrixWorld(true);
      }

      /** Static placement: spawn XZ + optional yaw, feet on `FLOOR_Y`. */
      function placeTankStaticAtSpawn(root) {
        if (!root) return;
        const p = parkourParams.tank;
        root.scale.setScalar(p.scale);
        root.rotation.y = p.spawnYaw + p.yawOffset;
        root.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(root);
        const midX = (box.min.x + box.max.x) * 0.5;
        const midZ = (box.min.z + box.max.z) * 0.5;
        root.position.set(p.spawnX - midX, 0, p.spawnZ - midZ);
        applyTankGroundY(root);
      }

      function createTankPatrolState() {
        const p = parkourParams.tank;
        return {
          x: p.spawnX,
          z: p.spawnZ,
          yaw: Math.random() * PI * 2,
          speed: 0,
          speedTarget: 0,
          steerSmoothed: 0,
          steerTarget: 0,
          phase: "drive",
          phaseT: 0.35 + Math.random() * 0.5,
        };
      }

      function pickTankManeuver(state, p) {
        state.phase = "drive";
        state.steerTarget = (Math.random() * 2 - 1) * p.steerAggression;
        state.speedTarget =
          Math.random() < p.reverseChance
            ? -p.maxSpeed * (0.32 + Math.random() * 0.58)
            : p.maxSpeed * (0.38 + Math.random() * 0.62);
        state.phaseT =
          p.maneuverTimeMin +
          Math.random() * (p.maneuverTimeMax - p.maneuverTimeMin);
      }

      /** Patrol pose: world XZ + yaw from `state`, scale from params, Y from AABB. */
      function applyTankPatrolTransform(root, state) {
        if (!root || !state) return;
        const p = parkourParams.tank;
        root.scale.setScalar(p.scale);
        root.position.x = state.x;
        root.position.z = state.z;
        root.rotation.y = state.yaw + p.yawOffset;
        applyTankGroundY(root);
      }

      function updateTankPatrol(dt, root, state) {
        const p = parkourParams.tank;
        if (!root || !state || !p.patrol || !p.enabled) return;

        const cx = p.patrolCenterX;
        const cz = p.patrolCenterZ;
        const R = p.patrolRadius;
        const soft = R * p.boundarySoft;

        let dx = state.x - cx;
        let dz = state.z - cz;
        let dist = Math.hypot(dx, dz);

        state.phaseT -= dt;
        if (state.phaseT <= 0) {
          if (state.phase === "pause") {
            pickTankManeuver(state, p);
          } else if (Math.random() < p.pauseChance) {
            state.phase = "pause";
            state.speedTarget = 0;
            state.steerTarget *= 0.35;
            state.phaseT =
              p.pauseDurationMin +
              Math.random() * (p.pauseDurationMax - p.pauseDurationMin);
          } else {
            pickTankManeuver(state, p);
          }
        }

        let steerDesired = state.steerTarget;
        if (dist > soft) {
          const w = Math.min(1, (dist - soft) / (R - soft + 0.001));
          const toCenter = Math.atan2(-dx, -dz);
          let angDiff = toCenter - state.yaw;
          while (angDiff > PI) angDiff -= 2 * PI;
          while (angDiff < -PI) angDiff += 2 * PI;
          const towardCenter = THREE.MathUtils.clamp(angDiff * 2.2, -1, 1);
          steerDesired = THREE.MathUtils.lerp(
            state.steerTarget,
            towardCenter,
            w * p.boundarySteerWeight,
          );
        }

        state.steerSmoothed +=
          (steerDesired - state.steerSmoothed) *
          Math.min(1, p.steerSmooth * dt);

        const spdAbs = Math.abs(state.speed);
        const turnScale = THREE.MathUtils.clamp(
          1.12 - 0.62 * (spdAbs / (p.maxSpeed + 0.001)),
          0.36,
          1.08,
        );
        state.yaw += state.steerSmoothed * p.turnSpeed * turnScale * dt;

        const dv = p.accel * dt;
        if (state.speed < state.speedTarget) {
          state.speed = Math.min(state.speedTarget, state.speed + dv);
        } else if (state.speed > state.speedTarget) {
          state.speed = Math.max(state.speedTarget, state.speed - dv);
        }

        const sn = Math.sin(state.yaw);
        const cs = Math.cos(state.yaw);
        state.x += sn * state.speed * dt;
        state.z += cs * state.speed * dt;

        dx = state.x - cx;
        dz = state.z - cz;
        dist = Math.hypot(dx, dz);
        if (dist > R) {
          const t = (R * 0.991) / dist;
          state.x = cx + dx * t;
          state.z = cz + dz * t;
          state.speed *= 0.32;
          state.speedTarget *= 0.45;
        }

        applyTankPatrolTransform(root, state);
      }

      /** Tweakpane: static spawn, or reset patrol position to spawn. */
      function syncTankGround(root, state) {
        if (!root) return;
        const p = parkourParams.tank;
        if (p.patrol && state) {
          state.x = p.spawnX;
          state.z = p.spawnZ;
          state.speed = 0;
          state.speedTarget = 0;
          applyTankPatrolTransform(root, state);
        } else {
          placeTankStaticAtSpawn(root);
        }
      }

      /** Place `models/tank.glb` on the parkour floor. */
      async function loadTankModel(scene) {
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath(
          "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/libs/draco/",
        );
        loader.setDRACOLoader(dracoLoader);

        return new Promise((resolve, reject) => {
          loader.load(
            "models/tank.glb",
            (gltf) => {
              const root = gltf.scene;
              root.traverse((o) => {
                if (o.isMesh) {
                  o.castShadow = true;
                  o.receiveShadow = true;
                  if (o.geometry && !o.geometry.boundingBox) {
                    o.geometry.computeBoundingBox();
                  }
                }
              });
              scene.add(root);
              resolve({ root });
            },
            undefined,
            (err) => reject(err),
          );
        });
      }

      /** Place `models/newtowergun.glb` on the parkour floor (bottom of bounds on FLOOR_Y). */
      async function loadTowerGunModel(scene) {
        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath(
          "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/libs/draco/",
        );
        loader.setDRACOLoader(dracoLoader);

        return new Promise((resolve, reject) => {
          loader.load(
            "models/newtowergun.glb",
            (gltf) => {
              const root = gltf.scene;
              root.traverse((o) => {
                if (o.isMesh) {
                  o.castShadow = true;
                  o.receiveShadow = true;
                }
              });

              const fixedSet = new Set();
              root.traverse((o) => {
                if (isTowerGunBasePartName(o.name))
                  o.traverse((x) => fixedSet.add(x));
              });

              const rotateGroup = new THREE.Group();
              rotateGroup.name = "towerGun_turret";
              root.add(rotateGroup);
              reparentTowerGunRotatingParts(root, rotateGroup, fixedSet);
              syncTowerGunScaleAndGround(root);
              scene.add(root);
              resolve({ root, rotateGroup });
            },
            undefined,
            (err) => reject(err),
          );
        });
      }

      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = parkourParams.light.exposure;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU")
            ? "WebGPU ✓"
            : "WebGL fallback";

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        if (SIMPLE_SNOW_SPHERE_DEBUG) {
          scene.background = new THREE.Color(0xd0dae6);
          scene.environment = null;
        }
        const camera = new THREE.PerspectiveCamera(
          60,
          innerWidth / innerHeight,
          0.5,
          1000,
        );
        camera.position.set(0, 4, 12);

        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 2, 0);
        orbitControls.maxPolarAngle = PI * 0.48;
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;
        orbitControls.enabled = false;
        orbitControls.update();

        // ── LIGHTING ──
        const _sunDir = sunDirectionFromAngles(
          parkourParams.light.sunAzimuth,
          parkourParams.light.sunElevation,
        );
        const dirLight = new THREE.DirectionalLight(
          parkourParams.light.dirColor,
          parkourParams.light.dirIntensity,
        );
        dirLight.position.copy(_sunDir.clone().multiplyScalar(50));
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = parkourParams.csm.mapSize;
        dirLight.shadow.mapSize.height = parkourParams.csm.mapSize;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 1000;
        dirLight.shadow.camera.left = -120;
        dirLight.shadow.camera.right = 120;
        dirLight.shadow.camera.top = 120;
        dirLight.shadow.camera.bottom = -120;
        dirLight.shadow.bias = parkourParams.light.shadowBias;
        dirLight.shadow.normalBias = parkourParams.light.shadowNormalBias;

        const csm = new CSMShadowNode(dirLight, {
          cascades: parkourParams.csm.cascades,
          maxFar: parkourParams.csm.maxFar,
          mode: "practical",
          lightMargin: parkourParams.csm.lightMargin,
        });
        dirLight.shadow.shadowNode = csm;
        scene.add(dirLight);

        // Fixed shadow target — sun points at scene center so fixed objects have stable shadows
        const shadowTarget = new THREE.Object3D();
        shadowTarget.position.set(0, FLOOR_Y, 0);
        scene.add(shadowTarget);
        dirLight.target = shadowTarget;

        const ambientLight = new THREE.AmbientLight(
          parkourParams.light.ambientColor,
          parkourParams.light.ambientIntensity,
        );
        scene.add(ambientLight);

        // ── FLAT PLANE TERRAIN (snow showcase) ──
        const FLOOR_SEGMENTS = 128;
        const floorGeo = new THREE.PlaneGeometry(
          PARKOUR_SIZE,
          PARKOUR_SIZE,
          FLOOR_SEGMENTS,
          FLOOR_SEGMENTS,
        );
        floorGeo.rotateX(-PI / 2);
        const snowTextureLoader = new THREE.TextureLoader();
        const [
          snowColorTex,
          snowRoughnessTex,
          snowNormalTex,
          snowDispTex,
          snowAoTex,
        ] = await Promise.all([
          snowTextureLoader.loadAsync("textures/Snow010A/Snow010A_1K-JPG_Color.jpg"),
          snowTextureLoader.loadAsync(
            "textures/Snow010A/Snow010A_1K-JPG_Roughness.jpg",
          ),
          snowTextureLoader.loadAsync(
            "textures/Snow010A/Snow010A_1K-JPG_NormalGL.jpg",
          ),
          snowTextureLoader.loadAsync(
            "textures/Snow010A/Snow010A_1K-JPG_Displacement.jpg",
          ),
          snowTextureLoader.loadAsync(
            "textures/Snow010A/Snow010A_1K-JPG_AmbientOcclusion.jpg",
          ),
        ]);

        const maxAniso =
          typeof renderer.getMaxAnisotropy === "function"
            ? renderer.getMaxAnisotropy()
            : typeof renderer.capabilities?.getMaxAnisotropy === "function"
              ? renderer.capabilities.getMaxAnisotropy()
              : 1;
        for (const tex of [
          snowColorTex,
          snowRoughnessTex,
          snowNormalTex,
          snowDispTex,
          snowAoTex,
        ]) {
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          tex.anisotropy = Math.min(maxAniso, 8);
        }
        snowColorTex.colorSpace = THREE.SRGBColorSpace;
        snowRoughnessTex.colorSpace = THREE.NoColorSpace;
        snowNormalTex.colorSpace = THREE.NoColorSpace;
        snowDispTex.colorSpace = THREE.NoColorSpace;
        snowAoTex.colorSpace = THREE.NoColorSpace;

        // ── Snow trail: sliding-window DataTexture centered on character ──
        const snowDispSize = Math.max(256, Math.min(2048, parkourParams.snow.mapResolution | 0));
        const SNOW_WINDOW = parkourParams.snow.windowSize;
        const snowTrailData = new Uint8Array(snowDispSize * snowDispSize * 4);
        snowTrailData.fill(128); // neutral height (no displacement at startup)
        for (let i = 0; i < snowDispSize * snowDispSize; i++) {
          snowTrailData[i * 4 + 3] = 255;
        }
        const snowTrailTex = new THREE.DataTexture(
          snowTrailData, snowDispSize, snowDispSize,
          THREE.RGBAFormat, THREE.UnsignedByteType,
        );
        snowTrailTex.minFilter = THREE.LinearFilter;
        snowTrailTex.magFilter = THREE.LinearFilter;
        snowTrailTex.wrapS = THREE.ClampToEdgeWrapping;
        snowTrailTex.wrapT = THREE.ClampToEdgeWrapping;
        snowTrailTex.colorSpace = THREE.NoColorSpace;
        snowTrailTex.generateMipmaps = false;
        snowTrailTex.needsUpdate = true;

        let snowTrailDirty = false;

        let snowWinCX = 0,
          snowWinCZ = 0;
        /** Fractional scroll so small moves still shift texels (fixes round-to-zero stall). */
        let snowScrollAccX = 0,
          snowScrollAccZ = 0;
        let snowStampCount = 0;

        const stampSnowPixels = (cx, cy, strength) => {
          const radiusWorld = Math.max(0.08, parkourParams.snow.trailRadius);
          const radiusPx = Math.max(
            1,
            Math.round((radiusWorld / SNOW_WINDOW) * snowDispSize),
          );
          const str = Math.min(0.95, Math.max(0.05, strength)) * 128;
          let writes = 0;
          for (let dy = -radiusPx; dy <= radiusPx; dy++) {
            const py = cy + dy;
            if (py < 0 || py >= snowDispSize) continue;
            for (let dx = -radiusPx; dx <= radiusPx; dx++) {
              const px = cx + dx;
              if (px < 0 || px >= snowDispSize) continue;
              const d = Math.sqrt(dx * dx + dy * dy) / radiusPx;
              if (d >= 1) continue;
              const falloff = (1 - d * d) * (1 - d * d);
              const idx = (py * snowDispSize + px) * 4;
              const push = str * falloff;
              const cur = snowTrailData[idx];
              snowTrailData[idx] = Math.max(0, cur - push) | 0;
              writes++;
            }
          }
          if (writes > 0) snowStampCount++;
          return writes;
        };

        /** Overlay follows sphere: contact is always local UV 0.5 → buffer center. */
        const stampSnowTrailCenter = (strength) => {
          const cx = (snowDispSize - 1) >> 1;
          const cy = (snowDispSize - 1) >> 1;
          return stampSnowPixels(cx, cy, strength);
        };

        const stampSnowData = (worldX, worldZ, strength) => {
          const relX = worldX - snowWinCX;
          const relZ = worldZ - snowWinCZ;
          const u = relX / SNOW_WINDOW + 0.5;
          const v = relZ / SNOW_WINDOW + 0.5;
          if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
          const cx = Math.round(u * (snowDispSize - 1));
          const cy = Math.round((1 - v) * (snowDispSize - 1));
          return stampSnowPixels(cx, cy, strength);
        };

        const applySnowScrollPixels = (dxPx, dzPx) => {
          if (dxPx === 0 && dzPx === 0) return false;
          const copy = new Uint8Array(snowTrailData.length);
          copy.set(snowTrailData);
          snowTrailData.fill(128);
          for (let i = 0; i < snowDispSize * snowDispSize; i++) {
            snowTrailData[i * 4 + 3] = 255;
          }
          for (let y = 0; y < snowDispSize; y++) {
            const srcY = y + dzPx;
            if (srcY < 0 || srcY >= snowDispSize) continue;
            for (let x = 0; x < snowDispSize; x++) {
              const srcX = x + dxPx;
              if (srcX < 0 || srcX >= snowDispSize) continue;
              const dstIdx = (y * snowDispSize + x) * 4;
              const srcIdx = (srcY * snowDispSize + srcX) * 4;
              snowTrailData[dstIdx] = copy[srcIdx];
            }
          }
          snowTrailDirty = true;
          return true;
        };

        const shiftSnowWindow = (newCX, newCZ) => {
          snowScrollAccX += ((newCX - snowWinCX) / SNOW_WINDOW) * snowDispSize;
          snowScrollAccZ += ((newCZ - snowWinCZ) / SNOW_WINDOW) * snowDispSize;
          const dxPx = Math.trunc(snowScrollAccX);
          const dzPx = Math.trunc(snowScrollAccZ);
          snowScrollAccX -= dxPx;
          snowScrollAccZ -= dzPx;
          if (dxPx !== 0 || dzPx !== 0) {
            applySnowScrollPixels(dxPx, dzPx);
          }
          snowWinCX = newCX;
          snowWinCZ = newCZ;
        };

        /** Push trail values down hard at center (debug / “ball sinks”). */
        const stampSnowTrailCenterDeep = () => {
          const cx = (snowDispSize - 1) >> 1;
          const cy = (snowDispSize - 1) >> 1;
          const rPx = Math.max(
            8,
            Math.round((parkourParams.snow.trailRadius / SNOW_WINDOW) * snowDispSize),
          );
          let writes = 0;
          for (let dy = -rPx; dy <= rPx; dy++) {
            const py = cy + dy;
            if (py < 0 || py >= snowDispSize) continue;
            for (let dx = -rPx; dx <= rPx; dx++) {
              const px = cx + dx;
              if (px < 0 || px >= snowDispSize) continue;
              const d = Math.hypot(dx, dy) / rPx;
              if (d >= 1) continue;
              const falloff = (1 - d) * (1 - d);
              const idx = (py * snowDispSize + px) * 4;
              const push = 115 * falloff;
              const cur = snowTrailData[idx];
              snowTrailData[idx] = Math.max(0, cur - push) | 0;
              writes++;
            }
          }
          if (writes > 0) snowStampCount++;
          return writes;
        };

        /**
         * Scroll trail buffer by sphere movement (overlay-local); keeps world-fixed grooves.
         * Uses incremental world delta so we never depend on snowWin round-trip.
         */
        let snowSpherePrevX = 0,
          snowSpherePrevZ = 0;
        let snowSphereScrollInit = false;
        const shiftSnowTrailBySphereDelta = (worldX, worldZ) => {
          if (!snowSphereScrollInit) {
            snowSpherePrevX = worldX;
            snowSpherePrevZ = worldZ;
            snowSphereScrollInit = true;
            return;
          }
          const dWorldX = worldX - snowSpherePrevX;
          const dWorldZ = worldZ - snowSpherePrevZ;
          snowSpherePrevX = worldX;
          snowSpherePrevZ = worldZ;
          snowScrollAccX += (dWorldX / SNOW_WINDOW) * snowDispSize;
          snowScrollAccZ += (dWorldZ / SNOW_WINDOW) * snowDispSize;
          const dxPx = Math.trunc(snowScrollAccX);
          const dzPx = Math.trunc(snowScrollAccZ);
          snowScrollAccX -= dxPx;
          snowScrollAccZ -= dzPx;
          if (dxPx !== 0 || dzPx !== 0) {
            applySnowScrollPixels(dxPx, dzPx);
          }
          snowWinCX = worldX;
          snowWinCZ = worldZ;
        };

        window.__snowTrailData = snowTrailData;
        window.__snowTrailTex = snowTrailTex;
        window.__stampSnow = stampSnowData;
        window.__stampSnowTrailCenter = stampSnowTrailCenter;
        window.__snowOverlay = null; // set after mesh creation

        const snowRepeat = Math.max(1, parkourParams.snow.textureRepeat);
        snowColorTex.repeat.set(snowRepeat, snowRepeat);
        snowRoughnessTex.repeat.set(snowRepeat, snowRepeat);
        snowNormalTex.repeat.set(snowRepeat, snowRepeat);
        snowAoTex.repeat.set(snowRepeat, snowRepeat);
        snowDispTex.repeat.set(snowRepeat, snowRepeat);

        const snowMat = SIMPLE_SNOW_SPHERE_DEBUG
          ? new THREE.MeshStandardMaterial({
              map: snowColorTex,
              roughnessMap: snowRoughnessTex,
              normalMap: snowNormalTex,
              aoMap: snowAoTex,
              roughness: parkourParams.snow.roughness,
              metalness: parkourParams.snow.metalness,
            })
          : new THREE.MeshStandardNodeMaterial({
              map: snowColorTex,
              roughnessMap: snowRoughnessTex,
              normalMap: snowNormalTex,
              aoMap: snowAoTex,
              roughness: parkourParams.snow.roughness,
              metalness: parkourParams.snow.metalness,
            });
        snowMat.color.setScalar(0.82);
        snowMat.normalScale.set(
          parkourParams.snow.normalScale,
          parkourParams.snow.normalScale,
        );

        // Main terrain gets no positionNode — cheap flat background
        const floorMat = parkourParams.snow.enabled
          ? snowMat
          : createTileMaterial({
              textureScale: parkourParams.tile.textureScale,
              gradientIntensity: parkourParams.tile.gradientIntensity,
              gradientBias: parkourParams.tile.gradientBias,
              tileColor: parkourParams.tile.tileColor,
              gridColor: parkourParams.tile.gridColor,
              gridLineColor: parkourParams.tile.gridLineColor,
              roughness: parkourParams.tile.roughness,
              metalness: parkourParams.tile.metalness,
            });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = FLOOR_Y;
        floor.castShadow = true;
        floor.receiveShadow = true;
        floor.renderOrder = 0;
        scene.add(floor);

        // ── Snow overlay: high-res patch (TSL) or CPU-synced mesh (sphere debug) ──
        const OVERLAY_SEGS = SIMPLE_SNOW_SPHERE_DEBUG ? 200 : 256;
        const overlayGeo = new THREE.PlaneGeometry(
          SNOW_WINDOW,
          SNOW_WINDOW,
          OVERLAY_SEGS,
          OVERLAY_SEGS,
        );
        overlayGeo.rotateX(-PI / 2);

        /** Base XYZ per overlay vertex (reset every sync — avoids drift / odd slabs). */
        const overlayN = overlayGeo.attributes.position.count;
        const overlayBaseX = new Float32Array(overlayN);
        const overlayBaseY = new Float32Array(overlayN);
        const overlayBaseZ = new Float32Array(overlayN);
        const posInit = overlayGeo.attributes.position;
        for (let i = 0; i < overlayN; i++) {
          overlayBaseX[i] = posInit.getX(i);
          overlayBaseY[i] = posInit.getY(i);
          overlayBaseZ[i] = posInit.getZ(i);
        }

        let snowOverlayMat;
        /** @type {THREE.UniformNode | null} */
        let uOverlayPos = null;

        if (SIMPLE_SNOW_SPHERE_DEBUG) {
          // WebGPU: dynamic DataTexture + MeshStandardNodeMaterial.positionNode often shows no displacement.
          // CPU sync from trail buffer → guaranteed visible groove (“ball sinks”).
          snowOverlayMat = new THREE.MeshStandardMaterial({
            map: snowColorTex,
            roughness: parkourParams.snow.roughness,
            metalness: parkourParams.snow.metalness,
          });
          snowOverlayMat.color.setScalar(0.82);
        } else {
          snowOverlayMat = new THREE.MeshStandardNodeMaterial({
            roughness: parkourParams.snow.roughness,
            metalness: parkourParams.snow.metalness,
          });
          snowOverlayMat.color.setScalar(0.82);
          snowOverlayMat.polygonOffset = true;
          snowOverlayMat.polygonOffsetFactor = -1;
          snowOverlayMat.polygonOffsetUnits = -1;

          uOverlayPos = uniform(new THREE.Vector2(0, 0));
          {
            const worldX = positionLocal.x.add(uOverlayPos.x);
            const worldZ = positionLocal.z.add(uOverlayPos.y);
            const worldUV = vec2(
              worldX.div(float(PARKOUR_SIZE)).add(0.5),
              worldZ.negate().div(float(PARKOUR_SIZE)).add(0.5),
            );
            const tiledUV = worldUV.mul(float(snowRepeat));
            snowOverlayMat.colorNode = texture(snowColorTex, tiledUV).mul(float(0.82));

            const localUV = vec2(
              positionLocal.x.div(float(SNOW_WINDOW)).add(0.5),
              positionLocal.z.negate().div(float(SNOW_WINDOW)).add(0.5),
            );
            const trailSample = texture(snowTrailTex, localUV);
            const trailDisp = trailSample.r
              .sub(float(128.0 / 255.0))
              .mul(float(parkourParams.snow.trailDepth * 2.0));
            const baseSample = texture(snowDispTex, tiledUV);
            const baseDisp = baseSample.r
              .mul(float(parkourParams.snow.baseDisplacement * 2.0))
              .sub(float(parkourParams.snow.baseDisplacement));
            snowOverlayMat.positionNode = positionLocal.add(
              vec3(float(0), trailDisp.add(baseDisp), float(0)),
            );
          }
        }

        const sampleTrailRByteBilinear = (tu, tv) => {
          const w = snowDispSize;
          const x = THREE.MathUtils.clamp(tu, 0, 1) * (w - 1);
          const y = THREE.MathUtils.clamp(1 - tv, 0, 1) * (w - 1);
          const x0 = Math.floor(x);
          const y0 = Math.floor(y);
          const x1 = Math.min(w - 1, x0 + 1);
          const y1 = Math.min(w - 1, y0 + 1);
          const fx = x - x0;
          const fy = y - y0;
          const r = (yy, xx) => snowTrailData[(yy * w + xx) * 4];
          const v00 = r(y0, x0);
          const v10 = r(y0, x1);
          const v01 = r(y1, x0);
          const v11 = r(y1, x1);
          return (v00 * (1 - fx) + v10 * fx) * (1 - fy) + (v01 * (1 - fx) + v11 * fx) * fy;
        };

        const syncSnowOverlayCpuFromTrail = () => {
          if (!SIMPLE_SNOW_SPHERE_DEBUG) return;
          const posAttr = overlayGeo.attributes.position;
          const maxSink = Math.max(0.04, parkourParams.snow.cpuMaxSink ?? 0.55);
          for (let i = 0; i < posAttr.count; i++) {
            const bx = overlayBaseX[i];
            const by = overlayBaseY[i];
            const bz = overlayBaseZ[i];
            const tu = bx / SNOW_WINDOW + 0.5;
            const tv = -bz / SNOW_WINDOW + 0.5;
            if (tu < 0 || tu > 1 || tv < 0 || tv > 1) {
              posAttr.setXYZ(i, bx, by, bz);
              continue;
            }
            const Rbyte = sampleTrailRByteBilinear(tu, tv);
            const deepen = Math.max(0, (128 - Rbyte) / 128);
            const disp = -deepen * maxSink;
            posAttr.setXYZ(i, bx, by + disp, bz);
          }
          posAttr.needsUpdate = true;
          overlayGeo.computeVertexNormals();
          overlayGeo.getAttribute("normal").needsUpdate = true;
        };

        const snowOverlay = new THREE.Mesh(overlayGeo, snowOverlayMat);
        const snowOverlayLift = SIMPLE_SNOW_SPHERE_DEBUG
          ? Math.max(0, parkourParams.snow.overlayLift ?? 0.025)
          : 0;
        snowOverlay.position.set(0, FLOOR_Y + snowOverlayLift, 0);
        snowOverlay.receiveShadow = true;
        snowOverlay.castShadow = true;
        snowOverlay.renderOrder = 1;
        snowOverlay.visible = parkourParams.snow.enabled;
        scene.add(snowOverlay);
        window.__snowOverlay = snowOverlay;
        window.__syncSnowOverlayCpuFromTrail = syncSnowOverlayCpuFromTrail;

        if (SIMPLE_SNOW_SPHERE_DEBUG) {
          const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 48, 32),
            new THREE.MeshStandardMaterial({
              color: 0xd03838,
              roughness: 0.45,
              metalness: 0.02,
            }),
          );
          sphere.position.set(0, FLOOR_Y + snowOverlayLift + 0.35, 0);
          sphere.castShadow = true;
          sphere.receiveShadow = true;
          scene.add(sphere);

          orbitControls.enabled = true;
          orbitControls.target.copy(sphere.position);
          orbitControls.update();

          window.addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
          });

          const keyState = {
            KeyW: false,
            KeyA: false,
            KeyS: false,
            KeyD: false,
            ArrowUp: false,
            ArrowLeft: false,
            ArrowDown: false,
            ArrowRight: false,
          };
          const onKey = (down) => (e) => {
            if (e.code in keyState) {
              keyState[e.code] = down;
              e.preventDefault();
            }
          };
          addEventListener("keydown", onKey(true));
          addEventListener("keyup", onKey(false));

          stampSnowTrailCenterDeep();
          snowTrailTex.needsUpdate = true;
          syncSnowOverlayCpuFromTrail();

          const timer = new THREE.Timer();
          let lastTime = 0;
          let stampAccum = 0;
          const sphereVel = new THREE.Vector3();
          const sphereDir = new THREE.Vector3(0, 0, 1);
          const camForward = new THREE.Vector3();
          const camRight = new THREE.Vector3();
          const inputDir = new THREE.Vector3();
          const camDesired = new THREE.Vector3();
          const camLook = new THREE.Vector3();
          const accel = 18;
          const damping = 7;
          const maxSpeed = 7.5;

          renderer.setAnimationLoop(() => {
            timer.update();
            const elapsed = timer.getElapsed();
            const dt = Math.min(0.05, elapsed - lastTime || 0.016);
            lastTime = elapsed;

            const ix =
              (keyState.KeyD || keyState.ArrowRight ? 1 : 0) -
              (keyState.KeyA || keyState.ArrowLeft ? 1 : 0);
            const iz =
              (keyState.KeyW || keyState.ArrowUp ? 1 : 0) -
              (keyState.KeyS || keyState.ArrowDown ? 1 : 0);

            if (ix !== 0 || iz !== 0) {
              camera.getWorldDirection(camForward);
              camForward.y = 0;
              if (camForward.lengthSq() < 1e-6) camForward.set(0, 0, -1);
              camForward.normalize();
              camRight.set(camForward.z, 0, -camForward.x);
              inputDir
                .copy(camForward)
                .multiplyScalar(iz)
                .addScaledVector(camRight, ix);
              if (inputDir.lengthSq() > 1e-6) inputDir.normalize();
              sphereVel.addScaledVector(inputDir, accel * dt);
            } else {
              const damp = Math.exp(-damping * dt);
              sphereVel.multiplyScalar(damp);
            }
            const speed = Math.hypot(sphereVel.x, sphereVel.z);
            if (speed > maxSpeed) {
              sphereVel.multiplyScalar(maxSpeed / speed);
            }

            sphere.position.x += sphereVel.x * dt;
            sphere.position.z += sphereVel.z * dt;
            sphere.position.y = FLOOR_Y + snowOverlayLift + 0.35;
            sphere.position.x = THREE.MathUtils.clamp(
              sphere.position.x,
              -PARKOUR_SIZE * 0.48,
              PARKOUR_SIZE * 0.48,
            );
            sphere.position.z = THREE.MathUtils.clamp(
              sphere.position.z,
              -PARKOUR_SIZE * 0.48,
              PARKOUR_SIZE * 0.48,
            );

            if (speed > 0.05) {
              sphereDir.set(sphereVel.x / speed, 0, sphereVel.z / speed);
            }

            snowOverlay.position.x = sphere.position.x;
            snowOverlay.position.z = sphere.position.z;
            if (uOverlayPos) {
              uOverlayPos.value.set(sphere.position.x, sphere.position.z);
            }
            // Sphere debug: overlay moves with the ball — groove stays in local UV at texture
