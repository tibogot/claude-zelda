<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calm Water Shader — WebGPU + TSL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0d12; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #tp {
        position: fixed; top: 8px; right: 8px;
        max-height: calc(100vh - 16px);
        overflow-y: auto; overflow-x: hidden;
        z-index: 1000;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="tp"></div>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { Pane } from "tweakpane";
      import {
        Fn, uniform, float, vec2, vec3, vec4,
        sin, mix, dot, normalize,
        positionWorld, positionLocal, normalWorld, cameraPosition,
        mx_noise_float,
        time,
      } from "three/tsl";

      // ─── Renderer ───────────────────────────────────────────────────────────
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.5;
      document.body.appendChild(renderer.domElement);

      await renderer.init();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
      camera.position.set(0, 3.5, 12);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.maxPolarAngle = Math.PI * 0.52;
      controls.minDistance = 2;
      controls.maxDistance = 60;
      controls.update();

      // ─── Params ──────────────────────────────────────────────────────────────
      const P = {
        sky: {
          turbidity:     4.0,
          rayleigh:      2.0,
          mie:           0.005,
          mieG:          0.8,
          cloudCoverage: 0.3,
          cloudDensity:  0.3,
          cloudElevation:0.5,
          sunAzimuth:    135,
          sunElevation:  8,      // low for golden hour
        },
        light: {
          dirColor:      "#ffb880",
          dirIntensity:  2.2,
          hemiSky:       "#304060",
          hemiGround:    "#1a1008",
          hemiIntensity: 0.5,
          envIntensity:  0.8,
          exposure:      0.5,
        },
        water: {
          shallowColor:  "#2a5060",
          deepColor:     "#0d1e2a",
          colorDepthPow: 2.5,
          reflectivity:  1.0,
          roughness:     0.035,
          specularColor: "#ffe8a0",
          specularPow:   140,
          specularStr:   1.5,
          waveHeight:    0.16,
          waveSpeed:     0.35,
          waveScale:     0.32,
          wave2Height:   0.06,
          wave2Speed:    0.22,
          wave2Scale:    0.85,
          rippleScale:   2.0,
          rippleSpeed:   0.12,
          rippleStr:     0.45,
          ripple2Scale:  4.5,
          ripple2Speed:  0.08,
        },
        fog: { enabled: false, color: "#4a3020", near: 22, far: 60 },
      };

      // ─── Sun direction helper ─────────────────────────────────────────────────
      function sunDir() {
        const az = (P.sky.sunAzimuth  * Math.PI) / 180;
        const el = (P.sky.sunElevation * Math.PI) / 180;
        const cosEl = Math.cos(el);
        return new THREE.Vector3(cosEl * Math.cos(az), Math.sin(el), cosEl * Math.sin(az)).normalize();
      }

      // ─── SkyMesh ─────────────────────────────────────────────────────────────
      const sky = new SkyMesh();
      sky.scale.setScalar(10000);
      scene.add(sky);

      function applySkyParams() {
        sky.turbidity.value       = P.sky.turbidity;
        sky.rayleigh.value        = P.sky.rayleigh;
        sky.mieCoefficient.value  = P.sky.mie;
        sky.mieDirectionalG.value = P.sky.mieG;
        sky.cloudCoverage.value   = P.sky.cloudCoverage;
        sky.cloudDensity.value    = P.sky.cloudDensity;
        sky.cloudElevation.value  = P.sky.cloudElevation;
        sky.sunPosition.value.copy(sunDir());
      }
      applySkyParams();

      // ─── PMREM from SkyMesh ──────────────────────────────────────────────────
      const pmrem = new THREE.PMREMGenerator(renderer);

      function rebuildEnv() {
        const skyEnvScene = new THREE.Scene();
        skyEnvScene.add(sky.clone());
        if (scene._envRT) scene._envRT.dispose();
        scene._envRT = pmrem.fromScene(skyEnvScene, 0.04);
        scene.environment = scene._envRT.texture;
        scene.environmentIntensity = P.light.envIntensity;
      }
      rebuildEnv();

      // ─── TSL uniforms ────────────────────────────────────────────────────────
      const w = P.water;
      const uShallow    = uniform(new THREE.Color(w.shallowColor));
      const uDeep       = uniform(new THREE.Color(w.deepColor));
      const uDepthPow   = uniform(w.colorDepthPow);
      const uRippleScl  = uniform(w.rippleScale);
      const uRippleSpd  = uniform(w.rippleSpeed);
      const uRippleStr  = uniform(w.rippleStr);
      const uRipple2Scl = uniform(w.ripple2Scale);
      const uRipple2Spd = uniform(w.ripple2Speed);
      const uWaveH      = uniform(w.waveHeight);
      const uWaveSpd    = uniform(w.waveSpeed);
      const uWaveScl    = uniform(w.waveScale);
      const uWave2H     = uniform(w.wave2Height);
      const uWave2Spd   = uniform(w.wave2Speed);
      const uWave2Scl   = uniform(w.wave2Scale);
      const uSpecColor  = uniform(new THREE.Color(w.specularColor));
      const uSpecPow    = uniform(w.specularPow);
      const uSpecStr    = uniform(w.specularStr);
      const uSunDir     = uniform(sunDir());
      const uRoughness  = uniform(w.roughness);

      // ─── Water geometry ──────────────────────────────────────────────────────
      const waterGeo = new THREE.PlaneGeometry(80, 80, 256, 256);
      waterGeo.rotateX(-Math.PI / 2);

      const waterMat = new THREE.MeshPhysicalNodeMaterial({
        transparent: true,
        side: THREE.FrontSide,
      });

      // Vertex displacement
      waterMat.positionNode = Fn(() => {
        const p  = positionLocal.xz;
        const t1 = time.mul(uWaveSpd);
        const t2 = time.mul(uWave2Spd);
        const h1 = sin(p.dot(vec2(0.7, 0.5)).mul(uWaveScl).add(t1));
        const h2 = sin(p.dot(vec2(-0.45, 0.82)).mul(uWave2Scl).add(t2));
        const hn = mx_noise_float(p.mul(uWaveScl.mul(1.6)).add(t1.mul(0.4)));
        const dy = h1.mul(uWaveH).add(h2.mul(uWave2H)).add(hn.mul(uWaveH.mul(0.25)));
        return positionLocal.add(vec3(0, dy, 0));
      })();

      // Surface normal via noise gradient
      waterMat.normalNode = Fn(() => {
        const p   = positionWorld.xz;
        const t1  = time.mul(uRippleSpd);
        const t2  = time.mul(uRipple2Spd);
        const uv1a = p.mul(uRippleScl).add(vec2(t1, t1.mul(0.7)));
        const uv1b = p.mul(uRippleScl).add(vec2(t1.negate(), t1.mul(1.3)));
        const uv2  = p.mul(uRipple2Scl).add(vec2(t2.mul(-0.8), t2.mul(1.2)));
        const eps  = float(0.02);
        const n1x  = mx_noise_float(uv1a.add(vec2(eps, 0))).sub(mx_noise_float(uv1a.sub(vec2(eps, 0))));
        const n1z  = mx_noise_float(uv1a.add(vec2(0, eps))).sub(mx_noise_float(uv1a.sub(vec2(0, eps))));
        const n2x  = mx_noise_float(uv1b.add(vec2(eps, 0))).sub(mx_noise_float(uv1b.sub(vec2(eps, 0))));
        const n2z  = mx_noise_float(uv1b.add(vec2(0, eps))).sub(mx_noise_float(uv1b.sub(vec2(0, eps))));
        const n3x  = mx_noise_float(uv2.add(vec2(eps, 0))).sub(mx_noise_float(uv2.sub(vec2(eps, 0))));
        const n3z  = mx_noise_float(uv2.add(vec2(0, eps))).sub(mx_noise_float(uv2.sub(vec2(0, eps))));
        const sc   = uRippleStr.mul(25);
        const nx   = n1x.add(n2x).add(n3x.mul(0.5)).mul(sc);
        const nz   = n1z.add(n2z).add(n3z.mul(0.5)).mul(sc);
        return normalize(vec3(nx, float(1), nz));
      })();

      // Color: fresnel + Blinn-Phong specular
      waterMat.colorNode = Fn(() => {
        const N       = normalWorld;
        const V       = normalize(cameraPosition.sub(positionWorld));
        const fresnel = float(1).sub(dot(N, V).clamp(0, 1)).pow(uDepthPow);
        const base    = mix(uDeep, uShallow, fresnel);
        const H       = normalize(uSunDir.add(V));
        const spec    = dot(N, H).clamp(0, 1).pow(uSpecPow).mul(uSpecStr);
        return vec4(base.add(uSpecColor.mul(spec)), mix(float(0.82), float(0.97), fresnel));
      })();

      waterMat.roughnessNode = uRoughness;
      waterMat.metalnessNode = uniform(0.0);
      waterMat.envMapIntensity = w.reflectivity;

      scene.add(new THREE.Mesh(waterGeo, waterMat));

      // ─── Ground & banks ──────────────────────────────────────────────────────
      const groundGeo = new THREE.PlaneGeometry(120, 120);
      groundGeo.rotateX(-Math.PI / 2);
      const groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x2a1f10, roughness: 0.95 }));
      groundMesh.position.y = -0.38;
      scene.add(groundMesh);

      const bankMat = new THREE.MeshStandardMaterial({ color: 0x3a2a10, roughness: 0.92 });
      const bankGeo = new THREE.BoxGeometry(14, 1.4, 80);
      [-24, 24].forEach(x => {
        const b = new THREE.Mesh(bankGeo, bankMat);
        b.position.set(x, 0.3, 0);
        scene.add(b);
      });

      const reedMat = new THREE.MeshStandardMaterial({ color: 0x120d05, roughness: 1 });
      const reedGeo = new THREE.CylinderGeometry(0.03, 0.07, 2.8, 4);
      for (let i = 0; i < 60; i++) {
        const r = new THREE.Mesh(reedGeo, reedMat);
        const side = Math.random() > 0.5 ? -1 : 1;
        r.position.set(side * (20 + Math.random() * 5), 1.1, (Math.random() - 0.5) * 40);
        r.rotation.z = (Math.random() - 0.5) * 0.25;
        scene.add(r);
      }

      // ─── Lighting ───────────────────────────────────────────────────────────
      const dirLight  = new THREE.DirectionalLight(new THREE.Color(P.light.dirColor), P.light.dirIntensity);
      const hemiLight = new THREE.HemisphereLight(P.light.hemiSky, P.light.hemiGround, P.light.hemiIntensity);
      scene.add(dirLight, hemiLight);

      function applyLightDir() {
        const d = sunDir();
        dirLight.position.copy(d.clone().multiplyScalar(50));
        uSunDir.value.copy(d);
      }
      applyLightDir();

      // ─── Fog ─────────────────────────────────────────────────────────────────
      scene.fog = null;

      // ─── Resize ──────────────────────────────────────────────────────────────
      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // ─── Render loop ─────────────────────────────────────────────────────────
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });

      // ─── Tweakpane ───────────────────────────────────────────────────────────
      const pane = new Pane({ container: document.getElementById("tp"), title: "Calm Water" });

      // Sky
      const fSky = pane.addFolder({ title: "Sky", expanded: true });
      fSky.addBinding(P.sky, "turbidity",     { label: "Turbidity",   min: 0,  max: 20,  step: 0.1 }).on("change", () => { applySkyParams(); rebuildEnv(); });
      fSky.addBinding(P.sky, "rayleigh",      { label: "Rayleigh",    min: 0,  max: 4,   step: 0.05 }).on("change", () => { applySkyParams(); rebuildEnv(); });
      fSky.addBinding(P.sky, "mie",           { label: "Mie coeff",   min: 0,  max: 0.1, step: 0.001 }).on("change", () => { applySkyParams(); rebuildEnv(); });
      fSky.addBinding(P.sky, "mieG",          { label: "Mie dir G",   min: 0,  max: 1,   step: 0.01 }).on("change", () => { applySkyParams(); rebuildEnv(); });
      fSky.addBinding(P.sky, "cloudCoverage", { label: "Cloud cover", min: 0,  max: 1,   step: 0.01 }).on("change", () => { applySkyParams(); rebuildEnv(); });
      fSky.addBinding(P.sky, "cloudDensity",  { label: "Cloud density",min: 0, max: 1,   step: 0.01 }).on("change", () => { applySkyParams(); rebuildEnv(); });
      fSky.addBinding(P.sky, "sunAzimuth",    { label: "Sun azimuth", min: 0,  max: 360, step: 1 }).on("change", () => { applySkyParams(); applyLightDir(); rebuildEnv(); });
      fSky.addBinding(P.sky, "sunElevation",  { label: "Sun elevation",min: 1, max: 90,  step: 0.5 }).on("change", () => { applySkyParams(); applyLightDir(); rebuildEnv(); });

      // Light
      const fLight = pane.addFolder({ title: "Light", expanded: true });
      fLight.addBinding(P.light, "dirColor",     { label: "Sun color"  }).on("change", () => { dirLight.color.set(P.light.dirColor); });
      fLight.addBinding(P.light, "dirIntensity", { label: "Sun strength", min: 0, max: 8, step: 0.05 }).on("change", () => { dirLight.intensity = P.light.dirIntensity; });
      fLight.addBinding(P.light, "hemiSky",      { label: "Hemi sky"   }).on("change", () => { hemiLight.color.set(P.light.hemiSky); });
      fLight.addBinding(P.light, "hemiGround",   { label: "Hemi ground"}).on("change", () => { hemiLight.groundColor.set(P.light.hemiGround); });
      fLight.addBinding(P.light, "hemiIntensity",{ label: "Hemi strength", min: 0, max: 3, step: 0.05 }).on("change", () => { hemiLight.intensity = P.light.hemiIntensity; });
      fLight.addBinding(P.light, "envIntensity", { label: "Env reflect",  min: 0, max: 3, step: 0.05 }).on("change", () => { scene.environmentIntensity = P.light.envIntensity; });
      fLight.addBinding(P.light, "exposure",     { label: "Exposure",     min: 0.1, max: 4, step: 0.05 }).on("change", () => { renderer.toneMappingExposure = P.light.exposure; });

      // Water Colors
      const fCol = pane.addFolder({ title: "Water Colors", expanded: true });
      fCol.addBinding(w, "shallowColor",  { label: "Shallow" }).on("change", () => { uShallow.value.set(w.shallowColor); });
      fCol.addBinding(w, "deepColor",     { label: "Deep"    }).on("change", () => { uDeep.value.set(w.deepColor); });
      fCol.addBinding(w, "colorDepthPow", { label: "Depth blend", min: 0.5, max: 8, step: 0.1 }).on("change", () => { uDepthPow.value = w.colorDepthPow; });

      // Reflection
      const fRefl = pane.addFolder({ title: "Reflection", expanded: true });
      fRefl.addBinding(w, "reflectivity", { label: "Intensity", min: 0, max: 3, step: 0.05 }).on("change", () => { waterMat.envMapIntensity = w.reflectivity; });
      fRefl.addBinding(w, "roughness",    { label: "Roughness", min: 0, max: 0.5, step: 0.005 }).on("change", () => { uRoughness.value = w.roughness; });

      // Sun Specular
      const fSpec = pane.addFolder({ title: "Sun Specular", expanded: false });
      fSpec.addBinding(w, "specularColor", { label: "Color"    }).on("change", () => { uSpecColor.value.set(w.specularColor); });
      fSpec.addBinding(w, "specularPow",   { label: "Sharpness", min: 10, max: 512, step: 1  }).on("change", () => { uSpecPow.value = w.specularPow; });
      fSpec.addBinding(w, "specularStr",   { label: "Strength",  min: 0,  max: 6,   step: 0.05 }).on("change", () => { uSpecStr.value = w.specularStr; });

      // Waves
      const fWave = pane.addFolder({ title: "Waves (vertex)", expanded: false });
      fWave.addBinding(w, "waveHeight",  { label: "Height 1",  min: 0, max: 1.2,  step: 0.01 }).on("change", () => { uWaveH.value   = w.waveHeight; });
      fWave.addBinding(w, "waveSpeed",   { label: "Speed 1",   min: 0, max: 2,    step: 0.01 }).on("change", () => { uWaveSpd.value  = w.waveSpeed; });
      fWave.addBinding(w, "waveScale",   { label: "Scale 1",   min: 0.05, max: 2, step: 0.01 }).on("change", () => { uWaveScl.value  = w.waveScale; });
      fWave.addBinding(w, "wave2Height", { label: "Height 2",  min: 0, max: 0.6,  step: 0.01 }).on("change", () => { uWave2H.value   = w.wave2Height; });
      fWave.addBinding(w, "wave2Speed",  { label: "Speed 2",   min: 0, max: 2,    step: 0.01 }).on("change", () => { uWave2Spd.value  = w.wave2Speed; });
      fWave.addBinding(w, "wave2Scale",  { label: "Scale 2",   min: 0.05, max: 3, step: 0.01 }).on("change", () => { uWave2Scl.value  = w.wave2Scale; });

      // Ripples
      const fRipple = pane.addFolder({ title: "Surface Ripples (normal)", expanded: false });
      fRipple.addBinding(w, "rippleScale",  { label: "Scale 1",  min: 0.1, max: 10, step: 0.05 }).on("change", () => { uRippleScl.value  = w.rippleScale; });
      fRipple.addBinding(w, "rippleSpeed",  { label: "Speed 1",  min: 0,   max: 1,  step: 0.01 }).on("change", () => { uRippleSpd.value  = w.rippleSpeed; });
      fRipple.addBinding(w, "rippleStr",    { label: "Strength", min: 0,   max: 2,  step: 0.05 }).on("change", () => { uRippleStr.value  = w.rippleStr; });
      fRipple.addBinding(w, "ripple2Scale", { label: "Scale 2",  min: 0.1, max: 15, step: 0.05 }).on("change", () => { uRipple2Scl.value = w.ripple2Scale; });
      fRipple.addBinding(w, "ripple2Speed", { label: "Speed 2",  min: 0,   max: 1,  step: 0.01 }).on("change", () => { uRipple2Spd.value = w.ripple2Speed; });

      // Fog
      const fFog = pane.addFolder({ title: "Fog", expanded: false });
      fFog.addBinding(P.fog, "enabled", { label: "Enable" }).on("change", () => {
        scene.fog = P.fog.enabled ? new THREE.Fog(new THREE.Color(P.fog.color), P.fog.near, P.fog.far) : null;
      });
      fFog.addBinding(P.fog, "color", { label: "Color" }).on("change", () => { if (scene.fog) scene.fog.color.set(P.fog.color); });
      fFog.addBinding(P.fog, "near",  { label: "Near", min: 1,  max: 100, step: 1 }).on("change", () => { if (scene.fog) scene.fog.near = P.fog.near; });
      fFog.addBinding(P.fog, "far",   { label: "Far",  min: 10, max: 200, step: 1 }).on("change", () => { if (scene.fog) scene.fog.far  = P.fog.far; });

    </script>
  </body>
</html>
