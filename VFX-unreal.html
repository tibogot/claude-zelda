<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFX Unreal V2 - Blade Slash</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0d;
        color: #d7ffd0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }

      #viewport {
        position: absolute;
        inset: 0;
      }

      #ui {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 10;
        width: 360px;
        max-width: 90vw;
        height: 100%;
        overflow: auto;
        padding: 10px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.35);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="viewport"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn,
        mix,
        uv,
        vec2,
        vec3,
        vec4,
        float,
        sin,
        cos,
        fract,
        floor,
        dot,
        abs,
        min,
        max,
        smoothstep,
        uniform,
        color
      } from "three/tsl";
      import { pass } from "three/tsl";
      import { bloom } from "three/addons/tsl/display/BloomNode.js";

      let renderer, scene, camera, controls, mesh, pane, renderPipeline, bloomPass;

      /** Base values (sliders). Animated uniforms are derived each frame in applyEnvelopeToScene(). */
      const params = {
        autoRotate: false,
        autoRotateSpeed: 0.8,
        yScale: 0.34,
        baseColor: "#0a1320",
        slashColor: "#66dfff",
        edgeColor: "#ffffff",
        slashIntensity: 4.8,
        alphaStrength: 1.0,
        ringSoftness: 0.22,
        ringCenter: 0.65,
        ringWidth: 0.26,
        radialNoiseScale: 11.5,
        radialNoiseWarp: 1.8,
        radialNoiseSpeed: 1.25,
        radialNoiseScaleFine: 22,
        radialNoiseWarpFine: 0.55,
        radialNoiseSpeedFine: 2.8,
        streakFreq: 17.0,
        streakStrength: 0.33,
        edgeThreshold: 0.52,
        edgeSharpness: 0.08,
        bloomStrength: 1.05,
        bloomRadius: 0.15,
        bloomThreshold: 0.92,
        // Life cycle: attack → sustain → decay. envMult drives shader + bloom/mesh.
        envEnabled: true,
        /** manual = play button / Space only; loop = continuous; loopPause = loop + rest between cycles. */
        envPlayback: "manual",
        /** Seconds of black / idle between slashes when envPlayback is loopPause. */
        envPauseBetween: 5,
        envDuration: 0.72,
        envAttackFrac: 0.14,
        envDecayFrac: 0.48,
        /** Blade arc: mesh Y rotation sweeps this many degrees over one slash (Play). */
        sweepEnabled: true,
        sweepAngleDeg: 78,
        // Coupled motion: oscillations scaled by envelope so motion rests at start/end of cycle.
        coupleEnabled: false,
        coupleBreathAmp: 0.14,
        coupleBreathFreq: 2,
        ringCenterWiggleAmp: 0.045,
        ringCenterWiggleFreq: 3,
        // Second ring (afterglow), delayed in phase — reads as echo / shockwave.
        echoEnabled: true,
        echoRadiusOffset: -0.07,
        echoWidthMul: 1.15,
        echoSoftnessMul: 1.2,
        echoIntensity: 0.42,
        echoPhaseDelay: 0.14,
        // Energy along blade length (UV.v): traveling pulse.
        vTravelEnabled: true,
        vTravelScale: 14,
        vTravelSpeed: 5,
        vTravelStrength: 0.35,
        // One bright wedge rotating around the ring (directional hit read).
        heroEnabled: true,
        heroWidth: 0.09,
        heroSpeed: 0,
        heroPhase: 0,
        heroIntensity: 1.25,
        // Bloom reacts to envelope peak (screen flash feel).
        bloomPulseEnabled: false,
        bloomPulseStrength: 0.55,
        bloomThresholdPulse: 0.12,
        // Mesh squash on peak (impact).
        meshPunchEnabled: true,
        meshPunchAmp: 0.12
      };

      const u = {
        time: uniform(0),
        baseColor: uniform(color(params.baseColor)),
        slashColor: uniform(color(params.slashColor)),
        edgeColor: uniform(color(params.edgeColor)),
        slashIntensity: uniform(params.slashIntensity),
        alphaStrength: uniform(params.alphaStrength),
        ringSoftness: uniform(params.ringSoftness),
        ringCenter: uniform(params.ringCenter),
        ringWidth: uniform(params.ringWidth),
        radialNoiseScale: uniform(params.radialNoiseScale),
        radialNoiseWarp: uniform(params.radialNoiseWarp),
        radialNoiseSpeed: uniform(params.radialNoiseSpeed),
        radialNoiseScaleFine: uniform(params.radialNoiseScaleFine),
        radialNoiseWarpFine: uniform(params.radialNoiseWarpFine),
        radialNoiseSpeedFine: uniform(params.radialNoiseSpeedFine),
        streakFreq: uniform(params.streakFreq),
        streakStrength: uniform(params.streakStrength),
        edgeThreshold: uniform(params.edgeThreshold),
        edgeSharpness: uniform(params.edgeSharpness),
        envMult: uniform(1),
        echoEnabled: uniform(params.echoEnabled ? 1 : 0),
        echoRadiusOffset: uniform(params.echoRadiusOffset),
        echoWidthMul: uniform(params.echoWidthMul),
        echoSoftnessMul: uniform(params.echoSoftnessMul),
        echoIntensity: uniform(params.echoIntensity),
        echoEnvMult: uniform(1),
        vTravelEnabled: uniform(params.vTravelEnabled ? 1 : 0),
        vTravelScale: uniform(params.vTravelScale),
        vTravelSpeed: uniform(params.vTravelSpeed),
        vTravelStrength: uniform(params.vTravelStrength),
        heroEnabled: uniform(params.heroEnabled ? 1 : 0),
        heroWidth: uniform(params.heroWidth),
        heroSpeed: uniform(params.heroSpeed),
        heroPhase: uniform(params.heroPhase),
        heroIntensity: uniform(params.heroIntensity)
      };

      /** null = manual mode idle (no slash) until Play. */
      let envStartTime = null;

      function phaseInCycle() {
        const dur = params.envDuration;
        if (dur <= 1e-6) return 0;
        if (params.envPlayback === "manual" && envStartTime === null) return 1;
        const elapsed = u.time.value - envStartTime;

        if (params.envPlayback === "manual") {
          if (elapsed <= 0) return 0;
          if (elapsed >= dur) return 1;
          return elapsed / dur;
        }

        if (params.envPlayback === "loopPause") {
          const pause = Math.max(0, params.envPauseBetween);
          const period = dur + pause;
          if (period <= 1e-6) return 0;
          const te = ((elapsed % period) + period) % period;
          if (te >= dur) return 1;
          return te / dur;
        }

        const m = ((elapsed % dur) + dur) % dur;
        return m / dur;
      }

      function phaseEcho() {
        const d = params.echoPhaseDelay;
        const p = phaseInCycle();
        return (p - d + 1) % 1;
      }

      function applySweepRotation() {
        if (!mesh || !params.sweepEnabled || !params.envEnabled) return;
        const dur = params.envDuration;
        if (dur <= 1e-6) return;
        if (params.envPlayback === "manual" && envStartTime === null) {
          mesh.rotation.y = mesh.userData.sweepBaseY ?? 0;
          return;
        }
        const elapsed = u.time.value - envStartTime;
        const base = mesh.userData.sweepBaseY ?? 0;
        const r = THREE.MathUtils.degToRad(params.sweepAngleDeg);

        if (params.envPlayback === "manual") {
          if (elapsed <= 0) {
            mesh.rotation.y = base;
            return;
          }
          if (elapsed >= dur) {
            mesh.rotation.y = base;
            return;
          }
          const ph = elapsed / dur;
          const ease = smoothstepJs(0, 1, ph);
          mesh.rotation.y = base + ease * r;
          return;
        }

        if (params.envPlayback === "loopPause") {
          const pause = Math.max(0, params.envPauseBetween);
          const period = dur + pause;
          if (period <= 1e-6) return;
          const te = ((elapsed % period) + period) % period;
          if (te >= dur) {
            mesh.rotation.y = base;
            return;
          }
          const ph = te / dur;
          const ease = smoothstepJs(0, 1, ph);
          mesh.rotation.y = base + ease * r;
          return;
        }

        const m = ((elapsed % dur) + dur) % dur;
        const ph = m / dur;
        const ease = smoothstepJs(0, 1, ph);
        mesh.rotation.y = base + ease * r;
      }

      const CONFIG = {
        height: 0.66,
        sides: 25,
        r5: { x: 0.5, z: 0.5 },
        r4: { x: 1.0, z: 1.0 },
        r3: { x: 1.5, z: 1.5 },
        r2: { x: 1.0, z: 1.0 },
        r1: { x: 0.5, z: 0.5 },
        y2: 0.2,
        y3: 0.5,
        y4: 0.8
      };

      function smoothstepJs(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / Math.max(1e-6, edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      /** 0→1 attack, hold, 1→0 decay. p in [0,1]. */
      function evalEnvelope(p, attack, decay) {
        const sustainEnd = 1 - decay;
        if (p <= attack) return attack > 1e-6 ? smoothstepJs(0, attack, p) : 1;
        if (p <= sustainEnd) return 1;
        return decay > 1e-6 ? 1 - smoothstepJs(sustainEnd, 1, p) : 0;
      }

      function createHardcodedGeometry() {
        const { sides, height, r1, r2, r3, r4, r5, y2, y3, y4 } = CONFIG;
        const positions = [];
        const uvs = [];
        const indices = [];
        const ringVerts = sides + 1;

        const levels = [
          { y: -height * 0.5, rx: r1.x, rz: r1.z, v: 0.0 },
          { y: -height * 0.5 + height * y2, rx: r2.x, rz: r2.z, v: y2 },
          { y: -height * 0.5 + height * y3, rx: r3.x, rz: r3.z, v: y3 },
          { y: -height * 0.5 + height * y4, rx: r4.x, rz: r4.z, v: y4 },
          { y: height * 0.5, rx: r5.x, rz: r5.z, v: 1.0 }
        ];

        for (let i = 0; i < levels.length; i++) {
          const { y, rx, rz, v } = levels[i];
          for (let s = 0; s <= sides; s++) {
            const t = s / sides;
            const angle = t * Math.PI * 2;
            positions.push(Math.cos(angle) * rx, y, Math.sin(angle) * rz);
            uvs.push(t, v);
          }
        }

        for (let l = 0; l < 4; l++) {
          const startCurrent = l * ringVerts;
          const startNext = (l + 1) * ringVerts;
          for (let s = 0; s < sides; s++) {
            const a = startCurrent + s;
            const b = startCurrent + s + 1;
            const c = startNext + s;
            const d = startNext + s + 1;
            indices.push(a, b, c, b, d, c);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      const hash21 = Fn(([p]) => {
        return fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453));
      });

      const valueNoise2D = Fn(([p]) => {
        const i = floor(p);
        const f = fract(p);
        const u2 = f.mul(f).mul(float(3).sub(f.mul(2)));

        const a = hash21(i);
        const b = hash21(i.add(vec2(1, 0)));
        const c = hash21(i.add(vec2(0, 1)));
        const d = hash21(i.add(vec2(1, 1)));

        const ab = a.add(b.sub(a).mul(u2.x));
        const cd = c.add(d.sub(c).mul(u2.x));
        return ab.add(cd.sub(ab).mul(u2.y));
      });

      async function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0f);

        camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(3, 2, 3);

        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("viewport").appendChild(renderer.domElement);
        await renderer.init();

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        const slashMaterial = new THREE.MeshBasicNodeMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        slashMaterial.outputNode = Fn(() => {
          const uvNode = uv();
          const vAlongBlade = uvNode.y;
          const centered = uvNode.sub(0.5).toVar();
          const radial = centered.length();
          const angle = centered.y.atan(centered.x);
          const angle01 = angle.add(Math.PI).div(Math.PI * 2);

          const t = u.time.mul(u.radialNoiseSpeed);
          const tFine = u.time.mul(u.radialNoiseSpeedFine);
          const dir = vec2(cos(angle), sin(angle));
          const polar = dir.mul(radial);
          const nUv = polar
            .mul(vec2(u.radialNoiseScale, u.radialNoiseScale))
            .add(vec2(t, t.negate()))
            .toVar();

          const warpX = valueNoise2D(nUv).sub(0.5).mul(u.radialNoiseWarp);
          const warpY = valueNoise2D(nUv.add(vec2(17.3, 9.1))).sub(0.5).mul(u.radialNoiseWarp);
          const nUvFine = polar
            .mul(vec2(u.radialNoiseScaleFine, u.radialNoiseScaleFine))
            .add(vec2(tFine.mul(1.1), tFine.negate().mul(0.85)));
          const warpFX = valueNoise2D(nUvFine.add(vec2(3.7, 2.2))).sub(0.5).mul(u.radialNoiseWarpFine);
          const warpFY = valueNoise2D(nUvFine.add(vec2(11.1, 6.4))).sub(0.5).mul(u.radialNoiseWarpFine);
          const warped = nUv.add(vec2(warpX, warpY)).add(vec2(warpFX, warpFY));
          const n = valueNoise2D(warped);

          const noisyRadius = radial.add(n.sub(0.5).mul(0.12));
          const ringDelta = abs(noisyRadius.sub(u.ringCenter));
          const ringMask = smoothstep(u.ringWidth, u.ringWidth.sub(u.ringSoftness.mul(0.5)), ringDelta);

          const echoCenter = u.ringCenter.add(u.echoRadiusOffset);
          const echoW = u.ringWidth.mul(u.echoWidthMul);
          const echoS = u.ringSoftness.mul(u.echoSoftnessMul);
          const ringDeltaE = abs(noisyRadius.sub(echoCenter));
          const ringMaskEcho = smoothstep(echoW, echoW.sub(echoS.mul(0.5)), ringDeltaE);

          const streak = sin(angle01.mul(u.streakFreq).add(t.mul(2.4))).mul(0.5).add(0.5);
          const streakMask = streak.mul(u.streakStrength).add(float(1).sub(u.streakStrength));

          const vWave = sin(
            vAlongBlade.mul(u.vTravelScale).add(u.time.mul(u.vTravelSpeed)),
          )
            .mul(0.5)
            .add(0.5);
          const vMask = mix(float(1), vWave, u.vTravelStrength.mul(u.vTravelEnabled));

          const corePrimary = ringMask.mul(streakMask).mul(vMask).toVar();
          const echoPart = ringMaskEcho.mul(streakMask).mul(vMask).mul(u.echoEnvMult).mul(u.echoIntensity);
          const coreEcho = echoPart.mul(u.echoEnabled);
          const core = max(corePrimary, coreEcho).toVar();

          const heroCenter = fract(u.time.mul(u.heroSpeed).add(u.heroPhase));
          const da = fract(angle01.sub(heroCenter).add(0.5)).sub(0.5);
          const angDist = abs(da);
          const heroMask = smoothstep(u.heroWidth, float(0), angDist).mul(u.heroEnabled);
          const coreBoost = mix(float(1), u.heroIntensity, heroMask);

          const edge = smoothstep(u.edgeThreshold, u.edgeThreshold.add(u.edgeSharpness), core);

          const base = u.baseColor.mul(0.12);
          const em = u.envMult;
          const slash = u.slashColor.mul(core.mul(u.slashIntensity).mul(em).mul(coreBoost));
          const edgeGlow = u.edgeColor.mul(edge.mul(u.slashIntensity).mul(0.8).mul(em).mul(coreBoost));
          const outColor = base.add(slash).add(edgeGlow);

          const alpha = max(core, edge.mul(0.7)).mul(u.alphaStrength).mul(em).clamp(0, 1);
          return vec4(outColor, alpha);
        })();

        mesh = new THREE.Mesh(createHardcodedGeometry(), slashMaterial);
        mesh.scale.y = params.yScale;
        mesh.userData.sweepBaseY = 0;
        scene.add(mesh);

        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(4, 7, 4);
        const fill = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(key, fill);

        renderPipeline = new THREE.RenderPipeline(renderer);
        const scenePass = pass(scene, camera);
        const sceneColor = scenePass.getTextureNode ? scenePass.getTextureNode("output") : scenePass;
        bloomPass = bloom(sceneColor, params.bloomStrength, params.bloomRadius, params.bloomThreshold);
        renderPipeline.outputNode = sceneColor.add(bloomPass);
        await renderer.compileAsync(scene, camera);

        buildUI();
        onParamsChanged();
        if (params.envPlayback !== "manual") {
          envStartTime = u.time.value;
        }

        const timer = new THREE.Timer();
        function animate() {
          requestAnimationFrame(animate);
          timer.update();
          const dt = timer.getDelta();
          u.time.value += dt;
          applyEnvelopeToScene();
          if (params.sweepEnabled && params.envEnabled) {
            applySweepRotation();
          } else if (params.autoRotate && mesh) {
            mesh.rotation.y += dt * params.autoRotateSpeed;
          }
          controls.update();
          renderPipeline.render();
        }
        animate();

        window.addEventListener("resize", onResize);
        window.addEventListener("keydown", (e) => {
          if (e.code !== "Space") return;
          const t = e.target;
          if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
          e.preventDefault();
          playSlash();
        });
      }

      function applyEnvelopeToScene() {
        const phase = phaseInCycle();
        const echoPh = phaseEcho();
        const env = params.envEnabled
          ? evalEnvelope(phase, params.envAttackFrac, params.envDecayFrac)
          : 1;
        let echoEnv = params.envEnabled
          ? evalEnvelope(echoPh, params.envAttackFrac, params.envDecayFrac)
          : 1;
        if (params.envPlayback === "manual" && envStartTime === null) {
          echoEnv = 0;
        }

        u.envMult.value = env;

        let w = params.ringWidth;
        let s = params.ringSoftness;
        let c = params.ringCenter;
        if (params.envEnabled && params.coupleEnabled) {
          const breath = Math.sin(phase * Math.PI * 2 * params.coupleBreathFreq) * params.coupleBreathAmp * env;
          w *= 1 + breath;
          s *= 1 + breath * 0.65;
          c +=
            Math.sin(phase * Math.PI * 2 * params.ringCenterWiggleFreq) *
            params.ringCenterWiggleAmp *
            env;
        }
        u.ringWidth.value = w;
        u.ringSoftness.value = s;
        u.ringCenter.value = c;

        u.echoEnvMult.value = echoEnv;

        if (mesh && params.meshPunchEnabled && params.envEnabled) {
          const punch = 1 + params.meshPunchAmp * env;
          mesh.scale.y = params.yScale * punch;
        } else if (mesh) {
          mesh.scale.y = params.yScale;
        }

        if (bloomPass) {
          let str = params.bloomStrength;
          let thr = params.bloomThreshold;
          if (params.bloomPulseEnabled && params.envEnabled) {
            str += params.bloomPulseStrength * env;
            thr = Math.max(0, thr - params.bloomThresholdPulse * env);
          }
          bloomPass.strength.value = str;
          bloomPass.radius.value = params.bloomRadius;
          bloomPass.threshold.value = thr;
        }
      }

      function onParamsChanged() {
        u.baseColor.value.set(params.baseColor);
        u.slashColor.value.set(params.slashColor);
        u.edgeColor.value.set(params.edgeColor);
        u.slashIntensity.value = params.slashIntensity;
        u.alphaStrength.value = params.alphaStrength;
        u.ringSoftness.value = params.ringSoftness;
        u.ringCenter.value = params.ringCenter;
        u.ringWidth.value = params.ringWidth;
        u.radialNoiseScale.value = params.radialNoiseScale;
        u.radialNoiseWarp.value = params.radialNoiseWarp;
        u.radialNoiseSpeed.value = params.radialNoiseSpeed;
        u.radialNoiseScaleFine.value = params.radialNoiseScaleFine;
        u.radialNoiseWarpFine.value = params.radialNoiseWarpFine;
        u.radialNoiseSpeedFine.value = params.radialNoiseSpeedFine;
        u.streakFreq.value = params.streakFreq;
        u.streakStrength.value = params.streakStrength;
        u.edgeThreshold.value = params.edgeThreshold;
        u.edgeSharpness.value = params.edgeSharpness;

        u.echoEnabled.value = params.echoEnabled ? 1 : 0;
        u.echoRadiusOffset.value = params.echoRadiusOffset;
        u.echoWidthMul.value = params.echoWidthMul;
        u.echoSoftnessMul.value = params.echoSoftnessMul;
        u.echoIntensity.value = params.echoIntensity;

        u.vTravelEnabled.value = params.vTravelEnabled ? 1 : 0;
        u.vTravelScale.value = params.vTravelScale;
        u.vTravelSpeed.value = params.vTravelSpeed;
        u.vTravelStrength.value = params.vTravelStrength;

        u.heroEnabled.value = params.heroEnabled ? 1 : 0;
        u.heroWidth.value = params.heroWidth;
        u.heroSpeed.value = params.heroSpeed;
        u.heroPhase.value = params.heroPhase;
        u.heroIntensity.value = params.heroIntensity;

        if (mesh) mesh.scale.y = params.yScale;
        if (bloomPass) {
          bloomPass.strength.value = params.bloomStrength;
          bloomPass.radius.value = params.bloomRadius;
          bloomPass.threshold.value = params.bloomThreshold;
        }
      }

      function playSlash() {
        if (mesh) mesh.userData.sweepBaseY = mesh.rotation.y;
        envStartTime = u.time.value;
      }

      function buildUI() {
        pane = new Pane({ container: document.getElementById("ui"), title: "VFX Unreal V2 - Blade Slash" });

        const fAnim = pane.addFolder({ title: "Animation" });
        fAnim.addBinding(params, "autoRotate", {
          label: "Spin mesh (off if sweep)",
        }).on("change", onParamsChanged);
        fAnim.addBinding(params, "autoRotateSpeed", { min: -4, max: 4, step: 0.01 }).on("change", onParamsChanged);

        const fEnv = pane.addFolder({ title: "Slash playback & fade", expanded: true });
        fEnv.addBinding(params, "envEnabled", { label: "Envelope (fade out)" }).on("change", onParamsChanged);
        fEnv
          .addBinding(params, "envPlayback", {
            label: "Mode",
            options: {
              "Play (button / Space)": "manual",
              "Loop (continuous)": "loop",
              "Loop + pause between": "loopPause",
            },
          })
          .on("change", () => {
            envStartTime = params.envPlayback === "manual" ? null : u.time.value;
            onParamsChanged();
          });
        fEnv.addBinding(params, "envPauseBetween", {
          label: "Pause between (s)",
          min: 0,
          max: 30,
          step: 0.25,
        }).on("change", onParamsChanged);
        fEnv.addBinding(params, "envDuration", { min: 0.2, max: 12, step: 0.05 }).on("change", onParamsChanged);
        fEnv.addBinding(params, "envAttackFrac", { min: 0.02, max: 0.45, step: 0.01 }).on("change", onParamsChanged);
        fEnv.addBinding(params, "envDecayFrac", { min: 0.02, max: 0.6, step: 0.01 }).on("change", onParamsChanged);
        fEnv.addBinding(params, "sweepEnabled", { label: "Blade arc sweep" }).on("change", onParamsChanged);
        fEnv.addBinding(params, "sweepAngleDeg", { label: "Sweep (°)", min: -180, max: 180, step: 1 }).on(
          "change",
          onParamsChanged,
        );
        fEnv.addButton({ title: "Play slash" }).on("click", playSlash);

        const fCouple = pane.addFolder({ title: "Coupled ring motion", expanded: false });
        fCouple.addBinding(params, "coupleEnabled", { label: "Use envelope coupling" }).on("change", onParamsChanged);
        fCouple.addBinding(params, "coupleBreathAmp", { min: 0, max: 0.45, step: 0.01 }).on("change", onParamsChanged);
        fCouple.addBinding(params, "coupleBreathFreq", { min: 0.5, max: 8, step: 0.1 }).on("change", onParamsChanged);
        fCouple.addBinding(params, "ringCenterWiggleAmp", { min: 0, max: 0.15, step: 0.001 }).on("change", onParamsChanged);
        fCouple.addBinding(params, "ringCenterWiggleFreq", { min: 0.5, max: 12, step: 0.1 }).on("change", onParamsChanged);

        const fEcho = pane.addFolder({ title: "Echo ring (delayed)", expanded: false });
        fEcho.addBinding(params, "echoEnabled").on("change", onParamsChanged);
        fEcho.addBinding(params, "echoRadiusOffset", { min: -0.25, max: 0.25, step: 0.005 }).on("change", onParamsChanged);
        fEcho.addBinding(params, "echoWidthMul", { min: 0.5, max: 2, step: 0.02 }).on("change", onParamsChanged);
        fEcho.addBinding(params, "echoSoftnessMul", { min: 0.5, max: 2.5, step: 0.02 }).on("change", onParamsChanged);
        fEcho.addBinding(params, "echoIntensity", { min: 0, max: 1.5, step: 0.02 }).on("change", onParamsChanged);
        fEcho.addBinding(params, "echoPhaseDelay", { min: 0, max: 0.45, step: 0.01 }).on("change", onParamsChanged);

        const fV = pane.addFolder({ title: "Blade length (V) pulse", expanded: false });
        fV.addBinding(params, "vTravelEnabled").on("change", onParamsChanged);
        fV.addBinding(params, "vTravelScale", { min: 2, max: 48, step: 0.5 }).on("change", onParamsChanged);
        fV.addBinding(params, "vTravelSpeed", { min: 0, max: 16, step: 0.1 }).on("change", onParamsChanged);
        fV.addBinding(params, "vTravelStrength", { min: 0, max: 1, step: 0.02 }).on("change", onParamsChanged);

        const fHero = pane.addFolder({ title: "Hero wedge (rotating hot arc)", expanded: false });
        fHero.addBinding(params, "heroEnabled").on("change", onParamsChanged);
        fHero.addBinding(params, "heroWidth", { min: 0.02, max: 0.35, step: 0.005 }).on("change", onParamsChanged);
        fHero.addBinding(params, "heroSpeed", { min: -2, max: 2, step: 0.02 }).on("change", onParamsChanged);
        fHero.addBinding(params, "heroPhase", { min: 0, max: 1, step: 0.01 }).on("change", onParamsChanged);
        fHero.addBinding(params, "heroIntensity", { min: 1, max: 2.5, step: 0.02 }).on("change", onParamsChanged);

        const fMesh = pane.addFolder({ title: "Mesh" });
        fMesh.addBinding(params, "yScale", { min: 0.05, max: 1.2, step: 0.01 }).on("change", onParamsChanged);
        fMesh.addBinding(params, "meshPunchEnabled", { label: "Y punch on peak" }).on("change", onParamsChanged);
        fMesh.addBinding(params, "meshPunchAmp", { min: 0, max: 0.4, step: 0.01 }).on("change", onParamsChanged);

        const fColor = pane.addFolder({ title: "Color" });
        fColor.addBinding(params, "baseColor").on("change", onParamsChanged);
        fColor.addBinding(params, "slashColor").on("change", onParamsChanged);
        fColor.addBinding(params, "edgeColor").on("change", onParamsChanged);
        fColor.addBinding(params, "slashIntensity", { min: 0, max: 12, step: 0.01 }).on("change", onParamsChanged);
        fColor.addBinding(params, "alphaStrength", { min: 0, max: 1.5, step: 0.01 }).on("change", onParamsChanged);

        const fMask = pane.addFolder({ title: "Blade Mask (base)" });
        fMask.addBinding(params, "ringCenter", { min: 0.1, max: 1.1, step: 0.001 }).on("change", onParamsChanged);
        fMask.addBinding(params, "ringWidth", { min: 0.02, max: 0.7, step: 0.001 }).on("change", onParamsChanged);
        fMask.addBinding(params, "ringSoftness", { min: 0.01, max: 0.5, step: 0.001 }).on("change", onParamsChanged);
        fMask.addBinding(params, "radialNoiseScale", { min: 1, max: 40, step: 0.1 }).on("change", onParamsChanged);
        fMask.addBinding(params, "radialNoiseWarp", { min: 0, max: 5, step: 0.01 }).on("change", onParamsChanged);
        fMask.addBinding(params, "radialNoiseSpeed", { min: -5, max: 5, step: 0.01 }).on("change", onParamsChanged);
        fMask.addBinding(params, "radialNoiseScaleFine", { label: "Fine noise scale", min: 4, max: 64, step: 0.5 }).on(
          "change",
          onParamsChanged,
        );
        fMask.addBinding(params, "radialNoiseWarpFine", { label: "Fine warp", min: 0, max: 2.5, step: 0.01 }).on(
          "change",
          onParamsChanged,
        );
        fMask.addBinding(params, "radialNoiseSpeedFine", { label: "Fine speed", min: 0, max: 8, step: 0.05 }).on(
          "change",
          onParamsChanged,
        );
        fMask.addBinding(params, "streakFreq", { min: 1, max: 64, step: 0.1 }).on("change", onParamsChanged);
        fMask.addBinding(params, "streakStrength", { min: 0, max: 1, step: 0.01 }).on("change", onParamsChanged);
        fMask.addBinding(params, "edgeThreshold", { min: 0, max: 1, step: 0.001 }).on("change", onParamsChanged);
        fMask.addBinding(params, "edgeSharpness", { min: 0.001, max: 0.35, step: 0.001 }).on("change", onParamsChanged);

        const fPost = pane.addFolder({ title: "Bloom" });
        fPost.addBinding(params, "bloomStrength", { min: 0, max: 8, step: 0.01 }).on("change", onParamsChanged);
        fPost.addBinding(params, "bloomRadius", { min: 0, max: 1, step: 0.01 }).on("change", onParamsChanged);
        fPost.addBinding(params, "bloomThreshold", { min: 0, max: 2, step: 0.01 }).on("change", onParamsChanged);
        fPost.addBinding(params, "bloomPulseEnabled", { label: "Pulse w/ envelope" }).on("change", onParamsChanged);
        fPost.addBinding(params, "bloomPulseStrength", { min: 0, max: 4, step: 0.05 }).on("change", onParamsChanged);
        fPost.addBinding(params, "bloomThresholdPulse", { min: 0, max: 0.5, step: 0.01 }).on("change", onParamsChanged);
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      init().catch((err) => {
        console.error(err);
      });
    </script>
  </body>
</html>
