<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tree Editor — Stylized Tree Builder for V2 Engine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a3020; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 8px; right: 8px; z-index: 10;
    max-height: calc(100vh - 16px); overflow-y: auto;
    scrollbar-width: thin;
  }
  #info {
    position: fixed; bottom: 8px; left: 8px; color: #ddd;
    font: 11px/1.8 monospace; background: rgba(0,0,0,0.55);
    padding: 5px 10px; border-radius: 4px; pointer-events: none;
  }
  #tex-gallery {
    position: fixed; bottom: 8px; right: 8px; z-index: 10;
    display: flex; gap: 6px; padding: 6px 10px;
    background: rgba(0,0,0,0.6); border-radius: 6px;
  }
  #tex-gallery img {
    width: 52px; height: 52px; object-fit: cover; border-radius: 4px;
    border: 2px solid transparent; cursor: pointer; opacity: 0.7;
    transition: opacity 0.15s, border-color 0.15s;
  }
  #tex-gallery img:hover { opacity: 1; }
  #tex-gallery img.active { border-color: #7f7; opacity: 1; }
  #tex-gallery .tex-label {
    position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
    font: 9px/1 monospace; color: #aaa; white-space: nowrap; pointer-events: none;
  }
  #tex-gallery .tex-item { position: relative; }
  #lod-labels {
    position: fixed; top: 50%; left: 0; width: 100%; z-index: 5;
    display: none; pointer-events: none; text-align: center;
  }
  #lod-labels .lod-tag {
    position: absolute; transform: translate(-50%, 0);
    font: bold 13px/1.4 monospace; padding: 4px 12px;
    border-radius: 4px; background: rgba(0,0,0,0.65); color: #fff;
  }
  #lod-labels .lod-tag .lod-sub {
    font-weight: normal; font-size: 10px; color: #aaa; display: block;
  }
</style>
</head>
<body>
<div id="ui"></div>
<div id="info">Drag to orbit · Scroll to zoom · Middle-drag to pan · Ctrl+Z undo · Ctrl+Y redo</div>
<div id="tex-gallery"></div>
<div id="lod-labels">
  <div class="lod-tag" id="lod-tag-0">LOD 0 — Full<span class="lod-sub"></span></div>
  <div class="lod-tag" id="lod-tag-1">LOD 1 — Half<span class="lod-sub"></span></div>
  <div class="lod-tag" id="lod-tag-2">LOD 2 — Quarter<span class="lod-sub"></span></div>
</div>

// ─── LEAF TEXTURE ────────────────────────────────────────────────────────────
const leafMapNode = texture(new THREE.Texture());
let activeLeafTexPath = "";

function loadLeafTexFromPath(path) {
  const loader = new THREE.TextureLoader();
  loader.load(path, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    leafMapNode.value = tex;
    activeLeafTexPath = path;
    params.leafTexFile = path;
    updateGallerySelection();
  });
}

function loadLeafTexFromFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      leafMapNode.value = tex;
      activeLeafTexPath = "";
      params.leafTexFile = file.name;
      updateGallerySelection();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── TEXTURE GALLERY ─────────────────────────────────────────────────────────

  const wrap = document.createElement("div");
  wrap.className = "tex-item";
  const img = document.createElement("img");
  img.src = t.path;
  img.title = t.name;
  img.addEventListener("click", () => loadLeafTexFromPath(t.path));
  wrap.appendChild(img);
  const label = document.createElement("div");
  label.className = "tex-label";
  label.textContent = t.name;
  wrap.appendChild(label);
  galleryEl.appendChild(wrap);
  galleryImgs.push(img);
});

function updateGallerySelection() {
  galleryImgs.forEach((img, i) => {
    img.classList.toggle("active", LEAF_TEXTURES[i].path === activeLeafTexPath);
  });

// ─── MATERIAL UNIFORMS ───────────────────────────────────────────────────────
const uTime        = uniform(0.0);
const uYMin        = uniform(0.0);
const uYMax        = uniform(8.0);
const uBottomColor = uniform(new THREE.Color("#2d5a1b"));
const uTopColor    = uniform(new THREE.Color("#5aaa2a"));
const uColorVar    = uniform(0.12);
const uAlphaCutoff = uniform(0.45);
const uSssColor    = uniform(new THREE.Color("#ffee55"));
const uSssStr      = uniform(0.55);
const uSssPow      = uniform(2.0);
const uRimColor    = uniform(new THREE.Color("#c8ffaa"));
const uRimStr      = uniform(0.38);
const uRimPow      = uniform(2.5);
const uAoStr       = uniform(0.45);
const uSunDir      = uniform(new THREE.Vector3(5, 12, 4).normalize());
const uWindSpeed   = uniform(0.9);
const uWindStr     = uniform(0.13);
const uWindMicro   = uniform(0.04);
const uCanopyCenter = uniform(new THREE.Vector3(0, 4, 0));
const uAoRadius     = uniform(6.0);
const uNormalBias   = uniform(0.75);
const uLeafWarp     = uniform(0.28);

// ─── LEAF MATERIAL (TSL) ─────────────────────────────────────────────────────
const aRand = attribute("aRand", "vec2");

const positionNode = Fn(() => {
  const phase      = aRand.x.mul(6.2832);
  const tipFactor  = positionLocal.y.add(0.5);
  const sway       = sin(uTime.mul(uWindSpeed).add(phase)).mul(uWindStr).mul(tipFactor);
  const micro      = sin(uTime.mul(3.1).add(phase.mul(2.6))).mul(uWindMicro).mul(tipFactor);
  const swayZ      = cos(uTime.mul(uWindSpeed.mul(0.8)).add(phase.mul(1.3))).mul(uWindStr.mul(0.5)).mul(tipFactor);
  return positionLocal.add(vec3(sway.add(micro), float(0), swayZ));
})();

// Sphere normal trick: leaves face outward from canopy center for uniform lighting
const wPos = modelWorldMatrix.mul(positionLocal);
const sphereDir = normalize(wPos.xyz.sub(uCanopyCenter));
const warpedNormal = normalize(normalLocal.add(sin(uv().x.mul(10)).mul(uLeafWarp)));
const finalNormal = normalize(mix(warpedNormal, sphereDir, uNormalBias));

const colorNode = Fn(() => {
  const h1 = aRand.x;
  const h2 = aRand.y;
  const heightFactor = clamp(
    positionWorld.y.sub(uYMin).div(max(uYMax.sub(uYMin), float(0.001))),
    float(0), float(1)
  );
  let col = mix(uBottomColor, uTopColor, heightFactor);
  const varMul = h1.mul(uColorVar.mul(2.0)).add(float(1.0).sub(uColorVar));
  col = col.mul(varMul);
  const hueShift = h2.sub(0.5).mul(uColorVar.mul(0.4));
  col = vec3(col.x.add(hueShift.mul(0.3)), col.y, col.z.sub(hueShift.mul(0.2)));
  // Height-based AO
  const aoHeight = mix(float(1.0).sub(uAoStr), float(1.0), heightFactor.mul(0.8).add(0.2));
  col = col.mul(aoHeight);
  // Sphere-distance AO: inner leaves darker
  const distC = clamp(length(sub(positionWorld, uCanopyCenter)).div(max(uAoRadius, float(0.001))), float(0), float(1));
  const aoSphere = mix(float(1.0).sub(uAoStr), float(1.0), distC);
  col = col.mul(aoSphere);
  const viewDir = normalize(cameraPosition.sub(positionWorld));
  const n = normalWorld;
  const backDot = max(dot(negate(uSunDir), n), float(0));
  const sss     = pow(backDot, uSssPow).mul(uSssStr);
  col = col.add(uSssColor.mul(sss));
  const rimDot = float(1.0).sub(max(dot(n, viewDir), float(0)));
  const rim    = pow(rimDot, uRimPow).mul(uRimStr);
  col = col.add(uRimColor.mul(rim));
  return clamp(col, float(0), float(2));
})();

const opacityNode = Fn(() => {
  return smoothstep(uAlphaCutoff.sub(0.05), uAlphaCutoff.add(0.05), leafMapNode.r);
})();

const leafMat = new MeshStandardNodeMaterial({
  side:        THREE.DoubleSide,
  transparent: false,
  alphaTest:   0.5,
  roughness:   0.88,
  metalness:   0.0,
  depthWrite:  true,
});
leafMat.positionNode = positionNode;
leafMat.normalNode   = finalNormal;
leafMat.colorNode    = colorNode;
leafMat.opacityNode  = opacityNode;
leafMat.envMapIntensity = 0;
leafMat.castShadowNode = Fn(() => {
  const a = smoothstep(uAlphaCutoff.sub(0.05), uAlphaCutoff.add(0.05), leafMapNode.r);
  a.lessThan(float(0.5)).discard();
  return vec4(0, 0, 0, 1);
})();

// ─── CLUSTER DEFINITIONS (6 slots) ──────────────────────────────────────────
function makeDefaultCluster(enabled, x, y, z) {
  return { enabled, x, y, z, rx: 2.0, ry: 1.5, count: 300, leafSize: 1.0, scaleVar: 0.3, shell: 0.5, shellThick: 0.4, tiltMax: 35 };
}

const clusterDefs = [
  { enabled: true,  x: 0,    y: 4.2, z: 0,    rx: 2.4, ry: 1.6, count: 500, leafSize: 1.0, scaleVar: 0.35, shell: 0.5, shellThick: 0.45, tiltMax: 35 },
  { enabled: false, x: 1.1,  y: 2.8, z: 0.4,  rx: 1.3, ry: 0.9, count: 200, leafSize: 0.85, scaleVar: 0.3,  shell: 0.45, shellThick: 0.4, tiltMax: 40 },
  { enabled: false, x: 0,    y: 5.6, z: 0,    rx: 1.0, ry: 0.7, count: 140, leafSize: 0.75, scaleVar: 0.25, shell: 0.55, shellThick: 0.35, tiltMax: 28 },
  makeDefaultCluster(false, -1.0, 3.0, -0.5),
  makeDefaultCluster(false, 0.5, 2.0, 0.8),
  makeDefaultCluster(false, 0, 1.5, 0),
];

// ─── UNDO / REDO ─────────────────────────────────────────────────────────────
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 40;

function captureState() {
  return {
    clusters: clusterDefs.map(c => ({ ...c })),
    material: {
      bottomColor: params.bottomColor, topColor: params.topColor,
      colorVar: params.colorVar, roughness: params.roughness, alphaCutoff: params.alphaCutoff,
      sssColor: params.sssColor, sssStr: params.sssStr, sssPow: params.sssPow,
      rimColor: params.rimColor, rimStr: params.rimStr, rimPow: params.rimPow,
      aoStr: params.aoStr, normalBias: params.normalBias, leafWarp: params.leafWarp,
    },
    wind: { windSpeed: params.windSpeed, windStr: params.windStr, windMicro: params.windMicro },
    trunkScale: params.trunkScale,
    bushMode: params.bushMode,
  };
}

function restoreState(state) {
  state.clusters.forEach((c, i) => { if (i < clusterDefs.length) Object.assign(clusterDefs[i], c); });
  if (state.material) {
    const m = state.material;
    params.bottomColor = m.bottomColor; uBottomColor.value.set(m.bottomColor);
    params.topColor    = m.topColor;    uTopColor.value.set(m.topColor);
    params.colorVar    = m.colorVar;    uColorVar.value    = m.colorVar;
    params.roughness   = m.roughness;
    params.alphaCutoff = m.alphaCutoff; uAlphaCutoff.value = m.alphaCutoff;
    params.sssColor = m.sssColor; uSssColor.value.set(m.sssColor);
    params.sssStr  = m.sssStr;  uSssStr.value  = m.sssStr;
    params.sssPow  = m.sssPow;  uSssPow.value  = m.sssPow;
    params.rimColor = m.rimColor; uRimColor.value.set(m.rimColor);
    params.rimStr  = m.rimStr;  uRimStr.value  = m.rimStr;
    params.rimPow  = m.rimPow;  uRimPow.value  = m.rimPow;
    params.aoStr   = m.aoStr;   uAoStr.value   = m.aoStr;
    if (m.normalBias != null) { params.normalBias = m.normalBias; uNormalBias.value = m.normalBias; }
    if (m.leafWarp   != null) { params.leafWarp   = m.leafWarp;   uLeafWarp.value   = m.leafWarp; }
  }
  if (state.wind) {
    params.windSpeed = state.wind.windSpeed; uWindSpeed.value = state.wind.windSpeed;
    params.windStr   = state.wind.windStr;   uWindStr.value   = state.wind.windStr;
    params.windMicro = state.wind.windMicro; uWindMicro.value = state.wind.windMicro;
  }
  if (state.trunkScale != null) {
    params.trunkScale = state.trunkScale;
    trunkScale = state.trunkScale;
    (trunkRoot || defaultTrunk).scale.setScalar(state.trunkScale);
  }
  if (state.bushMode != null) {
    params.bushMode = state.bushMode;
    defaultTrunk.visible = !state.bushMode && !trunkRoot;
    if (trunkRoot) trunkRoot.visible = !state.bushMode;
  }
  pane?.refresh();
  buildFoliage(true);
}

function pushUndo() {
  undoStack.push(captureState());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(captureState());
  restoreState(undoStack.pop());
  infoEl.textContent = `Undo (${undoStack.length} left)`;
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(captureState());
  restoreState(redoStack.pop());
  infoEl.textContent = `Redo (${redoStack.length} left)`;
}

window.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "z") { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === "y") { e.preventDefault(); redo(); }
});

let _undoTimer = null;
function scheduleUndo() {
  if (_undoTimer) clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => { pushUndo(); _undoTimer = null; }, 400);
}

// ─── ELLIPSOID SAMPLER ───────────────────────────────────────────────────────
function sampleCluster(c, seedOffset) {
  let lcg = (seedOffset * 1664525 + 1013904223) >>> 0;
  const rng = () => { lcg = (lcg * 1664525 + 1013904223) >>> 0; return lcg / 0xffffffff; };

  const positions = [];
  const maxTry    = c.count * 12;
  let   tries     = 0;

  while (positions.length < c.count && tries++ < maxTry) {
    const rx = rng() * 2 - 1;
    const ry = rng() * 2 - 1;
    const rz = rng() * 2 - 1;
    const d  = Math.sqrt(rx*rx + ry*ry + rz*rz);
    if (d > 1.0) continue;
    const innerR = 1.0 - c.shellThick;
    if (d < innerR && rng() < c.shell) continue;

    positions.push({
      x: c.x + rx * c.rx,
      y: c.y + ry * c.ry,
      z: c.z + rz * c.rx,
      leafSize: c.leafSize,
      scaleVar: c.scaleVar,
      tiltMax:  c.tiltMax,
    });
  }
  return positions;
}

// ─── FOLIAGE MESH BUILDER ────────────────────────────────────────────────────
let leavesMesh = null;

function sampleAllPositions() {
  const allPos = [];
  const allRands = [];
  clusterDefs.forEach((c, ci) => {
    if (!c.enabled) return;
    sampleCluster(c, ci * 999983 + 12345).forEach(p => {
      allPos.push(p);
      allRands.push(Math.random(), Math.random());
    });
  });
  return { allPos, allRands };
}

function buildLeafMesh(positions, rands, scaleMul, xOffset) {
  const n = positions.length;
  if (n === 0) return null;

  const geo = new THREE.PlaneGeometry(1, 1);
  const randData = new Float32Array(rands);
  geo.setAttribute("aRand", new THREE.InstancedBufferAttribute(randData, 2));

  const mesh = new THREE.InstancedMesh(geo, leafMat, n);
  mesh.frustumCulled  = false;
  mesh.castShadow     = true;
  mesh.receiveShadow  = false;

  const dummy   = new THREE.Object3D();
  const DEG2RAD = Math.PI / 180;

  positions.forEach((p, i) => {
    dummy.position.set(p.x + xOffset, p.y, p.z);
    dummy.rotation.order = "YXZ";
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.rotation.x = (Math.random() - 0.5) * p.tiltMax * DEG2RAD * 2;
    dummy.rotation.z = (Math.random() - 0.5) * p.tiltMax * DEG2RAD * 2;
    const s = Math.max(0.05, p.leafSize * scaleMul * (1 + (Math.random() - 0.5) * 2 * p.scaleVar));
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });

  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

function buildFoliage(skipUndo) {
  // Clean up main foliage
  if (leavesMesh) {
    scene.remove(leavesMesh);
    leavesMesh.geometry.dispose();
    leavesMesh = null;
  }
  // Clean up LOD previews
  clearLodPreviews();

  const { allPos, allRands } = sampleAllPositions();
  const n = allPos.length;

  if (n > 0) {
    // Compute bounds for shaders
    let yMin = Infinity, yMax = -Infinity;
    let xMin = Infinity, xMax = -Infinity, zMin = Infinity, zMax = -Infinity;
    allPos.forEach(p => {
      if (p.y < yMin) yMin = p.y; if (p.y > yMax) yMax = p.y;
      if (p.x < xMin) xMin = p.x; if (p.x > xMax) xMax = p.x;
      if (p.z < zMin) zMin = p.z; if (p.z > zMax) zMax = p.z;
    });
    uYMin.value = yMin - 0.3;
    uYMax.value = yMax + 0.5;
    // Canopy center + radius for sphere normals and sphere AO
    const cx = (xMin + xMax) * 0.5;
    const cy = (yMin + yMax) * 0.5;
    const cz = (zMin + zMax) * 0.5;
    uCanopyCenter.value.set(cx, cy, cz);
    const ext = Math.max(xMax - xMin, yMax - yMin, zMax - zMin);
    uAoRadius.value = ext * 0.62;

    // Build main tree (LOD0) — at origin or offset if LOD preview
    const xOff = lodPreview ? -LOD_SPACING : 0;
    leavesMesh = buildLeafMesh(allPos, allRands, 1.0, xOff);
    if (leavesMesh) scene.add(leavesMesh);

    // Build LOD previews if active
    if (lodPreview) {
      buildLodPreviews(allPos, allRands);
    }
  }

  updateStats();
  updateClusterHelpers();
  updateLodTrunkVisibility();
}

// ─── LOD PREVIEW SYSTEM ─────────────────────────────────────────────────────
let lodPreview = false;
let lodMesh1 = null;
let lodMesh2 = null;
let lodTrunk0Clone = null;
let lodTrunk1Clone = null;
let lodTrunk2Clone = null;

const lodLabelsEl  = document.getElementById("lod-labels");
const lodTag0      = document.getElementById("lod-tag-0");
const lodTag1      = document.getElementById("lod-tag-1");
const lodTag2      = document.getElementById("lod-tag-2");

function decimatePositions(allPos, allRands, keep) {
  const subPos = [];
  const subRands = [];
  const step = Math.max(1, Math.round(1 / keep));
  for (let i = 0; i < allPos.length; i += step) {
    subPos.push(allPos[i]);
    subRands.push(allRands[i * 2], allRands[i * 2 + 1]);
  }
  return { subPos, subRands };
}

function buildLodPreviews(allPos, allRands) {
  // LOD1: 50% leaves, 1.414× bigger
  const lod1 = decimatePositions(allPos, allRands, 0.5);
  lodMesh1 = buildLeafMesh(lod1.subPos, lod1.subRands, 1.414, 0);
  if (lodMesh1) scene.add(lodMesh1);

  // LOD2: 25% leaves, 2× bigger
  const lod2 = decimatePositions(allPos, allRands, 0.25);
  lodMesh2 = buildLeafMesh(lod2.subPos, lod2.subRands, 2.0, LOD_SPACING);
  if (lodMesh2) scene.add(lodMesh2);

  // Update stats
  params.lod1Leaves = lod1.subPos.length;
  params.lod2Leaves = lod2.subPos.length;

  // Clone trunks for LOD preview columns
  cloneTrunksForLod();

  updateLodLabels();
}

function cloneTrunksForLod() {
  clearLodTrunkClones();

  const srcTrunk = trunkRoot || defaultTrunk;
  const showTrunk = !params.bushMode;

  // LOD0 trunk (left)
  if (showTrunk) {
    lodTrunk0Clone = srcTrunk.clone();
    lodTrunk0Clone.position.x = -LOD_SPACING;
    if (srcTrunk === defaultTrunk) lodTrunk0Clone.position.y = 2.5;
    lodTrunk0Clone.scale.setScalar(trunkScale);
    scene.add(lodTrunk0Clone);
  }

  // LOD1 trunk (center) — use LOD1 trunk if loaded, else same as LOD0
  if (showTrunk) {
    const src1 = trunkLod1Root || srcTrunk;
    lodTrunk1Clone = src1.clone();
    lodTrunk1Clone.position.x = 0;
    if (src1 === defaultTrunk) lodTrunk1Clone.position.y = 2.5;
    lodTrunk1Clone.scale.setScalar(trunkScale);
    scene.add(lodTrunk1Clone);
  }

  // LOD2 trunk (right) — always use LOD1 trunk (lowest detail)
  if (showTrunk) {
    const src2 = trunkLod1Root || srcTrunk;
    lodTrunk2Clone = src2.clone();
    lodTrunk2Clone.position.x = LOD_SPACING;
    if (src2 === defaultTrunk) lodTrunk2Clone.position.y = 2.5;
    lodTrunk2Clone.scale.setScalar(trunkScale);
    scene.add(lodTrunk2Clone);
  }
}

function clearLodTrunkClones() {
  if (lodTrunk0Clone) { scene.remove(lodTrunk0Clone); lodTrunk0Clone = null; }
  if (lodTrunk1Clone) { scene.remove(lodTrunk1Clone); lodTrunk1Clone = null; }
  if (lodTrunk2Clone) { scene.remove(lodTrunk2Clone); lodTrunk2Clone = null; }
}

function clearLodPreviews() {
  if (lodMesh1) { scene.remove(lodMesh1); lodMesh1.geometry.dispose(); lodMesh1 = null; }
  if (lodMesh2) { scene.remove(lodMesh2); lodMesh2.geometry.dispose(); lodMesh2 = null; }
  clearLodTrunkClones();
}

function updateLodTrunkVisibility() {
  if (lodPreview) {
    // Hide main trunk in LOD preview (clones handle it)
    defaultTrunk.visible = false;
    if (trunkRoot) trunkRoot.visible = false;
  } else {
    defaultTrunk.visible = !params.bushMode && !trunkRoot;
    if (trunkRoot) trunkRoot.visible = !params.bushMode;
  }
}

function updateLodLabels() {
  if (!lodPreview) {
    lodLabelsEl.style.display = "none";
    return;
  }
  lodLabelsEl.style.display = "block";

  const n0 = leavesMesh ? leavesMesh.count : 0;
  const n1 = params.lod1Leaves || 0;
  const n2 = params.lod2Leaves || 0;
  const trunkLod1Str = trunkLod1Root ? "LOD1 trunk" : "same trunk";

  lodTag0.innerHTML = `LOD 0 — Full Detail<span class="lod-sub">${n0} leaves · < ${params.lodDist1}m · full trunk</span>`;
  lodTag1.innerHTML = `LOD 1 — Half Density<span class="lod-sub">${n1} leaves · 1.4× size · ${params.lodDist1}-${params.lodDist2}m · ${trunkLod1Str}</span>`;
  lodTag2.innerHTML = `LOD 2 — Quarter Density<span class="lod-sub">${n2} leaves · 2× size · ${params.lodDist2}m+ · ${trunkLod1Str}</span>`;
}

// Position LOD labels in screen space each frame
function updateLodLabelPositions() {
  if (!lodPreview) return;

  const offsets = [-LOD_SPACING, 0, LOD_SPACING];
  const tags = [lodTag0, lodTag1, lodTag2];
  const _vTop = new THREE.Vector3();
  const _vBot = new THREE.Vector3();

  offsets.forEach((xOff, i) => {
    // Project the base of the tree to get label position below it
    _vBot.set(xOff, 0, 0);
    _vBot.project(camera);
    const sx = (0.5 + _vBot.x * 0.5) * innerWidth;
    const sy = (0.5 - _vBot.y * 0.5) * innerHeight;
    tags[i].style.left = sx + "px";
    // Place label just below the ground line, clamped to screen
    tags[i].style.top  = Math.min(Math.max(sy + 8, 40), innerHeight - 50) + "px";
  });
}

function toggleLodPreview(on) {
  lodPreview = on;
  if (on) {
    controls.target.set(0, 3, 0);
    camera.position.set(0, 6, 22);
    controls.update();
  } else {
    controls.target.set(0, 3, 0);
    camera.position.set(7, 5, 10);
    controls.update();
  }
  buildFoliage(true);
  updateLodLabels();
}

// ─── CLUSTER WIREFRAME HELPERS ───────────────────────────────────────────────
const HELPER_COLORS = [0xffff00, 0x00ffff, 0xff8800, 0xff44ff, 0x44ff44, 0x4488ff];
let showHelpers = true;

const clusterHelpers = clusterDefs.map((c, i) => {
  const sGeo  = new THREE.SphereGeometry(1, 14, 7);
  const wfGeo = new THREE.WireframeGeometry(sGeo);
  const line  = new THREE.LineSegments(wfGeo, new THREE.LineBasicMaterial({
    color: HELPER_COLORS[i % HELPER_COLORS.length], transparent: true, opacity: 0.22,
  }));
  scene.add(line);
  return line;
});

const markerGeo = new THREE.SphereGeometry(0.18, 8, 6);
const clusterMarkers = clusterDefs.map((c, i) => {
  const mat = new THREE.MeshBasicMaterial({
    color: HELPER_COLORS[i % HELPER_COLORS.length], transparent: true, opacity: 0.6,
  });
  const mesh = new THREE.Mesh(markerGeo, mat);
  mesh.userData.clusterIdx = i;
  scene.add(mesh);
  return mesh;
});

function updateClusterHelpers() {
  const xOff = lodPreview ? -LOD_SPACING : 0;
  clusterDefs.forEach((c, i) => {
    clusterHelpers[i].position.set(c.x + xOff, c.y, c.z);
    clusterHelpers[i].scale.set(c.rx, c.ry, c.rx);
    clusterHelpers[i].visible = showHelpers && c.enabled;
    clusterMarkers[i].position.set(c.x + xOff, c.y, c.z);
    clusterMarkers[i].visible = showHelpers && c.enabled;
  });
}
updateClusterHelpers();

// ─── DRAG CLUSTER MARKERS ────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragCluster = -1;
let dragPlane = new THREE.Plane();
let dragOffset = new THREE.Vector3();
const _intersect = new THREE.Vector3();

renderer.domElement.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !showHelpers) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(clusterMarkers.filter((m, i) => clusterDefs[i].enabled));
  if (hits.length > 0) {
    const idx = hits[0].object.userData.clusterIdx;
    dragCluster = idx;
    pushUndo();
    controls.enabled = false;
    dragPlane.setFromNormalAndCoplanarPoint(
      camera.getWorldDirection(new THREE.Vector3()).negate(),
      hits[0].object.position
    );
    raycaster.ray.intersectPlane(dragPlane, _intersect);
    dragOffset.copy(hits[0].object.position).sub(_intersect);
    e.stopPropagation();
  }
});

renderer.domElement.addEventListener("pointermove", e => {
  if (dragCluster < 0) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (raycaster.ray.intersectPlane(dragPlane, _intersect)) {
    _intersect.add(dragOffset);
    const xOff = lodPreview ? -LOD_SPACING : 0;
    const c = clusterDefs[dragCluster];
    c.x = Math.round((_intersect.x - xOff) * 20) / 20;
    c.y = Math.max(0, Math.round(_intersect.y * 20) / 20);
    c.z = Math.round(_intersect.z * 20) / 20;
    buildFoliage(true);
    pane?.refresh();
  }
});

renderer.domElement.addEventListener("pointerup", () => {
  if (dragCluster >= 0) {
    dragCluster = -1;
    controls.enabled = true;
  }
});

// ─── TRUNK GLB LOADER ────────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(
  "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/libs/draco/",
);
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);
let trunkScale = 1.0;
let trunkFileName = "";
let trunkLod1FileName = "";
let _bushYShift = 0;

function loadTrunk(file) {
  const url = URL.createObjectURL(file);
  gltfLoader.load(url, (gltf) => {
    if (trunkRoot) scene.remove(trunkRoot);
    defaultTrunk.visible = false;
    trunkRoot = gltf.scene;
    trunkRoot.scale.setScalar(trunkScale);
    trunkRoot.visible = !params.bushMode && !lodPreview;
    trunkRoot.traverse(o => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });
    scene.add(trunkRoot);
    URL.revokeObjectURL(url);

    trunkFileName = file.name;

    const box = new THREE.Box3().setFromObject(trunkRoot);
    const h   = box.max.y - box.min.y;
    let tris = 0;
    trunkRoot.traverse(o => {
      if (o.isMesh && o.geometry.index) tris += o.geometry.index.count / 3;
    });
    params.trunkTris = Math.round(tris);

    infoEl.textContent =
      `Trunk LOD0: ${file.name} — ${tris} tris, height: ${h.toFixed(2)}  |  ` +
      `Tip Y ≈ ${box.max.y.toFixed(2)}  |  ` +
      `Suggested Cluster 1 Y: ${(box.max.y * 0.85).toFixed(2)}`;

    if (lodPreview) buildFoliage(true);
    pane?.refresh();
  }, undefined, (err) => {
    console.error("Trunk load error:", err);
  });
}

function loadTrunkLod1(file) {
  const url = URL.createObjectURL(file);
  gltfLoader.load(url, (gltf) => {
    if (trunkLod1Root) scene.remove(trunkLod1Root);
    trunkLod1Root = gltf.scene;
    trunkLod1Root.scale.setScalar(trunkScale);
    trunkLod1Root.visible = false; // never shown directly, only cloned in LOD preview
    trunkLod1Root.traverse(o => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });

    trunkLod1FileName = file.name;

    let tris = 0;
    trunkLod1Root.traverse(o => {
      if (o.isMesh && o.geometry.index) tris += o.geometry.index.count / 3;
    });
    params.trunkLod1Tris = Math.round(tris);

    infoEl.textContent = `Trunk LOD1: ${file.name} — ${tris} tris (${((tris / Math.max(1, params.trunkTris)) * 100).toFixed(0)}% of LOD0)`;

    if (lodPreview) buildFoliage(true);
    URL.revokeObjectURL(url);
    pane?.refresh();
  }, undefined, (err) => {
    console.error("Trunk LOD1 load error:", err);
  });
}

  defaultTrunk.visible = !enabled && !trunkRoot && !lodPreview;
  if (trunkRoot) trunkRoot.visible = !enabled && !lodPreview;

  if (enabled) {
    const enabledClusters = clusterDefs.filter(c => c.enabled);
    const minBottom = enabledClusters.length
      ? Math.min(...enabledClusters.map(c => c.y - c.ry))
      : 0;
    _bushYShift = Math.max(0, minBottom);
    if (_bushYShift > 0) {
      clusterDefs.forEach(c => { c.y -= _bushYShift; });
      buildFoliage(true);
      pane?.refresh();
    }
  } else {
    if (_bushYShift > 0) {
      clusterDefs.forEach(c => { c.y += _bushYShift; });
      _bushYShift = 0;
      buildFoliage(true);
      pane?.refresh();
    }
  }
}

// ─── PRESET SAVE / LOAD ──────────────────────────────────────────────────────
function buildPresetData() {
  return {
    presetName: params.presetName,
    trunkFile: trunkFileName,
    trunkLod1File: trunkLod1FileName,
    leafTexture: activeLeafTexPath || params.leafTexFile,
    clusters: clusterDefs.map(c => ({ ...c })),
    material: {
      bottomColor: params.bottomColor, topColor: params.topColor,
      colorVar: params.colorVar, roughness: params.roughness,
      alphaCutoff: params.alphaCutoff,
      sssColor: params.sssColor, sssStr: params.sssStr, sssPow: params.sssPow,
      rimColor: params.rimColor, rimStr: params.rimStr, rimPow: params.rimPow,
      aoStr: params.aoStr, normalBias: params.normalBias, leafWarp: params.leafWarp,
    },
    wind: { windSpeed: params.windSpeed, windStr: params.windStr, windMicro: params.windMicro },
    trunkScale: params.trunkScale,
    bushMode: params.bushMode,
    lodDistances: { lod1: params.lodDist1, lod2: params.lodDist2 },
  };
}

async function savePreset() {
  const json = JSON.stringify(buildPresetData(), null, 2);
  const name = (params.presetName || "preset").replace(/[^a-z0-9_\-]/gi, "_");
  if (window.showSaveFilePicker) {
    try {
      const handle = await showSaveFilePicker({
        suggestedName: name + ".json",
        types: [{ description: "Tree preset", accept: { "application/json": [".json"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      infoEl.textContent = `Preset saved: ${name}.json — trunk: ${trunkFileName || "(default)"}, texture: ${activeLeafTexPath || "(custom)"}`;
    } catch (e) { if (e.name !== "AbortError") console.error(e); }
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = name + ".json";
    a.click();
  }
}

function applyPresetData(data) {
  if (data.clusters) {
    data.clusters.forEach((c, i) => {
      if (i < clusterDefs.length) Object.assign(clusterDefs[i], c);
    });
    for (let i = data.clusters.length; i < clusterDefs.length; i++) {
      clusterDefs[i].enabled = false;
    }
  }
  if (data.material) {
    const m = data.material;
    if (m.bottomColor) { params.bottomColor = m.bottomColor; uBottomColor.value.set(m.bottomColor); }
    if (m.topColor)    { params.topColor    = m.topColor;    uTopColor.value.set(m.topColor); }
    if (m.colorVar    != null) { params.colorVar    = m.colorVar;    uColorVar.value    = m.colorVar; }
    if (m.roughness   != null) { params.roughness   = m.roughness; }
    if (m.alphaCutoff != null) { params.alphaCutoff = m.alphaCutoff; uAlphaCutoff.value = m.alphaCutoff; }
    if (m.sssColor) { params.sssColor = m.sssColor; uSssColor.value.set(m.sssColor); }
    if (m.sssStr  != null) { params.sssStr  = m.sssStr;  uSssStr.value  = m.sssStr; }
    if (m.sssPow  != null) { params.sssPow  = m.sssPow;  uSssPow.value  = m.sssPow; }
    if (m.rimColor) { params.rimColor = m.rimColor; uRimColor.value.set(m.rimColor); }
    if (m.rimStr  != null) { params.rimStr  = m.rimStr;  uRimStr.value  = m.rimStr; }
    if (m.rimPow  != null) { params.rimPow  = m.rimPow;  uRimPow.value  = m.rimPow; }
    if (m.aoStr   != null) { params.aoStr   = m.aoStr;   uAoStr.value   = m.aoStr; }
    if (m.normalBias != null) { params.normalBias = m.normalBias; uNormalBias.value = m.normalBias; }
    if (m.leafWarp   != null) { params.leafWarp   = m.leafWarp;   uLeafWarp.value   = m.leafWarp; }
  }
  if (data.wind) {
    const w = data.wind;
    if (w.windSpeed != null) { params.windSpeed = w.windSpeed; uWindSpeed.value = w.windSpeed; }
    if (w.windStr   != null) { params.windStr   = w.windStr;   uWindStr.value   = w.windStr; }
    if (w.windMicro != null) { params.windMicro = w.windMicro; uWindMicro.value = w.windMicro; }
  }
  if (data.trunkScale != null) {
    params.trunkScale = data.trunkScale;
    trunkScale = data.trunkScale;
    (trunkRoot || defaultTrunk).scale.setScalar(data.trunkScale);
  }
  if (data.lodDistances) {
    if (data.lodDistances.lod1 != null) params.lodDist1 = data.lodDistances.lod1;
    if (data.lodDistances.lod2 != null) params.lodDist2 = data.lodDistances.lod2;
  }
  if (data.presetName) params.presetName = data.presetName;
  if (data.leafTexture && data.leafTexture.startsWith("textures/")) {
    loadLeafTexFromPath(data.leafTexture);
  }
  if (data.bushMode != null) {
    params.bushMode = data.bushMode;
    applyBushMode(data.bushMode);
  }
  pane.refresh();
  buildFoliage(true);
}

function loadPresetFromFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      pushUndo();
      applyPresetData(JSON.parse(ev.target.result));
      infoEl.textContent = `Preset loaded from ${file.name}`;
    } catch (e) { infoEl.textContent = "Invalid preset file: " + e.message; }
  };
  reader.readAsText(file);
}

// ─── UI ──────────────────────────────────────────────────────────────────────
const pane = new Pane({ title: "Tree Editor", container: document.getElementById("ui") });

// ── Built-in Presets
const presetListF = pane.addFolder({ title: "Quick Presets", expanded: true });
Object.keys(TREE_PRESETS).forEach(name => {

    pushUndo();
    params.activePreset = name;
    params.presetName = name.toLowerCase().replace(/\s+/g, "_");

});

// ── LOD Preview
pane.addBlade({ view: "separator" });
const lodF = pane.addFolder({ title: "LOD Preview", expanded: true });
lodF.addBinding(params, "lodPreview", { label: "Show LOD side-by-side" })
  .on("change", ev => toggleLodPreview(ev.value));
lodF.addBlade({ view: "separator" });
lodF.addBinding(params, "lodDist1", { label: "LOD0 → LOD1 dist", min: 20, max: 300, step: 5 })
  .on("change", () => updateLodLabels());
lodF.addBinding(params, "lodDist2", { label: "LOD1 → LOD2 dist", min: 50, max: 600, step: 10 })
  .on("change", () => updateLodLabels());
lodF.addBlade({ view: "separator" });
lodF.addBinding(params, "lod1Leaves",  { label: "LOD1 leaves", readonly: true });
lodF.addBinding(params, "lod2Leaves",  { label: "LOD2 leaves", readonly: true });

// ── Trunk
const trunkF = pane.addFolder({ title: "Trunk", expanded: true });
trunkF.addBinding(params, "bushMode", { label: "Bush mode (no trunk)" })
  .on("change", ev => { pushUndo(); applyBushMode(ev.value); });
trunkF.addBlade({ view: "separator" });
trunkF.addButton({ title: "Load Trunk GLB (LOD0)" }).on("click", () => {
  const i = document.createElement("input");
  i.type = "file"; i.accept = ".glb,.gltf";
  i.onchange = () => i.files[0] && loadTrunk(i.files[0]);
  i.click();
});
trunkF.addButton({ title: "Load Trunk GLB (LOD1 — decimated)" }).on("click", () => {
  const i = document.createElement("input");
  i.type = "file"; i.accept = ".glb,.gltf";
  i.onchange = () => i.files[0] && loadTrunkLod1(i.files[0]);
  i.click();
});
trunkF.addButton({ title: "Reset to default cylinder" }).on("click", () => {
  if (trunkRoot) { scene.remove(trunkRoot); trunkRoot = null; }
  if (trunkLod1Root) { trunkLod1Root = null; }
  defaultTrunk.visible = !lodPreview;
  trunkFileName = "";
  trunkLod1FileName = "";
  params.trunkTris = 0;
  params.trunkLod1Tris = 0;
  if (lodPreview) buildFoliage(true);
  pane.refresh();
  infoEl.textContent = "Trunk reset to default cylinder";
});
trunkF.addBinding(params, "trunkScale", { label: "Trunk scale", min: 0.01, max: 8, step: 0.01 })
  .on("change", ev => {
    trunkScale = ev.value;
    (trunkRoot || defaultTrunk).scale.setScalar(ev.value);
    if (trunkLod1Root) trunkLod1Root.scale.setScalar(ev.value);
    if (lodPreview) buildFoliage(true);
    scheduleUndo();
  });
trunkF.addBinding(params, "trunkTris",     { label: "LOD0 triangles", readonly: true });
trunkF.addBinding(params, "trunkLod1Tris", { label: "LOD1 triangles", readonly: true });

// ── Leaf Texture
const leafTexF = pane.addFolder({ title: "Leaf Texture", expanded: true });
leafTexF.addButton({ title: "Load Custom PNG / JPG" }).on("click", () => {
  const i = document.createElement("input");
  i.type = "file"; i.accept = "image/*";
  i.onchange = () => { if (i.files[0]) { loadLeafTexFromFile(i.files[0]); } };
  i.click();
});
leafTexF.addButton({ title: "Reset to solid (no texture)" }).on("click", () => {
  leafMapNode.value = new THREE.Texture();
  activeLeafTexPath = "";
  params.leafTexFile = "";
  updateGallerySelection();
});
leafTexF.addBinding(params, "alphaCutoff", { label: "Alpha cutoff", min: 0, max: 1, step: 0.01 })
  .on("change", ev => { uAlphaCutoff.value = ev.value; scheduleUndo(); });

// ── Clusters (6 slots)
const CLUSTER_COLORS = ["yellow", "cyan", "orange", "magenta", "green", "blue"];
const clusterFolders = [];

clusterDefs.forEach((c, ci) => {
  const cf = pane.addFolder({ title: `Cluster ${ci + 1} (${CLUSTER_COLORS[ci]})`, expanded: ci === 0 });
  clusterFolders.push(cf);

  cf.addBinding(c, "enabled", { label: "Enabled" }).on("change", () => { scheduleUndo(); buildFoliage(true); });

  cf.addButton({ title: "Duplicate to next empty slot" }).on("click", () => {
    const target = clusterDefs.findIndex((cc, ii) => ii > ci && !cc.enabled);
    if (target < 0) { infoEl.textContent = "No empty slot available"; return; }
    pushUndo();
    Object.assign(clusterDefs[target], { ...c });
    clusterDefs[target].x += 0.5;
    clusterDefs[target].enabled = true;
    buildFoliage(true);
    pane.refresh();
    infoEl.textContent = `Duplicated cluster ${ci + 1} → ${target + 1}`;
  });

  cf.addBlade({ view: "separator" });
  cf.addBinding(c, "x",          { label: "X",              min: -10,  max: 10,   step: 0.05 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "y",          { label: "Y",              min: 0,    max: 20,   step: 0.05 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "z",          { label: "Z",              min: -10,  max: 10,   step: 0.05 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBlade({ view: "separator" });
  cf.addBinding(c, "rx",         { label: "Radius XZ",      min: 0.2,  max: 10,   step: 0.05 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "ry",         { label: "Radius Y",       min: 0.2,  max: 8,    step: 0.05 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBlade({ view: "separator" });
  cf.addBinding(c, "count",      { label: "Leaf count",     min: 10,   max: 2000, step: 10   }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "leafSize",   { label: "Leaf size",      min: 0.05, max: 4,    step: 0.05 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "scaleVar",   { label: "Scale variation",min: 0,    max: 0.9,  step: 0.01 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBlade({ view: "separator" });
  cf.addBinding(c, "shell",      { label: "Shell bias",     min: 0,    max: 1,    step: 0.01 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "shellThick", { label: "Shell thickness",min: 0.05, max: 0.98, step: 0.01 }).on("change", () => { scheduleUndo(); buildFoliage(true); });
  cf.addBinding(c, "tiltMax",    { label: "Max tilt",       min: 0,    max: 90,   step: 1    }).on("change", () => { scheduleUndo(); buildFoliage(true); });
});

// ── Leaf Material
const matF = pane.addFolder({ title: "Leaf Colors", expanded: false });
matF.addBinding(params, "bottomColor", { label: "Base color",  view: "color" }).on("change", ev => { uBottomColor.value.set(ev.value); scheduleUndo(); });
matF.addBinding(params, "topColor",    { label: "Top color",   view: "color" }).on("change", ev => { uTopColor.value.set(ev.value); scheduleUndo(); });
matF.addBinding(params, "colorVar",    { label: "Tint variation", min: 0, max: 0.6, step: 0.01 }).on("change", ev => { uColorVar.value = ev.value; scheduleUndo(); });
matF.addBinding(params, "roughness",   { label: "Roughness",   min: 0, max: 1, step: 0.01 })
  .on("change", ev => { if (leavesMesh) leavesMesh.material.roughness = ev.value; scheduleUndo(); });

// ── SSS & Rim
const lightF = pane.addFolder({ title: "SSS & Rim Light", expanded: false });
lightF.addBinding(params, "sssColor", { label: "SSS color",    view: "color" }).on("change", ev => { uSssColor.value.set(ev.value); scheduleUndo(); });
lightF.addBinding(params, "sssStr",   { label: "SSS strength", min: 0, max: 2,   step: 0.01 }).on("change", ev => { uSssStr.value = ev.value; scheduleUndo(); });
lightF.addBinding(params, "sssPow",   { label: "SSS falloff",  min: 0.5, max: 10, step: 0.1  }).on("change", ev => { uSssPow.value = ev.value; scheduleUndo(); });
lightF.addBlade({ view: "separator" });
lightF.addBinding(params, "rimColor", { label: "Rim color",    view: "color" }).on("change", ev => { uRimColor.value.set(ev.value); scheduleUndo(); });
lightF.addBinding(params, "rimStr",   { label: "Rim strength", min: 0, max: 2,   step: 0.01 }).on("change", ev => { uRimStr.value = ev.value; scheduleUndo(); });
lightF.addBinding(params, "rimPow",   { label: "Rim sharpness",min: 0.5, max: 10, step: 0.1 }).on("change", ev => { uRimPow.value = ev.value; scheduleUndo(); });
lightF.addBlade({ view: "separator" });
lightF.addBinding(params, "aoStr",    { label: "AO strength",  min: 0, max: 1,   step: 0.01 }).on("change", ev => { uAoStr.value = ev.value; scheduleUndo(); });
lightF.addBlade({ view: "separator" });
lightF.addBinding(params, "normalBias", { label: "Normal bias (sphere)", min: 0, max: 1, step: 0.01 }).on("change", ev => { uNormalBias.value = ev.value; scheduleUndo(); });
lightF.addBinding(params, "leafWarp",   { label: "Leaf warp",           min: 0, max: 1, step: 0.01 }).on("change", ev => { uLeafWarp.value = ev.value; scheduleUndo(); });

// ── Wind
const windF = pane.addFolder({ title: "Wind", expanded: false });
windF.addBinding(params, "windSpeed", { label: "Speed",    min: 0, max: 5,   step: 0.05 }).on("change", ev => { uWindSpeed.value = ev.value; scheduleUndo(); });
windF.addBinding(params, "windStr",   { label: "Strength", min: 0, max: 0.8, step: 0.005 }).on("change", ev => { uWindStr.value = ev.value; scheduleUndo(); });
windF.addBinding(params, "windMicro", { label: "Micro sway",min: 0, max: 0.3, step: 0.005 }).on("change", ev => { uWindMicro.value = ev.value; scheduleUndo(); });

// ── Scene & Lighting
const sceneF = pane.addFolder({ title: "Scene", expanded: false });
sceneF.addBinding(params, "bgColor",      { label: "Sky color",    view: "color" })
  .on("change", ev => { scene.background.set(ev.value); scene.fog.color.set(ev.value); });
sceneF.addBinding(params, "sunIntensity", { label: "Sun intensity", min: 0, max: 6,   step: 0.05 }).on("change", ev => sun.intensity = ev.value);
sceneF.addBinding(params, "ambientInt",   { label: "Ambient light", min: 0, max: 3,   step: 0.05 }).on("change", ev => hemi.intensity = ev.value);
sceneF.addBlade({ view: "separator" });
const syncSun = () => {
  sun.position.set(params.sunX, params.sunY, params.sunZ);
  uSunDir.value.set(params.sunX, params.sunY, params.sunZ);
  uSunDir.value.normalize();
};
sceneF.addBinding(params, "sunX", { label: "Sun X", min: -20, max: 20, step: 0.5 }).on("change", syncSun);
sceneF.addBinding(params, "sunY", { label: "Sun Y", min: 0.5, max: 20, step: 0.5 }).on("change", syncSun);
sceneF.addBinding(params, "sunZ", { label: "Sun Z", min: -20, max: 20, step: 0.5 }).on("change", syncSun);
sceneF.addBlade({ view: "separator" });
sceneF.addBinding(params, "showFog",    { label: "Show fog"     }).on("change", ev => { scene.fog = ev.value ? new THREE.FogExp2(params.bgColor, 0.018) : null; });
sceneF.addBinding(params, "showGround",  { label: "Show ground"  }).on("change", ev => ground.visible = ev.value);
sceneF.addBinding(params, "showHelpers", { label: "Show helpers (draggable)" })
  .on("change", ev => { showHelpers = ev.value; updateClusterHelpers(); });

// ── Stats
const statsF = pane.addFolder({ title: "Stats", expanded: true });
statsF.addBinding(params, "trunkTris",     { label: "Trunk LOD0 tris",  readonly: true });
statsF.addBinding(params, "trunkLod1Tris", { label: "Trunk LOD1 tris",  readonly: true });
statsF.addBinding(params, "totalLeaves",   { label: "LOD0 leaves",      readonly: true });
statsF.addBinding(params, "totalLeafTris", { label: "LOD0 leaf tris",   readonly: true });

// ── Actions
pane.addBlade({ view: "separator" });
pane.addButton({ title: "Rebuild Foliage" }).on("click", () => buildFoliage(true));

// ── Preset Save / Load
pane.addBlade({ view: "separator" });
const presetF = pane.addFolder({ title: "Save / Load", expanded: true });
presetF.addBinding(params, "presetName", { label: "Preset name" });
presetF.addButton({ title: "Save Preset to File" }).on("click", savePreset);
presetF.addButton({ title: "Load Preset from File" }).on("click", () => {
  const i = document.createElement("input");
  i.type = "file"; i.accept = ".json";
  i.onchange = () => i.files[0] && loadPresetFromFile(i.files[0]);
  i.click();
});
presetF.addBlade({ view: "separator" });
presetF.addButton({ title: "Copy to Clipboard" }).on("click", () => {
  const json = JSON.stringify(buildPresetData(), null, 2);
  navigator.clipboard.writeText(json)
    .then(() => infoEl.textContent = "Settings copied to clipboard!")
    .catch(() => {
      const ta = document.createElement("textarea");
      ta.value = json;
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      infoEl.textContent = "Settings copied!";
    });
});

// ─── INFO BAR ────────────────────────────────────────────────────────────────
const infoEl = document.getElementById("info");

// ─── INITIAL BUILD ───────────────────────────────────────────────────────────
buildFoliage(true);

// ─── RENDER LOOP ─────────────────────────────────────────────────────────────
const timer = new THREE.Timer();
renderer.setAnimationLoop(() => {
  timer.update();
  uTime.value = timer.getElapsed();
  controls.update();
  if (lodPreview) updateLodLabelPositions();
  renderer.render(scene, camera);
});

// ─── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
