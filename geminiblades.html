<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arc-Control Floppy Grass</title>
    <style>
      body {
        margin: 0;
        background-color: #020406;
        overflow: hidden;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #tweakpane-scroll {
        position: fixed;
        top: 0;
        right: 0;
        width: 300px;
        height: 100vh;
        max-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        z-index: 100;
        pointer-events: auto;
        box-sizing: border-box;
        overscroll-behavior: contain;
      }
      #tweakpane-scroll::-webkit-scrollbar {
        width: 10px;
      }
      #tweakpane-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 5px;
      }
      #tweakpane-scroll::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="tweakpane-scroll" aria-label="Settings panel"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import {
        float,
        vec3,
        Fn,
        positionLocal,
        normalLocal,
        time,
        sin,
        cos,
        uv,
        mix,
        uniform,
        attribute,
        mx_noise_float,
        smoothstep,
        normalize,
        sub,
        min,
        max,
        negate,
        abs,
        dot,
        atan,
        vec2,
        vec4,
        fract,
        PI,
        modelWorldMatrix,
        modelWorldMatrixInverse,
        cameraPosition,
        length,
        pow,
        clamp,
        varying,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { Pane } from "tweakpane";
      import Stats from "stats-gl";

      let camera, scene, renderer, controls;

      init();

      async function init() {
        scene = new THREE.Scene();

        renderer = new THREE.WebGPURenderer({ antialias: true });
        await renderer.init();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          500000,
        );
        camera.position.set(0, 40, 100);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const params = {
          windSpeed: 0.2,
          windStrength: 1.4,
          maxAngle: 1.4,      // safe max total bend — no blade ever exceeds this
          naturalLean: 0.9,   // max resting lean (each blade gets 0..this randomly)
          clumpScale: 5.0,    // world-unit radius of each clump
          clumpStrength: 0.7, // 0 = fully random, 1 = fully clumped
          crossed: true,      // add a second ribbon rotated 90° per blade
          colorVariation: false,      // enable hue/saturation variation
          cvHueSpread: 0.08,          // max hue shift from base (0 = no hue change)
          cvSatSpread: 0.3,           // saturation variation range (0 = uniform)
          cvDryAmount: 0.15,          // fraction of blades that turn dry/yellow
          cvDryColor: "#8a7a3a",      // dry/dead blade tint
          aoBase: 0.25,       // brightness at blade base (0 = black, 1 = no AO)
          aoPower: 2.0,       // curve — higher = AO more concentrated near base
          windAngle: 0,       // degrees — direction the wind travels (0 = +X)
          windWaveScale: 0.12, // spatial frequency: larger = tighter waves
          bendFocus: 1.0, // The 'Curve' control
          stiffness: 0.2, // How much of the base is 'unbendable'
          bladeHeight: 10,
          bladeWidth: 0.8,
          tipTaperStart: 0.7,
          bladeYSegments: 8,
          bladeColor: "#0e300e",
          tipColor: "#004d05",
          doubleSide: false,
          bssIntensity: 1.2,    // backscatter strength
          bssPower: 2.0,        // falloff sharpness (lower = wider glow)
          bssColor: "#2d7a2d",  // transmitted light color
          skyBlend: 0.35,       // blend normal toward (0,1,0) — fixes dark side
          cylindrical: 0.3,     // fan normals across blade width (cylinder illusion)
          roundCrossSection: 0, // legacy, keep for compat
          viewThicken: 0.45, // yaw toward camera when edge-on (0 = off)
          sunIntensity: 3,
          sunColor: "#ffffff",
          sunX: 5,
          sunY: 10,
          sunZ: 5,
          ambientIntensity: 0.2,
          ambientColor: "#ffffff",
          skyTurbidity: 2,
          skyRayleigh: 0.5,
          skyMie: 0.005,
          skyMieG: 0.8,
          environmentIntensity: 0.45,
          grassReceiveShadow: true,   // grass receives shadows from other objects
          grassCastShadow: false,     // grass casts shadows (expensive)
          shadowDebug: false,         // show torusknot to test shadow receiving
          specular: false,            // enable waxy specular sheen
          specRoughness: 0.55,       // blade roughness when specular is on
          specEnvIntensity: 0.15,    // env map reflection when specular is on
          groundPlane: true,          // show ground plane under grass
          groundColor: "#1a2e0a",    // dark earthy green
          fieldSize: 10,    // size of ONE patch (world units)
          grassCount: 300,  // blades per patch HIGH
          lodEnabled: false,       // enable LOD system (camera-relative grid)
          lodMidDistance: 40,      // HIGH→MID swap distance
          lodFarDistance: 80,      // MID→FAR swap distance
          lodMaxDistance: 200,     // absolute cutoff (no grass beyond)
          lodMidSegments: 3,       // segment count for MID LOD
          lodMidGrassCount: 150,   // blades per patch MID
          lodFarSegments: 1,       // segment count for FAR LOD (single quad)
          lodFarGrassCount: 80,    // blades per patch FAR (minimal)
          lodDebug: false,         // tint HIGH=green, MID=yellow, FAR=blue
          // Camera / player
          cameraMode: "orbit",       // "orbit" or "follow"
          playerSpeed: 30,           // world units per second
          playerSprintMul: 2.5,      // speed multiplier when holding Shift
          camFollowHeight: 12,       // Y offset above capsule
          camFollowDist: 25,         // distance behind capsule
          camFollowSmooth: 5,        // lerp speed for camera follow
          capsuleVisible: true,      // show/hide capsule mesh
        };

        const uWindSpeed = uniform(params.windSpeed);
        const uWindStrength = uniform(params.windStrength);
        const uMaxAngle = uniform(params.maxAngle);
        const uNaturalLean = uniform(params.naturalLean);
        const uClumpScale = uniform(params.clumpScale);
        const uClumpStrength = uniform(params.clumpStrength);
        const uCrossed = uniform(1);
        const uColorVar = uniform(0);
        const uCvHueSpread = uniform(params.cvHueSpread);
        const uCvSatSpread = uniform(params.cvSatSpread);
        const uCvDryAmount = uniform(params.cvDryAmount);
        const uCvDryCol = uniform(new THREE.Color(params.cvDryColor));
        const uAoBase = uniform(params.aoBase);
        const uAoPower = uniform(params.aoPower);
        const uWindDirX = uniform(1.0);
        const uWindDirZ = uniform(0.0);
        const uWindWaveScale = uniform(params.windWaveScale);
        const uBendFocus = uniform(params.bendFocus);
        const uStiffness = uniform(params.stiffness);
        const uBladeCol = uniform(new THREE.Color(params.bladeColor));
        const uTipCol = uniform(new THREE.Color(params.tipColor));
        const uRoundCross = uniform(params.roundCrossSection);
        const uSkyBlend = uniform(params.skyBlend);
        // Terrain normal — (0,1,0) on flat ground, replace with sampled heightmap
        // normal when porting to index.html. Interface is ready, value changes later.
        const uGroundNormal = uniform(new THREE.Vector3(0, 1, 0));
        const uCylindrical = uniform(params.cylindrical);
        const uViewThicken = uniform(params.viewThicken);
        const uBladeHeight = uniform(params.bladeHeight);
        const uSunDir = uniform(new THREE.Vector3(params.sunX, params.sunY, params.sunZ).normalize());
        const vCustomNormal = varying(vec3(0, 1, 0), 'vCN');
        const vClumpShade = varying(float(1), 'vCS');
        const vColorTint = varying(vec3(1, 1, 1), 'vCT');  // warm/cool tint target
        const vDryBlend = varying(float(0), 'vDB');         // dry blade factor
        const uBssCol = uniform(new THREE.Color(params.bssColor));
        const uBssIntensity = uniform(params.bssIntensity);
        const uBssPower = uniform(params.bssPower);
        const uLodEnabled = uniform(0);
        const uLodMidDist = uniform(params.lodMidDistance);
        const uLodFarDist = uniform(params.lodFarDistance);
        const uLodMaxDist = uniform(params.lodMaxDistance);
        const uLodDebug = uniform(0);
        const vLodMorph = varying(float(0), 'vLM');

        // High roughness + no env specular: thin DoubleSide blades otherwise pick up
        // sharp IBL streaks and floor Z-fight shimmer that read as “weird lines” up close.
        const material = new THREE.MeshStandardNodeMaterial({
          side: THREE.FrontSide,
          roughness: 0.92,
          metalness: 0,
        });
        material.envMapIntensity = 0;
        material.polygonOffset = true;
        material.polygonOffsetFactor = 1;
        material.polygonOffsetUnits = 1;

        const vUv = uv();

        const rotY = (ang, v) => {
          const c = cos(ang),
            s = sin(ang);
          return vec3(
            v.x.mul(c).add(v.z.mul(s)),
            v.y,
            negate(v.x).mul(s).add(v.z.mul(c)),
          );
        };

        // Bend-aware “rounded blade” normals: tangent along spine, ribbon normal,
        // then yaw ±spread across width (grass-sandbox style), spread scaled by UI.
        material.positionNode = Fn(() => {
          const off = attribute("offset", "vec3");
          const aPhase = attribute("aPhase", "float");
          const aIsCross = attribute("aIsCross", "float");
          const tBase = time.mul(uWindSpeed);
          const tBlade = tBase.add(aPhase);

          // World-space blade base — used for wave UV and per-blade hashes.
          // Using world position means patches share a seamless wave and
          // blades at the same local offset in different patches look different.
          const bladeWorld = modelWorldMatrix.mul(vec4(off.x, float(0), off.z, float(1))).xyz;
          const bladeXZ = vec2(bladeWorld.x, bladeWorld.z);

          // LOD: per-blade distance to camera for morph + fade
          const camXZ = vec2(cameraPosition.x, cameraPosition.z);
          const bladeCamDist = length(bladeXZ.sub(camXZ));
          // lodMorph: 0 = HIGH detail, 0.5 = MID, 1.0 = FAR (used for shader simplification + debug)
          const morphToMid = smoothstep(uLodMidDist.mul(float(0.6)), uLodMidDist, bladeCamDist);
          const morphToFar = smoothstep(uLodFarDist.mul(float(0.8)), uLodFarDist, bladeCamDist);
          const lodMorph = uLodEnabled.mul(mix(morphToMid.mul(float(0.5)), float(0.5).add(morphToFar.mul(float(0.5))), morphToFar));
          vLodMorph.assign(lodMorph);
          // distFade: 1 = full size, 0 = collapsed (blade disappears at maxDist)
          const distFade = mix(float(1), smoothstep(uLodMaxDist, uLodMaxDist.mul(float(0.8)), bladeCamDist), uLodEnabled);

          const h0 = fract(
            sin(dot(bladeXZ, vec2(127.1, 311.7))).mul(float(43758.5453)),
          );
          const h1 = fract(
            sin(dot(bladeXZ, vec2(269.5, 183.3))).mul(float(43758.5453)),
          );
          const h2 = fract(
            sin(dot(bladeXZ, vec2(419.2, 371.9))).mul(float(43758.5453)),
          );
          const h3 = fract(
            sin(dot(bladeXZ, vec2(371.2, 113.7))).mul(float(43758.5453)),
          );
          // --- Clump cell (Voronoi-style) ---
          // Divide world into cells; each cell has a random center = the clump center.
          // Blades near that center inherit the clump's personality.
          const cellP = bladeXZ.div(uClumpScale);
          const cellID = cellP.floor();
          const cellFrac = fract(cellP);
          const cA = fract(sin(dot(cellID, vec2(127.1, 311.7))).mul(float(43758.5453)));
          const cB = fract(sin(dot(cellID, vec2(269.5, 183.3))).mul(float(43758.5453)));
          const cC = fract(sin(dot(cellID, vec2(419.2, 371.9))).mul(float(43758.5453)));
          const cD = fract(sin(dot(cellID, vec2(113.5, 271.9))).mul(float(43758.5453)));
          // How close this blade is to its clump center (1 = at center, 0 = at edge)
          const clumpDist = length(vec2(cA, cB).sub(cellFrac));
          const clumpInfluence = smoothstep(float(0.75), float(0.05), clumpDist).mul(uClumpStrength);

          // Blend individual random values toward clump values
          const randomYaw = mix(h0.mul(PI.mul(2)), cC.mul(PI.mul(2)), clumpInfluence);
          const hScale = mix(float(0.75), float(1.5), h2);
          const clumpHeightScale = mix(float(0.6), float(1.4), cA);
          const naturalLean = mix(h3.mul(uNaturalLean), cD.mul(uNaturalLean), clumpInfluence);
          const bladeH = uBladeHeight.mul(mix(hScale, clumpHeightScale, clumpInfluence));
          // Cross ribbon: +90° yaw, collapsed to zero height when uCrossed=0
          const crossedYaw = randomYaw.add(aIsCross.mul(PI.mul(0.5)));
          const crossedBladeH = bladeH.mul(mix(float(1.0), uCrossed, aIsCross));
          // LOD fade: collapse blade height to 0 at maxDistance
          const finalBladeH = crossedBladeH.mul(distFade);
          // Clump color tint — passed to colorNode via varying
          vClumpShade.assign(mix(float(1.0), mix(float(0.82), float(1.18), cB), clumpInfluence));

          // Color variation hashes — computed here (vertex) to avoid fragment precision issues
          const h4 = fract(sin(dot(bladeXZ, vec2(537.3, 197.1))).mul(float(43758.5453)));
          const h5 = fract(sin(dot(bladeXZ, vec2(419.7, 631.2))).mul(float(43758.5453)));
          // Warm/cool tint target per blade
          const warmCol = vec3(0.18, 0.28, 0.02);
          const coolCol = vec3(0.02, 0.18, 0.08);
          vColorTint.assign(mix(warmCol, coolCol, h4));
          // Dry blade factor: blades with h5 < dryAmount become dry
          const isDry = smoothstep(uCvDryAmount, float(0.0), h5);
          vDryBlend.assign(isDry);

          const baseStiffness = smoothstep(0.0, uStiffness, vUv.y);
          const curveWeight = vUv.y.pow(uBendFocus).mul(baseStiffness);

          // Traveling wave: noise sampled at world XZ + windDir*time
          // so blades at different positions feel different force → rolling wave
          const waveUV = vec3(
            bladeWorld.x.mul(uWindWaveScale).add(uWindDirX.mul(tBase)),
            float(0),
            bladeWorld.z.mul(uWindWaveScale).add(uWindDirZ.mul(tBase)),
          );
          const wave = mx_noise_float(waveUV);
          const windBase = wave.add(float(0.4));
          const windMicro = mx_noise_float(tBlade.mul(float(4.0))).mul(float(0.15));
          // LOD: kill per-blade micro-turbulence at distance (saves visual noise)
          const windMicroLod = windMicro.mul(float(1).sub(lodMorph));
          // Available room shrinks as naturalLean grows toward maxAngle.
          // Heavily-leaned blades quiver (small amplitude), upright blades do big sweeps.
          const room = max(float(0), uMaxAngle.sub(naturalLean));
          const windScaled = windBase.add(windMicroLod).mul(uWindStrength).mul(room.div(uMaxAngle));
          const totalForce = naturalLean.add(windScaled);
          const angle = totalForce.mul(curveWeight);

          const L = vUv.y.mul(finalBladeH);
          const arcX = sin(angle).mul(L);
          const arcY = cos(angle).mul(L);
          // cross-direction sway also travels as a wave (perpendicular to wind dir)
          const zWaveUV = vec3(
            bladeWorld.z.mul(uWindWaveScale).add(uWindDirZ.mul(tBase)).add(float(17.3)),
            float(0),
            bladeWorld.x.mul(uWindWaveScale).sub(uWindDirX.mul(tBase)).add(float(31.7)),
          );
          const zRollPhase = mx_noise_float(zWaveUV).mul(float(0.4)).sub(float(0.2));
          // LOD: kill cross-direction sway at distance
          const arcZ = sin(zRollPhase).mul(L).mul(curveWeight).mul(0.2).mul(float(1).sub(lodMorph));

          const ty = vUv.y;
          const eps = float(0.02);
          const tp = min(ty.add(eps), float(1));
          const tm = max(ty.sub(eps), float(0));

          const bsP = smoothstep(0.0, uStiffness, tp);
          const cwP = tp.pow(uBendFocus).mul(bsP);
          const angP = totalForce.mul(cwP);
          const lenP = tp.mul(finalBladeH);
          const sP = vec3(
            sin(angP).mul(lenP),
            cos(angP).mul(lenP),
            sin(zRollPhase).mul(lenP).mul(cwP).mul(0.2),
          );

          const bsM = smoothstep(0.0, uStiffness, tm);
          const cwM = tm.pow(uBendFocus).mul(bsM);
          const angM = totalForce.mul(cwM);
          const lenM = tm.mul(finalBladeH);
          const sM = vec3(
            sin(angM).mul(lenM),
            cos(angM).mul(lenM),
            sin(zRollPhase).mul(lenM).mul(cwM).mul(0.2),
          );

          const T = normalize(sub(sP, sM));
          const gvn = normalize(vec3(float(0), negate(T.z), T.y));
          // Cylindrical normals: fan left/right across blade width so it
          // catches light from multiple directions like a rounded surface.
          const cylSpread = uCylindrical.mul(float(Math.PI * 0.5));
          const nL = normalize(rotY(cylSpread, gvn));
          const nR = normalize(rotY(negate(cylSpread), gvn));
          const fanN = normalize(mix(nL, nR, vUv.x));

          const midLocal = vec3(off.x, finalBladeH.mul(float(0.5)), off.z);
          const worldMid = modelWorldMatrix.mul(vec4(midLocal, 1)).xyz;
          const toCamW = normalize(sub(cameraPosition, worldMid));
          const viewL = normalize(
            modelWorldMatrixInverse.mul(vec4(toCamW, float(0))).xyz,
          );
          const lenXZ = length(vec2(viewL.x, viewL.z));
          const faceZ = abs(dot(viewL, vec3(float(0), float(0), float(1))));
          const edgeOn = smoothstep(
            float(0.12),
            float(0.55),
            sub(1, faceZ),
          ).mul(smoothstep(float(0.08), float(0.35), lenXZ));
          const yawMax = float(0.55);
          const deltaYaw = uViewThicken
            .mul(edgeOn)
            .mul(yawMax)
            .mul(atan(viewL.x, viewL.z));

          const pArc = vec3(
            arcX.add(positionLocal.x),
            arcY,
            arcZ.add(positionLocal.z),
          );
          const pYaw = rotY(crossedYaw, pArc);
          const nYaw = normalize(rotY(crossedYaw, fanN));
          const pOut = rotY(deltaYaw, pYaw);
          const nOut = normalize(rotY(deltaYaw, nYaw));
          // Sky blend: tilt normals toward up so blades catch overhead light
          // from all sides — this is what eliminates the dark-side problem.
          // LOD: push normals more toward up at distance for simpler lighting
          const lodSkyBlend = mix(uSkyBlend, max(uSkyBlend, float(0.7)), lodMorph);
          const nFinal = normalize(mix(nOut, uGroundNormal, lodSkyBlend));
          normalLocal.assign(nFinal);
          vCustomNormal.assign(nFinal);

          return vec3(pOut.x.add(off.x), pOut.y, pOut.z.add(off.z));
        })();
        material.colorNode = Fn(() => {
          const off = attribute("offset", "vec3");
          const bladeWorldC = modelWorldMatrix.mul(vec4(off.x, float(0), off.z, float(1))).xyz;
          const bladeXZ = vec2(bladeWorldC.x, bladeWorldC.z);
          const h1 = fract(
            sin(dot(bladeXZ, vec2(269.5, 183.3))).mul(float(43758.5453)),
          );
          const randomShade = mix(float(0.75), float(1.0), h1);
          // AO: base of blade is darkened by neighboring blades, tip is fully lit.
          const ao = mix(uAoBase, float(1.0), pow(vUv.y, uAoPower));
          const baseCol = mix(uBladeCol, uTipCol, vUv.y);

          // --- Color variation (hashes computed in vertex via varyings) ---
          // Warm/cool tint from vColorTint varying
          const hueCol = mix(baseCol, vColorTint, uCvHueSpread);

          // Saturation variation
          const lum = dot(hueCol, vec3(0.299, 0.587, 0.114));
          const satFactor = float(1.0).sub(h1.mul(uCvSatSpread));
          const satCol = mix(vec3(lum, lum, lum), hueCol, satFactor);

          // Dry blades from vDryBlend varying — stronger at root, fades at tip
          const dryBlend = vDryBlend.mul(float(1.0).sub(vUv.y).mul(float(0.5)).add(float(0.5)));
          const dryCol = mix(satCol, uCvDryCol, dryBlend);

          // Final: apply variation only when enabled
          const variedCol = mix(baseCol, dryCol, uColorVar);

          const finalCol = variedCol.mul(vec3(randomShade.mul(vClumpShade).mul(ao)));
          // LOD debug: green = high detail, red = low detail
          // Debug: GREEN = HIGH, YELLOW = MID, BLUE = FAR
          const dbHigh = vec3(0.2, 1.0, 0.2);
          const dbMid = vec3(1.0, 1.0, 0.2);
          const dbFar = vec3(0.2, 0.4, 1.0);
          const midBlend = smoothstep(float(0.2), float(0.5), vLodMorph);
          const farBlend = smoothstep(float(0.6), float(0.9), vLodMorph);
          const debugTint = mix(mix(dbHigh, dbMid, midBlend), dbFar, farBlend);
          return mix(finalCol, debugTint, uLodDebug);
        })();

        // SSS as emissiveNode — added AFTER PBR lighting, so the dark side
        // gets the glow regardless of ambient factor (unlike colorNode which is albedo).
        material.emissiveNode = Fn(() => {
          const backScat = max(dot(negate(uSunDir), normalize(vCustomNormal)), float(0));
          const sss = clamp(pow(backScat, uBssPower).mul(uBssIntensity), float(0), float(1));
          return uBssCol.mul(sss);
        })();

        // --- GEOMETRY ---
        // Tapered blade: full width at base, smooth narrowing in the upper segment,
        // single apex vertex at the tip (triangular cap, not a flat quad top).
        function createBladeGeometry(
          height,
          baseWidth,
          ySegments,
          taperStart = 0.7,
        ) {
          const taper = THREE.MathUtils.clamp(taperStart, 0.05, 0.999);
          const baseHalf = baseWidth * 0.5;
          const positions = [];
          const uvs = [];
          const indices = [];
          const rowVertCount = [];
          const rowBase = [];
          let v = 0;

          for (let j = 0; j <= ySegments; j++) {
            const t = j / ySegments;
            const y = t * height;
            rowBase[j] = v;

            if (j === ySegments) {
              positions.push(0, y, 0);
              uvs.push(0.5, t);
              rowVertCount.push(1);
              v += 1;
            } else {
              const s = THREE.MathUtils.smoothstep(t, taper, 1);
              const w = baseHalf * (1 - s);
              positions.push(-w, y, 0, w, y, 0);
              uvs.push(0, t, 1, t);
              rowVertCount.push(2);
              v += 2;
            }
          }

          for (let j = 0; j < ySegments; j++) {
            const a0 = rowBase[j];
            const a1 = rowBase[j] + 1;
            const b0 = rowBase[j + 1];
            if (rowVertCount[j + 1] === 2) {
              const b1 = b0 + 1;
              indices.push(a0, a1, b1, a0, b1, b0);
            } else {
              indices.push(a0, a1, b0);
            }
          }

          const geo = new THREE.BufferGeometry();
          geo.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(positions, 3),
          );
          geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
          geo.setIndex(indices);
          geo.computeVertexNormals();
          return geo;
        }

        // Instanced field: grid + jitter like grass-sandbox createGrassGeometry.
        // `includeCross` — when false, skips crossed ribbon duplicates (half the instances).
        function createFieldInstancedGeometry(
          baseBlade,
          patchSize,
          numGrass,
          bladeHeight,
          includeCross = true,
        ) {
          const numCellsX = Math.max(1, Math.ceil(Math.sqrt(numGrass)));
          const numCellsZ = Math.max(1, Math.ceil(numGrass / numCellsX));
          const cellW = patchSize / numCellsX;
          const cellH = patchSize / numCellsZ;
          const total = includeCross ? numGrass * 2 : numGrass;
          const offsets = new Float32Array(total * 3);
          const phases = new Float32Array(total);
          const isCrossArr = new Float32Array(total);
          for (let i = 0; i < numGrass; i++) {
            const col = i % numCellsX;
            const row = Math.floor(i / numCellsX);
            const x = -patchSize * 0.5 + col * cellW + Math.random() * cellW;
            const z = -patchSize * 0.5 + row * cellH + Math.random() * cellH;
            const phase = Math.random() * Math.PI * 2;
            offsets[i * 3] = x;     offsets[i * 3 + 1] = 0;  offsets[i * 3 + 2] = z;
            phases[i] = phase;      isCrossArr[i] = 0;
            if (includeCross) {
              offsets[(i + numGrass) * 3] = x;
              offsets[(i + numGrass) * 3 + 1] = 0;
              offsets[(i + numGrass) * 3 + 2] = z;
              phases[i + numGrass] = phase;
              isCrossArr[i + numGrass] = 1;
            }
          }
          const ig = new THREE.InstancedBufferGeometry();
          if (baseBlade.index) ig.index = baseBlade.index.clone();
          ig.setAttribute("position", baseBlade.attributes.position.clone());
          ig.setAttribute("uv", baseBlade.attributes.uv.clone());
          if (baseBlade.attributes.normal) {
            ig.setAttribute("normal", baseBlade.attributes.normal.clone());
          }
          ig.setAttribute("offset", new THREE.InstancedBufferAttribute(offsets, 3));
          ig.setAttribute("aPhase", new THREE.InstancedBufferAttribute(phases, 1));
          ig.setAttribute("aIsCross", new THREE.InstancedBufferAttribute(isCrossArr, 1));
          ig.instanceCount = total;
          const half = patchSize * 0.5;
          const r = Math.sqrt(half * half * 2 + bladeHeight * bladeHeight) + 2;
          ig.boundingSphere = new THREE.Sphere(
            new THREE.Vector3(0, bladeHeight * 0.5, 0),
            r,
          );
          return ig;
        }

        // ── Unified streaming grass: 3-tier LOD + pooling + frustum cull ──
        const grassGroup = new THREE.Group();
        scene.add(grassGroup);
        let geoHigh = null, geoMid = null, geoFar = null;
        const poolHigh = { meshes: [], idx: 0 };
        const poolMid = { meshes: [], idx: 0 };
        const poolFar = { meshes: [], idx: 0 };

        // Reusable objects — zero allocation per frame
        const _cellPos = new THREE.Vector3();
        const _camPosXZ = new THREE.Vector3();
        const _aabb = new THREE.Box3();
        const _aabbSize = new THREE.Vector3();
        const _frustum = new THREE.Frustum();
        const _projScreenMatrix = new THREE.Matrix4();

        function buildStreamingGeometries() {
          if (geoHigh) geoHigh.dispose();
          if (geoMid) geoMid.dispose();
          if (geoFar) geoFar.dispose();

          const highSeg = Math.max(2, Math.round(params.bladeYSegments));
          const midSeg = Math.max(2, Math.round(params.lodMidSegments));
          const farSeg = Math.max(1, Math.round(params.lodFarSegments));

          // HIGH — full segments, full density, crossed ribbons
          const highBase = createBladeGeometry(
            params.bladeHeight, params.bladeWidth, highSeg, params.tipTaperStart);
          geoHigh = createFieldInstancedGeometry(
            highBase, params.fieldSize,
            Math.max(1, Math.round(params.grassCount)), params.bladeHeight, true);
          highBase.dispose();

          // MID — reduced segments, reduced density, crossed ribbons
          const midBase = createBladeGeometry(
            params.bladeHeight, params.bladeWidth, midSeg, params.tipTaperStart);
          geoMid = createFieldInstancedGeometry(
            midBase, params.fieldSize,
            Math.max(1, Math.round(params.lodMidGrassCount)), params.bladeHeight, true);
          midBase.dispose();

          // FAR — minimal segments, minimal density, NO crossed ribbons
          const farBase = createBladeGeometry(
            params.bladeHeight, params.bladeWidth, farSeg, params.tipTaperStart);
          geoFar = createFieldInstancedGeometry(
            farBase, params.fieldSize,
            Math.max(1, Math.round(params.lodFarGrassCount)), params.bladeHeight, false);
          farBase.dispose();

          // Update existing pool meshes to use new geometry
          poolHigh.meshes.forEach(m => { m.geometry = geoHigh; });
          poolMid.meshes.forEach(m => { m.geometry = geoMid; });
          poolFar.meshes.forEach(m => { m.geometry = geoFar; });
        }

        function getMesh(pool, geo) {
          if (pool.idx < pool.meshes.length) return pool.meshes[pool.idx++];
          const m = new THREE.Mesh(geo, material);
          m.frustumCulled = false;  // we do manual culling
          m.castShadow = false;
          m.receiveShadow = true;
          grassGroup.add(m);
          pool.meshes.push(m);
          pool.idx++;
          return m;
        }

        let lastPatchCount = 0;
        let lastHighCount = 0, lastMidCount = 0, lastFarCount = 0;

        function updateGrassGrid() {
          // Hide all pooled meshes, reset indices
          for (const child of grassGroup.children) child.visible = false;
          poolHigh.idx = 0;
          poolMid.idx = 0;
          poolFar.idx = 0;

          // Extract view frustum for culling
          _projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _frustum.setFromProjectionMatrix(_projScreenMatrix);

          const ps = params.fieldSize;
          const maxDist = params.lodMaxDistance;
          const midDist = params.lodMidDistance;
          const farDist = params.lodFarDistance;
          const useLod = params.lodEnabled;

          // Snap grid origin to camera (floor, not round — consistent tiling)
          const snapX = Math.floor(camera.position.x / ps) * ps;
          const snapZ = Math.floor(camera.position.z / ps) * ps;
          const cells = Math.ceil(maxDist / ps) + 1;

          _camPosXZ.set(camera.position.x, 0, camera.position.z);
          _aabbSize.set(ps, 1000, ps);

          let patchCount = 0;
          let highCount = 0, midCount = 0, farCount = 0;

          for (let r = -cells; r <= cells; r++) {
            for (let c = -cells; c <= cells; c++) {
              const cellX = snapX + c * ps;
              const cellZ = snapZ + r * ps;

              _cellPos.set(cellX, 0, cellZ);
              _aabb.setFromCenterAndSize(_cellPos, _aabbSize);

              // Stage 1: cheap distance check
              const dist = _aabb.distanceToPoint(_camPosXZ);
              if (dist > maxDist) continue;

              // Stage 2: frustum cull
              if (!_frustum.intersectsBox(_aabb)) continue;

              // 3-tier LOD selection
              let pool, geo;
              if (!useLod || dist <= midDist) {
                pool = poolHigh; geo = geoHigh; highCount++;
              } else if (dist <= farDist) {
                pool = poolMid; geo = geoMid; midCount++;
              } else {
                pool = poolFar; geo = geoFar; farCount++;
              }

              const mesh = getMesh(pool, geo);
              mesh.geometry = geo;
              mesh.visible = true;
              mesh.position.set(cellX, 0, cellZ);
              mesh.receiveShadow = params.grassReceiveShadow;
              mesh.castShadow = params.grassCastShadow;
              patchCount++;
            }
          }

          lastPatchCount = patchCount;
          lastHighCount = highCount;
          lastMidCount = midCount;
          lastFarCount = farCount;
          return patchCount;
        }

        // Build initial geometries
        let lastGeoKey = "";
        function geoRebuildKey() {
          return [
            params.bladeHeight, params.bladeWidth, params.tipTaperStart,
            Math.round(params.bladeYSegments),
            Math.round(params.lodMidSegments), Math.round(params.lodFarSegments),
            params.fieldSize, Math.round(params.grassCount),
            Math.round(params.lodMidGrassCount), Math.round(params.lodFarGrassCount),
          ].join("|");
        }

        // Ground/Lights
        function floorExtent() {
          return params.lodMaxDistance * 2 + params.fieldSize;
        }
        const floorMat = new THREE.MeshStandardMaterial({ color: params.groundColor });
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(floorExtent(), floorExtent()),
          floorMat,
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        floor.visible = params.groundPlane;
        scene.add(floor);
        const sun = new THREE.DirectionalLight(
          params.sunColor,
          params.sunIntensity,
        );
        sun.position.set(params.sunX, params.sunY, params.sunZ);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 200;
        const shadowExtent = floorExtent() * 0.6;
        sun.shadow.camera.left = -shadowExtent;
        sun.shadow.camera.right = shadowExtent;
        sun.shadow.camera.top = shadowExtent;
        sun.shadow.camera.bottom = -shadowExtent;
        const ambient = new THREE.AmbientLight(
          params.ambientColor,

        scene.add(sun, ambient);

        // Shadow debug mesh — torusknot floating above the field
        const debugKnot = new THREE.Mesh(
          new THREE.TorusKnotGeometry(8, 2.5, 100, 16),
          new THREE.MeshStandardMaterial({ color: 0x888888 }),
        );
        debugKnot.position.set(0, 25, 0);
        debugKnot.castShadow = true;
        debugKnot.visible = false;
        scene.add(debugKnot);

        // ── Sky (WebGPU SkyMesh + PMREM env), same pattern as grass-sandbox.html ──
        const sky = new SkyMesh();
        sky.scale.setScalar(450000);
        scene.add(sky);
        const pmremGenerator = new THREE.PMREMGenerator(renderer);

        function updateSkyParams() {
          const sunDir = new THREE.Vector3(
            params.sunX,

          ).normalize();
          sky.sunPosition.value.copy(sunDir);

          sky.mieDirectionalG.value = params.skyMieG;
        }

        function bakeSkyEnvironment() {
          const skyEnvScene = new THREE.Scene();
          skyEnvScene.add(sky.clone());
          const skyEnv = pmremGenerator.fromScene(skyEnvScene, 0.04).texture;
          if (scene.environment) scene.environment.dispose();
          scene.environment = skyEnv;
          scene.environmentIntensity = params.environmentIntensity;
        }

        updateSkyParams();
        bakeSkyEnvironment();

        // ── Player capsule + follow camera ──────────────────────────────────
        const CAPSULE_R = 0.5, CAPSULE_H = 2.0;
        const capsuleGeo = new THREE.CapsuleGeometry(CAPSULE_R, CAPSULE_H, 8, 16);
        const capsuleMat = new THREE.MeshStandardMaterial({ color: 0x4488cc, roughness: 0.4 });
        const capsule = new THREE.Mesh(capsuleGeo, capsuleMat);
        capsule.position.set(0, CAPSULE_R + CAPSULE_H * 0.5, 0);
        capsule.castShadow = true;
        scene.add(capsule);

        // Player state
        const playerPos = new THREE.Vector3(0, 0, 0);  // XZ ground pos (Y=0)
        let playerYaw = 0;  // radians, 0 = looking down +Z
        const followCamPos = new THREE.Vector3();
        followCamPos.copy(camera.position);

        // Input tracking
        const keys = {};
        window.addEventListener("keydown", (e) => {
          if (e.target.closest(".tp-dfwv, #tweakpane-scroll")) return;
          keys[e.code] = true;
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });
        // Prevent stuck keys on blur
        window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

        // Mouse rotation for follow mode (pointer lock)
        let mouseDX = 0, mouseDY = 0;
        let followPitch = 0.3;  // radians above horizontal
        renderer.domElement.addEventListener("click", () => {
          if (params.cameraMode === "follow" && !document.pointerLockElement) {
            renderer.domElement.requestPointerLock();
          }
        });
        document.addEventListener("mousemove", (e) => {
          if (document.pointerLockElement === renderer.domElement && params.cameraMode === "follow") {
            mouseDX += e.movementX;
            mouseDY += e.movementY;
          }
        });
        document.addEventListener("pointerlockchange", () => {
          if (!document.pointerLockElement) {
            mouseDX = 0; mouseDY = 0;
          }
        });

        const _timer = new THREE.Timer();

        function updatePlayer(dt) {
          if (params.cameraMode !== "follow") return;

          // Mouse look
          const sensitivity = 0.003;
          playerYaw -= mouseDX * sensitivity;
          followPitch = THREE.MathUtils.clamp(followPitch + mouseDY * sensitivity, -0.2, 1.2);
          mouseDX = 0; mouseDY = 0;

          // WASD movement relative to player yaw
          let moveX = 0, moveZ = 0;
          if (keys["KeyW"] || keys["ArrowUp"]) moveZ -= 1;
          if (keys["KeyS"] || keys["ArrowDown"]) moveZ += 1;
          if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;
          if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;

          if (moveX !== 0 || moveZ !== 0) {
            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            moveX /= len; moveZ /= len;
            const sprint = keys["ShiftLeft"] || keys["ShiftRight"] ? params.playerSprintMul : 1;
            const speed = params.playerSpeed * sprint * dt;
            const sinY = Math.sin(playerYaw), cosY = Math.cos(playerYaw);
            playerPos.x += (moveX * cosY + moveZ * sinY) * speed;
            playerPos.z += (-moveX * sinY + moveZ * cosY) * speed;
          }

          // Update capsule
          capsule.position.set(playerPos.x, CAPSULE_R + CAPSULE_H * 0.5, playerPos.z);
          capsule.rotation.y = playerYaw;

          // Follow camera: behind + above player
          const camDist = params.camFollowDist;
          const camH = params.camFollowHeight;
          const targetX = playerPos.x + Math.sin(playerYaw) * camDist * Math.cos(followPitch);
          const targetZ = playerPos.z + Math.cos(playerYaw) * camDist * Math.cos(followPitch);
          const targetY = camH + Math.sin(followPitch) * camDist;

          const t = 1 - Math.exp(-params.camFollowSmooth * dt);
          followCamPos.x += (targetX - followCamPos.x) * t;
          followCamPos.y += (targetY - followCamPos.y) * t;
          followCamPos.z += (targetZ - followCamPos.z) * t;

          camera.position.copy(followCamPos);
          camera.lookAt(playerPos.x, CAPSULE_H * 0.5, playerPos.z);
        }

        function switchCameraMode(mode) {
          params.cameraMode = mode;
          if (mode === "orbit") {
            controls.enabled = true;
            capsule.visible = params.capsuleVisible;
            if (document.pointerLockElement) document.exitPointerLock();
          } else {
            controls.enabled = false;
            capsule.visible = params.capsuleVisible;
            // Seed follow camera from current camera
            followCamPos.copy(camera.position);
            // Derive yaw from camera-to-target direction
            const dx = controls.target.x - camera.position.x;
            const dz = controls.target.z - camera.position.z;
            playerYaw = Math.atan2(dx, dz) + Math.PI;
            playerPos.set(controls.target.x, 0, controls.target.z);
          }
        }

        // --- GUI ---

          min: 0,
          max: 0.1,
          label: "Mie coeff.",
        });
        skyFolder.addBinding(params, "skyMieG", {
          min: 0,
          max: 1,
          label: "Mie dir. G",
        });
        skyFolder.addBinding(params, "environmentIntensity", {
          min: 0,
          max: 2,
          label: "Env intensity",
        });

        let lastFloorSize = 0;
        // Build initial geometries
        buildStreamingGeometries();
        lastGeoKey = geoRebuildKey();

        renderer.setAnimationLoop(() => {
          _timer.update();
          const dt = _timer.getDelta();

          // Player movement + follow camera
          updatePlayer(dt);
          capsule.visible = params.capsuleVisible && params.cameraMode === "follow";

          // Rebuild geometries only when blade shape / patch params change
          const gk = geoRebuildKey();
          if (gk !== lastGeoKey) {
            lastGeoKey = gk;
            buildStreamingGeometries();
          }

          // Stream patches: camera-relative grid + frustum cull + pooling
          updateGrassGrid();
          patchCountMonitor.patches = lastPatchCount;

          // Floor follows maxDistance
          const neededFloor = floorExtent();
          if (neededFloor !== lastFloorSize) {
            lastFloorSize = neededFloor;
            floor.geometry.dispose();
            floor.geometry = new THREE.PlaneGeometry(neededFloor, neededFloor);
          }
          // Floor follows camera XZ so ground is always under the streaming area
          floor.position.set(camera.position.x, 0, camera.position.z);

          uBendFocus.value = params.bendFocus;
          uStiffness.value = params.stiffness;
          uWindStrength.value = params.windStrength;
          uWindSpeed.value = params.windSpeed;
          uMaxAngle.value = params.maxAngle;
          uNaturalLean.value = params.naturalLean;
          uClumpScale.value = params.clumpScale;
          uClumpStrength.value = params.clumpStrength;
          uAoBase.value = params.aoBase;
          uAoPower.value = params.aoPower;
          const windRad = params.windAngle * (Math.PI / 180);
          uWindDirX.value = Math.cos(windRad);
          uWindDirZ.value = Math.sin(windRad);
          uWindWaveScale.value = params.windWaveScale;
          uBladeHeight.value = params.bladeHeight;
          uRoundCross.value = params.roundCrossSection;
          uSkyBlend.value = params.skyBlend;
          uCylindrical.value = params.cylindrical;
          uCrossed.value = params.crossed ? 1.0 : 0.0;
          uColorVar.value = params.colorVariation ? 1.0 : 0.0;
          uCvHueSpread.value = params.cvHueSpread;
          uCvSatSpread.value = params.cvSatSpread;
          uCvDryAmount.value = params.cvDryAmount;
          uCvDryCol.value.set(params.cvDryColor);
          material.side = params.doubleSide ? THREE.DoubleSide : THREE.FrontSide;
          material.needsUpdate = true;
          floor.visible = params.groundPlane;
          floorMat.color.set(params.groundColor);
          material.roughness = params.specular ? params.specRoughness : 0.92;
          material.envMapIntensity = params.specular ? params.specEnvIntensity : 0;
          debugKnot.visible = params.shadowDebug;
          uViewThicken.value = params.viewThicken;
          uBladeCol.value.set(params.bladeColor);
          uTipCol.value.set(params.tipColor);
          sun.intensity = params.sunIntensity;
          sun.color.set(params.sunColor);
          sun.position.set(params.sunX, params.sunY, params.sunZ);
          uSunDir.value.set(params.sunX, params.sunY, params.sunZ).normalize();
          uBssCol.value.set(params.bssColor);
          uBssIntensity.value = params.bssIntensity;
          uBssPower.value = params.bssPower;
          uLodEnabled.value = params.lodEnabled ? 1.0 : 0.0;
          uLodMidDist.value = params.lodMidDistance;
          uLodFarDist.value = params.lodFarDistance;
          uLodMaxDist.value = params.lodMaxDistance;
          uLodDebug.value = params.lodDebug ? 1.0 : 0.0;
          lodCountMonitor.high = lastHighCount;
          lodCountMonitor.mid = lastMidCount;
          lodCountMonitor.far = lastFarCount;
          ambient.intensity = params.ambientIntensity;
          ambient.color.set(params.ambientColor);
          updateSkyParams();
          scene.environmentIntensity = params.environmentIntensity;
          if (params.cameraMode === "orbit") controls.update();
          renderer.render(scene, camera);
          stats.update();
        });
      }
    </script>
  </body>
</html>
