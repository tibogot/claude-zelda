<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arc-Control Floppy Grass</title>
    <style>
      body {
        margin: 0;
        background-color: #020406;
        overflow: hidden;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #tweakpane-scroll {
        position: fixed;
        top: 0;
        right: 0;
        width: 300px;
        height: 100vh;
        max-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        z-index: 100;
        pointer-events: auto;
        box-sizing: border-box;
        overscroll-behavior: contain;
      }
      #tweakpane-scroll::-webkit-scrollbar {
        width: 10px;
      }
      #tweakpane-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 5px;
      }
      #tweakpane-scroll::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="tweakpane-scroll" aria-label="Settings panel"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import {
        float,
        vec3,
        Fn,
        positionLocal,
        normalLocal,
        time,
        sin,
        cos,
        uv,
        mix,
        uniform,
        attribute,
        mx_noise_float,
        smoothstep,
        normalize,
        sub,
        min,
        max,
        negate,
        abs,
        dot,
        atan,
        vec2,
        vec4,
        fract,
        PI,
        modelWorldMatrix,
        modelWorldMatrixInverse,
        cameraPosition,
        length,
        pow,
        clamp,
        varying,
        texture,
        add,
        div,
        reflect,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { Pane } from "tweakpane";
      import Stats from "stats-gl";

      let camera, scene, renderer, controls;

      init();

      async function init() {
        scene = new THREE.Scene();

        renderer = new THREE.WebGPURenderer({ antialias: true });
        await renderer.init();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          500000,
        );
        camera.position.set(0, 40, 100);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const params = {
          windSpeed: 0.2,
          windStrength: 1.4,
          maxAngle: 1.4,      // safe max total bend — no blade ever exceeds this
          naturalLean: 0.9,   // max resting lean (each blade gets 0..this randomly)
          clumpScale: 1.5,    // world-unit radius of each clump
          clumpStrength: 0.7, // 0 = fully random, 1 = fully clumped
          crossed: true,      // add a second ribbon rotated 90° per blade
          colorVariation: false,      // enable hue/saturation variation
          cvHueSpread: 0.08,          // max hue shift from base (0 = no hue change)
          cvSatSpread: 0.3,           // saturation variation range (0 = uniform)
          cvDryAmount: 0.15,          // fraction of blades that turn dry/yellow
          cvDryColor: "#8a7a3a",      // dry/dead blade tint
          aoBase: 0.25,       // brightness at blade base (0 = black, 1 = no AO)
          aoPower: 2.0,       // curve — higher = AO more concentrated near base
          windAngle: 0,       // degrees — direction the wind travels (0 = +X)
          windWaveScale: 0.12, // spatial frequency: larger = tighter waves
          bendFocus: 0.5, // The 'Curve' control
          stiffness: 0.0, // How much of the base is 'unbendable'
          bladeHeight: 1.5,
          bladeWidth: 0.15,
          tipTaperStart: 0.5,
          bladeYSegments: 7,
          bladeColor: "#0e300e",
          tipColor: "#004d05",
          doubleSide: false,
          bssIntensity: 1.2,    // overall SSS strength
          bssPower: 2.0,        // backscatter sharpness (lower = wider glow)
          bssColor: "#2d7a2d",  // transmitted light color
          frontScatter: 0.3,    // forward scattering strength
          rimSSS: 0.25,         // rim/silhouette glow strength
          skyBlend: 0.8,       // blend normal toward (0,1,0) — fixes dark side
          cylindrical: 0.3,     // fan normals across blade width (cylinder illusion)
          roundCrossSection: 0, // legacy, keep for compat
          viewThicken: 0.45, // yaw toward camera when edge-on (0 = off)
          sunIntensity: 3,
          sunColor: "#ffffff",
          sunX: 5,
          sunY: 10,
          sunZ: 5,
          ambientIntensity: 0.2,
          ambientColor: "#ffffff",
          skyTurbidity: 2,
          skyRayleigh: 0.5,
          skyMie: 0.005,
          skyMieG: 0.8,
          environmentIntensity: 0.45,
          grassReceiveShadow: true,   // grass receives shadows from other objects
          grassCastShadow: false,     // grass casts shadows (expensive)
          shadowDebug: false,         // show torusknot to test shadow receiving
          envLighting: 0.15,         // environment map fill (colored ambient from sky)
          specular: false,            // enable waxy specular sheen
          specRoughness: 0.55,       // blade roughness when specular is on
          // Specular V1 — sharp directional highlights (tip-only, distance-faded)
          specV1Enabled: false,
          specV1Intensity: 1.5,
          specV1Color: "#ffffff",
          specV1DirX: -1.0,
          specV1DirY: 1.0,
          specV1DirZ: 0.5,
          specV1Power: 25.6,
          // Specular V2 — noisy/textured highlights (Perlin-perturbed normal)
          specV2Enabled: false,
          specV2Intensity: 1.0,
          specV2Color: "#ffffff",
          specV2DirX: -1.0,
          specV2DirY: 0.45,
          specV2DirZ: 1.0,
          specV2NoiseScale: 3.0,
          specV2NoiseStr: 0.6,
          specV2Power: 12.0,
          specV2TipBias: 0.5,
          groundPlane: true,          // show ground plane under grass
          groundColor: "#1a2e0a",    // dark earthy green
          fieldSize: 10,    // size of ONE patch (world units)
          grassDensity: 1.0,  // GPU-side density (0 = no blades, 1 = all blades)
          densityPattern: "full",  // test pattern: "full", "circular", "half"
          grassCount: 1516,  // blades per patch HIGH
          lodEnabled: false,       // enable LOD system (camera-relative grid)
          lodMidDistance: 40,      // HIGH→MID swap distance
          lodFarDistance: 80,      // MID→FAR swap distance
          lodMaxDistance: 200,     // absolute cutoff (no grass beyond)
          lodMidSegments: 3,       // segment count for MID LOD
          lodMidGrassCount: 150,   // blades per patch MID
          lodFarSegments: 1,       // segment count for FAR LOD (single quad)
          lodFarGrassCount: 80,    // blades per patch FAR (minimal)
          lodFadeStart: 0.75,      // fraction of maxDistance where fade begins (0.75 = last 25%)
          lodDebug: false,         // tint HIGH=green, MID=yellow, FAR=blue
          // Camera / player
          cameraMode: "orbit",       // "orbit" or "follow"
          playerSpeed: 20,           // world units per second
          playerSprintMul: 2.5,      // speed multiplier when holding Shift
          camFollowHeight: 2,       // Y offset above capsule
          camFollowDist: 15,         // distance behind capsule
          camFollowSmooth: 5,        // lerp speed for camera follow
          capsuleVisible: true,      // show/hide capsule mesh
          // Grass interaction
          grassInteraction: true,    // blades bend away from player
          interactionRadius: 1.5,    // push radius around player
          interactionStrength: 0.7,  // how much blades bend (0-1)
          // Terrain
          terrainSize: 200,           // world-space extent of terrain (XZ)
          terrainHeight: 12,          // max height amplitude
          terrainFreq: 0.02,          // noise frequency
          terrainOctaves: 4,          // noise octaves
          terrainRes: 128,            // heightmap texture resolution
          terrainMeshRes: 128,        // terrain mesh subdivisions
          // Fog (linear) — off by default
          fogEnabled: false,
          fogColor: "#b8c5d0",
          fogNear: 50,
          fogFar: 220,
        };

        const fog = new THREE.Fog(params.fogColor, params.fogNear, params.fogFar);

        const uWindSpeed = uniform(params.windSpeed);
        const uWindStrength = uniform(params.windStrength);
        const uMaxAngle = uniform(params.maxAngle);
        const uNaturalLean = uniform(params.naturalLean);
        const uClumpScale = uniform(params.clumpScale);
        const uClumpStrength = uniform(params.clumpStrength);
        const uCrossed = uniform(1);
        const uColorVar = uniform(0);
        const uCvHueSpread = uniform(params.cvHueSpread);
        const uCvSatSpread = uniform(params.cvSatSpread);
        const uCvDryAmount = uniform(params.cvDryAmount);
        const uCvDryCol = uniform(new THREE.Color(params.cvDryColor));
        const uAoBase = uniform(params.aoBase);
        const uAoPower = uniform(params.aoPower);
        const uWindDirX = uniform(1.0);
        const uWindDirZ = uniform(0.0);
        const uWindWaveScale = uniform(params.windWaveScale);
        const uBendFocus = uniform(params.bendFocus);
        const uStiffness = uniform(params.stiffness);
        const uBladeCol = uniform(new THREE.Color(params.bladeColor));
        const uTipCol = uniform(new THREE.Color(params.tipColor));
        const uRoundCross = uniform(params.roundCrossSection);
        const uSkyBlend = uniform(params.skyBlend);
        // Terrain normal — (0,1,0) on flat ground, replace with sampled heightmap
        // normal when porting to index.html. Interface is ready, value changes later.
        const uGroundNormal = uniform(new THREE.Vector3(0, 1, 0));
        const uCylindrical = uniform(params.cylindrical);
        const uViewThicken = uniform(params.viewThicken);
        const uBladeHeight = uniform(params.bladeHeight);
        const uSunDir = uniform(new THREE.Vector3(params.sunX, params.sunY, params.sunZ).normalize());
        const vCustomNormal = varying(vec3(0, 1, 0), 'vCN');
        const vClumpShade = varying(float(1), 'vCS');
        const vColorTint = varying(vec3(1, 1, 1), 'vCT');  // warm/cool tint target
        const vDryBlend = varying(float(0), 'vDB');         // dry blade factor
        const uBssCol = uniform(new THREE.Color(params.bssColor));
        const uBssIntensity = uniform(params.bssIntensity);
        const uBssPower = uniform(params.bssPower);
        const uFrontScatter = uniform(params.frontScatter);
        const uRimSSS = uniform(params.rimSSS);
        // Specular V1 — sharp highlights
        const uSpecV1Enabled = uniform(0);
        const uSpecV1Intensity = uniform(params.specV1Intensity);
        const uSpecV1Col = uniform(new THREE.Color(params.specV1Color));
        const uSpecV1Dir = uniform(new THREE.Vector3(params.specV1DirX, params.specV1DirY, params.specV1DirZ).normalize());
        const uSpecV1Power = uniform(params.specV1Power);
        // Specular V2 — noisy textured highlights
        const uSpecV2Enabled = uniform(0);
        const uSpecV2Intensity = uniform(params.specV2Intensity);
        const uSpecV2Col = uniform(new THREE.Color(params.specV2Color));
        const uSpecV2Dir = uniform(new THREE.Vector3(params.specV2DirX, params.specV2DirY, params.specV2DirZ).normalize());
        const uSpecV2NoiseScale = uniform(params.specV2NoiseScale);
        const uSpecV2NoiseStr = uniform(params.specV2NoiseStr);
        const uSpecV2Power = uniform(params.specV2Power);
        const uSpecV2TipBias = uniform(params.specV2TipBias);
        const uLodEnabled = uniform(0);
        const uLodMidDist = uniform(params.lodMidDistance);
        const uLodFarDist = uniform(params.lodFarDistance);
        const uLodMaxDist = uniform(params.lodMaxDistance);
        const uLodFadeStart = uniform(params.lodFadeStart);
        const uLodDebug = uniform(0);
        const uGrassDensity = uniform(params.grassDensity);
        const uPlayerPos = uniform(new THREE.Vector3(0, 0, 0));
        const uInteractionRadius = uniform(params.interactionRadius);
        const uInteractionStrength = uniform(params.interactionStrength);
        const uInteractionEnabled = uniform(1);

        // ── Heightmap terrain ──
        const uTerrainSize = uniform(params.terrainSize);
        // Create the heightmap texture at full resolution upfront.
        // generateTerrain() writes into .image.data and sets needsUpdate.
        const htRes = params.terrainRes;
        const heightTex = new THREE.DataTexture(
          new Float32Array(htRes * htRes * 4), htRes, htRes,
          THREE.RGBAFormat, THREE.FloatType
        );
        heightTex.wrapS = THREE.ClampToEdgeWrapping;
        heightTex.wrapT = THREE.ClampToEdgeWrapping;
        heightTex.minFilter = THREE.LinearFilter;
        heightTex.magFilter = THREE.LinearFilter;
        heightTex.needsUpdate = true;

        // ── Painted grass density texture ──
        // In the editor this comes from grassDensityCanvas (128×128, painted by brush).
        // Here we create test patterns to verify sampling. Replace with editor canvas later.
        const densityRes = 128;
        const grassDensityTex = new THREE.DataTexture(
          new Uint8Array(densityRes * densityRes * 4), densityRes, densityRes,
          THREE.RGBAFormat, THREE.UnsignedByteType
        );
        grassDensityTex.wrapS = THREE.ClampToEdgeWrapping;
        grassDensityTex.wrapT = THREE.ClampToEdgeWrapping;
        grassDensityTex.minFilter = THREE.LinearFilter;
        grassDensityTex.magFilter = THREE.LinearFilter;

        function fillDensityPattern(pattern) {
          const data = grassDensityTex.image.data;
          for (let z = 0; z < densityRes; z++) {
            for (let x = 0; x < densityRes; x++) {
              const idx = (z * densityRes + x) * 4;
              let density = 255;
              if (pattern === "circular") {
                const u = x / (densityRes - 1), v = z / (densityRes - 1);
                const dx = u - 0.5, dz = v - 0.5;
                const dist = Math.sqrt(dx * dx + dz * dz) * 2;
                density = Math.max(0, Math.min(255, (1 - dist) * 255));
              } else if (pattern === "half") {
                density = x < densityRes / 2 ? 255 : 0;
              }
              // "full" → 255 everywhere (default)
              data[idx] = density;
              data[idx + 1] = density;
              data[idx + 2] = density;
              data[idx + 3] = 255;
            }
          }
          grassDensityTex.needsUpdate = true;
        }
        fillDensityPattern(params.densityPattern);

        const vLodMorph = varying(float(0), 'vLM');
        const vDistFade = varying(float(1), 'vDF');

        // High roughness + no env specular: thin DoubleSide blades otherwise pick up
        // sharp IBL streaks and floor Z-fight shimmer that read as “weird lines” up close.
        const material = new THREE.MeshStandardNodeMaterial({
          side: THREE.FrontSide,
          roughness: 0.92,
          metalness: 0,
        });
        material.envMapIntensity = 0;
        material.polygonOffset = true;
        material.polygonOffsetFactor = 1;
        material.polygonOffsetUnits = 1;

        const vUv = uv();

        const rotY = (ang, v) => {
          const c = cos(ang),
            s = sin(ang);
          return vec3(
            v.x.mul(c).add(v.z.mul(s)),
            v.y,
            negate(v.x).mul(s).add(v.z.mul(c)),
          );
        };

        // Bend-aware “rounded blade” normals: tangent along spine, ribbon normal,
        // then yaw ±spread across width (grass-sandbox style), spread scaled by UI.
        material.positionNode = Fn(() => {
          const off = attribute("offset", "vec3");
          const aPhase = attribute("aPhase", "float");
          const aIsCross = attribute("aIsCross", "float");
          const tBase = time.mul(uWindSpeed);
          const tBlade = tBase.add(aPhase);

          // World-space blade base — used for wave UV and per-blade hashes.
          // Using world position means patches share a seamless wave and
          // blades at the same local offset in different patches look different.
          const bladeWorld = modelWorldMatrix.mul(vec4(off.x, float(0), off.z, float(1))).xyz;
          const bladeXZ = vec2(bladeWorld.x, bladeWorld.z);

          // Sample terrain height from heightmap texture
          const terrainUV = add(div(bladeXZ, uTerrainSize), vec2(0.5));
          const terrainH = texture(heightTex, terrainUV).x;

          // Compute per-blade terrain normal via central differences
          // Sample 4 neighbors offset by 1 texel in heightmap space
          const texelSize = float(1).div(float(params.terrainRes));
          const hL = texture(heightTex, terrainUV.add(vec2(negate(texelSize), float(0)))).x;
          const hR = texture(heightTex, terrainUV.add(vec2(texelSize, float(0)))).x;
          const hD = texture(heightTex, terrainUV.add(vec2(float(0), negate(texelSize)))).x;
          const hU = texture(heightTex, terrainUV.add(vec2(float(0), texelSize))).x;
          // World-space step between neighboring texels
          const worldStep = uTerrainSize.div(float(params.terrainRes));
          const terrainNormal = normalize(vec3(hL.sub(hR), worldStep.mul(float(2)), hD.sub(hU)));

          // LOD: per-blade distance to camera for morph + fade
          const camXZ = vec2(cameraPosition.x, cameraPosition.z);
          const bladeCamDist = length(bladeXZ.sub(camXZ));
          // lodMorph: 0 = HIGH detail, 0.5 = MID, 1.0 = FAR (used for shader simplification + debug)
          const morphToMid = smoothstep(uLodMidDist.mul(float(0.6)), uLodMidDist, bladeCamDist);
          const morphToFar = smoothstep(uLodFarDist.mul(float(0.8)), uLodFarDist, bladeCamDist);
          const lodMorph = uLodEnabled.mul(mix(morphToMid.mul(float(0.5)), float(0.5).add(morphToFar.mul(float(0.5))), morphToFar));
          vLodMorph.assign(lodMorph);
          // farMorph: 0 for HIGH+MID, ramps to 1 only for FAR — used for aggressive shader simplification
          const farMorph = smoothstep(float(0.5), float(1.0), lodMorph);
          // distFade: 1 = full size, 0 = collapsed (blade shrinks to ground at maxDist)
          // Always active — prevents hard cutoff at field edge even without LOD
          const fadeBegin = uLodMaxDist.mul(uLodFadeStart);
          const distFadeLinear = smoothstep(uLodMaxDist, fadeBegin, bladeCamDist);
          // Squared falloff — sharper near the edge, more natural
          const distFade = distFadeLinear.mul(distFadeLinear);
          vDistFade.assign(distFade);

          // Painted density: sample the density texture at same UV as heightmap
          // In the editor this is the grassDensityCanvas; here it's a test pattern.
          // Interface matches grass-painter7.js exactly: paintedDensity × uGrassDensity
          const paintedDensity = texture(grassDensityTex, terrainUV).x;
          const hasDensity = smoothstep(float(0.0), float(0.005), paintedDensity); // soft kill below 0.005

          // Stochastic density culling: collapse blade to 0 height if its hash > density
          const densityHash = fract(sin(dot(bladeXZ, vec2(853.1, 137.9))).mul(float(43758.5453)));
          const densityCull = smoothstep(uGrassDensity.mul(paintedDensity), uGrassDensity.mul(paintedDensity).add(float(0.01)), densityHash).oneMinus().mul(hasDensity);

          const h0 = fract(
            sin(dot(bladeXZ, vec2(127.1, 311.7))).mul(float(43758.5453)),
          );
          const h1 = fract(
            sin(dot(bladeXZ, vec2(269.5, 183.3))).mul(float(43758.5453)),
          );
          const h2 = fract(
            sin(dot(bladeXZ, vec2(419.2, 371.9))).mul(float(43758.5453)),
          );
          const h3 = fract(
            sin(dot(bladeXZ, vec2(371.2, 113.7))).mul(float(43758.5453)),
          );
          // --- Clump cell (Voronoi-style) ---
          // Divide world into cells; each cell has a random center = the clump center.
          // Blades near that center inherit the clump's personality.
          const cellP = bladeXZ.div(uClumpScale);
          const cellID = cellP.floor();
          const cellFrac = fract(cellP);
          const cA = fract(sin(dot(cellID, vec2(127.1, 311.7))).mul(float(43758.5453)));
          const cB = fract(sin(dot(cellID, vec2(269.5, 183.3))).mul(float(43758.5453)));
          const cC = fract(sin(dot(cellID, vec2(419.2, 371.9))).mul(float(43758.5453)));
          const cD = fract(sin(dot(cellID, vec2(113.5, 271.9))).mul(float(43758.5453)));
          // How close this blade is to its clump center (1 = at center, 0 = at edge)
          const clumpDist = length(vec2(cA, cB).sub(cellFrac));
          // LOD: fade out clump influence at FAR only — saves 4 mix ops + smoothstep
          const clumpInfluence = smoothstep(float(0.75), float(0.05), clumpDist).mul(uClumpStrength).mul(float(1).sub(farMorph));

          // Blend individual random values toward clump values
          const randomYaw = mix(h0.mul(PI.mul(2)), cC.mul(PI.mul(2)), clumpInfluence);
          const hScale = mix(float(0.75), float(1.5), h2);
          const clumpHeightScale = mix(float(0.6), float(1.4), cA);
          const naturalLean = mix(h3.mul(uNaturalLean), cD.mul(uNaturalLean), clumpInfluence);
          const bladeH = uBladeHeight.mul(mix(hScale, clumpHeightScale, clumpInfluence));
          // Cross ribbon: +90° yaw, collapsed to zero height when uCrossed=0
          const crossedYaw = randomYaw.add(aIsCross.mul(PI.mul(0.5)));
          const crossedBladeH = bladeH.mul(mix(float(1.0), uCrossed, aIsCross));
          // LOD fade: collapse blade height to 0 at maxDistance
          const finalBladeH = crossedBladeH.mul(distFade).mul(densityCull);
          // Clump color tint — passed to colorNode via varying
          vClumpShade.assign(mix(float(1.0), mix(float(0.82), float(1.18), cB), clumpInfluence));

          // Color variation hashes — computed here (vertex) to avoid fragment precision issues
          // LOD: skip color variation hashing at distance (2 fewer sin/dot/fract + mix ops)
          const h4 = fract(sin(dot(bladeXZ, vec2(537.3, 197.1))).mul(float(43758.5453)));
          const h5 = fract(sin(dot(bladeXZ, vec2(419.7, 631.2))).mul(float(43758.5453)));
          // Warm/cool tint target per blade — fade to neutral at distance
          const warmCol = vec3(0.18, 0.28, 0.02);
          const coolCol = vec3(0.02, 0.18, 0.08);
          const tintTarget = mix(warmCol, coolCol, h4);
          vColorTint.assign(mix(tintTarget, vec3(1, 1, 1), farMorph));
          // Dry blade factor: blades with h5 < dryAmount become dry — fade out at FAR
          const isDry = smoothstep(uCvDryAmount, float(0.0), h5);
          vDryBlend.assign(isDry.mul(float(1).sub(farMorph)));

          const baseStiffness = smoothstep(0.0, uStiffness, vUv.y);
          const curveWeight = vUv.y.pow(uBendFocus).mul(baseStiffness);

          // Traveling wave: noise sampled at world XZ + windDir*time
          // so blades at different positions feel different force → rolling wave
          const waveUV = vec3(
            bladeWorld.x.mul(uWindWaveScale).add(uWindDirX.mul(tBase)),
            float(0),
            bladeWorld.z.mul(uWindWaveScale).add(uWindDirZ.mul(tBase)),
          );
          const wave = mx_noise_float(waveUV);
          const windBase = wave.add(float(0.4));
          const windMicro = mx_noise_float(tBlade.mul(float(4.0))).mul(float(0.15));
          // LOD: kill per-blade micro-turbulence at distance (saves visual noise)
          const windMicroLod = windMicro.mul(float(1).sub(lodMorph));
          // Available room shrinks as naturalLean grows toward maxAngle.
          // Heavily-leaned blades quiver (small amplitude), upright blades do big sweeps.
          const room = max(float(0), uMaxAngle.sub(naturalLean));
          const windScaled = windBase.add(windMicroLod).mul(uWindStrength).mul(room.div(uMaxAngle));
          const totalForce = naturalLean.add(windScaled);
          const angle = totalForce.mul(curveWeight);

          const L = vUv.y.mul(finalBladeH);
          const arcX = sin(angle).mul(L);
          const arcY = cos(angle).mul(L);
          // cross-direction sway also travels as a wave (perpendicular to wind dir)
          const zWaveUV = vec3(
            bladeWorld.z.mul(uWindWaveScale).add(uWindDirZ.mul(tBase)).add(float(17.3)),
            float(0),
            bladeWorld.x.mul(uWindWaveScale).sub(uWindDirX.mul(tBase)).add(float(31.7)),
          );
          const zRollPhase = mx_noise_float(zWaveUV).mul(float(0.4)).sub(float(0.2));
          // LOD: kill cross-direction sway at distance
          const arcZ = sin(zRollPhase).mul(L).mul(curveWeight).mul(0.2).mul(float(1).sub(lodMorph));

          const ty = vUv.y;
          const eps = float(0.02);
          const tp = min(ty.add(eps), float(1));
          const tm = max(ty.sub(eps), float(0));

          const bsP = smoothstep(0.0, uStiffness, tp);
          const cwP = tp.pow(uBendFocus).mul(bsP);
          const angP = totalForce.mul(cwP);
          const lenP = tp.mul(finalBladeH);
          const sP = vec3(
            sin(angP).mul(lenP),
            cos(angP).mul(lenP),
            sin(zRollPhase).mul(lenP).mul(cwP).mul(0.2),
          );

          const bsM = smoothstep(0.0, uStiffness, tm);
          const cwM = tm.pow(uBendFocus).mul(bsM);
          const angM = totalForce.mul(cwM);
          const lenM = tm.mul(finalBladeH);
          const sM = vec3(
            sin(angM).mul(lenM),
            cos(angM).mul(lenM),
            sin(zRollPhase).mul(lenM).mul(cwM).mul(0.2),
          );

          const T = normalize(sub(sP, sM));
          const gvn = normalize(vec3(float(0), negate(T.z), T.y));
          // Cylindrical normals: fan left/right across blade width so it
          // catches light from multiple directions like a rounded surface.
          // LOD: collapse spread to 0 at FAR only — saves 2 rotY + normalize
          const cylSpread = uCylindrical.mul(float(Math.PI * 0.5)).mul(float(1).sub(farMorph));
          const nL = normalize(rotY(cylSpread, gvn));
          const nR = normalize(rotY(negate(cylSpread), gvn));
          const fanN = normalize(mix(nL, nR, vUv.x));

          const midLocal = vec3(off.x, finalBladeH.mul(float(0.5)), off.z);
          const worldMid = modelWorldMatrix.mul(vec4(midLocal, 1)).xyz;
          const toCamW = normalize(sub(cameraPosition, worldMid));
          const viewL = normalize(
            modelWorldMatrixInverse.mul(vec4(toCamW, float(0))).xyz,
          );
          const lenXZ = length(vec2(viewL.x, viewL.z));
          const faceZ = abs(dot(viewL, vec3(float(0), float(0), float(1))));
          const edgeOn = smoothstep(
            float(0.12),
            float(0.55),
            sub(1, faceZ),
          ).mul(smoothstep(float(0.08), float(0.35), lenXZ));
          const yawMax = float(0.55);
          // LOD: fade out view-thickening at FAR only (saves matrix mul + atan + smoothsteps)
          const deltaYaw = uViewThicken
            .mul(edgeOn)
            .mul(yawMax)
            .mul(atan(viewL.x, viewL.z))
            .mul(float(1).sub(farMorph));

          const pArc = vec3(
            arcX.add(positionLocal.x),
            arcY,
            arcZ.add(positionLocal.z),
          );
          const pYaw = rotY(crossedYaw, pArc);
          const nYaw = normalize(rotY(crossedYaw, fanN));
          const pOut = rotY(deltaYaw, pYaw);
          const nOut = normalize(rotY(deltaYaw, nYaw));

          // Player interaction: bend blades away from player (same pattern as grass.js)
          const playerXZ = vec2(uPlayerPos.x, uPlayerPos.z);
          const toBlade = bladeXZ.sub(playerXZ);
          const pDist = length(toBlade);
          // Falloff: strong when close, zero beyond radius (matches grass.js smoothstep pattern)
          const distFalloff = mix(float(1), float(0), smoothstep(float(0.5), uInteractionRadius, pDist));
          const pFall = distFalloff.mul(uInteractionEnabled);
          // Push angle: bend away from player, strength scaled by falloff
          const pAng = negate(mix(float(0), uInteractionStrength, pFall));
          // Direction from blade toward player (for rotation axis)
          const pTo = normalize(vec3(playerXZ.x.sub(bladeXZ.x), float(0), playerXZ.y.sub(bladeXZ.y)).add(vec3(0.001, 0, 0.001)));
          // Perpendicular axis to rotate around (tangent to push direction)
          const pAx = vec3(pTo.z, float(0), negate(pTo.x));
          // Apply interaction rotation to position + normal, scaled by vertex height
          const intAngle = pAng.mul(vUv.y);
          const cI = cos(intAngle), sI = sin(intAngle);
          // Rodrigues rotation around pAx
          const pDotAx = dot(vec3(pOut.x, pOut.y, pOut.z), pAx);
          const pCrossAx = vec3(
            pAx.y.mul(pOut.z).sub(pAx.z.mul(pOut.y)),
            pAx.z.mul(pOut.x).sub(pAx.x.mul(pOut.z)),
            pAx.x.mul(pOut.y).sub(pAx.y.mul(pOut.x)),
          );
          const pRotated = vec3(
            pOut.x.mul(cI).add(pCrossAx.x.mul(sI)).add(pAx.x.mul(pDotAx).mul(float(1).sub(cI))),
            pOut.y.mul(cI).add(pCrossAx.y.mul(sI)).add(pAx.y.mul(pDotAx).mul(float(1).sub(cI))),
            pOut.z.mul(cI).add(pCrossAx.z.mul(sI)).add(pAx.z.mul(pDotAx).mul(float(1).sub(cI))),
          );
          // Also rotate the normal for correct lighting on bent blades
          const nDotAx = dot(nOut, pAx);
          const nCrossAx = vec3(
            pAx.y.mul(nOut.z).sub(pAx.z.mul(nOut.y)),
            pAx.z.mul(nOut.x).sub(pAx.x.mul(nOut.z)),
            pAx.x.mul(nOut.y).sub(pAx.y.mul(nOut.x)),
          );
          const nRotated = vec3(
            nOut.x.mul(cI).add(nCrossAx.x.mul(sI)).add(pAx.x.mul(nDotAx).mul(float(1).sub(cI))),
            nOut.y.mul(cI).add(nCrossAx.y.mul(sI)).add(pAx.y.mul(nDotAx).mul(float(1).sub(cI))),
            nOut.z.mul(cI).add(nCrossAx.z.mul(sI)).add(pAx.z.mul(nDotAx).mul(float(1).sub(cI))),
          );

          // Sky blend: tilt normals toward up so blades catch overhead light
          // from all sides — this is what eliminates the dark-side problem.
          // LOD: push normals more toward up at distance for simpler lighting
          const lodSkyBlend = mix(uSkyBlend, max(uSkyBlend, float(0.7)), lodMorph);
          const nFinal = normalize(mix(nRotated, terrainNormal, lodSkyBlend));
          normalLocal.assign(nFinal);
          vCustomNormal.assign(nFinal);

          return vec3(pRotated.x.add(off.x), pRotated.y.add(terrainH), pRotated.z.add(off.z));
        })();
        material.colorNode = Fn(() => {
          const off = attribute("offset", "vec3");
          const bladeWorldC = modelWorldMatrix.mul(vec4(off.x, float(0), off.z, float(1))).xyz;
          const bladeXZ = vec2(bladeWorldC.x, bladeWorldC.z);
          const h1 = fract(
            sin(dot(bladeXZ, vec2(269.5, 183.3))).mul(float(43758.5453)),
          );
          const randomShade = mix(float(0.75), float(1.0), h1);
          // AO: base of blade is darkened by neighboring blades, tip is fully lit.
          const ao = mix(uAoBase, float(1.0), pow(vUv.y, uAoPower));
          const baseCol = mix(uBladeCol, uTipCol, vUv.y);

          // --- Color variation (hashes computed in vertex via varyings) ---
          // Warm/cool tint from vColorTint varying
          const hueCol = mix(baseCol, vColorTint, uCvHueSpread);

          // Saturation variation
          const lum = dot(hueCol, vec3(0.299, 0.587, 0.114));
          const satFactor = float(1.0).sub(h1.mul(uCvSatSpread));
          const satCol = mix(vec3(lum, lum, lum), hueCol, satFactor);

          // Dry blades from vDryBlend varying — stronger at root, fades at tip
          const dryBlend = vDryBlend.mul(float(1.0).sub(vUv.y).mul(float(0.5)).add(float(0.5)));
          const dryCol = mix(satCol, uCvDryCol, dryBlend);

          // Final: apply variation only when enabled
          const variedCol = mix(baseCol, dryCol, uColorVar);

          // Distance fade dims color near maxDistance — blades dissolve into ground
          const finalCol = variedCol.mul(vec3(randomShade.mul(vClumpShade).mul(ao).mul(vDistFade)));
          // Debug: GREEN = HIGH, YELLOW = MID, BLUE = FAR
          const dbHigh = vec3(0.2, 1.0, 0.2);
          const dbMid = vec3(1.0, 1.0, 0.2);
          const dbFar = vec3(0.2, 0.4, 1.0);
          const midBlend = smoothstep(float(0.2), float(0.5), vLodMorph);
          const farBlend = smoothstep(float(0.6), float(0.9), vLodMorph);
          const debugTint = mix(mix(dbHigh, dbMid, midBlend), dbFar, farBlend);
          return mix(finalCol, debugTint, uLodDebug);
        })();

        // SSS emissive — 3-component model from grass-sandbox:
        // backscatter + frontscatter + rim, modulated by blade thickness.
        material.emissiveNode = Fn(() => {
          const N = normalize(vCustomNormal);
          const viewDir = normalize(sub(cameraPosition, positionLocal));

          // Thickness: base is thick (opaque), tip is thin (translucent)
          const heightPct = vUv.y;
          const thickness = float(1).sub(heightPct).mul(float(0.7)).add(float(0.3));

          // Warm shift for transmitted light (sun through blade = warmer)
          const transmitCol = mix(
            uBssCol,
            uBssCol.mul(vec3(1.3, 1.1, 0.7)),
            float(1).sub(thickness),
          );

          // 1) Backscatter: light coming through from behind the blade
          const backScat = max(dot(negate(uSunDir), N), float(0));

          // 2) Forward scatter: light hitting the front and transmitting
          const frontScat = max(dot(uSunDir, N), float(0));

          // 3) Rim: silhouette glow (blades edge-on to camera catch light)
          const rim = float(1).sub(max(dot(N, viewDir), float(0)));

          // Combine all three, each weighted by thickness
          const totalSSS = clamp(
            pow(backScat, uBssPower).mul(thickness)
              .add(pow(frontScat, float(1.5)).mul(thickness).mul(uFrontScatter))
              .add(pow(rim, float(3.0)).mul(thickness).mul(uRimSSS)),
            float(0), float(1),
          );

          // farMorph: 0 at HIGH+MID, 1 at FAR — reduce SSS + spec for FAR
          const farFade = smoothstep(float(0.5), float(1.0), vLodMorph);
          const sssResult = transmitCol.mul(float(0.35)).mul(totalSSS).mul(uBssIntensity).mul(float(1).sub(farFade));

          // ── Specular V1: sharp directional highlights ──
          // Distance fade (2-10 units), tip-only (upper 50%), LOD fade
          const specDistFade = smoothstep(float(10), float(2), length(sub(cameraPosition, positionLocal)));
          const lodSpecFade = float(1).sub(smoothstep(float(0.2), float(0.5), vLodMorph));
          const tipFade1 = smoothstep(float(0.5), float(1.0), heightPct);

          const reflV1 = reflect(uSpecV1Dir, N);
          const specDot1 = pow(max(dot(viewDir, reflV1), float(0)), uSpecV1Power);
          const spec1 = uSpecV1Col.mul(specDot1).mul(uSpecV1Intensity)
            .mul(specDistFade).mul(tipFade1).mul(lodSpecFade).mul(float(3.0))
            .mul(uSpecV1Enabled);

          // ── Specular V2: noisy textured highlights (3-octave Perlin perturbation) ──
          const worldPos = positionLocal;
          const noiseP1 = mx_noise_float(vec3(worldPos.x.mul(uSpecV2NoiseScale), worldPos.y.mul(uSpecV2NoiseScale), worldPos.z.mul(uSpecV2NoiseScale)));
          const noiseP2 = mx_noise_float(vec3(
            worldPos.x.mul(uSpecV2NoiseScale).add(float(17.3)),
            worldPos.y.mul(uSpecV2NoiseScale).add(float(31.7)),
            worldPos.z.mul(uSpecV2NoiseScale).add(float(47.1)),
          ));
          const noiseP3 = mx_noise_float(vec3(
            worldPos.x.mul(uSpecV2NoiseScale).mul(float(2.7)).add(float(59.3)),
            worldPos.y.mul(uSpecV2NoiseScale).mul(float(2.7)).add(float(73.1)),
            worldPos.z.mul(uSpecV2NoiseScale).mul(float(2.7)).add(float(89.7)),
          ));
          const noiseCombined = noiseP1.add(noiseP2).add(noiseP3).mul(float(0.333));
          const perturbedN = normalize(mix(N, vec3(noiseCombined, float(1), noiseCombined), uSpecV2NoiseStr));

          const reflV2 = reflect(uSpecV2Dir, perturbedN);
          const specDot2 = pow(max(dot(viewDir, reflV2), float(0)), uSpecV2Power);
          const tipFade2 = smoothstep(float(1).sub(uSpecV2TipBias), float(1), heightPct);
          const spec2 = uSpecV2Col.mul(specDot2).mul(uSpecV2Intensity)
            .mul(specDistFade).mul(tipFade2).mul(lodSpecFade)
            .mul(uSpecV2Enabled);

          return sssResult.add(spec1).add(spec2);
        })();

        // --- GEOMETRY ---
        // Tapered blade: full width at base, smooth narrowing in the upper segment,
        // single apex vertex at the tip (triangular cap, not a flat quad top).
        function createBladeGeometry(
          height,
          baseWidth,
          ySegments,
          taperStart = 0.7,
        ) {
          const taper = THREE.MathUtils.clamp(taperStart, 0.05, 0.999);
          const baseHalf = baseWidth * 0.5;
          const positions = [];
          const uvs = [];
          const indices = [];
          const rowVertCount = [];
          const rowBase = [];
          let v = 0;

          for (let j = 0; j <= ySegments; j++) {
            const t = j / ySegments;
            const y = t * height;
            rowBase[j] = v;

            if (j === ySegments) {
              positions.push(0, y, 0);
              uvs.push(0.5, t);
              rowVertCount.push(1);
              v += 1;
            } else {
              const s = THREE.MathUtils.smoothstep(t, taper, 1);
              const w = baseHalf * (1 - s);
              positions.push(-w, y, 0, w, y, 0);
              uvs.push(0, t, 1, t);
              rowVertCount.push(2);
              v += 2;
            }
          }

          for (let j = 0; j < ySegments; j++) {
            const a0 = rowBase[j];
            const a1 = rowBase[j] + 1;
            const b0 = rowBase[j + 1];
            if (rowVertCount[j + 1] === 2) {
              const b1 = b0 + 1;
              indices.push(a0, a1, b1, a0, b1, b0);
            } else {
              indices.push(a0, a1, b0);
            }
          }

          const geo = new THREE.BufferGeometry();
          geo.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(positions, 3),
          );
          geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
          geo.setIndex(indices);
          geo.computeVertexNormals();
          return geo;
        }

        // Instanced field: grid + jitter like grass-sandbox createGrassGeometry.
        // `includeCross` — when false, skips crossed ribbon duplicates (half the instances).
        function createFieldInstancedGeometry(
          baseBlade,
          patchSize,
          numGrass,
          bladeHeight,
          includeCross = true,
        ) {
          const numCellsX = Math.max(1, Math.ceil(Math.sqrt(numGrass)));
          const numCellsZ = Math.max(1, Math.ceil(numGrass / numCellsX));
          const cellW = patchSize / numCellsX;
          const cellH = patchSize / numCellsZ;
          const total = includeCross ? numGrass * 2 : numGrass;
          const offsets = new Float32Array(total * 3);
          const phases = new Float32Array(total);
          const isCrossArr = new Float32Array(total);
          for (let i = 0; i < numGrass; i++) {
            const col = i % numCellsX;
            const row = Math.floor(i / numCellsX);
            const x = -patchSize * 0.5 + col * cellW + Math.random() * cellW;
            const z = -patchSize * 0.5 + row * cellH + Math.random() * cellH;
            const phase = Math.random() * Math.PI * 2;
            offsets[i * 3] = x;     offsets[i * 3 + 1] = 0;  offsets[i * 3 + 2] = z;
            phases[i] = phase;      isCrossArr[i] = 0;
            if (includeCross) {
              offsets[(i + numGrass) * 3] = x;
              offsets[(i + numGrass) * 3 + 1] = 0;
              offsets[(i + numGrass) * 3 + 2] = z;
              phases[i + numGrass] = phase;
              isCrossArr[i + numGrass] = 1;
            }
          }
          const ig = new THREE.InstancedBufferGeometry();
          if (baseBlade.index) ig.index = baseBlade.index.clone();
          ig.setAttribute("position", baseBlade.attributes.position.clone());
          ig.setAttribute("uv", baseBlade.attributes.uv.clone());
          if (baseBlade.attributes.normal) {
            ig.setAttribute("normal", baseBlade.attributes.normal.clone());
          }
          ig.setAttribute("offset", new THREE.InstancedBufferAttribute(offsets, 3));
          ig.setAttribute("aPhase", new THREE.InstancedBufferAttribute(phases, 1));
          ig.setAttribute("aIsCross", new THREE.InstancedBufferAttribute(isCrossArr, 1));
          ig.instanceCount = total;
          const half = patchSize * 0.5;
          const r = Math.sqrt(half * half * 2 + bladeHeight * bladeHeight) + 2;
          ig.boundingSphere = new THREE.Sphere(
            new THREE.Vector3(0, bladeHeight * 0.5, 0),
            r,
          );
          return ig;
        }

        // ── Unified streaming grass: 3-tier LOD + pooling + frustum cull ──
        const grassGroup = new THREE.Group();
        scene.add(grassGroup);
        let geoHigh = null, geoMid = null, geoFar = null;
        const poolHigh = { meshes: [], idx: 0 };
        const poolMid = { meshes: [], idx: 0 };
        const poolFar = { meshes: [], idx: 0 };

        // Reusable objects — zero allocation per frame
        const _cellPos = new THREE.Vector3();
        const _camPosXZ = new THREE.Vector3();
        const _aabb = new THREE.Box3();
        const _aabbSize = new THREE.Vector3();
        const _frustum = new THREE.Frustum();
        const _projScreenMatrix = new THREE.Matrix4();

        function buildStreamingGeometries() {
          if (geoHigh) geoHigh.dispose();
          if (geoMid) geoMid.dispose();
          if (geoFar) geoFar.dispose();

          const highSeg = Math.max(2, Math.round(params.bladeYSegments));
          const midSeg = Math.max(2, Math.round(params.lodMidSegments));
          const farSeg = Math.max(1, Math.round(params.lodFarSegments));

          // HIGH — full segments, full density, crossed ribbons
          const highBase = createBladeGeometry(
            params.bladeHeight, params.bladeWidth, highSeg, params.tipTaperStart);
          geoHigh = createFieldInstancedGeometry(
            highBase, params.fieldSize,
            Math.max(1, Math.round(params.grassCount)), params.bladeHeight, true);
          highBase.dispose();

          // MID — reduced segments, reduced density, crossed ribbons
          const midBase = createBladeGeometry(
            params.bladeHeight, params.bladeWidth, midSeg, params.tipTaperStart);
          geoMid = createFieldInstancedGeometry(
            midBase, params.fieldSize,
            Math.max(1, Math.round(params.lodMidGrassCount)), params.bladeHeight, true);
          midBase.dispose();

          // FAR — minimal segments, minimal density, NO crossed ribbons
          const farBase = createBladeGeometry(
            params.bladeHeight, params.bladeWidth, farSeg, params.tipTaperStart);
          geoFar = createFieldInstancedGeometry(
            farBase, params.fieldSize,
            Math.max(1, Math.round(params.lodFarGrassCount)), params.bladeHeight, false);
          farBase.dispose();

          // Update existing pool meshes to use new geometry
          poolHigh.meshes.forEach(m => { m.geometry = geoHigh; });
          poolMid.meshes.forEach(m => { m.geometry = geoMid; });
          poolFar.meshes.forEach(m => { m.geometry = geoFar; });
        }

        function getMesh(pool, geo) {
          if (pool.idx < pool.meshes.length) return pool.meshes[pool.idx++];
          const m = new THREE.Mesh(geo, material);
          m.frustumCulled = false;  // we do manual culling
          m.castShadow = false;
          m.receiveShadow = true;
          grassGroup.add(m);
          pool.meshes.push(m);
          pool.idx++;
          return m;
        }

        let lastPatchCount = 0;
        let lastHighCount = 0, lastMidCount = 0, lastFarCount = 0;

        // Hysteresis: remember last LOD tier per patch cell to prevent flickering
        const patchLodCache = new Map();
        const LOD_HYSTERESIS = 2;  // deadband in world units

        function selectLodTier(dist, cellKey, midDist, farDist) {
          const hyst = LOD_HYSTERESIS;
          const last = patchLodCache.get(cellKey);

          let tier;
          if (last === "high") {
            // Stay HIGH until clearly past midDist + hysteresis
            if (dist > midDist + hyst) {
              tier = dist > farDist + hyst ? "far" : "mid";
            } else {
              tier = "high";
            }
          } else if (last === "mid") {
            // Drop back to HIGH if clearly inside, promote to FAR if clearly past
            if (dist <= midDist - hyst) {
              tier = "high";
            } else if (dist > farDist + hyst) {
              tier = "far";
            } else {
              tier = "mid";
            }
          } else if (last === "far") {
            // Only come back to MID if clearly inside farDist
            if (dist <= farDist - hyst) {
              tier = dist <= midDist - hyst ? "high" : "mid";
            } else {
              tier = "far";
            }
          } else {
            // First time seeing this cell — no hysteresis
            tier = dist <= midDist ? "high" : dist <= farDist ? "mid" : "far";
          }

          patchLodCache.set(cellKey, tier);
          return tier;
        }

        function updateGrassGrid() {
          // Hide all pooled meshes, reset indices
          for (const child of grassGroup.children) child.visible = false;
          poolHigh.idx = 0;
          poolMid.idx = 0;
          poolFar.idx = 0;

          // Extract view frustum for culling
          _projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _frustum.setFromProjectionMatrix(_projScreenMatrix);

          const ps = params.fieldSize;
          const maxDist = params.lodMaxDistance;
          const midDist = params.lodMidDistance;
          const farDist = params.lodFarDistance;
          const useLod = params.lodEnabled;

          // Snap grid origin to camera (floor, not round — consistent tiling)
          const snapX = Math.floor(camera.position.x / ps) * ps;
          const snapZ = Math.floor(camera.position.z / ps) * ps;
          const cells = Math.ceil(maxDist / ps) + 1;

          _camPosXZ.set(camera.position.x, 0, camera.position.z);
          _aabbSize.set(ps, 1000, ps);

          let patchCount = 0;
          let highCount = 0, midCount = 0, farCount = 0;

          for (let r = -cells; r <= cells; r++) {
            for (let c = -cells; c <= cells; c++) {
              const cellX = snapX + c * ps;
              const cellZ = snapZ + r * ps;

              _cellPos.set(cellX, 0, cellZ);
              _aabb.setFromCenterAndSize(_cellPos, _aabbSize);

              // Stage 1: cheap distance check
              const dist = _aabb.distanceToPoint(_camPosXZ);
              if (dist > maxDist) continue;

              // Stage 2: frustum cull
              if (!_frustum.intersectsBox(_aabb)) continue;

              // 3-tier LOD selection with hysteresis
              let pool, geo, isFar = false;
              if (!useLod) {
                pool = poolHigh; geo = geoHigh; highCount++;
              } else {
                const cellKey = `${cellX},${cellZ}`;
                const tier = selectLodTier(dist, cellKey, midDist, farDist);
                if (tier === "high") {
                  pool = poolHigh; geo = geoHigh; highCount++;
                } else if (tier === "mid") {
                  pool = poolMid; geo = geoMid; midCount++;
                } else {
                  pool = poolFar; geo = geoFar; farCount++; isFar = true;
                }
              }

              const mesh = getMesh(pool, geo);
              mesh.geometry = geo;
              mesh.visible = true;
              mesh.position.set(cellX, 0, cellZ);
              mesh.receiveShadow = isFar ? false : params.grassReceiveShadow;
              mesh.castShadow = params.grassCastShadow;
              patchCount++;
            }
          }

          // Prevent unbounded cache growth in open-world movement
          if (patchLodCache.size > 1200) patchLodCache.clear();

          lastPatchCount = patchCount;
          lastHighCount = highCount;
          lastMidCount = midCount;
          lastFarCount = farCount;
          return patchCount;
        }

        // Build initial geometries
        let lastGeoKey = "";
        function geoRebuildKey() {
          return [
            params.bladeHeight, params.bladeWidth, params.tipTaperStart,
            Math.round(params.bladeYSegments),
            Math.round(params.lodMidSegments), Math.round(params.lodFarSegments),
            params.fieldSize, Math.round(params.grassCount),
            Math.round(params.lodMidGrassCount), Math.round(params.lodFarGrassCount),
          ].join("|");
        }

        // ── Procedural terrain heightmap ──────────────────────────────────
        // Simple FBM noise on CPU → DataTexture (R channel = height 0..1)
        // + displaced PlaneGeometry so you can see the terrain visually.
        function fbmNoise(x, z, freq, octaves) {
          // Simple value-noise FBM using sin-hash (matches shader hash style)
          let val = 0, amp = 1, f = freq, totalAmp = 0;
          for (let o = 0; o < octaves; o++) {
            const nx = x * f, nz = z * f;
            // 2D hash-based noise with bilinear interpolation
            const ix = Math.floor(nx), iz = Math.floor(nz);
            const fx = nx - ix, fz = nz - iz;
            // Smoothstep interpolation
            const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
            const h00 = Math.abs(Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453 % 1);
            const h10 = Math.abs(Math.sin((ix + 1) * 127.1 + iz * 311.7) * 43758.5453 % 1);
            const h01 = Math.abs(Math.sin(ix * 127.1 + (iz + 1) * 311.7) * 43758.5453 % 1);
            const h11 = Math.abs(Math.sin((ix + 1) * 127.1 + (iz + 1) * 311.7) * 43758.5453 % 1);
            const a = h00 + (h10 - h00) * sx;
            const b = h01 + (h11 - h01) * sx;
            val += (a + (b - a) * sz) * amp;
            totalAmp += amp;
            amp *= 0.5;
            f *= 2.0;
          }
          return val / totalAmp;
        }

        let terrainMesh = null;
        let heightData = null;  // Float32 array for CPU-side height queries

        function generateTerrain() {
          const res = params.terrainRes;
          const size = params.terrainSize;
          const height = params.terrainHeight;
          const freq = params.terrainFreq;
          const octaves = params.terrainOctaves;
          const meshRes = params.terrainMeshRes;

          // 1) Generate heightmap data (res × res, single channel float)
          heightData = new Float32Array(res * res);
          const texData = new Float32Array(res * res * 4); // RGBA for DataTexture
          for (let z = 0; z < res; z++) {
            for (let x = 0; x < res; x++) {
              // Map texel to world position: center at origin
              const wx = (x / (res - 1) - 0.5) * size;
              const wz = (z / (res - 1) - 0.5) * size;
              const h = fbmNoise(wx, wz, freq, octaves) * height;
              const idx = z * res + x;
              heightData[idx] = h;
              const tidx = idx * 4;
              texData[tidx] = h;       // R = height (world units)
              texData[tidx + 1] = 0;   // G
              texData[tidx + 2] = 0;   // B
              texData[tidx + 3] = 1;   // A
            }
          }

          // 2) Write into the existing DataTexture (same object, so shader ref stays valid)
          heightTex.image = { data: texData, width: res, height: res };
          heightTex.needsUpdate = true;

          // 3) Create displaced terrain mesh
          if (terrainMesh) {
            terrainMesh.geometry.dispose();
            scene.remove(terrainMesh);
          }
          const geo = new THREE.PlaneGeometry(size, size, meshRes, meshRes);
          geo.rotateX(-Math.PI / 2);
          const pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const wx = pos.getX(i);
            const wz = pos.getZ(i);
            // Sample height at this vertex (bilinear from heightData)
            const h = sampleHeightCPU(wx, wz);
            pos.setY(i, h);
          }
          geo.computeVertexNormals();
          pos.needsUpdate = true;

          const mat = new THREE.MeshStandardMaterial({ color: params.groundColor });
          terrainMesh = new THREE.Mesh(geo, mat);
          terrainMesh.receiveShadow = true;
          terrainMesh.visible = params.groundPlane;
          scene.add(terrainMesh);
        }

        // CPU-side bilinear height sampling (for player, capsule, etc.)
        function sampleHeightCPU(wx, wz) {
          if (!heightData) return 0;
          const res = params.terrainRes;
          const size = params.terrainSize;
          // World → texel coordinates
          const u = (wx / size + 0.5) * (res - 1);
          const v = (wz / size + 0.5) * (res - 1);
          const ix = Math.floor(u), iz = Math.floor(v);
          const fx = u - ix, fz = v - iz;
          // Clamp to edges
          const x0 = Math.max(0, Math.min(res - 1, ix));
          const x1 = Math.max(0, Math.min(res - 1, ix + 1));
          const z0 = Math.max(0, Math.min(res - 1, iz));
          const z1 = Math.max(0, Math.min(res - 1, iz + 1));
          const h00 = heightData[z0 * res + x0];
          const h10 = heightData[z0 * res + x1];
          const h01 = heightData[z1 * res + x0];
          const h11 = heightData[z1 * res + x1];
          const a = h00 + (h10 - h00) * fx;
          const b = h01 + (h11 - h01) * fx;
          return a + (b - a) * fz;
        }

        generateTerrain();

        // Ground/Lights
        function floorExtent() {
          return params.lodMaxDistance * 2 + params.fieldSize;

        // Mouse rotation for follow mode (pointer lock)

          }

        document.addEventListener("mousemove", (e) => {
          if (document.pointerLockElement === renderer.domElement && params.cameraMode === "follow") {
            mouseDX += e.movementX;
            mouseDY += e.movementY;

        const _timer = new THREE.Timer();

        function updatePlayer(dt) {
          if (params.cameraMode !== "follow") return;

          // Mouse look
          const sensitivity = 0.003;
          playerYaw -= mouseDX * sensitivity;
          followPitch = THREE.MathUtils.clamp(followPitch + mouseDY * sensitivity, -0.2, 1.2);
          mouseDX = 0; mouseDY = 0;

          // WASD movement relative to player yaw
          let moveX = 0, moveZ = 0;
          if (keys["KeyW"] || keys["ArrowUp"]) moveZ -= 1;
          if (keys["KeyS"] || keys["ArrowDown"]) moveZ += 1;
          if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;
          if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;

          if (moveX !== 0 || moveZ !== 0) {
            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            moveX /= len; moveZ /= len;
            const sprint = keys["ShiftLeft"] || keys["ShiftRight"] ? params.playerSprintMul : 1;
            const speed = params.playerSpeed * sprint * dt;
            const sinY = Math.sin(playerYaw), cosY = Math.cos(playerYaw);
            playerPos.x += (moveX * cosY + moveZ * sinY) * speed;
            playerPos.z += (-moveX * sinY + moveZ * cosY) * speed;
          }

          // Update capsule — follow terrain height
          const groundY = sampleHeightCPU(playerPos.x, playerPos.z);
          capsule.position.set(playerPos.x, groundY + CAPSULE_R + CAPSULE_H * 0.5, playerPos.z);
          capsule.rotation.y = playerYaw;

          // Follow camera: behind + above player
          const camDist = params.camFollowDist;
          const camH = params.camFollowHeight;
          const targetX = playerPos.x + Math.sin(playerYaw) * camDist * Math.cos(followPitch);
          const targetZ = playerPos.z + Math.cos(playerYaw) * camDist * Math.cos(followPitch);
          const targetY = groundY + camH + Math.sin(followPitch) * camDist;

          const t = 1 - Math.exp(-params.camFollowSmooth * dt);
          followCamPos.x += (targetX - followCamPos.x) * t;
          followCamPos.y += (targetY - followCamPos.y) * t;
          followCamPos.z += (targetZ - followCamPos.z) * t;

          camera.position.copy(followCamPos);
          camera.lookAt(playerPos.x, groundY + CAPSULE_H * 0.5, playerPos.z);
        }

        specV2Folder.addBinding(params, "specV2Power", { min: 1, max: 64, step: 0.1, label: "Sharpness" });
        specV2Folder.addBinding(params, "specV2Color", { label: "Color" });
        specV2Folder.addBinding(params, "specV2NoiseScale", { min: 0.5, max: 10, step: 0.1, label: "Noise scale" });
        specV2Folder.addBinding(params, "specV2NoiseStr", { min: 0, max: 1, step: 0.05, label: "Noise strength" });
        specV2Folder.addBinding(params, "specV2TipBias", { min: 0, max: 1, step: 0.05, label: "Tip bias" });
        specV2Folder.addBinding(params, "specV2DirX", { min: -1, max: 1, step: 0.05, label: "Dir X" });
        specV2Folder.addBinding(params, "specV2DirY", { min: -1, max: 1, step: 0.05, label: "Dir Y" });
        specV2Folder.addBinding(params, "specV2DirZ", { min: -1, max: 1, step: 0.05, label: "Dir Z" });

        const skyFolder = pane.addFolder({ title: "Sky" });
        skyFolder.addBinding(params, "skyTurbidity", {
          min: 0,
          max: 20,
          label: "Turbidity",
        });
        skyFolder.addBinding(params, "skyRayleigh", {
          min: 0,
          max: 4,
          label: "Rayleigh",
        });
        skyFolder.addBinding(params, "skyMie", {
          min: 0,
          max: 0.1,
          label: "Mie coeff.",
        });
        skyFolder.addBinding(params, "skyMieG", {
          min: 0,
          max: 1,
          label: "Mie dir. G",
        });
        skyFolder.addBinding(params, "environmentIntensity", {
          min: 0,
          max: 2,
          label: "Env intensity",
        });

        const fogFolder = pane.addFolder({ title: "Fog" });
        fogFolder.addBinding(params, "fogEnabled", { label: "Enable fog" });
        fogFolder.addBinding(params, "fogColor", { label: "Color" });
        fogFolder.addBinding(params, "fogNear", {
          min: 0,
          max: 500,
          step: 1,
          label: "Near",
        });
        fogFolder.addBinding(params, "fogFar", {
          min: 10,
          max: 2500,
          step: 5,
          label: "Far",
        });

        // Build initial geometries
        buildStreamingGeometries();
        lastGeoKey = geoRebuildKey();

        renderer.setAnimationLoop(() => {
          _timer.update();
          const dt = _timer.getDelta();

          // Player movement + follow camera
          updatePlayer(dt);
          capsule.visible = params.capsuleVisible && params.cameraMode === "follow";

          // Update interaction uniforms
          uPlayerPos.value.set(playerPos.x, sampleHeightCPU(playerPos.x, playerPos.z), playerPos.z);
          uInteractionEnabled.value = params.grassInteraction ? 1.0 : 0.0;
          uInteractionRadius.value = params.interactionRadius;
          uInteractionStrength.value = params.interactionStrength;

          // Rebuild geometries only when blade shape / patch params change
          const gk = geoRebuildKey();
          if (gk !== lastGeoKey) {
            lastGeoKey = gk;
            buildStreamingGeometries();
          }

          // Stream patches: camera-relative grid + frustum cull + pooling
          updateGrassGrid();
          patchCountMonitor.patches = lastPatchCount;

          // Terrain visibility + color
          if (terrainMesh) {
            terrainMesh.visible = params.groundPlane;
            terrainMesh.material.color.set(params.groundColor);
          }

          uBendFocus.value = params.bendFocus;
          uStiffness.value = params.stiffness;
          uWindStrength.value = params.windStrength;
          uWindSpeed.value = params.windSpeed;
          uMaxAngle.value = params.maxAngle;
          uNaturalLean.value = params.naturalLean;
          uClumpScale.value = params.clumpScale;
          uClumpStrength.value = params.clumpStrength;
          uAoBase.value = params.aoBase;
          uAoPower.value = params.aoPower;
          const windRad = params.windAngle * (Math.PI / 180);
          uWindDirX.value = Math.cos(windRad);
          uWindDirZ.value = Math.sin(windRad);
          uWindWaveScale.value = params.windWaveScale;
          uBladeHeight.value = params.bladeHeight;
          uRoundCross.value = params.roundCrossSection;
          uSkyBlend.value = params.skyBlend;
          uCylindrical.value = params.cylindrical;
          uCrossed.value = params.crossed ? 1.0 : 0.0;
          uColorVar.value = params.colorVariation ? 1.0 : 0.0;
          uCvHueSpread.value = params.cvHueSpread;
          uCvSatSpread.value = params.cvSatSpread;
          uCvDryAmount.value = params.cvDryAmount;
          uCvDryCol.value.set(params.cvDryColor);
          const wantSide = params.doubleSide ? THREE.DoubleSide : THREE.FrontSide;
          if (material.side !== wantSide) {
            material.side = wantSide;
            material.needsUpdate = true;
          }
          uTerrainSize.value = params.terrainSize;
          material.roughness = params.specular ? params.specRoughness : 0.92;
          material.envMapIntensity = params.envLighting + (params.specular ? 0.1 : 0);
          debugKnot.visible = params.shadowDebug;
          uViewThicken.value = params.viewThicken;
          uBladeCol.value.set(params.bladeColor);
          uTipCol.value.set(params.tipColor);
          sun.intensity = params.sunIntensity;
          sun.color.set(params.sunColor);
          sun.position.set(params.sunX, params.sunY, params.sunZ);
          uSunDir.value.set(params.sunX, params.sunY, params.sunZ).normalize();
          uBssCol.value.set(params.bssColor);
          uBssIntensity.value = params.bssIntensity;
          uBssPower.value = params.bssPower;
          uFrontScatter.value = params.frontScatter;
          uRimSSS.value = params.rimSSS;
          // Specular V1
          uSpecV1Enabled.value = params.specV1Enabled ? 1.0 : 0.0;
          uSpecV1Intensity.value = params.specV1Intensity;
          uSpecV1Col.value.set(params.specV1Color);
          uSpecV1Dir.value.set(params.specV1DirX, params.specV1DirY, params.specV1DirZ).normalize();
          uSpecV1Power.value = params.specV1Power;
          // Specular V2
          uSpecV2Enabled.value = params.specV2Enabled ? 1.0 : 0.0;
          uSpecV2Intensity.value = params.specV2Intensity;
          uSpecV2Col.value.set(params.specV2Color);
          uSpecV2Dir.value.set(params.specV2DirX, params.specV2DirY, params.specV2DirZ).normalize();
          uSpecV2NoiseScale.value = params.specV2NoiseScale;
          uSpecV2NoiseStr.value = params.specV2NoiseStr;
          uSpecV2Power.value = params.specV2Power;
          uSpecV2TipBias.value = params.specV2TipBias;
          uGrassDensity.value = params.grassDensity;
          uLodEnabled.value = params.lodEnabled ? 1.0 : 0.0;
          uLodMidDist.value = params.lodMidDistance;
          uLodFarDist.value = params.lodFarDistance;
          uLodMaxDist.value = params.lodMaxDistance;
          uLodFadeStart.value = params.lodFadeStart;
          uLodDebug.value = params.lodDebug ? 1.0 : 0.0;
          lodCountMonitor.high = lastHighCount;
          lodCountMonitor.mid = lastMidCount;
          lodCountMonitor.far = lastFarCount;
          ambient.intensity = params.ambientIntensity;
          ambient.color.set(params.ambientColor);
          updateSkyParams();
          scene.environmentIntensity = params.environmentIntensity;
          if (params.fogEnabled) {
            fog.color.set(params.fogColor);
            fog.near = params.fogNear;
            fog.far = Math.max(params.fogFar, params.fogNear + 1);
            scene.fog = fog;
          } else {
            scene.fog = null;
          }
          if (params.cameraMode === "orbit") controls.update();
          renderer.render(scene, camera);
          stats.update();
        });
      }
    </script>
  </body>
</html>
