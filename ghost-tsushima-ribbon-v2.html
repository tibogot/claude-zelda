<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Tsushima Ribbon v2</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { overflow: hidden; background: #06090f; font-family: "SF Mono", monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 20;
        font-size: 11px; line-height: 1.6; color: #c8deff;
        background: rgba(4, 7, 14, 0.6);
        border: 1px solid rgba(160, 190, 255, 0.22);
        border-radius: 8px; padding: 10px 14px;
      }
      #hud b { color: #eef4ff; }
      /* Tweakpane panel */
      .tp-dfwv { width: 290px !important; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <b>Ghost Tsushima Ribbon v2</b><br />
      Smoke bands flowing over terrain<br />
      Orbit: <b>left-drag</b> &nbsp; Zoom: <b>wheel</b>
    </div>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import {
        Fn, uv, vec2, float, mix, smoothstep,
        floor, fract, sin, dot, time, uniform,
      } from "three/tsl";
      import { Pane } from "tweakpane";

      // ─── Renderer ────────────────────────────────────────────────────────────────
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060a10);
      scene.fog = new THREE.Fog(0x07091a, 30, 95);

      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
      camera.position.set(22, 12, 26);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(0, 1.5, -2);
      controls.maxPolarAngle = Math.PI * 0.52;
      controls.minDistance = 6;
      controls.maxDistance = 65;
      controls.update();

      // ─── Lighting ────────────────────────────────────────────────────────────────
      scene.add(new THREE.HemisphereLight(0x6080c0, 0x0a0e18, 0.5));
      const moon = new THREE.DirectionalLight(0xb0c8f0, 0.95);
      moon.position.set(-14, 20, 8);
      scene.add(moon);

      // ─── Terrain heightmap ───────────────────────────────────────────────────────
      function terrainH(x, z) {
        return (
          Math.exp(-((x - 6) ** 2 + (z + 4) ** 2) * 0.045) * 3.2 +
          Math.exp(-((x + 9) ** 2 + (z - 2) ** 2) * 0.055) * 2.6 +
          Math.exp(-((x + 1) ** 2 + (z + 14) ** 2) * 0.06)  * 2.0 +
          Math.sin(x * 0.14) * 0.28 + Math.cos(z * 0.11) * 0.22
        );
      }

      // ─── Ground mesh ─────────────────────────────────────────────────────────────
      const groundGeo = new THREE.PlaneGeometry(100, 100, 100, 100);
      groundGeo.rotateX(-Math.PI / 2);
      const gArr = groundGeo.attributes.position.array;
      for (let i = 0; i < gArr.length; i += 3)
        gArr[i + 1] = terrainH(gArr[i], gArr[i + 2]);
      groundGeo.computeVertexNormals();
      scene.add(new THREE.Mesh(groundGeo,
        new THREE.MeshStandardMaterial({ color: 0x0c111a, roughness: 0.97 })));

      // ─── Tree silhouettes ────────────────────────────────────────────────────────
      const treeMat = new THREE.MeshStandardMaterial({ color: 0x080d14, roughness: 1 });
      for (let i = 0; i < 55; i++) {
        const x = (Math.random() - 0.5) * 80;
        const z = (Math.random() - 0.5) * 80;
        if (Math.abs(x) < 14 && z > -20 && z < 14) continue;
        const h = 3 + Math.random() * 5;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.07, 0.15, h, 6), treeMat);
        trunk.position.set(x, terrainH(x, z) + h * 0.5, z);
        scene.add(trunk);
      }

      // ─── All tweakable parameters (defaults = current v2 look) ──────────────────
      const PARAMS = {
        // Motion — path head movement
        speedMult:      1.0,   // global multiplier on per-ribbon speed
        trailLenMult:   1.0,   // global multiplier on trail length
        latAmp:        14.0,   // main lateral meander amplitude
        latAmp2:        6.0,   // secondary lateral meander amplitude
        latFreq:        0.38,  // main Lissajous frequency factor
        latFreq2:       0.21,  // secondary Lissajous frequency factor
        vertAmp:        0.70,  // vertical bob amplitude
        vertFreq:       0.55,  // vertical bob frequency factor
        minClear:       0.38,  // minimum clearance above terrain

        // Wind
        windAngle:     -8.0,   // degrees (0=+X axis, matches original WIND direction)

        // Shape — ribbon geometry
        widthMult:      1.0,   // multiplier on per-ribbon width
        tiltOffset:     0.0,   // added to every ribbon's tilt (neg=more flat, pos=more vertical)

        // Rows — require Rebuild
        row0: { baseY: 0.5,  tiltBase: 0.30, count: 6 },
        row1: { baseY: 1.7,  tiltBase: 0.48, count: 5 },
        row2: { baseY: 3.0,  tiltBase: 0.63, count: 5 },
        row3: { baseY: 4.5,  tiltBase: 0.75, count: 4 },

        // Shader — affect all ribbon materials
        baseColor:       '#aacfff',
        hotColor:        '#ffd0a0',
        densityMult:     1.0,  // smoke density
        warpMult:        1.0,  // FBM warp distortion amount
        shaderSpeedMult: 1.0,  // texture animation speed

        // Scene
        fogNear:  30,
        fogFar:   95,
      };

      // ─── Wind vectors (derived from PARAMS.windAngle) ────────────────────────────
      let wX = 1, wZ = 0, pX = 0, pZ = -1; // will be set by applyWindAngle()

      function applyWindAngle() {
        const a = PARAMS.windAngle * Math.PI / 180;
        wX = Math.cos(a); wZ = Math.sin(a);
        pX = wZ;          pZ = -wX; // perpendicular in XZ
      }
      applyWindAngle();

      // ─── TSL FBM smoke shader ────────────────────────────────────────────────────
      const hash2 = Fn(([p]) =>
        vec2(
          fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453)),
          fract(sin(dot(p, vec2(269.5, 183.3))).mul(43758.5453)),
        ),
      );

      const gradNoise = Fn(([p]) => {
        const i = floor(p).toVar();
        const f = fract(p).toVar();
        const u = f.mul(f).mul(float(3).sub(f.mul(2))).toVar();
        const g00 = hash2(i).mul(2).sub(1);
        const g10 = hash2(i.add(vec2(1, 0))).mul(2).sub(1);
        const g01 = hash2(i.add(vec2(0, 1))).mul(2).sub(1);
        const g11 = hash2(i.add(vec2(1, 1))).mul(2).sub(1);
        return mix(
          mix(dot(g00, f), dot(g10, f.sub(vec2(1, 0))), u.x),
          mix(dot(g01, f.sub(vec2(0, 1))), dot(g11, f.sub(vec2(1, 1))), u.x),
          u.y,
        ).mul(0.5).add(0.5);
      });

      const fbm5 = Fn(([p]) => {
        let v = gradNoise(p).mul(0.54);
        v = v.add(gradNoise(p.mul(2.03)).mul(0.25));
        v = v.add(gradNoise(p.mul(4.17)).mul(0.12));
        v = v.add(gradNoise(p.mul(8.21)).mul(0.06));
        v = v.add(gradNoise(p.mul(16.4)).mul(0.03));
        return v;
      });

      // Returns { mat, shaderBase, shaderUniforms } so uniforms can be updated later
      function createFogLineMaterial(seed) {
        const rng = seededRng((seed * 3579 + 19384) | 0);
        const baseShaderSpeed = 0.28 + rng() * 0.18;
        const baseDensity     = 1.1  + rng() * 0.45;
        const baseWarp        = 0.38 + rng() * 0.28;

        const uSpeed     = uniform(baseShaderSpeed * PARAMS.shaderSpeedMult);
        const uWidthSoft = uniform(1.6 + rng() * 0.4);
        const uDensity   = uniform(baseDensity * PARAMS.densityMult);
        const uStretchX  = uniform(11  + rng() * 8);
        const uStretchY  = uniform(2.0 + rng() * 1.0);
        const uWarp      = uniform(baseWarp * PARAMS.warpMult);
        const uSeed      = uniform(seed);
        const uBaseColor = uniform(new THREE.Color(PARAMS.baseColor));
        const uHotColor  = uniform(new THREE.Color(PARAMS.hotColor));

        const mat = new THREE.MeshBasicNodeMaterial({
          transparent: true, blending: THREE.AdditiveBlending,
          depthWrite: false,  side: THREE.DoubleSide,
        });
        const st = uv();
        const t  = time.mul(uSpeed);
        const p0 = vec2(
          st.x.mul(uStretchX).add(t.mul(1.3)).add(uSeed),
          st.y.sub(0.5).mul(uStretchY).sub(t.mul(0.15)),
        ).toVar();
        const warpX = fbm5(p0.mul(0.6).add(vec2(0.0, t.mul(0.45)))).sub(0.5);
        const warpY = fbm5(p0.mul(0.8).sub(vec2(t.mul(0.35), 0.0))).sub(0.5);
        const p     = p0.add(vec2(warpX, warpY).mul(uWarp)).toVar();
        const n1    = fbm5(p).toVar();
        const n2    = fbm5(p.mul(2.5).add(vec2(t.mul(0.28), t.mul(-0.22)))).toVar();
        const n3    = fbm5(vec2(p.x.mul(0.35), p.y.mul(2.45).add(n1.mul(1.7)))).toVar();
        const center    = float(1.0).sub(st.y.sub(0.5).abs().mul(uWidthSoft)).saturate().pow(1.4).toVar();
        const tips      = smoothstep(0.02, 0.14, st.x).mul(smoothstep(0.02, 0.2, float(1.0).sub(st.x))).toVar();
        const wisps     = smoothstep(0.44, 0.9, n1.mul(0.8).add(n2.mul(0.72))).toVar();
        const filaments = float(1.0).sub(n3.sub(0.5).abs().mul(2.0)).pow(2.1).toVar();
        const alpha     = center.mul(tips).mul(wisps.mul(0.85).add(filaments.mul(0.52))).mul(uDensity).saturate().toVar();
        const glowMask  = smoothstep(0.72, 1.0, n2).mul(0.34);
        const col = mix(uBaseColor, uHotColor, glowMask.add(alpha.mul(0.3)))
                      .mul(alpha.mul(1.1).add(glowMask.mul(0.8)));
        mat.colorNode   = col;
        mat.opacityNode = alpha;

        return {
          mat,
          shaderBase: { baseShaderSpeed, baseDensity, baseWarp },
          shaderUniforms: { uSpeed, uDensity, uWarp, uBaseColor, uHotColor },
        };
      }

      // ─── Animated ribbon system ───────────────────────────────────────────────────
      const SAMPLES   = 64;
      const scrPts    = Array.from({ length: SAMPLES }, () => ({ x: 0, y: 0, z: 0 }));

      function seededRng(seed) {
        let s = (seed * 9301 + 49297) | 0;
        return () => {
          s = (s + 0x6D2B79F5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function createRibbonData({ cx, cz, baseY, baseTrailLen, baseWidth, baseTilt, baseSpeed, seed }) {
        const rng = seededRng((seed * 1e5) | 0);
        const ra = rng(), rb = rng(), rc = rng(), rd = rng(), re = rng();

        const posArr  = new Float32Array(SAMPLES * 2 * 3);
        const uvArr   = new Float32Array(SAMPLES * 2 * 2);
        const idxArr  = [];
        for (let i = 0; i < SAMPLES; i++) {
          const u = i / (SAMPLES - 1);
          uvArr.set([u, 0], i * 4);
          uvArr.set([u, 1], i * 4 + 2);
        }
        for (let i = 0; i < SAMPLES - 1; i++) {
          const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
          idxArr.push(a, c, b, b, c, d);
        }

        const geo     = new THREE.BufferGeometry();
        const posAttr = new THREE.BufferAttribute(posArr, 3);
        posAttr.setUsage(THREE.DynamicDrawUsage);
        geo.setAttribute("position", posAttr);
        geo.setAttribute("uv", new THREE.BufferAttribute(uvArr, 2));
        geo.setIndex(idxArr);

        const { mat, shaderBase, shaderUniforms } = createFogLineMaterial(seed);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder   = 40;
        mesh.frustumCulled = false;

        return { cx, cz, baseY, baseTrailLen, baseWidth, baseTilt, baseSpeed,
                 ra, rb, rc, rd, re, geo, mesh, shaderBase, shaderUniforms };
      }

      // Head position at time t — reads PARAMS live
      function headAt(ribbon, t, out) {
        const { cx, cz, baseY, baseSpeed, ra, rb, rc, rd, re } = ribbon;

        const speed    = baseSpeed * PARAMS.speedMult;
        const latAmp   = PARAMS.latAmp;
        const latAmp2  = PARAMS.latAmp2;
        const latFreq  = PARAMS.latFreq;
        const latFreq2 = PARAMS.latFreq2;
        const vertAmp  = PARAMS.vertAmp;
        const vertFreq = PARAMS.vertFreq;

        const lat     = Math.sin(latFreq  * ra * t + 6.0 * rb) * latAmp  * ra
                      + Math.sin(latFreq2 * rc * t + 6.0 * rd) * latAmp2 * rc;
        const windAdv = speed * t;

        const x = cx + wX * windAdv + pX * lat;
        const z = cz + wZ * windAdv + pZ * lat;

        const vertBob = Math.sin(vertFreq * re * t + 6.0 * ra) * vertAmp * re;
        const y = Math.max(terrainH(x, z) + PARAMS.minClear, baseY + vertBob);

        out.x = x; out.y = y; out.z = z;
      }

      function updateRibbon(ribbon, elapsed) {
        const { baseTrailLen, baseWidth, baseTilt, baseSpeed, geo } = ribbon;

        const speed    = baseSpeed * PARAMS.speedMult;
        const trailLen = baseTrailLen * PARAMS.trailLenMult;
        const timeStep = trailLen / (speed * SAMPLES);
        const width    = baseWidth * PARAMS.widthMult;
        const tilt     = Math.max(0, Math.min(1, baseTilt + PARAMS.tiltOffset));

        for (let i = 0; i < SAMPLES; i++)
          headAt(ribbon, elapsed - i * timeStep, scrPts[i]);

        const posArr = geo.attributes.position.array;
        for (let i = 0; i < SAMPLES; i++) {
          const p    = scrPts[i];
          const prev = scrPts[Math.max(0, i - 1)];
          const next = scrPts[Math.min(SAMPLES - 1, i + 1)];

          let tx = next.x - prev.x, ty = next.y - prev.y, tz = next.z - prev.z;
          const tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
          tx /= tl; ty /= tl; tz /= tl;

          let hx = -tz, hz = tx;
          const hl = Math.sqrt(hx * hx + hz * hz) || 1;
          hx /= hl; hz /= hl;

          let sx = hx * (1 - tilt), sy = tilt, sz = hz * (1 - tilt);
          const sl = Math.sqrt(sx * sx + sy * sy + sz * sz) || 1;
          sx /= sl; sy /= sl; sz /= sl;

          const hw = width * 0.5;
          const vi = i * 6;
          posArr[vi]     = p.x - sx * hw;  posArr[vi + 1] = p.y - sy * hw;  posArr[vi + 2] = p.z - sz * hw;
          posArr[vi + 3] = p.x + sx * hw;  posArr[vi + 4] = p.y + sy * hw;  posArr[vi + 5] = p.z + sz * hw;
        }

        geo.attributes.position.needsUpdate = true;
        geo.computeBoundingSphere();
      }

      // ─── Ribbon pool ─────────────────────────────────────────────────────────────
      const ribbons    = [];
      const bandGroup  = new THREE.Group();
      scene.add(bandGroup);

      function buildRibbons() {
        // Dispose existing
        for (const r of ribbons) {
          bandGroup.remove(r.mesh);
          r.geo.dispose();
          r.mesh.material.dispose();
        }
        ribbons.length = 0;

        const rowCfgs = [PARAMS.row0, PARAMS.row1, PARAMS.row2, PARAMS.row3];
        let idx = 0;
        rowCfgs.forEach((row, ri) => {
          for (let col = 0; col < row.count; col++) {
            const rng        = seededRng(idx * 43 + 13);
            const cx         = (col - (row.count - 1) * 0.5) * 7.0 + (rng() - 0.5) * 2.0;
            const cz         = -3 - ri * 6.0 + (rng() - 0.5) * 2.0;
            const baseTilt   = Math.max(0.05, Math.min(0.95, row.tiltBase + (rng() - 0.5) * 0.2));
            const baseWidth  = 1.1 + rng() * 1.0;
            const baseSpeed  = 1.8 + rng() * 2.2;
            const baseTrailLen = 38 + rng() * 14;
            const seed       = idx * 0.137 + 0.03;

            const data = createRibbonData({
              cx, cz, baseY: row.baseY, baseTrailLen, baseWidth, baseTilt, baseSpeed, seed,
            });
            ribbons.push(data);
            bandGroup.add(data.mesh);
            idx++;
          }
        });
      }

      function updateShaderUniforms() {
        const newBase = new THREE.Color(PARAMS.baseColor);
        const newHot  = new THREE.Color(PARAMS.hotColor);
        for (const r of ribbons) {
          const { shaderBase: sb, shaderUniforms: su } = r;
          su.uSpeed.value    = sb.baseShaderSpeed * PARAMS.shaderSpeedMult;
          su.uDensity.value  = sb.baseDensity     * PARAMS.densityMult;
          su.uWarp.value     = sb.baseWarp        * PARAMS.warpMult;
          su.uBaseColor.value.copy(newBase);
          su.uHotColor.value.copy(newHot);
        }
      }

      buildRibbons();

      // ─── Tweakpane ───────────────────────────────────────────────────────────────
      const pane = new Pane({ title: 'Ribbon Controls' });

      // ── MOTION ──────────────────────────────────────────────────────────────────
      const fMotion = pane.addFolder({ title: 'Motion', expanded: true });
      fMotion.addBinding(PARAMS, 'speedMult',    { min: 0.05, max: 6,   step: 0.01, label: 'Speed ×' });
      fMotion.addBinding(PARAMS, 'trailLenMult', { min: 0.1,  max: 4,   step: 0.01, label: 'Trail Length ×' });
      fMotion.addBinding(PARAMS, 'latAmp',       { min: 0,    max: 40,  step: 0.1,  label: 'Lateral Amp 1' });
      fMotion.addBinding(PARAMS, 'latAmp2',      { min: 0,    max: 20,  step: 0.1,  label: 'Lateral Amp 2' });
      fMotion.addBinding(PARAMS, 'latFreq',      { min: 0.01, max: 1.5, step: 0.01, label: 'Lateral Freq 1' });
      fMotion.addBinding(PARAMS, 'latFreq2',     { min: 0.01, max: 1.2, step: 0.01, label: 'Lateral Freq 2' });
      fMotion.addBinding(PARAMS, 'vertAmp',      { min: 0,    max: 5,   step: 0.05, label: 'Vertical Amp' });
      fMotion.addBinding(PARAMS, 'vertFreq',     { min: 0.01, max: 2,   step: 0.01, label: 'Vertical Freq' });
      fMotion.addBinding(PARAMS, 'minClear',     { min: 0,    max: 4,   step: 0.05, label: 'Ground Clearance' });
      fMotion.addBinding(PARAMS, 'windAngle',    { min: -180, max: 180, step: 1,    label: 'Wind Angle °' })
        .on('change', () => applyWindAngle());

      // ── SHAPE ───────────────────────────────────────────────────────────────────
      const fShape = pane.addFolder({ title: 'Shape', expanded: false });
      fShape.addBinding(PARAMS, 'widthMult',  { min: 0.1, max: 5,    step: 0.05, label: 'Width ×' });
      fShape.addBinding(PARAMS, 'tiltOffset', { min: -0.9, max: 0.9, step: 0.01, label: 'Tilt Offset' });

      fShape.addBlade({ view: 'separator' });

      const rowLabels = ['Row 0 (ground)', 'Row 1', 'Row 2', 'Row 3 (high)'];
      const rowKeys   = ['row0', 'row1', 'row2', 'row3'];
      rowKeys.forEach((key, i) => {
        const fr = fShape.addFolder({ title: rowLabels[i], expanded: false });
        fr.addBinding(PARAMS[key], 'baseY',     { min: 0,   max: 10,  step: 0.1,  label: 'Base Height' });
        fr.addBinding(PARAMS[key], 'tiltBase',  { min: 0.0, max: 1.0, step: 0.01, label: 'Base Tilt' });
        fr.addBinding(PARAMS[key], 'count',     { min: 1,   max: 12,  step: 1,    label: 'Count' });
      });

      fShape.addBlade({ view: 'separator' });
      fShape.addButton({ title: 'Rebuild Ribbons (apply row changes)' })
        .on('click', () => buildRibbons());

      // ── SHADER ──────────────────────────────────────────────────────────────────
      const fShader = pane.addFolder({ title: 'Shader', expanded: false });
      fShader.addBinding(PARAMS, 'baseColor',       { label: 'Base Color' })
        .on('change', () => updateShaderUniforms());
      fShader.addBinding(PARAMS, 'hotColor',        { label: 'Hot Color' })
        .on('change', () => updateShaderUniforms());
      fShader.addBinding(PARAMS, 'densityMult',     { min: 0.1, max: 4,   step: 0.05, label: 'Density ×' })
        .on('change', () => updateShaderUniforms());
      fShader.addBinding(PARAMS, 'warpMult',        { min: 0,   max: 3,   step: 0.05, label: 'Warp ×' })
        .on('change', () => updateShaderUniforms());
      fShader.addBinding(PARAMS, 'shaderSpeedMult', { min: 0.1, max: 5,   step: 0.05, label: 'Shader Speed ×' })
        .on('change', () => updateShaderUniforms());

      // ── SCENE ───────────────────────────────────────────────────────────────────
      const fScene = pane.addFolder({ title: 'Scene', expanded: false });
      fScene.addBinding(PARAMS, 'fogNear', { min: 1,  max: 80,  step: 0.5, label: 'Fog Near' })
        .on('change', () => { scene.fog.near = PARAMS.fogNear; });
      fScene.addBinding(PARAMS, 'fogFar',  { min: 20, max: 200, step: 1,   label: 'Fog Far' })
        .on('change', () => { scene.fog.far = PARAMS.fogFar; });

      // ─── Render loop ─────────────────────────────────────────────────────────────
      const t0 = performance.now();

      renderer.setAnimationLoop(() => {
        const elapsed = (performance.now() - t0) / 1000;
        controls.update();
        for (const r of ribbons) updateRibbon(r, elapsed);
        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
