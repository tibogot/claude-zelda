        const maxCx = THREE.MathUtils.clamp(maxC.cx, 0, maxChunk);
        const maxCz = THREE.MathUtils.clamp(maxC.cz, 0, maxChunk);

        const brushedChunkKeys = new Set();

        for (let cz = minCz; cz <= maxCz; cz++) {
          for (let cx = minCx; cx <= maxCx; cx++) {
            const heights = ensureChunkData(cx, cz);
            const cminX = chunkMinWorldX(cx);
            const cminZ = chunkMinWorldZ(cz);
            let changed = false;

            for (let iz = 0; iz <= CONFIG.dataResolution; iz++) {
              const wz = cminZ + iz * step;
              for (let ix = 0; ix <= CONFIG.dataResolution; ix++) {
                const wx = cminX + ix * step;
                const t = THREE.MathUtils.clamp(
                  ((wx - ptA.x) * dx + (wz - ptA.z) * dz) / lenSq,
                  0,
                  1
                );
                const perpX = ptA.x + t * dx - wx;
                const perpZ = ptA.z + t * dz - wz;
                const perpSq = perpX * perpX + perpZ * perpZ;
                if (perpSq > radiusSq) continue;
                const falloff = Math.pow(1 - Math.sqrt(perpSq) / radius, 2);
                const targetY = ptA.y + t * (ptB.y - ptA.y);
                const idx = getChunkDataIndex(ix, iz);
                const current = heights[idx];
                heights[idx] = THREE.MathUtils.clamp(
                  current + (targetY - current) * falloff * strength,
                  PARAMS.sculptClampMin,
                  PARAMS.sculptClampMax
                );
                changed = true;
              }
            }

            if (changed) {
              const k = chunkKey(cx, cz);
              dirtyChunks.add(k);
              brushedChunkKeys.add(k);
            }
          }
        }

        const midx = (ptA.x + ptB.x) * 0.5;
        const midz = (ptA.z + ptB.z) * 0.5;
        const seamR = radius + Math.hypot(dx, dz) * 0.5 + step * 2;
        finalizeSculpt(brushedChunkKeys, { wx: midx, wz: midz, radius: seamR });
        syncTreeLodHeights();
        syncPTreeHeights();
        syncObjectSlotsHeights();
        syncPropObjectsHeights();
      }

      function applySculptAt(worldPoint, event) {
        if (event.altKey) {
          applyFlattenAt(worldPoint, editState.sculptFlattenTargetY);
        } else if (event.ctrlKey) {
          applySmoothAt(worldPoint);
        } else if (
          (PARAMS.sculptTool === "noise" || PARAMS.sculptTool === "terrace") &&
          event.shiftKey
        ) {
          applyRaiseLowerAt(worldPoint, -1);
        } else if (PARAMS.sculptTool === "noise") {
          applyNoiseAt(worldPoint);
        } else if (PARAMS.sculptTool === "terrace") {
          applyTerraceAt(worldPoint);
        } else if (PARAMS.sculptTool === "erosion") {
          applyErosionBrushAt(worldPoint);
        } else {
          applyRaiseLowerAt(worldPoint, editState.sculptSign);
        }
      }

      function applyPaintAtWorld(center, erase) {
        const R = CONFIG.paint.radius;
        const res = CONFIG.splatRes;
        const maxChunk = getMaxChunkIndex();
        const minC = worldToChunkIndex(center.x - R, center.z - R);
        const maxC = worldToChunkIndex(center.x + R, center.z + R);
        const minCx = THREE.MathUtils.clamp(minC.cx, 0, maxChunk);
        const minCz = THREE.MathUtils.clamp(minC.cz, 0, maxChunk);
        const maxCx = THREE.MathUtils.clamp(maxC.cx, 0, maxChunk);
        const maxCz = THREE.MathUtils.clamp(maxC.cz, 0, maxChunk);
        const ch = editState.paintChannel;
        const flow = CONFIG.paint.strength * 255;

        for (let cz = minCz; cz <= maxCz; cz++) {
          for (let cx = minCx; cx <= maxCx; cx++) {
            const splat = ensureChunkSplat(cx, cz);
            const img = splat.ctx.getImageData(0, 0, res, res);
            const data = img.data;
            const c = chunkCenterWorld(cx, cz);
            const cs = CONFIG.chunkSize;
            let touched = false;
            for (let py = 0; py < res; py++) {
              for (let px = 0; px < res; px++) {
                const uTex = (px + 0.5) / res;
                const vTex = (py + 0.5) / res;
                const wx = c.x + (uTex - 0.5) * cs;
                const wz = c.z + (vTex - 0.5) * cs;
                const dx = wx - center.x;
                const dz = wz - center.z;
                const dist = Math.hypot(dx, dz);
                if (dist > R) continue;
                const falloff = 1 - dist / R;
                const delta = (erase ? -1 : 1) * flow * falloff;
                const i = (py * res + px) * 4;
                data[i + ch] = THREE.MathUtils.clamp(data[i + ch] + delta, 0, 255);
                touched = true;
              }
            }
            if (touched) {
              splat.ctx.putImageData(img, 0, 0);
              splat.tex.needsUpdate = true;
            }
          }
        }
      }

      /** Path [ L ]: splatmap blue (path / “village” layer) + gentle flatten like splatmap-painter `pathPaintAt`. */
      function pathPaintAt(center) {
        const R = CONFIG.paint.radius;
        const res = CONFIG.splatRes;
        const maxChunk = getMaxChunkIndex();
        const minC = worldToChunkIndex(center.x - R, center.z - R);
        const maxC = worldToChunkIndex(center.x + R, center.z + R);
        const minCx = THREE.MathUtils.clamp(minC.cx, 0, maxChunk);
        const minCz = THREE.MathUtils.clamp(minC.cz, 0, maxChunk);
        const maxCx = THREE.MathUtils.clamp(maxC.cx, 0, maxChunk);
        const maxCz = THREE.MathUtils.clamp(maxC.cz, 0, maxChunk);
        const flowBase = (brushStr / 100) * 255;

        for (let cz = minCz; cz <= maxCz; cz++) {
          for (let cx = minCx; cx <= maxCx; cx++) {
            const splat = ensureChunkSplat(cx, cz);
            const img = splat.ctx.getImageData(0, 0, res, res);
            const data = img.data;
            const c = chunkCenterWorld(cx, cz);
            const cs = CONFIG.chunkSize;
            let touched = false;
            for (let py = 0; py < res; py++) {
              for (let px = 0; px < res; px++) {
                const uTex = (px + 0.5) / res;
                const vTex = (py + 0.5) / res;
                const wx = c.x + (uTex - 0.5) * cs;
                const wz = c.z + (vTex - 0.5) * cs;
                const dx = wx - center.x;
                const dz = wz - center.z;
                const dist = Math.hypot(dx, dz);
                if (dist > R) continue;
                const falloff = 1 - dist / R;
                const delta = flowBase * falloff;
                const i = (py * res + px) * 4;
                data[i + 2] = THREE.MathUtils.clamp(data[i + 2] + delta, 0, 255);
                touched = true;
              }
            }
            if (touched) {
              splat.ctx.putImageData(img, 0, 0);
              splat.tex.needsUpdate = true;
            }
          }
        }

        if (PARAMS.path.flattenStrength <= 0) return;

        const targetY = getWorldHeight(center.x, center.z);
        const radiusSq = R * R;
        const step = CONFIG.chunkSize / CONFIG.dataResolution;
        const brushedChunkKeys = new Set();

        for (let cz = minCz; cz <= maxCz; cz++) {
          for (let cx = minCx; cx <= maxCx; cx++) {
            const heights = ensureChunkData(cx, cz);
            const minX = chunkMinWorldX(cx);
            const minZ = chunkMinWorldZ(cz);
            let changed = false;

            for (let iz = 0; iz <= CONFIG.dataResolution; iz++) {
              const wz = minZ + iz * step;
              const dz = wz - center.z;
              if (Math.abs(dz) > R) continue;

              for (let ix = 0; ix <= CONFIG.dataResolution; ix++) {
                const wx = minX + ix * step;
                const dx = wx - center.x;
                if (Math.abs(dx) > R) continue;

                const distSq = dx * dx + dz * dz;
                if (distSq > radiusSq) continue;
                const t = Math.sqrt(distSq) / R;
                const falloff = (1 - t) * (1 - t);
                const idx = getChunkDataIndex(ix, iz);
                const cur = heights[idx];
                heights[idx] = THREE.MathUtils.clamp(
                  cur + (targetY - cur) * falloff * PARAMS.path.flattenStrength * 0.08,
                  PARAMS.sculptClampMin,
                  PARAMS.sculptClampMax
                );
                changed = true;
              }
            }

            if (changed) {
              const k = chunkKey(cx, cz);
              dirtyChunks.add(k);
              brushedChunkKeys.add(k);
            }
          }
        }

        if (brushedChunkKeys.size > 0) {
          finalizeSculpt(brushedChunkKeys, { wx: center.x, wz: center.z, radius: R });
          rebuildDirtyActiveChunks(12);
        }
      }

      function clearPathSplatBlueAllChunks() {
        const res = CONFIG.splatRes;
        for (const splat of chunkSplatMap.values()) {
          const img = splat.ctx.getImageData(0, 0, res, res);
          const d = img.data;
          for (let i = 0; i < d.length; i += 4) d[i + 2] = 0;
          splat.ctx.putImageData(img, 0, 0);
          splat.tex.needsUpdate = true;
        }
        refreshActiveChunkMaterials();
      }

      function updatePointerNdc(event) {
        pointerNdc.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointerNdc.y = -(event.clientY / window.innerHeight) * 2 + 1;
      }

      function raycastTerrainPoint() {
        const meshes = _terrainRaycastMeshes;
        meshes.length = 0;
        for (const chunk of activeChunks.values()) meshes.push(chunk.mesh);
        if (meshes.length === 0) return null;

        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(meshes, false);
        for (let i = 0; i < hits.length; i++) {
          const h = hits[i];
          const geom = h.object.geometry;
          const nTerrain = geom.userData.terrainTriCount;
          if (typeof nTerrain === "number" && h.faceIndex != null && h.faceIndex >= nTerrain) {
            continue;
          }
          return h.point;
        }
        return null;
      }

      function generateRiverMesh(curve, width, segments, heightOffset) {
        const pts = curve.getSpacedPoints(segments);
        const arcLen = [0];
        for (let i = 1; i <= segments; i++) {
          arcLen.push(arcLen[i - 1] + pts[i].distanceTo(pts[i - 1]));
        }
        const totalLen = arcLen[segments] || 1;
        const positions = [];
        const uvs = [];
        const indices = [];
        for (let i = 0; i <= segments; i++) {
          const u = arcLen[i] / totalLen;
          const pos = pts[i];
          const prev = pts[Math.max(0, i - 1)];
          const next = pts[Math.min(segments, i + 1)];
          const tan = next.clone().sub(prev).normalize();
          const perp = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
          const half = width / 2;
          const lx = pos.x - perp.x * half;
          const lz = pos.z - perp.z * half;
          const rx = pos.x + perp.x * half;
          const rz = pos.z + perp.z * half;
          positions.push(lx, getWorldHeight(lx, lz) + heightOffset, lz);
          positions.push(rx, getWorldHeight(rx, rz) + heightOffset, rz);
          uvs.push(u, 0, u, 1);
          if (i < segments) {
            const b = i * 2;
            indices.push(b, b + 2, b + 1, b + 1, b + 2, b + 3);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      function riverClearMesh() {
        if (riverMesh) {
          scene.remove(riverMesh);
          riverMesh.geometry.dispose();
          riverMesh = null;
        }
      }

      function riverGenerate() {
        if (riverPoints.length < 2) return;
        riverClearMesh();
        const curve = new THREE.CatmullRomCurve3(riverPoints, false, "catmullrom", 0.5);
        const geo = generateRiverMesh(
          curve,
          PARAMS.river.width,
          PARAMS.river.segments,
          PARAMS.river.heightOffset
        );
        riverMesh = new THREE.Mesh(geo, riverMat);
        riverMesh.renderOrder = 2;
        scene.add(riverMesh);
      }

      function riverRebuildVisual() {
        while (riverGroup.children.length) {
          const child = riverGroup.children[0];
          riverGroup.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
        riverPointMeshes = [];
        riverPoints.forEach((pt, i) => {
          const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 8, 8),
            new THREE.MeshBasicMaterial({ color: i === riverSelectedIdx ? 0xffff00 : 0x0088ff })
          );
          sphere.position.copy(pt);
          riverGroup.add(sphere);
          riverPointMeshes.push(sphere);
        });
        if (riverPoints.length >= 2) {
          const curve = new THREE.CatmullRomCurve3(riverPoints, false, "catmullrom", 0.5);
          const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(60));
          const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x00aaff }));
          riverGroup.add(line);
          riverPointMeshes.push(line);
          riverGenerate();
        } else {
          riverClearMesh();
        }
      }

      function riverAddPoint(p) {
        riverPoints.push(p.clone());
        riverSelectedIdx = riverPoints.length - 1;
        riverRebuildVisual();
        riverUpdateSelectedYParam();
      }

      function riverDeleteSelected() {
        if (riverSelectedIdx < 0 || riverPoints.length === 0) return;
        riverPoints.splice(riverSelectedIdx, 1);
        riverSelectedIdx = Math.min(riverSelectedIdx, riverPoints.length - 1);
        riverRebuildVisual();
        riverUpdateSelectedYParam();
      }

      function riverMoveSelected(pos) {
        if (riverSelectedIdx < 0) return;
        const currentY = riverPoints[riverSelectedIdx].y;
        riverPoints[riverSelectedIdx].copy(pos);
        riverPoints[riverSelectedIdx].y = currentY;
        riverRebuildVisual();
      }

      function riverUpdateSelectedYParam() {
        if (riverSelectedIdx >= 0 && riverSelectedIdx < riverPoints.length) {
          PARAMS.river.selectedPointY = riverPoints[riverSelectedIdx].y;
        }
        if (editorPane) editorPane.refresh();
      }

      function riverPickPoint(event) {
        updatePointerNdc(event);
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(riverPointMeshes.filter((m) => m.isMesh), false);
        if (hits.length === 0) return -1;
        return riverPointMeshes.indexOf(hits[0].object);
      }

      function splineRebuildVisual() {

          if (child.material) child.material.dispose();

        splineClearPreview();
      }

      function splinePickPoint(event) {
        updatePointerNdc(event);
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(splinePointMeshes, false);
        if (hits.length > 0) return splinePointMeshes.indexOf(hits[0].object);
        return -1;
      }

      function splineClearPreview() {
        while (splinePreviewGroup.children.length) {
          const child = splinePreviewGroup.children[0];
          splinePreviewGroup.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
      }

      function splineGetSamples() {
        if (splinePoints.length < 2) return [];
        const curve = new THREE.CatmullRomCurve3(
          splinePoints,
          PARAMS.spline.closed,
          "catmullrom",
          0.5
        );
        const totalLength = curve.getLength();
        const count = Math.max(1, Math.floor(totalLength / PARAMS.spline.spacing));
        const samples = [];
        for (let i = 0; i <= count; i++) {
          const t = i / count;
          const pos = curve.getPoint(t);
          const tangent = curve.getTangent(t);
          const angleY = Math.atan2(tangent.x, tangent.z);
          samples.push({ pos, angleY });
        }
        return samples;
      }

      function splinePreview() {
        splineClearPreview();
        const samples = splineGetSamples();
        if (samples.length === 0) return;
        const geo = new THREE.SphereGeometry(0.35, 6, 4);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00ff88, depthTest: false });
        samples.forEach(({ pos }) => {
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(pos.x, pos.y + 0.5, pos.z);
          mesh.renderOrder = 101;
          splinePreviewGroup.add(mesh);
        });
      }

      function splineBake() {
        const samples = splineGetSamples();
        if (samples.length === 0) return;
        const type = PARAMS.spline.objectType;
        const scaleRange = PARAMS.spline.scaleMax - PARAMS.spline.scaleMin;

        if (type === "trees") {
          const slot = LOD_SLOTS[activeLodSlot];
          if (!slot.ready) {
            console.warn("Spline bake: active Tree LOD slot has no model yet.");
            return;
          }
          const ms2 = slot.minSpacing * slot.minSpacing;
          samples.forEach(({ pos, angleY }) => {
            const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
            const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
            let x = pos.x;
            let z = pos.z;
            x = THREE.MathUtils.clamp(x, worldBounds.min.x, worldBounds.max.x);
            z = THREE.MathUtils.clamp(z, worldBounds.min.z, worldBounds.max.z);
            if (ms2 > 0 && slot.positions.some((p) => (p.x - x) ** 2 + (p.z - z) ** 2 < ms2)) return;
            const y = getWorldHeight(x, z);
            slot.positions.push({ x, y, z, scale, rot });
          });
          _rebuildLODChunks(slot);
        } else if (type === "fleurs") {
          if (!fleurSystem) return;
          const existing = fleurSystem.getPositions();
          samples.forEach(({ pos, angleY }) => {
            const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
            const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
            existing.push({
              x: pos.x,
              z: pos.z,
              rot,
              scale,
              yOffset: fleurParams.hoverBase + (Math.random() - 0.5) * 2 * fleurParams.hoverVariance,
              colorSlot: fleurActiveSlot,
              variant: "ground",
              maskIndex: 0
            });
          });
          fleurSystem.setPositions(existing);
          if (fleurSystem.syncHeights) fleurSystem.syncHeights();
        } else if (type.startsWith("foliage")) {
          const slotIdx = parseInt(type.replace("foliage", ""), 10);
          const slot = FOLIAGE_SLOTS[slotIdx];
          if (slot?.system) {
            const existing = slot.system.getPositions();
            samples.forEach(({ pos, angleY }) => {
              const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
              const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
              existing.push({ x: pos.x, z: pos.z, rot, scale });
            });
            slot.system.setPositions(existing);
            if (slot.system.syncHeights) slot.system.syncHeights();
          }
        } else if (type.startsWith("object")) {
          const slotIdx = parseInt(type.replace("object", ""), 10);
          const slot = OBJECT_SLOTS[slotIdx];
          if (slot?.system) {
            const existing = slot.system.getPositions();
            samples.forEach(({ pos, angleY }) => {
              const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
              const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
              existing.push({ x: pos.x, z: pos.z, rot, scale });
            });
            slot.system.setPositions(existing);
            if (slot.system.syncHeights) slot.system.syncHeights();
          }
        } else {
          console.warn("Spline bake: unsupported object type in chunks build:", type);
          return;
        }

        splineClearPreview();
        splineClearAll();
        bakeBVH();
        syncTreeLodHeights();
        syncPTreeHeights();
        syncObjectSlotsHeights();
        syncPropObjectsHeights();
        if (fleurSystem) fleurSystem.syncHeights();
      }

      const frameState = {

      function uiTypingTarget(el) {
        if (!el || el === document.body) return false;

        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
        return el.closest?.(".tp-dfwv") != null;

      /** True only for fields where Ctrl+Z should edit text, not terrain. */
      function isEditableTextTarget(el) {
        if (!el) return false;
        const tag = el.tagName;
        if (tag === "TEXTAREA" || tag === "SELECT") return true;
        if (tag === "INPUT") {
          const type = (el.type || "text").toLowerCase();
          if (
            type === "button" ||
            type === "checkbox" ||
            type === "color" ||
            type === "file" ||
            type === "hidden" ||
            type === "radio" ||
            type === "range" ||
            type === "reset" ||
            type === "submit"

        if (el.isContentEditable) return true;

        }
        if (event.code === "KeyV") {

          setEditMode(editState.mode === "path" ? "view" : "path");

        if (event.code === "KeyD") {

        if (
          event.code === "KeyE" &&
          editState.mode !== "place" &&
          editState.mode !== "cliffs" &&

          editState.mode !== "decal"
        ) {

          setEditMode(editState.mode === "objects" ? "view" : "objects");

        }
        if (
          editState.mode === "place" ||
          editState.mode === "cliffs" ||
          editState.mode === "props" ||
          editState.mode === "decal"
        ) {
          if (event.code === "KeyW") {
            event.preventDefault();
            transformControls.setMode("translate");

          if (event.code === "KeyE") {

            transformControls.setMode("rotate");

          if (event.code === "KeyR") {
            event.preventDefault();
            transformControls.setMode("scale");

          }
          if (event.code === "Delete") {
            event.preventDefault();
            if (editState.mode === "cliffs" && cliffInstancer.hasSelection()) {
              cliffInstancer.deleteSelected();
              invalidateBvhHeight();
              ciRefreshProxy();
              if (editorPane) editorPane.refresh();
              transformControls.detach();
              tcHelper.visible = false;
              return;
            }
            if (editState.mode === "place" && selectedCliff) {
              scene.remove(selectedCliff);
              cliffObjects = cliffObjects.filter((c) => c !== selectedCliff);
              selectCliff(null);
              invalidateBvhHeight();

            if (editState.mode === "props" && selectedProp) {

              propObjects = propObjects.filter((p) => p !== selectedProp);

            if (editState.mode === "decal" && selectedDecal) deleteSelectedDecal();

        if (editState.mode === "waterfall") {
          if (event.code === "KeyW") {

            return;
          }
          if (event.code === "KeyE") {
            event.preventDefault();
            transformControls.setMode("rotate");
            return;
          }
          if (event.code === "KeyR") {

            transformControls.setMode("scale");

            transformControls.setMode("translate");

          }
          if (event.code === "Digit8") {

            transformControls.setMode("rotate");
            return;
          }

            transformControls.setMode("scale");
            return;
          }
          if (event.code === "Delete" && selectedWaterfall) {
            event.preventDefault();
            scene.remove(selectedWaterfall);
            waterfallObjects = waterfallObjects.filter((m) => m !== selectedWaterfall);
            selectWaterfall(null);
            if (editorPane) editorPane.refresh();
            return;
          }
          if (event.code === "Delete" && selectedSplashCap) {

            scene.remove(selectedSplashCap);
            selectedSplashCap.geometry.dispose();
            splashCapObjects = splashCapObjects.filter((m) => m !== selectedSplashCap);
            selectSplashCap(null);
            if (editorPane) editorPane.refresh();
            return;
          }
        }
        if (editState.mode === "pinelod") {
          const dk = parseInt(event.key, 10);
          if (dk >= 1 && dk <= 8) {

        } else if (editState.mode !== "proctrees") {

          if (event.key === "3") editState.paintChannel = 2;
        }
        if (

          event.preventDefault();
          exportTerrainJson();

        if (event.key === "l" || event.key === "L") {
          document.getElementById("load-terrain-input").click();
        }
      });

      window.addEventListener("keyup", (event) => {

        if (playMode) return;

          const p = raycastTerrainPoint();
          if (p) riverMoveSelected(p);

        if (editState.mode === "spline" && splineDragging && splineSelectedIdx >= 0) {
          const p = raycastTerrainPoint();
          if (p) splineMoveSelected(p);

        editState.hasBrushHit = !!hit;
        const showBrushRing =
          editState.mode === "paint" ||
          editState.mode === "path" ||
          editState.mode === "geminigrass" ||
          editState.mode === "geminicliffgrass" ||
          editState.mode === "fleurs" ||
          editState.mode === "ambientfx" ||
          editState.mode === "barrier" ||
          editState.mode === "hole" ||
          editState.mode === "pinelod" ||
          editState.mode === "proctrees" ||
          editState.mode === "objects" ||
          editState.mode === "foliage" ||
          (editState.mode === "sculpt" &&
            (PARAMS.sculptTool === "brush" ||
              PARAMS.sculptTool === "ramp" ||
              PARAMS.sculptTool === "noise" ||
              PARAMS.sculptTool === "terrace" ||
              PARAMS.sculptTool === "erosion"));
        if (showBrushRing && hit) {

        if (

          editState.mode === "geminigrass" ||
          editState.mode === "geminicliffgrass" ||
          editState.mode === "fleurs" ||
          editState.mode === "ambientfx" ||
          editState.mode === "barrier" ||
          editState.mode === "hole" ||
          editState.mode === "pinelod" ||
          editState.mode === "proctrees" ||
          editState.mode === "objects" ||
          editState.mode === "foliage"
        )

        if (
          editState.mode === "sculpt" &&
          editState.isPointerDown &&
          editState.pointerAction === "sculpt" &&
          hit &&
          (PARAMS.sculptTool === "brush" ||

        ) {

      renderer.domElement.addEventListener("pointerdown", (event) => {

          const cliffMeshes = [];
          cliffObjects.forEach((root) =>
            root.traverse((o) => {

          const cliffHits = raycaster.intersectObjects(cliffMeshes, false);
          if (cliffHits.length > 0) {

            if (root) {

          if (hit) placeProp(hit.x, hit.y, hit.z);

              selectSplashCap(capHits[0].object);
              if (editorPane) editorPane.refresh();
              return;
            }
            const pt = raycastTerrainPoint();
            if (pt) {
              placeSplashCap(pt.x, pt.y, pt.z);
              if (editorPane) editorPane.refresh();

          const wfHits = raycaster.intersectObjects(waterfallObjects, false);
          if (wfHits.length > 0) {
            selectWaterfall(wfHits[0].object);

      function _buildGeminiGeos() {
        const highBase = geminiBladeGeo(
          _gp.bladeHeight,
          _gp.bladeWidth,
          Math.round(_gp.bladeYSegments),
          _gp.tipTaperStart
        );
        const geoHigh = geminiFieldGeo(
          highBase,
          _gp.fieldSize,
          Math.round(_gp.grassCount),
          _gp.bladeHeight,
          true
        );
        highBase.dispose();

        const midBase = geminiBladeGeo(
          _gp.bladeHeight,
          _gp.bladeWidth,
          Math.round(_gp.lodMidSegments),
          _gp.tipTaperStart
        );
        const geoMid = geminiFieldGeo(
          midBase,
          _gp.lodMidPatchSize,
          Math.round(_gp.lodMidGrassCount),
          _gp.bladeHeight,
          true
        );
        midBase.dispose();

        const farBase = geminiBladeGeo(
          _gp.bladeHeight,
          _gp.bladeWidth,
          Math.round(_gp.lodFarSegments),
          _gp.tipTaperStart
        );
        const geoFar = geminiFieldGeo(
          farBase,
          _gp.lodFarPatchSize,
          Math.round(_gp.lodFarGrassCount),
          _gp.bladeHeight,
          false
        );
        farBase.dispose();

        return { geoHigh, geoMid, geoFar };

              propActivePARAMS.name = name;

              pane.refresh();

            .catch((err) => console.error(`Props: failed to load ${url}`, err));

        geminiCliffDensityFileInput.style.display = "none";
        document.body.appendChild(geminiCliffDensityFileInput);
        geminiCliffGrassFolder.addButton({ title: "Save cliff density map" }).on("click", () => {
          const pixels = geminiCliffDensityCtx.getImageData(0, 0, HTEX_RES, HTEX_RES).data;
          const blob = new Blob([pixels.buffer], { type: "application/octet-stream" });
          const a = document.createElement("a");
          a.download = "gemini-cliff-grass-density.bin";
          a.href = URL.createObjectURL(blob);
          a.click();
          URL.revokeObjectURL(a.href);
        });
        geminiCliffGrassFolder
          .addButton({ title: "Load cliff density map" })
          .on("click", () => geminiCliffDensityFileInput.click());
        geminiCliffDensityFileInput.addEventListener("change", (e) => {
          if (!e.target.files[0]) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            pushTerrainUndo();
            const loaded = new Uint8ClampedArray(ev.target.result);
            const imgData = geminiCliffDensityCtx.createImageData(HTEX_RES, HTEX_RES);
            imgData.data.set(loaded.subarray(0, imgData.data.length));
            geminiCliffDensityCtx.putImageData(imgData, 0, 0);
            if (geminiCliffDensityTex) geminiCliffDensityTex.needsUpdate = true;
            syncGeminiGrassHasPaintedFromCanvas();
          };
          reader.readAsArrayBuffer(e.target.files[0]);
          e.target.value = "";
        });

        const fleurFolder = pane.addFolder({ title: "Fleurs  [ M ]", expanded: true });
        fleurFolderRef = fleurFolder;
        fleurFolder.hidden = true;

        function _applyFleurPreset(slot, key) {
          const p = FLEUR_PRESETS[key];
          if (!p) return;
          if (slot === "A") {
            fleurColorA.inner = p.inner;
            fleurColorA.outer = p.outer;
            fleurColorA.glow = p.glow;
            if (fleurSystem) fleurSystem.setColorA(p.inner, p.outer, p.glow);
          } else {
            fleurColorB.inner = p.inner;
            fleurColorB.outer = p.outer;
            fleurColorB.glow = p.glow;
            if (fleurSystem) fleurSystem.setColorB(p.inner, p.outer, p.glow);
          }
        }

        const fleurErasePARAMS = { erase: false };
        fleurFolder
          .addBinding(fleurErasePARAMS, "erase", { label: "Erase (or Shift)" })
          .on("change", (e) => {
            fleurEraseMode = e.value;
          });

        const fleurSlotPARAMS = { slot: "A" };
        fleurFolder
          .addBinding(fleurSlotPARAMS, "slot", {
            label: "Paint color",
            options: { "Color A": "A", "Color B": "B" }
          })
          .on("change", (e) => {
            fleurActiveSlot = e.value === "A" ? 0 : 1;
          });

        let fleurStemFolder = null;
        let fleurHoverFolder = null;

        fleurFolder
          .addBinding(fleurParams, "subMode", {
            label: "Placement",
            options: { "Ground bloom": "ground", Stemmed: "stem" }
          })
          .on("change", () => {
            if (fleurStemFolder) fleurStemFolder.hidden = fleurParams.subMode !== "stem";
            if (fleurHoverFolder) fleurHoverFolder.hidden = fleurParams.subMode === "stem";
            fleurFolder.refresh();
          });

        fleurFolder.addBinding(fleurParams, "bloomShape", {
          label: "Bloom shape",
          options: { "A (mask 1)": 0, "B (mask 2)": 1, "C (mask 3)": 2 }
        });

        fleurStemFolder = fleurFolder.addFolder({ title: "Stem colors", expanded: true });
        fleurStemFolder.hidden = fleurParams.subMode !== "stem";
        fleurStemFolder
          .addBinding(fleurParams, "stemBase", { label: "Stem base", view: "color" })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setStemColors(e.value, fleurParams.stemTop);
          });
        fleurStemFolder
          .addBinding(fleurParams, "stemTop", { label: "Stem top", view: "color" })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setStemColors(fleurParams.stemBase, e.value);
          });
        fleurStemFolder
          .addBinding(fleurParams, "stemStaticCurve", {
            label: "Stem lean (static)",
            min: 0,
            max: 0.25,
            step: 0.005
          })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setStemStaticCurve(e.value);
          });

        const fleurAFolder = fleurFolder.addFolder({ title: "Color A", expanded: true });
        fleurAFolder
          .addBinding(fleurColorA, "preset", {
            label: "Preset",
            options: { Main: "main", Sakura: "sakura", "Zelda Blue": "zeldaBlue", Sunflower: "sunflower" }
          })
          .on("change", (e) => {
            fleurColorA.preset = e.value;
            _applyFleurPreset("A", e.value);
            fleurFolder.refresh();
          });
        fleurAFolder
          .addBinding(fleurColorA, "inner", { label: "Center color" })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setColorA(e.value, fleurColorA.outer, fleurColorA.glow);
          });
        fleurAFolder
          .addBinding(fleurColorA, "outer", { label: "Edge color" })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setColorA(fleurColorA.inner, e.value, fleurColorA.glow);
          });
        fleurAFolder
          .addBinding(fleurColorA, "glow", { label: "Center glow", min: 0, max: 1, step: 0.01 })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setColorA(fleurColorA.inner, fleurColorA.outer, e.value);
          });

        const fleurBFolder = fleurFolder.addFolder({ title: "Color B", expanded: true });
        fleurBFolder
          .addBinding(fleurColorB, "preset", {
            label: "Preset",
            options: { Main: "main", Sakura: "sakura", "Zelda Blue": "zeldaBlue", Sunflower: "sunflower" }
          })
          .on("change", (e) => {
            fleurColorB.preset = e.value;
            _applyFleurPreset("B", e.value);
            fleurFolder.refresh();
          });
        fleurBFolder
          .addBinding(fleurColorB, "inner", { label: "Center color" })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setColorB(e.value, fleurColorB.outer, fleurColorB.glow);
          });
        fleurBFolder
          .addBinding(fleurColorB, "outer", { label: "Edge color" })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setColorB(fleurColorB.inner, e.value, fleurColorB.glow);
          });
        fleurBFolder
          .addBinding(fleurColorB, "glow", { label: "Center glow", min: 0, max: 1, step: 0.01 })
          .on("change", (e) => {
            if (fleurSystem) fleurSystem.setColorB(fleurColorB.inner, fleurColorB.outer, e.value);
          });

        fleurFolder.addBinding(fleurParams, "perStroke", { label: "Per stroke", min: 1, max: 60, step: 1 });
        fleurFolder.addBinding(fleurParams, "minSpacing", { label: "Min spacing", min: 0.1, max: 8, step: 0.05 });
        fleurFolder.addBinding(fleurParams, "scaleMin", { label: "Scale min", min: 0.1, max: 3, step: 0.05 });
        fleurFolder.addBinding(fleurParams, "scaleMax", { label: "Scale max", min: 0.1, max: 3, step: 0.05 });

        fleurHoverFolder = fleurFolder.addFolder({ title: "Hover (ground bloom only)", expanded: true });
        fleurHoverFolder.hidden = fleurParams.subMode === "stem";
        fleurHoverFolder.addBinding(fleurParams, "hoverBase", { label: "Hover height", min: 0, max: 1, step: 0.01 });
        fleurHoverFolder.addBinding(fleurParams, "hoverVariance", {
          label: "Hover variance",
          min: 0,
          max: 0.5,
          step: 0.01
        });

        const fleurInteractFolder = fleurFolder.addFolder({ title: "Interaction (play / orbit)", expanded: false });
        fleurInteractFolder
          .addBinding(fleurParams, "interactRadius", { label: "Radius", min: 0.25, max: 8, step: 0.05 })
          .on("change", () => {
            _syncFleurInteractionToSystem();
          });
        fleurInteractFolder
          .addBinding(fleurParams, "interactStrength", { label: "Lean (rad)", min: 0, max: 1.2, step: 0.01 })
          .on("change", () => {
            _syncFleurInteractionToSystem();
          });
        fleurInteractFolder
          .addBinding(fleurParams, "interactGain", { label: "Gain", min: 0, max: 2.5, step: 0.05 })
          .on("change", () => {
            _syncFleurInteractionToSystem();
          });
        fleurInteractFolder
          .addBinding(fleurParams, "windAmp", { label: "Wind sway (rad)", min: 0, max: 0.14, step: 0.002 })
          .on("change", () => {
            _syncFleurInteractionToSystem();
          });
        fleurInteractFolder
          .addBinding(fleurParams, "windSpeed", { label: "Wind speed", min: 0.2, max: 3.5, step: 0.05 })
          .on("change", () => {
            _syncFleurInteractionToSystem();
          });

        fleurFolder.addButton({ title: "Clear all fleurs" }).on("click", () => {
          if (fleurSystem) fleurSystem.clear();
        });
        fleurFolder.addButton({ title: "Save fleurs JSON" }).on("click", () => {
          if (!fleurSystem) return;
          const blob = new Blob([JSON.stringify(fleurSystem.getPositions(), null, 2)], {
            type: "application/json"
          });
          const a = document.createElement("a");
          a.download = "fleurs.json";
          a.href = URL.createObjectURL(blob);
          a.click();
          URL.revokeObjectURL(a.href);
        });
        const fleurFileInput = document.createElement("input");
        fleurFileInput.type = "file";
        fleurFileInput.accept = ".json";
        fleurFileInput.style.display = "none";
        document.body.appendChild(fleurFileInput);
        fleurFolder.addButton({ title: "Load fleurs JSON" }).on("click", () => fleurFileInput.click());
        fleurFileInput.addEventListener("change", (e) => {
          if (!e.target.files[0] || !fleurSystem) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              fleurSystem.setPositions(JSON.parse(ev.target.result));
              if (fleurSystem) fleurSystem.syncHeights();
            } catch (err) {
              console.error("Failed to load fleurs.json", err);
            }
          };
          reader.readAsText(e.target.files[0]);
          e.target.value = "";
        });

        const ambientFXFolder = pane.addFolder({ title: "Ambient FX  [ X ]", expanded: true });
        ambientFXFolderRef = ambientFXFolder;
        ambientFXFolder.hidden = true;

        const ambientFXErasePARAMS = { erase: false };
        ambientFXFolder.addBinding(ambientFXErasePARAMS, "erase", { label: "Erase (or Shift)" }).on("change", (e) => {
          ambientFXErase = e.value;
        });

        ambientFXFolder.addBinding(ambientFXParams, "effectType", {
          label: "Effect",
          options: {
            Butterflies: "butterflies"
          }
        });

        ambientFXFolder.addBlade({ view: "separator" });

        ambientFXFolder
          .addBinding(ambientFXParams, "emitterRadius", {
            label: "Emitter radius",
            min: 4,
            max: 40,
            step: 1
          })
          .on("change", () => syncBrushVisual());
        ambientFXFolder.addBinding(ambientFXParams, "density", {
          label: "Density",
          min: 1,
          max: 12,
          step: 1
        });

        ambientFXFolder.addBlade({ view: "separator" });

        const ambientFXButterflyFolder = ambientFXFolder.addFolder({
          title: "Butterfly params",
          expanded: false
        });
        ambientFXButterflyFolder
          .addBinding(ambientFXParams, "flapSpeed", {
            label: "Flap Speed",
            min: 2,
            max: 20,
            step: 0.5
          })
          .on("change", (e) => {
            if (ambientFXSystem) ambientFXSystem.setFlapSpeed(e.value);
          });
        ambientFXButterflyFolder
          .addBinding(ambientFXParams, "flapAngle", {
            label: "Flap Angle",
            min: 0.1,
            max: 1.5,
            step: 0.05
          })
          .on("change", (e) => {
            if (ambientFXSystem) ambientFXSystem.setFlapAngle(e.value);
          });
        ambientFXButterflyFolder
          .addBinding(ambientFXParams, "glideRatio", {
            label: "Glide Ratio",
            min: 0,
            max: 0.8,
            step: 0.05
          })
          .on("change", (e) => {
            if (ambientFXSystem) ambientFXSystem.setGlideRatio(e.value);
          });

        ambientFXFolder.addBlade({ view: "separator" });

        ambientFXFolder.addBinding(ambientFXParams, "windStrength", {
          label: "Wind Strength",
          min: 0,
          max: 3,
          step: 0.1
        });
        ambientFXFolder.addBinding(ambientFXParams, "windX", {
          label: "Wind X",
          min: -3,
          max: 3,
          step: 0.1
        });
        ambientFXFolder.addBinding(ambientFXParams, "windZ", {
          label: "Wind Z",
          min: -3,
          max: 3,
          step: 0.1
        });

        ambientFXFolder.addBlade({ view: "separator" });

        ambientFXFolder
          .addBinding(ambientFXParams, "showRings", { label: "Show emitter rings" })
          .on("change", (e) => {
            if (ambientFXSystem && editState.mode === "ambientfx") ambientFXSystem.setRingsVisible(e.value);
          });

        ambientFXFolder.addButton({ title: "Clear all emitters" }).on("click", () => {
          if (ambientFXSystem) ambientFXSystem.clear();
        });

        const barrierFolder = pane.addFolder({ title: "Barrier", expanded: true });
        barrierFolderRef = barrierFolder;
        barrierFolder.hidden = true;
        barrierFolder.addBinding(barrierPARAMS, "erase", { label: "Erase (or Shift)" }).on("change", (ev) => {
          barrierEraseMode = ev.value;
        });
        barrierFolder.addBinding(barrierPARAMS, "showOverlay", { label: "Show overlay" }).on("change", () => {
          syncBarrierOverlayFromParams();
        });
        barrierFolder.addButton({ title: "Clear all barriers" }).on("click", () => {
          barrierCtx.globalCompositeOperation = "source-over";
          barrierCtx.clearRect(0, 0, BARRIER_RES, BARRIER_RES);
          if (barrierTex) barrierTex.needsUpdate = true;
          invalidateBarrierCache();
          syncBarrierOverlay();
        });
        barrierFolder.addButton({ title: "Fill all barriers" }).on("click", () => {
          barrierCtx.globalCompositeOperation = "source-over";
          barrierCtx.fillStyle = "#f00";
          barrierCtx.fillRect(0, 0, BARRIER_RES, BARRIER_RES);
          if (barrierTex) barrierTex.needsUpdate = true;
          invalidateBarrierCache();
          syncBarrierOverlay();
        });

        const holeFolder = pane.addFolder({ title: "Hole", expanded: true });
        holeFolderRef = holeFolder;
        holeFolder.hidden = true;
        holeFolder.addBinding(holePARAMS, "erase", { label: "Erase (or Shift)" }).on("change", (ev) => {
          holeEraseMode = ev.value;
        });
        holeFolder.addBinding(holePARAMS, "showOverlay", { label: "Show overlay" }).on("change", () => {
          syncHoleOverlayFromParams();
        });
        holeFolder.addButton({ title: "Clear all holes" }).on("click", () => {
          clearAllHoles();
          if (editorPane) editorPane.refresh();
        });

        playFolderRef = playFolder;
        brushFolderRef = brushFolder;
        setEditMode(PARAMS.mode);
        syncLodFolderVisibility();
        syncPtreeFolderVisibility();
        syncWaterfallFolderVisibility();
        syncObjectsFolderVisibility();
        syncFoliageFolderVisibility();
        syncPropsFolderVisibility();
        syncSplineFolderVisibility();
        syncRiverFolderVisibility();
        syncPathFolderVisibility();
        syncDecalFolderVisibility();
        syncHoleFolderVisibility();
        syncPlaceFolderVisibility();
        syncAmbientFXFolderVisibility();
      }

      renderer.domElement.addEventListener(
        "wheel",
        (e) => {
          if (playMode) return;
          if (!e.shiftKey && !e.altKey) return;
          e.preventDefault();
          e.stopPropagation();
          const dir = e.deltaY < 0 ? 1 : -1;
          if (e.shiftKey) {
            PARAMS.brushSize = Math.min(80, Math.max(2, PARAMS.brushSize + dir * 2));
            brushSize = PARAMS.brushSize;
          } else {
            PARAMS.brushStrength = Math.min(100, Math.max(5, PARAMS.brushStrength + dir * 5));
            brushStr = PARAMS.brushStrength;
          }
          if (editorPane) editorPane.refresh();
          syncBrushVisual();
        },
        { passive: false, capture: true }
      );

      rebuildGlobalHeightTexture();
      heightTexDirty = false;
      lastHeightTexSyncMs = performance.now();

      updateChunkSet();

      let lastTime = performance.now();
      let appTimeSec = 0;
      renderer.setAnimationLoop(() => {
        const now = performance.now();
        const dt = now - lastTime;
        lastTime = now;

        shadowTarget.position.set(camera.position.x, 0, camera.position.z);
        syncLightAndSkyFromParams();
        stylizedSky.update(sunDir, camera.position);

        const _csmChanged =
          csm &&
          PARAMS.csm.enabled &&
          (PARAMS.csm.cascades !== _lastCsmCascades ||
            PARAMS.csm.maxFar !== _lastCsmMaxFar ||
            PARAMS.csm.lightMargin !== _lastCsmMargin ||
            PARAMS.csm.mapSize !== _lastCsmMapSize);
        if (csm?.mainFrustum && _csmChanged) {
          _lastCsmCascades = PARAMS.csm.cascades;
          _lastCsmMaxFar = PARAMS.csm.maxFar;
          _lastCsmMargin = PARAMS.csm.lightMargin;
          _lastCsmMapSize = PARAMS.csm.mapSize;
          csm.cascades = PARAMS.csm.cascades;
          csm.maxFar = PARAMS.csm.maxFar;
          csm.lightMargin = PARAMS.csm.lightMargin;
          sun.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
          csm.updateFrustums();
        }
        if (csm?.mainFrustum && PARAMS.csm.enabled && PARAMS.csm.updateEveryFrame) {
          csm.updateFrustums();
        }

        const dtSec = Math.min(0.05, dt * 0.001);
        appTimeSec += dtSec;
        uFTreeTime.value = appTimeSec;
        uRiverTime.value = appTimeSec;
        if (waterfallObjects.length > 0) wfU.wfFlowTime.value += dtSec * wfU.wfFlowSpeed.value;
        if (splashCapObjects.length > 0) {
          uIFTime.value = appTimeSec;
          syncImpactFoamUniforms();
        }

        if (PARAMS.spline.showTrain && _cachedTrainCurve && _cachedTrainLen > 0) {
          splineTrainT =
            (splineTrainT + (dtSec * PARAMS.spline.trainSpeed) / _cachedTrainLen) % 1;
          const pos = _cachedTrainCurve.getPoint(splineTrainT);
          const tangent = _cachedTrainCurve.getTangent(splineTrainT);
          splineTrainMesh.position.copy(pos);
          splineTrainMesh.scale.setScalar(PARAMS.spline.trainScale);
          splineTrainMesh.lookAt(pos.x + tangent.x, pos.y + tangent.y, pos.z + tangent.z);
          splineTrainMesh.visible = true;
        } else {
          splineTrainMesh.visible = false;
        }

        if (playMode) {
          let mx = 0;
          let mz = 0;
          if (keysHeld.KeyW || keysHeld.ArrowUp) {
            mx -= Math.sin(camYaw);
            mz -= Math.cos(camYaw);
          }
          if (keysHeld.KeyS || keysHeld.ArrowDown) {
            mx += Math.sin(camYaw);
            mz += Math.cos(camYaw);
          }
          if (keysHeld.KeyA || keysHeld.ArrowLeft) {
            mx -= Math.cos(camYaw);
            mz += Math.sin(camYaw);
          }
          if (keysHeld.KeyD || keysHeld.ArrowRight) {
            mx += Math.cos(camYaw);
            mz -= Math.sin(camYaw);
          }
          const mlen = Math.hypot(mx, mz);
          if (mlen > 0) {
            const stepX = (mx / mlen) * playParams.speed * dtSec;
            const stepZ = (mz / mlen) * playParams.speed * dtSec;
            let newX = playerPos.x + stepX;
            let newZ = playerPos.z + stepZ;
            newX = THREE.MathUtils.clamp(newX, worldBounds.min.x, worldBounds.max.x);
            newZ = THREE.MathUtils.clamp(newZ, worldBounds.min.z, worldBounds.max.z);
            if (isBarrierBlocked(newX, newZ)) {
              const slideX = !isBarrierBlocked(newX, playerPos.z);
              const slideZ = !isBarrierBlocked(playerPos.x, newZ);
              if (slideX) newZ = playerPos.z;
              else if (slideZ) newX = playerPos.x;
              else {
                newX = playerPos.x;
                newZ = playerPos.z;
              }
            }
            playerPos.x = newX;
            playerPos.z = newZ;
          }
          playerPos.y = getWorldHeight(playerPos.x, playerPos.z);
          const capsuleCY = playerPos.y + PLAYER_CAP_R + PLAYER_CAP_H * 0.5;
          capsuleMesh.position.set(playerPos.x, capsuleCY, playerPos.z);
          if (mlen > 0) capsuleMesh.rotation.y = Math.atan2(mx, mz) + PI;

          const lookAtY = capsuleCY + 0.6;
          const hDist = playParams.camDist * Math.cos(camPitch);
          const vDist = playParams.camDist * Math.sin(camPitch);
          camera.position.set(
            playerPos.x + Math.sin(camYaw) * hDist,
            lookAtY + vDist,
            playerPos.z + Math.cos(camYaw) * hDist
          );
          camera.lookAt(playerPos.x, lookAtY, playerPos.z);
        } else {
          controls.update();
        }

        if (fleurSystem) {
          if (playMode) fleurSystem.update(playerPos, appTimeSec);
          else fleurSystem.update(camera.position, appTimeSec);
        }

        if (playMode) {
          FOLIAGE_SLOTS.forEach((s) => {
            if (s.system) s.system.update(appTimeSec, playerPos);
          });
        } else {
          FOLIAGE_SLOTS.forEach((s) => {
            if (s.system) s.system.update(appTimeSec, null);
          });
        }

        if (ambientFXSystem) {
          ambientFXSystem.update(
            dtSec,
            appTimeSec,
            ambientFXParams.windX,
            ambientFXParams.windZ,
            ambientFXParams.windStrength
          );
        }

        if (now - frameState.lastChunkUpdateMs > 120) {
          updateChunkSet();
          frameState.lastChunkUpdateMs = now;
        }

        if (dirtyChunks.size > 0) rebuildDirtyActiveChunks(4);

        if (heightTexDirty && now - lastHeightTexSyncMs > 100) {
          rebuildGlobalHeightTexture();
          heightTexDirty = false;
          lastHeightTexSyncMs = now;
        }

        if (geminiGrassPatchSystem && geminiGrassUniforms && geminiGrassGroup) {
          if (geminiGrassHasPaintedDensity) {
            geminiGrassGroup.visible = true;
            const gp = window._geminiGrassParams;
            _geminiUpdateOpts.patchSize = gp.fieldSize;
            _geminiUpdateOpts.patchSizeMid = gp.lodMidPatchSize;
            _geminiUpdateOpts.patchSizeFar = gp.lodFarPatchSize;
            _geminiUpdateOpts.lodMidDistance = gp.lodMidDistance;
            _geminiUpdateOpts.lodFarDistance = gp.lodFarDistance;
            _geminiUpdateOpts.maxDistance = gp.lodMaxDistance;
            _geminiUpdateOpts.lodEnabled = gp.lodEnabled;
            _geminiUpdateOpts.grassReceiveShadow = gp.grassReceiveShadow;
            const stats = geminiGrassPatchSystem.update(_geminiUpdateOpts);
            lastGeminiPatchCount = stats.patchCount;
            geminiGrassUniforms.uPlayerPos.value.copy(playMode ? playerPos : camera.position);
            geminiGrassUniforms.uSunDir.value.copy(sunDir);
          } else {
            geminiGrassGroup.visible = false;
          }
        }

        updateLODInstances();
        updatePTreeInstances();
        {
          const now = performance.now();
          const totalLodChunks = LOD_SLOTS.reduce((s, sl) => s + sl.chunks.size, 0);
          const totalPtreeChunks = PTREE_SLOTS.reduce((s, sl) => s + sl.chunks.size, 0);
          if (
            editorPane &&
            now - _treeLodStatsPaneRefreshMs > TREE_LOD_STATS_PANE_MS &&
            (totalLodChunks > 0 || totalPtreeChunks > 0) &&
            (lodFolderRef || ptreeFolderRef)
          ) {
            _treeLodStatsPaneRefreshMs = now;
            editorPane.refresh();
          }
        }
        renderer.render(scene, camera);
        updateHud(dt);
      });
