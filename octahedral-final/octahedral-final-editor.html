<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octahedral Final Editor — WebGPU</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #info {
        position: fixed; bottom: 12px; left: 12px; z-index: 10;
        font: 12px/1.5 "SF Mono", "Fira Code", monospace;
        color: #b0d890; background: rgba(0,0,0,0.6);
        padding: 8px 14px; border-radius: 6px;
        pointer-events: none; max-width: 50vw;
      }
      .label {
        position: fixed; top: 14px; z-index: 10;
        font: 600 13px/1 "SF Mono", "Fira Code", monospace;
        text-transform: uppercase; letter-spacing: 2px;
        padding: 5px 12px; border-radius: 4px; pointer-events: none;
      }
      #lbl-orig { left: 25%; transform: translateX(-50%); color: #8ce68c; background: rgba(0,0,0,0.5); }
      #lbl-imp  { left: 75%; transform: translateX(-50%); color: #8cc8e6; background: rgba(0,0,0,0.5); }
      #drop-overlay {
        position: fixed; inset: 0; z-index: 200;
        display: none; align-items: center; justify-content: center;
        background: rgba(20,60,120,0.55); backdrop-filter: blur(4px);
        border: 3px dashed rgba(120,180,255,0.6);
      }
      #drop-overlay span {
        color: #fff; font-size: 22px; font-weight: 600;
        background: rgba(0,0,0,0.4); padding: 14px 28px; border-radius: 10px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="label" id="lbl-orig">Original</div>
    <div class="label" id="lbl-imp">Impostor</div>
    <div id="info">Initialising WebGPU…</div>
    <div id="drop-overlay"><span>Drop .glb file to load</span></div>
    <script type="module">
      import { run } from "./octahedral-final-editor.js";
      run().catch(err => {
        document.getElementById("info").textContent = "Error: " + err.message;
        console.error(err);
      });
    </script>
  </body>
</html>
