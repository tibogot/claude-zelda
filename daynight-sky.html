<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day ↔ Night Sky + Volumetric Cloud Layer · WebGPU + TSL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #04060a; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .tp-dfwv { max-height: calc(100vh - 16px); overflow-y: auto; z-index: 20; }
      #hud {
        position: fixed; bottom: 8px; left: 8px; z-index: 25;
        color: #cfe0ff; font: 12px/1.4 ui-monospace, monospace;
        background: rgba(8, 14, 26, 0.55); padding: 6px 9px; border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import Stats from "stats-gl";
      import { createDayNightSky, SKY_DEFAULTS } from "./daynight-sky.js";
      import { createCloudLayer, CLOUD_DEFAULTS, GOD_RAYS_DEFAULTS } from "./cloud-layer.js";
      import { createTerrain } from "./daynight-terrain.js";
      import { createOcean } from "./daynight-ocean.js";
      import {
        fog, densityFogFactor, uniform, mix, pow, dot, clamp, normalize,
        positionWorld, cameraPosition,
      } from "three/tsl";

      const smoothstep = (e0, e1, x) => {
        const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      };

      // ── PARAMS ───────────────────────────────────────────────────────────
      const PARAMS = {
        timeOfDay: 9.5,      // 0..24
        autoAdvance: false,
        daySpeed: 0.5,       // hours per second
        exposure: 1.0,
        env: {
          sunIntensity: 3.2,
          sunHorizonColor: "#ff6a2c",
          moonIntensity: 0.45,
        },
        sky: { ...SKY_DEFAULTS },
        clouds: { ...CLOUD_DEFAULTS },
        fog: {
          enabled: true,
          density: 0.0003,
          color: "#9fb8c4",
          matchSky: true,
          sunTint: "#ffcaa0",
          tintPow: 3,
        },
        godRays: { ...GOD_RAYS_DEFAULTS },
        shadows: { enabled: true, normalBias: 3, bias: -0.0005 },
        ocean: {
          enabled: true, waterY: -20,
          waveHeight: 1.8, choppiness: 1.5, reflectClouds: true,
        },
      };

      // ── Celestial driver: time-of-day → sun/moon directions + light ────────
      const SKY_TILT = 0.28;
      const _sunDir = new THREE.Vector3();
      const _moonDir = new THREE.Vector3();
      const _sunHigh = new THREE.Color();
      const _sunWarm = new THREE.Color();
      const _lightColor = new THREE.Color();
      const _ambColor = new THREE.Color();
      const _dayHorizon = new THREE.Color();
      const _nightHorizon = new THREE.Color();
      const _fogColor = new THREE.Color();

      function computeFrameLighting() {
        const ang = (PARAMS.timeOfDay / 24) * Math.PI * 2;
        const elev = -Math.cos(ang);
        const sx = Math.sin(ang);
        _sunDir.set(sx, elev, SKY_TILT).normalize();
        _moonDir.copy(_sunDir).negate();

        const sunUp = _sunDir.y;
        const dayF = smoothstep(-0.15, 0.25, sunUp);

        _sunHigh.set(PARAMS.sky.sunColor);
        _sunWarm.set(PARAMS.env.sunHorizonColor);
        // Warm at the horizon, neutral-warm high up.
        _sunWarm.lerp(_sunHigh, smoothstep(0.0, 0.35, sunUp));
        const sunInt = smoothstep(-0.08, 0.2, sunUp) * PARAMS.env.sunIntensity;
        const moonInt = (1 - dayF) * PARAMS.env.moonIntensity;

        // Dominant light: sun while above horizon, otherwise the moon.
        let lightDir, lightIntensity;
        if (sunUp >= 0) {
          _lightColor.copy(_sunWarm);
          lightDir = _sunDir;
          lightIntensity = sunInt;
        } else {
          _lightColor.set(PARAMS.sky.moonColor);
          lightDir = _moonDir;
          lightIntensity = moonInt;
        }

        // Ambient = horizon color crossfaded day↔night, with a moon floor.
        _dayHorizon.set(PARAMS.sky.horizonDay);
        _nightHorizon.set(PARAMS.sky.horizonNight);
        _ambColor.copy(_nightHorizon).lerp(_dayHorizon, dayF);
        const ambIntensity = THREE.MathUtils.lerp(0.12, 0.55, dayF) + moonInt * 0.25;

        return { sunUp, dayF, lightDir, lightIntensity, moonInt, ambIntensity };
      }

      // ── Init ───────────────────────────────────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = PARAMS.exposure;
        document.body.appendChild(renderer.domElement);
        await renderer.init();
        // Sun shadow maps. autoUpdate off → we trigger ONE update per frame
        // (the cloud pipeline issues several renderer.render calls per frame).
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = false;

        // FPS / CPU / GPU stats (same as template-unreal-objects.html).
        const stats = new Stats({ trackGPU: true });
        await stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          55, window.innerWidth / window.innerHeight, 0.1, 30000,
        );
        camera.position.set(-640, 360, 1040);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 30, -60);
        controls.maxPolarAngle = Math.PI * 0.92;
        controls.maxDistance = 6000;
        controls.update();

        // Lights (driven by the celestial solver each frame).
        const sunLight = new THREE.DirectionalLight(0xffffff, 3.0);
        scene.add(sunLight, sunLight.target);
        // Shadow camera sized to bracket the 1600-unit terrain at any sun angle.
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        sunLight.shadow.camera.near = 200;
        sunLight.shadow.camera.far = 4200;
        sunLight.shadow.camera.left = -1200;
        sunLight.shadow.camera.right = 1200;
        sunLight.shadow.camera.top = 1200;
        sunLight.shadow.camera.bottom = -1200;
        sunLight.shadow.bias = PARAMS.shadows.bias;
        sunLight.shadow.normalBias = PARAMS.shadows.normalBias;
        sunLight.shadow.camera.updateProjectionMatrix();
        const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x40424a, 0.4);
        scene.add(hemi);

        // ── Aerial perspective (sun-tinted distance haze) ────────────────────
        // ONE scene.fogNode, driven by uniforms (never reassigned — toggling it
        // recompiles every material → WebGPU device-loss risk). Distant terrain
        // fades to a cool haze away from the sun and a warm haze toward it.
        const uHazeEnabled = uniform(1);
        const uHazeDensity = uniform(PARAMS.fog.density);
        const uHazeAway = uniform(new THREE.Color(PARAMS.fog.color).convertSRGBToLinear());
        const uHazeSun = uniform(new THREE.Color(PARAMS.fog.sunTint).convertSRGBToLinear());
        const uHazePow = uniform(PARAMS.fog.tintPow);
        const uHazeSunDir = uniform(new THREE.Vector3(0, 1, 0));
        const _hazeView = normalize(positionWorld.sub(cameraPosition));
        const _hazeSunAmt = clamp(dot(_hazeView, uHazeSunDir), 0, 1);
        const _hazeColor = mix(uHazeAway, uHazeSun, pow(_hazeSunAmt, uHazePow));
        scene.fogNode = fog(_hazeColor, densityFogFactor(uHazeDensity).mul(uHazeEnabled));

        // PBR terrain (grass / rock / snow triplanar) — the showcase landscape.
        const terrain = await createTerrain({ size: 1600, segments: 384 });
        scene.add(terrain.mesh);
        terrain.mesh.castShadow = true; // ridges shadow the valleys (receiveShadow set in module)

        // ── Sky + clouds ─────────────────────────────────────────────────────
        const sky = createDayNightSky();
        scene.add(sky.mesh);
        const clouds = createCloudLayer({ camera });
        scene.add(clouds.mesh, clouds.sunMesh);

        // ── Ocean (reuses the shared, unedited ocean modules) ────────────────
        const ocean = await createOcean({
          renderer, terrainSize: 1600, getHeight: terrain.getHeight,
          seaLevel: PARAMS.ocean.waterY,
        });
        scene.add(ocean.group);
        ocean.setVisible(PARAMS.ocean.enabled);

        // Sky → PMREM env map for the ocean's reflections (re-baked on a throttle).
        const pmrem = new THREE.PMREMGenerator(renderer);
        let _envRT = null;
        let _envTimer = 0;
        function bakeSkyEnv() {
          const tmp = new THREE.Scene();
          const skyClone = sky.mesh.clone();
          skyClone.position.set(0, 0, 0); // bake from origin, not the camera-followed pose
          tmp.add(skyClone);
          // Option B: render the cloud dome into the reflection cubemap too.
          const withClouds = PARAMS.ocean.reflectClouds && PARAMS.clouds.enabled;
          if (withClouds) {
            clouds.setEnvMode(true); // skip depth occlusion, cheaper march
            const cloudClone = clouds.mesh.clone();
            cloudClone.position.set(0, 0, 0);
            cloudClone.layers.set(0); // PMREM cube camera renders layer 0
            tmp.add(cloudClone);
          }
          // Explicit far plane: the sky dome (r≈9000) and cloud shell (~2900 up)
          // are far beyond fromScene's default far (~100) and would be clipped.
          const rt = pmrem.fromScene(tmp, 0.04, 0.1, 20000);
          if (withClouds) clouds.setEnvMode(false);
          ocean.setEnvMap(rt.texture);
          if (_envRT) _envRT.dispose();
          _envRT = rt;
        }
        bakeSkyEnv();

        // ── GUI ────────────────────────────────────────────────────────────
        const pane = new Pane({ title: "Day/Night Sky" });
        const fTime = pane.addFolder({ title: "Time of day" });
        fTime.addBinding(PARAMS, "timeOfDay", { min: 0, max: 24, step: 0.01 });
        fTime.addBinding(PARAMS, "autoAdvance");
        fTime.addBinding(PARAMS, "daySpeed", { min: 0.05, max: 4, step: 0.05 });
        fTime.addBinding(PARAMS, "exposure", { min: 0.2, max: 2.5, step: 0.01 });

        const fEnv = pane.addFolder({ title: "Sun / moon energy" });
        fEnv.addBinding(PARAMS.env, "sunIntensity", { min: 0, max: 6, step: 0.1 });
        fEnv.addBinding(PARAMS.env, "sunHorizonColor");
        fEnv.addBinding(PARAMS.env, "moonIntensity", { min: 0, max: 2, step: 0.05 });

        const fShadow = pane.addFolder({ title: "Shadows" });
        fShadow.addBinding(PARAMS.shadows, "enabled");
        fShadow.addBinding(PARAMS.shadows, "normalBias", { min: 0, max: 8, step: 0.1 });
        fShadow.addBinding(PARAMS.shadows, "bias", { min: -0.002, max: 0.002, step: 0.0001 });

        const fOcean = pane.addFolder({ title: "Ocean" });
        fOcean.addBinding(PARAMS.ocean, "enabled");
        fOcean.addBinding(PARAMS.ocean, "waterY", { min: -200, max: 200, step: 1, label: "Sea level Y" });
        fOcean.addBinding(PARAMS.ocean, "waveHeight", { min: 0.2, max: 3.5, step: 0.05, label: "Wave height" });
        fOcean.addBinding(PARAMS.ocean, "choppiness", { min: 0.5, max: 3, step: 0.05 });
        fOcean.addBinding(PARAMS.ocean, "reflectClouds", { label: "Reflect clouds" });

        const fFog = pane.addFolder({ title: "Fog" });
        fFog.addBinding(PARAMS.fog, "enabled");
        fFog.addBinding(PARAMS.fog, "matchSky", { label: "Match sky color" });
        fFog.addBinding(PARAMS.fog, "density", { min: 0, max: 0.002, step: 0.00001 });
        fFog.addBinding(PARAMS.fog, "color", { label: "Color (manual)" });
        fFog.addBinding(PARAMS.fog, "sunTint", { label: "Sun-side tint" });
        fFog.addBinding(PARAMS.fog, "tintPow", { min: 1, max: 8, step: 0.1, label: "Tint focus" });

        const fGod = pane.addFolder({ title: "God rays", expanded: false });
        fGod.addBinding(PARAMS.godRays, "enabled");
        fGod.addBinding(PARAMS.godRays, "skipOffscreen", { label: "Skip off-screen" });
        fGod.addBinding(PARAMS.godRays, "effectScale", {
          label: "Buffer scale",
          min: 0.2,
          max: 1,
          step: 0.05,
        });
        fGod.addBinding(PARAMS.godRays, "exposure", { min: 0, max: 1, step: 0.01 });
        fGod.addBinding(PARAMS.godRays, "samples", { min: 16, max: 96, step: 1 });
        fGod.addBinding(PARAMS.godRays, "density", { min: 0, max: 1, step: 0.01 });
        fGod.addBinding(PARAMS.godRays, "decay", { min: 0.8, max: 1, step: 0.001 });
        fGod.addBinding(PARAMS.godRays, "weight", { min: 0, max: 1, step: 0.01 });
        fGod.addBinding(PARAMS.godRays, "occCloudSteps", { label: "Cloud occ steps", min: 4, max: 16, step: 1 });
        fGod.addBinding(PARAMS.godRays, "sunDistance", { min: 3500, max: 16000, step: 50 });
        fGod.addBinding(PARAMS.godRays, "sunDiscRadius", { min: 80, max: 650, step: 5 });
        fGod.addBinding(PARAMS.godRays, "sunTint", { label: "Sun tint" });
        fGod.addBinding(PARAMS.godRays, "matchLightColor", { label: "Tint = light color" });

        const fSky = pane.addFolder({ title: "Sky colors", expanded: false });
        for (const k of ["zenithDay", "horizonDay", "zenithNight", "horizonNight", "sunsetColor", "groundColor", "sunColor", "moonColor"]) {
          fSky.addBinding(PARAMS.sky, k);
        }
        fSky.addBinding(PARAMS.sky, "sunSizeDeg", { min: 0.3, max: 6, step: 0.1 });
        fSky.addBinding(PARAMS.sky, "sunGlowStrength", { min: 0, max: 2, step: 0.01 });
        fSky.addBinding(PARAMS.sky, "moonGlowStrength", { min: 0, max: 2, step: 0.01 });

        const fMoon = pane.addFolder({ title: "Moon", expanded: false });
        fMoon.addBinding(PARAMS.sky, "moonPhase", { min: 0, max: 1, step: 0.01, label: "Phase (new→full)" });
        fMoon.addBinding(PARAMS.sky, "moonPhaseOrient", { min: 0, max: 360, step: 1, label: "Crescent angle" });
        fMoon.addBinding(PARAMS.sky, "moonTermSoft", { min: 0.005, max: 0.3, step: 0.005, label: "Terminator soft" });
        fMoon.addBinding(PARAMS.sky, "moonSurface", { min: 0, max: 1, step: 0.01, label: "Surface detail" });
        fMoon.addBinding(PARAMS.sky, "moonEarthshine", { min: 0, max: 0.6, step: 0.01, label: "Earthshine" });
        fMoon.addBinding(PARAMS.sky, "moonSizeDeg", { min: 0.5, max: 8, step: 0.1, label: "Size (deg)" });
        fMoon.addBinding(PARAMS.sky, "moonDiscBright", { min: 0, max: 8, step: 0.1, label: "Brightness" });
        fMoon.addBinding(PARAMS.sky, "moonColor");

        const fStars = pane.addFolder({ title: "Stars", expanded: false });
        fStars.addBinding(PARAMS.sky, "starDensity", { min: 40, max: 600, step: 1 });
        fStars.addBinding(PARAMS.sky, "starThreshold", { min: 0.7, max: 0.99, step: 0.005 });
        fStars.addBinding(PARAMS.sky, "starSize", { min: 0.01, max: 0.3, step: 0.005 });
        fStars.addBinding(PARAMS.sky, "starBrightness", { min: 0, max: 3, step: 0.05 });
        fStars.addBinding(PARAMS.sky, "starTwinkle", { min: 0, max: 10, step: 0.1 });

        const fCloud = pane.addFolder({ title: "Cloud layer" });
        fCloud.addBinding(PARAMS.clouds, "enabled");
        fCloud.addBinding(PARAMS.clouds, "coverage", { min: 0, max: 1, step: 0.01 });
        fCloud.addBinding(PARAMS.clouds, "softness", { min: 0.02, max: 0.4, step: 0.01 });
        fCloud.addBinding(PARAMS.clouds, "densityMul", { min: 0.5, max: 16, step: 0.1 });
        fCloud.addBinding(PARAMS.clouds, "erode", { min: 0, max: 1, step: 0.01 });
        fCloud.addBinding(PARAMS.clouds, "detailMul", { min: 1, max: 8, step: 0.1 });
        fCloud.addBinding(PARAMS.clouds, "base", { min: 600, max: 4000, step: 10 });
        fCloud.addBinding(PARAMS.clouds, "thickness", { min: 200, max: 2500, step: 10 });
        fCloud.addBinding(PARAMS.clouds, "planetRadius", { min: 15000, max: 400000, step: 1000 });
        fCloud.addBinding(PARAMS.clouds, "scale", { min: 0.00005, max: 0.002, step: 0.00001 });
        fCloud.addBinding(PARAMS.clouds, "bufferScale", {
          label: "Resolution",
          options: { "Half (fast)": 0.5, "¾": 0.75, "Full (sharp)": 1.0 },
        });
        fCloud.addBinding(PARAMS.clouds, "steps", { min: 16, max: 128, step: 1 });
        fCloud.addBinding(PARAMS.clouds, "lightSteps", { min: 2, max: 8, step: 1 });
        fCloud.addBinding(PARAMS.clouds, "emptySkip", { min: 1, max: 4, step: 0.1, label: "Empty-space skip" });
        fCloud.addBinding(PARAMS.clouds, "opacity", { min: 0.2, max: 3, step: 0.05 });
        fCloud.addBinding(PARAMS.clouds, "phaseG", { min: 0, max: 0.9, step: 0.01 });
        fCloud.addBinding(PARAMS.clouds, "powder", { min: 0, max: 1, step: 0.01 });
        fCloud.addBinding(PARAMS.clouds, "msAmount", { min: 0, max: 1.5, step: 0.05, label: "★ Multi-scatter" });
        fCloud.addBinding(PARAMS.clouds, "msExtinction", { min: 0.1, max: 0.9, step: 0.05, label: "MS light depth" });
        fCloud.addBinding(PARAMS.clouds, "msEccentricity", { min: 0.1, max: 0.9, step: 0.05, label: "MS phase broad" });
        fCloud.addBinding(PARAMS.clouds, "windSpeed", { min: 0, max: 0.2, step: 0.001 });
        fCloud.addBinding(PARAMS.clouds, "windDeg", { min: 0, max: 360, step: 1 });

        // ── Loop ──────────────────────────────────────────────────────────
        const hud = document.getElementById("hud");
        const timer = new THREE.Timer();
        let elapsed = 0;

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener("resize", onResize);

        renderer.setAnimationLoop(() => {
          timer.update();
          const dt = Math.min(timer.getDelta(), 0.05);
          elapsed += dt;
          controls.update();

          if (PARAMS.autoAdvance) {
            PARAMS.timeOfDay = (PARAMS.timeOfDay + PARAMS.daySpeed * dt) % 24;
          }
          renderer.toneMappingExposure = PARAMS.exposure;

          const L = computeFrameLighting();

          // Scene lights follow the celestial solver.
          sunLight.position.copy(L.lightDir).multiplyScalar(2200);
          sunLight.target.position.set(0, 0, 0);
          sunLight.color.copy(_lightColor);
          sunLight.intensity = L.lightIntensity;
          hemi.color.copy(_ambColor);
          hemi.intensity = L.ambIntensity;
          hemi.groundColor.set(PARAMS.sky.groundColor);

          // Shadows: one regeneration per frame (autoUpdate is off).
          sunLight.castShadow = PARAMS.shadows.enabled;
          sunLight.shadow.bias = PARAMS.shadows.bias;
          sunLight.shadow.normalBias = PARAMS.shadows.normalBias;
          if (PARAMS.shadows.enabled) renderer.shadowMap.needsUpdate = true;

          // Aerial-perspective uniforms (fogNode is assigned once at setup).
          if (PARAMS.fog.matchSky) _fogColor.copy(_ambColor);
          else _fogColor.set(PARAMS.fog.color);
          uHazeEnabled.value = PARAMS.fog.enabled ? 1 : 0;
          uHazeDensity.value = PARAMS.fog.density;
          uHazeAway.value.copy(_fogColor).convertSRGBToLinear();
          uHazeSun.value.set(PARAMS.fog.sunTint).convertSRGBToLinear();
          uHazePow.value = PARAMS.fog.tintPow;
          uHazeSunDir.value.copy(_sunDir);

          const frame = {
            time: elapsed, dt,
            sunDir: _sunDir, moonDir: _moonDir, camera,
            lightDir: L.lightDir,
            lightColor: _lightColor,
            lightIntensity: Math.max(L.lightIntensity, 0.15),
            ambientColor: _ambColor,
            ambientIntensity: L.ambIntensity,
            fog: {
              enabled: PARAMS.fog.enabled,
              color: _fogColor,
              density: PARAMS.fog.density,
            },
          };

          sky.update(PARAMS.sky, frame);
          clouds.update(PARAMS.clouds, frame);

          // Ocean: re-bake the sky reflection on a throttle, then step the waves.
          if (PARAMS.ocean.enabled) {
            ocean.setVisible(true);
            ocean.setWaterY(PARAMS.ocean.waterY);
            // Only the large-tile swell scales with the slider; the small ripple
            // tile (48u) stays fixed or it repeats as visible squares when amplified.
            ocean.uniforms.fftSwellAmp.value = PARAMS.ocean.waveHeight;
            ocean.uniforms.fftRippleAmp.value = 0.55;
            ocean.uniforms.fftNormalStrength.value = PARAMS.ocean.choppiness;
            _envTimer -= dt;
            if (_envTimer <= 0) { bakeSkyEnv(); _envTimer = 0.4; }
            ocean.update(dt, elapsed, camera, L.lightDir);
          } else {
            ocean.setVisible(false);
          }

          // One call: scene→offscreen (with depth), clouds raymarched half-res
          // with depth occlusion, then composited to the canvas.
          clouds.render(renderer, scene, camera, {
            godRays: PARAMS.godRays,
            frame,
            skyMesh: sky.mesh,
            occluders: [terrain.mesh],
          });

          hud.textContent =
            `time ${PARAMS.timeOfDay.toFixed(2)}h  sunUp ${L.sunUp.toFixed(2)}  ` +
            `day ${(L.dayF * 100) | 0}%`;

          stats.update();
          // Drain the GPU timestamp query pools each frame (our pipeline issues
          // many render + compute passes; the compute ones — the ocean FFT —
          // otherwise overflow the pool). Fire-and-forget.
          renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER);
          renderer.resolveTimestampsAsync(THREE.TimestampQuery.COMPUTE);
        });
      }

      init();
    </script>
  </body>
</html>
