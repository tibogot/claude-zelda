<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day ↔ Night Sky + Volumetric Cloud Layer · WebGPU + TSL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #04060a; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      /* ── Custom UI (ported from v2/editor.html) ── */
      :root {
        --bg-panel:#2a2a2a; --bg-item:#333; --bg-hover:#3a3a3a; --bg-input:#1e1e1e;
        --border:#3c3c3c; --border-light:#4a4a4a; --text:#ccc; --text-dim:#888;
        --accent:#4a9eff; --font:"Segoe UI",system-ui,sans-serif;
        --font-mono:"Cascadia Code","Consolas",monospace; --radius:4px;
      }
      #ui-panel { position:fixed; top:0; right:0; width:var(--ui-width,340px);
        min-width:240px; max-width:70vw; height:100vh; overflow:hidden; z-index:30;
        display:flex; flex-direction:column; background:var(--bg-panel);
        border-left:1px solid var(--border); font-family:var(--font); color:var(--text);
        box-shadow:-2px 0 10px rgba(0,0,0,.3); }
      #ui-body { flex:1; overflow-y:auto; overflow-x:hidden; }
      /* Drag-to-resize strip straddling the panel's left edge. */
      #ui-resize-handle { position:fixed; top:0; right:var(--ui-width,340px); margin-right:-4px;
        width:8px; height:100vh; cursor:ew-resize; z-index:31; background:transparent; transition:background .15s; }
      #ui-resize-handle:hover, body.ui-resizing #ui-resize-handle { background:var(--accent); opacity:.6; }
      body.ui-resizing { cursor:ew-resize; user-select:none; }
      #ui-panel .ui-title { flex-shrink:0; padding:9px 12px; font-size:12px; font-weight:700;
        letter-spacing:.5px; border-bottom:1px solid var(--border); background:var(--bg-item); }
      .inspector-section { border-bottom:1px solid var(--border); }
      .section-header { display:flex; align-items:center; gap:6px; padding:6px 12px;
        cursor:pointer; font-size:11px; font-weight:600; text-transform:uppercase;
        letter-spacing:.4px; color:var(--text-dim); }
      .section-header:hover { background:var(--bg-hover); }
      .section-header .section-arrow { width:14px; height:14px; transition:transform .15s; flex-shrink:0; }
      .section-header.collapsed .section-arrow { transform:rotate(-90deg); }
      .section-body { padding:6px 12px 10px; }
      .section-body.hidden { display:none; }
      .prop-row { display:flex; align-items:center; gap:8px; padding:3px 0; min-height:26px; }
      .prop-label { width:96px; min-width:96px; font-size:11px; color:var(--text-dim); text-align:right; padding-right:4px; }
      .prop-value { flex:1; display:flex; gap:4px; align-items:center; }
      .prop-color-wrap { display:flex; align-items:center; gap:6px; flex:1; }
      .prop-color { width:22px; height:22px; border-radius:var(--radius); border:1px solid var(--border);
        cursor:pointer; flex-shrink:0; padding:0; -webkit-appearance:none; appearance:none; }
      .prop-color::-webkit-color-swatch-wrapper { padding:0; }
      .prop-color::-webkit-color-swatch { border:none; border-radius:2px; }
      .prop-slider-wrap { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
      .prop-num-input { width:64px; height:22px; flex-shrink:0; box-sizing:border-box; background:var(--bg-input);
        border:1px solid var(--border); border-radius:var(--radius); padding:0 5px; color:var(--text);
        font-size:11px; font-family:var(--font-mono); text-align:right; outline:none; }
      .prop-num-input:focus { border-color:var(--accent); }
      .prop-num-input::-webkit-outer-spin-button,.prop-num-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
      .prop-num-input[type=number] { appearance:textfield; -moz-appearance:textfield; }
      .prop-slider { flex:1; min-width:0; height:4px; -webkit-appearance:none; appearance:none; background:var(--bg-input); border-radius:2px; outline:none; }
      .prop-slider::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--accent); cursor:pointer; }
      .prop-dropdown { flex:1; height:22px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius);
        padding:0 6px; color:var(--text); font-size:12px; font-family:var(--font); outline:none; cursor:pointer; }
      .prop-toggle { width:14px; height:14px; border:1px solid var(--border-light); border-radius:3px; background:var(--bg-input);
        cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0; color:transparent; }
      .prop-toggle.checked { background:var(--accent); border-color:var(--accent); color:#fff; }
      .prop-toggle svg { width:10px; height:10px; }
      #hud {
        position: fixed; bottom: 8px; left: 8px; z-index: 25;
        color: #cfe0ff; font: 12px/1.4 ui-monospace, monospace;
        background: rgba(8, 14, 26, 0.55); padding: 6px 9px; border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import Stats from "stats-gl";
      import { createDayNightSky, SKY_DEFAULTS } from "./daynight-sky.js";
      import { createCloudLayer, CLOUD_DEFAULTS, GOD_RAYS_DEFAULTS } from "./cloud-layer.js";
      import { createTerrain } from "./daynight-terrain.js";
      import { createOcean } from "./daynight-ocean.js";
      import { OCEAN_DEFAULTS } from "./ocean-shader.js";
      import { createLensFlare, LENS_FLARE_DEFAULTS } from "./daynight-lensflare.js";
      import {
        fog, densityFogFactor, uniform, mix, pow, dot, clamp, normalize,
        positionWorld, cameraPosition,
      } from "three/tsl";

      const smoothstep = (e0, e1, x) => {
        const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      };

      // ── PARAMS ───────────────────────────────────────────────────────────
      const PARAMS = {
        timeOfDay: 9.5,      // 0..24
        autoAdvance: false,
        daySpeed: 0.5,       // hours per second
        latitude: 45,        // observer latitude (°) — tilts the sun/moon arc
        dayOfYear: 172,      // 1..365 → solar declination (172 ≈ N summer solstice)
        moonAge: 0.55,       // synodic age 0=new .5=full 1=new → moon position + phase
        exposure: 1.0,
        env: {
          sunIntensity: 3.2,
          sunHorizonColor: "#ff6a2c",
          moonIntensity: 0.45,
        },
        sky: { ...SKY_DEFAULTS },
        clouds: { ...CLOUD_DEFAULTS },
        fog: {
          enabled: true,
          density: 0.00022,
          color: "#9fb8c4",
          matchSky: true,
          sunTint: "#ffcaa0",
          tintPow: 3,
          hazeHeight: 0.12, // how high the sky-dome horizon haze climbs (sin elev)
        },
        godRays: { ...GOD_RAYS_DEFAULTS, enabled: false },
        bloom: { enabled: false, strength: 0.4, radius: 0.6, threshold: 0.92 },
        cloudShadows: { enabled: true, strength: 0.6 },
        character: { mode: false, speed: 80, height: 6, radius: 1.2 },
        lensFlare: { ...LENS_FLARE_DEFAULTS },
        shadows: { enabled: true, normalBias: 3, bias: -0.0005 },
        ocean: {
          enabled: true, waterY: 80, seaState: "Breezy",
          waveHeight: 1.8, choppiness: 1.5, reflectClouds: true,
          dispFadeStart: 600, dispFadeEnd: 4000,
        },
        terrain: {
          grassScale: 0.05, rockScale: 0.0025, snowScale: 0.018,
          dispStrength: 0, albedoMul: 0.94,
          snowStart: 158, snowEnd: 268, cliffLow: 0.12, cliffHigh: 0.36,
        },
        // Full ocean look/shaping set (defaults from OCEAN_DEFAULTS, driven via syncParams).
        oceanFx: { ...OCEAN_DEFAULTS },
      };

      // Sea-state presets: each sets wave height + FFT choppiness (the real
      // whitecap driver — more horizontal pinch folds the surface, lowering the
      // Jacobian → foam) + normal sharpness + the whitecap look together, so the
      // ocean goes from glassy to storming with one pick. Higher whitecap
      // threshold = MORE foam (foam triggers on less-folded crests).
      const SEA_STATES = {
        Calm:   { waveHeight: 0.7, normalStrength: 0.9, fftChoppiness: 0.7, wcThreshold: 0.50, wcIntensity: 0.6,  wcBrightness: 1.05, wcContrast: 1.40, wcNoiseScale: 0.32 },
        Breezy: { waveHeight: 1.8, normalStrength: 1.3, fftChoppiness: 1.3, wcThreshold: 0.66, wcIntensity: 1.0,  wcBrightness: 1.15, wcContrast: 1.55, wcNoiseScale: 0.38 },
        Choppy: { waveHeight: 2.7, normalStrength: 1.8, fftChoppiness: 1.9, wcThreshold: 0.78, wcIntensity: 1.25, wcBrightness: 1.25, wcContrast: 1.70, wcNoiseScale: 0.44 },
        Stormy: { waveHeight: 3.5, normalStrength: 2.2, fftChoppiness: 2.4, wcThreshold: 0.88, wcIntensity: 1.5,  wcBrightness: 1.35, wcContrast: 1.90, wcNoiseScale: 0.52 },
      };

      // ── Celestial driver: time-of-day → sun/moon directions + light ────────
      // ── Astronomical sun/moon model ────────────────────────────────────────
      // Real altitude/azimuth from latitude + day-of-year (solar declination) +
      // hour angle, so the daily arc TILTS with latitude/season instead of
      // rising straight up, and twilight lengthens toward the poles. The moon
      // rides the ecliptic, trailing the sun by its synodic age, and is lit by
      // the real sun (so its phase + crescent orientation are automatic).
      const DEG = Math.PI / 180;
      const OBLIQUITY = 23.44 * DEG; // Earth's axial tilt

      // Hour angle H + declination → world direction (X=east, Y=up, Z=south).
      function equatorialToDir(H, decl, lat, out) {
        const sinD = Math.sin(decl), cosD = Math.cos(decl);
        const sinL = Math.sin(lat), cosL = Math.cos(lat);
        const cosH = Math.cos(H), sinH = Math.sin(H);
        const east = -cosD * sinH;
        const up = sinL * sinD + cosL * cosD * cosH;
        const south = cosD * sinL * cosH - sinD * cosL;
        return out.set(east, up, south).normalize();
      }
      const _sunDir = new THREE.Vector3();
      const _moonDir = new THREE.Vector3();
      const _moonLightDir = new THREE.Vector3();
      const _sunHigh = new THREE.Color();
      const _sunWarm = new THREE.Color();
      const _lightColor = new THREE.Color();
      const _ambColor = new THREE.Color();
      const _dayHorizon = new THREE.Color();
      const _nightHorizon = new THREE.Color();
      const _fogColor = new THREE.Color();

      function computeFrameLighting() {
        // ── Celestial positions (astronomical) ──
        const lat = PARAMS.latitude * DEG;
        // Sun ecliptic longitude from day-of-year (≈0° at the vernal equinox, day 80).
        const lamSun = (360 * (PARAMS.dayOfYear - 80) / 365.25) * DEG;
        const declSun = Math.asin(Math.sin(OBLIQUITY) * Math.sin(lamSun));
        const raSun = Math.atan2(Math.cos(OBLIQUITY) * Math.sin(lamSun), Math.cos(lamSun));
        const Hsun = (PARAMS.timeOfDay - 12) * 15 * DEG; // hour angle: 15°/h, 0 at solar noon
        equatorialToDir(Hsun, declSun, lat, _sunDir);

        // Moon: same machinery, sharing the sun-implied sidereal time, trailing
        // the sun along the ecliptic by its synodic age (0=new → .5=full → 1=new).
        const lst = Hsun + raSun; // local sidereal time
        const lamMoon = lamSun + PARAMS.moonAge * 2 * Math.PI;
        const declMoon = Math.asin(Math.sin(OBLIQUITY) * Math.sin(lamMoon));
        const raMoon = Math.atan2(Math.cos(OBLIQUITY) * Math.sin(lamMoon), Math.cos(lamMoon));
        equatorialToDir(lst - raMoon, declMoon, lat, _moonDir);

        // The moon is lit by the real sun → terminator + crescent orientation
        // follow the actual geometry, and the phase matches the moon's age.
        _moonLightDir.copy(_sunDir);

        const sunUp = _sunDir.y;
        const dayF = smoothstep(-0.15, 0.25, sunUp);

        _sunHigh.set(PARAMS.sky.sunColor);
        _sunWarm.set(PARAMS.env.sunHorizonColor);
        // Warm at the horizon, neutral-warm high up.
        _sunWarm.lerp(_sunHigh, smoothstep(0.0, 0.35, sunUp));
        const sunInt = smoothstep(-0.08, 0.2, sunUp) * PARAMS.env.sunIntensity;
        const moonInt = (1 - dayF) * PARAMS.env.moonIntensity;

        // Dominant light: sun while above horizon, otherwise the moon.
        let lightDir, lightIntensity;
        if (sunUp >= 0) {
          _lightColor.copy(_sunWarm);
          lightDir = _sunDir;
          lightIntensity = sunInt;
        } else {
          _lightColor.set(PARAMS.sky.moonColor);
          lightDir = _moonDir;
          lightIntensity = moonInt;
        }

        // Ambient = horizon color crossfaded day↔night, with a moon floor.
        _dayHorizon.set(PARAMS.sky.horizonDay);
        _nightHorizon.set(PARAMS.sky.horizonNight);
        _ambColor.copy(_nightHorizon).lerp(_dayHorizon, dayF);
        const ambIntensity = THREE.MathUtils.lerp(0.12, 0.55, dayF) + moonInt * 0.25;

        return { sunUp, dayF, lightDir, lightIntensity, moonInt, ambIntensity };
      }

      // ── Custom UI helpers (ported from v2/editor.html) ─────────────────────
      const _checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      const _arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';
      const _hu = (k) => k.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase()).trim();
      function _fmt(v, step) {
        if (step >= 1) return String(Math.round(v));
        const d = Math.max(0, -Math.floor(Math.log10(step)));
        return v.toFixed(d);
      }
      function _clampSnap(v, min, max, step) {
        if (!Number.isFinite(v)) return min;
        let out = min + Math.round((v - min) / step) * step;
        const s = String(step);
        const dec = s.includes(".") ? s.split(".")[1].length : 0;
        if (dec > 0) out = Number(out.toFixed(dec));
        return Math.min(max, Math.max(min, out));
      }
      function _section(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr); sec.appendChild(body); parent.appendChild(sec);
        return body;
      }
      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${obj[key]}"><input type="number" class="prop-num-input" min="${min}" max="${max}" step="${step}" value="${_fmt(obj[key], step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        sl.addEventListener("input", () => {
          obj[key] = parseFloat(sl.value);
          num.value = _fmt(obj[key], step);
          onChange?.();
        });
        const commit = () => {
          const raw = String(num.value).trim();
          if (raw === "" || raw === "-" || raw === ".") { num.value = _fmt(obj[key], step); return; }
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) { num.value = _fmt(obj[key], step); return; }
          v = _clampSnap(v, min, max, step);
          obj[key] = v; sl.value = String(v); num.value = _fmt(v, step); onChange?.();
        };
        num.addEventListener("change", commit);
        num.addEventListener("keydown", (e) => { if (e.key === "Enter") num.blur(); });
        parent.appendChild(row);
        return {
          _sl: sl, _num: num,
          refresh() { sl.value = String(obj[key]); num.value = _fmt(obj[key], step); },
        };
      }
      function _color(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"></div></div>`;
        const inp = row.querySelector(".prop-color");
        inp.addEventListener("input", () => { obj[key] = inp.value; onChange?.(); });
        parent.appendChild(row);
      }
      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.();
        });
        parent.appendChild(row);
      }
      function _dropdown(parent, obj, key, opts) {
        const { label, options, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        let optHtml = "";
        for (const [text, val] of Object.entries(options))
          optHtml += `<option value="${val}" ${obj[key] === val ? "selected" : ""}>${text}</option>`;
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><select class="prop-dropdown">${optHtml}</select></div>`;
        const sel = row.querySelector(".prop-dropdown");
        const isNum = typeof obj[key] === "number";
        sel.addEventListener("change", () => {
          obj[key] = isNum ? Number(sel.value) : sel.value;
          onChange?.();
        });
        parent.appendChild(row);
      }

      // ── Init ───────────────────────────────────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = PARAMS.exposure;
        document.body.appendChild(renderer.domElement);
        await renderer.init();
        // Sun shadow maps. autoUpdate off → we trigger ONE update per frame
        // (the cloud pipeline issues several renderer.render calls per frame).
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = false;

        // FPS / CPU / GPU stats (same as template-unreal-objects.html).
        const stats = new Stats({ trackGPU: true });
        await stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          55, window.innerWidth / window.innerHeight, 0.1, 30000,
        );
        camera.position.set(-640, 360, 1040);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 30, -60);
        controls.maxPolarAngle = Math.PI * 0.92;
        controls.maxDistance = 6000;
        controls.update();

        // Lights (driven by the celestial solver each frame).
        const sunLight = new THREE.DirectionalLight(0xffffff, 3.0);
        scene.add(sunLight, sunLight.target);
        // Shadow camera sized to bracket the 1600-unit terrain at any sun angle.
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        sunLight.shadow.camera.near = 200;
        sunLight.shadow.camera.far = 4200;
        sunLight.shadow.camera.left = -1200;
        sunLight.shadow.camera.right = 1200;
        sunLight.shadow.camera.top = 1200;
        sunLight.shadow.camera.bottom = -1200;
        sunLight.shadow.bias = PARAMS.shadows.bias;
        sunLight.shadow.normalBias = PARAMS.shadows.normalBias;
        sunLight.shadow.camera.updateProjectionMatrix();
        const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x40424a, 0.4);
        scene.add(hemi);

        // ── Aerial perspective (sun-tinted distance haze) ────────────────────
        // ONE scene.fogNode, driven by uniforms (never reassigned — toggling it
        // recompiles every material → WebGPU device-loss risk). Distant terrain
        // fades to a cool haze away from the sun and a warm haze toward it.
        const uHazeEnabled = uniform(1);
        const uHazeDensity = uniform(PARAMS.fog.density);
        const uHazeAway = uniform(new THREE.Color(PARAMS.fog.color).convertSRGBToLinear());
        const uHazeSun = uniform(new THREE.Color(PARAMS.fog.sunTint).convertSRGBToLinear());
        const uHazePow = uniform(PARAMS.fog.tintPow);
        const uHazeSunDir = uniform(new THREE.Vector3(0, 1, 0));
        const uHazeSunStrength = uniform(1); // fades the warm sun tint out at night
        const _hazeView = normalize(positionWorld.sub(cameraPosition));
        const _hazeSunAmt = clamp(dot(_hazeView, uHazeSunDir), 0, 1);
        const _hazeColor = mix(uHazeAway, uHazeSun, pow(_hazeSunAmt, uHazePow).mul(uHazeSunStrength));
        scene.fogNode = fog(_hazeColor, densityFogFactor(uHazeDensity).mul(uHazeEnabled));

        // ── Clouds ───────────────────────────────────────────────────────────
        const clouds = createCloudLayer({ camera });

        // PBR terrain (grass / rock / snow triplanar) — the showcase landscape.
        const terrain = await createTerrain({ size: 1600, segments: 384 });
        scene.add(terrain.mesh);
        terrain.mesh.castShadow = true; // ridges shadow the valleys (receiveShadow set in module)

        // ── Sky ──────────────────────────────────────────────────────────────
        const sky = createDayNightSky();
        scene.add(sky.mesh);
        scene.add(clouds.mesh, clouds.sunMesh);

        // Sun-anchored lens flare (own layer; drawn as an overlay after clouds).
        const lensFlare = createLensFlare({ camera });
        scene.add(lensFlare.group);

        // ── Ocean (reuses the shared, unedited ocean modules) ────────────────
        const ocean = await createOcean({
          renderer, terrainSize: 8000, heightRes: 512, getHeight: terrain.getHeight,
          seaLevel: PARAMS.ocean.waterY,
        });
        scene.add(ocean.group);
        ocean.setVisible(PARAMS.ocean.enabled);

        // Sky → PMREM env map for the ocean's reflections. The old version called
        // `pmrem.fromScene` every 0.4s, which rendered the SKY + the full cloud
        // raymarch into all 6 cube faces AND convolved — all in one frame, an
        // 80ms+ hitch. We AMORTIZE instead: render ONE cube face per frame (the
        // cloud raymarch spreads over 6 frames), convolve once the cube is done,
        // then idle ~1.5s. This was the entire ocean perf cost (see perf trace).
        const pmrem = new THREE.PMREMGenerator(renderer);
        let _envRT = null;

        // Persistent env scene: sky + cloud clones at the origin. clone() SHARES
        // the materials/uniforms, so these auto-track the live sky/cloud every
        // frame — no per-bake rebuild.
        const envScene = new THREE.Scene();
        const skyEnvClone = sky.mesh.clone();
        skyEnvClone.position.set(0, 0, 0);
        envScene.add(skyEnvClone);
        const cloudEnvClone = clouds.mesh.clone();
        cloudEnvClone.position.set(0, 0, 0);
        cloudEnvClone.layers.set(0); // the cube cameras render layer 0
        envScene.add(cloudEnvClone);

        const cubeRT = new THREE.CubeRenderTarget(128, { type: THREE.HalfFloatType });
        const cubeCam = new THREE.CubeCamera(0.1, 20000, cubeRT);
        cubeCam.updateMatrixWorld(true);

        function renderEnvFace(face) {
          const withClouds = PARAMS.ocean.reflectClouds && PARAMS.clouds.enabled;
          cloudEnvClone.visible = withClouds;
          if (withClouds) clouds.setEnvMode(true); // skip depth occlusion, cheaper march
          renderer.setRenderTarget(cubeRT, face);
          renderer.render(envScene, cubeCam.children[face]);
          renderer.setRenderTarget(null);
          if (withClouds) clouds.setEnvMode(false);
        }
        function convolveEnv() {
          const rt = pmrem.fromCubemap(cubeRT.texture);
          ocean.setEnvMap(rt.texture);
          if (_envRT) _envRT.dispose();
          _envRT = rt;
        }
        // Initial full bake so the ocean has reflections on the first frame.
        try {
          for (let f = 0; f < 6; f++) renderEnvFace(f);
          convolveEnv();
        } catch (e) { window.__envErr = e?.stack || ("" + e); console.error("ENV BAKE FAILED:", e); }

        // Amortized re-bake: one face/frame, convolve on completion, then idle.
        const ENV_IDLE = 1.5;   // seconds between full re-bakes
        let _envFace = -1;      // -1 = idle, 0..5 = rendering that face
        let _envIdle = ENV_IDLE;
        function updateEnvBake(dt) {
          if (!PARAMS.ocean.enabled) return;
          if (_envFace < 0) {
            _envIdle -= dt;
            if (_envIdle > 0) return;
            _envFace = 0;
          }
          renderEnvFace(_envFace);
          _envFace++;
          if (_envFace >= 6) { convolveEnv(); _envFace = -1; _envIdle = ENV_IDLE; }
        }

        // ── Character + follow camera ────────────────────────────────────────
        // A kinematic capsule that walks the heightfield (WASD + arrow keys,
        // Shift to sprint). The follow camera REUSES OrbitControls: each frame
        // we glue the orbit target to the capsule and translate the camera by
        // the capsule's delta, so mouse-orbit and wheel-zoom still work — you
        // just orbit around the walking character instead of the world origin.
        const charMat = new THREE.MeshStandardNodeMaterial({
          color: 0xff5a3c, roughness: 0.55, metalness: 0.0,
        });
        let charMesh = null;
        function buildCharacter() {
          if (charMesh) { scene.remove(charMesh); charMesh.geometry.dispose(); }
          const r = PARAMS.character.radius, h = PARAMS.character.height;
          const geo = new THREE.CapsuleGeometry(r, Math.max(0.1, h - 2 * r), 8, 16);
          charMesh = new THREE.Mesh(geo, charMat);
          charMesh.castShadow = true;
          charMesh.visible = PARAMS.character.mode;
          scene.add(charMesh);

        buildCharacter();

        const charPos = new THREE.Vector3(0, 0, 0);
        const _prevChar = new THREE.Vector3();
        function groundAt(x, z) {
          return Math.max(terrain.getHeight(x, z), PARAMS.ocean.waterY);
        }
        function placeCharacter(x, z) {
          charPos.set(x, groundAt(x, z) + PARAMS.character.height * 0.5, z);

          "KeyW", "KeyA", "KeyS", "KeyD",
          "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",

        addEventListener("keydown", (e) => {
          const t = document.activeElement;
          if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
          keys[e.code] = true;

        const _savedTarget = new THREE.Vector3();
        let _wasCharMode = false;
        const HALF = 1600 / 2 - 4; // keep the capsule on the terrain tile
        const _fwd = new THREE.Vector3(), _right = new THREE.Vector3();
        const _mv = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);

        function updateCamera(dt) {
          const mode = PARAMS.character.mode;
          // ── Mode transitions ──
          if (mode && !_wasCharMode) {
            _savedCam.copy(camera.position);
            _savedTarget.copy(controls.target);
            charMesh.visible = true;
            controls.enablePan = false;
            controls.minDistance = 3;
            controls.maxDistance = 120;
            const h = PARAMS.character.height;
            camera.position.set(charPos.x, charPos.y + h * 1.2, charPos.z + h * 3.5);
            controls.target.set(charPos.x, charPos.y + h * 0.3, charPos.z);
            _prevChar.copy(charPos);
            controls.update();
          }
          if (!mode && _wasCharMode) {
            charMesh.visible = false;
            controls.enablePan = true;
            controls.minDistance = 0;
            controls.maxDistance = 6000;
            camera.position.copy(_savedCam);
            controls.target.copy(_savedTarget);
            controls.update();
          }
          _wasCharMode = mode;

          if (!mode) { controls.update(); return; }

          // ── Walk: camera-relative horizontal movement ──
          camera.getWorldDirection(_fwd); _fwd.y = 0;
          if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
          _fwd.normalize();
          _right.crossVectors(_fwd, _up).normalize();
          _mv.set(0, 0, 0);
          if (keys.KeyW || keys.ArrowUp) _mv.add(_fwd);
          if (keys.KeyS || keys.ArrowDown) _mv.sub(_fwd);

            charMesh.rotation.y = Math.atan2(_mv.x, _mv.z);

          charPos.y = groundAt(charPos.x, charPos.z) + PARAMS.character.height * 0.5;

          // Follow: translate camera by the capsule's delta, glue target to it.
          camera.position.x += charPos.x - _prevChar.x;
          camera.position.y += charPos.y - _prevChar.y;
          camera.position.z += charPos.z - _prevChar.z;

        sl(s, PARAMS.godRays, "occCloudSteps", 4, 16, 1, "Cloud occ steps");
        sl(s, PARAMS.godRays, "sunDistance", 3500, 16000, 50);
        sl(s, PARAMS.godRays, "sunDiscRadius", 80, 650, 5);
        col(s, PARAMS.godRays, "sunTint", "Sun tint");
        tg(s, PARAMS.godRays, "matchLightColor", "Tint = light color");

        s = _section(uiBody, "Bloom");
        tg(s, PARAMS.bloom, "enabled");
        sl(s, PARAMS.bloom, "strength", 0, 2, 0.01);
        sl(s, PARAMS.bloom, "radius", 0, 1, 0.01);
        sl(s, PARAMS.bloom, "threshold", 0, 1.5, 0.01);

        s = _section(uiBody, "Lens flare", false);
        tg(s, PARAMS.lensFlare, "enabled");
        sl(s, PARAMS.lensFlare, "intensity", 0, 8, 0.05);
        sl(s, PARAMS.lensFlare, "halationSize", 0, 8, 0.05, "Halation size");
        col(s, PARAMS.lensFlare, "halationColor", "Halation color");
        sl(s, PARAMS.lensFlare, "streakLength", 0, 3, 0.05, "Streak length");
        sl(s, PARAMS.lensFlare, "streakOpacity", 0, 2, 0.05, "Streak opacity");
        col(s, PARAMS.lensFlare, "streakColor", "Streak color");
        sl(s, PARAMS.lensFlare, "ghostOpacity", 0, 4, 0.05, "Ghost opacity");
        sl(s, PARAMS.lensFlare, "ghostSpacing", 0, 2, 0.05, "Ghost spacing");
        sl(s, PARAMS.lensFlare, "dirtOpacity", 0, 2, 0.05, "Dirt opacity");

        s = _section(uiBody, "Atmosphere (scattering)");
        tg(s, PARAMS.sky, "scatter");
        sl(s, PARAMS.sky, "sunIntensity", 0, 60, 0.5, "Sun intensity");
        sl(s, PARAMS.sky, "rayleigh", 0, 3, 0.01, "Rayleigh (blue)");
        sl(s, PARAMS.sky, "mie", 0, 3, 0.01, "Mie (haze)");
        sl(s, PARAMS.sky, "mieG", 0, 0.95, 0.01, "Mie aureole");
        sl(s, PARAMS.sky, "atmoAltitude", 0, 12000, 100, "Viewer altitude");
        sl(s, PARAMS.sky, "msAmount", 0, 3, 0.05, "Multi-scatter");
        sl(s, PARAMS.sky, "msExtinct", 0.05, 1, 0.01, "MS energy keep");

        s = _section(uiBody, "Sky colors", false);
        for (const k of ["zenithDay", "horizonDay", "zenithNight", "horizonNight", "sunsetColor", "groundColor", "sunColor", "moonColor"]) col(s, PARAMS.sky, k);
        sl(s, PARAMS.sky, "sunSizeDeg", 0.3, 6, 0.1);
        sl(s, PARAMS.sky, "sunGlowStrength", 0, 2, 0.01);
        sl(s, PARAMS.sky, "moonGlowStrength", 0, 2, 0.01);

        s = _section(uiBody, "Moon", false);
        sl(s, PARAMS, "moonAge", 0, 1, 0.01, "Age (new→full→new)");
        sl(s, PARAMS.sky, "moonTermSoft", 0.005, 0.3, 0.005, "Terminator soft");
        sl(s, PARAMS.sky, "moonSurface", 0, 1, 0.01, "Surface detail");
        sl(s, PARAMS.sky, "moonEarthshine", 0, 0.6, 0.01, "Earthshine");
        sl(s, PARAMS.sky, "moonSizeDeg", 0.5, 8, 0.1, "Size (deg)");
        sl(s, PARAMS.sky, "moonDiscBright", 0, 8, 0.1, "Brightness");
        col(s, PARAMS.sky, "moonColor");

        s = _section(uiBody, "Stars", false);
        sl(s, PARAMS.sky, "starDensity", 40, 600, 1);
        sl(s, PARAMS.sky, "starThreshold", 0.7, 0.99, 0.005);
        sl(s, PARAMS.sky, "starSize", 0.01, 0.3, 0.005);
        sl(s, PARAMS.sky, "starBrightness", 0, 3, 0.05);
        sl(s, PARAMS.sky, "starTwinkle", 0, 10, 0.1);

        s = _section(uiBody, "Milky Way", false);
        tg(s, PARAMS.sky, "milkyWayEnabled", "Enabled");
        sl(s, PARAMS.sky, "milkyWayIntensity", 0, 3, 0.05, "Intensity");
        sl(s, PARAMS.sky, "milkyWayWidth", 0.05, 0.6, 0.01, "Band width");
        sl(s, PARAMS.sky, "milkyWayScale", 1, 10, 0.1, "Detail scale");
        col(s, PARAMS.sky, "milkyWayColor1", "Dust color");
        col(s, PARAMS.sky, "milkyWayColor2", "Cloud color");

        s = _section(uiBody, "Shooting stars", false);
        tg(s, PARAMS.sky, "meteorEnabled", "Enabled");
        sl(s, PARAMS.sky, "meteorIntensity", 0, 3, 0.05, "Intensity");
        sl(s, PARAMS.sky, "meteorRate", 0, 1, 0.01, "Frequency");
        sl(s, PARAMS.sky, "meteorSpeed", 0.2, 3, 0.05, "Speed");
        sl(s, PARAMS.sky, "meteorLength", 0.02, 0.4, 0.005, "Trail length");
        sl(s, PARAMS.sky, "meteorWidth", 0.001, 0.03, 0.001, "Thickness");

        s = _section(uiBody, "High clouds (cirrus)", false);
        tg(s, PARAMS.sky, "cloudEnabled", "Enabled");
        sl(s, PARAMS.sky, "cloudCoverage", 0, 1, 0.01, "Coverage");
        sl(s, PARAMS.sky, "cloudDensity", 0, 1, 0.01, "Opacity");
        sl(s, PARAMS.sky, "cloudOpacity", 0, 1.5, 0.05, "Master opacity");
        sl(s, PARAMS.sky, "cloudScale", 0.1, 3, 0.05, "Scale (↑=smaller)");
        sl(s, PARAMS.sky, "cloudStretch", 1, 8, 0.1, "Streakiness");
        sl(s, PARAMS.sky, "cloudSharpness", 0.02, 0.6, 0.01, "Edge softness");
        sl(s, PARAMS.sky, "cloudDetail", 0, 1, 0.01, "Detail");
        sl(s, PARAMS.sky, "cloudSunTint", 0, 2, 0.05, "Sunset tint");
        sl(s, PARAMS.sky, "cloudSpeed", 0, 0.1, 0.001, "Wind speed");
        sl(s, PARAMS.sky, "cloudWindDeg", 0, 360, 1, "Wind dir");
        col(s, PARAMS.sky, "cloudColor", "Color");
        sl(s, PARAMS.sky, "cloudAerial", 0, 1, 0.05, "Aerial perspective");

        s = _section(uiBody, "Cloud layer (volumetric)");
        tg(s, PARAMS.clouds, "enabled");
        sl(s, PARAMS.clouds, "coverage", 0, 1, 0.01);
        sl(s, PARAMS.clouds, "softness", 0.02, 0.4, 0.01);
        sl(s, PARAMS.clouds, "densityMul", 0.5, 16, 0.1);
        sl(s, PARAMS.clouds, "erode", 0, 1, 0.01);
        sl(s, PARAMS.clouds, "detailMul", 1, 8, 0.1);
        dd(s, PARAMS.clouds, "detailNoise", { "Perlin (smoky)": 0, "Worley (billow)": 1 }, "Detail noise");
        sl(s, PARAMS.clouds, "base", 600, 4000, 10);
        sl(s, PARAMS.clouds, "thickness", 200, 2500, 10);
        sl(s, PARAMS.clouds, "planetRadius", 15000, 400000, 1000);
        sl(s, PARAMS.clouds, "scale", 0.00005, 0.002, 0.00001);
        dd(s, PARAMS.clouds, "bufferScale", { "Half (fast)": 0.5, "¾": 0.75, "Full (sharp)": 1.0 }, "Resolution");
        sl(s, PARAMS.clouds, "steps", 16, 128, 1);
        sl(s, PARAMS.clouds, "lightSteps", 2, 8, 1);
        sl(s, PARAMS.clouds, "emptySkip", 1, 4, 0.1, "Empty-space skip");
        sl(s, PARAMS.clouds, "opacity", 0.2, 3, 0.05);
        sl(s, PARAMS.clouds, "phaseG", 0, 0.9, 0.01);
        sl(s, PARAMS.clouds, "powder", 0, 1, 0.01);
        sl(s, PARAMS.clouds, "msAmount", 0, 1.5, 0.05, "★ Multi-scatter");
        sl(s, PARAMS.clouds, "msExtinction", 0.1, 0.9, 0.05, "MS light depth");
        sl(s, PARAMS.clouds, "msEccentricity", 0.1, 0.9, 0.05, "MS phase broad");
        sl(s, PARAMS.clouds, "windSpeed", 0, 0.2, 0.001);
        sl(s, PARAMS.clouds, "windDeg", 0, 360, 1);
        tg(s, PARAMS.clouds, "aerialEnabled", "Aerial perspective");
        sl(s, PARAMS.clouds, "aerialDensity", 0.00002, 0.0006, 0.00001, "Aerial density");
        sl(s, PARAMS.clouds, "aerialAmount", 0, 1, 0.05, "Aerial amount");

        // ── Loop ──────────────────────────────────────────────────────────
        const hud = document.getElementById("hud");
        const timer = new THREE.Timer();
        let elapsed = 0;

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener("resize", onResize);

        renderer.setAnimationLoop(() => {
          timer.update();
          const dt = Math.min(timer.getDelta(), 0.05);
          elapsed += dt;
          updateCamera(dt);

          if (PARAMS.autoAdvance) {
            PARAMS.timeOfDay = (PARAMS.timeOfDay + PARAMS.daySpeed * dt) % 24;
            if (document.activeElement !== timeSlider._sl && document.activeElement !== timeSlider._num)
              timeSlider.refresh();
          }
          renderer.toneMappingExposure = PARAMS.exposure;

          const L = computeFrameLighting();

          // Scene lights follow the celestial solver.
          sunLight.position.copy(L.lightDir).multiplyScalar(2200);
          sunLight.target.position.set(0, 0, 0);
          sunLight.color.copy(_lightColor);
          sunLight.intensity = L.lightIntensity;
          hemi.color.copy(_ambColor);
          hemi.intensity = L.ambIntensity;
          hemi.groundColor.set(PARAMS.sky.groundColor);

          // Shadows: one regeneration per frame (autoUpdate is off).
          sunLight.castShadow = PARAMS.shadows.enabled;
          sunLight.shadow.bias = PARAMS.shadows.bias;
          sunLight.shadow.normalBias = PARAMS.shadows.normalBias;
          if (PARAMS.shadows.enabled) renderer.shadowMap.needsUpdate = true;

          // Aerial-perspective uniforms (fogNode is assigned once at setup).
          if (PARAMS.fog.matchSky) _fogColor.copy(_ambColor);
          else _fogColor.set(PARAMS.fog.color);
          uHazeEnabled.value = PARAMS.fog.enabled ? 1 : 0;
          uHazeDensity.value = PARAMS.fog.density;
          uHazeAway.value.copy(_fogColor).convertSRGBToLinear();
          uHazeSun.value.set(PARAMS.fog.sunTint).convertSRGBToLinear();
          uHazePow.value = PARAMS.fog.tintPow;
          uHazeSunDir.value.copy(_sunDir);
          // Warm tint = sunlight in the haze → full by day, gone at night.
          uHazeSunStrength.value = smoothstep(-0.1, 0.05, L.sunUp);

          const frame = {
            time: elapsed, dt,
            sunDir: _sunDir, moonDir: _moonDir, moonLightDir: _moonLightDir, camera,
            lightDir: L.lightDir,
            lightColor: _lightColor,
            lightIntensity: Math.max(L.lightIntensity, 0.15),
            ambientColor: _ambColor,
            ambientIntensity: L.ambIntensity,
            fog: {
              enabled: PARAMS.fog.enabled,
              color: _fogColor,
              density: PARAMS.fog.density,
              hazeHeight: PARAMS.fog.hazeHeight,
            },
          };

          sky.update(PARAMS.sky, frame);
          clouds.update(PARAMS.clouds, frame);
          clouds.setBloom(PARAMS.bloom);

          // Terrain texture/material controls.
          const tU = terrain.uniforms;
          if (tU.grassScale) {
            const T = PARAMS.terrain;
            tU.grassScale.value = T.grassScale;
            tU.rockScale.value = T.rockScale;
            tU.snowScale.value = T.snowScale;
            tU.dispStrength.value = T.dispStrength;
            tU.albedoMul.value = T.albedoMul;
            tU.snowStart.value = T.snowStart;
            tU.snowEnd.value = T.snowEnd;
            tU.cliffLow.value = T.cliffLow;
            tU.cliffHigh.value = T.cliffHigh;
          }
          // Cloud shadows (composite pass → terrain AND ocean). Track the sun;
          // fade out at night (no sun = no shadow) and when clouds are off.
          clouds.setCloudShadow({
            enabled: PARAMS.cloudShadows.enabled && PARAMS.clouds.enabled,
            strength: PARAMS.cloudShadows.strength * L.dayF,
            sunDir: _sunDir,
          });

          // Ocean: re-bake the sky reflection on a throttle, then step the waves.
          if (PARAMS.ocean.enabled) {
            ocean.setVisible(true);
            ocean.setWaterY(PARAMS.ocean.waterY);
            // Only the large-tile swell scales with the slider; the small ripple
            // tile (48u) stays fixed or it repeats as visible squares when amplified.
            ocean.syncParams(PARAMS.oceanFx);
            ocean.uniforms.fftSwellAmp.value = PARAMS.ocean.waveHeight;
            ocean.uniforms.fftNormalStrength.value = PARAMS.ocean.choppiness;
            ocean.uniforms.dispFadeStart.value = PARAMS.ocean.dispFadeStart;
            ocean.uniforms.dispFadeEnd.value = PARAMS.ocean.dispFadeEnd;
            updateEnvBake(dt);
            ocean.update(dt, elapsed, camera, L.lightDir);
          } else {
            ocean.setVisible(false);
          }

          // One call: scene→offscreen (with depth), clouds raymarched half-res
          // with depth occlusion, then composited to the canvas.
          clouds.render(renderer, scene, camera, {
            godRays: PARAMS.godRays,
            frame,
            skyMesh: sky.mesh,
            occluders: [terrain.mesh],
          });

          // Lens flare: additive overlay onto the canvas, anchored to the sun.
          lensFlare.update(_sunDir, PARAMS.lensFlare);
          lensFlare.render(renderer, scene, camera);

          hud.textContent =
            `time ${PARAMS.timeOfDay.toFixed(2)}h  sunUp ${L.sunUp.toFixed(2)}  ` +
            `day ${(L.dayF * 100) | 0}%`;

          stats.update();
          // Drain the GPU timestamp query pools each frame (our pipeline issues
          // many render + compute passes; the compute ones — the ocean FFT —
          // otherwise overflow the pool). Fire-and-forget.
          renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER);
          renderer.resolveTimestampsAsync(THREE.TimestampQuery.COMPUTE);
        });
      }

      init();
    </script>
  </body>
