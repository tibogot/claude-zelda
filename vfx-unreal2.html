<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VFX Unreal V2 - FX Editor</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0d;
        color: #d7ffd0;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      #viewport {
        position: absolute;
        inset: 0;
      }

      #ui {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 10;
        width: 330px;
        max-width: 85vw;
        height: 100%;
        overflow: auto;
        padding: 10px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.35);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="viewport"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn, uv, vec2, vec3, vec4, float, sin, cos, fract, floor, dot,
        abs, min, max, smoothstep, uniform, color, positionLocal, atan,
      } from "three/tsl";
      import { pass } from "three/tsl";
      import { bloom } from "three/addons/tsl/display/BloomNode.js";

      let renderer, scene, camera, controls, pane, renderPipeline, bloomPass;
      let slashMesh, energyMesh, energyDarkMesh;
      let currentEffect = "bladeSlash";

      /* ── Shared uniforms ────────────────────────────────────── */
      const u = {
        time: uniform(0),
      };

      /* ── Shared noise ───────────────────────────────────────── */
      const hash21 = Fn(([p]) => fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453)));
      const valueNoise2D = Fn(([p]) => {
        const i = floor(p); const f = fract(p);
        const u2 = f.mul(f).mul(float(3).sub(f.mul(2)));
        const a = hash21(i), b = hash21(i.add(vec2(1, 0)));
        const c = hash21(i.add(vec2(0, 1))), d = hash21(i.add(vec2(1, 1)));
        return a.add(b.sub(a).mul(u2.x)).add(
          c.add(d.sub(c).mul(u2.x)).sub(a.add(b.sub(a).mul(u2.x))).mul(u2.y)
        );
      });

      /* ── Shared params ──────────────────────────────────────── */
      const params = {
        effect: "bladeSlash",
        autoRotate: true,
        autoRotateSpeed: 0.8,
        bloomStrength: 1.05,
        bloomRadius: 0.15,
        bloomThreshold: 0.92,
      };

      /* ── Blade Slash params + uniforms ──────────────────────── */
      const slashParams = {
        yScale: 0.34,
        baseColor: "#0a1320",
        slashColor: "#66dfff",
        edgeColor: "#ffffff",
        slashIntensity: 4.8,
        alphaStrength: 1.0,
        ringSoftness: 0.22,
        ringCenter: 0.65,
        ringWidth: 0.26,
        radialNoiseScale: 11.5,
        radialNoiseWarp: 1.8,
        radialNoiseSpeed: 1.25,
        streakFreq: 17.0,
        streakStrength: 0.33,
        edgeThreshold: 0.52,
        edgeSharpness: 0.08,
      };
      const su = {
        baseColor: uniform(color(slashParams.baseColor)),
        slashColor: uniform(color(slashParams.slashColor)),
        edgeColor: uniform(color(slashParams.edgeColor)),
        slashIntensity: uniform(slashParams.slashIntensity),
        alphaStrength: uniform(slashParams.alphaStrength),
        ringSoftness: uniform(slashParams.ringSoftness),
        ringCenter: uniform(slashParams.ringCenter),
        ringWidth: uniform(slashParams.ringWidth),
        radialNoiseScale: uniform(slashParams.radialNoiseScale),
        radialNoiseWarp: uniform(slashParams.radialNoiseWarp),
        radialNoiseSpeed: uniform(slashParams.radialNoiseSpeed),
        streakFreq: uniform(slashParams.streakFreq),
        streakStrength: uniform(slashParams.streakStrength),
        edgeThreshold: uniform(slashParams.edgeThreshold),
        edgeSharpness: uniform(slashParams.edgeSharpness),
      };

      /* ── Energy FX params + uniforms ────────────────────────── */
      const energyParams = {
        energyColor: "#33ccff",
        coreColor: "#ffffff",
        darkColor: "#041828",
        intensity: 5.0,
        height: 2.0,
        radius: 0.3,
        segments: 30,
        timeScale: 0.8,
        parabolStrength: 0.6,
        parabolOffset: 0.5,
        parabolAmplitude: 0.3,
        turbulenceStr: 0.15,
        turbulenceFreq: 6.0,
        turbulenceAngle: 2.0,
        noiseScaleX: 3.0,
        noiseScaleY: 0.5,
        noiseSpeed: 1.0,
        noiseSkew: -1.0,
        noise2ScaleX: 6.0,
        noise2ScaleY: 1.2,
        noise2Speed: 0.6,
        alphaWidth: 0.35,
        topFade: 0.4,
        bottomFade: 0.1,
        darkAlphaWidth: 0.3,
        darkScale: 1.05,
      };
      const eu = {
        energyColor: uniform(color(energyParams.energyColor)),
        coreColor: uniform(color(energyParams.coreColor)),
        darkColor: uniform(color(energyParams.darkColor)),
        intensity: uniform(energyParams.intensity),
        parabolStrength: uniform(energyParams.parabolStrength),
        parabolOffset: uniform(energyParams.parabolOffset),
        parabolAmplitude: uniform(energyParams.parabolAmplitude),
        turbulenceStr: uniform(energyParams.turbulenceStr),
        turbulenceFreq: uniform(energyParams.turbulenceFreq),
        turbulenceAngle: uniform(energyParams.turbulenceAngle),
        noiseScaleX: uniform(energyParams.noiseScaleX),
        noiseScaleY: uniform(energyParams.noiseScaleY),
        noiseSpeed: uniform(energyParams.noiseSpeed),
        noiseSkew: uniform(energyParams.noiseSkew),
        noise2ScaleX: uniform(energyParams.noise2ScaleX),
        noise2ScaleY: uniform(energyParams.noise2ScaleY),
        noise2Speed: uniform(energyParams.noise2Speed),
        alphaWidth: uniform(energyParams.alphaWidth),
        topFade: uniform(energyParams.topFade),
        bottomFade: uniform(energyParams.bottomFade),
        darkAlphaWidth: uniform(energyParams.darkAlphaWidth),
      };

      /* ── Blade Slash geometry ───────────────────────────────── */
      function createSlashGeometry() {
        const sides = 25, height = 0.66;
        const rings = [
          { y: 0.0, rx: 0.5, rz: 0.5 }, { y: 0.2, rx: 1.0, rz: 1.0 },
          { y: 0.5, rx: 1.5, rz: 1.5 }, { y: 0.8, rx: 1.0, rz: 1.0 },
          { y: 1.0, rx: 0.5, rz: 0.5 },
        ];
        const positions = [], uvs = [], indices = [], rv = sides + 1;
        for (const { y, rx, rz } of rings) {
          const py = -height * 0.5 + height * y;
          for (let s = 0; s <= sides; s++) {
            const t = s / sides, a = t * Math.PI * 2;
            positions.push(Math.cos(a) * rx, py, Math.sin(a) * rz);
            uvs.push(t, y);
          }
        }
        for (let l = 0; l < 4; l++) {
          const c0 = l * rv, c1 = (l + 1) * rv;
          for (let s = 0; s < sides; s++) {
            const a = c0 + s, b = a + 1, cc = c1 + s, d = cc + 1;
            indices.push(a, b, cc, b, d, cc);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      /* ── Energy: displaced cylinder function ────────────────── */
      const twistedCylinder = Fn(([pos, pStr, pOff, pAmp, timeNode, turbStr, turbFreq, turbAngle]) => {
        const angle = atan(pos.z, pos.x).toVar();
        const elevation = pos.y;
        const radius = pStr.mul(pos.y.sub(pOff)).pow(2).add(pAmp).toVar();
        radius.addAssign(sin(elevation.sub(timeNode).mul(turbFreq).add(angle.mul(turbAngle))).mul(turbStr));
        return vec3(cos(angle).mul(radius), elevation, sin(angle).mul(radius));
      });

      /* ── Energy: skewed UV helper ───────────────────────────── */
      const toSkewedUv = Fn(([uvNode, skew]) => {
        return vec2(uvNode.x.add(uvNode.y.mul(skew.x)), uvNode.y.add(uvNode.x.mul(skew.y)));
      });

      async function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0f);
        camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(3, 2, 3);

        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("viewport").appendChild(renderer.domElement);
        await renderer.init();

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(4, 7, 4);
        scene.add(key, new THREE.AmbientLight(0xffffff, 0.2));

        /* ── Effect 1: Blade Slash ────────────────────────────── */
        const slashMat = new THREE.MeshBasicNodeMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
        });
        slashMat.outputNode = Fn(() => {
          const uvNode = uv(); const centered = uvNode.sub(0.5).toVar();
          const radial = centered.length();
          const angle = centered.y.atan(centered.x);
          const angle01 = angle.add(Math.PI).div(Math.PI * 2);
          const t = u.time.mul(su.radialNoiseSpeed);
          const dir = vec2(cos(angle), sin(angle));
          const nUv = dir.mul(radial).mul(vec2(su.radialNoiseScale, su.radialNoiseScale))
            .add(vec2(t, t.negate())).toVar();
          const warpX = valueNoise2D(nUv).sub(0.5).mul(su.radialNoiseWarp);
          const warpY = valueNoise2D(nUv.add(vec2(17.3, 9.1))).sub(0.5).mul(su.radialNoiseWarp);
          const n = valueNoise2D(nUv.add(vec2(warpX, warpY)));
          const noisyR = radial.add(n.sub(0.5).mul(0.12));
          const ringMask = smoothstep(su.ringWidth, su.ringWidth.sub(su.ringSoftness.mul(0.5)), abs(noisyR.sub(su.ringCenter)));
          const streak = sin(angle01.mul(su.streakFreq).add(t.mul(2.4))).mul(0.5).add(0.5);
          const streakMask = streak.mul(su.streakStrength).add(float(1).sub(su.streakStrength));
          const core = ringMask.mul(streakMask).toVar();
          const edge = smoothstep(su.edgeThreshold, su.edgeThreshold.add(float(0.08)), core);
          const outColor = su.baseColor.mul(0.12).add(su.slashColor.mul(core.mul(su.slashIntensity)))
            .add(su.edgeColor.mul(edge.mul(su.slashIntensity).mul(0.8)));
          return vec4(outColor, max(core, edge.mul(0.7)).mul(su.alphaStrength).clamp(0, 1));
        })();
        slashMesh = new THREE.Mesh(createSlashGeometry(), slashMat);
        slashMesh.scale.y = slashParams.yScale;
        scene.add(slashMesh);

        /* ── Effect 2: Stylized Energy (displaced cylinder) ───── */
        const cylGeo = new THREE.CylinderGeometry(1, 1, 1, energyParams.segments, energyParams.segments, true);
        cylGeo.translate(0, 0.5, 0);

        const energyMat = new THREE.MeshBasicNodeMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
        });
        const energyTimeU = uniform(energyParams.timeScale);
        energyMat.positionNode = twistedCylinder(
          positionLocal, eu.parabolStrength, eu.parabolOffset,
          eu.parabolAmplitude, u.time.mul(energyTimeU),
          eu.turbulenceStr, eu.turbulenceFreq, eu.turbulenceAngle,
        );
        energyMat.outputNode = Fn(() => {
          const st = u.time.mul(energyTimeU);
          const n1Uv = uv().add(vec2(st.mul(eu.noiseSpeed), st.negate().mul(eu.noiseSpeed))).toVar();
          n1Uv.assign(toSkewedUv(n1Uv, vec2(eu.noiseSkew, float(0))));
          n1Uv.mulAssign(vec2(eu.noiseScaleX, eu.noiseScaleY));
          const n1 = valueNoise2D(n1Uv.mul(8.0));
          const n2Uv = uv().add(vec2(st.mul(eu.noise2Speed), st.negate().mul(eu.noise2Speed))).toVar();
          n2Uv.assign(toSkewedUv(n2Uv, vec2(eu.noiseSkew, float(0))));
          n2Uv.mulAssign(vec2(eu.noise2ScaleX, eu.noise2ScaleY));
          const n2 = valueNoise2D(n2Uv.mul(8.0));
          const outerFade = min(uv().y.smoothstep(0, eu.bottomFade), uv().y.oneMinus().smoothstep(0, eu.topFade));
          const effect = n1.mul(n2).mul(outerFade);
          const col = eu.energyColor.mul(eu.intensity).add(eu.coreColor.mul(effect.mul(effect).mul(eu.intensity).mul(0.5)));
          return vec4(col, effect.smoothstep(0, eu.alphaWidth));
        })();

        energyMesh = new THREE.Mesh(cylGeo, energyMat);
        energyMesh.scale.y = energyParams.height;
        energyMesh.visible = false;
        scene.add(energyMesh);

        const darkMat = new THREE.MeshBasicNodeMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide,
        });
        darkMat.positionNode = twistedCylinder(
          positionLocal, eu.parabolStrength, eu.parabolOffset,
          eu.parabolAmplitude, u.time.mul(energyTimeU),
          eu.turbulenceStr, eu.turbulenceFreq, eu.turbulenceAngle,
        );
        darkMat.outputNode = Fn(() => {
          const st = u.time.mul(energyTimeU).add(123.4);
          const n1Uv = uv().add(vec2(st.mul(eu.noiseSpeed), st.negate().mul(eu.noiseSpeed))).toVar();
          n1Uv.assign(toSkewedUv(n1Uv, vec2(eu.noiseSkew, float(0))));
          n1Uv.mulAssign(vec2(eu.noiseScaleX.mul(1.5), eu.noiseScaleY.mul(0.8)));
          const n1 = valueNoise2D(n1Uv.mul(8.0));
          const n2Uv = uv().add(vec2(st.mul(eu.noise2Speed).mul(0.7), st.negate().mul(eu.noise2Speed))).toVar();
          n2Uv.assign(toSkewedUv(n2Uv, vec2(eu.noiseSkew, float(0))));
          n2Uv.mulAssign(vec2(eu.noise2ScaleX, eu.noise2ScaleY));
          const n2 = valueNoise2D(n2Uv.mul(8.0));
          const outerFade = min(uv().y.smoothstep(0, eu.bottomFade), uv().y.oneMinus().smoothstep(0, eu.topFade));
          const effect = n1.mul(n2).mul(outerFade);
          return vec4(eu.darkColor, effect.smoothstep(0, eu.darkAlphaWidth));
        })();

        const darkCylGeo = new THREE.CylinderGeometry(1, 1, 1, energyParams.segments, energyParams.segments, true);
        darkCylGeo.translate(0, 0.5, 0);
        energyDarkMesh = new THREE.Mesh(darkCylGeo, darkMat);
        energyDarkMesh.scale.y = energyParams.height;
        energyDarkMesh.scale.x = energyDarkMesh.scale.z = energyParams.darkScale;
        energyDarkMesh.visible = false;
        scene.add(energyDarkMesh);

        // Store timeScale uniform ref for live update
        energyMesh.userData.timeScaleU = energyTimeU;

        /* ── Post-processing ──────────────────────────────────── */
        renderPipeline = new THREE.RenderPipeline(renderer);
        const scenePass = pass(scene, camera);
        const sceneColor = scenePass.getTextureNode ? scenePass.getTextureNode("output") : scenePass;
        bloomPass = bloom(sceneColor, params.bloomStrength, params.bloomRadius, params.bloomThreshold);
        renderPipeline.outputNode = sceneColor.add(bloomPass);
        await renderer.compileAsync(scene, camera);

        buildUI();
        syncAll();
        switchEffect(params.effect);

        const timer = new THREE.Timer();
        function animate() {
          requestAnimationFrame(animate);
          timer.update();
          u.time.value += timer.getDelta();
          if (params.autoRotate) {
            if (slashMesh.visible) slashMesh.rotation.y += timer.getDelta() * params.autoRotateSpeed;
            if (energyMesh.visible) { energyMesh.rotation.y += timer.getDelta() * params.autoRotateSpeed * 0.5; energyDarkMesh.rotation.y = energyMesh.rotation.y; }
          }
          controls.update();
          renderPipeline.render();
        }
        animate();
        window.addEventListener("resize", onResize);
      }

      /* ── Effect switching ───────────────────────────────────── */
      function switchEffect(name) {
        currentEffect = name;
        slashMesh.visible = name === "bladeSlash";
        energyMesh.visible = name === "energyFX";
        energyDarkMesh.visible = name === "energyFX";
      }

      /* ── Sync all uniforms from params ──────────────────────── */
      function syncAll() {
        su.baseColor.value.set(slashParams.baseColor);
        su.slashColor.value.set(slashParams.slashColor);
        su.edgeColor.value.set(slashParams.edgeColor);
        su.slashIntensity.value = slashParams.slashIntensity;
        su.alphaStrength.value = slashParams.alphaStrength;
        su.ringSoftness.value = slashParams.ringSoftness;
        su.ringCenter.value = slashParams.ringCenter;
        su.ringWidth.value = slashParams.ringWidth;
        su.radialNoiseScale.value = slashParams.radialNoiseScale;
        su.radialNoiseWarp.value = slashParams.radialNoiseWarp;
        su.radialNoiseSpeed.value = slashParams.radialNoiseSpeed;
        su.streakFreq.value = slashParams.streakFreq;
        su.streakStrength.value = slashParams.streakStrength;
        su.edgeThreshold.value = slashParams.edgeThreshold;
        su.edgeSharpness.value = slashParams.edgeSharpness;
        if (slashMesh) slashMesh.scale.y = slashParams.yScale;

        eu.energyColor.value.set(energyParams.energyColor);
        eu.coreColor.value.set(energyParams.coreColor);
        eu.darkColor.value.set(energyParams.darkColor);
        eu.intensity.value = energyParams.intensity;
        eu.parabolStrength.value = energyParams.parabolStrength;
        eu.parabolOffset.value = energyParams.parabolOffset;
        eu.parabolAmplitude.value = energyParams.parabolAmplitude;
        eu.turbulenceStr.value = energyParams.turbulenceStr;
        eu.turbulenceFreq.value = energyParams.turbulenceFreq;
        eu.turbulenceAngle.value = energyParams.turbulenceAngle;
        eu.noiseScaleX.value = energyParams.noiseScaleX;
        eu.noiseScaleY.value = energyParams.noiseScaleY;
        eu.noiseSpeed.value = energyParams.noiseSpeed;
        eu.noiseSkew.value = energyParams.noiseSkew;
        eu.noise2ScaleX.value = energyParams.noise2ScaleX;
        eu.noise2ScaleY.value = energyParams.noise2ScaleY;
        eu.noise2Speed.value = energyParams.noise2Speed;
        eu.alphaWidth.value = energyParams.alphaWidth;
        eu.topFade.value = energyParams.topFade;
        eu.bottomFade.value = energyParams.bottomFade;
        eu.darkAlphaWidth.value = energyParams.darkAlphaWidth;
        if (energyMesh) {
          energyMesh.scale.y = energyParams.height;
          energyDarkMesh.scale.y = energyParams.height;
          energyDarkMesh.scale.x = energyDarkMesh.scale.z = energyParams.darkScale;
          energyMesh.userData.timeScaleU.value = energyParams.timeScale;
        }

        if (bloomPass) {
          bloomPass.strength.value = params.bloomStrength;
          bloomPass.radius.value = params.bloomRadius;
          bloomPass.threshold.value = params.bloomThreshold;
        }
      }

      function buildUI() {
        pane = new Pane({ container: document.getElementById("ui"), title: "VFX FX Editor" });
        const sync = () => syncAll();

        pane.addBinding(params, "effect", {
          options: { "Blade Slash": "bladeSlash", "Energy FX": "energyFX" },
          label: "Effect",
        }).on("change", (ev) => { switchEffect(ev.value); });

        const fAnim = pane.addFolder({ title: "Animation" });
        fAnim.addBinding(params, "autoRotate").on("change", sync);
        fAnim.addBinding(params, "autoRotateSpeed", { min: -4, max: 4, step: 0.01 }).on("change", sync);

        /* ── Blade Slash controls ─────────────────────────────── */
        const fSlash = pane.addFolder({ title: "Blade Slash", expanded: true });
        fSlash.addBinding(slashParams, "yScale", { min: 0.05, max: 1.2, step: 0.01 }).on("change", sync);
        fSlash.addBinding(slashParams, "baseColor").on("change", sync);
        fSlash.addBinding(slashParams, "slashColor").on("change", sync);
        fSlash.addBinding(slashParams, "edgeColor").on("change", sync);
        fSlash.addBinding(slashParams, "slashIntensity", { min: 0, max: 12, step: 0.01 }).on("change", sync);
        fSlash.addBinding(slashParams, "alphaStrength", { min: 0, max: 1.5, step: 0.01 }).on("change", sync);
        fSlash.addBinding(slashParams, "ringCenter", { min: 0.1, max: 1.1, step: 0.001 }).on("change", sync);
        fSlash.addBinding(slashParams, "ringWidth", { min: 0.02, max: 0.7, step: 0.001 }).on("change", sync);
        fSlash.addBinding(slashParams, "ringSoftness", { min: 0.01, max: 0.5, step: 0.001 }).on("change", sync);
        fSlash.addBinding(slashParams, "radialNoiseScale", { min: 1, max: 40, step: 0.1 }).on("change", sync);
        fSlash.addBinding(slashParams, "radialNoiseWarp", { min: 0, max: 5, step: 0.01 }).on("change", sync);
        fSlash.addBinding(slashParams, "radialNoiseSpeed", { min: -5, max: 5, step: 0.01 }).on("change", sync);
        fSlash.addBinding(slashParams, "streakFreq", { min: 1, max: 64, step: 0.1 }).on("change", sync);
        fSlash.addBinding(slashParams, "streakStrength", { min: 0, max: 1, step: 0.01 }).on("change", sync);
        fSlash.addBinding(slashParams, "edgeThreshold", { min: 0, max: 1, step: 0.001 }).on("change", sync);
        fSlash.addBinding(slashParams, "edgeSharpness", { min: 0.001, max: 0.35, step: 0.001 }).on("change", sync);

        /* ── Energy FX controls ───────────────────────────────── */
        const fEnergy = pane.addFolder({ title: "Energy FX", expanded: true });
        const fEColor = fEnergy.addFolder({ title: "Colors", expanded: true });
        fEColor.addBinding(energyParams, "energyColor", { label: "energy" }).on("change", sync);
        fEColor.addBinding(energyParams, "coreColor", { label: "core" }).on("change", sync);
        fEColor.addBinding(energyParams, "darkColor", { label: "dark" }).on("change", sync);
        fEColor.addBinding(energyParams, "intensity", { min: 0, max: 15, step: 0.1 }).on("change", sync);
        const fEShape = fEnergy.addFolder({ title: "Shape", expanded: true });
        fEShape.addBinding(energyParams, "height", { min: 0.5, max: 6, step: 0.1 }).on("change", sync);
        fEShape.addBinding(energyParams, "timeScale", { min: -3, max: 3, step: 0.01 }).on("change", sync);
        fEShape.addBinding(energyParams, "parabolStrength", { min: 0, max: 3, step: 0.01, label: "parabol str" }).on("change", sync);
        fEShape.addBinding(energyParams, "parabolOffset", { min: -1, max: 2, step: 0.01, label: "parabol off" }).on("change", sync);
        fEShape.addBinding(energyParams, "parabolAmplitude", { min: 0, max: 2, step: 0.01, label: "parabol amp" }).on("change", sync);
        fEShape.addBinding(energyParams, "turbulenceStr", { min: 0, max: 1, step: 0.01, label: "turb str" }).on("change", sync);
        fEShape.addBinding(energyParams, "turbulenceFreq", { min: 0, max: 20, step: 0.1, label: "turb freq" }).on("change", sync);
        fEShape.addBinding(energyParams, "turbulenceAngle", { min: 0, max: 8, step: 0.1, label: "turb angle" }).on("change", sync);
        fEShape.addBinding(energyParams, "darkScale", { min: 0.8, max: 1.5, step: 0.01, label: "dark scale" }).on("change", sync);
        const fENoise = fEnergy.addFolder({ title: "Noise", expanded: false });
        fENoise.addBinding(energyParams, "noiseScaleX", { min: 0.5, max: 12, step: 0.1 }).on("change", sync);
        fENoise.addBinding(energyParams, "noiseScaleY", { min: 0.1, max: 4, step: 0.1 }).on("change", sync);
        fENoise.addBinding(energyParams, "noiseSpeed", { min: -3, max: 3, step: 0.01 }).on("change", sync);
        fENoise.addBinding(energyParams, "noiseSkew", { min: -3, max: 3, step: 0.01 }).on("change", sync);
        fENoise.addBinding(energyParams, "noise2ScaleX", { min: 0.5, max: 12, step: 0.1 }).on("change", sync);
        fENoise.addBinding(energyParams, "noise2ScaleY", { min: 0.1, max: 4, step: 0.1 }).on("change", sync);
        fENoise.addBinding(energyParams, "noise2Speed", { min: -3, max: 3, step: 0.01 }).on("change", sync);
        const fEAlpha = fEnergy.addFolder({ title: "Alpha / Fade", expanded: false });
        fEAlpha.addBinding(energyParams, "alphaWidth", { min: 0.01, max: 1, step: 0.01 }).on("change", sync);
        fEAlpha.addBinding(energyParams, "topFade", { min: 0.01, max: 1, step: 0.01 }).on("change", sync);
        fEAlpha.addBinding(energyParams, "bottomFade", { min: 0.01, max: 1, step: 0.01 }).on("change", sync);
        fEAlpha.addBinding(energyParams, "darkAlphaWidth", { min: 0.01, max: 1, step: 0.01 }).on("change", sync);

        /* ── Bloom ────────────────────────────────────────────── */
        const fPost = pane.addFolder({ title: "Bloom" });
        fPost.addBinding(params, "bloomStrength", { min: 0, max: 8, step: 0.01 }).on("change", sync);
        fPost.addBinding(params, "bloomRadius", { min: 0, max: 1, step: 0.01 }).on("change", sync);
        fPost.addBinding(params, "bloomThreshold", { min: 0, max: 2, step: 0.01 }).on("change", sync);
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      init().catch(console.error);
    </script>
  </body>
</html>
