                  );
                  /**
                   * Match wall-mode running bond: one opening center + fixed eps.
                   * The older per-opening eps + OR logic could mis-classify jambs on
                   * ±X faces (rotated bricks) and split shifts (gap one side, clip other).
                   */
                  const eps = Math.max(1e-3, nomW * 0.025);
                  const op0 = opsFace[0];
                  let openHJ = 0;
                  let gxJ = 0;
                  if (op0) {
                    const rpJ = ringParamsFromOpening(op0);
                    openHJ = wallOpeningHalfX(
                      yMid,
                      rpJ.ringRadius,
                      op0.sillY,
                      rpJ.springY,
                      seam,
                      rpJ.archShape,
                      rpJ.archPointedness,
                    );
                    gxJ =
                      typeof op0.uArc === "number" && !Number.isNaN(op0.uArc)
                        ? op0.uArc
                        : op0.uCenter;
                  }
                  const rightOfOpening =
                    openHJ > 1e-5 && segLo >= gxJ + openHJ - eps;
                  const leftOfOpening =
                    openHJ > 1e-5 && segHi <= gxJ - openHJ + eps;
                  if (rightOfOpening) innerHi -= shift;
                  else if (leftOfOpening) innerLo += shift;
                  else innerLo += shift;
                }

                const innerLen = innerHi - innerLo;
                if (innerLen < minW * 0.72) continue;

                let nBricks = Math.max(
                  1,
                  Math.round(innerLen / (nomWCurve + j)),
                );
                let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                for (let it = 0; it < 96; it++) {
                  wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                  if (wEq < minW * 0.998) {
                    if (nBricks <= 1) break;
                    nBricks--;
                  } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                    nBricks++;
                  } else break;
                }
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.88) continue;

                for (let bi = 0; bi < nBricks; bi++) {
                  if (k >= params.maxWallBricks) break outer;
                  const u = innerLo + wEq * 0.5 + bi * (wEq + j);
                  if (u > innerHi - wEq * 0.5 + 1e-4) break;

                  let tuckY = 0;
                  for (const op of opsFace) {
                    const rp = ringParamsFromOpening(op);
                    const R_out = rp.ringRadius;
                    const openH = wallOpeningHalfX(
                      yMid,
                      R_out,
                      op.sillY,
                      rp.springY,
                      seam,
                      rp.archShape,
                      rp.archPointedness,
                    );
                    if (openH <= 1e-4) continue;
                    const curv = wallOpeningCurvature(
                      yMid,
                      R_out,
                      op.sillY,
                      rp.springY,
                      seam,
                      rp.archShape,
                      rp.archPointedness,
                    );
                    const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
                    if (curveT <= 0.04) continue;
                    const uRef =
                      typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                        ? op.uArc
                        : op.uCenter;
                    const gap = Math.max(0, Math.abs(u - uRef) - openH);
                    const band = params.brickW * 3.8;
                    if (gap < band) {
                      const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                      const ty =
                        -nomH *
                        0.12 *
                        Math.pow(t, 1.2) *
                        Math.pow(curveT, 0.55);
                      tuckY = Math.min(tuckY, ty);
                    }
                  }

                  const sx = wEq / nomW;
                  const yMerl = isBatRow ? params.towerMerlonLift * 0.45 : 0;
                  const syBase = (0.91 + rnd() * 0.06) * crownSy;
                  const sy = isBatRow
                    ? syBase *
                      (1 + params.towerMerlonLift / Math.max(0.12, nomH))
                    : syBase;
                  const sz = 0.92 + rnd() * 0.06;
                  if (
                    !placeTowerBrick(face, u, yMid + tuckY + yMerl, sx, sy, sz)
                  )
                    break outer;
                }
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        /**
         * Square footprint like the flat tower shell, with triangular gables on two opposite faces
         * and a pitched roof of instanced bricks (ridge parallel to the long eaves).
         */
        function buildHouseShellInstances() {
          if (!brickGeo) return;

          const halfT = params.towerHalfWidth;
          const wallBase = params.towerAnchorY;
          const eaveY =
            wallBase +
            Math.max(params.brickH * 2, params.towerHeight) -
            Math.max(0, Number(params.houseEaveLowerY) || 0);
          const kRise =
            Math.max(0.12, Number(params.houseGableRise) || 0) +
            (Number(params.houseRidgeLiftY) || 0);
          const ridgeY = eaveY + kRise;
          const gableAxis = Math.floor(Number(params.houseGableAxis) || 0) & 1;
          const isGableFace = (face) =>
            gableAxis === 0
              ? face === 0 || face === 1
              : face === 2 || face === 3;

          const run =
            halfT + Math.max(0, Number(params.houseRoofOverhang) || 0);
          const zOv = Math.max(0, Number(params.houseRoofZOverhang) || 0);
          const riseSpan = Math.max(1e-3, ridgeY - eaveY);

          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const ny = Math.min(
            300,
            Math.max(3, Math.ceil((ridgeY + nomH * 0.55 - baseY) / rowH)),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, 0);

          const rnd = mulberry32((params.colorSeed ^ 0x91a2bc7d) | 0);
          let k = 0;
          const inset = towerFaceInsetD();

          const buildHouseTimberFrame = () => {
            ensureTimberMaterial();
            const beamR = THREE.MathUtils.clamp(
              Number(params.houseTimberRadius) || 0.09,
              0.034,
              0.22,
            );
            const spacing = Math.max(
              0.26,
              Number(params.houseTimberRafterSpacing) || 0.52,
            );
            const yPlate = eaveY + nomH * 0.16;
            const xExt = halfT + zOv;
            const zExt = halfT + zOv;
            const plateRad = 1.1;

            const place = (mesh, ki, ax, ay, az, bx, by, bz, radMul) => {
              _dTmp.set(ax, ay, az);
              _dTmp2.set(bx, by, bz);
              _wmPos.copy(_dTmp).add(_dTmp2).multiplyScalar(0.5);
              _wmPos2.copy(_dTmp2).sub(_dTmp);
              const L = Math.max(1e-5, _wmPos2.length());
              _wmPos2.multiplyScalar(1 / L);
              tmpO.position.copy(_wmPos);
              const r = beamR * radMul;
              tmpO.scale.set(r, L, r);
              tmpO.quaternion.setFromUnitVectors(_yAxis, _wmPos2);
              tmpO.updateMatrix();
              mesh.setMatrixAt(ki, tmpO.matrix);
              return ki + 1;
            };

            const nRidgeSt =
              gableAxis === 0
                ? Math.max(3, Math.ceil((2 * xExt) / spacing) + 1)
                : Math.max(3, Math.ceil((2 * zExt) / spacing) + 1);
            const cap = Math.min(640, Math.max(40, 3 + 2 * nRidgeSt * 2 + 8));
            const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 10, 1, false);
            const mesh = new THREE.InstancedMesh(cylGeo, timberMat, cap);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            let tk = 0;
            if (gableAxis === 0) {
              tk = place(mesh, tk, -xExt, ridgeY, 0, xExt, ridgeY, 0, 1);
              tk = place(
                mesh,
                tk,
                -xExt,
                yPlate,
                halfT,
                xExt,
                yPlate,
                halfT,
                plateRad,
              );
              tk = place(
                mesh,
                tk,
                -xExt,
                yPlate,
                -halfT,
                xExt,
                yPlate,
                -halfT,
                plateRad,
              );
              const nR = Math.max(3, Math.ceil((2 * xExt) / spacing) + 1);
              for (let i = 0; i < nR; i++) {
                const u = nR <= 1 ? 0.5 : i / (nR - 1);
                const xi = -xExt + u * (2 * xExt);
                tk = place(mesh, tk, xi, yPlate, halfT, xi, ridgeY, 0, 1);
                tk = place(mesh, tk, xi, yPlate, -halfT, xi, ridgeY, 0, 1);
              }
            } else {
              tk = place(mesh, tk, 0, ridgeY, -zExt, 0, ridgeY, zExt, 1);
              tk = place(
                mesh,
                tk,
                halfT,
                yPlate,
                -zExt,
                halfT,
                yPlate,
                zExt,
                plateRad,
              );
              tk = place(
                mesh,
                tk,
                -halfT,
                yPlate,
                -zExt,
                -halfT,
                yPlate,
                zExt,
                plateRad,
              );
              const nR = Math.max(3, Math.ceil((2 * zExt) / spacing) + 1);
              for (let j = 0; j < nR; j++) {
                const u = nR <= 1 ? 0.5 : j / (nR - 1);
                const zi = -zExt + u * (2 * zExt);
                tk = place(mesh, tk, halfT, yPlate, zi, 0, ridgeY, zi, 1);
                tk = place(mesh, tk, -halfT, yPlate, zi, 0, ridgeY, zi, 1);
              }
            }
            mesh.count = tk;
            mesh.instanceMatrix.needsUpdate = true;
            scene.add(mesh);
            houseTimberMeshes.push(mesh);
          };

          const placeTowerBrick = (face, u, y, sx, sy, sz) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            let bx;
            let by;
            let bz;
            if (face === 0) {
              bx = halfT - inset;
              by = y;
              bz = u;
              tmpO.rotation.set(0, -Math.PI / 2, 0);
            } else if (face === 1) {
              bx = -halfT + inset;
              by = y;
              bz = u;
              tmpO.rotation.set(0, Math.PI / 2, 0);
            } else if (face === 2) {
              bx = u;
              by = y;
              bz = halfT - inset;
              tmpO.rotation.set(0, 0, 0);
            } else {
              bx = u;
              by = y;
              bz = -halfT + inset;
              tmpO.rotation.set(0, Math.PI, 0);
            }
            tmpO.position.set(bx, by, bz);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, false);
            applyBrickPlacementNoise(tmpO, rnd, false);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          for (let face = 0; face < 4; face++) {
            const opsFace = getTowerOpeningsList().filter(
              (o) => o.face === face,
            );
            outer: for (let iy = 0; iy < ny; iy++) {
              const yMid = baseY + iy * rowH;
              if (yMid > ridgeY - nomH * 0.12) break;

              if (!isGableFace(face) && yMid > eaveY - nomH * 0.2) break;

              const rawIntervals = [[-halfT, halfT]];
              let intervals = subtractHolesFromIntervals(
                rawIntervals,
                opsFace,
                yMid,
                seam,
              );

              if (isGableFace(face) && yMid > eaveY - rowH * 0.02) {
                const uCap = THREE.MathUtils.clamp(
                  (halfT * (ridgeY - yMid)) / riseSpan,
                  0,
                  halfT,
                );
                if (uCap < nomW * params.wallMinBrickScale * 0.35) continue;
                const clipped = [];
                for (const [a0, b0] of intervals) {
                  const lo = Math.max(a0, -uCap + 1e-4);
                  const hi = Math.min(b0, uCap - 1e-4);
                  if (hi - lo > nomW * params.wallMinBrickScale * 0.42) {
                    clipped.push([lo, hi]);
                  }
                }
                intervals = clipped;
                if (!intervals.length) continue;
              }

              let maxCurveT = 0;
              for (const op of opsFace) {
                const rp = ringParamsFromOpening(op);
                const R_out = rp.ringRadius;
                const ohC = wallOpeningHalfX(
                  yMid,
                  R_out,
                  op.sillY,
                  rp.springY,
                  seam,
                  rp.archShape,
                  rp.archPointedness,
                );
                if (ohC <= 1e-5) continue;
                const c = wallOpeningCurvature(
                  yMid,
                  R_out,
                  op.sillY,
                  rp.springY,
                  seam,
                  rp.archShape,
                  rp.archPointedness,
                );
                maxCurveT = Math.max(
                  maxCurveT,
                  THREE.MathUtils.smoothstep(0.06, 1.15, c),
                );
              }
              const nomWCurve =
                nomW *
                THREE.MathUtils.lerp(
                  1,
                  THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                  Math.pow(maxCurveT, 1.08),
                );

              const haunch = THREE.MathUtils.smoothstep(
                wallBase + params.towerHeight * 0.12,
                eaveY - nomH * 0.35,
                yMid,
              );
              const crownSy =
                1 -
                (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                  Math.pow(haunch, 1.28);

              for (const [segLo, segHi] of intervals) {
                const span = segHi - segLo;
                if (span < nomW * params.wallMinBrickScale * 0.45) continue;

                const minW = nomW * params.wallMinBrickScale;
                const jMin = 0.0035;
                const jMax = Math.min(
                  mortar,
                  Math.max(jMin, span * 0.014 + jMin * 0.6),
                );
                const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
                const hj = j * 0.5;
                let innerLo = segLo + hj;
                let innerHi = segHi - hj;
                if (iy % 2 === 1) {
                  const shift = Math.min(
                    (nomWCurve + j) * 0.48,
                    Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
                  );
                  const eps = Math.max(1e-3, nomW * 0.025);
                  const op0 = opsFace[0];
                  let openHJ = 0;
                  let gxJ = 0;
                  if (op0) {
                    const rpJ = ringParamsFromOpening(op0);
                    openHJ = wallOpeningHalfX(
                      yMid,
                      rpJ.ringRadius,
                      op0.sillY,
                      rpJ.springY,
                      seam,
                      rpJ.archShape,
                      rpJ.archPointedness,
                    );
                    gxJ =
                      typeof op0.uArc === "number" && !Number.isNaN(op0.uArc)
                        ? op0.uArc
                        : op0.uCenter;
                  }
                  const rightOfOpening =
                    openHJ > 1e-5 && segLo >= gxJ + openHJ - eps;
                  const leftOfOpening =
                    openHJ > 1e-5 && segHi <= gxJ - openHJ + eps;
                  if (rightOfOpening) innerHi -= shift;
                  else if (leftOfOpening) innerLo += shift;
                  else innerLo += shift;
                }

                const innerLen = innerHi - innerLo;
                if (innerLen < minW * 0.72) continue;

                let nBricks = Math.max(
                  1,
                  Math.round(innerLen / (nomWCurve + j)),
                );
                let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                for (let it = 0; it < 96; it++) {
                  wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                  if (wEq < minW * 0.998) {
                    if (nBricks <= 1) break;
                    nBricks--;
                  } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                    nBricks++;
                  } else break;
                }
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.88) continue;

                for (let bi = 0; bi < nBricks; bi++) {
                  if (k >= params.maxWallBricks) break outer;
                  const u = innerLo + wEq * 0.5 + bi * (wEq + j);
                  if (u > innerHi - wEq * 0.5 + 1e-4) break;

                  let tuckY = 0;
                  for (const op of opsFace) {
                    const rp = ringParamsFromOpening(op);
                    const R_out = rp.ringRadius;
                    const openH = wallOpeningHalfX(
                      yMid,
                      R_out,
                      op.sillY,
                      rp.springY,
                      seam,
                      rp.archShape,
                      rp.archPointedness,
                    );
                    if (openH <= 1e-4) continue;
                    const curv = wallOpeningCurvature(
                      yMid,
                      R_out,
                      op.sillY,
                      rp.springY,
                      seam,
                      rp.archShape,
                      rp.archPointedness,
                    );
                    const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
                    if (curveT <= 0.04) continue;
                    const uRef =
                      typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                        ? op.uArc
                        : op.uCenter;
                    const gap = Math.max(0, Math.abs(u - uRef) - openH);
                    const band = params.brickW * 3.8;
                    if (gap < band) {
                      const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                      const ty =
                        -nomH *
                        0.12 *
                        Math.pow(t, 1.2) *
                        Math.pow(curveT, 0.55);
                      tuckY = Math.min(tuckY, ty);
                    }
                  }

                  const sx = wEq / nomW;
                  const syBase = (0.91 + rnd() * 0.06) * crownSy;
                  const sy = syBase;
                  const sz = 0.92 + rnd() * 0.06;
                  if (!placeTowerBrick(face, u, yMid + tuckY, sx, sy, sz)) {
                    break outer;
                  }
                }
              }
            }
          }

          const hypoRun = Math.hypot(run, kRise);
          const cosP = run / Math.max(1e-6, hypoRun);
          const jRoof = THREE.MathUtils.clamp(mortar * 0.88, 0.0045, 0.012);
          const stepAlong = Math.max(nomW * 0.74 + jRoof, nomW * 0.38) * cosP;
          const dxRidge = nomW + jRoof;

          const placeRoofBrick = (wx, wy, wz, bx, by, bz) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(
              rnd,
              1,
              0.94 + rnd() * 0.05,
              0.94 + rnd() * 0.05,
              "wall",
            );
            /**
             * Match wall +Z face: local X = width, Y = height, Z = depth outward.
             * Ridge tangent = bx; course-up-slope = by; tile outward = bz = bx × by.
             */
            _tmpBasisBrick.makeBasis(bx, by, bz);
            _tmpDoorQuat.setFromRotationMatrix(_tmpBasisBrick);
            tmpO.position.set(wx, wy, wz);
            tmpO.quaternion.copy(_tmpDoorQuat);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, false);
            applyBrickPlacementNoise(tmpO, rnd, false);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          if (params.houseRoofEnabled) {
            if (params.houseRoofKind === "timber") {
              buildHouseTimberFrame();
            } else {
              roof: {
                /**
                 * Roof ridge must match gable ends: ±X gables → ridge parallel to X (apex to apex);
                 * ±Z gables → ridge parallel to Z. (Earlier build used the swapped pairing.)
                 */
                if (gableAxis === 0) {
                  const xMin = -halfT - zOv;
                  const xMax = halfT + zOv;
                  for (let side = -1; side <= 1; side += 2) {
                    const z0 = side < 0 ? -run + nomW * 0.12 : nomW * 0.1;
                    const z1 = side < 0 ? -nomW * 0.12 : run - nomW * 0.08;
                    for (
                      let rz = z0;
                      side < 0 ? rz < z1 : rz < z1;
                      rz += stepAlong
                    ) {
                      const t = side < 0 ? -rz / run : rz / run;
                      const y = eaveY + (1 - t) * kRise;
                      let row = 0;
                      for (let qx = xMin; qx < xMax + 1e-6; qx += dxRidge) {
                        const off =
                          (row +
                            (side < 0 ? 0 : 1) +
                            Math.floor((rz + run * 3) / stepAlong)) %
                          2;
                        row++;
                        const qx0 = qx + off * dxRidge * 0.5;
                        if (qx0 > xMax - nomW * 0.18) continue;
                        _doorBx.set(1, 0, 0);
                        if (side < 0) {
                          _doorBy.set(0, kRise, run).normalize();
                        } else {
                          _doorBy.set(0, kRise, -run).normalize();
                        }
                        _doorBz.crossVectors(_doorBx, _doorBy).normalize();
                        if (
                          !placeRoofBrick(qx0, y, rz, _doorBx, _doorBy, _doorBz)
                        ) {
                          break roof;
                        }
                      }
                    }
                  }
                } else {
                  const zMin = -halfT - zOv;
                  const zMax = halfT + zOv;
                  for (let side = -1; side <= 1; side += 2) {
                    const x0 = side < 0 ? -run + nomW * 0.12 : nomW * 0.1;
                    const x1 = side < 0 ? -nomW * 0.12 : run - nomW * 0.08;
                    for (
                      let rx = x0;
                      side < 0 ? rx < x1 : rx < x1;
                      rx += stepAlong
                    ) {
                      const t = side < 0 ? (rx + run) / run : (run - rx) / run;
                      const y = eaveY + t * kRise;
                      let row = 0;
                      for (let qz = zMin; qz < zMax + 1e-6; qz += dxRidge) {
                        const off =
                          (row +
                            (side < 0 ? 0 : 1) +
                            Math.floor((rx + run * 3) / stepAlong)) %
                          2;
                        row++;
                        const qz0 = qz + off * dxRidge * 0.5;
                        if (qz0 > zMax - nomW * 0.18) continue;
                        _doorBx.set(0, 0, 1);
                        if (side < 0) {
                          _doorBy.set(run, kRise, 0).normalize();
                        } else {
                          _doorBy.set(-run, kRise, 0).normalize();
                        }
                        _doorBz.crossVectors(_doorBx, _doorBy).normalize();
                        if (
                          !placeRoofBrick(rx, y, qz0, _doorBx, _doorBy, _doorBz)
                        ) {
                          break roof;
                        }
                      }
                    }
                  }
                }
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        /** Cylindrical tower shell: arc-length coordinate u = θ·R on [−πR, πR], one gate via `uArc`. */
        function buildTowerRoundShellInstances() {
          if (!brickGeo) return;

          const Rc = Math.max(0.35, params.towerHalfWidth);
          const devHalf = Math.PI * Rc;
          const wallBase = params.towerAnchorY;
          const topY =
            wallBase + Math.max(params.brickH * 2, params.towerHeight);
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const ny = Math.min(
            260,
            Math.max(3, Math.ceil((topY - baseY) / rowH)),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, 0);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;
          const inset = towerFaceInsetD();

          /**
           * Same convention as bricks-castle3.html: `lookAt(2x,y,2z)` then `rotateY(π/2)` so
           * local +X runs tangent, +Z points toward the tower axis (brick depth into the shell).
           * The old `makeBasis` path used +Z outward, which flipped depth/lighting vs flat tower faces.
           */
          const placeRoundBrick = (theta, y, sx, sy, sz, iyRow) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            const rCyl = Rc - inset;
            const rJ = (params.brickRadiusVariation || 0) * (rnd() - 0.5);
            const rUse = Math.max(0.06, rCyl + rJ);
            const px = Math.cos(theta) * rUse;
            const pz = Math.sin(theta) * rUse;
            const yExtra =
              (params.brickVerticalVariation || 0) * (rnd() - 0.5) * 0.75;
            const yJ =
              (iyRow > 0 ? y + (rnd() - 0.5) * rowH * 0.045 : y) + yExtra;
            tmpO.position.set(px, yJ, pz);
            tmpO.quaternion.identity();
            tmpO.lookAt(px * 2, yJ, pz * 2);
            tmpO.rotateY(Math.PI * 0.5);
            tmpO.rotateX((rnd() - 0.5) * 0.028);
            tmpO.rotateY((rnd() - 0.5) * 0.038);
            tmpO.rotateZ((rnd() - 0.5) * 0.028);
            const rvExtra = params.brickRotationVariation || 0;
            if (rvExtra > 0) {
              tmpO.rotateX((rnd() - 0.5) * rvExtra);
              tmpO.rotateY((rnd() - 0.5) * rvExtra);
              tmpO.rotateZ((rnd() - 0.5) * rvExtra);
            }
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, false);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          const battRows = params.towerBattlements
            ? THREE.MathUtils.clamp(
                Math.floor(params.towerBattlementCourses) || 2,
                1,
                4,
              )
            : 0;
          const battY0 = battRows > 0 ? topY - rowH * battRows : topY + 1e6;

          const opsR = getTowerOpeningsList();

          outerRound: for (let iy = 0; iy < ny; iy++) {
            const yMid = baseY + iy * rowH;
            if (yMid > topY - nomH * 0.2) break;

            const isBatRow =
              params.towerBattlements && yMid >= battY0 - rowH * 0.02;
            const rawIntervals = isBatRow
              ? merlonBaseIntervals(
                  devHalf,
                  params.towerMerlonW,
                  params.towerCrenelW,
                  0,
                  iy,
                )
              : [[-devHalf, devHalf]];
            const intervals = subtractHolesFromIntervals(
              rawIntervals,
              opsR,
              yMid,
              seam,
            );

            let maxCurveT = 0;
            for (const op of opsR) {
              const rp = ringParamsFromOpening(op);
              const R_out = rp.ringRadius;
              const ohC = wallOpeningHalfX(
                yMid,
                R_out,
                op.sillY,
                rp.springY,
                seam,
                rp.archShape,
                rp.archPointedness,
              );
              if (ohC <= 1e-5) continue;
              const c = wallOpeningCurvature(
                yMid,
                R_out,
                op.sillY,
                rp.springY,
                seam,
                rp.archShape,
                rp.archPointedness,
              );
              maxCurveT = Math.max(
                maxCurveT,
                THREE.MathUtils.smoothstep(0.06, 1.15, c),
              );
            }
            const nomWCurve =
              nomW *
              THREE.MathUtils.lerp(
                1,
                THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                Math.pow(maxCurveT, 1.08),
              );

            const haunch = THREE.MathUtils.smoothstep(
              wallBase + params.towerHeight * 0.12,
              topY - nomH * 0.35,
              yMid,
            );
            const crownSy =
              1 -
              (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                Math.pow(haunch, 1.28);

            for (const [segLo, segHi] of intervals) {
              const span = segHi - segLo;
              if (span < nomW * params.wallMinBrickScale * 0.45) continue;

              const minW = nomW * params.wallMinBrickScale;
              const jMin = 0.0035;
              const jMax = Math.min(
                mortar,
                Math.max(jMin, span * 0.014 + jMin * 0.6),
              );
              const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
              const hj = j * 0.5;
              let innerLo = segLo + hj;
              let innerHi = segHi - hj;

              const innerLen = innerHi - innerLo;
              if (innerLen < minW * 0.72) continue;

              let nBricks = Math.max(1, Math.round(innerLen / (nomWCurve + j)));
              let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              for (let it = 0; it < 96; it++) {
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.998) {
                  if (nBricks <= 1) break;
                  nBricks--;
                } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                  nBricks++;
                } else break;
              }
              wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              if (wEq < minW * 0.88) continue;

              const staggerU = iy % 2 === 1 ? (wEq + j) * 0.5 : 0;

              for (let bi = 0; bi < nBricks; bi++) {
                if (k >= params.maxWallBricks) break outerRound;
                const u = innerLo + wEq * 0.5 + bi * (wEq + j) + staggerU;
                if (u > innerHi - wEq * 0.25) break;

                const theta = u / Rc;
                let tuckY = 0;
                for (const op of opsR) {
                  const rp = ringParamsFromOpening(op);
                  const R_out = rp.ringRadius;
                  const openH = wallOpeningHalfX(
                    yMid,
                    R_out,
                    op.sillY,
                    rp.springY,
                    seam,
                    rp.archShape,
                    rp.archPointedness,
                  );
                  if (openH <= 1e-4) continue;
                  const curv = wallOpeningCurvature(
                    yMid,
                    R_out,
                    op.sillY,
                    rp.springY,
                    seam,
                    rp.archShape,
                    rp.archPointedness,
                  );
                  const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
                  if (curveT <= 0.04) continue;
                  const uRef =
                    typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                      ? op.uArc
                      : op.uCenter;
                  const gap = Math.max(0, Math.abs(u - uRef) - openH);
                  const band = params.brickW * 3.8;
                  if (gap < band) {
                    const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                    const ty =
                      -nomH * 0.12 * Math.pow(t, 1.2) * Math.pow(curveT, 0.55);
                    tuckY = Math.min(tuckY, ty);
                  }
                }

                const sx = wEq / nomW;
                const yMerl = isBatRow ? params.towerMerlonLift * 0.45 : 0;
                const syBase = (0.91 + rnd() * 0.06) * crownSy;
                const sy = isBatRow
                  ? syBase * (1 + params.towerMerlonLift / Math.max(0.12, nomH))
                  : syBase;
                const sz = 0.92 + rnd() * 0.06;
                if (
                  !placeRoundBrick(theta, yMid + tuckY + yMerl, sx, sy, sz, iy)
                )
                  break outerRound;
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        /**
         * Two wedge voussoirs at the pointed cusp: curved outer edge, vertical seam at x = 0.
         * @param {THREE.Matrix4 | null} ringWorld — flat tower face transform; null = identity (bridge local XY).
         */
        function placePointedCuspWedgePair(
          apexInfo,
          apexIdx,
          rp,
          alongU,
          jRing,
          rnd,
          ringWorld,
          meshList,
          gx = 0,
          zOff = 0,
        ) {
          if (!brickGeo || !apexIdx || apexIdx.leftI < 0 || apexIdx.rightI < 0)
            return;
          const halfD =
            params.brickD * 0.5 * (params.archRingDepthScale || 1.0);
          const sL = jRing * apexIdx.leftI + alongU * (apexIdx.leftI + 0.5);
          const sR = jRing * apexIdx.rightI + alongU * (apexIdx.rightI + 0.5);
          const tailPull = alongU * 0.48;
          const sLo = Math.max(apexInfo.apexS - tailPull * 2, 0);
          const sRo = Math.min(apexInfo.apexS + tailPull * 2, pathULength(rp));
          const oL = sampleUPath(sLo, rp);
          const oR = sampleUPath(sRo, rp);
          const yTop = apexInfo.apexY;
          const xOff = new THREE.Matrix4().makeTranslation(gx, 0, zOff);
          const parent = new THREE.Matrix4();
          if (ringWorld) parent.copy(ringWorld);
          parent.multiply(xOff);

          for (const [side, xOut, yBot] of [
            ["left", oL.x, oL.y],
            ["right", oR.x, oR.y],
          ]) {
            const geo = createPointedCuspHalfGeometry(
              side,
              xOut,
              yBot,
              yTop,
              halfD,
            );
            const wedge = new THREE.InstancedMesh(geo, brickMat, 1);
            wedge.castShadow = true;
            wedge.receiveShadow = true;
            wedge.setMatrixAt(0, parent);
            setCuspWedgeBrickVar(wedge, rnd);
            wedge.instanceMatrix.needsUpdate = true;
            scene.add(wedge);
            meshList.push(wedge);
          }
        }

        function buildTowerDoorRings() {
          if (!brickGeo) return;
          const openings = getTowerOpeningsList();
          const jRing = THREE.MathUtils.clamp(
            params.brickW * 0.022,
            0.0045,
            0.012,
          );
          const halfT = params.towerHalfWidth;

          openings.forEach((op) => {
            const rp = ringParamsFromOpening(op);
            const R = rp.ringRadius;
            const Lu = pathULength(rp);
            const Ls = op.closeBottom ? 2 * R : 0;
            const targetMod =
              params.brickW *
                THREE.MathUtils.clamp(params.spacingMul, 0.82, 1.08) +
              jRing;
            let nU = Math.max(5, Math.round(Lu / targetMod));
            let nS = Ls > 0 ? Math.max(2, Math.round(Ls / targetMod)) : 0;
            if (nU + nS > params.maxBricks) {
              const room = params.maxBricks - nS;
              nU = Math.max(4, Math.min(nU, room));
              if (nU + nS > params.maxBricks)
                nS = Math.max(0, params.maxBricks - nU);
            }
            const n = nU + nS;
            const cap = Math.min(params.maxBricks, n + 8);
            const doorGeo = createInstancedBrickGeometry(brickGeo, cap);
            const mesh = new THREE.InstancedMesh(doorGeo, brickMat, cap);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const rnd = mulberry32(
              (params.colorSeed ^ (op.uCenter * 10007 + op.face * 131)) | 0,
            );
            let k = 0;
            let alongU =
              nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
            let alongS =
              nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
            const minAlong = params.brickW * 0.44;
            while (nU > 4 && alongU < minAlong) {
              nU--;
              alongU =
                nU > 0
                  ? (Lu - Math.max(0, nU - 1) * jRing) / nU
                  : params.brickW;
            }
            while (nS > 2 && alongS < minAlong) {
              nS--;
              alongS =
                nS > 0
                  ? (Ls - Math.max(0, nS - 1) * jRing) / nS
                  : params.brickW;
            }

            const Rcyl = Math.max(0.2, halfT);
            const ringZ =
              typeof op.archAlongZ === "number" && !Number.isNaN(op.archAlongZ)
                ? op.archAlongZ
                : 0;
            const thC = isRoundTower()
              ? roundTowerGateThetaRad() + op.uCenter / Rcyl
              : 0;
            /** Matches previous flat ring + mesh radial stacking on the cylinder. */
            let rSurfRound = 0;
            if (isRoundTower()) {
              const insetRl = towerFaceInsetD();
              const rRing = Math.max(0.08, Rcyl - insetRl + ringZ);
              rSurfRound = rRing + ringZ;
              const c0 = Math.cos(thC);
              const s0 = Math.sin(thC);
              mesh.position.set(ringZ * c0, 0, ringZ * s0);
              mesh.updateMatrixWorld(true);
              _invMeshDoor.copy(mesh.matrixWorld).invert();
            } else {
              setRingParentForFace(
                ringRoot,
                op.face,
                halfT,
                op.uCenter,
                params.brickD,
              );
              ringRoot.updateMatrixWorld(true);
              const ff = THREE.MathUtils.clamp(op.face | 0, 0, 3);
              if (ff === 0) mesh.position.set(ringZ, 0, 0);
              else if (ff === 1) mesh.position.set(-ringZ, 0, 0);
              else if (ff === 2) mesh.position.set(0, 0, ringZ);
              else mesh.position.set(0, 0, -ringZ);
              mesh.updateMatrixWorld(true);
              _invMeshDoor.copy(mesh.matrixWorld).invert();
            }

            const placeBrick = (x, y, tx, ty, along) => {
              const yaw = Math.atan2(ty, tx);
              const baseSx = THREE.MathUtils.clamp(
                along / params.brickW,
                0.86,
                1.12,
              );
              const baseSy = 0.94 + rnd() * 0.05;
              const baseSz = 0.94 + rnd() * 0.05;
              const v = pickBrickVariation(
                rnd,
                baseSx,
                baseSy,
                baseSz,
                "door",
                params.archRingDepthScale,
              );
              if (isRoundTower()) {
                const rs0 = Math.max(0.08, rSurfRound);
                const rs = Math.max(
                  0.06,
                  rs0 + (rnd() - 0.5) * (params.brickRadiusVariation || 0),
                );
                const thi = thC + x / rs0;
                const ci = Math.cos(thi);
                const si = Math.sin(thi);
                _tmpDoorPos.set(ci * rs, y, si * rs);
                _doorTan.set(-si, 0, ci);
                _doorOut.set(ci, 0, si);
                const ps = (params.brickPlanarSlop || 0) * 0.38;
                const vy = (params.brickVerticalVariation || 0) * 0.42;
                if (ps > 0 || vy > 0) {
                  _tmpDoorPos.addScaledVector(_doorTan, (rnd() - 0.5) * ps);
                  _tmpDoorPos.addScaledVector(
                    _doorOut,
                    (rnd() - 0.5) * ps * 0.55,
                  );
                  _tmpDoorPos.y += (rnd() - 0.5) * vy;
                }
                /**
                 * Flat ring: tangent (tx, ty) lies in ring X–Y = (cylinder tangent, world up).
                 * Build the same 3D direction on the curved shell, then a right-handed frame with
                 * brick depth Z = outward radial (matches square `setRingParentForFace` + Rz(yaw)).
                 */
                _doorBx
                  .copy(_doorTan)
                  .multiplyScalar(tx)
                  .addScaledVector(_yAxis, ty);
                if (_doorBx.lengthSq() < 1e-10) _doorBx.copy(_doorTan);
                _doorBx.normalize();
                _doorBy.copy(_doorOut).cross(_doorBx).normalize();
                _doorBz.copy(_doorBx).cross(_doorBy).normalize();
                _tmpBasisBrick.makeBasis(_doorBx, _doorBy, _doorBz);
                _tmpDoorQuat.setFromRotationMatrix(_tmpBasisBrick);
                const rv = (params.brickRotationVariation || 0) * 0.42;
                if (rv > 0) {
                  _layoutEuler.set(
                    (rnd() - 0.5) * rv,
                    (rnd() - 0.5) * rv,
                    (rnd() - 0.5) * rv,
                  );
                  tmpO.quaternion.setFromEuler(_layoutEuler);
                  _tmpDoorQuat.multiply(tmpO.quaternion);
                }
                _tmpDoorScale.set(v.sx, v.sy, v.sz);
                const sr = params.brickScaleRandomness || 0;
                if (sr > 0) {
                  const t = 0.55;
                  const f = () => 1 + (rnd() - 0.5) * sr * t;
                  _tmpDoorScale.x *= f();
                  _tmpDoorScale.y *= f();
                  _tmpDoorScale.z *= f();
                }
                tmpO.matrix.compose(_tmpDoorPos, _tmpDoorQuat, _tmpDoorScale);
                tmpM.multiplyMatrices(_invMeshDoor, tmpO.matrix);
              } else {
                tmpO.position.set(x, y, 0);
                tmpO.rotation.set(0, 0, yaw);
                tmpO.scale.set(v.sx, v.sy, v.sz);
                applyBrickAxisScaleNoise(tmpO, rnd, true);
                applyBrickPlacementNoise(tmpO, rnd, true);
                tmpO.updateMatrix();
                tmpM.multiplyMatrices(ringRoot.matrixWorld, tmpO.matrix);
                tmpM.premultiply(_invMeshDoor);
              }
              mesh.setMatrixAt(k, tmpM);
              setBrickVarAt(mesh, k, v.shapeMix, v.warp, v.grey, v.grain);
              k++;
            };

            const apexInfo = pointedApexPathInfo(rp);
            const apexIdx = apexInfo
              ? pointedApexBrickIndices(nU, alongU, jRing, apexInfo.apexS)
              : null;

            for (let i = 0; i < nU; i++) {
              const s = jRing * i + alongU * (i + 0.5);
              if (
                apexInfo &&
                skipPointedCuspStraggler(s, apexInfo.apexS, alongU, i, apexIdx)
              ) {
                continue;
              }
              if (isPointedKeystoneIndex(i, apexIdx)) continue;
              const o = sampleUPath(s, rp);
              placeBrick(o.x, o.y, o.tx, o.ty, alongU);
            }
            for (let i = 0; i < nS; i++) {
              const s = jRing * i + alongS * (i + 0.5);
              const o = sampleSill(s, R, rp.sillY);
              placeBrick(o.x, o.y, o.tx, o.ty, alongS);
            }

            mesh.count = k;
            mesh.instanceMatrix.needsUpdate = true;
            const bv = mesh.geometry.getAttribute("brickVar");
            if (bv) bv.needsUpdate = true;
            scene.add(mesh);
            towerDoorMeshes.push(mesh);

            if (apexInfo && apexIdx && !isRoundTower()) {
              const ringWorld = new THREE.Matrix4();
              setRingParentForFace(
                ringRoot,
                op.face,
                halfT,
                op.uCenter,
                params.brickD,
              );
              ringRoot.updateMatrixWorld(true);
              ringWorld.copy(ringRoot.matrixWorld);
              const ff = THREE.MathUtils.clamp(op.face | 0, 0, 3);
              const rz =
                typeof op.archAlongZ === "number" &&
                !Number.isNaN(op.archAlongZ)
                  ? op.archAlongZ
                  : 0;
              if (ff === 0) ringWorld.multiply(new THREE.Matrix4().makeTranslation(rz, 0, 0));
              else if (ff === 1)
                ringWorld.multiply(new THREE.Matrix4().makeTranslation(-rz, 0, 0));
              else if (ff === 2)
                ringWorld.multiply(new THREE.Matrix4().makeTranslation(0, 0, rz));
              else ringWorld.multiply(new THREE.Matrix4().makeTranslation(0, 0, -rz));
              placePointedCuspWedgePair(
                apexInfo,
                apexIdx,
                rp,
                alongU,
                jRing,
                rnd,
                ringWorld,
                towerDoorMeshes,
              );
            } else if (apexInfo && apexIdx && isRoundTower()) {
              const oL = sampleUPath(
                jRing * apexIdx.leftI + alongU * (apexIdx.leftI + 0.5),
                rp,
              );
              const oR = sampleUPath(
                jRing * apexIdx.rightI + alongU * (apexIdx.rightI + 0.5),
                rp,
              );
              placeBrick(oL.x, oL.y, oL.tx, oL.ty, alongU);
              placeBrick(oR.x, oR.y, oR.tx, oR.ty, alongU);
            }
          });
        }

        function computeBridgeArchCentersWorldX() {
          const L = Math.max(6, params.bridgeLength);
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const margin = params.brickW * 2.5 + R_in * 0.25;
          const usable = Math.max(L - 2 * margin, L * 0.42);
          const step = usable / 4;
          const x0 = -L * 0.5 + margin + step;
          return [x0, x0 + step, x0 + step * 2].map(
            (x) => x + params.archAlong,
          );
        }

        /**
         * One ∩ arch ring on a bridge side wall (local XY, mesh Z = wall plane + archAlongZ).
         * @param {boolean} flipX — south wall: mirror ring in X about the pier center `gxc`.
         */
        function pushBridgeArchRingMesh(rp, gxc, zWorld, flipX, seedOff) {
          if (!brickGeo) return;
          const R = rp.ringRadius;
          const Lu = pathULength(rp);
          const Ls = params.closeBottom ? 2 * R : 0;
          const jRing = THREE.MathUtils.clamp(
            params.brickW * 0.022,
            0.0045,
            0.012,
          );
          const targetMod =
            params.brickW *
              THREE.MathUtils.clamp(params.spacingMul, 0.82, 1.08) +
            jRing;
          let nU = Math.max(5, Math.round(Lu / targetMod));
          let nS = Ls > 0 ? Math.max(2, Math.round(Ls / targetMod)) : 0;
          if (nU + nS > params.maxBricks) {
            const room = params.maxBricks - nS;
            nU = Math.max(4, Math.min(nU, room));
            if (nU + nS > params.maxBricks)
              nS = Math.max(0, params.maxBricks - nU);
          }
          const n = nU + nS;
          const cap = Math.min(params.maxBricks, n + 8);
          const doorGeo = createInstancedBrickGeometry(brickGeo, cap);
          const mesh = new THREE.InstancedMesh(doorGeo, brickMat, cap);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          const rnd = mulberry32(
            ((params.colorSeed ^ 0x85ebca6b) + seedOff * 977) >>> 0,
          );
          let k = 0;
          let alongU =
            nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
          let alongS =
            nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
          const minAlong = params.brickW * 0.44;
          while (nU > 4 && alongU < minAlong) {
            nU--;
            alongU =
              nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
          }
          while (nS > 2 && alongS < minAlong) {
            nS--;
            alongS =
              nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
          }
          const placeBrick = (ox, y, tx, ty, along) => {
            /**
             * South wall (`flipX`): world X = gxc − ox mirrors the north ring about the pier.
             * Tangents must mirror too: (tx, ty) → (−tx, ty) in the wall plane, else voussoirs
             * stay north‑oriented and read as wrong twist / gaps.
             */
            const yaw = flipX ? Math.atan2(ty, -tx) : Math.atan2(ty, tx);
            const baseSx = THREE.MathUtils.clamp(
              along / params.brickW,
              0.86,
              1.12,
            );
            const baseSy = 0.94 + rnd() * 0.05;
            const baseSz = 0.94 + rnd() * 0.05;
            const v = pickBrickVariation(
              rnd,
              baseSx,
              baseSy,
              baseSz,
              "door",
              params.archRingDepthScale,
            );
            const lx = flipX ? gxc - ox : ox + gxc;
            tmpO.position.set(lx, y, 0);
            tmpO.rotation.set(0, 0, yaw);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, true);
            applyBrickPlacementNoise(tmpO, rnd, true);
            tmpO.updateMatrix();
            mesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(mesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
          };
          const apexInfo = pointedApexPathInfo(rp);
          const apexIdx = apexInfo
            ? pointedApexBrickIndices(nU, alongU, jRing, apexInfo.apexS)
            : null;

          for (let i = 0; i < nU; i++) {
            const s = jRing * i + alongU * (i + 0.5);
            if (
              apexInfo &&
              skipPointedCuspStraggler(s, apexInfo.apexS, alongU, i, apexIdx)
            ) {
              continue;
            }
            if (isPointedKeystoneIndex(i, apexIdx)) continue;
            const o = sampleUPath(s, rp);
            placeBrick(o.x, o.y, o.tx, o.ty, alongU);
          }
          for (let i = 0; i < nS; i++) {
            const s = jRing * i + alongS * (i + 0.5);
            const o = sampleSill(s, R, rp.sillY);
            placeBrick(o.x, o.y, o.tx, o.ty, alongS);
          }
          mesh.count = k;
          mesh.instanceMatrix.needsUpdate = true;
          const bv = mesh.geometry.getAttribute("brickVar");
          if (bv) bv.needsUpdate = true;
          mesh.position.set(0, 0, zWorld + params.archAlongZ);
          mesh.rotation.set(0, 0, 0);
          scene.add(mesh);
          bridgeArchMeshes.push(mesh);

          if (apexInfo && apexIdx) {
            const ringWorld = new THREE.Matrix4().makeTranslation(
              gxc,
              0,
              zWorld + params.archAlongZ,
            );
            if (flipX) {
              ringWorld.multiply(new THREE.Matrix4().makeScale(-1, 1, 1));
            }
            placePointedCuspWedgePair(
              apexInfo,
              apexIdx,
              rp,
              alongU,
              jRing,
              rnd,
              ringWorld,
              bridgeArchMeshes,
            );
          }
        }

        function buildBridgeArchRings() {
          if (!brickGeo) return;
          bridgeArchMeshes.forEach((m) => {
            scene.remove(m);
            if (m.geometry) m.geometry.dispose();
          });
          bridgeArchMeshes = [];
          const rp = ringParamsFromGui();
          const gxs = computeBridgeArchCentersWorldX();
          const zn = -(params.bridgeDeckHalfW + params.wallDepth * 0.5);
          const zs = params.bridgeDeckHalfW + params.wallDepth * 0.5;
          let seed = 0;
          for (const gxc of gxs) {
            pushBridgeArchRingMesh(rp, gxc, zn, false, seed++);
            pushBridgeArchRingMesh(rp, gxc, zs, true, seed++);
          }
        }

        function buildBridgeInstances() {
          if (!brickGeo) return;
          const rp = ringParamsFromGui();
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const doorSill = params.sillY;
          const ys = rp.springY;
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const L = Math.max(6, params.bridgeLength);
          const wallLo = -L * 0.5;
          const wallHi = L * 0.5;
          const wallBase = params.wallAnchorY;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const topY = wallBase + Math.max(nomH * 2, params.wallHeight);
          const ny = Math.min(
            260,
            Math.max(3, Math.ceil((topY - baseY) / rowH)),
          );
          const gxs = computeBridgeArchCentersWorldX();
          const zn = -(params.bridgeDeckHalfW + params.wallDepth * 0.5);
          const zs = params.bridgeDeckHalfW + params.wallDepth * 0.5;
          const zLoD = -params.bridgeDeckHalfW + Math.max(0.006, seam * 0.85);
          const zHiD = params.bridgeDeckHalfW - Math.max(0.006, seam * 0.85);
          const deckCourses = THREE.MathUtils.clamp(
            Math.round(params.bridgeDeckCourses) || 4,
            1,
            14,
          );
          const deckDrop = THREE.MathUtils.clamp(
            Math.max(0, Number(params.bridgeDeckDropY) || 0),
            0,
            Math.max(0, topY - baseY - nomH * 2.2),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, 0);

          const rnd = mulberry32((params.colorSeed ^ 0x4f1bbcdc) | 0);
          let k = 0;

          const placeWorldBrick = (wx, wy, wz, sx, sy, sz, doorTight) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(
              rnd,
              sx,
              sy,
              sz,
              doorTight ? "door" : "wall",
            );
            tmpO.position.set(wx, wy, wz);
            tmpO.rotation.set(0, 0, 0);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, !!doorTight);
            applyBrickPlacementNoise(tmpO, rnd, !!doorTight);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          const fillSideWallAtZ = (zWall, outerSeed) => {
            const rndW = mulberry32((outerSeed ^ params.colorSeed) | 0);
            outer: for (let iy = 0; iy < ny; iy++) {
              const yMid = baseY + iy * rowH;
              if (yMid > topY - nomH * 0.2) break;
              const oh0 = wallOpeningHalfX(
                yMid,
                R_out,
                doorSill,
                ys,
                seam,
                params.archShape,
                params.archPointedness,
              );
              let intervals = [[wallLo, wallHi]];
              if (oh0 > 1e-5) {
                for (const gxc of gxs) {
                  const oh = wallOpeningHalfX(
                    yMid,
                    R_out,
                    doorSill,
                    ys,
                    seam,
                    params.archShape,
                    params.archPointedness,
                  );
                  if (oh > 1e-5) {
                    intervals = subtractIntervals(
                      intervals,
                      gxc - oh,
                      gxc + oh,
                    );
                  }
                }
              }
              const curv = wallOpeningCurvature(
                yMid,
                R_out,
                doorSill,
                ys,
                seam,
                params.archShape,
                params.archPointedness,
              );
              const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
              const nomWCurve =
                nomW *
                THREE.MathUtils.lerp(
                  1,
                  THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                  Math.pow(curveT, 1.08),
                );
              const haunch =
                yMid >= ys - mortar * 1.5 && yMid <= ys + R_out * 1.05
                  ? THREE.MathUtils.smoothstep(
                      ys - 0.12,
                      ys + R_out * 0.82,
                      yMid,
                    )
                  : 0;
              const crownSy =
                1 -
                (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                  Math.pow(haunch, 1.28);

              for (const [segLo, segHi] of intervals) {
                const span = segHi - segLo;
                if (span < nomW * params.wallMinBrickScale * 0.45) continue;
                const minW = nomW * params.wallMinBrickScale;
                const jMin = 0.0035;
                const jMax = Math.min(
                  mortar,
                  Math.max(jMin, span * 0.014 + jMin * 0.6),
                );
                const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
                const hj = j * 0.5;
                let innerLo = segLo + hj;
                let innerHi = segHi - hj;
                if (iy % 2 === 1) {
                  const shift = Math.min(
                    (nomWCurve + j) * 0.48,
                    Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
                  );
                  const eps = Math.max(1e-3, nomW * 0.025);
                  const segCx = (innerLo + innerHi) * 0.5;
                  let nearestGx = gxs[0] ?? 0;
                  for (const gxc of gxs) {
                    if (Math.abs(gxc - segCx) < Math.abs(nearestGx - segCx)) {
                      nearestGx = gxc;
                    }
                  }
                  const nearestOpenH = wallOpeningHalfX(
                    yMid,
                    R_out,
                    doorSill,
                    ys,
                    seam,
                    params.archShape,
                    params.archPointedness,
                  );
                  const rightOfOpening =
                    nearestOpenH > 1e-5 &&
                    segLo >= nearestGx + nearestOpenH - eps;
                  const leftOfOpening =
                    nearestOpenH > 1e-5 &&
                    segHi <= nearestGx - nearestOpenH + eps;
                  if (rightOfOpening) innerHi -= shift;
                  else if (leftOfOpening) innerLo += shift;
                  else innerLo += shift;
                }
                const innerLen = innerHi - innerLo;
                if (innerLen < minW * 0.72) continue;
                let nBricks = Math.max(
                  1,
                  Math.round(innerLen / (nomWCurve + j)),
                );
                let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                for (let it = 0; it < 96; it++) {
                  wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                  if (wEq < minW * 0.998) {
                    if (nBricks <= 1) break;
                    nBricks--;
                  } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                    nBricks++;
                  } else break;
                }
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.88) continue;
                for (let bi = 0; bi < nBricks; bi++) {
                  if (k >= params.maxWallBricks) break outer;
                  const cx = innerLo + wEq * 0.5 + bi * (wEq + j);
                  if (cx > innerHi - wEq * 0.5 + 1e-4) break;
                  let tuckY = 0;
                  if (oh0 > 1e-4 && curveT > 0.04) {
                    for (const gxc of gxs) {
                      const openH = wallOpeningHalfX(
                        yMid,
                        R_out,
                        doorSill,
                        ys,
                        seam,
                        params.archShape,
                        params.archPointedness,
                      );
                      if (openH <= 1e-4) continue;
                      const gap = Math.max(0, Math.abs(cx - gxc) - openH);
                      const band = params.brickW * 3.8;
                      if (gap < band) {
                        const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                        const ty =
                          -nomH *
                          0.12 *
                          Math.pow(t, 1.2) *
                          Math.pow(curveT, 0.55);
                        tuckY = Math.min(tuckY, ty);
                      }
                    }
                  }
                  const sx = wEq / nomW;
                  const sy = (0.91 + rndW() * 0.06) * crownSy;
                  const sz = 0.92 + rndW() * 0.06;
                  if (
                    !placeWorldBrick(cx, yMid + tuckY, zWall, sx, sy, sz, false)
                  ) {
                    break outer;
                  }
                }
              }
            }
          };

          fillSideWallAtZ(zn, 0x51ead);
          fillSideWallAtZ(zs, 0x2f693);

          const rowZ = nomW + mortar;
          const zSpan = Math.max(0.15, zHiD - zLoD);
          const nz = Math.min(120, Math.max(2, Math.ceil(zSpan / rowZ)));
          deckOuter: for (let di = 0; di < deckCourses; di++) {
            const yDeck =
              topY -
              mortar * 0.5 -
              nomH * 0.5 -
              di * rowH -
              di * mortar * 0.02 -
              deckDrop;
            if (yDeck < wallBase + nomH * 0.35) break;
            for (let iz = 0; iz < nz; iz++) {
              const zMid = zLoD + nomW * 0.5 + mortar * 0.5 + iz * rowZ;
              if (zMid > zHiD - nomW * 0.18) break;
              let intervals = [[wallLo, wallHi]];
              const nomWDeck = nomW;
              for (const [segLo, segHi] of intervals) {
                const span = segHi - segLo;
                if (span < nomWDeck * params.wallMinBrickScale * 0.45) continue;
                const minW = nomWDeck * params.wallMinBrickScale;
                const jMin = 0.0035;
                const jMax = Math.min(
                  mortar,
                  Math.max(jMin, span * 0.014 + jMin * 0.6),
                );
                const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
                const hj = j * 0.5;
                let innerLo = segLo + hj;
                let innerHi = segHi - hj;
                if ((iz + di) % 2 === 1) {
                  const shift = Math.min(
                    (nomWDeck + j) * 0.48,
                    Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
                  );
                  innerLo += shift;
                }
                const innerLen = innerHi - innerLo;
                if (innerLen < minW * 0.72) continue;
                let nBricks = Math.max(
                  1,
                  Math.round(innerLen / (nomWDeck + j)),
                );
                let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                for (let it = 0; it < 96; it++) {
                  wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                  if (wEq < minW * 0.998) {
                    if (nBricks <= 1) break;
                    nBricks--;
                  } else if (wEq > nomWDeck * 1.075 && nBricks < 1600) {
                    nBricks++;
                  } else break;
                }
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.88) continue;
                for (let bi = 0; bi < nBricks; bi++) {
                  if (k >= params.maxWallBricks) break deckOuter;
                  const cx = innerLo + wEq * 0.5 + bi * (wEq + j);
                  if (cx > innerHi - wEq * 0.5 + 1e-4) break;
                  const sx = wEq / nomWDeck;
                  const sy = 0.91 + rnd() * 0.06;
                  const sz = 0.92 + rnd() * 0.06;
                  if (!placeWorldBrick(cx, yDeck, zMid, sx, sy, sz, false)) {
                    break deckOuter;
                  }
                }
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        function buildDoorInstances() {
          doorCuspMeshes.forEach((m) => {
            scene.remove(m);
            if (m.geometry) m.geometry.dispose();
          });
          doorCuspMeshes = [];
          if (isBridge()) {
            buildBridgeArchRings();
            return;
          }
          if (isTowerLike()) {
            buildTowerDoorRings();
            return;
          }
          const rp = ringParamsFromGui();
          const R = rp.ringRadius;
          const Lu = pathULength(rp);
          const Ls = params.closeBottom ? 2 * R : 0;
          /** Mortar along the ring path; scales with brick width, capped so joints never read huge. */
          const jRing = THREE.MathUtils.clamp(
            params.brickW * 0.022,
            0.0045,
            0.012,
          );
          const targetMod =
            params.brickW *
              THREE.MathUtils.clamp(params.spacingMul, 0.82, 1.08) +
            jRing;
          let nU = Math.max(5, Math.round(Lu / targetMod));
          let nS = Ls > 0 ? Math.max(2, Math.round(Ls / targetMod)) : 0;
          if (nU + nS > params.maxBricks) {
            const room = params.maxBricks - nS;
            nU = Math.max(4, Math.min(nU, room));
            if (nU + nS > params.maxBricks)
              nS = Math.max(0, params.maxBricks - nU);
          }
          const n = nU + nS;
          const cap = Math.min(params.maxBricks, n + 8);
          const doorGeo = createInstancedBrickGeometry(brickGeo, cap);

          doorMesh = new THREE.InstancedMesh(doorGeo, brickMat, cap);
          doorMesh.castShadow = true;
          doorMesh.receiveShadow = true;

          const rnd = mulberry32(params.colorSeed | 0);
          let k = 0;
          const gx = getGateX();

          let alongU =
            nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
          let alongS =
            nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
          const minAlong = params.brickW * 0.44;
          while (nU > 4 && alongU < minAlong) {
            nU--;
            alongU =
              nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
          }
          while (nS > 2 && alongS < minAlong) {
            nS--;
            alongS =
              nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
          }

          const placeBrick = (x, y, tx, ty, along) => {
            const yaw = Math.atan2(ty, tx);
            const baseSx = THREE.MathUtils.clamp(
              along / params.brickW,
              0.86,
              1.12,
            );
            const baseSy = 0.94 + rnd() * 0.05;
            const baseSz = 0.94 + rnd() * 0.05;
            const v = pickBrickVariation(
              rnd,
              baseSx,
              baseSy,
              baseSz,
              "door",
              params.archRingDepthScale,
            );
            tmpO.position.set(x + gx, y, 0);
            tmpO.rotation.set(0, 0, yaw);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, true);
            applyBrickPlacementNoise(tmpO, rnd, true);
            tmpO.updateMatrix();
            doorMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(doorMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
          };

          const apexInfo = pointedApexPathInfo(rp);
          const apexIdx = apexInfo
            ? pointedApexBrickIndices(nU, alongU, jRing, apexInfo.apexS)
            : null;

          for (let i = 0; i < nU; i++) {
            const s = jRing * i + alongU * (i + 0.5);
            if (
              apexInfo &&
              skipPointedCuspStraggler(s, apexInfo.apexS, alongU, i, apexIdx)
            ) {
              continue;
            }
            if (isPointedKeystoneIndex(i, apexIdx)) continue;
            const o = sampleUPath(s, rp);
            placeBrick(o.x, o.y, o.tx, o.ty, alongU);
          }
          for (let i = 0; i < nS; i++) {
            const s = jRing * i + alongS * (i + 0.5);
            const o = sampleSill(s, R, rp.sillY);
            placeBrick(o.x, o.y, o.tx, o.ty, alongS);
          }

          if (apexInfo && apexIdx) {
            const ringWorld = new THREE.Matrix4().makeTranslation(
              gx,
              0,
              params.archAlongZ,
            );
            placePointedCuspWedgePair(
              apexInfo,
              apexIdx,
              rp,
              alongU,
              jRing,
              rnd,
              ringWorld,
              doorCuspMeshes,
            );
          }

          doorMesh.count = k;
          doorMesh.instanceMatrix.needsUpdate = true;
          const bv = doorMesh.geometry.getAttribute("brickVar");
          if (bv) bv.needsUpdate = true;
          doorMesh.position.set(0, 0, params.archAlongZ);
          scene.add(doorMesh);
        }

        function buildWallInstances() {
          if (params.sceneMode === "tower") {
            buildTowerShellInstances();
            return;
          }
          if (params.sceneMode === "house") {
            buildHouseShellInstances();
            return;
          }
          if (params.sceneMode === "towerRound") {
            buildTowerRoundShellInstances();
            return;
          }
          if (isBridge()) {
            buildBridgeInstances();
            return;
          }
          if (!brickGeo || (!params.wallEnabled && !isBridge())) return;

          const rp = ringParamsFromGui();
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const doorSill = params.sillY;
          const ys = rp.springY;
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const wallLo = -params.wallWidth * 0.5;
          const wallHi = params.wallWidth * 0.5;
          const wallBase = params.wallAnchorY;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const topY = wallBase + Math.max(nomH * 2, params.wallHeight);
          const ny = Math.min(
            220,
            Math.max(3, Math.ceil((topY - baseY) / rowH)),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, params.wallZ);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;
          const gx = getGateX();

          const placeWallBrick = (cx, cy, sx, sy, sz) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            tmpO.position.set(cx, cy, 0);
            tmpO.rotation.set(0, 0, 0);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, false);
            applyBrickPlacementNoise(tmpO, rnd, false);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          outer: for (let iy = 0; iy < ny; iy++) {
            const yMid = baseY + iy * rowH;
            if (yMid > topY - nomH * 0.2) break;

            const openH = wallOpeningHalfX(
              yMid,
              R_out,
              doorSill,
              ys,
              seam,
              params.archShape,
              params.archPointedness,
            );
            let intervals = [[wallLo, wallHi]];
            if (openH > 1e-5) {
              intervals = subtractIntervals(intervals, gx - openH, gx + openH);
            }

            const curv = wallOpeningCurvature(
              yMid,
              R_out,
              doorSill,
              ys,
              seam,
              params.archShape,
              params.archPointedness,
            );
            const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
            const nomWCurve =
              nomW *
              THREE.MathUtils.lerp(
                1,
                THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                Math.pow(curveT, 1.08),
              );

            const haunch =
              yMid >= ys - mortar * 1.5 && yMid <= ys + R_out * 1.05
                ? THREE.MathUtils.smoothstep(ys - 0.12, ys + R_out * 0.82, yMid)
                : 0;
            const crownSy =
              1 -
              (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                Math.pow(haunch, 1.28);

            for (const [segLo, segHi] of intervals) {
              const span = segHi - segLo;
              if (span < nomW * params.wallMinBrickScale * 0.45) continue;

              const minW = nomW * params.wallMinBrickScale;
              const jMin = 0.0035;
              const jMax = Math.min(
                mortar,
                Math.max(jMin, span * 0.014 + jMin * 0.6),
              );
              const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
              const hj = j * 0.5;
              let innerLo = segLo + hj;
              let innerHi = segHi - hj;
              if (iy % 2 === 1) {
                const shift = Math.min(
                  (nomWCurve + j) * 0.48,
                  Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
                );
                /**
                 * Running-bond stagger must not always grow innerLo: that pulls the
                 * right-side segment away from the arch (gap at the seam) while the
                 * left segment only pulls away from the far wall. Shift from the
                 * outer wall on each side instead.
                 */
                const eps = Math.max(1e-3, nomW * 0.025);
                const rightOfOpening =
                  openH > 1e-5 && segLo >= gx + openH - eps;
                const leftOfOpening = openH > 1e-5 && segHi <= gx - openH + eps;
                if (rightOfOpening) innerHi -= shift;
                else if (leftOfOpening) innerLo += shift;
                else innerLo += shift;
              }

              const innerLen = innerHi - innerLo;
              if (innerLen < minW * 0.72) continue;

              let nBricks = Math.max(1, Math.round(innerLen / (nomWCurve + j)));
              let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              for (let it = 0; it < 96; it++) {
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.998) {
                  if (nBricks <= 1) break;
                  nBricks--;
                } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                  nBricks++;
                } else break;
              }
              wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              if (wEq < minW * 0.88) continue;

              for (let bi = 0; bi < nBricks; bi++) {
                if (k >= params.maxWallBricks) break outer;
                const cx = innerLo + wEq * 0.5 + bi * (wEq + j);
                if (cx > innerHi - wEq * 0.5 + 1e-4) break;

                let tuckY = 0;
                if (openH > 1e-4 && curveT > 0.04) {
                  const gap = Math.max(0, Math.abs(cx - gx) - openH);
                  const band = params.brickW * 3.8;
                  if (gap < band) {
                    const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                    tuckY =
                      -nomH * 0.12 * Math.pow(t, 1.2) * Math.pow(curveT, 0.55);
                  }
                }

                const sx = wEq / nomW;
                const sy = (0.91 + rnd() * 0.06) * crownSy;
                const sz = 0.92 + rnd() * 0.06;
                if (!placeWallBrick(cx, yMid + tuckY, sx, sy, sz)) break outer;
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
