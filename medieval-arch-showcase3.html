          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        fDestruction
          .addBinding(params, "showRubble", { label: "Show rubble" })
          .on("change", () => {
            refreshRubbleMatrices();
          });
        fDestruction
          .addBinding(params, "erosionPlaceBrickDebris", {
            label: "Erosion → brick debris (ground)",
          })
          .on("change", () => {
            syncErosionBrickDebrisOnGround();
          });
        fDestruction
          .addBinding(params, "erosionBrickDebrisMax", {
            min: 120,
            max: 8000,
            step: 40,
            label: "Max erosion brick copies",
          })
          .on("change", () => {
            syncErosionBrickDebrisOnGround();
          });
        fDestruction
          .addBinding(params, "erosionGroundRubble", {
            label: "Decorative gravel (extra, OFF)",
          })
          .on("change", () => {
            syncErosionGroundRubble();
          });
        fDestruction
          .addBinding(params, "erosionRubblePerBrick", {
            min: 0.35,
            max: 6,
            step: 0.05,
            label: "Gravel × / erosion brick",
          })
          .on("change", () => {
            syncErosionGroundRubble();
          });
        fDestruction
          .addBinding(params, "erosionRubbleMax", {
            min: 40,
            max: 1400,
            step: 20,
            label: "Gravel max pieces",
          })
          .on("change", () => {
            syncErosionGroundRubble();
          });
        fDestruction.addBinding(params, "removeRadius", {
          min: 0.2,
          max: 3.5,
          step: 0.05,
          label: "Blast radius",
        });
        fDestruction.addBinding(params, "collapseSpreadMax", {
          min: 0,
          max: 4000,
          step: 20,
          label: "Collapse cap (0 = unlimited, castle)",
        });
        fDestruction.addBinding(params, "gravity", {
          min: 4,
          max: 45,
          step: 0.5,
        });
        fDestruction.addBinding(params, "bounce", {
          min: 0,
          max: 0.85,
          step: 0.02,
        });
        fDestruction.addBinding(params, "angularDamping", {
          min: 0.9,
          max: 0.999,
          step: 0.001,
          label: "Spin damping",
        });
        fDestruction
          .addBinding(params, "debrisMode", {
            label: "Settled debris",
            options: { Fade: "fade", Keep: "keep" },
          })
          .on("change", () => {
            for (const b of destructBricks) {
              if (!b.hidden) b.ttl = params.debrisLifetime;
            }
          });
        fDestruction.addBinding(params, "debrisLifetime", {
          min: 1,
          max: 24,
          step: 0.25,
          label: "Fade time (s)",
        });
        fDestruction.addBinding(params, "maxDebrisCount", {
          min: 120,
          max: 4000,
          step: 40,
          label: "Max kept pieces",
        });
        fDestruction.addBinding(params, "sleepThreshold", {
          min: 0.08,
          max: 1.2,
          step: 0.02,
          label: "Sleep speed",
        });

        const fView = pane.addFolder({ title: "View" });
        fView
          .addBinding(params, "showArchGizmo", {
            label: "Arch gizmo",
          })
          .on("change", () => {
            if (archGizmo) {
              archGizmo.enabled = params.showArchGizmo;
              archGizmo.visible = params.showArchGizmo;
            }
          });
        fView
          .addBinding(params, "showGrid", { label: "Grid" })
          .on("change", () => {
            setGrid(params.showGrid);
          });

        pane.addButton({ title: "Rebuild" }).on("click", () => {
          rebuildAll();
        });

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener("resize", onResize);

        renderer.setAnimationLoop((time) => {
          sunDirUniform.value.copy(sun.position).normalize();
          destructTimer.update(time);
          const dt = destructTimer.getDelta();
          if (params.destructionEnabled && destructBricks.length) {
            updateFallingDestruct(dt);
          }
          controls.update();
          renderer.render(scene, camera);
        });
      }

      main().catch((e) => {
        console.error(e);
        document.body.innerHTML =
          "<pre style='color:#f8fafc;padding:16px;font:14px/1.4 system-ui'>WebGPU error: " +
          String(e) +
          "</pre>";
      });
    </script>
  </body>
</html>
