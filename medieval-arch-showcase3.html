<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick arch, wall, bridge, house — WebGPU + TSL</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #1a1d24;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100vh;
      }
      /* Scrollable Tweakpane: body stays overflow:hidden for the canvas */
      #tweak-root {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 50;
        width: min(340px, calc(100vw - 16px));
        max-height: calc(100vh - 16px);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        -webkit-overflow-scrolling: touch;
      }
      #tweak-root::-webkit-scrollbar {

        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="tweak-root" aria-label="Settings panel"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn,
        float,
        color,
        vec2,
        vec3,
        sin,
        mix,
        smoothstep,
        mul,
        sub,
        add,
        abs,
        max,
        min,
        floor,
        fract,
        length,
        normalize,
        div,
        normalWorld,
        normalLocal,
        positionLocal,
        positionWorld,
        dot,
        pow,
        clamp,
        uniform,
        attribute,
      } from "three/tsl";

      /**
       * Pointed-arch geometry from springline half-width R and pointedness k = c/R.
       *   c = R * k          (each arc center offset from centerline, on the springline)
       *   r = c + R          (each arc radius — passes through the opposite springer)
       *   apexDy = sqrt(R*(R + 2*c))   (vertical distance from springline to keystone)
       *   k = 0  → round (degenerate: c=0, r=R, arcs coincide as one circle).
       *   k = 1  → equilateral (classic Gothic).
       *   k > 1  → lancet (taller).
       *   0<k<1  → drop (shallower than equilateral but still pointed).
       */
      function pointedArchGeom(R, k) {
        const c = R * Math.max(0, k);
        const r = c + R;
        const apexDy = Math.sqrt(Math.max(0, R * (R + 2 * c)));
        return { c, r, apexDy };
      }

      /** Half-arc-length of one pointed arc (left or right) from springer to keystone. */
      function pointedArcHalfLen(R, k) {
        const { c, r, apexDy } = pointedArchGeom(R, k);
        if (apexDy <= 1e-6) return 0;
        const thetaSpring = Math.atan2(0, c + R);
        const thetaApex = Math.atan2(apexDy, c);
        return r * Math.abs(thetaApex - thetaSpring);
      }

      /** Length of the ∩ outline: left jamb + arch (round or pointed) + right jamb (no sill). */
      function pathULength(p) {
        const Lj = Math.max(1e-6, p.springY - p.sillY);
        if (p.archShape === "pointed") {
          return (
            2 * Lj + 2 * pointedArcHalfLen(p.ringRadius, p.archPointedness)
          );
        }
        return 2 * Lj + Math.PI * p.ringRadius;
      }

      /** Horizontal sill from (-R,y0) → (R,y0), s ∈ [0, 2R]. */
      function sampleSill(s, R, y0) {
        const t = s / (2 * R);
        const x = THREE.MathUtils.lerp(-R, R, t);
        return { x, y: y0, tx: 1, ty: 0 };
      }

      /**
       * ∩ path: left jamb up → arch (round semicircle, OR two pointed arcs meeting at a
       * keystone) → right jamb down. Pointed math collapses to round when archPointedness=0
       * (c=0, r=R, α=π/2), so the round branch is purely an optimization.
       */
      function sampleUPath(s, p) {
        const R = p.ringRadius;
        const y0 = p.sillY;
        const ys = p.springY;
        const Lj = Math.max(1e-6, ys - y0);
        const isPointed = p.archShape === "pointed";
        let u = s;

        if (u <= Lj) {
          const t = u / Lj;
          const y = THREE.MathUtils.lerp(y0, ys, t);
          return { x: -R, y, tx: 0, ty: 1 };
        }
        u -= Lj;

        if (isPointed) {
          const pg = pointedArchGeom(R, p.archPointedness);
          const alpha = Math.atan2(pg.apexDy, Math.max(1e-6, pg.c));
          const oneArc = pg.r * alpha;
          if (u <= oneArc) {
            /** Left arc: center (+c, ys), sweep angle π → π − α (springer → keystone). */
            const t = u / oneArc;
            const ang = Math.PI - t * alpha;
            const x = pg.c + pg.r * Math.cos(ang);
            const y = ys + pg.r * Math.sin(ang);
            const tx = Math.sin(ang);
            const ty = -Math.cos(ang);
            const inv = 1 / Math.hypot(tx, ty);
            return { x, y, tx: tx * inv, ty: ty * inv };
          }
          u -= oneArc;
          if (u <= oneArc) {
            /** Right arc: center (−c, ys), sweep angle α → 0 (keystone → right springer). */
            const t = u / oneArc;
            const ang = alpha * (1 - t);
            const x = -pg.c + pg.r * Math.cos(ang);
            const y = ys + pg.r * Math.sin(ang);
            const tx = Math.sin(ang);
            const ty = -Math.cos(ang);
            const inv = 1 / Math.hypot(tx, ty);
            return { x, y, tx: tx * inv, ty: ty * inv };
          }
          u -= oneArc;
        } else {
          const La = Math.PI * R;
          if (u <= La) {
            const t = u / La;
            const ang = Math.PI * (1 - t);
            const ca = Math.cos(ang);
            const sa = Math.sin(ang);
            const x = R * ca;
            const y = ys + R * sa;
            const tx = sa;
            const ty = -ca;
            const inv = 1 / Math.hypot(tx, ty);
            return { x, y, tx: tx * inv, ty: ty * inv };
          }
          u -= La;
        }

        const t = THREE.MathUtils.clamp(u / Lj, 0, 1);
        const y = THREE.MathUtils.lerp(ys, y0, t);
        return { x: R, y, tx: 0, ty: -1 };
      }

      function subtractIntervals(intervals, holeLo, holeHi) {
        if (holeHi <= holeLo) return intervals;
        const out = [];
        for (const [a, b] of intervals) {
          if (b <= a + 1e-6) continue;
          if (holeHi <= a || holeLo >= b) {
            out.push([a, b]);
            continue;
          }
          if (holeLo > a + 1e-4) out.push([a, Math.min(holeLo, b)]);
          if (holeHi < b - 1e-4) out.push([Math.max(holeHi, a), b]);
        }
        return out;
      }

      /** Horizontal extent (|x|) where wall field must stay outside so it does not clip the ring. */
      function wallOpeningHalfX(
        y,
        R_out,
        y0,
        ys,
        seam,
        archShape,
        pointedness,
      ) {
        if (y < y0 - 1e-6) return 0;
        if (y < ys - 1e-6) return R_out + seam;
        const dy = y - ys;
        if (archShape === "pointed") {
          const { c, r, apexDy } = pointedArchGeom(R_out, pointedness);
          if (dy > apexDy + 1e-6) return 0;
          const inner = r * r - dy * dy;
          if (inner <= 0) return 0;
          const halfW = -c + Math.sqrt(inner);
          if (halfW <= 0) return 0;
          return halfW + seam;
        }
        if (dy > R_out + 1e-6) return 0;
        const inner = R_out * R_out - dy * dy;
        if (inner <= 0) return 0;
        return Math.sqrt(inner) + seam;
      }

      /** How fast the opening boundary moves in X with Y (large near springing and haunches). */
      function wallOpeningCurvature(
        y,
        R_out,
        y0,
        ys,
        seam,
        archShape,
        pointedness,
      ) {
        const e = 0.06;
        const a = wallOpeningHalfX(
          y + e,
          R_out,
          y0,
          ys,
          seam,
          archShape,
          pointedness,
        );
        const b = wallOpeningHalfX(
          y - e,
          R_out,
          y0,
          ys,
          seam,
          archShape,
          pointedness,
        );
        return Math.abs(a - b) / e;
      }

      const tmpO = new THREE.Object3D();
      const tmpM = new THREE.Matrix4();
      const ringRoot = new THREE.Object3D();
      const _archGizmoWP = new THREE.Vector3();
      const _archGizmoBasisM = new THREE.Matrix4();
      const _tmpBasisBrick = new THREE.Matrix4();
      const _invMeshDoor = new THREE.Matrix4();
      const _tmpDoorPos = new THREE.Vector3();
      const _tmpDoorQuat = new THREE.Quaternion();
      const _tmpDoorScale = new THREE.Vector3();
      const _doorTan = new THREE.Vector3();
      const _doorOut = new THREE.Vector3();
      const _doorBx = new THREE.Vector3();
      const _doorBy = new THREE.Vector3();
      const _doorBz = new THREE.Vector3();
      const _yAxis = new THREE.Vector3(0, 1, 0);
      const _layoutEuler = new THREE.Euler();

      /** Per-instance: x=shape mix, y=warp strength, z=grey key, w=grain phase */
      function setBrickVarAt(mesh, index, shapeMix, warp, grey, grain) {
        const att = mesh.geometry.getAttribute("brickVar");
        if (!att) return;
        const a = att.array;
        const o = index * 4;
        a[o] = shapeMix;
        a[o + 1] = warp;
        a[o + 2] = grey;
        a[o + 3] = grain;
      }

      /**
       * Returns scale factors + shader variation keys.
       * @param {'door'|'wall'} mode — door ring: tight coherent units; wall: subtle field variation.
       * @param {number} [ringDepthScale] — door/window ring only: multiply local depth (Z) so the arch reads slightly proud of the wall shell (both sides).
       */
      function pickBrickVariation(
        rnd,
        baseSx,
        baseSy,
        baseSz,
        mode,
        ringDepthScale,
      ) {
        let sx = baseSx;
        let sy = baseSy;
        let sz = baseSz;
        let shapeMix = 0.5;
        let warp = 0.25;
        let grey = 0.45;
        const grain = rnd();

        if (mode === "door") {
          sx *= 1 + (rnd() - 0.5) * 0.055;
          sy *= 0.97 + rnd() * 0.05;
          sz *= 0.97 + rnd() * 0.05;
          const bump =
            typeof ringDepthScale === "number" &&
            ringDepthScale > 0 &&
            !Number.isNaN(ringDepthScale)
              ? ringDepthScale
              : 1.09;
          sz *= bump;
          shapeMix = 0.56 + rnd() * 0.07;
          warp = 0.16 + rnd() * 0.2;
          grey = 0.32 + rnd() * 0.34;
          return { sx, sy, sz, shapeMix, warp, grey, grain };
        }

        const u = rnd();
        if (u < 0.12) {
          shapeMix = 0.38;
          sx *= 1.04 + rnd() * 0.1;
          sy *= 0.9 + rnd() * 0.08;
          sz *= 0.93 + rnd() * 0.07;
        } else if (u < 0.22) {
          shapeMix = 0.3;
          sx *= 0.93 + rnd() * 0.08;
          sy *= 0.86 + rnd() * 0.08;
          sz *= 0.91 + rnd() * 0.07;
        } else {
          shapeMix = 0.46 + rnd() * 0.18;
          sx *= 0.94 + rnd() * 0.1;
          sy *= 0.92 + rnd() * 0.09;
          sz *= 0.92 + rnd() * 0.08;
        }
        warp = 0.22 + rnd() * 0.38;
        grey = 0.3 + rnd() * 0.42;
        return { sx, sy, sz, shapeMix, warp, grey, grain };
      }

      function createInstancedBrickGeometry(baseGeo, capacity) {
        const g = baseGeo.clone();
        const arr = new Float32Array(capacity * 4);
        const att = new THREE.InstancedBufferAttribute(arr, 4);
        att.setUsage(THREE.DynamicDrawUsage);
        g.setAttribute("brickVar", att);
        return g;
      }

      /**
       * Path position and height of a pointed-arch apex (where left/right arcs meet).
       * Returns null for round arches or degenerate pointedness.
       */
      function pointedApexPathInfo(rp) {
        if (rp.archShape !== "pointed") return null;
        const k = Number.isFinite(rp.archPointedness)
          ? rp.archPointedness
          : 1.0;
        if (k <= 1e-4) return null;
        const pg = pointedArchGeom(rp.ringRadius, k);
        const Lj = Math.max(1e-6, rp.springY - rp.sillY);
        const alpha = Math.atan2(pg.apexDy, Math.max(1e-6, pg.c));
        const oneArc = pg.r * alpha;
        return { apexX: 0, apexY: rp.springY + pg.apexDy, apexS: Lj + oneArc };
      }

      /** Last voussoir on the left arc and first on the right (meet at the cusp). */
      function pointedApexBrickIndices(nU, alongU, jRing, apexS) {
        let leftI = -1;
        let rightI = -1;
        let bestLeft = Infinity;
        let bestRight = Infinity;
        for (let i = 0; i < nU; i++) {
          const s = jRing * i + alongU * (i + 0.5);
          if (s < apexS - 1e-5) {
            const d = apexS - s;
            if (d < bestLeft) {
              bestLeft = d;
              leftI = i;
            }
          } else if (s > apexS + 1e-5) {
            const d = s - apexS;
            if (d < bestRight) {
              bestRight = d;
              rightI = i;
            }
          }
        }
        return { leftI, rightI };
      }

      function isPointedKeystoneIndex(i, apexIdx) {
        if (!apexIdx) return false;
        return i === apexIdx.leftI || i === apexIdx.rightI;
      }

      /** Extra tangent brick on the cusp (replaced by cusp wedge pair). */
      function skipPointedCuspStraggler(s, apexS, alongU, i, apexIdx) {
        if (!apexIdx || apexIdx.leftI < 0 || apexIdx.rightI < 0) return false;
        if (isPointedKeystoneIndex(i, apexIdx)) return false;
        return Math.abs(s - apexS) < alongU * 0.38;
      }

      /**
       * Triangular cusp voussoir: outer edge follows the intrados up to the apex,
       * inner face on x = 0 (vertical seam where left meets right).
       */
      function createPointedCuspHalfGeometry(
        side,
        xOuter,
        yBottom,
        yTop,
        halfDepth,
      ) {
        const d = Math.max(1e-4, halfDepth);
        const y0 = yBottom;
        const y1 = yTop;
        const xO = xOuter;
        const positions = new Float32Array([
          xO,
          y0,
          +d,
          xO,
          y0,
          -d,
          0,
          y0,
          +d,
          0,
          y0,
          -d,
          0,
          y1,
          +d,
          0,
          y1,
          -d,
        ]);
        const indices =
          side === "left"
            ? new Uint16Array([
                0, 2, 4, 0, 4, 1, 1, 4, 5, 1, 5, 3, 2, 4, 5, 2, 5, 3, 0, 1, 3,
                0, 3, 2,
              ])
            : new Uint16Array([
                0, 4, 2, 0, 1, 4, 1, 5, 4, 1, 3, 5, 2, 5, 4, 2, 3, 5, 0, 3, 1,
                0, 2, 3,
              ]);
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        g.setIndex(new THREE.BufferAttribute(indices, 1));
        g.computeVertexNormals();
        const arr = new Float32Array(4);
        const att = new THREE.InstancedBufferAttribute(arr, 4);
        att.setUsage(THREE.DynamicDrawUsage);
        g.setAttribute("brickVar", att);
        return g;
      }

      function setCuspWedgeBrickVar(mesh, rnd) {
        const grey = 0.45 + rnd() * 0.45;
        setBrickVarAt(mesh, 0, 0.0, 0.7, grey, rnd());
      }

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      async function main() {
        const params = {
          doorInnerHalfW: 1.15,
          masonryShell: 0.42,
          legHeight: 2.35,
          /** Door opening sill (world Y). Gizmo vertical moves this, not the wall stack. */
          sillY: 0.02,
          closeBottom: false,
          brickW: 0.52,
          brickH: 0.38,
          brickD: 0.55,
          brickRound: 0.01,
          spacingMul: 1.02,
          /**
           * bricks-castle–like masonry noise (repeatably seeded via colorSeed).
           * Independent random per axis on scale; small rotation / position slip.
           */
          brickScaleRandomness: 0.26,
          brickRotationVariation: 0.05,
          brickVerticalVariation: 0.065,
          brickPlanarSlop: 0.02,
          /** Cylinder / round gate: in–out radius wobble (world units). */
          brickRadiusVariation: 0.09,
          maxBricks: 2200,
          maxWallBricks: 22000,
          colorSeed: 31415,
          showGrid: true,

          /**
           * "wall" | "tower" | "towerRound" | "bridge" | "house"
           * — house = square shell like tower + two gable ends + pitched brick roof.
           */
          sceneMode: "wall",
          towerHalfWidth: 3.6,
          towerHeight: 10.5,
          towerAnchorY: 0.02,
          /** Which face the gate sits on: 0 +X, 1 −X, 2 +Z, 3 −Z (default 2 = toward camera like wall mode) */
          towerGateFace: 2,
          /** Crenellated merlons at the top (defensive silhouette) */
          towerBattlements: true,
          towerMerlonW: 0.5,
          towerCrenelW: 0.36,
          towerBattlementCourses: 2,
          /** Extra vertical rise for merlon teeth (world units) */
          towerMerlonLift: 0.26,

          /** 0 = gables on ±X (triangular ends); ridge runs along X, slopes in ±Z. 1 = gables on ±Z; ridge along Z, slopes in ±X. */
          houseGableAxis: 1,
          /** World Y from eave line to ridge (controls roof pitch with footprint). */
          houseGableRise: 2.65,
          /** Extra +Y for the ridge only (nudges peak without changing eave). */
          houseRidgeLiftY: 0,
          /** Pulls the eave line down (more rectangular wall below the gable triangle). */
          houseEaveLowerY: 0,
          /** Roof half-run beyond `towerHalfWidth` along the slope horizontal (both halves). */
          houseRoofOverhang: 0.14,
          /** Extra half-length along the ridge line past the wall outline. */
          houseRoofZOverhang: 0.1,
          /** Pitched roof on / off (gable walls unchanged). */
          houseRoofEnabled: true,
          /** "brick" = instanced brick courses; "timber" = ridge + wall plates + rafters (log cylinders). */
          houseRoofKind: "brick",
          /** Mean radius of timber members (world units). */
          houseTimberRadius: 0.09,
          /** Approximate spacing of rafter pairs along the ridge (world units). */
          houseTimberRafterSpacing: 0.52,

          wallEnabled: true,
          wallWidth: 15,
          wallHeight: 6.2,
          wallDepth: 0.62,
          wallZ: -0.22,
          /** Total span along X (three arches + piers) for `sceneMode === "bridge"`. */
          bridgeLength: 34,
          /** Half clear width between inner wall faces (walkable deck in Z). */
          bridgeDeckHalfW: 2.4,
          /** Vertical courses for the flat deck slab (running bond in XZ). */
          bridgeDeckCourses: 4,
          /**
           * Lowers the walkable deck from the pier crown (world +Y). Side walls stay full `wallHeight`;
           * use for parapet / walls above the deck. 0 = deck flush with top courses (current default).
           */
          bridgeDeckDropY: 0,

          wallMortar: 0.011,
          wallSeamInset: 0.038,
          wallEdgeBlendBw: 4.2,
          wallMinBrickScale: 0.26,
          wallCrownSquash: 0.78,
          /** Bottom anchor for wall field courses (world Y); stays fixed when moving the arch vertically. */
          wallAnchorY: 0.02,

          /** Horizontal center of the door opening on the wall (world X). */
          archAlong: 0,
          /** Depth offset of the arch ring mesh along world Z (gizmo blue axis). */
          archAlongZ: 0,
          /**
           * Ring brick depth (local Z scale) vs nominal `brickD`: >1 makes door/window
           * arches sit slightly proud of the wall shell so they read from both sides.
           */
          archRingDepthScale: 1.09,
          showArchGizmo: true,

          /**
           * Arch profile shape — "round" (default, Romanesque semicircle) or "pointed" (Gothic).
           * Round path is the original code; `archPointedness` is only consulted when "pointed".
           */
          archShape: "round",
          /**
           * Pointed-arch arc-center offset c relative to springline half-width R, so c = R * k.
           *   0.4 → drop arch (shallower than equilateral)
           *   1.0 → equilateral (classic Gothic)
           *   1.6 → lancet (tall, narrow)
           */
          archPointedness: 1.0,

          /** Master: falling-brick sim + live erosion slider (no time-based erosion animation). */
          destructionEnabled: false,
          /** "none" | "destruct" — LMB blasts only the mesh you hit (wall vs gate ring). */
          destructionMode: "none",
          removeRadius: 1.05,
          gravity: 18,
          bounce: 0.28,
          angularDamping: 0.985,
          debrisMode: "fade",
          debrisLifetime: 6,
          maxDebrisCount: 800,
          sleepThreshold: 0.42,
          /**
           * When false, blast / collapse debris (falling + settled) is drawn off-screen at tiny scale;
           * physics keeps running. Erosion brick copies and decorative gravel are separate.
           */
          showRubble: true,
          /**
           * Max bricks that may **start** falling from structural collapse in one blast (0 = unlimited,
           * same idea as bricks-castle). Lower values reduce huge chain reactions on intact walls.
           */
          collapseSpreadMax: 0,
          /**
           * 0…1 = fraction of bricks removed **instantly** (top → bottom by world Y), live with the slider.
           * Does not use the physics step; sim can be off. Rebuild resets order / originals.
           */
          erosion: 0,
          /**
           * When true, each brick removed by the erosion slider is drawn again as a full brick instance
           * on the ground (same shape/material/shader variation as LMB debris, but placed at rest — no sim).
           */
          erosionPlaceBrickDebris: true,
          /** Max instanced brick copies for erosion ground debris (performance cap). */
          erosionBrickDebrisMax: 2800,
          /**
           * Optional extra: small decorative gravel instanced as boxes (not the same as brick debris).
           * Off by default; kept for later experiments.
           */
          erosionGroundRubble: false,
          /** Decorative gravel: chunks per hidden brick at erosion = 1 (capped by `erosionRubbleMax`). */
          erosionRubblePerBrick: 2.35,
          /** Decorative gravel: max instanced pieces. */
          erosionRubbleMax: 720,

          /** Directional sun (shadows). Hemisphere sky/ground fill — same idea as bricks-castle3.html */
          sunIntensity: 2.35,
          ambientIntensity: 0.55,
        };

        /** bricks-castle.html–style per-brick layout noise (uses `params`, `rnd` from builders). */
        function applyBrickAxisScaleNoise(tmpO, rnd, doorTight) {
          const r = params.brickScaleRandomness || 0;
          if (r <= 0) return;

        function towerPivotWorldForMode() {
          if (isRoundTower()) return towerRoundPivotWorld();
          return towerPivotWorld();
        }

        function syncRoundTowerGizmoFromPivot() {
          const p = archGizmoWorldPosition(_archGizmoWP);
          const R = Math.max(0.2, params.towerHalfWidth);
          const inset = towerFaceInsetD();
          const th0 = roundTowerGateThetaRad();
          const th = Math.atan2(p.z, p.x);
          let dth = th - th0;
          dth =
            THREE.MathUtils.euclideanModulo(dth + Math.PI, 2 * Math.PI) -
            Math.PI;
          const limA = Math.max(0.12, Math.PI * R * 0.48);
          params.archAlong = THREE.MathUtils.clamp(dth * R, -limA, limA);
          /**
           * Orbit-only coupling: horizontal motion updates azimuth (`archAlong`). Radial depth
           * reads along the **gate outward** direction at that azimuth (not axis distance),
           * so dragging tangent to the tower does not spuriously pump `archAlongZ` like `hypot(x,z)` does.
           */
          const thGate = th0 + params.archAlong / R;
          const erx = Math.cos(thGate);
          const erz = Math.sin(thGate);
          const rProj = p.x * erx + p.z * erz;
          const d = Math.max(0.06, params.brickD * 1.1);
          const limZ = d * 0.65 + 0.5;
          params.archAlongZ = THREE.MathUtils.clamp(
            rProj - (R - inset),
            -limZ,
            limZ,
          );
          params.sillY = THREE.MathUtils.clamp(
            p.y - params.legHeight * 0.35,
            -2,
            24,
          );
        }

        function merlonBaseIntervals(halfT, merlon, crenel, faceIdx, iy) {
          const mw = Math.max(0.14, merlon);
          const cw = Math.max(0.08, crenel);
          const P = mw + cw;
          const out = [];
          const phase = ((faceIdx + (iy % 2)) % 2) * (P * 0.5);
          let u = -halfT + phase;
          const uEnd = halfT + P * 0.25;
          while (u < uEnd) {
            const lo = Math.max(-halfT, u);
            const hi = Math.min(halfT, u + mw);
            if (hi > lo + 1e-4) out.push([lo, hi]);
            u += P;
          }
          return out.length ? out : [[-halfT, halfT]];
        }

        function subtractHolesFromIntervals(intervals, opsFace, yMid, seam) {
          let ivs = intervals;
          for (const op of opsFace) {
            const rp = ringParamsFromOpening(op);
            const openH = wallOpeningHalfX(
              yMid,
              rp.ringRadius,
              op.sillY,
              rp.springY,
              seam,
              rp.archShape,
              rp.archPointedness,
            );
            if (openH <= 1e-5) continue;
            const uHole =
              typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                ? op.uArc
                : op.uCenter;
            /** Round tower: `wallOpeningHalfX` is a flat metric; carve a hair more in arc-length so shell bricks do not bite past the jamb (often worse on one side after stagger). */
            const arcRoundPad =
              params.sceneMode === "towerRound" &&
              typeof op.uArc === "number" &&
              !Number.isNaN(op.uArc)
                ? Math.max(0.05, params.brickW * 0.1)
                : 0;
            const lo = uHole - openH - arcRoundPad;
            const hi = uHole + openH + arcRoundPad;
            const next = [];
            for (const seg of ivs) {
              next.push(...subtractIntervals([seg], lo, hi));
            }
            if (next.length) ivs = next;
          }
          return ivs;
        }

        function brickGeometrySignature() {
          return [
            params.brickW,
            params.brickH,
            params.brickD,
            params.brickRound,
          ].join(",");
        }
        let lastBrickGeometrySignature = "";

        function disposeDoorWallMeshesOnly() {
          destructBricks.length = 0;
          towerDoorMeshes.forEach((m) => {
            scene.remove(m);
            if (m.geometry) m.geometry.dispose();
          });
          towerDoorMeshes = [];
          bridgeArchMeshes.forEach((m) => {
            scene.remove(m);
            if (m.geometry) m.geometry.dispose();
          });
          bridgeArchMeshes = [];
          if (doorMesh) {
            scene.remove(doorMesh);
            if (doorMesh.geometry) doorMesh.geometry.dispose();
            doorMesh = null;
          }
          doorCuspMeshes.forEach((m) => {
            scene.remove(m);
            if (m.geometry) m.geometry.dispose();

          doorCuspMeshes = [];
          if (wallMesh) {
            scene.remove(wallMesh);
            if (wallMesh.geometry) wallMesh.geometry.dispose();
            wallMesh = null;

          houseTimberMeshes.forEach((m) => {

        function disposeErosionBrickDebrisMesh() {

        function getDestructMeshes() {
          const out = [];
          if (wallMesh && wallMesh.count > 0) out.push(wallMesh);
          if (doorMesh && doorMesh.count > 0) out.push(doorMesh);
          for (const m of towerDoorMeshes) {
            if (m && m.count > 0) out.push(m);
          }
          for (const m of bridgeArchMeshes) {
            if (m && m.count > 0) out.push(m);
          }
          return out;
        }

        /** Wall-field door ring or tower gate instanced meshes (not the masonry shell). */
        function isArchRingInstancedMesh(mesh) {
          if (!mesh) return false;
          if (doorMesh && mesh === doorMesh) return true;
          if (towerDoorMeshes.includes(mesh)) return true;
          return bridgeArchMeshes.includes(mesh);
        }

        function markDestructMeshesDirty() {

        /** Instance matrix from CPU state (local space). */
        function composeBrickInstanceMatrix(b, outMat) {

            _dEul.set(b.rotation.x, b.rotation.y, b.rotation.z, "XYZ"),
          );
          outMat.compose(b.position, _dQuat, b.scale);

        /** Brick center in world space (accounts for mesh pose + instance R/T/S). */

        function syncWorldPosToLocalBrick(mesh, worldPos, outLocal) {
          _invMeshW.copy(mesh.matrixWorld).invert();
          outLocal.copy(worldPos).applyMatrix4(_invMeshW);

        function rebuildDestructRegistry() {
          destructBricks.length = 0;
          debrisSleepCounter = 0;
          erosionOrderBricks = [];
          for (const mesh of getDestructMeshes()) {
            const n = mesh.count;
            for (let i = 0; i < n; i++) {
              mesh.getMatrixAt(i, _dMat);
              _dMat.decompose(_dPos, _dQuat, _dScl);
              if (_dScl.x < 0.02) continue;
              _dEul.setFromQuaternion(_dQuat, "XYZ");
              destructBricks.push({
                mesh,
                index: i,
                position: new THREE.Vector3().copy(_dPos),
                velocity: new THREE.Vector3(),
                angularVelocity: new THREE.Vector3(),
                rotation: new THREE.Vector3(_dEul.x, _dEul.y, _dEul.z),
                scale: new THREE.Vector3().copy(_dScl),
                origPosition: new THREE.Vector3().copy(_dPos),
                origRotation: new THREE.Vector3(_dEul.x, _dEul.y, _dEul.z),
                origScale: new THREE.Vector3().copy(_dScl),
                userBlast: false,
                erosionHidden: false,

                removed: false,
                hidden: false,
                sleeping: false,
                sleepOrder: 0,
                ttl: params.debrisLifetime,

          erosionOrderBricks = destructBricks.slice();
          for (const m of getDestructMeshes()) {
            m.updateMatrixWorld(true);

            brickWorldPosition(a, _wmPos);
            brickWorldPosition(z, _wmPos2);
            return _wmPos2.y - _wmPos.y;
          });
          applyLiveErosionFromSlider();
        }

        /**
         * Slider `params.erosion` in [0,1]: instant hide of the highest bricks (no blast / collapse / frame animation).
         * Bricks removed by LMB (`userBlast`) are left alone. Dragging down restores erosion-only bricks.
         */
        function applyLiveErosionFromSlider() {
          if (!erosionOrderBricks.length) {
            syncErosionBrickDebrisOnGround();
            syncErosionGroundRubble();
            return;
          }
          const frac = THREE.MathUtils.clamp(params.erosion, 0, 1);
          const n = erosionOrderBricks.length;
          const target = Math.round(frac * n);
          for (let i = 0; i < n; i++) {
            const b = erosionOrderBricks[i];
            if (b.userBlast) continue;
            if (i < target) {
              if (!b.erosionHidden && !b.falling) {
                b.removed = true;
                b.falling = false;
                b.erosionHidden = true;
                hideDestructEntry(b);
              }
            } else if (b.erosionHidden) {
              b.position.copy(b.origPosition);
              b.rotation.copy(b.origRotation);
              b.scale.copy(b.origScale);
              b.removed = false;
              b.hidden = false;
              b.erosionHidden = false;
              b.velocity.set(0, 0, 0);
              b.angularVelocity.set(0, 0, 0);
              b.sleeping = false;
              b.sleepOrder = 0;
              b.ttl = params.debrisLifetime;
              composeBrickInstanceMatrix(b, _instLocal);
              b.mesh.setMatrixAt(b.index, _instLocal);
            }
          }
          markDestructMeshesDirty();
          syncErosionBrickDebrisOnGround();
          syncErosionGroundRubble();
        }

        function hideDestructEntry(b) {
          b.hidden = true;
          b.falling = false;
          b.sleeping = false;
          b.sleepOrder = 0;
          b.ttl = 0;
          _destructObj.position.set(0, -9999, 0);
          _destructObj.rotation.set(0, 0, 0);
          _destructObj.scale.set(0.001, 0.001, 0.001);
          _destructObj.updateMatrix();
          b.mesh.setMatrixAt(b.index, _destructObj.matrix);
        }

        /** Visual-only hide for debris when `showRubble` is off (does not set `b.hidden`). */
        function writeRubbleHiddenMatrix(b) {
          _destructObj.position.set(0, -9999, 0);
          _destructObj.rotation.set(0, 0, 0);
          _destructObj.scale.set(0.001, 0.001, 0.001);
          _destructObj.updateMatrix();
          b.mesh.setMatrixAt(b.index, _destructObj.matrix);
        }

        function isPhysicalDebrisBrick(b) {
          return (
            b.removed &&
            !b.erosionHidden &&
            !b.hidden &&
            (b.falling || b.sleeping)
          );
        }

        function refreshRubbleMatrices() {
          if (!destructBricks.length) return;
          let updatedAny = false;
          for (const b of destructBricks) {
            if (!isPhysicalDebrisBrick(b)) continue;
            if (params.showRubble) {
              composeBrickInstanceMatrix(b, _instLocal);
              b.mesh.setMatrixAt(b.index, _instLocal);
            } else {
              writeRubbleHiddenMatrix(b);
            }
            updatedAny = true;
          }
          if (updatedAny) markDestructMeshesDirty();
        }

        const EROSION_RUBBLE_MESH_CAP = 1400;

        function getErosionRubbleSpreadWorld() {
          const gy = ground ? ground.position.y : 0;
          const y = gy + Math.max(0.015, params.brickH * 0.07);
          if (isTowerLike()) {
            const R = Math.max(0.45, params.towerHalfWidth) + 1.15;
            return { mode: "disk", cx: 0, cz: 0, R, y };
          }
          return {
            mode: "box",
            cx: params.archAlong,
            cz: params.wallZ,
            halfWx: Math.max(1.1, params.wallWidth * 0.5 + params.brickW * 1.1),
            halfZ: isBridge()
              ? Math.max(
                  1.0,
                  params.bridgeDeckHalfW +
                    params.wallDepth * 1.25 +
                    params.brickD * 1.1,
                )
              : Math.max(
                  0.55,
                  params.wallDepth * 0.5 +
                    Math.abs(params.wallZ) * 0.35 +
                    params.brickD * 0.75,
                ),
            y,
          };
        }

        function ensureErosionRubbleMesh() {
          if (erosionRubbleMesh) return;
          ensureBrickMaterial();
          if (!brickMat) return;
          const rubbleBox = new THREE.BoxGeometry(0.26, 0.19, 0.24);
          const g = createInstancedBrickGeometry(
            rubbleBox,
            EROSION_RUBBLE_MESH_CAP,
          );
          erosionRubbleMesh = new THREE.InstancedMesh(
            g,
            brickMat,
            EROSION_RUBBLE_MESH_CAP,
          );
          erosionRubbleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          erosionRubbleMesh.castShadow = true;
          erosionRubbleMesh.receiveShadow = true;
          erosionRubbleMesh.count = 0;
          erosionRubbleMesh.name = "erosionGroundRubble";
          scene.add(erosionRubbleMesh);
        }

        /**
         * Decorative ground rubble count/poses from erosion slider (deterministic per index).
         * No CPU physics; same brick material as masonry.
         */
        function syncErosionGroundRubble() {
          if (!params.erosionGroundRubble || !erosionOrderBricks.length) {
            if (erosionRubbleMesh) {
              erosionRubbleMesh.count = 0;
              erosionRubbleMesh.visible = false;
            }
            return;
          }
          const frac = THREE.MathUtils.clamp(params.erosion, 0, 1);
          const n = erosionOrderBricks.length;
          const capCount = THREE.MathUtils.clamp(
            Math.round(params.erosionRubbleMax) || 720,
            1,
            EROSION_RUBBLE_MESH_CAP,
          );
          let count = Math.round(frac * n * params.erosionRubblePerBrick);
          count = Math.min(count, capCount);
          if (frac > 1e-6 && count < 1) count = 1;
          if (frac < 1e-6) count = 0;
          if (count < 1) {
            if (erosionRubbleMesh) {
              erosionRubbleMesh.count = 0;
              erosionRubbleMesh.visible = false;
            }
            return;
          }
          ensureBrickMaterial();
          ensureErosionRubbleMesh();
          if (!erosionRubbleMesh) return;
          const spread = getErosionRubbleSpreadWorld();
          for (let k = 0; k < count; k++) {
            const rnd = mulberry32(
              ((params.colorSeed ^ 0x9e3779b9) >>> 0) + k * 2654435761,
            );
            let x;
            let z;
            if (spread.mode === "disk") {
              const u = rnd() * Math.PI * 2;
              const r = Math.sqrt(rnd()) * spread.R;
              x = spread.cx + Math.cos(u) * r;
              z = spread.cz + Math.sin(u) * r;
            } else {
              x = spread.cx + (rnd() * 2 - 1) * spread.halfWx;
              z = spread.cz + (rnd() * 2 - 1) * spread.halfZ;
            }
            const y = spread.y + (rnd() - 0.5) * 0.05;
            tmpO.position.set(x, y, z);
            tmpO.rotation.set(
              (rnd() - 0.5) * 0.85,
              rnd() * Math.PI * 2,
              (rnd() - 0.5) * 0.85,
            );
            const s = params.brickW * (0.2 + rnd() * 0.38);
            tmpO.scale.set(
              s * (0.82 + rnd() * 0.36),
              s * (0.5 + rnd() * 0.42),
              s * (0.78 + rnd() * 0.34),
            );
            tmpO.updateMatrix();
            erosionRubbleMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(
              erosionRubbleMesh,
              k,
              rnd() * 0.38 + 0.18,
              0.22 + rnd() * 0.42,
              0.28 + rnd() * 0.52,
              rnd(),
            );
          }
          erosionRubbleMesh.count = count;
          erosionRubbleMesh.visible = true;
          erosionRubbleMesh.instanceMatrix.needsUpdate = true;
          const bv = erosionRubbleMesh.geometry.getAttribute("brickVar");
          if (bv) bv.needsUpdate = true;
        }

        const EROSION_BRICK_DEBRIS_CAP = 8000;

        function erosionBrickDebrisMeshTag(b) {
          if (b.mesh === wallMesh) return 1;
          if (b.mesh === doorMesh) return 2;
          let ti = towerDoorMeshes.indexOf(b.mesh);
          if (ti >= 0) return 20 + ti;
          ti = bridgeArchMeshes.indexOf(b.mesh);
          return 40 + (ti >= 0 ? ti : 0);
        }

        function ensureErosionBrickDebrisMesh() {
          if (erosionBrickDebrisMesh) return;
          ensureBrickMaterial();
          ensureBrickGeometry(false);
          if (!brickGeo || !brickMat) return;
          const g = createInstancedBrickGeometry(
            brickGeo,
            EROSION_BRICK_DEBRIS_CAP,
          );
          erosionBrickDebrisMesh = new THREE.InstancedMesh(
            g,
            brickMat,
            EROSION_BRICK_DEBRIS_CAP,
          );
          erosionBrickDebrisMesh.instanceMatrix.setUsage(
            THREE.DynamicDrawUsage,
          );
          erosionBrickDebrisMesh.castShadow = true;
          erosionBrickDebrisMesh.receiveShadow = true;
          erosionBrickDebrisMesh.count = 0;
          erosionBrickDebrisMesh.name = "erosionBrickDebris";
          scene.add(erosionBrickDebrisMesh);
        }

        /**
         * Full-brick copies on the ground for erosion-hidden bricks (same geometry/material/brickVar
         * as the source instance; tumbled pose + XZ jitter; no physics).
         */
        function syncErosionBrickDebrisOnGround() {
          if (!params.erosionPlaceBrickDebris || !erosionOrderBricks.length) {
            if (erosionBrickDebrisMesh) {
              erosionBrickDebrisMesh.count = 0;
              erosionBrickDebrisMesh.visible = false;
            }
            return;
          }
          const list = [];
          for (const b of erosionOrderBricks) {
            if (!b.erosionHidden || b.userBlast) continue;
            list.push(b);
          }
          const capCount = THREE.MathUtils.clamp(
            Math.round(params.erosionBrickDebrisMax) || 2800,
            1,
            EROSION_BRICK_DEBRIS_CAP,
          );
          const show = list.slice(0, capCount);
          if (show.length === 0) {
            if (erosionBrickDebrisMesh) {
              erosionBrickDebrisMesh.count = 0;
              erosionBrickDebrisMesh.visible = false;
            }
            return;
          }
          ensureBrickMaterial();
          ensureBrickGeometry(false);
          ensureErosionBrickDebrisMesh();
          if (!erosionBrickDebrisMesh) return;
          const gy = ground ? ground.position.y : 0;
          for (let k = 0; k < show.length; k++) {
            const b = show[k];
            b.mesh.updateMatrixWorld(true);
            composeBrickInstanceMatrix(b, _instLocal);
            _tmpBasisBrick.copy(b.mesh.matrixWorld).multiply(_instLocal);
            _tmpBasisBrick.decompose(_dPos, _dQuat, _dScl);
            const srcY = _dPos.y;
            const rnd = mulberry32(
              (((params.colorSeed ^ 0x3c6ef372) >>> 0) +
                b.index * 1103515245 +
                erosionBrickDebrisMeshTag(b) * 524287 +
                k * 131071) >>>
                0,
            );
            const fallDist = Math.max(0.08, srcY - gy);
            /** Mimic LMB fallout: wider spread, farther for higher bricks, roll-out from façade / tower. */
            const baseR =
              params.brickW * (0.55 + rnd() * 1.15) +
              fallDist * (0.38 + rnd() * 0.52);
            const capR = isTowerLike()
              ? params.towerHalfWidth * 1.35 + params.brickW * 2.2
              : Math.max(
                  params.wallWidth * 0.52,
                  params.brickW * 8 + params.wallDepth * 3,
                );
            const scatterR = Math.min(
              capR,
              baseR + rnd() * params.brickW * 1.8,
            );
            const ang = rnd() * Math.PI * 2;
            const rad = Math.sqrt(rnd()) * scatterR;
            _dPos.x += Math.cos(ang) * rad;
            _dPos.z += Math.sin(ang) * rad;
            if (!isTowerLike()) {
              _dPos.z += (rnd() - 0.22) * params.brickD * (1.15 + rnd() * 1.85);
              _dPos.x += (rnd() - 0.5) * params.brickW * (0.65 + rnd() * 1.45);
            } else {
              const cx = _dPos.x;
              const cz = _dPos.z;
              const len = Math.hypot(cx, cz) + 1e-4;
              const push =
                rnd() * (params.towerHalfWidth * 0.42 + params.brickW * 1.2);
              _dPos.x += (cx / len) * push * (0.45 + rnd());
              _dPos.z += (cz / len) * push * (0.45 + rnd());
            }
            _dPos.x += (rnd() - 0.5) * params.brickW * 0.55;
            _dPos.z += (rnd() - 0.5) * params.brickD * 0.55;
            const halfH = params.brickH * 0.5 * Math.abs(_dScl.y);
            _dPos.y = gy + halfH + 0.012 + (rnd() - 0.5) * params.brickH * 0.06;
            _layoutEuler.setFromQuaternion(_dQuat, "XYZ");
            _layoutEuler.x += (rnd() - 0.5) * 1.05;
            _layoutEuler.y += (rnd() - 0.5) * 1.12;
            _layoutEuler.z += (rnd() - 0.5) * 1.05;
            if (rnd() > 0.38) {
              _layoutEuler.x += (rnd() - 0.5) * 0.55;
              _layoutEuler.z += (rnd() - 0.5) * 0.55;
            }
            _dQuat.setFromEuler(_layoutEuler);
            _instLocal.compose(_dPos, _dQuat, _dScl);
            erosionBrickDebrisMesh.setMatrixAt(k, _instLocal);
            const att = b.mesh.geometry.getAttribute("brickVar");
            if (att && att.array) {
              const o = b.index * 4;
              const a = att.array;
              setBrickVarAt(
                erosionBrickDebrisMesh,
                k,
                a[o],
                a[o + 1],
                a[o + 2],
                a[o + 3],
              );
            } else {
              setBrickVarAt(erosionBrickDebrisMesh, k, 0.5, 0.28, 0.4, 0.5);
            }
          }
          erosionBrickDebrisMesh.count = show.length;
          erosionBrickDebrisMesh.visible = true;
          erosionBrickDebrisMesh.instanceMatrix.needsUpdate = true;
          const bvb = erosionBrickDebrisMesh.geometry.getAttribute("brickVar");
          if (bvb) bvb.needsUpdate = true;
        }

        /**
         * `hitPointWorld`: world-space point (bricks-castle uses the struck brick center).
         * `b.velocity` is integrated in **world** space; `b.position` stays instance-local.
         */
        function startFallEntry(b, hitPointWorld, fromUserBlast = false) {
          if (!b || b.hidden || b.falling) return;
          if (fromUserBlast) b.userBlast = true;
          b.removed = true;
          brickWorldPosition(b, _wmPos2);
          _dTmp.subVectors(_wmPos2, hitPointWorld);
          if (_dTmp.lengthSq() < 1e-6) {
            _dTmp.set(
              (Math.random() - 0.5) * 0.3,
              0,
              (Math.random() - 0.5) * 0.3,
            );
          } else {
            _dTmp.normalize();
          }
          const push = 2.6 + Math.random() * 1.8;
          b.velocity.set(
            _dTmp.x * push,
            2.5 + Math.random() * 2.2,
            _dTmp.z * push,
          );
          b.angularVelocity.set(
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6,
          );
          b.falling = true;
          b.sleeping = false;
          b.hidden = false;
          b.ttl = params.debrisLifetime;
        }

        /**
         * Geometry-based support (running-bond walls are not on an integer lattice).
         * Uses world-space centers + a coarse 3D hash like ring adjacency in bricks-castle.
         *
         * bricks-castle runs this until nothing changes (no per-click cap). Optional
         * `maxCollapseStarts` limits extra falls for performance / artistic control only.
         *
         * @param {THREE.Object3D|null} meshScope - If set, only bricks on this instanced mesh
         *   participate. Arch rings are handled separately (no collapse).
         * @param {number|null} maxCollapseStarts - cap on collapse-triggered falls; null = unlimited.
         */
        function triggerStructuralCollapseShowcase(
          meshScope = null,
          maxCollapseStarts = null,
        ) {
          const groundY = ground ? ground.position.y : 0;
          const floorYW = groundY + params.brickH * 0.58;
          const rowH =
            params.brickH + Math.max(0.006, params.wallMortar || 0.012);
          const maxDy = rowH * 1.55;
          const minDy = 0.025;
          const horizR = Math.max(params.brickW, params.brickD) * 1.15;
          const cellXZ = Math.max(0.07, params.brickW * 0.45);
          const cellY = Math.max(0.07, rowH * 0.52);
          const hashRangeXZ = Math.ceil(horizR / cellXZ) + 1;

          let collapseStarts = 0;
          let changed = true;
          let guard = 0;
          while (changed && guard++ < 160) {
            changed = false;
            if (
              maxCollapseStarts != null &&
              collapseStarts >= maxCollapseStarts
            ) {
              break;
            }
            const stable = [];
            for (const b of destructBricks) {
              if (meshScope != null && b.mesh !== meshScope) continue;
              if (b.removed || b.falling || b.hidden) continue;
              stable.push(b);
            }
            const hash = new Map();
            for (const b of stable) {
              brickWorldPosition(b, _wmPos2);
              const ix = Math.floor(_wmPos2.x / cellXZ);
              const iy = Math.floor(_wmPos2.y / cellY);
              const iz = Math.floor(_wmPos2.z / cellXZ);
              const key = `${ix}|${iy}|${iz}`;
              let bucket = hash.get(key);
              if (!bucket) {
                bucket = [];
                hash.set(key, bucket);
              }
              bucket.push(b);
            }
            for (const b of stable) {
              if (
                maxCollapseStarts != null &&
                collapseStarts >= maxCollapseStarts
              ) {
                break;
              }
              brickWorldPosition(b, _wmPos2);
              if (_wmPos2.y <= floorYW) continue;
              let ok = false;
              const ix0 = Math.floor(_wmPos2.x / cellXZ);
              const iy0 = Math.floor(_wmPos2.y / cellY);
              const iz0 = Math.floor(_wmPos2.z / cellXZ);
              outer: for (let diy = -4; diy <= -1; diy++) {
                for (let dix = -hashRangeXZ; dix <= hashRangeXZ; dix++) {
                  for (let diz = -hashRangeXZ; diz <= hashRangeXZ; diz++) {
                    const bucket = hash.get(
                      `${ix0 + dix}|${iy0 + diy}|${iz0 + diz}`,
                    );
                    if (!bucket) continue;
                    for (const o of bucket) {
                      if (o === b) continue;
                      if (o.removed || o.falling || o.hidden) continue;
                      brickWorldPosition(o, _wmPos);
                      const dy = _wmPos2.y - _wmPos.y;
                      if (dy < minDy || dy > maxDy) continue;
                      const dx = _wmPos2.x - _wmPos.x;
                      const dz = _wmPos2.z - _wmPos.z;
                      if (dx * dx + dz * dz <= horizR * horizR) {
                        ok = true;
                        break outer;
                      }
                    }
                  }
                }
              }
              if (!ok) {
                if (
                  maxCollapseStarts != null &&
                  collapseStarts >= maxCollapseStarts
                ) {
                  continue;
                }
                startFallEntry(b, _wmPos2);
                collapseStarts++;
                changed = true;
              }
            }
          }
          markDestructMeshesDirty();
        }

        /**
         * @param {THREE.Object3D|null} blastMeshFilter - if set, only instances on this mesh
         *   are removed in the blast (avoids wrecking the arch ring when you hit the field wall).
         *   Structural collapse runs on masonry shells only. Arch rings skip collapse: the
         *   vertical “support from below” test does not fit voussoirs, so one hole would delete
         *   the whole gate regardless of blast radius.
         */
        function applyImpactAtPoint(hitPointWorld, blastMeshFilter = null) {
          let any = false;
          for (const b of destructBricks) {
            if (blastMeshFilter != null && b.mesh !== blastMeshFilter) continue;
            if (b.removed || b.falling || b.hidden) continue;
            brickWorldPosition(b, _wmPos2);
            if (_wmPos2.distanceTo(hitPointWorld) < params.removeRadius) {
              startFallEntry(b, hitPointWorld, true);
              any = true;
            }
          }
          if (any) {
            if (
              blastMeshFilter == null ||
              !isArchRingInstancedMesh(blastMeshFilter)
            ) {
              /** null = bricks-castle style (run until stable). >0 caps collapse-initiated falls per blast. */
              const cap =
                params.collapseSpreadMax > 0
                  ? Math.round(params.collapseSpreadMax)
                  : null;
              triggerStructuralCollapseShowcase(blastMeshFilter, cap);
            } else {
              markDestructMeshesDirty();
            }
          }
        }

        function enforceDestructDebrisLimit() {
          if (params.debrisMode !== "keep") return;
          const sleeping = [];
          for (const b of destructBricks) {
            if (b.sleeping && !b.hidden) {
              sleeping.push({ b, order: b.sleepOrder });
            }
          }
          if (sleeping.length <= params.maxDebrisCount) return;
          sleeping.sort((a, z) => a.order - z.order);
          const overflow = sleeping.length - params.maxDebrisCount;
          for (let i = 0; i < overflow; i++) {
            hideDestructEntry(sleeping[i].b);
          }
          markDestructMeshesDirty();
        }

        function updateFallingDestruct(dt) {
          const groundY = ground ? ground.position.y : 0;
          const minYWorld = groundY + params.brickH * 0.45;
          let updatedAny = false;
          for (const b of destructBricks) {
            if (!b.falling || b.hidden) continue;
            b.mesh.updateMatrixWorld(true);
            b.velocity.y -= params.gravity * dt;
            brickWorldPosition(b, _wmPos);
            _wmPos.addScaledVector(b.velocity, dt);
            syncWorldPosToLocalBrick(b.mesh, _wmPos, b.position);
            b.rotation.x += b.angularVelocity.x * dt;
            b.rotation.y += b.angularVelocity.y * dt;
            b.rotation.z += b.angularVelocity.z * dt;
            _dTmp2
              .copy(b.angularVelocity)
              .multiplyScalar(params.angularDamping);
            b.angularVelocity.copy(_dTmp2);
            brickWorldPosition(b, _wmPos);
            if (_wmPos.y < minYWorld) {
              syncWorldPosToLocalBrick(
                b.mesh,
                _wmPos.set(_wmPos.x, minYWorld, _wmPos.z),
                b.position,
              );
              if (Math.abs(b.velocity.y) > 0.5) {
                b.velocity.y = -b.velocity.y * params.bounce;
                b.velocity.x *= 0.86;
                b.velocity.z *= 0.86;
              } else {
                b.velocity.y = 0;
                b.velocity.x *= 0.9;
                b.velocity.z *= 0.9;
              }
              const horizontalSpeed = Math.hypot(b.velocity.x, b.velocity.z);
              const speed = Math.hypot(horizontalSpeed, b.velocity.y);
              if (speed < params.sleepThreshold) {
                b.velocity.set(0, 0, 0);
                b.angularVelocity.set(0, 0, 0);
                b.falling = false;
                b.sleeping = true;
                b.sleepOrder = ++debrisSleepCounter;
              }
            }
            if (b.falling) {
              b.ttl -= dt;
              if (
                _wmPos.y < groundY - 8 ||
                (params.debrisMode === "fade" && b.ttl <= 0)
              ) {
                hideDestructEntry(b);
                updatedAny = true;
                continue;
              }
            }
            composeBrickInstanceMatrix(b, _instLocal);
            if (!params.showRubble && isPhysicalDebrisBrick(b)) {
              writeRubbleHiddenMatrix(b);
            } else {
              b.mesh.setMatrixAt(b.index, _instLocal);
            }
            updatedAny = true;
          }
          if (!params.showRubble) {
            for (const b of destructBricks) {
              if (!b.sleeping || b.hidden) continue;
              if (!isPhysicalDebrisBrick(b)) continue;
              writeRubbleHiddenMatrix(b);
              updatedAny = true;
            }
          }
          if (updatedAny) markDestructMeshesDirty();
          enforceDestructDebrisLimit();
        }

        function ensureBrickMaterial() {
          if (!brickMat) {
            const brickVarA = attribute("brickVar", "vec4");
            const shapeM = brickVarA.x;
            const warpS = brickVarA.y;
            const greyK = brickVarA.z;
            const grain = brickVarA.w;

            brickMat = new THREE.MeshStandardNodeMaterial({
              metalness: 0.015,
            });

            brickMat.colorNode = Fn(() => {
              const pw = positionWorld;
              const seed = grain.mul(6.283).add(greyK.mul(12.7));
              const p1 = pw
                .mul(1.05)
                .add(vec3(seed, seed.mul(0.71), seed.mul(0.53)));
              const p2 = pw
                .mul(2.35)
                .add(vec3(seed.mul(1.3), seed.mul(0.9), seed.mul(1.1)));
              const p3 = pw
                .mul(5.1)
                .add(vec3(seed.mul(2.1), seed, seed.mul(1.7)));
              const w1 = sin(dot(p1, vec3(1.7, 2.3, 1.9)))
                .mul(0.5)
                .add(0.5);
              const w2 = sin(dot(p2, vec3(2.2, 1.4, 2.6)))
                .mul(0.5)
                .add(0.5);
              const w3 = sin(dot(p3, vec3(1.5, 2.8, 2.1)))
                .mul(0.5)
                .add(0.5);
              const fbm = w1.mul(0.52).add(w2.mul(0.32)).add(w3.mul(0.16));
              const streak = sin(
                pw.x
                  .mul(2.8)
                  .add(pw.y.mul(4.2))
                  .add(pw.z.mul(1.6))
                  .add(grain.mul(24)),
              )
                .mul(0.5)
                .add(0.5);

              const dark = mix(color(0x1a1c20), color(0x2e3138), greyK);
              const mid = mix(
                color(0x42454c),
                color(0x565a62),
                pow(greyK, float(0.9)),
              );
              const light = mix(
                color(0x65696f),
                color(0x82868e),
                smoothstep(0.1, 0.9, greyK),
              );
              const body0 = mix(dark, mix(mid, light, greyK), float(0.58));
              const stain = smoothstep(float(0.22), float(0.78), fbm);
              const body1 = mul(body0, mix(float(0.86), float(1.06), stain));
              const warm = mix(color(0x5c5248), color(0x6a6056), streak);
              const body2 = mix(
                body1,
                mul(body1, warm),
                float(0.07).mul(smoothstep(0.35, 0.72, streak)),
              );
              const moss = smoothstep(float(0.62), float(0.94), w2.mul(w3));
              const body3 = mix(
                body2,
                mul(body2, color(0x9aa898)),
                moss.mul(0.045).mul(warpS.mul(0.4).add(0.6)),
              );

              const speck = fract(
                sin(dot(pw.xz, vec2(12.9898, 78.233))).mul(43758.5453),
              );
              const freckle = smoothstep(float(0.72), float(0.96), speck).mul(
                0.11,
              );
              const baseCol = mul(body3, sub(float(1), freckle));
              const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
              const coolShade = mix(
                float(0.66),
                float(1.06),
                nd.mul(0.6).add(0.4),
              );
              const ax = abs(normalWorld.x);
              const ay = abs(normalWorld.y);
              const az = abs(normalWorld.z);
              const edgeFac = pow(max(ax, max(ay, az)), float(2.35));
              const edgeLift = mix(float(1), float(1.1), edgeFac.mul(0.38));
              const edgeCool = mix(float(1), float(0.94), edgeFac.mul(0.12));
              const shapeTone = mix(
                float(0.96),
                float(1.04),
                shapeM.mul(0.35).add(0.65),
              );
              return mul(
                mul(mul(mul(baseCol, coolShade), edgeLift), edgeCool),
                shapeTone,
              );
            })();

            brickMat.roughnessNode = Fn(() => {
              const pw = positionWorld
                .mul(2.4)
                .add(vec3(grain.mul(9), greyK.mul(6), shapeM.mul(3)));
              const pit = sin(dot(pw, vec3(2.1, 1.7, 2.4)))
                .mul(0.5)
                .add(0.5);
              const pit2 = sin(dot(pw.mul(1.7), vec3(1.6, 2.2, 1.9)))
                .mul(0.5)
                .add(0.5);
              const microRough = pit.mul(0.55).add(pit2.mul(0.45));
              const baseR = mix(
                float(0.82),
                float(0.97),
                greyK.mul(0.38).add(grain.mul(0.24)),
              );
              return clamp(
                baseR.add(microRough.mul(0.07)),
                float(0.44),
                float(0.995),
              );
            })();

            brickMat.emissiveNode = Fn(() => {
              const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
              const rim = pow(
                sub(float(1), abs(dot(normalWorld, vec3(0, 1, 0)))),
                float(2.15),
              );
              const g0 = mix(color(0x4a4d52), color(0x686c72), nd);
              return mul(g0, mul(rim, float(0.032))).mul(
                warpS.mul(0.55).add(0.45),
              );
            })();

            brickMat.positionNode = Fn(() => {
              const pl = positionLocal;
              const nl = normalLocal;
              const ax = abs(pl.x);
              const ay = abs(pl.y);
              const az = abs(pl.z);
              const mn = min(ax, min(ay, az));
              const mx = max(ax, max(ay, az));
              const edgeShell = smoothstep(float(0.14), float(0.44), mx);
              const cornerBand = smoothstep(float(0.022), float(0.095), mn).mul(
                smoothstep(float(0.33), float(0.48), mx),
              );
              const plLen = length(pl);
              const cenW = smoothstep(float(0.01), float(0.05), plLen);

              const wv = warpS.mul(shapeM.mul(0.55).add(0.45));
              const bump = sin(
                pl.x
                  .mul(11)
                  .add(pl.y.mul(9))
                  .add(pl.z.mul(7))
                  .add(grain.mul(40)),
              )
                .mul(0.5)
                .add(0.5);
              const amp = float(0.017)
                .mul(edgeShell)
                .mul(wv)
                .mul(mix(float(0.65), float(1.15), bump))
                .mul(cenW);

              const chipPick = fract(
                grain.mul(47.13).add(greyK.mul(91.7)).add(shapeM.mul(23.1)),
              );
              const chipMask = smoothstep(float(0.84), float(0.96), chipPick)
                .mul(cornerBand)
                .mul(edgeShell)
                .mul(cenW);
              const chipMag = float(0.012)
                .mul(chipMask)
                .mul(warpS.mul(0.42).add(0.58));
              const rlen = max(length(pl), float(1e-5));
              const radial = normalize(div(pl, rlen));
              const chip = mul(radial, float(-1)).mul(chipMag);

              return positionLocal.add(nl.mul(amp)).add(chip);
            })();
          }
        }

        function ensureTimberMaterial() {
          if (timberMat) return;
          timberMat = new THREE.MeshStandardNodeMaterial({
            metalness: 0.05,
            roughness: 0.9,
          });
          timberMat.colorNode = Fn(() => {
            const pw = positionWorld;
            const ring = sin(pw.y.mul(36).add(pw.x.mul(5.5)).add(pw.z.mul(2.8)))
              .mul(0.5)
              .add(0.5);
            const grain = sin(dot(pw, vec3(11.3, 19.1, 7.6)))
              .mul(0.5)
              .add(0.5);
            const c0 = color(0x4a3728);
            const c1 = color(0x7a5c42);
            const c2 = color(0x5d4633);
            const c = mix(mix(c0, c1, ring), c2, grain.mul(0.38));
            const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
            return mul(c, mix(float(0.7), float(1.04), nd.mul(0.6).add(0.2)));
          })();
        }

        function ensureBrickGeometry(force) {
          const sig = brickGeometrySignature();
          if (!force && brickGeo && sig === lastBrickGeometrySignature) {
            return;
          }
          if (brickGeo) {
            brickGeo.dispose();
            brickGeo = null;
          }
          const rRound = Math.max(0.0001, params.brickRound);
          brickGeo = new RoundedBoxGeometry(
            params.brickW,
            params.brickH,
            params.brickD,
            2,
            rRound,
          );
          lastBrickGeometrySignature = sig;
        }

        /** Rebuild door + wall instances. If `remakeGeometry` is true, also rebuild shared brick geometry. */
        function rebuildInstances(remakeGeometry) {
          disposeDoorWallMeshesOnly();
          ensureBrickMaterial();
          ensureBrickGeometry(!!remakeGeometry);
          clampArchAlong();
          clampArchAlongZ();
          clampDoorSillInWall();
          if (isDraggingArchGizmo && archPivot) {
            resetArchGizmoTargetOffset();
            if (isTowerLike()) {
              archPivot.position.copy(towerPivotWorldForMode());
            } else {
              archPivot.position.x = params.archAlong;
              archPivot.position.y = params.sillY + params.legHeight * 0.35;
              archPivot.position.z = params.archAlongZ;
            }
          }
          buildDoorInstances();
          buildWallInstances();
          if (!isDraggingArchGizmo) updateArchGizmoFromParams();
          if (isTowerLike()) {
            let ty = params.towerAnchorY + params.towerHeight * 0.42;
            if (isHouse()) {
              const wb = params.towerAnchorY;
              const eY =
                wb +
                Math.max(params.brickH * 2, params.towerHeight) -
                Math.max(0, Number(params.houseEaveLowerY) || 0);
              const ridgeY =
                eY +
                Math.max(0.12, Number(params.houseGableRise) || 0) +
                (Number(params.houseRidgeLiftY) || 0);
              ty = eY + (ridgeY - eY) * 0.58;
            }
            controls.target.set(0, ty, 0);
          } else if (isBridge()) {
            const rp = ringParamsFromGui();
            const midY =
              (rp.springY + params.sillY) * 0.5 + rp.ringRadius * 0.42;
            controls.target.set(0, midY, 0);
            camera.position.set(
              Math.max(10, params.bridgeLength * 0.48),
              midY + 3.2,
              params.bridgeDeckHalfW * 2.8 + 11,
            );
          } else {
            const rp = ringParamsFromGui();
            const midY =
              (rp.springY + params.sillY) * 0.5 + rp.ringRadius * 0.35;
            controls.target.set(
              params.archAlong,
              midY,
              params.archAlongZ * 0.22,
            );
          }
          rebuildDestructRegistry();
        }

        function rebuildAll() {
          rebuildInstances(true);
        }

        function syncFromArchPivot() {
          if (!archPivot) return;
          if (isTowerLike()) {
            if (isRoundTower()) syncRoundTowerGizmoFromPivot();
            else syncTowerGizmoFromPivot();
            clampArchAlong();
            clampArchAlongZ();
            clampDoorSillInWall();
            resetArchGizmoTargetOffset();
            archPivot.position.copy(towerPivotWorldForMode());
            syncArchPivotOrientationAndGizmoSpace();
            rebuildInstances(false);
            return;
          }
          const pw = archGizmoWorldPosition(_archGizmoWP);
          params.archAlong = pw.x;
          params.archAlongZ = pw.z;
          params.sillY = THREE.MathUtils.clamp(
            pw.y - params.legHeight * 0.35,
            -2,
            10,
          );
          clampArchAlong();
          clampArchAlongZ();
          clampDoorSillInWall();
          resetArchGizmoTargetOffset();
          archPivot.position.x = params.archAlong;
          archPivot.position.y = params.sillY + params.legHeight * 0.35;
          archPivot.position.z = params.archAlongZ;
          syncArchPivotOrientationAndGizmoSpace();
          rebuildInstances(false);
        }

        function updateArchGizmoFromParams() {
          if (!archPivot || isDraggingArchGizmo) return;
          clampArchAlong();
          clampArchAlongZ();
          clampDoorSillInWall();
          if (isTowerLike()) {
            archPivot.position.copy(towerPivotWorldForMode());
            syncArchPivotOrientationAndGizmoSpace();
            return;
          }
          archPivot.position.set(
            params.archAlong,
            params.sillY + params.legHeight * 0.35,
            params.archAlongZ,
          );
          syncArchPivotOrientationAndGizmoSpace();
        }

        let archDragRaf = 0;
        let archRoundOrbitDrag = false;
        let archRoundOrbitLastX = 0;

        /** TransformControls: tower = local translate; round = Y/Z only + Alt+drag orbit (see listeners). */
        function configureArchGizmoForTower() {
          if (!archGizmo) return;
          if (!isTowerLike()) {
            archGizmo.showX = archGizmo.showY = archGizmo.showZ = true;
            archGizmo.showXY = archGizmo.showXZ = archGizmo.showYZ = true;
            return;
          }
          archGizmo.setMode("translate");
          archGizmo.setSpace("local");
          archGizmo.showY = true;
          archGizmo.showZ = true;
          archGizmo.showXY = false;
          archGizmo.showXZ = false;
          archGizmo.showYZ = false;
          /** Round: no tangent translate handle; orbit = RMB + horizontal drag on the view. */
          archGizmo.showX = !isRoundTower();
        }
        function setupArchGizmo() {
          if (archGizmo) return;
          archPivot = new THREE.Object3D();
          archPivot.name = "archPivot";
          scene.add(archPivot);

          archGizmoTarget = new THREE.Object3D();
          archGizmoTarget.name = "archGizmoTarget";
          archPivot.add(archGizmoTarget);

          archGizmo = new TransformControls(camera, renderer.domElement);
          archGizmo.attach(archGizmoTarget);
          archGizmo.setMode("translate");
          archGizmo.setSpace("world");
          archGizmo.size = 0.78;
          archGizmo.enabled = params.showArchGizmo;
          archGizmo.visible = params.showArchGizmo;

          archGizmo.addEventListener("dragging-changed", (e) => {
            isDraggingArchGizmo = e.value;
            controls.enabled = !e.value;
            if (!e.value) {
              if (archDragRaf) {
                cancelAnimationFrame(archDragRaf);
                archDragRaf = 0;
              }
              archRoundOrbitDrag = false;
              clampArchAlong();
              clampArchAlongZ();
              clampDoorSillInWall();
              updateArchGizmoFromParams();
              rebuildInstances(false);
            }
          });
          archGizmo.addEventListener("change", () => {
            if (!isDraggingArchGizmo) return;
            if (archDragRaf) cancelAnimationFrame(archDragRaf);
            archDragRaf = requestAnimationFrame(() => {
              archDragRaf = 0;
              syncFromArchPivot();
            });
          });

          /** Round tower: orbit gate around the drum (azimuth). RMB drag = orbit (no red axis). */
          renderer.domElement.addEventListener("contextmenu", (e) => {
            if (params.showArchGizmo && isRoundTower()) e.preventDefault();
          });
          renderer.domElement.addEventListener("mousedown", (e) => {
            if (!params.showArchGizmo || !isRoundTower()) return;
            if (e.button === 2) {
              archRoundOrbitDrag = true;
              archRoundOrbitLastX = e.clientX;
              controls.enabled = false;
            }
          });
          renderer.domElement.addEventListener("mousemove", (e) => {
            if (
              !archRoundOrbitDrag ||
              !isRoundTower() ||
              !params.showArchGizmo ||
              isDraggingArchGizmo
            )
              return;
            const dx = e.clientX - archRoundOrbitLastX;
            archRoundOrbitLastX = e.clientX;
            const R = Math.max(0.2, params.towerHalfWidth);
            params.archAlong += dx * 0.0085 * R;
            clampArchAlong();
            if (!isDraggingArchGizmo) updateArchGizmoFromParams();
            rebuildInstances(false);
          });
          window.addEventListener("mouseup", () => {
            if (archRoundOrbitDrag) {
              archRoundOrbitDrag = false;
              if (!isDraggingArchGizmo) controls.enabled = true;
            }
          });

          archGizmoHelper = archGizmo.getHelper();
          scene.add(archGizmoHelper);
          updateArchGizmoFromParams();
        }

        function buildTowerShellInstances() {
          if (!brickGeo) return;

          const halfT = params.towerHalfWidth;
          const wallBase = params.towerAnchorY;
          const topY =
            wallBase + Math.max(params.brickH * 2, params.towerHeight);
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const ny = Math.min(
            260,
            Math.max(3, Math.ceil((topY - baseY) / rowH)),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          /**
           * Tower shell is authored in world space. Skip `wallZ` (single-façade slab offset):
           * applying it here shifts ±X faces along world Z, which is their tangent `u`,
           * so hole intervals and brick positions desync from the arch ring (jamb gap/clip).
           */
          wallMesh.position.set(0, 0, 0);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;
          const inset = towerFaceInsetD();

          const placeTowerBrick = (face, u, y, sx, sy, sz) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            let bx;
            let by;
            let bz;
            if (face === 0) {
              bx = halfT - inset;
              by = y;
              bz = u;
              tmpO.rotation.set(0, -Math.PI / 2, 0);
            } else if (face === 1) {
              bx = -halfT + inset;
              by = y;
              bz = u;
              tmpO.rotation.set(0, Math.PI / 2, 0);
            } else if (face === 2) {
              bx = u;
              by = y;
              bz = halfT - inset;
              tmpO.rotation.set(0, 0, 0);
            } else {
              bx = u;
              by = y;
              bz = -halfT + inset;
              tmpO.rotation.set(0, Math.PI, 0);
            }
            tmpO.position.set(bx, by, bz);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            applyBrickAxisScaleNoise(tmpO, rnd, false);
            applyBrickPlacementNoise(tmpO, rnd, false);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          const battRows = params.towerBattlements
            ? THREE.MathUtils.clamp(
                Math.floor(params.towerBattlementCourses) || 2,
                1,
                4,
              )
            : 0;
          const battY0 = battRows > 0 ? topY - rowH * battRows : topY + 1e6;

          for (let face = 0; face < 4; face++) {
            const opsFace = getTowerOpeningsList().filter(
              (o) => o.face === face,
            );
            outer: for (let iy = 0; iy < ny; iy++) {
              const yMid = baseY + iy * rowH;
              if (yMid > topY - nomH * 0.2) break;

              const isBatRow =
                params.towerBattlements && yMid >= battY0 - rowH * 0.02;
              const rawIntervals = isBatRow
                ? merlonBaseIntervals(
                    halfT,
                    params.towerMerlonW,
                    params.towerCrenelW,
                    face,
                    iy,
                  )
                : [[-halfT, halfT]];
              const intervals = subtractHolesFromIntervals(
                rawIntervals,
                opsFace,
                yMid,
                seam,
              );

              let maxCurveT = 0;
              for (const op of opsFace) {
                const rp = ringParamsFromOpening(op);
                const R_out = rp.ringRadius;
                const ohC = wallOpeningHalfX(
                  yMid,
                  R_out,
                  op.sillY,
                  rp.springY,
                  seam,
                  rp.archShape,
                  rp.archPointedness,
                );
                if (ohC <= 1e-5) continue;
                const c = wallOpeningCurvature(
                  yMid,
                  R_out,
                  op.sillY,
                  rp.springY,
                  seam,
                  rp.archShape,
                  rp.archPointedness,
                );
                maxCurveT = Math.max(
                  maxCurveT,
                  THREE.MathUtils.smoothstep(0.06, 1.15, c),
                );
              }
              const nomWCurve =
                nomW *
                THREE.MathUtils.lerp(
                  1,
                  THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                  Math.pow(maxCurveT, 1.08),
                );

              const haunch = THREE.MathUtils.smoothstep(
                wallBase + params.towerHeight * 0.12,
                topY - nomH * 0.35,
                yMid,
              );
              const crownSy =
                1 -
                (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                  Math.pow(haunch, 1.28);

              for (const [segLo, segHi] of intervals) {
                const span = segHi - segLo;
                if (span < nomW * params.wallMinBrickScale * 0.45) continue;

                const minW = nomW * params.wallMinBrickScale;
                const jMin = 0.0035;
                const jMax = Math.min(
                  mortar,
                  Math.max(jMin, span * 0.014 + jMin * 0.6),
                );
                const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
                const hj = j * 0.5;
                let innerLo = segLo + hj;
                let innerHi = segHi - hj;
                if (iy % 2 === 1) {
                  const shift = Math.min(
                    (nomWCurve + j) * 0.48,
                    Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
