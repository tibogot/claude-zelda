                seam,
              );
              maxCurveT = Math.max(
                maxCurveT,
                THREE.MathUtils.smoothstep(0.06, 1.15, c),
              );
            }
            const nomWCurve =
              nomW *
              THREE.MathUtils.lerp(
                1,
                THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                Math.pow(maxCurveT, 1.08),
              );

            const haunch = THREE.MathUtils.smoothstep(
              wallBase + params.towerHeight * 0.12,
              topY - nomH * 0.35,
              yMid,
            );
            const crownSy =
              1 -
              (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                Math.pow(haunch, 1.28);

            for (const [segLo, segHi] of intervals) {
              const span = segHi - segLo;
              if (span < nomW * params.wallMinBrickScale * 0.45) continue;

              const minW = nomW * params.wallMinBrickScale;
              const jMin = 0.0035;
              const jMax = Math.min(
                mortar,
                Math.max(jMin, span * 0.014 + jMin * 0.6),
              );
              const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
              const hj = j * 0.5;
              /**
               * Do not stagger courses in arc-length `u` on the round shell: the gate hole is cut in
               * absolute `u`, while a global `+staggerU` on odd rows shifts every brick the same way.
               * That slides the segment that meets the **+u (right) jamb** into the opening (always the
               * same side); square tower avoids this because each face interval is independent.
               */
              const staggerU = 0;
              let innerLo = segLo + hj + staggerU;
              let innerHi = segHi - hj + staggerU;
              /** Square tower only: jamb-adjacent joint jog uses face-relative `segLo`/`segHi`. On a cylinder that logic mis-classifies segments and skews one jamb; round hole carve uses padding in `subtractHolesFromIntervals` instead. */

              const innerLen = innerHi - innerLo;
              if (innerLen < minW * 0.72) continue;

              let nBricks = Math.max(
                1,
                Math.round(innerLen / (nomWCurve + j)),
              );
              let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              for (let it = 0; it < 96; it++) {
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.998) {
                  if (nBricks <= 1) break;
                  nBricks--;
                } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                  nBricks++;
                } else break;
              }
              wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              if (wEq < minW * 0.88) continue;

              for (let bi = 0; bi < nBricks; bi++) {
                if (k >= params.maxWallBricks) break outerRound;
                const u = innerLo + wEq * 0.5 + bi * (wEq + j);
                if (u > innerHi - wEq * 0.5 + 1e-4) break;

                const theta = u / Rc;
                let tuckY = 0;
                for (const op of opsR) {
                  const rp = ringParamsFromOpening(op);
                  const R_out = rp.ringRadius;
                  const openH = wallOpeningHalfX(
                    yMid,
                    R_out,
                    op.sillY,
                    rp.springY,
                    seam,
                  );
                  if (openH <= 1e-4) continue;
                  const curv = wallOpeningCurvature(
                    yMid,
                    R_out,
                    op.sillY,
                    rp.springY,
                    seam,
                  );
                  const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
                  if (curveT <= 0.04) continue;
                  const uRef =
                    typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                      ? op.uArc
                      : op.uCenter;
                  const gap = Math.max(0, Math.abs(u - uRef) - openH);
                  const band = params.brickW * 3.8;
                  if (gap < band) {
                    const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                    const ty =
                      -nomH *
                      0.12 *
                      Math.pow(t, 1.2) *
                      Math.pow(curveT, 0.55);
                    tuckY = Math.min(tuckY, ty);
                  }
                }

                const sx = wEq / nomW;
                const yMerl = isBatRow ? params.towerMerlonLift * 0.45 : 0;
                const syBase = (0.91 + rnd() * 0.06) * crownSy;
                const sy = isBatRow
                  ? syBase *
                    (1 +
                      params.towerMerlonLift /
                        Math.max(0.12, nomH))
                  : syBase;
                const sz = 0.92 + rnd() * 0.06;
                if (
                  !placeRoundBrick(
                    theta,
                    yMid + tuckY + yMerl,
                    sx,
                    sy,
                    sz,
                    iy,
                  )
                )
                  break outerRound;
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        function buildTowerDoorRings() {
          if (!brickGeo) return;
          const openings = getTowerOpeningsList();
          const jRing = THREE.MathUtils.clamp(
            params.brickW * 0.022,
            0.0045,
            0.012,
          );
          const halfT = params.towerHalfWidth;

          openings.forEach((op) => {
            const rp = ringParamsFromOpening(op);
            const R = rp.ringRadius;
            const Lu = pathULength(rp);
            const Ls = op.closeBottom ? 2 * R : 0;
            const targetMod =
              params.brickW *
                THREE.MathUtils.clamp(params.spacingMul, 0.82, 1.08) +
              jRing;
            let nU = Math.max(5, Math.round(Lu / targetMod));
            let nS =
              Ls > 0 ? Math.max(2, Math.round(Ls / targetMod)) : 0;
            if (nU + nS > params.maxBricks) {
              const room = params.maxBricks - nS;
              nU = Math.max(4, Math.min(nU, room));
              if (nU + nS > params.maxBricks)
                nS = Math.max(0, params.maxBricks - nU);
            }
            const n = nU + nS;
            const cap = Math.min(params.maxBricks, n + 8);
            const doorGeo = createInstancedBrickGeometry(brickGeo, cap);
            const mesh = new THREE.InstancedMesh(doorGeo, brickMat, cap);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const rnd = mulberry32(
              (params.colorSeed ^ (op.uCenter * 10007 + op.face * 131)) | 0,
            );
            let k = 0;
            let alongU =
              nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
            let alongS =
              nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
            const minAlong = params.brickW * 0.44;
            while (nU > 4 && alongU < minAlong) {
              nU--;
              alongU =
                nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
            }
            while (nS > 2 && alongS < minAlong) {
              nS--;
              alongS =
                nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
            }

            const Rcyl = Math.max(0.2, halfT);
            const ringZ =
              typeof op.archAlongZ === "number" && !Number.isNaN(op.archAlongZ)
                ? op.archAlongZ
                : 0;
            const thC = isRoundTower()
              ? roundTowerGateThetaRad() + op.uCenter / Rcyl
              : 0;
            /** Matches previous flat ring + mesh radial stacking on the cylinder. */
            let rSurfRound = 0;
            if (isRoundTower()) {
              const insetRl = towerFaceInsetD();
              const rRing = Math.max(0.08, Rcyl - insetRl + ringZ);
              rSurfRound = rRing + ringZ;
              const c0 = Math.cos(thC);
              const s0 = Math.sin(thC);
              mesh.position.set(ringZ * c0, 0, ringZ * s0);
              mesh.updateMatrixWorld(true);
              _invMeshDoor.copy(mesh.matrixWorld).invert();
            } else {
              setRingParentForFace(
                ringRoot,
                op.face,
                halfT,
                op.uCenter,
                params.brickD,
              );
              ringRoot.updateMatrixWorld(true);
              const ff = THREE.MathUtils.clamp(op.face | 0, 0, 3);
              if (ff === 0) mesh.position.set(ringZ, 0, 0);
              else if (ff === 1) mesh.position.set(-ringZ, 0, 0);
              else if (ff === 2) mesh.position.set(0, 0, ringZ);
              else mesh.position.set(0, 0, -ringZ);
              mesh.updateMatrixWorld(true);
              _invMeshDoor.copy(mesh.matrixWorld).invert();
            }

            const placeBrick = (x, y, tx, ty, along) => {
              const yaw = Math.atan2(ty, tx);
              const baseSx = THREE.MathUtils.clamp(
                along / params.brickW,
                0.86,
                1.12,
              );
              const baseSy = 0.94 + rnd() * 0.05;
              const baseSz = 0.94 + rnd() * 0.05;
              const v = pickBrickVariation(
                rnd,
                baseSx,
                baseSy,
                baseSz,
                "door",
                params.archRingDepthScale,
              );
              if (isRoundTower()) {
                const rs = Math.max(0.08, rSurfRound);
                const thi = thC + x / rs;
                const ci = Math.cos(thi);
                const si = Math.sin(thi);
                _tmpDoorPos.set(ci * rs, y, si * rs);
                _doorTan.set(-si, 0, ci);
                _doorOut.set(ci, 0, si);
                /**
                 * Flat ring: tangent (tx, ty) lies in ring X–Y = (cylinder tangent, world up).
                 * Build the same 3D direction on the curved shell, then a right-handed frame with
                 * brick depth Z = outward radial (matches square `setRingParentForFace` + Rz(yaw)).
                 */
                _doorBx.copy(_doorTan).multiplyScalar(tx).addScaledVector(_yAxis, ty);
                if (_doorBx.lengthSq() < 1e-10) _doorBx.copy(_doorTan);
                _doorBx.normalize();
                _doorBy.copy(_doorOut).cross(_doorBx).normalize();
                _doorBz.copy(_doorBx).cross(_doorBy).normalize();
                _tmpBasisBrick.makeBasis(_doorBx, _doorBy, _doorBz);
                _tmpDoorQuat.setFromRotationMatrix(_tmpBasisBrick);
                _tmpDoorScale.set(v.sx, v.sy, v.sz);
                tmpO.matrix.compose(_tmpDoorPos, _tmpDoorQuat, _tmpDoorScale);
                tmpM.multiplyMatrices(_invMeshDoor, tmpO.matrix);
              } else {
                tmpO.position.set(x, y, 0);
                tmpO.rotation.set(0, 0, yaw);
                tmpO.scale.set(v.sx, v.sy, v.sz);
                tmpO.updateMatrix();
                tmpM.multiplyMatrices(ringRoot.matrixWorld, tmpO.matrix);
                tmpM.premultiply(_invMeshDoor);
              }
              mesh.setMatrixAt(k, tmpM);
              setBrickVarAt(mesh, k, v.shapeMix, v.warp, v.grey, v.grain);
              k++;
            };

            for (let i = 0; i < nU; i++) {
              const s = jRing * i + alongU * (i + 0.5);
              const o = sampleUPath(s, rp);
              placeBrick(o.x, o.y, o.tx, o.ty, alongU);
            }
            for (let i = 0; i < nS; i++) {
              const s = jRing * i + alongS * (i + 0.5);
              const o = sampleSill(s, R, rp.sillY);
              placeBrick(o.x, o.y, o.tx, o.ty, alongS);
            }

            mesh.count = k;
            mesh.instanceMatrix.needsUpdate = true;
            const bv = mesh.geometry.getAttribute("brickVar");
            if (bv) bv.needsUpdate = true;
            scene.add(mesh);
            towerDoorMeshes.push(mesh);
          });
        }

        function buildDoorInstances() {
          if (isAnyTower()) {
            buildTowerDoorRings();
            return;
          }
          const rp = ringParamsFromGui();
          const R = rp.ringRadius;
          const Lu = pathULength(rp);
          const Ls = params.closeBottom ? 2 * R : 0;
          /** Mortar along the ring path; scales with brick width, capped so joints never read huge. */
          const jRing = THREE.MathUtils.clamp(
            params.brickW * 0.022,
            0.0045,
            0.012,
          );
          const targetMod =
            params.brickW * THREE.MathUtils.clamp(params.spacingMul, 0.82, 1.08) +
            jRing;
          let nU = Math.max(5, Math.round(Lu / targetMod));
          let nS =
            Ls > 0 ? Math.max(2, Math.round(Ls / targetMod)) : 0;
          if (nU + nS > params.maxBricks) {
            const room = params.maxBricks - nS;
            nU = Math.max(4, Math.min(nU, room));
            if (nU + nS > params.maxBricks)
              nS = Math.max(0, params.maxBricks - nU);
          }
          const n = nU + nS;
          const cap = Math.min(params.maxBricks, n + 8);
          const doorGeo = createInstancedBrickGeometry(brickGeo, cap);

          doorMesh = new THREE.InstancedMesh(doorGeo, brickMat, cap);
          doorMesh.castShadow = true;
          doorMesh.receiveShadow = true;

          const rnd = mulberry32(params.colorSeed | 0);
          let k = 0;
          const gx = getGateX();

          let alongU =
            nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
          let alongS =
            nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
          const minAlong = params.brickW * 0.44;
          while (nU > 4 && alongU < minAlong) {
            nU--;
            alongU =
              nU > 0 ? (Lu - Math.max(0, nU - 1) * jRing) / nU : params.brickW;
          }
          while (nS > 2 && alongS < minAlong) {
            nS--;
            alongS =
              nS > 0 ? (Ls - Math.max(0, nS - 1) * jRing) / nS : params.brickW;
          }

          const placeBrick = (x, y, tx, ty, along) => {
            const yaw = Math.atan2(ty, tx);
            const baseSx = THREE.MathUtils.clamp(
              along / params.brickW,
              0.86,
              1.12,
            );
            const baseSy = 0.94 + rnd() * 0.05;
            const baseSz = 0.94 + rnd() * 0.05;
            const v = pickBrickVariation(
              rnd,
              baseSx,
              baseSy,
              baseSz,
              "door",
              params.archRingDepthScale,
            );
            tmpO.position.set(x + gx, y, 0);
            tmpO.rotation.set(0, 0, yaw);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            tmpO.updateMatrix();
            doorMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(doorMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
          };

          for (let i = 0; i < nU; i++) {
            const s = jRing * i + alongU * (i + 0.5);
            const o = sampleUPath(s, rp);
            placeBrick(o.x, o.y, o.tx, o.ty, alongU);
          }
          for (let i = 0; i < nS; i++) {
            const s = jRing * i + alongS * (i + 0.5);
            const o = sampleSill(s, R, rp.sillY);
            placeBrick(o.x, o.y, o.tx, o.ty, alongS);
          }

          doorMesh.count = k;
          doorMesh.instanceMatrix.needsUpdate = true;
          const bv = doorMesh.geometry.getAttribute("brickVar");
          if (bv) bv.needsUpdate = true;
          doorMesh.position.set(0, 0, params.archAlongZ);
          scene.add(doorMesh);
        }

        function buildWallInstances() {
          if (params.sceneMode === "tower") {
            buildTowerShellInstances();
            return;
          }
          if (params.sceneMode === "towerRound") {
            buildTowerRoundShellInstances();
            return;
          }
          if (!params.wallEnabled || !brickGeo) return;

          const rp = ringParamsFromGui();
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const doorSill = params.sillY;
          const ys = rp.springY;
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const wallLo = -params.wallWidth * 0.5;
          const wallHi = params.wallWidth * 0.5;
          const wallBase = params.wallAnchorY;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const topY = wallBase + Math.max(nomH * 2, params.wallHeight);
          const ny = Math.min(220, Math.max(3, Math.ceil((topY - baseY) / rowH)));

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, params.wallZ);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;
          const gx = getGateX();

          const placeWallBrick = (cx, cy, sx, sy, sz) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            tmpO.position.set(cx, cy, 0);
            tmpO.rotation.set(0, 0, 0);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          outer: for (let iy = 0; iy < ny; iy++) {
            const yMid = baseY + iy * rowH;
            if (yMid > topY - nomH * 0.2) break;

            const openH = wallOpeningHalfX(yMid, R_out, doorSill, ys, seam);
            let intervals = [[wallLo, wallHi]];
            if (openH > 1e-5) {
              intervals = subtractIntervals(
                intervals,
                gx - openH,
                gx + openH,
              );
            }

            const curv = wallOpeningCurvature(yMid, R_out, doorSill, ys, seam);
            const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
            const nomWCurve =
              nomW *
              THREE.MathUtils.lerp(
                1,
                THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                Math.pow(curveT, 1.08),
              );

            const haunch =
              yMid >= ys - mortar * 1.5 && yMid <= ys + R_out * 1.05
                ? THREE.MathUtils.smoothstep(
                    ys - 0.12,
                    ys + R_out * 0.82,
                    yMid,
                  )
                : 0;
            const crownSy =
              1 -
              (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                Math.pow(haunch, 1.28);

            for (const [segLo, segHi] of intervals) {
              const span = segHi - segLo;
              if (span < nomW * params.wallMinBrickScale * 0.45) continue;

              const minW = nomW * params.wallMinBrickScale;
              const jMin = 0.0035;
              const jMax = Math.min(
                mortar,
                Math.max(jMin, span * 0.014 + jMin * 0.6),
              );
              const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
              const hj = j * 0.5;
              let innerLo = segLo + hj;
              let innerHi = segHi - hj;
              if (iy % 2 === 1) {
                const shift = Math.min(
                  (nomWCurve + j) * 0.48,
                  Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
                );
                /**
                 * Running-bond stagger must not always grow innerLo: that pulls the
                 * right-side segment away from the arch (gap at the seam) while the
                 * left segment only pulls away from the far wall. Shift from the
                 * outer wall on each side instead.
                 */
                const eps = Math.max(1e-3, nomW * 0.025);
                const rightOfOpening =
                  openH > 1e-5 && segLo >= gx + openH - eps;
                const leftOfOpening =
                  openH > 1e-5 && segHi <= gx - openH + eps;
                if (rightOfOpening) innerHi -= shift;
                else if (leftOfOpening) innerLo += shift;
                else innerLo += shift;
              }

              const innerLen = innerHi - innerLo;
              if (innerLen < minW * 0.72) continue;

              let nBricks = Math.max(
                1,
                Math.round(innerLen / (nomWCurve + j)),
              );
              let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              for (let it = 0; it < 96; it++) {
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.998) {
                  if (nBricks <= 1) break;
                  nBricks--;
                } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                  nBricks++;
                } else break;
              }
              wEq = (innerLen - (nBricks - 1) * j) / nBricks;
              if (wEq < minW * 0.88) continue;

              for (let bi = 0; bi < nBricks; bi++) {
                if (k >= params.maxWallBricks) break outer;
                const cx = innerLo + wEq * 0.5 + bi * (wEq + j);
                if (cx > innerHi - wEq * 0.5 + 1e-4) break;

                let tuckY = 0;
                if (openH > 1e-4 && curveT > 0.04) {
                  const gap = Math.max(0, Math.abs(cx - gx) - openH);
                  const band = params.brickW * 3.8;
                  if (gap < band) {
                    const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                    tuckY =
                      -nomH * 0.12 * Math.pow(t, 1.2) * Math.pow(curveT, 0.55);
                  }
                }

                const sx = wEq / nomW;
                const sy = (0.91 + rnd() * 0.06) * crownSy;
                const sz = 0.92 + rnd() * 0.06;
                if (!placeWallBrick(cx, yMid + tuckY, sx, sy, sz)) break outer;
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        rebuildInstances(true);

        const tweakRoot = document.getElementById("tweak-root");

        fDestruction

        fDestruction
          .addBinding(params, "erosion", {

          label: "Blast radius",
        });
        fDestruction.addBinding(params, "collapseSpreadMax", {
          min: 0,
          max: 140,
          step: 1,
          label: "Collapse spread (0=auto)",
        });
        fDestruction.addBinding(params, "gravity", {
          min: 4,
          max: 45,
          step: 0.5,
        });
        fDestruction.addBinding(params, "bounce", {
          min: 0,
          max: 0.85,
          step: 0.02,
        });
        fDestruction.addBinding(params, "angularDamping", {
          min: 0.9,
          max: 0.999,
          step: 0.001,
          label: "Spin damping",
        });
        fDestruction
          .addBinding(params, "debrisMode", {
            label: "Settled debris",
            options: { Fade: "fade", Keep: "keep" },
          })
          .on("change", () => {
            for (const b of destructBricks) {
              if (!b.hidden) b.ttl = params.debrisLifetime;
            }
          });
        fDestruction.addBinding(params, "debrisLifetime", {
          min: 1,
          max: 24,
          step: 0.25,
          label: "Fade time (s)",
        });
        fDestruction.addBinding(params, "maxDebrisCount", {
          min: 120,
          max: 4000,
          step: 40,
          label: "Max kept pieces",
        });
        fDestruction.addBinding(params, "sleepThreshold", {
          min: 0.08,
          max: 1.2,
          step: 0.02,
          label: "Sleep speed",
        });

        const fView = pane.addFolder({ title: "View" });
        fView.addBinding(params, "showArchGizmo", {
          label: "Arch gizmo",
        }).on("change", () => {
          if (archGizmo) {
            archGizmo.enabled = params.showArchGizmo;
            archGizmo.visible = params.showArchGizmo;
          }
        });
        fView.addBinding(params, "showGrid", { label: "Grid" }).on("change", () => {
          setGrid(params.showGrid);
        });

        pane.addButton({ title: "Rebuild" }).on("click", () => {
          rebuildAll();
        });

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener("resize", onResize);

        renderer.setAnimationLoop((time) => {
          sunDirUniform.value.copy(sun.position).normalize();
          destructTimer.update(time);
          const dt = destructTimer.getDelta();
          if (params.destructionEnabled && destructBricks.length) {
            updateFallingDestruct(dt);
            updateErosionTick(dt);
          }
          controls.update();
          renderer.render(scene, camera);
        });
      }

      main().catch((e) => {
        console.error(e);
        document.body.innerHTML =
          "<pre style='color:#f8fafc;padding:16px;font:14px/1.4 system-ui'>WebGPU error: " +
          String(e) +
          "</pre>";
      });
    </script>
  </body>
