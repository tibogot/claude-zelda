<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick arch door + adaptive wall — WebGPU + TSL</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #1a1d24;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100vh;
      }
      /* Scrollable Tweakpane: body stays overflow:hidden for the canvas */
      #tweak-root {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 50;
        width: min(340px, calc(100vw - 16px));
        max-height: calc(100vh - 16px);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        pointer-events: auto;
        -webkit-overflow-scrolling: touch;
      }
      #tweak-root::-webkit-scrollbar {
        width: 8px;
      }
      #tweak-root::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="tweak-root" aria-label="Settings panel"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn,
        float,
        color,
        vec2,
        vec3,
        sin,
        mix,
        smoothstep,
        mul,
        sub,
        add,
        abs,
        max,
        min,
        floor,
        fract,
        length,
        normalize,
        div,
        normalWorld,
        normalLocal,
        positionLocal,
        positionWorld,
        dot,
        pow,
        clamp,
        uniform,
        attribute,
      } from "three/tsl";

      /** Length of the ∩ outline: left jamb + semicircle + right jamb (no sill). */
      function pathULength(p) {
        const Lj = Math.max(1e-6, p.springY - p.sillY);
        return 2 * Lj + Math.PI * p.ringRadius;
      }

      /** Horizontal sill from (-R,y0) → (R,y0), s ∈ [0, 2R]. */
      function sampleSill(s, R, y0) {
        const t = s / (2 * R);
        const x = THREE.MathUtils.lerp(-R, R, t);
        return { x, y: y0, tx: 1, ty: 0 };
      }

      /** ∩ path only: left jamb up → arch (left→right over crown) → right jamb down. */
      function sampleUPath(s, p) {
        const R = p.ringRadius;
        const y0 = p.sillY;
        const ys = p.springY;
        const Lj = Math.max(1e-6, ys - y0);
        const La = Math.PI * R;
        let u = s;

        if (u <= Lj) {
          const t = u / Lj;
          const y = THREE.MathUtils.lerp(y0, ys, t);
          return { x: -R, y, tx: 0, ty: 1 };
        }
        u -= Lj;
        if (u <= La) {
          const t = u / La;
          const ang = Math.PI * (1 - t);
          const ca = Math.cos(ang);
          const sa = Math.sin(ang);
          const x = R * ca;
          const y = ys + R * sa;
          const tx = sa;
          const ty = -ca;
          const inv = 1 / Math.hypot(tx, ty);
          return { x, y, tx: tx * inv, ty: ty * inv };
        }
        u -= La;
        const t = THREE.MathUtils.clamp(u / Lj, 0, 1);
        const y = THREE.MathUtils.lerp(ys, y0, t);
        return { x: R, y, tx: 0, ty: -1 };
      }

      function subtractIntervals(intervals, holeLo, holeHi) {
        if (holeHi <= holeLo) return intervals;
        const out = [];
        for (const [a, b] of intervals) {
          if (b <= a + 1e-6) continue;
          if (holeHi <= a || holeLo >= b) {
            out.push([a, b]);
            continue;
          }
          if (holeLo > a + 1e-4) out.push([a, Math.min(holeLo, b)]);
          if (holeHi < b - 1e-4) out.push([Math.max(holeHi, a), b]);
        }
        return out;
      }

      /** Horizontal extent (|x|) where wall field must stay outside so it does not clip the ring. */
      function wallOpeningHalfX(y, R_out, y0, ys, seam) {
        if (y < y0 - 1e-6) return 0;
        if (y < ys - 1e-6) return R_out + seam;
        const dy = y - ys;
        if (dy > R_out + 1e-6) return 0;
        const inner = R_out * R_out - dy * dy;
        if (inner <= 0) return 0;
        return Math.sqrt(inner) + seam;
      }

      /** How fast the opening boundary moves in X with Y (large near springing and haunches). */
      function wallOpeningCurvature(y, R_out, y0, ys, seam) {
        const e = 0.06;
        const a = wallOpeningHalfX(y + e, R_out, y0, ys, seam);
        const b = wallOpeningHalfX(y - e, R_out, y0, ys, seam);
        return Math.abs(a - b) / e;
      }

      const tmpO = new THREE.Object3D();
      const tmpM = new THREE.Matrix4();
      const ringRoot = new THREE.Object3D();
      const _archGizmoWP = new THREE.Vector3();
      const _archGizmoBasisM = new THREE.Matrix4();
      const _tmpBasisBrick = new THREE.Matrix4();
      const _invMeshDoor = new THREE.Matrix4();
      const _tmpDoorPos = new THREE.Vector3();
      const _tmpDoorQuat = new THREE.Quaternion();
      const _tmpDoorScale = new THREE.Vector3();
      const _doorTan = new THREE.Vector3();
      const _doorOut = new THREE.Vector3();
      const _doorBx = new THREE.Vector3();
      const _doorBy = new THREE.Vector3();
      const _doorBz = new THREE.Vector3();
      const _yAxis = new THREE.Vector3(0, 1, 0);

      /** Per-instance: x=shape mix, y=warp strength, z=grey key, w=grain phase */
      function setBrickVarAt(mesh, index, shapeMix, warp, grey, grain) {
        const att = mesh.geometry.getAttribute("brickVar");
        if (!att) return;
        const a = att.array;
        const o = index * 4;
        a[o] = shapeMix;
        a[o + 1] = warp;
        a[o + 2] = grey;
        a[o + 3] = grain;
      }

      /**
       * Returns scale factors + shader variation keys.
       * @param {'door'|'wall'} mode — door ring: tight coherent units; wall: subtle field variation.
       * @param {number} [ringDepthScale] — door/window ring only: multiply local depth (Z) so the arch reads slightly proud of the wall shell (both sides).
       */
      function pickBrickVariation(
        rnd,
        baseSx,
        baseSy,
        baseSz,
        mode,
        ringDepthScale,
      ) {
        let sx = baseSx;
        let sy = baseSy;
        let sz = baseSz;
        let shapeMix = 0.5;
        let warp = 0.25;
        let grey = 0.45;
        const grain = rnd();

        if (mode === "door") {
          sx *= 1 + (rnd() - 0.5) * 0.055;
          sy *= 0.97 + rnd() * 0.05;
          sz *= 0.97 + rnd() * 0.05;
          const bump =
            typeof ringDepthScale === "number" &&
            ringDepthScale > 0 &&
            !Number.isNaN(ringDepthScale)
              ? ringDepthScale
              : 1.09;
          sz *= bump;
          shapeMix = 0.56 + rnd() * 0.07;
          warp = 0.16 + rnd() * 0.2;
          grey = 0.32 + rnd() * 0.34;
          return { sx, sy, sz, shapeMix, warp, grey, grain };
        }

        const u = rnd();
        if (u < 0.12) {
          shapeMix = 0.38;
          sx *= 1.04 + rnd() * 0.1;
          sy *= 0.9 + rnd() * 0.08;
          sz *= 0.93 + rnd() * 0.07;
        } else if (u < 0.22) {
          shapeMix = 0.3;
          sx *= 0.93 + rnd() * 0.08;
          sy *= 0.86 + rnd() * 0.08;
          sz *= 0.91 + rnd() * 0.07;
        } else {
          shapeMix = 0.46 + rnd() * 0.18;
          sx *= 0.94 + rnd() * 0.1;
          sy *= 0.92 + rnd() * 0.09;
          sz *= 0.92 + rnd() * 0.08;
        }
        warp = 0.22 + rnd() * 0.38;
        grey = 0.3 + rnd() * 0.42;
        return { sx, sy, sz, shapeMix, warp, grey, grain };
      }

      function createInstancedBrickGeometry(baseGeo, capacity) {
        const g = baseGeo.clone();
        const arr = new Float32Array(capacity * 4);
        const att = new THREE.InstancedBufferAttribute(arr, 4);
        att.setUsage(THREE.DynamicDrawUsage);
        g.setAttribute("brickVar", att);
        return g;
      }

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      async function main() {
        const params = {
          doorInnerHalfW: 1.15,
          masonryShell: 0.42,
          legHeight: 2.35,
          /** Door opening sill (world Y). Gizmo vertical moves this, not the wall stack. */
          sillY: 0.02,
          closeBottom: false,
          brickW: 0.52,
          brickH: 0.38,
          brickD: 0.55,
          brickRound: 0.01,
          spacingMul: 1.02,
          maxBricks: 2200,
          maxWallBricks: 22000,
          colorSeed: 31415,
          showGrid: true,

          /** "wall" | "tower" (square) | "towerRound" — same door params; round uses `towerHalfWidth` as cylinder radius */
          sceneMode: "wall",
          towerHalfWidth: 3.6,
          towerHeight: 10.5,
          towerAnchorY: 0.02,
          /** Which face the gate sits on: 0 +X, 1 −X, 2 +Z, 3 −Z (default 2 = toward camera like wall mode) */
          towerGateFace: 2,
          /** Crenellated merlons at the top (defensive silhouette) */
          towerBattlements: true,
          towerMerlonW: 0.5,
          towerCrenelW: 0.36,
          towerBattlementCourses: 2,
          /** Extra vertical rise for merlon teeth (world units) */
          towerMerlonLift: 0.26,

          wallEnabled: true,
          wallWidth: 15,
          wallHeight: 6.2,
          wallDepth: 0.62,
          wallZ: -0.22,
          wallMortar: 0.011,
          wallSeamInset: 0.038,
          wallEdgeBlendBw: 4.2,
          wallMinBrickScale: 0.26,
          wallCrownSquash: 0.78,
          /** Bottom anchor for wall field courses (world Y); stays fixed when moving the arch vertically. */
          wallAnchorY: 0.02,

          /** Horizontal center of the door opening on the wall (world X). */
          archAlong: 0,
          /** Depth offset of the arch ring mesh along world Z (gizmo blue axis). */
          archAlongZ: 0,
          /**
           * Ring brick depth (local Z scale) vs nominal `brickD`: >1 makes door/window
           * arches sit slightly proud of the wall shell so they read from both sides.
           */
          archRingDepthScale: 1.09,
          showArchGizmo: true,

          /** Master: run falling-brick sim + auto erosion (slider). */
          destructionEnabled: false,
          /** "none" | "destruct" — LMB blasts only the mesh you hit (wall vs gate ring). */
          destructionMode: "none",
          removeRadius: 1.05,
          gravity: 18,
          bounce: 0.28,
          angularDamping: 0.985,
          debrisMode: "fade",
          debrisLifetime: 6,
          maxDebrisCount: 800,
          sleepThreshold: 0.42,
          /**
           * Max extra bricks that may start falling from structural collapse after one blast.
           * 0 = auto from blast radius (tight, castle-like). Higher = bigger “first click” ripples.
           */
          collapseSpreadMax: 0,
          /**
           * 0 = off. >0 = continuous auto "virtual clicks" from the highest bricks downward,
           * same blast radius as LMB but only on the mesh of each chosen top brick (like gentle clicking).
           */
          erosion: 0,

          /** Directional sun (shadows). Hemisphere sky/ground fill — same idea as bricks-castle3.html */
          sunIntensity: 2.35,
          ambientIntensity: 0.55,
        };

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        await renderer.init();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a3140);

        const camera = new THREE.PerspectiveCamera(
          42,
          window.innerWidth / window.innerHeight,
          0.1,
          200,
        );
        camera.position.set(5.8, 3.1, 9.2);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.2, 0);
        controls.enableDamping = true;
        controls.minDistance = 3;
        controls.maxDistance = 40;

        renderer.domElement.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          if (!params.destructionEnabled) return;
          if (params.destructionMode !== "destruct") return;
          if (e.target && e.target.closest && e.target.closest("#tweak-root"))
            return;
          if (isDraggingArchGizmo) return;
          destructMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          destructMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          destructRaycaster.setFromCamera(destructMouse, camera);
          const targets = getDestructMeshes();
          if (!targets.length) return;
          const hits = destructRaycaster.intersectObjects(targets, false);
          if (!hits.length) return;
          const hit0 = hits[0];
          let anchorWorld = hit0.point.clone();
          const bi = hit0.instanceId;
          if (
            bi != null &&
            bi >= 0 &&
            hit0.object &&
            hit0.object.isInstancedMesh
          ) {
            for (const br of destructBricks) {
              if (br.mesh === hit0.object && br.index === bi) {
                brickWorldPosition(br, anchorWorld);
                break;
              }
            }
          }
          applyImpactAtPoint(anchorWorld, hit0.object);
        });

        const hemi = new THREE.HemisphereLight(
          0xc9dce8,
          0x5e5648,
          params.ambientIntensity,
        );
        hemi.name = "hemi";
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xfff8f0, params.sunIntensity);
        sun.name = "sun";
        sun.position.set(14, 24, 11);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 80;
        sun.shadow.camera.left = -22;
        sun.shadow.camera.right = 22;
        sun.shadow.camera.top = 22;
        sun.shadow.camera.bottom = -22;
        sun.shadow.bias = -0.00006;
        sun.shadow.normalBias = 0.028;
        sun.shadow.radius = 4;
        sun.shadow.camera.updateProjectionMatrix();
        scene.add(sun);

        function applyLightsFromParams() {
          sun.intensity = params.sunIntensity;
          hemi.intensity = params.ambientIntensity;
        }

        applyLightsFromParams();

        const sunDirUniform = uniform(new THREE.Vector3());

        const groundMat = new THREE.MeshStandardNodeMaterial({
          roughness: 0.95,
          metalness: 0,
        });
        groundMat.colorNode = Fn(() => {
          const pw = positionWorld;
          const xz = vec2(pw.x.mul(0.12), pw.z.mul(0.12));
          const n = sin(xz.x.mul(1.9)).mul(0.5).add(0.5).mul(0.22).add(
            sin(xz.y.mul(1.6)).mul(0.5).add(0.5).mul(0.16),
          );
          const c0 = color(0x3a3d42);
          const c1 = color(0x4f5258);
          return mul(mix(c0, c1, smoothstep(0.15, 0.9, n)), float(1.05));
        })();
        groundMat.emissiveNode = Fn(() => {
          const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
          return mul(color(0x2a2c30), pow(nd, float(1.35))).mul(0.1);
        })();

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          groundMat,
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        let grid = null;
        function setGrid(vis) {
          if (grid) {
            scene.remove(grid);
            grid.traverse((o) => {
              if (o.geometry) o.geometry.dispose();
              if (o.material) o.material.dispose();
            });
            grid = null;
          }
          if (!vis) return;
          grid = new THREE.GridHelper(24, 24, 0x4a5560, 0x3a4152);
          grid.position.y = 0.001;
          scene.add(grid);
        }
        setGrid(params.showGrid);

        let brickGeo = null;
        let brickMat = null;
        let doorMesh = null;
        let wallMesh = null;
        /** Instanced arch ring in tower mode (single gate). */
        let towerDoorMeshes = [];
        let archPivot = null;
        /** Child of `archPivot`; TransformControls attach here so local Z = depth (wall-like). */
        let archGizmoTarget = null;
        let archGizmo = null;
        let archGizmoHelper = null;
        let isDraggingArchGizmo = false;

        /** bricks-castle.html–style CPU debris: wall + door + tower arch rings share one registry. */
        const destructBricks = [];
        let debrisSleepCounter = 0;
        const destructTimer = new THREE.Timer();
        destructTimer.connect(document);
        const destructRaycaster = new THREE.Raycaster();
        const destructMouse = new THREE.Vector2();
        const _dMat = new THREE.Matrix4();
        const _dPos = new THREE.Vector3();
        const _dQuat = new THREE.Quaternion();
        const _dScl = new THREE.Vector3();
        const _dEul = new THREE.Euler();
        const _dTmp = new THREE.Vector3();
        const _dTmp2 = new THREE.Vector3();
        const _destructObj = new THREE.Object3D();
        const _instLocal = new THREE.Matrix4();
        const _brickWorldMat = new THREE.Matrix4();
        const _invMeshW = new THREE.Matrix4();
        const _wmPos = new THREE.Vector3();
        const _wmPos2 = new THREE.Vector3();
        let erosionAccum = 0;

        function getGateX() {
          return params.archAlong;
        }

        function clampArchAlong() {
          if (params.sceneMode === "towerRound") {
            const R = Math.max(0.2, params.towerHalfWidth);
            const R_in = Math.max(0.08, params.doorInnerHalfW);
            const R_out = R_in + Math.max(0.05, params.masonryShell);
            const margin = 0.32;
            const lim = Math.max(
              0.15,
              Math.PI * R - R_out * 1.08 - margin,
            );
            params.archAlong = THREE.MathUtils.clamp(
              params.archAlong,
              -lim,
              lim,
            );
            return;
          }
          if (params.sceneMode === "tower") {
            const R_in = Math.max(0.08, params.doorInnerHalfW);
            const R_out = R_in + Math.max(0.05, params.masonryShell);
            const margin = 0.28;
            const lim = Math.max(
              0.12,
              params.towerHalfWidth - R_out - margin,
            );
            params.archAlong = THREE.MathUtils.clamp(
              params.archAlong,
              -lim,
              lim,
            );
            return;
          }
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const halfW = params.wallWidth * 0.5;
          const margin = 0.28;
          const lim = Math.max(0.15, halfW - R_out - margin);
          params.archAlong = THREE.MathUtils.clamp(
            params.archAlong,
            -lim,
            lim,
          );
        }

        /** Keep arch ring Z inside a sensible slab range (matches gizmo blue axis). */
        function clampArchAlongZ() {
          const d = Math.max(
            0.06,
            params.sceneMode === "tower" || params.sceneMode === "towerRound"
              ? params.brickD * 1.1
              : params.wallDepth,
          );
          const lim =
            params.sceneMode === "tower" || params.sceneMode === "towerRound"
              ? d * 0.65 + 0.5
              : d * 0.55 + 0.42 + Math.abs(params.wallZ || 0) * 0.35;
          params.archAlongZ = THREE.MathUtils.clamp(
            params.archAlongZ,
            -lim,
            lim,
          );
        }

        /** Keep door sill so the opening + ring stays inside the wall slab vertically. */
        function clampDoorSillInWall() {
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const leg = Math.max(0.05, params.legHeight);
          const w0 =
            params.sceneMode === "tower" || params.sceneMode === "towerRound"
              ? params.towerAnchorY
              : params.wallAnchorY;
          const w1 =
            params.sceneMode === "tower" || params.sceneMode === "towerRound"
              ? params.towerAnchorY +
                params.towerHeight +
                (params.towerBattlements ? params.towerMerlonLift * 0.35 : 0)
              : params.wallAnchorY + params.wallHeight;
          const margin = 0.1;
          const maxSill = w1 - margin - leg - R_out;
          const minSill = w0 - 0.12;
          params.sillY = THREE.MathUtils.clamp(params.sillY, minSill, maxSill);
        }

        function ringParamsFromGui() {
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const springY = params.sillY + Math.max(0.05, params.legHeight);
          return {
            ringRadius: R_out,
            sillY: params.sillY,
            springY,
          };
        }

        function ringParamsFromOpening(o) {
          const R_in = Math.max(0.08, o.innerHalfW);
          const R_out = R_in + Math.max(0.05, o.shell);
          const springY = o.sillY + Math.max(0.05, o.legH);
          return {
            ringRadius: R_out,
            sillY: o.sillY,
            springY,
          };
        }

        function isSquareTower() {
          return params.sceneMode === "tower";
        }
        function isRoundTower() {
          return params.sceneMode === "towerRound";
        }
        function isAnyTower() {
          return isSquareTower() || isRoundTower();
        }

        /** Gate azimuth (radians) on round tower; codes match `towerGateFace` (0 +X … 3 −Z). */
        function roundTowerGateThetaRad() {
          const f = THREE.MathUtils.clamp(
            Math.floor(params.towerGateFace) || 0,
            0,
            3,
          );
          switch (f) {
            case 0:
              return 0;
            case 1:
              return Math.PI;
            case 2:
              return Math.PI * 0.5;
            case 3:
              return -Math.PI * 0.5;
            default:
              return Math.PI * 0.5;
          }
        }

        function getTowerOpeningsList() {
          const gateFace = THREE.MathUtils.clamp(
            Math.floor(params.towerGateFace) || 0,
            0,
            3,
          );
          const base = {
            face: gateFace,
            uCenter: params.archAlong,
            innerHalfW: params.doorInnerHalfW,
            sillY: params.sillY,
            legH: params.legHeight,
            shell: params.masonryShell,
            closeBottom: params.closeBottom,
            archAlongZ: params.archAlongZ,
          };
          if (params.sceneMode === "towerRound") {
            const R = Math.max(0.2, params.towerHalfWidth);
            const th0 = roundTowerGateThetaRad();
            const uArc =
              THREE.MathUtils.euclideanModulo(
                th0 * R + params.archAlong + Math.PI * R,
                2 * Math.PI * R,
              ) - Math.PI * R;
            return [{ ...base, uArc }];
          }
          return [base];
        }

        function setRingParentForFace(obj, face, halfT, uCenter, depth) {
          const inset = Math.max(0.06, depth * 0.45);
          switch (face) {
            case 0:
              obj.position.set(halfT - inset, 0, uCenter);
              obj.rotation.set(0, -Math.PI / 2, 0);
              break;
            case 1:
              obj.position.set(-halfT + inset, 0, uCenter);
              obj.rotation.set(0, Math.PI / 2, 0);
              break;
            case 2:
              obj.position.set(uCenter, 0, halfT - inset);
              obj.rotation.set(0, 0, 0);
              break;
            case 3:
              obj.position.set(uCenter, 0, -halfT + inset);
              obj.rotation.set(0, Math.PI, 0);
              break;
            default:
              obj.position.set(halfT - inset, 0, uCenter);
              obj.rotation.set(0, -Math.PI / 2, 0);
          }
        }

        function towerFaceInsetD() {
          return Math.max(0.06, params.brickD * 0.45);
        }

        function getTowerGizmoFace() {
          if (!isAnyTower()) return 0;
          return THREE.MathUtils.clamp(
            Math.floor(params.towerGateFace) || 0,
            0,
            3,
          );
        }

        function resetArchGizmoTargetOffset() {
          if (archGizmoTarget) archGizmoTarget.position.set(0, 0, 0);
        }

        function archGizmoWorldPosition(out) {
          archPivot.updateMatrixWorld(true);
          if (archGizmoTarget) archGizmoTarget.getWorldPosition(out);
          else out.copy(archPivot.position);
          return out;
        }

        /** Tower only: local +X = along wall (+u), +Y = world up, +Z = depth (+archAlongZ). */
        function setTowerGizmoTargetBasis() {
          if (!archGizmoTarget) return;
          if (isRoundTower() && archPivot) {
            const th = Math.atan2(archPivot.position.z, archPivot.position.x);
            const c = Math.cos(th);
            const s = Math.sin(th);
            const bx = new THREE.Vector3(-s, 0, c).normalize();
            const bz = new THREE.Vector3(c, 0, s).normalize();
            /** Right-handed X×Y=Z with Y≈world up: use bx×bz (not bz×bx, which flipped the frame). */
            const by = new THREE.Vector3().crossVectors(bx, bz).normalize();
            _archGizmoBasisM.makeBasis(bx, by, bz);
            archGizmoTarget.quaternion.setFromRotationMatrix(_archGizmoBasisM);
            return;
          }
          const f = getTowerGizmoFace();
          const tan = new THREE.Vector3();
          const depth = new THREE.Vector3();
          switch (f) {
            case 0:
              tan.set(0, 0, 1);
              depth.set(1, 0, 0);
              break;
            case 1:
              tan.set(0, 0, 1);
              depth.set(-1, 0, 0);
              break;
            case 2:
              tan.set(1, 0, 0);
              depth.set(0, 0, 1);
              break;
            case 3:
              tan.set(1, 0, 0);
              depth.set(0, 0, -1);
              break;
            default:
              tan.set(0, 0, 1);
              depth.set(1, 0, 0);
          }
          const bx = tan.clone().normalize();
          const bz = depth.clone().normalize();
          const by = new THREE.Vector3().crossVectors(bz, bx).normalize();
          _archGizmoBasisM.makeBasis(bx, by, bz);
          archGizmoTarget.quaternion.setFromRotationMatrix(_archGizmoBasisM);
        }

        /**
         * Wall: world gizmo (blue Z = depth). Tower: local gizmo on `archGizmoTarget` with
         * basis so blue Z always drives ring depth, matching wall UX.
         */
        function syncArchPivotOrientationAndGizmoSpace() {
          if (!archPivot || !archGizmo) return;
          resetArchGizmoTargetOffset();
          archPivot.rotation.set(0, 0, 0);
          archPivot.quaternion.identity();
          if (isAnyTower() && archGizmoTarget) {
            setTowerGizmoTargetBasis();
            archGizmo.setSpace("local");
            configureArchGizmoForTower();
          } else {
            if (archGizmoTarget) archGizmoTarget.quaternion.identity();
            archGizmo.setSpace("world");
            configureArchGizmoForTower();
          }
          archPivot.updateMatrixWorld(true);
        }

        function towerPivotVecForFace(face, halfT, inset, az, y, uAlong) {
          switch (THREE.MathUtils.clamp(face | 0, 0, 3)) {
            case 0:
              return new THREE.Vector3(halfT - inset + az, y, uAlong);
            case 1:
              return new THREE.Vector3(-halfT + inset - az, y, uAlong);
            case 2:
              return new THREE.Vector3(uAlong, y, halfT - inset + az);
            case 3:
              return new THREE.Vector3(uAlong, y, -halfT + inset - az);
            default:
              return new THREE.Vector3(halfT - inset + az, y, uAlong);
          }
        }

        function towerPivotWorld() {
          const halfT = params.towerHalfWidth;
          const inset = towerFaceInsetD();
          const gf = THREE.MathUtils.clamp(
            Math.floor(params.towerGateFace) || 0,
            0,
            3,
          );
          return towerPivotVecForFace(
            gf,
            halfT,
            inset,
            params.archAlongZ,
            params.sillY + params.legHeight * 0.35,
            params.archAlong,
          );
        }

        function syncTowerGizmoFromPivot() {
          const p = archGizmoWorldPosition(_archGizmoWP);
          const halfT = params.towerHalfWidth;
          const inset = towerFaceInsetD();
          const gf = THREE.MathUtils.clamp(
            Math.floor(params.towerGateFace) || 0,
            0,
            3,
          );
          params.sillY = THREE.MathUtils.clamp(
            p.y - params.legHeight * 0.35,
            -2,
            24,
          );
          if (gf === 0) {
            params.archAlong = p.z;
            params.archAlongZ = p.x - (halfT - inset);
          } else if (gf === 1) {
            params.archAlong = p.z;
            params.archAlongZ = -halfT + inset - p.x;
          } else if (gf === 2) {
            params.archAlong = p.x;
            params.archAlongZ = p.z - (halfT - inset);
          } else {
            params.archAlong = p.x;
            params.archAlongZ = -halfT + inset - p.z;
          }
        }

        function towerRoundPivotWorld() {
          const R = Math.max(0.2, params.towerHalfWidth);
          const inset = towerFaceInsetD();
          const th = roundTowerGateThetaRad() + params.archAlong / R;
          const r = R - inset + params.archAlongZ;
          return new THREE.Vector3(
            Math.cos(th) * r,
            params.sillY + params.legHeight * 0.35,
            Math.sin(th) * r,
          );
        }

        function towerPivotWorldForMode() {
          if (isRoundTower()) return towerRoundPivotWorld();
          return towerPivotWorld();
        }

        function syncRoundTowerGizmoFromPivot() {
          const p = archGizmoWorldPosition(_archGizmoWP);
          const R = Math.max(0.2, params.towerHalfWidth);
          const inset = towerFaceInsetD();
          const th0 = roundTowerGateThetaRad();
          const th = Math.atan2(p.z, p.x);
          let dth = th - th0;
          dth =
            THREE.MathUtils.euclideanModulo(dth + Math.PI, 2 * Math.PI) -
            Math.PI;
          const limA = Math.max(0.12, Math.PI * R * 0.48);
          params.archAlong = THREE.MathUtils.clamp(dth * R, -limA, limA);
          /**
           * Orbit-only coupling: horizontal motion updates azimuth (`archAlong`). Radial depth
           * reads along the **gate outward** direction at that azimuth (not axis distance),
           * so dragging tangent to the tower does not spuriously pump `archAlongZ` like `hypot(x,z)` does.
           */
          const thGate = th0 + params.archAlong / R;
          const erx = Math.cos(thGate);
          const erz = Math.sin(thGate);
          const rProj = p.x * erx + p.z * erz;
          const d = Math.max(0.06, params.brickD * 1.1);
          const limZ = d * 0.65 + 0.5;
          params.archAlongZ = THREE.MathUtils.clamp(
            rProj - (R - inset),
            -limZ,
            limZ,
          );
          params.sillY = THREE.MathUtils.clamp(
            p.y - params.legHeight * 0.35,
            -2,
            24,
          );
        }

        function merlonBaseIntervals(halfT, merlon, crenel, faceIdx, iy) {
          const mw = Math.max(0.14, merlon);
          const cw = Math.max(0.08, crenel);
          const P = mw + cw;
          const out = [];
          const phase = ((faceIdx + (iy % 2)) % 2) * (P * 0.5);
          let u = -halfT + phase;
          const uEnd = halfT + P * 0.25;
          while (u < uEnd) {
            const lo = Math.max(-halfT, u);
            const hi = Math.min(halfT, u + mw);
            if (hi > lo + 1e-4) out.push([lo, hi]);
            u += P;
          }
          return out.length ? out : [[-halfT, halfT]];
        }

        function subtractHolesFromIntervals(intervals, opsFace, yMid, seam) {
          let ivs = intervals;
          for (const op of opsFace) {
            const rp = ringParamsFromOpening(op);
            const openH = wallOpeningHalfX(
              yMid,
              rp.ringRadius,
              op.sillY,
              rp.springY,
              seam,
            );
            if (openH <= 1e-5) continue;
            const uHole =
              typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                ? op.uArc
                : op.uCenter;
            /** Round tower: `wallOpeningHalfX` is a flat metric; carve a hair more in arc-length so shell bricks do not bite past the jamb (often worse on one side after stagger). */
            const arcRoundPad =
              params.sceneMode === "towerRound" &&
              typeof op.uArc === "number" &&
              !Number.isNaN(op.uArc)
                ? Math.max(0.05, params.brickW * 0.1)
                : 0;
            const lo = uHole - openH - arcRoundPad;
            const hi = uHole + openH + arcRoundPad;
            const next = [];
            for (const seg of ivs) {
              next.push(...subtractIntervals([seg], lo, hi));
            }
            if (next.length) ivs = next;
          }
          return ivs;
        }

        function brickGeometrySignature() {
          return [
            params.brickW,
            params.brickH,
            params.brickD,
            params.brickRound,
          ].join(",");
        }
        let lastBrickGeometrySignature = "";

        function disposeDoorWallMeshesOnly() {
          destructBricks.length = 0;
          towerDoorMeshes.forEach((m) => {
            scene.remove(m);
            if (m.geometry) m.geometry.dispose();
          });
          towerDoorMeshes = [];
          if (doorMesh) {
            scene.remove(doorMesh);
            if (doorMesh.geometry) doorMesh.geometry.dispose();
            doorMesh = null;
          }
          if (wallMesh) {
            scene.remove(wallMesh);
            if (wallMesh.geometry) wallMesh.geometry.dispose();
            wallMesh = null;
          }
        }

        function getDestructMeshes() {
          const out = [];
          if (wallMesh && wallMesh.count > 0) out.push(wallMesh);
          if (doorMesh && doorMesh.count > 0) out.push(doorMesh);
          for (const m of towerDoorMeshes) {
            if (m && m.count > 0) out.push(m);
          }
          return out;
        }

        /** Wall-field door ring or tower gate instanced meshes (not the masonry shell). */
        function isArchRingInstancedMesh(mesh) {
          if (!mesh) return false;
          if (doorMesh && mesh === doorMesh) return true;
          return towerDoorMeshes.includes(mesh);
        }

        function markDestructMeshesDirty() {
          for (const m of getDestructMeshes()) {
            m.instanceMatrix.needsUpdate = true;
          }
        }

        /** Instance matrix from CPU state (local space). */
        function composeBrickInstanceMatrix(b, outMat) {
          _dQuat.setFromEuler(
            _dEul.set(b.rotation.x, b.rotation.y, b.rotation.z, "XYZ"),
          );
          outMat.compose(b.position, _dQuat, b.scale);
        }

        /** Brick center in world space (accounts for mesh pose + instance R/T/S). */
        function brickWorldPosition(b, out) {
          b.mesh.updateMatrixWorld(true);
          composeBrickInstanceMatrix(b, _instLocal);
          _brickWorldMat.multiplyMatrices(b.mesh.matrixWorld, _instLocal);
          out.setFromMatrixPosition(_brickWorldMat);
        }

        function syncWorldPosToLocalBrick(mesh, worldPos, outLocal) {
          _invMeshW.copy(mesh.matrixWorld).invert();
          outLocal.copy(worldPos).applyMatrix4(_invMeshW);
        }

        function rebuildDestructRegistry() {
          destructBricks.length = 0;
          debrisSleepCounter = 0;
          erosionAccum = 0;
          for (const mesh of getDestructMeshes()) {
            const n = mesh.count;
            for (let i = 0; i < n; i++) {
              mesh.getMatrixAt(i, _dMat);
              _dMat.decompose(_dPos, _dQuat, _dScl);
              if (_dScl.x < 0.02) continue;
              _dEul.setFromQuaternion(_dQuat, "XYZ");
              destructBricks.push({
                mesh,
                index: i,
                position: new THREE.Vector3().copy(_dPos),
                velocity: new THREE.Vector3(),
                angularVelocity: new THREE.Vector3(),
                rotation: new THREE.Vector3(_dEul.x, _dEul.y, _dEul.z),
                scale: new THREE.Vector3().copy(_dScl),
                falling: false,
                removed: false,
                hidden: false,
                sleeping: false,
                sleepOrder: 0,
                ttl: params.debrisLifetime,
              });
            }
          }
        }

        function hideDestructEntry(b) {
          b.hidden = true;
          b.falling = false;
          b.sleeping = false;
          b.sleepOrder = 0;
          b.ttl = 0;
          _destructObj.position.set(0, -9999, 0);
          _destructObj.rotation.set(0, 0, 0);
          _destructObj.scale.set(0.001, 0.001, 0.001);
          _destructObj.updateMatrix();
          b.mesh.setMatrixAt(b.index, _destructObj.matrix);
        }

        /**
         * `hitPointWorld`: world-space point (bricks-castle uses the struck brick center).
         * `b.velocity` is integrated in **world** space; `b.position` stays instance-local.
         */
        function startFallEntry(b, hitPointWorld) {
          if (!b || b.hidden || b.falling) return;
          b.removed = true;
          brickWorldPosition(b, _wmPos2);
          _dTmp.subVectors(_wmPos2, hitPointWorld);
          if (_dTmp.lengthSq() < 1e-6) {
            _dTmp.set(
              (Math.random() - 0.5) * 0.3,
              0,
              (Math.random() - 0.5) * 0.3,
            );
          } else {
            _dTmp.normalize();
          }
          const push = 2.6 + Math.random() * 1.8;
          b.velocity.set(
            _dTmp.x * push,
            2.5 + Math.random() * 2.2,
            _dTmp.z * push,
          );
          b.angularVelocity.set(
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 6,
          );
          b.falling = true;
          b.sleeping = false;
          b.hidden = false;
          b.ttl = params.debrisLifetime;
        }

        /**
         * Geometry-based support (running-bond walls are not on an integer lattice).
         * Uses world-space centers + a coarse 3D hash like ring adjacency in bricks-castle.
         *
         * bricks-castle only removes unsupported bricks **along ring columns** (narrow coupling).
         * Our 3D hash is looser; without a per-click cap the first intact wall/tower relaxes in one
         * huge wave, then later clicks feel “precise”. `maxCollapseStarts` limits how many *extra*
         * bricks may begin falling from collapse after the blast (blast radius is unchanged).
         *
         * @param {THREE.Object3D|null} meshScope - If set, only bricks on this instanced mesh
         *   participate. Arch rings are handled separately (no collapse).
         * @param {number|null} maxCollapseStarts - cap on collapse-triggered falls; null = unlimited.
         */
        function triggerStructuralCollapseShowcase(
          meshScope = null,
          maxCollapseStarts = null,
        ) {
          const groundY = ground ? ground.position.y : 0;
          const floorYW = groundY + params.brickH * 0.58;
          const rowH =
            params.brickH + Math.max(0.006, params.wallMortar || 0.012);
          const maxDy = rowH * 1.06;
          const minDy = 0.03;
          const horizR = Math.max(params.brickW, params.brickD) * 0.52;
          const cellXZ = Math.max(0.07, params.brickW * 0.45);
          const cellY = Math.max(0.07, rowH * 0.52);

          let collapseStarts = 0;
          let changed = true;
          let guard = 0;
          while (changed && guard++ < 48) {
            changed = false;
            if (
              maxCollapseStarts != null &&
              collapseStarts >= maxCollapseStarts
            ) {
              break;
            }
            const stable = [];
            for (const b of destructBricks) {
              if (meshScope != null && b.mesh !== meshScope) continue;
              if (b.removed || b.falling || b.hidden) continue;
              stable.push(b);
            }
            const hash = new Map();
            for (const b of stable) {
              brickWorldPosition(b, _wmPos2);
              const ix = Math.floor(_wmPos2.x / cellXZ);
              const iy = Math.floor(_wmPos2.y / cellY);
              const iz = Math.floor(_wmPos2.z / cellXZ);
              const key = `${ix}|${iy}|${iz}`;
              let bucket = hash.get(key);
              if (!bucket) {
                bucket = [];
                hash.set(key, bucket);
              }
              bucket.push(b);
            }
            for (const b of stable) {
              if (
                maxCollapseStarts != null &&
                collapseStarts >= maxCollapseStarts
              ) {
                break;
              }
              brickWorldPosition(b, _wmPos2);
              if (_wmPos2.y <= floorYW) continue;
              let ok = false;
              const ix0 = Math.floor(_wmPos2.x / cellXZ);
              const iy0 = Math.floor(_wmPos2.y / cellY);
              const iz0 = Math.floor(_wmPos2.z / cellXZ);
              outer: for (let diy = -3; diy <= -1; diy++) {
                for (let dix = -1; dix <= 1; dix++) {
                  for (let diz = -1; diz <= 1; diz++) {
                    const bucket = hash.get(
                      `${ix0 + dix}|${iy0 + diy}|${iz0 + diz}`,
                    );
                    if (!bucket) continue;
                    for (const o of bucket) {
                      if (o === b) continue;
                      if (o.removed || o.falling || o.hidden) continue;
                      brickWorldPosition(o, _wmPos);
                      const dy = _wmPos2.y - _wmPos.y;
                      if (dy < minDy || dy > maxDy) continue;
                      const dx = _wmPos2.x - _wmPos.x;
                      const dz = _wmPos2.z - _wmPos.z;
                      if (dx * dx + dz * dz <= horizR * horizR) {
                        ok = true;
                        break outer;
                      }
                    }
                  }
                }
              }
              if (!ok) {
                if (
                  maxCollapseStarts != null &&
                  collapseStarts >= maxCollapseStarts
                ) {
                  continue;
                }
                startFallEntry(b, _wmPos2);
                collapseStarts++;
                changed = true;
              }
            }
          }
          markDestructMeshesDirty();
        }

        /**
         * @param {THREE.Object3D|null} blastMeshFilter - if set, only instances on this mesh
         *   are removed in the blast (avoids wrecking the arch ring when you hit the field wall).
         *   Structural collapse runs on masonry shells only. Arch rings skip collapse: the
         *   vertical “support from below” test does not fit voussoirs, so one hole would delete
         *   the whole gate regardless of blast radius.
         */
        function applyImpactAtPoint(hitPointWorld, blastMeshFilter = null) {
          let any = false;
          for (const b of destructBricks) {
            if (blastMeshFilter != null && b.mesh !== blastMeshFilter) continue;
            if (b.removed || b.falling || b.hidden) continue;
            brickWorldPosition(b, _wmPos2);
            if (_wmPos2.distanceTo(hitPointWorld) < params.removeRadius) {
              startFallEntry(b, hitPointWorld);
              any = true;
            }
          }
          if (any) {
            if (
              blastMeshFilter == null ||
              !isArchRingInstancedMesh(blastMeshFilter)
            ) {
              let cap;
              if (params.collapseSpreadMax > 0) {
                cap = Math.round(params.collapseSpreadMax);
              } else {
                cap = Math.min(
                  56,
                  Math.max(6, Math.round(4 + params.removeRadius * 14)),
                );
              }
              triggerStructuralCollapseShowcase(blastMeshFilter, cap);
            } else {
              markDestructMeshesDirty();
            }
          }
        }

        function enforceDestructDebrisLimit() {
          if (params.debrisMode !== "keep") return;
          const sleeping = [];
          for (const b of destructBricks) {
            if (b.sleeping && !b.hidden) {
              sleeping.push({ b, order: b.sleepOrder });
            }
          }
          if (sleeping.length <= params.maxDebrisCount) return;
          sleeping.sort((a, z) => a.order - z.order);
          const overflow = sleeping.length - params.maxDebrisCount;
          for (let i = 0; i < overflow; i++) {
            hideDestructEntry(sleeping[i].b);
          }
          markDestructMeshesDirty();
        }

        function updateFallingDestruct(dt) {
          const groundY = ground ? ground.position.y : 0;
          const minYWorld = groundY + params.brickH * 0.45;
          let updatedAny = false;
          for (const b of destructBricks) {
            if (!b.falling || b.hidden) continue;
            b.mesh.updateMatrixWorld(true);
            b.velocity.y -= params.gravity * dt;
            brickWorldPosition(b, _wmPos);
            _wmPos.addScaledVector(b.velocity, dt);
            syncWorldPosToLocalBrick(b.mesh, _wmPos, b.position);
            b.rotation.x += b.angularVelocity.x * dt;
            b.rotation.y += b.angularVelocity.y * dt;
            b.rotation.z += b.angularVelocity.z * dt;
            _dTmp2.copy(b.angularVelocity).multiplyScalar(params.angularDamping);
            b.angularVelocity.copy(_dTmp2);
            brickWorldPosition(b, _wmPos);
            if (_wmPos.y < minYWorld) {
              syncWorldPosToLocalBrick(
                b.mesh,
                _wmPos.set(_wmPos.x, minYWorld, _wmPos.z),
                b.position,
              );
              if (Math.abs(b.velocity.y) > 0.5) {
                b.velocity.y = -b.velocity.y * params.bounce;
                b.velocity.x *= 0.86;
                b.velocity.z *= 0.86;
              } else {
                b.velocity.y = 0;
                b.velocity.x *= 0.9;
                b.velocity.z *= 0.9;
              }
              const horizontalSpeed = Math.hypot(b.velocity.x, b.velocity.z);
              const speed = Math.hypot(horizontalSpeed, b.velocity.y);
              if (speed < params.sleepThreshold) {
                b.velocity.set(0, 0, 0);
                b.angularVelocity.set(0, 0, 0);
                b.falling = false;
                b.sleeping = true;
                b.sleepOrder = ++debrisSleepCounter;
              }
            }
            if (b.falling) {
              b.ttl -= dt;
              if (
                _wmPos.y < groundY - 8 ||
                (params.debrisMode === "fade" && b.ttl <= 0)
              ) {
                hideDestructEntry(b);
                updatedAny = true;
                continue;
              }
            }
            composeBrickInstanceMatrix(b, _instLocal);
            b.mesh.setMatrixAt(b.index, _instLocal);
            updatedAny = true;
          }
          if (updatedAny) markDestructMeshesDirty();
          enforceDestructDebrisLimit();
        }

        function updateErosionTick(dt) {
          if (!params.destructionEnabled || params.erosion < 1e-5) return;
          /** ~0…2.2 “virtual LMB” events per second at erosion=1 (quadratic = gentler near 0). */
          erosionAccum += dt * params.erosion * params.erosion * 2.2;
          while (erosionAccum >= 1) {
            erosionAccum -= 1;
            const cand = [];
            for (const b of destructBricks) {
              if (b.removed || b.falling || b.hidden) continue;
              cand.push(b);
            }
            if (!cand.length) {
              erosionAccum = 0;
              break;
            }
            cand.sort((a, z) => {
              brickWorldPosition(a, _wmPos);
              brickWorldPosition(z, _wmPos2);
              return _wmPos2.y - _wmPos.y;
            });
            const b = cand[0];
            brickWorldPosition(b, _wmPos);
            _wmPos.add(
              _wmPos2.set(
                (Math.random() - 0.5) * params.brickW * 0.14,
                (Math.random() - 0.5) * params.brickH * 0.07,
                (Math.random() - 0.5) * params.brickD * 0.14,
              ),
            );
            applyImpactAtPoint(_wmPos, b.mesh);
          }
        }

        function ensureBrickMaterial() {
          if (!brickMat) {
            const brickVarA = attribute("brickVar", "vec4");
            const shapeM = brickVarA.x;
            const warpS = brickVarA.y;
            const greyK = brickVarA.z;
            const grain = brickVarA.w;

            brickMat = new THREE.MeshStandardNodeMaterial({
              metalness: 0.015,
            });

            brickMat.colorNode = Fn(() => {
              const pw = positionWorld;
              const seed = grain.mul(6.283).add(greyK.mul(12.7));
              const p1 = pw.mul(1.05).add(vec3(seed, seed.mul(0.71), seed.mul(0.53)));
              const p2 = pw.mul(2.35).add(vec3(seed.mul(1.3), seed.mul(0.9), seed.mul(1.1)));
              const p3 = pw.mul(5.1).add(vec3(seed.mul(2.1), seed, seed.mul(1.7)));
              const w1 = sin(dot(p1, vec3(1.7, 2.3, 1.9))).mul(0.5).add(0.5);
              const w2 = sin(dot(p2, vec3(2.2, 1.4, 2.6))).mul(0.5).add(0.5);
              const w3 = sin(dot(p3, vec3(1.5, 2.8, 2.1))).mul(0.5).add(0.5);
              const fbm = w1.mul(0.52).add(w2.mul(0.32)).add(w3.mul(0.16));
              const streak = sin(
                pw.x.mul(2.8).add(pw.y.mul(4.2)).add(pw.z.mul(1.6)).add(grain.mul(24)),
              )
                .mul(0.5)
                .add(0.5);

              const dark = mix(color(0x1a1c20), color(0x2e3138), greyK);
              const mid = mix(color(0x42454c), color(0x565a62), pow(greyK, float(0.9)));
              const light = mix(color(0x65696f), color(0x82868e), smoothstep(0.1, 0.9, greyK));
              const body0 = mix(dark, mix(mid, light, greyK), float(0.58));
              const stain = smoothstep(float(0.22), float(0.78), fbm);
              const body1 = mul(body0, mix(float(0.86), float(1.06), stain));
              const warm = mix(color(0x5c5248), color(0x6a6056), streak);
              const body2 = mix(
                body1,
                mul(body1, warm),
                float(0.07).mul(smoothstep(0.35, 0.72, streak)),
              );
              const moss = smoothstep(float(0.62), float(0.94), w2.mul(w3));
              const body3 = mix(
                body2,
                mul(body2, color(0x9aa898)),
                moss.mul(0.045).mul(warpS.mul(0.4).add(0.6)),
              );

              const speck = fract(sin(dot(pw.xz, vec2(12.9898, 78.233))).mul(43758.5453));
              const freckle = smoothstep(float(0.72), float(0.96), speck).mul(0.11);
              const baseCol = mul(body3, sub(float(1), freckle));
              const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
              const coolShade = mix(float(0.66), float(1.06), nd.mul(0.6).add(0.4));
              const ax = abs(normalWorld.x);
              const ay = abs(normalWorld.y);
              const az = abs(normalWorld.z);
              const edgeFac = pow(max(ax, max(ay, az)), float(2.35));
              const edgeLift = mix(float(1), float(1.1), edgeFac.mul(0.38));
              const edgeCool = mix(float(1), float(0.94), edgeFac.mul(0.12));
              const shapeTone = mix(float(0.96), float(1.04), shapeM.mul(0.35).add(0.65));
              return mul(mul(mul(mul(baseCol, coolShade), edgeLift), edgeCool), shapeTone);
            })();

            brickMat.roughnessNode = Fn(() => {
              const pw = positionWorld.mul(2.4).add(vec3(grain.mul(9), greyK.mul(6), shapeM.mul(3)));
              const pit = sin(dot(pw, vec3(2.1, 1.7, 2.4)))
                .mul(0.5)
                .add(0.5);
              const pit2 = sin(dot(pw.mul(1.7), vec3(1.6, 2.2, 1.9)))
                .mul(0.5)
                .add(0.5);
              const microRough = pit.mul(0.55).add(pit2.mul(0.45));
              const baseR = mix(float(0.82), float(0.97), greyK.mul(0.38).add(grain.mul(0.24)));
              return clamp(baseR.add(microRough.mul(0.07)), float(0.44), float(0.995));
            })();

            brickMat.emissiveNode = Fn(() => {
              const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
              const rim = pow(
                sub(float(1), abs(dot(normalWorld, vec3(0, 1, 0)))),
                float(2.15),
              );
              const g0 = mix(color(0x4a4d52), color(0x686c72), nd);
              return mul(g0, mul(rim, float(0.032))).mul(warpS.mul(0.55).add(0.45));
            })();

            brickMat.positionNode = Fn(() => {
              const pl = positionLocal;
              const nl = normalLocal;
              const ax = abs(pl.x);
              const ay = abs(pl.y);
              const az = abs(pl.z);
              const mn = min(ax, min(ay, az));
              const mx = max(ax, max(ay, az));
              const edgeShell = smoothstep(float(0.14), float(0.44), mx);
              const cornerBand = smoothstep(float(0.022), float(0.095), mn).mul(
                smoothstep(float(0.33), float(0.48), mx),
              );
              const plLen = length(pl);
              const cenW = smoothstep(float(0.01), float(0.05), plLen);

              const wv = warpS.mul(shapeM.mul(0.55).add(0.45));
              const bump = sin(
                pl.x.mul(11).add(pl.y.mul(9)).add(pl.z.mul(7)).add(grain.mul(40)),
              )
                .mul(0.5)
                .add(0.5);
              const amp = float(0.017)
                .mul(edgeShell)
                .mul(wv)
                .mul(mix(float(0.65), float(1.15), bump))
                .mul(cenW);

              const chipPick = fract(
                grain.mul(47.13).add(greyK.mul(91.7)).add(shapeM.mul(23.1)),
              );
              const chipMask = smoothstep(float(0.84), float(0.96), chipPick)
                .mul(cornerBand)
                .mul(edgeShell)
                .mul(cenW);
              const chipMag = float(0.012)
                .mul(chipMask)
                .mul(warpS.mul(0.42).add(0.58));
              const rlen = max(length(pl), float(1e-5));
              const radial = normalize(div(pl, rlen));
              const chip = mul(radial, float(-1)).mul(chipMag);

              return positionLocal.add(nl.mul(amp)).add(chip);
            })();
          }
        }

        function ensureBrickGeometry(force) {
          const sig = brickGeometrySignature();
          if (!force && brickGeo && sig === lastBrickGeometrySignature) {
            return;
          }
          if (brickGeo) {
            brickGeo.dispose();
            brickGeo = null;
          }
          const rRound = Math.max(0.0001, params.brickRound);
          brickGeo = new RoundedBoxGeometry(
            params.brickW,
            params.brickH,
            params.brickD,
            2,
            rRound,
          );
          lastBrickGeometrySignature = sig;
        }

        /** Rebuild door + wall instances. If `remakeGeometry` is true, also rebuild shared brick geometry. */
        function rebuildInstances(remakeGeometry) {
          disposeDoorWallMeshesOnly();
          ensureBrickMaterial();
          ensureBrickGeometry(!!remakeGeometry);
          clampArchAlong();
          clampArchAlongZ();
          clampDoorSillInWall();
          if (isDraggingArchGizmo && archPivot) {
            resetArchGizmoTargetOffset();
            if (isAnyTower()) {
              archPivot.position.copy(towerPivotWorldForMode());
            } else {
              archPivot.position.x = params.archAlong;
              archPivot.position.y =
                params.sillY + params.legHeight * 0.35;
              archPivot.position.z = params.archAlongZ;
            }
          }
          buildDoorInstances();
          buildWallInstances();
          if (!isDraggingArchGizmo) updateArchGizmoFromParams();
          if (isAnyTower()) {
            const ty = params.towerAnchorY + params.towerHeight * 0.42;
            controls.target.set(0, ty, 0);
          } else {
            const rp = ringParamsFromGui();
            const midY =
              (rp.springY + params.sillY) * 0.5 + rp.ringRadius * 0.35;
            controls.target.set(
              params.archAlong,
              midY,
              params.archAlongZ * 0.22,
            );
          }
          rebuildDestructRegistry();
        }

        function rebuildAll() {
          rebuildInstances(true);
        }

        function syncFromArchPivot() {
          if (!archPivot) return;
          if (isAnyTower()) {
            if (isRoundTower()) syncRoundTowerGizmoFromPivot();
            else syncTowerGizmoFromPivot();
            clampArchAlong();
            clampArchAlongZ();
            clampDoorSillInWall();
            resetArchGizmoTargetOffset();
            archPivot.position.copy(towerPivotWorldForMode());
            syncArchPivotOrientationAndGizmoSpace();
            rebuildInstances(false);
            return;
          }
          const pw = archGizmoWorldPosition(_archGizmoWP);
          params.archAlong = pw.x;
          params.archAlongZ = pw.z;
          params.sillY = THREE.MathUtils.clamp(
            pw.y - params.legHeight * 0.35,
            -2,
            10,
          );
          clampArchAlong();
          clampArchAlongZ();
          clampDoorSillInWall();
          resetArchGizmoTargetOffset();
          archPivot.position.x = params.archAlong;
          archPivot.position.y = params.sillY + params.legHeight * 0.35;
          archPivot.position.z = params.archAlongZ;
          syncArchPivotOrientationAndGizmoSpace();
          rebuildInstances(false);
        }

        function updateArchGizmoFromParams() {
          if (!archPivot || isDraggingArchGizmo) return;
          clampArchAlong();
          clampArchAlongZ();
          clampDoorSillInWall();
          if (isAnyTower()) {
            archPivot.position.copy(towerPivotWorldForMode());
            syncArchPivotOrientationAndGizmoSpace();
            return;
          }
          archPivot.position.set(
            params.archAlong,
            params.sillY + params.legHeight * 0.35,
            params.archAlongZ,
          );
          syncArchPivotOrientationAndGizmoSpace();
        }

        let archDragRaf = 0;
        let archRoundOrbitDrag = false;
        let archRoundOrbitLastX = 0;

        /** TransformControls: tower = local translate; round = Y/Z only + Alt+drag orbit (see listeners). */
        function configureArchGizmoForTower() {
          if (!archGizmo) return;
          if (!isAnyTower()) {
            archGizmo.showX =
              archGizmo.showY =
              archGizmo.showZ =
                true;
            archGizmo.showXY =
              archGizmo.showXZ =
              archGizmo.showYZ =
                true;
            return;
          }
          archGizmo.setMode("translate");
          archGizmo.setSpace("local");
          archGizmo.showY = true;
          archGizmo.showZ = true;
          archGizmo.showXY = false;
          archGizmo.showXZ = false;
          archGizmo.showYZ = false;
          /** Round: no tangent translate handle; orbit = RMB + horizontal drag on the view. */
          archGizmo.showX = !isRoundTower();
        }
        function setupArchGizmo() {
          if (archGizmo) return;
          archPivot = new THREE.Object3D();
          archPivot.name = "archPivot";
          scene.add(archPivot);

          archGizmoTarget = new THREE.Object3D();
          archGizmoTarget.name = "archGizmoTarget";
          archPivot.add(archGizmoTarget);

          archGizmo = new TransformControls(camera, renderer.domElement);
          archGizmo.attach(archGizmoTarget);
          archGizmo.setMode("translate");
          archGizmo.setSpace("world");
          archGizmo.size = 0.78;
          archGizmo.enabled = params.showArchGizmo;
          archGizmo.visible = params.showArchGizmo;

          archGizmo.addEventListener("dragging-changed", (e) => {
            isDraggingArchGizmo = e.value;
            controls.enabled = !e.value;
            if (!e.value) {
              if (archDragRaf) {
                cancelAnimationFrame(archDragRaf);
                archDragRaf = 0;
              }
              archRoundOrbitDrag = false;
              clampArchAlong();
              clampArchAlongZ();
              clampDoorSillInWall();
              updateArchGizmoFromParams();
              rebuildInstances(false);
            }
          });
          archGizmo.addEventListener("change", () => {
            if (!isDraggingArchGizmo) return;
            if (archDragRaf) cancelAnimationFrame(archDragRaf);
            archDragRaf = requestAnimationFrame(() => {
              archDragRaf = 0;
              syncFromArchPivot();
            });
          });

          /** Round tower: orbit gate around the drum (azimuth). RMB drag = orbit (no red axis). */
          renderer.domElement.addEventListener("contextmenu", (e) => {
            if (params.showArchGizmo && isRoundTower()) e.preventDefault();
          });
          renderer.domElement.addEventListener("mousedown", (e) => {
            if (!params.showArchGizmo || !isRoundTower()) return;
            if (e.button === 2) {
              archRoundOrbitDrag = true;
              archRoundOrbitLastX = e.clientX;
              controls.enabled = false;
            }
          });
          renderer.domElement.addEventListener("mousemove", (e) => {
            if (
              !archRoundOrbitDrag ||
              !isRoundTower() ||
              !params.showArchGizmo ||
              isDraggingArchGizmo
            )
              return;
            const dx = e.clientX - archRoundOrbitLastX;
            archRoundOrbitLastX = e.clientX;
            const R = Math.max(0.2, params.towerHalfWidth);
            params.archAlong += dx * 0.0085 * R;
            clampArchAlong();
            if (!isDraggingArchGizmo) updateArchGizmoFromParams();
            rebuildInstances(false);
          });
          window.addEventListener("mouseup", () => {
            if (archRoundOrbitDrag) {
              archRoundOrbitDrag = false;
              if (!isDraggingArchGizmo) controls.enabled = true;
            }
          });

          archGizmoHelper = archGizmo.getHelper();
          scene.add(archGizmoHelper);
          updateArchGizmoFromParams();
        }

        function buildTowerShellInstances() {
          if (!brickGeo) return;

          const halfT = params.towerHalfWidth;
          const wallBase = params.towerAnchorY;
          const topY =
            wallBase + Math.max(params.brickH * 2, params.towerHeight);
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const ny = Math.min(
            260,
            Math.max(3, Math.ceil((topY - baseY) / rowH)),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          /**
           * Tower shell is authored in world space. Skip `wallZ` (single-façade slab offset):
           * applying it here shifts ±X faces along world Z, which is their tangent `u`,
           * so hole intervals and brick positions desync from the arch ring (jamb gap/clip).
           */
          wallMesh.position.set(0, 0, 0);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;
          const inset = towerFaceInsetD();

          const placeTowerBrick = (face, u, y, sx, sy, sz) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            let bx;
            let by;
            let bz;
            if (face === 0) {
              bx = halfT - inset;
              by = y;
              bz = u;
              tmpO.rotation.set(0, -Math.PI / 2, 0);
            } else if (face === 1) {
              bx = -halfT + inset;
              by = y;
              bz = u;
              tmpO.rotation.set(0, Math.PI / 2, 0);
            } else if (face === 2) {
              bx = u;
              by = y;
              bz = halfT - inset;
              tmpO.rotation.set(0, 0, 0);
            } else {
              bx = u;
              by = y;
              bz = -halfT + inset;
              tmpO.rotation.set(0, Math.PI, 0);
            }
            tmpO.position.set(bx, by, bz);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          const battRows = params.towerBattlements
            ? THREE.MathUtils.clamp(
                Math.floor(params.towerBattlementCourses) || 2,
                1,
                4,
              )
            : 0;
          const battY0 =
            battRows > 0 ? topY - rowH * battRows : topY + 1e6;

          for (let face = 0; face < 4; face++) {
            const opsFace = getTowerOpeningsList().filter((o) => o.face === face);
            outer: for (let iy = 0; iy < ny; iy++) {
              const yMid = baseY + iy * rowH;
              if (yMid > topY - nomH * 0.2) break;

              const isBatRow =
                params.towerBattlements && yMid >= battY0 - rowH * 0.02;
              const rawIntervals = isBatRow
                ? merlonBaseIntervals(
                    halfT,
                    params.towerMerlonW,
                    params.towerCrenelW,
                    face,
                    iy,
                  )
                : [[-halfT, halfT]];
              const intervals = subtractHolesFromIntervals(
                rawIntervals,
                opsFace,
                yMid,
                seam,
              );

              let maxCurveT = 0;
              for (const op of opsFace) {
                const rp = ringParamsFromOpening(op);
                const R_out = rp.ringRadius;
                const ohC = wallOpeningHalfX(
                  yMid,
                  R_out,
                  op.sillY,
                  rp.springY,
                  seam,
                );
                if (ohC <= 1e-5) continue;
                const c = wallOpeningCurvature(
                  yMid,
                  R_out,
                  op.sillY,
                  rp.springY,
                  seam,
                );
                maxCurveT = Math.max(
                  maxCurveT,
                  THREE.MathUtils.smoothstep(0.06, 1.15, c),
                );
              }
              const nomWCurve =
                nomW *
                THREE.MathUtils.lerp(
                  1,
                  THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                  Math.pow(maxCurveT, 1.08),
                );

              const haunch = THREE.MathUtils.smoothstep(
                wallBase + params.towerHeight * 0.12,
                topY - nomH * 0.35,
                yMid,
              );
              const crownSy =
                1 -
                (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                  Math.pow(haunch, 1.28);

              for (const [segLo, segHi] of intervals) {
                const span = segHi - segLo;
                if (span < nomW * params.wallMinBrickScale * 0.45) continue;

                const minW = nomW * params.wallMinBrickScale;
                const jMin = 0.0035;
                const jMax = Math.min(
                  mortar,
                  Math.max(jMin, span * 0.014 + jMin * 0.6),
                );
                const j = THREE.MathUtils.clamp(mortar, jMin, jMax);
                const hj = j * 0.5;
                let innerLo = segLo + hj;
                let innerHi = segHi - hj;
                if (iy % 2 === 1) {
                  const shift = Math.min(
                    (nomWCurve + j) * 0.48,
                    Math.max(0, innerHi - innerLo - minW * 1.2) * 0.35,
                  );
                  /**
                   * Match wall-mode running bond: one opening center + fixed eps.
                   * The older per-opening eps + OR logic could mis-classify jambs on
                   * ±X faces (rotated bricks) and split shifts (gap one side, clip other).
                   */
                  const eps = Math.max(1e-3, nomW * 0.025);
                  const op0 = opsFace[0];
                  let openHJ = 0;
                  let gxJ = 0;
                  if (op0) {
                    const rpJ = ringParamsFromOpening(op0);
                    openHJ = wallOpeningHalfX(
                      yMid,
                      rpJ.ringRadius,
                      op0.sillY,
                      rpJ.springY,
                      seam,
                    );
                    gxJ =
                      typeof op0.uArc === "number" && !Number.isNaN(op0.uArc)
                        ? op0.uArc
                        : op0.uCenter;
                  }
                  const rightOfOpening =
                    openHJ > 1e-5 && segLo >= gxJ + openHJ - eps;
                  const leftOfOpening =
                    openHJ > 1e-5 && segHi <= gxJ - openHJ + eps;
                  if (rightOfOpening) innerHi -= shift;
                  else if (leftOfOpening) innerLo += shift;
                  else innerLo += shift;
                }

                const innerLen = innerHi - innerLo;
                if (innerLen < minW * 0.72) continue;

                let nBricks = Math.max(
                  1,
                  Math.round(innerLen / (nomWCurve + j)),
                );
                let wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                for (let it = 0; it < 96; it++) {
                  wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                  if (wEq < minW * 0.998) {
                    if (nBricks <= 1) break;
                    nBricks--;
                  } else if (wEq > nomWCurve * 1.075 && nBricks < 1600) {
                    nBricks++;
                  } else break;
                }
                wEq = (innerLen - (nBricks - 1) * j) / nBricks;
                if (wEq < minW * 0.88) continue;

                for (let bi = 0; bi < nBricks; bi++) {
                  if (k >= params.maxWallBricks) break outer;
                  const u = innerLo + wEq * 0.5 + bi * (wEq + j);
                  if (u > innerHi - wEq * 0.5 + 1e-4) break;

                  let tuckY = 0;
                  for (const op of opsFace) {
                    const rp = ringParamsFromOpening(op);
                    const R_out = rp.ringRadius;
                    const openH = wallOpeningHalfX(
                      yMid,
                      R_out,
                      op.sillY,
                      rp.springY,
                      seam,
                    );
                    if (openH <= 1e-4) continue;
                    const curv = wallOpeningCurvature(
                      yMid,
                      R_out,
                      op.sillY,
                      rp.springY,
                      seam,
                    );
                    const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
                    if (curveT <= 0.04) continue;
                    const uRef =
                      typeof op.uArc === "number" && !Number.isNaN(op.uArc)
                        ? op.uArc
                        : op.uCenter;
                    const gap = Math.max(0, Math.abs(u - uRef) - openH);
                    const band = params.brickW * 3.8;
                    if (gap < band) {
                      const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                      const ty =
                        -nomH *
                        0.12 *
                        Math.pow(t, 1.2) *
                        Math.pow(curveT, 0.55);
                      tuckY = Math.min(tuckY, ty);
                    }
                  }

                  const sx = wEq / nomW;
                  const yMerl = isBatRow ? params.towerMerlonLift * 0.45 : 0;
                  const syBase = (0.91 + rnd() * 0.06) * crownSy;
                  const sy = isBatRow
                    ? syBase *
                      (1 +
                        params.towerMerlonLift /
                          Math.max(0.12, nomH))
                    : syBase;
                  const sz = 0.92 + rnd() * 0.06;
                  if (
                    !placeTowerBrick(
                      face,
                      u,
                      yMid + tuckY + yMerl,
                      sx,
                      sy,
                      sz,
                    )
                  )
                    break outer;
                }
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          const wbv = wallMesh.geometry.getAttribute("brickVar");
          if (wbv) wbv.needsUpdate = true;
          scene.add(wallMesh);
        }

        /** Cylindrical tower shell: arc-length coordinate u = θ·R on [−πR, πR], one gate via `uArc`. */
        function buildTowerRoundShellInstances() {
          if (!brickGeo) return;

          const Rc = Math.max(0.35, params.towerHalfWidth);
          const devHalf = Math.PI * Rc;
          const wallBase = params.towerAnchorY;
          const topY =
            wallBase + Math.max(params.brickH * 2, params.towerHeight);
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const baseY = wallBase + mortar * 0.5 + nomH * 0.5;
          const ny = Math.min(
            260,
            Math.max(3, Math.ceil((topY - baseY) / rowH)),
          );

          wallMesh = new THREE.InstancedMesh(
            createInstancedBrickGeometry(brickGeo, params.maxWallBricks),
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, 0);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;
          const inset = towerFaceInsetD();

          /**
           * Same convention as bricks-castle3.html: `lookAt(2x,y,2z)` then `rotateY(π/2)` so
           * local +X runs tangent, +Z points toward the tower axis (brick depth into the shell).
           * The old `makeBasis` path used +Z outward, which flipped depth/lighting vs flat tower faces.
           */
          const placeRoundBrick = (theta, y, sx, sy, sz, iyRow) => {
            if (k >= params.maxWallBricks) return false;
            const v = pickBrickVariation(rnd, sx, sy, sz, "wall");
            const rCyl = Rc - inset;
            const px = Math.cos(theta) * rCyl;
            const pz = Math.sin(theta) * rCyl;
            const yJ =
              iyRow > 0 ? y + (rnd() - 0.5) * rowH * 0.045 : y;
            tmpO.position.set(px, yJ, pz);
            tmpO.quaternion.identity();
            tmpO.lookAt(px * 2, yJ, pz * 2);
            tmpO.rotateY(Math.PI * 0.5);
            tmpO.rotateX((rnd() - 0.5) * 0.028);
            tmpO.rotateY((rnd() - 0.5) * 0.038);
            tmpO.rotateZ((rnd() - 0.5) * 0.028);
            tmpO.scale.set(v.sx, v.sy, v.sz);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            setBrickVarAt(wallMesh, k, v.shapeMix, v.warp, v.grey, v.grain);
            k++;
            return true;
          };

          const battRows = params.towerBattlements
            ? THREE.MathUtils.clamp(
                Math.floor(params.towerBattlementCourses) || 2,
                1,
                4,
              )
            : 0;
          const battY0 =
            battRows > 0 ? topY - rowH * battRows : topY + 1e6;

          const opsR = getTowerOpeningsList();

          outerRound: for (let iy = 0; iy < ny; iy++) {
            const yMid = baseY + iy * rowH;
            if (yMid > topY - nomH * 0.2) break;

            const isBatRow =
              params.towerBattlements && yMid >= battY0 - rowH * 0.02;
            const rawIntervals = isBatRow
              ? merlonBaseIntervals(
                  devHalf,
                  params.towerMerlonW,
                  params.towerCrenelW,
                  0,
                  iy,
                )
              : [[-devHalf, devHalf]];
            const intervals = subtractHolesFromIntervals(
              rawIntervals,
              opsR,
              yMid,
              seam,
            );

            let maxCurveT = 0;
            for (const op of opsR) {
              const rp = ringParamsFromOpening(op);
              const R_out = rp.ringRadius;
              const ohC = wallOpeningHalfX(
                yMid,
                R_out,
                op.sillY,
                rp.springY,
                seam,
              );
              if (ohC <= 1e-5) continue;
              const c = wallOpeningCurvature(
                yMid,
                R_out,
                op.sillY,
                rp.springY,
