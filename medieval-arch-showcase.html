<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick arch door + adaptive wall — WebGPU + TSL</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #1a1d24;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn,
        float,
        color,
        vec2,
        vec3,
        sin,
        mix,
        smoothstep,
        mul,
        sub,
        abs,
        normalWorld,
        positionWorld,
        dot,
        pow,
        clamp,
        uniform,
      } from "three/tsl";

      /** Length of the ∩ outline: left jamb + semicircle + right jamb (no sill). */
      function pathULength(p) {
        const Lj = Math.max(1e-6, p.springY - p.sillY);
        return 2 * Lj + Math.PI * p.ringRadius;
      }

      /** Horizontal sill from (-R,y0) → (R,y0), s ∈ [0, 2R]. */
      function sampleSill(s, R, y0) {
        const t = s / (2 * R);
        const x = THREE.MathUtils.lerp(-R, R, t);
        return { x, y: y0, tx: 1, ty: 0 };
      }

      /** ∩ path only: left jamb up → arch (left→right over crown) → right jamb down. */
      function sampleUPath(s, p) {
        const R = p.ringRadius;
        const y0 = p.sillY;
        const ys = p.springY;
        const Lj = Math.max(1e-6, ys - y0);
        const La = Math.PI * R;
        let u = s;

        if (u <= Lj) {
          const t = u / Lj;
          const y = THREE.MathUtils.lerp(y0, ys, t);
          return { x: -R, y, tx: 0, ty: 1 };
        }
        u -= Lj;
        if (u <= La) {
          const t = u / La;
          const ang = Math.PI * (1 - t);
          const ca = Math.cos(ang);
          const sa = Math.sin(ang);
          const x = R * ca;
          const y = ys + R * sa;
          const tx = sa;
          const ty = -ca;
          const inv = 1 / Math.hypot(tx, ty);
          return { x, y, tx: tx * inv, ty: ty * inv };
        }
        u -= La;
        const t = THREE.MathUtils.clamp(u / Lj, 0, 1);
        const y = THREE.MathUtils.lerp(ys, y0, t);
        return { x: R, y, tx: 0, ty: -1 };
      }

      function subtractIntervals(intervals, holeLo, holeHi) {
        if (holeHi <= holeLo) return intervals;
        const out = [];
        for (const [a, b] of intervals) {
          if (b <= a + 1e-6) continue;
          if (holeHi <= a || holeLo >= b) {
            out.push([a, b]);
            continue;
          }
          if (holeLo > a + 1e-4) out.push([a, Math.min(holeLo, b)]);
          if (holeHi < b - 1e-4) out.push([Math.max(holeHi, a), b]);
        }
        return out;
      }

      /** Horizontal extent (|x|) where wall field must stay outside so it does not clip the ring. */
      function wallOpeningHalfX(y, R_out, y0, ys, seam) {
        if (y < y0 - 1e-6) return 0;
        if (y < ys - 1e-6) return R_out + seam;
        const dy = y - ys;
        if (dy > R_out + 1e-6) return 0;
        const inner = R_out * R_out - dy * dy;
        if (inner <= 0) return 0;
        return Math.sqrt(inner) + seam;
      }

      /** How fast the opening boundary moves in X with Y (large near springing and haunches). */
      function wallOpeningCurvature(y, R_out, y0, ys, seam) {
        const e = 0.06;
        const a = wallOpeningHalfX(y + e, R_out, y0, ys, seam);
        const b = wallOpeningHalfX(y - e, R_out, y0, ys, seam);
        return Math.abs(a - b) / e;
      }

      const tmpO = new THREE.Object3D();
      const stoneTmp = new THREE.Color();

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      async function main() {
        const params = {
          doorInnerHalfW: 1.15,
          masonryShell: 0.42,
          legHeight: 2.35,
          sillY: 0.02,
          closeBottom: false,
          brickW: 0.52,
          brickH: 0.38,
          brickD: 0.55,
          brickRound: 0.06,
          spacingMul: 1.02,
          maxBricks: 2200,
          maxWallBricks: 14000,
          colorSeed: 31415,
          showGrid: true,

          wallEnabled: true,
          wallWidth: 15,
          wallHeight: 6.2,
          wallDepth: 0.62,
          wallZ: -0.22,
          wallMortar: 0.024,
          wallSeamInset: 0.038,
          wallEdgeBlendBw: 4.2,
          wallMinBrickScale: 0.26,
          wallCrownSquash: 0.78,
        };

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);
        await renderer.init();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a3140);

        const camera = new THREE.PerspectiveCamera(
          42,
          window.innerWidth / window.innerHeight,
          0.1,
          200,
        );
        camera.position.set(5.8, 3.1, 9.2);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.2, 0);
        controls.enableDamping = true;
        controls.minDistance = 3;
        controls.maxDistance = 40;

        const hemi = new THREE.HemisphereLight(0xb8c9e0, 0x3a3530, 0.5);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xfff4e8, 2.1);
        sun.position.set(-8, 14, 6);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.bias = -0.00006;
        sun.shadow.normalBias = 0.028;
        sun.shadow.radius = 4;
        const sh = 18;
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 40;
        sun.shadow.camera.left = -sh;
        sun.shadow.camera.right = sh;
        sun.shadow.camera.top = sh;
        sun.shadow.camera.bottom = -sh;
        scene.add(sun);

        const sunDirUniform = uniform(new THREE.Vector3());

        const groundMat = new THREE.MeshStandardNodeMaterial({
          roughness: 0.95,
          metalness: 0,
        });
        groundMat.colorNode = Fn(() => {
          const pw = positionWorld;
          const xz = vec2(pw.x.mul(0.12), pw.z.mul(0.12));
          const n = sin(xz.x.mul(1.9)).mul(0.5).add(0.5).mul(0.22).add(
            sin(xz.y.mul(1.6)).mul(0.5).add(0.5).mul(0.16),
          );
          const c0 = color(0x4a5568);
          const c1 = color(0x5c6675);
          return mul(mix(c0, c1, smoothstep(0.15, 0.9, n)), float(1.05));
        })();
        groundMat.emissiveNode = Fn(() => {
          const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
          return mul(color(0x1e2430), pow(nd, float(1.35))).mul(0.12);
        })();

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          groundMat,
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        let grid = null;
        function setGrid(vis) {
          if (grid) {
            scene.remove(grid);
            grid.traverse((o) => {
              if (o.geometry) o.geometry.dispose();
              if (o.material) o.material.dispose();
            });
            grid = null;
          }
          if (!vis) return;
          grid = new THREE.GridHelper(24, 24, 0x4a5560, 0x3a4152);
          grid.position.y = 0.001;
          scene.add(grid);
        }
        setGrid(params.showGrid);

        let brickGeo = null;
        let brickMat = null;
        let doorMesh = null;
        let wallMesh = null;

        function ringParamsFromGui() {
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const springY = params.sillY + Math.max(0.05, params.legHeight);
          return {
            ringRadius: R_out,
            sillY: params.sillY,
            springY,
          };
        }

        function rebuildAll() {
          if (doorMesh) {
            scene.remove(doorMesh);
            doorMesh = null;
          }
          if (wallMesh) {
            scene.remove(wallMesh);
            wallMesh = null;
          }
          if (brickGeo) {
            brickGeo.dispose();
            brickGeo = null;
          }

          const rRound = Math.max(0.0001, params.brickRound);
          brickGeo = new RoundedBoxGeometry(
            params.brickW,
            params.brickH,
            params.brickD,
            2,
            rRound,
          );
          if (!brickMat) {
            brickMat = new THREE.MeshStandardNodeMaterial({
              color: new THREE.Color(0x7a8494),
              roughness: 0.93,
              metalness: 0.02,
            });
            brickMat.emissiveNode = Fn(() => {
              const nd = clamp(dot(normalWorld, sunDirUniform), 0, 1);
              const edge = pow(
                sub(float(1), abs(dot(normalWorld, vec3(0, 1, 0)))),
                float(2),
              );
              return mul(color(0xb8d0ec), mul(mul(nd, edge), float(0.08)));
            })();
          }

          buildDoorInstances();
          buildWallInstances();

          const rp = ringParamsFromGui();
          const midY =
            (rp.springY + params.sillY) * 0.5 + rp.ringRadius * 0.35;
          controls.target.set(0, midY, 0);
        }

        function buildDoorInstances() {
          const rp = ringParamsFromGui();
          const R = rp.ringRadius;
          const Lu = pathULength(rp);
          const Ls = params.closeBottom ? 2 * R : 0;
          const spacing =
            params.brickW * Math.max(0.35, params.spacingMul) + 0.024;

          let nU = Math.max(6, Math.ceil(Lu / spacing));
          let nS =
            Ls > 0 ? Math.max(2, Math.ceil(Ls / spacing)) : 0;
          if (nU + nS > params.maxBricks) {
            const room = params.maxBricks - nS;
            nU = Math.max(4, Math.min(nU, room));
            if (nU + nS > params.maxBricks)
              nS = Math.max(0, params.maxBricks - nU);
          }
          const n = nU + nS;

          doorMesh = new THREE.InstancedMesh(
            brickGeo,
            brickMat,
            Math.min(params.maxBricks, n + 8),
          );
          doorMesh.castShadow = true;
          doorMesh.receiveShadow = true;

          const rnd = mulberry32(params.colorSeed | 0);
          let k = 0;

          const placeBrick = (x, y, tx, ty, along) => {
            const yaw = Math.atan2(ty, tx);
            const sx = THREE.MathUtils.clamp(
              along / params.brickW,
              0.42,
              1.65,
            );
            const sy = 0.88 + rnd() * 0.14;
            const sz = 0.9 + rnd() * 0.12;
            tmpO.position.set(x, y, 0);
            tmpO.rotation.set(0, 0, yaw);
            tmpO.scale.set(sx, sy, sz);
            tmpO.updateMatrix();
            doorMesh.setMatrixAt(k, tmpO.matrix);
            const g = 0.38 + rnd() * 0.2;
            stoneTmp.setRGB(g * 0.88, g * 0.9, g * 0.98);
            doorMesh.setColorAt(k, stoneTmp);
            k++;
          };

          for (let i = 0; i < nU; i++) {
            const s = ((i + 0.5) / nU) * Lu;
            const o = sampleUPath(s, rp);
            placeBrick(o.x, o.y, o.tx, o.ty, Lu / nU);
          }
          for (let i = 0; i < nS; i++) {
            const s = ((i + 0.5) / nS) * Ls;
            const o = sampleSill(s, R, rp.sillY);
            placeBrick(o.x, o.y, o.tx, o.ty, Ls / nS);
          }

          doorMesh.count = k;
          doorMesh.instanceMatrix.needsUpdate = true;
          if (doorMesh.instanceColor)
            doorMesh.instanceColor.needsUpdate = true;
          scene.add(doorMesh);
        }

        function buildWallInstances() {
          if (!params.wallEnabled || !brickGeo) return;

          const rp = ringParamsFromGui();
          const R_in = Math.max(0.08, params.doorInnerHalfW);
          const R_out = R_in + Math.max(0.05, params.masonryShell);
          const y0 = params.sillY;
          const ys = rp.springY;
          const seam = params.wallSeamInset;
          const mortar = params.wallMortar;
          const nomH = params.brickH;
          const nomW = params.brickW;
          const rowH = nomH + mortar;
          const wallLo = -params.wallWidth * 0.5;
          const wallHi = params.wallWidth * 0.5;
          const baseY = y0 + mortar * 0.5 + nomH * 0.5;
          const topY = y0 + Math.max(nomH * 2, params.wallHeight);
          const ny = Math.min(220, Math.max(3, Math.ceil((topY - baseY) / rowH)));

          wallMesh = new THREE.InstancedMesh(
            brickGeo,
            brickMat,
            params.maxWallBricks,
          );
          wallMesh.castShadow = true;
          wallMesh.receiveShadow = true;
          wallMesh.position.set(0, 0, params.wallZ);

          const rnd = mulberry32((params.colorSeed ^ 91379) | 0);
          let k = 0;

          const placeWallBrick = (cx, cy, sx, sy, sz) => {
            if (k >= params.maxWallBricks) return false;
            tmpO.position.set(cx, cy, 0);
            tmpO.rotation.set(0, 0, 0);
            tmpO.scale.set(sx, sy, sz);
            tmpO.updateMatrix();
            wallMesh.setMatrixAt(k, tmpO.matrix);
            const g = 0.34 + rnd() * 0.19;
            stoneTmp.setRGB(g * 0.85, g * 0.88, g * 0.96);
            wallMesh.setColorAt(k, stoneTmp);
            k++;
            return true;
          };

          outer: for (let iy = 0; iy < ny; iy++) {
            const yMid = baseY + iy * rowH;
            if (yMid > topY - nomH * 0.2) break;

            const openH = wallOpeningHalfX(yMid, R_out, y0, ys, seam);
            let intervals = [[wallLo, wallHi]];
            if (openH > 1e-5) {
              intervals = subtractIntervals(intervals, -openH, openH);
            }

            const curv = wallOpeningCurvature(yMid, R_out, y0, ys, seam);
            const curveT = THREE.MathUtils.smoothstep(0.06, 1.15, curv);
            const nomWCurve =
              nomW *
              THREE.MathUtils.lerp(
                1,
                THREE.MathUtils.clamp(params.wallMinBrickScale, 0.16, 0.95),
                Math.pow(curveT, 1.08),
              );

            const haunch =
              yMid >= ys - mortar * 1.5 && yMid <= ys + R_out * 1.05
                ? THREE.MathUtils.smoothstep(
                    ys - 0.12,
                    ys + R_out * 0.82,
                    yMid,
                  )
                : 0;
            const crownSy =
              1 -
              (1 - THREE.MathUtils.clamp(params.wallCrownSquash, 0.42, 1)) *
                Math.pow(haunch, 1.28);

            for (const [segLo, segHi] of intervals) {
              const span = segHi - segLo;
              if (span < nomW * params.wallMinBrickScale * 0.45) continue;

              let L = segLo;
              if (iy % 2 === 1) {
                L += (nomWCurve + mortar) * 0.5;
                while (L > segLo + 1e-5) L -= nomWCurve + mortar;
                if (L < segLo) L = segLo;
              }

              const minW = nomW * params.wallMinBrickScale;
              const edgeBlend = params.brickW * params.wallEdgeBlendBw;

              let guard = 0;
              while (L + minW + mortar <= segHi + 1e-5) {
                if (++guard > 800 || k >= params.maxWallBricks) break outer;

                const rem = segHi - L;
                let w = Math.min(nomWCurve, rem - mortar);
                const cxTry = L + w * 0.5;
                const distToBound = Math.min(
                  Math.abs(cxTry - segLo),
                  Math.abs(segHi - cxTry),
                );
                const tEdge = THREE.MathUtils.clamp(
                  distToBound / edgeBlend,
                  0,
                  1,
                );
                w *= THREE.MathUtils.lerp(0.58, 1, Math.pow(tEdge, 0.42));
                w = Math.min(w, rem - mortar);
                w = Math.max(w, minW);

                if (L + w > segHi + 1e-4) {
                  w = Math.max(minW, segHi - L - mortar);
                  if (w < minW * 0.9 || L + w > segHi + 1e-3) break;
                }

                const cx = L + w * 0.5;
                let tuckY = 0;
                if (openH > 1e-4 && curveT > 0.04) {
                  const gap = Math.abs(Math.abs(cx) - openH);
                  const band = params.brickW * 3.8;
                  if (gap < band) {
                    const t = THREE.MathUtils.smoothstep(1, 0, gap / band);
                    tuckY =
                      -nomH * 0.12 * Math.pow(t, 1.2) * Math.pow(curveT, 0.55);
                  }
                }

                const sx = w / nomW;
                const sy = (0.9 + rnd() * 0.09) * crownSy;
                const sz = 0.9 + rnd() * 0.1;
                if (!placeWallBrick(cx, yMid + tuckY, sx, sy, sz)) break outer;

                const step = w + mortar;
                if (step < 1e-5) break;
                L += step;
              }
            }
          }

          wallMesh.count = k;
          wallMesh.instanceMatrix.needsUpdate = true;
          if (wallMesh.instanceColor)
            wallMesh.instanceColor.needsUpdate = true;
          scene.add(wallMesh);
        }

        rebuildAll();

        const pane = new Pane({ title: "Arch door + adaptive wall" });
        const fDoor = pane.addFolder({ title: "Door shape" });
        const rb = () => rebuildAll();
        fDoor.addBinding(params, "doorInnerHalfW", {
          min: 0.35,
          max: 2.2,
          step: 0.01,
          label: "Inner half-width",
        }).on("change", rb);
        fDoor.addBinding(params, "masonryShell", {
          min: 0.12,
          max: 1.2,
          step: 0.01,
          label: "Brick ring depth",
        }).on("change", rb);
        fDoor.addBinding(params, "legHeight", {
          min: 0.4,
          max: 5,
          step: 0.02,
          label: "Jamb height",
        }).on("change", rb);
        fDoor.addBinding(params, "sillY", {
          min: -0.5,
          max: 1.5,
          step: 0.01,
          label: "Sill Y",
        }).on("change", rb);
        fDoor.addBinding(params, "closeBottom", {
          label: "Close bottom (threshold)",
        }).on("change", rb);

        const fBrick = pane.addFolder({ title: "Bricks" });
        fBrick.addBinding(params, "brickW", {
          min: 0.22,
          max: 1.1,
          step: 0.01,
        }).on("change", rb);
        fBrick.addBinding(params, "brickH", {
          min: 0.18,
          max: 0.9,
          step: 0.01,
        }).on("change", rb);
        fBrick.addBinding(params, "brickD", {
          min: 0.2,
          max: 1.2,
          step: 0.01,
        }).on("change", rb);
        fBrick.addBinding(params, "brickRound", {
          min: 0,
          max: 0.18,
          step: 0.005,
          label: "Corner radius",
        }).on("change", rb);
        fBrick.addBinding(params, "spacingMul", {
          min: 0.55,
          max: 1.6,
          step: 0.01,
          label: "Spacing",
        }).on("change", rb);
        fBrick.addBinding(params, "colorSeed", {
          min: 0,
          max: 999999,
          step: 1,
          label: "Color seed",
        }).on("change", rb);

        const fWall = pane.addFolder({ title: "Wall (field masonry)" });
        fWall.addBinding(params, "wallEnabled", { label: "Enabled" }).on("change", rb);
        fWall.addBinding(params, "wallWidth", {
          min: 6,
          max: 28,
          step: 0.1,
        }).on("change", rb);
        fWall.addBinding(params, "wallHeight", {
          min: 3,
          max: 16,
          step: 0.05,
          label: "Height above sill",
        }).on("change", rb);
        fWall.addBinding(params, "wallDepth", {
          min: 0.35,
          max: 1.4,
          step: 0.01,
        }).on("change", rb);
        fWall.addBinding(params, "wallZ", {
          min: -1.2,
          max: 0.4,
          step: 0.01,
          label: "Wall Z offset",
        }).on("change", rb);
        fWall.addBinding(params, "wallMortar", {
          min: 0.008,
          max: 0.06,
          step: 0.001,
        }).on("change", rb);
        fWall.addBinding(params, "wallSeamInset", {
          min: 0.01,
          max: 0.12,
          step: 0.002,
          label: "Ring clearance",
        }).on("change", rb);
        fWall.addBinding(params, "wallEdgeBlendBw", {
          min: 1.5,
          max: 9,
          step: 0.1,
          label: "Edge blend (× brick W)",
        }).on("change", rb);
        fWall.addBinding(params, "wallMinBrickScale", {
          min: 0.14,
          max: 0.55,
          step: 0.01,
          label: "Min brick / nominal",
        }).on("change", rb);
        fWall.addBinding(params, "wallCrownSquash", {
          min: 0.45,
          max: 1,
          step: 0.01,
          label: "Crown height scale",
        }).on("change", rb);

        const fView = pane.addFolder({ title: "View" });
        fView.addBinding(params, "showGrid", { label: "Grid" }).on("change", () => {
          setGrid(params.showGrid);
        });

        pane.addButton({ title: "Rebuild" }).on("click", () => {
          rebuildAll();
        });

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener("resize", onResize);

        renderer.setAnimationLoop(() => {
          sunDirUniform.value.copy(sun.position).normalize();
          controls.update();
          renderer.render(scene, camera);
        });
      }

      main().catch((e) => {
        console.error(e);
        document.body.innerHTML =
          "<pre style='color:#f8fafc;padding:16px;font:14px/1.4 system-ui'>WebGPU error: " +
          String(e) +
          "</pre>";
      });
    </script>
  </body>
</html>
