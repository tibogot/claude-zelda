<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panning Chevron LED Board — TSL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #07060a; font-family: "SF Mono", Consolas, ui-monospace, monospace;
      }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hint {
        position: fixed; left: 14px; bottom: 14px; z-index: 5;
        font-size: 11px; line-height: 1.5; color: #888;
        background: rgba(0, 0, 0, 0.55); padding: 8px 12px;
        border-radius: 6px; pointer-events: none;
      }
      #hint b { color: #ff9a2e; }
      #panel {
        position: fixed; top: 12px; right: 12px; z-index: 20;
        width: min(260px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
        overflow: auto; padding: 12px 14px;
        font-size: 11px; line-height: 1.45; color: #d8d8de;
        background: rgba(8, 10, 16, 0.9);
        border: 1px solid rgba(255, 154, 46, 0.18);
        border-radius: 10px; backdrop-filter: blur(8px);
      }
      #panel h2 {
        font-size: 12px; font-weight: 600; color: #ff9a2e;
        margin-bottom: 10px; letter-spacing: 0.05em; text-transform: uppercase;
      }
      #panel section { margin-bottom: 12px; }
      #panel section > label {
        display: block; font-size: 10px; color: #8a8a96;
        text-transform: uppercase; letter-spacing: 0.06em;
        margin-bottom: 6px; padding-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .row {
        display: grid; grid-template-columns: 1fr 52px;
        align-items: center; gap: 8px; margin-bottom: 6px;
      }
      .row span:first-child { color: #b8b8c2; }
      .row output {
        text-align: right; color: #ff9a2e; font-variant-numeric: tabular-nums;
      }
      .row input[type="range"] {
        grid-column: 1 / -1; width: 100%; accent-color: #ff9a2e;
      }
      .row input[type="color"] {
        grid-column: 1 / -1; width: 100%; height: 26px; padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 4px;
        background: transparent; cursor: pointer;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hint"><b>LED chevron board</b> — drag to orbit · arrows pan forever</div>
    <aside id="panel"></aside>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        clamp,
        color,
        float,
        Fn,
        mix,
        pass,
        smoothstep,
        time,
        uniform,
        uv,
        vec2,
        vec3,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { bloom } from "three/addons/tsl/display/BloomNode.js";

      // ── Tunables ────────────────────────────────────────────────────────────
      const params = {
        panSpeed: 0.4, // chevron cells swept per second
        chevronCount: 6, // arrows across the board
        skew: 2.3, // V sharpness (0 = vertical bars)
        duty: 0.5, // lit fraction of each chevron band
        cols: 78, // LED columns
        rows: 22, // LED rows
        dotRadius: 0.36, // LED dot radius (cell units, 0..0.5)
        emissive: 6.0, // brightness of lit LEDs
        offLevel: 0.04, // faint ember on unlit LEDs
        coreColor: "#ffe07a", // hot centre of a lit dot
        edgeColor: "#ff6a00", // glowing rim of a lit dot
        bloomStrength: 1.45,
        bloomRadius: 0.6,
        bloomThreshold: 0.0,
      };

      const u = {
        panSpeed: uniform(float(params.panSpeed)),
        chevronCount: uniform(float(params.chevronCount)),
        skew: uniform(float(params.skew)),
        duty: uniform(float(params.duty)),
        cols: uniform(float(params.cols)),
        rows: uniform(float(params.rows)),
        dotRadius: uniform(float(params.dotRadius)),
        emissive: uniform(float(params.emissive)),
        offLevel: uniform(float(params.offLevel)),
        coreColor: uniform(color(params.coreColor)),
        edgeColor: uniform(color(params.edgeColor)),
      };

      let camera, scene, renderer, controls, pipeline, bloomPass, boardMaterial;

      init().catch(console.error);

      async function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07060a);
        scene.fog = new THREE.Fog(0x07060a, 16, 60);

        camera = new THREE.PerspectiveCamera(
          40,
          window.innerWidth / window.innerHeight,
          0.1,
          120,
        );
        camera.position.set(0.4, 1.7, 6.4);

        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        await renderer.init();

        controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.15, 0);
        controls.enableDamping = true;
        controls.minDistance = 2.5;
        controls.maxDistance = 16;
        controls.maxPolarAngle = Math.PI * 0.5;
        controls.update();

        boardMaterial = createBoardMaterial();
        buildScene();
        buildPost();
        buildPanel();

        window.addEventListener("resize", onResize);
        renderer.setAnimationLoop(animate);
      }

      // Fully procedural LED chevron board — seamless infinite pan, crisp dots.
      function createBoardMaterial() {
        const mat = new THREE.MeshBasicNodeMaterial();
        mat.toneMapped = true;

        mat.colorNode = Fn(() => {
          const baseUV = uv();

          // ── LED grid: which physical dot, and where inside its cell ──
          const grid = vec2(baseUV.x.mul(u.cols), baseUV.y.mul(u.rows));
          const cellId = grid.floor();
          const cellCenter = cellId.add(0.5);
          const local = grid.sub(cellCenter); // -0.5 .. 0.5
          const dist = local.length();

          // round dot: 1 in the middle, soft edge => "clipping" circular LEDs
          const dot = smoothstep(u.dotRadius, u.dotRadius.sub(0.06), dist);

          // ── Chevron sampled at the LED centre so each dot snaps on/off ──
          const cuv = cellCenter.div(vec2(u.cols, u.rows)); // cell-centre uv
          const cy = cuv.y.sub(0.5).abs(); // distance from centre line
          // arrows point +x; subtract time so the pattern sweeps right forever
          const phase = cuv.x
            .mul(u.chevronCount)
            .add(cy.mul(u.skew))
            .sub(time.mul(u.panSpeed));
          const band = phase.fract();
          // lit where band < duty, with a soft edge for anti-aliasing
          const lit = smoothstep(u.duty, u.duty.sub(0.04), band);

          // dot colour: hot core -> warm rim, gives the glowing LED look
          const ledColor = mix(u.edgeColor, u.coreColor, dot.mul(dot));
          // unlit dots keep a faint ember so the whole panel stays visible
          const intensity = dot.mul(
            clamp(lit.mul(u.emissive).add(u.offLevel), 0.0, u.emissive),
          );
          return ledColor.mul(intensity);
        })();

        return mat;
      }

      function buildScene() {
        // Floor (warm tiled-ish ground)
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(60, 60),
          new THREE.MeshStandardNodeMaterial({ color: 0x17120f, roughness: 0.9 }),
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const boardW = 6.4;
        const boardH = 1.9;
        const pad = 0.16;

        // Dark housing behind the LEDs
        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(boardW + pad * 2, boardH + pad * 2, 0.22),
          new THREE.MeshStandardNodeMaterial({
            color: 0x120708,
            roughness: 0.55,
            metalness: 0.3,
          }),
        );
        frame.position.set(0, 1.6, -0.08);
        scene.add(frame);

        // LED face
        const board = new THREE.Mesh(
          new THREE.PlaneGeometry(boardW, boardH),
          boardMaterial,
        );
        board.name = "chevronBoard";
        board.position.set(0, 1.6, 0.04);
        scene.add(board);

        // Legs
        const legMat = new THREE.MeshStandardNodeMaterial({
          color: 0x1a1a1f,
          roughness: 0.6,
          metalness: 0.4,
        });
        for (const x of [-boardW * 0.35, boardW * 0.35]) {
          const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.07, 0.09, 1.3, 12),
            legMat,
          );
          leg.position.set(x, 0.65, -0.05);
          scene.add(leg);
        }

        // Lighting: mostly the board lights the scene, plus gentle fill
        const spill = new THREE.PointLight(0xff7a1e, 26, 14, 2);
        spill.position.set(0, 1.4, 2.0);
        scene.add(spill);
        scene.add(new THREE.AmbientLight(0x20232e, 0.6));
        const key = new THREE.DirectionalLight(0xffffff, 0.4);
        key.position.set(3, 6, 4);
        scene.add(key);
      }

      function buildPost() {
        pipeline = new THREE.RenderPipeline(renderer);
        const scenePass = pass(scene, camera);
        const sceneColor = scenePass.getTextureNode("output");
        bloomPass = bloom(
          sceneColor,
          params.bloomStrength,
          params.bloomRadius,
          params.bloomThreshold,
        );
        pipeline.outputNode = sceneColor.add(bloomPass);
      }

      function buildPanel() {
        const panel = document.getElementById("panel");
        panel.innerHTML = `
          <h2>Chevron Board</h2>
          <section>
            <label>Animation</label>
            <div class="row">
              <span>Pan speed</span><output id="o-panSpeed">${params.panSpeed.toFixed(2)}</output>
              <input type="range" id="panSpeed" min="-1.5" max="1.5" step="0.01" value="${params.panSpeed}" />
            </div>
          </section>
          <section>
            <label>Chevrons</label>
            <div class="row">
              <span>Count</span><output id="o-chevronCount">${params.chevronCount}</output>
              <input type="range" id="chevronCount" min="3" max="12" step="1" value="${params.chevronCount}" />
            </div>
            <div class="row">
              <span>Sharpness</span><output id="o-skew">${params.skew.toFixed(1)}</output>
              <input type="range" id="skew" min="0" max="5" step="0.1" value="${params.skew}" />
            </div>
            <div class="row">
              <span>Band width</span><output id="o-duty">${params.duty.toFixed(2)}</output>
              <input type="range" id="duty" min="0.15" max="0.85" step="0.01" value="${params.duty}" />
            </div>
          </section>
          <section>
            <label>LED grid</label>
            <div class="row">
              <span>Columns</span><output id="o-cols">${params.cols}</output>
              <input type="range" id="cols" min="20" max="140" step="1" value="${params.cols}" />
            </div>
            <div class="row">
              <span>Rows</span><output id="o-rows">${params.rows}</output>
              <input type="range" id="rows" min="8" max="44" step="1" value="${params.rows}" />
            </div>
            <div class="row">
              <span>Dot size</span><output id="o-dotRadius">${params.dotRadius.toFixed(2)}</output>
              <input type="range" id="dotRadius" min="0.12" max="0.5" step="0.01" value="${params.dotRadius}" />
            </div>
            <div class="row">
              <span>Brightness</span><output id="o-emissive">${params.emissive.toFixed(1)}</output>
              <input type="range" id="emissive" min="1" max="12" step="0.1" value="${params.emissive}" />
            </div>
          </section>
          <section>
            <label>Colour</label>
            <div class="row">
              <span>Core</span>
              <input type="color" id="coreColor" value="${params.coreColor}" />
            </div>
            <div class="row">
              <span>Rim</span>
              <input type="color" id="edgeColor" value="${params.edgeColor}" />
            </div>
          </section>
          <section>
            <label>Bloom</label>
            <div class="row">
              <span>Strength</span><output id="o-bloomStrength">${params.bloomStrength.toFixed(2)}</output>
              <input type="range" id="bloomStrength" min="0" max="3" step="0.05" value="${params.bloomStrength}" />
            </div>
            <div class="row">
              <span>Radius</span><output id="o-bloomRadius">${params.bloomRadius.toFixed(2)}</output>
              <input type="range" id="bloomRadius" min="0" max="1" step="0.02" value="${params.bloomRadius}" />
            </div>
          </section>
        `;

        const slider = (id, decimals, apply) => {
          const el = document.getElementById(id);
          const out = document.getElementById("o-" + id);
          el.addEventListener("input", () => {
            const v = Number(el.value);
            params[id] = v;
            out.textContent = v.toFixed(decimals);
            apply(v);
          });
        };

        slider("panSpeed", 2, (v) => (u.panSpeed.value = v));
        slider("chevronCount", 0, (v) => (u.chevronCount.value = v));
        slider("skew", 1, (v) => (u.skew.value = v));
        slider("duty", 2, (v) => (u.duty.value = v));
        slider("cols", 0, (v) => (u.cols.value = v));
        slider("rows", 0, (v) => (u.rows.value = v));
        slider("dotRadius", 2, (v) => (u.dotRadius.value = v));
        slider("emissive", 1, (v) => (u.emissive.value = v));
        slider("bloomStrength", 2, (v) => (bloomPass.strength.value = v));
        slider("bloomRadius", 2, (v) => (bloomPass.radius.value = v));

        document.getElementById("coreColor").addEventListener("input", (e) => {
          params.coreColor = e.target.value;
          u.coreColor.value.set(e.target.value);
        });
        document.getElementById("edgeColor").addEventListener("input", (e) => {
          params.edgeColor = e.target.value;
          u.edgeColor.value.set(e.target.value);
        });
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        controls.update();
        pipeline.render();
      }
    </script>
  </body>
</html>
