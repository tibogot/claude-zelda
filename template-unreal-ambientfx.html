<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template — Unreal</title>
    <style>
      :root {
        --bg-dark: #222222;
        --bg-panel: #2a2a2a;
        --bg-item: #333333;
        --bg-hover: #3a3a3a;
        --bg-input: #1e1e1e;
        --border: #3c3c3c;
        --border-light: #4a4a4a;
        --text: #cccccc;
        --text-dim: #888888;
        --accent: #4a9eff;
        --green: #5cb85c;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "Cascadia Code", "Fira Code", "Consolas", monospace;
        --radius: 4px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        font-family: var(--font);
        color: var(--text);
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        font:
          12px/1.5 "SF Mono",
          "Fira Code",
          monospace;
        color: #b0d890;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
        backdrop-filter: blur(4px);
      }
      #info span {
        color: #e0f0c0;
        font-weight: 600;
      }

      /* === RIGHT PANEL (v2/editor.html inspector look) === */
      #inspector {
        position: fixed;
        top: 0;
        right: 0;
        width: var(--inspector-width, 300px);
        min-width: 240px;
        max-width: 70vw;
        height: 100vh;
        background: var(--bg-panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 20;
        box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
      }
      /* Drag-to-resize strip on the inspector's left edge. Wider than the
         visible border so it's easy to grab without obscuring panel chrome. */
      #inspector-resize-handle {
        position: absolute;
        top: 0;
        left: -3px;
        width: 8px;
        height: 100%;
        cursor: ew-resize;
        z-index: 21;
        background: transparent;
        transition: background 0.15s;
      }
      #inspector-resize-handle:hover,
      body.inspector-resizing #inspector-resize-handle {
        background: var(--accent);
        opacity: 0.6;
      }
      body.inspector-resizing {
        cursor: ew-resize;
        user-select: none;
      }
      body.inspector-hidden #inspector-resize-handle,
      body.immersive #inspector-resize-handle {
        display: none;
      }
      #inspector-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        height: 32px;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      #inspector-toggle,
      #immersive-toggle {
        background: none;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        padding: 2px 8px;
        font-size: 10px;
      }
      #inspector-toggle:hover,
      #immersive-toggle:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      #immersive-toggle.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      body.immersive #inspector,
      body.immersive #info {
        display: none;
      }
      body.immersive canvas {
        cursor: none;
      }
      #inspector-body {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 24px;
      }
      body.inspector-hidden #inspector-body,
      body.inspector-hidden #inspector-header span {
        display: none;
      }
      body.inspector-hidden #inspector {
        width: auto;
        height: auto;
        border-left: none;
        background: transparent;
        box-shadow: none;
      }
      body.inspector-hidden #inspector-header {
        background: transparent;
        border: none;
        padding: 6px;
      }

      .inspector-section {
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-dim);
        user-select: none;
      }
      .section-header:hover {
        background: var(--bg-hover);
      }
      .section-header .section-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .section-header.collapsed .section-arrow {
        transform: rotate(-90deg);
      }
      .section-body {
        padding: 6px 12px 10px;
      }
      .section-body.hidden {
        display: none;
      }
      .prop-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .prop-label {
        width: 90px;
        min-width: 90px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
      }
      .prop-value {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .prop-color-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      .prop-color {
        width: 22px;
        height: 22px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .prop-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .prop-color::-webkit-color-swatch {
        border: none;
        border-radius: 2px;
      }
      .prop-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .prop-num-input {
        width: 72px;
        height: 22px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 5px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-mono);
        text-align: right;
        outline: none;
      }
      .prop-num-input:focus {
        border-color: var(--accent);
      }
      .prop-num-input::-webkit-outer-spin-button,
      .prop-num-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .prop-num-input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .prop-slider {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg-input);
        border-radius: 2px;
        outline: none;
      }
      .prop-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .prop-slider-val {
        width: 44px;
        font-size: 11px;
        color: var(--text-dim);
        font-family: var(--font-mono);
        text-align: right;
      }
      .prop-dropdown {
        flex: 1;
        height: 22px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 6px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--font);
        outline: none;
        cursor: pointer;
      }
      .prop-toggle {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border-light);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        color: transparent;
      }
      .prop-toggle.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .prop-toggle svg {
        width: 10px;
        height: 10px;
      }
      .section-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        height: 26px;
        margin-top: 4px;
        background: var(--bg-item);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
      }
      .section-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--border-light);
      }
      .section-separator {
        height: 1px;
        background: var(--border);
        margin: 6px 0;
      }
      /* Texture picker (FX panels) */
      .prop-tex-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.35px;
        color: var(--text-dim);
        padding: 4px 0 6px;
      }
      .prop-tex-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 0 8px;
      }
      .prop-tex-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        width: 56px;
      }
      .prop-tex-item img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: var(--radius);
        border: 2px solid var(--border);
        cursor: pointer;
        opacity: 0.75;
        background: var(--bg-input);
        transition:
          opacity 0.15s,
          border-color 0.15s;
      }
      .prop-tex-item img:hover {
        opacity: 1;
        border-color: var(--border-light);
      }
      .prop-tex-item img.active {
        border-color: var(--accent);
        opacity: 1;
        box-shadow: 0 0 0 1px var(--accent);
      }
      .prop-tex-caption {
        font-size: 9px;
        line-height: 1.2;
        font-family: var(--font-mono);
        color: var(--text-dim);
        text-align: center;
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      .prop-tex-current {
        font-size: 10px;
        color: var(--text-dim);
        padding: 2px 0 4px;
        font-family: var(--font-mono);
      }
      .prop-tex-current b {
        color: var(--text);
        font-weight: 600;
      }
      /* Nested folder inside a section gets a subtle border */
      .section-body .inspector-section {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin: 4px 0;
        background: var(--bg-dark);
      }
      .section-body .inspector-section .section-header {
        padding: 5px 8px;
      }
      .section-body .inspector-section .section-body {
        padding: 4px 8px 8px;
      }
      #fx-label {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        font:
          bold 12px/1.4 "SF Mono",
          monospace;
        padding: 5px 12px;
        border-radius: 6px;
        background: rgba(40, 40, 40, 0.7);
        color: #7df;
        pointer-events: none;
        user-select: none;
        backdrop-filter: blur(4px);
      }
      body.immersive #fx-label {
        display: none;
      }

      /* Custom scrollbar */
      #inspector-body::-webkit-scrollbar {
        width: 8px;
      }
      #inspector-body::-webkit-scrollbar-track {
        background: transparent;
      }
      #inspector-body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      #inspector-body::-webkit-scrollbar-thumb:hover {
        background: var(--border-light);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="fx-label">Ambient FX</div>
    <div id="info">
      Template &mdash; <span id="backend">loading…</span> &bull; WASD/Arrows
      move &bull; Space jump &bull; RMB drag (or F immersive) to look &bull;
      <span id="cammode">ORBIT</span> (Tab follow)
    </div>
    <div id="inspector">
      <div id="inspector-resize-handle" title="Drag to resize"></div>
      <div id="inspector-header">
        <span>Inspector</span>
        <div style="display: flex; gap: 4px">
          <button id="immersive-toggle">Immersive</button>
          <button id="inspector-toggle">Hide</button>
        </div>
      </div>
      <div id="inspector-body"></div>
    </div>
    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        float,
        mx_noise_float,
        positionWorld,
        smoothstep,
        time,
        uniform,
        vec3,
      } from "three/tsl";
      import Stats from "stats-gl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { CSMShadowNode } from "three/addons/csm/CSMShadowNode.js";
      import { createTileMaterial } from "./tileMaterial.js";

      // ── Ambient FX modules (every effect from ambient-fx-editor.html) ──
      import { createButterflyFX, buildButterflyUI } from "./fx-butterflies.js";
      import { createEmberFX, buildEmberUI } from "./fx-embers.js";
      import {
        createFlowingLinesFX,
        buildFlowingLinesUI,
      } from "./fx-flowing-lines.js";
      import {
        createFloatingLeavesFX,
        buildFloatingLeavesUI,
      } from "./fx-floating-leaves.js";
      import {
        createGhostLeavesFX,
        buildGhostLeavesUI,
      } from "./fx-ghost-leaves.js";
      import {
        createLeavesPhysicsFX,
        buildLeavesPhysicsUI,
      } from "./fx-leaves-physics.js";
      import { createDustFX, buildDustUI } from "./fx-dust.js";
      import { createSandFX, buildSandUI } from "./fx-sand.js";
      import { createRainFX, buildRainUI } from "./fx-rain.js";
      import {
        createBillboardCloudFX,
        buildBillboardCloudUI,
      } from "./fx-billboard-clouds.js";
      import { createWindFogFX, buildWindFogUI } from "./fx-wind-fog.js";
      import {
        createGroundMistFX,
        buildGroundMistUI,
      } from "./fx-ground-mist.js";
      import {
        createFloatingMistFX,
        buildFloatingMistUI,
      } from "./fx-floating-mist.js";
      import { createSmokeFogFX, buildSmokeFogUI } from "./fx-smoke-fog.js";

      const PARAMS = {
        camera: { fov: 60, followDist: 8 },
        ground: { size: 800 },
        tile: {
          textureScale: 1500,
          gradientIntensity: 0.5,
          gradientBias: 0.1,
          tileColor: "#d4d4d4",
          gridColor: "#707070",
          gridLineColor: "#404040",
          roughness: 1,
          metalness: 0,
        },
        // Same defaults as v2/editor (config.js light block).
        light: {
          sunAzimuth: 135,
          sunElevation: 43,
          dirColor: "#fff5e0",
          dirIntensity: 2.2,
          hemiSkyColor: "#c8e0ff",
          hemiGroundColor: "#88aa55",
          hemiIntensity: 0.4,
          envIntensity: 0.2,
          exposure: 0.5,
          sunDistance: 600,
          shadowBias: -0.0005,
          shadowNormalBias: 0.02,
        },
        // Same defaults as v2/editor (config.js physicalSky block).
        physicalSky: {
          turbidity: 2,
          rayleigh: 1.5,
          mie: 0.005,
          mieG: 0.8,
          cloudCoverage: 0.4,
          cloudDensity: 0.4,
          cloudElevation: 0.5,
          meshScale: 10000,
        },
        csm: {
          cascades: 2,
          maxFar: 300,
          lightMargin: 100,
          mapSize: 2048,
        },
      };

      // ── Ambient-FX shared environment (mirrors ambient-fx-editor's `shared`).
      // FX modules read these every frame, so any UI control mutating them
      // takes effect immediately without rebuilding the effect.
      const env = {
        effect: "none",
        windX: 1.0,
        windZ: 0.3,
        windStrength: 1.0,
        density: 1.0,
        groundY: 0.0,
        volume: 30, // spawn radius
        showGround: true,
        // timeOfDay isn't surfaced here — the template's sun/elevation
        // controls already drive lighting + sky. We expose them in the
        // Lights/Sky panels instead.
        timeOfDay: 0.5,
      };

      // ── Terrain-side cloud shadows (procedural FBM drifting across the
      // floor). Multiplied into the tile material's colorNode before
      // lighting, so shadowed patches read as cooler/darker even under the
      // sun. Purely visual / no 1:1 match with billboard cards above.
      const cloudShadow = {
        enabled: false,
        intensity: 0.55,
        coverage: 0.5,
        softness: 0.18,
        scale: 0.04,
        speed: 2.5,
        useSharedWind: true,
        windX: 1.0,
        windZ: 0.3,
      };

      // Capsule + camera tuning — same constants as v2/play/playMode.js.
      const CAP_R = 0.4;
      const CAP_H = 1.2;
      const GRAVITY = 20.0;
      const JUMP_VEL = 11.0;
      const MOVE_SPEED = 12;
      const CAM_SENS_X = 0.002;
      const CAM_SENS_Y = 0.002;

      // Swap this for real terrain heightmap sampling when adding hills.
      const sampleHeight = (_x, _z) => 0;

      function sunDirectionFromAngles(
        azDeg,
        elDeg,
        target = new THREE.Vector3(),
      ) {
        const az = THREE.MathUtils.degToRad(azDeg);
        const el = THREE.MathUtils.degToRad(elDeg);
        return target
          .set(
            Math.cos(el) * Math.cos(az),
            Math.sin(el),
            Math.cos(el) * Math.sin(az),
          )
          .normalize();
      }

      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });

        const stats = new Stats({ trackGPU: true });
        await stats.init(renderer);

        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = PARAMS.light.exposure;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(stats.dom);

        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU")
            ? "WebGPU ✓"
            : "WebGL fallback";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          PARAMS.camera.fov,
          innerWidth / innerHeight,
          0.5,
          5000,
        );
        camera.position.set(0, 20, 60);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.49;
        controls.enabled = true; // orbit is the default mode

        // ── LIGHTS ──
        const sunDir = new THREE.Vector3();
        const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.castShadow = true;
        sun.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 300;
        sun.shadow.camera.left = sun.shadow.camera.bottom = -300;
        sun.shadow.camera.right = sun.shadow.camera.top = 300;
        const shadowTarget = new THREE.Object3D();
        scene.add(shadowTarget);
        sun.target = shadowTarget;
        scene.add(sun);

        // CSM cascaded shadows — same setup as v2/editor.
        let csm = null;
        try {
          csm = new CSMShadowNode(sun, {
            cascades: PARAMS.csm.cascades,
            maxFar: PARAMS.csm.maxFar,
            mode: "practical",
            lightMargin: PARAMS.csm.lightMargin,
          });
          sun.shadow.shadowNode = csm;
        } catch (err) {
          console.warn("[template] CSMShadowNode init failed.", err);
        }

        // ── SKY (SkyMesh physical sky + PMREM IBL) ──
        const sky = new SkyMesh();
        if (sky.material) sky.material.fog = false;
        scene.add(sky);

        let pmremGenerator = null;
        let _disposePmrem = null;

        function applySkyUniforms() {
          const S = PARAMS.physicalSky;
          sky.turbidity.value = S.turbidity;
          sky.rayleigh.value = S.rayleigh;
          sky.mieCoefficient.value = S.mie;
          sky.mieDirectionalG.value = S.mieG;
          sky.cloudCoverage.value = S.cloudCoverage;
          sky.cloudDensity.value = S.cloudDensity;
          sky.cloudElevation.value = S.cloudElevation;
          sky.scale.setScalar(S.meshScale);
          if (sky.sunPosition?.value?.copy) sky.sunPosition.value.copy(sunDir);
          else if (sky.sunPosition?.copy) sky.sunPosition.copy(sunDir);
        }

        function rebuildSkyEnv() {
          try {
            applySkyUniforms();
            if (_disposePmrem) {
              _disposePmrem();
              _disposePmrem = null;
            }
            pmremGenerator =
              pmremGenerator ?? new THREE.PMREMGenerator(renderer);
            const envScene = new THREE.Scene();
            envScene.add(sky.clone());
            const pmremRT = pmremGenerator.fromScene(envScene, 0.04);
            scene.environment = pmremRT.texture;
            _disposePmrem = () => pmremRT.dispose();
          } catch (err) {
            console.warn("[template] PMREM from SkyMesh failed.", err);
          }
        }

        function updateSun() {
          const L = PARAMS.light;
          sunDirectionFromAngles(L.sunAzimuth, L.sunElevation, sunDir);
          sun.position.copy(sunDir).multiplyScalar(L.sunDistance);
          sun.color.set(L.dirColor);
          sun.intensity = L.dirIntensity;
          sun.shadow.bias = L.shadowBias;
          sun.shadow.normalBias = L.shadowNormalBias;
          hemi.color.set(L.hemiSkyColor);
          hemi.groundColor.set(L.hemiGroundColor);
          hemi.intensity = L.hemiIntensity;
          renderer.toneMappingExposure = L.exposure;
          scene.environmentIntensity = L.envIntensity;
          applySkyUniforms();
        }

        updateSun();
        rebuildSkyEnv();

        // ── GROUND (tile material) ──
        const floorGeo = new THREE.PlaneGeometry(
          PARAMS.ground.size,
          PARAMS.ground.size,
        );
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = createTileMaterial({
          textureScale: PARAMS.tile.textureScale,
          gradientIntensity: PARAMS.tile.gradientIntensity,
          gradientBias: PARAMS.tile.gradientBias,
          tileColor: PARAMS.tile.tileColor,
          gridColor: PARAMS.tile.gridColor,
          gridLineColor: PARAMS.tile.gridLineColor,
          roughness: PARAMS.tile.roughness,
          metalness: PARAMS.tile.metalness,
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.receiveShadow = true;
        scene.add(floor);

        // ── Cloud shadows on the floor ──
        // Wraps tileMaterial's existing colorNode with a multiplicative
        // 2-octave FBM mask sampled at world XZ, drifting with wind.
        const csUniforms = {
          enabled: uniform(cloudShadow.enabled ? 1.0 : 0.0),
          intensity: uniform(cloudShadow.intensity),
          coverage: uniform(cloudShadow.coverage),
          softness: uniform(cloudShadow.softness),
          scale: uniform(cloudShadow.scale),
          speed: uniform(cloudShadow.speed),
          wind: uniform(
            new THREE.Vector2(cloudShadow.windX, cloudShadow.windZ),
          ),
        };
        {
          const baseColor = floorMat.colorNode;
          const csDrift = csUniforms.wind.mul(time).mul(csUniforms.speed);
          const csWXZ = positionWorld.xz.add(csDrift).mul(csUniforms.scale);
          const csN1 = mx_noise_float(vec3(csWXZ.x, 0.0, csWXZ.y));
          const csN2 = mx_noise_float(
            vec3(csWXZ.x.mul(2.13), 1.0, csWXZ.y.mul(2.07)),
          );
          const csNoise01 = csN1
            .mul(0.65)
            .add(csN2.mul(0.35))
            .mul(0.5)
            .add(0.5);
          const csLo = csUniforms.coverage.sub(csUniforms.softness);
          const csHi = csUniforms.coverage.add(csUniforms.softness);
          const csCover = smoothstep(csLo, csHi, csNoise01);
          const csShadowAmount = csCover
            .mul(csUniforms.intensity)
            .mul(csUniforms.enabled);
          floorMat.colorNode = baseColor.mul(float(1.0).sub(csShadowAmount));
        }

        // ── Ambient FX state ──
        // The active effect (if any) lives in here. switchEffect() disposes
        // the previous instance and rebuilds the FX-specific inspector
        // section. update(dt, elapsed, env) is called every frame.
        const fxLabelEl = document.getElementById("fx-label");
        const fxState = {
          active: null,
          activeName: "none",
          uiBody: null, // dynamic FX section's body container
          uiSection: null, // dynamic FX section's root for disposal
        };

        // sampleHeight is the local-space height sampler. The FX modules
        // expect a world-space sampler — but with sampleHeight() === 0 it
        // doesn't matter. We still wire both for parity with the editor.
        const terrainHeight = (x, z) => sampleHeight(x, z);

        // ── CAPSULE PLAYER (same shape + colors as v2/play/playMode.js) ──
        const capsuleGeo = new THREE.CapsuleGeometry(CAP_R, CAP_H, 4, 8);
        const capsuleMat = new THREE.MeshStandardMaterial({
          color: 0xff6633,
          roughness: 0.7,
        });
        const capsule = new THREE.Mesh(capsuleGeo, capsuleMat);
        capsule.castShadow = true;
        scene.add(capsule);

        // playerPos.y stores the ground surface under the capsule (foot).
        // The mesh sits half a capsule above that — matches v2 convention.
        const playerPos = new THREE.Vector3(0, sampleHeight(0, 0), 0);
        const capsuleBase = CAP_R + CAP_H * 0.5;

        const state = {
          velY: 0,
          inAir: false,
          camYaw: 0,
          camPitch: 0.35,
          mode: "orbit", // "follow" | "orbit" — orbit is the default
          immersive: false,
          lastFacingX: 0,
          lastFacingZ: -1,
        };

        // ── INPUT ──
        const keys = Object.create(null);
        let rmbLook = false;
        window.addEventListener("keydown", (e) => {
          if (e.code === "Tab") {
            e.preventDefault();
            setMode(state.mode === "follow" ? "orbit" : "follow");
            return;
          }
          if (e.code === "KeyF" && !e.ctrlKey && !e.metaKey) {
            setImmersive(!state.immersive);
            return;
          }
          keys[e.code] = true;
        });
        window.addEventListener("keyup", (e) => {
          keys[e.code] = false;
        });
        renderer.domElement.addEventListener("contextmenu", (e) =>
          e.preventDefault(),
        );
        renderer.domElement.addEventListener("pointerdown", (e) => {
          if (e.button === 2 && state.mode === "follow") rmbLook = true;
        });
        window.addEventListener("pointerup", (e) => {
          if (e.button === 2) rmbLook = false;
        });
        window.addEventListener("pointermove", (e) => {
          // In immersive (pointer-locked) mode, mouse always rotates the
          // camera. In windowed mode, only while RMB is held.
          if (state.mode !== "follow") return;
          if (!state.immersive && !rmbLook) return;
          state.camYaw -= e.movementX * CAM_SENS_X;
          state.camPitch += e.movementY * CAM_SENS_Y;
          state.camPitch = Math.max(
            0.05,
            Math.min(Math.PI * 0.45, state.camPitch),
          );
        });

        const cammodeEl = document.getElementById("cammode");
        function setMode(next) {
          state.mode = next;
          controls.enabled = next === "orbit";
          if (next === "orbit") {
            // Orbit + pointer lock don't mix — exit immersive when switching.
            if (state.immersive) setImmersive(false);
            // Seed orbit target on the capsule so it orbits around the player.
            controls.target.set(
              playerPos.x,
              playerPos.y + capsuleBase,
              playerPos.z,
            );
            controls.update();
          }
          cammodeEl.textContent = next === "follow" ? "FOLLOW" : "ORBIT";
        }

        // ── IMMERSIVE MODE (pointer lock, hides UI) ──
        const immersiveBtn = document.getElementById("immersive-toggle");
        function setImmersive(on) {
          if (on && state.mode !== "follow") setMode("follow");
          state.immersive = on;
          document.body.classList.toggle("immersive", on);
          immersiveBtn.classList.toggle("active", on);
          immersiveBtn.textContent = on ? "Windowed (Esc)" : "Immersive";
          rmbLook = false;
          if (on) {
            renderer.domElement.requestPointerLock?.();
          } else if (document.pointerLockElement) {
            document.exitPointerLock();
          }
        }
        immersiveBtn.addEventListener("click", () =>
          setImmersive(!state.immersive),
        );
        // Browser releases pointer lock on Escape — keep state in sync.
        document.addEventListener("pointerlockchange", () => {
          if (!document.pointerLockElement && state.immersive) {
            setImmersive(false);
          }
        });

        // ── FRAME LOOP ──
        let lastT = performance.now() / 1000;
        let elapsedTime = 0;
        renderer.setAnimationLoop(() => {
          const now = performance.now() / 1000;
          const dt = Math.min(now - lastT, 0.05);
          lastT = now;
          elapsedTime += dt;

          // Movement input is camera-relative. In orbit mode, derive a yaw
          // from the camera → capsule vector so "forward" still feels right.
          let moveYaw = state.camYaw;
          if (state.mode === "orbit") {
            moveYaw = Math.atan2(
              camera.position.x - playerPos.x,
              camera.position.z - playerPos.z,
            );
          }

          let mx = 0,
            mz = 0;
          if (keys.KeyW || keys.ArrowUp) {
            mx -= Math.sin(moveYaw);
            mz -= Math.cos(moveYaw);
          }
          if (keys.KeyS || keys.ArrowDown) {
            mx += Math.sin(moveYaw);
            mz += Math.cos(moveYaw);
          }
          if (keys.KeyA || keys.ArrowLeft) {
            mx -= Math.cos(moveYaw);
            mz += Math.sin(moveYaw);
          }
          if (keys.KeyD || keys.ArrowRight) {
            mx += Math.cos(moveYaw);
            mz -= Math.sin(moveYaw);
          }
          const mlen = Math.hypot(mx, mz);
          if (mlen > 0) {
            mx = (mx / mlen) * MOVE_SPEED * dt;
            mz = (mz / mlen) * MOVE_SPEED * dt;
            playerPos.x += mx;
            playerPos.z += mz;
            state.lastFacingX = mx / Math.hypot(mx, mz);
            state.lastFacingZ = mz / Math.hypot(mx, mz);
          }

          // Ground stick + gravity (v2 playMode capsule branch).
          const groundY = sampleHeight(playerPos.x, playerPos.z);
          const prevY = playerPos.y;
          if (keys.Space && !state.inAir) {
            state.velY = JUMP_VEL;
            state.inAir = true;
          }
          if (state.inAir) {
            state.velY -= GRAVITY * dt;
            playerPos.y += state.velY * dt;
            if (playerPos.y <= groundY) {
              playerPos.y = groundY;
              state.velY = 0;
              state.inAir = false;
            }
          } else {
            // 0.4 drop threshold lets the capsule walk off ledges without
            // teleporting down on tiny dips — same as v2.
            const drop = prevY - groundY;
            if (drop > 0.4) {
              state.inAir = true;
              state.velY = 0;
              playerPos.y = prevY;
            } else {
              playerPos.y = groundY;
            }
          }

          // Visual: capsule mesh origin is its center, foot at playerPos.y.
          const capsuleCY = playerPos.y + capsuleBase;
          capsule.position.set(playerPos.x, capsuleCY, playerPos.z);
          capsule.rotation.y =
            Math.atan2(state.lastFacingX, state.lastFacingZ) + Math.PI;

          // Sync cloud shadow uniforms (live-edited from inspector).
          csUniforms.enabled.value = cloudShadow.enabled ? 1.0 : 0.0;
          csUniforms.intensity.value = cloudShadow.intensity;
          csUniforms.coverage.value = cloudShadow.coverage;
          csUniforms.softness.value = cloudShadow.softness;
          csUniforms.scale.value = cloudShadow.scale;
          csUniforms.speed.value = cloudShadow.speed;
          if (cloudShadow.useSharedWind) {
            csUniforms.wind.value.set(env.windX, env.windZ);
          } else {
            csUniforms.wind.value.set(cloudShadow.windX, cloudShadow.windZ);
          }

          // env.timeOfDay drives any FX that reads it (billboard clouds).
          // Derive it from the current sun elevation so cloud sunset tint
          // matches the SkyMesh.
          {
            const el = THREE.MathUtils.clamp(
              PARAMS.light.sunElevation / 90,
              0,
              1,
            );
            env.timeOfDay = 0.25 + el * 0.5;
          }

          // Floor visibility tracks env.showGround (kept for parity with
          // the original editor's "Show Ground" toggle).
          floor.visible = env.showGround;

          // Update active FX (every effect signature matches the editor).
          if (fxState.active && fxState.active.update) {
            fxState.active.update(dt, elapsedTime, env);
          }

          // Camera.
          if (state.mode === "follow") {
            const followDist = PARAMS.camera.followDist;
            const hDist = followDist * Math.cos(state.camPitch);
            const vDist = followDist * Math.sin(state.camPitch);
            const sinH = Math.sin(state.camYaw);
            const cosH = Math.cos(state.camYaw);
            const lookAtY = capsuleCY;
            camera.position.set(
              playerPos.x + sinH * hDist,
              lookAtY + vDist,
              playerPos.z + cosH * hDist,
            );
            camera.lookAt(playerPos.x, lookAtY, playerPos.z);
          } else {
            // Orbit: keep target glued to capsule so player stays in view.
            controls.target.set(playerPos.x, capsuleCY, playerPos.z);
            controls.update();
          }

          renderer.render(scene, camera);
          renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER);
          stats.update();
        });

        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
          if (csm?.mainFrustum) csm.updateFrustums();
          if (fxState.active?.onResize) fxState.active.onResize();
        });

        // ── Effect registry ───────────────────────────────────────────────
        // Mirrors ambient-fx-editor.html, minus the editor-only Fireflies
        // entry which has no module yet. Every other effect from the
        // editor's dropdown is wired here with full UI parity.
        const effects = {
          Butterflies: {
            create: () => createButterflyFX(scene, env),
            buildUI: (folder, state) => buildButterflyUI(folder, state),
            color: "#f7b",
          },
          Embers: {
            create: () => createEmberFX(scene, env),
            buildUI: (folder, state) => buildEmberUI(folder, state),
            color: "#fa3",
          },
          "Flowing Lines": {
            create: () => createFlowingLinesFX(scene, env),
            buildUI: (folder, state) => buildFlowingLinesUI(folder, state),
            color: "#adf",
          },
          "Floating Leaves": {
            create: () => createFloatingLeavesFX(scene, env, terrainHeight),
            buildUI: (folder, state) => buildFloatingLeavesUI(folder, state),
            color: "#9f6",
          },
          "Falling Leaves": {
            create: () => createGhostLeavesFX(scene, env),
            buildUI: (folder, state) => buildGhostLeavesUI(folder, state),
            color: "#e9a35a",
          },
          "Leaves (Physics)": {
            create: () => {
              // flatTerrain: clamp leaves to the template's flat floor
              // (y = env.groundY) instead of the editor's bumpy procedural
              // surface — otherwise leaves float / sink into the floor.
              const fx = createLeavesPhysicsFX(scene, env, renderer, {
                flatTerrain: true,
              });
              fx.setView(camera, controls);
              fx.setTerrainHeight((x, z) => terrainHeight(x, z));

              // ── Capsule-driven probe ──
              // The FX ships with two probe modes: "mouse" (cursor) and
              // "wasd" (drives a wireframe capsule with WASD keys). The
              // player capsule is already on-screen and WASD-controlled,
              // so we repurpose "wasd" to mean "track the player". Mouse
              // mode still works as in the original editor.
              const probe = fx.getProbe();
              if (probe) {
                probe.setVisible(false);
                fx.params.showProbe = false;
                fx.params.probeMode = "wasd";
                probe.setMode("wasd");

                const origProbeUpdate = probe.update.bind(probe);
                probe.update = function (dt) {
                  if (this.mode === "wasd") {
                    // Snap probe to the capsule centre so leaves get
                    // pushed by the player. Velocity is auto-derived
                    // from the position delta, matching the FX's
                    // existing push falloff math.
                    this.prevPosition.copy(this.position);
                    this.position.x = capsule.position.x;
                    this.position.z = capsule.position.z;
                    this.position.y =
                      this.terrainHeight(
                        this.position.x,
                        this.position.z,
                      ) + (this.groundYRef?.value ?? 0);
                    if (dt > 0) {
                      this.velocity
                        .subVectors(this.position, this.prevPosition)
                        .divideScalar(dt);
                    } else {
                      this.velocity.set(0, 0, 0);
                    }
                    if (this.gizmo.visible) {
                      this.gizmo.position.set(
                        this.position.x,
                        this.position.y + 0.8 * this.radius,
                        this.position.z,
                      );
                    }
                  } else {
                    origProbeUpdate(dt);
                  }
                };
              }
              return fx;
            },
            buildUI: (folder, state) => {
              buildLeavesPhysicsUI(folder, state);
              // Relabel the probe-mode dropdown so the dropdown matches
              // the new behaviour (WASD wireframe → capsule player), and
              // hide the WASD-speed slider since the capsule moves the
              // probe now.
              const root = folder.body;
              if (!root) return;
              root.querySelectorAll("select.prop-dropdown").forEach((sel) => {
                const wasd = sel.querySelector('option[value="wasd"]');
                if (wasd && /WASD/i.test(wasd.textContent)) {
                  wasd.textContent = "Capsule";
                }
              });
              root.querySelectorAll(".prop-row").forEach((row) => {
                const lbl = row.querySelector(".prop-label");
                if (lbl && /^WASD Speed$/i.test(lbl.textContent.trim())) {
                  row.style.display = "none";
                }
              });
            },
            color: "#ffaa44",
          },
          Dust: {
            create: () => {
              const fx = createDustFX(scene, env);
              fx.setView(camera, controls);
              return fx;
            },
            buildUI: (folder, state) => buildDustUI(folder, state),
            color: "#d8c8a4",
          },
          Sand: {
            create: () => {
              const fx = createSandFX(scene, env);
              fx.setView(camera, controls);
              return fx;
            },
            buildUI: (folder, state) => buildSandUI(folder, state),
            color: "#c9a86c",
          },
          Rain: {
            create: () => {
              const rain = createRainFX(scene, env, terrainHeight);
              rain.setView(camera, controls);
              return rain;
            },
            buildUI: (folder, state) => buildRainUI(folder, state),
            color: "#8cf",
          },
          "Billboard Clouds": {
            create: () => {
              const clouds = createBillboardCloudFX(scene, env);
              clouds.setCamera(camera);
              return clouds;
            },
            buildUI: (folder, state) => buildBillboardCloudUI(folder, state),
            color: "#def",
          },
          "Wind Fog": {
            create: () => createWindFogFX(scene, env, terrainHeight),
            buildUI: (folder, state) => buildWindFogUI(folder, state),
            color: "#9bc4ff",
          },
          "Ground Mist": {
            create: () => {
              const fx = createGroundMistFX(scene, env, terrainHeight);
              fx.setView(camera, controls);
              fx.setPlayer(playerPos);
              return fx;
            },
            buildUI: (folder, state) => buildGroundMistUI(folder, state),
            color: "#b8c8d8",
          },
          "Floating Myst": {
            create: () => {
              const fx = createFloatingMistFX(scene, env, terrainHeight);
              fx.setView(camera, controls);
              fx.setPlayer(playerPos);
              return fx;
            },
            buildUI: (folder, state) => buildFloatingMistUI(folder, state),
            color: "#c8d8ec",
          },
          "Ground Fog": {
            create: () => {
              const fx = createSmokeFogFX(scene, env, terrainHeight);
              fx.setView(camera, controls);
              fx.setPlayer(playerPos);
              return fx;
            },
            buildUI: (folder, state) => buildSmokeFogUI(folder, state),
            color: "#a8b8c8",
          },
        };

        // ── switchEffect: dispose previous, build new, rebuild FX panel ──
        function switchEffect(name) {
          if (fxState.active?.dispose) fxState.active.dispose(scene);
          fxState.active = null;
          fxState.activeName = name;
          // Tear down the previous dynamic FX section, if any.
          if (fxState.uiSection?.parentElement) {
            fxState.uiSection.remove();
          }
          fxState.uiSection = null;
          fxState.uiBody = null;

          if (name === "none" || !effects[name]) {
            fxLabelEl.textContent = "Ambient FX";
            fxLabelEl.style.color = "#7df";
            return;
          }

          fxState.active = effects[name].create();
          fxLabelEl.textContent = `FX: ${name}`;
          fxLabelEl.style.color = effects[name].color || "#7df";

          // Rebuild a fresh inspector section dedicated to this effect, and
          // hand it a Tweakpane-compatible folder so the existing build*UI
          // functions plug in unchanged.
          const insBody = document.getElementById("inspector-body");
          const { section, body } = _sectionEx(insBody, `FX: ${name}`, true);
          fxState.uiSection = section;
          fxState.uiBody = body;
          const folder = _makeTPFolder(body, section);
          effects[name].buildUI(folder, fxState.active, env);
        }

        // ── UI PANEL (v2/editor.html helpers) ──────────────────────────────
        buildInspector({
          camera,
          floorMat,
          updateSun,
          rebuildSkyEnv,
          switchEffect,
        });
      }

      // === Widget factory (mirrors v2/editor.html _section/_slider/etc.) ===
      const _checkSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      const _arrowSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';

      function _fmt(v, step) {
        if (step >= 1) return String(Math.round(v));
        const d = Math.max(0, -Math.floor(Math.log10(step)));
        return v.toFixed(d);
      }
      function _clampSnap(v, min, max, step) {
        if (!Number.isFinite(v)) return min;
        const n = Math.round((v - min) / step);
        let out = min + n * step;
        const stepStr = String(step);
        let decimals = 0;
        if (stepStr.includes(".")) decimals = stepStr.split(".")[1].length;
        else if (stepStr.includes("e-")) decimals = 8;
        if (decimals > 0) out = Number(out.toFixed(decimals));
        return Math.min(max, Math.max(min, out));
      }
      function _sectionEx(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr);
        sec.appendChild(body);
        parent.appendChild(sec);
        return { section: sec, body };
      }
      function _section(parent, title, expanded = true) {
        return _sectionEx(parent, title, expanded).body;
      }
      function _select(parent, obj, key, opts) {
        const { label, options, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        const opts2 = Object.entries(options)
          .map(
            ([k, v]) =>
              `<option value="${v}" ${v === cur ? "selected" : ""}>${k}</option>`,
          )
          .join("");
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><select class="prop-dropdown">${opts2}</select></div>`;
        const sel = row.querySelector(".prop-dropdown");
        sel.addEventListener("change", () => {
          obj[key] = sel.value;
          onChange?.(sel.value);
        });
        parent.appendChild(row);
        return row;
      }
      // Texture picker — built-in thumbnails + custom file upload. Used by
      // Dust / Falling Leaves / Leaves (Physics) so artists can hot-swap
      // sprites from the inspector.
      function _texturePicker(parent, opts) {
        const {
          label = "Texture",
          builtins = [],
          getCurrentPath = () => "",
          getCurrentName = () => "",
          onBuiltinSelect,
          onCustomLoad,
        } = opts;

        const lbl = document.createElement("div");
        lbl.className = "prop-tex-label";
        lbl.textContent = label;
        parent.appendChild(lbl);

        const gallery = document.createElement("div");
        gallery.className = "prop-tex-gallery";
        parent.appendChild(gallery);

        const imgs = [];
        const current = document.createElement("div");
        current.className = "prop-tex-current";

        function refreshCurrent() {
          const path = getCurrentPath();
          const name = getCurrentName();
          let txt;
          if (name) txt = name;
          else if (path) {
            const parts = path.split("/");
            txt = parts[parts.length - 1];
          } else txt = "(none)";
          current.innerHTML = `Loaded: <b>${txt}</b>`;
        }

        function syncActive() {
          const p = getCurrentPath();
          imgs.forEach((img, i) => {
            img.classList.toggle("active", builtins[i].path === p);
          });
          refreshCurrent();
        }

        builtins.forEach((t) => {
          const wrap = document.createElement("div");
          wrap.className = "prop-tex-item";
          const img = document.createElement("img");
          img.src = t.path;
          img.title = t.name;
          img.alt = t.name;
          img.addEventListener("click", () => {
            onBuiltinSelect?.(t.path, t.name);
            imgs.forEach((im) => im.classList.remove("active"));
            img.classList.add("active");
            refreshCurrent();
          });
          wrap.appendChild(img);
          const cap = document.createElement("div");
          cap.className = "prop-tex-caption";
          cap.textContent = t.name;
          wrap.appendChild(cap);
          gallery.appendChild(wrap);
          imgs.push(img);
        });

        parent.appendChild(current);

        const upload = document.createElement("button");
        upload.type = "button";
        upload.className = "section-btn";
        upload.textContent = "Load Custom PNG / JPG";
        upload.addEventListener("click", () => {
          const i = document.createElement("input");
          i.type = "file";
          i.accept = "image/*";
          i.onchange = () => {
            const file = i.files && i.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              onCustomLoad?.(ev.target.result, file.name);
              imgs.forEach((im) => im.classList.remove("active"));
              refreshCurrent();
            };
            reader.readAsDataURL(file);
          };
          i.click();
        });
        parent.appendChild(upload);

        syncActive();
        return { refresh: syncActive };
      }
      // ── Tweakpane-compatible folder shim ──────────────────────────────
      // Lets us reuse every existing fx-*.js buildUI() function unchanged.
      // Dispatches addBinding() to the right widget based on value type or
      // opts (boolean→toggle, hex string→color, options→select, number→
      // slider, fallback string→text input/info). on('change'|'click', cb)
      // chaining is preserved.
      function _makeTPFolder(body, sectionRoot) {
        const folder = {
          body,
          sectionRoot,

          addBinding(obj, key, opts = {}) {
            const value = obj[key];
            const changeCbs = [];
            const trigger = (v) =>
              changeCbs.forEach((cb) => cb({ value: v }));

            if (opts.options) {
              _select(body, obj, key, {
                label: opts.label || key,
                options: opts.options,
                onChange: trigger,
              });
            } else if (typeof value === "boolean") {
              _toggle(body, obj, key, {
                label: opts.label || key,
                onChange: trigger,
              });
            } else if (typeof value === "number") {
              _slider(body, obj, key, {
                label: opts.label || key,
                min: opts.min ?? 0,
                max: opts.max ?? 1,
                step: opts.step ?? 0.01,
                onChange: trigger,
              });
            } else if (
              typeof value === "string" &&
              /^#[0-9a-f]{3,8}$/i.test(value)
            ) {
              _color(body, obj, key, {
                label: opts.label || key,
                onChange: trigger,
              });
            } else {
              // Read-only-ish fallback: text input bound to the value.
              const row = document.createElement("div");
              row.className = "prop-row";
              row.innerHTML = `<span class="prop-label">${opts.label || key}</span><div class="prop-value"><input class="prop-num-input" style="text-align:left;width:100%" value="${String(value)}"></div>`;
              const inp = row.querySelector("input");
              inp.addEventListener("change", () => {
                obj[key] = inp.value;
                trigger(inp.value);
              });
              body.appendChild(row);
            }

            return {
              on(evt, cb) {
                if (evt === "change") changeCbs.push(cb);
                return this;
              },
            };
          },

          addBlade(opts) {
            if (opts?.view === "separator") _separator(body);
            return {};
          },

          addButton(opts) {
            let clickCb = null;
            _button(body, {
              title: opts.title,
              onClick: () => clickCb?.(),
            });
            return {
              on(evt, cb) {
                if (evt === "click") clickCb = cb;
                return this;
              },
            };
          },

          addFolder(opts) {
            const { section: sub, body: subBody } = _sectionEx(
              body,
              opts?.title || "Folder",
              opts?.expanded !== false,
            );
            return _makeTPFolder(subBody, sub);
          },

          addTexturePicker(opts) {
            return _texturePicker(body, opts);
          },

          dispose() {
            if (sectionRoot && sectionRoot.parentElement) sectionRoot.remove();
          },
        };
        return folder;
      }
      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><input type="number" class="prop-num-input" min="${min}" max="${max}" step="${step}" value="${_fmt(cur, step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        sl.addEventListener("input", () => {
          const v = _clampSnap(parseFloat(sl.value), min, max, step);
          obj[key] = v;
          num.value = _fmt(v, step);
          onChange?.(v);
        });
        num.addEventListener("change", () => {
          const raw = String(num.value).trim();
          if (raw === "" || raw === "-" || raw === "." || raw === "-.") {
            num.value = _fmt(obj[key], step);
            return;
          }
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) {
            num.value = _fmt(obj[key], step);
            return;
          }
          v = _clampSnap(v, min, max, step);
          obj[key] = v;
          sl.value = String(v);
          num.value = _fmt(v, step);
          onChange?.(v);
        });
        num.addEventListener("keydown", (e) => {
          if (e.key === "Enter") num.blur();
        });
        num.addEventListener(
          "wheel",
          (e) => {
            if (document.activeElement === num) e.preventDefault();
          },
          { passive: false },
        );
        parent.appendChild(row);
        return row;
      }
      function _color(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"><span class="prop-slider-val" style="width:auto">${obj[key]}</span></div></div>`;
        const inp = row.querySelector(".prop-color");
        const hex = row.querySelector(".prop-slider-val");
        inp.addEventListener("input", () => {
          obj[key] = inp.value;
          hex.textContent = inp.value;
          onChange?.(inp.value);
        });
        parent.appendChild(row);
        return row;
      }
      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.(obj[key]);
        });
        parent.appendChild(row);
        return row;
      }
      function _button(parent, opts) {
        const { title, onClick } = opts;
        const btn = document.createElement("button");
        btn.className = "section-btn";
        btn.textContent = title;
        btn.addEventListener("click", onClick);
        parent.appendChild(btn);
        return btn;
      }
      function _separator(parent) {
        const div = document.createElement("div");
        div.className = "section-separator";
        parent.appendChild(div);
      }

      // === Build inspector panel ===
      function buildInspector({
        camera,
        floorMat,
        updateSun,
        rebuildSkyEnv,
        switchEffect,
      }) {
        const body = document.getElementById("inspector-body");

        // Toggle show/hide.
        document
          .getElementById("inspector-toggle")
          .addEventListener("click", (e) => {
            const hidden = document.body.classList.toggle("inspector-hidden");
            e.target.textContent = hidden ? "Show" : "Hide";
          });

        // ── Drag-to-resize the inspector panel ──
        // Width persists in localStorage so it survives reloads. Double-
        // click the handle to reset to the default 300px.
        {
          const inspectorEl = document.getElementById("inspector");
          const handle = document.getElementById("inspector-resize-handle");
          const KEY = "inspectorWidth";
          const MIN = 240;
          const MAX_VW = 0.7;
          const clamp = (w) =>
            Math.max(MIN, Math.min(window.innerWidth * MAX_VW, w));
          const applyWidth = (w) => {
            document.documentElement.style.setProperty(
              "--inspector-width",
              clamp(w) + "px",
            );
          };
          const saved = parseFloat(localStorage.getItem(KEY));
          if (Number.isFinite(saved)) applyWidth(saved);

          let dragging = false;
          handle.addEventListener("pointerdown", (e) => {
            dragging = true;
            document.body.classList.add("inspector-resizing");
            handle.setPointerCapture?.(e.pointerId);
            e.preventDefault();
          });
          window.addEventListener("pointermove", (e) => {
            if (!dragging) return;
            // Right-anchored panel: width = (viewport right edge) - mouseX.
            applyWidth(window.innerWidth - e.clientX);
          });
          const stopDrag = (e) => {
            if (!dragging) return;
            dragging = false;
            document.body.classList.remove("inspector-resizing");
            handle.releasePointerCapture?.(e.pointerId);
            const w = parseFloat(
              getComputedStyle(inspectorEl).width || "300",
            );
            if (Number.isFinite(w)) localStorage.setItem(KEY, String(w));
          };
          window.addEventListener("pointerup", stopDrag);
          window.addEventListener("pointercancel", stopDrag);
          handle.addEventListener("dblclick", () => {
            document.documentElement.style.removeProperty(
              "--inspector-width",
            );
            localStorage.removeItem(KEY);
          });
        }

        // ── Effect selector ──
        {
          const sec = _section(body, "Effect", true);
          _select(sec, env, "effect", {
            label: "Effect",
            options: {
              None: "none",
              Butterflies: "Butterflies",
              Embers: "Embers",
              "Flowing Lines": "Flowing Lines",
              "Floating Leaves": "Floating Leaves",
              "Falling Leaves": "Falling Leaves",
              "Leaves (Physics)": "Leaves (Physics)",
              Dust: "Dust",
              Sand: "Sand",
              Rain: "Rain",
              "Billboard Clouds": "Billboard Clouds",
              "Wind Fog": "Wind Fog",
              "Ground Mist": "Ground Mist",
              "Floating Myst": "Floating Myst",
              "Ground Fog": "Ground Fog",
            },
            onChange: (v) => switchEffect(v),
          });
        }

        // ── Environment (FX-side wind / spawn volume / density) ──
        {
          const sec = _section(body, "Environment", true);
          _slider(sec, env, "windStrength", {
            label: "Wind str",
            min: 0,
            max: 3,
            step: 0.05,
          });
          _slider(sec, env, "windX", {
            label: "Wind X",
            min: -3,
            max: 3,
            step: 0.1,
          });
          _slider(sec, env, "windZ", {
            label: "Wind Z",
            min: -3,
            max: 3,
            step: 0.1,
          });
          _separator(sec);
          _slider(sec, env, "density", {
            label: "Density",
            min: 0.1,
            max: 3,
            step: 0.1,
          });
          _slider(sec, env, "volume", {
            label: "Volume rad",
            min: 5,
            max: 60,
            step: 1,
          });
          _slider(sec, env, "groundY", {
            label: "Ground Y",
            min: -5,
            max: 5,
            step: 0.1,
          });
          _separator(sec);
          _toggle(sec, env, "showGround", { label: "Show ground" });
        }

        // ── Cloud shadows (terrain side) ──
        {
          const sec = _section(body, "Cloud shadows", false);
          _toggle(sec, cloudShadow, "enabled", { label: "Enabled" });
          _slider(sec, cloudShadow, "intensity", {
            label: "Intensity",
            min: 0,
            max: 1,
            step: 0.01,
          });
          _slider(sec, cloudShadow, "coverage", {
            label: "Coverage",
            min: 0,
            max: 1,
            step: 0.01,
          });
          _slider(sec, cloudShadow, "softness", {
            label: "Softness",
            min: 0.005,
            max: 0.5,
            step: 0.005,
          });
          _slider(sec, cloudShadow, "scale", {
            label: "Scale (freq)",
            min: 0.005,
            max: 0.2,
            step: 0.005,
          });
          _slider(sec, cloudShadow, "speed", {
            label: "Drift speed",
            min: 0,
            max: 10,
            step: 0.1,
          });
          _toggle(sec, cloudShadow, "useSharedWind", {
            label: "Use env wind",
          });
        }

        // ── Camera ──
        {
          const sec = _section(body, "Camera", true);
          _slider(sec, PARAMS.camera, "fov", {
            label: "FOV",
            min: 30,
            max: 100,
            step: 1,
            onChange: (v) => {
              camera.fov = v;
              camera.updateProjectionMatrix();
            },
          });
          _slider(sec, PARAMS.camera, "followDist", {
            label: "Follow dist",
            min: 3,
            max: 25,
            step: 0.25,
          });
        }

        // ── Sun + Lights ──
        {
          const sec = _section(body, "Lights", true);
          _slider(sec, PARAMS.light, "sunAzimuth", {
            label: "Sun azimuth",
            min: 0,
            max: 360,
            step: 1,
            onChange: () => {
              updateSun();
              rebuildSkyEnv();
            },
          });
          _slider(sec, PARAMS.light, "sunElevation", {
            label: "Sun elev",
            min: -10,
            max: 90,
            step: 1,
            onChange: () => {
              updateSun();
              rebuildSkyEnv();
            },
          });
          _color(sec, PARAMS.light, "dirColor", {
            label: "Sun color",
            onChange: () => updateSun(),
          });
          _slider(sec, PARAMS.light, "dirIntensity", {
            label: "Sun int",
            min: 0,
            max: 10,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _separator(sec);
          _color(sec, PARAMS.light, "hemiSkyColor", {
            label: "Hemi sky",
            onChange: () => updateSun(),
          });
          _color(sec, PARAMS.light, "hemiGroundColor", {
            label: "Hemi ground",
            onChange: () => updateSun(),
          });
          _slider(sec, PARAMS.light, "hemiIntensity", {
            label: "Hemi int",
            min: 0,
            max: 3,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _separator(sec);
          _slider(sec, PARAMS.light, "envIntensity", {
            label: "Env int",
            min: 0,
            max: 3,
            step: 0.05,
            onChange: () => updateSun(),
          });
          _slider(sec, PARAMS.light, "exposure", {
            label: "Exposure",
            min: 0,
            max: 3,
            step: 0.05,
            onChange: () => updateSun(),
          });
        }

        // ── Sky (physical) ──
        {
          const sec = _section(body, "Sky", true);
          const reb = () => rebuildSkyEnv();
          _slider(sec, PARAMS.physicalSky, "turbidity", {
            label: "Turbidity",
            min: 0.1,
            max: 20,
            step: 0.1,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "rayleigh", {
            label: "Rayleigh",
            min: 0,
            max: 4,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "mie", {
            label: "Mie",
            min: 0,
            max: 0.1,
            step: 0.0005,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "mieG", {
            label: "Mie G",
            min: 0,
            max: 0.999,
            step: 0.001,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "cloudCoverage", {
            label: "Cloud cov",
            min: 0,
            max: 1,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "cloudDensity", {
            label: "Cloud dens",
            min: 0,
            max: 2,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "cloudElevation", {
            label: "Cloud elev",
            min: 0,
            max: 1,
            step: 0.01,
            onChange: reb,
          });
          _slider(sec, PARAMS.physicalSky, "meshScale", {
            label: "Mesh scale",
            min: 1000,
            max: 50000,
            step: 100,
            onChange: () => {
              rebuildSkyEnv();
            },
          });
        }

        // ── Ground (tile material) ──
        {
          const sec = _section(body, "Ground", true);
          const U = floorMat._tileUniforms;
          const toLinear = (hex) => new THREE.Color(hex).convertSRGBToLinear();

          _color(sec, PARAMS.tile, "tileColor", {
            label: "Tile color",
            onChange: (hex) => U.tileColor.value.copy(toLinear(hex)),
          });
          _color(sec, PARAMS.tile, "gridColor", {
            label: "Grid color",
            onChange: (hex) => U.gridColor.value.copy(toLinear(hex)),
          });
          _color(sec, PARAMS.tile, "gridLineColor", {
            label: "Grid line",
            onChange: (hex) => U.gridLineColor.value.copy(toLinear(hex)),
          });
          _slider(sec, PARAMS.tile, "textureScale", {
            label: "Tex scale",
            min: 50,
            max: 5000,
            step: 10,
            onChange: (v) => (U.textureScale.value = v),
          });
          _slider(sec, PARAMS.tile, "gradientIntensity", {
            label: "Grad int",
            min: 0,
            max: 2,
            step: 0.01,
            onChange: (v) => (U.gradientIntensity.value = v),
          });
          _slider(sec, PARAMS.tile, "gradientBias", {
            label: "Grad bias",
            min: -1,
            max: 1,
            step: 0.01,
            onChange: (v) => (U.gradientBias.value = v),
          });
          _slider(sec, PARAMS.tile, "roughness", {
            label: "Roughness",
            min: 0,
            max: 1,
            step: 0.01,
            onChange: (v) => (floorMat.roughness = v),
          });
          _slider(sec, PARAMS.tile, "metalness", {
            label: "Metalness",
            min: 0,
            max: 1,
            step: 0.01,
            onChange: (v) => (floorMat.metalness = v),
          });
        }
      }

      init().catch((e) => {
        console.error("Init failed:", e);
        document.getElementById("backend").textContent = "Error: " + e.message;
      });
    </script>
  </body>
</html>
