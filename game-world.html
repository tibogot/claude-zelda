        position: fixed; bottom: 16px; left: 16px; z-index: 10;

      #load-box button:hover { background: #3a7a3a; }
      #load-status { margin-top: 12px; font-size: 12px; color: #88aa88; }

      // ─── CONSTANTS ─────────────────────────────────────────────────────
      const TERRAIN_SIZE = 800;
      const TERRAIN_RES  = 512;
      const DISPLAY_RES  = 128;
      const HEIGHT_SCALE = 40;
      const SPLAT_RES    = 512;
      const VERTS        = TERRAIN_RES + 1;
      const DISPLAY_VERTS = DISPLAY_RES + 1;
      const HTEX_RES     = 512;
      const PI           = Math.PI;

      // ─── HEIGHT DATA ───────────────────────────────────────────────────
      const heightData = new Float32Array(VERTS * VERTS);

      function sampleHeight(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const ix0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(TERRAIN_RES, ix0 + 1);
        const iz1 = Math.min(TERRAIN_RES, iz0 + 1);
        const tx = fx - ix0, tz = fz - iz0;
        const h00 = heightData[iz0 * VERTS + ix0], h10 = heightData[iz0 * VERTS + ix1];
        const h01 = heightData[iz1 * VERTS + ix0], h11 = heightData[iz1 * VERTS + ix1];
        return h00 + (h10 - h00) * tx + (h01 - h00) * tz + (h00 - h10 - h01 + h11) * tx * tz;
      }

      // ─── BVH HEIGHT GRID ──────────────────────────────────────────────
      const bvhGrid = new Float32Array(HTEX_RES * HTEX_RES);
      function bvhHeight(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * HTEX_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * HTEX_RES;
        const ix0 = Math.max(0, Math.min(HTEX_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(HTEX_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(HTEX_RES - 1, ix0 + 1);
        const iz1 = Math.min(HTEX_RES - 1, iz0 + 1);
        const tx = fx - ix0, tz = fz - iz0;
        const h00 = bvhGrid[iz0 * HTEX_RES + ix0], h10 = bvhGrid[iz0 * HTEX_RES + ix1];
        const h01 = bvhGrid[iz1 * HTEX_RES + ix0], h11 = bvhGrid[iz1 * HTEX_RES + ix1];
        return h00 + (h10 - h00) * tx + (h01 - h00) * tz + (h00 - h10 - h01 + h11) * tx * tz;
      }

      // ─── DENSITY CANVASES ─────────────────────────────────────────────
      function _makeCanvas(size) {

        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, size, size);
        return { canvas: c, ctx };
      }
      const { canvas: splatCanvas, ctx: splatCtx } = _makeCanvas(SPLAT_RES);
      const { canvas: grassDensityCanvas, ctx: grassDensityCtx } = _makeCanvas(SPLAT_RES);
      const { canvas: geminiDensityCanvas, ctx: geminiDensityCtx } = _makeCanvas(SPLAT_RES);
      const { canvas: flowerDensityCanvas, ctx: flowerDensityCtx } = _makeCanvas(SPLAT_RES);
      const { canvas: meadowCanvas, ctx: meadowCtx } = _makeCanvas(SPLAT_RES);
      const { canvas: cliffDensityCanvas, ctx: cliffDensityCtx } = _makeCanvas(SPLAT_RES);
      const { canvas: geminiCliffDensityCanvas, ctx: geminiCliffDensityCtx } = _makeCanvas(SPLAT_RES);
      const imgSplatData = new Uint8Array(SPLAT_RES * SPLAT_RES * 4);

      // ─── SETTINGS (defaults, overwritten by scene.json) ───────────────

        ocean: {

          highlightColor: "#e8f8ff", opacity: 0.78, foamColor: "#e8f4ff", lineWidth: 0.5,
          glowWidth: 2.0, waterlineIntensity: 2.5, rippleStrength: 5.5, rippleWidth: 0.12,

      const LOD_SLOTS = [

      // ─── PLAYER STATE ─────────────────────────────────────────────────
      const charPos = new THREE.Vector3();
      let _camTerrainBvh = null, _camCliffBvh = null;

      // ─── MAIN ─────────────────────────────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true, requiredLimits: { maxSampledTexturesPerShaderStage: 32 } });
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU") ? "WebGPU ✓" : "WebGL fallback";

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 6000);
        camera.position.set(0, 50, 80);

        // ── GLTF LOADER ──
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
        const ktx2Loader = new KTX2Loader();
        ktx2Loader.setTranscoderPath("https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/libs/basis/");
        ktx2Loader.detectSupport(renderer);
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);
        gltfLoader.setKTX2Loader(ktx2Loader);

        // ── LIGHTING ──
        function sunDirectionFromAngles(azDeg, elDeg) {
          const az = azDeg * PI / 180, el = elDeg * PI / 180;
          return new THREE.Vector3(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).normalize();
        }
        const dirLight = new THREE.DirectionalLight(PARAMS.light.dirColor, PARAMS.light.dirIntensity);
        dirLight.position.copy(sunDirectionFromAngles(PARAMS.light.sunAzimuth, PARAMS.light.sunElevation).multiplyScalar(600));
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
        dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 300;
        dirLight.shadow.camera.left = dirLight.shadow.camera.bottom = -300;
        dirLight.shadow.camera.right = dirLight.shadow.camera.top = 300;

                if (s.river) Object.assign(PARAMS.river, s.river);

              }
            }
            status.textContent = "Baking BVH…";
            await new Promise(r => setTimeout(r, 50));
            bakeBVH();
            generateObjects();

            // Build Rapier trimesh collider from terrain geometry
            status.textContent = "Building physics colliders…";
            await new Promise(r => setTimeout(r, 50));
            {
              // Terrain trimesh
              const tPos = terrainGeo.attributes.position;
              const tVerts = new Float32Array(tPos.count * 3);
              for (let i = 0; i < tPos.count; i++) { tVerts[i*3] = tPos.getX(i); tVerts[i*3+1] = tPos.getY(i); tVerts[i*3+2] = tPos.getZ(i); }
              const tIdx = terrainGeo.index ? new Uint32Array(terrainGeo.index.array) : new Uint32Array(Array.from({length: tPos.count}, (_, i) => i));
              const terrainColliderDesc = RAPIER.ColliderDesc.trimesh(tVerts, tIdx);
              const terrainPhysBody = physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed());
              physicsWorld.createCollider(terrainColliderDesc, terrainPhysBody);

              // Cliff trimesh colliders (individual cliffs + cliff instancer)
              const _cv = new THREE.Vector3();
              function addMeshTrimesh(mesh) {
                const geo = mesh.geometry, posAttr = geo.attributes.position, mat = mesh.matrixWorld;
                const verts = new Float32Array(posAttr.count * 3);
                for (let i = 0; i < posAttr.count; i++) { _cv.fromBufferAttribute(posAttr, i).applyMatrix4(mat); verts[i*3] = _cv.x; verts[i*3+1] = _cv.y; verts[i*3+2] = _cv.z; }
                const idx = geo.index ? new Uint32Array(geo.index.array) : new Uint32Array(Array.from({length: posAttr.count}, (_, i) => i));
                const body = physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed());
                physicsWorld.createCollider(RAPIER.ColliderDesc.trimesh(verts, idx), body);
              }
              scene.updateMatrixWorld(true);
              cliffObjects.forEach(root => root.traverse(o => { if (o.isMesh) addMeshTrimesh(o); }));
              if (cliffInstancer) cliffInstancer.forEachMeshInstance((geo, mat) => {
                const posAttr = geo.attributes.position;
                const verts = new Float32Array(posAttr.count * 3);
                for (let i = 0; i < posAttr.count; i++) { _cv.fromBufferAttribute(posAttr, i).applyMatrix4(mat); verts[i*3] = _cv.x; verts[i*3+1] = _cv.y; verts[i*3+2] = _cv.z; }
                const idx = geo.index ? new Uint32Array(geo.index.array) : new Uint32Array(Array.from({length: posAttr.count}, (_, i) => i));
                const body = physicsWorld.createRigidBody(RAPIER.RigidBodyDesc.fixed());
                physicsWorld.createCollider(RAPIER.ColliderDesc.trimesh(verts, idx), body);
              });

              // Warm up physics
              for (let i = 0; i < 10; i++) physicsWorld.step();
            }

            // Spawn player at center
            const spawnY = bvhHeight(0, 0) + capHalfH + capR + 0.5;
            charPos.set(0, spawnY, 0);
            playerBody.setTranslation({ x: 0, y: spawnY, z: 0 }, true);
            smoothCharPos.copy(charPos); charSmoothInit = false; camSmoothInit = false;

            document.getElementById("load-overlay").classList.add("hidden");
            renderer.domElement.requestPointerLock();
          } catch (err) {
            console.error("Failed to load scene", err);
            status.textContent = "Error: " + err.message;
          }
        }

        // ── LOAD UI ──
        document.getElementById("load-btn").addEventListener("click", () => document.getElementById("scene-file-input").click());
        document.getElementById("scene-file-input").addEventListener("change", e => { if (e.target.files[0]) loadScene(e.target.files[0]); });

        // ── INPUT ──
        // Player module handles keydown/keyup/mousemove internally via createPlayer
        renderer.domElement.addEventListener("click", () => {
          if (!document.pointerLockElement && document.getElementById("load-overlay").classList.contains("hidden"))
            renderer.domElement.requestPointerLock();
        });
        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        // ── TWEAKPANE ──
        const pane = new Tweakpane.Pane({ title: "Game World", expanded: true });

        // ── Post-FX folder ──
        const postFolder = pane.addFolder({ title: "Post-FX", expanded: true });
        postFolder.addBinding(postParams, "enabled", { label: "master on/off" });

        const postBloomFolder = postFolder.addFolder({ title: "Bloom", expanded: false });
        postBloomFolder.addBinding(postParams.bloom, "enabled");
        postBloomFolder.addBinding(postParams.bloom, "strength", { min: 0, max: 2, step: 0.05 });
        postBloomFolder.addBinding(postParams.bloom, "radius", { min: 0, max: 1, step: 0.02 });
        postBloomFolder.addBinding(postParams.bloom, "threshold", { min: 0, max: 2, step: 0.02 });

        const postLensflareFolder = postFolder.addFolder({ title: "Lens Flare", expanded: false });
        postLensflareFolder.addBinding(postParams.lensflare, "enabled");
        postLensflareFolder.addBinding(postParams.lensflare, "bloomThreshold", { min: 0.4, max: 1.2, step: 0.02, label: "sky bloom thresh" });
        postLensflareFolder.addBinding(postParams.lensflare, "threshold", { min: 0.2, max: 1, step: 0.02 });
        postLensflareFolder.addBinding(postParams.lensflare, "ghostAttenuation", { min: 5, max: 50, step: 1 });
        postLensflareFolder.addBinding(postParams.lensflare, "ghostSpacing", { min: 0.1, max: 0.5, step: 0.01 });

        const postGodRaysFolder = postFolder.addFolder({ title: "God Rays", expanded: false });
        postGodRaysFolder.addBinding(postParams.godRays, "enabled");
        postGodRaysFolder.addBinding(postParams.godRays, "strength", { min: 0, max: 0.5, step: 0.01 });
        postGodRaysFolder.addBinding(postParams.godRays, "decay", { min: 0.9, max: 0.99, step: 0.005 });
        postGodRaysFolder.addBinding(postParams.godRays, "density", { min: 0.2, max: 1.5, step: 0.05 });
        postGodRaysFolder.addBinding(postParams.godRays, "samples", { min: 8, max: 64, step: 4 });

        const postDofFolder = postFolder.addFolder({ title: "Depth of Field", expanded: false });
        postDofFolder.addBinding(postParams.dof, "enabled");
        postDofFolder.addBinding(postParams.dof, "focusDistance", { min: 5, max: 300, step: 5 });
        postDofFolder.addBinding(postParams.dof, "blurStart", { min: 1, max: 50, step: 1 });
        postDofFolder.addBinding(postParams.dof, "blurEnd", { min: 30, max: 300, step: 10 });
        postDofFolder.addBinding(postParams.dof, "blurSize", { min: 1, max: 3, step: 1 });
        postDofFolder.addBinding(postParams.dof, "blurSpread", { min: 1, max: 8, step: 0.5 });

        const postGtaoFolder = postFolder.addFolder({ title: "GTAO (Screen-Space AO)", expanded: false });
        postGtaoFolder.addBinding(postParams.gtao, "enabled");
        postGtaoFolder.addBinding(postParams.gtao, "intensity", { min: 0.5, max: 3, step: 0.05 });
        postGtaoFolder.addBinding(postParams.gtao, "radius", { min: 0.5, max: 20, step: 0.5, label: "radius (world units)" });
        postGtaoFolder.addBinding(postParams.gtao, "samples", { min: 8, max: 32, step: 2 });
        postGtaoFolder.addBinding(postParams.gtao, "resolutionScale", { min: 0.25, max: 1, step: 0.25, label: "resolution" });
        postGtaoFolder.addBinding(postParams.gtao, "scale", { min: 0.5, max: 3, step: 0.1 });
        postGtaoFolder.addBinding(postParams.gtao, "denoiseEnabled", { label: "denoise" });
        postGtaoFolder.addBinding(postParams.gtao, "denoiseRadius", { min: 1, max: 10, step: 1 });

        const postOutlineFolder = postFolder.addFolder({ title: "Outline", expanded: false });
        postOutlineFolder.addBinding(postParams.outline, "enabled");
        postOutlineFolder.addBinding(postParams.outline, "thickness", { min: 0.5, max: 4.0, step: 0.1 });
        postOutlineFolder.addBinding(postParams.outline, "strength", { min: 0.0, max: 2.0, step: 0.05 });
        postOutlineFolder.addBinding(postParams.outline, "depthThreshold", { min: 0.0001, max: 0.005, step: 0.0001, label: "depth thresh" });

        // ── LOD UPDATE HELPERS ──
        const _lodDummy = new THREE.Object3D(), _lodFinalMat = new THREE.Matrix4(), _lodCamPos = new THREE.Vector3();
        const _lodFrustum = new THREE.Frustum(), _lodProjMat = new THREE.Matrix4();
        const _ftreeDummy = new THREE.Object3D(), _ftreeFinalMat = new THREE.Matrix4(), _ftreeCamPos = new THREE.Vector3();
        const _ftreeFrustum = new THREE.Frustum(), _ftreeProjMat = new THREE.Matrix4();

        function updateLODInstances() {
          if (!LOD_SLOTS.some(s => s.ready && s.chunks.size > 0)) return;
          _lodCamPos.copy(camera.position);
          _lodProjMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _lodFrustum.setFromProjectionMatrix(_lodProjMat);
          for (const slot of LOD_SLOTS) {
            if (!slot.ready) continue;
            for (const chunk of slot.chunks.values()) {
              chunk.lod0ims.forEach(g => { g.im.count = 0; });
              if (chunk.lod1ims) chunk.lod1ims.forEach(g => { g.im.count = 0; });
              if (!_lodFrustum.intersectsSphere(chunk.sphere)) continue;
              for (const { x, y, z, scale } of chunk.positions) {
                const dx = x-_lodCamPos.x, dy = y-_lodCamPos.y, dz = z-_lodCamPos.z;
                const useLod1 = chunk.lod1ims && Math.sqrt(dx*dx+dy*dy+dz*dz) >= slot.lodThreshold;
                const groups = useLod1 ? chunk.lod1ims : chunk.lod0ims;
                _lodDummy.position.set(x, y, z); _lodDummy.scale.setScalar(scale);
                _lodDummy.rotation.set(0, PI * 2 * ((x * 13.7 + z * 7.3) % 1), 0); _lodDummy.updateMatrix();
                groups.forEach(({ im, localMatrix }) => { if (im.count >= LOD_MAX_PER_CHUNK) return; _lodFinalMat.multiplyMatrices(_lodDummy.matrix, localMatrix); im.setMatrixAt(im.count++, _lodFinalMat); });
              }
              chunk.lod0ims.forEach(g => { if (g.im.count > 0) g.im.instanceMatrix.needsUpdate = true; });
              if (chunk.lod1ims) chunk.lod1ims.forEach(g => { if (g.im.count > 0) g.im.instanceMatrix.needsUpdate = true; });
            }
          }
        }
        function updateFTreeInstances() {
          if (!FTREE_SLOTS.some(s => s.ready && s.chunks.size > 0)) return;
          _ftreeProjMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _ftreeFrustum.setFromProjectionMatrix(_ftreeProjMat);
          for (const slot of FTREE_SLOTS) {
            if (!slot.ready || !slot.trunkDefs) continue;
            const ts = slot.clusterPreset ? slot.clusterPreset.trunkScale : 1.0;
            for (const chunk of slot.chunks.values()) {
              chunk.ims.forEach(g => { g.im.count = 0; });
              if (!_ftreeFrustum.intersectsSphere(chunk.sphere)) continue;
              for (const { x, y, z, scale } of chunk.positions) {
                _ftreeDummy.position.set(x, y, z); _ftreeDummy.scale.setScalar(scale * ts);
                _ftreeDummy.rotation.set(0, PI * 2 * ((x * 13.7 + z * 7.3) % 1), 0); _ftreeDummy.updateMatrix();
                chunk.ims.forEach(({ im, localMatrix }) => { if (im.count >= FTREE_MAX_PER_CHUNK) return; _ftreeFinalMat.multiplyMatrices(_ftreeDummy.matrix, localMatrix); im.setMatrixAt(im.count++, _ftreeFinalMat); });
              }
              chunk.ims.forEach(g => { if (g.im.count > 0) g.im.instanceMatrix.needsUpdate = true; });
            }
          }
        }

        // ── RENDER LOOP ──
        const clock = new THREE.Timer();
        const _grassFrustum = new THREE.Frustum(), _grassProjMatrix = new THREE.Matrix4();

        renderer.setAnimationLoop(() => {
          clock.update();
          const elapsed = clock.getElapsed(), dt = Math.min(clock.getDelta(), 0.05);

          // Ambient FX
          if (ambientFXSystem) ambientFXSystem.update(dt, elapsed, 1, 0.3, 1);

          // Player update (Rapier physics + animations + input)
          player.update(dt);

          // Smooth character visual + camera to filter physics jitter
          const inAir = !player.state.isGrounded;
          if (!charSmoothInit) { smoothCharPos.copy(charPos); charSmoothInit = true; }
          if (inAir) {
            smoothCharPos.copy(charPos);
            player.characterGroup.position.copy(charPos);
          } else {
            const charAlpha = 1 - Math.exp(-CHAR_SMOOTH * dt);
            smoothCharPos.lerp(charPos, charAlpha);
            player.characterGroup.position.copy(smoothCharPos);
          }

          // Third-person camera (smooth, terrain-aware)
          {
            const camDist = SHARED_PARAMS.camDist;
            const cx = smoothCharPos.x - Math.sin(player.state.camYaw) * Math.cos(player.state.camPitch) * camDist;
            const cy = smoothCharPos.y + Math.sin(player.state.camPitch) * camDist + SHARED_PARAMS.camHeight;
            const cz = smoothCharPos.z - Math.cos(player.state.camYaw) * Math.cos(player.state.camPitch) * camDist;
            const camTerrainY = bvhHeight(cx, cz) + 1.5;
            const targetPos = new THREE.Vector3(cx, Math.max(cy, camTerrainY), cz);
            const targetLook = new THREE.Vector3(smoothCharPos.x, smoothCharPos.y + 0.5, smoothCharPos.z);
            if (!camSmoothInit) { smoothCamPos.copy(targetPos); smoothLookAt.copy(targetLook); camSmoothInit = true; }
            const alpha = 1 - Math.exp(-CAM_SMOOTH * dt);
            smoothCamPos.lerp(targetPos, alpha);
            smoothLookAt.lerp(targetLook, alpha);
            camera.position.copy(smoothCamPos);
            camera.lookAt(smoothLookAt);
          }

          // Feed player to grass/flower interaction
          if (grassUniforms) grassUniforms.uPlayerPos.value.copy(charPos);
          if (flowerCtx) flowerCtx.uPlayerPos.value.copy(charPos);
          geminiGrassUniforms.uPlayerPos.value.copy(charPos);
          FOLIAGE_SLOTS.forEach(s => { if (s.system) s.system.update(elapsed, charPos); });

          // Grass/flower update
          if (grassUniforms) grassUniforms.uTime.value = elapsed;
          uWaterTime.value = elapsed;
          if (waterfallObjects.length > 0) wfU.wfFlowTime.value += dt * wfU.wfFlowSpeed.value;
          uWCamXZ.value.set(camera.position.x, camera.position.z);
          camera.updateMatrixWorld();
          _grassProjMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _grassFrustum.setFromProjectionMatrix(_grassProjMatrix);
          if (grassPatchSystem) grassPatchSystem.update(camera.position, _grassFrustum);
          if (cliffGrassPatchSystem) cliffGrassPatchSystem.update(camera.position, _grassFrustum);
          if (flowerPatchSystem) flowerPatchSystem.update(camera.position, _grassFrustum);
          if (geminiGrassPatchSystem) geminiGrassPatchSystem.update({
            patchSize: gp.fieldSize, patchSizeMid: gp.lodMidPatchSize, patchSizeFar: gp.lodFarPatchSize,
            lodMidDistance: gp.lodMidDistance, lodFarDistance: gp.lodFarDistance, maxDistance: gp.lodMaxDistance,
            lodEnabled: gp.lodEnabled, grassReceiveShadow: gp.grassReceiveShadow });
          geminiGrassUniforms.uSunDir.value.copy(sunDirectionFromAngles(PARAMS.light.sunAzimuth, PARAMS.light.sunElevation));

          // Lighting
          shadowTarget.position.set(camera.position.x, 0, camera.position.z);
          const sunDir = sunDirectionFromAngles(PARAMS.light.sunAzimuth, PARAMS.light.sunElevation);
          dirLight.position.copy(sunDir.clone().multiplyScalar(600));
          dirLight.color.set(PARAMS.light.dirColor); dirLight.intensity = PARAMS.light.dirIntensity;
          dirLight.shadow.bias = PARAMS.shadowBias; dirLight.shadow.normalBias = PARAMS.shadowNormalBias;
          if (csm.mainFrustum && PARAMS.csm.enabled && PARAMS.csm.updateEveryFrame) csm.updateFrustums();
          hemiLight.color.set(PARAMS.light.hemiSkyColor); hemiLight.groundColor.set(PARAMS.light.hemiGroundColor); hemiLight.intensity = PARAMS.light.hemiIntensity;
          if (skyMode === "physical") updateSky();
          stylizedSky.update(sunDir, camera.position);
          scene.environmentIntensity = PARAMS.light.envIntensity;
          renderer.toneMappingExposure = PARAMS.light.exposure;

          // River time
          uRiverTime.value += dt;
          uFTreeTime.value = elapsed;
          updateLODInstances();
          updateFTreeInstances();

          // Post sync
          uGtaoEnabled.value = postParams.enabled && postParams.gtao.enabled ? 1 : 0;
          uGtaoIntensity.value = postParams.gtao.intensity;
          uDofEnabled.value = postParams.enabled && postParams.dof.enabled ? 1 : 0;
          uDofFocusDistance.value = postParams.dof.focusDistance;
          uDofBlurStart.value = postParams.dof.blurStart; uDofBlurEnd.value = postParams.dof.blurEnd;
          uBloomEnabled.value = postParams.enabled && postParams.bloom.enabled ? 1 : 0;
          bloomScenePass.strength.value = postParams.bloom.strength; bloomScenePass.radius.value = postParams.bloom.radius; bloomScenePass.threshold.value = postParams.bloom.threshold;
          uLensflareEnabled.value = postParams.enabled && postParams.lensflare.enabled ? 1 : 0;
          uGodRaysEnabled.value = postParams.enabled && postParams.godRays.enabled ? 1 : 0;
          uGodRaysStrength.value = postParams.godRays.strength; uGodRaysDecay.value = postParams.godRays.decay;
          uGodRaysDensity.value = postParams.godRays.density; uGodRaysSamples.value = postParams.godRays.samples;
          uOutlineEnabled.value = postParams.enabled && postParams.outline.enabled ? 1 : 0;
          uOutlineThickness.value = postParams.outline.thickness; uOutlineStrength.value = postParams.outline.strength; uOutlineDepthThresh.value = postParams.outline.depthThreshold;
          uDofBlurSize.value = postParams.dof.blurSize; uDofBlurSpread.value = postParams.dof.blurSpread;
          uGtaoDenoiseEnabled.value = postParams.gtao.denoiseEnabled ? 1 : 0;
          gtaoPass.radius.value = postParams.gtao.radius; gtaoPass.samples.value = postParams.gtao.samples;
          gtaoPass.scale.value = postParams.gtao.scale; gtaoPass.distanceFallOff.value = postParams.gtao.distanceFallOff;
          gtaoPass.distanceExponent.value = postParams.gtao.distanceExponent; gtaoPass.thickness.value = postParams.gtao.thickness;
          flareThreshold.value = postParams.lensflare.threshold; flareGhostAttenuation.value = postParams.lensflare.ghostAttenuation; flareGhostSpacing.value = postParams.lensflare.ghostSpacing;
          // Sun screen pos for god rays
          const _sunWorld = camera.position.clone().add(sunDir.clone().multiplyScalar(500000));
          const _v4 = new THREE.Vector4(_sunWorld.x, _sunWorld.y, _sunWorld.z, 1);
          _v4.applyMatrix4(camera.matrixWorldInverse); _v4.applyMatrix4(camera.projectionMatrix);
          uSunScreenPos.value.set((_v4.x / _v4.w) * 0.5 + 0.5, (_v4.y / _v4.w) * 0.5 + 0.5);
          uCameraFar.value = camera.far;

          stats.update();
          (postParams.enabled ? renderPipeline : simplePipeline).render();
        });
      }

      init();
    </script>
  </body>
</html>
