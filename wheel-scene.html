<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel Scene — Three.js r183 WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>

<script type="module">
import * as THREE from "three";
import { WebGPURenderer } from "three/webgpu";
import { texture, float, normalMap } from "three/tsl";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let camera, scene, renderer, controls, wheelMesh;

// If textures are in project: "textures/Concrete030_1K-JPG/Concrete030_1K-JPG"
const TEX_BASE = "../textures/Concrete030_1K-JPG/Concrete030_1K-JPG";

function loadTexture(url) {
  return new Promise((resolve, reject) => {
    new THREE.TextureLoader().load(url, resolve, undefined, reject);
  });
}

async function init() {
  // Camera
  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(2, 1.5, 2);

  // Scene — dark but readable
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a24);

  // Brighter, balanced lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.4);
  keyLight.position.set(4, 5, 6);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xc8d8ff, 0.6);
  fillLight.position.set(-3, 2, 2);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
  rimLight.position.set(-2, 3, -4);
  scene.add(rimLight);

  // Cylinder with beveled edges — LatheGeometry profile with rounded top/bottom
  const radius = 0.5;
  const height = 0.25;
  const bevelRadius = 0.04; // size of the rounded edge
  const radialSegments = 32;
  const arcSegments = 8;    // segments per quarter-circle bevel

  function roundedCylinderProfile() {
    const h = height / 2;
    const r = radius;
    const b = Math.min(bevelRadius, r * 0.5, h * 0.5);
    const points = [];
    // Small epsilon so LatheGeometry has x > 0 (avoids degenerate axis)
    const eps = 1e-5;

    // Start at axis (solid disk)
    points.push(new THREE.Vector2(eps, -h));
    points.push(new THREE.Vector2(r - b, -h));
    // Bottom bevel: quarter circle from (r-b, -h) to (r, -h+b)
    for (let i = 1; i <= arcSegments; i++) {
      const t = i / arcSegments;
      const angle = -Math.PI / 2 + t * (Math.PI / 2);
      points.push(new THREE.Vector2(r - b + b * Math.cos(angle), -h + b + b * Math.sin(angle)));
    }
    // Right side (vertical)
    points.push(new THREE.Vector2(r, h - b));
    // Top bevel: quarter circle from (r, h-b) to (r-b, h)
    for (let i = 1; i <= arcSegments; i++) {
      const t = i / arcSegments;
      const angle = t * (Math.PI / 2);
      points.push(new THREE.Vector2(r - b + b * Math.cos(angle), h - b + b * Math.sin(angle)));
    }
    // Top edge and back to axis
    points.push(new THREE.Vector2(r - b, h));
    points.push(new THREE.Vector2(eps, h));

    return points;
  }

  const geometry = new THREE.LatheGeometry(roundedCylinderProfile(), radialSegments);

  // Load Concrete030 PBR textures
  const [colorMap, roughnessMap, normalGL] = await Promise.all([
    loadTexture(`${TEX_BASE}_Color.jpg`),
    loadTexture(`${TEX_BASE}_Roughness.jpg`),
    loadTexture(`${TEX_BASE}_NormalGL.jpg`),
  ]);
  colorMap.colorSpace = THREE.SRGBColorSpace;

  // Material — Concrete030 textures
  const material = new THREE.MeshStandardNodeMaterial();
  material.colorNode = texture(colorMap);
  material.roughnessNode = texture(roughnessMap).r;
  material.metalnessNode = float(0.0);
  material.normalNode = normalMap(texture(normalGL));

  wheelMesh = new THREE.Mesh(geometry, material);
  wheelMesh.rotation.x = Math.PI / 2; // lay flat like a wheel
  scene.add(wheelMesh);

  // Renderer
  renderer = new WebGPURenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  await renderer.init();

  // Orbit controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0, 0);

  window.addEventListener("resize", onResize);
  renderer.setAnimationLoop(animate);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  controls.update();
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
