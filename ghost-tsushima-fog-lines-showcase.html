<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Fog Lines Showcase</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        overflow: hidden;
        background: #070d17;
        font-family: "SF Mono", "Fira Code", monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        font-size: 11px;
        line-height: 1.5;
        color: #d5e3ff;
        background: rgba(4, 8, 14, 0.58);
        border: 1px solid rgba(170, 196, 255, 0.28);
        border-radius: 8px;
        padding: 10px 12px;
      }
      #hud b {
        color: #f0f5ff;
      }
      .tp-dfwv {
        max-height: calc(100vh - 24px) !important;
        overflow-y: auto !important;
        scrollbar-width: thin;
        scrollbar-color: rgba(210, 230, 255, 0.35) rgba(10, 15, 25, 0.3);
      }
      .tp-dfwv::-webkit-scrollbar {
        width: 8px;
      }
      .tp-dfwv::-webkit-scrollbar-track {
        background: rgba(10, 15, 25, 0.3);
      }
      .tp-dfwv::-webkit-scrollbar-thumb {
        background: rgba(210, 230, 255, 0.35);
        border-radius: 6px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <b>Ghost Fog Lines</b><br />
      Long smoky wind bands for 3D gameplay<br />
      Orbit: <b>left-drag</b> · Zoom: <b>wheel</b>
    </div>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn,
        uv,
        vec2,
        float,
        mix,
        smoothstep,
        floor,
        fract,
        sin,
        dot,
        time,
        uniform,
      } from "three/tsl";

      const PARAMS = {
        // layout
        rows: 4,
        perRow: 6,
        rowSpacing: 7.2,
        xSpacing: 6.8,
        centerZ: -3.0,
        posJitterX: 1.4,
        posJitterZ: 1.8,
        samples: 56,
        lengthBase: 38.0,
        lengthVar: 12.0,
        widthBase: 0.75,
        widthVar: 0.62,
        yOffset: 0.55,
        yArch: 0.15,

        // path shape
        windDirX: 1.0,
        windDirZ: -0.18,
        driftAmp: 1.1,
        driftFreq: 8.0,
        microAmp: 0.22,
        microFreq: 31.0,

        // shader base
        speedBase: 0.33,
        speedVar: 0.18,
        widthSoftBase: 1.7,
        widthSoftVar: 0.35,
        densityBase: 1.1,
        densityVar: 0.4,
        stretchXBase: 12.0,
        stretchXVar: 8.0,
        stretchYBase: 2.7,
        stretchYVar: 1.2,
        warpBase: 0.42,
        warpVar: 0.3,
        baseColor: "#a9d4ff",
        hotColor: "#ffc695",
        opacityMul: 1.0,
        glowMul: 1.0,

        // scene
        bgColor: "#080f19",
        fogColor: "#0a1320",
        fogNear: 22,
        fogFar: 120,
        groundColor: "#121a24",
        hemiSky: "#8da8de",
        hemiGround: "#121820",
        hemiIntensity: 0.56,
        moonColor: "#aec7ff",
        moonIntensity: 1.0,
        fireColor: "#ffb886",
        fireIntensity: 1.1,
        fireDistance: 28,

        regenerate: () => rebuildWindBands(true),
        resetDefaults: () => resetDefaults(),
      };

      const DEFAULTS = JSON.parse(JSON.stringify(PARAMS));
      const rng = Math.random;

      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(PARAMS.bgColor);
      scene.fog = new THREE.Fog(PARAMS.fogColor, PARAMS.fogNear, PARAMS.fogFar);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        300,
      );
      camera.position.set(0, 8, 28);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(0, 2.5, -3);
      controls.maxPolarAngle = Math.PI * 0.47;
      controls.minDistance = 8;
      controls.maxDistance = 56;
      controls.update();

      const hemi = new THREE.HemisphereLight(
        PARAMS.hemiSky,
        PARAMS.hemiGround,
        PARAMS.hemiIntensity,
      );
      scene.add(hemi);
      const moon = new THREE.DirectionalLight(PARAMS.moonColor, PARAMS.moonIntensity);
      moon.position.set(-15, 13, 8);
      scene.add(moon);
      const fire = new THREE.PointLight(
        PARAMS.fireColor,
        PARAMS.fireIntensity,
        PARAMS.fireDistance,
        2,
      );
      fire.position.set(0, 2.5, -8);
      scene.add(fire);

      function terrainHeight(x, z) {
        return (
          Math.sin(x * 0.16) * 0.34 +
          Math.cos(z * 0.12 + x * 0.06) * 0.29 +
          Math.sin(z * 0.08 - x * 0.05) * 0.21
        );
      }

      const groundGeo = new THREE.PlaneGeometry(140, 140, 120, 120);
      groundGeo.rotateX(-Math.PI / 2);
      const gPos = groundGeo.attributes.position.array;
      for (let i = 0; i < gPos.length; i += 3) {
        gPos[i + 1] = terrainHeight(gPos[i], gPos[i + 2]);
      }
      groundGeo.computeVertexNormals();
      const ground = new THREE.Mesh(
        groundGeo,
        new THREE.MeshStandardMaterial({
          color: PARAMS.groundColor,
          roughness: 0.96,
          metalness: 0.02,
        }),
      );
      scene.add(ground);

      function createRibbonGeometry(points, width = 0.8) {
        const pointCount = points.length;
        const vertices = new Float32Array(pointCount * 2 * 3);
        const uvs = new Float32Array(pointCount * 2 * 2);
        const indices = [];

        let totalLen = 0;
        const lens = [0];
        for (let i = 1; i < pointCount; i++) {
          totalLen += points[i].distanceTo(points[i - 1]);
          lens.push(totalLen);
        }
        const invLen = totalLen > 0 ? 1 / totalLen : 1;

        for (let i = 0; i < pointCount; i++) {
          const p = points[i];
          const prev = points[Math.max(0, i - 1)];
          const next = points[Math.min(pointCount - 1, i + 1)];
          const tangent = next.clone().sub(prev).normalize();
          const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
          const halfW = width * 0.5;

          const left = p.clone().addScaledVector(side, -halfW);
          const right = p.clone().addScaledVector(side, halfW);

          const vIndex = i * 2;
          vertices.set([left.x, left.y, left.z], vIndex * 3);
          vertices.set([right.x, right.y, right.z], (vIndex + 1) * 3);

          const u = lens[i] * invLen;
          uvs.set([u, 0], vIndex * 2);
          uvs.set([u, 1], (vIndex + 1) * 2);
        }

        for (let i = 0; i < pointCount - 1; i++) {
          const a = i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          indices.push(a, c, b, b, c, d);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
        geo.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        return geo;
      }

      // TSL smoke-like line texture
      const hash2 = Fn(([p]) => {
        return vec2(
          fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453)),
          fract(sin(dot(p, vec2(269.5, 183.3))).mul(43758.5453)),
        );
      });

      const gradNoise = Fn(([p]) => {
        const i = floor(p).toVar();
        const f = fract(p).toVar();
        const u = f.mul(f).mul(float(3).sub(f.mul(2))).toVar();

        const g00 = hash2(i).mul(2).sub(1);
        const g10 = hash2(i.add(vec2(1, 0))).mul(2).sub(1);
        const g01 = hash2(i.add(vec2(0, 1))).mul(2).sub(1);
        const g11 = hash2(i.add(vec2(1, 1))).mul(2).sub(1);

        const d00 = dot(g00, f);
        const d10 = dot(g10, f.sub(vec2(1, 0)));
        const d01 = dot(g01, f.sub(vec2(0, 1)));
        const d11 = dot(g11, f.sub(vec2(1, 1)));

        return mix(mix(d00, d10, u.x), mix(d01, d11, u.x), u.y)
          .mul(0.5)
          .add(0.5);
      });

      const fbm5 = Fn(([p]) => {
        let v = gradNoise(p).mul(0.54);
        v = v.add(gradNoise(p.mul(2.03)).mul(0.25));
        v = v.add(gradNoise(p.mul(4.17)).mul(0.12));
        v = v.add(gradNoise(p.mul(8.21)).mul(0.06));
        v = v.add(gradNoise(p.mul(16.4)).mul(0.03));
        return v;
      });

      function randWithVariation(base, variation) {
        return base + rng() * variation;
      }

      const SHADER_U = {
        uSpeedBase: uniform(PARAMS.speedBase),
        uSpeedVar: uniform(PARAMS.speedVar),
        uWidthSoftBase: uniform(PARAMS.widthSoftBase),
        uWidthSoftVar: uniform(PARAMS.widthSoftVar),
        uDensityBase: uniform(PARAMS.densityBase),
        uDensityVar: uniform(PARAMS.densityVar),
        uStretchXBase: uniform(PARAMS.stretchXBase),
        uStretchXVar: uniform(PARAMS.stretchXVar),
        uStretchYBase: uniform(PARAMS.stretchYBase),
        uStretchYVar: uniform(PARAMS.stretchYVar),
        uWarpBase: uniform(PARAMS.warpBase),
        uWarpVar: uniform(PARAMS.warpVar),
        uBaseColor: uniform(new THREE.Color(PARAMS.baseColor)),
        uHotColor: uniform(new THREE.Color(PARAMS.hotColor)),
        uOpacityMul: uniform(PARAMS.opacityMul),
        uGlowMul: uniform(PARAMS.glowMul),
      };

      function createFogLineMaterial() {
        const uSpeed = SHADER_U.uSpeedBase;
        const uWidthSoft = SHADER_U.uWidthSoftBase;
        const uDensity = SHADER_U.uDensityBase;
        const uStretchX = SHADER_U.uStretchXBase;
        const uStretchY = SHADER_U.uStretchYBase;
        const uWarp = SHADER_U.uWarpBase;

        const mat = new THREE.MeshBasicNodeMaterial({
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });

        const st = uv();
        const t = time.mul(uSpeed);
        const p0 = vec2(
          st.x.mul(uStretchX).add(t.mul(1.3)),
          st.y.sub(0.5).mul(uStretchY).sub(t.mul(0.15)),
        ).toVar();

        const warpX = fbm5(p0.mul(0.6).add(vec2(0.0, t.mul(0.45)))).sub(0.5);
        const warpY = fbm5(p0.mul(0.8).sub(vec2(t.mul(0.35), 0.0))).sub(0.5);
        const p = p0.add(vec2(warpX, warpY).mul(uWarp)).toVar();

        const n1 = fbm5(p).toVar();
        const n2 = fbm5(p.mul(2.5).add(vec2(t.mul(0.28), t.mul(-0.22)))).toVar();
        const n3 = fbm5(vec2(p.x.mul(0.35), p.y.mul(2.45).add(n1.mul(1.7)))).toVar();

        const center = float(1.0)
          .sub(st.y.sub(0.5).abs().mul(uWidthSoft))
          .saturate()
          .pow(1.4)
          .toVar();
        const tips = smoothstep(0.02, 0.14, st.x)
          .mul(smoothstep(0.02, 0.2, float(1.0).sub(st.x)))
          .toVar();

        const wisps = smoothstep(0.44, 0.9, n1.mul(0.8).add(n2.mul(0.72))).toVar();
        const filaments = float(1.0)
          .sub(n3.sub(0.5).abs().mul(2.0))
          .pow(2.1)
          .toVar();
        const alpha = center
          .mul(tips)
          .mul(wisps.mul(0.85).add(filaments.mul(0.52)))
          .mul(uDensity)
          .mul(SHADER_U.uOpacityMul)
          .saturate()
          .toVar();

        const glowMask = smoothstep(0.72, 1.0, n2).mul(0.34);
        const col = mix(SHADER_U.uBaseColor, SHADER_U.uHotColor, glowMask.add(alpha.mul(0.3)))
          .mul(alpha.mul(1.1).add(glowMask.mul(0.8)))
          .mul(SHADER_U.uGlowMul);

        mat.colorNode = col;
        mat.opacityNode = alpha;
        return mat;
      }

      const sharedFogLineMaterial = createFogLineMaterial();

      function buildWindRibbon(centerX, centerZ, length, width, seed) {
        const points = [];
        const samples = Math.max(8, Math.floor(PARAMS.samples));
        const windDir = new THREE.Vector3(PARAMS.windDirX, 0, PARAMS.windDirZ).normalize();
        const side = new THREE.Vector3(-windDir.z, 0, windDir.x);
        for (let i = 0; i < samples; i++) {
          const u = i / (samples - 1);
          const along = (u - 0.5) * length;
          const drift = Math.sin(u * PARAMS.driftFreq + seed * 7.3) * PARAMS.driftAmp;
          const micro = Math.sin(u * PARAMS.microFreq + seed * 13.7) * PARAMS.microAmp;
          const x = centerX + windDir.x * along + side.x * (drift + micro);
          const z = centerZ + windDir.z * along + side.z * (drift + micro);
          const y =
            terrainHeight(x, z) + PARAMS.yOffset + Math.sin(u * Math.PI) * PARAMS.yArch;
          points.push(new THREE.Vector3(x, y, z));
        }
        const geo = createRibbonGeometry(points, width);
        const mesh = new THREE.Mesh(geo, sharedFogLineMaterial);
        mesh.renderOrder = 40;
        return mesh;
      }

      const bandGroup = new THREE.Group();
      scene.add(bandGroup);

      const ribbons = [];

      function disposeRibbon(mesh) {
        if (mesh.geometry) mesh.geometry.dispose();
      }

      function clearBands() {
        for (const mesh of ribbons) disposeRibbon(mesh);
        ribbons.length = 0;
        bandGroup.clear();
      }

      let rebuildTimer = null;
      let rebuildQueued = false;

      function doRebuildWindBands() {
        clearBands();
        const rows = Math.max(1, Math.floor(PARAMS.rows));
        const perRow = Math.max(1, Math.floor(PARAMS.perRow));
        let index = 0;
        for (let r = 0; r < rows; r++) {
          for (let i = 0; i < perRow; i++) {
            const fx =
              (i - (perRow - 1) * 0.5) * PARAMS.xSpacing +
              (rng() - 0.5) * PARAMS.posJitterX;
            const fz =
              PARAMS.centerZ - r * PARAMS.rowSpacing + (rng() - 0.5) * PARAMS.posJitterZ;
            const length = randWithVariation(PARAMS.lengthBase, PARAMS.lengthVar);
            const width = randWithVariation(PARAMS.widthBase, PARAMS.widthVar);
            const band = buildWindRibbon(fx, fz, length, width, index * 0.171);
            ribbons.push(band);
            bandGroup.add(band);
            index++;
          }
        }
      }

      function rebuildWindBands(immediate = false) {
        if (immediate) {
          if (rebuildTimer) {
            clearTimeout(rebuildTimer);
            rebuildTimer = null;
          }
          rebuildQueued = false;
          doRebuildWindBands();
          return;
        }

        rebuildQueued = true;
        if (rebuildTimer) clearTimeout(rebuildTimer);
        rebuildTimer = setTimeout(() => {
          rebuildTimer = null;
          if (!rebuildQueued) return;
          rebuildQueued = false;
          doRebuildWindBands();
        }, 120);
      }

      function applyShaderToExistingBands() {
        SHADER_U.uBaseColor.value.set(PARAMS.baseColor);
        SHADER_U.uHotColor.value.set(PARAMS.hotColor);
        SHADER_U.uOpacityMul.value = PARAMS.opacityMul;
        SHADER_U.uGlowMul.value = PARAMS.glowMul;
        SHADER_U.uSpeedBase.value = PARAMS.speedBase;
        SHADER_U.uSpeedVar.value = PARAMS.speedVar;
        SHADER_U.uWidthSoftBase.value = PARAMS.widthSoftBase;
        SHADER_U.uWidthSoftVar.value = PARAMS.widthSoftVar;
        SHADER_U.uDensityBase.value = PARAMS.densityBase;
        SHADER_U.uDensityVar.value = PARAMS.densityVar;
        SHADER_U.uStretchXBase.value = PARAMS.stretchXBase;
        SHADER_U.uStretchXVar.value = PARAMS.stretchXVar;
        SHADER_U.uStretchYBase.value = PARAMS.stretchYBase;
        SHADER_U.uStretchYVar.value = PARAMS.stretchYVar;
        SHADER_U.uWarpBase.value = PARAMS.warpBase;
        SHADER_U.uWarpVar.value = PARAMS.warpVar;
      }

      function applySceneParams() {
        scene.background.set(PARAMS.bgColor);
        scene.fog.color.set(PARAMS.fogColor);
        scene.fog.near = PARAMS.fogNear;
        scene.fog.far = PARAMS.fogFar;
        ground.material.color.set(PARAMS.groundColor);
        hemi.color.set(PARAMS.hemiSky);
        hemi.groundColor.set(PARAMS.hemiGround);
        hemi.intensity = PARAMS.hemiIntensity;
        moon.color.set(PARAMS.moonColor);
        moon.intensity = PARAMS.moonIntensity;
        fire.color.set(PARAMS.fireColor);
        fire.intensity = PARAMS.fireIntensity;
        fire.distance = PARAMS.fireDistance;
      }

      function resetDefaults() {
        Object.assign(PARAMS, JSON.parse(JSON.stringify(DEFAULTS)));
        pane.refresh();
        applyShaderToExistingBands();
        applySceneParams();
        rebuildWindBands(true);
      }

      rebuildWindBands(true);

      // Background silhouettes
      const treeMat = new THREE.MeshStandardMaterial({
        color: 0x0d1218,
        roughness: 1.0,
      });
      const trunkGeo = new THREE.CylinderGeometry(0.06, 0.12, 4.2, 7);
      for (let i = 0; i < 95; i++) {
        const x = (Math.random() - 0.5) * 110;
        const z = (Math.random() - 0.5) * 110;
        if (Math.abs(x) < 12 && z > -35 && z < 18) continue;
        const h = 2.6 + Math.random() * 5.2;
        const t = new THREE.Mesh(trunkGeo, treeMat);
        t.scale.y = h / 4.2;
        t.position.set(x, terrainHeight(x, z) + h * 0.5, z);
        t.rotation.z = (Math.random() - 0.5) * 0.12;
        scene.add(t);
      }

      const gateMat = new THREE.MeshStandardMaterial({
        color: 0x20262e,
        roughness: 0.9,
      });
      const gate = new THREE.Group();
      gate.position.set(0, terrainHeight(0, -8), -8);
      scene.add(gate);
      const post = new THREE.BoxGeometry(0.5, 3.0, 0.5);
      const beam = new THREE.BoxGeometry(5.2, 0.38, 0.68);
      const top = new THREE.BoxGeometry(6.4, 0.32, 0.9);
      const p1 = new THREE.Mesh(post, gateMat);
      const p2 = new THREE.Mesh(post, gateMat);
      const b = new THREE.Mesh(beam, gateMat);
      const t = new THREE.Mesh(top, gateMat);
      p1.position.set(-1.9, 1.5, 0);
      p2.position.set(1.9, 1.5, 0);
      b.position.set(0, 2.8, 0);
      t.position.set(0, 3.2, -0.08);
      gate.add(p1, p2, b, t);

      // ---- Tweakpane controls ----
      const pane = new Pane({ title: "Ghost Fog Lines Controls" });
      const onRebuildLast = (ev) => {
        if (!ev.last) return;
        rebuildWindBands(true);
      };

      const fActions = pane.addFolder({ title: "Actions", expanded: true });
      fActions
        .addButton({ title: "Regenerate Bands" })
        .on("click", () => PARAMS.regenerate());
      fActions
        .addButton({ title: "Reset Defaults" })
        .on("click", () => PARAMS.resetDefaults());

      const fLayout = pane.addFolder({ title: "Layout", expanded: false });
      fLayout
        .addBinding(PARAMS, "rows", { min: 1, max: 10, step: 1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "perRow", { min: 1, max: 20, step: 1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "rowSpacing", { min: 2, max: 14, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "xSpacing", { min: 2, max: 12, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "centerZ", { min: -30, max: 20, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "posJitterX", { min: 0, max: 6, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "posJitterZ", { min: 0, max: 6, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "samples", { min: 8, max: 120, step: 1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "lengthBase", { min: 6, max: 120, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "lengthVar", { min: 0, max: 80, step: 0.1 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "widthBase", { min: 0.1, max: 5, step: 0.01 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "widthVar", { min: 0, max: 4, step: 0.01 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "yOffset", { min: 0, max: 4, step: 0.01 })
        .on("change", onRebuildLast);
      fLayout
        .addBinding(PARAMS, "yArch", { min: 0, max: 2, step: 0.01 })
        .on("change", onRebuildLast);

      const fPath = pane.addFolder({ title: "Wind Path", expanded: false });
      fPath
        .addBinding(PARAMS, "windDirX", { min: -2, max: 2, step: 0.01 })
        .on("change", onRebuildLast);
      fPath
        .addBinding(PARAMS, "windDirZ", { min: -2, max: 2, step: 0.01 })
        .on("change", onRebuildLast);
      fPath
        .addBinding(PARAMS, "driftAmp", { min: 0, max: 4, step: 0.01 })
        .on("change", onRebuildLast);
      fPath
        .addBinding(PARAMS, "driftFreq", { min: 0, max: 24, step: 0.1 })
        .on("change", onRebuildLast);
      fPath
        .addBinding(PARAMS, "microAmp", { min: 0, max: 2, step: 0.01 })
        .on("change", onRebuildLast);
      fPath
        .addBinding(PARAMS, "microFreq", { min: 0, max: 72, step: 0.1 })
        .on("change", onRebuildLast);

      const fShader = pane.addFolder({ title: "Shader (Regenerate)", expanded: false });
      fShader
        .addBinding(PARAMS, "speedBase", { min: 0, max: 2, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "speedVar", { min: 0, max: 2, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "widthSoftBase", { min: 0.2, max: 4, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "widthSoftVar", { min: 0, max: 2, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "densityBase", { min: 0, max: 4, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "densityVar", { min: 0, max: 3, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "stretchXBase", { min: 1, max: 40, step: 0.1 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "stretchXVar", { min: 0, max: 20, step: 0.1 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "stretchYBase", { min: 0.2, max: 12, step: 0.1 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "stretchYVar", { min: 0, max: 8, step: 0.1 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "warpBase", { min: 0, max: 3, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fShader
        .addBinding(PARAMS, "warpVar", { min: 0, max: 3, step: 0.01 })
        .on("change", applyShaderToExistingBands);

      const fLook = pane.addFolder({ title: "Look (Live)", expanded: false });
      fLook.addBinding(PARAMS, "baseColor").on("change", applyShaderToExistingBands);
      fLook.addBinding(PARAMS, "hotColor").on("change", applyShaderToExistingBands);
      fLook
        .addBinding(PARAMS, "opacityMul", { min: 0, max: 3, step: 0.01 })
        .on("change", applyShaderToExistingBands);
      fLook
        .addBinding(PARAMS, "glowMul", { min: 0, max: 3, step: 0.01 })
        .on("change", applyShaderToExistingBands);

      const fScene = pane.addFolder({ title: "Scene", expanded: false });
      fScene.addBinding(PARAMS, "bgColor").on("change", applySceneParams);
      fScene.addBinding(PARAMS, "fogColor").on("change", applySceneParams);
      fScene
        .addBinding(PARAMS, "fogNear", { min: 1, max: 200, step: 1 })
        .on("change", applySceneParams);
      fScene
        .addBinding(PARAMS, "fogFar", { min: 5, max: 300, step: 1 })
        .on("change", applySceneParams);
      fScene.addBinding(PARAMS, "groundColor").on("change", applySceneParams);
      fScene.addBinding(PARAMS, "hemiSky").on("change", applySceneParams);
      fScene.addBinding(PARAMS, "hemiGround").on("change", applySceneParams);
      fScene
        .addBinding(PARAMS, "hemiIntensity", { min: 0, max: 3, step: 0.01 })
        .on("change", applySceneParams);
      fScene.addBinding(PARAMS, "moonColor").on("change", applySceneParams);
      fScene
        .addBinding(PARAMS, "moonIntensity", { min: 0, max: 3, step: 0.01 })
        .on("change", applySceneParams);
      fScene.addBinding(PARAMS, "fireColor").on("change", applySceneParams);
      fScene
        .addBinding(PARAMS, "fireIntensity", { min: 0, max: 4, step: 0.01 })
        .on("change", applySceneParams);
      fScene
        .addBinding(PARAMS, "fireDistance", { min: 0, max: 80, step: 0.1 })
        .on("change", applySceneParams);

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
