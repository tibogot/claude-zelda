<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean — LOD Clipmap · WebGPU + TSL</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #14202e; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .tp-dfwv { max-height: calc(100vh - 16px); overflow-y: auto; z-index: 20; }
      #hud {
        position: fixed; bottom: 8px; left: 8px; z-index: 25;
        color: #bfe6e0; font: 12px/1.4 ui-monospace, monospace;
        background: rgba(8, 22, 30, 0.55); padding: 6px 9px; border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
      #boat-ui {
        position: fixed; bottom: 8px; right: 8px; z-index: 25;
        max-width: 320px; color: #d8ece8; font-size: 12px; line-height: 1.55;
        background: rgba(8, 22, 30, 0.72); border: 1px solid rgba(120, 200, 180, 0.25);
        border-radius: 8px; padding: 10px 12px; pointer-events: none;
      }
      #boat-ui strong { color: #9ee8d8; font-size: 13px; }
      #boat-ui kbd {
        background: rgba(255, 255, 255, 0.1); padding: 1px 5px;
        border-radius: 4px; font: 11px ui-monospace, monospace;
      }
      #boat-ui .cam-badge {
        display: inline-block; margin-top: 6px; padding: 2px 8px;
        border-radius: 4px; font: 11px ui-monospace, monospace;
        background: rgba(80, 160, 140, 0.35); border: 1px solid rgba(120, 220, 190, 0.35);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud"></div>
    <div id="boat-ui" hidden>
      <strong>Boat controls</strong><br />
      <kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd> throttle ·
      <kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> steer<br />
      <kbd>Shift</kbd> boost · <kbd>Space</kbd> brake · <kbd>R</kbd> respawn<br />
      <kbd>Tab</kbd> or <kbd>C</kbd> toggle chase / orbit camera<br />
      <span class="cam-badge" id="boat-cam-badge">chase cam</span>
    </div>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { Pane } from "tweakpane";
      import Stats from "stats-gl";
      import { createOceanShader, OCEAN_DEFAULTS } from "./ocean-shader.js";
      import { createOceanFFTSimulation, OCEAN_FFT_DEFAULTS, sampleOceanSurface } from "./ocean-fft.js";
      import { createOceanFFTGPUSimulation, OCEAN_FFT_GPU_DEFAULTS } from "./ocean-fft-gpu.js";
      import { OceanBoatPhysics, DEFAULT_BOAT_HULL } from "./ocean-buoyancy.js";
      import {
        uniform as tUniform, float as tF, vec2 as tV2, positionWorld,
        mx_noise_float, attribute as tAttr, abs as tAbs, pow as tPow,
        saturate as tSat, smoothstep as tSmooth,
      } from "three/tsl";

      // ─────────────────────────────────────────────────────────────────────
      //  Map presets — the three world sizes the v2 map supports.
      // ─────────────────────────────────────────────────────────────────────
      const MAP_PRESETS = {
        "Small (600)": { size: 600, res: 256 },
        "Medium (1600)": { size: 1600, res: 384 },
        "Large (3200)": { size: 3200, res: 512 },
      };

      // ─── Noise helpers (Perlin fbm — same as lake-unreal-editor.html) ──────
      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function buildPermutation(seed) {
        const rnd = mulberry32(seed >>> 0);
        const p = new Uint8Array(512);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i > 0; i--) {
          const j = (rnd() * (i + 1)) | 0;
          const t = p[i]; p[i] = p[j]; p[j] = t;
        }
        for (let i = 0; i < 256; i++) p[256 + i] = p[i];
        return p;
      }
      function fadePerlin(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      function lerp1(a, b, t) { return a + t * (b - a); }
      function grad2(hash, x, y) {
        const h = hash & 3;
        const u = h < 2 ? x : y;
        const v = h < 2 ? y : x;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }
      function perlin2(x, y, perm) {
        const xi = Math.floor(x) & 255;
        const yi = Math.floor(y) & 255;
        const xf = x - Math.floor(x);
        const yf = y - Math.floor(y);
        const u = fadePerlin(xf);
        const v = fadePerlin(yf);
        const aa = perm[xi + perm[yi]];
        const ab = perm[xi + perm[yi + 1]];
        const ba = perm[xi + 1 + perm[yi]];
        const bb = perm[xi + 1 + perm[yi + 1]];
        const x1 = lerp1(grad2(aa, xf, yf), grad2(ba, xf - 1, yf), u);
        const x2 = lerp1(grad2(ab, xf, yf - 1), grad2(bb, xf - 1, yf - 1), u);
        return lerp1(x1, x2, v);
      }
      function fbmPerlin(wx, wz, perm, octaves) {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let o = 0; o < octaves; o++) {
          sum += amp * perlin2(wx * freq, wz * freq, perm);
          norm += amp; amp *= 0.5; freq *= 2;
        }
        return sum / norm;
      }
      function ridgedFbm(wx, wz, perm, octaves) {
        let sum = 0, amp = 1, freq = 1, norm = 0;
        for (let o = 0; o < octaves; o++) {
          let n = 1 - Math.abs(perlin2(wx * freq, wz * freq, perm));
          n *= n;
          sum += amp * n;
          norm += amp; amp *= 0.5; freq *= 2;
        }
        return sum / norm;
      }
      function smoothstepJs(e0, e1, x) {
        const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      }
      function sampleHeightBilinear(data, RES, tu, tv) {
        const u = THREE.MathUtils.clamp(tu, 0, 1);
        const v = THREE.MathUtils.clamp(tv, 0, 1);
        const fx = u * (RES - 1), fy = v * (RES - 1);
        const i0 = Math.floor(fx), j0 = Math.floor(fy);
        const t = fx - i0, w = fy - j0;
        const i1 = Math.min(i0 + 1, RES - 1), j1 = Math.min(j0 + 1, RES - 1);
        const h00 = data[j0 * RES + i0], h10 = data[j0 * RES + i1];
        const h01 = data[j1 * RES + i0], h11 = data[j1 * RES + i1];
        return lerp1(lerp1(h00, h10, t), lerp1(h01, h11, t), w);
      }
      function sunDirectionFromAngles(azimuthDeg, elevationDeg) {
        const az = (azimuthDeg * Math.PI) / 180;
        const el = (elevationDeg * Math.PI) / 180;
        const cosEl = Math.cos(el);
        return new THREE.Vector3(
          cosEl * Math.cos(az), Math.sin(el), cosEl * Math.sin(az),
        ).normalize();
      }

      // ─── Heightmap: ocean seabed below seaY=0, continental land with hills ──
      function buildIslandHeightData(o, RES, terrainSize) {
        const half = terrainSize * 0.5;
        const perm = buildPermutation(o.seed);
        const permMacro = buildPermutation(o.seed + 97);
        const permWarp = buildPermutation(o.seed + 241);
        const permRidge = buildPermutation(o.seed + 503);
        const rnd = mulberry32((o.seed + 13) >>> 0);
        const islands = [];
        for (let n = 0; n < o.islandCount; n++) {
          islands.push({
            cx: (rnd() * 2 - 1) * half * 0.58,
            cz: (rnd() * 2 - 1) * half * 0.58,
            r: half * o.islandRadiusFrac * (0.7 + rnd() * 0.85),
            h: o.islandHeight * (0.75 + rnd() * 0.65),
          });
        }
        const data = new Float32Array(RES * RES);
        const lo = o.landThreshold - o.landSoftness;
        const hi = o.landThreshold + o.landSoftness;
        for (let j = 0; j < RES; j++) {
          for (let i = 0; i < RES; i++) {
            const x = (i / (RES - 1)) * terrainSize - half;
            const z = (j / (RES - 1)) * terrainSize - half;
            const nx = x / terrainSize, nz = z / terrainSize;

            const seabed = -o.seabedDepth +
              fbmPerlin(nx * o.seabedFreq, nz * o.seabedFreq, permMacro, 4) * o.seabedRough;

            // Large-scale land/ocean mask (connected coastlines, not tiny dots).
            let landMask = fbmPerlin(
              nx * o.continentFreq + 0.17,
              nz * o.continentFreq - 0.09,
              permMacro, 6,
            );
            landMask += fbmPerlin(
              nx * o.coastFreq * 0.35 + 2.1,
              nz * o.coastFreq * 0.35 - 1.3,
              permWarp, 3,
            ) * 0.14;
            landMask = smoothstepJs(lo, hi, landMask * 0.5 + 0.5);

            for (const isl of islands) {
              const wob = fbmPerlin(
                nx * o.coastFreq + isl.cx * 0.008,
                nz * o.coastFreq + isl.cz * 0.008,
                permWarp, 3,
              );
              const rr = Math.max(isl.r * (1 + 0.28 * wob), 1);
              const d = Math.hypot(x - isl.cx, z - isl.cz);
              const t = Math.max(0, 1 - d / rr);
              const blob = Math.pow(t * t * (3 - 2 * t), o.islandSharp * 0.85);
              landMask = Math.max(landMask, blob * 0.92);
            }

            const inland = Math.pow(landMask, 0.72);
            const hills = fbmPerlin(nx * o.detailFreq * 0.32, nz * o.detailFreq * 0.32, perm, 5);
            const ridges = ridgedFbm(nx * o.ridgeFreq, nz * o.ridgeFreq, permRidge, 4);
            let landY =
              inland * o.hillAmp * (hills * 0.55 + 0.45) +
              inland * inland * o.mountainHeight * ridges * o.ridgeStrength;

            for (const isl of islands) {
              const wob = fbmPerlin(
                nx * o.coastFreq + isl.cx * 0.008,
                nz * o.coastFreq + isl.cz * 0.008,
                permWarp, 3,
              );
              const rr = Math.max(isl.r * (1 + 0.28 * wob), 1);
              const d = Math.hypot(x - isl.cx, z - isl.cz);
              const t = Math.max(0, 1 - d / rr);
              const shape = Math.pow(t * t * (3 - 2 * t), o.islandSharp);
              landY = Math.max(landY, isl.h * shape);
            }

            landY += fbmPerlin(nx * o.detailFreq, nz * o.detailFreq, perm, 5) *
              o.detailAmp * landMask;

            // Coast: seabed offshore, rising terrain on land. Sea level stays at Y=0.
            const coastBlend = smoothstepJs(0, 0.22, landMask);
            let y = seabed * (1 - coastBlend) + Math.max(seabed, landY) * coastBlend;
            // Edge falloff: sink terrain to seabed near the map border so the
            // perimeter is always open ocean — no land cut off at the boundary
            // (which read as a hollow, single-sided shell).
            const du = Math.min(i, RES - 1 - i) / (RES - 1);
            const dv = Math.min(j, RES - 1 - j) / (RES - 1);
            const edgeT = smoothstepJs(0, Math.max(o.edgeFalloff, 1e-4), Math.min(du, dv));
            y = lerp1(seabed, y, edgeT);
            data[j * RES + i] = y;
          }
        }
        return data;
      }

      // ─── Terrain mesh (vertex-coloured: seabed → sand → grass → rock) ──────
      const _cSeabed = new THREE.Color("#15323a");
      const _cSand = new THREE.Color("#cdbd86");
      const _cGrass = new THREE.Color("#3f6b2e");
      const _cRock = new THREE.Color("#6e6a63");
      const _cSnow = new THREE.Color("#eef2f4");
      const _tmpA = new THREE.Color(), _tmpB = new THREE.Color();
      function terrainColorAt(y, out) {
        if (y < -0.5) {
          const d = THREE.MathUtils.clamp(-y / 24, 0, 1);
          return out.copy(_cSand).lerp(_cSeabed, d);
        }
        if (y < 2.5) return out.copy(_cSand);
        if (y < 16) {
          return out.copy(_cSand).lerp(_cGrass, THREE.MathUtils.clamp((y - 2.5) / 8, 0, 1));
        }
        if (y < 40) {
          return out.copy(_cGrass).lerp(_cRock, THREE.MathUtils.clamp((y - 16) / 24, 0, 1));
        }
        return out.copy(_cRock).lerp(_cSnow, THREE.MathUtils.clamp((y - 40) / 30, 0, 1));
      }
      function buildTerrainGeo(data, RES, terrainSize, seg) {
        const half = terrainSize / 2;
        const N = seg + 1;
        const positions = new Float32Array(N * N * 3);
        const colors = new Float32Array(N * N * 3);
        let p = 0;
        for (let j = 0; j < N; j++) {
          const tv = j / seg, z = tv * terrainSize - half;
          for (let i = 0; i < N; i++) {
            const tu = i / seg, x = tu * terrainSize - half;
            const y = sampleHeightBilinear(data, RES, tu, tv);
            positions[p] = x; positions[p + 1] = y; positions[p + 2] = z;
            terrainColorAt(y, _tmpA);
            colors[p] = _tmpA.r; colors[p + 1] = _tmpA.g; colors[p + 2] = _tmpA.b;
            p += 3;
          }
        }
        const idx = [];
        for (let j = 0; j < seg; j++) {
          for (let i = 0; i < seg; i++) {
            const a = j * N + i, b = a + 1, c = a + N, d = c + 1;
            idx.push(a, c, b, b, c, d);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        return geo;
      }

      // ─── LOD clipmap ocean geometry ────────────────────────────────────────
      // A square ring grid in the XZ plane (y = 0). `innerHalf` cuts a central
      // square hole (cells whose centre lies inside it are dropped). Shared by
      // every LOD level and the horizon skirt.
      function buildRingGeometryXZ(seg, outerHalf, innerHalf) {
        const N = seg + 1;
        const cell = (outerHalf * 2) / seg;
        const positions = new Float32Array(N * N * 3);
        const aCell = new Float32Array(N * N);
        const aOuter = new Float32Array(N * N);
        let p = 0, q = 0;
        for (let j = 0; j < N; j++) {
          const z = -outerHalf + j * cell;
          for (let i = 0; i < N; i++) {
            positions[p] = -outerHalf + i * cell;
            positions[p + 1] = 0;
            positions[p + 2] = z;
            aCell[q] = cell;
            aOuter[q] = outerHalf;
            p += 3; q += 1;
          }
        }
        const idx = [];
        for (let j = 0; j < seg; j++) {
          for (let i = 0; i < seg; i++) {
            const cx = -outerHalf + (i + 0.5) * cell;
            const cz = -outerHalf + (j + 0.5) * cell;
            if (Math.max(Math.abs(cx), Math.abs(cz)) < innerHalf - 1e-3) continue;
            const a = j * N + i, b = a + 1, c = a + N, d = c + 1;
            idx.push(a, c, b, b, c, d);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geo.setAttribute("aCell", new THREE.BufferAttribute(aCell, 1));
        geo.setAttribute("aOuterHalf", new THREE.BufferAttribute(aOuter, 1));
        geo.setIndex(idx);
        return geo;
      }

      const LOD_PALETTE = [
        0xff5050, 0xffa040, 0xffe640, 0x66ff66, 0x40e6e6, 0x5090ff, 0xb060ff, 0xff60c0,
      ];

      function buildClipmapOcean({ levels, gridM, baseCell, horizonScale, material }) {
        const group = new THREE.Group();
        const meshes = [];
        const debugMats = [];
        let triCount = 0;
        // Every ring is a proper doubling CDLOD level (gridM segs, cell ×2 each
        // level) so the vertex morph stitches every boundary. Extra doubling
        // levels are appended past `levels` until the ocean reaches
        // horizonScale × extent. (The old coarse skirt was a non-matching grid,
        // leaving a square T-junction crack that showed sky through the water.)
        const mainOuter = (gridM * baseCell * Math.pow(2, levels - 1)) / 2;
        const targetOuter = mainOuter * Math.max(1, horizonScale);
        let lastOuterHalf = 0;
        for (let k = 0; k < levels + 16; k++) {
          const outerHalf = (gridM * baseCell * Math.pow(2, k)) / 2;
          const innerHalf = k === 0 ? 0 : outerHalf / 2;
          const geo = buildRingGeometryXZ(gridM, outerHalf, innerHalf);
          triCount += geo.getIndex().count / 3;
          const mesh = new THREE.Mesh(geo, material);
          mesh.frustumCulled = false;
          mesh.renderOrder = 1;
          group.add(mesh);
          meshes.push(mesh);
          debugMats.push(
            new THREE.MeshBasicMaterial({
              color: LOD_PALETTE[k % LOD_PALETTE.length], wireframe: true,
            }),
          );
          lastOuterHalf = outerHalf;
          if (k >= levels - 1 && outerHalf >= targetOuter) break;
        }
        return { group, meshes, debugMats, triCount, snapStep: baseCell * 2, finestExtent: gridM * baseCell, levelCount: meshes.length, reach: lastOuterHalf };
      }

      // ─────────────────────────────────────────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);
        await renderer.init();

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        stats.dom.style.cssText = "position:fixed;top:0;left:0;z-index:25;cursor:pointer";
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          50, window.innerWidth / window.innerHeight, 0.1, 30000,
        );
        camera.position.set(-420, 140, 380);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(-80, 42, 40);
        controls.maxPolarAngle = Math.PI * 0.96; // allow orbiting below the surface (diving)
        controls.maxDistance = 12000;
        controls.update();

        const clock = new THREE.Timer();
        const hud = document.getElementById("hud");
        const boatUi = document.getElementById("boat-ui");
        const boatCamBadge = document.getElementById("boat-cam-badge");

        // ── Params ───────────────────────────────────────────────────────────
        const SEA_LEVEL = 0;
        const params = {
          // map — ocean is fixed at Y=0; terrain rises above / seabed below.
          preset: "Medium (1600)",
          terrainSeg: 280,
          // land / coast
          seed: 1337,
          continentFreq: 1.65,
          landThreshold: 0.48,
          landSoftness: 0.11,
          hillAmp: 32,
          mountainHeight: 98,
          ridgeFreq: 2.35,
          ridgeStrength: 0.74,
          islandCount: 2,
          islandHeight: 52,
          islandRadiusFrac: 0.26,
          islandSharp: 1.15,
          seabedDepth: 38,
          seabedRough: 12,
          seabedFreq: 3.0,
          coastFreq: 5.0,
          detailFreq: 14.0,
          detailAmp: 5.0,
          /** Fraction of the map (per side) over which land sinks to seabed at the border. */
          edgeFalloff: 0.12,
          // LOD
          levels: 7,
          gridM: 64,
          baseCell: 1.0,
          horizonScale: 6.0,
          wireframe: false,
          lodColor: false,
          // waves + look (spread from OCEAN_DEFAULTS, overridable)
          ...structuredClone(OCEAN_DEFAULTS),
          /** GPU FFT compute rate (Hz) — decoupled from render fps. */
          fftUpdateHz: 30,
          // sky / light
          exposure: 0.95,
          sunAzimuth: 38,
          sunElevation: 28,
          envIntensity: 0.45,
          skyTurbidity: 3,
          skyRayleigh: 1.6,
          skyMie: 0.005,
          skyMieG: 0.8,
          fogDensity: 0.0,
          terrainRoughness: 0.92,
          // underwater (phase 1: fog + tint + caustics, gated by submersion)
          uwEyeOffset: 0.0,
          uwTransitionSpeed: 5.0,
          uwFogColor: "#0d3b46",
          uwFogDensity: 0.04,
          uwTint: "#0a3a44",
          uwTintMax: 0.6,
          causticsEnabled: true,
          causticScale: 0.18,
          causticSpeed: 0.6,
          causticIntensity: 0.9,
          causticSharp: 3.0,
          causticColor: "#86ecdb",
          // boat (VVV-style buoyancy, no Rapier)
          boatEnabled: false,
          boatFollowCam: false,
          boatCamDistance: 18,
          boatCamHeight: 6.5,
          boatCamLookY: 1.4,
          boatCamLerp: 5.5,
          boatThrust: 14000,
          boatTopSpeed: 14,
          boatMass: DEFAULT_BOAT_HULL.mass,
        };
        // OCEAN_DEFAULTS exposes windAngleDeg / windSpreadDeg as the wind keys.

        // ── Sky + lights ──────────────────────────────────────────────────────
        const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x44607a, 0.5);
        scene.add(hemi);
        const sunLight = new THREE.DirectionalLight(0xfff3d8, 2.0);
        scene.add(sunLight, sunLight.target);
        const sky = new SkyMesh();
        sky.scale.setScalar(20000);
        scene.add(sky);
        const fog = new THREE.FogExp2(0x9fb8c4, 0);
        scene.fog = fog;
        const pmrem = new THREE.PMREMGenerator(renderer);

        // ── Underwater state + seabed caustics uniforms ───────────────────────
        const uCaustTime = tUniform(0);
        const uUnderwater = tUniform(0);
        const uCausticScale = tUniform(params.causticScale);
        const uCausticSpeed = tUniform(params.causticSpeed);
        const uCausticIntensity = tUniform(params.causticsEnabled ? params.causticIntensity : 0);
        const uCausticSharp = tUniform(params.causticSharp);
        const uCausticColor = tUniform(new THREE.Color(params.causticColor));

        /** Emissive caustics node for the seabed (terrain below sea level). */
        function buildCausticsNode() {
          const cP = positionWorld.xz.mul(uCausticScale);
          const cT = uCaustTime.mul(uCausticSpeed);
          const n1 = mx_noise_float(cP.add(tV2(cT, cT.mul(0.6))));
          const n2 = mx_noise_float(cP.mul(1.7).add(tV2(cT.mul(-0.8), cT.mul(0.5))));
          const ridge = tSat(tF(1).sub(tAbs(n1.sub(n2))));
          const caust = tPow(ridge, uCausticSharp);
          const depth = tF(SEA_LEVEL).sub(positionWorld.y); // >0 below water
          const depthMask = tSmooth(tF(0), tF(1.5), depth).mul(tSat(tF(1).sub(depth.mul(0.02))));
          return uCausticColor.mul(caust.mul(uCausticIntensity).mul(uUnderwater).mul(depthMask));
        }

        function syncUnderwater() {
          uCausticScale.value = params.causticScale;
          uCausticSpeed.value = params.causticSpeed;
          uCausticIntensity.value = params.causticsEnabled ? params.causticIntensity : 0;
          uCausticSharp.value = params.causticSharp;
          uCausticColor.value.set(params.causticColor);
        }

        // Near-field underwater tint (covers what fog can't, e.g. the sky).
        const uwOverlay = document.createElement("div");
        uwOverlay.style.cssText =
          "position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;";
        document.body.appendChild(uwOverlay);
        let uwT = 0;
        const ABOVE_FOG_COLOR = new THREE.Color(0x9fb8c4);
        const _uwFogTmp = new THREE.Color();
        const _uwFogTarget = new THREE.Color();
        function updateUnderwater(dt, elapsed) {
          uCaustTime.value = elapsed;
          const submerged = camera.position.y < SEA_LEVEL + params.uwEyeOffset;
          const target = submerged ? 1 : 0;
          uwT += (target - uwT) * (1 - Math.exp(-params.uwTransitionSpeed * Math.max(dt, 1e-4)));
          uUnderwater.value = uwT;
          if (ocean) ocean.uniforms.underwaterT.value = uwT; // surface-from-below shading
          _uwFogTarget.set(params.uwFogColor);
          _uwFogTmp.copy(ABOVE_FOG_COLOR).lerp(_uwFogTarget, uwT);
          fog.color.copy(_uwFogTmp);
          fog.density = params.fogDensity * (1 - uwT) + params.uwFogDensity * uwT;
          uwOverlay.style.background = params.uwTint;
          uwOverlay.style.opacity = (uwT * params.uwTintMax).toFixed(3);
        }

        function applySky() {
          sky.turbidity.value = params.skyTurbidity;
          sky.rayleigh.value = params.skyRayleigh;
          sky.mieCoefficient.value = params.skyMie;
          sky.mieDirectionalG.value = params.skyMieG;
          const sunUnit = sunDirectionFromAngles(params.sunAzimuth, params.sunElevation);
          sky.sunPosition.value.copy(sunUnit);
          sunLight.position.copy(sunUnit).multiplyScalar(500);
          sunLight.target.position.set(0, 0, 0);
          scene.environmentIntensity = params.envIntensity;
          renderer.toneMappingExposure = params.exposure;
          fog.density = params.fogDensity;
          if (ocean) ocean.uniforms.sunDir.value.copy(sunUnit);
        }
        function bakeSkyEnv() {
          const prev = scene.environment;
          const s = new THREE.Scene();
          s.add(sky.clone());
          scene.environment = pmrem.fromScene(s, 0.04).texture;
          if (prev && prev.dispose) prev.dispose();
          if (ocean) ocean.setEnvMap(scene.environment);
        }

        // ── Mutable world state (rebuilt on preset / island / LOD changes) ────
        let terrainSize, RES, heightData, heightTex, terrainMesh, terrainMat;
        let ocean = null, clip = null, fftGpu = null, fftSim = null;
        let boatPhysics = null, boatRoot = null;

        // CPU FFT mirror — created lazily, only used to sample the surface for
        // boat buoyancy. The visual ocean is driven by the GPU sim (fftGpu).
        function ensureCpuFft() {
          if (fftSim) return fftSim;
          fftSim = createOceanFFTSimulation({
            seed: params.seed,
            windAngleDeg: params.windAngleDeg,
            ...OCEAN_FFT_DEFAULTS,
          });
          fftSim.syncParams(params);
          return fftSim;
        }

        function sampleTerrainY(x, z) {
          const half = terrainSize * 0.5;
          const tu = (x + half) / terrainSize;
          const tv = (z + half) / terrainSize;
          if (tu < 0 || tu > 1 || tv < 0 || tv > 1) return -9999;
          return sampleHeightBilinear(heightData, RES, tu, tv);
        }

        function shoreMaskAt(x, z) {
          if (!params.shoreDampEnabled) return 1;
          const depth = SEA_LEVEL - sampleTerrainY(x, z);
          const wet = smoothstepJs(-params.shoreLandMargin, params.shoreLandMargin, depth);
          const deep = smoothstepJs(params.shoreDampStart, params.shoreDampEnd, depth);
          return wet * deep;
        }

        function oceanSurfaceQuery(x, z) {
          return sampleOceanSurface(fftSim, x, z, {
            seaY: SEA_LEVEL,
            fftEnabled: params.fftEnabled,
            swellAmp: params.fftSwellAmp,
            rippleAmp: params.fftRippleAmp,
            normalStrength: params.fftNormalStrength,
            shoreMask: shoreMaskAt(x, z),
            shoreVertKeep: params.shoreVertKeep,
          });
        }

        function findBoatSpawn() {
          const minDepth = params.shoreDampEnd + 3;
          for (let r = 0; r < terrainSize * 0.45; r += 35) {
            for (let a = 0; a < 12; a++) {
              const x = Math.cos((a / 12) * Math.PI * 2) * r;
              const z = Math.sin((a / 12) * Math.PI * 2) * r;
              if (SEA_LEVEL - sampleTerrainY(x, z) >= minDepth) {
                return { x, z, yaw: Math.atan2(x, z) + Math.PI };
              }
            }
          }
          return { x: 120, z: -80, yaw: 0.4 };
        }

        function buildBoatMesh() {
          const g = new THREE.Group();
          const hull = new THREE.Mesh(
            new THREE.BoxGeometry(DEFAULT_BOAT_HULL.length, DEFAULT_BOAT_HULL.height * 0.35, DEFAULT_BOAT_HULL.width),
            new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.82, metalness: 0.05 }),
          );
          hull.position.y = DEFAULT_BOAT_HULL.height * 0.08 + DEFAULT_BOAT_HULL.visualLift;
          g.add(hull);
          const cabin = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.55, 1.4),
            new THREE.MeshStandardMaterial({ color: 0xd8dce8, roughness: 0.75, metalness: 0.1 }),
          );
          cabin.position.set(-0.4, 0.55 + DEFAULT_BOAT_HULL.visualLift, 0);
          g.add(cabin);
          const mast = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.06, 2.8, 8),
            new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.9 }),
          );
          mast.position.set(0.8, 1.5 + DEFAULT_BOAT_HULL.visualLift, 0);
          g.add(mast);
          return g;
        }

        function syncBoatCameraMode() {
          controls.enabled = !params.boatFollowCam;
          if (boatCamBadge) {
            boatCamBadge.textContent = params.boatFollowCam ? "chase cam" : "orbit cam";
          }
          if (params.boatFollowCam && boatPhysics) {
            snapChaseCamera(1);
          }
        }

        function toggleBoatCamera() {
          params.boatFollowCam = !params.boatFollowCam;
          syncBoatCameraMode();
          pane.refresh();
        }

        /** Yaw-only heading from body quaternion (stable chase cam). */
        function boatYawFromQuat(q) {
          const siny = 2 * (q.w * q.y + q.z * q.x);
          const cosy = 1 - 2 * (q.y * q.y + q.x * q.x);
          return Math.atan2(siny, cosy);
        }

        const _camOffset = new THREE.Vector3();
        const _camDesired = new THREE.Vector3();
        const _camLookAt = new THREE.Vector3();
        const _yawQuat = new THREE.Quaternion();

        function snapChaseCamera(alpha = 1) {
          if (!boatPhysics) return;
          const yaw = boatYawFromQuat(boatPhysics.body.quat);
          _yawQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
          _camOffset.set(0, params.boatCamHeight, -params.boatCamDistance).applyQuaternion(_yawQuat);
          _camDesired.copy(boatPhysics.body.pos).add(_camOffset);
          _camLookAt.copy(boatPhysics.body.pos).setY(boatPhysics.body.pos.y + params.boatCamLookY);
          if (alpha >= 1) {
            camera.position.copy(_camDesired);
            controls.target.copy(_camLookAt);
          } else {
            camera.position.lerp(_camDesired, alpha);
            controls.target.lerp(_camLookAt, alpha);
          }
          camera.lookAt(_camLookAt);
        }

        function updateBoatCamera(dt) {
          if (!boatPhysics || !params.boatFollowCam) return;
          const yaw = boatYawFromQuat(boatPhysics.body.quat);
          _yawQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
          _camOffset.set(0, params.boatCamHeight, -params.boatCamDistance).applyQuaternion(_yawQuat);
          _camDesired.copy(boatPhysics.body.pos).add(_camOffset);
          _camLookAt.copy(boatPhysics.body.pos).setY(boatPhysics.body.pos.y + params.boatCamLookY);
          const k = 1 - Math.exp(-params.boatCamLerp * dt);
          camera.position.lerp(_camDesired, k);
          controls.target.lerp(_camLookAt, k);
          camera.lookAt(_camLookAt);
        }

        function spawnBoat() {
          if (!params.boatEnabled) return;
          ensureCpuFft();
          boatUi.hidden = false;
          if (!boatPhysics) {
            boatPhysics = new OceanBoatPhysics({
              hull: { mass: params.boatMass },
              buoyT: { thrustForce: params.boatThrust, topSpeed: params.boatTopSpeed },
            });
          } else {
            boatPhysics.hull.mass = params.boatMass;
            boatPhysics.body.rebuildInertia({ mass: params.boatMass, size: boatPhysics.hull });
            boatPhysics.buoyT.thrustForce = params.boatThrust;
            boatPhysics.buoyT.topSpeed = params.boatTopSpeed;
          }
          if (!boatRoot) {
            boatRoot = buildBoatMesh();
            scene.add(boatRoot);
          }
          const sp = findBoatSpawn();
          const surf = oceanSurfaceQuery(sp.x, sp.z);
          boatPhysics.reset(sp.x, surf.y + 0.6, sp.z, sp.yaw);
          boatPhysics.syncMesh(boatRoot);
          syncBoatCameraMode();
        }

        function syncOceanParams() {
          if (!ocean) return;
          ocean.syncParams(params);
          if (fftGpu) fftGpu.syncParams(params);
          if (fftSim) fftSim.syncParams(params);
        }

        function disposeOcean() {
          if (!clip) return;
          for (const m of clip.meshes) m.geometry.dispose();
          scene.remove(clip.group);
          clip = null;
        }
        function buildClip() {
          disposeOcean();
          clip = buildClipmapOcean({
            levels: params.levels, gridM: params.gridM, baseCell: params.baseCell,
            horizonScale: params.horizonScale, material: ocean.material,
          });
          applyDebugMode();
          scene.add(clip.group);
        }
        function applyDebugMode() {
          if (!clip) return;
          for (let k = 0; k < clip.meshes.length; k++) {
            const m = clip.meshes[k];
            if (params.lodColor) m.material = clip.debugMats[k];
            else { m.material = ocean.material; ocean.material.wireframe = params.wireframe; }
          }
        }

        function rebuildHeightData() {
          heightData = buildIslandHeightData(params, RES, terrainSize);
        }
        function rebuildTerrainMesh() {
          if (terrainMesh) { terrainMesh.geometry.dispose(); scene.remove(terrainMesh); }
          const geo = buildTerrainGeo(heightData, RES, terrainSize, params.terrainSeg);
          terrainMesh = new THREE.Mesh(geo, terrainMat);
          scene.add(terrainMesh);
        }
        function refreshHeightTex() {
          heightTex.image.data = heightData;
          heightTex.needsUpdate = true;
        }

        // Full (re)build when the preset / world size changes.
        function rebuildWorld() {
          const preset = MAP_PRESETS[params.preset];
          terrainSize = preset.size;
          RES = preset.res;
          rebuildHeightData();

          if (heightTex) heightTex.dispose();
          heightTex = new THREE.DataTexture(
            heightData, RES, RES, THREE.RedFormat, THREE.FloatType,
          );
          heightTex.magFilter = THREE.LinearFilter;
          heightTex.minFilter = THREE.LinearFilter;
          heightTex.wrapS = heightTex.wrapT = THREE.ClampToEdgeWrapping;
          heightTex.flipY = false;
          heightTex.needsUpdate = true;

          if (!terrainMat) {
            terrainMat = new THREE.MeshStandardNodeMaterial({
              roughness: params.terrainRoughness, metalness: 0,
              side: THREE.DoubleSide, // no see-through ("hollow") at sloped/cut edges
            });
            terrainMat.colorNode = tAttr("color", "vec3"); // vertex colours (sand→grass→rock)
            terrainMat.emissiveNode = buildCausticsNode();  // animated seabed caustics
          }
          rebuildTerrainMesh();

          if (!fftGpu) {
            fftGpu = createOceanFFTGPUSimulation({
              renderer,
              seed: params.seed,
              windAngleDeg: params.windAngleDeg,
              ...OCEAN_FFT_GPU_DEFAULTS,
            });
            fftGpu.update(0); // bake frame 0 so the surface isn't flat before the first tick
          }
          if (params.boatEnabled) ensureCpuFft();

          // Ocean shader is bound to terrainSize + FFT buffers, so recreate on world change.
          ocean = createOceanShader({
            heightTex, terrainSize, fft: fftGpu, envMap: scene.environment,
          });
          syncOceanParams();
          applySky();
          buildClip();

          controls.maxDistance = Math.max(2000, terrainSize * 4);
          if (params.boatEnabled) spawnBoat();
          else {
            boatUi.hidden = true;
            controls.enabled = true;
          }
        }

        bakeSkyEnv();
        rebuildWorld();
        syncUnderwater();

        // ── Tweakpane ─────────────────────────────────────────────────────────
        const pane = new Pane({ title: "Ocean Lab" });

        const fMap = pane.addFolder({ title: "Map" });
        fMap.addBinding(params, "preset", { options: Object.fromEntries(Object.keys(MAP_PRESETS).map((k) => [k, k])) })
          .on("change", () => rebuildWorld());
        fMap.addBinding({ seaLevel: "Y = 0 (fixed)" }, "seaLevel", { readonly: true });
        fMap.addBinding(params, "terrainSeg", { min: 64, max: 512, step: 8 })
          .on("change", rebuildTerrainMesh);

        const fLand = pane.addFolder({ title: "Land / Coast", expanded: true });
        const reLand = () => { rebuildHeightData(); refreshHeightTex(); rebuildTerrainMesh(); };
        fLand.addBinding(params, "seed", { min: 1, max: 99999, step: 1 }).on("change", reLand);
        fLand.addBinding(params, "continentFreq", { min: 0.6, max: 4, step: 0.05, label: "continent freq" }).on("change", reLand);
        fLand.addBinding(params, "landThreshold", { min: 0.2, max: 0.75, step: 0.01, label: "land amount" }).on("change", reLand);
        fLand.addBinding(params, "landSoftness", { min: 0.02, max: 0.25, step: 0.01, label: "coast softness" }).on("change", reLand);
        fLand.addBinding(params, "hillAmp", { min: 4, max: 80, step: 1, label: "hills" }).on("change", reLand);
        fLand.addBinding(params, "mountainHeight", { min: 20, max: 200, step: 1, label: "peaks" }).on("change", reLand);
        fLand.addBinding(params, "ridgeFreq", { min: 0.8, max: 6, step: 0.05 }).on("change", reLand);
        fLand.addBinding(params, "ridgeStrength", { min: 0, max: 1.5, step: 0.02, label: "ridge mix" }).on("change", reLand);
        fLand.addBinding(params, "islandCount", { min: 0, max: 8, step: 1, label: "extra land blobs" }).on("change", reLand);
        fLand.addBinding(params, "islandHeight", { min: 8, max: 160, step: 1, label: "blob height" }).on("change", reLand);
        fLand.addBinding(params, "islandRadiusFrac", { min: 0.08, max: 0.45, step: 0.01, label: "blob size" }).on("change", reLand);
        fLand.addBinding(params, "islandSharp", { min: 0.4, max: 4, step: 0.05 }).on("change", reLand);
        fLand.addBinding(params, "seabedDepth", { min: 4, max: 120, step: 1 }).on("change", reLand);
        fLand.addBinding(params, "seabedRough", { min: 0, max: 40, step: 0.5 }).on("change", reLand);
        fLand.addBinding(params, "seabedFreq", { min: 0.5, max: 12, step: 0.1 }).on("change", reLand);
        fLand.addBinding(params, "coastFreq", { min: 0.5, max: 16, step: 0.1 }).on("change", reLand);
        fLand.addBinding(params, "detailFreq", { min: 2, max: 40, step: 0.5 }).on("change", reLand);
        fLand.addBinding(params, "detailAmp", { min: 0, max: 16, step: 0.1 }).on("change", reLand);
        fLand.addBinding(params, "edgeFalloff", { min: 0, max: 0.4, step: 0.01, label: "edge → sea" }).on("change", reLand);

        const fLod = pane.addFolder({ title: "LOD / Perf" });
        fLod.addBinding(params, "levels", { min: 2, max: 10, step: 1 }).on("change", buildClip);
        fLod.addBinding(params, "gridM", { min: 16, max: 128, step: 8 }).on("change", buildClip);
        fLod.addBinding(params, "baseCell", { min: 0.5, max: 8, step: 0.5 }).on("change", buildClip);
        fLod.addBinding(params, "horizonScale", { min: 1, max: 20, step: 0.5 }).on("change", buildClip);
        fLod.addBinding(params, "wireframe").on("change", applyDebugMode);
        fLod.addBinding(params, "lodColor", { label: "LOD colours" }).on("change", applyDebugMode);

        const sync = () => syncOceanParams();

        const fShore = pane.addFolder({ title: "Shore / Surf", expanded: true });
        fShore.addBinding(params, "shoreDampEnabled", { label: "wave damp" }).on("change", sync);
        fShore.addBinding(params, "shoreDampStart", { min: 0, max: 8, step: 0.1, label: "damp start (m)" }).on("change", sync);
        fShore.addBinding(params, "shoreDampEnd", { min: 2, max: 40, step: 0.5, label: "full waves (m)" }).on("change", sync);
        fShore.addBinding(params, "shoreLandMargin", { min: 0.1, max: 2, step: 0.05, label: "waterline soft (m)" }).on("change", sync);
        fShore.addBinding(params, "shoreVertKeep", { min: 0, max: 1, step: 0.02, label: "vertical keep" }).on("change", sync);
        fShore.addBinding(params, "shoreSurfFoamBoost", { min: 1, max: 3, step: 0.05, label: "surf foam ×" }).on("change", sync);
        fShore.addBinding(params, "shoreSurfWidth", { min: 1, max: 12, step: 0.25, label: "surf zone (m)" }).on("change", sync);
        fShore.addBinding(params, "shoreReflDamp", { min: 0, max: 1, step: 0.02, label: "shallow refl" }).on("change", sync);
        fShore.addBinding(params, "shoreWhitecapDamp", { label: "damp whitecaps" }).on("change", sync);

        const fFFT = pane.addFolder({ title: "FFT Ocean (JONSWAP)" });
        fFFT.addBinding(params, "fftEnabled").on("change", sync);
        fFFT.addBinding(params, "windSpeed", { min: 4, max: 32, step: 0.5 }).on("change", sync);
        fFFT.addBinding(params, "jonswapGamma", { min: 1, max: 7, step: 0.1 }).on("change", sync);
        fFFT.addBinding(params, "windSpreadPow", { min: 2, max: 16, step: 1 }).on("change", sync);
        fFFT.addBinding(params, "fftSwellAmp", { min: 0, max: 2.5, step: 0.05 }).on("change", sync);
        fFFT.addBinding(params, "fftRippleAmp", { min: 0, max: 1.5, step: 0.05 }).on("change", sync);
        fFFT.addBinding(params, "fftChoppiness", { min: 0.2, max: 2.5, step: 0.05 }).on("change", sync);
        fFFT.addBinding(params, "fftNormalStrength", { min: 0, max: 2.5, step: 0.05 }).on("change", sync);
        fFFT.addBinding(params, "fftSeed", { min: 1, max: 99999, step: 1 }).on("change", sync);
        fFFT.addBinding(params, "fftUpdateHz", { min: 5, max: 60, step: 5, label: "sim rate (hz)" });

        const fWhite = pane.addFolder({ title: "Whitecaps (Worley)", expanded: false });
        fWhite.addBinding(params, "whitecapEnabled").on("change", sync);
        fWhite.addBinding(params, "whitecapIntensity", { min: 0, max: 2, step: 0.05, label: "intensity" }).on("change", sync);
        fWhite.addBinding(params, "whitecapThreshold", { min: 0.1, max: 1.2, step: 0.02, label: "break threshold" }).on("change", sync);
        fWhite.addBinding(params, "whitecapSoftness", { min: 0.02, max: 0.6, step: 0.02, label: "break soft" }).on("change", sync);
        fWhite.addBinding(params, "whitecapNoiseScale", { min: 0.05, max: 1.2, step: 0.01, label: "cell scale" }).on("change", sync);
        fWhite.addBinding(params, "whitecapNoiseSpeed", { min: 0, max: 0.5, step: 0.01, label: "drift speed" }).on("change", sync);
        fWhite.addBinding(params, "whitecapWarpStrength", { min: 0, max: 1.5, step: 0.02, label: "warp" }).on("change", sync);
        fWhite.addBinding(params, "whitecapWarpScale", { min: 0.05, max: 0.8, step: 0.01, label: "warp scale" }).on("change", sync);
        fWhite.addBinding(params, "whitecapContrast", { min: 0.4, max: 3, step: 0.05, label: "contrast" }).on("change", sync);
        fWhite.addBinding(params, "whitecapProcThreshold", { min: 0, max: 0.8, step: 0.02, label: "cell threshold" }).on("change", sync);
        fWhite.addBinding(params, "whitecapProcSoftness", { min: 0.02, max: 0.5, step: 0.02, label: "cell soft" }).on("change", sync);
        fWhite.addBinding(params, "whitecapBrightness", { min: 0.5, max: 2, step: 0.05, label: "brightness" }).on("change", sync);

        const fSSS = pane.addFolder({ title: "Subsurface (SSS)", expanded: false });
        fSSS.addBinding(params, "sssEnabled").on("change", sync);
        fSSS.addBinding(params, "sssIntensity", { min: 0, max: 1.5, step: 0.02 }).on("change", sync);
        fSSS.addBinding(params, "sssColor").on("change", sync);

        const fWave = pane.addFolder({ title: "Gerstner overlay" });
        fWave.addBinding(params, "waveEnabled").on("change", sync);
        fWave.addBinding(params, "gerstnerBlend", { min: 0, max: 1, step: 0.02 }).on("change", sync);
        fWave.addBinding(params, "waveAmp", { min: 0, max: 4, step: 0.01 }).on("change", sync);
        fWave.addBinding(params, "waveLength", { min: 4, max: 200, step: 1 }).on("change", sync);
        fWave.addBinding(params, "waveSteep", { min: 0, max: 1, step: 0.01 }).on("change", sync);
        fWave.addBinding(params, "waveSpeed", { min: 0, max: 3, step: 0.01 }).on("change", sync);
        fWave.addBinding(params, "windAngleDeg", { min: 0, max: 360, step: 1 }).on("change", sync);
        fWave.addBinding(params, "windSpreadDeg", { min: 0, max: 120, step: 1 }).on("change", sync);
        fWave.addBinding(params, "waveAmpFalloff", { min: 0.4, max: 0.98, step: 0.01 }).on("change", sync);
        fWave.addBinding(params, "waveLenFalloff", { min: 0.4, max: 0.98, step: 0.01 }).on("change", sync);
        fWave.addBinding(params, "waveNormalStrength", { min: 0, max: 3, step: 0.01 }).on("change", sync);
        fWave.addBinding(params, "dispFadeStart", { min: 10, max: 1000, step: 5 }).on("change", sync);
        fWave.addBinding(params, "dispFadeEnd", { min: 20, max: 2000, step: 5 }).on("change", sync);

        const fCol = pane.addFolder({ title: "Colour / Depth", expanded: false });
        fCol.addBinding(params, "shoreColor").on("change", sync);
        fCol.addBinding(params, "midColor").on("change", sync);
        fCol.addBinding(params, "deepColor").on("change", sync);
        fCol.addBinding(params, "highlightColor").on("change", sync);
        fCol.addBinding(params, "depthAbsorb", { min: 0.01, max: 1, step: 0.01 }).on("change", sync);
        fCol.addBinding(params, "depthRampShoreMid", { min: 0, max: 1, step: 0.01 }).on("change", sync);
        fCol.addBinding(params, "depthRampMidDeep", { min: 0, max: 1, step: 0.01 }).on("change", sync);
        fCol.addBinding(params, "openOceanDepth", { min: 1, max: 200, step: 1 }).on("change", sync);
        fCol.addBinding(params, "opacity", { min: 0, max: 1, step: 0.01 }).on("change", sync);

        const fSurf = pane.addFolder({ title: "Surface / Fresnel", expanded: false });
        fSurf.addBinding(params, "surfNoiseScale1", { min: 0.01, max: 0.5, step: 0.005 }).on("change", sync);
        fSurf.addBinding(params, "surfNoiseScale2", { min: 0.01, max: 0.5, step: 0.005 }).on("change", sync);
        fSurf.addBinding(params, "surfNoiseSpeed1", { min: -1, max: 1, step: 0.01 }).on("change", sync);
        fSurf.addBinding(params, "surfNoiseSpeed2", { min: -1, max: 1, step: 0.01 }).on("change", sync);
        fSurf.addBinding(params, "surfNormalStrength", { min: 0, max: 1.5, step: 0.01 }).on("change", sync);

        const fGlint = pane.addFolder({ title: "Sun glint", expanded: false });
        fGlint.addBinding(params, "glintColor").on("change", sync);
        fGlint.addBinding(params, "glintIntensity", { min: 0, max: 3, step: 0.01 }).on("change", sync);
        fGlint.addBinding(params, "glintPower", { min: 4, max: 600, step: 1 }).on("change", sync);

        const fFoam = pane.addFolder({ title: "Coastal foam", expanded: false });
        fFoam.addBinding(params, "foamEnabled").on("change", sync);
        fFoam.addBinding(params, "foamColor").on("change", sync);
        fFoam.addBinding(params, "foamBandWidth", { min: 0.2, max: 20, step: 0.1 }).on("change", sync);
        fFoam.addBinding(params, "foamIntensity", { min: 0, max: 4, step: 0.05 }).on("change", sync);
        fFoam.addBinding(params, "foamSharpness", { min: 0.2, max: 4, step: 0.05 }).on("change", sync);
        fFoam.addBinding(params, "foamNoiseAmt", { min: 0, max: 1, step: 0.01 }).on("change", sync);
        fFoam.addBinding(params, "foamNoiseScale", { min: 0.02, max: 1, step: 0.01, label: "cell scale" }).on("change", sync);
        fFoam.addBinding(params, "foamNoiseSpeed", { min: 0, max: 0.5, step: 0.01, label: "drift speed" }).on("change", sync);
        fFoam.addBinding(params, "foamWarpStrength", { min: 0, max: 1.5, step: 0.02, label: "warp" }).on("change", sync);
        fFoam.addBinding(params, "foamWarpScale", { min: 0.05, max: 0.8, step: 0.01, label: "warp scale" }).on("change", sync);
        fFoam.addBinding(params, "foamContrast", { min: 0.4, max: 3, step: 0.05 }).on("change", sync);
        fFoam.addBinding(params, "foamCutoff", { min: 0, max: 0.8, step: 0.02, label: "cell threshold" }).on("change", sync);
        fFoam.addBinding(params, "foamTransitionWidth", { min: 0.02, max: 0.5, step: 0.02, label: "cell soft" }).on("change", sync);
        fFoam.addBinding(params, "foamBreatheAmp", { min: 0, max: 4, step: 0.05 }).on("change", sync);
        fFoam.addBinding(params, "foamBreatheHz", { min: 0, max: 2, step: 0.01 }).on("change", sync);

        const fSky = pane.addFolder({ title: "Sky / Light", expanded: false });
        fSky.addBinding(params, "exposure", { min: 0.1, max: 2, step: 0.01 }).on("change", applySky);
        fSky.addBinding(params, "sunAzimuth", { min: 0, max: 360, step: 1 }).on("change", applySky);
        fSky.addBinding(params, "sunElevation", { min: 1, max: 90, step: 1 }).on("change", applySky);
        fSky.addBinding(params, "envIntensity", { min: 0, max: 2, step: 0.05, label: "terrain env" }).on("change", applySky);
        fSky.addBinding(params, "fogDensity", { min: 0, max: 0.01, step: 0.0001 }).on("change", applySky);
        fSky.addBinding(params, "horizonFadeEnabled", { label: "horizon fade" }).on("change", sync);
        fSky.addBinding(params, "horizonUseSky", { label: "match sky" }).on("change", sync);
        fSky.addBinding(params, "horizonColor", { label: "horizon col" }).on("change", sync);
        fSky.addBinding(params, "horizonFadeStart", { min: 200, max: 8000, step: 50, label: "fade start" }).on("change", sync);
        fSky.addBinding(params, "horizonFadeEnd", { min: 1000, max: 20000, step: 100, label: "fade end" }).on("change", sync);
        fSky.addButton({ title: "Bake sky env" }).on("click", () => { applySky(); bakeSkyEnv(); });

        const fRefl = pane.addFolder({ title: "Reflections (sky PMREM)" });
        fRefl.addBinding(params, "envReflectEnabled").on("change", sync);
        fRefl.addBinding(params, "envReflectIntensity", { min: 0, max: 2.5, step: 0.05, label: "intensity" }).on("change", sync);
        fRefl.addBinding(params, "envRoughnessCalm", { min: 0, max: 0.5, step: 0.01, label: "roughness calm" }).on("change", sync);
        fRefl.addBinding(params, "envRoughnessRipple", { min: 0, max: 0.8, step: 0.01, label: "roughness choppy" }).on("change", sync);
        fRefl.addBinding(params, "fresnelExp", { min: 0.5, max: 10, step: 0.1, label: "fresnel power" }).on("change", sync);
        fRefl.addBinding(params, "fresnelMax", { min: 0.2, max: 1, step: 0.02, label: "fresnel max" }).on("change", sync);
        fRefl.addBinding(params, "fresnelSky", { min: 0, max: 0.6, step: 0.02, label: "sky tint (fallback)" }).on("change", sync);

        const fUW = pane.addFolder({ title: "Underwater", expanded: false });
        fUW.addBinding(params, "uwEyeOffset", { min: -2, max: 2, step: 0.05, label: "eye offset" });
        fUW.addBinding(params, "uwTransitionSpeed", { min: 1, max: 14, step: 0.5, label: "transition" });
        fUW.addBinding(params, "uwFogColor", { label: "fog colour" });
        fUW.addBinding(params, "uwFogDensity", { min: 0, max: 0.15, step: 0.002, label: "fog density" });
        fUW.addBinding(params, "uwTint", { label: "tint" });
        fUW.addBinding(params, "uwTintMax", { min: 0, max: 1, step: 0.02, label: "tint max" });
        fUW.addBinding(params, "causticsEnabled", { label: "caustics" }).on("change", syncUnderwater);
        fUW.addBinding(params, "causticScale", { min: 0.02, max: 0.6, step: 0.01, label: "caust scale" }).on("change", syncUnderwater);
        fUW.addBinding(params, "causticSpeed", { min: 0, max: 2, step: 0.05, label: "caust speed" }).on("change", syncUnderwater);
        fUW.addBinding(params, "causticIntensity", { min: 0, max: 3, step: 0.05, label: "caust intensity" }).on("change", syncUnderwater);
        fUW.addBinding(params, "causticSharp", { min: 1, max: 8, step: 0.1, label: "caust sharp" }).on("change", syncUnderwater);
        fUW.addBinding(params, "causticColor", { label: "caust colour" }).on("change", syncUnderwater);
        fUW.addBinding(params, "snellCritCos", { min: 0.3, max: 0.95, step: 0.01, label: "snell window" }).on("change", sync);
        fUW.addBinding(params, "snellSoft", { min: 0.02, max: 0.4, step: 0.01, label: "snell soft" }).on("change", sync);
        fUW.addBinding(params, "underwaterSkyBoost", { min: 0.2, max: 3, step: 0.05, label: "sky boost" }).on("change", sync);
        fUW.addBinding(params, "underwaterMurk", { min: 0, max: 1.5, step: 0.02, label: "murk (TIR)" }).on("change", sync);

        pane.addButton({ title: "Export params JSON" }).on("click", () => {
          const blob = new Blob([JSON.stringify(params, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.download = "ocean-params.json";
          a.href = URL.createObjectURL(blob);
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 100);
        });

        const fBoat = pane.addFolder({ title: "Boat (VVV buoyancy)", expanded: true });
        fBoat.addBinding(params, "boatEnabled", { label: "enabled" }).on("change", () => {
          if (params.boatEnabled) spawnBoat();
          else {
            boatUi.hidden = true;
            controls.enabled = true;
            if (boatRoot) boatRoot.visible = false;
          }
        });
        fBoat.addBinding(params, "boatFollowCam", { label: "chase camera" })
          .on("change", syncBoatCameraMode);
        fBoat.addBinding(params, "boatCamDistance", { min: 6, max: 40, step: 0.5, label: "cam distance" });
        fBoat.addBinding(params, "boatCamHeight", { min: 2, max: 20, step: 0.5, label: "cam height" });
        fBoat.addBinding(params, "boatCamLookY", { min: 0.2, max: 4, step: 0.1, label: "look height" });
        fBoat.addBinding(params, "boatCamLerp", { min: 1, max: 14, step: 0.5, label: "cam smooth" });
        fBoat.addBinding(params, "boatMass", { min: 200, max: 4000, step: 50 }).on("change", () => {
          if (boatPhysics) {
            boatPhysics.hull.mass = params.boatMass;
            boatPhysics.body.rebuildInertia({ mass: params.boatMass, size: boatPhysics.hull });
          }
        });
        fBoat.addBinding(params, "boatThrust", { min: 2000, max: 40000, step: 500 }).on("change", () => {
          if (boatPhysics) boatPhysics.buoyT.thrustForce = params.boatThrust;
        });
        fBoat.addBinding(params, "boatTopSpeed", { min: 4, max: 30, step: 0.5 }).on("change", () => {
          if (boatPhysics) boatPhysics.buoyT.topSpeed = params.boatTopSpeed;
        });
        fBoat.addButton({ title: "Respawn boat" }).on("click", spawnBoat);

        const keys = {};
        window.addEventListener("keydown", (e) => {
          keys[e.code] = true;
          if (e.code === "KeyR" && boatPhysics) spawnBoat();
          if (e.code === "KeyC" || e.code === "Tab") {
            if (e.code === "Tab") e.preventDefault();
            if (params.boatEnabled) toggleBoatCamera();
          }
        });
        window.addEventListener("keyup", (e) => {
          keys[e.code] = false;
        });

        function readBoatInput() {
          const left = (keys.KeyA || keys.ArrowLeft) ? 1 : 0;
          const right = (keys.KeyD || keys.ArrowRight) ? 1 : 0;
          const fwd = (keys.KeyW || keys.ArrowUp) ? 1 : 0;
          const back = (keys.KeyS || keys.ArrowDown) ? 1 : 0;
          return {
            throttle: fwd - back,
            steer: left - right,
            boost: !!(keys.ShiftLeft || keys.ShiftRight),
            handbrake: !!keys.Space,
          };
        }

        // ── Resize ─────────────────────────────────────────────────────────────
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── Loop ─────────────────────────────────────────────────────────────
        let fftAccum = 0; // drives the throttled GPU FFT compute
        renderer.setAnimationLoop(() => {
          clock.update();
          const dt = Math.min(clock.getDelta(), 0.05);
          const elapsed = clock.getElapsed();

          // Recenter the clipmap on the camera, snapped to the finest 2-cell
          // grid so the rigid group never swims relative to the wave field.
          const step = clip.snapStep;
          const clipX = (params.boatFollowCam && boatPhysics)
            ? boatPhysics.body.pos.x
            : camera.position.x;
          const clipZ = (params.boatFollowCam && boatPhysics)
            ? boatPhysics.body.pos.z
            : camera.position.z;
          clip.group.position.set(
            Math.round(clipX / step) * step,
            SEA_LEVEL,
            Math.round(clipZ / step) * step,
          );
          ocean.uniforms.waterY.value = SEA_LEVEL;
          ocean.update(dt, elapsed, null);
          updateUnderwater(dt, elapsed);
          // GPU compute: time-evolve + IFFT the cascades, throttled to sim rate
          // (waves don't need 60 Hz; decouples the ~100 dispatches from render fps).
          if (params.fftEnabled) {
            fftAccum += dt;
            const interval = 1 / Math.max(1, params.fftUpdateHz);
            if (fftAccum >= interval) {
              fftAccum = Math.min(fftAccum - interval, interval); // clamp, no spiral
              fftGpu.update(elapsed);
            }
          }

          if (params.boatEnabled && boatPhysics && boatRoot) {
            boatRoot.visible = true;
            if (fftSim) fftSim.update(elapsed); // CPU mirror for buoyancy sampling
            const input = readBoatInput();
            boatPhysics.update(dt, {
              surfaceQuery: oceanSurfaceQuery,
              landQuery: sampleTerrainY,
              seaY: SEA_LEVEL,
              throttle: input.throttle,
              steer: input.steer,
              boost: input.boost,
              handbrake: input.handbrake,
            });
            boatPhysics.syncMesh(boatRoot);
            updateBoatCamera(dt);
          }

          if (controls.enabled) {
            if (boatPhysics) {
              controls.target.lerp(
                _camLookAt.copy(boatPhysics.body.pos).setY(boatPhysics.body.pos.y + params.boatCamLookY),
                1 - Math.exp(-8 * dt),
              );
            }
            controls.update();
          }

          renderer.render(scene, camera);
          stats.update();

          const boatLine = (params.boatEnabled && boatPhysics)
            ? `\nboat ${boatPhysics.body.vel.length().toFixed(1)} m/s  ·  ${params.boatFollowCam ? "chase" : "orbit"} cam`
            : "";
          hud.textContent =
            `map ${terrainSize}  ·  sea Y=0  ·  ocean tris ${(clip.triCount / 1000).toFixed(1)}k  ·  ` +
            `lvls ${params.levels}  grid ${params.gridM}  cell ${params.baseCell}\n` +
            `finest ${clip.finestExtent}u  ·  cam ${camera.position.x.toFixed(0)},` +
            `${camera.position.y.toFixed(0)},${camera.position.z.toFixed(0)}` +
            boatLine;
        });
      }

      init();
    </script>
  </body>
</html>
