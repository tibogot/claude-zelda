          return col;
        });

        // ── PROCEDURAL CLIFF SHADER — rocky grey-brown for steep slopes ──
        const cPARAMS = {
          brightness: 1.0,
          contrast: 1.2,
          baseColor: "#6b5e52",
          layer1: {
            enable: true,
            noiseType: "voronoi",
            color: "#3d3228",
            strength: 0.7,
            useFbm: false,
            octaves: 3,
            lacunarity: 2.0,
            gain: 0.5,
            scale: 0.03,
            offsetX: 5.3,
            offsetY: 9.7,
            invert: false,
            maskLow: 0.3,
            maskHigh: 0.65,
            maskSharpness: 1.4,
            voronoiJitter: 0.9,
          },
          layer2: {
            enable: true,
            noiseType: "perlin",
            color: "#9a8e80",
            strength: 0.35,
            useFbm: true,
            octaves: 3,
            lacunarity: 2.1,
            gain: 0.45,
            scale: 0.055,
            offsetX: 62.4,
            offsetY: 28.9,
            invert: false,
            maskLow: 0.5,
            maskHigh: 0.8,
            maskSharpness: 1.0,
            voronoiJitter: 0.7,
          },
        };
        const cBase = uniform(
          new THREE.Color(cPARAMS.baseColor).convertSRGBToLinear(),
        );
        const cContrast = uniform(cPARAMS.contrast, "float");
        const cBrightness = uniform(cPARAMS.brightness, "float");
        const cL1 = groundLayerUniforms(cPARAMS.layer1);
        const cL2 = groundLayerUniforms(cPARAMS.layer2);

        const cliffProc = Fn(() => {
          let col = cBase;
          col = mix(col, cL1.color, groundLayerMask(cL1));
          col = mix(col, cL2.color, groundLayerMask(cL2));
          col = clamp(
            col.sub(float(0.5)).mul(cContrast).add(float(0.5)).mul(cBrightness),
            0,
            1,
          );
          return col;
        });

        // ── PROCEDURAL PATH SHADER (warm yellow-brown earthy tones) ──────
        const pU = {
          s1: uniform(0.008),
          s2: uniform(0.04),
          s3: uniform(0.18),
          w1: uniform(0.55),
          w2: uniform(0.3),
          w3: uniform(0.15),
          contrast: uniform(1.6),
          bias: uniform(0.05),
          col0: uniform(toLinear("#3d2408")),
          col1: uniform(toLinear("#7a5228")),
          col2: uniform(toLinear("#b8874a")),
          stop1: uniform(0.35),
          stop2: uniform(0.72),
        };
        const pathProc = Fn(() => {
          const p = positionWorld.xz;
          const n1 = mx_noise_float(p.mul(pU.s1));
          const n2 = mx_noise_float(p.mul(pU.s2).add(vec2(41.3, 28.7)));
          const n3 = mx_noise_float(p.mul(pU.s3).add(vec2(73.5, 52.1)));
          const fbm = n1.mul(pU.w1).add(n2.mul(pU.w2)).add(n3.mul(pU.w3));
          const t = clamp(
            fbm.mul(pU.contrast).add(float(0.5).add(pU.bias)),
            0.0,
            1.0,
          );
          const c01 = mix(
            pU.col0,
            pU.col1,
            smoothstep(float(0.0), pU.stop1, t),
          );
          return mix(c01, pU.col2, smoothstep(pU.stop1, pU.stop2, t));
        });

        // ── TSL SPLAT MATERIAL ────────────────────────────────────────────
        const uTerrainHalf = float(TERRAIN_SIZE * 0.5);
        const uTerrainSize = float(TERRAIN_SIZE);
        const uSlopeStart = uniform(PARAMS.slopeStart); // flatness where cliff = 100%
        const uSlopeEnd = uniform(PARAMS.slopeEnd); // flatness where cliff = 0%
        const uDebugMode = uniform(0);
        const uRockCol = uniform(toLinear("#7a7870")); // kept for debug mode only

        const getSplatUV = () =>
          positionWorld.xz.add(uTerrainHalf).div(uTerrainSize);

        // Sample heightTex at ±1 texel to compute true 512-res slope via finite differences.
        // dh/dx and dh/dz give the gradient; steepness = length(gradient) relative to cell size.
        // flatness = 1/(1 + steepness) — 1.0 = perfectly flat, ~0 = near-vertical cliff.
        const uHeightTexStep = uniform(4.0 / HTEX_RES); // 4-texel step — straddles cliff shoulder
        const uHeightToWorld = uniform((4.0 * TERRAIN_SIZE) / HTEX_RES); // corresponding world distance
        const getHeightTexFlatness = () => {
          const uv = getSplatUV();
          const hR = texture(
            heightTex,
            uv.add(vec2(uHeightTexStep, float(0))),
          ).r;
          const hL = texture(
            heightTex,
            uv.add(vec2(uHeightTexStep.negate(), float(0))),
          ).r;
          const hU = texture(
            heightTex,
            uv.add(vec2(float(0), uHeightTexStep)),
          ).r;
          const hD = texture(
            heightTex,
            uv.add(vec2(float(0), uHeightTexStep.negate())),
          ).r;
          // Gradient in world units: heightTex stores raw height (not normalised)
          const dhdx = hR.sub(hL).div(uHeightToWorld.mul(float(2)));
          const dhdz = hU.sub(hD).div(uHeightToWorld.mul(float(2)));
          const steepness = dhdx.mul(dhdx).add(dhdz.mul(dhdz)).sqrt();
          // flatness: 1 = flat, approaches 0 for near-vertical
          return float(1).div(float(1).add(steepness));
        };
        const getSlopeMask = () =>
          smoothstep(uSlopeStart, uSlopeEnd, getHeightTexFlatness());
        const getHeightMask = () =>
          smoothstep(
            float(HEIGHT_SCALE * 0.65),
            float(HEIGHT_SCALE * 0.92),
            positionWorld.y,
          );
        const getWetMask = () =>
          smoothstep(float(0.0), float(-3.0), positionWorld.y);

        const splatMat = new MeshStandardNodeMaterial({
          roughness: 0.9,
          metalness: 0,
        });

        splatMat.colorNode = Fn(() => {
          const splat = texture(splatTex, getSplatUV());
          const terrain = groundProc();
          const path = pathProc();
          const wet = path.mul(float(0.55));
          // Debug: replace with flat colors to see zone masks
          const tCol = mix(terrain, vec3(0.3, 0.78, 0.2), uDebugMode);
          const pCol = mix(path, vec3(0.72, 0.48, 0.22), uDebugMode);
          const rCol = mix(cliffProc(), vec3(0.35, 0.34, 0.32), uDebugMode);
          const wCol = mix(wet, vec3(0.1, 0.08, 0.05), uDebugMode);
          // Auto layers first — fill unpainted areas
          let col = tCol;
          col = mix(rCol, col, getSlopeMask());
          col = mix(col, tCol.mul(float(0.65)), getHeightMask());
          col = mix(col, wCol, getWetMask());
          // Manual paint always wins on top
          col = mix(col, tCol, splat.r);
          col = mix(col, tCol.mul(float(1.1)), splat.g);
          col = mix(col, pCol, splat.b);
          col = mix(
            col,
            meadowProc(),
            texture(meadowDensityTex, getSplatUV()).r,
          );
          return col;
        })();
        terrain.material.dispose();
        terrain.material = splatMat;

        // ── SKY ──
        const sky = new SkyMesh();
        sky.scale.setScalar(10000);
        sky.material.fog = false;
        scene.add(sky);
        sky.turbidity.value = PARAMS.sky.turbidity;
        sky.rayleigh.value = PARAMS.sky.rayleigh;
        sky.mieCoefficient.value = PARAMS.sky.mie;
        sky.mieDirectionalG.value = PARAMS.sky.mieG;
        sky.cloudCoverage.value = PARAMS.sky.cloudCoverage;
        sky.cloudDensity.value = PARAMS.sky.cloudDensity;
        sky.cloudElevation.value = PARAMS.sky.cloudElevation;
        sky.sunPosition.value.copy(
          sunDirectionFromAngles(
            PARAMS.light.sunAzimuth,
            PARAMS.light.sunElevation,
          ),
        );

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const skyEnvScene = new THREE.Scene();
        skyEnvScene.add(sky.clone());
        scene.environment = pmremGenerator.fromScene(skyEnvScene, 0.04).texture;
        scene.environmentIntensity = PARAMS.light.envIntensity;
        renderer.toneMappingExposure = PARAMS.light.exposure;

        // ── WATER PLANE ──
        const waterGeo = new THREE.PlaneGeometry(
          TERRAIN_SIZE * 4,
          TERRAIN_SIZE * 4,
        );
        waterGeo.rotateX(-PI / 2);
        const waterMat = new MeshStandardNodeMaterial({
          transparent: true,
          depthWrite: false,
        });
        waterMat.opacityNode = float(0.82);
        waterMat.roughnessNode = float(0.15);
        waterMat.metalnessNode = float(0.0);
        waterMat.fog = false; // fog applied manually below after fog uniforms exist
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -0.5;
        water.renderOrder = 1;
        scene.add(water);

        // ── FOG (height + distance) ──
        const uFogColor = uniform(
          new THREE.Color(PARAMS.fog.color).convertSRGBToLinear(),
        );
        const uFogDensity = uniform(PARAMS.fog.density);
        const uFogHeight = uniform(PARAMS.fog.height);

        const _heightFogNode = fog(
          uFogColor,
          exponentialHeightFogFactor(uFogDensity, uFogHeight),
        );
        const _distanceFogNode = fog(uFogColor, densityFogFactor(uFogDensity));

        // Inject fog into water colorNode manually (transparent material needs this)
        const _waterBase = vec3(0.05, 0.28, 0.55);
        const _waterFogFactor = exponentialHeightFogFactor(
          uFogDensity,
          uFogHeight,
        );
        waterMat.colorNode = mix(_waterBase, uFogColor, _waterFogFactor);

        function syncFog() {
          uFogColor.value.set(PARAMS.fog.color).convertSRGBToLinear();
          uFogDensity.value = PARAMS.fog.density;
          uFogHeight.value = PARAMS.fog.height;
          if (!PARAMS.fog.enabled) {
            scene.fogNode = null;
            return;
          }
          scene.fogNode =
            PARAMS.fog.type === "height" ? _heightFogNode : _distanceFogNode;
        }
        syncFog();

        // ── WATER BODIES ──────────────────────────────────────────────────
        const WATER_PRESETS = {
          Puddle: { w: 3, l: 3 },
          "Small lake": { w: 20, l: 20 },
          "Large lake": { w: 60, l: 60 },
          "River strip": { w: 8, l: 50 },
        };

        const uWaterColor = uniform(
          new THREE.Color(PARAMS.water.color).convertSRGBToLinear(),
        );
        const uWaterOpacity = uniform(PARAMS.water.opacity);
        const uWaterRoughness = uniform(PARAMS.water.roughness);

        const waterBodyMat = new MeshStandardNodeMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        waterBodyMat.colorNode = uWaterColor;
        waterBodyMat.opacityNode = uWaterOpacity;
        waterBodyMat.roughnessNode = uWaterRoughness;
        waterBodyMat.metalnessNode = float(0.0);
        waterBodyMat.fog = false;

        function syncWaterMat() {
          uWaterColor.value.set(PARAMS.water.color).convertSRGBToLinear();
          uWaterOpacity.value = PARAMS.water.opacity;
          uWaterRoughness.value = PARAMS.water.roughness;
        }

        function getWaterRoot(object) {
          let obj = object;
          while (obj) {
            if (waterObjects.includes(obj)) return obj;
            obj = obj.parent;
          }
          return null;
        }

        function selectWater(mesh) {
          selectedWater = mesh;
          if (mesh) {
            tcHelper.visible = true;
            transformControls.attach(mesh);
          } else {
            tcHelper.visible = false;
            transformControls.detach();
          }
        }

        function placeWater(wx, wy, wz) {
          const preset =
            WATER_PRESETS[PARAMS.water.preset] ?? WATER_PRESETS["Small lake"];
          const geo = new THREE.PlaneGeometry(preset.w, preset.l);
          geo.rotateX(-Math.PI / 2);
          const mesh = new THREE.Mesh(geo, waterBodyMat);
          mesh.position.set(wx, wy + PARAMS.water.sinkOffset, wz);
          mesh.renderOrder = 2;
          scene.add(mesh);
          waterObjects.push(mesh);
          selectWater(mesh);
        }

        function applyWaterBodies(data) {
          waterObjects.forEach((m) => scene.remove(m));
          waterObjects = [];
          selectWater(null);
          data.forEach((d) => {
            const geo = new THREE.PlaneGeometry(1, 1);
            geo.rotateX(-Math.PI / 2);
            const mesh = new THREE.Mesh(geo, waterBodyMat);
            mesh.position.set(d.x, d.y, d.z);
            mesh.rotation.set(d.rx, d.ry, d.rz);
            mesh.scale.set(d.sx, d.sy, d.sz);
            mesh.renderOrder = 2;
            scene.add(mesh);
            waterObjects.push(mesh);
          });
        }

        function saveWaterBodies() {
          const data = waterObjects.map((m) => ({
            x: m.position.x,
            y: m.position.y,
            z: m.position.z,
            rx: m.rotation.x,
            ry: m.rotation.y,
            rz: m.rotation.z,
            sx: m.scale.x,
            sy: m.scale.y,
            sz: m.scale.z,
          }));
          const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.download = "water-bodies.json";
          a.href = URL.createObjectURL(blob);
          a.click();
        }

        // ── CLIFF TEMPLATES ──
        const gltfLoader = new GLTFLoader();
        const CLIFF_FALLBACK_COLORS = [0x8a7a6a, 0x6a5a4a, 0x7a6858];
        cliffTemplates = await Promise.all(
          CLIFF_MODELS.map(async (url, i) => {
            try {
              const gltf = await gltfLoader.loadAsync(url);
              gltf.scene.traverse((o) => {
                if (o.isMesh) {
                  o.castShadow = true;
                  o.receiveShadow = true;
                }
              });
              return gltf.scene;
            } catch {
              const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(10, 15, 8),
                new THREE.MeshStandardMaterial({
                  color: CLIFF_FALLBACK_COLORS[i],
                  roughness: 0.9,
                }),
              );
              mesh.castShadow = true;
              mesh.receiveShadow = true;
              const g = new THREE.Group();
              g.add(mesh);
              return g;
            }
          }),
        );

        // ── TREE SYSTEM ──
        treeSystem = createTreeSystem(scene, bvhHeight);
        gltfLoader
          .loadAsync("models/pine2.glb")
          .then((gltf) => {
            treeSystem.setModel(gltf);
          })
          .catch(() =>
            console.warn(
              "pine2.glb not found — trees mode active but no model loaded",
            ),
          );

        // ── TRANSFORM CONTROLS ──
        transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.addEventListener("dragging-changed", (e) => {
          orbit.enabled = e.value ? false : currentMode === "view";
        });
        transformControls.enabled = false;
        tcHelper = transformControls.getHelper();
        tcHelper.visible = false;
        scene.add(tcHelper);

        // ── CLIFF HELPERS ──
        function getCliffRoot(object) {
          let obj = object;
          while (obj) {
            if (cliffObjects.includes(obj)) return obj;
            obj = obj.parent;
          }
          return null;
        }

        function selectCliff(root) {
          selectedCliff = root;
          if (root) {
            tcHelper.visible = true;
            transformControls.attach(root);
          } else {
            tcHelper.visible = false;
            transformControls.detach();
          }
        }

        function placeCliff(wx, wy, wz, modelIndex) {
          const root = cliffTemplates[modelIndex].clone();
          root.position.set(wx, wy - cliffSinkOffset, wz);
          root.userData.modelIndex = modelIndex;
          root.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });
          scene.add(root);
          cliffObjects.push(root);
          selectCliff(root);
          if (bakeBVH) bakeBVH();
        }

        function applyCliffs(data) {
          cliffObjects.forEach((r) => scene.remove(r));
          cliffObjects = [];
          selectCliff(null);
          data.forEach((d) => {
            const idx = Math.max(
              0,
              Math.min(cliffTemplates.length - 1, d.modelIndex ?? 0),
            );
            const root = cliffTemplates[idx].clone();
            root.position.set(d.x, d.y, d.z);
            root.rotation.set(d.rx, d.ry, d.rz);
            root.scale.set(d.sx, d.sy, d.sz);
            root.userData.modelIndex = idx;
            root.traverse((o) => {
              if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
              }
            });
            scene.add(root);
            cliffObjects.push(root);
          });
          if (bakeBVH) bakeBVH();
        }

        function loadCliffs(file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              applyCliffs(JSON.parse(ev.target.result));
            } catch (err) {
              console.error("Failed to load cliffs.json", err);
            }
          };
          reader.readAsText(file);
        }

        // ── PROPS FUNCTIONS ──────────────────────────────────────────────

        function getPropRoot(object) {
          let obj = object;
          while (obj) {
            if (propObjects.includes(obj)) return obj;
            obj = obj.parent;
          }
          return null;
        }

        function selectProp(root) {
          selectedProp = root;
          if (root) {
            tcHelper.visible = true;
            transformControls.attach(root);
          } else {
            tcHelper.visible = false;
            transformControls.detach();
          }
        }

        function placeProp(wx, wy, wz) {
          if (activePropIndex < 0 || activePropIndex >= propLibrary.length)
            return;
          const root = propLibrary[activePropIndex].scene.clone();
          root.position.set(wx, wy + PARAMS.propSinkOffset, wz);
          root.userData.propName = propLibrary[activePropIndex].name;
          root.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });
          scene.add(root);
          propObjects.push(root);
          selectProp(root);
        }

        function saveProps() {
          const data = propObjects.map((root) => ({
            propName: root.userData.propName ?? "unknown",
            x: root.position.x,
            y: root.position.y,
            z: root.position.z,
            rx: root.rotation.x,
            ry: root.rotation.y,
            rz: root.rotation.z,
            sx: root.scale.x,
            sy: root.scale.y,
            sz: root.scale.z,
          }));
          const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.download = "props.json";
          a.href = URL.createObjectURL(blob);
          a.click();
        }

        function applyProps(data) {
          propObjects.forEach((r) => scene.remove(r));
          propObjects = [];
          selectProp(null);
          data.forEach((d) => {
            const entry = propLibrary.find((e) => e.name === d.propName);
            if (!entry) {
              console.warn(
                `Props: model "${d.propName}" not in library — import it first`,
              );
              return;
            }
            const root = entry.scene.clone();
            root.position.set(d.x, d.y, d.z);
            root.rotation.set(d.rx, d.ry, d.rz);
            root.scale.set(d.sx, d.sy, d.sz);
            root.userData.propName = d.propName;
            root.traverse((o) => {
              if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
              }
            });
            scene.add(root);
            propObjects.push(root);
          });
        }

        function loadPropsJson(file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              applyProps(JSON.parse(ev.target.result));
            } catch (err) {
              console.error("Failed to load props.json", err);
            }
          };
          reader.readAsText(file);
        }

        // ── SCENE SAVE / LOAD ─────────────────────────────────────────────
        function saveScene() {
          // Encode heightData as greyscale PNG (same format loadHeightmap reads)
          const hmC = document.createElement("canvas");
          hmC.width = hmC.height = VERTS;
          const hmCtx = hmC.getContext("2d");
          const imgData = hmCtx.createImageData(VERTS, VERTS);
          for (let i = 0; i < heightData.length; i++) {
            const v = Math.max(
              0,
              Math.min(
                255,
                Math.round(
                  ((heightData[i] + HEIGHT_SCALE) / (HEIGHT_SCALE * 2)) * 255,
                ),
              ),
            );
            imgData.data[i * 4 + 0] = v;
            imgData.data[i * 4 + 1] = v;
            imgData.data[i * 4 + 2] = v;
            imgData.data[i * 4 + 3] = 255;
          }
          hmCtx.putImageData(imgData, 0, 0);

          const data = {
            version: 1,
            heightmap: hmC.toDataURL("image/png"),
            splatmap: splatCanvas.toDataURL("image/png"),
            grassDensity: grassDensityCanvas.toDataURL("image/png"),
            meadow: meadowCanvas.toDataURL("image/png"),
            trees: treeSystem ? treeSystem.getPositions() : [],
            cliffs: cliffObjects.map((root) => ({
              modelIndex: root.userData.modelIndex ?? 0,
              x: root.position.x,
              y: root.position.y,
              z: root.position.z,
              rx: root.rotation.x,
              ry: root.rotation.y,
              rz: root.rotation.z,
              sx: root.scale.x,
              sy: root.scale.y,
              sz: root.scale.z,
            })),
            props: propObjects.map((root) => ({
              propName: root.userData.propName ?? "unknown",
              x: root.position.x,
              y: root.position.y,
              z: root.position.z,
              rx: root.rotation.x,
              ry: root.rotation.y,
              rz: root.rotation.z,
              sx: root.scale.x,
              sy: root.scale.y,
              sz: root.scale.z,
            })),
            waterBodies: waterObjects.map((m) => ({
              x: m.position.x,
              y: m.position.y,
              z: m.position.z,
              rx: m.rotation.x,
              ry: m.rotation.y,
              rz: m.rotation.z,
              sx: m.scale.x,
              sy: m.scale.y,
              sz: m.scale.z,
            })),
          };
          const blob = new Blob([JSON.stringify(data)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.download = "scene.json";
          a.href = URL.createObjectURL(blob);
          a.click();
        }

        function applyCanvasDataURL(dataURL, canvas, ctx, tex) {
          return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              if (tex) tex.needsUpdate = true;
              resolve();
            };
            img.src = dataURL;
          });
        }

        function loadScene(file) {
          const reader = new FileReader();
          reader.onload = async (ev) => {
            try {
              const data = JSON.parse(ev.target.result);

              // Heightmap
              if (data.heightmap) {
                await new Promise((resolve) => {
                  const img = new Image();
                  img.onload = () => {
                    const c = document.createElement("canvas");
                    c.width = c.height = VERTS;
                    const ctx2 = c.getContext("2d");
                    ctx2.drawImage(img, 0, 0, VERTS, VERTS);
                    const pixels = ctx2.getImageData(0, 0, VERTS, VERTS).data;
                    for (let i = 0; i < heightData.length; i++) {
                      heightData[i] =
                        (pixels[i * 4] / 255) * HEIGHT_SCALE * 2 - HEIGHT_SCALE;
                    }
                    syncGeometry();
                    if (bakeBVH) bakeBVH();
                    resolve();
                  };
                  img.src = data.heightmap;
                });
              }

              // Canvases
              if (data.splatmap)
                await applyCanvasDataURL(
                  data.splatmap,
                  splatCanvas,
                  splatCtx,
                  splatTex,
                );
              if (data.grassDensity)
                await applyCanvasDataURL(
                  data.grassDensity,
                  grassDensityCanvas,
                  grassDensityCtx,
                  grassDensityTex,
                );
              if (data.meadow)
                await applyCanvasDataURL(
                  data.meadow,
                  meadowCanvas,
                  meadowCtx,
                  meadowDensityTex,
                );

              // Trees
              if (data.trees && treeSystem) treeSystem.setPositions(data.trees);

              // Cliffs
              if (data.cliffs) applyCliffs(data.cliffs);

              // Props (models must already be in library)
              if (data.props) applyProps(data.props);
              if (data.waterBodies) applyWaterBodies(data.waterBodies);
            } catch (err) {
              console.error("Failed to load scene.json", err);
            }
          };
          reader.readAsText(file);
        }

        // ── BRUSH RING ──
        const brushRingGeo = new THREE.RingGeometry(1, 1.06, 48);
        brushRingGeo.rotateX(-PI / 2);
        const brushRing = new THREE.Mesh(
          brushRingGeo,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            side: THREE.DoubleSide,
            depthWrite: false,
            transparent: true,
            opacity: 0.9,
          }),
        );
        brushRing.visible = false;
        brushRing.renderOrder = 2;
        scene.add(brushRing);

        // ── PLAY MODE CAPSULE ──
        const capsuleGeo = new THREE.CapsuleGeometry(
          PLAYER_CAP_R,
          PLAYER_CAP_H,
          4,
          8,
        );
        const capsuleMat = new THREE.MeshStandardMaterial({
          color: 0xff6633,
          roughness: 0.7,
        });
        const capsuleMesh = new THREE.Mesh(capsuleGeo, capsuleMat);
        capsuleMesh.castShadow = true;
        capsuleMesh.visible = false;
        scene.add(capsuleMesh);

        function enterPlayMode() {
          savedCamPos = camera.position.clone();
          savedOrbitTarget = orbit.target.clone();
          // Spawn at orbit target, snapped to terrain
          playerPos.set(orbit.target.x, 0, orbit.target.z);
          playerPos.y = bvhHeight(playerPos.x, playerPos.z);
          camYaw = 0;
          camPitch = 0.35;
          capsuleMesh.visible = true;
          orbit.enabled = false;
          // Hide editor UI
          const tpEl = document.querySelector(".tp-dfwv");
          if (tpEl) tpEl.style.display = "none";
          document.getElementById("info").style.display = "none";
          document.getElementById("heightmap-preview").style.display = "none";
          document.getElementById("splatmap-preview").style.display = "none";
          document
            .querySelectorAll(".preview-label")
            .forEach((el) => (el.style.display = "none"));
          brushRing.visible = false;

        function getTerrainHit(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObject(terrain);
          return hits.length > 0 ? hits[0].point : null;
        }

          if (mode === "play") {

          propsFolder.hidden = mode !== "props";
          pathFolder.hidden  = mode !== "path";
          waterFolder.hidden = mode !== "water";
          brushFolder.hidden =
            mode === "view" ||
            mode === "place" ||
            mode === "props" ||
            mode === "water";

          const usingTC =
            mode === "place" || mode === "props" || mode === "water";

        // ── MOUSE ──

        renderer.domElement.addEventListener("mousemove", (e) => {
          if (

          const p = getTerrainHit(e);

        // ── RENDER LOOP ──
        const clock = new THREE.Timer();
        const _grassFrustum = new THREE.Frustum();
        const _grassProjMatrix = new THREE.Matrix4();
        renderer.setAnimationLoop(() => {
          clock.update();
          const elapsed = clock.getElapsed();
          const dt = clock.getDelta();

          // ── PLAY MODE UPDATE ──
          if (currentMode === "play") {
            // WASD movement relative to camera yaw
            let mx = 0,
              mz = 0;
            if (keysHeld["KeyW"] || keysHeld["ArrowUp"]) {
              mx -= Math.sin(camYaw);
              mz -= Math.cos(camYaw);
            }
            if (keysHeld["KeyS"] || keysHeld["ArrowDown"]) {
              mx += Math.sin(camYaw);
              mz += Math.cos(camYaw);
            }
            if (keysHeld["KeyA"] || keysHeld["ArrowLeft"]) {
              mx -= Math.cos(camYaw);
              mz += Math.sin(camYaw);
            }
            if (keysHeld["KeyD"] || keysHeld["ArrowRight"]) {
              mx += Math.cos(camYaw);
              mz -= Math.sin(camYaw);
            }
            const mlen = Math.sqrt(mx * mx + mz * mz);
            if (mlen > 0) {
              playerPos.x += (mx / mlen) * PLAYER_SPEED * dt;
              playerPos.z += (mz / mlen) * PLAYER_SPEED * dt;
              playerPos.x = Math.max(
                -TERRAIN_SIZE / 2,
                Math.min(TERRAIN_SIZE / 2, playerPos.x),
              );
              playerPos.z = Math.max(
                -TERRAIN_SIZE / 2,
                Math.min(TERRAIN_SIZE / 2, playerPos.z),
              );
            }
            // Snap Y to terrain (bvhHeight includes cliff surfaces)
            playerPos.y = bvhHeight(playerPos.x, playerPos.z);
            const capsuleCY = playerPos.y + PLAYER_CAP_R + PLAYER_CAP_H * 0.5;
            capsuleMesh.position.set(playerPos.x, capsuleCY, playerPos.z);
            // Face direction of movement
            if (mlen > 0) capsuleMesh.rotation.y = Math.atan2(mx, mz) + PI;
            // Third-person camera
            const lookAtY = capsuleCY + 0.6;
            const hDist = CAM_DIST * Math.cos(camPitch);
            const vDist = CAM_DIST * Math.sin(camPitch);
            camera.position.set(
              playerPos.x + Math.sin(camYaw) * hDist,
              lookAtY + vDist,
              playerPos.z + Math.cos(camYaw) * hDist,
            );
            camera.lookAt(playerPos.x, lookAtY, playerPos.z);
            // Feed player pos to grass interaction
            if (grassUniforms)
              grassUniforms.uPlayerPos.value.set(
                playerPos.x,
                playerPos.y,
                playerPos.z,
              );
          }

          if (grassUniforms) grassUniforms.uTime.value = elapsed;
          if (grassPatchSystem) {
            camera.updateMatrixWorld();
            _grassProjMatrix.multiplyMatrices(
              camera.projectionMatrix,
              camera.matrixWorldInverse,
            );
            _grassFrustum.setFromProjectionMatrix(_grassProjMatrix);
            grassPatchSystem.update(camera.position, _grassFrustum);
          }
          // Sync lighting & sky from PARAMS every frame
          const sunDir = sunDirectionFromAngles(
            PARAMS.light.sunAzimuth,
            PARAMS.light.sunElevation,
          );
          dirLight.position.copy(sunDir.clone().multiplyScalar(600));
          dirLight.color.set(PARAMS.light.dirColor);
          dirLight.intensity = PARAMS.light.dirIntensity;
          hemiLight.color.set(PARAMS.light.hemiSkyColor);
          hemiLight.groundColor.set(PARAMS.light.hemiGroundColor);
          hemiLight.intensity = PARAMS.light.hemiIntensity;
          sky.turbidity.value = PARAMS.sky.turbidity;
          sky.rayleigh.value = PARAMS.sky.rayleigh;
          sky.mieCoefficient.value = PARAMS.sky.mie;
          sky.mieDirectionalG.value = PARAMS.sky.mieG;
          sky.cloudCoverage.value = PARAMS.sky.cloudCoverage;
          sky.cloudDensity.value = PARAMS.sky.cloudDensity;
          sky.cloudElevation.value = PARAMS.sky.cloudElevation;
          sky.sunPosition.value.copy(sunDir);
          scene.environmentIntensity = PARAMS.light.envIntensity;
          renderer.toneMappingExposure = PARAMS.light.exposure;

          if (currentMode !== "play") orbit.update();
          stats.update();
          renderer.render(scene, camera);
        });
      }

      init();
    </script>
  </body>
</html>
