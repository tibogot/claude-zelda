let _lastHierarchySnapshot = '';

function gatherHierarchyItems(app) {
  const items = [...STATIC_ITEMS];

  // Water bodies
  for (let i = 0; i < app.waterStore.bodies.length; i++) {
    const b = app.waterStore.bodies[i];
    const style = b.userData.waterStyle || 'Water';
    items.push({ id: `water_${i}`, name: `${style} ${i}`, icon: 'waves', category: 'Water' });
  }

  // Waterfalls
  for (let i = 0; i < app.waterfallSystem.waterfallObjects.length; i++) {
    items.push({ id: `waterfall_${i}`, name: `Waterfall ${i}`, icon: 'droplets', category: 'Water' });
  }

  // Roads (simple)
  for (let i = 0; i < app.roadSystem.segments.length; i++) {
    items.push({ id: `road_${i}`, name: `Road ${i}`, icon: 'route', category: 'Roads' });
  }

  // Full roads
  if (app.fullRoadSystem.edges.length > 0) {
    items.push({ id: 'fullRoadNetwork', name: `Full Road (${app.fullRoadSystem.nodes.length}n ${app.fullRoadSystem.edges.length}e)`, icon: 'route', category: 'Roads' });
  }

  // Smart roads
  if (app.smartRoadSystem.edges.length > 0) {
    items.push({ id: 'smartRoadNetwork', name: `Smart Road (${app.smartRoadSystem.nodes.length}n ${app.smartRoadSystem.edges.length}e)`, icon: 'route', category: 'Roads' });
  }

  // Rivers
  for (let i = 0; i < app.riverSystem.segments.length; i++) {
    items.push({ id: `river_${i}`, name: `River ${i}`, icon: 'droplets', category: 'Rivers' });
  }

  // Spline points
  if (app.splineSystem.points.length > 0) {
    items.push({ id: 'splineSystem', name: `Spline (${app.splineSystem.points.length} pts)`, icon: 'spline', category: 'Splines' });
  }

  // Props (grouped by type)
  for (let i = 0; i < app.toolState.propSlots.length; i++) {
    const slot = app.toolState.propSlots[i];
    const count = app.propStore.instances.filter(inst => inst.typeIdx === i).length;
    if (count > 0) {
      items.push({ id: `propType_${i}`, name: `${slot.name} (${count})`, icon: 'box', category: 'Props' });
    }
  }

  // Decals
  if (app.decalSystem.decals.length > 0) {
    items.push({ id: 'decals', name: `Decals (${app.decalSystem.decals.length})`, icon: 'stamp', category: 'Decals' });
  }

  return items;
}

let _hierarchySearchTerm = '';
const _hierarchySearchInput = document.getElementById('hierarchySearch');
_hierarchySearchInput.addEventListener('input', () => {
  _hierarchySearchTerm = _hierarchySearchInput.value.toLowerCase();
  _lastHierarchySnapshot = '';
});

function _closeContextMenu() {
  document.querySelector('.ctx-menu')?.remove();
}
document.addEventListener('click', _closeContextMenu);
document.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('.tree-item')) _closeContextMenu();
});

function _showContextMenu(x, y, actions) {
  _closeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  for (const action of actions) {
    if (action === '---') {
      const sep = document.createElement('div');
      sep.className = 'ctx-menu-sep';
      menu.appendChild(sep);
      continue;
    }
    const btn = document.createElement('button');
    btn.className = 'ctx-menu-item' + (action.danger ? ' danger' : '') + (action.disabled ? ' disabled' : '');
    btn.innerHTML = `<i data-lucide="${action.icon}"></i>${action.label}`;
    btn.addEventListener('click', (e) => { e.stopPropagation(); _closeContextMenu(); action.onClick?.(); });
    menu.appendChild(btn);
  }
  const maxX = window.innerWidth - 180;
  const maxY = window.innerHeight - (actions.length * 32 + 20);
  menu.style.left = Math.min(x, maxX) + 'px';
  menu.style.top = Math.min(y, maxY) + 'px';
  document.body.appendChild(menu);
  lucide.createIcons({ nameAttr: 'data-lucide', attrs: {}, node: menu });
}

function _getContextActions(app, item) {
  const actions = [
    { label: 'Inspect', icon: 'scan-search', onClick: () => {
      _selectedItem = item.id;
      buildInspector(app, item.id);
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="inspector"]').classList.add('active');
      document.getElementById('tab-inspector').classList.add('active');
      _lastHierarchySnapshot = '';
    }},
  ];

  const waterMatch = item.id.match(/^water_(\d+)$/);
  const roadMatch = item.id.match(/^road_(\d+)$/);
  const riverMatch = item.id.match(/^river_(\d+)$/);
  const propMatch = item.id.match(/^propType_(\d+)$/);

  // Focus camera on object
  if (waterMatch) {
    const idx = parseInt(waterMatch[1]);
    actions.push({ label: 'Focus camera', icon: 'eye', onClick: () => {
      const b = app.waterStore.bodies[idx];
      if (b) { app.camera.position.set(b.position.x + 30, b.position.y + 20, b.position.z + 30); app.camera.lookAt(b.position); }
    }});
  }
  if (roadMatch) {
    const idx = parseInt(roadMatch[1]);
    actions.push({ label: 'Focus camera', icon: 'eye', onClick: () => {
      const seg = app.roadSystem.segments[idx];
      if (seg?.points.length > 0) {
        const mid = seg.points[Math.floor(seg.points.length / 2)];
        app.camera.position.set(mid.x + 30, mid.y + 40, mid.z + 30);
        app.camera.lookAt(mid);
      }
    }});
  }
  if (riverMatch) {
    const idx = parseInt(riverMatch[1]);
    actions.push({ label: 'Focus camera', icon: 'eye', onClick: () => {
      const seg = app.riverSystem.segments[idx];
      if (seg?.points.length > 0) {
        const mid = seg.points[Math.floor(seg.points.length / 2)];
        app.camera.position.set(mid.x + 30, mid.y + 40, mid.z + 30);
        app.camera.lookAt(mid);
      }
    }});
  }

  // Delete actions for dynamic items
  if (waterMatch || roadMatch || riverMatch || propMatch || item.id === 'decals') {
    actions.push('---');
    if (waterMatch) {
      const idx = parseInt(waterMatch[1]);
      actions.push({ label: 'Delete', icon: 'trash-2', danger: true, onClick: () => {
        const b = app.waterStore.bodies[idx];
        if (b) { app.waterStore.remove(b); _lastHierarchySnapshot = ''; }
      }});
    }
    if (item.id === 'decals') {
      actions.push({ label: 'Clear all decals', icon: 'trash-2', danger: true, onClick: () => {
        app.decalSystem.clearAll(); _lastHierarchySnapshot = '';
      }});
    }
    if (propMatch) {
      const typeIdx = parseInt(propMatch[1]);
      actions.push({ label: 'Remove all instances', icon: 'trash-2', danger: true, onClick: () => {
        const toRemove = [];
        for (let i = app.propStore.instances.length - 1; i >= 0; i--) {
          if (app.propStore.instances[i].typeIdx === typeIdx) toRemove.push(i);
        }
        for (const i of toRemove) app.propStore.removeInstance(i);
        _lastHierarchySnapshot = '';
      }});
    }
  }

  return actions;
}

function buildHierarchy(app) {
  const items = gatherHierarchyItems(app);

  const filtered = _hierarchySearchTerm
    ? items.filter(i => i.name.toLowerCase().includes(_hierarchySearchTerm) || i.category.toLowerCase().includes(_hierarchySearchTerm))
    : items;

  const snapshot = filtered.map(i => i.id + i.name).join('|');
  if (snapshot === _lastHierarchySnapshot) return;
  _lastHierarchySnapshot = snapshot;

  const list = document.querySelector('#hierarchy .tree-list');
  list.innerHTML = '';

  let lastCategory = '';
  for (const item of filtered) {
    if (item.category !== lastCategory) {
      lastCategory = item.category;
      const catEl = document.createElement('div');
      catEl.className = 'tree-category';
      const catItems = filtered.filter(i => i.category === lastCategory);
      catEl.innerHTML = `${lastCategory}<span class="tree-count">${catItems.length}</span>`;
      list.appendChild(catEl);
    }
    const el = document.createElement('div');
    el.className = 'tree-item' + (item.id === _selectedItem ? ' selected' : '');
    el.dataset.id = item.id;
    el.innerHTML = `<i data-lucide="${item.icon}"></i><span>${item.name}</span>`;
    el.addEventListener('click', () => {
      list.querySelectorAll('.tree-item').forEach(t => t.classList.remove('selected'));
      el.classList.add('selected');
      _selectedItem = item.id;
      buildInspector(app, item.id);
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="inspector"]').classList.add('active');
      document.getElementById('tab-inspector').classList.add('active');
    });
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      _showContextMenu(e.clientX, e.clientY, _getContextActions(app, item));
    });
    list.appendChild(el);
  }
  lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} });
}

function buildInspector(app, itemId) {
  const container = document.getElementById('tab-inspector');
  container.innerHTML = '';
  _inspectorLiveUpdaters = [];
  const ts = app.toolState;
  const cfg = app.config;

  switch (itemId) {
    case 'sun': {
      const hdr = _section(container, 'Sun · DirectionalLight');
      _slider(hdr, ts.light, 'sunAzimuth', { label: 'Azimuth', min: 0, max: 360, step: 1 });
      _slider(hdr, ts.light, 'sunElevation', { label: 'Elevation', min: -10, max: 90, step: 1 });
      _slider(hdr, ts.light, 'sunDistance', { label: 'Distance', min: 200, max: 2000, step: 10 });
      _color(hdr, ts.light, 'dirColor', { label: 'Color' });
      _slider(hdr, ts.light, 'dirIntensity', { label: 'Intensity', min: 0, max: 5, step: 0.1 });
      const shd = _section(container, 'Shadows');
      _slider(shd, ts.light, 'shadowBias', { label: 'Bias', min: -0.01, max: 0.001, step: 0.0001 });
      _slider(shd, ts.light, 'shadowNormalBias', { label: 'Normal bias', min: 0, max: 0.2, step: 0.001 });
      break;
    }
    case 'ambient': {
      const amb = _section(container, 'Ambient · HemisphereLight');
      _color(amb, ts.light, 'hemiSkyColor', { label: 'Sky color' });
      _color(amb, ts.light, 'hemiGroundColor', { label: 'Ground color' });
      _slider(amb, ts.light, 'hemiIntensity', { label: 'Intensity', min: 0, max: 3, step: 0.1 });
      _separator(amb);
      _slider(amb, ts.light, 'envIntensity', { label: 'Env map', min: 0, max: 2, step: 0.01 });
      _slider(amb, ts.light, 'exposure', { label: 'Exposure', min: 0.1, max: 2, step: 0.05 });
      break;
    }
    case 'sky': {
      const sk = _section(container, 'Sky · Environment');
      _dropdown(sk, ts, 'skyMode', { label: 'Mode', options: { Physical: 'physical', 'Import HDR': 'hdr' }, onChange: () => app.applySkyMode(ts.skyMode) });
      _separator(sk);
      const phys = _section(container, 'Physical Sky', ts.skyMode === 'physical');
      _slider(phys, ts.physicalSky, 'turbidity', { label: 'Turbidity', min: 0, max: 20, step: 0.1 });
      _slider(phys, ts.physicalSky, 'rayleigh', { label: 'Rayleigh', min: 0, max: 4, step: 0.05 });
      _slider(phys, ts.physicalSky, 'mie', { label: 'Mie', min: 0, max: 0.1, step: 0.001 });
      _slider(phys, ts.physicalSky, 'mieG', { label: 'Mie G', min: 0, max: 1, step: 0.01 });
      _slider(phys, ts.physicalSky, 'meshScale', { label: 'Dome scale', min: 2000, max: 20000, step: 100 });
      _button(phys, { title: 'Rebake Sky IBL', onClick: () => app.rebuildSkyEnv() });
      const hdrSec = _section(container, 'HDR', ts.skyMode === 'hdr');
      _button(hdrSec, { title: 'Load HDR file...', onClick: () => app.importHdr() });
      _slider(hdrSec, ts.light, 'hdrEnvIntensity', { label: 'Env intensity', min: 0, max: 5, step: 0.05 });
      _slider(hdrSec, ts.light, 'hdrBackgroundIntensity', { label: 'Bg intensity', min: 0, max: 5, step: 0.05 });
      break;
    }
    case 'terrain': {
      const info = _section(container, 'Terrain · Info');
      _info(info, 'World size', `${cfg.world.size} × ${cfg.world.size}`);
      _info(info, 'Chunk size', `${cfg.world.chunkSize}`);
      _info(info, 'Resolution', `${cfg.world.dataResolution}`);
      const chunksInfo = _info(info, 'Active chunks', `${app.perf.activeChunks}`);
      const trisInfo = _info(info, 'Triangles', `${(app.perf.trisApprox / 1000).toFixed(0)}k`);
      _inspectorLiveUpdaters.push(() => {
        chunksInfo.update(`${app.perf.activeChunks}`);
        trisInfo.update(`${(app.perf.trisApprox / 1000).toFixed(0)}k`);
      });
      const lod = _section(container, 'LOD Settings', false);
      _toggle(lod, cfg.lod, 'enabled', { label: 'LOD enabled', onChange: () => app.onConfigChanged() });
      _slider(lod, cfg.lod, 'activeRadiusInChunks', { label: 'Radius', min: 2, max: 20, step: 1, onChange: () => app.onConfigChanged() });
      _slider(lod, cfg.lod, 'hysteresis', { label: 'Hysteresis', min: 0, max: 0.5, step: 0.01, onChange: () => app.onConfigChanged() });
      break;
    }
    case 'lensFlare': {
      const lf = _section(container, 'Lens Flare · Effect');
      _toggle(lf, ts.lensFlare, 'enabled', { label: 'Enabled' });
      _slider(lf, ts.lensFlare, 'intensity', { label: 'Intensity', min: 0, max: 5, step: 0.05 });
      _separator(lf);
      _slider(lf, ts.lensFlare, 'halationSize', { label: 'Halation size', min: 0, max: 3, step: 0.05 });
      _color(lf, ts.lensFlare, 'halationColor', { label: 'Halation color' });
      _slider(lf, ts.lensFlare, 'streakLength', { label: 'Streak len', min: 0, max: 4, step: 0.05 });
      _slider(lf, ts.lensFlare, 'streakOpacity', { label: 'Streak opac.', min: 0, max: 2, step: 0.05 });
      _color(lf, ts.lensFlare, 'streakColor', { label: 'Streak color' });
      _slider(lf, ts.lensFlare, 'ghostOpacity', { label: 'Ghost opac.', min: 0, max: 2, step: 0.05 });
      _slider(lf, ts.lensFlare, 'ghostSpacing', { label: 'Ghost spacing', min: 0, max: 2, step: 0.02 });
      _slider(lf, ts.lensFlare, 'dirtOpacity', { label: 'Lens dirt', min: 0, max: 2, step: 0.05 });
      break;
    }
    default: {
      // --- Water body ---
      const waterMatch = itemId.match(/^water_(\d+)$/);
      if (waterMatch) {
        const idx = parseInt(waterMatch[1]);
        const body = app.waterStore.bodies[idx];
        if (body) {
          const pos = body.position;
          const rot = body.rotation;
          const scl = body.scale;
          const sec = _section(container, `${body.userData.waterStyle || 'Water'} · Body`);
          _info(sec, 'Style', body.userData.waterStyle || 'Ocean');
          _separator(sec);
          const posProxy = { x: pos.x, y: pos.y, z: pos.z };
          _slider(sec, posProxy, 'x', { label: 'Position X', min: -2000, max: 2000, step: 0.5, onChange: () => { pos.x = posProxy.x; } });
          _slider(sec, posProxy, 'y', { label: 'Position Y', min: -200, max: 500, step: 0.5, onChange: () => { pos.y = posProxy.y; } });
          _slider(sec, posProxy, 'z', { label: 'Position Z', min: -2000, max: 2000, step: 0.5, onChange: () => { pos.z = posProxy.z; } });
          _separator(sec);
          const rotProxy = { x: rot.x * 180 / Math.PI, y: rot.y * 180 / Math.PI, z: rot.z * 180 / Math.PI };
          _slider(sec, rotProxy, 'x', { label: 'Rotation X', min: -180, max: 180, step: 1, onChange: () => { rot.x = rotProxy.x * Math.PI / 180; } });
          _slider(sec, rotProxy, 'y', { label: 'Rotation Y', min: -180, max: 180, step: 1, onChange: () => { rot.y = rotProxy.y * Math.PI / 180; } });
          _slider(sec, rotProxy, 'z', { label: 'Rotation Z', min: -180, max: 180, step: 1, onChange: () => { rot.z = rotProxy.z * Math.PI / 180; } });
          _separator(sec);
          const sclProxy = { x: scl.x, y: scl.y, z: scl.z };
          _slider(sec, sclProxy, 'x', { label: 'Scale X', min: 0.1, max: 50, step: 0.1, onChange: () => { scl.x = sclProxy.x; } });
          _slider(sec, sclProxy, 'y', { label: 'Scale Y', min: 0.1, max: 50, step: 0.1, onChange: () => { scl.y = sclProxy.y; } });
          _slider(sec, sclProxy, 'z', { label: 'Scale Z', min: 0.1, max: 50, step: 0.1, onChange: () => { scl.z = sclProxy.z; } });
        }
        break;
      }

      // --- Waterfall ---
      const wfMatch = itemId.match(/^waterfall_(\d+)$/);
      if (wfMatch) {
        const idx = parseInt(wfMatch[1]);
        const wf = app.waterfallSystem.waterfallObjects[idx];
        if (wf) {
          const sec = _section(container, `Waterfall ${idx}`);
          _info(sec, 'Position X', wf.position.x.toFixed(1));
          _info(sec, 'Position Y', wf.position.y.toFixed(1));
          _info(sec, 'Position Z', wf.position.z.toFixed(1));
        }
        break;
      }

      // --- Road (simple) ---
      const roadMatch = itemId.match(/^road_(\d+)$/);
      if (roadMatch) {
        const idx = parseInt(roadMatch[1]);
        const seg = app.roadSystem.segments[idx];
        if (seg) {
          const sec = _section(container, `Road ${idx}`);
          _info(sec, 'Points', `${seg.points.length}`);
          _info(sec, 'Style spans', `${(seg.styleSpans ?? []).length}`);
          if (seg.points.length > 0) {
            const first = seg.points[0];
            const last = seg.points[seg.points.length - 1];
            _separator(sec);
            _info(sec, 'Start', `${first.x.toFixed(0)}, ${first.y.toFixed(0)}, ${first.z.toFixed(0)}`);
            _info(sec, 'End', `${last.x.toFixed(0)}, ${last.y.toFixed(0)}, ${last.z.toFixed(0)}`);
          }
        }
        break;
      }

      // --- Full Road / Smart Road network ---
      if (itemId === 'fullRoadNetwork' || itemId === 'smartRoadNetwork') {
        const sys = itemId === 'fullRoadNetwork' ? app.fullRoadSystem : app.smartRoadSystem;
        const label = itemId === 'fullRoadNetwork' ? 'Full Road' : 'Smart Road';
        const sec = _section(container, `${label} · Network`);
        _info(sec, 'Nodes', `${sys.nodes.length}`);
        _info(sec, 'Edges', `${sys.edges.length}`);
        break;
      }

      // --- River ---
      const riverMatch = itemId.match(/^river_(\d+)$/);
      if (riverMatch) {
        const idx = parseInt(riverMatch[1]);
        const seg = app.riverSystem.segments[idx];
        if (seg) {
          const sec = _section(container, `River ${idx}`);
          _info(sec, 'Points', `${seg.points.length}`);
          if (seg.points.length > 0) {
            const first = seg.points[0];
            const last = seg.points[seg.points.length - 1];
            _separator(sec);
            _info(sec, 'Start', `${first.x.toFixed(0)}, ${first.y.toFixed(0)}, ${first.z.toFixed(0)}`);
            _info(sec, 'End', `${last.x.toFixed(0)}, ${last.y.toFixed(0)}, ${last.z.toFixed(0)}`);
          }
        }
        break;
      }

      // --- Spline ---
      if (itemId === 'splineSystem') {
        const sec = _section(container, 'Spline · System');
        _info(sec, 'Points', `${app.splineSystem.points.length}`);
        _info(sec, 'Tunnels', `${app.splineSystem.tunnels.length}`);
        _info(sec, 'Guardrails', `${app.splineSystem.guardrails.length}`);
        _info(sec, 'Kerbs', `${app.splineSystem.kerbs.length}`);
        _info(sec, 'Linear feat.', `${app.splineSystem.linearFeatures.length}`);
        break;
      }

      // --- Props (by type) ---
      const propMatch = itemId.match(/^propType_(\d+)$/);
      if (propMatch) {
        const typeIdx = parseInt(propMatch[1]);
        const slot = ts.propSlots[typeIdx];
        const instances = app.propStore.instances.filter(inst => inst.typeIdx === typeIdx);
        const sec = _section(container, `${slot?.name || 'Prop'} · Instances`);
        _info(sec, 'Type', slot?.name || '?');
        _info(sec, 'Instances', `${instances.length}`);
        if (instances.length > 0) {
          const list = _section(container, 'Instance List', instances.length <= 20);
          for (let i = 0; i < Math.min(instances.length, 50); i++) {
            const inst = instances[i];
            _info(list, `#${i}`, `(${inst.px.toFixed(0)}, ${inst.py.toFixed(0)}, ${inst.pz.toFixed(0)})  S:${inst.sx.toFixed(1)} R:${inst.ry.toFixed(0)}°`);
          }
          if (instances.length > 50) {
            _info(list, '...', `${instances.length - 50} more`);
          }
        }
        break;
      }

      // --- Decals ---
      if (itemId === 'decals') {
        const decals = app.decalSystem.decals;
        const sec = _section(container, `Decals · ${decals.length} total`);
        for (let i = 0; i < Math.min(decals.length, 30); i++) {
          const d = decals[i];
          const name = d.textureSrc?.split('/').pop() || `Decal ${i}`;
          _info(sec, `#${i}`, `${name}  (${d.px.toFixed(0)}, ${d.py.toFixed(0)}, ${d.pz.toFixed(0)})`);
        }
        if (decals.length > 30) {
          _info(sec, '...', `${decals.length - 30} more`);
        }
        break;
      }
    }
  }
}

// === Boot V2 app into viewport ===
const statusText = document.getElementById('statusText');
let app = null;
try {
  app = await startV2App({ container: document.getElementById('viewport') });

  // Build custom panels and insert into Tools tab
  const toolsTab = document.getElementById('tab-tools');
  toolsTab.appendChild(buildSculptPanel(app));
  toolsTab.appendChild(buildPaintPanel(app));
  toolsTab.appendChild(buildTreePanel(app));
  const propsPanel = buildPropsPanel(app);
  toolsTab.appendChild(propsPanel);
  toolsTab.appendChild(buildFoliagePanel(app));
  toolsTab.appendChild(buildPlaySpawnPanel(app));
  toolsTab.appendChild(buildHolePanel(app));
  toolsTab.appendChild(buildBarrierPanel(app));
  toolsTab.appendChild(buildAmbientFxPanel(app));
  toolsTab.appendChild(buildFleurPanel(app));
  toolsTab.appendChild(buildCliffGrassPanel(app));
  toolsTab.appendChild(buildCliffsPanel(app));
  toolsTab.appendChild(buildWaterPanel(app));
  toolsTab.appendChild(buildWaterfallPanel(app));
  toolsTab.appendChild(buildDecalsPanel(app));
  toolsTab.appendChild(buildRiverPanel(app));
  toolsTab.appendChild(buildSplinePanel(app));
  toolsTab.appendChild(buildGrassPanel(app));

  // Move Tweakpane pane into the Tools tab & apply mode-aware folder visibility
  requestAnimationFrame(() => {
    const tp = document.querySelector('.tp-dfwv');
    if (tp) {
      document.getElementById('tab-tools').appendChild(tp);
    }
    syncToolsTab(app.ui?.pane, app.toolState.mode);
    toolsModeSelect.value = app.toolState.mode;
    statusText.textContent = 'Ready';

    // Chain editor props panel rebuild into the Tweakpane propCallbacks
    const origRebuild = app.ui?.propCallbacks?._rebuildPropUi;
    if (app.ui?.propCallbacks) {
      app.ui.propCallbacks._rebuildPropUi = () => {
        origRebuild?.();
        propsPanel._rebuildPropUi?.();
      };
    }
  });

  // Build the World tab with custom controls
  buildWorldTab(app);

  // Build scene hierarchy
  buildHierarchy(app);
} catch (err) {
  console.error('[Editor] V2 startup failed:', err);
  const hud = document.getElementById('hud');
  if (hud) hud.textContent = `Startup error: ${err?.message || err}`;
  statusText.textContent = 'Error';
}

// === Toolbar wiring ===
const modeButtons = document.querySelectorAll('#tb-modes .toolbar-btn, #tb-play');

function syncToolbarHighlight() {
  if (!app) return;
  const current = app.toolState.mode;
  modeButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === current);
  });
}

function syncPlayImmersiveButtonLabel() {
  const b = document.getElementById('play-immersive-btn');
  if (!b || !app) return;
  const on = app.getPlayImmersive?.() ?? false;
  b.textContent = on ? 'Windowed' : 'Immersive';
  b.title = on ? 'Show editor panels again' : 'Fullscreen viewport — hide side panels (or Shift+F when starting play)';
}

modeButtons.forEach(btn => {
  btn.addEventListener('click', (ev) => {
    if (!app) return;
    const m = btn.dataset.mode;
    if (m === 'play') {
      app.setMode('play', { immersive: ev.shiftKey });
    } else {
      app.setMode(m);
    }
    syncToolbarHighlight();
    syncToolsTab(app.ui?.pane, m);
    toolsModeSelect.value = m;
    if (m === 'play') syncPlayImmersiveButtonLabel();
  });
});

// Tools tab mode dropdown
const toolsModeSelect = document.getElementById('tools-mode-select');
toolsModeSelect.addEventListener('change', () => {
  if (!app) return;
  app.setMode(toolsModeSelect.value);
  syncToolbarHighlight();
  syncToolsTab(app.ui?.pane, toolsModeSelect.value);
});

document.getElementById('tb-save').addEventListener('click', () => app?.saveProject());
document.getElementById('tb-save-heightmap').addEventListener('click', () => app?.saveHeightmapPng());
document.getElementById('tb-load').addEventListener('click', () => app?.loadProject());
document.getElementById('tb-undo').addEventListener('click', () => app?.undo());
document.getElementById('tb-redo').addEventListener('click', () => app?.redo());

// Keep toolbar + status bar in sync via single rAF loop
if (app) {
  let _lastMode = app.toolState.mode;
  const _elFps = document.getElementById('statusFps');
  const _elCam = document.getElementById('statusCam');
  const _elChunks = document.getElementById('statusChunks');
  const _elTris = document.getElementById('statusTris');
  const _elDot = document.getElementById('statusDot');
  let _statusTick = 0;

  const _poll = () => {
    if (app.toolState.mode !== _lastMode) {
      _lastMode = app.toolState.mode;
      syncToolbarHighlight();
      syncToolsTab(app.ui?.pane, _lastMode);
      toolsModeSelect.value = _lastMode;
      if (_lastMode === 'play') syncPlayImmersiveButtonLabel();
    }
    if (++_statusTick % 15 === 0) {
      const p = app.perf;
      const c = app.camera.position;
      _elFps.textContent = `${p.fps.toFixed(0)} fps  ${p.frameMs.toFixed(1)} ms`;
      _elCam.textContent = `X ${c.x.toFixed(0)}  Y ${c.y.toFixed(0)}  Z ${c.z.toFixed(0)}`;
      _elChunks.textContent = `${p.activeChunks} chunks`;
      _elTris.textContent = `${(p.trisApprox / 1000).toFixed(0)}k tris`;
      _elDot.style.background = p.fps >= 50 ? 'var(--green)' : p.fps >= 30 ? 'var(--orange)' : 'var(--red)';
      for (const fn of _inspectorLiveUpdaters) fn();
      for (const h of _liveSliders) { if (parseFloat(h._sl.value) !== h._obj[h._key]) h.refresh(); }
      document.getElementById('playspawn-panel')?._updateCoords?.();
      buildHierarchy(app);
    }
    requestAnimationFrame(_poll);
  };
  requestAnimationFrame(_poll);
}

// === Play stop bar ===
document.getElementById('play-immersive-btn')?.addEventListener('click', () => {
  if (!app || app.toolState.mode !== 'play') return;
  app.setPlayImmersive(!app.getPlayImmersive());
  syncPlayImmersiveButtonLabel();
});

document.getElementById('play-stop-btn')?.addEventListener('click', () => {
  if (!app) return;
  app.setMode('view');
  syncToolbarHighlight();
  syncToolsTab(app.ui?.pane, 'view');
  toolsModeSelect.value = 'view';
});

// === Init shell icons ===
lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} });
</script>
</body>
</html>
