<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V2 Terrain Editor</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
    "tweakpane": "https://esm.sh/tweakpane@4.0.4",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.9/build/index.module.js",
    "howler": "https://esm.sh/howler@2.2.4"
  }
}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-darkest: #1a1a1a;
    --bg-dark: #222222;
    --bg-panel: #2a2a2a;
    --bg-item: #333333;
    --bg-hover: #3a3a3a;
    --bg-selected: #264f78;
    --bg-input: #1e1e1e;
    --border: #3c3c3c;
    --border-light: #4a4a4a;
    --text: #cccccc;
    --text-dim: #888888;
    --text-bright: #e0e0e0;
    --accent: #4a9eff;
    --accent-dim: #2a6fbb;
    --accent-glow: rgba(74, 158, 255, 0.15);
    --green: #5cb85c;
    --orange: #e8912d;
    --red: #d9534f;
    --yellow: #f0c040;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    --radius: 4px;
    --left-w: 260px;
    --right-w: 320px;
    --bottom-h: 220px;
    --toolbar-h: 36px;
  }

  html, body { height: 100%; overflow: hidden; font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg-darkest); user-select: none; }

  /* === MAIN GRID === */
  #app {
    display: grid;
    grid-template-columns: var(--left-w) 4px 1fr 4px var(--right-w);
    grid-template-rows: var(--toolbar-h) 1fr 4px var(--bottom-h);
    height: 100%;
    width: 100%;
  }

  /* === SPLITTERS === */
  .splitter { background: var(--bg-darkest); position: relative; z-index: 20; }
  .splitter::after { content: ''; position: absolute; transition: background 0.15s; }
  .splitter:hover::after, .splitter.active::after { background: var(--accent); }
  .splitter-h { cursor: col-resize; }
  .splitter-h::after { top: 0; bottom: 0; left: 1px; width: 2px; }
  .splitter-v { cursor: row-resize; }
  .splitter-v::after { left: 0; right: 0; top: 1px; height: 2px; }
  #splitter-left  { grid-column: 2; grid-row: 2 / -1; }
  #splitter-right { grid-column: 4; grid-row: 2 / -1; }
  #splitter-bottom { grid-column: 3; grid-row: 3; }

  /* === TOP TOOLBAR === */
  #toolbar {
    grid-column: 1 / -1; grid-row: 1;
    background: var(--bg-dark); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 8px; gap: 2px;
  }
  .toolbar-group { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--border); height: 100%; }
  .toolbar-group:last-child { border-right: none; }
  .toolbar-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; background: none; border: none; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer;
  }
  .toolbar-btn:hover { background: var(--bg-hover); color: var(--text-bright); }
  .toolbar-btn.active { background: var(--bg-selected); color: var(--accent); }
  .toolbar-btn i { width: 16px; height: 16px; }
  .toolbar-title { font-weight: 600; font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px; margin-right: auto; padding-left: 4px; }
  .toolbar-btn-text {
    display: flex; align-items: center; gap: 4px; padding: 4px 10px; height: 28px;
    background: none; border: none; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer; font-size: 12px; font-family: var(--font); white-space: nowrap;
  }
  .toolbar-btn-text:hover { background: var(--bg-hover); color: var(--text-bright); }

  /* === LEFT: SCENE HIERARCHY === */
  #hierarchy {
    grid-column: 1; grid-row: 2 / -1;
    background: var(--bg-panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; height: 32px; min-height: 32px;
    background: var(--bg-dark); border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-dim);
  }
  .panel-header-actions { display: flex; gap: 2px; }
  .panel-header-actions button {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; background: none; border: none; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer;
  }
  .panel-header-actions button:hover { background: var(--bg-hover); color: var(--text-bright); }
  .panel-search {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--border);
  }
  .panel-search input {
    flex: 1; height: 24px; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 8px; color: var(--text); font-size: 12px; font-family: var(--font); outline: none;
  }
  .panel-search input:focus { border-color: var(--accent); }
  .panel-search i { color: var(--text-dim); width: 14px; height: 14px; }
  .tree-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .tree-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 12px; cursor: pointer;
    font-size: 12px; color: var(--text); border-left: 2px solid transparent;
  }
  .tree-item:hover { background: var(--bg-hover); }
  .tree-item.selected { background: var(--bg-selected); border-left-color: var(--accent); color: var(--text-bright); }
  .tree-item i { width: 14px; height: 14px; color: var(--text-dim); flex-shrink: 0; }
  .tree-item.selected i { color: var(--accent); }
  .tree-item .tree-type { margin-left: auto; font-size: 10px; color: var(--text-dim); opacity: 0.5; }
  .tree-category {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px 2px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-dim); opacity: 0.6;
  }
  .tree-count {
    margin-left: auto; font-size: 10px; color: var(--text-dim); opacity: 0.5;
    font-weight: 400; font-family: var(--font-mono);
  }
  /* === CONTEXT MENU === */
  .ctx-menu {
    position: fixed; z-index: 1000; min-width: 160px;
    background: var(--bg-dark); border: 1px solid var(--border-light);
    border-radius: 6px; padding: 4px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .ctx-menu-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    font-size: 12px; color: var(--text); cursor: pointer; border: none;
    background: none; width: 100%; text-align: left; font-family: var(--font);
  }
  .ctx-menu-item:hover { background: var(--bg-selected); color: var(--text-bright); }
  .ctx-menu-item.danger { color: var(--red); }
  .ctx-menu-item.danger:hover { background: rgba(217,83,79,0.2); }
  .ctx-menu-item i { width: 14px; height: 14px; flex-shrink: 0; }
  .ctx-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
  .ctx-menu-item.disabled { color: var(--text-dim); opacity: 0.4; pointer-events: none; }

  .info-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-height: 26px; }
  .info-label { width: 90px; min-width: 90px; font-size: 11px; color: var(--text-dim); text-align: right; padding-right: 4px; }
  .info-value { flex: 1; font-size: 12px; color: var(--text); font-family: var(--font-mono); }
  .empty-panel {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; color: var(--text-dim); gap: 8px; padding: 40px; text-align: center;
  }
  .empty-panel i { width: 32px; height: 32px; opacity: 0.3; }
  .empty-panel p { font-size: 12px; line-height: 1.5; }

  /* === CENTER: VIEWPORT === */
  #viewport {
    grid-column: 3; grid-row: 2; background: var(--bg-darkest);
    position: relative; overflow: hidden;
  }
  #viewport canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    z-index: 2;
    outline: none;
  }
  #hud {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 5;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.58);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    padding: 9px 11px;
    white-space: pre-wrap;
    line-height: 1.35;
    font-size: 12px;
    min-width: 260px;
    font-family: 'SF Mono', Consolas, monospace;
    color: #d7e4ef;
  }

  /* === BOTTOM: FILE BROWSER === */
  #assets {
    grid-column: 3; grid-row: 4; background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .asset-toolbar {
    display: flex; align-items: center; gap: 4px; padding: 0 8px; height: 32px; min-height: 32px;
    background: var(--bg-dark); border-bottom: 1px solid var(--border);
  }
  .asset-toolbar .breadcrumb {
    display: flex; align-items: center; gap: 2px; flex: 1; font-size: 12px; color: var(--text-dim);
  }
  .breadcrumb span { cursor: pointer; padding: 2px 4px; border-radius: var(--radius); }
  .breadcrumb span:hover { background: var(--bg-hover); color: var(--text); }
  .breadcrumb .sep { color: var(--border-light); cursor: default; }
  .breadcrumb .sep:hover { background: none; }
  .breadcrumb .current { color: var(--text); }
  .asset-body { display: flex; flex: 1; overflow: hidden; }
  .asset-sidebar { width: 160px; min-width: 160px; border-right: 1px solid var(--border); overflow-y: auto; padding: 4px 0; }
  .asset-folder {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .asset-folder:hover { background: var(--bg-hover); }
  .asset-folder.selected { background: var(--bg-selected); }
  .asset-folder i { width: 14px; height: 14px; color: var(--yellow); flex-shrink: 0; }
  .asset-grid-wrap { flex: 1; overflow-y: auto; padding: 8px; }
  .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  .asset-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px; border-radius: var(--radius); cursor: grab; border: 1px solid transparent;
  }
  .asset-card:hover { background: var(--bg-hover); border-color: var(--border); }
  .asset-card.selected { background: var(--accent-glow); border-color: var(--accent); }
  .asset-thumb {
    width: 64px; height: 64px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .asset-thumb.texture { border: 1px solid var(--border); }
  .asset-thumb.file-icon { background: var(--bg-dark); border: 1px solid var(--border); }
  .asset-thumb.file-icon i { width: 28px; height: 28px; color: var(--accent); }
  .asset-name {
    font-size: 10px; color: var(--text-dim); text-align: center;
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fs-empty {
    grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; color: var(--text-dim); gap: 10px; text-align: center;
  }
  .fs-empty i { width: 32px; height: 32px; opacity: 0.3; }
  .fs-open-btn {
    margin-top: 6px; padding: 6px 16px; background: var(--accent); color: white; border: none;
    border-radius: var(--radius); font-size: 12px; font-family: var(--font); cursor: pointer; font-weight: 600;
  }
  .fs-open-btn:hover { background: var(--accent-dim); }

  /* === PAINT LAYER CARDS === */
  .layer-cards { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
  .layer-card {
    width: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px; border-radius: var(--radius); cursor: pointer;
    border: 2px solid transparent; transition: border-color 0.15s;
  }
  .layer-card:hover { background: var(--bg-hover); }
  .layer-card.active { border-color: var(--accent); background: var(--accent-glow); }
  .layer-card.drag-over { border-color: var(--green); background: rgba(92,184,92,0.15); }
  .layer-card-thumb {
    width: 44px; height: 44px; border-radius: 3px; background: var(--bg-dark);
    border: 1px solid var(--border); overflow: hidden; position: relative;
  }
  .layer-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .layer-card-thumb .empty-tex {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: var(--text-dim); text-align: center;
  }
  .layer-card-label { font-size: 9px; color: var(--text-dim); text-align: center; max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-card.active .layer-card-label { color: var(--accent); font-weight: 600; }

  /* === RIGHT PANEL (TABBED) === */
  #right-panel {
    grid-column: 5; grid-row: 2 / -1; background: var(--bg-panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .tab-bar {
    display: flex; background: var(--bg-dark); border-bottom: 1px solid var(--border); min-height: 32px;
  }
  .tab-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 0 10px; height: 32px; background: none; border: none;
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase;
    color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text); background: var(--bg-hover); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn i { width: 14px; height: 14px; }
  .tab-content { flex: 1; overflow-y: auto; display: none; padding-bottom: 24px; }
  .tab-content.active { display: block; }

  /* === STATUS BAR === */
  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 22px;
    background: var(--bg-dark); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 10px; gap: 16px;
    font-size: 11px; color: var(--text-dim); z-index: 100;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  /* === PLAY FULLSCREEN === */
  #app.play-fullscreen #toolbar,
  #app.play-fullscreen #hierarchy,
  #app.play-fullscreen #right-panel,
  #app.play-fullscreen #assets,
  #app.play-fullscreen .splitter,
  #app.play-fullscreen ~ .status-bar { z-index: 10000; }
  #app.play-fullscreen { grid-template-columns: 0 0 1fr 0 0; grid-template-rows: 0 1fr 0 0; }
  #app.play-fullscreen #viewport { grid-column: 1 / -1; grid-row: 1 / -1; }

  #play-stop-bar {
    display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    z-index: 9999; background: rgba(30,30,30,0.92); border: 1px solid var(--border-light);
    border-top: none; border-radius: 0 0 8px 8px; padding: 4px 16px;
    backdrop-filter: blur(6px);
  }
  #play-stop-bar.visible { display: flex; align-items: center; gap: 10px; }
  #play-stop-bar > span:first-of-type { font-size: 11px; color: var(--green); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  #play-stop-bar .play-hint {
    font-size: 10px; color: var(--text-dim); font-weight: 400; text-transform: none; letter-spacing: 0;
    max-width: 120px; line-height: 1.2;
  }
  #play-stop-bar button {
    display: flex; align-items: center; gap: 4px; padding: 3px 12px; height: 24px;
    border: none; border-radius: var(--radius);
    font-size: 11px; font-weight: 600; font-family: var(--font); cursor: pointer;
  }
  #play-stop-bar button.play-stop-primary {
    background: var(--red); color: #fff;
  }
  #play-stop-bar button.play-stop-secondary {
    background: var(--bg-input); color: var(--text); border: 1px solid var(--border-light);
  }
  #play-stop-bar button:hover { filter: brightness(1.12); }

  /* === SCROLLBAR === */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* === INSPECTOR / PROPERTY CONTROLS === */
  .inspector-section { border-bottom: 1px solid var(--border); }
  .section-header {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; cursor: pointer;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim);
  }
  .section-header:hover { background: var(--bg-hover); }
  .section-header .section-arrow { width: 14px; height: 14px; transition: transform 0.15s; flex-shrink: 0; }
  .section-header.collapsed .section-arrow { transform: rotate(-90deg); }
  .section-body { padding: 6px 12px 10px; }
  .section-body.hidden { display: none; }
  .prop-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; min-height: 26px; }
  .prop-label { width: 90px; min-width: 90px; font-size: 11px; color: var(--text-dim); text-align: right; padding-right: 4px; }
  .prop-value { flex: 1; display: flex; gap: 4px; align-items: center; }
  .prop-input {
    flex: 1; height: 22px; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 6px; color: var(--text); font-size: 12px; font-family: var(--font-mono); outline: none; min-width: 0;
  }
  .prop-input:focus { border-color: var(--accent); }
  .prop-color-wrap { display: flex; align-items: center; gap: 6px; flex: 1; }
  .prop-color {
    width: 22px; height: 22px; border-radius: var(--radius); border: 1px solid var(--border);
    cursor: pointer; flex-shrink: 0; padding: 0; -webkit-appearance: none; appearance: none;
  }
  .prop-color::-webkit-color-swatch-wrapper { padding: 0; }
  .prop-color::-webkit-color-swatch { border: none; border-radius: 2px; }
  .prop-slider-wrap { flex: 1; display: flex; align-items: center; gap: 6px; }
  .prop-slider {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: var(--bg-input); border-radius: 2px; outline: none;
  }
  .prop-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .prop-slider-val { width: 44px; font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); text-align: right; }
  .prop-dropdown {
    flex: 1; height: 22px; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 6px; color: var(--text); font-size: 12px; font-family: var(--font); outline: none; cursor: pointer;
  }
  .prop-toggle {
    width: 14px; height: 14px; border: 1px solid var(--border-light); border-radius: 3px;
    background: var(--bg-input); cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0; color: transparent;
  }
  .prop-toggle.checked { background: var(--accent); border-color: var(--accent); color: white; }
  .prop-toggle svg { width: 10px; height: 10px; }
  .section-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 26px; margin-top: 4px;
    background: var(--bg-item); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer; font-size: 11px; font-family: var(--font);
  }
  .section-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-light); }
  .section-separator { height: 1px; background: var(--border); margin: 6px 0; }

  /* === TOOLS MODE BAR === */
  .tools-mode-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg-dark);
  }
  .tools-mode-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--text-dim); flex-shrink: 0;
  }

  /* === TWEAKPANE OVERRIDE — embed inside Tools tab === */
  .tp-dfwv {
    position: relative !important;
    top: auto !important;
    right: auto !important;
    width: 100% !important;
    max-height: none !important;
    overflow-y: visible !important;
    z-index: auto !important;
    border-radius: 0 !important;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOOLBAR -->
  <div id="toolbar">
    <div class="toolbar-group"><span class="toolbar-title">TERRAIN ENGINE</span></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" id="tb-save" title="Save project (.v2terrain)"><i data-lucide="save"></i></button>
      <button class="toolbar-btn" id="tb-save-heightmap" title="Export heightmap PNG — grayscale for DCC or paint brush mask"><i data-lucide="image-down"></i></button>
      <button class="toolbar-btn" id="tb-load" title="Load"><i data-lucide="folder-open"></i></button>
      <button class="toolbar-btn" id="tb-undo" title="Undo"><i data-lucide="undo-2"></i></button>

// === Resizable splitters ===
function initSplitter(id, cssVar, axis, invert = false) {
  const el = document.getElementById(id);
  const root = document.documentElement;
  el.addEventListener('mousedown', (e) => {
    e.preventDefault();
    el.classList.add('active');
    const startPos = axis === 'x' ? e.clientX : e.clientY;
    const startSize = parseFloat(getComputedStyle(root).getPropertyValue(cssVar));
    document.body.style.cursor = axis === 'x' ? 'col-resize' : 'row-resize';
    const onMove = (ev) => {
      const delta = (axis === 'x' ? ev.clientX : ev.clientY) - startPos;
      const maxPx = (axis === 'x' ? window.innerWidth : window.innerHeight) * 0.45;
      root.style.setProperty(cssVar, Math.max(180, Math.min(maxPx, startSize + delta * (invert ? -1 : 1))) + 'px');
    };
    const onUp = () => {
      el.classList.remove('active');
      document.body.style.cursor = '';
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}
initSplitter('splitter-left', '--left-w', 'x');
initSplitter('splitter-right', '--right-w', 'x', true);
initSplitter('splitter-bottom', '--bottom-h', 'y', true);

// === File browser (File System Access API) ===
let fsRootHandle = null;
let fsCurrentHandle = null;
let fsPathStack = [];
const fsFileHandles = new Map();

const EXT_ICONS = {
  png:'image', jpg:'image', jpeg:'image', webp:'image', bmp:'image', tga:'image',
  glb:'box', gltf:'box', fbx:'box', obj:'box',
  mp3:'volume-2', ogg:'volume-2', wav:'volume-2',
  json:'file-json', js:'file-code', ts:'file-code', html:'file-code',
};
const IMG_EXTS = new Set(['png','jpg','jpeg','webp','bmp']);

async function openFolder() {
  try {
    fsRootHandle = await window.showDirectoryPicker();
    fsCurrentHandle = fsRootHandle;
    fsPathStack = [{ name: fsRootHandle.name, handle: fsRootHandle }];
    await renderFileSystem();
  } catch (e) { /* user cancelled */ }
}

async function navigateToFolder(dirHandle, name) {
  fsCurrentHandle = dirHandle;
  fsPathStack.push({ name, handle: dirHandle });
  await renderFileSystem();
}

async function navigateBreadcrumb(idx) {
  fsPathStack = fsPathStack.slice(0, idx + 1);
  fsCurrentHandle = fsPathStack[idx].handle;
  await renderFileSystem();
}

async function renderFileSystem() {
  const breadcrumb = document.getElementById('fsBreadcrumb');
  let bc = '';
  for (let i = 0; i < fsPathStack.length; i++) {
    if (i > 0) bc += '<span class="sep">/</span>';
    const cls = i === fsPathStack.length - 1 ? 'current' : '';
    bc += `<span class="${cls}" data-bc="${i}">${fsPathStack[i].name}</span>`;
  }
  breadcrumb.innerHTML = bc;
  breadcrumb.querySelectorAll('span[data-bc]').forEach(s => {
    s.addEventListener('click', () => navigateBreadcrumb(parseInt(s.dataset.bc)));
  });

  const dirs = [], files = [];
  fsFileHandles.clear();
  for await (const [name, handle] of fsCurrentHandle.entries()) {
    if (handle.kind === 'directory') dirs.push({ name, handle });
    else { files.push({ name, handle }); fsFileHandles.set(name, handle); }
  }
  dirs.sort((a,b) => a.name.localeCompare(b.name));
  files.sort((a,b) => a.name.localeCompare(b.name));

  const sidebar = document.getElementById('assetFolders');
  let sh = '';
  for (const d of dirs) sh += `<div class="asset-folder" data-dir="${d.name}"><i data-lucide="folder"></i><span>${d.name}</span></div>`;
  if (dirs.length === 0) sh = '<div style="padding:10px;color:var(--text-dim);font-size:11px">No subfolders</div>';
  sidebar.innerHTML = sh;
  sidebar.querySelectorAll('.asset-folder').forEach(el => {
    el.addEventListener('click', async () => {
      const d = dirs.find(x => x.name === el.dataset.dir);
      if (d) await navigateToFolder(d.handle, d.name);
    });
  });

  const grid = document.getElementById('assetGrid');
  let gh = '';
  for (const d of dirs) {
    gh += `<div class="asset-card" data-dir="${d.name}"><div class="asset-thumb file-icon"><i data-lucide="folder" style="color:var(--yellow)"></i></div><span class="asset-name">${d.name}</span></div>`;
  }
  for (const f of files) {
    const ext = f.name.split('.').pop().toLowerCase();
    const icon = EXT_ICONS[ext] || 'file';
    const isImg = IMG_EXTS.has(ext);
    if (isImg) {
      try {
        const file = await f.handle.getFile();
        const url = URL.createObjectURL(file);
        gh += `<div class="asset-card" draggable="true" data-name="${f.name}"><div class="asset-thumb texture" style="background:url(${url}) center/cover"></div><span class="asset-name">${f.name}</span></div>`;
      } catch {
        gh += `<div class="asset-card" draggable="true" data-name="${f.name}"><div class="asset-thumb file-icon"><i data-lucide="${icon}"></i></div><span class="asset-name">${f.name}</span></div>`;
      }
    } else {
      gh += `<div class="asset-card" draggable="true" data-name="${f.name}"><div class="asset-thumb file-icon"><i data-lucide="${icon}"></i></div><span class="asset-name">${f.name}</span></div>`;
    }
  }
  if (dirs.length === 0 && files.length === 0) {
    gh = '<div class="fs-empty"><i data-lucide="folder-open"></i><span style="font-size:12px">This folder is empty</span></div>';
  }
  grid.innerHTML = gh;

  grid.querySelectorAll('.asset-card[data-dir]').forEach(card => {
    card.addEventListener('dblclick', async () => {
      const d = dirs.find(x => x.name === card.dataset.dir);
      if (d) await navigateToFolder(d.handle, d.name);
    });
  });
  grid.querySelectorAll('.asset-card[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.name);
      e.dataTransfer.effectAllowed = 'copy';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('click', () => {
      grid.querySelectorAll('.asset-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });

  lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} });
}

// === Widget factory ===
const _checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
const _arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';

function _fmt(v, step) {
  if (step >= 1) return String(Math.round(v));
  const d = Math.max(0, -Math.floor(Math.log10(step)));
  return v.toFixed(d);
}

function _section(parent, title, expanded = true) {
  const sec = document.createElement('div');
  sec.className = 'inspector-section';
  const hdr = document.createElement('div');
  hdr.className = 'section-header' + (expanded ? '' : ' collapsed');
  hdr.innerHTML = _arrowSvg + ' ' + title;
  const body = document.createElement('div');
  body.className = 'section-body' + (expanded ? '' : ' hidden');
  hdr.addEventListener('click', () => { hdr.classList.toggle('collapsed'); body.classList.toggle('hidden'); });
  sec.appendChild(hdr);
  sec.appendChild(body);
  parent.appendChild(sec);
  return body;
}

const _liveSliders = [];
function _slider(parent, obj, key, opts) {
  const { label, min, max, step = 0.01, onChange } = opts;
  const row = document.createElement('div');
  row.className = 'prop-row';
  const cur = obj[key];
  row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><span class="prop-slider-val">${_fmt(cur, step)}</span></div></div>`;
  const sl = row.querySelector('.prop-slider');
  const vl = row.querySelector('.prop-slider-val');
  sl.addEventListener('input', () => { obj[key] = parseFloat(sl.value); vl.textContent = _fmt(obj[key], step); onChange?.(); });
  parent.appendChild(row);
  const handle = { row, refresh() { sl.value = obj[key]; vl.textContent = _fmt(obj[key], step); }, _obj: obj, _key: key, _sl: sl, _vl: vl, _step: step };
  _liveSliders.push(handle);
  return handle;
}

function _color(parent, obj, key, opts) {
  const { label, onChange } = opts;
  const row = document.createElement('div');
  row.className = 'prop-row';
  row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"><span class="prop-slider-val" style="width:auto">${obj[key]}</span></div></div>`;
  const inp = row.querySelector('.prop-color');
  const hex = row.querySelector('.prop-slider-val');
  inp.addEventListener('input', () => { obj[key] = inp.value; hex.textContent = inp.value; onChange?.(); });
  parent.appendChild(row);
  return { row, refresh() { inp.value = obj[key]; hex.textContent = obj[key]; } };
}

function _toggle(parent, obj, key, opts) {
  const { label, onChange } = opts;
  const row = document.createElement('div');
  row.className = 'prop-row';
  row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button class="prop-toggle ${obj[key] ? 'checked' : ''}">${_checkSvg}</button></div>`;
  const btn = row.querySelector('.prop-toggle');
  btn.addEventListener('click', () => { obj[key] = !obj[key]; btn.classList.toggle('checked', obj[key]); onChange?.(); });
  parent.appendChild(row);
  return { refresh() { btn.classList.toggle('checked', obj[key]); } };
}

function _dropdown(parent, obj, key, opts) {
  const { label, options, onChange } = opts;
  const row = document.createElement('div');
  row.className = 'prop-row';
  let optHtml = '';
  for (const [text, val] of Object.entries(options)) {
    optHtml += `<option value="${val}" ${obj[key] === val ? 'selected' : ''}>${text}</option>`;
  }
  row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><select class="prop-dropdown">${optHtml}</select></div>`;
  const sel = row.querySelector('.prop-dropdown');
  const _isNum = typeof obj[key] === 'number';
  sel.addEventListener('change', () => { obj[key] = _isNum ? Number(sel.value) : sel.value; onChange?.(); });
  parent.appendChild(row);
  return { refresh() { sel.value = obj[key]; } };
}

function _button(parent, opts) {
  const { title, onClick } = opts;
  const btn = document.createElement('button');
  btn.className = 'section-btn';
  btn.textContent = title;
  btn.addEventListener('click', onClick);
  parent.appendChild(btn);
}

function _info(parent, label, value) {
  const row = document.createElement('div');
  row.className = 'info-row';
  const valSpan = document.createElement('span');
  valSpan.className = 'info-value';
  valSpan.textContent = value;
  row.innerHTML = `<span class="info-label">${label}</span>`;
  row.appendChild(valSpan);
  parent.appendChild(row);
  return { update(v) { valSpan.textContent = v; } };
}

function _separator(parent) {
  const div = document.createElement('div');
  div.className = 'section-separator';
  parent.appendChild(div);
}

function buildSculptPanel(app) {
  const panel = document.createElement('div');
  panel.id = 'sculpt-panel';

  const refreshTp = () => app.ui?.pane.refresh();

const TERRAIN_NOISE_TYPE_OPTIONS = {
  Value: 'value',
  Perlin: 'perlin',
  Simplex: 'simplex',
  Voronoi: 'voronoi',
  White: 'white',
};

function terrainPresetLabelOptions(presets) {
  const o = {};
  for (const k of Object.keys(presets)) {
    const label =
      k === 'default'
        ? 'Default'
        : k
            .replace(/([A-Z])/g, ' $1')
            .replace(/^./, (c) => c.toUpperCase())
            .trim();
    o[label] = k;
  }
  return o;
}

// === Build custom Paint panel ===
function buildPaintPanel(app) {
  const panel = document.createElement('div');
  panel.id = 'paint-panel';
  const ts = app.toolState;
  const cfg = app.config;
  const lib = app.textureLibrary;

  // --- Brush ---
  const brushBody = _section(panel, 'Brush');
  _slider(brushBody, ts.brush, 'radius', { label: 'Radius', min: cfg.sculpt.brushMin, max: cfg.sculpt.brushMax, step: 0.5 });
  _slider(brushBody, ts.brush, 'strength', { label: 'Strength', min: cfg.sculpt.strengthMin, max: cfg.sculpt.strengthMax, step: 0.01 });
  _slider(brushBody, ts.brush, 'falloff', { label: 'Shape', min: 0.5, max: 4, step: 0.05 });

  const { rebuildTexturePickers } = installTerrainAppearanceInPaintPanel(panel, app);

  // --- Layer cards with texture thumbnails ---
  const layerSection = _section(panel, 'Paint Layers');

  function getThumbUrl(slotId) {
    const slot = lib.getSlot(slotId);
    if (!slot) return null;
    const canvas = slot.albedoTex?.image;
    if (canvas && canvas.toDataURL) {
      try { return canvas.toDataURL('image/jpeg', 0.5); } catch { return null; }
    }
    return null;
  }

  const layerLabels = ['Eraser', 'Layer 1', 'Layer 2', 'Layer 3', 'Layer 4', 'Layer 5', 'Layer 6', 'Layer 7', 'Meadow'];
  const cardContainer = document.createElement('div');
  cardContainer.className = 'layer-cards';
  layerSection.appendChild(cardContainer);

  function buildLayerCards() {
    cardContainer.innerHTML = '';
    for (let i = 0; i < layerLabels.length; i++) {
      const card = document.createElement('div');
      card.className = 'layer-card' + (ts.paint.activeLayer === i ? ' active' : '');
      card.dataset.layer = i;

      const thumb = document.createElement('div');
      thumb.className = 'layer-card-thumb';
      if (i === 0) {
        thumb.innerHTML = '<div class="empty-tex">Eraser</div>';
      } else if (i === 8) {
        thumb.innerHTML = '<div class="empty-tex">TSL</div>';
      } else {
        const slotId = ts.paint.layerSlotIds[i - 1];
        const url = getThumbUrl(slotId);
        if (url) {
          const img = document.createElement('img');
          img.src = url;
          thumb.appendChild(img);
        } else {
          thumb.innerHTML = `<div class="empty-tex">L${i}</div>`;
        }
      }
      card.appendChild(thumb);

      const label = document.createElement('div');
      label.className = 'layer-card-label';
      if (i > 0 && i < 8) {
        const slotId = ts.paint.layerSlotIds[i - 1];
        const slot = lib.getSlot(slotId);
        label.textContent = slot?.name || layerLabels[i];
      } else {
        label.textContent = layerLabels[i];
      }
      card.appendChild(label);

      card.addEventListener('click', () => {
        ts.paint.activeLayer = i;
        cardContainer.querySelectorAll('.layer-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });

      // Drop target for layers 1-7
      if (i >= 1 && i <= 7) {
        card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; card.classList.add('drag-over'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', async e => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const fileName = e.dataTransfer.getData('text/plain');
          if (!fileName) return;
          const handle = fsFileHandles.get(fileName);
          if (!handle) return;
          const ext = fileName.split('.').pop().toLowerCase();
          if (!IMG_EXTS.has(ext)) return;
          try {
            const file = await handle.getFile();
            const slotId = ts.paint.layerSlotIds[i - 1];
            await lib.replaceMapFromFile(slotId, 'albedo', file);
            const slot = lib.getSlot(slotId);
            if (slot) lib.renameSlot(slotId, fileName.replace(/\.[^.]+$/, ''));
            app.invalidateSurfaceMaterials();
            buildLayerCards();
          } catch (err) { console.error('[Paint] Drop failed:', err); }
        });
      }

      cardContainer.appendChild(card);
    }
  }
  buildLayerCards();

  // --- Layer texture assignment (dropdown fallback) ---
  const texBody = _section(panel, 'Layer Textures', false);
  function buildLayerPickers() {
    texBody.innerHTML = '';
    const slotOpts = {};
    for (const s of lib.slots) slotOpts[s.name || s.id] = s.id;
    for (let i = 0; i < 7; i++) {
      const idx = i;
      if (!lib.getSlot(ts.paint.layerSlotIds[idx])) {
        ts.paint.layerSlotIds[idx] = lib.slots[0]?.id ?? '';
      }
      _dropdown(texBody, ts.paint.layerSlotIds, idx, {
        label: `Layer ${idx + 1}`, options: slotOpts,
        onChange: () => { app.invalidateSurfaceMaterials(); buildLayerCards(); },
      });
    }
  }
  buildLayerPickers();

  // --- Solo / Opacity ---
  const soloBody = _section(panel, 'Solo & Opacity', false);
  const soloOpts = { Off: -1, 'Base (layer 0)': 0, 'Layer 1': 1, 'Layer 2': 2, 'Layer 3': 3, 'Layer 4': 4, 'Layer 5': 5, 'Layer 6': 6, 'Layer 7': 7 };
  _dropdown(soloBody, ts.paint, 'soloLayer', { label: 'Solo layer', options: soloOpts, onChange: () => app.syncSoloLayer() });
  _slider(soloBody, cfg.paint, 'brushOpacity', { label: 'Brush opacity', min: 0.02, max: 1, step: 0.01 });

  // --- Height Blend ---
  const hbBody = _section(panel, 'Height Blend', false);
  _slider(hbBody, ts.paint, 'heightBlend', { label: 'Strength', min: 0, max: 1, step: 0.01, onChange: () => app.syncHeightBlend() });
  _slider(hbBody, ts.paint, 'heightContrast', { label: 'Contrast', min: 0.01, max: 1, step: 0.01, onChange: () => app.syncHeightBlend() });

  // --- Noise Mask ---
  const noiseBody = _section(panel, 'Noise Mask', false);
  _slider(noiseBody, ts.paint, 'noiseMask', { label: 'Amount', min: 0, max: 1, step: 0.02 });
  _slider(noiseBody, ts.paint, 'noiseScale', { label: 'Scale', min: 0.5, max: 20, step: 0.25 });
  _slider(noiseBody, ts.paint, 'noiseOctaves', { label: 'Detail', min: 1, max: 6, step: 1 });
  _toggle(noiseBody, ts.paint, 'noiseEdgeOnly', { label: 'Edge only' });

  // --- Brush Mask ---
  const maskBody = _section(panel, 'Brush Mask', false);
  const previewCanvas = document.createElement('canvas');
  previewCanvas.width = 64;
  previewCanvas.height = 64;
  previewCanvas.style.cssText = 'display:block;width:48px;height:48px;margin:6px auto 8px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;image-rendering:pixelated;background:var(--bg-input);';
  const bm = app.brushMask;
  bm.renderPreview(previewCanvas);

  _dropdown(maskBody, ts.paint, 'maskPreset', { label: 'Preset', options: {
    None: 'none', Soft: 'soft', Hard: 'hard', Splatter: 'splatter', Grunge: 'grunge',
  }, onChange: () => {
    bm.generateBuiltin(ts.paint.maskPreset);
    bm.renderPreview(previewCanvas);
  } });
  _button(maskBody, { title: 'Load PNG mask', onClick: () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/png,image/jpeg,image/webp';
    input.onchange = async () => {
      const file = input.files?.[0];
      if (!file) return;
      await bm.loadFromFile(file);
      ts.paint.maskPreset = 'custom:' + bm.name;
      bm.renderPreview(previewCanvas);
    };
    input.click();
  } });
  maskBody.appendChild(previewCanvas);
  _slider(maskBody, ts.paint, 'maskRotation', { label: 'Rotation', min: 0, max: 360, step: 1 });
  _toggle(maskBody, ts.paint, 'maskRandomRotation', { label: 'Random rot.' });
  _toggle(maskBody, ts.paint, 'maskFollowStroke', { label: 'Follow stroke' });

  // --- Texture Library ---
  const libBody = _section(panel, 'Texture Library', false);
  const libState = { activeSlotId: lib.slots[0]?.id ?? '' };

  function buildLibSlotEditor() {
    libEditor.innerHTML = '';
    const slot = lib.getSlot(libState.activeSlotId);
    if (!slot) return;

    // Thumbnail preview
    const previewDiv = document.createElement('div');
    previewDiv.style.cssText = 'width:64px;height:64px;border:1px solid var(--border);border-radius:4px;margin:4px auto 8px;overflow:hidden;';
    const thumbUrl = getThumbUrl(slot.id);
    if (thumbUrl) previewDiv.innerHTML = `<img src="${thumbUrl}" style="width:100%;height:100%;object-fit:cover;">`;
    else previewDiv.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-dim)">No tex</div>';
    libEditor.appendChild(previewDiv);

    _slider(libEditor, slot, 'uvScale', { label: 'UV tile', min: 0.25, max: 80, step: 0.25, onChange: () => lib.setSlotUvScale(slot.id, slot.uvScale) });
    _slider(libEditor, slot, 'normalStrength', { label: 'Normal str', min: 0, max: 3, step: 0.02, onChange: () => lib.setSlotStrength(slot.id, 'normal', slot.normalStrength) });
    _slider(libEditor, slot, 'aoStrength', { label: 'AO str', min: 0, max: 2, step: 0.02, onChange: () => lib.setSlotStrength(slot.id, 'ao', slot.aoStrength) });
    _slider(libEditor, slot, 'roughStrength', { label: 'Rough str', min: 0, max: 2, step: 0.02, onChange: () => lib.setSlotStrength(slot.id, 'rough', slot.roughStrength) });

    _separator(libEditor);
    for (const kind of ['albedo', 'normal', 'ao', 'rough']) {
      _button(libEditor, { title: `Upload ${kind}...`, onClick: () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = async () => {
          const file = input.files?.[0];
          if (file) { await lib.replaceMapFromFile(slot.id, kind, file); buildLibSlotEditor(); buildLayerCards(); }
        };
        input.click();
      }});
    }

    if (lib.slots.length > 1) {
      _separator(libEditor);
      _button(libEditor, { title: 'Remove this slot', onClick: () => {
        lib.removeSlot(slot.id);
        libState.activeSlotId = lib.slots[0]?.id ?? '';
        buildLibSlotPicker();
        buildLibSlotEditor();
        buildLayerPickers();
        buildLayerCards();
        rebuildTexturePickers();
      }});
    }
  }

  function buildLibSlotPicker() {
    libPicker.innerHTML = '';
    const opts = {};
    for (const s of lib.slots) opts[s.name || s.id] = s.id;
    if (!lib.getSlot(libState.activeSlotId)) libState.activeSlotId = lib.slots[0]?.id ?? '';
    _dropdown(libPicker, libState, 'activeSlotId', { label: 'Slot', options: opts, onChange: () => buildLibSlotEditor() });
  }

  const libPicker = document.createElement('div');
  libBody.appendChild(libPicker);

  _button(libBody, { title: '+ Add texture slot', onClick: () => {
    const slot = lib.addSlot();
    libState.activeSlotId = slot.id;
    buildLibSlotPicker();
    buildLibSlotEditor();
    buildLayerPickers();
    buildLayerCards();
    rebuildTexturePickers();
  }});

  const libEditor = document.createElement('div');
  libBody.appendChild(libEditor);

  buildLibSlotPicker();
  buildLibSlotEditor();

  _separator(panel);
  _button(panel, { title: 'Fill world with active layer', onClick: () => app.paintFill() });
  _button(panel, { title: 'Clear all paint', onClick: () => app.paintClear() });

  panel._rebuildLayerCards = buildLayerCards;
  panel._rebuildTerrainTexturePickers = rebuildTexturePickers;

  return panel;
}

// === Build custom Props panel ===
function buildPropsPanel(app) {
  const panel = document.createElement('div');
  panel.id = 'props-panel';
  const ts = app.toolState;

  // --- Placement Mode ---
  const modeBody = _section(panel, 'Placement');
  _dropdown(modeBody, ts.props, 'placementMode', { label: 'Mode', options: { 'Place (click)': 'place', 'Paint (brush)': 'paint' } });

  // --- Active slot ---
  const slotBody = _section(panel, 'Active Type');
  function rebuildSlotPicker() {
    slotBody.innerHTML = '';
    const slotOpts = {};
    for (let i = 0; i < ts.propSlots.length; i++) slotOpts[ts.propSlots[i].name] = i;
    if (Object.keys(slotOpts).length === 0) slotOpts['(none)'] = -1;
    _dropdown(slotBody, ts.props, 'activeSlot', { label: 'Active type', options: slotOpts });
  }
  rebuildSlotPicker();

  // --- Import / Primitives ---
  const importBody = _section(panel, 'Import');
  _button(importBody, { title: 'Import GLB...', onClick: async () => { await app.importPropGlb(); rebuildAll(); } });

  const primBody = _section(panel, 'Add Primitive', false);
  for (const shape of ['Cube', 'Sphere', 'Cylinder', 'Plane', 'Cone', 'Torus']) {
    _button(primBody, { title: shape, onClick: () => { app.addPrimitive(shape); rebuildAll(); } });
  }

  const liveBody = _section(panel, 'Add Live Prop', false);
  _button(liveBody, { title: 'Flag', onClick: () => { app.addLiveProp('Flag'); rebuildAll(); } });

  // --- Loaded Props ---
  const loadedBody = _section(panel, 'Loaded Props', false);
  function rebuildLoadedSlots() {
    loadedBody.innerHTML = '';
    ts.propSlots.forEach((slot, i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; flex-direction:column; gap:4px; padding:4px 0; border-bottom:1px solid var(--border);';
      const headerRow = document.createElement('div');
      headerRow.style.cssText = 'display:flex; align-items:center; justify-content:space-between;';
      const label = document.createElement('span');
      label.textContent = slot.name;
      label.style.cssText = 'font-size:12px; color:var(--text);';
      headerRow.appendChild(label);
      const rmBtn = document.createElement('button');
      rmBtn.textContent = 'Remove';
      rmBtn.className = 'prop-row-btn';
      rmBtn.style.cssText = 'font-size:11px; padding:2px 8px; background:var(--bg-item); color:var(--text-dim); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer;';
      rmBtn.addEventListener('click', () => { app.removePropSlot(i); rebuildAll(); });
      headerRow.appendChild(rmBtn);
      row.appendChild(headerRow);
      if (!slot.builtin && !slot.live) {
        const lodRow = document.createElement('div');
        lodRow.style.cssText = 'display:flex; gap:4px;';
        const btnStyle = 'font-size:10px; padding:2px 6px; background:var(--bg-item); color:var(--text-dim); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; flex:1;';
        const lod1Btn = document.createElement('button');
        lod1Btn.textContent = 'Import LOD1';
        lod1Btn.style.cssText = btnStyle;
        lod1Btn.addEventListener('click', async () => { await app.importPropLod(i, 1); });
        lodRow.appendChild(lod1Btn);
        const lod2Btn = document.createElement('button');
        lod2Btn.textContent = 'Import LOD2';
        lod2Btn.style.cssText = btnStyle;
        lod2Btn.addEventListener('click', async () => { await app.importPropLod(i, 2); });
        lodRow.appendChild(lod2Btn);
        row.appendChild(lodRow);
      }
      loadedBody.appendChild(row);
    });
  }
  rebuildLoadedSlots();

  _separator(panel);

  // --- Sink / Gizmo ---
  const gizmoBody = _section(panel, 'Transform');
  _slider(gizmoBody, ts.props, 'sinkOffset', { label: 'Sink offset', min: 0, max: 10, step: 0.1 });
  _dropdown(gizmoBody, ts.props, 'transformMode', {
    label: 'Gizmo [W/E/R]',
    options: { 'Translate (W)': 'translate', 'Rotate (E)': 'rotate', 'Scale (R)': 'scale' },
    onChange: () => app.propTransformModeChanged(),
  });

  _separator(panel);

  // --- Paint Settings ---
  const paintBody = _section(panel, 'Paint Settings');
  _slider(paintBody, ts.props, 'density', { label: 'Density', min: 0.05, max: 5, step: 0.05 });
  _slider(paintBody, ts.props, 'minSpacing', { label: 'Min spacing', min: 0.5, max: 20, step: 0.5 });
  _slider(paintBody, ts.props, 'scaleMin', { label: 'Scale min', min: 0.1, max: 5, step: 0.05 });
  _slider(paintBody, ts.props, 'scaleMax', { label: 'Scale max', min: 0.1, max: 5, step: 0.05 });
  _toggle(paintBody, ts.props, 'randomRotation', { label: 'Random rotation' });

  _separator(panel);

  // --- LOD Distances ---
  const lodBody = _section(panel, 'LOD Distances', false);
  _slider(lodBody, ts.propLod, 'lod0Distance', { label: 'LOD0 → LOD1', min: 10, max: 300, step: 5 });
  _slider(lodBody, ts.propLod, 'lod1Distance', { label: 'LOD1 → LOD2', min: 20, max: 600, step: 10 });
  _slider(lodBody, ts.propLod, 'fadeOutDistance', { label: 'Fade-out dist', min: 50, max: 1500, step: 10 });
  _toggle(lodBody, ts.propLod, 'castShadow', { label: 'Cast shadow', onChange: () => app.propCastShadowChanged() });

  _separator(panel);

  // --- Live Prop Params (shown when a live prop is selected) ---
  const liveParamsContainer = document.createElement('div');
  liveParamsContainer.id = 'live-params-container';
  panel.appendChild(liveParamsContainer);

  function showLiveParamsUi(instIdx) {
    liveParamsContainer.innerHTML = '';
    if (instIdx == null) return;
    const inst = app.propStore.instances[instIdx];
    if (!inst?.liveParams) return;
    const type = app.propStore.types[inst.typeIdx];
    if (!type?.live) return;

    const sec = _section(liveParamsContainer, `${type.name} Params`);
    const p = inst.liveParams;
    const lpm = app.livePropManager;

    function syncParam(key, geometry) {
      if (geometry) {
        app.propStore._bump();
      } else {
        const entry = lpm.getLiveEntry(instIdx);
        if (entry?.obj.setParam) entry.obj.setParam(key, p[key]);
        lpm.updateParamSnap(instIdx);
      }
    }

    if ("flagColor" in p) {
      _color(sec, p, 'flagColor', { label: 'Color', onChange: () => syncParam('flagColor', false) });
    }
    if ("textureUrl" in p) {
      const row = document.createElement('div');
      row.className = 'prop-row';
      row.innerHTML = `<span class="prop-label">Texture</span><div class="prop-value" style="display:flex;gap:4px;align-items:center;"><span class="prop-slider-val" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.textureUrl ? p.textureUrl.split('/').pop() : '(none)'}</span><button class="section-btn" style="padding:2px 8px;font-size:11px;">Import...</button></div>`;
      const btn = row.querySelector('button');
      const label = row.querySelector('.prop-slider-val');
      btn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.addEventListener('change', () => {
          const file = input.files[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          p.textureUrl = url;
          label.textContent = file.name;
          syncParam('textureUrl', false);
        });
        input.click();
      });
      sec.appendChild(row);
    }
    if ("clothWidth" in p) {
      _slider(sec, p, 'clothWidth', { label: 'Cloth width', min: 0.5, max: 6, step: 0.1, onChange: () => syncParam('clothWidth', true) });
    }
    if ("clothHeight" in p) {
      _slider(sec, p, 'clothHeight', { label: 'Cloth height', min: 0.3, max: 8, step: 0.1, onChange: () => syncParam('clothHeight', true) });
    }
    if ("poleHeight" in p) {
      _slider(sec, p, 'poleHeight', { label: 'Pole height', min: 1, max: 12, step: 0.5, onChange: () => syncParam('poleHeight', true) });
    }
    if ("windIntensity" in p) {
      _slider(sec, p, 'windIntensity', { label: 'Wind intensity', min: 0, max: 800, step: 10, onChange: () => syncParam('windIntensity', false) });
    }
    if ("windSpeed" in p) {
      _slider(sec, p, 'windSpeed', { label: 'Wind speed', min: 100, max: 3000, step: 50, onChange: () => syncParam('windSpeed', false) });
    }
    if ("windDirection" in p) {
      _slider(sec, p, 'windDirection', { label: 'Wind direction', min: 0, max: 360, step: 1, onChange: () => syncParam('windDirection', false) });
    }
    if ("showPole" in p) {
      _toggle(sec, p, 'showPole', { label: 'Show pole', onChange: () => syncParam('showPole', false) });
    }
  }

  app.onPropSelectionChanged = showLiveParamsUi;

  _separator(panel);

  // --- Actions ---
  _button(panel, { title: 'Rebake BVH', onClick: () => app.rebakeBvh() });
  _separator(panel);
  _button(panel, { title: 'Delete Selected [Del]', onClick: () => app.deleteSelectedProp() });
  _button(panel, { title: 'Clear All Props', onClick: () => app.clearAllProps() });

  function rebuildAll() {
    rebuildSlotPicker();
    rebuildLoadedSlots();
  }

  panel._rebuildPropUi = rebuildAll;

  return panel;
}

// === Build custom Ambient FX panel ===
function buildAmbientFxPanel(app) {
  const panel = document.createElement('div');
  panel.id = 'ambientfx-panel';
  const afx = app.toolState.ambientFx;
  const cfg = app.config;

  const brushBody = _section(panel, 'Brush');
  _slider(brushBody, app.toolState.brush, 'radius', { label: 'Radius', min: cfg.sculpt.brushMin, max: cfg.sculpt.brushMax, step: 0.5 });

  // Butterfly / Leaf section wrappers (created here, appended below)
  const bfSec = document.createElement('div');
  bfSec.className = 'afx-butterfly-sec';
  const lfSec = document.createElement('div');
  lfSec.className = 'afx-leaf-sec';
  function syncSections() {
    bfSec.style.display = afx.effectType === 'butterflies' ? '' : 'none';
    lfSec.style.display = afx.effectType === 'leaves' ? '' : 'none';
  }

  const body = _section(panel, 'Ambient FX');
  _toggle(body, afx, 'erase', { label: 'Erase (or Shift)' });
  _dropdown(body, afx, 'effectType', { label: 'Effect', options: { 'Butterflies': 'butterflies', 'Falling Leaves': 'leaves' }, onChange: syncSections });
  _separator(body);
  _slider(body, afx, 'emitterRadius', { label: 'Emitter radius', min: 3, max: 40, step: 1 });
  _slider(body, afx, 'density', { label: 'Density', min: 1, max: 10, step: 0.5 });

  // Butterfly params section
  panel.appendChild(bfSec);
  const bfBody = _section(bfSec, 'Butterfly Params', false);
  _slider(bfBody, afx, 'flapSpeed', { label: 'Flap speed', min: 2, max: 20, step: 0.5, onChange: () => app.ambientFxFlapChanged() });
  _slider(bfBody, afx, 'flapAngle', { label: 'Flap angle', min: 0.1, max: 1.5, step: 0.05, onChange: () => app.ambientFxFlapChanged() });
  _slider(bfBody, afx, 'glideRatio', { label: 'Glide ratio', min: 0, max: 0.8, step: 0.05, onChange: () => app.ambientFxFlapChanged() });

  // Leaf params section
  panel.appendChild(lfSec);

  const lfPaint = _section(lfSec, 'Leaf Painting');
  _dropdown(lfPaint, afx, 'leafActiveType', { label: 'Paint type', options: { 'Type 1': 0, 'Type 2': 1, 'Type 3': 2 } });

  const lfBody = _section(lfSec, 'Leaf Physics');
  const lc = () => app.ambientFxLeafChanged();
  _slider(lfBody, afx, 'leafSpawnHeight', { label: 'Spawn height', min: 5, max: 60, step: 1, onChange: lc });
  _slider(lfBody, afx, 'leafScale', { label: 'Scale', min: 0.3, max: 3, step: 0.1, onChange: lc });
  _slider(lfBody, afx, 'leafSize', { label: 'Leaf size', min: 0.05, max: 0.6, step: 0.01, onChange: lc });
  _slider(lfBody, afx, 'leafGravity', { label: 'Gravity', min: 0.0005, max: 0.01, step: 0.0005, onChange: lc });
  _slider(lfBody, afx, 'leafTerminalVelocity', { label: 'Terminal vel.', min: 0.005, max: 0.08, step: 0.002, onChange: lc });
  _slider(lfBody, afx, 'leafRotationSpeed', { label: 'Rotation', min: 0, max: 0.01, step: 0.0005, onChange: lc });
  _slider(lfBody, afx, 'leafAirResistance', { label: 'Air resistance', min: 0.9, max: 0.999, step: 0.001, onChange: lc });
  _slider(lfBody, afx, 'leafWindInfluence', { label: 'Wind influence', min: 0, max: 3, step: 0.05, onChange: lc });
  _slider(lfBody, afx, 'leafOpacity', { label: 'Opacity', min: 0.1, max: 1, step: 0.05, onChange: lc });
  _slider(lfBody, afx, 'leafFloorOffset', { label: 'Floor offset', min: 0, max: 5, step: 0.1, onChange: lc });

  // Leaf types — each type gets its own tint + texture picker
  const ltBody = _section(lfSec, 'Leaf Types');
  for (let i = 0; i < 3; i++) {
    const typeDiv = document.createElement('div');
    typeDiv.style.marginBottom = '6px';
    const typeLabel = document.createElement('div');
    typeLabel.style.cssText = 'font-size:11px;color:#aaa;margin-bottom:2px;padding-left:4px;';
    typeLabel.textContent = 'Type ' + (i + 1);
    typeDiv.appendChild(typeLabel);

    _color(typeDiv, afx, 'leafTint' + i, { label: 'Tint', onChange: lc });

    // Texture file picker
    const texRow = document.createElement('div');
    texRow.className = 'prop-row';
    const texNameSpan = document.createElement('span');
    texNameSpan.className = 'prop-slider-val';
    texNameSpan.style.cssText = 'font-size:10px;overflow:hidden;text-overflow:ellipsis;max-width:100px;';
    texNameSpan.textContent = afx['leafTex' + i] ? 'custom' : 'default';
    const texBtn = document.createElement('button');
    texBtn.className = 'section-btn';
    texBtn.style.cssText = 'font-size:10px;padding:2px 8px;margin:0;';
    texBtn.textContent = 'Texture';
    const texIdx = i;
    texBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        afx['leafTex' + texIdx] = url;
        texNameSpan.textContent = file.name;
        app.ambientFxSetLeafTexture(texIdx, url);
      });
      input.click();
    });
    texRow.innerHTML = '<span class="prop-label">Texture</span>';
    const texVal = document.createElement('div');
    texVal.className = 'prop-value';
    texVal.style.cssText = 'display:flex;gap:4px;align-items:center;';
    texVal.appendChild(texBtn);
    texVal.appendChild(texNameSpan);
    texRow.appendChild(texVal);
    typeDiv.appendChild(texRow);

    ltBody.appendChild(typeDiv);
    if (i < 2) _separator(ltBody);
  }

  _button(lfSec, { title: 'Respawn leaves', onClick: () => app.ambientFxLeafRespawn() });
  _button(lfSec, { title: 'Clear leaf emitters', onClick: () => app.ambientFxClearLeaves() });

  syncSections();

  _separator(panel);
  _toggle(panel, afx, 'showRings', { label: 'Show rings', onChange: () => app.ambientFxRingsChanged() });
  _button(panel, { title: 'Clear all ambient FX', onClick: () => app.ambientFxClear() });

  return panel;
}

// === Build custom Flowers panel ===
function buildFleurPanel(app) {
  const panel = document.createElement('div');
  panel.id = 'fleur-panel';
  const fp = app.toolState.fleur;
  const cfg = app.config;

  const PRESETS = {
    main: { inner: '#fff4b8', outer: '#fb8da0', glow: 0.28 },
    sakura: { inner: '#ffd9ea', outer: '#ff7ab2', glow: 0.32 },
    zeldaBlue: { inner: '#e8fbff', outer: '#7db8ff', glow: 0.24 },
    sunflower: { inner: '#ffe78c', outer: '#ff9f40', glow: 0.26 },
  };

  const brushBody = _section(panel, 'Brush');
  _slider(brushBody, app.toolState.brush, 'radius', { label: 'Radius', min: cfg.sculpt.brushMin, max: cfg.sculpt.brushMax, step: 0.5 });

  const body = _section(panel, 'Flowers');
  _toggle(body, fp, 'erase', { label: 'Erase (or Shift)' });
  _dropdown(body, fp, 'activeSlot', { label: 'Paint color', options: { 'Color A': 0, 'Color B': 1 } });
  _dropdown(body, fp, 'subMode', { label: 'Placement', options: { 'Ground bloom': 'ground', 'Stemmed': 'stem' }, onChange: () => {
    stemSec.style.display = fp.subMode === 'stem' ? '' : 'none';
    hoverSec.style.display = fp.subMode !== 'stem' ? '' : 'none';
    app.fleurChanged();
  }});
  _dropdown(body, fp, 'bloomShape', { label: 'Bloom shape', options: { 'A (mask 1)': 0, 'B (mask 2)': 1, 'C (mask 3)': 2 } });

  // Stem
  const stemBody = _section(panel, 'Stem Colors');
  const stemSec = stemBody.parentElement;
  stemSec.style.display = fp.subMode === 'stem' ? '' : 'none';
  _color(stemBody, fp, 'stemBase', { label: 'Stem base', onChange: () => app.fleurStemChanged() });
  _color(stemBody, fp, 'stemTop', { label: 'Stem top', onChange: () => app.fleurStemChanged() });
  _slider(stemBody, fp, 'stemStaticCurve', { label: 'Stem lean', min: 0, max: 0.25, step: 0.005, onChange: () => app.fleurStemCurveChanged() });

  // Hover
  const hoverBody = _section(panel, 'Hover (ground bloom)');
  const hoverSec = hoverBody.parentElement;
  hoverSec.style.display = fp.subMode !== 'stem' ? '' : 'none';
  _slider(hoverBody, fp, 'hoverBase', { label: 'Base Y', min: 0, max: 2, step: 0.01 });
  _slider(hoverBody, fp, 'hoverVariance', { label: 'Variance', min: 0, max: 1, step: 0.01 });

  // Brush settings
  const fbBody = _section(panel, 'Flower Brush', false);
  _slider(fbBody, fp, 'perStroke', { label: 'Per stroke', min: 1, max: 100, step: 1 });
  _slider(fbBody, fp, 'minSpacing', { label: 'Min spacing', min: 0.1, max: 4, step: 0.05 });
  _slider(fbBody, fp, 'scaleMin', { label: 'Scale min', min: 0.05, max: 3, step: 0.01 });
  _slider(fbBody, fp, 'scaleMax', { label: 'Scale max', min: 0.05, max: 3, step: 0.01 });

  // Color A
  function applyPreset(slot, key) {
    const p = PRESETS[key];
    if (!p) return;
    const c = slot === 'A' ? fp.colorA : fp.colorB;
    c.inner = p.inner; c.outer = p.outer; c.glow = p.glow;
    app.fleurColorChanged(slot);
  }

  function buildColorSection(label, slot, colorObj) {
    const sec = _section(panel, label);
    _dropdown(sec, colorObj, 'preset', { label: 'Preset', options: { 'Main': 'main', 'Sakura': 'sakura', 'Zelda Blue': 'zeldaBlue', 'Sunflower': 'sunflower' }, onChange: () => applyPreset(slot, colorObj.preset) });
    _color(sec, colorObj, 'inner', { label: 'Center color', onChange: () => app.fleurColorChanged(slot) });
    _color(sec, colorObj, 'outer', { label: 'Edge color', onChange: () => app.fleurColorChanged(slot) });
    _slider(sec, colorObj, 'glow', { label: 'Center glow', min: 0, max: 1, step: 0.01, onChange: () => app.fleurColorChanged(slot) });
  }
  buildColorSection('Color A', 'A', fp.colorA);
  buildColorSection('Color B', 'B', fp.colorB);

  // Interaction & Wind
  const intBody = _section(panel, 'Interaction & Wind', false);
  _slider(intBody, fp, 'interactRadius', { label: 'Interact radius', min: 0, max: 5, step: 0.1, onChange: () => app.fleurInteractionChanged() });
  _slider(intBody, fp, 'interactStrength', { label: 'Interact strength', min: 0, max: 2, step: 0.01, onChange: () => app.fleurInteractionChanged() });
  _slider(intBody, fp, 'interactGain', { label: 'Repulse gain', min: 0, max: 3, step: 0.01, onChange: () => app.fleurInteractionChanged() });
  _slider(intBody, fp, 'windAmp', { label: 'Wind amp', min: 0, max: 0.2, step: 0.001, onChange: () => app.fleurInteractionChanged() });
  _slider(intBody, fp, 'windSpeed', { label: 'Wind speed', min: 0, max: 5, step: 0.01, onChange: () => app.fleurInteractionChanged() });

  _separator(panel);
  _button(panel, { title: 'Clear all flowers', onClick: () => app.fleurClear() });

  return panel;
}
