<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytic Fog — Mountain Landscape</title>
    <style>
      :root {
        --bg: #14171c;
        --panel: #1b1f26;
        --panel-hdr: #232832;
        --text: #d7dde6;
        --text-dim: #8a93a3;
        --accent: #6cc1ff;
        --font: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
      canvas { display: block; }

      #panel {
        position: fixed; top: 12px; right: 12px; width: 300px;
        max-height: calc(100vh - 24px); overflow-y: auto;
        background: var(--panel); border: 1px solid #000;
        border-radius: 8px; color: var(--text);
        font-family: var(--font); font-size: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); z-index: 10;
      }
      #panel h1 {
        margin: 0; padding: 11px 13px; font-size: 12px; font-weight: 600;
        letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent);
        border-bottom: 1px solid #000; background: var(--panel-hdr);
      }
      .sec-hdr {
        padding: 8px 13px; font-weight: 600; cursor: pointer;
        background: var(--panel-hdr); border-bottom: 1px solid #0008;
        user-select: none; font-size: 11px; letter-spacing: 0.03em;
      }
      .sec-hdr::before { content: "▾ "; color: var(--text-dim); }
      .sec-hdr.collapsed::before { content: "▸ "; }
      .sec-body { padding: 6px 13px 10px; }
      .sec-body.hidden { display: none; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { flex: 0 0 96px; color: var(--text-dim); }
      .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
      .row .num {
        flex: 0 0 50px; background: #0d0f13; border: 1px solid #000;
        color: var(--text); border-radius: 4px; padding: 2px 4px;
        font-family: var(--font-mono); font-size: 11px;
      }
      .row input[type=color] {
        flex: 0 0 36px; height: 20px; background: none; border: 1px solid #000;
        border-radius: 4px; padding: 0; cursor: pointer;
      }
      .btn {
        display: inline-block; margin: 3px 4px 3px 0; padding: 5px 10px;
        background: #2a3140; color: var(--text); border: 1px solid #000;
        border-radius: 5px; cursor: pointer; font-size: 11px;
      }
      .btn:hover { background: #33414f; }
      .toggle {
        flex: 1; text-align: left; padding: 4px 8px; border-radius: 5px;
        border: 1px solid #000; background: #2a3140; color: var(--text-dim);
        cursor: pointer; font-size: 11px;
      }
      .toggle.on { background: #234a2e; color: #b7f0c4; border-color: #1c3a24; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 10;
        font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
        background: #0009; padding: 6px 10px; border-radius: 6px; line-height: 1.5;
        pointer-events: none;
      }
      #hud b { color: var(--accent); }
      #err {
        position: fixed; left: 12px; top: 12px; z-index: 20; max-width: 420px;
        background: #3a1212; color: #ffb0b0; padding: 10px 12px; border-radius: 6px;
        font-family: var(--font-mono); font-size: 11px; display: none; white-space: pre-wrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="err"></div>
    <div id="panel"><h1>Analytic Fog</h1></div>
    <div id="hud">
      Drag = orbit · Scroll = zoom · Right-drag = pan<br />
      Volumetric fog · Time: <b id="hud-tod">6.5</b>h · FPS <b id="hud-fps">—</b>
    </div>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        Fn, float, vec3, vec4, uniform, color, mix, smoothstep, clamp, pow, dot,
        normalize, length, exp, min, max, int, Loop, If, step,
        positionWorld, normalWorld, screenUV, pass, cameraPosition,
        orthographicDepthToViewZ, viewZToPerspectiveDepth,
        getViewPosition, cameraProjectionMatrixInverse, cameraWorldMatrix,
        cameraNear, cameraFar, sqrt, log, abs, sign, uniformArray, PI,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const errEl = document.getElementById("err");
      function showErr(msg) {
        errEl.style.display = "block";
        errEl.textContent = msg;
        console.error(msg);
      }

      // ─── UI helpers ───────────────────────────────────────────────────────
      const panel = document.getElementById("panel");
      const _refreshers = [];
      function uiRefresh() { _refreshers.forEach((r) => r()); }
      function section(title, expanded = true) {
        const hdr = document.createElement("div");
        hdr.className = "sec-hdr" + (expanded ? "" : " collapsed");
        hdr.textContent = title;
        const body = document.createElement("div");
        body.className = "sec-body" + (expanded ? "" : " hidden");
        hdr.onclick = () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        };
        panel.append(hdr, body);
        return body;
      }
      function slider(parent, obj, key, { label, min, max, step = 0.01, onChange }) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<label>${label}</label>
          <input type="range" min="${min}" max="${max}" step="${step}" value="${obj[key]}">
          <input class="num" type="number" min="${min}" max="${max}" step="${step}" value="${obj[key]}">`;
        const [sl, num] = row.querySelectorAll("input");
        const fire = (v) => { obj[key] = v; sl.value = v; num.value = v; onChange?.(v); };
        sl.oninput = () => fire(parseFloat(sl.value));
        num.onchange = () => fire(parseFloat(num.value));
        parent.appendChild(row);
        _refreshers.push(() => { sl.value = obj[key]; num.value = obj[key]; });
      }
      function colorPick(parent, obj, key, { label, onChange }) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<label>${label}</label><input type="color" value="${obj[key]}">`;
        const inp = row.querySelector("input");
        inp.oninput = () => { obj[key] = inp.value; onChange?.(inp.value); };
        parent.appendChild(row);
      }
      function toggle(parent, obj, key, { label, onChange }) {
        const row = document.createElement("div");
        row.className = "row";
        const btn = document.createElement("button");
        btn.className = "toggle" + (obj[key] ? " on" : "");
        btn.textContent = label;
        btn.onclick = () => {
          obj[key] = !obj[key];
          btn.classList.toggle("on", obj[key]);
          onChange?.(obj[key]);
        };
        row.appendChild(btn);
        parent.appendChild(row);
      }
      function button(parent, label, onClick) {
        const b = document.createElement("button");
        b.className = "btn"; b.textContent = label; b.onclick = onClick;
        parent.appendChild(b);
      }

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ─── layered mountain terrain (reference-style silhouettes) ───────────
      const TERRAIN_SIZE = 1400;
      function sampleHeight(x, z) {
        let h = 0;

        // Distant background massifs
        h += 118 * Math.exp(-(((x * 0.003 - z * 0.0015 + 0.4) * 2.8) ** 2));
        h += 102 * Math.exp(-(((x * 0.0025 + z * 0.002 - 0.6) * 2.4) ** 2));
        h += 88 * Math.exp(-(((x * 0.002 - 0.2) ** 2 + (z * 0.0018 + 0.5) ** 2) * 3.2));

        // Parallel ridgelines — depth layers along Z
        for (let i = -3; i <= 3; i++) {
          const ridgeZ = i * 165;
          const dz = z - ridgeZ;
          const ridge =
            (82 - Math.abs(i) * 6) *
            Math.exp(-((x * 0.0075) ** 2)) *
            Math.exp(-((dz * 0.018) ** 2));
          h = Math.max(h, ridge);
        }

        // Foreground peaks (dark silhouettes in ref. image)
        h += 68 * Math.exp(-(((x + 110) * 0.009) ** 2 + ((z - 90) * 0.011) ** 2));
        h += 58 * Math.exp(-(((x - 160) * 0.0085) ** 2 + ((z + 70) * 0.012) ** 2));
        h += 52 * Math.exp(-(((x + 40) * 0.01) ** 2 + ((z + 180) * 0.013) ** 2));

        // Deep valleys where fog pools
        h -= 38 * Math.exp(-((x * 0.0045) ** 2 + (z * 0.0038) ** 2));
        h -= 28 * Math.exp(-(((x - 80) * 0.005) ** 2 + ((z + 120) * 0.0045) ** 2));
        h -= 22 * Math.exp(-(((x + 140) * 0.0048) ** 2 + ((z - 160) * 0.004) ** 2));

        return Math.max(h, -8);
      }

      function valleyDepth(x, z) {
        const h = sampleHeight(x, z);
        const ring = [-60, 0, 60, 120];
        let maxNeighbor = h;
        for (const dz of ring) {
          maxNeighbor = Math.max(maxNeighbor, sampleHeight(x, z + dz));
        }
        for (const dx of ring) {
          maxNeighbor = Math.max(maxNeighbor, sampleHeight(x + dx, z));
        }
        return maxNeighbor - h;
      }

      // ─── renderer / scene / camera ────────────────────────────────────────
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);

      try {
        await renderer.init();
      } catch (e) {
        showErr("WebGPU init failed:\n" + e.message);
        throw e;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd8e2ec);
      scene.fog = null;

      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 6000);
      camera.position.set(0, 42, 540);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 38, -180);
      controls.maxDistance = 1600;
      controls.maxPolarAngle = Math.PI * 0.52;
      controls.update();

      const sun = new THREE.DirectionalLight("#fff6ea", 2.2);
      sun.position.set(140, 90, 260);
      scene.add(sun);

      const hemi = new THREE.HemisphereLight("#dce8f4", "#6a6660", 0.85);
      scene.add(hemi);

      const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, 320, 320);
      terrainGeo.rotateX(-Math.PI / 2);
      {
        const p = terrainGeo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          p.setY(i, sampleHeight(p.getX(i), p.getZ(i)));
        }
        p.needsUpdate = true;
        terrainGeo.computeVertexNormals();
      }

      const rockDark = uniform(new THREE.Color("#4a4742"));
      const rockMid = uniform(new THREE.Color("#726c64"));
      const rockHi = uniform(new THREE.Color("#9a948a"));
      const uSunDirTerrain = uniform(new THREE.Vector3(0.45, 0.35, 0.82).normalize());
      const terrainMat = new THREE.MeshStandardNodeMaterial({
        roughness: 1.0,
        metalness: 0.0,
      });
      terrainMat.colorNode = Fn(() => {
        const ndl = clamp(normalWorld.dot(uSunDirTerrain).mul(0.5).add(0.5), 0.15, 1);
        const base = mix(rockDark, rockMid, ndl);
        const heightFade = smoothstep(5, 85, positionWorld.y);
        return mix(base, rockHi, heightFade.mul(0.4));
      })();
      const terrain = new THREE.Mesh(terrainGeo, terrainMat);
      scene.add(terrain);

      // Simple sky dome — bright horizon for reference-style haze
      const skyMat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false });
      skyMat.colorNode = Fn(() => {
        const up = clamp(normalWorld.y, 0, 1);
        const zenith = color(0x9eb4cc);
        const horizon = color(0xf2f0ea);
        return mix(horizon, zenith, pow(up, 0.55));
      })();
      const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 32, 16), skyMat);
      sky.frustumCulled = false;
      scene.add(sky);

      // ─── analytic fog volumes ─────────────────────────────────────────────
      const MAX_FOG = 64;
      const FOG = {
        enabled: true,
        density: 0.42,
        scatter: 2.8,
        hg: 0.8,
        maxDist: 1600,
        atmosphere: 0.78,
        atmFalloff: 380,
        profile: 0,
        volumeScale: 1.25,
        strength: 1.5,
        horizon: 0.72,
        color: "#c4c8d0",
        sunColor: "#fff8f0",
        seed: 7711,
        timeOfDay: 6.5,
      };

      const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
      const uFogEnabled = uniform(FOG.enabled ? 1 : 0);
      const uFogDensity = uniform(FOG.density);
      const uFogScatter = uniform(FOG.scatter);
      const uHG = uniform(FOG.hg);
      const uMaxDist = uniform(FOG.maxDist);
      const uFogProfile = uniform(FOG.profile);
      const uVolumeScale = uniform(FOG.volumeScale);
      const uPrimStrength = uniform(FOG.strength);
      const uHorizon = uniform(FOG.horizon);
      const uAtmosphere = uniform(FOG.atmosphere);
      const uAtmFalloff = uniform(FOG.atmFalloff);
      const uFogColor = uniform(lin(FOG.color));
      const uFogSunColor = uniform(lin(FOG.sunColor));
      const uSunDirFog = uniform(new THREE.Vector3(0.3, 0.4, 0.85).normalize());
      const uFogCount = uniform(0);

      const fogCenterData = new Array(MAX_FOG).fill(null).map(() => new THREE.Vector4());
      const fogScaleData = new Array(MAX_FOG).fill(null).map(() => new THREE.Vector4(1, 1, 1, 0));
      const uFogCenters = uniformArray(fogCenterData, "vec4");
      const uFogScales = uniformArray(fogScaleData, "vec4");

      function generateFogVolumes(seed = FOG.seed) {
        const prng = mulberry32(seed);
        const centers = [];

        // Large atmospheric slabs along depth — guaranteed to intersect view rays
        const SLABS = 10;
        for (let i = 0; i < SLABS && centers.length < MAX_FOG; i++) {
          const z = -480 + i * 105;
          const y = 14 + i * 16;
          centers.push({
            center: new THREE.Vector4(0, y, z, 1.5 + i * 0.04),
            scale: new THREE.Vector4(
              TERRAIN_SIZE * 0.5,
              40 + i * 6,
              TERRAIN_SIZE * 0.42,
              1,
            ),
          });
        }

        // Valley fog banks
        for (let layer = 0; layer < 8 && centers.length < MAX_FOG; layer++) {
          const layerZ = -520 + layer * 115 + (prng() - 0.5) * 50;
          const layerCount = 4 + Math.floor(prng() * 3);
          for (let n = 0; n < layerCount && centers.length < MAX_FOG; n++) {
            const x = (n - layerCount * 0.5) * 130 + (prng() - 0.5) * 90;
            const z = layerZ + (prng() - 0.5) * 70;
            if (Math.abs(x) > TERRAIN_SIZE * 0.44) continue;

            const h = sampleHeight(x, z);
            const depth = valleyDepth(x, z);
            if (depth < 4 && layer > 2) continue;

            const y = h + 4 + depth * 0.2 + prng() * 10;
            const sx = 90 + prng() * 110;
            const sy = 28 + prng() * 35 + depth * 0.3;
            const sz = 70 + prng() * 90;
            const strength = 0.65 + prng() * 0.5 + depth * 0.02;

            centers.push({
              center: new THREE.Vector4(x, y, z, strength),
              scale: new THREE.Vector4(sx, sy, sz, 1),
            });
          }
        }

        // Extra fill in valleys
        for (let i = 0; i < 60 && centers.length < MAX_FOG; i++) {
          const x = (prng() - 0.5) * TERRAIN_SIZE * 0.75;
          const z = (prng() - 0.5) * TERRAIN_SIZE * 0.55;
          const depth = valleyDepth(x, z);
          if (depth < 6) continue;
          const h = sampleHeight(x, z);
          centers.push({
            center: new THREE.Vector4(x, h + 6 + prng() * 12, z, 0.85 + depth * 0.02),
            scale: new THREE.Vector4(80 + prng() * 60, 30 + prng() * 25, 70 + prng() * 50, 1),
          });
        }

        for (let i = 0; i < MAX_FOG; i++) {
          if (i < centers.length) {
            fogCenterData[i].copy(centers[i].center);
            fogScaleData[i].copy(centers[i].scale);
          } else {
            fogCenterData[i].set(0, -9999, 0, 0);
            fogScaleData[i].set(1, 1, 1, 0);
          }
        }
        uFogCount.value = Math.min(centers.length, MAX_FOG);
        return uFogCount.value;
      }
      generateFogVolumes();
      const fogVolumeCount = uFogCount.value;

      const erfApprox = Fn(([z]) => {
        const az = abs(z);
        const poly = float(0.278393).add(
          az.mul(float(0.230389).add(az.mul(float(0.000972).add(az.mul(0.078108))))),
        );
        return sign(z).mul(float(1).sub(float(1).div(pow(float(1).add(az.mul(poly)), 4))));
      });

      const antiderivativeQuartic = Fn(([a, b, c, t]) =>
        t.mul(
          t.mul(
            t.mul(
              t.mul(a.mul(a).mul(t).div(5).add(a.mul(b))).add(
                b.mul(b).mul(2).add(a.mul(c)).sub(a).mul(2).div(3),
              ),
            ).add(b.mul(c).sub(b).mul(2)),
          ).add(c.mul(c).sub(c.mul(2)).add(1)),
        ),
      );

      const antiderivativeGaussian = Fn(([a, b, c, t]) => {
        const sqrtA = sqrt(a.max(1e-8));
        return sqrt(PI)
          .mul(exp(b.mul(b).div(a.max(1e-8)).sub(c)))
          .mul(erfApprox(a.mul(t).add(b).div(sqrtA)))
          .div(sqrtA.mul(2));
      });

      const antiderivativeSpiky = Fn(([a, b, c, t]) => {
        const aa = a.max(1e-8);
        const u = t.add(b.div(aa));
        const v = b.mul(b).sub(aa.mul(c)).div(aa.mul(aa));
        const radical = sqrt(max(u.mul(u).sub(v), 0.0));
        return t
          .mul(t.mul(t.mul(aa).div(3).add(b)).add(c).add(1))
          .sub(sqrt(aa).mul(u.mul(radical).sub(v.mul(log(float(0.001).add(u).add(radical))))));
      });

      const integrateProfile = Fn(([a, b, c, segLen]) => {
        const q0 = antiderivativeQuartic(a, b, c, float(0));
        const g0 = antiderivativeGaussian(a, b, c, float(0));
        const s0 = antiderivativeSpiky(a, b, c, float(0));
        const q = antiderivativeQuartic(a, b, c, segLen).sub(q0);
        const g = antiderivativeGaussian(a, b, c, segLen).sub(g0);
        const s = antiderivativeSpiky(a, b, c, segLen).sub(s0);
        const isQ = uFogProfile.lessThan(0.5);
        const isG = uFogProfile.greaterThan(0.5).and(uFogProfile.lessThan(1.5));
        return isQ.select(q, isG.select(g, s));
      });

      const hgPhase = Fn(([g, mu]) => {
        const gg = g.mul(g);
        const denom = float(1).add(gg).sub(g.mul(mu).mul(2)).max(0.0001);
        return float(1).sub(gg).div(pow(denom, 1.5)).mul(1 / (4 * Math.PI));
      });

      const primitiveTau = Fn(([camPos, dir, endDist, center, scale, strength]) => {
        const ro = camPos.sub(center).div(scale.max(0.001));
        const rd = dir.div(scale.max(0.001));
        const a = dot(rd, rd).max(1e-8);
        const b = dot(rd, ro);
        const c = dot(ro, ro);
        const disc = b.mul(b).sub(a.mul(c.sub(1)));
        const tau = float(0).toVar();

        If(disc.greaterThanEqual(0), () => {
          const sd = sqrt(disc);
          const tNear = b.negate().sub(sd).div(a);
          const tFar = b.negate().add(sd).div(a);
          const t0 = max(tNear, 0);
          const t1 = min(tFar, endDist);
          If(t1.greaterThan(t0), () => {
            const segLen = t1.sub(t0);
            const b2 = b.add(a.mul(t0));
            const c2 = c.add(b.mul(t0).mul(2)).add(a.mul(t0).mul(t0));
            tau.assign(
              integrateProfile(a, b2, c2, segLen).mul(strength).mul(uPrimStrength),
            );
          });
        });
        return max(tau, 0);
      });

      const postProcessing = new THREE.RenderPipeline(renderer);
      const scenePass = pass(scene, camera);
      const scenePassColor = scenePass.getTextureNode
        ? scenePass.getTextureNode("output")
        : scenePass.getTextureNode();

      const volumetricFog = Fn(([inColor]) => {
        const ld = scenePass.getLinearDepthNode();
        const skyMask = step(float(0.999), ld);
        const viewZ = orthographicDepthToViewZ(ld, cameraNear, cameraFar);
        const perspD = viewZToPerspectiveDepth(viewZ, cameraNear, cameraFar);
        const viewPos = getViewPosition(screenUV, perspD, cameraProjectionMatrixInverse);
        const worldPos = cameraWorldMatrix.mul(vec4(viewPos, 1)).xyz;
        const camPos = cameraPosition;
        const dir = normalize(worldPos.sub(camPos));
        const surfDist = length(worldPos.sub(camPos));
        const endDist = mix(min(surfDist, uMaxDist), uMaxDist, skyMask);

        const phase = hgPhase(uHG, dot(dir, uSunDirFog));
        const ambientLi = vec3(uFogColor);
        const sunLi = vec3(uFogSunColor).mul(phase).mul(uFogScatter);

        const totalTau = float(0).toVar();
        const scatter = vec3(0).toVar();

        Loop({ start: int(0), end: int(MAX_FOG), type: "int", condition: "<" }, ({ i }) => {
          const active = float(i).lessThan(uFogCount).select(float(1), float(0));
          const center = uFogCenters.element(i).xyz;
          const strength = uFogCenters.element(i).w;
          const scale = uFogScales.element(i).xyz.mul(uVolumeScale).max(0.001);
          const tau = primitiveTau(camPos, dir, endDist, center, scale, strength).mul(active);

          const toCenter = normalize(center.sub(camPos));
          const sunAmt = dot(toCenter, uSunDirFog).mul(0.5).add(0.5);
          const primLi = mix(ambientLi, sunLi, sunAmt);
          scatter.addAssign(tau.mul(primLi));
          totalTau.addAssign(tau);
        });

        const tauExt = totalTau.mul(uFogDensity);
        const T = exp(tauExt.negate());
        const scatterColor = scatter.div(totalTau.max(0.0001));
        const volFoggy = inColor.rgb.mul(T).add(scatterColor.mul(float(1).sub(T)));

        const horizonMu = dot(dir, uSunDirFog).mul(0.5).add(0.5);
        const horizonGlow = mix(vec3(uFogColor), vec3(uFogSunColor), horizonMu);
        const atmAmt = float(1).sub(exp(endDist.div(uAtmFalloff).negate())).mul(uAtmosphere);
        const skyHaze = pow(float(1).sub(abs(dir.y)), 2.2).mul(uHorizon).mul(skyMask);
        const withAtm = mix(volFoggy, horizonGlow, atmAmt);
        const finalFoggy = mix(withAtm, horizonGlow, skyHaze);

        return vec4(mix(inColor.rgb, finalFoggy, uFogEnabled), inColor.a);
      });

      postProcessing.outputNode = volumetricFog(scenePassColor);

      try {
        await renderer.compileAsync(scene, camera);
      } catch (e) {
        showErr("Shader compile failed:\n" + e.message);
        throw e;
      }

      // ─── lighting (sun angle drives fog + terrain) ────────────────────────
      const SKY_TILT = 0.22;
      const _sunDir = new THREE.Vector3();

      function worldSunDirFromTime(t, out) {
        const ang = (t / 24) * Math.PI * 2;
        return out.set(Math.sin(ang), -Math.cos(ang), SKY_TILT).normalize();
      }

      function driveWorldLighting() {
        worldSunDirFromTime(FOG.timeOfDay, _sunDir);
        const sunUp = _sunDir.y;
        sun.position.copy(_sunDir).multiplyScalar(500);
        sun.intensity = 2.4 * THREE.MathUtils.smoothstep(sunUp, -0.08, 0.15);
        uSunDirFog.value.copy(_sunDir);
        uSunDirTerrain.value.copy(_sunDir);
      }
      driveWorldLighting();

      // ─── controls ─────────────────────────────────────────────────────────
      {
        const s1 = section("Time of Day");
        slider(s1, FOG, "timeOfDay", {
          label: "Hour", min: 0, max: 24, step: 0.1,
          onChange: (v) => {
            document.getElementById("hud-tod").textContent = v.toFixed(1);
            driveWorldLighting();
          },
        });
        const presets = document.createElement("div");
        s1.appendChild(presets);
        const setTOD = (h) => {
          FOG.timeOfDay = h;
          uiRefresh();
          document.getElementById("hud-tod").textContent = h.toFixed(1);
          driveWorldLighting();
        };
        button(presets, "Dawn", () => setTOD(6.2));
        button(presets, "Morning", () => setTOD(8.5));
        button(presets, "Dusk", () => setTOD(18.0));

        const s2 = section("Fog — Atmosphere");
        toggle(s2, FOG, "enabled", {
          label: "Fog enabled",
          onChange: (v) => { uFogEnabled.value = v ? 1 : 0; },
        });
        slider(s2, FOG, "atmosphere", { label: "Distance haze", min: 0, max: 1, step: 0.01,
          onChange: (v) => (uAtmosphere.value = v) });
        slider(s2, FOG, "atmFalloff", { label: "Haze range", min: 100, max: 900, step: 10,
          onChange: (v) => (uAtmFalloff.value = v) });
        slider(s2, FOG, "horizon", { label: "Horizon glow", min: 0, max: 1, step: 0.01,
          onChange: (v) => (uHorizon.value = v) });
        slider(s2, FOG, "maxDist", { label: "Max distance", min: 200, max: 2000, step: 25,
          onChange: (v) => (uMaxDist.value = v) });

        const s2b = section("Fog — Volumes");
        slider(s2b, FOG, "density", { label: "Vol. density", min: 0, max: 1.5, step: 0.01,
          onChange: (v) => (uFogDensity.value = v) });
        slider(s2b, FOG, "strength", { label: "Prim strength", min: 0.2, max: 3, step: 0.05,
          onChange: (v) => (uPrimStrength.value = v) });
        slider(s2b, FOG, "volumeScale", { label: "Volume scale", min: 0.5, max: 2.5, step: 0.05,
          onChange: (v) => (uVolumeScale.value = v) });
        {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<label>Profile</label>`;
          const sel = document.createElement("select");
          sel.style.cssText = "flex:1;background:#0d0f13;color:var(--text);border:1px solid #000;border-radius:4px;padding:3px 6px;font-size:11px;";
          ["Quartic", "Gaussian", "Spiky"].forEach((name, i) => {
            const opt = document.createElement("option");
            opt.value = i; opt.textContent = name;
            if (i === FOG.profile) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.onchange = () => {
            FOG.profile = parseInt(sel.value, 10);
            uFogProfile.value = FOG.profile;
          };
          row.appendChild(sel);
          s2b.appendChild(row);
        }
        {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<label>Volumes</label><span id="fog-vol-count" style="color:var(--text-dim);font-family:var(--font-mono);">${fogVolumeCount} / ${MAX_FOG}</span>`;
          s2b.appendChild(row);
        }
        button(s2b, "Regenerate volumes", () => {
          FOG.seed = (FOG.seed + 997) | 0;
          const n = generateFogVolumes(FOG.seed);
          document.getElementById("fog-vol-count").textContent = `${n} / ${MAX_FOG}`;
        });

        const s3 = section("Fog — Light");
        slider(s3, FOG, "scatter", { label: "Sun scatter", min: 0, max: 6, step: 0.05,
          onChange: (v) => (uFogScatter.value = v) });
        slider(s3, FOG, "hg", { label: "Forward (HG)", min: 0, max: 0.94, step: 0.01,
          onChange: (v) => (uHG.value = v) });
        colorPick(s3, FOG, "color", { label: "Ambient",
          onChange: (v) => { uFogColor.value.copy(lin(v)); } });
        colorPick(s3, FOG, "sunColor", { label: "Sun tint",
          onChange: (v) => { uFogSunColor.value.copy(lin(v)); } });
      }

      const timer = new THREE.Timer();
      let fpsT = 0, fpsN = 0;
      renderer.setAnimationLoop(() => {
        timer.update();
        const dt = Math.min(timer.getDelta(), 0.05);
        const t = timer.getElapsed();
        controls.update();
        postProcessing.render();
        fpsN++; fpsT += dt;
        if (fpsT >= 0.5) {
          document.getElementById("hud-fps").textContent = Math.round(fpsN / fpsT);
          fpsT = 0; fpsN = 0;
        }
      });

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
