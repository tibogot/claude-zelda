<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine editor — instanced rings + card shaping</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #9ec8e8;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 12px;
        color: rgba(30, 50, 80, 0.75);
        pointer-events: none;
        text-align: center;
        max-width: 92vw;
      }
      #title {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 5;
        font-size: 14px;
        font-weight: 600;
        color: rgba(40, 60, 100, 0.85);
        pointer-events: none;
      }
      :root {
        --bg-dark: #222222;
        --bg-panel: #2a2a2a;
        --bg-item: #333333;
        --bg-hover: #3a3a3a;
        --bg-input: #1e1e1e;
        --border: #3c3c3c;
        --border-light: #4a4a4a;
        --text: #cccccc;
        --text-dim: #888888;
        --text-bright: #e0e0e0;
        --accent: #4a9eff;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "Cascadia Code", "Fira Code", Consolas, monospace;
        --radius: 4px;
      }
      #ui {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 20;
        width: 320px;
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        user-select: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #ui .panel-header {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        min-height: 36px;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: var(--text-bright);
        flex-shrink: 0;
      }
      #ui-scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #ui-scroll::-webkit-scrollbar {
        width: 8px;
      }
      #ui-scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .inspector-section {
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-dim);
      }
      .section-header:hover {
        background: var(--bg-hover);
      }
      .section-header .section-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .section-header.collapsed .section-arrow {
        transform: rotate(-90deg);
      }
      .section-body {
        padding: 6px 12px 10px;
      }
      .section-body.hidden {
        display: none;
      }
      .prop-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .prop-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
        line-height: 1.2;
      }
      .prop-value {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
        min-width: 0;
      }
      .prop-color-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      .prop-color {
        width: 22px;
        height: 22px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        cursor: pointer;
        padding: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .prop-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .prop-color::-webkit-color-swatch {
        border: none;
        border-radius: 2px;
      }
      .prop-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .prop-num-input {
        width: 72px;
        height: 22px;
        flex-shrink: 0;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 5px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-mono);
        text-align: right;
        outline: none;
      }
      .prop-num-input:focus {
        border-color: var(--accent);
      }
      .prop-num-input::-webkit-outer-spin-button,
      .prop-num-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .prop-num-input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .prop-slider {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg-input);
        border-radius: 2px;
        outline: none;
        min-width: 0;
      }
      .prop-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .prop-dropdown {
        flex: 1;
        height: 22px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 6px;
        color: var(--text);
        font-size: 12px;
        font-family: var(--font);
        outline: none;
        cursor: pointer;
        min-width: 0;
      }
      .prop-dropdown:focus {
        border-color: var(--accent);
      }
      .prop-toggle {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border-light);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        color: transparent;
      }
      .prop-toggle.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .prop-toggle svg {
        width: 10px;
        height: 10px;
      }
      .section-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 26px;
        margin-top: 4px;
        background: var(--bg-item);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
      }
      .section-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--border-light);
      }
      .info-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .info-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
      }
      .info-value {
        flex: 1;
        font-size: 11px;
        color: var(--text);
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="ui">
      <div class="panel-header">Pine card + trunk</div>
      <div id="ui-scroll"></div>
    </div>
    <div id="title">Pine — 5 cards / ring · 7 levels (default) · pivot on trunk</div>
    <div id="hint">
      Pine: foliage + optional instanced branches (trunk-axis pivot). Toggle “Branches → enable”. Single card: use position + rotation.
    </div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      const DEG = Math.PI / 180;

      const _checkSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      const _arrowSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';

      function _fmt(v, step) {
        if (step >= 1) return String(Math.round(v));
        const d = Math.max(0, -Math.floor(Math.log10(step)));
        return v.toFixed(d);
      }

      function _clampSnap(v, min, max, step) {
        if (!Number.isFinite(v)) return min;
        const n = Math.round((v - min) / step);
        let out = min + n * step;
        const stepStr = String(step);
        let decimals = 0;
        if (stepStr.includes(".")) {
          decimals = stepStr.split(".")[1].length;
        } else if (stepStr.includes("e-")) {
          decimals = 8;
        }
        if (decimals > 0) out = Number(out.toFixed(decimals));
        return Math.min(max, Math.max(min, out));
      }

      function _section(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr);
        sec.appendChild(body);
        parent.appendChild(sec);
        return body;
      }

      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><input type="number" class="prop-num-input" title="Type an exact value" min="${min}" max="${max}" step="${step}" value="${_fmt(cur, step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        const syncNumDisplay = () => {
          num.value = _fmt(obj[key], step);
        };
        const applyFromSlider = () => {
          obj[key] = parseFloat(sl.value);
          syncNumDisplay();
          onChange?.();
        };
        const commitFromNum = () => {
          const raw = String(num.value).trim();
          if (raw === "" || raw === "-" || raw === "." || raw === "-.") {
            syncNumDisplay();
            return;
          }
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) {
            syncNumDisplay();
            return;
          }
          v = _clampSnap(v, min, max, step);
          obj[key] = v;
          sl.value = String(v);
          syncNumDisplay();
          onChange?.();
        };
        sl.addEventListener("input", applyFromSlider);
        num.addEventListener("change", commitFromNum);
        num.addEventListener("keydown", (e) => {
          if (e.key === "Enter") num.blur();
        });
        parent.appendChild(row);
      }

      function _color(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"><span style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">${obj[key]}</span></div></div>`;
        const inp = row.querySelector(".prop-color");
        const hex = row.querySelector("span");
        inp.addEventListener("input", () => {
          obj[key] = inp.value;
          hex.textContent = inp.value;
          onChange?.();
        });
        parent.appendChild(row);
      }

      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button type="button" class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.();
        });
        parent.appendChild(row);
      }

      function _dropdown(parent, obj, key, opts) {
        const { label, options, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        let optHtml = "";
        for (const [text, val] of Object.entries(options)) {
          optHtml += `<option value="${val}" ${obj[key] === val ? "selected" : ""}>${text}</option>`;
        }
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><select class="prop-dropdown">${optHtml}</select></div>`;
        const sel = row.querySelector(".prop-dropdown");
        const isNum = typeof obj[key] === "number";
        sel.addEventListener("change", () => {
          obj[key] = isNum ? Number(sel.value) : sel.value;
          onChange?.();
        });
        parent.appendChild(row);
      }

      function _button(parent, opts) {
        const { title, onClick } = opts;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "section-btn";
        btn.textContent = title;
        btn.addEventListener("click", onClick);
        parent.appendChild(btn);
      }

      function _info(parent, label, getValue) {
        const row = document.createElement("div");
        row.className = "info-row";
        const valSpan = document.createElement("span");
        valSpan.className = "info-value";
        valSpan.textContent = getValue();
        row.innerHTML = `<span class="info-label">${label}</span>`;
        row.appendChild(valSpan);
        parent.appendChild(row);
        return {
          update(v) {
            valSpan.textContent = v;
          },
        };
      }
      const _v3 = new THREE.Vector3();
      const _euler = new THREE.Euler();
      const _qCard = new THREE.Quaternion();
      const _qAz = new THREE.Quaternion();
      const _qOut = new THREE.Quaternion();
      const _dummy = new THREE.Object3D();
      const _yAxis = new THREE.Vector3(0, 1, 0);

      function trunkRadiusAtWorldY(y, trunk) {
        const H = Math.max(0.15, trunk.height);
        const y0 = trunk.yOffset;
        const f = THREE.MathUtils.clamp((y - y0) / H, 0, 1);
        return THREE.MathUtils.lerp(trunk.radiusBottom, trunk.radiusTop, f);
      }

      /** Rotate UVs in 90° steps (geometry.rotateY does not update uv). */
      function rotateGeometryUV(geo, quarterTurns) {
        const uv = geo.attributes.uv;
        if (!uv) return;
        const n = ((Math.round(quarterTurns) % 4) + 4) % 4;
        if (n === 0) return;
        for (let i = 0; i < uv.count; i++) {
          let u = uv.getX(i);
          let v = uv.getY(i);
          for (let t = 0; t < n; t++) {
            const nu = v;
            const nv = 1 - u;
            u = nu;
            v = nv;
          }
          uv.setXY(i, u, v);
        }
        uv.needsUpdate = true;
      }

      function applyMapTransform(tex, matParams) {
        if (!tex) return;
        const ru = matParams.texRepeatU ?? 1;
        const rv = matParams.texRepeatV ?? 1;
        let su = ru;
        let sv = rv;
        if (matParams.texFlipH) su = -Math.abs(ru);
        if (matParams.texFlipV) sv = -Math.abs(rv);
        tex.center.set(0.5, 0.5);
        tex.rotation = (matParams.texRotDeg ?? 0) * DEG;
        tex.repeat.set(su, sv);
        tex.offset.set(matParams.texOffsetU ?? 0, matParams.texOffsetV ?? 0);
        if (matParams.texFlipH) tex.offset.x += Math.abs(ru);
        if (matParams.texFlipV) tex.offset.y += Math.abs(rv);
        const tiled = ru !== 1 || rv !== 1 || matParams.texFlipH || matParams.texFlipV;
        tex.wrapS = tiled ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
        tex.wrapT = tiled ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;
      }

      /**
       * Build in centered XY (normal +Z), deform, move chosen edge midpoint to origin, then rotate +90° Y so:
       * — plane is perpendicular to trunk (world Y): lies in XZ… after rot, spans Y + tangential Z, normal ≈ −X toward trunk.
       * — pivot sits on the short-edge center (default: left edge if width ≥ height) for a clean trunk attach.
       */
      function createRectangleGeometry(w, h, segX, segY, shape, pivotEdge) {
        const {
          bendX,
          bendY,
          skewX,
          skewY,
          taperX,
        } = shape;
        const geo = new THREE.PlaneGeometry(w, h, segX, segY);
        const pos = geo.attributes.position;
        const hw = w * 0.5;
        const hh = h * 0.5;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          const nx = hw > 1e-6 ? x / hw : 0;
          const ny = hh > 1e-6 ? y / hh : 0;
          const scaleX = 1 + taperX * ny;
          x *= scaleX;
          x += skewX * ny * hh;
          y += skewY * nx * hw;
          let z = pos.getZ(i);
          z += bendX * nx * nx;
          z += bendY * ny * ny;
          pos.setXYZ(i, x, y, z);
        }

        let edge = pivotEdge;
        if (edge === "auto") edge = w >= h ? "left" : "bottom";
        let px = 0;
        let py = 0;
        const pz = 0;
        switch (edge) {
          case "bottom":
            px = 0;
            py = hh;
            break;
          case "top":
            px = 0;
            py = -hh;
            break;
          case "left":
            px = hw;
            py = 0;
            break;
          case "right":
            px = -hw;
            py = 0;
            break;
          default:
            px = hw;
            py = 0;
        }
        for (let i = 0; i < pos.count; i++) {
          pos.setXYZ(i, pos.getX(i) + px, pos.getY(i) + py, pos.getZ(i) + pz);
        }

        geo.rotateY(Math.PI / 2);
        rotateGeometryUV(geo, 1);
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
      }

      /** Stylized branch: tapered cylinder along +Y, base at origin, quadratic bend in +Z (droops after card-style tilt). */
      function createBranchGeometry(length, radiusBottom, radiusTop, radialSegs, heightSegs, bend) {
        const L = Math.max(0.08, length);
        const r0 = Math.max(0.004, radiusBottom);
        const r1 = Math.max(0.004, radiusTop);
        const rs = Math.max(3, Math.round(radialSegs));
        const hs = Math.max(1, Math.round(heightSegs));
        const geo = new THREE.CylinderGeometry(r1, r0, L, rs, hs);
        geo.translate(0, L * 0.5, 0);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          let z = pos.getZ(i);
          const t = L > 1e-6 ? THREE.MathUtils.clamp(y / L, 0, 1) : 0;
          z += bend * t * t;
          pos.setXYZ(i, x, y, z);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
      }

      function instanceScaleJitter(idx, amount) {
        const s = Math.sin(idx * 12.9898) * 43758.5453;
        return (s - Math.floor(s) - 0.5) * 2 * amount;
      }

      function makeCheckerTexture() {
        const t = new THREE.CanvasTexture(
          (() => {
            const c = document.createElement("canvas");
            c.width = c.height = 256;
            const g = c.getContext("2d");
            const n = 8;
            const s = 256 / n;
            for (let j = 0; j < n; j++) {
              for (let i = 0; i < n; i++) {
                g.fillStyle = (i + j) % 2 ? "#c8d8e8" : "#f0f4f8";
                g.fillRect(i * s, j * s, s, s);
              }
            }
            g.strokeStyle = "rgba(60,80,120,0.35)";
            g.lineWidth = 1;
            for (let k = 0; k <= n; k++) {
              g.beginPath();
              g.moveTo(0, k * s);
              g.lineTo(256, k * s);
              g.stroke();
              g.beginPath();
              g.moveTo(k * s, 0);
              g.lineTo(k * s, 256);
              g.stroke();
            }
            return c;
          })()
        );
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(4, 4);
        t.colorSpace = THREE.SRGBColorSpace;
        t.needsUpdate = true;
        return t;
      }

      (async () => {
        const params = {
          rect: {
            width: 2,
            height: 0.95,
            /** auto | left | right | bottom | top — short edge recommended for trunk hook */
            pivotEdge: "auto",
          },
          /** Pine card: subdivide along width (bough) for bendX; height needs segY≥2 for bendY (ny² needs ny=0). */
          grid: {
            segX: 5,
            segY: 2,
          },
          shape: {
            bendX: 0.14,
            bendY: -0.2,
            skewX: 0,
            skewY: 0,
            taperX: 0,
          },
          transform: {
            posX: 0.01,
            posY: 1.35,
            posZ: 0,
            rotXDeg: -11.5,
            rotYDeg: 0,
            rotZDeg: 90,
          },
          foliage: {
            layout: "pine",
            levels: 7,
            perRing: 5,
            baseY: 1.96,
            stepY: 0.44,
            scaleBottom: 0.94,
            scaleTop: 0.32,
            scalePower: 1.15,
            globalScale: 1,
            radialInset: 0.02,
            /** 0 = pivot on trunk axis (centered from top); 1 = pivot on surface at this azimuth (old behavior) */
            pivotAlongRadius: 0,
            azimuthOffsetDeg: 0,
            staggerDeg: 0,
            offsetX: 0,
            offsetY: 0,
            offsetZ: 0,
          },
          trunk: {
            height: 4,
            radiusBottom: 0.14,
            radiusTop: 0.04,
            yOffset: 0.66,
            color: "#3d2e22",

        function quaternionForAzimuth(thetaRad) {
          const t = params.transform;
          _euler.set(t.rotXDeg * DEG, t.rotYDeg * DEG, t.rotZDeg * DEG, "XYZ");
          _qCard.setFromEuler(_euler);
          _qAz.setFromAxisAngle(_yAxis, thetaRad);
          return _qOut.copy(_qAz).multiply(_qCard);

        function quaternionForBranchAzimuth(thetaRad) {
          const b = params.branches;
          _euler.set(b.rotXDeg * DEG, b.rotYDeg * DEG, b.rotZDeg * DEG, "XYZ");
          _qCard.setFromEuler(_euler);
          _qAz.setFromAxisAngle(_yAxis, thetaRad);
          return _qOut.copy(_qAz).multiply(_qCard);

        function updateBranchMatrices() {
          if (!branchesObject) return;
          const b = params.branches;
          const tr = params.trunk;
          const levels = Math.max(1, Math.round(b.levels));
          const perRing = Math.max(1, Math.round(b.perRing));
          const count = levels * perRing;
          if (branchesObject.count !== count) return;

          const pow = Math.max(0.05, b.scalePower);
          const gScale = Number.isFinite(b.globalScale) && b.globalScale > 0 ? b.globalScale : 1;
          const varAmt = Math.max(0, b.scaleVariation);

          let idx = 0;
          for (let level = 0; level < levels; level++) {
            const tLin = levels <= 1 ? 0 : level / (levels - 1);
            const u = Math.pow(tLin, pow);
            const sRing = (b.scaleBottom * (1 - u) + b.scaleTop * u) * gScale;
            const y = b.baseY + level * b.stepY + b.offsetY;
            const R = Math.max(0.001, trunkRadiusAtWorldY(y, tr) - b.radialInset);
            const along = THREE.MathUtils.clamp(
              Number.isFinite(b.pivotAlongRadius) ? b.pivotAlongRadius : 0,
              0,
              1
            );

            for (let k = 0; k < perRing; k++) {
              const thetaDeg =
                b.azimuthOffsetDeg + (k * 360) / perRing + b.staggerDeg * level;
              const theta = thetaDeg * DEG;
              const cx = Math.cos(theta);
              const sz = Math.sin(theta);

              const px = along * R * cx + b.offsetX;
              const pz = along * R * sz + b.offsetZ;
              const jitter = 1 + instanceScaleJitter(idx, varAmt);
              _dummy.position.set(px, y, pz);
              _dummy.quaternion.copy(quaternionForBranchAzimuth(theta));
              _dummy.scale.setScalar(sRing * jitter);
              _dummy.updateMatrix();
              branchesObject.setMatrixAt(idx++, _dummy.matrix);
            }
          }
          branchesObject.instanceMatrix.needsUpdate = true;
        }

          const f = params.foliage;

          const pow = Math.max(0.05, f.scalePower);
          const gScale = Number.isFinite(f.globalScale) && f.globalScale > 0 ? f.globalScale : 1;

          let idx = 0;
          for (let level = 0; level < levels; level++) {
            const tLin = levels <= 1 ? 0 : level / (levels - 1);
            const u = Math.pow(tLin, pow);
            const s =
              (f.scaleBottom * (1 - u) + f.scaleTop * u) * gScale;
            const y = f.baseY + level * f.stepY + f.offsetY;
            const R = Math.max(0.001, trunkRadiusAtWorldY(y, tr) - f.radialInset);
            const along = THREE.MathUtils.clamp(

            for (let k = 0; k < perRing; k++) {

        _slider(sBr, b, "bend", { label: "bend (+ droop)", min: -1.5, max: 1.5, step: 0.02, onChange: onBranchGeom });
        _slider(sBr, b, "rotXDeg", { label: "tilt X °", min: -180, max: 180, step: 0.5, onChange: onBranchLayout });
        _slider(sBr, b, "rotYDeg", { label: "tilt Y °", min: -180, max: 180, step: 0.5, onChange: onBranchLayout });
        _slider(sBr, b, "rotZDeg", { label: "tilt Z °", min: -180, max: 180, step: 0.5, onChange: onBranchLayout });
        _color(sBr, b, "color", { label: "color", onChange: onBranchMat });
        _slider(sBr, b, "roughness", { label: "roughness", min: 0, max: 1, step: 0.02, onChange: onBranchMat });

        const sRect = _section(uiRoot, "Rectangle (pivot = short edge)", true);
        _slider(sRect, r, "width", { label: "width", min: 0.1, max: 8, step: 0.05, onChange: onGeom });
        _slider(sRect, r, "height", { label: "height", min: 0.1, max: 8, step: 0.05, onChange: onGeom });
        _dropdown(sRect, r, "pivotEdge", {
          label: "pivot edge",
          options: { auto: "auto", left: "left", right: "right", bottom: "bottom", top: "top" },
          onChange: onGeom,
        });

        const sGrid = _section(uiRoot, "Subdivision (UV grid)", true);
        _slider(sGrid, g, "segX", { label: "segments X", min: 1, max: 128, step: 1, onChange: onGeom });
        _slider(sGrid, g, "segY", { label: "segments Y", min: 1, max: 128, step: 1, onChange: onGeom });

        const sShape = _section(uiRoot, "Shape (still a rectangle)", true);
        _slider(sShape, sh, "bendX", { label: "bend width (+ convex)", min: -2, max: 2, step: 0.02, onChange: onGeom });
        _slider(sShape, sh, "bendY", { label: "bend height (+ convex)", min: -2, max: 2, step: 0.02, onChange: onGeom });
        _slider(sShape, sh, "skewX", { label: "shear X by Y", min: -1, max: 1, step: 0.02, onChange: onGeom });
        _slider(sShape, sh, "skewY", { label: "shear Y by X", min: -1, max: 1, step: 0.02, onChange: onGeom });
        _slider(sShape, sh, "taperX", { label: "width taper vs Y", min: -0.85, max: 0.85, step: 0.02, onChange: onGeom });

        const sTilt = _section(uiRoot, "Card tilt (rot: pine + single)", true);
        _slider(sTilt, xf, "posX", { label: "pos X (single)", min: -4, max: 4, step: 0.02, onChange: onCardTilt });
        _slider(sTilt, xf, "posY", { label: "pos Y (single)", min: -4, max: 4, step: 0.02, onChange: onCardTilt });
        _slider(sTilt, xf, "posZ", { label: "pos Z (single)", min: -4, max: 4, step: 0.02, onChange: onCardTilt });
        _slider(sTilt, xf, "rotXDeg", { label: "pitch ° (tip ↓ = −)", min: -180, max: 180, step: 0.5, onChange: onCardTilt });
        _slider(sTilt, xf, "rotYDeg", { label: "yaw °", min: -180, max: 180, step: 0.5, onChange: onCardTilt });
        _slider(sTilt, xf, "rotZDeg", { label: "roll °", min: -180, max: 180, step: 0.5, onChange: onCardTilt });

        const sMat = _section(uiRoot, "Material", false);
        _color(sMat, m, "color", { label: "color", onChange: onMaterial });
        _slider(sMat, m, "roughness", { label: "roughness", min: 0, max: 1, step: 0.02, onChange: onMaterial });
        _slider(sMat, m, "metalness", { label: "metalness", min: 0, max: 1, step: 0.02, onChange: onMaterial });
        _toggle(sMat, m, "useChecker", { label: "checker (UV preview)", onChange: onMaterial });

        const sTex = _section(uiRoot, "Texture / alpha", true);
        const uploadInfo = _info(sTex, "current file", () => m.uploadName);
        refreshUploadName = () => uploadInfo.update(m.uploadName);
        _button(sTex, { title: "Upload image…", onClick: () => fileInput.click() });
        _button(sTex, { title: "Clear uploaded", onClick: () => clearUploadedTexture() });
        _dropdown(sTex, m, "maskMode", {
          label: "cutout from",
          options: { "PNG alpha (RGBA)": "alpha", "B&W / gray (red)": "luminance" },
          onChange: onMaterial,
        });
        _slider(sTex, m, "alphaTest", { label: "alpha test", min: 0, max: 0.99, step: 0.01, onChange: onMaterial });
        _toggle(sTex, m, "depthWrite", { label: "depth write", onChange: onMaterial });
        _slider(sTex, m, "texRotDeg", { label: "image rot °", min: -180, max: 180, step: 1, onChange: onMaterial });
        _slider(sTex, m, "texOffsetU", { label: "offset U (bough)", min: -2, max: 2, step: 0.01, onChange: onMaterial });
        _slider(sTex, m, "texOffsetV", { label: "offset V (across)", min: -2, max: 2, step: 0.01, onChange: onMaterial });
        _slider(sTex, m, "texRepeatU", { label: "repeat U", min: 0.05, max: 8, step: 0.01, onChange: onMaterial });
        _slider(sTex, m, "texRepeatV", { label: "repeat V", min: 0.05, max: 8, step: 0.01, onChange: onMaterial });
        _toggle(sTex, m, "texFlipH", { label: "flip U", onChange: onMaterial });
        _toggle(sTex, m, "texFlipV", { label: "flip V", onChange: onMaterial });

        const sSc = _section(uiRoot, "Scene", false);
        _color(sSc, sc, "bg", { label: "background", onChange: onScene });
        _slider(sSc, sc, "amb", { label: "ambient", min: 0, max: 1.5, step: 0.02, onChange: onScene });
        _slider(sSc, sc, "key", { label: "key light", min: 0, max: 2.5, step: 0.02, onChange: onScene });

        const sDbg = _section(uiRoot, "Debug", false);
        _toggle(sDbg, dbg, "wireframe", { label: "wireframe", onChange: onDebug });
        _toggle(sDbg, dbg, "showPivot", { label: "axes at pivot", onChange: onDebug });
        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        function tick() {
          requestAnimationFrame(tick);
          controls.update();
          renderer.render(scene, camera);
        }
        tick();
      })();
    </script>
  </body>
</html>
