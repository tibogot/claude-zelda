<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine editor — instanced rings + card shaping</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #9ec8e8;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hint {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 12px;
        color: rgba(30, 50, 80, 0.75);
        pointer-events: none;
        text-align: center;
        max-width: 92vw;
      }
      #title {
        position: fixed;
        top: 12px;
        left: 300px;
        z-index: 5;
        font-size: 14px;
        font-weight: 600;
        color: rgba(40, 60, 100, 0.85);
        pointer-events: none;
      }
      .tp-dfwv {
        position: fixed !important;
        top: 12px !important;
        left: 12px !important;
        width: 292px !important;
        max-height: calc(100vh - 24px) !important;
        overflow-y: auto !important;
        z-index: 20 !important;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://esm.sh/tweakpane@4.0.4"
        }
      }
    </script>
  </head>
  <body>
    <div id="title">Pine — 5 cards / ring · 7 levels (default) · pivot on trunk</div>
    <div id="hint">
      Pine: pivot default = trunk centerline (XZ); use “pivot → surface” to slide onto the hull. Single card: use position + rotation.
    </div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";

      const DEG = Math.PI / 180;
      const _v3 = new THREE.Vector3();
      const _euler = new THREE.Euler();
      const _qCard = new THREE.Quaternion();
      const _qAz = new THREE.Quaternion();
      const _qOut = new THREE.Quaternion();
      const _dummy = new THREE.Object3D();
      const _yAxis = new THREE.Vector3(0, 1, 0);

      function trunkRadiusAtWorldY(y, trunk) {
        const H = Math.max(0.15, trunk.height);
        const y0 = trunk.yOffset;
        const f = THREE.MathUtils.clamp((y - y0) / H, 0, 1);
        return THREE.MathUtils.lerp(trunk.radiusBottom, trunk.radiusTop, f);
      }

      /**
       * Build in centered XY (normal +Z), deform, move chosen edge midpoint to origin, then rotate +90° Y so:
       * — plane is perpendicular to trunk (world Y): lies in XZ… after rot, spans Y + tangential Z, normal ≈ −X toward trunk.
       * — pivot sits on the short-edge center (default: left edge if width ≥ height) for a clean trunk attach.
       */
      function createRectangleGeometry(w, h, segX, segY, shape, pivotEdge) {
        const {
          bendX,
          bendY,
          skewX,
          skewY,
          taperX,
        } = shape;
        const geo = new THREE.PlaneGeometry(w, h, segX, segY);
        const pos = geo.attributes.position;
        const hw = w * 0.5;
        const hh = h * 0.5;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          const nx = hw > 1e-6 ? x / hw : 0;
          const ny = hh > 1e-6 ? y / hh : 0;
          const scaleX = 1 + taperX * ny;
          x *= scaleX;
          x += skewX * ny * hh;
          y += skewY * nx * hw;
          let z = pos.getZ(i);
          z += bendX * nx * nx;
          z += bendY * ny * ny;
          pos.setXYZ(i, x, y, z);
        }

        let edge = pivotEdge;
        if (edge === "auto") edge = w >= h ? "left" : "bottom";
        let px = 0;
        let py = 0;
        const pz = 0;
        switch (edge) {
          case "bottom":
            px = 0;
            py = hh;
            break;
          case "top":
            px = 0;
            py = -hh;
            break;
          case "left":
            px = hw;
            py = 0;
            break;
          case "right":
            px = -hw;
            py = 0;
            break;
          default:
            px = hw;
            py = 0;
        }
        for (let i = 0; i < pos.count; i++) {
          pos.setXYZ(i, pos.getX(i) + px, pos.getY(i) + py, pos.getZ(i) + pz);
        }

        geo.rotateY(Math.PI / 2);
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        return geo;
      }

      function makeCheckerTexture() {
        const t = new THREE.CanvasTexture(
          (() => {
            const c = document.createElement("canvas");
            c.width = c.height = 256;
            const g = c.getContext("2d");
            const n = 8;
            const s = 256 / n;
            for (let j = 0; j < n; j++) {
              for (let i = 0; i < n; i++) {
                g.fillStyle = (i + j) % 2 ? "#c8d8e8" : "#f0f4f8";
                g.fillRect(i * s, j * s, s, s);
              }
            }
            g.strokeStyle = "rgba(60,80,120,0.35)";
            g.lineWidth = 1;
            for (let k = 0; k <= n; k++) {
              g.beginPath();
              g.moveTo(0, k * s);
              g.lineTo(256, k * s);
              g.stroke();
              g.beginPath();
              g.moveTo(k * s, 0);
              g.lineTo(k * s, 256);
              g.stroke();
            }
            return c;
          })()
        );
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(4, 4);
        t.colorSpace = THREE.SRGBColorSpace;
        t.needsUpdate = true;
        return t;
      }

      (async () => {
        const params = {
          rect: {
            width: 2,
            height: 0.95,
            /** auto | left | right | bottom | top — short edge recommended for trunk hook */
            pivotEdge: "auto",
          },
          /** Blender-style pine card: 12 verts = 6 along the bough × 2 across → 5 quads; curve = bendX (long axis). */
          grid: {
            segX: 5,
            segY: 1,
          },
          shape: {
            bendX: 0.14,
            bendY: 0,
            skewX: 0,
            skewY: 0,
            taperX: 0,
          },
          transform: {
            posX: 0.01,
            posY: 1.35,
            posZ: 0,
            rotXDeg: -11.5,
            rotYDeg: 0,
            rotZDeg: 90,
          },
          foliage: {
            layout: "pine",
            levels: 7,
            perRing: 5,
            baseY: 1.96,
            stepY: 0.44,
            scaleBottom: 0.94,
            scaleTop: 0.32,
            scalePower: 1.15,
            globalScale: 1,
            radialInset: 0.02,
            /** 0 = pivot on trunk axis (centered from top); 1 = pivot on surface at this azimuth (old behavior) */
            pivotAlongRadius: 0,
            azimuthOffsetDeg: 0,
            staggerDeg: 0,
            offsetX: 0,
            offsetY: 0,
            offsetZ: 0,
          },
          trunk: {
            height: 4,
            radiusBottom: 0.14,
            radiusTop: 0.04,
            yOffset: 0.66,
            color: "#3d2e22",
            visible: true,
          },
          material: {
            color: "#ffffff",
            roughness: 0.55,
            metalness: 0,
            useChecker: true,
            alphaTest: 0.45,
            depthWrite: false,
            uploadName: "(none)",
            /** 'alpha' = map RGBA; 'luminance' = alphaMap (red channel) for B&amp;W / grayscale masks */
            maskMode: "alpha",
          },
          scene: {
            bg: "#9ec8e8",
            amb: 0.55,
            key: 1.1,
          },
          debug: {
            wireframe: false,
            showPivot: false,
          },
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(params.scene.bg);

        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 200);
        camera.position.set(1.6, 0.9, 2.2);

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);
        await renderer.init();

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.1, 0);
        controls.enableDamping = true;
        controls.update();

        const ambient = new THREE.AmbientLight(0xc8d8f0, params.scene.amb);
        scene.add(ambient);
        const key = new THREE.DirectionalLight(0xfff5e8, params.scene.key);
        key.position.set(2.5, 4, 2.5);
        scene.add(key);
        scene.add(new THREE.DirectionalLight(0xa8b8e8, 0.35).translateX(-3).translateY(2));

        const checker = makeCheckerTexture();
        let uploadedTex = null;

        const mat = new THREE.MeshStandardMaterial({
          color: params.material.color,
          roughness: params.material.roughness,
          metalness: params.material.metalness,
          side: THREE.DoubleSide,
          map: params.material.useChecker ? checker : null,
          wireframe: params.debug.wireframe,
          transparent: false,
          alphaTest: 0,
        });

        let geo = null;
        /** @type {THREE.Mesh | THREE.InstancedMesh | null} */
        let foliageObject = null;
        /** @type {THREE.Object3D | null} */
        let pivotHelperRoot = null;

        const trunkMat = new THREE.MeshStandardMaterial({
          color: params.trunk.color,
          roughness: 0.92,
          metalness: 0,
        });
        let trunkGeo = null;
        const trunkMesh = new THREE.Mesh();
        trunkMesh.castShadow = false;
        trunkMesh.receiveShadow = false;
        scene.add(trunkMesh);

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/png,image/jpeg,image/webp,image/*";
        fileInput.style.display = "none";
        document.body.appendChild(fileInput);

        const texLoader = new THREE.TextureLoader();

        function disposeUploadedTexture() {
          if (uploadedTex) {
            uploadedTex.dispose();
            uploadedTex = null;
          }
        }

        function syncMaterial() {
          mat.color.set(params.material.color);
          mat.roughness = params.material.roughness;
          mat.metalness = params.material.metalness;
          mat.wireframe = params.debug.wireframe;

          if (uploadedTex) {
            mat.map = uploadedTex;
            mat.transparent = true;
            mat.alphaTest = params.material.alphaTest;
            mat.depthWrite = params.material.depthWrite;
            /* B&W masks usually have A=255 everywhere; alphaMap uses the red channel for cutout. */
            mat.alphaMap = params.material.maskMode === "luminance" ? uploadedTex : null;
          } else {
            mat.map = params.material.useChecker ? checker : null;
            mat.alphaMap = null;
            mat.transparent = false;
            mat.alphaTest = 0;
            mat.depthWrite = true;
          }

          mat.needsUpdate = true;
        }

        function applySingleTransform() {
          if (!foliageObject || foliageObject.isInstancedMesh) return;
          const t = params.transform;
          const g = params.foliage.globalScale;
          foliageObject.position.set(t.posX, t.posY, t.posZ);
          foliageObject.rotation.set(t.rotXDeg * DEG, t.rotYDeg * DEG, t.rotZDeg * DEG, "XYZ");
          foliageObject.scale.setScalar(Number.isFinite(g) && g > 0 ? g : 1);
        }

        function quaternionForAzimuth(thetaRad) {
          const t = params.transform;
          _euler.set(t.rotXDeg * DEG, t.rotYDeg * DEG, t.rotZDeg * DEG, "XYZ");
          _qCard.setFromEuler(_euler);
          _qAz.setFromAxisAngle(_yAxis, thetaRad);
          return _qOut.copy(_qAz).multiply(_qCard);
        }

        function updateInstanceMatrices() {
          if (!foliageObject?.isInstancedMesh) return;
          const f = params.foliage;
          const tr = params.trunk;
          const levels = Math.max(1, Math.round(f.levels));
          const perRing = Math.max(1, Math.round(f.perRing));
          const count = levels * perRing;
          if (foliageObject.count !== count) return;

          const pow = Math.max(0.05, f.scalePower);
          const gScale = Number.isFinite(f.globalScale) && f.globalScale > 0 ? f.globalScale : 1;

          let idx = 0;
          for (let level = 0; level < levels; level++) {
            const tLin = levels <= 1 ? 0 : level / (levels - 1);
            const u = Math.pow(tLin, pow);
            const s =
              (f.scaleBottom * (1 - u) + f.scaleTop * u) * gScale;
            const y = f.baseY + level * f.stepY + f.offsetY;
            const R = Math.max(0.001, trunkRadiusAtWorldY(y, tr) - f.radialInset);
            const along = THREE.MathUtils.clamp(
              Number.isFinite(f.pivotAlongRadius) ? f.pivotAlongRadius : 0,
              0,
              1
            );

            for (let k = 0; k < perRing; k++) {
              const thetaDeg =
                f.azimuthOffsetDeg + (k * 360) / perRing + f.staggerDeg * level;
              const theta = thetaDeg * DEG;
              const cx = Math.cos(theta);
              const sz = Math.sin(theta);

              const px = along * R * cx + f.offsetX;
              const pz = along * R * sz + f.offsetZ;
              _dummy.position.set(px, y, pz);
              _dummy.quaternion.copy(quaternionForAzimuth(theta));
              _dummy.scale.setScalar(s);
              _dummy.updateMatrix();
              foliageObject.setMatrixAt(idx++, _dummy.matrix);
            }
          }
          foliageObject.instanceMatrix.needsUpdate = true;
        }

        function disposeFoliageObject() {
          if (!foliageObject) return;
          scene.remove(foliageObject);
          if (foliageObject.isInstancedMesh) foliageObject.dispose();
          foliageObject = null;
        }

        function ensureFoliageObject() {
          const f = params.foliage;
          const pine = f.layout === "pine";
          const levels = Math.max(1, Math.round(f.levels));
          const perRing = Math.max(1, Math.round(f.perRing));
          const needCount = pine ? levels * perRing : 1;

          const needNewType =
            !foliageObject ||
            (pine && !foliageObject.isInstancedMesh) ||
            (!pine && foliageObject.isInstancedMesh) ||
            (pine && foliageObject.isInstancedMesh && foliageObject.count !== needCount);

          if (needNewType) {
            disposeFoliageObject();
            if (pine) {
              foliageObject = new THREE.InstancedMesh(geo, mat, needCount);
              foliageObject.frustumCulled = false;
              scene.add(foliageObject);
              updateInstanceMatrices();
            } else {
              foliageObject = new THREE.Mesh(geo, mat);
              scene.add(foliageObject);
              applySingleTransform();
            }
          } else {
            foliageObject.geometry = geo;
            foliageObject.material = mat;
            if (pine) updateInstanceMatrices();
            else applySingleTransform();
          }
          updatePivotHelper();
        }

        function rebuildTrunk() {
          const t = params.trunk;
          if (trunkGeo) trunkGeo.dispose();
          const H = Math.max(0.15, t.height);
          const r0 = Math.max(0.02, t.radiusBottom);
          const r1 = Math.max(0.02, t.radiusTop);
          trunkGeo = new THREE.CylinderGeometry(r1, r0, H, 24);
          trunkMesh.geometry = trunkGeo;
          trunkMesh.material = trunkMat;
          trunkMesh.position.set(0, t.yOffset + H * 0.5, 0);
          trunkMesh.visible = t.visible;
          trunkMat.color.set(t.color);
        }

        function updatePivotHelper() {
          if (pivotHelperRoot) {
            scene.remove(pivotHelperRoot);
            pivotHelperRoot.traverse((o) => {
              o.geometry?.dispose?.();
              const m = o.material;
              if (m) (Array.isArray(m) ? m : [m]).forEach((x) => x.dispose?.());
            });
            pivotHelperRoot = null;
          }
          if (!params.debug.showPivot || !foliageObject) return;

          const axes = new THREE.AxesHelper(0.2);
          if (foliageObject.isInstancedMesh) {
            const m = new THREE.Matrix4();
            foliageObject.getMatrixAt(0, m);
            m.decompose(_dummy.position, _dummy.quaternion, _v3);
            const g = new THREE.Group();
            g.position.copy(_dummy.position);
            g.quaternion.copy(_dummy.quaternion);
            g.add(axes);
            scene.add(g);
            pivotHelperRoot = g;
          } else {
            foliageObject.add(axes);
            pivotHelperRoot = axes;
          }
        }

        function rebuildGeometry() {
          const r = params.rect;
          const g = params.grid;
          const w = Math.max(0.05, r.width);
          const h = Math.max(0.05, r.height);
          const sx = Math.max(1, Math.round(g.segX));
          const sy = Math.max(1, Math.round(g.segY));
          const newGeo = createRectangleGeometry(w, h, sx, sy, params.shape, params.rect.pivotEdge);
          if (foliageObject) foliageObject.geometry = newGeo;
          if (geo) geo.dispose();
          geo = newGeo;
          ensureFoliageObject();
        }

        function syncScene() {
          scene.background.set(params.scene.bg);
          ambient.intensity = params.scene.amb;
          key.intensity = params.scene.key;
        }

        rebuildTrunk();
        rebuildGeometry();
        syncMaterial();
        syncScene();

        const pane = new Pane({ title: "Pine card + trunk" });

        /** Avoid pane.refresh() — it walks nested params and throws on keys like debug.showPivot. */
        let refreshUploadName = () => {};

        fileInput.addEventListener("change", () => {
          const file = fileInput.files?.[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          texLoader.load(
            url,
            (tex) => {
              URL.revokeObjectURL(url);
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
              tex.premultiplyAlpha = false;
              tex.needsUpdate = true;
              disposeUploadedTexture();
              uploadedTex = tex;
              params.material.uploadName = file.name;
              syncMaterial();
              refreshUploadName();
            },
            undefined,
            () => {
              URL.revokeObjectURL(url);
            }
          );
        });

        function clearUploadedTexture() {
          fileInput.value = "";
          disposeUploadedTexture();
          params.material.uploadName = "(none)";
          syncMaterial();
          refreshUploadName();
        }

        const fTrunk = pane.addFolder({ title: "Trunk", expanded: true });
        fTrunk.addBinding(params.trunk, "height", { min: 0.2, max: 24, step: 0.05 });
        fTrunk.addBinding(params.trunk, "radiusBottom", { min: 0.03, max: 2, step: 0.01 });
        fTrunk.addBinding(params.trunk, "radiusTop", { min: 0.02, max: 1.5, step: 0.01 });
        fTrunk.addBinding(params.trunk, "yOffset", { min: -1, max: 2, step: 0.01, label: "base Y" });
        fTrunk.addBinding(params.trunk, "color");
        fTrunk.addBinding(params.trunk, "visible");
        fTrunk.on("change", () => {
          rebuildTrunk();
          updateInstanceMatrices();
          updatePivotHelper();
        });

        const fFoliage = pane.addFolder({ title: "Foliage layout", expanded: true });
        fFoliage.addBinding(params.foliage, "layout", {
          label: "mode",
          options: { pine: "pine", single: "single" },
        });
        fFoliage.addBinding(params.foliage, "levels", { min: 1, max: 32, step: 1, label: "levels" });
        fFoliage.addBinding(params.foliage, "perRing", { min: 1, max: 32, step: 1, label: "per ring" });
        fFoliage.addBinding(params.foliage, "baseY", { min: -2, max: 24, step: 0.02, label: "base Y" });
        fFoliage.addBinding(params.foliage, "stepY", { min: 0.05, max: 4, step: 0.02, label: "ΔY / level" });
        fFoliage.addBinding(params.foliage, "scaleBottom", { min: 0.05, max: 3, step: 0.02, label: "scale bottom" });
        fFoliage.addBinding(params.foliage, "scaleTop", { min: 0.05, max: 3, step: 0.02, label: "scale top" });
        fFoliage.addBinding(params.foliage, "scalePower", { min: 0.2, max: 4, step: 0.02, label: "scale curve" });
        fFoliage.addBinding(params.foliage, "globalScale", { min: 0.1, max: 3, step: 0.02, label: "global ×" });
        fFoliage.addBinding(params.foliage, "radialInset", { min: -0.2, max: 0.5, step: 0.005, label: "trunk inset" });
        fFoliage.addBinding(params.foliage, "pivotAlongRadius", {
          min: 0,
          max: 1,
          step: 0.02,
          label: "pivot → surface",
        });
        fFoliage.addBinding(params.foliage, "azimuthOffsetDeg", {
          min: -180,
          max: 180,
          step: 0.5,
          label: "ring rotate °",
        });
        fFoliage.addBinding(params.foliage, "staggerDeg", {
          min: -45,
          max: 45,
          step: 0.5,
          label: "stagger / level °",
        });
        fFoliage.addBinding(params.foliage, "offsetX", { min: -2, max: 2, step: 0.02, label: "offset X" });
        fFoliage.addBinding(params.foliage, "offsetY", { min: -2, max: 2, step: 0.02, label: "offset Y" });
        fFoliage.addBinding(params.foliage, "offsetZ", { min: -2, max: 2, step: 0.02, label: "offset Z" });
        fFoliage.on("change", () => ensureFoliageObject());

        const fRect = pane.addFolder({ title: "Rectangle (pivot = short edge)", expanded: true });
        fRect.addBinding(params.rect, "width", { min: 0.1, max: 8, step: 0.05 });
        fRect.addBinding(params.rect, "height", { min: 0.1, max: 8, step: 0.05 });
        fRect.addBinding(params.rect, "pivotEdge", {
          label: "pivot edge",
          options: {
            auto: "auto",
            left: "left",
            right: "right",
            bottom: "bottom",
            top: "top",
          },
        });

        const fGrid = pane.addFolder({ title: "Subdivision (UV grid)", expanded: true });
        fGrid.addBinding(params.grid, "segX", { min: 1, max: 128, step: 1, label: "segments X" });
        fGrid.addBinding(params.grid, "segY", { min: 1, max: 128, step: 1, label: "segments Y" });

        const fShape = pane.addFolder({ title: "Shape (still a rectangle)", expanded: true });
        fShape.addBinding(params.shape, "bendX", {
          min: -2,
          max: 2,
          step: 0.02,
          label: "bend width (+ convex)",
        });
        fShape.addBinding(params.shape, "bendY", {
          min: -2,
          max: 2,
          step: 0.02,
          label: "bend height (+ convex)",
        });
        fShape.addBinding(params.shape, "skewX", {
          min: -1,
          max: 1,
          step: 0.02,
          label: "shear X by Y",
        });
        fShape.addBinding(params.shape, "skewY", {
          min: -1,
          max: 1,
          step: 0.02,
          label: "shear Y by X",
        });
        fShape.addBinding(params.shape, "taperX", {
          min: -0.85,
          max: 0.85,
          step: 0.02,
          label: "width taper vs Y",
        });

        const fXf = pane.addFolder({ title: "Card tilt (single: full transform)", expanded: true });
        fXf.addBinding(params.transform, "posX", { min: -4, max: 4, step: 0.02 });
        fXf.addBinding(params.transform, "posY", { min: -4, max: 4, step: 0.02 });
        fXf.addBinding(params.transform, "posZ", { min: -4, max: 4, step: 0.02 });
        fXf.addBinding(params.transform, "rotXDeg", { min: -180, max: 180, step: 0.5, label: "rot X °" });
        fXf.addBinding(params.transform, "rotYDeg", { min: -180, max: 180, step: 0.5, label: "rot Y °" });
        fXf.addBinding(params.transform, "rotZDeg", { min: -180, max: 180, step: 0.5, label: "rot Z °" });

        const fMat = pane.addFolder({ title: "Material", expanded: false });
        fMat.addBinding(params.material, "color");
        fMat.addBinding(params.material, "roughness", { min: 0, max: 1, step: 0.02 });
        fMat.addBinding(params.material, "metalness", { min: 0, max: 1, step: 0.02 });
        fMat.addBinding(params.material, "useChecker", { label: "checker (UV preview)" });

        const fTex = pane.addFolder({ title: "Texture / alpha", expanded: true });
        const uploadNameBinding = fTex.addBinding(params.material, "uploadName", {
          readonly: true,
          label: "current file",
        });
        refreshUploadName = () => uploadNameBinding.refresh();
        fTex.addButton({ title: "Upload image…" }).on("click", () => fileInput.click());
        fTex.addButton({ title: "Clear uploaded" }).on("click", () => clearUploadedTexture());
        fTex.addBinding(params.material, "maskMode", {
          label: "cutout from",
          options: {
            "PNG alpha (RGBA)": "alpha",
            "B&W / gray (red channel)": "luminance",
          },
        });
        fTex.addBinding(params.material, "alphaTest", {
          min: 0,
          max: 0.99,
          step: 0.01,
          label: "alpha test",
        });
        fTex.addBinding(params.material, "depthWrite", { label: "depth write" });

        const fSc = pane.addFolder({ title: "Scene", expanded: false });
        fSc.addBinding(params.scene, "bg");
        fSc.addBinding(params.scene, "amb", { min: 0, max: 1.5, step: 0.02, label: "ambient" });
        fSc.addBinding(params.scene, "key", { min: 0, max: 2.5, step: 0.02, label: "key" });

        const fDbg = pane.addFolder({ title: "Debug", expanded: false });
        fDbg.addBinding(params.debug, "wireframe");
        fDbg.addBinding(params.debug, "showPivot", { label: "axes at pivot" });

        const GEOM_KEYS = new Set([
          "width",
          "height",
          "pivotEdge",
          "segX",
          "segY",
          "bendX",
          "bendY",
          "skewX",
          "skewY",
          "taperX",
        ]);
        const FOLIAGE_KEYS = new Set([
          "layout",
          "levels",
          "perRing",
          "baseY",
          "stepY",
          "scaleBottom",
          "scaleTop",
          "scalePower",
          "globalScale",
          "radialInset",
          "pivotAlongRadius",
          "azimuthOffsetDeg",
          "staggerDeg",
          "offsetX",
          "offsetY",
          "offsetZ",
        ]);
        const XF_KEYS = new Set(["posX", "posY", "posZ", "rotXDeg", "rotYDeg", "rotZDeg"]);
        const MAT_KEYS = new Set(["color", "roughness", "metalness", "useChecker"]);
        const TEX_KEYS = new Set(["alphaTest", "depthWrite", "maskMode"]);
        const SCENE_KEYS = new Set(["bg", "amb", "key"]);
        const DBG_KEYS = new Set(["wireframe", "showPivot"]);

        pane.on("change", (ev) => {
          const k = ev.target.key;
          if (GEOM_KEYS.has(k)) rebuildGeometry();
          else if (FOLIAGE_KEYS.has(k)) ensureFoliageObject();
          else if (XF_KEYS.has(k)) {
            if (params.foliage.layout === "pine") updateInstanceMatrices();
            else applySingleTransform();
            if (params.debug.showPivot) updatePivotHelper();
          } else if (MAT_KEYS.has(k)) syncMaterial();
          else if (TEX_KEYS.has(k)) syncMaterial();
          else if (SCENE_KEYS.has(k)) syncScene();
          else if (DBG_KEYS.has(k)) {
            syncMaterial();
            if (k === "showPivot") updatePivotHelper();
          }
        });

        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        function tick() {
          requestAnimationFrame(tick);
          controls.update();
          renderer.render(scene, camera);
        }
        tick();
      })();
    </script>
  </body>
</html>
