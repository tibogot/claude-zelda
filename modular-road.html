<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modular Road Lab</title>
    <style>
      :root {
        --bg-dark: #222222;
        --bg-panel: #2a2a2a;
        --bg-item: #333333;
        --bg-hover: #3a3a3a;
        --bg-input: #1e1e1e;
        --border: #3c3c3c;
        --border-light: #4a4a4a;
        --text: #cccccc;
        --text-dim: #888888;
        --accent: #4a9eff;
        --green: #5cb85c;
        --tm-yellow: #dce622;
        --tm-panel: rgba(18, 22, 30, 0.94);
        --tm-rail: rgba(12, 14, 20, 0.97);
        --palette-width: 332px;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "Cascadia Code", "Fira Code", "Consolas", monospace;
        --font-display: "Segoe UI", system-ui, sans-serif;
        --radius: 4px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        font-family: var(--font);
        color: var(--text);
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        bottom: 16px;
        left: var(--palette-width);
        z-index: 10;
        font: 12px/1.5 "SF Mono", "Fira Code", monospace;
        color: #b0d890;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
        backdrop-filter: blur(4px);
      }
      #info span {
        color: #e0f0c0;
        font-weight: 600;
      }
      #lab-title {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        pointer-events: none;
        user-select: none;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--text);
        padding: 8px 18px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
      }

      /* === RIGHT INSPECTOR (v2/editor look) === */
      #inspector {
        position: fixed;
        top: 0;
        right: 0;
        width: var(--inspector-width, 300px);
        min-width: 240px;
        max-width: 70vw;
        height: 100vh;
        background: var(--bg-panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 20;
        box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
      }
      #inspector-resize-handle {
        position: absolute;
        top: 0;
        left: -3px;
        width: 8px;
        height: 100%;
        cursor: ew-resize;
        z-index: 21;
        background: transparent;
        transition: background 0.15s;
      }
      #inspector-resize-handle:hover,
      body.inspector-resizing #inspector-resize-handle {
        background: var(--accent);
        opacity: 0.6;
      }
      body.inspector-resizing {
        cursor: ew-resize;
        user-select: none;
      }
      #inspector-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        height: 32px;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      #inspector-toggle {
        background: none;
        border: 1px solid var(--border-light);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        padding: 2px 8px;
        font-size: 10px;
      }
      #inspector-toggle:hover {
        color: var(--text);
        background: var(--bg-hover);
      }
      #inspector-body {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 24px;
      }
      body.inspector-hidden #inspector-body,
      body.inspector-hidden #inspector-header span {
        display: none;
      }
      body.inspector-hidden #inspector {
        width: auto;
        height: auto;
        border-left: none;
        background: transparent;
        box-shadow: none;
      }
      body.inspector-hidden #inspector-header {
        background: transparent;
        border: none;
        padding: 6px;
      }
      .inspector-section {
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-dim);
        user-select: none;
      }
      .section-header:hover {
        background: var(--bg-hover);
      }
      .section-header .section-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .section-header.collapsed .section-arrow {
        transform: rotate(-90deg);
      }
      .section-body {
        padding: 6px 12px 10px;
      }
      .section-body.hidden {
        display: none;
      }
      .prop-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .prop-label {
        width: 90px;
        min-width: 90px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
      }
      .prop-value {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .prop-color-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      .prop-color {
        width: 22px;
        height: 22px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .prop-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .prop-color::-webkit-color-swatch {
        border: none;
        border-radius: 2px;
      }
      .prop-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .prop-num-input {
        width: 72px;
        height: 22px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 5px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-mono);
        text-align: right;
        outline: none;
      }
      .prop-num-input:focus {
        border-color: var(--accent);
      }
      .prop-num-input::-webkit-outer-spin-button,
      .prop-num-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .prop-slider {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg-input);
        border-radius: 2px;
        outline: none;
      }
      .prop-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .prop-slider-val {
        width: 44px;
        font-size: 11px;
        color: var(--text-dim);
        font-family: var(--font-mono);
        text-align: right;
      }
      .prop-toggle {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border-light);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        color: transparent;
      }
      .prop-toggle.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .prop-toggle svg {
        width: 10px;
        height: 10px;
      }
      .section-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        height: 26px;
        margin-top: 4px;
        background: var(--bg-item);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
      }
      .section-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--border-light);
      }
      .section-separator {
        height: 1px;
        background: var(--border);
        margin: 6px 0;
      }
      #inspector-body::-webkit-scrollbar {
        width: 8px;
      }
      #inspector-body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      /* === LEFT PIECE PALETTE (TrackMania-style rail + panel) === */
      #palette {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--palette-width);
        height: 100vh;
        display: flex;
        z-index: 20;
        font-family: var(--font-display);
        transition: transform 0.22s ease;
      }
      #palette.collapsed {
        transform: translateX(calc(-1 * var(--palette-width) + 14px));
      }
      #palette-rail {
        width: 72px;
        flex-shrink: 0;
        background: var(--tm-rail);
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        overflow-y: auto;
      }
      #palette-rail::-webkit-scrollbar {
        width: 4px;
      }
      #palette-rail::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
      }
      #edges-toggle {
        margin: 8px 6px 10px;
        padding: 6px 4px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #eee;
        font-size: 9px;
        font-weight: 800;
        font-style: italic;
        line-height: 1.25;
        text-transform: uppercase;
        cursor: pointer;
        letter-spacing: 0.02em;
      }
      #edges-toggle.on {
        border-color: var(--tm-yellow);
        color: var(--tm-yellow);
        box-shadow: inset 0 0 0 1px rgba(220, 230, 34, 0.25);
      }
      #edges-toggle:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .cat-btn {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        min-height: 72px;
        padding: 8px 4px;
        background: transparent;
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        cursor: pointer;
        color: #aab2c0;
        transition: background 0.12s, color 0.12s;
      }
      .cat-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }
      .cat-btn.active {
        color: #fff;
        background: rgba(220, 230, 34, 0.06);
      }
      .cat-btn.active::before,
      .cat-btn.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--tm-yellow);
      }
      .cat-btn.active::before {
        top: 0;
      }
      .cat-btn.active::after {
        bottom: 0;
      }
      .cat-btn-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cat-btn-icon svg {
        width: 38px;
        height: 38px;
      }
      .cat-btn-label {
        font-size: 8px;
        font-weight: 800;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        text-align: center;
        line-height: 1.1;
        max-width: 64px;
      }
      #palette-panel {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--tm-panel);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.45);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
      }
      #palette-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 14px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      #category-title {
        font-size: 22px;
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #fff;
        line-height: 1;
      }
      #build-mode-toggle {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 2px;
        color: #aaa;
        cursor: pointer;
        padding: 4px 10px;
        font-size: 9px;
        font-weight: 800;
        font-style: italic;
        font-family: var(--font-display);
        text-transform: uppercase;
      }
      #build-mode-toggle.active {
        background: rgba(220, 230, 34, 0.15);
        border-color: var(--tm-yellow);
        color: var(--tm-yellow);
      }
      #palette-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 10px;
      }
      #palette-body::-webkit-scrollbar {
        width: 6px;
      }
      #palette-body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 3px;
      }
      #piece-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .piece-tile {
        position: relative;
        aspect-ratio: 1;
        padding: 0;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        cursor: pointer;
        overflow: hidden;
        transition: border-color 0.12s, box-shadow 0.12s;
      }
      .piece-tile:hover:not(:disabled) {
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.04);
      }
      .piece-tile.active {
        border-color: var(--tm-yellow);
        box-shadow: 0 0 0 1px var(--tm-yellow), inset 0 0 20px rgba(220, 230, 34, 0.08);
      }
      .piece-tile.active::before,
      .piece-tile.active::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        border: 2px solid var(--tm-yellow);
        pointer-events: none;
        z-index: 2;
      }
      .piece-tile.active::before {
        top: 3px;
        left: 3px;
        border-right: none;
        border-bottom: none;
      }
      .piece-tile.active::after {
        bottom: 3px;
        right: 3px;
        border-left: none;
        border-top: none;
      }
      .piece-tile:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      .piece-tile-preview {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      .piece-tile-preview svg {
        width: 100%;
        height: 100%;
        max-width: 72px;
        max-height: 72px;
      }
      .piece-tile-name {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 3px 4px;
        font-size: 8px;
        font-weight: 800;
        font-style: italic;
        text-transform: uppercase;
        text-align: center;
        color: #fff;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        letter-spacing: 0.03em;
        line-height: 1.15;
      }
      .piece-tile-key {
        position: absolute;
        top: 4px;
        right: 4px;
        font-size: 8px;
        font-family: var(--font-mono);
        color: rgba(255, 255, 255, 0.55);
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        padding: 1px 4px;
        z-index: 1;
      }
      .piece-tile.soon::after {
        content: "SOON";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-12deg);
        font-size: 11px;
        font-weight: 900;
        font-style: italic;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.12em;
        pointer-events: none;
      }
      #palette-collapse-tab {
        position: absolute;
        top: 50%;
        right: -14px;
        transform: translateY(-50%);
        width: 14px;
        height: 52px;
        background: var(--tm-yellow);
        border: none;
        border-radius: 0 3px 3px 0;
        cursor: pointer;
        z-index: 21;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.35);
      }
      #palette-collapse-tab:hover {
        filter: brightness(1.08);
      }
      .palette-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .palette-btn {
        flex: 1 1 calc(50% - 2px);
        min-width: 0;
        height: 28px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        color: #aab2c0;
        cursor: pointer;
        font-size: 9px;
        font-weight: 700;
        font-style: italic;
        font-family: var(--font-display);
        text-transform: uppercase;
      }
      .palette-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.22);
      }
      .palette-btn-wide {
        flex: 1 1 100%;
      }
      .palette-btn-primary {
        background: rgba(220, 230, 34, 0.12);
        border-color: rgba(220, 230, 34, 0.55);
        color: var(--tm-yellow);
      }
      #road-status {
        margin-top: 8px;
        font-size: 10px;
        color: #8892a0;
        font-family: var(--font-mono);
        line-height: 1.5;
      }
      #build-hints {
        margin-top: 6px;
        font-size: 10px;
        color: #8892a0;
        line-height: 1.55;
      }
      #build-hints kbd {
        display: inline-block;
        padding: 0 4px;
        border-radius: 3px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--text);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.9/build/index.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="lab-title">Modular Road Lab</div>
    <div id="info">
      <span id="backend">loading…</span> &bull; <span id="cammode">BUILD</span>
      &bull; <span id="mode-hint">LMB place &bull; MMB orbit &bull; <kbd>1</kbd>–<kbd>0</kbd>/<kbd>c</kbd> pick &bull; R flip &bull; Backspace undo</span>
    </div>
    <div id="drive-hud" style="position:fixed;top:14px;right:330px;z-index:15;display:none;font:13px/1.5 var(--font-mono);background:rgba(0,0,0,0.6);border:1px solid rgba(120,255,180,0.35);border-radius:8px;padding:8px 12px;pointer-events:none;color:#c8d8e8;"></div>
    <div id="palette">
      <div id="palette-rail">
        <button id="edges-toggle" class="on" type="button">Edges<br />On/Off</button>
        <div id="category-list"></div>
      </div>
      <div id="palette-panel">
        <div id="palette-panel-header">
          <h2 id="category-title">Straight</h2>
          <button id="build-mode-toggle" class="active" type="button">Build On</button>
        </div>
        <div id="palette-body">
          <div id="piece-grid"></div>
          <div class="palette-toolbar">
            <button id="road-drive" class="palette-btn palette-btn-wide" type="button">Test drive (T)</button>
            <button id="road-place" class="palette-btn palette-btn-wide palette-btn-primary" type="button">
              Place (Enter)
            </button>
            <button id="road-new-chain" class="palette-btn palette-btn-wide" type="button">New chain (N)</button>
            <button id="road-flip" class="palette-btn" type="button">Flip L/R (R)</button>
            <button id="road-undo" class="palette-btn" type="button">Undo</button>
            <button id="road-rebake" class="palette-btn" type="button">Rebake collision</button>
            <button id="road-demo" class="palette-btn" type="button">Demo</button>
            <button id="road-clear" class="palette-btn" type="button">Clear</button>
          </div>
          <div id="road-status">0 placed</div>
          <div id="build-hints">
            Pieces auto-snap to the open end. <kbd>N</kbd> new chain anywhere (even air)
            &bull; <kbd>Q</kbd>/<kbd>E</kbd> rotate free ghost &bull; <kbd>LMB</kbd> or
            <kbd>Enter</kbd> place &bull; <kbd>MMB</kbd> orbit &bull; <kbd>R</kbd> flip curve.
          </div>
        </div>
      </div>
      <button id="palette-collapse-tab" type="button" title="Collapse palette" aria-label="Collapse palette"></button>
    </div>
    <div id="inspector">
      <div id="inspector-resize-handle" title="Drag to resize"></div>
      <div id="inspector-header">
        <span>Inspector</span>
        <button id="inspector-toggle">Hide</button>
      </div>
      <div id="inspector-body"></div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { createTileMaterial } from "./tileMaterial.js";
      import {
        createRoadMaterial,
        createGuardrailMaterial,
        createTunnelMaterial,
        createDecorMaterial,
        syncRoadUniforms,
      } from "./modularRoadMaterial.js";
      import { ModularRoadBuilder, buildRoadPaletteUI } from "./modularRoadBuilder.js";
      import { roadParams, pieceParams, guardrailParams } from "./modularRoadKit.js";
      import { Vehicle, TIRE, CHASSIS, SOLID, DECK, AERO, DRIVETRAIN } from "./modularRoadVehicle.js";
      import { RoadBvh } from "./modularRoadBvh.js";
      import { buildParkour } from "./modularRoadParkour.js";
      import { PropManager, PROP_CATALOG } from "./modularRoadProps.js";

      const PARAMS = {
        camera: { fov: 60 },
        ground: { size: 1200 },
        roadColors: {
          asphaltDark: "#14161a",
          asphaltLight: "#23262c",
          lineColor: "#f2f2f2",
          railA: "#d33a3a",
          railB: "#f0f0f0",
          sideColor: "#3a3d42",
        },
        tile: {
          textureScale: 1500,
          gradientIntensity: 0.5,
          gradientBias: 0.1,
          tileColor: "#d4d4d4",
          gridColor: "#707070",
          gridLineColor: "#404040",
        },
        light: {
          sunAzimuth: 135,
          sunElevation: 43,
          dirColor: "#fff5e0",
          dirIntensity: 2.2,
          hemiSkyColor: "#c8e0ff",
          hemiGroundColor: "#88aa55",
          hemiIntensity: 0.4,
          envIntensity: 0.2,
          exposure: 0.5,
          sunDistance: 600,
          shadowNormalBias: 1.2,
          shadowBias: -0.0003,
        },
        physicalSky: {
          turbidity: 2,
          rayleigh: 1.5,
          mie: 0.005,
          mieG: 0.8,
          cloudCoverage: 0.4,
          cloudDensity: 0.4,
          cloudElevation: 0.5,
          meshScale: 10000,
        },
      };

      function sunDirectionFromAngles(azDeg, elDeg, target = new THREE.Vector3()) {
        const az = THREE.MathUtils.degToRad(azDeg);
        const el = THREE.MathUtils.degToRad(elDeg);
        return target
          .set(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az))
          .normalize();
      }

      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = PARAMS.light.exposure;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU")
            ? "WebGPU ✓"
            : "WebGL fallback";

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          PARAMS.camera.fov,
          innerWidth / innerHeight,
          0.5,
          8000,
        );
        camera.position.set(45, 34, 55);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 4, -20);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI * 0.495;

        const state = { mode: "build", buildMode: true, orbitInDrive: false };
        function syncOrbitButtons() {
          const build = state.mode === "build" && state.buildMode;
          controls.mouseButtons = build
            ? { LEFT: null, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN }
            : { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
        }
        syncOrbitButtons();

        // ── LIGHTS ──
        const sunDir = new THREE.Vector3();
        const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
        scene.add(hemi);
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 1200;
        sun.shadow.camera.left = sun.shadow.camera.bottom = -200;
        sun.shadow.camera.right = sun.shadow.camera.top = 200;
        // Push samples off the surface so big flat sweeps don't self-shadow
        // (the diagonal "acne" banding). normalBias does the heavy lifting on
        // large planes; a tiny depth bias cleans up the rest. Tunable below.
        sun.shadow.normalBias = PARAMS.light.shadowNormalBias;
        sun.shadow.bias = PARAMS.light.shadowBias;
        const shadowTarget = new THREE.Object3D();
        scene.add(shadowTarget);
        sun.target = shadowTarget;
        scene.add(sun);

        // ── SKY + IBL ──
        const sky = new SkyMesh();
        if (sky.material) sky.material.fog = false;
        scene.add(sky);
        let pmrem = null;
        let disposePmrem = null;
        function applySkyUniforms() {
          const S = PARAMS.physicalSky;
          sky.turbidity.value = S.turbidity;
          sky.rayleigh.value = S.rayleigh;
          sky.mieCoefficient.value = S.mie;
          sky.mieDirectionalG.value = S.mieG;
          sky.cloudCoverage.value = S.cloudCoverage;
          sky.cloudDensity.value = S.cloudDensity;
          sky.cloudElevation.value = S.cloudElevation;
          sky.scale.setScalar(S.meshScale);
          if (sky.sunPosition?.value?.copy) sky.sunPosition.value.copy(sunDir);
          else if (sky.sunPosition?.copy) sky.sunPosition.copy(sunDir);
        }
        function rebuildSkyEnv() {
          try {
            applySkyUniforms();
            if (disposePmrem) {
              disposePmrem();
              disposePmrem = null;
            }
            pmrem = pmrem ?? new THREE.PMREMGenerator(renderer);
            const envScene = new THREE.Scene();
            envScene.add(sky.clone());
            const rt = pmrem.fromScene(envScene, 0.04);
            scene.environment = rt.texture;
            disposePmrem = () => rt.dispose();
          } catch (err) {
            console.warn("[modular-road] PMREM failed", err);
          }
        }
        function updateSun() {
          const L = PARAMS.light;
          sunDirectionFromAngles(L.sunAzimuth, L.sunElevation, sunDir);
          sun.position.copy(sunDir).multiplyScalar(L.sunDistance);
          sun.color.set(L.dirColor);
          sun.intensity = L.dirIntensity;
          sun.shadow.normalBias = L.shadowNormalBias;
          sun.shadow.bias = L.shadowBias;
          hemi.color.set(L.hemiSkyColor);
          hemi.groundColor.set(L.hemiGroundColor);
          hemi.intensity = L.hemiIntensity;
          renderer.toneMappingExposure = L.exposure;
          scene.environmentIntensity = L.envIntensity;
          applySkyUniforms();
        }
        updateSun();
        rebuildSkyEnv();

        // ── GROUND ──
        const floorGeo = new THREE.PlaneGeometry(PARAMS.ground.size, PARAMS.ground.size);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = createTileMaterial({
          textureScale: PARAMS.tile.textureScale,
          gradientIntensity: PARAMS.tile.gradientIntensity,
          gradientBias: PARAMS.tile.gradientBias,
          tileColor: PARAMS.tile.tileColor,
          gridColor: PARAMS.tile.gridColor,
          gridLineColor: PARAMS.tile.gridLineColor,
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.05;
        floor.receiveShadow = true;
        scene.add(floor);

        // ── ROAD MATERIAL + BUILDER ──
        const roadMat = createRoadMaterial(PARAMS.roadColors);
        const railMat = createGuardrailMaterial();
        const shellMat = createTunnelMaterial();
        const decorMat = createDecorMaterial();
        let paletteUi;
        const builder = new ModularRoadBuilder({
          scene,
          material: roadMat,
          railMaterial: railMat,
          shellMaterial: shellMat,
          decorMaterial: decorMat,
          isBuildMode: () => state.mode === "build" && state.buildMode,
          onChange: () => paletteUi?.refreshStatus(),
        });
        paletteUi = buildRoadPaletteUI(builder, {
          propCatalog: PROP_CATALOG,
          onAddProp: (id) => props.add(id),
          onEdgesChange: () => builder.rebuildAll(),
        });

        function beginFreeChain() {
          builder.beginNewChain(controls.target.clone());
          paletteUi?.refreshStatus();
        }
        document.getElementById("road-new-chain")?.addEventListener("click", beginFreeChain);

        // Profile + guardrail edits rebuild the whole chain; piece-geometry edits update ghost.
        roadParams.onChange = () => builder.rebuildAll();
        guardrailParams.onChange = () => builder.rebuildAll();
        pieceParams.onChange = () => builder.refreshGhost();

        builder.loadDemo();

        // ── VEHICLE (test drive) ──
        const vehicle = new Vehicle({ scene });
        vehicle.setArrowsVisible(true); // force arrows on by default (physics tuning)

        // BVH colliders, (re)baked on demand. Track + parkour are static while driving.
        const deckBvh = new RoadBvh(); // road/parkour decks + ground → wheel probes
        const solidsBvh = new RoadBvh(); // guardrails + walls → chassis collision
        vehicle.setBvh(deckBvh, solidsBvh);

        // ── OBSTACLE PARKOUR (recreated from the Lotus VVV lab) ──
        const parkour = buildParkour();
        scene.add(parkour.group);
        const obstacleParams = { enabled: true };
        parkour.group.visible = obstacleParams.enabled;

        // ── FREE-PLACEMENT PROPS (gizmo) ──
        const props = new PropManager({
          scene,
          camera,
          domElement: renderer.domElement,
          orbit: controls,
          onChange: () => {
            refreshCollisionDebug();
            paletteUi?.refreshStatus?.();
          },
        });
        props.setEnabled(state.mode === "build");

        // Collision debug wireframe (rebuilt on every bake).
        const debugGroup = new THREE.Group();
        debugGroup.visible = false;
        scene.add(debugGroup);
        let _deckWire = null;
        let _solidsWire = null;
        function refreshCollisionDebug() {
          if (!debugGroup.visible) return;
          if (_deckWire) { debugGroup.remove(_deckWire); _deckWire.geometry.dispose(); _deckWire = null; }
          if (_solidsWire) { debugGroup.remove(_solidsWire); _solidsWire.geometry.dispose(); _solidsWire = null; }
          if (deckBvh.geometry) {
            _deckWire = new THREE.Mesh(deckBvh.geometry.clone(), new THREE.MeshBasicMaterial({ color: 0x39ff88, wireframe: true, transparent: true, opacity: 0.35 }));
            debugGroup.add(_deckWire);
          }
          if (solidsBvh.geometry) {
            _solidsWire = new THREE.Mesh(solidsBvh.geometry.clone(), new THREE.MeshBasicMaterial({ color: 0xff5060, wireframe: true, transparent: true, opacity: 0.5 }));
            debugGroup.add(_solidsWire);
          }
        }

        function bakeCollision() {
          scene.updateMatrixWorld(true);
          const decks = builder.pieces
            .map((p) => p.mesh)
            .filter((m) => !m.userData.noCollision);
          decks.push(floor);
          const solids = [];
          for (const p of builder.pieces) {
            if (p.railMesh) solids.push(p.railMesh);
            if (p.shellMesh) solids.push(p.shellMesh); // tunnel walls/roof block the chassis
          }
          if (obstacleParams.enabled) {
            decks.push(...parkour.deckMeshes);
            solids.push(...parkour.wallMeshes);
          }
          const propCol = props.collisionMeshes();
          decks.push(...propCol.deck);
          solids.push(...propCol.solids);
          deckBvh.bakeFromMeshes(decks);
          solidsBvh.bakeFromMeshes(solids);
          refreshCollisionDebug();
          paletteUi?.refreshStatus?.();
        }

        // ── BUILD MODE TOGGLE (orbit vs place, only relevant in build mode) ──
        const buildBtn = document.getElementById("build-mode-toggle");
        const camModeEl = document.getElementById("cammode");
        const driveBtn = document.getElementById("road-drive");
        const driveHud = document.getElementById("drive-hud");
        const modeHint = document.getElementById("mode-hint");

        function setBuildMode(on) {
          state.buildMode = on;
          buildBtn.classList.toggle("active", on);
          buildBtn.textContent = on ? "Build ON" : "Build OFF";
          if (state.mode === "build") {
            camModeEl.textContent = on ? "BUILD" : "ORBIT";
            builder.setGhostVisible(on);
          }
          syncOrbitButtons();
        }
        buildBtn.addEventListener("click", () => setBuildMode(!state.buildMode));

        function spawnOnTrack() {
          // Start of the track = origin heading -Z; lift onto the deck.
          vehicle.setSpawn(
            new THREE.Vector3(0, TIRE.restLength + 0.15, -4),
            new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI),
          );
        }

        function setDriveMode(on) {
          state.mode = on ? "drive" : "build";
          driveBtn.classList.toggle("palette-btn-primary", on);
          driveBtn.textContent = on ? "Stop driving (T)" : "Test drive (T)";
          driveHud.style.display = on ? "" : "none";
          camModeEl.textContent = on ? "DRIVE" : state.buildMode ? "BUILD" : "ORBIT";
          modeHint.innerHTML = on
            ? "WASD drive &bull; in air: W/S pitch, A/D roll, Q/E spin &bull; Space handbrake &bull; F flip upright &bull; R respawn &bull; Tab orbit cam"
            : "LMB place &bull; N new chain &bull; Q/E rotate ghost &bull; <kbd>1</kbd>–<kbd>0</kbd>/<kbd>c</kbd> pick &bull; R flip &bull; Backspace undo";
          builder.setGhostVisible(!on && state.buildMode);
          props.setEnabled(!on); // gizmo/selection only outside drive mode
          if (on) {
            // Bake a deck BVH (wheel probes) and a solids BVH (guardrail
            // collision) from the current track. Decks + ground go to the
            // deck tree; guardrails go to the solids tree so the chassis is
            // blocked without the false AABB shoves we had before.
            bakeCollision();
            const collidables = builder.pieces
              .map((p) => p.mesh)
              .filter((m) => !m.userData.noCollision);
            collidables.push(floor);
            vehicle.setColliders(collidables, []); // raycaster fallback only
            spawnOnTrack();
          }
          vehicle.setEnabled(on);
          state.orbitInDrive = false;
          controls.enabled = !on; // chase cam drives in drive mode
          syncOrbitButtons();
        }
        driveBtn.addEventListener("click", () => setDriveMode(state.mode !== "drive"));

        // Manual collision rebake — bake the current track/parkour into the BVHs.
        const rebakeBtn = document.getElementById("road-rebake");
        rebakeBtn?.addEventListener("click", () => {
          bakeCollision();
          const tris = deckBvh.triCount + solidsBvh.triCount;
          rebakeBtn.textContent = `Rebaked (${tris.toLocaleString()} tris)`;
          setTimeout(() => (rebakeBtn.textContent = "Rebake collision"), 1400);
        });

        // ── PLACE ON LMB (build mode only) ──
        renderer.domElement.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 || state.mode !== "build" || !state.buildMode) return;
          if (props.isUsingGizmo()) return; // grabbing a prop gizmo handle, not placing road
          builder.place();
          paletteUi.refreshStatus();
        });
        renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

        const _placeRay = new THREE.Raycaster();
        const _placeNdc = new THREE.Vector2();
        const _placeHit = new THREE.Vector3();
        const _placePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        function updateFreePlacementFromPointer(e) {
          if (!builder.freePlaceMode || state.mode !== "build" || !state.buildMode) return;
          const rect = renderer.domElement.getBoundingClientRect();
          _placeNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          _placeNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          _placeRay.setFromCamera(_placeNdc, camera);
          _placePlane.constant = -controls.target.y;
          if (_placeRay.ray.intersectPlane(_placePlane, _placeHit)) {
            builder.setFreePlacement(_placeHit, builder.freeYaw);
            return;
          }
          const dist = Math.max(8, camera.position.distanceTo(controls.target));
          _placeHit.copy(_placeRay.ray.origin).addScaledVector(_placeRay.ray.direction, dist);
          builder.setFreePlacement(_placeHit, builder.freeYaw);
        }
        renderer.domElement.addEventListener("pointermove", updateFreePlacementFromPointer);

        // ── INPUT ──
        const keys = Object.create(null);
        window.addEventListener("keydown", (e) => {
          if (e.target instanceof HTMLInputElement) return;
          if (e.code === "KeyT") {
            setDriveMode(state.mode !== "drive");
            return;
          }
          if (e.code === "KeyN" && state.mode === "build" && state.buildMode) {
            beginFreeChain();
            return;
          }
          if (state.mode === "drive") {
            if (e.code === "KeyR") vehicle.respawn();
            if (e.code === "KeyF") vehicle.flipUpright();
            if (e.code === "Tab") {
              e.preventDefault();
              state.orbitInDrive = !state.orbitInDrive;
              controls.enabled = state.orbitInDrive;
            }
          }
          keys[e.code] = true;
        });
        window.addEventListener("keyup", (e) => {
          keys[e.code] = false;
        });

        function readControls() {
          const left = keys.KeyA || keys.ArrowLeft ? 1 : 0;
          const right = keys.KeyD || keys.ArrowRight ? 1 : 0;
          const fwd = keys.KeyW || keys.ArrowUp ? 1 : 0;
          const back = keys.KeyS || keys.ArrowDown ? 1 : 0;
          const spinR = keys.KeyE ? 1 : 0;
          const spinL = keys.KeyQ ? 1 : 0;
          return { steerTarget: left - right, throttle: fwd - back, handbrake: !!keys.Space, yaw: spinR - spinL };
        }

        // ── CHASE CAMERA (velocity-oriented) ──
        // The camera trails the car's *travel direction* (from velocity), NOT the
        // car's orientation. So mid-air spins/rolls don't whip the view around —
        // it stays behind where the car is actually going — and the look tilts up
        // when climbing / down when falling so you can see the landing.
        const CAM = {
          dist: 7.5,        // trail distance behind the heading
          height: 3.2,      // height above the car
          lookAhead: 5.5,   // how far ahead (along travel) to aim
          lookUp: 1.2,      // raise the look target a touch
          minSpeed: 3.0,    // below this, fall back to the car's facing
          maxLookPitch: 0.85, // clamp so we never look fully straight up/down
          headingLerp: 4.0, // how fast the trailing heading reorients
          lookLerp: 5.0,    // how fast the look direction tracks velocity
          posLerp: 7.0,     // camera position smoothing
        };
        const _camHeading = new THREE.Vector3(0, 0, 1); // horizontal trail heading
        const _camLookDir = new THREE.Vector3(0, 0, 1); // 3D look direction
        const _camDesired = new THREE.Vector3();
        const _camLook = new THREE.Vector3();
        const _camV = new THREE.Vector3();
        const _camFwd = new THREE.Vector3();
        const _camTgtH = new THREE.Vector3();
        const _worldUp = new THREE.Vector3(0, 1, 0);
        let _camInit = false;
        function updateChaseCamera(dt) {
          if (state.orbitInDrive) {
            controls.target.copy(vehicle.body.pos);
            controls.update();
            return;
          }
          const pos = vehicle.body.pos;
          const v = vehicle.body.vel;
          const speed = v.length();
          const grounded = vehicle.groundedCount > 0;
          _camFwd.set(0, 0, 1).applyQuaternion(vehicle.body.quat); // car facing (fallback)
          const reversing = grounded && v.dot(_camFwd) < -0.5;

          // 3D look direction: travel dir when moving, else the car's facing.
          if (speed > CAM.minSpeed && !reversing) _camV.copy(v).multiplyScalar(1 / speed);
          else _camV.copy(_camFwd);

          // Horizontal trail heading: from velocity when moving forward; the car's
          // facing on the ground; held steady in the air at low horizontal speed
          // (so a flat spin or a near-vertical climb doesn't spin the camera).
          const hSpeed = Math.hypot(v.x, v.z);
          if (hSpeed > CAM.minSpeed && !reversing) {
            _camTgtH.set(v.x, 0, v.z).multiplyScalar(1 / hSpeed);
          } else if (grounded) {
            _camTgtH.set(_camFwd.x, 0, _camFwd.z);
            if (_camTgtH.lengthSq() > 1e-6) _camTgtH.normalize();
            else _camTgtH.copy(_camHeading);
          } else {
            _camTgtH.copy(_camHeading);
          }

          if (!_camInit) {
            _camHeading.copy(_camTgtH);
            _camLookDir.copy(_camV);
            _camInit = true;
          }

          const kh = 1 - Math.exp(-CAM.headingLerp * dt);
          _camHeading.lerp(_camTgtH, kh);
          if (_camHeading.lengthSq() < 1e-6) _camHeading.copy(_camTgtH);
          _camHeading.normalize();

          const kl = 1 - Math.exp(-CAM.lookLerp * dt);
          _camLookDir.lerp(_camV, kl);
          if (_camLookDir.y > CAM.maxLookPitch) _camLookDir.y = CAM.maxLookPitch;
          else if (_camLookDir.y < -CAM.maxLookPitch) _camLookDir.y = -CAM.maxLookPitch;
          if (_camLookDir.lengthSq() < 1e-6) _camLookDir.copy(_camV);
          _camLookDir.normalize();

          _camDesired.copy(pos).addScaledVector(_camHeading, -CAM.dist).addScaledVector(_worldUp, CAM.height);
          const kp = 1 - Math.exp(-CAM.posLerp * dt);
          camera.position.lerp(_camDesired, kp);

          _camLook.copy(pos).addScaledVector(_camLookDir, CAM.lookAhead);
          _camLook.y += CAM.lookUp;
          camera.lookAt(_camLook);
        }

        // ── INSPECTOR ──
        buildInspector({
          camera, floorMat, roadMat, builder, vehicle, updateSun, rebuildSkyEnv,
          obstacleParams, parkour, bakeCollision, debugGroup, refreshCollisionDebug,
          props,
          goToParkour: () => {
            if (state.mode !== "drive") setDriveMode(true);
            vehicle.setSpawn(
              new THREE.Vector3(parkour.spawn.pos.x, parkour.spawn.pos.y + TIRE.restLength + 0.15, parkour.spawn.pos.z),
              new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), parkour.spawn.yaw),
            );
            vehicle.respawn();
          },
          goToTrack: () => {
            spawnOnTrack();
            vehicle.respawn();
          },
        });

        // ── LOOP ──
        let lastT = performance.now() / 1000;
        renderer.setAnimationLoop(() => {
          const now = performance.now() / 1000;
          const dt = Math.min(now - lastT, 0.05);
          lastT = now;
          if (state.mode === "drive") {
            vehicle.update(dt, readControls());
            updateChaseCamera(dt);
            driveHud.innerHTML = `${vehicle.speedKmh.toFixed(0)} km/h · ${vehicle.groundedCount}/4 grip`;
          } else {
            controls.update();
          }
          renderer.render(scene, camera);
        });
        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });
      }

      /* === Inspector widget helpers (mirror v2/editor.html) === */
      const _checkSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      const _arrowSvg =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="section-arrow"><polyline points="6 9 12 15 18 9"></polyline></svg>';

      function _fmt(v, step) {
        if (step >= 1) return String(Math.round(v));
        const d = Math.max(0, -Math.floor(Math.log10(step)));
        return v.toFixed(d);
      }
      function _clampSnap(v, min, max, step) {
        if (!Number.isFinite(v)) return min;
        const n = Math.round((v - min) / step);
        let out = min + n * step;
        const s = String(step);
        let dec = 0;
        if (s.includes(".")) dec = s.split(".")[1].length;
        if (dec > 0) out = Number(out.toFixed(dec));
        return Math.min(max, Math.max(min, out));
      }
      function _section(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr);
        sec.appendChild(body);
        parent.appendChild(sec);
        return body;
      }
      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><input type="number" class="prop-num-input" min="${min}" max="${max}" step="${step}" value="${_fmt(cur, step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        sl.addEventListener("input", () => {
          const v = _clampSnap(parseFloat(sl.value), min, max, step);
          obj[key] = v;
          num.value = _fmt(v, step);
          onChange?.(v);
        });
        num.addEventListener("change", () => {
          let v = parseFloat(String(num.value).trim());
          if (!Number.isFinite(v)) {
            num.value = _fmt(obj[key], step);
            return;
          }
          v = _clampSnap(v, min, max, step);
          obj[key] = v;
          sl.value = String(v);
          num.value = _fmt(v, step);
          onChange?.(v);
        });
        num.addEventListener("keydown", (e) => {
          if (e.key === "Enter") num.blur();
        });
        parent.appendChild(row);
        return row;
      }
      function _color(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-color-wrap"><input type="color" class="prop-color" value="${obj[key]}"><span class="prop-slider-val" style="width:auto">${obj[key]}</span></div></div>`;
        const inp = row.querySelector(".prop-color");
        const hex = row.querySelector(".prop-slider-val");
        inp.addEventListener("input", () => {
          obj[key] = inp.value;
          hex.textContent = inp.value;
          onChange?.(inp.value);
        });
        parent.appendChild(row);
        return row;
      }
      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.(obj[key]);
        });
        parent.appendChild(row);
        return row;
      }
      function _separator(parent) {
        const div = document.createElement("div");
        div.className = "section-separator";
        parent.appendChild(div);
      }
      function _select(parent, obj, key, choices, opts = {}) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const lab = document.createElement("span");
        lab.className = "prop-label";
        lab.textContent = label;
        const group = document.createElement("div");
        group.style.cssText = "display:flex;gap:4px;flex:1";
        choices.forEach((c) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = c;
          b.className = "palette-btn" + (obj[key] === c ? " palette-btn-primary" : "");
          b.style.cssText = "flex:1;padding:4px 0;font-size:10px";
          b.addEventListener("click", () => {
            obj[key] = c;
            group.querySelectorAll("button").forEach((x) => x.classList.toggle("palette-btn-primary", x === b));
            onChange?.(c);
          });
          group.appendChild(b);
        });
        row.appendChild(lab);
        row.appendChild(group);
        parent.appendChild(row);
        return row;
      }
      function _button(parent, label, onClick) {
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<button class="palette-btn palette-btn-wide" type="button">${label}</button>`;
        row.querySelector("button").addEventListener("click", onClick);
        parent.appendChild(row);
        return row;
      }

      function buildInspector({
        camera, floorMat, roadMat, builder, vehicle, updateSun, rebuildSkyEnv,
        obstacleParams, parkour, bakeCollision, debugGroup, refreshCollisionDebug,
        props,
        goToParkour, goToTrack,
      }) {
        const body = document.getElementById("inspector-body");
        document.getElementById("inspector-toggle").addEventListener("click", (e) => {
          const hidden = document.body.classList.toggle("inspector-hidden");
          e.target.textContent = hidden ? "Show" : "Hide";
        });

        // Resize handle.
        {
          const handle = document.getElementById("inspector-resize-handle");
          const apply = (w) =>
            document.documentElement.style.setProperty(
              "--inspector-width",
              Math.max(240, Math.min(innerWidth * 0.7, w)) + "px",
            );
          let dragging = false;
          handle.addEventListener("pointerdown", (e) => {
            dragging = true;
            document.body.classList.add("inspector-resizing");
            e.preventDefault();
          });
          window.addEventListener("pointermove", (e) => {
            if (dragging) apply(innerWidth - e.clientX);
          });
          window.addEventListener("pointerup", () => {
            dragging = false;
            document.body.classList.remove("inspector-resizing");
          });
        }

        // ── Road profile (the cross-section "depth") ──
        {
          const sec = _section(body, "Road profile", false);
          const reb = () => builder.rebuildAll();
          _slider(sec, roadParams, "width", { label: "Width", min: 4, max: 24, step: 0.25, onChange: reb });
          _slider(sec, roadParams, "thickness", { label: "Thickness", min: 0.1, max: 3, step: 0.05, onChange: reb });
          _slider(sec, roadParams, "railWidth", { label: "Kerb width", min: 0, max: 2, step: 0.05, onChange: reb });
          _slider(sec, roadParams, "railHeight", { label: "Kerb height", min: 0, max: 1, step: 0.02, onChange: reb });
          _slider(sec, roadParams, "segLen", { label: "Tess (m)", min: 0.5, max: 5, step: 0.1, onChange: reb });
        }

        // ── Vehicle (VVV physics — tune the test car) ──
        {
          const sec = _section(body, "Vehicle (test drive)", true);
          _slider(sec, TIRE, "accelForce", { label: "Accel (N)", min: 500, max: 20000, step: 100 });
          _slider(sec, TIRE, "topSpeed", { label: "Top speed", min: 5, max: 80, step: 1 });
          _slider(sec, TIRE, "brakeForce", { label: "Brake (N)", min: 0, max: 30000, step: 100 });
          _slider(sec, TIRE, "maxSteerAngle", { label: "Steer max", min: 0.1, max: 1.2, step: 0.01 });
          _slider(sec, TIRE, "steerSpeedReduce", { label: "Steer hi-spd cut", min: 0, max: 0.9, step: 0.05 });
          _slider(sec, TIRE, "steerSpeedRef", { label: "Steer cut @ (m/s)", min: 8, max: 60, step: 1 });
          _separator(sec);
          _slider(sec, TIRE, "frictionCoeff", { label: "Friction μ", min: 0.5, max: 3, step: 0.05 });
          _slider(sec, TIRE, "tireStiffness", { label: "Tire stiffness", min: 2, max: 16, step: 0.5 });
          _slider(sec, TIRE, "gripFront", { label: "Grip front", min: 0, max: 1.2, step: 0.01 });
          _slider(sec, TIRE, "gripRear", { label: "Grip rear", min: 0, max: 1.2, step: 0.01 });
          _slider(sec, TIRE, "gripHandbrake", { label: "Grip handbrake", min: 0, max: 1, step: 0.01 });
          _separator(sec);
          _select(sec, DRIVETRAIN, "layout", ["FWD", "AWD", "RWD"], { label: "Drivetrain" });
          _slider(sec, DRIVETRAIN, "powerBias", { label: "Power bias →R", min: 0, max: 1, step: 0.05 });
          _separator(sec);
          _slider(sec, TIRE, "springStrength", { label: "Spring k", min: 5000, max: 150000, step: 500 });
          _slider(sec, TIRE, "damper", { label: "Damper", min: 0, max: 20000, step: 50 });
          _slider(sec, TIRE, "rayRingCount", { label: "Wheel rays", min: 0, max: 16, step: 1 });
          _separator(sec);
          _slider(sec, TIRE, "stabilizerStrength", { label: "Surface align", min: 0, max: 30000, step: 200 });
          _slider(sec, TIRE, "stabilizerDamp", { label: "Align damp", min: 0, max: 8000, step: 100 });
          _slider(sec, TIRE, "airControl", { label: "Air pitch/roll", min: 0, max: 15000, step: 250 });
          _slider(sec, TIRE, "airYawControl", { label: "Air spin (Q/E)", min: 0, max: 15000, step: 250 });
          _slider(sec, TIRE, "airAngularDamp", { label: "Air tilt damp", min: 0, max: 5000, step: 100 });
          _slider(sec, TIRE, "airYawDamp", { label: "Air spin damp", min: 0, max: 5000, step: 50 });
          _separator(sec);
          _slider(sec, AERO, "drag", { label: "Aero drag", min: 0, max: 3, step: 0.05 });
          _slider(sec, AERO, "downforce", { label: "Downforce", min: 0, max: 12, step: 0.25 });
          _separator(sec);
          _slider(sec, CHASSIS, "mass", { label: "Mass (kg)", min: 400, max: 4000, step: 50, onChange: () => vehicle.rebuildBody() });
          _separator(sec);
          _slider(sec, CHASSIS, "comZ", { label: "CoM front (+Z)", min: -0.8, max: 0.8, step: 0.01, onChange: () => vehicle.rebuildBody() });
          _slider(sec, CHASSIS, "comY", { label: "CoM up (+Y)", min: -0.35, max: 0.35, step: 0.01, onChange: () => vehicle.rebuildBody() });
          _slider(sec, CHASSIS, "comX", { label: "CoM right (+X)", min: -0.5, max: 0.5, step: 0.01, onChange: () => vehicle.rebuildBody() });
          _slider(sec, CHASSIS, "visualLift", { label: "Visual lift (m)", min: -0.5, max: 2, step: 0.01 });
          _separator(sec);
          _toggle(sec, DECK, "enabled", { label: "Chassis-vs-deck" });
          _toggle(sec, SOLID, "enabled", { label: "Guardrail collision" });
          _slider(sec, SOLID, "radius", { label: "Box sample reach", min: 0.15, max: 1.2, step: 0.05 });
          _slider(sec, SOLID, "stiffness", { label: "Collide stiff", min: 50000, max: 600000, step: 5000 });
          _toggle(sec, { v: true }, "v", { label: "Force arrows", onChange: (on) => vehicle.setArrowsVisible(on) });
        }

        // ── Test obstacles + collision debug ──
        {
          const sec = _section(body, "Test obstacles & debug", false);
          _toggle(sec, obstacleParams, "enabled", {
            label: "Obstacle parkour",
            onChange: (on) => {
              parkour.group.visible = on;
              bakeCollision();
            },
          });
          _button(sec, "Go to parkour", () => goToParkour());
          _button(sec, "Go to track start", () => goToTrack());
          _separator(sec);
          _toggle(sec, debugGroup, "visible", {
            label: "Show collision mesh",
            onChange: (on) => (on ? bakeCollision() : refreshCollisionDebug()),
          });
        }

        // ── Guardrail (W-beam + posts on top of the kerbs) ──
        {
          const sec = _section(body, "Guardrail", false);
          const reb = () => builder.rebuildAll();
          _toggle(sec, guardrailParams, "enabled", { label: "Enabled", onChange: reb });
          _slider(sec, guardrailParams, "beamHeight", { label: "Beam height", min: 0.05, max: 0.8, step: 0.01, onChange: reb });
          _slider(sec, guardrailParams, "beamGap", { label: "Beam gap", min: 0, max: 0.6, step: 0.01, onChange: reb });
          _slider(sec, guardrailParams, "beamDepth", { label: "Beam depth", min: 0.02, max: 0.3, step: 0.01, onChange: reb });
          _slider(sec, guardrailParams, "postSpacing", { label: "Post spacing", min: 1, max: 12, step: 0.5, onChange: reb });
        }

        // ── Piece geometry (applies to the next placed piece + ghost) ──
        {
          const sec = _section(body, "Piece geometry", false);
          const reb = () => builder.refreshGhost();
          _slider(sec, pieceParams, "straightLength", { label: "Straight len", min: 4, max: 80, step: 1, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "curveRadius", { label: "Curve radius", min: 5, max: 120, step: 1, onChange: reb });
          _slider(sec, pieceParams, "curveAngle", { label: "Curve angle", min: 5, max: 180, step: 1, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "slopeLength", { label: "Slope run", min: 4, max: 80, step: 1, onChange: reb });
          _slider(sec, pieceParams, "slopeRise", { label: "Slope rise", min: -30, max: 30, step: 0.5, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "bankAngle", { label: "Bank angle", min: 0, max: 60, step: 1, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "jumpLength", { label: "Jump len", min: 4, max: 60, step: 1, onChange: reb });
          _slider(sec, pieceParams, "jumpAngle", { label: "Jump angle", min: 0, max: 75, step: 1, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "loopRadius", { label: "Loop radius", min: 4, max: 30, step: 0.5, onChange: reb });
          _slider(sec, pieceParams, "loopAdvance", { label: "Loop advance", min: 0, max: 45, step: 0.5, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "twistLength", { label: "Twist len", min: 6, max: 80, step: 1, onChange: reb });
          _slider(sec, pieceParams, "twistTurns", { label: "Twist turns", min: 1, max: 4, step: 1, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "tunnelHeight", { label: "Tunnel height", min: 4, max: 14, step: 0.5, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "spiralRadius", { label: "Spiral radius", min: 5, max: 60, step: 1, onChange: reb });
          _slider(sec, pieceParams, "spiralAngle", { label: "Spiral arc", min: 30, max: 720, step: 5, onChange: reb });
          _slider(sec, pieceParams, "spiralRise", { label: "Spiral rise", min: -30, max: 30, step: 0.5, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "gapLength", { label: "Gap length", min: 4, max: 60, step: 1, onChange: reb });
          _slider(sec, pieceParams, "gapDrop", { label: "Gap drop", min: 0, max: 30, step: 0.5, onChange: reb });
          _separator(sec);
          _slider(sec, pieceParams, "landLength", { label: "Landing len", min: 4, max: 50, step: 1, onChange: reb });
          _slider(sec, pieceParams, "landAngle", { label: "Landing angle", min: 0, max: 70, step: 1, onChange: reb });
        }

        // ── Props (free placement with gizmo) ──
        {
          const sec = _section(body, "Props (gizmo placement)", false);
          const hint = document.createElement("div");
          hint.className = "section-note";
          hint.style.cssText = "font-size:10px;opacity:.7;padding:2px 2px 6px;line-height:1.5";
          hint.innerHTML =
            "Add a prop, then drag the gizmo. <kbd>W</kbd> move &bull; <kbd>E</kbd> rotate &bull; <kbd>R</kbd> scale &bull; <kbd>Q</kbd> world/local &bull; right-click select &bull; <kbd>Del</kbd> delete &bull; <kbd>Ctrl+D</kbd> duplicate. Rebake collision after moving.";
          sec.appendChild(hint);
          for (const def of PROP_CATALOG) {
            _button(sec, "+ " + def.label, () => props.add(def.id));
          }
          _separator(sec);
          const gz = { mode: "translate" };
          _select(sec, gz, "mode", ["translate", "rotate", "scale"], {
            label: "Gizmo",
            onChange: (m) => props.setMode(m),
          });
          _separator(sec);
          _button(sec, "Duplicate (Ctrl+D)", () => props.duplicateSelected());
          _button(sec, "Delete selected (Del)", () => props.deleteSelected());
          _button(sec, "Clear all props", () => props.clear());
        }

        // ── Road colors ──
        {
          const sec = _section(body, "Road colors", false);
          const C = PARAMS.roadColors;
          const apply = () => syncRoadUniforms(roadMat, C);
          _color(sec, C, "asphaltDark", { label: "Asphalt dk", onChange: apply });
          _color(sec, C, "asphaltLight", { label: "Asphalt lt", onChange: apply });
          _color(sec, C, "lineColor", { label: "Lines", onChange: apply });
          _color(sec, C, "railA", { label: "Rail A", onChange: apply });
          _color(sec, C, "railB", { label: "Rail B", onChange: apply });
          _color(sec, C, "sideColor", { label: "Sides", onChange: apply });
        }

        // ── Lights ──
        {
          const sec = _section(body, "Lights", false);
          const up = () => updateSun();
          const upEnv = () => {
            updateSun();
            rebuildSkyEnv();
          };
          _slider(sec, PARAMS.light, "sunAzimuth", { label: "Sun azim", min: 0, max: 360, step: 1, onChange: upEnv });
          _slider(sec, PARAMS.light, "sunElevation", { label: "Sun elev", min: -10, max: 90, step: 1, onChange: upEnv });
          _color(sec, PARAMS.light, "dirColor", { label: "Sun color", onChange: up });
          _slider(sec, PARAMS.light, "dirIntensity", { label: "Sun int", min: 0, max: 10, step: 0.05, onChange: up });
          _slider(sec, PARAMS.light, "hemiIntensity", { label: "Hemi int", min: 0, max: 3, step: 0.05, onChange: up });
          _slider(sec, PARAMS.light, "envIntensity", { label: "Env int", min: 0, max: 3, step: 0.05, onChange: up });
          _slider(sec, PARAMS.light, "exposure", { label: "Exposure", min: 0, max: 3, step: 0.05, onChange: up });
          _separator(sec);
          _slider(sec, PARAMS.light, "shadowNormalBias", { label: "Shadow nbias", min: 0, max: 4, step: 0.05, onChange: up });
          _slider(sec, PARAMS.light, "shadowBias", { label: "Shadow bias", min: -0.002, max: 0.002, step: 0.0001, onChange: up });
        }

        // ── Sky ──
        {
          const sec = _section(body, "Sky", false);
          const reb = () => rebuildSkyEnv();
          _slider(sec, PARAMS.physicalSky, "turbidity", { label: "Turbidity", min: 0.1, max: 20, step: 0.1, onChange: reb });
          _slider(sec, PARAMS.physicalSky, "rayleigh", { label: "Rayleigh", min: 0, max: 4, step: 0.01, onChange: reb });
          _slider(sec, PARAMS.physicalSky, "cloudCoverage", { label: "Cloud cov", min: 0, max: 1, step: 0.01, onChange: reb });
          _slider(sec, PARAMS.physicalSky, "cloudDensity", { label: "Cloud dens", min: 0, max: 2, step: 0.01, onChange: reb });
        }
      }

      init().catch((e) => {
        console.error("Init failed:", e);
        document.getElementById("backend").textContent = "Error: " + e.message;
      });
    </script>
  </body>
</html>
