<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pine forest bench (card LOD)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font: 12px/1.55 var(--font-mono);
        color: #b0d890;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 14px;
        border-radius: 6px;
        pointer-events: none;
        user-select: none;
        backdrop-filter: blur(4px);
        max-width: min(720px, 92vw);
        text-align: center;
      }
      #info span {
        color: #e0f0c0;
        font-weight: 600;
      }
      #title {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 5;
        font-size: 13px;
        font-weight: 600;
        color: rgba(200, 220, 180, 0.85);
        pointer-events: none;
      }
      :root {
        --bg-dark: #222222;
        --bg-panel: #2a2a2a;
        --bg-item: #333333;
        --bg-hover: #3a3a3a;
        --bg-input: #1e1e1e;
        --border: #3c3c3c;
        --border-light: #4a4a4a;
        --text: #cccccc;
        --text-dim: #888888;
        --text-bright: #e0e0e0;
        --accent: #4a9eff;
        --font: "Segoe UI", system-ui, -apple-system, sans-serif;
        --font-mono: "Cascadia Code", "Fira Code", Consolas, monospace;
        --radius: 4px;
      }
      #ui {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 20;
        width: 320px;
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: var(--font);
        font-size: 13px;
        color: var(--text);
        user-select: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #ui .panel-header {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        min-height: 36px;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: var(--text-bright);
        flex-shrink: 0;
      }
      #ui-scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #ui-scroll::-webkit-scrollbar {
        width: 8px;
      }
      #ui-scroll::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .inspector-section {
        border-bottom: 1px solid var(--border);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-dim);
      }
      .section-header:hover {
        background: var(--bg-hover);
      }
      .section-header .section-arrow {
        width: 14px;
        height: 14px;
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      .section-header.collapsed .section-arrow {
        transform: rotate(-90deg);
      }
      .section-body {
        padding: 6px 12px 10px;
      }
      .section-body.hidden {
        display: none;
      }
      .prop-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .prop-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
        line-height: 1.2;
      }
      .prop-value {
        flex: 1;
        display: flex;
        gap: 4px;
        align-items: center;
        min-width: 0;
      }
      .prop-slider-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .prop-num-input {
        width: 72px;
        height: 22px;
        flex-shrink: 0;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 5px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--font-mono);
        text-align: right;
        outline: none;
      }
      .prop-num-input:focus {
        border-color: var(--accent);
      }
      .prop-num-input::-webkit-outer-spin-button,
      .prop-num-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .prop-num-input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .prop-slider {
        flex: 1;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--bg-input);
        border-radius: 2px;
        outline: none;
        min-width: 0;
      }
      .prop-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }
      .prop-toggle {
        width: 14px;
        height: 14px;
        border: 1px solid var(--border-light);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
        color: transparent;
      }
      .prop-toggle.checked {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .prop-toggle svg {
        width: 10px;
        height: 10px;
      }
      .section-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 26px;
        margin-top: 4px;
        background: var(--bg-item);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
      }
      .section-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
        border-color: var(--border-light);
      }
      .ui-separator {
        height: 1px;
        background: var(--border);
        margin: 8px 0;
      }
      .info-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        min-height: 26px;
      }
      .info-label {
        width: 108px;
        min-width: 108px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
        padding-right: 4px;
      }
      .info-value {
        flex: 1;
        font-size: 11px;
        color: var(--text);
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .section-hint {
        font-size: 10px;
        line-height: 1.45;
        color: var(--text-dim);
        padding: 2px 0 6px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="title">Pine card forest bench</div>
    <div id="info">loading…</div>
    <div id="ui">
      <div class="panel-header">Forest bench</div>
      <div id="ui-scroll"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import Stats from "stats-gl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { CSMShadowNode } from "three/addons/csm/CSMShadowNode.js";
      import {
        PineForestBench,
        DEFAULT_PINE_PARAMS,
        DEFAULT_FOREST_DIVERSITY,
      } from "./pine-forest-bench-core.js";
      import { PineForestWalker } from "./pine-forest-walker.js";

      const _arrowSvg =
        '<svg class="section-arrow" viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg>';
      const _checkSvg =
        '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 6l3 3 5-5"/></svg>';

      const uiScroll = document.getElementById("ui-scroll");
      const infoEl = document.getElementById("info");

      function _fmt(v, step) {
        const stepStr = String(step);
        let decimals = 0;
        if (stepStr.includes(".")) decimals = stepStr.split(".")[1].length;
        else if (stepStr.includes("e-")) decimals = 8;
        if (decimals > 0) return Number(v).toFixed(decimals);
        return String(v);
      }

      function _clampSnap(v, min, max, step) {
        let out = Math.round(v / step) * step;
        if (stepStrIncludes(step)) out = Number(out.toFixed(8));
        return Math.min(max, Math.max(min, out));
      }

      function stepStrIncludes(step) {
        const s = String(step);
        return s.includes(".") || s.includes("e-");
      }

      function _section(parent, title, expanded = true) {
        const sec = document.createElement("div");
        sec.className = "inspector-section";
        const hdr = document.createElement("div");
        hdr.className = "section-header" + (expanded ? "" : " collapsed");
        hdr.innerHTML = _arrowSvg + " " + title;
        const body = document.createElement("div");
        body.className = "section-body" + (expanded ? "" : " hidden");
        hdr.addEventListener("click", () => {
          hdr.classList.toggle("collapsed");
          body.classList.toggle("hidden");
        });
        sec.appendChild(hdr);
        sec.appendChild(body);
        parent.appendChild(sec);
        return body;
      }

      function _slider(parent, obj, key, opts) {
        const { label, min, max, step = 0.01, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        const cur = obj[key];
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><div class="prop-slider-wrap"><input type="range" class="prop-slider" min="${min}" max="${max}" step="${step}" value="${cur}"><input type="number" class="prop-num-input" min="${min}" max="${max}" step="${step}" value="${_fmt(cur, step)}"></div></div>`;
        const sl = row.querySelector(".prop-slider");
        const num = row.querySelector(".prop-num-input");
        const syncNumDisplay = () => {
          num.value = _fmt(obj[key], step);
        };
        const applyFromSlider = () => {
          obj[key] = parseFloat(sl.value);
          syncNumDisplay();
          onChange?.();
        };
        const commitFromNum = () => {
          const raw = String(num.value).trim();
          if (raw === "" || raw === "-" || raw === "." || raw === "-.") {
            syncNumDisplay();
            return;
          }
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) {
            syncNumDisplay();
            return;
          }
          v = _clampSnap(v, min, max, step);
          obj[key] = v;
          sl.value = String(v);
          syncNumDisplay();
          onChange?.();
        };
        sl.addEventListener("input", applyFromSlider);
        num.addEventListener("change", commitFromNum);
        num.addEventListener("keydown", (e) => {
          if (e.key === "Enter") num.blur();
        });
        parent.appendChild(row);
      }

      function _toggle(parent, obj, key, opts) {
        const { label, onChange } = opts;
        const row = document.createElement("div");
        row.className = "prop-row";
        row.innerHTML = `<span class="prop-label">${label}</span><div class="prop-value"><button type="button" class="prop-toggle ${obj[key] ? "checked" : ""}">${_checkSvg}</button></div>`;
        const btn = row.querySelector(".prop-toggle");
        btn.addEventListener("click", () => {
          obj[key] = !obj[key];
          btn.classList.toggle("checked", obj[key]);
          onChange?.();
        });
        parent.appendChild(row);
        return btn;
      }

      function _button(parent, opts) {
        const { title, onClick } = opts;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "section-btn";
        btn.textContent = title;
        btn.addEventListener("click", onClick);
        parent.appendChild(btn);
      }

      function _separator(parent) {
        const el = document.createElement("div");
        el.className = "ui-separator";
        parent.appendChild(el);
      }

      function _info(parent, label, getValue) {
        const row = document.createElement("div");
        row.className = "info-row";
        const valSpan = document.createElement("span");
        valSpan.className = "info-value";
        valSpan.textContent = getValue();
        row.innerHTML = `<span class="info-label">${label}</span>`;
        row.appendChild(valSpan);
        parent.appendChild(row);
        return { update(v) { valSpan.textContent = v; } };
      }

      function _hint(parent, text) {
        const el = document.createElement("div");
        el.className = "section-hint";
        el.textContent = text;
        parent.appendChild(el);
      }

      const CFG = {
        forest: {
          halfExtent: 140,
          spacing: 8,
          chunkSize: 100,
          jitter: 2,
          density: 1,
          diversity: { ...DEFAULT_FOREST_DIVERSITY },
        },
        lod: {
          lod0Distance: 80,
          lod1Distance: 200,
          fadeOutDistance: 600,
          lodHysteresis: 12,
        },
        shadow: {
          lod0Receive: true,
          castFoliage: true,
        },
      };

      function setSunShadowNode(shadow, node) {
        if (node != null) shadow.shadowNode = node;
        else delete shadow.shadowNode;
      }

      async function init() {
        const params = structuredClone(DEFAULT_PINE_PARAMS);
        params.material.colorSource = "tsl";

        const renderer = new THREE.WebGPURenderer({ antialias: true });
        const stats = new Stats({ trackGPU: true });
        await stats.init(renderer);
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.transmitted = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(stats.dom);

        const backend =
          renderer.backend?.constructor?.name?.includes("WebGPU")
            ? "WebGPU"
            : "WebGL fallback";

        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#87ceeb");
        scene.fog = new THREE.FogExp2("#87ceeb", 0.0018);

        const camera = new THREE.PerspectiveCamera(
          55,
          innerWidth / innerHeight,
          0.5,
          2500,
        );
        camera.position.set(40, 18, 55);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 4, 0);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI * 0.48;
        controls.update();

        const hemi = new THREE.HemisphereLight("#b8dfff", "#3d6b20", 0.55);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight("#fff8e8", 2.1);
        sun.position.set(80, 120, 40);
        sun.castShadow = true;
        const sunTarget = new THREE.Object3D();
        sunTarget.position.set(0, 0, 0);
        scene.add(sunTarget);
        sun.target = sunTarget;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 400;
        const sh = 180;
        sun.shadow.camera.left = -sh;
        sun.shadow.camera.right = sh;
        sun.shadow.camera.top = sh;
        sun.shadow.camera.bottom = -sh;
        sun.shadow.bias = -0.0003;
        sun.shadow.normalBias = 0.02;
        scene.add(sun);

        let csm = null;
        try {
          csm = new CSMShadowNode(sun, {
            cascades: 2,
            maxFar: 300,
            mode: "practical",
            lightMargin: 100,
          });
          setSunShadowNode(sun.shadow, csm);
        } catch (e) {
          console.warn("CSM init failed", e);
        }

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(1200, 1200),
          new THREE.MeshStandardMaterial({ color: "#4a7c2a", roughness: 0.95 }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const walker = new PineForestWalker({
          scene,
          camera,
          domElement: renderer.domElement,
          getGroundY: () => 0,
        });
        walker.seedFromOrbitTarget(0, 12, 0);

        infoEl.textContent = "Building forest…";

        const forest = new PineForestBench(scene, params, CFG);
        await forest.init("textures/pine-leaves/Frame 56.png");

        forest.syncSunDirection(sun.position.clone().normalize());

        function applyReceiveFlags() {
          forest.cfg = CFG;
          forest.applyShadowFlags();
        }

        let forestRebuildTimer = 0;
        function scheduleForestRebuild() {
          clearTimeout(forestRebuildTimer);
          forestRebuildTimer = setTimeout(() => {
            infoEl.textContent = "Rebuilding forest…";
            forest.cfg = CFG;
            const t0 = performance.now();
            forest.rebuildForest();
            applyReceiveFlags();
            const n = forest.stats.treeCount;
            const ms = Math.round(performance.now() - t0);
            infoEl.textContent = `${n} trees · ${forest.stats.chunkCount} chunks · list rebuilt in ${ms}ms`;
          }, 250);
        }

        function syncDiversityLive() {
          forest.cfg = CFG;
          forest.syncDiversityUniforms();
        }

        // ── UI sections ──
        const sStats = _section(uiScroll, "Stats", true);
        const statRows = {};
        for (const key of [
          "renderMode",
          "treeCount",
          "visibleTrees",
          "drawCalls",
          "chunkCount",
          "visibleChunks",
          "lod0Leaves",
          "lod1Leaves",
          "lod2Leaves",
          "trunkInstances",
        ]) {
          statRows[key] = _info(sStats, key, () => "—");
        }
        _info(sStats, "backend", () => backend);
        _info(sStats, "leaves/tree", () =>
          forest.leavesPerLod.join(" / "),
        );

        const sCam = _section(uiScroll, "Camera", true);
        let walkMode = false;
        function setCameraMode(walk) {
          walkMode = walk;
          walker.setMode(walk ? "walk" : "orbit", controls);
          if (walk) {
            walker.seedFromOrbitTarget(
              controls.target.x,
              controls.target.z,
              Math.atan2(
                controls.target.x - camera.position.x,
                controls.target.z - camera.position.z,
              ) + Math.PI,
            );
          }
        }
        const camState = { walk: false };
        const walkBtn = _toggle(sCam, camState, "walk", {
          label: "Capsule walk",
          onChange: () => setCameraMode(camState.walk),
        });
        _slider(sCam, walker, "moveSpeed", {
          label: "Walk speed",
          min: 4,
          max: 28,
          step: 1,
        });
        _slider(sCam, walker, "camFollowDist", {
          label: "Cam distance",
          min: 3,
          max: 14,
          step: 0.5,
        });
        _hint(sCam, "Tab toggles walk · WASD move · click+mouse look");

        window.addEventListener("keydown", (e) => {
          if (e.target.matches("input")) return;
          if (e.code === "Tab") {
            e.preventDefault();
            camState.walk = !camState.walk;
            walkBtn.classList.toggle("checked", camState.walk);
            setCameraMode(camState.walk);
          }
        });

        const sForest = _section(uiScroll, "Forest placement", true);
        _slider(sForest, CFG.forest, "halfExtent", {
          label: "Half extent (m)",
          min: 40,
          max: 220,
          step: 10,
          onChange: scheduleForestRebuild,
        });
        _slider(sForest, CFG.forest, "spacing", {
          label: "Spacing (m)",
          min: 5,
          max: 14,
          step: 1,
          onChange: scheduleForestRebuild,
        });
        _slider(sForest, CFG.forest, "jitter", {
          label: "Jitter (m)",
          min: 0,
          max: 6,
          step: 0.25,
          onChange: scheduleForestRebuild,
        });
        _slider(sForest, CFG.forest, "density", {
          label: "Density",
          min: 0.2,
          max: 1,
          step: 0.05,
          onChange: scheduleForestRebuild,
        });
        _slider(sForest, CFG.forest.diversity, "placementSeed", {
          label: "Seed (0=rand)",
          min: 0,
          max: 99999,
          step: 1,
          onChange: scheduleForestRebuild,
        });
        _button(sForest, {
          title: "Rebuild forest now",
          onClick: scheduleForestRebuild,
        });

        const sDiv = _section(uiScroll, "Diversity", true);
        _hint(
          sDiv,
          "Defaults match the original bench. Shader knobs update live; shape knobs rebuild chunks.",
        );
        const DIV = CFG.forest.diversity;
        _slider(sDiv, DIV, "treeScale", {
          label: "Tree scale",
          min: 0.5,
          max: 2.5,
          step: 0.05,
          onChange: scheduleForestRebuild,
        });
        _slider(sDiv, DIV, "treeScaleJitter", {
          label: "Scale jitter",
          min: 0,
          max: 0.4,
          step: 0.01,
          onChange: scheduleForestRebuild,
        });
        _slider(sDiv, DIV, "scaleYJitter", {
          label: "Height jitter",
          min: 0,
          max: 0.35,
          step: 0.01,
          onChange: scheduleForestRebuild,
        });
        _slider(sDiv, DIV, "scaleXZJitter", {
          label: "Width jitter",
          min: 0,
          max: 0.25,
          step: 0.01,
          onChange: scheduleForestRebuild,
        });
        _slider(sDiv, DIV, "leanMaxDeg", {
          label: "Lean max (°)",
          min: 0,
          max: 12,
          step: 0.5,
          onChange: scheduleForestRebuild,
        });
        _separator(sDiv);
        _slider(sDiv, DIV, "tintStrength", {
          label: "Tint strength",
          min: 0,
          max: 0.35,
          step: 0.01,
          onChange: () => {
            syncDiversityLive();
            scheduleForestRebuild();
          },
        });
        _slider(sDiv, DIV, "brightnessJitter", {
          label: "Brightness ±",
          min: 0,
          max: 0.25,
          step: 0.01,
          onChange: () => {
            syncDiversityLive();
            scheduleForestRebuild();
          },
        });
        _slider(sDiv, DIV, "colorVarTreeBias", {
          label: "Tree color bias",
          min: 0,
          max: 1,
          step: 0.05,
          onChange: syncDiversityLive,
        });
        _slider(sDiv, DIV, "windMulJitter", {
          label: "Wind variation",
          min: 0,
          max: 0.6,
          step: 0.02,
          onChange: () => {
            syncDiversityLive();
            scheduleForestRebuild();
          },
        });

        const sLod = _section(uiScroll, "LOD distances", false);
        _slider(sLod, CFG.lod, "lod0Distance", {
          label: "LOD0 (m)",
          min: 20,
          max: 160,
          step: 5,
        });
        _slider(sLod, CFG.lod, "lod1Distance", {
          label: "LOD1 (m)",
          min: 80,
          max: 320,
          step: 10,
        });
        _slider(sLod, CFG.lod, "fadeOutDistance", {
          label: "Fade out (m)",
          min: 200,
          max: 700,
          step: 25,
        });
        _slider(sLod, CFG.lod, "lodHysteresis", {
          label: "Hysteresis (m)",
          min: 0,
          max: 40,
          step: 2,
        });

        const sSh = _section(uiScroll, "Shadows", false);
        _toggle(sSh, CFG.shadow, "lod0Receive", {
          label: "LOD0 receive",
          onChange: applyReceiveFlags,
        });
        _toggle(sSh, CFG.shadow, "castFoliage", {
          label: "Foliage cast",
          onChange: applyReceiveFlags,
        });

        const timer = new THREE.Timer();
        timer.connect(document);

        renderer.setAnimationLoop(() => {
          timer.update();
          const dt = timer.getDelta();
          const t = timer.getElapsed();
          forest.updateTime(t);
          walker.update(dt);
          forest.update(camera, CFG.lod);
          if (!walkMode) controls.update();

          if (csm?.mainFrustum) {
            csm.mainFrustum.camera = camera;
            csm.updateFrustums();
          }

          renderer.render(scene, camera);
          renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER);
          stats.update();

          const s = forest.stats;
          const perTree = forest.leavesPerLod;
          infoEl.innerHTML = [
            `<span>${backend}</span>`,
            `<span>${s.renderMode}</span> · <span>${s.drawCalls}</span> draws`,
            `${s.visibleTrees}/${s.treeCount} trees`,
            `LOD0 <span>${s.lod0Leaves}</span> (${perTree[0]}/tree)`,
            `LOD1 <span>${s.lod1Leaves}</span> · LOD2 <span>${s.lod2Leaves}</span>`,
            walkMode
              ? `walk <span>WASD</span> · Shift sprint`
              : `orbit <span>RMB</span> · Tab walk`,
          ].join(" · ");

          for (const [k, row] of Object.entries(statRows)) {
            row.update(String(s[k] ?? "—"));
          }
        });

        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
          if (csm?.mainFrustum) csm.updateFrustums();
        });
      }

      init().catch((err) => {
        console.error(err);
        infoEl.textContent = String(err);
      });
    </script>
  </body>
</html>
