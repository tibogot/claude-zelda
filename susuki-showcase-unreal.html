<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Susuki Grass Showcase (Unreal)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: "SF Mono", "Fira Code", monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #info {
      position: fixed; bottom: 12px; left: 12px; z-index: 20;
      background: rgba(0,0,0,0.6); color: #b0d890;
      padding: 8px 12px; border-radius: 6px; font-size: 11px; line-height: 1.6;
    }
    #info span { color: #e0f0c0; font-weight: 600; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="info">
  <span>Susuki Grass</span> — Unreal look-dev (same field path as grass-sandbox)<br>
  Orbit: <span>left-drag</span> &nbsp; Zoom: <span>scroll</span>
</div>

<script type="module">
import * as THREE from "three";
import { WebGPURenderer } from "three/webgpu";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSMShadowNode } from "three/addons/csm/CSMShadowNode.js";
import { SkyMesh } from "three/addons/objects/SkyMesh.js";
import { uniform } from "three/tsl";
import GUI from "three/addons/libs/lil-gui.module.min.js";
import { buildSusukiCtx, SUSUKI_FIELD_PARAMS } from "./susuki-field-unreal.js";
import {
  createSusukiSingleFieldResources,
  setupSusukiSingleField,
} from "./susuki-single-field-unreal.js";

function hexToVec3(hex) {
  const c = new THREE.Color(hex);
  c.convertSRGBToLinear();
  return new THREE.Vector3(c.r, c.g, c.b);
}

// Defaults aligned with params.js + grass-sandbox susuki + wind; lighting/fog GUI same as susuki-showcase.html
const PARAMS = {
  stemHeight: 0.7,
  stemWidth: 0.08,
  bandWidth: 0.06,
  plumeStart: 0.6,
  plumeFlex: 0.2,
  plumeSoftEdge: 0,
  windDir: 0.7,
  windWaveScale: 0.08,
  windSpeed: 1.0,
  windStr: 0.4,
  windGust: 0.3,
  windMicro: 0.15,
  stemColor: "#2d5a1f",
  plumeColor: "#ffffff",
  sunAzimuth: 135,
  sunElevation: 41,
  sunIntensity: 2.2,
  dirColor: "#fff5e0",
  sceneAmbient: 1.0,
  exposure: 0.5,
  environmentIntensity: 0.45,
  skyTurbidity: 2,
  skyRayleigh: 1.5,
  skyMie: 0.005,
  skyMieG: 0.8,
  shadowBias: -0.002,
  shadowNormalBias: 0.08,
  aoIntensity: 1.0,
  bsIntensity: 0.4,
  bsColor: "#51cc66",
  bsPower: 2.0,
  frontScatter: 0.3,
  rimSSS: 0.4,
  specV1Intensity: 1.5,
  specV1Color: "#ffffff",
  specV1DirX: -1.0,
  specV1DirY: 1.0,
  specV1DirZ: 0.5,
  specV2Intensity: 1.0,
  specV2Color: "#ffffff",
  specV2DirX: -1.0,
  specV2DirY: 0.45,
  specV2DirZ: 1.0,
  specV2NoiseScale: 3.0,
  specV2NoiseStr: 0.6,
  specV2Power: 12.0,
  specV2TipBias: 0.5,
  fogEnabled: false,
  fogNear: 20,
  fogFar: 90,
  fogColor: "#a8c0d8",
  groundColor: "#3d5a3d",
  showGrid: true,
};

function sunDirectionFromAngles(azimuthDeg, elevationDeg) {
  const az = (azimuthDeg * Math.PI) / 180;
  const el = (elevationDeg * Math.PI) / 180;
  const cosEl = Math.cos(el);
  return new THREE.Vector3(
    cosEl * Math.cos(az),
    Math.sin(el),
    cosEl * Math.sin(az),
  ).normalize();
}

const renderer = new WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = PARAMS.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.background = null;
scene.fog = null;

const dirLight = new THREE.DirectionalLight(PARAMS.dirColor, PARAMS.sunIntensity);
const sunDir = sunDirectionFromAngles(PARAMS.sunAzimuth, PARAMS.sunElevation);
dirLight.position.copy(sunDir.clone().multiplyScalar(50));
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 200;
dirLight.shadow.bias = PARAMS.shadowBias;
dirLight.shadow.normalBias = PARAMS.shadowNormalBias;
const csm = new CSMShadowNode(dirLight, {
  cascades: 3,
  maxFar: 150,
  mode: "practical",
  lightMargin: 100,
});
dirLight.shadow.shadowNode = csm;
const shadowTarget = new THREE.Object3D();
shadowTarget.position.set(0, 0, 0);
scene.add(shadowTarget);
dirLight.target = shadowTarget;
scene.add(dirLight);

const hemiLight = new THREE.HemisphereLight(0xc8e0ff, 0x88aa55, PARAMS.sceneAmbient);
scene.add(hemiLight);

const sky = new SkyMesh();
sky.scale.setScalar(450000);
scene.add(sky);
sky.turbidity.value = PARAMS.skyTurbidity;
sky.rayleigh.value = PARAMS.skyRayleigh;
sky.mieCoefficient.value = PARAMS.skyMie;
sky.mieDirectionalG.value = PARAMS.skyMieG;

const pmremGenerator = new THREE.PMREMGenerator(renderer);

function updateSkyParams() {
  const sd = sunDirectionFromAngles(PARAMS.sunAzimuth, PARAMS.sunElevation);
  sky.sunPosition.value.copy(sd);
  sky.turbidity.value = PARAMS.skyTurbidity;
  sky.rayleigh.value = PARAMS.skyRayleigh;
  sky.mieCoefficient.value = PARAMS.skyMie;
  sky.mieDirectionalG.value = PARAMS.skyMieG;
}

function bakeEnvMap() {
  const skyEnvScene = new THREE.Scene();
  skyEnvScene.add(sky.clone());
  const skyEnv = pmremGenerator.fromScene(skyEnvScene, 0.04).texture;
  if (scene.environment) scene.environment.dispose();
  scene.environment = skyEnv;
  scene.environmentIntensity = PARAMS.environmentIntensity;
}

const groundGeo = new THREE.PlaneGeometry(80, 80, 1, 1);
const groundMat = new THREE.MeshStandardMaterial({
  color: PARAMS.groundColor,
  roughness: 0.95,
  metalness: 0,
  envMapIntensity: 1,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(80, 20, 0x4a5a6a, 0x3a4a5a);
grid.position.y = 0.01;
grid.visible = PARAMS.showGrid;
scene.add(grid);

function applySun() {
  const sd = sunDirectionFromAngles(PARAMS.sunAzimuth, PARAMS.sunElevation);
  dirLight.color.setStyle(PARAMS.dirColor);
  dirLight.intensity = PARAMS.sunIntensity;
  dirLight.position.copy(sd.clone().multiplyScalar(50));
  dirLight.shadow.bias = PARAMS.shadowBias;
  dirLight.shadow.normalBias = PARAMS.shadowNormalBias;
  hemiLight.intensity = PARAMS.sceneAmbient;
  uSunDir.value.copy(sd);
  updateSkyParams();
}

function applyRenderer() {
  renderer.toneMappingExposure = PARAMS.exposure;
  scene.environmentIntensity = PARAMS.environmentIntensity;
}

function applyFog() {
  if (PARAMS.fogEnabled) {
    const fc = new THREE.Color(PARAMS.fogColor);
    scene.fog = new THREE.Fog(fc, PARAMS.fogNear, PARAMS.fogFar);
  } else {
    scene.fog = null;
  }
}
function applyGround() {
  groundMat.color.setStyle(PARAMS.groundColor);
}
function applyWind() {
  const d = PARAMS.windDir;
  uWindDirX.value = Math.cos(d);
  uWindDirZ.value = Math.sin(d);
  uWindAxis.value.set(Math.sin(d), 0, -Math.cos(d));
  uCrossAxis.value.set(Math.cos(d), 0, Math.sin(d));
}
function applySpecDirs() {
  const d1 = new THREE.Vector3(PARAMS.specV1DirX, PARAMS.specV1DirY, PARAMS.specV1DirZ).normalize();
  const d2 = new THREE.Vector3(PARAMS.specV2DirX, PARAMS.specV2DirY, PARAMS.specV2DirZ).normalize();
  uSpecV1Dir.value.copy(d1);
  uSpecV2Dir.value.copy(d2);
}
function applyColors() {
  uSusukiStemColor.value.copy(hexToVec3(PARAMS.stemColor));
  uSusukiPlumeColor.value.copy(hexToVec3(PARAMS.plumeColor));
  uBsColor.value.copy(hexToVec3(PARAMS.bsColor));
  uSpecV1Color.value.copy(hexToVec3(PARAMS.specV1Color));
  uSpecV2Color.value.copy(hexToVec3(PARAMS.specV2Color));
}

const uTime = uniform(0);
const uTerrainSize = uniform(800);
const uSusukiStemHeight = uniform(PARAMS.stemHeight);
const uSusukiStemWidth = uniform(PARAMS.stemWidth);
const uSusukiBandWidth = uniform(PARAMS.bandWidth);
const uSusukiPlumeStart = uniform(PARAMS.plumeStart);
const uSusukiPlumeFlex = uniform(PARAMS.plumeFlex);
const uSusukiPlumeSoftEdge = uniform(PARAMS.plumeSoftEdge);
const uWindDirX = uniform(Math.cos(PARAMS.windDir));
const uWindDirZ = uniform(Math.sin(PARAMS.windDir));
const uWindAxis = uniform(
  new THREE.Vector3(
    Math.sin(PARAMS.windDir),
    0,
    -Math.cos(PARAMS.windDir),
  ),
);
const uCrossAxis = uniform(
  new THREE.Vector3(
    Math.cos(PARAMS.windDir),
    0,
    Math.sin(PARAMS.windDir),
  ),
);
const uWindWaveScale = uniform(PARAMS.windWaveScale);
const uWindSpeed = uniform(PARAMS.windSpeed);
const uWindStr = uniform(PARAMS.windStr);
const uWindGust = uniform(PARAMS.windGust);
const uWindMicro = uniform(PARAMS.windMicro);
const uSusukiStemColor = uniform(hexToVec3(PARAMS.stemColor));
const uSusukiPlumeColor = uniform(hexToVec3(PARAMS.plumeColor));
const uSunDir = uniform(new THREE.Vector3(0.5, 0.7, 0.5).normalize());
const uAoIntensity = uniform(PARAMS.aoIntensity);
const uBsColor = uniform(hexToVec3(PARAMS.bsColor));
const uBsPower = uniform(PARAMS.bsPower);
const uFrontScatter = uniform(PARAMS.frontScatter);
const uRimSSS = uniform(PARAMS.rimSSS);
const uBsIntensity = uniform(PARAMS.bsIntensity);
const uSpecV1Intensity = uniform(PARAMS.specV1Intensity);
const uSpecV1Color = uniform(hexToVec3(PARAMS.specV1Color));
const uSpecV1Dir = uniform(new THREE.Vector3(PARAMS.specV1DirX, PARAMS.specV1DirY, PARAMS.specV1DirZ).normalize());
const uSpecV2Intensity = uniform(PARAMS.specV2Intensity);
const uSpecV2Color = uniform(hexToVec3(PARAMS.specV2Color));
const uSpecV2Dir = uniform(new THREE.Vector3(PARAMS.specV2DirX, PARAMS.specV2DirY, PARAMS.specV2DirZ).normalize());
const uSpecV2NoiseScale = uniform(PARAMS.specV2NoiseScale);
const uSpecV2NoiseStr = uniform(PARAMS.specV2NoiseStr);
const uSpecV2Power = uniform(PARAMS.specV2Power);
const uSpecV2TipBias = uniform(PARAMS.specV2TipBias);
const uTrailCenter = uniform(new THREE.Vector2(9999, 9999));
const uPlayerPos = uniform(new THREE.Vector3(9999, 0, 9999));
const uInteractionRange = uniform(9999);
const uInteractionStrength = uniform(0);
const uInteractionHThresh = uniform(2);
const uInteractionRepel = uniform(1);

const susukiCtx = buildSusukiCtx({
  uniforms: {
    uTime,
    uTerrainSize,
    uSusukiStemHeight,
    uSusukiStemWidth,
    uSusukiBandWidth,
    uSusukiPlumeStart,
    uSusukiPlumeFlex,
    uSusukiPlumeSoftEdge,
    uWindDirX,
    uWindDirZ,
    uWindAxis,
    uCrossAxis,
    uWindWaveScale,
    uWindSpeed,
    uWindStr,
    uWindGust,
    uWindMicro,
    uSusukiStemColor,
    uSusukiPlumeColor,
    uSunDir,
    uAoIntensity,
    uBsColor,
    uBsPower,
    uFrontScatter,
    uRimSSS,
    uBsIntensity,
    uSpecV1Intensity,
    uSpecV1Color,
    uSpecV1Dir,
    uSpecV2Intensity,
    uSpecV2Color,
    uSpecV2Dir,
    uSpecV2NoiseScale,
    uSpecV2NoiseStr,
    uSpecV2Power,
    uSpecV2TipBias,
    uTrailCenter,
    uPlayerPos,
    uInteractionRange,
    uInteractionStrength,
    uInteractionHThresh,
    uInteractionRepel,
  },
  params: SUSUKI_FIELD_PARAMS,
});

const susukiResources = createSusukiSingleFieldResources(susukiCtx);
const susukiGroup = new THREE.Group();
scene.add(susukiGroup);

const susukiPatchSystem = setupSusukiSingleField(susukiGroup, susukiResources, {
  centerX: 0,
  centerZ: 0,
  halfWidth: 40,
  halfDepth: 40,
  patchSpacing: 12,
  threshold: 0.2,
  lodDist: 55,
});

const gui = new GUI({ title: "Susuki Grass", width: 260 });
gui.domElement.style.cssText = "position:fixed;top:12px;right:12px;z-index:30;max-height:90vh;overflow-y:auto;";

const fPlant = gui.addFolder("Plant");
fPlant.add(PARAMS, "stemHeight", 0.2, 3, 0.05).onChange((v) => { uSusukiStemHeight.value = v; });
fPlant.add(PARAMS, "stemWidth", 0.01, 0.15, 0.005).onChange((v) => { uSusukiStemWidth.value = v; });
fPlant.add(PARAMS, "bandWidth", 0.01, 0.15, 0.005).onChange((v) => { uSusukiBandWidth.value = v; });
fPlant.add(PARAMS, "plumeStart", 0.4, 0.9, 0.05).onChange((v) => { uSusukiPlumeStart.value = v; });
fPlant.add(PARAMS, "plumeFlex", 0, 1, 0.05).onChange((v) => { uSusukiPlumeFlex.value = v; });
fPlant.add(PARAMS, "plumeSoftEdge", 0, 1, 0.05).onChange((v) => { uSusukiPlumeSoftEdge.value = v; });

const fColors = gui.addFolder("Colors");
fColors.addColor(PARAMS, "stemColor").onChange(applyColors);
fColors.addColor(PARAMS, "plumeColor").onChange(applyColors);

const fWind = gui.addFolder("Wind");
fWind.add(PARAMS, "windDir", 0, Math.PI * 2, 0.1).onChange(applyWind);
fWind.add(PARAMS, "windWaveScale", 0.02, 0.2, 0.01).onChange((v) => { uWindWaveScale.value = v; });
fWind.add(PARAMS, "windSpeed", 0.2, 2, 0.1).onChange((v) => { uWindSpeed.value = v; });
fWind.add(PARAMS, "windStr", 0, 0.5, 0.02).onChange((v) => { uWindStr.value = v; });
fWind.add(PARAMS, "windGust", 0, 0.4, 0.02).onChange((v) => { uWindGust.value = v; });
fWind.add(PARAMS, "windMicro", 0, 0.3, 0.01).onChange((v) => { uWindMicro.value = v; });

const fLight = gui.addFolder("Lighting");
fLight.add(PARAMS, "sunAzimuth", 0, 360, 5).onChange(applySun).onFinishChange(bakeEnvMap);
fLight.add(PARAMS, "sunElevation", 0, 90, 2).onChange(applySun).onFinishChange(bakeEnvMap);
fLight.add(PARAMS, "sunIntensity", 0.5, 4, 0.1).onChange(applySun).onFinishChange(bakeEnvMap);
fLight.addColor(PARAMS, "dirColor").onChange(applySun).onFinishChange(bakeEnvMap);
fLight.add(PARAMS, "sceneAmbient", 0, 2, 0.05).onChange(applySun).onFinishChange(bakeEnvMap);
fLight.add(PARAMS, "shadowBias", -0.01, 0.01, 0.0005).onChange(applySun).onFinishChange(bakeEnvMap);
fLight.add(PARAMS, "shadowNormalBias", 0, 0.2, 0.01).onChange(applySun).onFinishChange(bakeEnvMap);

const fSky = gui.addFolder("Sky (grass-sandbox)");
fSky.add(PARAMS, "skyTurbidity", 0, 20, 0.5).onChange(applySun).onFinishChange(bakeEnvMap);
fSky.add(PARAMS, "skyRayleigh", 0, 4, 0.1).onChange(applySun).onFinishChange(bakeEnvMap);
fSky.add(PARAMS, "skyMie", 0, 0.1, 0.001).onChange(applySun).onFinishChange(bakeEnvMap);
fSky.add(PARAMS, "skyMieG", 0, 1, 0.05).onChange(applySun).onFinishChange(bakeEnvMap);
fSky.add(PARAMS, "exposure", 0.1, 1.5, 0.05).onChange(applyRenderer);
fSky.add(PARAMS, "environmentIntensity", 0, 1.5, 0.05).onChange(applyRenderer);

const fSSS = gui.addFolder("SSS (subsurface)");
fSSS.add(PARAMS, "bsIntensity", 0, 1, 0.05).onChange((v) => { uBsIntensity.value = v; });
fSSS.addColor(PARAMS, "bsColor").onChange(applyColors);
fSSS.add(PARAMS, "bsPower", 1, 5, 0.25).onChange((v) => { uBsPower.value = v; });
fSSS.add(PARAMS, "frontScatter", 0, 1, 0.05).onChange((v) => { uFrontScatter.value = v; });
fSSS.add(PARAMS, "rimSSS", 0, 1, 0.05).onChange((v) => { uRimSSS.value = v; });

const fSpec = gui.addFolder("Specular");
fSpec.add(PARAMS, "specV1Intensity", 0, 4, 0.25).onChange((v) => { uSpecV1Intensity.value = v; });
fSpec.addColor(PARAMS, "specV1Color").onChange(applyColors);
fSpec.add(PARAMS, "specV1DirX", -2, 2, 0.1).onChange(applySpecDirs);
fSpec.add(PARAMS, "specV1DirY", 0.1, 2, 0.05).onChange(applySpecDirs);
fSpec.add(PARAMS, "specV1DirZ", -2, 2, 0.1).onChange(applySpecDirs);
fSpec.add(PARAMS, "specV2Intensity", 0, 3, 0.25).onChange((v) => { uSpecV2Intensity.value = v; });
fSpec.addColor(PARAMS, "specV2Color").onChange(applyColors);
fSpec.add(PARAMS, "specV2DirX", -2, 2, 0.1).onChange(applySpecDirs);
fSpec.add(PARAMS, "specV2DirY", 0.1, 2, 0.05).onChange(applySpecDirs);
fSpec.add(PARAMS, "specV2DirZ", -2, 2, 0.1).onChange(applySpecDirs);
fSpec.add(PARAMS, "specV2NoiseScale", 0.5, 10, 0.5).onChange((v) => { uSpecV2NoiseScale.value = v; });
fSpec.add(PARAMS, "specV2NoiseStr", 0, 2, 0.1).onChange((v) => { uSpecV2NoiseStr.value = v; });
fSpec.add(PARAMS, "specV2Power", 2, 40, 1).onChange((v) => { uSpecV2Power.value = v; });
fSpec.add(PARAMS, "specV2TipBias", 0, 1, 0.1).onChange((v) => { uSpecV2TipBias.value = v; });

const fScene = gui.addFolder("Scene");
fScene.add(PARAMS, "aoIntensity", 0, 2, 0.1).onChange((v) => { uAoIntensity.value = v; });
fScene.add(PARAMS, "fogEnabled").onChange(applyFog);
fScene.add(PARAMS, "fogNear", 10, 120, 5).onChange(applyFog);
fScene.add(PARAMS, "fogFar", 60, 250, 10).onChange(applyFog);
fScene.addColor(PARAMS, "fogColor").onChange(applyFog);
fScene.addColor(PARAMS, "groundColor").onChange(applyGround);
fScene.add(PARAMS, "showGrid").onChange((v) => { grid.visible = v; });

applySun();
applyRenderer();
applyFog();
bakeEnvMap();
applyWind();
applySpecDirs();
applyColors();

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 500000);
camera.position.set(0, 4, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0.5, 0);
controls.update();

const timer = new THREE.Timer();
const projMat = new THREE.Matrix4();
const frustum = new THREE.Frustum();

renderer.setAnimationLoop(() => {
  timer.update();
  const elapsed = timer.getElapsed();
  uTime.value = elapsed;
  controls.update();
  projMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projMat);
  susukiPatchSystem.update(camera.position, frustum);
  renderer.render(scene, camera);
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
