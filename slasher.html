<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Volume Slash - Tapered Tail</title>
    <style>
      body {
        margin: 0;
        background: #050507;
        color: #fff;
        font-family: monospace;
        overflow: hidden;
      }
      #ui {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 10;
        width: 350px;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        border-right: 1px solid #444;
        overflow-y: auto;
        padding: 15px;
        box-sizing: border-box;
      }
      #viewport {
        position: absolute;
        inset: 0;
      }
      .upload-btn {
        background: #333;
        color: #fff;
        border: 1px solid #666;
        padding: 8px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="pane-container"></div>
      <p style="font-size: 10px; color: #888; margin-top: 20px">
        UPLOAD MASK PNG:
      </p>
      <input type="file" id="maskUpload" class="upload-btn" accept="image/*" />
    </div>
    <div id="viewport"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import {
        Fn,
        uv,
        vec2,
        vec3,
        vec4,
        float,
        sin,
        cos,
        fract,
        floor,
        dot,
        smoothstep,
        uniform,
        color,
        mix,
        texture,
        abs,
      } from "three/tsl";
      import { pass } from "three/tsl";

      let renderer, scene, camera, controls, renderPipeline, slashMesh;
      let alphaTexture = new THREE.Texture();

      const params = {
        segments: 200,
        radius: 3.0,
        height: 0.8, // 3D Volume height
        arcAngle: 1.6,
        trailLength: 0.5,
        widthTaper: 1.5, // How sharp the tail gets
        animationSpeed: 1.0,
        noiseScale: 15.0,
        noiseAmount: 0.1,
        color: "#ffffff",
        progress: 0.0,
        autoPlay: true,
      };

      const su = {
        time: uniform(0),
        color: uniform(color(params.color)),
        progress: uniform(params.progress),
        trailLength: uniform(params.trailLength),
        widthTaper: uniform(params.widthTaper),
      };

      // Noise for edge shredding
      const hash21 = Fn(([p]) =>
        fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453)),
      );
      const valueNoise = Fn(([p]) => {
        const i = floor(p);
        const f = fract(p);
        const u = f.mul(f).mul(float(3).sub(f.mul(2)));
        return mix(
          mix(hash21(i), hash21(i.add(vec2(1, 0))), u.x),
          mix(hash21(i.add(vec2(0, 1))), hash21(i.add(vec2(1, 1))), u.x),
          u.y,
        );
      });

      function build3DSlash() {
        if (slashMesh) scene.remove(slashMesh);

        const geo = new THREE.BufferGeometry();
        const pos = [],
          uvs = [],
          indices = [];
        const segs = params.segments;

        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const angle = t * params.arcAngle * Math.PI;
          const x = Math.cos(angle) * params.radius;
          const z = Math.sin(angle) * params.radius;

          // Bottom Vertex
          pos.push(x, -params.height / 2, z);
          uvs.push(t, 0);
          // Top Vertex
          pos.push(x, params.height / 2, z);
          uvs.push(t, 1);
        }

        for (let i = 0; i < segs; i++) {
          const a = i * 2,
            b = i * 2 + 1,
            c = (i + 1) * 2,
            d = (i + 1) * 2 + 1;
          indices.push(a, b, c, b, d, c);
        }

        geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);

        const mat = new THREE.MeshBasicNodeMaterial({
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });

        mat.outputNode = Fn(() => {
          const vUv = uv();
          const t = su.time.mul(0.5);

          // 1. DYNAMIC WIDTH TAPER
          // We make the Y-UV (height) squeeze based on X-UV (length)
          // This makes the tail thinner physically in the shader.
          const headPos = su.progress.mul(float(1.0).add(su.trailLength));
          const tailPos = headPos.sub(su.trailLength);

          // Distance from the "Head" of the slash
          const distFromHead = headPos
            .sub(vUv.x)
            .div(su.trailLength)
            .clamp(0, 1);
          // widthFactor is 1 at head, approaches 0 at tail
          const widthFactor = float(1.0).sub(distFromHead.pow(su.widthTaper));

          // 2. Window Mask (Head/Tail)
          const headMask = smoothstep(
            headPos.sub(0.02),
            headPos,
            vUv.x,
          ).oneMinus();
          const tailMask = smoothstep(tailPos, tailPos.add(0.1), vUv.x);
          const visibility = headMask.mul(tailMask);

          // 3. Distortion
          const nUv = vUv
            .mul(vec2(params.noiseScale, 2.0))
            .add(vec2(t.negate(), 0));
          const dNoise = valueNoise(nUv);
          const warpedUv = vUv.add(dNoise.sub(0.5).mul(params.noiseAmount));

          // 4. Shaping the "Claw" Width
          // Use widthFactor to pinch the top/bottom edges
          const verticalCenter = abs(vUv.y.sub(0.5)).mul(2.0);
          const sharpShape = smoothstep(
            widthFactor,
            widthFactor.sub(0.1),
            verticalCenter,
          );

          // 5. Texture and Final
          const mask = texture(alphaTexture, warpedUv).r;
          const finalMask = alphaTexture.image ? mask : sharpShape;

          return vec4(su.color, finalMask.mul(visibility));
        })();

        slashMesh = new THREE.Mesh(geo, mat);
        scene.add(slashMesh);
      }

      async function init() {
        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("viewport").appendChild(renderer.domElement);
        await renderer.init();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050507);
        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          100,
        );
        camera.position.set(6, 4, 6);
        controls = new OrbitControls(camera, renderer.domElement);

        build3DSlash();

        renderPipeline = new THREE.RenderPipeline(renderer);
        renderPipeline.outputNode = pass(scene, camera);

        const pane = new Pane({
          container: document.getElementById("pane-container"),
          title: "3D Claw Engine",
        });
        pane
          .addBinding(params, "progress", { min: 0, max: 1 })
          .on("change", (v) => (su.progress.value = v.value));
        pane
          .addBinding(params, "widthTaper", { min: 0.1, max: 4 })
          .on("change", (v) => (su.widthTaper.value = v.value));
        pane
          .addBinding(params, "trailLength", { min: 0.1, max: 1 })
          .on("change", (v) => (su.trailLength.value = v.value));
        pane
          .addBinding(params, "height", { min: 0.1, max: 3 })
          .on("change", build3DSlash);
        pane
          .addBinding(params, "arcAngle", { min: 0.1, max: 2 })
          .on("change", build3DSlash);
        pane.addBinding(params, "animationSpeed", { min: 0.1, max: 3 });
        pane.addBinding(params, "autoPlay");
        pane
          .addBinding(params, "color")
          .on("change", (v) => su.color.value.set(v.value));

        document
          .getElementById("maskUpload")
          .addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                  alphaTexture.image = img;
                  alphaTexture.needsUpdate = true;
                  build3DSlash();
                };
                img.src = ev.target.result;
              };
              reader.readAsDataURL(file);
            }
          });

        function animate() {
          requestAnimationFrame(animate);
          su.time.value += 0.016;
          if (params.autoPlay) {
            const t = (Date.now() * 0.001 * params.animationSpeed) % 1.5;
            su.progress.value = t > 1.0 ? 0 : t;
            params.progress = su.progress.value;
            pane.refresh();
          }
          controls.update();
          renderPipeline.render();
        }
        animate();
      }
      init().catch(console.error);
    </script>
  </body>
</html>
