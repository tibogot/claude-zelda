<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Roman Mosaic — yobeatz/mosaic port (WebGPU TSL)</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #171412;
        font-family: monospace;
      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 340px;
        height: 100%;
        overflow: auto;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(12px);
        border-right: 1px solid #444;
        color: #eee;
        padding: 16px;
        box-sizing: border-box;
        z-index: 10;
        pointer-events: auto;
      }
      canvas {
        display: block;
        position: fixed;
        left: 340px;
        top: 0;
        width: calc(100% - 340px);
        height: 100%;
        z-index: 0;
      }
      input[type="file"] {
        width: 100%;
        margin-top: 12px;
      }
      h2 {
        margin-top: 0;
        font-size: 1rem;
      }
      #status {
        margin-top: 12px;
        color: #9ab;
        font-size: 12px;
        min-height: 2.5em;
      }
      a {
        color: #8cf;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h2>Roman Mosaic (Di Blasi port)</h2>
      <p style="font-size: 12px; line-height: 1.4">
        Port of
        <a href="https://github.com/yobeatz/mosaic" target="_blank" rel="noreferrer"
          >yobeatz/mosaic</a
        >
        (<a
          href="https://towardsdatascience.com/how-to-generate-roman-style-mosaics-with-python-11d5aa021b09/"
          target="_blank"
          rel="noreferrer"
          >Di Blasi method</a
        >): curved rows along EDT guidelines, rotated quads, gap fill. CPU + WebGPU display.
      </p>
      <input type="file" id="upload" accept="image/*" />
      <div id="pane"></div>
      <div id="status">Loading textures/mosaic.avif…</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js",
          "./roman-mosaic-pipeline.js": "./roman-mosaic-pipeline.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { texture, uv, vec4 } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import { DEFAULT_PARAMS } from "./roman-mosaic-pipeline.js";

      let renderer, scene, camera, controls, plane, mosaicTexture;
      let busy = false;
      let worker = null;
      let jobId = 0;
      let activeJobId = 0;
      let lastSourceFile = null;
      let regenTimer = null;
      let uiReady = false;
      let pendingRegen = false;

      const DEFAULT_IMAGE = "./textures/mosaic.avif";
      const params = { ...DEFAULT_PARAMS };

      const statusEl = document.getElementById("status");
      const setStatus = (t) => {
        statusEl.textContent = t;
      };

      init();

      async function init() {
        renderer = new THREE.WebGPURenderer({ antialias: true });
        document.body.appendChild(renderer.domElement);
        await renderer.init();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x171412);

        camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 0, 3.2);

        layoutRenderer();

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dir = new THREE.DirectionalLight(0xffffff, 0.6);
        dir.position.set(1, 2, 3);
        scene.add(dir);

        buildPane();
        fitPlaceholderPlane();
        document.getElementById("upload").addEventListener("change", onUpload);
        window.addEventListener("resize", onResize);
        animate();
        loadDefaultImage();
      }

      function fitPlaceholderPlane() {
        const geo = new THREE.PlaneGeometry(3.2, 2.4);
        const mat = new THREE.MeshBasicNodeMaterial();
        mat.colorNode = vec4(0.15, 0.13, 0.11, 1);
        plane = new THREE.Mesh(geo, mat);
        scene.add(plane);
      }

      function rebuildDisplay(canvas) {
        if (mosaicTexture) mosaicTexture.dispose();
        mosaicTexture = new THREE.CanvasTexture(canvas);
        mosaicTexture.colorSpace = THREE.SRGBColorSpace;
        mosaicTexture.minFilter = THREE.LinearFilter;
        mosaicTexture.magFilter = THREE.LinearFilter;
        mosaicTexture.needsUpdate = true;

        const aspect = canvas.width / canvas.height;
        const maxW = 3.6;
        const pw = maxW;
        const ph = maxW / aspect;

        if (plane) {
          scene.remove(plane);
          plane.geometry.dispose();
          plane.material.dispose();
        }

        const geo = new THREE.PlaneGeometry(pw, ph);
        const mat = new THREE.MeshBasicNodeMaterial();
        // texture() requires a THREE.Texture instance — not uniform(texture)
        mat.colorNode = texture(mosaicTexture, uv());
        mat.toneMapped = false;

        plane = new THREE.Mesh(geo, mat);
        scene.add(plane);
        controls.target.set(0, 0, 0);
      }

      function layoutRenderer() {
        const uiW = 340;
        const w = Math.max(1, innerWidth - uiW);
        const h = innerHeight;
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.domElement.style.left = `${uiW}px`;
        renderer.domElement.style.width = `${w}px`;
        renderer.domElement.style.height = `${h}px`;
        if (camera) {
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
      }

      function ensureWorker() {
        if (worker) return worker;
        worker = new Worker("./roman-mosaic-worker.js", { type: "module" });
        worker.onmessage = (ev) => {
          const data = ev.data;
          if (data.id !== activeJobId) return;

          if (data.type === "progress") {
            setStatus(data.msg);
            return;
          }

          if (data.type === "error") {
            if (data.id === activeJobId) {
              busy = false;
              uiReady = true;
              setStatus(`Error: ${data.message}`);
            }
            return;
          }

          if (data.type === "done" && data.id === activeJobId) {
            const canvas = document.createElement("canvas");
            canvas.width = data.w;
            canvas.height = data.h;
            canvas.getContext("2d").drawImage(data.bitmap, 0, 0);
            data.bitmap.close();
            rebuildDisplay(canvas);
            const est = Math.round((2 * data.w * data.h) / (2 * params.halfTile) ** 2);
            setStatus(
              `Done — ${data.tileCount} tesserae (${data.chainTileCount ?? "?"} chain + gap, ${data.chainCount ?? "?"} chains, ${data.w}×${data.h}, halfTile ${params.halfTile}, ~${est} max est.)`,
            );
            busy = false;
            uiReady = true;
            if (pendingRegen && lastSourceFile) {
              pendingRegen = false;
              processFile(lastSourceFile);
            }
          }
        };
        worker.onerror = (err) => {
          console.error(err);
          busy = false;
          uiReady = true;
          setStatus(`Worker error: ${err.message}`);
        };
        return worker;
      }

      function runMosaicInWorker(file, id) {
        ensureWorker();
        worker.postMessage({ id, file, params: { ...params } });
      }

      function pumpMosaic(file) {
        if (!file) return;
        applyDensityLock();
        if (busy) {
          pendingRegen = true;
          setStatus("Queued…");
          return;
        }
        lastSourceFile = file;
        activeJobId = ++jobId;
        busy = true;
        setStatus("Starting…");
        runMosaicInWorker(file, activeJobId);
      }

      async function loadDefaultImage() {
        try {
          const res = await fetch(DEFAULT_IMAGE);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          const file = new File([blob], "mosaic.avif", {
            type: blob.type || "image/avif",
          });
          pumpMosaic(file);
        } catch (err) {
          console.error(err);
          setStatus(`Debug image failed: ${err.message}`);
        }
      }

      function applyDensityLock() {
        if (!params.lockTileDensity) return;
        const refW = params.densityRefWidth ?? 500;
        const refH = params.densityRefHalfTile ?? 5;
            params.halfTile = Math.max(
          2,
          Math.min(8, Math.round((refH * params.maxWidth) / refW)),
        );
      }

      function scheduleRegenerate() {
        if (!uiReady || !lastSourceFile) return;
        clearTimeout(regenTimer);
        regenTimer = setTimeout(() => pumpMosaic(lastSourceFile), 500);
      }

      function onUpload(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        pumpMosaic(file);
        e.target.value = "";
      }

      function bindParam(pane, key, opts) {
        const b = pane.addBinding(params, key, opts);
        b.on("change", scheduleRegenerate);
        return b;
      }

      function buildPane() {
        const pane = new Pane({
          container: document.getElementById("pane"),
          title: "mosaic.py params",
        });

        const sizeFolder = pane.addFolder({ title: "Output size" });
        const maxWidthBinding = sizeFolder.addBinding(params, "maxWidth", {
          label: "max width (px)",
          min: 300,
          max: 1200,
          step: 25,
        });
        sizeFolder
          .addBinding(params, "lockTileDensity", { label: "lock tessera size on image" })
          .on("change", () => {
            applyDensityLock();
            pane.refresh();
            scheduleRegenerate();
          });
        maxWidthBinding.on("change", () => {
          applyDensityLock();
          pane.refresh();
          scheduleRegenerate();
        });
        sizeFolder
          .addButton({ title: "Coffee preset (500px, ~article)" })
          .on("click", () => {
            params.maxWidth = 500;
            params.lockTileDensity = true;
            applyDensityLock();
            pane.refresh();
            scheduleRegenerate();
          });
        sizeFolder
          .addButton({ title: "Large 900px (same tile size on image)" })
          .on("click", () => {
            params.maxWidth = 900;
            params.lockTileDensity = true;
            applyDensityLock();
            pane.refresh();
            scheduleRegenerate();
          });
        applyDensityLock();

        bindParam(pane, "halfTile", { min: 2, max: 8, step: 1 });
        bindParam(pane, "chainClipMinArea", { min: 0.4, max: 0.9, step: 0.05 });
        bindParam(pane, "chainMaxClipNeighbors", { min: 0, max: 8, step: 1 });
        bindParam(pane, "mortarInset", { min: 0, max: 0.05, step: 0.002 });
        bindParam(pane, "groutStroke", { min: 0, max: 1.5, step: 0.05 });
        bindParam(pane, "tileScaleMin", { min: 0.85, max: 1, step: 0.01 });
        bindParam(pane, "tileExpand", { min: 1, max: 1.08, step: 0.01 });
        bindParam(pane, "preShrinkExpand", { min: 1, max: 1.12, step: 0.01 });
        bindParam(pane, "gapChainSpacing", { min: 0.25, max: 1, step: 0.05 });
        bindParam(pane, "gapFillStep", { min: 0.25, max: 1.5, step: 0.05 });
        bindParam(pane, "gapFillPasses", { min: 1, max: 5, step: 1 });
        bindParam(pane, "gapTileExpand", { min: 1, max: 1.08, step: 0.005 });
        bindParam(pane, "makeConvex");
        bindParam(pane, "gauss", { min: 0, max: 8, step: 0.5 });
        bindParam(pane, "edgeDetails", { min: 1, max: 8, step: 1 });
        bindParam(pane, "edgeMode", {
          options: { DiBlasi: "diblasi", Sobel: "sobel" },
        });
        bindParam(pane, "withFrame");
        bindParam(pane, "randSize", { min: 0, max: 0.8, step: 0.05 });
        bindParam(pane, "maxAngle", { min: 30, max: 75, step: 1 });

        pane.addButton({ title: "Regenerate" }).on("click", () => {
          if (lastSourceFile) pumpMosaic(lastSourceFile);
        });
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      function onResize() {
        layoutRenderer();
      }
    </script>
  </body>
</html>
