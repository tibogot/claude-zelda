<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ultimate Ghibli Tree Architect — Complete Control</title>
<style>
    body { margin:0; overflow:hidden; background:#a4d3ff; font-family: sans-serif; }
    #panel { position:fixed; top:20px; left:20px; z-index:10; max-height: 90vh; overflow-y: auto; }

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
    "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js"
  }
}
</script>
</head>
<body>

<div id="panel"></div>

<script type="module">
import * as THREE from 'three/webgpu';
import { vec3, uv, positionLocal, normalLocal, uniform, sin, normalize, mix, texture, modelWorldMatrix, time, smoothstep, color, dot, cameraPosition, clamp, pow, oneMinus, normalWorld } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { Pane } from 'tweakpane';

/** 1. ENGINE SETUP **/
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(30, 25, 45);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setAnimationLoop(animate);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.position.set(15, 30, 15);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdef1ff, 0x556633, 1.2));

/** 2. ALL PARAMETERS RESTORED & EXPANDED **/
const params = {
    seed: 1234,
    // Structure
    levels: 3,
    trunkHeight: 9.0,
    trunkRadius: 0.8,
    trunkSegments: 10,
    trunkTaper: 0.6,
    branchMult: 0.7,
    children: 3,
    gnarliness: 0.45,
    sunForce: 0.25,
    gravity: 0.12,
    // Canopy Shape
    canopyWidth: 7.0,
    canopyHeight: 12.0,
    shapeMode: 0.5,
    leafSize: 4.5,
    leafDensity: 12,
    clumpRadius: 4.0,
    // Shading
    alphaCutoff: 0.5,
    normalBias: 0.8,
    leafWarp: 0.3,
    aoStrength: 0.65,
    sssStrength: 0.9,
    rimStrength: 2.0,
    rimPower: 4.0,
    // Wind
    windStrength: 0.25,
    windSpeed: 1.8,
    // Colors
    topColor: '#a8e360',
    bottomColor: '#1d4d22',
    sssColor: '#ffea00',
    rimColor: '#ffffff',
    useCustomTrunk: false,
    bushMode: false,
    bushWidth: 5.0,
    bushHeight: 3.0,
    bushDensity: 20,
    bushLeafSize: 3.0,
    bushClumps: 3,
    trunkColor: '#3d2b1f',
    // Stats (readonly)
    trunkVerts: 0,
    trunkTris: 0,
    leafInstances: 0,
    totalTris: 0,
};

// Uniforms
const uAlphaCutoff = uniform(params.alphaCutoff);
const uNormalBias = uniform(params.normalBias);
const uLeafWarp = uniform(params.leafWarp);
const uAO = uniform(params.aoStrength);
const uSSS = uniform(params.sssStrength);
const uRimS = uniform(params.rimStrength);
const uRimP = uniform(params.rimPower);
const uWindS = uniform(params.windStrength);
const uWindSpeed = uniform(params.windSpeed);
const uTopC = uniform(color(params.topColor));
const uBotC = uniform(color(params.bottomColor));
const uSSSC = uniform(color(params.sssColor));
const uRimC = uniform(color(params.rimColor));
const leafMap = texture(new THREE.Texture());

/** 3. THE "SUPER-SHADER" (TSL) **/
const t = time.mul(uWindSpeed);
const wPos = modelWorldMatrix.mul(positionLocal);

// Multi-octave wind for fluttering
const mainWave = sin(t.add(wPos.x.mul(0.12)));
const flutter = sin(t.mul(4.5).add(wPos.y.mul(0.6))).mul(0.25);
const windNode = positionLocal.add(vec3(mainWave.add(flutter).mul(uWindS), 0, 0).mul(uv().y));

// Normal logic: Blending leaf plane normal with "Global Sphere" normal
const canopyCenter = vec3(0, 15, 0); 
const sphereDir = normalize(wPos.xyz.sub(canopyCenter));
const warpedNormal = normalize(normalLocal.add(sin(uv().x.mul(10)).mul(uLeafWarp)));
const finalNormal = normalize(mix(warpedNormal, sphereDir, uNormalBias));

const leafMat = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, alphaTest: 0.5, transparent: true });
leafMat.positionNode = windNode;
leafMat.normalNode = finalNormal;

// AO, SSS, and Rim
const distCenter = clamp(wPos.xyz.distance(canopyCenter).div(20), 0, 1);
const ao = mix(uAO.oneMinus(), 1.0, distCenter);
const sss = pow(clamp(dot(normalWorld, normalize(sun.position)).negate(), 0, 1), 2.0).mul(uSSS);
const viewDir = normalize(cameraPosition.sub(wPos.xyz));
const rim = pow(oneMinus(clamp(dot(viewDir, finalNormal), 0, 1)), uRimP).mul(uRimS).mul(uRimC);

leafMat.colorNode = mix(uBotC, uTopC, uv().y).mul(ao).add(uSSSC.mul(sss)).add(rim);
leafMat.opacityNode = smoothstep(uAlphaCutoff.sub(0.05), uAlphaCutoff.add(0.05), leafMap.r);

/** 4. RECURSIVE ARCHITECT **/
let trunkGroup = new THREE.Group();
let leavesMesh;
let customTrunk;
scene.add(trunkGroup);

function buildTree() {
    trunkGroup.clear();
    if (leavesMesh) scene.remove(leavesMesh);

    let currentSeed = params.seed;
    const random = () => {
        const x = Math.sin(currentSeed++) * 10000;
        return x - Math.floor(x);
    };

    if (params.bushMode) {
        // Bush mode: no trunk, leaf clumps at ground level
        const totalLeaves = params.bushClumps * params.bushDensity;
        const leafGeo = new THREE.PlaneGeometry(params.bushLeafSize, params.bushLeafSize);
        leavesMesh = new THREE.InstancedMesh(leafGeo, leafMat, totalLeaves);
        const dummy = new THREE.Object3D();
        let counter = 0;

        for (let c = 0; c < params.bushClumps; c++) {
            const clumpAngle = (c / params.bushClumps) * Math.PI * 2 + random() * 0.5;
            const clumpDist = random() * params.bushWidth * 0.3;
            const cx = Math.cos(clumpAngle) * clumpDist;
            const cz = Math.sin(clumpAngle) * clumpDist;

            for (let i = 0; i < params.bushDensity; i++) {
                const angle = random() * Math.PI * 2;
                const r = random() * params.bushWidth * 0.5;
                const yRaw = random() * params.bushHeight;
                // Hemisphere falloff: leaves denser at bottom, taper toward top
                const yFactor = 1.0 - (yRaw / params.bushHeight);
                const hSpread = r * yFactor;

                dummy.position.set(
                    cx + Math.cos(angle) * hSpread,
                    yRaw,
                    cz + Math.sin(angle) * hSpread
                );
                dummy.rotation.set(random()*Math.PI, random()*Math.PI, random()*Math.PI);
                dummy.updateMatrix();
                leavesMesh.setMatrixAt(counter++, dummy.matrix);
            }
        }
        leavesMesh.instanceMatrix.needsUpdate = true;
        scene.add(leavesMesh);
        params.trunkVerts = 0; params.trunkTris = 0;
        params.leafInstances = totalLeaves;
        params.totalTris = totalLeaves * 2;
        try { pane.refresh(); } catch(e) {}
        return;
    }

    const tips = [];

    if (!params.useCustomTrunk) {
        function grow(pos, dir, rad, len, lvl) {
            if (lvl > params.levels) {
                tips.push({ pos: pos.clone(), dir: dir.clone() });
                return;
            }
            const end = pos.clone().add(dir.clone().multiplyScalar(len));
            const geo = new THREE.CylinderGeometry(rad * params.trunkTaper, rad, len, params.trunkSegments);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: params.trunkColor }));
            mesh.position.copy(pos.clone().add(end).multiplyScalar(0.5));
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            trunkGroup.add(mesh);

            for (let i = 0; i < params.children; i++) {
                const nextDir = dir.clone();
                nextDir.x += (random() - 0.5) * params.gnarliness;
                nextDir.z += (random() - 0.5) * params.gnarliness;
                nextDir.y += params.sunForce - (params.gravity * lvl);
                nextDir.normalize();
                grow(end, nextDir, rad * params.trunkTaper, len * params.branchMult, lvl + 1);
            }
        }
        grow(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0), params.trunkRadius, params.trunkHeight, 0);
    } else if (customTrunk) {
        trunkGroup.add(customTrunk);
        const box = new THREE.Box3().setFromObject(customTrunk);
        tips.push({ pos: new THREE.Vector3(0, box.max.y, 0), dir: new THREE.Vector3(0, 1, 0) });
    }

    // Leaf Spawning
    const leafGeo = new THREE.PlaneGeometry(params.leafSize, params.leafSize);
    leavesMesh = new THREE.InstancedMesh(leafGeo, leafMat, Math.max(1, tips.length) * params.leafDensity);
    const dummy = new THREE.Object3D();
    let counter = 0;

    tips.forEach(tip => {
        for(let i=0; i < params.leafDensity; i++) {
            const angle = random() * Math.PI * 2;
            const rBase = random() * params.clumpRadius;
            const verticalSpread = (random() - 0.5) * params.canopyHeight;
            const horizontalSpread = rBase * (1.0 - (Math.abs(verticalSpread) / (params.canopyHeight/2)) * params.shapeMode);

            dummy.position.set(
                tip.pos.x + Math.cos(angle) * horizontalSpread,
                tip.pos.y + verticalSpread,
                tip.pos.z + Math.sin(angle) * horizontalSpread
            );
            dummy.rotation.set(random()*Math.PI, random()*Math.PI, random()*Math.PI);
            dummy.updateMatrix();
            leavesMesh.setMatrixAt(counter++, dummy.matrix);
        }
    });
    leavesMesh.instanceMatrix.needsUpdate = true;
    scene.add(leavesMesh);

    // Update stats
    let tv = 0, tt = 0;
    trunkGroup.traverse(c => {
        if (!c.isMesh || !c.geometry) return;
        tv += c.geometry.attributes.position.count;
        tt += c.geometry.index ? c.geometry.index.count / 3 : c.geometry.attributes.position.count / 3;
    });
    params.trunkVerts = tv;
    params.trunkTris = Math.round(tt);
    params.leafInstances = counter;
    params.totalTris = Math.round(tt) + counter * 2;
    try { pane.refresh(); } catch(e) {}
}
buildTree();

/** 5. TWEAKPANE (ALL CONTROLS) **/
const pane = new Pane({ container: document.getElementById("panel") });

// Mode toggle
pane.addBinding(params, 'bushMode', { label: 'Bush Mode' }).on('change', () => {
    fStruc.hidden = params.bushMode;
    fCanopy.hidden = params.bushMode;
    fBush.hidden = !params.bushMode;
    fExport.hidden = params.bushMode;
    buildTree();
});

// Bush controls
const fBush = pane.addFolder({ title: 'Bush Shape' });
fBush.hidden = true;
fBush.addBinding(params, 'seed', {min:0, max:9999, step:1, label: 'Seed'}).on('change', buildTree);
fBush.addBinding(params, 'bushWidth', {min:1, max:15, step:0.1, label: 'Width'}).on('change', buildTree);
fBush.addBinding(params, 'bushHeight', {min:0.5, max:8, step:0.1, label: 'Height'}).on('change', buildTree);
fBush.addBinding(params, 'bushLeafSize', {min:0.5, max:8, step:0.1, label: 'Leaf size'}).on('change', buildTree);
fBush.addBinding(params, 'bushDensity', {min:5, max:80, step:1, label: 'Leaves/clump'}).on('change', buildTree);
fBush.addBinding(params, 'bushClumps', {min:1, max:10, step:1, label: 'Clumps'}).on('change', buildTree);

const fStruc = pane.addFolder({ title: 'Tree Skeleton' });
fStruc.addBinding(params, 'seed', {min:0, max:9999, step:1}).on('change', buildTree);
fStruc.addBinding(params, 'levels', {min:1, max:5, step:1}).on('change', buildTree);
fStruc.addBinding(params, 'trunkHeight', {min:2, max:20}).on('change', buildTree);
fStruc.addBinding(params, 'trunkRadius', {min:0.1, max:3}).on('change', buildTree);
fStruc.addBinding(params, 'trunkSegments', {min:3, max:16, step:1, label:'Radial segments'}).on('change', buildTree);
fStruc.addBinding(params, 'trunkTaper', {min:0.1, max:1}).on('change', buildTree);
fStruc.addBinding(params, 'gnarliness', {min:0, max:2}).on('change', buildTree);
fStruc.addBinding(params, 'sunForce', {min:0, max:1}).on('change', buildTree);
fStruc.addBinding(params, 'gravity', {min:0, max:1}).on('change', buildTree);
fStruc.addBlade({ view: 'separator' });
fStruc.addBinding(params, 'trunkColor', { label: 'Trunk color' }).on('change', buildTree);

const fCanopy = pane.addFolder({ title: 'Canopy & Clumping' });
fCanopy.addBinding(params, 'clumpRadius', {min:1, max:15}).on('change', buildTree);
fCanopy.addBinding(params, 'canopyHeight', {min:1, max:20}).on('change', buildTree);
fCanopy.addBinding(params, 'shapeMode', {min:0, max:1, label: 'Cypress Mode'}).on('change', buildTree);
fCanopy.addBinding(params, 'leafSize', {min:1, max:12}).on('change', buildTree);
fCanopy.addBinding(params, 'leafDensity', {min:1, max:60, step:1}).on('change', buildTree);

const fShading = pane.addFolder({ title: 'Atmospheric Shading' });
fShading.addBinding(params, 'alphaCutoff', {min:0, max:1}).on('change', v => uAlphaCutoff.value = v.value);
fShading.addBinding(params, 'normalBias', {min:0, max:1}).on('change', v => uNormalBias.value = v.value);
fShading.addBinding(params, 'leafWarp', {min:0, max:1}).on('change', v => uLeafWarp.value = v.value);
fShading.addBinding(params, 'aoStrength', {min:0, max:1}).on('change', v => uAO.value = v.value);
fShading.addBinding(params, 'sssStrength', {min:0, max:2}).on('change', v => uSSS.value = v.value);
fShading.addBinding(params, 'rimStrength', {min:0, max:5}).on('change', v => uRimS.value = v.value);
fShading.addBinding(params, 'rimPower', {min:1, max:10}).on('change', v => uRimP.value = v.value);

const fWind = pane.addFolder({ title: 'Wind System' });
fWind.addBinding(params, 'windStrength', {min:0, max:1}).on('change', v => uWindS.value = v.value);
fWind.addBinding(params, 'windSpeed', {min:0, max:5}).on('change', v => uWindSpeed.value = v.value);

const fColors = pane.addFolder({ title: 'Colors' });
fColors.addBinding(params, 'topColor');
fColors.addBinding(params, 'bottomColor');
fColors.addBinding(params, 'sssColor');
fColors.addBinding(params, 'rimColor');

/** 6. MERGE & EXPORT **/
const fExport = pane.addFolder({ title: 'Export Trunk' });

let mergedTrunkMesh = null;

fExport.addButton({ title: 'Merge Trunk Geometry' }).on('click', () => {
    if (params.useCustomTrunk) { alert('Custom trunk loaded — nothing to merge.'); return; }
    const geos = [];
    trunkGroup.updateMatrixWorld(true);
    trunkGroup.traverse(child => {
        if (!child.isMesh) return;
        const g = child.geometry.clone();
        g.applyMatrix4(child.matrixWorld);
        geos.push(g);
    });
    if (geos.length === 0) { alert('No trunk segments found.'); return; }
    const merged = BufferGeometryUtils.mergeGeometries(geos, false);
    if (mergedTrunkMesh) { trunkGroup.remove(mergedTrunkMesh); scene.remove(mergedTrunkMesh); }
    // Remove old separate meshes
    const oldChildren = [...trunkGroup.children];
    oldChildren.forEach(c => trunkGroup.remove(c));
    mergedTrunkMesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: params.trunkColor }));
    trunkGroup.add(mergedTrunkMesh);
    geos.forEach(g => g.dispose());
    alert('Trunk merged into 1 mesh (' + merged.attributes.position.count + ' vertices)');
});

fExport.addButton({ title: 'Save Trunk as GLB' }).on('click', () => {
    // Export whatever is in trunkGroup (merged or not)
    const exportGroup = new THREE.Group();
    trunkGroup.updateMatrixWorld(true);
    trunkGroup.traverse(child => {
        if (!child.isMesh) return;
        const clone = child.clone();
        clone.geometry = child.geometry.clone();
        clone.geometry.applyMatrix4(child.matrixWorld);
        clone.position.set(0, 0, 0);
        clone.rotation.set(0, 0, 0);
        clone.scale.set(1, 1, 1);
        exportGroup.add(clone);
    });
    // If not already merged, merge for a clean single-mesh GLB
    if (exportGroup.children.length > 1) {
        const geos = exportGroup.children.map(c => c.geometry);
        const merged = BufferGeometryUtils.mergeGeometries(geos, false);
        exportGroup.clear();
        exportGroup.add(new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: params.trunkColor })));
    }
    const exporter = new GLTFExporter();
    exporter.parse(exportGroup, (glb) => {
        const blob = new Blob([glb], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'trunk_seed' + params.seed + '.glb';
        a.click();
        URL.revokeObjectURL(url);
    }, (err) => { alert('Export failed: ' + err); }, { binary: true });
});

/** 7. IMPORT (inside Tweakpane) **/
const fImport = pane.addFolder({ title: 'Import', expanded: true });
const loader = new GLTFLoader();

function _pickFile(accept, cb) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept;
    inp.onchange = () => { if (inp.files[0]) cb(inp.files[0]); };
    inp.click();
}

fImport.addButton({ title: 'Load Leaf SDF (PNG)' }).on('click', () => {
    _pickFile('image/png', file => {
        params.leafTexFile = file.name;
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                const tex = new THREE.Texture(img);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                leafMap.value = tex;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });
});

fImport.addButton({ title: 'Load Custom Trunk (GLB)' }).on('click', () => {
    _pickFile('.glb', file => {
        loader.load(URL.createObjectURL(file), (gltf) => {
            customTrunk = gltf.scene;
            params.useCustomTrunk = true;
            buildTree();
        });
    });
});

/** 8. STATS **/
const fStats = pane.addFolder({ title: 'Stats', expanded: true });
fStats.addBinding(params, 'trunkVerts',    { label: 'Trunk vertices',  readonly: true });
fStats.addBinding(params, 'trunkTris',     { label: 'Trunk triangles', readonly: true });
fStats.addBinding(params, 'leafInstances', { label: 'Leaf instances',  readonly: true });
fStats.addBinding(params, 'totalTris',     { label: 'Total triangles', readonly: true });

/** 9. PRESETS **/
const fPreset = pane.addFolder({ title: 'Presets', expanded: true });
params.presetName = 'my_tree';
params.leafTexFile = '';
params.bushMode = false;

fPreset.addBinding(params, 'presetName', { label: 'Preset name' });

function buildPresetData() {
    return {
        presetName: params.presetName,
        trunk: {
            seed: params.seed, levels: params.levels,
            trunkHeight: params.trunkHeight, trunkRadius: params.trunkRadius,
            trunkTaper: params.trunkTaper, trunkSegments: params.trunkSegments,
            branchMult: params.branchMult,
            children: params.children, gnarliness: params.gnarliness,
            sunForce: params.sunForce, gravity: params.gravity,
        },
        canopy: {
            canopyWidth: params.canopyWidth, canopyHeight: params.canopyHeight,
            shapeMode: params.shapeMode, leafSize: params.leafSize,
            leafDensity: params.leafDensity, clumpRadius: params.clumpRadius,
        },
        material: {
            topColor: params.topColor, bottomColor: params.bottomColor,
            sssColor: params.sssColor, rimColor: params.rimColor,
            alphaCutoff: params.alphaCutoff, normalBias: params.normalBias,
            leafWarp: params.leafWarp, aoStrength: params.aoStrength,
            sssStrength: params.sssStrength, rimStrength: params.rimStrength,
            rimPower: params.rimPower,
        },
        wind: { windStrength: params.windStrength, windSpeed: params.windSpeed },
        bush: {
            bushWidth: params.bushWidth, bushHeight: params.bushHeight,
            bushDensity: params.bushDensity, bushLeafSize: params.bushLeafSize,
            bushClumps: params.bushClumps,
        },
        leafTexFile: params.leafTexFile,
        bushMode: params.bushMode,
    };
}

function applyPresetData(data) {
    if (data.presetName) params.presetName = data.presetName;
    if (data.trunk) {
        const t = data.trunk;
        Object.keys(t).forEach(k => { if (t[k] != null && params[k] != null) params[k] = t[k]; });
    }
    if (data.canopy) {
        const c = data.canopy;
        Object.keys(c).forEach(k => { if (c[k] != null && params[k] != null) params[k] = c[k]; });
    }
    if (data.material) {
        const m = data.material;
        Object.keys(m).forEach(k => { if (m[k] != null && params[k] != null) params[k] = m[k]; });
        uAlphaCutoff.value = params.alphaCutoff;
        uNormalBias.value = params.normalBias;
        uLeafWarp.value = params.leafWarp;
        uAO.value = params.aoStrength;
        uSSS.value = params.sssStrength;
        uRimS.value = params.rimStrength;
        uRimP.value = params.rimPower;
    }
    if (data.wind) {
        if (data.wind.windStrength != null) { params.windStrength = data.wind.windStrength; uWindS.value = data.wind.windStrength; }
        if (data.wind.windSpeed != null) { params.windSpeed = data.wind.windSpeed; uWindSpeed.value = data.wind.windSpeed; }
    }
    if (data.bush) {
        const b = data.bush;
        Object.keys(b).forEach(k => { if (b[k] != null && params[k] != null) params[k] = b[k]; });
    }
    if (data.leafTexFile) params.leafTexFile = data.leafTexFile;
    if (data.bushMode != null) {
        params.bushMode = data.bushMode;
        fStruc.hidden = params.bushMode;
        fCanopy.hidden = params.bushMode;
        fBush.hidden = !params.bushMode;
        fExport.hidden = params.bushMode;
    }
    pane.refresh();
    buildTree();
}

fPreset.addButton({ title: 'Save Preset JSON' }).on('click', async () => {
    const json = JSON.stringify(buildPresetData(), null, 2);
    const name = (params.presetName || 'preset').replace(/[^a-z0-9_\-]/gi, '_');
    if (window.showSaveFilePicker) {
        try {
            const handle = await showSaveFilePicker({
                suggestedName: name + '.json',
                types: [{ description: 'JSON preset', accept: { 'application/json': ['.json'] } }],
            });
            const writable = await handle.createWritable();
            await writable.write(json);
            await writable.close();
            alert('Preset saved!');
        } catch (e) { if (e.name !== 'AbortError') console.error(e); }
    } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = name + '.json';
        a.click();
    }
});

fPreset.addButton({ title: 'Load Preset JSON' }).on('click', () => {
    _pickFile('.json', file => {
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                applyPresetData(JSON.parse(ev.target.result));
                alert('Preset loaded!');
            } catch (e) { alert('Invalid preset: ' + e.message); }
        };
        reader.readAsText(file);
    });
});

fPreset.addButton({ title: 'Copy to Clipboard' }).on('click', () => {
    const json = JSON.stringify(buildPresetData(), null, 2);
    navigator.clipboard.writeText(json)
        .then(() => alert('Preset copied to clipboard!'))
        .catch(() => {
            const ta = document.createElement('textarea');
            ta.value = json;
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('Preset copied!');
        });
});

function animate() {
    controls.update();
    uTopC.value.set(params.topColor);
    uBotC.value.set(params.bottomColor);
    uSSSC.value.set(params.sssColor);
    uRimC.value.set(params.rimColor);
    renderer.render(scene, camera);
}
</script>
</body>
</html>
