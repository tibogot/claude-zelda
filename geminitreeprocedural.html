<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ultimate Ghibli Tree Architect — Complete Control</title>
<style>
    body { margin:0; overflow:hidden; background:#a4d3ff; font-family: sans-serif; }
    #panel { position:fixed; top:20px; left:20px; z-index:10; max-height: 90vh; overflow-y: auto; }

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
    "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.4/dist/tweakpane.min.js"
  }
}
</script>
</head>
<body>

<div id="panel"></div>

<script type="module">
import * as THREE from 'three/webgpu';
import { vec3, uv, positionLocal, normalLocal, uniform, sin, normalize, mix, texture, modelWorldMatrix, time, smoothstep, color, dot, cameraPosition, clamp, pow, oneMinus, normalWorld } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { Pane } from 'tweakpane';

/** 1. ENGINE SETUP **/
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(30, 25, 45);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setAnimationLoop(animate);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.position.set(15, 30, 15);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdef1ff, 0x556633, 1.2));

/** 2. ALL PARAMETERS RESTORED & EXPANDED **/
const params = {
    seed: 1234,
    // Structure
    levels: 3,
    trunkHeight: 9.0,
    trunkRadius: 0.8,
    trunkTaper: 0.6,
    branchMult: 0.7,
    children: 3,
    gnarliness: 0.45,
    sunForce: 0.25,
    gravity: 0.12,
    radialSegments: 6,
    // Trunk Curve
    trunkLean: 0.15,
    trunkLeanDir: 0,
    // Branch Angles
    branchAngleMin: 20,
    branchAngleMax: 50,
    // Root Flare
    rootCount: 4,
    rootSpread: 2.0,
    rootHeight: 1.5,
    rootFlare: 1.8,
    // Vertex Noise
    vertexNoise: 0.15,
    // Bark Colors
    barkColorBase: '#2a1a0e',
    barkColorTop: '#4a3520',
    // Canopy Shape
    canopyWidth: 7.0,
    canopyHeight: 12.0,
    shapeMode: 0.5,
    leafSize: 4.5,
    leafDensity: 12,
    clumpRadius: 4.0,
    // Shading
    alphaCutoff: 0.5,
    normalBias: 0.8,
    leafWarp: 0.3,
    aoStrength: 0.65,
    sssStrength: 0.9,
    rimStrength: 2.0,
    rimPower: 4.0,
    // Wind
    windStrength: 0.25,
    windSpeed: 1.8,
    // Colors
    topColor: '#a8e360',
    bottomColor: '#1d4d22',
    sssColor: '#ffea00',
    rimColor: '#ffffff',
    useCustomTrunk: false
};

// Uniforms
const uAlphaCutoff = uniform(params.alphaCutoff);
const uNormalBias = uniform(params.normalBias);
const uLeafWarp = uniform(params.leafWarp);
const uAO = uniform(params.aoStrength);
const uSSS = uniform(params.sssStrength);
const uRimS = uniform(params.rimStrength);
const uRimP = uniform(params.rimPower);
const uWindS = uniform(params.windStrength);
const uWindSpeed = uniform(params.windSpeed);
const uTopC = uniform(color(params.topColor));
const uBotC = uniform(color(params.bottomColor));
const uSSSC = uniform(color(params.sssColor));
const uRimC = uniform(color(params.rimColor));
const leafMap = texture(new THREE.Texture());

/** 3. THE "SUPER-SHADER" (TSL) **/
const t = time.mul(uWindSpeed);
const wPos = modelWorldMatrix.mul(positionLocal);

// Multi-octave wind for fluttering
const mainWave = sin(t.add(wPos.x.mul(0.12)));
const flutter = sin(t.mul(4.5).add(wPos.y.mul(0.6))).mul(0.25);
const windNode = positionLocal.add(vec3(mainWave.add(flutter).mul(uWindS), 0, 0).mul(uv().y));

// Normal logic: Blending leaf plane normal with "Global Sphere" normal
const canopyCenter = vec3(0, 15, 0); 
const sphereDir = normalize(wPos.xyz.sub(canopyCenter));
const warpedNormal = normalize(normalLocal.add(sin(uv().x.mul(10)).mul(uLeafWarp)));
const finalNormal = normalize(mix(warpedNormal, sphereDir, uNormalBias));

const leafMat = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, alphaTest: 0.5, transparent: true });
leafMat.positionNode = windNode;
leafMat.normalNode = finalNormal;

// AO, SSS, and Rim
const distCenter = clamp(wPos.xyz.distance(canopyCenter).div(20), 0, 1);
const ao = mix(uAO.oneMinus(), 1.0, distCenter);
const sss = pow(clamp(dot(normalWorld, normalize(sun.position)).negate(), 0, 1), 2.0).mul(uSSS);
const viewDir = normalize(cameraPosition.sub(wPos.xyz));
const rim = pow(oneMinus(clamp(dot(viewDir, finalNormal), 0, 1)), uRimP).mul(uRimS).mul(uRimC);

leafMat.colorNode = mix(uBotC, uTopC, uv().y).mul(ao).add(uSSSC.mul(sss)).add(rim);
leafMat.opacityNode = smoothstep(uAlphaCutoff.sub(0.05), uAlphaCutoff.add(0.05), leafMap.r);

/** 4. RECURSIVE ARCHITECT **/
let trunkGroup = new THREE.Group();
let leavesMesh;
let customTrunk;
scene.add(trunkGroup);

function buildTree() {
    trunkGroup.clear();
    if (leavesMesh) scene.remove(leavesMesh);

    let currentSeed = params.seed;
    const random = () => {
        const x = Math.sin(currentSeed++) * 10000;
        return x - Math.floor(x);
    };

    const tips = [];
    const colBase = new THREE.Color(params.barkColorBase);
    const colTop  = new THREE.Color(params.barkColorTop);
    // Track max Y for gradient normalization
    let maxY = params.trunkHeight;

    // Helper: apply radial vertex noise + vertex color gradient to a cylinder geo
    function enhanceGeo(geo, baseY, height) {
        const pos = geo.attributes.position;
        const norm = geo.attributes.normal;
        const colors = new Float32Array(pos.count * 3);
        const tmpC = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
            // Vertex noise — displace radially
            if (params.vertexNoise > 0) {
                const nx = norm.getX(i), nz = norm.getZ(i);
                const radialLen = Math.sqrt(nx * nx + nz * nz);
                if (radialLen > 0.01) {
                    const noise = (random() - 0.5) * 2 * params.vertexNoise * 0.3;
                    pos.setX(i, pos.getX(i) + (nx / radialLen) * noise);
                    pos.setZ(i, pos.getZ(i) + (nz / radialLen) * noise);
                }
            }
            // Bark color gradient based on world Y
            const localY = pos.getY(i);
            const worldY = baseY + localY + height * 0.5;
            const t = Math.min(Math.max(worldY / maxY, 0), 1);
            tmpC.lerpColors(colBase, colTop, t);
            colors[i * 3]     = tmpC.r;
            colors[i * 3 + 1] = tmpC.g;
            colors[i * 3 + 2] = tmpC.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        pos.needsUpdate = true;
    }

    const barkMat = new THREE.MeshStandardMaterial({ vertexColors: true });
    const segs = params.radialSegments;

    if (!params.useCustomTrunk) {
        // Lean direction vector (XZ plane)
        const leanRad = params.trunkLeanDir * Math.PI / 180;
        const leanDirX = Math.sin(leanRad);
        const leanDirZ = Math.cos(leanRad);

        function grow(pos, dir, rad, len, lvl) {
            if (lvl > params.levels) {
                tips.push({ pos: pos.clone(), dir: dir.clone() });
                return;
            }
            // Apply trunk lean curve (strongest on main trunk, fades on branches)
            const leanFactor = params.trunkLean * (1 / (1 + lvl * 0.8));
            const curvedDir = dir.clone();
            curvedDir.x += leanDirX * leanFactor * 0.3;
            curvedDir.z += leanDirZ * leanFactor * 0.3;
            curvedDir.normalize();

            const end = pos.clone().add(curvedDir.clone().multiplyScalar(len));
            const topRad = rad * params.trunkTaper;
            const geo = new THREE.CylinderGeometry(topRad, rad, len, segs);
            const baseY = Math.min(pos.y, end.y);
            enhanceGeo(geo, baseY, len);
            const mesh = new THREE.Mesh(geo, barkMat);
            mesh.position.copy(pos.clone().add(end).multiplyScalar(0.5));
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), curvedDir);
            trunkGroup.add(mesh);

            // Branch children with angle control
            const angleMinRad = params.branchAngleMin * Math.PI / 180;
            const angleMaxRad = params.branchAngleMax * Math.PI / 180;
            for (let i = 0; i < params.children; i++) {
                const nextDir = curvedDir.clone();
                // Controlled spread angle
                const spreadAngle = angleMinRad + random() * (angleMaxRad - angleMinRad);
                const azimuth = random() * Math.PI * 2;
                // Build a perpendicular vector for rotation
                const perp = new THREE.Vector3(-curvedDir.z, 0, curvedDir.x).normalize();
                if (perp.length() < 0.01) perp.set(1, 0, 0);
                const perp2 = new THREE.Vector3().crossVectors(curvedDir, perp).normalize();
                const offX = Math.cos(azimuth) * Math.sin(spreadAngle);
                const offZ = Math.sin(azimuth) * Math.sin(spreadAngle);
                const offY = Math.cos(spreadAngle);
                nextDir.set(
                    curvedDir.x * offY + perp.x * offX + perp2.x * offZ,
                    curvedDir.y * offY + perp.y * offX + perp2.y * offZ,
                    curvedDir.z * offY + perp.z * offX + perp2.z * offZ
                );
                // Add gnarliness jitter on top
                nextDir.x += (random() - 0.5) * params.gnarliness * 0.5;
                nextDir.z += (random() - 0.5) * params.gnarliness * 0.5;
                nextDir.y += params.sunForce - (params.gravity * lvl);
                nextDir.normalize();
                grow(end, nextDir, topRad, len * params.branchMult, lvl + 1);
            }
        }

        // Estimate maxY for color gradient
        maxY = params.trunkHeight * (1 + params.levels * params.branchMult) * 0.8;

        grow(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0), params.trunkRadius, params.trunkHeight, 0);

        // ── Root Flare ──
        if (params.rootCount > 0) {
            const baseRad = params.trunkRadius * params.rootFlare;
            for (let i = 0; i < params.rootCount; i++) {
                const angle = (i / params.rootCount) * Math.PI * 2 + random() * 0.4;
                const spread = params.rootSpread;
                const rHeight = params.rootHeight * (0.7 + random() * 0.3);
                // Root: tapered cylinder angled outward and downward
                const rootLen = Math.sqrt(spread * spread + rHeight * rHeight);
                const rootDir = new THREE.Vector3(
                    Math.cos(angle) * spread,
                    rHeight,
                    Math.sin(angle) * spread
                ).normalize();
                const rootRadBot = baseRad * (0.3 + random() * 0.2);
                const rootRadTop = rootRadBot * 0.3;
                const geo = new THREE.CylinderGeometry(rootRadTop, rootRadBot, rootLen, segs);
                enhanceGeo(geo, -0.2, rootLen);
                const mesh = new THREE.Mesh(geo, barkMat);
                // Position: midpoint of root
                const rootEnd = new THREE.Vector3(
                    Math.cos(angle) * spread,
                    rHeight,
                    Math.sin(angle) * spread
                );
                mesh.position.copy(rootEnd.clone().multiplyScalar(0.5));
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), rootDir);
                trunkGroup.add(mesh);
            }
            // Flared base cylinder (wider at bottom)
            const flareGeo = new THREE.CylinderGeometry(params.trunkRadius, baseRad, params.rootHeight * 0.6, segs);
            enhanceGeo(flareGeo, 0, params.rootHeight * 0.6);
            const flareMesh = new THREE.Mesh(flareGeo, barkMat);
            flareMesh.position.y = params.rootHeight * 0.3;
            trunkGroup.add(flareMesh);
        }

    } else if (customTrunk) {
        trunkGroup.add(customTrunk);
        const box = new THREE.Box3().setFromObject(customTrunk);
        tips.push({ pos: new THREE.Vector3(0, box.max.y, 0), dir: new THREE.Vector3(0, 1, 0) });
    }

    // Leaf Spawning
    const leafGeo = new THREE.PlaneGeometry(params.leafSize, params.leafSize);
    leavesMesh = new THREE.InstancedMesh(leafGeo, leafMat, Math.max(1, tips.length) * params.leafDensity);
    const dummy = new THREE.Object3D();
    let counter = 0;

    tips.forEach(tip => {
        for(let i=0; i < params.leafDensity; i++) {
            const angle = random() * Math.PI * 2;
            const rBase = random() * params.clumpRadius;
            const verticalSpread = (random() - 0.5) * params.canopyHeight;
            const horizontalSpread = rBase * (1.0 - (Math.abs(verticalSpread) / (params.canopyHeight/2)) * params.shapeMode);

            dummy.position.set(
                tip.pos.x + Math.cos(angle) * horizontalSpread,
                tip.pos.y + verticalSpread,
                tip.pos.z + Math.sin(angle) * horizontalSpread
            );
            dummy.rotation.set(random()*Math.PI, random()*Math.PI, random()*Math.PI);
            dummy.updateMatrix();
            leavesMesh.setMatrixAt(counter++, dummy.matrix);
        }
    });
    leavesMesh.instanceMatrix.needsUpdate = true;
    scene.add(leavesMesh);
}
buildTree();

/** 5. TWEAKPANE (ALL CONTROLS) **/
const pane = new Pane({ container: document.getElementById("panel") });

const fStruc = pane.addFolder({ title: 'Tree Skeleton' });
fStruc.addBinding(params, 'seed', {min:0, max:9999, step:1}).on('change', buildTree);
fStruc.addBinding(params, 'levels', {min:1, max:5, step:1}).on('change', buildTree);
fStruc.addBinding(params, 'trunkHeight', {min:2, max:20}).on('change', buildTree);
fStruc.addBinding(params, 'trunkRadius', {min:0.1, max:3}).on('change', buildTree);
fStruc.addBinding(params, 'trunkTaper', {min:0.1, max:1}).on('change', buildTree);
fStruc.addBinding(params, 'radialSegments', {min:4, max:12, step:1, label:'Sides'}).on('change', buildTree);
fStruc.addBinding(params, 'gnarliness', {min:0, max:2}).on('change', buildTree);
fStruc.addBinding(params, 'sunForce', {min:0, max:1}).on('change', buildTree);
fStruc.addBinding(params, 'gravity', {min:0, max:1}).on('change', buildTree);
fStruc.addBinding(params, 'vertexNoise', {min:0, max:1, label:'Vertex noise'}).on('change', buildTree);

const fCurve = pane.addFolder({ title: 'Trunk Curve' });
fCurve.addBinding(params, 'trunkLean', {min:0, max:2, label:'Lean'}).on('change', buildTree);
fCurve.addBinding(params, 'trunkLeanDir', {min:0, max:360, step:1, label:'Lean direction'}).on('change', buildTree);

const fBranch = pane.addFolder({ title: 'Branch Angles' });
fBranch.addBinding(params, 'branchAngleMin', {min:0, max:90, step:1, label:'Min angle'}).on('change', buildTree);
fBranch.addBinding(params, 'branchAngleMax', {min:0, max:90, step:1, label:'Max angle'}).on('change', buildTree);
fBranch.addBinding(params, 'children', {min:1, max:6, step:1}).on('change', buildTree);

const fRoots = pane.addFolder({ title: 'Root Flare' });
fRoots.addBinding(params, 'rootCount', {min:0, max:8, step:1, label:'Roots'}).on('change', buildTree);
fRoots.addBinding(params, 'rootSpread', {min:0, max:5, label:'Spread'}).on('change', buildTree);
fRoots.addBinding(params, 'rootHeight', {min:0, max:4, label:'Height'}).on('change', buildTree);
fRoots.addBinding(params, 'rootFlare', {min:1, max:4, label:'Flare'}).on('change', buildTree);

const fCanopy = pane.addFolder({ title: 'Canopy & Clumping' });
fCanopy.addBinding(params, 'clumpRadius', {min:1, max:15}).on('change', buildTree);
fCanopy.addBinding(params, 'canopyHeight', {min:1, max:20}).on('change', buildTree);
fCanopy.addBinding(params, 'shapeMode', {min:0, max:1, label: 'Cypress Mode'}).on('change', buildTree);
fCanopy.addBinding(params, 'leafSize', {min:1, max:12}).on('change', buildTree);
fCanopy.addBinding(params, 'leafDensity', {min:1, max:60, step:1}).on('change', buildTree);

const fShading = pane.addFolder({ title: 'Atmospheric Shading' });
fShading.addBinding(params, 'alphaCutoff', {min:0, max:1}).on('change', v => uAlphaCutoff.value = v.value);
fShading.addBinding(params, 'normalBias', {min:0, max:1}).on('change', v => uNormalBias.value = v.value);
fShading.addBinding(params, 'leafWarp', {min:0, max:1}).on('change', v => uLeafWarp.value = v.value);
fShading.addBinding(params, 'aoStrength', {min:0, max:1}).on('change', v => uAO.value = v.value);
fShading.addBinding(params, 'sssStrength', {min:0, max:2}).on('change', v => uSSS.value = v.value);
fShading.addBinding(params, 'rimStrength', {min:0, max:5}).on('change', v => uRimS.value = v.value);
fShading.addBinding(params, 'rimPower', {min:1, max:10}).on('change', v => uRimP.value = v.value);

const fWind = pane.addFolder({ title: 'Wind System' });
fWind.addBinding(params, 'windStrength', {min:0, max:1}).on('change', v => uWindS.value = v.value);
fWind.addBinding(params, 'windSpeed', {min:0, max:5}).on('change', v => uWindSpeed.value = v.value);

const fColors = pane.addFolder({ title: 'Colors' });
fColors.addBinding(params, 'topColor');
fColors.addBinding(params, 'bottomColor');
fColors.addBinding(params, 'sssColor');
fColors.addBinding(params, 'rimColor');
fColors.addBlade({ view: 'separator' });
fColors.addBinding(params, 'barkColorBase', {label:'Bark base'}).on('change', buildTree);
fColors.addBinding(params, 'barkColorTop', {label:'Bark top'}).on('change', buildTree);

/** 6. MERGE & EXPORT **/
const fExport = pane.addFolder({ title: 'Export Trunk' });

let mergedTrunkMesh = null;

fExport.addButton({ title: 'Merge Trunk Geometry' }).on('click', () => {
    if (params.useCustomTrunk) { alert('Custom trunk loaded — nothing to merge.'); return; }
    const geos = [];
    trunkGroup.updateMatrixWorld(true);
    trunkGroup.traverse(child => {
        if (!child.isMesh) return;
        const g = child.geometry.clone();
        g.applyMatrix4(child.matrixWorld);
        geos.push(g);
    });
    if (geos.length === 0) { alert('No trunk segments found.'); return; }
    const merged = BufferGeometryUtils.mergeGeometries(geos, false);
    if (mergedTrunkMesh) { trunkGroup.remove(mergedTrunkMesh); scene.remove(mergedTrunkMesh); }
    // Remove old separate meshes
    const oldChildren = [...trunkGroup.children];
    oldChildren.forEach(c => trunkGroup.remove(c));
    mergedTrunkMesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: 0x3d2b1f }));
    trunkGroup.add(mergedTrunkMesh);
    geos.forEach(g => g.dispose());
    alert('Trunk merged into 1 mesh (' + merged.attributes.position.count + ' vertices)');
});

fExport.addButton({ title: 'Save Trunk as GLB' }).on('click', () => {
    // Export whatever is in trunkGroup (merged or not)
    const exportGroup = new THREE.Group();
    trunkGroup.updateMatrixWorld(true);
    trunkGroup.traverse(child => {
        if (!child.isMesh) return;
        const clone = child.clone();
        clone.geometry = child.geometry.clone();
        clone.geometry.applyMatrix4(child.matrixWorld);
        clone.position.set(0, 0, 0);
        clone.rotation.set(0, 0, 0);
        clone.scale.set(1, 1, 1);
        exportGroup.add(clone);
    });
    // If not already merged, merge for a clean single-mesh GLB
    if (exportGroup.children.length > 1) {
        const geos = exportGroup.children.map(c => c.geometry);
        const merged = BufferGeometryUtils.mergeGeometries(geos, false);
        exportGroup.clear();
        exportGroup.add(new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: 0x3d2b1f })));
    }
    const exporter = new GLTFExporter();
    exporter.parse(exportGroup, (glb) => {
        const blob = new Blob([glb], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'trunk_seed' + params.seed + '.glb';
        a.click();
        URL.revokeObjectURL(url);
    }, (err) => { alert('Export failed: ' + err); }, { binary: true });
});

/** 7. IMPORT (inside Tweakpane) **/
const fImport = pane.addFolder({ title: 'Import', expanded: true });
const loader = new GLTFLoader();

function _pickFile(accept, cb) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept;
    inp.onchange = () => { if (inp.files[0]) cb(inp.files[0]); };
    inp.click();
}

fImport.addButton({ title: 'Load Leaf SDF (PNG)' }).on('click', () => {
    _pickFile('image/png', file => {
        const reader = new FileReader();
        reader.onload = ev => {
            const img = new Image();
            img.onload = () => {
                const tex = new THREE.Texture(img);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                leafMap.value = tex;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });
});

fImport.addButton({ title: 'Load Custom Trunk (GLB)' }).on('click', () => {
    _pickFile('.glb', file => {
        loader.load(URL.createObjectURL(file), (gltf) => {
            customTrunk = gltf.scene;
            params.useCustomTrunk = true;
            buildTree();
        });
    });
});

function animate() {
    controls.update();
    uTopC.value.set(params.topColor);
    uBotC.value.set(params.bottomColor);
    uSSSC.value.set(params.sssColor);
    uRimC.value.set(params.rimColor);
    renderer.render(scene, camera);
}
</script>
</body>
</html>
