<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Procedural Medieval Tower - Tweakpane Edition</title>

<style>
  body{
    margin:0;
    overflow:hidden;
    background:#0f1118;
  }

  #pane{
    position:absolute;
    top:0;
    left:0;
    width:340px;
    height:100%;
    overflow:auto;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);
    border-right:1px solid #444;
  }

  canvas{
    display:block;
  }
</style>
</head>

<body>

<div id="pane"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
    "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.3/dist/tweakpane.min.js"
  }
}
</script>

<script type="module">

import * as THREE from "three/webgpu";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";
import { Pane } from "tweakpane";

import {
  Fn,
  positionLocal,
  normalLocal,
  vec3,
  sin,
  cos,
  mix,
  normalize
} from "three/tsl";

let renderer, scene, camera, controls;
let towerGroup;
let towerMesh, battlementMesh;
let brickGeometry, brickMaterial;
let groundMesh;
let carvePreviewMesh;
let carveGizmoPivot, carveGizmo;
let carveGizmoHelper;
let isDraggingCarveGizmo = false;
let rebuildTimer = null;
let qualityLevel = "high";
const dynamicDpr = {
  moving: 1,
  resting: Math.min(window.devicePixelRatio || 1, 1.5),
  current: -1,
  settleUntil: 0
};
const tempObj = new THREE.Object3D();
const tempVec = new THREE.Vector3();
const tempVec2 = new THREE.Vector3();
const tempVec3 = new THREE.Vector3();
const tempVec4 = new THREE.Vector3();
const towerInstanceData = [];
const battlementInstanceData = [];
const simTimer = new THREE.Timer();
let debrisSleepCounter = 0;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const removedBricks = new Set();

const params = {

  // tower
  radius:5,
  height:36,
  bricksPerRing:28,
  ringHeight:0.55,

  // brick size
  brickWidth:1.1,
  brickHeight:0.5,
  brickDepth:0.9,

  // random scaling
  scaleRandomness:0.3,
  brickSegments:3,

  // shape
  deformation:0.06,
  edgeWarp:0.025,
  inflate:0.03,
  normalSmooth:0.35,

  // layout
  stagger:true,
  radiusVariation:0.15,
  verticalVariation:0.08,
  rotationVariation:0.05,

  // destruction
  removeRadius:1.2,
  gravity:18,
  bounce:0.28,
  angularDamping:0.985,
  debrisMode:"fade",
  debrisLifetime:6,
  maxDebrisCount:800,
  sleepThreshold:0.42,
  interactionMode:"destruct",

  // carve mode
  carveShape:"doorRect",
  carveAngleDeg:0,
  carveCenterY:3,
  carveWidth:2.2,
  carveHeight:3.8,
  carveDepth:1.6,
  carveApplyOnClick:false,
  carveGizmoMode:"translate",

  // material
  roughness:1,
  metalness:0,
  stoneDarkness:0.45,
  stoneLightness:0.7,

  // battlements
  battlementHeight:1.6,
  battlementSkip:2,

  // lighting
  sunIntensity:3,
  ambientIntensity:1.4,

  // quality
  quality:"high",

  rebuild:()=>{

    removedBricks.clear();
    rebuildTower();

  }

};

init();

async function init(){

  renderer = new THREE.WebGPURenderer({
    antialias:true
  });

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
  setDynamicPixelRatio(dynamicDpr.resting);

  document.body.appendChild(
    renderer.domElement
  );

  await renderer.init();

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x0f1118);

  scene.fog = new THREE.Fog(
    0x0f1118,
    20,
    90
  );

  camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0,12,25);

  controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;

  // LIGHTS

  const hemi =
    new THREE.HemisphereLight(
      0xaabbff,
      0x222233,
      params.ambientIntensity
    );

  hemi.name = "hemi";

  scene.add(hemi);

  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      params.sunIntensity
    );

  sun.position.set(10,20,10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 80;
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -30;
  sun.shadow.bias = -0.0002;

  sun.name = "sun";

  scene.add(sun);

  // GROUND

  groundMesh = new THREE.Mesh(

    new THREE.PlaneGeometry(200,200),

    new THREE.MeshStandardMaterial({
      color:0x262a31,
      roughness:0.95,
      metalness:0.02
    })

  );

  groundMesh.rotation.x = -Math.PI * .5;
  groundMesh.position.y = -2;
  groundMesh.receiveShadow = true;

  scene.add(groundMesh);

  buildTower();
  createCarvePreviewMesh();
  createCarveGizmo();

  buildPane();

  animate();

  window.addEventListener(
    "resize",
    onResize
  );

  window.addEventListener(
    "pointerdown",
    onClick
  );

  controls.addEventListener("start",()=>{
    dynamicDpr.settleUntil = performance.now() + 400;
    setDynamicPixelRatio(dynamicDpr.moving);
  });

  controls.addEventListener("change",()=>{
    dynamicDpr.settleUntil = performance.now() + 250;
  });

}

function createCarvePreviewMesh(){
  carvePreviewMesh = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshBasicMaterial({
      color:0x66c6ff,
      wireframe:true,
      transparent:true,
      opacity:0.6,
      depthTest:false
    })
  );
  carvePreviewMesh.visible = false;
  scene.add(carvePreviewMesh);
}

function createCarveGizmo(){
  carveGizmoPivot = new THREE.Object3D();
  scene.add(carveGizmoPivot);

  carveGizmo = new TransformControls(
    camera,
    renderer.domElement
  );
  carveGizmo.attach(carveGizmoPivot);
  carveGizmo.setMode(params.carveGizmoMode);
  carveGizmo.setSpace("world");
  carveGizmo.setSize(0.9);
  carveGizmo.enabled = false;
  carveGizmo.visible = false;

  carveGizmo.addEventListener(
    "dragging-changed",
    e=>{
      isDraggingCarveGizmo = e.value;
      controls.enabled = !e.value;
    }
  );

  carveGizmo.addEventListener("change", ()=>{
    syncParamsFromCarveGizmo();
  });

  carveGizmoHelper = carveGizmo.getHelper();
  scene.add(carveGizmoHelper);
  updateCarveGizmoFromParams();
}

function buildTower(){

  towerGroup = new THREE.Group();
  towerGroup.name = "towerGroup";
  const groundY = groundMesh ? groundMesh.position.y : -2;
  const towerBaseY = groundY + params.brickHeight * 0.5;

  scene.add(towerGroup);
  createSharedBrickResources();
  towerInstanceData.length = 0;
  battlementInstanceData.length = 0;

  const ringCount = params.height;
  const maxTowerBricks =
    ringCount * params.bricksPerRing;

  towerMesh = new THREE.InstancedMesh(
    brickGeometry,
    brickMaterial,
    maxTowerBricks
  );

  towerMesh.castShadow = true;
  towerMesh.receiveShadow = true;

  let towerCount = 0;

  for(let y=0;y<params.height;y++){

    for(let i=0;i<params.bricksPerRing;i++){

      const id = `${i}_${y}`;

      if(removedBricks.has(id)) continue;

      const stagger =
        params.stagger && y % 2
        ? 0.5
        : 0;

      const angle =
        ((i + stagger) / params.bricksPerRing)
        * Math.PI * 2;

      const radius =
        params.radius
        + (Math.random() - .5)
        * params.radiusVariation;

      const px =
        Math.cos(angle) * radius;

      const pz =
        Math.sin(angle) * radius;

      tempObj.position.set(
        px,
        towerBaseY + y * params.ringHeight,
        pz
      );

      tempObj.lookAt(
        px * 2,
        tempObj.position.y,
        pz * 2
      );

      tempObj.rotateY(Math.PI * .5);

      tempObj.rotation.x +=
        (Math.random() - .5)
        * params.rotationVariation;

      tempObj.rotation.y +=
        (Math.random() - .5)
        * params.rotationVariation;

      tempObj.rotation.z +=
        (Math.random() - .5)
        * params.rotationVariation;

      if(y > 0){
        tempObj.position.y +=
          (Math.random() - .5)
          * params.verticalVariation;
      }

      const r = params.scaleRandomness;
      tempObj.scale.set(
        1 + (Math.random() - .5) * r,
        1 + (Math.random() - .5) * r,
        1 + (Math.random() - .5) * r
      );
      tempObj.updateMatrix();

      towerMesh.setMatrixAt(
        towerCount,
        tempObj.matrix
      );

      const grey =
        params.stoneDarkness
        + Math.random()
        * (params.stoneLightness - params.stoneDarkness);

      towerMesh.setColorAt(
        towerCount,
        new THREE.Color(
          grey * .92,
          grey * .95,
          grey
        )
      );

      towerInstanceData.push({
        id,
        ringIndex:i,
        ringY:y,
        position:new THREE.Vector3(
          tempObj.position.x,
          tempObj.position.y,
          tempObj.position.z
        ),
        rotation:new THREE.Vector3(
          tempObj.rotation.x,
          tempObj.rotation.y,
          tempObj.rotation.z
        ),
        scale:new THREE.Vector3(
          tempObj.scale.x,
          tempObj.scale.y,
          tempObj.scale.z
        ),
        velocity:new THREE.Vector3(),
        angularVelocity:new THREE.Vector3(),
        removed:false,
        hidden:false,
        falling:false,
        sleeping:false,
        sleepOrder:0,
        ttl:0
      });

      towerCount++;

    }

  }

  towerMesh.count = towerCount;
  towerMesh.instanceMatrix.needsUpdate = true;
  if(towerMesh.instanceColor){
    towerMesh.instanceColor.needsUpdate = true;
  }
  towerGroup.add(towerMesh);

  // battlements
  const maxBattlements =
    Math.ceil(
      params.bricksPerRing /
      Math.max(1, params.battlementSkip)
    );

  battlementMesh = new THREE.InstancedMesh(
    brickGeometry,
    brickMaterial,
    maxBattlements
  );

  battlementMesh.castShadow = true;
  battlementMesh.receiveShadow = true;

  let battlementCount = 0;

  for(
    let i=0;
    i<params.bricksPerRing;
    i += params.battlementSkip
  ){

    const angle =
      (i / params.bricksPerRing)
      * Math.PI * 2;

    const px =
      Math.cos(angle) * params.radius;

    const pz =
      Math.sin(angle) * params.radius;

    tempObj.position.set(
      px,
      towerBaseY + params.height * params.ringHeight,
      pz
    );

    tempObj.scale.set(1,1,1);
    tempObj.scale.y =
      params.battlementHeight;

    tempObj.lookAt(
      px * 2,
      tempObj.position.y,
      pz * 2
    );

    tempObj.rotateY(Math.PI * .5);
    tempObj.updateMatrix();

    battlementMesh.setMatrixAt(
      battlementCount,
      tempObj.matrix
    );

    const grey =
      params.stoneDarkness
      + Math.random()
      * (params.stoneLightness - params.stoneDarkness);

    battlementMesh.setColorAt(
      battlementCount,
      new THREE.Color(
        grey * .92,
        grey * .95,
        grey
      )
    );

    battlementInstanceData.push({
      ringIndex:i,
      position:new THREE.Vector3(
        tempObj.position.x,
        tempObj.position.y,
        tempObj.position.z
      ),
      rotation:new THREE.Vector3(
        tempObj.rotation.x,
        tempObj.rotation.y,
        tempObj.rotation.z
      ),
      scale:new THREE.Vector3(
        tempObj.scale.x,
        tempObj.scale.y,
        tempObj.scale.z
      ),
      velocity:new THREE.Vector3(),
      angularVelocity:new THREE.Vector3(),
      removed:false,
      hidden:false,
      falling:false,
      sleeping:false,
      sleepOrder:0,
      ttl:0
    });

    battlementCount++;

  }

  battlementMesh.count = battlementCount;
  battlementMesh.instanceMatrix.needsUpdate = true;
  if(battlementMesh.instanceColor){
    battlementMesh.instanceColor.needsUpdate = true;
  }
  towerGroup.add(battlementMesh);

}

function createSharedBrickResources(){

  if(brickGeometry) brickGeometry.dispose();
  if(brickMaterial) brickMaterial.dispose();

  brickGeometry = new THREE.BoxGeometry(

    params.brickWidth,
    params.brickHeight,
    params.brickDepth,

    params.brickSegments,
    params.brickSegments,
    params.brickSegments

  );

  brickMaterial =
    new THREE.MeshStandardNodeMaterial({
      color:new THREE.Color(0xb3b6bc),

      roughness:params.roughness,
      metalness:params.metalness

    });

  // TSL deformation

  brickMaterial.positionNode = Fn(()=>{

    const p = positionLocal;

    const largeNoise =
      sin(p.x.mul(5))
      .mul(cos(p.y.mul(7)))
      .mul(params.deformation);

    const mediumNoise =
      sin(p.z.mul(9))
      .mul(cos(p.x.mul(8)))
      .mul(params.deformation * .6);

    const edgeWarp =
      sin(p.y.mul(14))
      .mul(params.edgeWarp);

    const inflate =
      normalize(p)
      .mul(params.inflate);

    return vec3(

      p.x
      .add(largeNoise)
      .add(edgeWarp)
      .add(inflate.x),

      p.y
      .add(mediumNoise)
      .add(inflate.y),

      p.z
      .add(largeNoise)
      .add(edgeWarp)
      .add(inflate.z)

    );

  })();

  brickMaterial.normalNode = Fn(()=>{

    return normalize(

      mix(
        normalLocal,
        normalize(positionLocal),
        params.normalSmooth
      )

    );

  })();

}

function rebuildTower(){

  if(towerGroup){

    scene.remove(towerGroup);
    towerGroup.clear();

  }

  buildTower();

}

function onClick(event){

  mouse.x =
    (event.clientX / window.innerWidth) * 2 - 1;

  mouse.y =
    -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(
    mouse,
    camera
  );

  const hits =
    raycaster.intersectObjects(
      [towerMesh, battlementMesh]
    );

  if(hits.length){

    const hitIndex = hits[0].instanceId ?? -1;
    if(hitIndex < 0){
      return;
    }

    const hitObject = hits[0].object;
    let hitPoint = null;

    if(
      hitObject === towerMesh
      && towerInstanceData[hitIndex]
      && !towerInstanceData[hitIndex].removed
    ){
      hitPoint = towerInstanceData[hitIndex].position;
    }else if(
      hitObject === battlementMesh
      && battlementInstanceData[hitIndex]
      && !battlementInstanceData[hitIndex].removed
    ){
      hitPoint = battlementInstanceData[hitIndex].position;
    }

    if(hitPoint){
      if(params.interactionMode === "carve"){
        setCarveFromHitPoint(hitPoint);
        if(params.carveApplyOnClick){
          applyCarveAtCurrentSettings(hitPoint);
        }
      }else{
        applyImpactFall(hitPoint);
        triggerStructuralCollapse();
      }
    }

  }

}

function setCarveFromHitPoint(hitPoint){
  tempVec.set(hitPoint.x, 0, hitPoint.z);
  if(tempVec.lengthSq() < 1e-6){
    return;
  }
  const angle = Math.atan2(tempVec.z, tempVec.x);
  params.carveAngleDeg = THREE.MathUtils.radToDeg(angle);
  if(params.carveShape.startsWith("door")){
    params.carveCenterY =
      hitPoint.y + params.carveHeight * 0.5;
  }else{
    params.carveCenterY = hitPoint.y;
  }
  updateCarveGizmoFromParams();
}

function getCarveFrame(){
  const angle = THREE.MathUtils.degToRad(params.carveAngleDeg);
  const radial = new THREE.Vector3(
    Math.cos(angle),
    0,
    Math.sin(angle)
  );
  const tangent = new THREE.Vector3(
    -radial.z,
    0,
    radial.x
  );

  const center = new THREE.Vector3(
    radial.x * params.radius,
    params.carveCenterY,
    radial.z * params.radius
  );

  return { center, radial, tangent };
}

function applyCarveAtCurrentSettings(fallbackHitPoint = null){
  const frame = getCarveFrame();
  const center = fallbackHitPoint || frame.center;
  const radial = frame.radial;
  const tangent = frame.tangent;

  let removedAny = false;
  removedAny = applyCarveToCollection(
    towerInstanceData,
    towerMesh,
    center,
    radial,
    tangent,
    true
  ) || removedAny;

  removedAny = applyCarveToCollection(
    battlementInstanceData,
    battlementMesh,
    center,
    radial,
    tangent,
    false
  ) || removedAny;

  if(removedAny){
    triggerStructuralCollapse();
  }
}

function syncParamsFromCarveGizmo(){
  if(!carveGizmoPivot) return;

  const rotAngle = carveGizmoPivot.rotation.y;
  const planarLen = Math.hypot(
    carveGizmoPivot.position.x,
    carveGizmoPivot.position.z
  );

  let angle = rotAngle;
  if(planarLen > 1e-5){
    angle = Math.atan2(
      carveGizmoPivot.position.z,
      carveGizmoPivot.position.x
    );
  }

  params.carveAngleDeg = THREE.MathUtils.radToDeg(angle);
  carveGizmoPivot.position.x =
    Math.cos(angle) * params.radius;
  carveGizmoPivot.position.z =
    Math.sin(angle) * params.radius;
  params.carveCenterY = carveGizmoPivot.position.y;

  params.carveWidth = Math.max(
    0.3,
    Math.abs(carveGizmoPivot.scale.x)
  );
  params.carveHeight = Math.max(
    0.3,
    Math.abs(carveGizmoPivot.scale.y)
  );
  params.carveDepth = Math.max(
    0.2,
    Math.abs(carveGizmoPivot.scale.z)
  );
}

function updateCarveGizmoFromParams(){
  if(!carveGizmoPivot || isDraggingCarveGizmo){
    return;
  }

  const frame = getCarveFrame();
  carveGizmoPivot.position.copy(frame.center);
  carveGizmoPivot.rotation.set(
    0,
    THREE.MathUtils.degToRad(params.carveAngleDeg),
    0
  );
  carveGizmoPivot.scale.set(
    params.carveWidth,
    params.carveHeight,
    params.carveDepth
  );
}

function applyCarveToCollection(
  collection,
  mesh,
  center,
  radial,
  tangent,
  trackRemoved
){
  if(!mesh) return false;

  let removedAny = false;
  const halfWidth = params.carveWidth * 0.5;
  const halfHeight = params.carveHeight * 0.5;
  const halfDepth = params.carveDepth * 0.5;

  for(let i=0;i<collection.length;i++){
    const instance = collection[i];
    if(instance.removed) continue;

    tempVec4.subVectors(instance.position, center);

    const tangentDist =
      Math.abs(tempVec4.dot(tangent));
    const verticalDist =
      Math.abs(tempVec4.y);
    const radialDist =
      Math.abs(tempVec4.dot(radial));
    const localY = tempVec4.y;
    const absX = tangentDist;

    let inside =
      radialDist <= halfDepth
      && isInsideCarveProfile(
        absX,
        localY,
        verticalDist,
        halfWidth,
        halfHeight
      );

    if(
      inside
      && params.carveShape === "windowSlit"
      && verticalDist > halfHeight * 0.8
      && tangentDist > halfWidth * 0.35
    ){
      inside = false;
    }

    if(inside){
      instance.removed = true;
      if(trackRemoved && instance.id){
        removedBricks.add(instance.id);
      }
      startFallingInstance(
        collection,
        mesh,
        i,
        center
      );
      removedAny = true;
    }
  }

  if(removedAny){
    mesh.instanceMatrix.needsUpdate = true;
  }

  return removedAny;
}

function isInsideCarveProfile(
  absX,
  localY,
  verticalDist,
  halfWidth,
  halfHeight
){
  const totalHeight = halfHeight * 2;
  const yFromBottom = localY + halfHeight;

  if(
    params.carveShape === "doorRect"
  ){
    return (
      absX <= halfWidth
      && yFromBottom >= 0
      && yFromBottom <= totalHeight
    );
  }

  if(params.carveShape === "doorArch"){
    const radius = Math.min(halfWidth, totalHeight * 0.45);
    const archCenterY = totalHeight - radius;
    const inRect =
      absX <= halfWidth
      && yFromBottom >= 0
      && yFromBottom <= archCenterY;
    const dy = yFromBottom - archCenterY;
    const inArch =
      yFromBottom >= archCenterY
      && yFromBottom <= totalHeight
      && (absX * absX + dy * dy) <= radius * radius;
    return inRect || inArch;
  }

  if(params.carveShape === "windowSlit"){
    const inBody =
      absX <= halfWidth * 0.35
      && verticalDist <= halfHeight;
    const inTopBottom =
      absX <= halfWidth * 0.7
      && verticalDist <= halfHeight * 0.25;
    return inBody || inTopBottom;
  }

  if(params.carveShape === "windowArch"){
    const radius =
      Math.min(halfWidth * 0.9, halfHeight * 0.65);
    const rectHalfWidth = Math.min(halfWidth, radius * 0.75);
    const archCenterY = halfHeight - radius;
    const inRect =
      absX <= rectHalfWidth
      && localY >= -halfHeight
      && localY <= archCenterY;
    const dy = localY - archCenterY;
    const inArch =
      localY >= archCenterY
      && localY <= halfHeight
      && (absX * absX + dy * dy) <= radius * radius;
    return inRect || inArch;
  }

  return absX <= halfWidth && verticalDist <= halfHeight;
}

function applyImpactFall(hitPoint){
  applyImpactFallToCollection(
    towerInstanceData,
    towerMesh,
    hitPoint,
    true
  );
  applyImpactFallToCollection(
    battlementInstanceData,
    battlementMesh,
    hitPoint,
    false
  );
}

function applyImpactFallToCollection(
  collection,
  mesh,
  hitPoint,
  trackRemoved
){
  if(!mesh) return;
  let removedAny = false;
  for(let i=0;i<collection.length;i++){
    const instance = collection[i];
    if(instance.removed) continue;

    const d = instance.position.distanceTo(hitPoint);
    if(d < params.removeRadius){
      instance.removed = true;
      if(trackRemoved && instance.id){
        removedBricks.add(instance.id);
      }
      startFallingInstance(
        collection,
        mesh,
        i,
        hitPoint
      );
      removedAny = true;
    }
  }
  if(removedAny){
    mesh.instanceMatrix.needsUpdate = true;
  }
}

function startFallingInstance(
  collection,
  mesh,
  index,
  hitPoint
){
  const instance = collection[index];
  if(!instance || instance.hidden || instance.falling){
    return;
  }

  tempVec.subVectors(
    instance.position,
    hitPoint
  );

  const lenSq = tempVec.lengthSq();
  if(lenSq < 1e-6){
    tempVec.set(
      (Math.random() - 0.5) * 0.3,
      0,
      (Math.random() - 0.5) * 0.3
    );
  }else{
    tempVec.normalize();
  }

  const push = 2.6 + Math.random() * 1.8;
  instance.velocity.set(
    tempVec.x * push,
    2.5 + Math.random() * 2.2,
    tempVec.z * push
  );

  instance.angularVelocity.set(
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 6
  );

  instance.falling = true;
  instance.sleeping = false;
  instance.hidden = false;
  instance.ttl = params.debrisLifetime;
}

function hideInstance(collection, mesh, index){
  const instance = collection[index];
  if(instance){
    instance.hidden = true;
    instance.falling = false;
    instance.sleeping = false;
    instance.sleepOrder = 0;
    instance.ttl = 0;
  }

  tempObj.position.set(0,-9999,0);
  tempObj.rotation.set(0,0,0);
  tempObj.scale.set(0.001,0.001,0.001);
  tempObj.updateMatrix();
  mesh.setMatrixAt(index, tempObj.matrix);
}

function triggerStructuralCollapse(){
  const stableMap = new Map();
  const stableTower = instance=>
    !instance.removed && !instance.falling && !instance.hidden;

  for(let i=0;i<towerInstanceData.length;i++){
    const instance = towerInstanceData[i];
    if(stableTower(instance)){
      stableMap.set(
        `${instance.ringIndex}_${instance.ringY}`,
        i
      );
    }
  }

  const wrapIndex = index=>{
    const n = params.bricksPerRing;
    return ((index % n) + n) % n;
  };

  let changed = true;
  let guard = 0;

  while(changed && guard < params.height + 3){
    changed = false;
    guard++;

    for(let i=0;i<towerInstanceData.length;i++){
      const instance = towerInstanceData[i];
      if(!stableTower(instance)){
        continue;
      }

      if(instance.ringY <= 0){
        continue;
      }

      let supported = false;
      const by = instance.ringY - 1;
      for(let o=-1;o<=1;o++){
        const key = `${wrapIndex(instance.ringIndex + o)}_${by}`;
        if(stableMap.has(key)){
          supported = true;
          break;
        }
      }

      if(!supported){
        instance.removed = true;
        if(instance.id){
          removedBricks.add(instance.id);
        }
        stableMap.delete(
          `${instance.ringIndex}_${instance.ringY}`
        );
        startFallingInstance(
          towerInstanceData,
          towerMesh,
          i,
          instance.position
        );
        changed = true;
      }
    }

    const topRingY = params.height - 1;
    for(let i=0;i<battlementInstanceData.length;i++){
      const battlement = battlementInstanceData[i];
      if(
        battlement.removed
        || battlement.hidden
        || battlement.falling
      ){
        continue;
      }

      let supported = false;
      for(let o=-1;o<=1;o++){
        const key = `${wrapIndex(battlement.ringIndex + o)}_${topRingY}`;
        if(stableMap.has(key)){
          supported = true;
          break;
        }
      }

      if(!supported){
        battlement.removed = true;
        startFallingInstance(
          battlementInstanceData,
          battlementMesh,
          i,
          battlement.position
        );
        changed = true;
      }
    }
  }

  if(towerMesh){
    towerMesh.instanceMatrix.needsUpdate = true;
  }
  if(battlementMesh){
    battlementMesh.instanceMatrix.needsUpdate = true;
  }
}

function updateFallingBricks(dt){
  if(!towerMesh) return;

  const groundY = groundMesh ? groundMesh.position.y : -2;
  updateFallingCollection(
    towerInstanceData,
    towerMesh,
    dt,
    groundY
  );
  updateFallingCollection(
    battlementInstanceData,
    battlementMesh,
    dt,
    groundY
  );
}

function updateFallingCollection(
  collection,
  mesh,
  dt,
  groundY
){
  if(!mesh) return;
  let updatedAny = false;

  for(let i=0;i<collection.length;i++){
    const instance = collection[i];
    if(!instance.falling || instance.hidden){
      continue;
    }

    instance.velocity.y -= params.gravity * dt;
    instance.position.addScaledVector(
      instance.velocity,
      dt
    );

    instance.rotation.x +=
      instance.angularVelocity.x * dt;
    instance.rotation.y +=
      instance.angularVelocity.y * dt;
    instance.rotation.z +=
      instance.angularVelocity.z * dt;

    tempVec2.copy(instance.angularVelocity)
      .multiplyScalar(params.angularDamping);
    instance.angularVelocity.copy(tempVec2);

    const minY =
      groundY + params.brickHeight * 0.45;

    if(instance.position.y < minY){
      instance.position.y = minY;
      if(Math.abs(instance.velocity.y) > 0.5){
        instance.velocity.y =
          -instance.velocity.y * params.bounce;
        instance.velocity.x *= 0.86;
        instance.velocity.z *= 0.86;
      }else{
        instance.velocity.y = 0;
        instance.velocity.x *= 0.9;
        instance.velocity.z *= 0.9;
      }

      const horizontalSpeed =
        Math.hypot(
          instance.velocity.x,
          instance.velocity.z
        );
      const speed =
        Math.hypot(horizontalSpeed, instance.velocity.y);

      if(speed < params.sleepThreshold){
        instance.velocity.set(0,0,0);
        instance.angularVelocity.set(0,0,0);
        instance.falling = false;
        instance.sleeping = true;
        instance.sleepOrder = ++debrisSleepCounter;
      }
    }

    if(instance.falling){
      instance.ttl -= dt;
      if(
        instance.position.y < groundY - 8
        || (
          params.debrisMode === "fade"
          && instance.ttl <= 0
        )
      ){
        hideInstance(collection, mesh, i);
        updatedAny = true;
        continue;
      }
    }

    tempObj.position.copy(instance.position);
    tempObj.rotation.set(
      instance.rotation.x,
      instance.rotation.y,
      instance.rotation.z
    );
    tempObj.scale.copy(instance.scale);
    tempObj.updateMatrix();
    mesh.setMatrixAt(i, tempObj.matrix);
    updatedAny = true;
  }

  if(updatedAny){
    mesh.instanceMatrix.needsUpdate = true;
  }

  enforceDebrisLimit();
}

function enforceDebrisLimit(){
  if(params.debrisMode !== "keep"){
    return;
  }

  const sleeping = [];

  for(let i=0;i<towerInstanceData.length;i++){
    const instance = towerInstanceData[i];
    if(instance.sleeping && !instance.hidden){
      sleeping.push({
        collection:towerInstanceData,
        mesh:towerMesh,
        index:i,
        order:instance.sleepOrder
      });
    }
  }

  for(let i=0;i<battlementInstanceData.length;i++){
    const instance = battlementInstanceData[i];
    if(instance.sleeping && !instance.hidden){
      sleeping.push({
        collection:battlementInstanceData,
        mesh:battlementMesh,
        index:i,
        order:instance.sleepOrder
      });
    }
  }

  if(sleeping.length <= params.maxDebrisCount){
    return;
  }

  sleeping.sort((a,b)=>a.order - b.order);
  const overflow =
    sleeping.length - params.maxDebrisCount;

  let towerUpdated = false;
  let battlementUpdated = false;

  for(let i=0;i<overflow;i++){
    const entry = sleeping[i];
    hideInstance(
      entry.collection,
      entry.mesh,
      entry.index
    );
    if(entry.mesh === towerMesh){
      towerUpdated = true;
    }else if(entry.mesh === battlementMesh){
      battlementUpdated = true;
    }
  }

  if(towerUpdated && towerMesh){
    towerMesh.instanceMatrix.needsUpdate = true;
  }
  if(battlementUpdated && battlementMesh){
    battlementMesh.instanceMatrix.needsUpdate = true;
  }
}

function scheduleRebuild(){
  if(rebuildTimer){
    clearTimeout(rebuildTimer);
  }
  rebuildTimer = setTimeout(()=>{
    rebuildTimer = null;
    rebuildTower();
  }, 120);
}

function setDynamicPixelRatio(value){
  if(Math.abs(dynamicDpr.current - value) < 0.01){
    return;
  }
  dynamicDpr.current = value;
  renderer.setPixelRatio(value);
}

    "brickDepth",

  ).on("change", scheduleRebuild);

  fBrick.addBinding(
    params,
    "scaleRandomness",
    { min:0, max:1 }
  ).on("change", scheduleRebuild);

  fBrick.addBinding(
    params,
    "brickSegments",
    { min:1, max:10, step:1 }
  ).on("change", scheduleRebuild);

  // shape

    pane.addFolder({

    });

  fShape.addBinding(

    "deformation",
    { min:0, max:0.2 }
  ).on("change", scheduleRebuild);

  fShape.addBinding(
    params,
    "edgeWarp",
    { min:0, max:0.1 }
  ).on("change", scheduleRebuild);

  fShape.addBinding(
    params,
    "inflate",
    { min:0, max:0.1 }
  ).on("change", scheduleRebuild);

  fShape.addBinding(
    params,

  fRandom.addBinding(

    { min:0, max:1 }

    "verticalVariation",

  ).on("change", scheduleRebuild);

  fRandom.addBinding(
    params,
    "rotationVariation",
    { min:0, max:0.2 }
  ).on("change", scheduleRebuild);

  fRandom.addBinding(
    params,
    "stagger"
  ).on("change", scheduleRebuild);

  // destruction

  const fDestroy =
    pane.addFolder({
      title:"Destruction"
    });

  fDestroy.addBinding(
    params,
    "interactionMode",
    {
      options:{
        destruct:"destruct",
        carve:"carve"
      }
    }
  );

  fDestroy.addBinding(
    params,
    "removeRadius",
    { min:0.2, max:6 }
  );

  fDestroy.addBinding(
    params,
    "gravity",
    { min:2, max:40 }
  );

  fDestroy.addBinding(
    params,
    "bounce",
    { min:0, max:0.9 }
  );

  fDestroy.addBinding(
    params,
    "debrisMode",
    {

        keep:"keep"
      }
    }
  );

  fDestroy.addBinding(
    params,
    "debrisLifetime",
    { min:1, max:20 }

    { min:0, max:1 }
  ).on("change", scheduleRebuild);

  fMaterial.addBinding(
    params,
    "stoneDarkness",

  ).on("change", scheduleRebuild);

  fMaterial.addBinding(
    params,
    "stoneLightness",
    { min:0.1, max:1 }
  ).on("change", rebuildTower);

  // lighting

  const fLight =
    pane.addFolder({
      title:"Lighting"
    });

  fLight.addBinding(
    params,
    "sunIntensity",
    { min:0, max:10 }
  ).on("change", e=>{

    scene.getObjectByName("sun")
      .intensity = e.value;

  });

  fLight.addBinding(
    params,
    "ambientIntensity",
    { min:0, max:5 }
  ).on("change", e=>{

      .intensity = e.value;

  const fQuality =
    pane.addFolder({
      title:"Quality"
    });

  fQuality.addBinding(
    params,
    "quality",
    {
      options:{
        low:"low",
        medium:"medium",
        high:"high",
        cinematic:"cinematic"
      }
    }
  ).on("change", e=>{
    applyQualityPreset(e.value);
  });

  pane.addButton({
    title:"REBUILD"
  }).on("click", params.rebuild);

}

function applyQualityPreset(level){
  qualityLevel = level;
  if(level === "low"){
    params.brickSegments = 1;
    dynamicDpr.resting = 1;
    renderer.toneMappingExposure = 1;
    const sun = scene.getObjectByName("sun");
    if(sun) sun.shadow.mapSize.set(1024,1024);
  }else if(level === "medium"){
    params.brickSegments = 2;
    dynamicDpr.resting = Math.min(window.devicePixelRatio || 1, 1.25);
    renderer.toneMappingExposure = 1.02;
    const sun = scene.getObjectByName("sun");
    if(sun) sun.shadow.mapSize.set(1536,1536);
  }else if(level === "cinematic"){
    params.brickSegments = 6;
    dynamicDpr.resting = Math.min(window.devicePixelRatio || 1, 2);
    renderer.toneMappingExposure = 1.12;
    const sun = scene.getObjectByName("sun");
    if(sun) sun.shadow.mapSize.set(3072,3072);
  }else{
    params.brickSegments = 3;
    dynamicDpr.resting = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.toneMappingExposure = 1.05;
    const sun = scene.getObjectByName("sun");
    if(sun) sun.shadow.mapSize.set(2048,2048);
  }

  setDynamicPixelRatio(dynamicDpr.resting);
  scheduleRebuild();
}

function animate(){

  requestAnimationFrame(animate);
  simTimer.update();
  const dt = Math.min(
    simTimer.getDelta(),
    0.033
  );

  controls.update();
  updateFallingBricks(dt);
  updateCarvePreview();

  if(performance.now() > dynamicDpr.settleUntil){
    setDynamicPixelRatio(dynamicDpr.resting);
  }else{
    setDynamicPixelRatio(dynamicDpr.moving);
  }

  renderer.render(
    scene,
    camera
  );

}

function updateCarvePreview(){
  if(!carvePreviewMesh){
    return;
  }

  const show =
    params.interactionMode === "carve";
  carvePreviewMesh.visible = show;
  if(carveGizmo){
    carveGizmo.enabled = show;
  }
  if(carveGizmoHelper){
    carveGizmoHelper.visible = show;
  }

  if(!show){
    return;
  }

  if(!isDraggingCarveGizmo){
    updateCarveGizmoFromParams();
  }

  carvePreviewMesh.position.copy(carveGizmoPivot.position);
  carvePreviewMesh.scale.copy(carveGizmoPivot.scale);
  carvePreviewMesh.rotation.set(
    0,
    THREE.MathUtils.degToRad(params.carveAngleDeg),
    0
  );
}

function onResize(){

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
  setDynamicPixelRatio(dynamicDpr.current > 0 ? dynamicDpr.current : dynamicDpr.resting);

}
