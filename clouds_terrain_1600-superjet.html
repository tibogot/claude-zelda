    <script type="importmap">
      {

          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",

          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        float,
        vec2,
        vec3,
        vec4,
        Fn,
        Loop,
        If,
        Break,
        Discard,
        dot,
        exp,
        mix,
        color,
        normalize,
        texture,
        texture3D,
        uniform,
        uv,
        screenUV,
        modelViewMatrix,
        modelWorldMatrix,
        modelWorldMatrixInverse,
        cameraPosition,
        positionGeometry,
        positionWorld,
        normalGeometry,
        normalWorld,
        varying,
        max,
        min,
        abs,
        pow,
        smoothstep,
        length,
        fract,
        sin,
        cos,
        floor,
        sqrt,
        sub,
        mul,
        add,
        div,
        mod,
        or,
        equal,
        clamp,
        normalMap,
      } from "three/tsl";
      import { ImprovedNoise } from "three/addons/math/ImprovedNoise.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";
      import Stats from "three/addons/libs/stats.module.js";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const SOLID_LAYER = 1;
      const VOLUME_LAYER = 2;

      const HDRI_LOCAL = "assets/golden_gate_hills_1k.hdr";
      const HDRI_FALLBACK =
        "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/golden_gate_hills_1k.hdr";
      const BLUE_NOISE_LOCAL = "assets/HDR_L_0.png";
      /** Same asset as `v2/play/playMode.js` (PLANE_MODEL). */
      const PLANE_GLB_URL = new URL(
        "./models/wenning_carsten_gameart_plane_compressed.glb",
        import.meta.url,
      ).href;

      const THREE_VERSION = "0.183.1";
      const DRACO_DECODER_PATH = `https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/examples/jsm/libs/draco/`;
      const BASIS_TRANSCODER_PATH = `https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/examples/jsm/libs/basis/`;
      const PI_VAL = 3.14159265359;
      const MAX_RM_STEPS = 120;
      const MAX_LIGHT_STEPS = 32;
      /* God-rays loop bound; lower = smaller shader / faster compile & runs. */
      const MAX_GOD_SAMPLES = 128;

      /** `SphereGeometry` radius for sun mesh; world radius = this × scale from GUI. */
      const SUN_DISC_GEOM_RADIUS = 340;
      const _sunDirScratch = new THREE.Vector3();

      const _drawingBuf = new THREE.Vector2();
      const TERRAIN_SIZE = 1600;
      const _cloudCenter = new THREE.Vector3();
      const _frustum = new THREE.Frustum();
      const _camViewProj = new THREE.Matrix4();

      const LOD_DIST_NEAR = 180;
      const LOD_DIST_FAR = 1200;

      /**
       * Live heightfield controls (mirrored from `parameters` after GUI init).
       * `terrainHeight` / `mountainRelief` read only this object.
       */
      const terrainShape = {
        segments: 320,
        fbmScale: 0.0046,
        octaves: 6,
        persistence: 0.5,
        lacunarity: 2.0,
        heightScale: 255,
        flatness: 2.6,
        macroBlend: 0.2,
        macroFreq: 0.55,
        macroOctaves: 4,
        peakBias: 0.28,
        ridgeBoost: 0.09,
        ridgeFreq: 1.35,
        ridgeOctaves: 3,
        floorY: -145,
        mountainReliefMul: 0.42,
        heroPeakAmp: 1,
        heroSpread: 1,
        heroRidgeAmp: 95,
        heroRidgeR: 240000,
      };

      const TERRAIN_WORLD_HALF = TERRAIN_SIZE * 0.5 - 15;

      /** Stylized patchwork fields (Voronoi / Worley) + dirt paths on cell edges. */
      /** Larger cells read more clearly as patchwork (screenshot-style). */
      const FIELD_CELL_SIZE = 52;
      const PATH_EDGE_START = 0.035;
      const PATH_EDGE_END = 0.68;
      const FOREST_GRID_STEP = 12;
      const FOREST_MAX_SLOPE_SQ = 72 * 72;
      const FOREST_MAX_INSTANCES = 3200;
      const FOREST_PATH_SKIP = 0.32;
      /** No instanced trees above this terrain height (summits stay clear of forest). */
      const FOREST_MAX_ELEVATION = 175;

      const FLY_MOUSE_SENS_X = 0.0022;
      const FLY_MOUSE_SENS_Y = 0.00235;
      const FLY_PITCH_MIN = -1.22;
      const FLY_PITCH_MAX = 0.9;
      const FLY_PITCH_CLIMB_SCALE = 26;
      const FLY_PITCH_DIVE_MULT = 1.82;
      const FLY_ROLL_MAX = 0.78;
      const FLY_ROLL_VEL_SCALE = 0.0042;
      const FLY_ROLL_SMOOTH = 10;
      const FLY_ROLL_TARGET_DECAY = 5;
      const FLY_SURFACE_ALT = 1.35;
      const FLY_SURFACE_SPEED = 16;
      const FLY_AILERON_RATE = 2.8;
      /* v2/play/playMode.js — iso fly: yaw / altitude when camera is not chase. */
      const ISO_FLY_YAW_RATE = 1.9;
      const ISO_FLY_CLIMB_RATE = 28;
      const ISO_FLY_DESCEND_RATE = 48;

      const PLANE_MAX_FWD = 56;
      const PLANE_MAX_FWD_BOOST = 78;
      const PLANE_SHIFT_ACCEL_MULT = 1.5;
      const PLANE_MAX_REV = 18;
      const PLANE_ACCEL = 10.5;
      const PLANE_BRAKE = 26;
      const PLANE_REV_ACCEL = 8;
      const PLANE_COAST = 3.8;
      const PLANE_DRAG = 0.014;
      const PLANE_DECK_ALT = 1.15;
      const PLANE_DECK_COAST_MULT = 2.1;

      /* Chase cam: slightly farther than v2’s CAM_DIST (8) so the larger plane fits the frame. */
      const CAM_DIST_FLIGHT = 11;
      const CAM_PITCH_FLIGHT = 0.35;
      const CAM_COLLISION_OFFSET = 0.3;

      /** v2 uses `2.8 * (CAP_H + 2*CAP_R)`; modest bump so it reads well at this camera distance. */
      const PLANE_MODEL_EXTRA_SCALE = 1.45;

      /* ——— Repo: seeded random ——— */
      function createSeededRandom(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function smoothstepJS(edge0, edge1, x) {
        const t = Math.max(
          0,
          Math.min(1, (x - edge0) / Math.max(1e-5, edge1 - edge0)),
        );
        return t * t * (3 - 2 * t);
      }

      function fbm(perlin, x, y, z, octaves, persistence, lacunarity) {
        let total = 0.0,
          frequency = 1.0,
          amplitude = 1.0,
          maxValue = 0.0;
        for (let i = 0; i < octaves; i++) {
          total +=
            perlin.noise(x * frequency, y * frequency, z * frequency) *
            amplitude;
          maxValue += amplitude;
          amplitude *= persistence;
          frequency *= lacunarity;
        }
        return total / Math.max(1e-6, maxValue);
      }

      const terrainRng = createSeededRandom(4242);
      const terrainPerlin = new ImprovedNoise(terrainRng);

      function mountainRelief(x, z) {
        const ts = terrainShape;
        const spread = Math.max(0.25, ts.heroSpread);
        const amp = ts.heroPeakAmp;
        const peaks = [
          { cx: -320, cz: 240, r: 195000, a: 210 },
          { cx: 380, cz: -300, r: 220000, a: 265 },
          { cx: 40, cz: -120, r: 150000, a: 175 },
        ];
        let sum = 0;
        for (const p of peaks) {
          const dx = x - p.cx;
          const dz = z - p.cz;
          sum +=
            Math.exp(-(dx * dx + dz * dz) / (p.r * spread)) * p.a * amp;
        }
        const ridge =
          Math.exp(
            -((x - 120) * (x - 120) + (z + 160) * (z + 160)) /
              (ts.heroRidgeR * spread),
          ) *
          ts.heroRidgeAmp *
          amp;
        return (sum + ridge) * ts.mountainReliefMul;
      }

      function terrainHeight(x, z) {
        const ts = terrainShape;
        const nx = x * ts.fbmScale;
        const nz = z * ts.fbmScale;
        const oct = Math.max(1, Math.min(14, Math.round(ts.octaves)));
        const mOct = Math.max(1, Math.min(8, Math.round(ts.macroOctaves)));
        const rOct = Math.max(1, Math.min(8, Math.round(ts.ridgeOctaves)));
        const mb = THREE.MathUtils.clamp(ts.macroBlend, 0, 1);
        const mf = ts.macroFreq;
        const macro =
          fbm(
            terrainPerlin,
            nx * mf + 1.8,
            0,
            nz * mf - 1.2,
            mOct,
            ts.persistence,
            ts.lacunarity,
          ) *
            2 -
          1;
        let h = fbm(
          terrainPerlin,
          nx,
          0,
          nz,
          oct,
          ts.persistence,
          ts.lacunarity,
        );
        let t = h * 0.5 + 0.5;
        const flat = Math.max(0.15, ts.flatness);
        t = Math.pow(Math.min(1, Math.max(1e-7, t)), 1.0 / flat);
        h = t * 2.0 - 1.0;
        h = h * (1 - mb) + macro * mb;
        const rid =
          fbm(
            terrainPerlin,
            nx * ts.ridgeFreq + 0.2,
            2.4,
            nz * ts.ridgeFreq - 0.3,
            rOct,
            ts.persistence * 0.96,
            ts.lacunarity,
          ) *
            2 -
          1;
        h += Math.max(0, rid) * ts.ridgeBoost;
        const pb = Math.max(0, ts.peakBias);
        const peakBias = Math.max(0, h);
        h += peakBias * peakBias * pb;
        let y = h * ts.heightScale;
        y += mountainRelief(x, z);
        return Math.max(ts.floorY, y);
      }

      function getWorldHeight(x, z) {
        return terrainHeight(x, z);
      }

      function hashCell2D(ix, iz) {
        const a = (ix | 0) * 374761393;
        const b = (iz | 0) * 668265263;
        let n = (a ^ b) >>> 0;
        n = Math.imul(n ^ (n >>> 15), 1274126177) >>> 0;
        return (n ^ (n >>> 16)) >>> 0;
      }

      /** Nearest-cell Worley in XZ; `edge` is small on Voronoi boundaries (paths). */
      function worleyFieldDecor(x, z) {
        const S = FIELD_CELL_SIZE;
        const ix0 = Math.floor(x / S);
        const iz0 = Math.floor(z / S);
        let d1 = 1e30;
        let d2 = 1e30;
        let cellHash = 0;
        for (let jz = -2; jz <= 2; jz++) {
          for (let jx = -2; jx <= 2; jx++) {
            const ix = ix0 + jx;
            const iz = iz0 + jz;
            const h = hashCell2D(ix, iz);
            const ox = (h & 0xffff) / 65536;
            const oz = ((h >>> 16) & 0xffff) / 65536;
            const fx = (ix + ox) * S;
            const fz = (iz + oz) * S;
            const dx = x - fx;
            const dz = z - fz;
            const d = dx * dx + dz * dz;
            if (d < d1) {
              d2 = d1;
              d1 = d;
              cellHash = h;
            } else if (d < d2) {
              d2 = d;
            }
          }
        }
        const s1 = Math.sqrt(d1);
        const s2 = Math.sqrt(d2);
        return { edge: s2 - s1, cellHash, d1: s1 };
      }

      function terrainSlopeMetricSq(x, z) {
        const e = 2.5;
        const hx = terrainHeight(x + e, z) - terrainHeight(x - e, z);
        const hz = terrainHeight(x, z + e) - terrainHeight(x, z - e);
        return hx * hx + hz * hz;
      }

      function buildTerrainMesh() {
        const seg = Math.max(
          32,
          Math.min(512, Math.round(terrainShape.segments)),
        );
        const geo = new THREE.PlaneGeometry(
          TERRAIN_SIZE,
          TERRAIN_SIZE,
          seg,
          seg,
        );
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          pos.setY(i, terrainHeight(x, z));
        }
        geo.computeVertexNormals();
        return geo;
      }

      function makeTerrainTriSampleRGB(tex, scaleUniform) {
        return Fn(() => {
          const pos = positionWorld;
          const nrm = normalWorld;
          const sc = scaleUniform;
          const w = pow(abs(nrm), vec3(3, 3, 3));
          const ws = max(add(add(w.x, w.y), w.z), float(1e-4));
          const tw = w.div(ws);
          const ax = texture(tex, mul(vec2(pos.y, pos.z), sc)).rgb;
          const ay = texture(tex, mul(pos.xz, sc)).rgb;
          const az = texture(tex, mul(pos.xy, sc)).rgb;
          return add(add(mul(ax, tw.x), mul(ay, tw.y)), mul(az, tw.z));
        });
      }

      function makeTerrainTriSampleR(tex, scaleUniform) {
        return Fn(() => {
          const pos = positionWorld;
          const nrm = normalWorld;
          const sc = scaleUniform;
          const w = pow(abs(nrm), vec3(3, 3, 3));
          const ws = max(add(add(w.x, w.y), w.z), float(1e-4));
          const tw = w.div(ws);
          const ax = texture(tex, mul(vec2(pos.y, pos.z), sc)).x;
          const ay = texture(tex, mul(pos.xz, sc)).x;
          const az = texture(tex, mul(pos.xy, sc)).x;
          return add(add(mul(ax, tw.x), mul(ay, tw.y)), mul(az, tw.z));
        });
      }

      async function loadSuperjetTerrainPBR(texLoader) {
        const loadTex = (relpath, colorData) =>
          new Promise((resolve, reject) => {
            const url = new URL(relpath, import.meta.url).href;
            texLoader.load(
              url,
              (t) => {
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.colorSpace = colorData
                  ? THREE.SRGBColorSpace
                  : THREE.LinearSRGBColorSpace;
                t.minFilter = THREE.LinearMipmapLinearFilter;
                t.magFilter = THREE.LinearFilter;
                t.generateMipmaps = true;
                t.anisotropy = 4;
                resolve(t);
              },
              undefined,
              reject,
            );
          });
        const grass = {
          color: await loadTex(
            "./textures/Grass005_1K-JPG_Color.jpg",
            true,
          ),
          normal: await loadTex(
            "./textures/Grass005_1K-JPG_NormalGL.jpg",
            false,
          ),
          roughness: await loadTex(
            "./textures/Grass005_1K-JPG_Roughness.jpg",
            false,
          ),
          ao: await loadTex(
            "./textures/Grass005_1K-JPG_AmbientOcclusion.jpg",
            false,
          ),
        };
        const rock = {
          color: await loadTex(
            "./textures/Rock028/Rock028_2K-JPG_Color.jpg",
            true,
          ),
          normal: await loadTex(
            "./textures/Rock028/Rock028_2K-JPG_NormalGL.jpg",
            false,
          ),
          roughness: await loadTex(
            "./textures/Rock028/Rock028_2K-JPG_Roughness.jpg",
            false,
          ),
          ao: await loadTex(
            "./textures/Rock028/Rock028_2K-JPG_AmbientOcclusion.jpg",
            false,
          ),
          displacement: await loadTex(
            "./textures/Rock028/Rock028_2K-JPG_Displacement.jpg",
            false,
          ),
        };
        const snow = {
          color: await loadTex(
            "./textures/Snow010A/Snow010A_1K-JPG_Color.jpg",
            true,
          ),
          normal: await loadTex(
            "./textures/Snow010A/Snow010A_1K-JPG_NormalGL.jpg",
            false,
          ),
          roughness: await loadTex(
            "./textures/Snow010A/Snow010A_1K-JPG_Roughness.jpg",
            false,
          ),
          ao: await loadTex(
            "./textures/Snow010A/Snow010A_1K-JPG_AmbientOcclusion.jpg",
            false,
          ),
          displacement: await loadTex(
            "./textures/Snow010A/Snow010A_1K-JPG_Displacement.jpg",
            false,
          ),
        };
        return { grass, rock, snow };
      }

      function buildSuperjetTerrainMaterial(maps) {
        const uGrassScale = uniform(0.016);
        const uRockScale = uniform(0.003);
        const uSnowScale = uniform(0.018);
        const uDispStrength = uniform(16);
        const uAlbedoMul = uniform(0.94);

        const terrainLayerWeights = Fn(() => {
          const yW = positionWorld.y;
          const ny = abs(normalWorld.y);
          const slope = sub(float(1), ny);
          const xz = positionWorld.xz;
          const jitter = fract(
            mul(sin(dot(xz, vec2(127.1, 311.7))), 43758.5453),
          );
          const wSnow = smoothstep(float(78), float(178), yW);
          const wRock = add(
            mul(
              smoothstep(float(0.09), float(0.58), slope),
              sub(float(1), mul(wSnow, float(0.91))),
            ),
            mul(smoothstep(float(22), float(128), yW), float(0.28)),
          );
          const wRock2 = mul(wRock, sub(float(1), mul(wSnow, float(0.74))));
          const wGrass = mul(
            sub(float(1), add(min(wSnow, float(0.99)), wRock2)),
            add(float(0.84), mul(jitter, float(0.16))),
          );
          const wSum = add(add(wGrass, wRock2), wSnow);
          return vec3(wGrass, wRock2, wSnow).div(max(wSum, float(0.001)));
        });

        const grassRgb = makeTerrainTriSampleRGB(maps.grass.color, uGrassScale);
        const rockRgb = makeTerrainTriSampleRGB(maps.rock.color, uRockScale);
        const snowRgb = makeTerrainTriSampleRGB(maps.snow.color, uSnowScale);
        const grassR = makeTerrainTriSampleR(maps.grass.roughness, uGrassScale);
        const rockR = makeTerrainTriSampleR(maps.rock.roughness, uRockScale);
        const snowR = makeTerrainTriSampleR(maps.snow.roughness, uSnowScale);
        const grassAo = makeTerrainTriSampleR(maps.grass.ao, uGrassScale);
        const rockAo = makeTerrainTriSampleR(maps.rock.ao, uRockScale);
        const snowAo = makeTerrainTriSampleR(maps.snow.ao, uSnowScale);

        const colorNode = Fn(() => {
          const lw = terrainLayerWeights();
          const c = add(
            add(mul(grassRgb(), lw.x), mul(rockRgb(), lw.y)),
            mul(snowRgb(), lw.z),
          );
          return mul(c, uAlbedoMul);
        });

        const roughnessNode = Fn(() => {
          const lw = terrainLayerWeights();
          return clamp(
            add(
              add(mul(grassR(), lw.x), mul(rockR(), lw.y)),
              mul(snowR(), lw.z),
            ),
            float(0.04),
            float(1),
          );
        });

        const aoNode = Fn(() => {
          const lw = terrainLayerWeights();
          return clamp(
            add(
              add(mul(grassAo(), lw.x), mul(rockAo(), lw.y)),
              mul(snowAo(), lw.z),
            ),
            float(0.25),
            float(1),
          );
        });

        const normalNode = Fn(() => {
          const lw = terrainLayerWeights();
          const nG = normalMap(
            texture(
              maps.grass.normal,
              mul(positionWorld.xz, uGrassScale),
            ),
            vec2(1.05, 1.05),
          );
          const nR = normalMap(
            texture(maps.rock.normal, mul(positionWorld.xz, uRockScale)),
            vec2(1, 1),
          );
          const nS = normalMap(
            texture(maps.snow.normal, mul(positionWorld.xz, uSnowScale)),
            vec2(1, 1),
          );
          return normalize(
            add(add(mul(nG, lw.x), mul(nR, lw.y)), mul(nS, lw.z)),
          );
        });

        const positionNode = Fn(() => {
          const vuv = uv();
          const tu = mul(vuv, float(42));
          const dR = texture(maps.rock.displacement, tu).x;
          const dS = texture(maps.snow.displacement, tu).x;
          const h = positionGeometry.y;
          const wS = smoothstep(float(88), float(175), h);
          const wR = mul(
            smoothstep(float(6), float(130), h),
            sub(float(1), mul(wS, float(0.94))),
          );
          const sumW = add(wR, wS);
          const blended = add(mul(dR, wR), mul(dS, wS));
          const lift = sub(blended, mul(float(0.5), sumW));
          const amt = mul(lift, uDispStrength);
          return positionGeometry.add(normalGeometry.normalize().mul(amt));
        });

        const mat = new THREE.MeshStandardNodeMaterial({
          side: THREE.FrontSide,
        });
        mat.colorNode = colorNode();
        mat.roughnessNode = roughnessNode();
        mat.metalnessNode = float(0.02);
        mat.normalNode = normalNode();
        mat.aoNode = aoNode();
        mat.envMapIntensity = 0.12;
        mat.positionNode = positionNode();
        mat.color = new THREE.Color(0xffffff);
        return mat;
      }

      /** Matte brown “no textures” terrain — minimal spec / env so it doesn’t look shiny. */
      function buildBrownTerrainMaterial() {
        const mat = new THREE.MeshStandardNodeMaterial({
          side: THREE.FrontSide,
        });
        mat.colorNode = color(0x4a3728);
        mat.roughnessNode = float(0.985);
        mat.metalnessNode = float(0);
        mat.envMapIntensity = 0.018;
        mat.color = new THREE.Color(0x4a3728);
        return mat;
      }

      function buildForestInstancedMesh() {
        const treeGeo = new THREE.ConeGeometry(2.3, 8.4, 5, 1, false);
        treeGeo.translate(0, 4.2, 0);
        const treeMat = new THREE.MeshStandardMaterial({
          color: 0x153828,
          roughness: 0.9,
          metalness: 0.02,
          flatShading: true,
        });
        const slots = [];
        const half = TERRAIN_WORLD_HALF - 24;
        let gx = -half;
        outer: while (gx <= half) {
          let gz = -half;
          while (gz <= half) {
            const hj = hashCell2D((gx / 3) | 0, (gz / 3) | 0);
            const jx = ((hj & 0xfff) / 4096 - 0.5) * FOREST_GRID_STEP * 0.55;
            const jz =
              (((hj >>> 12) & 0xfff) / 4096 - 0.5) * FOREST_GRID_STEP * 0.55;
            const x = gx + jx;
            const z = gz + jz;
            const w = worleyFieldDecor(x, z);
            const onPath =
              1.0 -
              THREE.MathUtils.smoothstep(
                Math.max(0, w.edge),
                PATH_EDGE_START,
                PATH_EDGE_END,
              );
            if (onPath > FOREST_PATH_SKIP) {
              gz += FOREST_GRID_STEP;
              continue;
            }
            if (terrainSlopeMetricSq(x, z) > FOREST_MAX_SLOPE_SQ) {
              gz += FOREST_GRID_STEP;
              continue;
            }
            const h = w.cellHash;
            const forestCell = h % 7 === 0 || h % 11 === 3;
            const dens = forestCell ? 0.48 : (h >>> 5) % 4 === 0 ? 0.07 : 0.018;
            const roll =
              (hashCell2D((x * 31.7) | 0, (z * 29.3) | 0) >>> 0) / 4294967296;
            if (roll > dens) {
              gz += FOREST_GRID_STEP;
              continue;
            }
            const y = terrainHeight(x, z);
            if (y > FOREST_MAX_ELEVATION) {
              gz += FOREST_GRID_STEP;
              continue;
            }
            slots.push({ x, z, y, h });
            if (slots.length >= FOREST_MAX_INSTANCES) break outer;
            gz += FOREST_GRID_STEP;
          }
          gx += FOREST_GRID_STEP;
        }
        if (slots.length === 0) return null;
        const mesh = new THREE.InstancedMesh(treeGeo, treeMat, slots.length);
        const dummy = new THREE.Object3D();
        for (let i = 0; i < slots.length; i++) {
          const s = slots[i];
          const sc = 0.65 + (((s.h >>> (i % 11)) & 255) / 255) * 0.85;
          const yaw = (((s.h >>> 8) & 0xffff) / 65536) * Math.PI * 2;
          const sBase =
            0.72 + ((hashCell2D(i * 131 + 7, i * 17 + 3) & 255) / 255) * 0.22;
          dummy.position.set(s.x, s.y, s.z);
          dummy.rotation.set(0, yaw, 0);
          dummy.scale.setScalar(sc * sBase);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true;
        mesh.receiveShadow = false;
        mesh.layers.set(SOLID_LAYER);
        return mesh;
      }

      /* Repo-style permutation-table noise (mask textures) */
      function createNoiseGeneratorFromPermutation(permTable) {
        const fade = (t) => t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
        const lerp = (t, a, b) => a + t * (b - a);
        const grad = (hash, x, y, z) => {
          const h = hash & 15;
          const u = h < 8 ? x : y;
          const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
          return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        };
        return function noise(p) {
          const P = new THREE.Vector3(
            Math.floor(p.x),
            Math.floor(p.y),
            Math.floor(p.z),
          );
          const p_fract = p.clone().sub(P);
          const f = new THREE.Vector3(
            fade(p_fract.x),
            fade(p_fract.y),
            fade(p_fract.z),
          );
          const xi = P.x & 255,
            yi = P.y & 255,
            zi = P.z & 255;
          const A = permTable[xi],
            B = permTable[(xi + 1) & 255];
          const AA = permTable[(A + yi) & 255],
            BA = permTable[(B + yi) & 255];
          const AB = permTable[(A + yi + 1) & 255],
            BB = permTable[(B + yi + 1) & 255];
          const AAA = permTable[(AA + zi) & 255],
            BAA = permTable[(BA + zi) & 255];
          const ABA = permTable[(AB + zi) & 255],
            BBA = permTable[(BB + zi) & 255];
          const AAB = permTable[(AA + zi + 1) & 255],
            BAB = permTable[(BA + zi + 1) & 255];
          const ABB = permTable[(AB + zi + 1) & 255],
            BBB = permTable[(BB + zi + 1) & 255];
          const g1 = grad(AAA, p_fract.x, p_fract.y, p_fract.z),
            g2 = grad(BAA, p_fract.x - 1, p_fract.y, p_fract.z);
          const g3 = grad(ABA, p_fract.x, p_fract.y - 1, p_fract.z),
            g4 = grad(BBA, p_fract.x - 1, p_fract.y - 1, p_fract.z);
          const g5 = grad(AAB, p_fract.x, p_fract.y, p_fract.z - 1),
            g6 = grad(BAB, p_fract.x - 1, p_fract.y, p_fract.z - 1);
          const g7 = grad(ABB, p_fract.x, p_fract.y - 1, p_fract.z - 1),
            g8 = grad(BBB, p_fract.x - 1, p_fract.y - 1, p_fract.z - 1);
          return lerp(
            f.z,
            lerp(f.y, lerp(f.x, g1, g2), lerp(f.x, g3, g4)),
            lerp(f.y, lerp(f.x, g5, g6), lerp(f.x, g7, g8)),
          );
        };
      }

      function buildMaskTexture3D(maskSize, freq, seed) {
        const rnd = createSeededRandom(seed);
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(rnd() * (i + 1));
          [p[i], p[j]] = [p[j], p[i]];
        }
        const permTable = new Uint8Array(512);
        for (let i = 0; i < 256; i++) permTable[i] = permTable[i + 256] = p[i];
        const noiseGen = createNoiseGeneratorFromPermutation(permTable);
        const noiseMaskData = new Uint8Array(maskSize * maskSize * maskSize);
        const directionVector = new THREE.Vector3();
        for (let z = 0; z < maskSize; z++) {
          for (let y = 0; y < maskSize; y++) {
            for (let x = 0; x < maskSize; x++) {
              directionVector.set(
                (x / (maskSize - 1)) * 2.0 - 1.0,
                (y / (maskSize - 1)) * 2.0 - 1.0,
                (z / (maskSize - 1)) * 2.0 - 1.0,
              );
              if (directionVector.lengthSq() > 0) {
                directionVector.normalize();
                const noiseValue = noiseGen(
                  directionVector.multiplyScalar(freq),
                );
                noiseMaskData[z * maskSize * maskSize + y * maskSize + x] =
                  noiseValue * 128 + 128;
              }
            }
          }
        }
        const t = new THREE.Data3DTexture(
          noiseMaskData,
          maskSize,
          maskSize,
          maskSize,
        );
        t.format = THREE.RedFormat;
        t.minFilter = THREE.LinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.unpackAlignment = 1;
        t.needsUpdate = true;
        return t;
      }

      const renderer = new THREE.WebGPURenderer({
        antialias: false,
        outputBufferType: THREE.UnsignedByteType,
      });
      renderer.autoClear = false;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0561a0);

      const textureLoader = new THREE.TextureLoader();
      const pmremGenerator = new THREE.PMREMGenerator(renderer);

      async function loadHdri() {
        const tryLoad = (url) =>
          new Promise((resolve, reject) => {
            new HDRLoader().load(url, resolve, undefined, reject);
          });
        try {
          return await tryLoad(HDRI_LOCAL);
        } catch {
          return await tryLoad(HDRI_FALLBACK);
        }
      }

      const hdrTexture = await loadHdri().catch(() => null);
      if (hdrTexture) {
        hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = pmremGenerator.fromEquirectangular(hdrTexture);
        scene.environment = pmrem.texture;
        hdrTexture.dispose();
        pmremGenerator.dispose();
      }

      const progressContainer = document.getElementById("progress-container");
      const progressFill = document.getElementById("progress-fill");

      const stats = new Stats();
      stats.dom.style.position = "absolute";
      stats.dom.style.left = "10px";
      stats.dom.style.top = "10px";
      document.body.appendChild(stats.dom);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        2.0,
        12000,
      );
      camera.layers.enableAll();

      const playerPos = { x: 0, z: 0 };
      const spawnGroundY = getWorldHeight(playerPos.x, playerPos.z);
      const fly = {
        height: spawnGroundY,
        heading: 0,
        pitch: 0,
        roll: 0,
        rollTarget: 0,
        aileron: 0,
        groundCamYawOff: 0,
        planeSpeed: 0,
        camPitch: CAM_PITCH_FLIGHT,
      };
      const keysHeld = Object.create(null);
      /** `play` = chase + pointer-lock mouse flight (v2 follow). `orbit` = OrbitControls on aircraft. */
      const cameraView = { mode: "play" };
      let camModeCtrl = null;

      const flyHud = document.getElementById("fly-hud");
      const flyHudSpd = document.getElementById("fly-hud-spd");
      const flyHudAlt = document.getElementById("fly-hud-alt");
      const flyHudPitch = document.getElementById("fly-hud-pitch");
      const flyHudBank = document.getElementById("fly-hud-bank");

      function updateFlight(dt) {
        const keys = keysHeld;
        if (cameraView.mode === "orbit") {
          const groundY = getWorldHeight(playerPos.x, playerPos.z);
          let climbDelta = 0;
          if (keys.Space) climbDelta += ISO_FLY_CLIMB_RATE * dt;
          if (keys.ShiftLeft || keys.ShiftRight)
            climbDelta -= ISO_FLY_DESCEND_RATE * dt;
          fly.height = Math.max(groundY, fly.height + climbDelta);
          if (keys.KeyA || keys.ArrowLeft) fly.heading += ISO_FLY_YAW_RATE * dt;
          if (keys.KeyD || keys.ArrowRight)
            fly.heading -= ISO_FLY_YAW_RATE * dt;
        }
        const thr =
          keys.KeyW || keys.ArrowUp ? 1 : keys.KeyS || keys.ArrowDown ? -1 : 0;
        const drag = PLANE_DRAG * fly.planeSpeed * Math.abs(fly.planeSpeed);
        let coast = PLANE_COAST;
        const groundY = getWorldHeight(playerPos.x, playerPos.z);
        const deckAgl = fly.height - groundY;
        if (deckAgl < PLANE_DECK_ALT) coast *= PLANE_DECK_COAST_MULT;

        if (thr === 1) {
          let a = PLANE_ACCEL;
          if (keys.ShiftLeft || keys.ShiftRight) a *= PLANE_SHIFT_ACCEL_MULT;
          fly.planeSpeed += a * dt;
        } else if (thr === -1) {
          if (fly.planeSpeed > 0.55) fly.planeSpeed -= PLANE_BRAKE * dt;
          else fly.planeSpeed -= PLANE_REV_ACCEL * dt;
        } else {
          if (fly.planeSpeed > 0)
            fly.planeSpeed = Math.max(0, fly.planeSpeed - (coast + drag) * dt);
          else if (fly.planeSpeed < 0)
            fly.planeSpeed = Math.min(0, fly.planeSpeed + (coast + drag) * dt);
        }
        const maxFwd =
          keys.ShiftLeft || keys.ShiftRight
            ? PLANE_MAX_FWD_BOOST
            : PLANE_MAX_FWD;
        fly.planeSpeed = THREE.MathUtils.clamp(
          fly.planeSpeed,
          -PLANE_MAX_REV,
          maxFwd,
        );
        if (Math.abs(fly.planeSpeed) < 0.04 && thr === 0) fly.planeSpeed = 0;

        let mx = 0,
          mz = 0;
        const spdAbs = Math.abs(fly.planeSpeed);
        if (spdAbs > 1e-4) {
          const sg = Math.sign(fly.planeSpeed);
          mx = -Math.sin(fly.heading) * sg;
          mz = -Math.cos(fly.heading) * sg;
        }
        playerPos.x = THREE.MathUtils.clamp(
          playerPos.x + mx * spdAbs * dt,
          -TERRAIN_WORLD_HALF,
          TERRAIN_WORLD_HALF,
        );
        playerPos.z = THREE.MathUtils.clamp(
          playerPos.z + mz * spdAbs * dt,
          -TERRAIN_WORLD_HALF,
          TERRAIN_WORLD_HALF,
        );

        const agl = fly.height - groundY;
        const spd = Math.abs(fly.planeSpeed);
        const onDeck = agl < FLY_SURFACE_ALT && spd < FLY_SURFACE_SPEED;

        const diveMult = fly.pitch < 0 ? FLY_PITCH_DIVE_MULT : 1;
        fly.height = Math.max(
          groundY,
          fly.height + fly.pitch * FLY_PITCH_CLIMB_SCALE * diveMult * dt,
        );

        if (onDeck) {
          const deckRate = 1 - Math.exp(-4 * dt);
          fly.pitch = THREE.MathUtils.lerp(fly.pitch, 0, deckRate);
          fly.rollTarget = THREE.MathUtils.lerp(fly.rollTarget, 0, deckRate);
          fly.height = THREE.MathUtils.lerp(fly.height, groundY, deckRate);
        }

        const dtRoll = Math.min(dt, 0.08);
        fly.rollTarget = THREE.MathUtils.lerp(
          fly.rollTarget,
          0,
          1 - Math.exp(-FLY_ROLL_TARGET_DECAY * dtRoll),
        );
        fly.roll = THREE.MathUtils.lerp(
          fly.roll,
          fly.rollTarget,
          1 - Math.exp(-FLY_ROLL_SMOOTH * dtRoll),
        );

        if (!onDeck) {
          if (keys.KeyZ) fly.aileron += FLY_AILERON_RATE * dt;
          if (keys.KeyC) fly.aileron -= FLY_AILERON_RATE * dt;
        } else {
          const lvl = 1 - Math.exp(-3 * dt);
          fly.aileron *= 1 - lvl;
          if (Math.abs(fly.aileron) < 0.01) fly.aileron = 0;
        }
      }

      function updateFlightCamera(dt) {
        if (cameraView.mode !== "play") return;
        const lookAtY = fly.height + 0.45;
        const camOrbitYaw = fly.heading + fly.groundCamYawOff;
        const hDist = CAM_DIST_FLIGHT * Math.cos(fly.camPitch);
        const vDist = CAM_DIST_FLIGHT * Math.sin(fly.camPitch);
        const sinH = Math.sin(camOrbitYaw);
        const cosH = Math.cos(camOrbitYaw);
        const a = fly.aileron;
        const sinA = Math.sin(a);
        const cosA = Math.cos(a);
        camera.position.set(
          playerPos.x + sinH * hDist - cosH * sinA * vDist,
          lookAtY + cosA * vDist,
          playerPos.z + cosH * hDist + sinH * sinA * vDist,
        );
        camera.up.set(-cosH * sinA, cosA, sinH * sinA);
        camera.lookAt(playerPos.x, lookAtY, playerPos.z);

        const floorAtCam = getWorldHeight(camera.position.x, camera.position.z);
        const minCamY = floorAtCam + CAM_COLLISION_OFFSET + 1.0;
        if (camera.position.y < minCamY) {
          camera.position.y +=
            (minCamY - camera.position.y) * (1 - Math.exp(-8 * dt));
          camera.lookAt(playerPos.x, lookAtY, playerPos.z);
        }
      }

      function onKeyDown(e) {
        if (e.code === "KeyV" && !e.repeat) {
          e.preventDefault();
          cameraView.mode = cameraView.mode === "play" ? "orbit" : "play";
          if (camModeCtrl) camModeCtrl.updateDisplay();
          applyCameraMode();
          return;
        }
        if (e.code === "Space") e.preventDefault();
        keysHeld[e.code] = true;
      }
      function onKeyUp(e) {
        delete keysHeld[e.code];
      }
      function onMouseMove(e) {
        if (cameraView.mode !== "play") return;
        if (document.pointerLockElement !== renderer.domElement) return;
        const mx = e.movementX;
        const my = e.movementY;
        const groundY = getWorldHeight(playerPos.x, playerPos.z);
        const agl = fly.height - groundY;
        const spd = Math.abs(fly.planeSpeed);
        const onDeck = agl < FLY_SURFACE_ALT && spd < FLY_SURFACE_SPEED;
        if (onDeck) {
          fly.groundCamYawOff -= mx * FLY_MOUSE_SENS_X;
        } else {
          fly.groundCamYawOff = 0;
          fly.heading -= mx * FLY_MOUSE_SENS_X;
          fly.pitch = THREE.MathUtils.clamp(
            fly.pitch + my * FLY_MOUSE_SENS_Y,
            FLY_PITCH_MIN,
            FLY_PITCH_MAX,
          );
          fly.rollTarget = THREE.MathUtils.clamp(
            fly.rollTarget - mx * FLY_ROLL_VEL_SCALE,
            -FLY_ROLL_MAX,
            FLY_ROLL_MAX,
          );
        }
      }

      function tryRequestPointerLock(e) {
        if (cameraView.mode !== "play") return;
        if (e && e.button !== 0 && e.button !== undefined) return;
        if (document.pointerLockElement === renderer.domElement) return;
        renderer.domElement.requestPointerLock();
      }
      renderer.domElement.addEventListener(
        "pointerdown",
        tryRequestPointerLock,
        {
          passive: true,
        },
      );
      document.addEventListener("keydown", onKeyDown);
      document.addEventListener("keyup", onKeyUp);
      renderer.domElement.addEventListener("mousemove", onMouseMove);

      let orbitControls;
      function applyCameraMode() {
        if (!orbitControls) return;
        const play = cameraView.mode === "play";
        orbitControls.enabled = !play;
        if (play) {
          renderer.domElement.style.cursor =
            document.pointerLockElement === renderer.domElement ? "none" : "";
        } else {
          if (document.pointerLockElement === renderer.domElement) {
            document.exitPointerLock();
          }
          const lookAtY = fly.height + 0.45;
          orbitControls.target.set(playerPos.x, lookAtY, playerPos.z);
          orbitControls.update();
          renderer.domElement.style.cursor = "grab";
        }
      }

      orbitControls = new OrbitControls(camera, renderer.domElement);
      orbitControls.enableDamping = true;
      orbitControls.dampingFactor = 0.07;
      orbitControls.minDistance = 7;
      orbitControls.maxDistance = 2400;
      orbitControls.minPolarAngle = 0.08;
      orbitControls.maxPolarAngle = Math.PI * 0.485;
      orbitControls.enabled = false;

      document.addEventListener("pointerlockchange", () => {
        if (cameraView.mode !== "play") return;
        renderer.domElement.style.cursor =
          document.pointerLockElement === renderer.domElement ? "none" : "";
      });

      const timer = new THREE.Timer();
      timer.connect(document);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.05);
      scene.add(ambientLight);
      const sun = new THREE.DirectionalLight(0xffffff, 2.65);
      sun.position.set(0, 1, 0);
      sun.castShadow = true;
      const shadowHalf = TERRAIN_SIZE * 0.52;
      sun.shadow.camera.left = -shadowHalf;
      sun.shadow.camera.right = shadowHalf;
      sun.shadow.camera.top = shadowHalf;
      sun.shadow.camera.bottom = -shadowHalf;
      sun.shadow.camera.near = 10;
      sun.shadow.camera.far = TERRAIN_SIZE * 2.5;
      sun.shadow.mapSize.width = 2048;
      sun.shadow.mapSize.height = 2048;
      sun.shadow.bias = -0.00025;
      sun.shadow.normalBias = 0.035;
      sun.shadow.camera.updateProjectionMatrix();
      scene.add(sun);
      sun.target.position.set(0, 0, 0);
      scene.add(sun.target);

      const sunMaterial = new THREE.MeshBasicMaterial({
        color: 0xffe8cc,
        transparent: true,
        fog: false,
        toneMapped: false,
        depthWrite: false,
      });
      const sunSphere = new THREE.Mesh(
        new THREE.SphereGeometry(340, 32, 32),
        sunMaterial,
      );
      sunSphere.renderOrder = 15;
      sunSphere.layers.set(VOLUME_LAYER);
      scene.add(sunSphere);

      const terrainMats = {
        pbr: null,
        brown: buildBrownTerrainMaterial(),
      };
      let terrainGeo = buildTerrainMesh();
      try {
        const pbrMaps = await loadSuperjetTerrainPBR(textureLoader);
        terrainMats.pbr = buildSuperjetTerrainMaterial(pbrMaps);
      } catch (err) {
        console.warn(
          "[superjet] Terrain PBR textures failed to load — brown material only.",

        );
      }
      const ground = new THREE.Mesh(terrainGeo, terrainMats.brown);
      ground.receiveShadow = true;
      ground.castShadow = false;
      ground.layers.set(SOLID_LAYER);
      scene.add(ground);

      let forestMesh = buildForestInstancedMesh();
      if (forestMesh) scene.add(forestMesh);

      const sphereGeom = new THREE.SphereGeometry(12, 24, 16);
      const greenSphere = new THREE.Mesh(
        sphereGeom,
        new THREE.MeshStandardMaterial({
          color: 0x00cc66,

        }),
      );
      greenSphere.position.set(180, 0, -140);
      greenSphere.position.y = terrainHeight(180, -140) + 9;
      greenSphere.castShadow = true;
      greenSphere.layers.set(SOLID_LAYER);
      scene.add(greenSphere);

      const magentaSphere = new THREE.Mesh(
        sphereGeom,
        new THREE.MeshStandardMaterial({
          color: 0xff44aa,
          roughness: 0.35,
          metalness: 0.05,
        }),
      );
      magentaSphere.position.set(-220, 0, 200);
      magentaSphere.position.y = terrainHeight(-220, 200) + 9;
      magentaSphere.castShadow = true;
      magentaSphere.layers.set(SOLID_LAYER);
      scene.add(magentaSphere);

      const occluderMeshes = [ground, greenSphere, magentaSphere];
      if (forestMesh) occluderMeshes.push(forestMesh);
      let planeRoot = null;

      async function loadPlaneFromGlb() {
        const CAP_H = 1.2;

        const dracoLoader = new DRACOLoader();

      function replaceForestMesh() {

      let volumeTexture = new THREE.Data3DTexture(new Uint8Array(8), 2, 2, 2);

      function bake3DTexture() {
        progressContainer.style.display = "block";
        setTimeout(() => {
          const size = parameters.textureSize;
          const data = new Uint8Array(size * size * size);
          const seededRandom = createSeededRandom(parameters.seed);
          const perlin = new ImprovedNoise(seededRandom);
          let index = 0;
          for (let z = 0; z < size; z++) {
            for (let y = 0; y < size; y++) {
              for (let x = 0; x < size; x++) {
                const p = parameters;
                const nx_norm = x / (size - 1);
                const ny_norm = y / (size - 1);
                const nz_norm = z / (size - 1);
                const base_x = nx_norm * p.noiseScale + p.seed;
                const base_y = ny_norm * p.noiseScale + p.seed;
                const base_z = nz_norm * p.noiseScale + p.seed;
                const scale = p.noiseScale;
                const fbmArgs = [p.octaves, p.persistence, p.lacunarity];
                const n1 = fbm(perlin, base_x, base_y, base_z, ...fbmArgs);
                const n2 = fbm(
                  perlin,
                  base_x - scale,
                  base_y,
                  base_z,
                  ...fbmArgs,
                );
                const n3 = fbm(
                  perlin,
                  base_x,
                  base_y - scale,
                  base_z,
                  ...fbmArgs,
                );
                const n4 = fbm(
                  perlin,
                  base_x,
                  base_y,
                  base_z - scale,
                  ...fbmArgs,
                );
                const n5 = fbm(
                  perlin,
                  base_x - scale,
                  base_y - scale,
                  base_z,
                  ...fbmArgs,
                );
                const n6 = fbm(
                  perlin,
                  base_x - scale,
                  base_y,
                  base_z - scale,
                  ...fbmArgs,
                );
                const n7 = fbm(
                  perlin,
                  base_x,
                  base_y - scale,
                  base_z - scale,
                  ...fbmArgs,
                );
                const n8 = fbm(
                  perlin,
                  base_x - scale,
                  base_y - scale,
                  base_z - scale,
                  ...fbmArgs,
                );
                const w_x = 1 - nx_norm;
                const w_y = 1 - ny_norm;
                const w_z = 1 - nz_norm;
                let noiseValue =
                  n1 * w_x * w_y * w_z +
                  n2 * nx_norm * w_y * w_z +
                  n3 * w_x * ny_norm * w_z +
                  n4 * w_x * w_y * nz_norm +
                  n5 * nx_norm * ny_norm * w_z +
                  n6 * nx_norm * w_y * nz_norm +
                  n7 * w_x * ny_norm * nz_norm +
                  n8 * nx_norm * ny_norm * nz_norm;
                noiseValue = (noiseValue + 1.0) / 2.0;
                const finalValue = Math.pow(
                  noiseValue,
                  parameters.noiseIntensity,
                );
                const density = smoothstepJS(
                  p.cloudCoverage - p.cloudSoftness,
                  p.cloudCoverage + p.cloudSoftness,
                  finalValue,
                );
                data[index++] = Math.floor(density * 255);
              }
            }
            progressFill.style.width = ((z + 1) / size) * 100 + "%";
          }
          if (volumeTexture) volumeTexture.dispose();
          volumeTexture = new THREE.Data3DTexture(data, size, size, size);
          volumeTexture.format = THREE.RedFormat;
          volumeTexture.minFilter = THREE.LinearFilter;

          volumeTexture.needsUpdate = true;

          progressFill.style.width = "0%";

          state ^= state << 5;
          return (state >>> 0) % 256;
        };
        for (let i = 0; i < 128 * 128; i++) {

      function applySunOrientation() {
        const az = THREE.MathUtils.degToRad(parameters.sunAzimuthDeg);

      const u_mask_raio = uniform(parameters.raio);
      const u_mask_achatamentoCima = uniform(parameters.achatamentoCima);
      const u_mask_achatamentoBaixo = uniform(parameters.achatamentoBaixo);
      const u_mask_achatamentoXpos = uniform(parameters.achatamentoXpos);
      const u_mask_achatamentoXneg = uniform(parameters.achatamentoXneg);
      const u_mask_achatamentoZpos = uniform(parameters.achatamentoZpos);
      const u_mask_achatamentoZneg = uniform(parameters.achatamentoZneg);
      const u_mask_softness = uniform(parameters.maskSoftness);
      const u_mask_forcaRuido = uniform(parameters.forcaRuido);
      const u_mask_forcaRuidoDetalhe = uniform(parameters.forcaRuidoDetalhe);
      const u_mask_visualize = uniform(parameters.visualizeMask ? 1 : 0);

      function rebuildMaskTextures() {
        if (maskTexture) maskTexture.dispose();
        if (detailMaskTexture) detailMaskTexture.dispose();
        maskTexture = buildMaskTexture3D(
          128,
          parameters.frequenciaRuido,

        );
        detailMaskTexture = buildMaskTexture3D(

          parameters.frequenciaRuidoDetalhe,

        detailMaskTex.value = detailMaskTexture;
      }

      const hitBox = Fn(({ orig, dir }) => {
        const box_min = vec3(-0.5);
        const box_max = vec3(0.5);
        const inv_dir = vec3(1).div(dir);
        const tmin_tmp = box_min.sub(orig).mul(inv_dir);
        const tmax_tmp = box_max.sub(orig).mul(inv_dir);
        const tmin = min(tmin_tmp, tmax_tmp);
        const tmax = max(tmin_tmp, tmax_tmp);
        const t0 = max(tmin.x, max(tmin.y, tmin.z));
        const t1 = min(tmax.x, min(tmax.y, tmax.z));
        return vec2(t0, t1);
      });

      const EXTINCTION_MULT = vec3(0.6, 0.65, 0.7);
      const DUAL_LOBE_WEIGHT = float(0.8);
      const PHASE_G = float(0.3);

      const HenyeyGreenstein = Fn(([g, mu]) => {
        const gg = g.mul(g);
        const denom = float(1.0).add(gg).sub(g.mul(mu).mul(2.0));
        return float(1.0)
          .sub(gg)
          .div(pow(denom, float(1.5)))
          .mul(float(1.0 / (4.0 * PI_VAL)));
      });

      const PhaseFunction = Fn(([mu]) =>
        HenyeyGreenstein(PHASE_G.negate(), mu)
          .mul(float(1.0).sub(DUAL_LOBE_WEIGHT))
          .add(HenyeyGreenstein(PHASE_G, mu).mul(DUAL_LOBE_WEIGHT)),
      );

      const linearizeDepth = Fn(([d, zNear, zFar]) => {
        const lin = zNear.mul(zFar).div(zFar.add(d.mul(zNear.sub(zFar))));
        return d.greaterThanEqual(float(0.999999)).select(zFar, lin);
      });

      const vOriginVar = varying(
        vec3(modelWorldMatrixInverse.mul(vec4(cameraPosition, 1.0)).xyz),
      );
      const vDirectionVar = varying(positionGeometry.sub(vOriginVar));

      const getMaskFactor = Fn(([p]) => {
        const sy = u_mask_achatamentoCima
          .add(u_mask_achatamentoBaixo)
          .mul(0.5)
          .add(
            p.y
              .sign()
              .mul(u_mask_achatamentoCima.sub(u_mask_achatamentoBaixo))
              .mul(0.5),
          )
          .max(0.05);
        const sx = u_mask_achatamentoXpos
          .add(u_mask_achatamentoXneg)
          .mul(0.5)
          .add(
            p.x
              .sign()
              .mul(u_mask_achatamentoXpos.sub(u_mask_achatamentoXneg))
              .mul(0.5),
          )
          .max(0.05);
        const sz = u_mask_achatamentoZpos
          .add(u_mask_achatamentoZneg)
          .mul(0.5)
          .add(
            p.z
              .sign()
              .mul(u_mask_achatamentoZpos.sub(u_mask_achatamentoZneg))
              .mul(0.5),
          )
          .max(0.05);
        const pDistorted = vec3(p.x.div(sx), p.y.div(sy), p.z.div(sz));
        const dist = length(pDistorted);
        const dir = normalize(pDistorted.add(vec3(0.0001)));
        const tex_coord = dir
          .mul(u_mask_raio)
          .mul(0.5)
          .add(0.5)
          .clamp(0.0, 1.0);
        const noisePrincipal = maskTex.sample(tex_coord).r.mul(2.0).sub(1.0);
        const noiseDet = detailMaskTex.sample(tex_coord).r.mul(2.0).sub(1.0);
        const dispP = noisePrincipal.mul(u_mask_forcaRuido);
        const dispD = noiseDet.mul(u_mask_forcaRuidoDetalhe);
        const sdf = u_mask_raio.add(dispP).add(dispD).sub(dist);
        return smoothstep(float(0.0), u_mask_softness, sdf);
      });

      const getDensity = Fn(([p]) => {
        const maskFactor = getMaskFactor(p);
        const texCoord = p
          .add(0.5)
          .mul(uTextureTiling)
          .add(uTextureOffset)
          .fract();
        const noiseDensity = volumeTex.sample(texCoord).r;
        const visualize = u_mask_visualize.greaterThan(0.5);
        const finalDensity = visualize.select(float(1.0), noiseDensity);
        const passThresh = visualize.or(
          noiseDensity.greaterThanEqual(uDensityThreshold),
        );
        const contrib = finalDensity.mul(uDensityMultiplier).mul(maskFactor);
        const inner = passThresh.select(contrib, float(0));
        return maskFactor.greaterThan(0.0).select(inner, float(0));
      });

      const CalculateLightEnergy = Fn(([samplePos, lightDirWorld]) => {
        const stepLength = float(1.0).div(uLightSteps.max(1));
        const lightRayDensity = float(0.0).toVar();
        Loop(MAX_LIGHT_STEPS, ({ i: li }) => {
          If(uLightSteps.lessThanEqual(0), () => Break());
          If(float(li).greaterThanEqual(uLightSteps), () => Break());
          const t = float(li).add(0.5).mul(stepLength);
          const lp = samplePos.add(lightDirWorld.mul(t));
          const inB = lp.x
            .greaterThan(-0.5)
            .and(lp.x.lessThan(0.5))
            .and(lp.y.greaterThan(-0.5))
            .and(lp.y.lessThan(0.5))
            .and(lp.z.greaterThan(-0.5))
            .and(lp.z.lessThan(0.5));
          If(inB, () => {
            lightRayDensity.addAssign(getDensity(lp).mul(stepLength));
          });
        });
        return exp(lightRayDensity.negate());
      });

      const blueNoiseSample = texture(
        blueNoise2D,
        fract(screenUV.mul(uResolution).div(uBlueNoiseSize)),
      );

      const cloudColorNode = Fn(() => {
        const rayDir = normalize(vDirectionVar);
        const bounds = hitBox({ orig: vOriginVar, dir: rayDir }).toVar();
        If(bounds.x.greaterThanEqual(bounds.y), () => Discard());
        bounds.x.assign(max(bounds.x, 0.0));
        const rayLength = bounds.y.sub(bounds.x);
        If(rayLength.lessThan(0.001), () => Discard());

        const stepSize = rayLength.div(uMaxSteps.max(1));
        const jitter = blueNoiseSample.r;
        const sceneDepthSample = depthTexNode.r;
        const sceneLinearDistance = linearizeDepth(
          sceneDepthSample,
          uCameraNear,
          uCameraFar,
        );

        const mu = dot(rayDir, normalize(uLightDir)).toVar();
        const fade_zone = stepSize.mul(2.0);

        const accumulatedColor = vec3(0.0).toVar();
        const transmittance = vec3(1.0, 1.0, 1.0).toVar();
        const lightDirWorld = normalize(uLightDir);

        Loop(MAX_RM_STEPS, ({ i: ii }) => {
          If(float(ii).greaterThanEqual(uMaxSteps), () => Break());

          const dist_traveled = float(ii)
            .mul(stepSize)
            .add(jitter.mul(stepSize));
          const dist_remaining = rayLength.sub(dist_traveled);
          If(dist_remaining.lessThan(0.0), () => Break());

          const travel = bounds.x
            .add(jitter.mul(stepSize))
            .add(float(ii).mul(stepSize));
          const p = vOriginVar.add(rayDir.mul(travel));

          const viewSpacePos = modelViewMatrix.mul(vec4(p, 1.0));
          const rayPointDistance = abs(
            viewSpacePos.z.div(viewSpacePos.w.max(1e-6)),
          );
          If(rayPointDistance.greaterThan(sceneLinearDistance), () => Break());

          const density = getDensity(p).toVar();

          If(density.greaterThan(0.01), () => {
            const lightEnergy = CalculateLightEnergy(p, lightDirWorld);
            const sunLuminance = uSunColor.mul(uSunIntensity).mul(lightEnergy);
            const sunScattering = sunLuminance.mul(PhaseFunction(mu));
            const ambientLuminance = uAmbientColor.mul(uAmbientIntensity);
            const ambientScattering = ambientLuminance;
            const totalScattering = sunScattering
              .add(ambientScattering)
              .mul(density)
              .mul(stepSize);
            const fade_alpha = smoothstep(
              float(0.0),
              fade_zone,
              dist_remaining,
            );
            const scaledScatter = totalScattering.mul(fade_alpha);
            const stepTransmittance = exp(
              density.mul(stepSize).mul(uOpacity).mul(EXTINCTION_MULT).negate(),
            );
            accumulatedColor.addAssign(transmittance.mul(scaledScatter));
            transmittance.mulAssign(stepTransmittance);
            If(length(transmittance).lessThan(0.01), () => Break());
          });
        });

        If(uOcclusionMode.greaterThan(0.5), () => {
          accumulatedColor.assign(vec3(0.0));
        });

        const alpha = float(1.0).sub(transmittance.r);
        const rgbOut = accumulatedColor.toVar();
        If(
          uFogVolumeEnabled.greaterThan(0.5).and(uOcclusionMode.lessThan(0.5)),
          () => {
            const entryLocal = vOriginVar.add(rayDir.mul(bounds.x));
            const entryWorld = modelWorldMatrix.mul(vec4(entryLocal, 1.0)).xyz;
            const fogDist = length(entryWorld.sub(cameraPosition));
            const linearFog = smoothstep(uFogNear, uFogFar, fogDist);
            const expFog = float(1.0).sub(
              exp(
                uFogDensity.mul(uFogDensity).mul(fogDist).mul(fogDist).negate(),
              ),
            );
            const fogMix = uFogModeExp2
              .greaterThan(0.5)
              .select(expFog, linearFog);
            rgbOut.assign(mix(rgbOut, uFogColorVol, fogMix));
          },
        );
        return vec4(rgbOut, alpha);
      });

      const cloudMat = new THREE.MeshBasicNodeMaterial();
      cloudMat.fog = false;
      cloudMat.colorNode = cloudColorNode();
      cloudMat.transparent = true;
      cloudMat.side = THREE.BackSide;
      cloudMat.depthWrite = false;

      const godRaysDecay = uniform(0.975);
      const godRaysWeight = uniform(0.55);
      const godRaysExposure = uniform(parameters.godRaysExposureUI);

      const godRaysNodeFixed = Fn(() => {
        /* Same radial march as reference; lightPos must be WebGPU post UV (getScreenPosition). */
        const vUv = uv();
        const lightPos = vec2(godRaysLightUv.x, godRaysLightUv.y);
        const delta = lightPos.sub(vUv);
        const step = delta.div(godRaysSamples.max(1));
        const colorAcc = vec3(0).toVar();
        const illuminationDecay = float(1.0).toVar();
        Loop(MAX_GOD_SAMPLES, ({ i: gi }) => {
          If(float(gi).greaterThanEqual(godRaysSamples), () => Break());
          const sampleCoord = vUv.add(float(gi).mul(step));
          const sc = texture(occlusionTexForGodRays, sampleCoord);
          colorAcc.addAssign(sc.rgb.mul(illuminationDecay).mul(godRaysWeight));
          illuminationDecay.mulAssign(godRaysDecay);
        });
        return vec4(
          colorAcc
            .mul(godRaysSunColor)
            .mul(godRaysDensity)
            .mul(godRaysExposure),

        );
      });

        const delta = timer.getDelta();

        updateFlight(delta);
        if (cameraView.mode === "play") {
          updateFlightCamera(delta);
        } else {
          const lookAtY = fly.height + 0.45;
          orbitControls.target.set(playerPos.x, lookAtY, playerPos.z);
          orbitControls.update();
        }

        if (planeRoot) {
          planeRoot.position.set(playerPos.x, fly.height, playerPos.z);
          planeRoot.rotation.set(
            fly.pitch,
            fly.heading,
            fly.roll + fly.aileron,
          );
        }

        flyHudSpd.textContent = String(Math.round(Math.abs(fly.planeSpeed)));
        flyHudAlt.textContent = String(
          Math.round(fly.height - getWorldHeight(playerPos.x, playerPos.z)),
        );
        flyHudPitch.textContent = String(
          Math.round((fly.pitch * 180) / Math.PI),
        );
        flyHudBank.textContent = String(Math.round((fly.roll * 180) / Math.PI));

        const lodEl = document.getElementById("lod");
        if (parameters.followCamera) {
          const s = parameters.cloudFollowSmoothing;
          cloudMesh.position.x += (playerPos.x - cloudMesh.position.x) * s;
          cloudMesh.position.z += (playerPos.z - cloudMesh.position.z) * s;
        }
        cloudMesh.position.y = parameters.cloudHeightY;

        cloudMesh.updateMatrixWorld(true);
        _camViewProj.multiplyMatrices(
          camera.projectionMatrix,
          camera.matrixWorldInverse,
        );
        _frustum.setFromProjectionMatrix(
          _camViewProj,
          renderer.coordinateSystem,
          camera.reversedDepth,
        );
        const inFrustum = _frustum.intersectsObject(cloudMesh);

        if (!parameters.frustumCullVolume) {
          cloudMesh.visible = true;
        } else {
          cloudMesh.visible = inFrustum;
        }

        const dimGod =
          parameters.frustumCullVolume &&
          parameters.frustumDimGodRays &&
          !inFrustum;
        godRaysExposure.value = dimGod ? 0 : parameters.godRaysExposureUI;

        cloudMesh.getWorldPosition(_cloudCenter);
        const dist = camera.position.distanceTo(_cloudCenter);
        let lodBlend = 0;
        if (parameters.lodAuto) {
          lodBlend = THREE.MathUtils.smoothstep(
            LOD_DIST_NEAR,
            LOD_DIST_FAR,
            dist,
          );
        }
        const quality = 1 - lodBlend * 0.72;
        if (parameters.lodAuto) {
          uMaxSteps.value = Math.max(
            12,
            Math.round(parameters.raymarchSteps * quality),
          );
          godRaysSamples.value = Math.max(
            10,
            Math.round(parameters.godRaysSamplesUI * (0.52 + 0.48 * quality)),
          );
        } else {
          uMaxSteps.value = parameters.raymarchSteps;
          godRaysSamples.value = parameters.godRaysSamplesUI;
        }

        lodEl.textContent = [
          `dist ${dist.toFixed(0)}`,
          `LOD ${lodBlend.toFixed(2)}`,
          `steps ${uMaxSteps.value}`,
          `god ${godRaysSamples.value}`,
          inFrustum ? "vis" : "cul",
        ].join(" · ");

        applySunOrientation();
        uSunColor.value.copy(sun.color);
        uAmbientColor.value.copy(ambientLight.color);

        uFogVolumeEnabled.value = parameters.fogEnabled ? 1 : 0;
        uFogModeExp2.value = parameters.fogMode === "exp2" ? 1 : 0;
        uFogNear.value = parameters.fogNear;
        uFogFar.value = parameters.fogFar;
        uFogDensity.value = parameters.fogDensity;
        uFogColorVol.value.set(parameters.fogColor);

        if (parameters.isAnimating) {
          uTextureOffset.value.x += parameters.animationSpeedX * delta;
          uTextureOffset.value.y += parameters.animationSpeedY * delta;
          uTextureOffset.value.z += parameters.animationSpeedZ * delta;
          uTextureOffset.value.x -= Math.floor(uTextureOffset.value.x);
          uTextureOffset.value.y -= Math.floor(uTextureOffset.value.y);
          uTextureOffset.value.z -= Math.floor(uTextureOffset.value.z);
        }

        camera.layers.set(SOLID_LAYER);
        renderer.setRenderTarget(depthTarget);
        renderer.clear();
        renderer.render(scene, camera);

        depthTexNode.value = depthTarget.depthTexture;

        const bgSaved = scene.background;
        const fogSaved = scene.fog;
        scene.fog = null;
        scene.background = new THREE.Color(0x000000);
        sunSphere.material = occlusionMaterialWhite;
        uOcclusionMode.value = 1;
        for (const o of occluderMeshes) {
          if (o !== cloudMesh && o.material !== undefined) {
            originalMaterials.set(o.uuid, o.material);
            if (Array.isArray(o.material)) {
              const black = o.isLineSegments
                ? occlusionLineBlack
                : occlusionMaterialBlack;
              o.material = o.material.map(() => black);
            } else {
              o.material = o.isLineSegments
                ? occlusionLineBlack
                : occlusionMaterialBlack;
            }
          }
        }

        camera.layers.enable(SOLID_LAYER);
        camera.layers.enable(VOLUME_LAYER);
        renderer.setRenderTarget(occlusionRT);
        renderer.clear();
        renderer.render(scene, camera);

        sunSphere.material = sunMaterial;
        uOcclusionMode.value = 0;
        for (const o of occluderMeshes) {
          if (o !== cloudMesh && originalMaterials.has(o.uuid)) {
            o.material = originalMaterials.get(o.uuid);
          }
        }
        originalMaterials.clear();
        scene.background = bgSaved;
        scene.fog = fogSaved;
        camera.layers.enableAll();

        occlusionTexForGodRays.value = occlusionRT.texture;
        const sunNdc = new THREE.Vector3()
          .copy(sunSphere.position)
          .project(camera);
        godRaysLightUv.value.set(
          sunNdc.x * 0.5 + 0.5,
          1.0 - (sunNdc.y * 0.5 + 0.5),
        );

        postQuad.material = godRaysMat;
        renderer.setRenderTarget(godraysRT);
        renderer.clear();
        renderer.render(postScene, postCam);
        godraysResultTex.value = godraysRT.texture;

        camera.layers.enableAll();
        renderer.setRenderTarget(finalRT);
        renderer.clear();
        renderer.render(scene, camera);

        finalSceneTex.value = finalRT.texture;
        postQuad.material = compositeMat;
        renderer.autoClear = false;
        renderer.setRenderTarget(finalRT);
        renderer.render(postScene, postCam);
        renderer.autoClear = true;

        postQuad.material = screenMat;
        renderer.setRenderTarget(null);
        renderer.clear();
        renderer.render(postScene, postCam);
      });
    </script>
  </body>
</html>
