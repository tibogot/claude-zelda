<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside 2.5D Snow Prototype</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #dbe7f2;
        font-family: "SF Mono", "Fira Code", monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        color: #deebf9;
        background: rgba(8, 14, 22, 0.62);
        border: 1px solid rgba(180, 210, 245, 0.28);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.55;
        user-select: none;
      }
      #info b {
        color: #f3f9ff;
      }
      .tp-dfwv {
        max-height: 86vh;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .tp-dfwv::-webkit-scrollbar {
        width: 10px;
      }
      .tp-dfwv::-webkit-scrollbar-thumb {
        background: rgba(190, 210, 235, 0.55);
        border-radius: 8px;
      }
      .tp-dfwv::-webkit-scrollbar-track {
        background: rgba(20, 28, 38, 0.35);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">
      <b>Inside 2.5D Snow Prototype</b><br />
      Move: <b>A/D</b> or <b>Left/Right</b> · Jump: <b>Space</b><br />
      Depth-locked 2.5D lane + snowy biome lookdev
    </div>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        Fn,
        reflector,
        rangeFogFactor,
        texture,
        textureBicubic,
        time,
        uv,
        vec2,
        vec4,
      } from "three/tsl";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import { Pane } from "https://esm.sh/tweakpane@4.0.4";

      const LANE_Z = 0;
      const DEFAULT_GRAVITY = 30;
      const DEFAULT_MOVE_SPEED = 7.8;
      const DEFAULT_JUMP_SPEED = 11.5;

      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xd8e4f0, 0.012);

      // Procedural winter sky — same SkyMesh approach as parkourtsushima
      const sky = new SkyMesh();
      sky.scale.setScalar(10000);
      scene.add(sky);
      sky.turbidity.value      = 2.2;
      sky.rayleigh.value       = 1.8;
      sky.mieCoefficient.value = 0.004;
      sky.mieDirectionalG.value = 0.88;
      if (sky.cloudCoverage  !== undefined) sky.cloudCoverage.value  = 0.15;
      if (sky.cloudDensity   !== undefined) sky.cloudDensity.value   = 0.5;
      if (sky.cloudElevation !== undefined) sky.cloudElevation.value = 2000;
      sky.sunPosition.value.set(18, 22, 10).normalize();

      // Bake sky into env map for material reflections
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const skyEnvScene = new THREE.Scene();
      skyEnvScene.add(sky.clone());
      scene.environment = pmremGenerator.fromScene(skyEnvScene, 0.04).texture;
      scene.environmentIntensity = 0.6;

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
      camera.position.set(0, 4.0, 16);
      camera.lookAt(0, 1.8, LANE_Z);

      const hemi = new THREE.HemisphereLight(0xeef6ff, 0x7b8a95, 0.42);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff8f0, 1.8);
      sun.position.set(18, 22, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left   = -90;
      sun.shadow.camera.right  =  90;
      sun.shadow.camera.top    =  40;
      sun.shadow.camera.bottom = -15;
      sun.shadow.camera.near   = 1;
      sun.shadow.camera.far    = 180;
      sun.shadow.bias = -0.001;
      scene.add(sun);
      scene.add(sun.target);

      const skyFill = new THREE.DirectionalLight(0xc8deff, 0.18);
      skyFill.position.set(-12, 14, 6);
      scene.add(skyFill);

      const rim = new THREE.DirectionalLight(0xe8f4ff, 0.14);
      rim.position.set(-6, 8, 16);
      scene.add(rim);

      function groundHeight(x) {
        return (
          Math.sin(x * 0.17) * 0.45 +
          Math.sin(x * 0.55 + 1.2) * 0.15 +
          Math.cos(x * 0.09 - 0.7) * 0.35
        );
      }
      function surfaceY(x, z) {
        return groundHeight(x) + Math.sin(z * 2.2) * 0.03;
      }
      function terrainHeight(x, z) {
        const base = surfaceY(x, z);
        const depth = -z;
        const t = THREE.MathUtils.smoothstep(3, 22, depth);
        const extra =
          Math.sin(z * 0.082) * 1.05 +
          Math.cos(x * 0.062 + z * 0.052) * 0.62 +
          Math.sin(x * 0.11 + z * 0.068) * 0.42;
        return base + extra * t;
      }

      const floorLen = 220;
      const hillZMin = -56;
      const hillZMax = -2;
      const hillDepth = hillZMax - hillZMin;
      const hillZCenter = (hillZMin + hillZMax) * 0.5;

      const hillGeo = new THREE.PlaneGeometry(floorLen, hillDepth, 380, 96);
      hillGeo.rotateX(-Math.PI / 2);
      const hillPos = hillGeo.attributes.position.array;
      for (let i = 0; i < hillPos.length; i += 3) {
        hillPos[i + 1] = terrainHeight(hillPos[i], hillPos[i + 2]);
      }
      hillGeo.computeVertexNormals();

      const laneGeo = new THREE.PlaneGeometry(floorLen, 5.6, 380, 8);
      laneGeo.rotateX(-Math.PI / 2);
      const lanePos = laneGeo.attributes.position.array;
      for (let i = 0; i < lanePos.length; i += 3) {
        lanePos[i + 1] = surfaceY(lanePos[i], lanePos[i + 2]);
      }
      laneGeo.computeVertexNormals();

      const tx = new THREE.TextureLoader();
      const perlinMap = tx.load("./textures/noises/rgb-256x256.png");
      perlinMap.wrapS = THREE.RepeatWrapping;
      perlinMap.wrapT = THREE.RepeatWrapping;
      perlinMap.colorSpace = THREE.SRGBColorSpace;

      // Snow010A PBR textures
      const snow10Color  = tx.load("./textures/pbr_materials/Snow010A/Snow010A_1K-JPG_Color.jpg");
      const snow10Normal = tx.load("./textures/pbr_materials/Snow010A/Snow010A_1K-JPG_NormalGL.jpg");
      const snow10Rough  = tx.load("./textures/pbr_materials/Snow010A/Snow010A_1K-JPG_Roughness.jpg");
      const snow10AO     = tx.load("./textures/pbr_materials/Snow010A/Snow010A_1K-JPG_AmbientOcclusion.jpg");
      snow10Color.colorSpace = THREE.SRGBColorSpace;
      for (const t of [snow10Color, snow10Normal, snow10Rough, snow10AO]) {
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(16, 3.2);
      }

      const snowMat = new THREE.MeshStandardMaterial({
        map: snow10Color,
        normalMap: snow10Normal,
        normalScale: new THREE.Vector2(0.9, 0.9),
        roughnessMap: snow10Rough,
        aoMap: snow10AO,
        aoMapIntensity: 1.4,
        roughness: 0.88,
        metalness: 0,
        envMapIntensity: 0.22,
        fog: false,
      });

      const hillMat = snowMat.clone();
      hillMat.fog = true;
      for (const key of ["map", "roughnessMap", "normalMap"]) {
        const src = hillMat[key];
        if (!src) continue;
        const tc = src.clone();
        tc.wrapS = THREE.RepeatWrapping;
        tc.wrapT = THREE.RepeatWrapping;
        const rpt = { map: [22, 20], roughnessMap: [28, 24], normalMap: [20, 18] }[key];
        tc.repeat.set(rpt[0], rpt[1]);
        hillMat[key] = tc;
      }
      hillMat.normalScale = new THREE.Vector2(0.22, 0.22);
      hillMat.roughness = 0.92;
      hillMat.envMapIntensity = 0.22;

      const hillFloor = new THREE.Mesh(hillGeo, hillMat);
      hillFloor.position.z = hillZCenter;
      hillFloor.receiveShadow = true;
      scene.add(hillFloor);

      // Vertical mountain silhouettes — correct approach for 2.5D: shapes in XY plane
      // positioned at depth Z, no flat horizontal slab artifacts.
      function addMountainLayer({ z, width, baseY, amp, jagged, seed, fog = true }) {
        const half = width * 0.5;
        const noise1D = (x) => {
          const a = Math.sin(x * 0.026 + seed * 1.7) * 0.9;
          const b = Math.sin(x * 0.061 - seed * 2.3) * 0.5;
          const c = Math.sin(x * 0.14  + seed * 0.8) * 0.25;
          const d = Math.sin(x * 0.23  + seed * 1.1) * 0.14;
          const e = Math.cos(x * 0.38  - seed * 0.6) * 0.08;
          return a + b + c + d + e;
        };
        const points = [];
        points.push(new THREE.Vector2(-half, -28));
        for (let i = 0; i <= 320; i++) {
          const x      = -half + (i / 320) * width;
          const n      = noise1D(x);
          const ridge  = Math.max(0, n);
          const spikes = Math.max(0, Math.sin(x * 0.16 + seed * 1.3)) *
                         Math.max(0, Math.sin(x * 0.044 + seed * 0.7)) * jagged;
          points.push(new THREE.Vector2(x, baseY + ridge * amp + spikes * amp * 0.82));
        }
        points.push(new THREE.Vector2(half, -28));
        const shape = new THREE.Shape(points);
        const geo   = new THREE.ShapeGeometry(shape, 1);

        // Height-based snow: dark rock at base → white snow at peaks
        const pa     = geo.attributes.position;
        const vcArr  = new Float32Array(pa.count * 3);
        const rockC  = new THREE.Color(0x58606e);
        const snowC  = new THREE.Color(0xedf4fc);
        const tmp    = new THREE.Color();
        const midH   = baseY + amp * 0.18;
        const topH   = baseY + amp * 0.52;
        for (let i = 0; i < pa.count; i++) {
          const t = THREE.MathUtils.smoothstep(pa.getY(i), midH, topH);
          tmp.lerpColors(rockC, snowC, t);
          vcArr[i * 3] = tmp.r; vcArr[i * 3 + 1] = tmp.g; vcArr[i * 3 + 2] = tmp.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(vcArr, 3));

        const mat = new THREE.MeshStandardMaterial({
          vertexColors: true, roughness: 0.95, metalness: 0,
          fog, envMapIntensity: 0.2,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.z = z;
        scene.add(mesh);
      }

      // z=-68: 3D displaced ridge (closest mountain layer, needs real depth)
      function add3DRidge({ z, zDepth, amp, seed, fogVal = true }) {
        const geo = new THREE.PlaneGeometry(floorLen * 1.35, zDepth, 300, 48);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
          const x  = pos[i];
          const zl = pos[i + 2];
          const n  =   Math.max(0, Math.sin(x * 0.028 + seed * 1.7) * 0.9
                               + Math.sin(x * 0.065 - seed * 2.3) * 0.5
                               + Math.sin(x * 0.14  + seed * 0.8) * 0.25
                               + Math.sin(x * 0.24  + seed * 1.1) * 0.14) * amp;
          const nz = (Math.sin(zl * 0.12 + seed * 0.9) * 0.5 + 0.5) * amp * 0.35;
          pos[i + 1] = 0.5 + n + nz;
        }
        geo.computeVertexNormals();
        const pa    = geo.attributes.position;
        const vcArr = new Float32Array(pa.count * 3);
        const rockC = new THREE.Color(0x48545f);
        const snowC = new THREE.Color(0xecf4fb);
        const tmp   = new THREE.Color();
        for (let i = 0; i < pa.count; i++) {
          const t = THREE.MathUtils.smoothstep(pa.getY(i), amp * 0.15, amp * 0.6);
          tmp.lerpColors(rockC, snowC, t);
          vcArr[i * 3] = tmp.r; vcArr[i * 3 + 1] = tmp.g; vcArr[i * 3 + 2] = tmp.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(vcArr, 3));
        const mat  = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.93, metalness: 0, fog: fogVal, envMapIntensity: 0.15 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.z = z;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }
      add3DRidge({ z: -68,  zDepth: 32, amp: 13, seed: 1.0 });
      add3DRidge({ z: -100, zDepth: 42, amp: 20, seed: 2.8 });

      // Far layers stay as flat silhouettes — enough fog they read as atmospheric depth
      addMountainLayer({ z: -148, width: floorLen * 1.5, baseY: -3, amp: 28,  jagged: 1.15, seed: 5.3 });

      // Backdrop fill behind mountain strips to prevent sky leaking between layers.
      const farBackdrop = new THREE.Mesh(
        new THREE.PlaneGeometry(floorLen * 2.2, 120, 1, 1),
        new THREE.MeshBasicMaterial({
          color: 0xb2c2d0,
          transparent: true,
          opacity: 0.42,
          depthWrite: false,
          fog: true,
        }),
      );
      farBackdrop.position.set(0, 11, -238);
      farBackdrop.renderOrder = -20;
      scene.add(farBackdrop);

      // Sharp high mountain silhouettes in very far background (camera never reaches them).
      function peakNoise1D(x, seed = 0) {
        const a = Math.sin(x * 0.026 + seed * 1.7) * 0.9;
        const b = Math.sin(x * 0.061 - seed * 2.3) * 0.5;
        const c = Math.sin(x * 0.14 + seed * 0.8) * 0.25;
        return a + b + c;
      }

      function addSharpMountainSilhouette({
        z = -220,
        width = floorLen * 2.1,
        baseY = 6,
        amp = 26,
        jagged = 1.0,
        seed = 0,
        color = 0xb4c6db,
      }) {
        const half = width * 0.5;
        const points = [];
        points.push(new THREE.Vector2(-half, -42));
        for (let i = 0; i <= 240; i++) {
          const x = -half + (i / 240) * width;
          const n = peakNoise1D(x, seed);
          const ridge = Math.max(0, n);
          const spikes =
            Math.max(0, Math.sin(x * 0.18 + seed * 1.3)) *
            Math.max(0, Math.sin(x * 0.047 + seed * 0.7)) *
            jagged;
          const y = baseY + ridge * amp + spikes * amp * 0.85;
          points.push(new THREE.Vector2(x, y));
        }
        points.push(new THREE.Vector2(half, -42));
        const shape = new THREE.Shape(points);
        const geo = new THREE.ShapeGeometry(shape, 10);
        const mat = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.88,
          depthWrite: false,
          fog: true,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.z = z;
        scene.add(mesh);
      }

      addSharpMountainSilhouette({
        z: -214,
        baseY: 8,
        amp: 28,
        jagged: 0.8,
        seed: 2.2,
        color: 0xaec0cf,
      });
      addSharpMountainSilhouette({
        z: -246,
        baseY: 12,
        amp: 36,
        jagged: 1.25,
        seed: 6.1,
        color: 0x9eb2c2,
      });

      // Roughness reflection lake (WebGPU TSL reflector approach).
      const lakeReflection = reflector({
        resolutionScale: 0.75,
        bounces: false,
        generateMipmaps: true,
      });
      lakeReflection.target.rotateX(-Math.PI / 2);
      const lakeWidth = 102;
      const lakeDepth = 20;
      const lakeX = 0;
      const lakeZ = -7.0;
      const lakeY = terrainHeight(lakeX, lakeZ) - 0.32;
      lakeReflection.target.position.set(lakeX, lakeY, lakeZ);
      scene.add(lakeReflection.target);

      const lakeAnimUV = uv().mul(10).add(vec2(time.mul(0.08), 0));
      const lakeRoughNoise = texture(perlinMap, lakeAnimUV).r.mul(2).saturate();

      const lakeMat = new THREE.MeshStandardNodeMaterial({
        transparent: true,
        metalness: 1,
      });
      lakeMat.roughnessNode = lakeRoughNoise.mul(0.045);
      lakeMat.colorNode = Fn(() => {
        const dirtyReflection = textureBicubic(lakeReflection, lakeRoughNoise.mul(0.9));
        const fade = rangeFogFactor(5, 72).oneMinus();
        const icyTint = vec4(0.78, 0.90, 0.97, 1.0);
        const boosted = dirtyReflection.rgb.mul(1.65).saturate();
        return vec4(boosted.mix(icyTint.rgb, 0.05), fade.mul(0.97));
      })();

      const lake = new THREE.Mesh(new THREE.PlaneGeometry(lakeWidth, lakeDepth), lakeMat);
      lake.rotation.x = -Math.PI / 2;
      lake.position.set(lakeX, lakeY, lakeZ);
      scene.add(lake);

      const laneFloor = new THREE.Mesh(laneGeo, snowMat);
      laneFloor.position.z = LANE_Z;
      laneFloor.receiveShadow = true;
      scene.add(laneFloor);

      // Foreground snow extension — covers z=0..22, fills the gap between
      // laneFloor (ends at z≈2.8) and the camera at z=21 so the bottom of
      // screen shows continuous snow terrain instead of a dark void.
      const fgGeo = new THREE.PlaneGeometry(floorLen, 24, 220, 12);
      fgGeo.rotateX(-Math.PI / 2);
      const fgPos = fgGeo.attributes.position.array;
      for (let i = 0; i < fgPos.length; i += 3) {
        fgPos[i + 1] = surfaceY(fgPos[i], fgPos[i + 2]);
      }
      fgGeo.computeVertexNormals();
      const fgFloor = new THREE.Mesh(fgGeo, snowMat);
      fgFloor.position.z = 12; // centered at z=12 → spans z=0 to z=24
      fgFloor.receiveShadow = true;
      scene.add(fgFloor);

      const underSoil = new THREE.Mesh(
        new THREE.BoxGeometry(floorLen, 6, 40),
        new THREE.MeshStandardMaterial({
          color: 0x1e2830,
          roughness: 1,
          metalness: 0,
          fog: true,
          envMapIntensity: 0,
        }),
      );
      underSoil.position.set(0, -3.2, 7);
      scene.add(underSoil);

      const obstacleMat = new THREE.MeshStandardMaterial({
        color: 0xcc2020,
        roughness: 0.78,
        metalness: 0.08,
        fog: false,
        envMapIntensity: 0.18,
      });
      const obstacleColliders = [];
      const obstacleEntries = [];
      // Varied 2.5D Inside-style obstacles: wide hurdles, tall walls, platforms, steps
      const obstacleConfigs = [
        { x: -62, w: 5.0,  h: 0.38, d: 1.3 },   // wide low ground hurdle — run under / hop over
        { x: -48, w: 0.5,  h: 2.6,  d: 1.3 },   // tall blocking wall
        { x: -36, w: 2.8,  h: 0.62, d: 1.3 },   // medium step platform to land on
        { x: -22, w: 0.55, h: 2.2,  d: 1.3 },   // mid-height wall
        { x: -10, w: 4.2,  h: 0.40, d: 1.3 },   // wide low slide / crawl barrier
        { x:   0, w: 1.5,  h: 1.1,  d: 1.3 },   // raised box — jump onto it
        { x:  12, w: 0.5,  h: 2.8,  d: 1.3 },   // tall wall again
        { x:  24, w: 3.0,  h: 0.55, d: 1.3 },   // wide hop-over hurdle
        { x:  36, w: 0.55, h: 1.9,  d: 1.3 },   // medium wall
        { x:  46, w: 2.2,  h: 1.3,  d: 1.3 },   // tall step platform
        { x:  58, w: 4.8,  h: 0.35, d: 1.3 },   // final wide low hurdle
      ];
      for (const cfg of obstacleConfigs) {
        const { x, w, h, d } = cfg;
        const gy = groundHeight(x);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), obstacleMat);
        mesh.position.set(x, gy + h * 0.5, LANE_Z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        const collider = {
          minX: x - w * 0.5,
          maxX: x + w * 0.5,
          minY: gy,
          maxY: gy + h,
          minZ: LANE_Z - d * 0.5,
          maxZ: LANE_Z + d * 0.5,
        };
        obstacleColliders.push(collider);
        obstacleEntries.push({ mesh, gy, baseH: h, collider });
      }
      function setObstacleHeightScale(scale) {
        for (const e of obstacleEntries) {
          const h = e.baseH * scale;
          e.mesh.scale.y = scale;
          e.mesh.position.y = e.gy + h * 0.5;
          e.collider.maxY = e.gy + h;
        }
      }

      // Foreground rocks — scattered boulders near camera, ground the scene
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x3a4048, roughness: 0.94, metalness: 0.04, fog: false, envMapIntensity: 0.08 });
      const fgRockDefs = [
        { x: -52, z: 5.5, sx: 1.8, sy: 1.1, sz: 1.5 },
        { x:  44, z: 6.2, sx: 2.1, sy: 1.3, sz: 1.7 },
        { x: -80, z: 7.8, sx: 1.4, sy: 0.9, sz: 1.2 },
        { x:  68, z: 5.0, sx: 1.6, sy: 1.0, sz: 1.4 },
        { x:  15, z: 9.5, sx: 2.4, sy: 1.5, sz: 2.0 },
        { x: -30, z: 8.0, sx: 1.0, sy: 0.7, sz: 0.9 },
      ];
      const rockGeo = new THREE.IcosahedronGeometry(1, 1);
      for (const r of fgRockDefs) {
        const m = new THREE.Mesh(rockGeo, rockMat);
        m.scale.set(r.sx, r.sy, r.sz);
        const gy = surfaceY(r.x, r.z);
        m.position.set(r.x, gy + r.sy * 0.45, r.z);
        m.rotation.y = Math.random() * Math.PI;
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
      }

      const gate = new THREE.Group();
      const gateMat = new THREE.MeshStandardMaterial({
        color: 0x202a34,
        roughness: 0.92,
        fog: true,
        envMapIntensity: 0.2,
      });
      const postGeo = new THREE.BoxGeometry(0.58, 3.4, 0.52);
      const beamGeo = new THREE.BoxGeometry(5.2, 0.46, 0.72);
      const topGeo = new THREE.BoxGeometry(6.7, 0.36, 0.95);
      const postL = new THREE.Mesh(postGeo, gateMat);
      const postR = new THREE.Mesh(postGeo, gateMat);
      const beam = new THREE.Mesh(beamGeo, gateMat);
      const top = new THREE.Mesh(topGeo, gateMat);
      postL.position.set(-1.95, 1.7, 0);
      postR.position.set(1.95, 1.7, 0);
      beam.position.set(0, 3.15, 0);
      top.position.set(0, 3.58, -0.1);
      gate.add(postL, postR, beam, top);
      gate.position.set(24, terrainHeight(24, -5.8), -5.8);
      scene.add(gate);

      const treeGroup = new THREE.Group();
      scene.add(treeGroup);

      const gltfLoader = new GLTFLoader();
      const tempBox = new THREE.Box3();
      function loadGltf(url) {
        return new Promise((resolve, reject) => gltfLoader.load(url, resolve, undefined, reject));
      }
      function fitObjectHeight(object3d, targetHeight) {
        tempBox.setFromObject(object3d);
        const size = tempBox.getSize(new THREE.Vector3());
        const currentHeight = Math.max(size.y, 1e-4);
        object3d.scale.multiplyScalar(targetHeight / currentHeight);
      }
      function materialForInstancedFoliage(src) {
        const m = src.clone();
        const needsCutout = src.transparent || src.opacity < 0.999 || !!src.alphaMap;
        m.transparent = false;
        m.opacity = 1;
        m.depthWrite = true;
        m.depthTest = true;
        m.alphaTest = needsCutout ? 0.42 : 0;
        m.side = needsCutout ? THREE.DoubleSide : THREE.FrontSide;
        m.polygonOffset = true;
        m.polygonOffsetFactor = 1;
        m.polygonOffsetUnits = 1;
        m.envMapIntensity = 0.35;
        m.fog = true;
        // Snow biome tint for pine meshes (desaturate/brighten leaves, darken trunks).
        if (m.color) {
          const c = m.color;
          if (c.g > c.r * 1.03 && c.g > c.b * 1.03) {
            // dark conifer green — like snow-dusted spruce in the reference photo
            m.color.setRGB(0.13, 0.26, 0.17);
          } else {
            // dark bark
            m.color.setRGB(0.16, 0.18, 0.20);
          }
        }
        return m;
      }

      const dummyTree = new THREE.Object3D();
      function addInstancedPinesFromGltf(gltfScene, instanceCount, zNear, zFar) {
        const root = gltfScene.clone(true);
        fitObjectHeight(root, 7.6);
        root.updateMatrixWorld(true);
        const parts = [];
        root.traverse((child) => {
          if (!child.isMesh) return;
          const geom = child.geometry.clone();
          geom.applyMatrix4(child.matrixWorld);
          geom.computeVertexNormals();
          const raw = Array.isArray(child.material) ? child.material[0] : child.material;
          parts.push({ geometry: geom, material: materialForInstancedFoliage(raw) });
        });
        if (parts.length === 0) return;

        const combined = new THREE.Box3();
        for (const p of parts) {
          const bb = new THREE.Box3().setFromBufferAttribute(p.geometry.attributes.position);
          combined.union(bb);
        }
        const groundYOffset = -combined.min.y;

        const matrices = [];
        const nearZ = Math.max(zNear, zFar);
        const farZ = Math.min(zNear, zFar);
        for (let i = 0; i < instanceCount; i++) {
          const x = -104 + Math.random() * 208;
          // Bias slightly to middle distance for nicer layering.
          const t = Math.pow(Math.random(), 0.75);
          const z = THREE.MathUtils.lerp(nearZ, farZ, t) + (Math.random() - 0.5) * 0.9;
          const s = 0.95 + Math.random() * 1.05;
          dummyTree.position.set(x, terrainHeight(x, z) + groundYOffset, z);
          dummyTree.rotation.set((Math.random() - 0.5) * 0.05, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.06);
          dummyTree.scale.setScalar(s);
          dummyTree.updateMatrix();
          matrices.push(dummyTree.matrix.clone());
        }

        for (const p of parts) {
          const inst = new THREE.InstancedMesh(p.geometry, p.material, instanceCount);
          for (let i = 0; i < instanceCount; i++) inst.setMatrixAt(i, matrices[i]);
          inst.instanceMatrix.needsUpdate = true;
          inst.castShadow = true;
          inst.receiveShadow = true;
          treeGroup.add(inst);
        }
      }

      let pineSourceScene = null;
      function clearTreeGroup() {
        for (let i = treeGroup.children.length - 1; i >= 0; i--) {
          const child = treeGroup.children[i];
          if (child.geometry) child.geometry.dispose();
          if (Array.isArray(child.material)) child.material.forEach((m) => m.dispose());
          else if (child.material) child.material.dispose();
          treeGroup.remove(child);
        }
      }

      function rebuildTrees(look) {
        clearTreeGroup();
        if (!pineSourceScene || !look.treesEnabled) return;
        const count = Math.max(0, Math.floor(look.treeCount));
        if (count === 0) return;
        addInstancedPinesFromGltf(pineSourceScene, count, look.treeNearZ, look.treeFarZ);
        // Sparse foreground trees — frame bottom of screen, don't crowd center lane
        addInstancedPinesFromGltf(pineSourceScene, 10, 8, 4);
      }

      try {
        const pineGltf = await loadGltf("./models/pine2.glb");
        pineSourceScene = pineGltf.scene;
      } catch (e) {
        console.warn("Pine GLB load failed:", e);
      }

      // Snowfall particles — larger, more visible flakes
      const snowCount = 2400;
      const snowPos = new Float32Array(snowCount * 3);
      const snowSeed = new Float32Array(snowCount);
      for (let i = 0; i < snowCount; i++) {
        snowPos[i * 3 + 0] = -120 + Math.random() * 240;
        snowPos[i * 3 + 1] = 1 + Math.random() * 30;
        snowPos[i * 3 + 2] = -55 + Math.random() * 70;
        snowSeed[i] = Math.random() * 1000;
      }
      const snowGeo = new THREE.BufferGeometry();
      snowGeo.setAttribute("position", new THREE.BufferAttribute(snowPos, 3));
      const snow = new THREE.Points(
        snowGeo,
        new THREE.PointsMaterial({
          color: 0xf8fdff,
          size: 0.32,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.88,
          depthWrite: false,
          fog: true,
        }),
      );
      scene.add(snow);

      const capsuleGroup = new THREE.Group();
      scene.add(capsuleGroup);
      const capsuleMat = new THREE.MeshStandardMaterial({
        color: 0x2277cc,
        roughness: 0.55,
        metalness: 0.04,
        fog: false,
        envMapIntensity: 0.28,
      });
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.95, 8, 14), capsuleMat);
      body.position.y = 1.1;
      body.castShadow = true;
      capsuleGroup.add(body);

      const look = {
        exposure: renderer.toneMappingExposure,
        envIntensity: scene.environmentIntensity ?? 0.55,
        fogEnabled: true,
        fogColor: "#d8e4f0",
        fogDensity: scene.fog.density,
        hemiIntensity: hemi.intensity,
        sunIntensity: sun.intensity,
        skyFillIntensity: skyFill.intensity,
        rimIntensity: rim.intensity,
        treeScale: 1.0,
        treesEnabled: true,
        treeCount: 260,
        treeNearZ: -6.5,
        treeFarZ: -36.0,
        snowfall: 0.82,
        moveSpeed: DEFAULT_MOVE_SPEED,
        jumpSpeed: DEFAULT_JUMP_SPEED,
        gravity: DEFAULT_GRAVITY,
        groundAccel: 22,
        airAccel: 10,
        camFollow: 4.8,
        camHeight: 4.0,
        camOffsetX: 2.6,
        obstacleHeightScale: 1.0,
      };

      const pane = new Pane({ title: "Snow Lookdev + Gameplay" });
      const fRender = pane.addFolder({ title: "Render" });
      fRender.addBinding(look, "exposure", { min: 0.3, max: 1.8, step: 0.01 }).on("change", (ev) => {
        renderer.toneMappingExposure = ev.value;
      });
      fRender.addBinding(look, "envIntensity", { min: 0, max: 2, step: 0.01 }).on("change", (ev) => {
        scene.environmentIntensity = ev.value;
      });

      const fFog = pane.addFolder({ title: "Fog" });
      fFog.addBinding(look, "fogEnabled").on("change", (ev) => {
        scene.fog = ev.value ? new THREE.FogExp2(new THREE.Color(look.fogColor), look.fogDensity) : null;
      });
      fFog.addBinding(look, "fogColor", { view: "color" }).on("change", (ev) => {
        if (scene.fog) scene.fog.color.set(ev.value);
      });
      fFog.addBinding(look, "fogDensity", { min: 0.001, max: 0.06, step: 0.001 }).on("change", (ev) => {
        if (scene.fog) scene.fog.density = ev.value;
      });
      fFog.addBinding(look, "snowfall", { min: 0, max: 1, step: 0.01 }).on("change", (ev) => {
        snow.material.opacity = ev.value;
      });

      const fLights = pane.addFolder({ title: "Lights" });
      fLights.addBinding(look, "hemiIntensity", { min: 0, max: 2, step: 0.01 }).on("change", (ev) => (hemi.intensity = ev.value));
      fLights.addBinding(look, "sunIntensity", { min: 0, max: 3, step: 0.01 }).on("change", (ev) => (sun.intensity = ev.value));
      fLights.addBinding(look, "skyFillIntensity", { min: 0, max: 2, step: 0.01 }).on("change", (ev) => (skyFill.intensity = ev.value));
      fLights.addBinding(look, "rimIntensity", { min: 0, max: 2, step: 0.01 }).on("change", (ev) => (rim.intensity = ev.value));

      const fScene = pane.addFolder({ title: "Scene" });
      fScene.addBinding(look, "treeScale", { min: 0.6, max: 2.4, step: 0.01 }).on("change", (ev) => {
        treeGroup.scale.setScalar(ev.value);
      });
      fScene.addBinding(look, "treesEnabled").on("change", () => rebuildTrees(look));
      fScene.addBinding(look, "treeCount", { min: 0, max: 1200, step: 1 }).on("change", () => rebuildTrees(look));
      fScene
        .addBinding(look, "treeNearZ", { min: -20, max: -1, step: 0.1, label: "treesNear" })
        .on("change", () => rebuildTrees(look));
      fScene
        .addBinding(look, "treeFarZ", { min: -140, max: -6, step: 0.1, label: "treesFar" })
        .on("change", () => rebuildTrees(look));
      fScene.addBinding(look, "obstacleHeightScale", { min: 0.5, max: 2.5, step: 0.01 }).on("change", (ev) => {
        setObstacleHeightScale(ev.value);
      });

      // Build initial forest once controls exist.
      rebuildTrees(look);

      const fGameplay = pane.addFolder({ title: "Gameplay Debug" });
      fGameplay.addBinding(look, "moveSpeed", { min: 2, max: 14, step: 0.1 });
      fGameplay.addBinding(look, "jumpSpeed", { min: 4, max: 20, step: 0.1 });
      fGameplay.addBinding(look, "gravity", { min: 8, max: 60, step: 0.5 });
      fGameplay.addBinding(look, "groundAccel", { min: 2, max: 40, step: 0.5 });
      fGameplay.addBinding(look, "airAccel", { min: 1, max: 25, step: 0.5 });
      fGameplay.addBinding(look, "camFollow", { min: 1, max: 12, step: 0.1 });
      fGameplay.addBinding(look, "camHeight", { min: 4, max: 13, step: 0.1 });
      fGameplay.addBinding(look, "camOffsetX", { min: 0, max: 8, step: 0.1 });

      const CAPSULE_RADIUS = 0.36;
      const FEET_Y_OFFSET = 0.755;
      const player = { x: -8, y: groundHeight(-8) + 1.03, vx: 0, vy: 0, grounded: true };
      const keys = { left: false, right: false, jump: false };

      function feetWorldY() {
        return player.y - FEET_Y_OFFSET;
      }
      function headWorldY() {
        return player.y + 0.915;
      }
      function playerAabb() {
        return {
          minX: player.x - CAPSULE_RADIUS,
          maxX: player.x + CAPSULE_RADIUS,
          minY: feetWorldY(),
          maxY: headWorldY(),
          minZ: LANE_Z - CAPSULE_RADIUS,
          maxZ: LANE_Z + CAPSULE_RADIUS,
        };
      }
      function overlap2D(a, b) {
        return a.minX < b.maxX && a.maxX > b.minX && a.minZ < b.maxZ && a.maxZ > b.minZ;
      }
      function overlap3D(a, b) {
        return a.minX < b.maxX && a.maxX > b.minX && a.minY < b.maxY && a.maxY > b.minY && a.minZ < b.maxZ && a.maxZ > b.minZ;
      }
      function feetOverSupport() {
        const fy = feetWorldY();
        const g = groundHeight(player.x);
        if (Math.abs(fy - (g + 0.275)) < 0.18) return true;
        for (const box of obstacleColliders) {
          const onTop = Math.abs(fy - box.maxY) < 0.14;
          const overX = player.x >= box.minX - CAPSULE_RADIUS * 0.9 && player.x <= box.maxX + CAPSULE_RADIUS * 0.9;
          if (onTop && overX) return true;
        }
        return false;
      }

      function onKey(event, down) {
        const k = event.key.toLowerCase();
        if (k === "a" || event.key === "ArrowLeft") keys.left = down;
        if (k === "d" || event.key === "ArrowRight") keys.right = down;
        if (k === " " || event.code === "Space") keys.jump = down;
      }
      window.addEventListener("keydown", (e) => onKey(e, true));
      window.addEventListener("keyup", (e) => onKey(e, false));

      const timer = new THREE.Timer();
      renderer.setAnimationLoop(() => {
        timer.update();
        const dt = Math.min(timer.getDelta(), 1 / 30);
        const elapsed = timer.getElapsed();

        const axis = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        const targetVx = axis * look.moveSpeed;
        const accel = player.grounded ? look.groundAccel : look.airAccel;
        player.vx += (targetVx - player.vx) * Math.min(accel * dt, 1);

        if (keys.jump && player.grounded) {
          player.vy = look.jumpSpeed;
          player.grounded = false;
        }
        player.vy -= look.gravity * dt;

        const prevX = player.x;
        const prevFeetY = feetWorldY();
        player.x += player.vx * dt;
        player.y += player.vy * dt;
        player.x = THREE.MathUtils.clamp(player.x, -102, 102);

        let onObstacleTop = false;
        for (const box of obstacleColliders) {
          const p = playerAabb();
          if (!overlap2D(p, box)) continue;
          if (feetWorldY() > box.maxY + 0.1) continue;

          const landing = player.vy <= 0 && prevFeetY >= box.maxY - 0.12 && feetWorldY() <= box.maxY + 0.15;
          if (landing) {
            player.y = box.maxY + FEET_Y_OFFSET;
            player.vy = 0;
            player.grounded = true;
            onObstacleTop = true;
            break;
          }

          if (overlap3D(p, box)) {
            const penLeft = p.maxX - box.minX;
            const penRight = box.maxX - p.minX;
            player.x = penLeft < penRight ? box.minX - CAPSULE_RADIUS - 0.02 : box.maxX + CAPSULE_RADIUS + 0.02;
            if (prevX !== player.x) player.vx = 0;
          }
        }

        const floorY = groundHeight(player.x) + 1.03;
        if (!onObstacleTop && player.y <= floorY) {
          player.y = floorY;
          player.vy = 0;
          player.grounded = true;
        }
        if (player.grounded && player.y > floorY + 0.02 && !feetOverSupport()) player.grounded = false;

        capsuleGroup.position.set(player.x, player.y - 1.02, LANE_Z);
        capsuleGroup.rotation.y = axis !== 0 ? (axis > 0 ? -0.16 : 0.16) : 0;
        body.rotation.z = Math.sin(elapsed * 10 + player.x * 0.2) * Math.abs(player.vx) * 0.01;

        const camTargetX = player.x + look.camOffsetX;
        camera.position.x += (camTargetX - camera.position.x) * Math.min(look.camFollow * dt, 1);
        camera.position.y += (look.camHeight - camera.position.y) * Math.min(2.6 * dt, 1);
        camera.lookAt(player.x + 2.2, 1.8, LANE_Z);

        // Shadow camera follows player X — keeps tight frustum for sharp shadows
        sun.position.set(player.x + 18, 22, 10);
        sun.target.position.set(player.x, 0, 0);
        sun.target.updateMatrixWorld();

        const arr = snow.geometry.attributes.position.array;
        for (let i = 0; i < snowCount; i++) {
          const idx = i * 3;
          arr[idx + 0] += Math.sin(elapsed * 0.42 + snowSeed[i]) * 0.005 + dt * 0.4;
          arr[idx + 1] -= (0.065 + Math.sin(elapsed * 0.5 + snowSeed[i] * 1.3) * 0.012) * (60 * dt);
          if (arr[idx + 1] < -0.5) {
            arr[idx + 1] = 22 + Math.random() * 12;
            arr[idx + 0] = player.x - 120 + Math.random() * 240;
            arr[idx + 2] = -55 + Math.random() * 70;
          }
        }
        snow.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
