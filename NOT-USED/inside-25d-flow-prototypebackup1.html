<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside 2.5D Flow Prototype (TSL + WebGPU)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #070c14;
        font-family: "SF Mono", "Fira Code", monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        color: #c8d7f6;
        background: rgba(4, 8, 14, 0.6);
        border: 1px solid rgba(175, 195, 255, 0.22);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.55;
        user-select: none;
      }
      #info b {
        color: #eef5ff;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">
      <b>Inside 2.5D Flow Prototype</b><br />
      Move: <b>A/D</b> or <b>Left/Right</b> · Jump: <b>Space</b><br />
      Camera and movement are depth-locked (2.5D lane)
    </div>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        Fn,
        uv,
        vec2,
        float,
        floor,
        fract,
        sin,
        dot,
        mix,
        smoothstep,
        time,
        uniform,
      } from "three/tsl";

      const LANE_Z = 0;
      const GRAVITY = 30;
      const MOVE_SPEED = 7.8;
      const JUMP_SPEED = 11.5;

      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070d16);
      scene.fog = new THREE.Fog(0x0a121e, 22, 130);

      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        300,
      );
      camera.position.set(0, 7.2, 21);
      camera.lookAt(0, 3.2, LANE_Z);

      const hemi = new THREE.HemisphereLight(0x89a6da, 0x13181d, 0.52);
      scene.add(hemi);

      const moon = new THREE.DirectionalLight(0xa9c5ff, 1.1);
      moon.position.set(-14, 15, 8);
      scene.add(moon);

      const warmCore = new THREE.PointLight(0xffb887, 1.4, 28, 2);
      warmCore.position.set(16, 4.7, -5.5);
      scene.add(warmCore);

      function groundHeight(x) {
        return (
          Math.sin(x * 0.17) * 0.45 +
          Math.sin(x * 0.55 + 1.2) * 0.15 +
          Math.cos(x * 0.09 - 0.7) * 0.35
        );
      }

      // Gameplay floor (the lane the capsule walks on)
      const floorLen = 220;
      const floorGeo = new THREE.PlaneGeometry(floorLen, 5.6, 380, 8);
      floorGeo.rotateX(-Math.PI / 2);
      const floorPos = floorGeo.attributes.position.array;
      for (let i = 0; i < floorPos.length; i += 3) {
        const x = floorPos[i];
        const z = floorPos[i + 2];
        floorPos[i + 1] = groundHeight(x) + Math.sin(z * 2.2) * 0.03;
      }
      floorGeo.computeVertexNormals();
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x111820,
        roughness: 0.98,
        metalness: 0.02,
      });
      const laneFloor = new THREE.Mesh(floorGeo, floorMat);
      laneFloor.position.z = LANE_Z;
      scene.add(laneFloor);

      // Foreground dark strip for silhouette framing
      const frontStrip = new THREE.Mesh(
        new THREE.BoxGeometry(floorLen, 1.2, 1.8),
        new THREE.MeshStandardMaterial({ color: 0x0a0f14, roughness: 1 }),
      );
      frontStrip.position.set(0, -0.7, 2.05);
      scene.add(frontStrip);

      function addTreeBand(zCenter, count, minScale, maxScale, color) {
        const group = new THREE.Group();
        const trunkGeo = new THREE.CylinderGeometry(0.08, 0.15, 5.5, 7);
        const branchGeo = new THREE.CylinderGeometry(0.025, 0.05, 2.7, 6);
        const mat = new THREE.MeshStandardMaterial({
          color,
          roughness: 1.0,
          metalness: 0.0,
        });
        for (let i = 0; i < count; i++) {
          const x = -104 + Math.random() * 208;
          const scale = minScale + Math.random() * (maxScale - minScale);
          const y = groundHeight(x) - 0.35;
          const trunk = new THREE.Mesh(trunkGeo, mat);
          trunk.scale.setScalar(scale);
          trunk.position.set(
            x,
            y + 2.8 * scale,
            zCenter + (Math.random() - 0.5) * 1.2,
          );
          trunk.rotation.z = (Math.random() - 0.5) * 0.14;
          group.add(trunk);
          const bCount = (1 + Math.random() * 3) | 0;
          for (let b = 0; b < bCount; b++) {
            const branch = new THREE.Mesh(branchGeo, mat);
            const side = Math.random() < 0.5 ? -1 : 1;
            branch.scale.setScalar(scale);
            branch.position.set(
              x + side * (0.3 + Math.random() * 0.5) * scale,
              y + (3.4 + Math.random() * 2.2) * scale,
              zCenter + (Math.random() - 0.5) * 1.5,
            );
            branch.rotation.z = side * (0.75 + Math.random() * 0.7);
            branch.rotation.y = Math.random() * Math.PI * 2;
            group.add(branch);
          }
        }
        scene.add(group);
        return group;
      }

      addTreeBand(-6.5, 130, 0.75, 1.35, 0x101720);
      addTreeBand(-13.5, 110, 0.92, 1.9, 0x0e141d);
      addTreeBand(-24, 120, 1.2, 2.4, 0x0b1119);

      // Architecture silhouette
      const gate = new THREE.Group();
      const gateMat = new THREE.MeshStandardMaterial({
        color: 0x1d242d,
        roughness: 0.9,
      });
      const postGeo = new THREE.BoxGeometry(0.58, 3.4, 0.52);
      const beamGeo = new THREE.BoxGeometry(5.2, 0.46, 0.72);
      const topGeo = new THREE.BoxGeometry(6.7, 0.36, 0.95);
      const postL = new THREE.Mesh(postGeo, gateMat);
      const postR = new THREE.Mesh(postGeo, gateMat);
      const beam = new THREE.Mesh(beamGeo, gateMat);
      const top = new THREE.Mesh(topGeo, gateMat);
      postL.position.set(-1.95, 1.7, 0);
      postR.position.set(1.95, 1.7, 0);
      beam.position.set(0, 3.15, 0);
      top.position.set(0, 3.58, -0.1);
      gate.add(postL, postR, beam, top);
      gate.position.set(22, groundHeight(22), -5.8);
      scene.add(gate);

      // TSL smoky stream inspired by the flow showcase
      const hash2 = Fn(([p]) => {
        return vec2(
          fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453)),
          fract(sin(dot(p, vec2(269.5, 183.3))).mul(43758.5453)),
        );
      });

      const gradientNoise = Fn(([p]) => {
        const i = floor(p).toVar();
        const f = fract(p).toVar();
        const u = f.mul(f).mul(f.mul(float(3).sub(f.mul(2))));
        const g00 = hash2(i).mul(2).sub(1);
        const g10 = hash2(i.add(vec2(1, 0)))
          .mul(2)
          .sub(1);
        const g01 = hash2(i.add(vec2(0, 1)))
          .mul(2)
          .sub(1);
        const g11 = hash2(i.add(vec2(1, 1)))
          .mul(2)
          .sub(1);
        const d00 = dot(g00, f);
        const d10 = dot(g10, f.sub(vec2(1, 0)));
        const d01 = dot(g01, f.sub(vec2(0, 1)));
        const d11 = dot(g11, f.sub(vec2(1, 1)));
        return mix(mix(d00, d10, u.x), mix(d01, d11, u.x), u.y)
          .mul(0.5)
          .add(0.5);
      });

      const fbm5 = Fn(([p]) => {
        const v = float(0).toVar();
        const amp = float(0.5).toVar();
        const freq = float(1).toVar();
        for (let i = 0; i < 5; i++) {
          v.addAssign(amp.mul(gradientNoise(p.mul(freq))));
          freq.mulAssign(2.02);
          amp.mulAssign(0.52);
        }
        return v;
      });

      const uSpeed = uniform(0.24);
      const uStretchX = uniform(9.2);
      const uStretchY = uniform(3.6);
      const uWarp = uniform(0.6);
      const uDensity = uniform(1.2);
      const uOpacity = uniform(0.92);
      const uGlow = uniform(1.3);
      const uColorCold = uniform(new THREE.Color(0xaed9ff));
      const uColorWarm = uniform(new THREE.Color(0xffcb96));

      const smokeMat = new THREE.MeshBasicNodeMaterial({
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide,
      });

      const st = uv().toVar();
      const t = time.mul(uSpeed);
      const p0 = vec2(
        st.x.mul(uStretchX).add(t.mul(1.24)),
        st.y.mul(uStretchY).sub(t.mul(0.18)),
      ).toVar();
      const warpN1 = fbm5(p0.mul(0.65).add(vec2(0.0, t.mul(0.37)))).toVar();
      const warpN2 = fbm5(p0.mul(0.9).sub(vec2(t.mul(0.41), 0.0))).toVar();
      const p = p0
        .add(vec2(warpN1.sub(0.5), warpN2.sub(0.5)).mul(uWarp))
        .toVar();
      const baseFbm = fbm5(p).toVar();
      const detail = fbm5(
        p.mul(2.72).add(vec2(t.mul(0.28), t.mul(-0.15))),
      ).toVar();
      const wisps = smoothstep(
        0.46,
        0.89,
        baseFbm.mul(0.78).add(detail.mul(0.7)),
      ).toVar();
      const centerBand = float(1)
        .sub(st.y.sub(0.53).abs().mul(2.35))
        .saturate()
        .pow(1.52)
        .toVar();
      const edgeFade = smoothstep(0.02, 0.16, st.x)
        .mul(smoothstep(0.02, 0.2, float(1).sub(st.x)))
        .toVar();
      const density = wisps.mul(centerBand).mul(edgeFade).mul(uDensity).toVar();
      const sparkle = smoothstep(0.77, 1.0, detail).mul(0.2).toVar();
      const finalColor = mix(
        uColorCold,
        uColorWarm,
        density.add(sparkle).saturate().pow(1.4),
      )
        .mul(density.mul(0.9).add(sparkle))
        .mul(uGlow);
      smokeMat.colorNode = finalColor;
      smokeMat.opacityNode = density.mul(uOpacity).saturate();

      const smokeMain = new THREE.Mesh(
        new THREE.PlaneGeometry(150, 11),
        smokeMat,
      );
      smokeMain.position.set(0, 5.2, -7.8);
      scene.add(smokeMain);

      const smokeHaloMat = smokeMat.clone();
      smokeHaloMat.colorNode = finalColor.mul(0.45);
      smokeHaloMat.opacityNode = density.mul(0.42);
      const smokeHalo = new THREE.Mesh(
        new THREE.PlaneGeometry(162, 18),
        smokeHaloMat,
      );
      smokeHalo.position.set(0, 5.35, -8.2);
      scene.add(smokeHalo);

      const mistMat = new THREE.MeshBasicMaterial({
        color: 0x95bddf,
        transparent: true,
        opacity: 0.055,
        depthWrite: false,
      });
      const mistSlabs = [];
      for (let i = 0; i < 7; i++) {
        const slab = new THREE.Mesh(new THREE.PlaneGeometry(190, 20), mistMat);
        slab.position.set(0, 2.1 + i * 0.64, -17 - i * 7.5);
        scene.add(slab);
        mistSlabs.push(slab);
      }

      // Capsule avatar (no full character yet)
      const capsuleGroup = new THREE.Group();
      scene.add(capsuleGroup);
      const capsuleMat = new THREE.MeshStandardMaterial({
        color: 0xd9e4f4,
        roughness: 0.56,
        metalness: 0.06,
      });
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.36, 0.95, 8, 14),
        capsuleMat,
      );
      body.castShadow = false;
      body.position.y = 1.1;
      capsuleGroup.add(body);

      const eyeGlow = new THREE.PointLight(0xd7ebff, 0.9, 2.4, 2);
      eyeGlow.position.set(0.17, 1.34, 0.23);
      capsuleGroup.add(eyeGlow);

      const player = {
        x: -8,
        y: groundHeight(-8) + 1.03,
        vz: 0,
        vx: 0,
        vy: 0,
        grounded: true,
      };

      const keys = {
        left: false,
        right: false,
        jump: false,
      };

      function onKey(event, down) {
        const k = event.key.toLowerCase();
        if (k === "a" || event.key === "ArrowLeft") keys.left = down;
        if (k === "d" || event.key === "ArrowRight") keys.right = down;
        if (k === " " || event.code === "Space") keys.jump = down;
      }
      window.addEventListener("keydown", (e) => onKey(e, true));
      window.addEventListener("keyup", (e) => onKey(e, false));

      const timer = new THREE.Timer();
      renderer.setAnimationLoop(() => {
        timer.update();
        const dt = Math.min(timer.getDelta(), 1 / 30);
        const elapsed = timer.getElapsed();

        // 2.5D lane movement: only X movement is allowed, Z is locked.
        const axis = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        const targetVx = axis * MOVE_SPEED;
        const accel = player.grounded ? 22 : 10;
        player.vx += (targetVx - player.vx) * Math.min(accel * dt, 1);

        if (keys.jump && player.grounded) {
          player.vy = JUMP_SPEED;
          player.grounded = false;
        }

        player.vy -= GRAVITY * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Keep scene finite for now.
        player.x = THREE.MathUtils.clamp(player.x, -102, 102);

        const floorY = groundHeight(player.x) + 1.03;
        if (player.y <= floorY) {
          player.y = floorY;
          player.vy = 0;
          player.grounded = true;
        }

        capsuleGroup.position.set(player.x, player.y - 1.02, LANE_Z);
        capsuleGroup.rotation.y = axis !== 0 ? (axis > 0 ? -0.16 : 0.16) : 0;
        body.rotation.z =
          Math.sin(elapsed * 10 + player.x * 0.2) * Math.abs(player.vx) * 0.01;

        // Camera follow with mild damping while keeping side framing.
        const camTargetX = player.x + 2.6;
        camera.position.x +=
          (camTargetX - camera.position.x) * Math.min(4.8 * dt, 1);
        camera.position.y += (7.2 - camera.position.y) * Math.min(2.6 * dt, 1);
        camera.lookAt(player.x + 2.2, 2.8, LANE_Z);

        // Subtle atmosphere drift for life.
        for (let i = 0; i < mistSlabs.length; i++) {
          const slab = mistSlabs[i];
          slab.position.x =
            Math.sin(elapsed * (0.09 + i * 0.012) + i * 1.1) * (1.8 + i * 0.7);
        }

        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
