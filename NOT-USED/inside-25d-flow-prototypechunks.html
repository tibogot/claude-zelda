<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inside 2.5D Flow — Chunk stream test</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a2e22;
        font-family: "SF Mono", "Fira Code", monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        color: #c8d7f6;
        background: rgba(4, 8, 14, 0.6);
        border: 1px solid rgba(175, 195, 255, 0.22);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.55;
        user-select: none;
      }
      #info b {
        color: #eef5ff;
      }
      #hallDbg {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 30;
        margin: 0;
        padding: 8px 10px;
        font: 11px/1.45 ui-monospace, monospace;
        color: #b8ffc8;
        background: rgba(0, 12, 8, 0.72);
        border: 1px solid rgba(100, 200, 140, 0.35);
        border-radius: 6px;
        max-width: min(420px, 92vw);
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">
      <b>Inside 2.5D Flow Prototype</b><br />
      Move: <b>A/D</b> or <b>Left/Right</b> · Jump: <b>Space</b><br />
      Depth-locked 2.5D lane · ambience: <b id="biomeLabel">—</b> · hall <b>28–88</b><br />
      <span style="opacity: 0.85">Use <b>inside-25d-flow-prototypechunks.html</b> · Wider hall + camera-side cutaway (2.5D) · Tweakpane → Hall debug</span>
    </div>
    <pre id="hallDbg"></pre>

    <script type="module">
      import * as THREE from "three/webgpu";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
      import { Pane } from "https://esm.sh/tweakpane@4.0.4";

      const LANE_Z = 0;
      const DEFAULT_GRAVITY = 30;
      const DEFAULT_MOVE_SPEED = 7.8;
      const DEFAULT_JUMP_SPEED = 11.5;

      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.92;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      // Linear fog (WebGPURenderer uses scene.fog on standard materials). Stronger in the distance so
      // hills read larger; lane / obstacles keep fog:false so gameplay stays clear.
      scene.fog = new THREE.Fog(0xa8c2b4, 28, 138);

      const hdrLoader = new HDRLoader();
      /** Kept so ambience presets can switch between HDR sky and solid colors. */
      let hdrBackgroundTexture = null;
      try {
        const hdrTexture = await hdrLoader.loadAsync(
          "./textures/animestyled_hdr.hdr",
        );
        hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
        hdrBackgroundTexture = hdrTexture;
        scene.background = hdrTexture;
        try {
          const pmremGenerator = new THREE.PMREMGenerator(renderer);
          scene.environment =
            pmremGenerator.fromEquirectangular(hdrTexture).texture;
          scene.environmentIntensity = 0.72;
          pmremGenerator.dispose();
        } catch (e2) {
          console.warn("PMREM bake failed (IBL may be missing):", e2);
        }
      } catch (e) {
        console.warn("HDR load failed, using solid fallback:", e);
        scene.background = new THREE.Color(0xb8d4f0);
      }

      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        300,
      );
      camera.position.set(0, 7.2, 21);
      camera.lookAt(0, 3.2, LANE_Z);

      const hemi = new THREE.HemisphereLight(0xd8ead8, 0x3d5238, 0.85);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff4e6, 1.65);
      sun.position.set(18, 22, 10);
      scene.add(sun);

      const skyFill = new THREE.DirectionalLight(0xc8d8ce, 0.22);
      skyFill.position.set(-12, 14, 6);
      scene.add(skyFill);

      const rim = new THREE.DirectionalLight(0xfff0e0, 0.28);
      rim.position.set(-6, 8, 16);
      scene.add(rim);

      const grassSun = new THREE.DirectionalLight(0xe8ffd8, 0.55);
      grassSun.position.set(6, 4, 18);
      scene.add(grassSun);

      /** Ghost-shore style: warm fire pool (intensity driven by ambience ghost blend). */
      const warmFire = new THREE.PointLight(0xffb789, 0, 48, 2);
      warmFire.position.set(0, 3.85, -7);
      scene.add(warmFire);

      /** World slices along X; only `2 * radius + 1` chunks stay mounted for culling / perf. */
      const CHUNK_WIDTH = 40;
      const CHUNK_LOAD_RADIUS = 2;
      const worldRoot = new THREE.Group();
      scene.add(worldRoot);

      /** Lane obstacles must not overlap the walkable hall (otherwise the capsule “sticks”). */
      const HALL_X0 = 28;
      const HALL_X1 = 88;
      /** Half-width of the hall in Z; must match the great-hall mesh below. Used by chunks (trees/rocks). */
      const HALL_ZW = 14.25;
      function laneObstacleOverlapsHall(worldX, halfW) {
        return worldX + halfW > HALL_X0 - 2 && worldX - halfW < HALL_X1 + 2;
      }
      /** Trees & props: no spawns inside the house footprint (X band + shallow Z near the lane). */
      function inHallSpawnExclusion(worldX, z) {
        const mx0 = HALL_X0 - 2.5;
        const mx1 = HALL_X1 + 2.5;
        if (worldX <= mx0 || worldX >= mx1) return false;
        const mz = HALL_ZW + 2.8;
        return z > -mz && z < mz;
      }

      function groundHeight(x) {
        return (
          Math.sin(x * 0.17) * 0.45 +
          Math.sin(x * 0.55 + 1.2) * 0.15 +
          Math.cos(x * 0.09 - 0.7) * 0.35
        );
      }

      /** Same base surface as the lane (x + small z ripple). */
      function surfaceY(x, z) {
        return groundHeight(x) + Math.sin(z * 2.2) * 0.03;
      }

      /**
       * Procedural hills behind the lane: extra undulation only far in -Z so trees sit on real grass,
       * not empty sky / HDR.
       */
      function terrainHeight(x, z) {
        const base = surfaceY(x, z);
        const depth = -z;
        const t = THREE.MathUtils.smoothstep(3, 22, depth);
        const extra =
          Math.sin(z * 0.082) * 1.05 +
          Math.cos(x * 0.062 + z * 0.052) * 0.62 +
          Math.sin(x * 0.11 + z * 0.068) * 0.42;
        return base + extra * t;
      }

      const hillZMin = -54;
      const hillZMax = -2;
      const hillDepth = hillZMax - hillZMin;
      const hillZCenter = (hillZMin + hillZMax) * 0.5;
      const hillSegZ = 96;
      const segXForChunk = Math.max(
        28,
        Math.round((CHUNK_WIDTH * 380) / 220),
      );

      const textureLoader = new THREE.TextureLoader();
      const grassColor = textureLoader.load(
        "./textures/pbr_materials/Grass005/Grass005_1K-JPG_Color.jpg",
      );
      const grassRough = textureLoader.load(
        "./textures/pbr_materials/Grass005/Grass005_1K-JPG_Roughness.jpg",
      );
      const grassNormal = textureLoader.load(
        "./textures/pbr_materials/Grass005/Grass005_1K-JPG_NormalGL.jpg",
      );
      for (const t of [grassColor, grassRough, grassNormal]) {
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(14, 2.8);
      }
      grassColor.colorSpace = THREE.SRGBColorSpace;

      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x7ab86a,
        map: grassColor,
        roughnessMap: grassRough,
        normalMap: grassNormal,
        normalScale: new THREE.Vector2(0.55, 0.55),
        roughness: 0.96,
        metalness: 0,
        fog: false,
        envMapIntensity: 0,
      });

      const hillMat = floorMat.clone();
      hillMat.fog = true;
      hillMat.envMapIntensity = 0;
      for (const key of ["map", "roughnessMap", "normalMap"]) {
        const tex = hillMat[key];
        if (tex) {
          const tc = tex.clone();
          tc.wrapS = THREE.RepeatWrapping;
          tc.wrapT = THREE.RepeatWrapping;
          tc.repeat.set(16, 12);
          if (key === "map" && grassColor.colorSpace)
            tc.colorSpace = grassColor.colorSpace;
          hillMat[key] = tc;
        }
      }
      const underSoilMat = new THREE.MeshStandardMaterial({
        color: 0x1e2e22,
        roughness: 1,
        metalness: 0,
        fog: false,
        envMapIntensity: 0,
      });

      const obstacleMat = new THREE.MeshStandardMaterial({
        color: 0x3d5238,
        roughnessMap: grassRough,
        map: grassColor,
        roughness: 0.92,
        metalness: 0.03,
        fog: false,
        envMapIntensity: 0,
      });
      const gateMat = new THREE.MeshStandardMaterial({
        color: 0x1d242d,
        roughness: 0.9,
        fog: true,
        envMapIntensity: 0.35,
      });
      const gatePostGeo = new THREE.BoxGeometry(0.58, 3.4, 0.52);
      const gateBeamGeo = new THREE.BoxGeometry(5.2, 0.46, 0.72);
      const gateTopGeo = new THREE.BoxGeometry(6.7, 0.36, 0.95);

      const propMatMid = new THREE.MeshStandardMaterial({
        color: 0x18212b,
        roughness: 0.93,
        fog: true,
        envMapIntensity: 0.25,
      });
      const propMatFront = new THREE.MeshStandardMaterial({
        color: 0x0b1016,
        roughness: 1.0,
        fog: true,
        envMapIntensity: 0.2,
      });

      const fgCompose = new THREE.Matrix4();
      const fgPos = new THREE.Vector3();
      const fgQuat = new THREE.Quaternion();
      const fgScale = new THREE.Vector3();
      const fgYAxis = new THREE.Vector3(0, 1, 0);
      const fgGrassMat = new THREE.MeshStandardMaterial({
        color: 0x2d5238,
        roughness: 0.94,
        metalness: 0,
        fog: false,
        envMapIntensity: 0,
      });
      const fgGrassGeo = new THREE.ConeGeometry(0.07, 0.52, 4);
      fgGrassGeo.translate(0, 0.26, 0);
      const fgPebbleMat = new THREE.MeshStandardMaterial({
        color: 0x2a3830,
        roughness: 1,
        metalness: 0,
        fog: false,
        envMapIntensity: 0,
      });
      const fgPebbleGeo = new THREE.DodecahedronGeometry(0.11, 0);
      const fgLogMat = new THREE.MeshStandardMaterial({
        color: 0x243228,
        roughness: 0.96,
        metalness: 0,
        fog: false,
        envMapIntensity: 0,
      });
      const fgLogGeo = new THREE.CapsuleGeometry(0.14, 0.55, 4, 8);
      fgLogGeo.rotateZ(Math.PI * 0.5);

      const obstacleColliders = [];
      const obstacleEntries = [];
      const chunks = new Map();

      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const gltfLoader = new GLTFLoader();
      const tempBox = new THREE.Box3();
      function loadGltf(url) {
        return new Promise((resolve, reject) => {
          gltfLoader.load(url, resolve, undefined, reject);
        });
      }
      function loadSceneModel(url) {
        return new Promise((resolve, reject) => {
          gltfLoader.load(
            url,
            (gltf) => resolve(gltf.scene),
            undefined,
            (err) => reject(err),
          );
        });
      }
      function fitObjectHeight(object3d, targetHeight) {
        tempBox.setFromObject(object3d);
        const size = tempBox.getSize(new THREE.Vector3());
        const currentHeight = Math.max(size.y, 1e-4);
        const scale = targetHeight / currentHeight;
        object3d.scale.multiplyScalar(scale);
      }

      /** Alpha-blended foliage + InstancedMesh breaks depth sorting; use cutout + solid depth. */
      function materialForInstancedFoliage(src) {
        const m = src.clone();
        const needsCutout =
          src.transparent || src.opacity < 0.999 || !!src.alphaMap;
        m.transparent = false;
        m.opacity = 1;
        m.depthWrite = true;
        m.depthTest = true;
        m.alphaTest = needsCutout ? 0.42 : 0;
        m.side = needsCutout ? THREE.DoubleSide : THREE.FrontSide;
        m.polygonOffset = true;
        m.polygonOffsetFactor = 1;
        m.polygonOffsetUnits = 1;
        m.envMapIntensity = (m.envMapIntensity ?? 1) * 0.55;
        m.fog = true;
        return m;
      }

      function fixGltfTransparencyForDepth(root) {
        root.traverse((child) => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material)
              ? child.material
              : [child.material];
            const next = mats.map((mat) => {
              const m = mat.clone();
              const needsCutout =
                m.transparent || m.opacity < 0.999 || m.alphaMap;
              if (needsCutout) {
                m.transparent = false;
                m.opacity = 1;
                m.depthWrite = true;
                m.alphaTest = 0.42;
                m.side = THREE.DoubleSide;
              }
              m.depthWrite = true;
              m.fog = true;
              return m;
            });
            child.material = next.length === 1 ? next[0] : next;
          }
        });
      }

      const dummyTree = new THREE.Object3D();
      const chunkAssets = { pineScene: null, rockBase: null };
      const TREE_Z_BANDS = [-6.5, -13.5, -24];
      const GATE_WORLD_X = 22;
      const PINES_PER_CHUNK = 22;
      let currentTreeScale = 1;
      let currentObstacleHeightScale = 1;

      /**
       * Only disposes mesh geometries. Do NOT dispose GLTF materials/textures here: clones and
       * Material.clone() share Texture instances; disposing them breaks other chunks still drawing
       * (WebGPU: "Destroyed texture used in a submit" + freeze).
       */
      function disposeObjectGeometries(root) {
        root.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
        });
      }

      function addPinesToWrapper(
        pineWrapper,
        gltfScene,
        rng,
        x0,
        x1,
        count,
        zBands,
      ) {
        const root = gltfScene.clone(true);
        fitObjectHeight(root, 7.2);
        root.updateMatrixWorld(true);
        const parts = [];
        root.traverse((child) => {
          if (child.isMesh) {
            const geom = child.geometry.clone();
            geom.applyMatrix4(child.matrixWorld);
            geom.computeVertexNormals();
            const raw = Array.isArray(child.material)
              ? child.material[0]
              : child.material;
            parts.push({
              geometry: geom,
              material: materialForInstancedFoliage(raw),
            });
          }
        });
        if (parts.length === 0) return [];

        const combined = new THREE.Box3();
        for (const p of parts) {
          combined.union(
            new THREE.Box3().setFromBufferAttribute(
              p.geometry.attributes.position,
            ),
          );
        }
        const groundYOffset = -combined.min.y;
        const matrices = [];
        for (let i = 0; i < count; i++) {
          let worldX;
          let zCenter;
          let z;
          let ok = false;
          for (let t = 0; t < 60; t++) {
            worldX = x0 + rng() * (x1 - x0);
            zCenter = zBands[(rng() * zBands.length) | 0];
            z = zCenter + (rng() - 0.5) * 1.35;
            if (!inHallSpawnExclusion(worldX, z)) {
              ok = true;
              break;
            }
          }
          if (!ok) {
            worldX = THREE.MathUtils.clamp(
              rng() < 0.5 ? HALL_X0 - 3.2 - rng() * 2.5 : HALL_X1 + 3.2 + rng() * 2.5,
              x0 + 0.4,
              x1 - 0.4,
            );
            zCenter = -22 - rng() * 5;
            z = zCenter + (rng() - 0.5) * 1.1;
          }
          const s = 1.05 + rng() * 0.95;
          dummyTree.position.set(
            worldX,
            terrainHeight(worldX, z) + groundYOffset,
            z,
          );
          dummyTree.rotation.set(
            (rng() - 0.5) * 0.05,
            rng() * Math.PI * 2,
            (rng() - 0.5) * 0.06,
          );
          dummyTree.scale.setScalar(s);
          dummyTree.updateMatrix();
          matrices.push(dummyTree.matrix.clone());
        }
        const out = [];
        for (const p of parts) {
          const inst = new THREE.InstancedMesh(p.geometry, p.material, count);
          for (let i = 0; i < count; i++) inst.setMatrixAt(i, matrices[i]);
          inst.instanceMatrix.needsUpdate = true;
          pineWrapper.add(inst);
          out.push(inst);
        }
        disposeObjectGeometries(root);
        return out;
      }

      function rebuildObstacleLists() {
        obstacleColliders.length = 0;
        obstacleEntries.length = 0;
        for (const c of chunks.values()) {
          obstacleColliders.push(...c.colliders);
          obstacleEntries.push(...c.obstacleEntries);
        }
      }

      function setObstacleHeightScale(scale) {
        currentObstacleHeightScale = scale;
        for (const e of obstacleEntries) {
          const h = e.baseH * scale;
          e.mesh.scale.y = scale;
          e.mesh.position.y = e.gy + h * 0.5;
          e.collider.minY = e.gy;
          e.collider.maxY = e.gy + h;
        }
      }

      function disposeChunk(chunkIndex) {
        const c = chunks.get(chunkIndex);
        if (!c) return;
        worldRoot.remove(c.group);
        for (const g of c.ownedGeometries) g.dispose();
        for (const r of c.gltfRoots) disposeObjectGeometries(r);
        for (const inst of c.pineInstancers) {
          inst.geometry.dispose();
        }
        chunks.delete(chunkIndex);
      }

      function buildChunk(chunkIndex) {
        if (chunks.has(chunkIndex)) return;
        const rng = mulberry32(chunkIndex * 9781 + 62773);
        const x0 = chunkIndex * CHUNK_WIDTH;
        const x1 = x0 + CHUNK_WIDTH;
        const cx = x0 + CHUNK_WIDTH * 0.5;

        const group = new THREE.Group();
        group.name = `chunk_${chunkIndex}`;
        const ownedGeometries = new Set();
        const gltfRoots = [];
        const colliders = [];
        const chunkObstacleEntries = [];
        const pineInstancers = [];

        const hillGeo = new THREE.PlaneGeometry(
          CHUNK_WIDTH,
          hillDepth,
          segXForChunk,
          hillSegZ,
        );
        hillGeo.rotateX(-Math.PI / 2);
        const hp = hillGeo.attributes.position.array;
        for (let i = 0; i < hp.length; i += 3) {
          const lx = hp[i];
          const lz = hp[i + 2];
          hp[i + 1] = terrainHeight(cx + lx, lz);
        }
        hillGeo.computeVertexNormals();
        ownedGeometries.add(hillGeo);
        const hillMesh = new THREE.Mesh(hillGeo, hillMat);
        hillMesh.position.set(cx, 0, hillZCenter);
        group.add(hillMesh);

        const laneGeo = new THREE.PlaneGeometry(CHUNK_WIDTH, 5.6, segXForChunk, 8);
        laneGeo.rotateX(-Math.PI / 2);
        const lp = laneGeo.attributes.position.array;
        for (let i = 0; i < lp.length; i += 3) {
          const lx = lp[i];
          const lz = lp[i + 2];
          lp[i + 1] =
            groundHeight(cx + lx) + Math.sin(lz * 2.2) * 0.03;
        }
        laneGeo.computeVertexNormals();
        ownedGeometries.add(laneGeo);
        const laneMesh = new THREE.Mesh(laneGeo, floorMat);
        laneMesh.position.set(cx, 0, LANE_Z);
        group.add(laneMesh);

        const underGeo = new THREE.BoxGeometry(CHUNK_WIDTH, 6, 14);
        ownedGeometries.add(underGeo);
        const underMesh = new THREE.Mesh(underGeo, underSoilMat);
        underMesh.position.set(cx, -3.2, LANE_Z);
        group.add(underMesh);

        const nObs = rng() < 0.12 ? 0 : rng() < 0.55 ? 1 : 2;
        for (let o = 0; o < nObs; o++) {
          const w = 1.15 + rng() * 0.45;
          const h = 0.5 + rng() * 0.75;
          const d = 1.2 + rng() * 0.35;
          const margin = w * 0.5 + 0.6;
          const halfW = w * 0.5;
          let worldX = x0 + margin + rng() * (CHUNK_WIDTH - margin * 2);
          let tries = 0;
          while (laneObstacleOverlapsHall(worldX, halfW) && tries < 18) {
            worldX = x0 + margin + rng() * (CHUNK_WIDTH - margin * 2);
            tries++;
          }
          if (laneObstacleOverlapsHall(worldX, halfW)) continue;
          const gy = groundHeight(worldX);
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), obstacleMat);
          mesh.position.set(worldX, gy + h * 0.5, LANE_Z);
          group.add(mesh);
          ownedGeometries.add(mesh.geometry);
          const collider = {
            minX: worldX - w * 0.5,
            maxX: worldX + w * 0.5,
            minY: gy,
            maxY: gy + h,
            minZ: LANE_Z - d * 0.5,
            maxZ: LANE_Z + d * 0.5,
          };
          colliders.push(collider);
          chunkObstacleEntries.push({ mesh, gy, baseH: h, collider });
        }

        if (GATE_WORLD_X >= x0 && GATE_WORLD_X < x1) {
          const gate = new THREE.Group();
          const postL = new THREE.Mesh(gatePostGeo, gateMat);
          const postR = new THREE.Mesh(gatePostGeo, gateMat);
          const beam = new THREE.Mesh(gateBeamGeo, gateMat);
          const top = new THREE.Mesh(gateTopGeo, gateMat);
          postL.position.set(-1.95, 1.7, 0);
          postR.position.set(1.95, 1.7, 0);
          beam.position.set(0, 3.15, 0);
          top.position.set(0, 3.58, -0.1);
          gate.add(postL, postR, beam, top);
          gate.position.set(
            GATE_WORLD_X,
            terrainHeight(GATE_WORLD_X, -5.8),
            -5.8,
          );
          group.add(gate);
        }

        const nRocks = 5 + ((rng() * 5) | 0);
        for (let i = 0; i < nRocks; i++) {
          let worldX;
          let rz;
          let rockTries = 0;
          do {
            worldX = x0 + rng() * CHUNK_WIDTH;
            const zBand = i % 3 === 0 ? -2.4 : i % 3 === 1 ? -6.5 : 2.4;
            rz = zBand + (rng() - 0.5) * 1.6;
            rockTries++;
          } while (inHallSpawnExclusion(worldX, rz) && rockTries < 24);
          if (inHallSpawnExclusion(worldX, rz)) continue;
          const rock = new THREE.Mesh(

      function snapAmbienceToPreset(index) {
        const p = AMBIENCE_PRESETS[index];
        if (!p) return;
        ambState.fog.setHex(p.fogColor);

      function smoothAmbienceTowardTarget(dt) {
        const p = AMBIENCE_PRESETS[ambienceTargetIndex];
        if (!p) return;
        const a = 1 - Math.exp(-2.05 * dt);
        ambTmpColor.setHex(p.fogColor);
        ambState.fog.lerp(ambTmpColor, a);
        ambState.fogNear += (p.fogNear - ambState.fogNear) * a;
        ambState.fogFar += (p.fogFar - ambState.fogFar) * a;
        ambState.exposure += (p.exposure - ambState.exposure) * a;
        ambState.envIntensity += (p.envIntensity - ambState.envIntensity) * a;
        ambTmpColor.setHex(p.hemiSky);
        ambState.hemiSky.lerp(ambTmpColor, a);
        ambTmpColor.setHex(p.hemiGround);
        ambState.hemiGround.lerp(ambTmpColor, a);
        ambState.hemiIntensity += (p.hemiIntensity - ambState.hemiIntensity) * a;
        ambTmpColor.setHex(p.sunColor);
        ambState.sunColor.lerp(ambTmpColor, a);
        ambState.sunIntensity += (p.sunIntensity - ambState.sunIntensity) * a;
        ambTmpColor.setHex(p.skyFill);
        ambState.skyFillColor.lerp(ambTmpColor, a);
        ambState.skyFillIntensity +=
          (p.skyFillInt - ambState.skyFillIntensity) * a;
        ambTmpColor.setHex(p.rim);
        ambState.rimColor.lerp(ambTmpColor, a);
        ambState.rimIntensity += (p.rimInt - ambState.rimIntensity) * a;
        ambTmpColor.setHex(p.grassSun);
        ambState.grassSunColor.lerp(ambTmpColor, a);
        ambState.grassSunIntensity +=
          (p.grassSunInt - ambState.grassSunIntensity) * a;
        ambTmpColor.setHex(p.solidBg);
        ambState.solidBg.lerp(ambTmpColor, a);
        ambTmpColor.setHex(p.dustColor);
        ambState.dustColor.lerp(ambTmpColor, a);
        ambState.dustOpacity += (p.dustOpacity - ambState.dustOpacity) * a;
        const tgtHdr = p.useHdrBackground && hdrBackgroundTexture ? 1 : 0;
        ambState.hdrMix += (tgtHdr - ambState.hdrMix) * a;
        const tgtGhost = p.ghostVfx ?? 0;
        ambState.ghostVfx += (tgtGhost - ambState.ghostVfx) * a;
      }

      function pushAmbienceToScene(playerX, interiorBlend) {
        const p = AMBIENCE_PRESETS[ambienceTargetIndex];
        const ibHall = interiorBlend;
        const ib = 0;
        const hallGeomLit =
          playerX > HALL_X0 - 0.8 && playerX < HALL_X1 + 0.8;
        const nearHallForMist =
          playerX > HALL_X0 - 32 && playerX < HALL_X1 + 32;

        renderer.toneMappingExposure = Math.max(
          0.48,
          ambState.exposure * (1 - 0.09 * ib),
        );
        scene.environmentIntensity = Math.max(
          0.28,
          ambState.envIntensity * (1 - 0.2 * ib),
        );
        look.exposure = renderer.toneMappingExposure;
        look.envIntensity = scene.environmentIntensity;

        let fogFarForUi = ambState.fogFar * (1 - 0.12 * ib);
        if (look.fogEnabled) {
          fogFarForUi = Math.max(42, fogFarForUi * (1 - 0.05 * ib));
          if (hallGeomLit) fogFarForUi = Math.max(fogFarForUi, 160);
          const fogNearAdj = ambState.fogNear * (1 + 0.08 * ib);
          interiorFogMixScratch.copy(ambState.fog).lerp(interiorFogWarm, ib * 0.42);
          if (!scene.fog) {
            scene.fog = new THREE.Fog(
              interiorFogMixScratch.clone(),
              fogNearAdj,
              fogFarForUi,
            );
          } else {
            scene.fog.color.copy(interiorFogMixScratch);
            scene.fog.near = fogNearAdj;
            scene.fog.far = fogFarForUi;
          }
        }
        look.fogColor = "#" + ambState.fog.getHexString();
        look.fogNear = ambState.fogNear * (1 + 0.08 * ib);
        look.fogFar = fogFarForUi;

        hemi.color.copy(ambState.hemiSky);
        interiorFogMixScratch.copy(ambState.hemiGround);
        interiorFogMixScratch.lerp(new THREE.Color(0x2c2218), ib * 0.22);
        hemi.groundColor.copy(interiorFogMixScratch);
        hemi.intensity = ambState.hemiIntensity * (1 - 0.14 * ib);
        look.hemiSkyColor = "#" + hemi.color.getHexString();
        look.hemiGroundColor = "#" + hemi.groundColor.getHexString();
        look.hemiIntensity = hemi.intensity;

        sun.color.copy(ambState.sunColor);
        sun.intensity = ambState.sunIntensity * (1 - 0.12 * ib);
        look.sunColor = "#" + sun.color.getHexString();
        look.sunIntensity = sun.intensity;

        ambSunGhost.set(playerX - 14, 17, 10);
        sun.position.lerpVectors(ambSunDay, ambSunGhost, ambState.ghostVfx);

        skyFill.color.copy(ambState.skyFillColor);
        skyFill.intensity = ambState.skyFillIntensity * (1 - 0.12 * ib);
        look.skyFillIntensity = skyFill.intensity;

        rim.color.copy(ambState.rimColor);
        rim.intensity = ambState.rimIntensity * (1 - 0.1 * ib);
        look.rimIntensity = rim.intensity;

        grassSun.color.copy(ambState.grassSunColor);
        grassSun.intensity = ambState.grassSunIntensity * (1 - 0.12 * ib);
        look.grassSunIntensity = grassSun.intensity;

        if (ambState.hdrMix > 0.88 && hdrBackgroundTexture) {
          scene.background = hdrBackgroundTexture;
        } else {
          scene.background = ambState.solidBg;
        }

        const dustMul = 1 - ambState.ghostVfx * 0.72;
        dust.material.color.copy(ambState.dustColor);
        dust.material.opacity = ambState.dustOpacity * dustMul;

        warmFire.position.set(playerX + 0.35, 3.85, -7);
        warmFire.intensity = ambState.ghostVfx * 1.45 * (1 - ib * 0.85);

        const hallLightIb = hallGeomLit ? Math.max(ibHall, 0.88) : ibHall;
        hallAmbient.intensity = hallGeomLit ? 0.58 + ibHall * 0.42 : ibHall * 0.35;
        hallSunFill.intensity = hallGeomLit ? 3.1 * Math.max(ibHall, 0.5) : 0;
        lanternPl.intensity = 5.8 * hallLightIb;
        for (const L of hallLightGroup.children) {
          if (L.isPointLight)
            L.intensity = L.userData.baseI * hallLightIb * 1.85;
        }

        ghostMistGroup.position.x = playerX;
        const gv = ambState.ghostVfx;
        for (const mesh of mistSlabs) {
          const isAdd = mesh.material.blending === THREE.AdditiveBlending;
          mesh.material.opacity = (isAdd ? mistAddOpacity : mistBaseOpacity) * gv;
        }
        ghostMistGroup.visible = !nearHallForMist && gv > 0.015;

        emberMat.opacity = 0.88 * gv;
        emberFire.visible = gv > 0.015;
        emberFire.position.x = playerX;

        if (biomeLabelEl && p) {
          biomeLabelEl.textContent =
            ibHall > 0.25 ? `${p.label} · great hall` : p.label;
        }

        dbgPush.ib = ibHall;
        dbgPush.hg = hallGeomLit;
        dbgPush.mist = ghostMistGroup.visible;
        dbgPush.preset = p?.label ?? "—";
        dbgPush.bgHdr =
          ambState.hdrMix > 0.88 && Boolean(hdrBackgroundTexture);

        for (const c of hallLightGroup.children) {
          if (c.isPointLight) {
            hp = c.intensity;
            break;
          }

        dbgPush.hallPl = hp;

      function stepAmbience(playerX, dt) {
        updateAmbienceTargetIndex(playerX);
        const insideTarget =
          playerX > HALL_X0 + 0.45 && playerX < HALL_X1 - 0.45 ? 1 : 0;
        interiorBlendSmoothed +=
          (insideTarget - interiorBlendSmoothed) * (1 - Math.exp(-5.2 * dt));
        if (ambienceSnapOnce) {
          ambienceSnapOnce = false;
          snapAmbienceToPreset(ambienceTargetIndex);
        } else {
          smoothAmbienceTowardTarget(dt);
        }
        pushAmbienceToScene(playerX, interiorBlendSmoothed);
      }

      // World-space bottom of capsule mesh (group at player.y - 1.02, body local y 1.1, capsule half-height 0.835).
      const CAPSULE_RADIUS = 0.36;
      const FEET_Y_OFFSET = 0.755;

      function feetWorldY() {
        return player.y - FEET_Y_OFFSET;
      }

      function headWorldY() {
        return player.y + 0.915;
      }

      function playerAabb() {
        return {
          minX: player.x - CAPSULE_RADIUS,
          maxX: player.x + CAPSULE_RADIUS,
          minY: feetWorldY(),
          maxY: headWorldY(),
          minZ: LANE_Z - CAPSULE_RADIUS,
          maxZ: LANE_Z + CAPSULE_RADIUS,
        };
      }

      function aabbOverlap2D(a, b) {
        return (
          a.minX < b.maxX &&
          a.maxX > b.minX &&
          a.minZ < b.maxZ &&
          a.maxZ > b.minZ
        );
      }

      function aabbOverlap3D(a, b) {
        return (
          a.minX < b.maxX &&
          a.maxX > b.minX &&
          a.minY < b.maxY &&
          a.maxY > b.minY &&
          a.minZ < b.maxZ &&
          a.maxZ > b.minZ
        );
      }

      const player = {
        x: -8,
        y: groundHeight(-8) + 1.03,
        vz: 0,
        vx: 0,
        vy: 0,
        grounded: true,
      };

      stepAmbience(player.x, 0);

      function feetOverSupport() {
        const fy = feetWorldY();
        const g = groundHeight(player.x);
        if (Math.abs(fy - (g + 0.275)) < 0.18) return true;
        for (const box of obstacleColliders) {
          const onTop = Math.abs(fy - box.maxY) < 0.14;
          const overX =
            player.x >= box.minX - CAPSULE_RADIUS * 0.9 &&
            player.x <= box.maxX + CAPSULE_RADIUS * 0.9;
          if (onTop && overX) return true;
        }
        return false;
      }

      const keys = {
        left: false,
        right: false,
        jump: false,
      };

      function onKey(event, down) {
        const k = event.key.toLowerCase();
        if (k === "a" || event.key === "ArrowLeft") keys.left = down;
        if (k === "d" || event.key === "ArrowRight") keys.right = down;
        if (k === " " || event.code === "Space") keys.jump = down;
      }
      window.addEventListener("keydown", (e) => onKey(e, true));
      window.addEventListener("keyup", (e) => onKey(e, false));

      const timer = new THREE.Timer();
      renderer.setAnimationLoop(() => {
        timer.update();
        const dt = Math.min(timer.getDelta(), 1 / 30);
        const elapsed = timer.getElapsed();

        // 2.5D lane movement: only X movement is allowed, Z is locked.
        const axis = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        const targetVx = axis * look.moveSpeed;
        const accel = player.grounded ? look.groundAccel : look.airAccel;
        player.vx += (targetVx - player.vx) * Math.min(accel * dt, 1);

        if (keys.jump && player.grounded) {
          player.vy = look.jumpSpeed;
          player.grounded = false;
        }

        player.vy -= look.gravity * dt;

        const prevX = player.x;
        const prevFeetY = feetWorldY();

        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Keep scene finite for now.
        player.x = THREE.MathUtils.clamp(player.x, -8000, 8000);

        syncChunksAround(player.x);
        stepAmbience(player.x, dt);

        const ibCut = interiorBlendSmoothed;
        if (look.hallCutawayCameraSide) {
          const showCameraSideShell = ibCut < 0.26;
          for (const m of hallCameraSideOccluders) m.visible = showCameraSideShell;
        } else {
          for (const m of hallCameraSideOccluders) m.visible = true;
        }

        // Obstacles: land on top when falling, otherwise push out horizontally.
        let onObstacleTop = false;
        for (const box of obstacleColliders) {
          const p = playerAabb();
          if (!aabbOverlap2D(p, box)) continue;

          if (feetWorldY() > box.maxY + 0.1) continue;

          const landing =
            player.vy <= 0 &&
            prevFeetY >= box.maxY - 0.12 &&
            feetWorldY() <= box.maxY + 0.15;

          if (landing) {
            player.y = box.maxY + FEET_Y_OFFSET;
            player.vy = 0;
            player.grounded = true;
            onObstacleTop = true;
            break;
          }

          if (aabbOverlap3D(p, box)) {
            const penLeft = p.maxX - box.minX;
            const penRight = box.maxX - p.minX;
            if (penLeft < penRight) {
              player.x = box.minX - CAPSULE_RADIUS - 0.02;
            } else {
              player.x = box.maxX + CAPSULE_RADIUS + 0.02;
            }
            if (prevX !== player.x) player.vx = 0;
          }
        }

        const floorY = groundHeight(player.x) + 1.03;
        if (!onObstacleTop && player.y <= floorY) {
          player.y = floorY;
          player.vy = 0;
          player.grounded = true;
        }

        if (player.grounded && player.y > floorY + 0.02 && !feetOverSupport()) {
          player.grounded = false;
        }

        capsuleGroup.position.set(player.x, player.y - 1.02, LANE_Z);
        capsuleGroup.rotation.y = axis !== 0 ? (axis > 0 ? -0.16 : 0.16) : 0;
        body.rotation.z =
          Math.sin(elapsed * 10 + player.x * 0.2) * Math.abs(player.vx) * 0.01;

        // Camera follow — pull Z + adjust height inside the hall so the room + player read.
        const ibc = interiorBlendSmoothed;
        const camTargetX = player.x + look.camOffsetX;
        const camZTarget = THREE.MathUtils.lerp(21, 16.25, ibc);
        let camYTarget = look.camHeight * THREE.MathUtils.lerp(1, 0.9, ibc);
        if (ibc > 0.04) {
          camYTarget = Math.min(camYTarget, HALL_CAM_Y_CEILING);
        }
        const lookY = THREE.MathUtils.lerp(2.85, 2.55, ibc);
        const lookXOff = THREE.MathUtils.lerp(2.2, 2.05, ibc);
        camera.position.x +=
          (camTargetX - camera.position.x) * Math.min(look.camFollow * dt, 1);
        camera.position.y +=
          (camYTarget - camera.position.y) * Math.min(2.6 * dt, 1);
        camera.position.z +=
          (camZTarget - camera.position.z) * Math.min(2.9 * dt, 1);
        camera.lookAt(player.x + lookXOff, lookY, LANE_Z);

        if (ghostMistGroup.visible) {
          for (const m of mistSlabs) {
            m.lookAt(camera.position);
          }
        }

        const dustArray = dust.geometry.attributes.position.array;
        for (let i = 0; i < dustCount; i++) {
          const idx = i * 3;
          dustArray[idx + 0] += Math.sin(elapsed * 0.25 + dustSeed[i]) * 0.003;
          dustArray[idx + 1] +=
            0.002 + Math.sin(elapsed * 0.45 + dustSeed[i] * 2.0) * 0.0012;
          if (dustArray[idx + 1] > 10.6)
            dustArray[idx + 1] = 0.35 + Math.random() * 0.8;
        }
        dust.geometry.attributes.position.needsUpdate = true;

        if (emberFire.visible) {
          const ep = emberGeo.attributes.position.array;
          for (let i = 0; i < emberCount; i++) {
            const idx = i * 3;
            ep[idx + 0] +=
              Math.sin(elapsed * 0.62 + emberSeed[i] * 0.7) * 0.0016;
            ep[idx + 1] +=
              0.0024 + Math.sin(elapsed * 0.88 + emberSeed[i]) * 0.0005;
            if (ep[idx + 1] > 6.6)
              ep[idx + 1] = 0.45 + Math.random() * 0.65;
          }
          emberGeo.attributes.position.needsUpdate = true;
        }

        if (hallDbgEl) {
          hallDbgEl.style.display = look.showHallDebugHud ? "block" : "none";
          if (look.showHallDebugHud) {
            hallDbgEl.textContent = [
              `preset ${dbgPush.preset}  ib ${dbgPush.ib.toFixed(2)}  hallBand ${dbgPush.hg ? "yes" : "no"}`,
              `mist ${dbgPush.mist ? "on" : "off"}  hallPt0 ${dbgPush.hallPl.toFixed(2)}  bgHDR ${dbgPush.bgHdr ? "yes" : "no"}`,
              `cam ${camera.position.x.toFixed(1)}, ${camera.position.y.toFixed(1)}, ${camera.position.z.toFixed(1)}`,
              `exp ${renderer.toneMappingExposure.toFixed(2)}  hallSunFill ${hallSunFill.intensity.toFixed(2)}`,
            ].join("\n");
          }
        }

        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
