<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unreal Grass — Dev Scene</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .tp-dfwv { position: fixed !important; top: 12px !important; right: 12px !important; width: 300px !important; z-index: 10; }
      #hints { position: fixed; bottom: 14px; left: 14px; color: rgba(255,255,255,0.6); font: 13px/1.8 monospace; pointer-events: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hints">WASD / Arrows — move &nbsp;|&nbsp; V — toggle follow / orbit camera &nbsp;|&nbsp; Mouse drag — orbit (orbit mode)</div>
    <script type="module">
      import * as THREE from "three";
      import { uniform, vec2 } from "three/tsl";
      import { Pane } from "tweakpane";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SkyMesh } from "three/addons/objects/SkyMesh.js";
      import Stats from "stats-gl";
      import { createTileMaterial } from "./tileMaterial.js";
      import {
        createGrassGeometry,
        createGrassMaterial,
        GRASS_SEGMENTS_HIGH,
        GRASS_VERTS_HIGH,
        GRASS_SEGMENTS_MID,
        GRASS_VERTS_MID,
        GRASS_PATCH_SIZE,
      } from "./grass-painter8.js";

      // ── Renderer ────────────────────────────────────────────────────────────
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      // ── Scene & Camera ───────────────────────────────────────────────────────
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x9ecde8, 0.018);

      // ── Sky ─────────────────────────────────────────────────────────────────
      const sky = new SkyMesh();
      sky.scale.setScalar(10000);
      sky.turbidity.value        = 2;
      sky.rayleigh.value         = 1.5;
      sky.mieCoefficient.value   = 0.005;
      sky.mieDirectionalG.value  = 0.8;
      sky.cloudCoverage.value    = 0.4;
      sky.cloudDensity.value     = 0.4;
      sky.cloudElevation.value   = 0.5;
      sky.material.fog = false;  // fog must not affect the sky dome
      scene.add(sky);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
      camera.position.set(0, 3, -10);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1, 0);
      controls.update();

      // ── Stats ────────────────────────────────────────────────────────────────
      const stats = new Stats({ trackGPU: false });
      stats.init(renderer);
      document.body.appendChild(stats.dom);

      // ── Lights ───────────────────────────────────────────────────────────────
      const sunCfg = { azimuth: 135, elevation: 43 };
      function makeSunDir() {
        const az = (sunCfg.azimuth * Math.PI) / 180;
        const el = (sunCfg.elevation * Math.PI) / 180;
        return new THREE.Vector3(
          Math.cos(el) * Math.cos(az),
          Math.sin(el),
          Math.cos(el) * Math.sin(az),
        ).normalize();
      }
      const dirLight = new THREE.DirectionalLight(0xfff5e0, 3.2);
      dirLight.castShadow = false;
      dirLight.position.copy(makeSunDir().multiplyScalar(50));
      scene.add(dirLight);
      // Ground hemisphere color = dark soil, not bright green
      const hemi = new THREE.HemisphereLight(0xc8e0ff, 0x1a0e04, 0.9);
      scene.add(hemi);

      // ── Flat 1×1 DataTextures (height=0, density=full) ───────────────────────
      function flat1x1(r, g, b) {
        const data = new Uint8Array([r, g, b, 255]);
        const t = new THREE.DataTexture(data, 1, 1, THREE.RGBAFormat);
        t.needsUpdate = true;
        return t;
      }
      const heightTex = flat1x1(0, 0, 0);
      const trailTex  = flat1x1(255, 255, 255);

      // Noise-based density texture: organic bare patches + dense clumps
      function makeNoiseDensityTex(size = 128) {
        // Value noise on a grid
        const grid = (ix, iy) => {
          let n = ((ix * 1619 + iy * 31337) ^ 0x4e6d2ef7) >>> 0;
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b) >>> 0;
          return (n >>> 0) / 0xffffffff;
        };
        const smooth = t => t * t * (3 - 2 * t);
        const vnoise = (x, y) => {
          const ix = Math.floor(x), iy = Math.floor(y);
          const fx = x - ix, fy = y - iy;
          const sx = smooth(fx), sy = smooth(fy);
          return grid(ix,iy)*(1-sx)*(1-sy) + grid(ix+1,iy)*sx*(1-sy)
               + grid(ix,iy+1)*(1-sx)*sy   + grid(ix+1,iy+1)*sx*sy;
        };
        const data = new Uint8Array(size * size * 4);
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const fx = x / size, fy = y / size;
            // Two octaves: medium clumps + fine detail
            const n = vnoise(fx * 10, fy * 10) * 0.65
                    + vnoise(fx * 22, fy * 22) * 0.35;
            // Floor at 0.4 — no fully bare areas, just sparse-to-dense variation
            const density = 0.4 + Math.max(0, Math.min(0.6, (n - 0.1) / 0.75));
            const i = (y * size + x) * 4;
            data[i] = Math.round(density * 255);
            data[i+3] = 255;
          }
        }
        const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.needsUpdate = true;
        return t;
      }
      const grassDensityTex = makeNoiseDensityTex();

      // ── Grass Uniforms ────────────────────────────────────────────────────────
      function srgb(hex) {
        const c = new THREE.Color(hex);
        c.convertSRGBToLinear();
        return c;
      }
      const windDir = 0.7;
      let windBaseRad = windDir;  // updated by Tweakpane direction control

      const uTime               = uniform(0);
      const uPlayerPos          = uniform(new THREE.Vector3(9999, 0, 9999));
      const uNpcPos             = [uniform(new THREE.Vector3(9999, 0, 9999))];

      const uGrassWidth         = uniform(0.055);
      const uGrassHeight        = uniform(0.78);

      // Quality blend completes at exactly 10 units = LOD0 patch border,
      // so both LOD0 and LOD1 materials are identical quality at the snap boundary.
      const uLodDist            = uniform(10);
      const uMaxDist            = uniform(90);
      const uLodBlendStart      = uniform(0.5);
      // LOD tier crossfade distances. Blades shrink to zero at boundaries.
      const uLod0Dist           = uniform(12);  // LOD0 → LOD1 crossfade center
      const uLod1Dist           = uniform(24);  // LOD1 → LOD2 crossfade center
      const uLodFadeRange       = uniform(3);   // half-width of each crossfade band

      const uBladeDensityRegular = uniform(1.0);
      const uBladeDensityNear   = uniform(1.0);
      const uNearFadeEnd        = uniform(999);
      const uNearFadeRange      = uniform(8);

      const uBaseColor1         = uniform(srgb("#0b1e07"));  // deep dark base
      const uBaseColor2         = uniform(srgb("#0e2809"));  // slight variation
      const uTipColor1          = uniform(srgb("#bcd82a"));  // bright yellow-green tip
      const uTipColor2          = uniform(srgb("#d4f045"));  // lighter tip variant
      const uGradientCurve      = uniform(3.2);              // sharp base-dark / tip-bright split
      const uColorVariation     = uniform(0.45);
      const uLushColor          = uniform(srgb("#163d08"));
      const uBleachedColor      = uniform(srgb("#dcd87a"));

      const uWindSpeed          = uniform(1.0);
      const uWindStr            = uniform(0.4);
      const uWindWaveScale      = uniform(0.08);
      const uWindDirX           = uniform(Math.cos(windDir));
      const uWindDirZ           = uniform(Math.sin(windDir));
      const uWindAxis           = uniform(new THREE.Vector3( Math.sin(windDir), 0, -Math.cos(windDir)));
      const uCrossAxis          = uniform(new THREE.Vector3( Math.cos(windDir), 0,  Math.sin(windDir)));
      const uWindGust           = uniform(0.55);
      const uWindMicro          = uniform(0.15);

      const uInteractionRange   = uniform(999);
      const uInteractionStrength = uniform(0);
      const uInteractionHThresh = uniform(1.5);
      const uInteractionRepel   = uniform(1.0);

      const uMinSkyBlend        = uniform(0.55);
      const uMaxSkyBlend        = uniform(0.7);
      const uAoIntensity        = uniform(1.0);

      const uBsIntensity        = uniform(0.9);
      const uBsColor            = uniform(srgb("#c8e840"));  // warm yellow-green tip glow
      const uBsPower            = uniform(1.4);              // softer falloff = more spread glow
      const uFrontScatter       = uniform(0.55);
      const uRimSSS             = uniform(0.65);

      const uSpecV1Intensity    = uniform(0.5);
      const uSpecV1Color        = uniform(srgb("#fffde8"));
      const uSpecV2Intensity    = uniform(0.25);
      const uSpecV2Color        = uniform(srgb("#ffffff"));
      const uSpecV2Dir          = uniform(new THREE.Vector3(-1, 0.45, 1).normalize());
      const uSpecV2NoiseScale   = uniform(3.0);
      const uSpecV2NoiseStr     = uniform(0.6);
      const uSpecV2Power        = uniform(12.0);
      const uSpecV2TipBias      = uniform(0.5);

      const uSeasonalStr        = uniform(0);
      const uSeasonalScale      = uniform(0.02);
      const uSeasonalDryColor   = uniform(srgb("#8b7d3c"));

      const uSunDir             = uniform(makeSunDir());
      const uSunWrap            = uniform(0.60);  // 0=full directional, 1=flat (Zelda/Genshin)
      const uNormalRound        = uniform(0.3);   // GoT rounded normals rotation (fraction of PI). 0=flat, 0.5=perpendicular
      const uViewThicken        = uniform(2.0);   // max width multiplier when blade is viewed edge-on
      const uLeafPeak           = uniform(0.25);  // height fraction where blade is widest (0=wide at base, 0.5=wide at mid)
      const uTipSharp           = uniform(1.0);   // tip convergence (0.4=blunt, 1.0=natural, 2.5=needle)
      const uTerrainSize        = uniform(100);
      const uTrailCenter        = uniform(new THREE.Vector2(9999, 9999));
      const uTrailSize          = uniform(60);

      const grassCtx = {
        uTime, uPlayerPos, uNpcPos,
        uGrassWidth, uGrassHeight,
        uLodDist, uMaxDist, uLodBlendStart,
        uLod0Dist, uLod1Dist, uLodFadeRange,
        uBladeDensityRegular, uBladeDensityNear, uNearFadeEnd, uNearFadeRange,
        uBaseColor1, uBaseColor2, uTipColor1, uTipColor2,
        uGradientCurve, uColorVariation, uLushColor, uBleachedColor,
        uWindSpeed, uWindStr, uWindWaveScale,
        uWindDirX, uWindDirZ, uWindAxis, uCrossAxis,
        uWindGust, uWindMicro,
        uInteractionRange, uInteractionStrength, uInteractionHThresh, uInteractionRepel,
        uMinSkyBlend, uMaxSkyBlend, uAoIntensity,
        uBsIntensity, uBsColor, uBsPower, uFrontScatter, uRimSSS,
        uSpecV1Intensity, uSpecV1Color,
        uSpecV2Intensity, uSpecV2Color, uSpecV2Dir,
        uSpecV2NoiseScale, uSpecV2NoiseStr, uSpecV2Power, uSpecV2TipBias,
        uSeasonalStr, uSeasonalScale, uSeasonalDryColor,
        uSunDir, uSunWrap, uNormalRound, uViewThicken, uLeafPeak, uTipSharp, uTerrainSize, uTrailCenter, uTrailSize,
        heightTex, grassDensityTex, trailTex,
        PI: Math.PI,
      };

      // ── Grass Geometry & Materials — three LOD tiers ─────────────────────────
      let _seed = 0;
      function setSeed(s) { _seed = s; }
      function randRange(lo, hi) {
        _seed = (_seed * 1664525 + 1013904223) & 0xffffffff;
        const t = (_seed >>> 0) / 0xffffffff;
        return lo + t * (hi - lo);
      }

      // Near ring — 15 verts, dense, 5-unit patches right under the player.
      // Smaller patch size = much denser ground coverage close up, exactly like grass.js.
      const NEAR_SIZE = 5;
      const geoN = createGrassGeometry(GRASS_SEGMENTS_HIGH, 2000, NEAR_SIZE, setSeed, randRange);
      const matN = createGrassMaterial(GRASS_SEGMENTS_HIGH, GRASS_VERTS_HIGH, false, "near", grassCtx);

      // LOD0 — 15 verts, full quality, 10-unit patches
      const geoH = createGrassGeometry(GRASS_SEGMENTS_HIGH, 5000, GRASS_PATCH_SIZE, setSeed, randRange);
      const matH = createGrassMaterial(GRASS_SEGMENTS_HIGH, GRASS_VERTS_HIGH, false, "regular", grassCtx);

      // LOD1 — 7 verts, simplified, 10-unit patches
      const geoM = createGrassGeometry(GRASS_SEGMENTS_MID, 3000, GRASS_PATCH_SIZE, setSeed, randRange);
      const matM = createGrassMaterial(GRASS_SEGMENTS_MID, GRASS_VERTS_MID, false, "regular", grassCtx);

      // LOD2 — 7 verts, far ring (shares geoM, separate material for future tuning)
      const matL = createGrassMaterial(GRASS_SEGMENTS_MID, GRASS_VERTS_MID, false, "regular", grassCtx);

      // ── Grass patch pools — dynamic LOD, no fixed rings, no pop ─────────────
      // Every frame: hide all → iterate grid around capsule → assign from pool
      // by live distance. LOD switch fires at exactly uLodDist / uLod1Dist where
      // the shader output is identical for both geometry types → invisible swap.
      function makePool(geo, mat, n) {
        const p = [];
        for (let i = 0; i < n; i++) {
          const m = new THREE.Mesh(geo, mat);
          m.visible = false;
          m.frustumCulled = false;
          scene.add(m);
          p.push(m);
        }
        return p;
      }
      const GRID_HALF = 9;                        // ±9 patches = ±90 units
      const NEAR_GRID = 2;                        // ±2 near patches = ±10 units
      // Extend each LOD zone by half the patch diagonal so that even the nearest-edge
      // blades inside the outgoing LOD0 patch have highLODOut=1 before the geometry
      // switches — this eliminates the color/shape change at the transition.
      const HALF_DIAG      = GRASS_PATCH_SIZE * Math.SQRT2 * 0.5; // ≈7.07
      const HALF_DIAG_NEAR = NEAR_SIZE         * Math.SQRT2 * 0.5; // ≈3.54
      const poolN = makePool(geoN, matN, 25);     // near 5-unit patches (dist < ~14)
      const poolH = makePool(geoH, matH, 16);     // dist < uLodDist  + halfDiag
      const poolM = makePool(geoM, matM, 40);     // dist < uLod1Dist + halfDiag
      const poolL = makePool(geoM, matL, 200);    // dist < uMaxDist (large pool for ±90 grid)

      const _frustum       = new THREE.Frustum();
      const _projScreenMat = new THREE.Matrix4();
      const _patchBox      = new THREE.Box3();
      const _bMin          = new THREE.Vector3();
      const _bMax          = new THREE.Vector3();
      let   _iN = 0, _iH = 0, _iM = 0, _iL = 0;

      // ── Capsule player ────────────────────────────────────────────────────────
      const capsule = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.35, 1.0, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0x7744cc, roughness: 0.6 }),
      );
      capsule.position.set(0, 0.85, 0);
      scene.add(capsule);

      // WASD key state
      const keys = {};
      window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyV') {
          followCam = !followCam;
          if (!followCam) {
            // Restore OrbitControls from current camera state so it doesn't snap
            controls.target.copy(capsule.position);
            controls.update();
          }
        }
        e.preventDefault();
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });

      // ── Floor — procedural soil texture ──────────────────────────────────────
      function makeSoilTex(size = 256) {
        const grid = (ix, iy) => {
          let n = ((ix * 1619 + iy * 31337) ^ 0x4e6d2ef7) >>> 0;
          n = Math.imul(n ^ (n >>> 16), 0x45d9f3b) >>> 0;
          return (n >>> 0) / 0xffffffff;
        };
        const smooth = t => t * t * (3 - 2 * t);
        const vnoise = (x, y) => {
          const ix = Math.floor(x), iy = Math.floor(y);
          const fx = x - ix, fy = y - iy;
          const sx = smooth(fx), sy = smooth(fy);
          return grid(ix,iy)*(1-sx)*(1-sy) + grid(ix+1,iy)*sx*(1-sy)
               + grid(ix,iy+1)*(1-sx)*sy   + grid(ix+1,iy+1)*sx*sy;
        };
        // Three soil colours from dark to light (sRGB, will be interpreted by renderer)
        const dark  = [0.13, 0.08, 0.03];  // dark damp earth
        const mid   = [0.22, 0.14, 0.06];  // dry soil
        const light = [0.32, 0.22, 0.10];  // pale dry patch
        const data = new Uint8Array(size * size * 4);
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const fx = x / size * 12, fy = y / size * 12;
            const n = vnoise(fx, fy) * 0.6
                    + vnoise(fx * 2.7, fy * 2.7) * 0.28
                    + vnoise(fx * 7.1, fy * 7.1) * 0.12;
            // blend between dark → mid → light based on noise
            const t = Math.min(1, Math.max(0, n));
            const c = t < 0.5
              ? dark.map((d,i)  => d + (mid[i]   - d)   * (t * 2))
              : mid.map((d,i)   => d + (light[i]  - d)  * ((t - 0.5) * 2));
            const i4 = (y * size + x) * 4;
            data[i4]   = Math.round(c[0] * 255);
            data[i4+1] = Math.round(c[1] * 255);
            data[i4+2] = Math.round(c[2] * 255);
            data[i4+3] = 255;
          }
        }
        const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.needsUpdate = true;
        return t;
      }
      const soilTex = makeSoilTex();
      soilTex.repeat.set(40, 40);

      const floorGeo = new THREE.PlaneGeometry(1000, 1000);
      floorGeo.rotateX(-Math.PI / 2);
      const floorMat = new THREE.MeshStandardMaterial({
        map: soilTex,
        roughness: 1,
        metalness: 0,
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      scene.add(floor);

      // ── Tweakpane UI ─────────────────────────────────────────────────────────
      // Color helpers: Tweakpane uses sRGB hex, Three.js uniforms store linear.
      const toHex = c => '#' + c.clone().convertLinearToSRGB().getHexString();
      const fromHex = (hex, u) => u.value.set(hex).convertSRGBToLinear();

      const pane = new Pane({ title: 'Grass Controls' });

      // ── Sun ──────────────────────────────────────────────────────────────────
      const sunF = pane.addFolder({ title: 'Sun', expanded: true });
      const sunP = { elevation: 43, azimuth: 135, wrap: 0.45 };
      function updateSun() {
        sunCfg.elevation = sunP.elevation;
        sunCfg.azimuth   = sunP.azimuth;
        const sd = makeSunDir();
        dirLight.position.copy(sd.clone().multiplyScalar(50));
        uSunDir.value.copy(sd);
        sky.sunPosition.value.copy(sd);
        // Tint fog toward horizon sky colour (rough approximation of sky at horizon)
        const t = Math.max(0, Math.min(1, sunCfg.elevation / 60));
        const fogCol = new THREE.Color().lerpColors(new THREE.Color(0xd4a57a), new THREE.Color(0x9ecde8), t);
        if (scene.fog) scene.fog.color.copy(fogCol);
      }
      sunF.addBinding(sunP, 'elevation', { label: 'Elevation', min: 5,   max: 85,  step: 1   }).on('change', updateSun);
      sunF.addBinding(sunP, 'azimuth',   { label: 'Azimuth',   min: 0,   max: 360, step: 1   }).on('change', updateSun);
      sunF.addBinding(sunP, 'wrap',      { label: 'Light Wrap', min: 0,  max: 1,   step: 0.01 }).on('change', v => { uSunWrap.value = v.value; });

      // ── Wind ─────────────────────────────────────────────────────────────────
      function applyWindDir(rad) {
        uWindDirX.value = Math.cos(rad);
        uWindDirZ.value = Math.sin(rad);
        uWindAxis.value.set( Math.sin(rad), 0, -Math.cos(rad));
        uCrossAxis.value.set(Math.cos(rad), 0,  Math.sin(rad));
      }
      const windF = pane.addFolder({ title: 'Wind', expanded: true });
      const windP = { strength: 0.4, speed: 1.0, gust: 0.55, flutter: 0.15, direction: 40, drift: true, driftSpeed: 0.08, driftRange: 20 };
      windF.addBinding(windP, 'strength',   { label: 'Strength',    min: 0,   max: 2,   step: 0.01 }).on('change', v => { uWindStr.value   = v.value; });
      windF.addBinding(windP, 'speed',      { label: 'Speed',       min: 0,   max: 4,   step: 0.05 }).on('change', v => { uWindSpeed.value = v.value; });
      windF.addBinding(windP, 'gust',       { label: 'Gust',        min: 0,   max: 1.5, step: 0.01 }).on('change', v => { uWindGust.value  = v.value; });
      windF.addBinding(windP, 'flutter',    { label: 'Flutter',     min: 0,   max: 0.5, step: 0.01 }).on('change', v => { uWindMicro.value = v.value; });
      windF.addBinding(windP, 'direction',  { label: 'Direction °', min: 0,   max: 360, step: 1    }).on('change', v => {
        windBaseRad = v.value * Math.PI / 180;
        if (!windP.drift) applyWindDir(windBaseRad);
      });
      windF.addBinding(windP, 'drift',      { label: 'Dir Drift' });
      windF.addBinding(windP, 'driftSpeed', { label: 'Drift Speed', min: 0.01, max: 0.5, step: 0.01 });
      windF.addBinding(windP, 'driftRange', { label: 'Drift Range°', min: 1,  max: 60,  step: 1    });

      // ── Grass Shape ───────────────────────────────────────────────────────────
      const shapeF = pane.addFolder({ title: 'Blade Shape', expanded: false });
      const shapeP = { width: 0.055, height: 0.78, density: 1.0, normalRound: 0.3, viewThicken: 2.0, leafPeak: 0.25, tipSharp: 1.0 };
      shapeF.addBinding(shapeP, 'width',        { label: 'Width',         min: 0.01, max: 0.2,  step: 0.001 }).on('change', v => { uGrassWidth.value    = v.value; });
      shapeF.addBinding(shapeP, 'height',       { label: 'Height',        min: 0.2,  max: 2.0,  step: 0.01  }).on('change', v => { uGrassHeight.value   = v.value; });
      shapeF.addBinding(shapeP, 'density',      { label: 'Density',       min: 0.1,  max: 2.0,  step: 0.05  }).on('change', v => {
        uBladeDensityRegular.value = v.value;
        uBladeDensityNear.value    = v.value;
      });
      shapeF.addBinding(shapeP, 'normalRound',  { label: 'Normal Round',  min: 0,    max: 0.5,  step: 0.01  }).on('change', v => { uNormalRound.value   = v.value; });
      shapeF.addBinding(shapeP, 'viewThicken',  { label: 'View Thicken',  min: 1.0,  max: 4.0,  step: 0.05  }).on('change', v => { uViewThicken.value   = v.value; });
      shapeF.addBinding(shapeP, 'leafPeak',     { label: 'Leaf Peak',       min: 0.0, max: 0.6,  step: 0.01 }).on('change', v => { uLeafPeak.value  = v.value; });
      shapeF.addBinding(shapeP, 'tipSharp',     { label: 'Tip Sharpness',   min: 0.3, max: 3.0,  step: 0.05 }).on('change', v => { uTipSharp.value  = v.value; });

      // ── Colors ───────────────────────────────────────────────────────────────
      const colF = pane.addFolder({ title: 'Colors', expanded: false });
      const colP = {
        base1: toHex(uBaseColor1.value),  base2: toHex(uBaseColor2.value),
        tip1:  toHex(uTipColor1.value),   tip2:  toHex(uTipColor2.value),
        lush:  toHex(uLushColor.value),   bleach: toHex(uBleachedColor.value),
        gradient: 3.2, variation: 0.45,
      };
      colF.addBinding(colP, 'base1',    { label: 'Base 1',    view: 'color' }).on('change', v => fromHex(v.value, uBaseColor1));
      colF.addBinding(colP, 'base2',    { label: 'Base 2',    view: 'color' }).on('change', v => fromHex(v.value, uBaseColor2));
      colF.addBinding(colP, 'tip1',     { label: 'Tip 1',     view: 'color' }).on('change', v => fromHex(v.value, uTipColor1));
      colF.addBinding(colP, 'tip2',     { label: 'Tip 2',     view: 'color' }).on('change', v => fromHex(v.value, uTipColor2));
      colF.addBinding(colP, 'lush',     { label: 'Lush',      view: 'color' }).on('change', v => fromHex(v.value, uLushColor));
      colF.addBinding(colP, 'bleach',   { label: 'Bleached',  view: 'color' }).on('change', v => fromHex(v.value, uBleachedColor));
      colF.addBinding(colP, 'gradient', { label: 'Gradient',  min: 1, max: 6,  step: 0.1 }).on('change', v => { uGradientCurve.value  = v.value; });
      colF.addBinding(colP, 'variation',{ label: 'Variation', min: 0, max: 1,  step: 0.01}).on('change', v => { uColorVariation.value = v.value; });

      // ── SSS ───────────────────────────────────────────────────────────────────
      const sssF = pane.addFolder({ title: 'SSS / Translucency', expanded: false });
      const sssP = {
        intensity: 0.9, color: toHex(uBsColor.value),
        power: 1.4, front: 0.55, rim: 0.65,
      };
      sssF.addBinding(sssP, 'intensity',  { label: 'Intensity',  min: 0, max: 2,   step: 0.01 }).on('change', v => { uBsIntensity.value   = v.value; });
      sssF.addBinding(sssP, 'color',      { label: 'Color',      view: 'color'                }).on('change', v => fromHex(v.value, uBsColor));
      sssF.addBinding(sssP, 'power',      { label: 'Power',      min: 0.5, max: 5, step: 0.05 }).on('change', v => { uBsPower.value       = v.value; });
      sssF.addBinding(sssP, 'front',      { label: 'Front Scat', min: 0, max: 1,   step: 0.01 }).on('change', v => { uFrontScatter.value  = v.value; });
      sssF.addBinding(sssP, 'rim',        { label: 'Rim',        min: 0, max: 1,   step: 0.01 }).on('change', v => { uRimSSS.value        = v.value; });

      // ── Specular V1 (anisotropic) ──────────────────────────────────────────────
      const sp1F = pane.addFolder({ title: 'Specular (Anisotropic)', expanded: false });
      const sp1P = { enabled: true, intensity: 0.5, color: toHex(uSpecV1Color.value) };
      sp1F.addBinding(sp1P, 'enabled',   { label: 'Enable' }).on('change', v => {
        uSpecV1Intensity.value = v.value ? sp1P.intensity : 0;
      });
      sp1F.addBinding(sp1P, 'intensity', { label: 'Intensity', min: 0, max: 3, step: 0.01 }).on('change', v => {
        if (sp1P.enabled) uSpecV1Intensity.value = v.value;
      });
      sp1F.addBinding(sp1P, 'color',     { label: 'Color', view: 'color' }).on('change', v => fromHex(v.value, uSpecV1Color));

      // ── Specular V2 (scattered noise) ─────────────────────────────────────────
      const sp2F = pane.addFolder({ title: 'Specular (Scattered)', expanded: false });
      const sp2P = { enabled: true, intensity: 0.25, color: toHex(uSpecV2Color.value), power: 12.0 };
      sp2F.addBinding(sp2P, 'enabled',   { label: 'Enable' }).on('change', v => {
        uSpecV2Intensity.value = v.value ? sp2P.intensity : 0;
      });
      sp2F.addBinding(sp2P, 'intensity', { label: 'Intensity', min: 0, max: 3,  step: 0.01 }).on('change', v => {
        if (sp2P.enabled) uSpecV2Intensity.value = v.value;
      });
      sp2F.addBinding(sp2P, 'color',     { label: 'Color',     view: 'color'               }).on('change', v => fromHex(v.value, uSpecV2Color));
      sp2F.addBinding(sp2P, 'power',     { label: 'Power',     min: 1, max: 40, step: 0.5  }).on('change', v => { uSpecV2Power.value = v.value; });

      // ── LOD ───────────────────────────────────────────────────────────────────
      const lodF = pane.addFolder({ title: 'LOD', expanded: true });
      const lodP = { lod0Dist: 10, lod1Dist: 24, fadeRange: 3, maxDist: 90 };
      lodF.addBinding(lodP, 'lod0Dist',  { label: 'LOD0→1 Dist',  min: 5,  max: 30,  step: 0.5 }).on('change', v => { uLod0Dist.value    = v.value; uLodDist.value = v.value; });
      lodF.addBinding(lodP, 'lod1Dist',  { label: 'LOD1→2 Dist',  min: 10, max: 60,  step: 0.5 }).on('change', v => { uLod1Dist.value    = v.value; });
      lodF.addBinding(lodP, 'fadeRange', { label: 'Fade Range',   min: 0.5, max: 10, step: 0.5 }).on('change', v => { uLodFadeRange.value = v.value; });
      lodF.addBinding(lodP, 'maxDist',   { label: 'Max Dist',     min: 20, max: 150, step: 1   }).on('change', v => { uMaxDist.value      = v.value; });

      // ── Environment ───────────────────────────────────────────────────────────
      const envF = pane.addFolder({ title: 'Environment', expanded: false });
      const envP = { ao: 1.0, skyMin: 0.55, skyMax: 0.7, fog: true, fogDensity: 0.018,
                     groundColor: '#ffffff' };
      envF.addBinding(envP, 'ao',     { label: 'AO Intensity', min: 0, max: 2,  step: 0.01 }).on('change', v => { uAoIntensity.value   = v.value; });
      envF.addBinding(envP, 'skyMin', { label: 'Sky Blend Min',min: 0, max: 1,  step: 0.01 }).on('change', v => { uMinSkyBlend.value   = v.value; });
      envF.addBinding(envP, 'skyMax', { label: 'Sky Blend Max',min: 0, max: 1,  step: 0.01 }).on('change', v => { uMaxSkyBlend.value   = v.value; });
      // Mutate fog density in-place — never create a new FogExp2 (that recompiles all shaders → freeze)
      envF.addBinding(envP, 'fog',        { label: 'Fog' }).on('change', v => {
        scene.fog.density = v.value ? envP.fogDensity : 0;
      });
      envF.addBinding(envP, 'fogDensity', { label: 'Fog Density', min: 0, max: 0.06, step: 0.001 }).on('change', v => {
        if (envP.fog) scene.fog.density = v.value;
      });
      envF.addBinding(envP, 'groundColor', { label: 'Ground Color', view: 'color' }).on('change', v => {
        floorMat.color.set(v.value);
      });

      // ── Interaction ───────────────────────────────────────────────────────────
      const iactF = pane.addFolder({ title: 'Interaction', expanded: false });
      const iactP = { enabled: false, range: 1.8, strength: 1.2 };
      function applyInteract() {
        uInteractionRange.value    = iactP.enabled ? iactP.range    : 999;
        uInteractionStrength.value = iactP.enabled ? iactP.strength : 0;
      }
      iactF.addBinding(iactP, 'enabled',  { label: 'Enable' }).on('change', applyInteract);
      iactF.addBinding(iactP, 'range',    { label: 'Range',    min: 0.5, max: 5,  step: 0.1 }).on('change', applyInteract);
      iactF.addBinding(iactP, 'strength', { label: 'Strength', min: 0,   max: 3,  step: 0.1 }).on('change', applyInteract);

      // init sun
      updateSun();

      // ── Resize ────────────────────────────────────────────────────────────────
      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // ── Camera modes ─────────────────────────────────────────────────────────
      // V key toggles between free-orbit and auto-follow
      let followCam = false;
      const FOLLOW_OFFSET = new THREE.Vector3(0, 3.5, -9); // behind + above capsule
      const _followTarget = new THREE.Vector3();
      const _followPos    = new THREE.Vector3();
      const _euler        = new THREE.Euler(0, 0, 0, 'YXZ');

      // ── Render Loop ───────────────────────────────────────────────────────────
      const timer = new THREE.Timer();
      const _camFwd   = new THREE.Vector3();
      const _camRight = new THREE.Vector3();
      const _move     = new THREE.Vector3();
      const WALK_SPEED = 8;

      renderer.setAnimationLoop(() => {
        timer.update();
        const dt = Math.min(timer.getDelta(), 0.05);
        uTime.value = timer.getElapsed();

        // ── Wind direction drift ────────────────────────────────────────────────
        if (windP.drift) {
          const elapsed = uTime.value;
          const driftRad = windBaseRad + Math.sin(elapsed * windP.driftSpeed) * (windP.driftRange * Math.PI / 180);
          applyWindDir(driftRad);
        }

        // ── WASD movement ───────────────────────────────────────────────────────
        _move.set(0, 0, 0);

        if (followCam) {
          // Follow mode: A/D rotate capsule, W/S walk forward/back along its facing.
          // Never strafe — strafe changes facing via atan2 which causes spin.
          const TURN_SPEED = 2.2;
          if (keys['KeyA'] || keys['ArrowLeft'])  capsule.rotation.y += TURN_SPEED * dt;
          if (keys['KeyD'] || keys['ArrowRight']) capsule.rotation.y -= TURN_SPEED * dt;

          _camFwd.set(Math.sin(capsule.rotation.y), 0, Math.cos(capsule.rotation.y));
          if (keys['KeyW'] || keys['ArrowUp'])   _move.addScaledVector(_camFwd,  1);
          if (keys['KeyS'] || keys['ArrowDown']) _move.addScaledVector(_camFwd, -1);

          if (_move.lengthSq() > 0) {
            _move.normalize().multiplyScalar(WALK_SPEED * dt);
            capsule.position.add(_move);
            capsule.position.y = 0.85;
          }
        } else {
          // Orbit mode: strafe in all 4 dirs relative to camera, capsule faces movement.
          camera.getWorldDirection(_camFwd);
          _camFwd.y = 0;
          _camFwd.normalize();
          _camRight.crossVectors(_camFwd, new THREE.Vector3(0, 1, 0));

          if (keys['KeyW'] || keys['ArrowUp'])    _move.addScaledVector(_camFwd,   1);
          if (keys['KeyS'] || keys['ArrowDown'])  _move.addScaledVector(_camFwd,  -1);
          if (keys['KeyA'] || keys['ArrowLeft'])  _move.addScaledVector(_camRight,-1);
          if (keys['KeyD'] || keys['ArrowRight']) _move.addScaledVector(_camRight, 1);

          if (_move.lengthSq() > 0) {
            _move.normalize().multiplyScalar(WALK_SPEED * dt);
            capsule.position.add(_move);
            capsule.position.y = 0.85;
            capsule.rotation.y = Math.atan2(_move.x, _move.z);
          }
        }

        // ── Camera update ───────────────────────────────────────────────────────
        if (followCam) {
          // Auto-follow: camera sits behind+above capsule, smoothly lerps in
          controls.enabled = false;
          _euler.set(0, capsule.rotation.y, 0);
          _followPos.copy(FOLLOW_OFFSET).applyEuler(_euler).add(capsule.position);
          camera.position.lerp(_followPos, 0.1);
          _followTarget.copy(capsule.position).add(new THREE.Vector3(0, 0.8, 0));
          camera.lookAt(_followTarget);
        } else {
          // Free orbit: OrbitControls takes over, target tracks capsule
          controls.enabled = true;
          controls.target.lerp(capsule.position, 0.15);
          controls.update();
        }

        // ── Grass pool update ─────────────────────────────────────────────────
        for (let i = 0; i < poolN.length; i++) poolN[i].visible = false;
        for (let i = 0; i < poolH.length; i++) poolH[i].visible = false;
        for (let i = 0; i < poolM.length; i++) poolM[i].visible = false;
        for (let i = 0; i < poolL.length; i++) poolL[i].visible = false;
        _iN = 0; _iH = 0; _iM = 0; _iL = 0;

        _projScreenMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
        _frustum.setFromProjectionMatrix(_projScreenMat);

        // Near ring: 5-unit patches snapped in 5-unit steps for dense up-close coverage
        const snapNX = Math.round(capsule.position.x / NEAR_SIZE) * NEAR_SIZE;
        const snapNZ = Math.round(capsule.position.z / NEAR_SIZE) * NEAR_SIZE;
        const halfN = NEAR_SIZE * 0.5;
        for (let ix = -NEAR_GRID; ix <= NEAR_GRID; ix++) {
          for (let iz = -NEAR_GRID; iz <= NEAR_GRID; iz++) {
            const px = snapNX + ix * NEAR_SIZE;
            const pz = snapNZ + iz * NEAR_SIZE;
            _bMin.set(px - halfN, -0.5, pz - halfN);
            _bMax.set(px + halfN,  2.5, pz + halfN);
            _patchBox.set(_bMin, _bMax);
            if (!_frustum.intersectsBox(_patchBox)) continue;
            if (_iN < poolN.length) {
              poolN[_iN].position.set(px, 0, pz);
              poolN[_iN].visible = true;
              _iN++;
            }
          }
        }

        // Main grid: 10-unit patches with LOD switching
        const SNAP = GRASS_PATCH_SIZE;
        const snapX = Math.round(capsule.position.x / SNAP) * SNAP;
        const snapZ = Math.round(capsule.position.z / SNAP) * SNAP;
        const halfP = GRASS_PATCH_SIZE * 0.5;

        for (let ix = -GRID_HALF; ix <= GRID_HALF; ix++) {
          for (let iz = -GRID_HALF; iz <= GRID_HALF; iz++) {
            const px = snapX + ix * GRASS_PATCH_SIZE;
            const pz = snapZ + iz * GRASS_PATCH_SIZE;
            const dx = px - capsule.position.x;
            const dz = pz - capsule.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist >= uMaxDist.value) continue;

            _bMin.set(px - halfP, -0.5, pz - halfP);
            _bMax.set(px + halfP,  2.5, pz + halfP);
            _patchBox.set(_bMin, _bMax);
            if (!_frustum.intersectsBox(_patchBox)) continue;

            // Switch geometry only when the patch is far enough that ALL its blades
            // (including nearest-corner ones) have highLODOut=1. This prevents the
            // color/shape change that occurs when close-range blades suddenly go from
            // 15-vert to 7-vert with highLODOut still near 0.
            let mesh = null;
            if      (dist < uLodDist.value  + HALF_DIAG) { if (_iH < poolH.length) mesh = poolH[_iH++]; }
            else if (dist < uLod1Dist.value + HALF_DIAG) { if (_iM < poolM.length) mesh = poolM[_iM++]; }
            else                                          { if (_iL < poolL.length) mesh = poolL[_iL++]; }

            if (mesh) {
              mesh.position.set(px, 0, pz);
              mesh.visible = true;
            }
          }
        }

        // Keep player pos uniform in sync for grass interaction
        uPlayerPos.value.copy(capsule.position);

        stats.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
