<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splatmap Painter 4 — Sculpt + Live Foliage</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; }

      /* Tweakpane — anchor top-left */
      .tp-dfwv {
        position: fixed !important;
        top: 16px !important;
        left: 16px !important;
        width: 270px !important;
        z-index: 20;
      }

      #mode-badge {
        position: fixed; top: 16px; right: 16px; z-index: 20;
        font: bold 13px "SF Mono", monospace;
        padding: 6px 14px; border-radius: 6px;
        pointer-events: none;
        transition: background 0.2s, color 0.2s;
      }
      #mode-badge.view   { background: rgba(40,40,40,0.8);   color: #888; }
      #mode-badge.paint  { background: rgba(40,160,80,0.9);  color: #fff; }
      #mode-badge.sculpt { background: rgba(200,120,40,0.9); color: #fff; }
      #mode-badge.place  { background: rgba(180,60,200,0.9); color: #fff; }

      #info {
        position: fixed; bottom: 16px; left: 16px; z-index: 10;
        font: 12px/1.5 "SF Mono", monospace; color: #b0d890;
        background: rgba(0,0,0,0.55); padding: 8px 12px;
        border-radius: 6px; pointer-events: none; backdrop-filter: blur(4px);
      }
      #info span { color: #e0f0c0; font-weight: 600; }

      #splatmap-preview {
        position: fixed; bottom: 16px; right: 16px; z-index: 20;
        border: 2px solid rgba(255,255,255,0.3); border-radius: 6px;
        image-rendering: pixelated; width: 128px; height: 128px;
      }
      #heightmap-preview {
        position: fixed; bottom: 16px; right: 156px; z-index: 20;
        border: 2px solid rgba(255,220,100,0.4); border-radius: 6px;
        image-rendering: pixelated; width: 128px; height: 128px;
      }
      .preview-label {
        position: fixed; bottom: 148px; z-index: 21;
        font: 10px "SF Mono", monospace;
        color: rgba(255,255,255,0.5); pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js",
          "tweakpane": "https://esm.sh/tweakpane@4.0.4"
        }
      }
    </script>
  </head>
  <body>
    <!-- hidden file inputs -->
    <input type="file" id="file-input"        accept="image/png" style="display:none" />
    <input type="file" id="hmap-file-input"   accept="image/png" style="display:none" />
    <input type="file" id="cliffs-file-input" accept=".json"     style="display:none" />

    <div id="mode-badge" class="view">VIEW MODE</div>

    <div id="info">
      Terrain Editor &mdash; <span id="backend">loading…</span> &bull;
      <span id="obj-count">0 objects</span>
    </div>

    <canvas id="heightmap-preview" width="128" height="128"></canvas>
    <div class="preview-label" style="right:156px">Heightmap</div>
    <canvas id="splatmap-preview" width="128" height="128"></canvas>
    <div class="preview-label" style="right:16px">Splatmap</div>

    <script type="module">
      import * as THREE from "three";
      import { MeshStandardNodeMaterial } from "three";
      import {
        texture,
        vec3,
        float,
        uniform,
        mix,
        positionWorld,
        Fn,
        normalWorld,
        dot,
        smoothstep,
        normalMap,
        clamp,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { TransformControls } from "three/addons/controls/TransformControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { Pane } from "tweakpane";
      import Stats from "stats-gl";

      // ─── NOISE ───────────────────────────────
      function hash(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
      }
      function smoothNoise(x, y) {
        const ix = Math.floor(x),
          iy = Math.floor(y);
        const fx = x - ix,
          fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx),
          uy = fy * fy * (3 - 2 * fy);
        const a = hash(ix, iy),
          b = hash(ix + 1, iy);
        const c = hash(ix, iy + 1),
          d = hash(ix + 1, iy + 1);
        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }
      function fbm(x, y, oct = 6) {
        let v = 0,
          amp = 1,
          freq = 1,
          tot = 0;
        for (let i = 0; i < oct; i++) {
          v += smoothNoise(x * freq, y * freq) * amp;
          tot += amp;
          amp *= 0.5;
          freq *= 2.1;
        }
        return v / tot;
      }
      function ridged(x, y, oct = 4) {
        let v = 0,
          amp = 1,
          freq = 1,
          tot = 0;
        for (let i = 0; i < oct; i++) {
          let n = smoothNoise(x * freq, y * freq);
          n = 1 - Math.abs(n * 2 - 1);
          n *= n;
          v += n * amp;
          tot += amp;
          amp *= 0.5;
          freq *= 2.1;
        }
        return v / tot;
      }

      // ─── CONSTANTS ───────────────────────────
      const TERRAIN_SIZE = 800;
      const TERRAIN_RES = 512;    // data resolution — heightData array + saved PNG
      const DISPLAY_RES = 128;    // display resolution — visible mesh (fast to render)
      const HEIGHT_SCALE = 40;
      const NOISE_FREQ = 0.0045;
      const SPLAT_RES = 512;
      const VERTS = TERRAIN_RES + 1;         // 513 — heightData dimensions
      const DISPLAY_VERTS = DISPLAY_RES + 1; // 129 — geometry vertex count per side
      const PI = Math.PI;

      // ─── HEIGHT DATA (mutable, drives both geometry and sampleHeight) ───
      const heightData = new Float32Array(VERTS * VERTS);

      function buildHeightData() {
        heightData.fill(0);
      }
      buildHeightData();

      // Bilinear sample from heightData — used for sphere placement + sculpt falloff
      function sampleHeight(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const ix0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(TERRAIN_RES, ix0 + 1);
        const iz1 = Math.min(TERRAIN_RES, iz0 + 1);
        const tx = fx - ix0,
          tz = fz - iz0;
        const h00 = heightData[iz0 * VERTS + ix0],
          h10 = heightData[iz0 * VERTS + ix1];
        const h01 = heightData[iz1 * VERTS + ix0],
          h11 = heightData[iz1 * VERTS + ix1];
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );
      }

      // ─── BIOME COLORS ────────────────────────
      const BIOME_COLORS = {
        forest: { r: 180, g: 60, b: 40 },
        grass: { r: 40, g: 180, b: 40 },
        village: { r: 40, g: 60, b: 200 },
        erase: { r: 0, g: 0, b: 0 },
      };
      const SPHERE_THRESHOLD = 80;

      // ─── SPLATMAP CANVAS ─────────────────────
      const splatCanvas = document.createElement("canvas");
      splatCanvas.width = splatCanvas.height = SPLAT_RES;
      const splatCtx = splatCanvas.getContext("2d");
      splatCtx.fillStyle = "#000";
      splatCtx.fillRect(0, 0, SPLAT_RES, SPLAT_RES);

      const previewCanvas = document.getElementById("splatmap-preview");
      const previewCtx = previewCanvas.getContext("2d");
      function syncPreview() {
        previewCtx.drawImage(splatCanvas, 0, 0, 128, 128);
      }
      syncPreview();

      const hmapCanvas = document.getElementById("heightmap-preview");
      const hmapCtx = hmapCanvas.getContext("2d");
      const hmapImg = hmapCtx.createImageData(128, 128);
      function syncHeightmapPreview() {
        for (let py = 0; py < 128; py++) {
          for (let px = 0; px < 128; px++) {
            // sample heightData with bilinear interpolation via sampleHeight
            const wx = (px / 127) * TERRAIN_SIZE - TERRAIN_SIZE / 2;
            const wz = (py / 127) * TERRAIN_SIZE - TERRAIN_SIZE / 2;
            const h = sampleHeight(wx, wz);
            const v = Math.round(((h + HEIGHT_SCALE) / (HEIGHT_SCALE * 2)) * 255);
            const c = Math.max(0, Math.min(255, v));
            const i = (py * 128 + px) * 4;
            hmapImg.data[i] = c;
            hmapImg.data[i + 1] = c;
            hmapImg.data[i + 2] = c;
            hmapImg.data[i + 3] = 255;
          }
        }
        hmapCtx.putImageData(hmapImg, 0, 0);
      }

      // ─── COORDINATE HELPERS ──────────────────
      function worldToUV(wx, wz) {
        return {
          u: (wx + TERRAIN_SIZE / 2) / TERRAIN_SIZE,
          v: 1.0 - (wz + TERRAIN_SIZE / 2) / TERRAIN_SIZE,
        };
      }
      function uvToWorld(u, v) {
        return {
          x: u * TERRAIN_SIZE - TERRAIN_SIZE / 2,
          z: (1.0 - v) * TERRAIN_SIZE - TERRAIN_SIZE / 2,
        };
      }

      // ─── TWEAKPANE PARAMS ────────────────────
      const PARAMS = {
        mode:          "view",
        biome:         "forest",
        sculptTool:    "raise",
        cliffModel:    0,
        sinkOffset:    2,
        brushSize:     20,
        brushStrength: 60,
        tileGrass:     0.05,
        tileGround:    0.03,
        slopeStart:    0.72,
        slopeEnd:      0.88,
      };

      // ─── STATE ───────────────────────────────
      let currentMode = "view"; // "view" | "paint" | "sculpt"
      let isMouseDown = false;
      let currentBiome = "forest";
      let sculptMode = "raise"; // "raise" | "lower" | "smooth"
      let flattenTargetY = 0;   // sampled on mousedown when alt+drag
      let brushSize = 20;
      let brushStr = 60;
      let instancedObjs = null;
      let splatTex = null;
      let terrainGeo = null; // set in init, needed by sculpt

      // ─── CLIFF STATE ─────────────────────────
      const CLIFF_MODELS = ["models/cliff1.glb", "models/cliff2.glb", "models/cliff3.glb"];
      let cliffTemplates = [];
      let cliffObjects = [];
      let selectedCliff = null;
      let activeCliffModel = 0;
      let cliffSinkOffset = 2;
      let transformControls = null;
      let tcHelper = null;

      // ─── UNDO / REDO ─────────────────────────
      const MAX_UNDO = 30;
      const undoStack = [];
      const redoStack = [];

      function snapshotState() {
        return {
          height: heightData.slice(),
          splat: splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES),
        };
      }
      function pushUndo() {
        undoStack.push(snapshotState());
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0; // new action clears redo
      }
      function applySnapshot(snap) {
        heightData.set(snap.height);
        syncGeometry();
        splatCtx.putImageData(snap.splat, 0, 0);
        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;
      }
      function undo() {
        if (!undoStack.length) return;
        redoStack.push(snapshotState());
        applySnapshot(undoStack.pop());
      }
      function redo() {
        if (!redoStack.length) return;
        undoStack.push(snapshotState());
        applySnapshot(redoStack.pop());
      }

      // ─── PAINT ───────────────────────────────
      function paintAt(wx, wz) {
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES,
          cy = v * SPLAT_RES;
        const col = BIOME_COLORS[currentBiome];
        const alpha = brushStr / 100;
        const grad = splatCtx.createRadialGradient(
          cx,
          cy,
          0,
          cx,
          cy,
          brushSize,
        );
        grad.addColorStop(0, `rgba(${col.r},${col.g},${col.b},${alpha})`);
        grad.addColorStop(
          0.5,
          `rgba(${col.r},${col.g},${col.b},${alpha * 0.55})`,
        );
        grad.addColorStop(1, `rgba(${col.r},${col.g},${col.b},0)`);
        splatCtx.globalCompositeOperation = "source-over";
        splatCtx.fillStyle = grad;
        splatCtx.beginPath();
        splatCtx.arc(cx, cy, brushSize, 0, PI * 2);
        splatCtx.fill();
        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;
      }

      // ─── BRUSH RADIUS (module-level so sculptAt + paintAt can use it) ───
      function brushWorldRadius() {
        return (brushSize / SPLAT_RES) * TERRAIN_SIZE;
      }

      // ─── SCULPT ──────────────────────────────
      // plain drag = raise | shift+drag = lower | ctrl+drag = smooth
      function sculptAt(wx, wz, e) {
        if (!terrainGeo) return;
        const mode = e?.altKey ? "flatten" : e?.ctrlKey ? "smooth" : e?.shiftKey ? "lower" : "raise";
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const strength = (brushStr / 100) * 0.4;

        // Limit iteration to affected grid region
        const cellSize = TERRAIN_SIZE / TERRAIN_RES;
        const gridR = Math.ceil(radius / cellSize) + 1;
        const cx = Math.round((wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cz = Math.round((wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const ixMin = Math.max(0, cx - gridR),
          ixMax = Math.min(TERRAIN_RES, cx + gridR);
        const izMin = Math.max(0, cz - gridR),
          izMax = Math.min(TERRAIN_RES, cz + gridR);

        if (mode === "smooth") {
          // Two-pass: read then write to avoid order dependency
          const scratch = new Float32Array(
            (ixMax - ixMin + 1) * (izMax - izMin + 1),
          );
          let si = 0;
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) {
                scratch[si++] = heightData[iz * VERTS + ix];
                continue;
              }
              // Average 3x3 neighbors
              let sum = 0,
                count = 0;
              for (let dz = -1; dz <= 1; dz++)
                for (let dx = -1; dx <= 1; dx++) {
                  const nx2 = Math.max(0, Math.min(TERRAIN_RES, ix + dx));
                  const nz2 = Math.max(0, Math.min(TERRAIN_RES, iz + dz));
                  sum += heightData[nz2 * VERTS + nx2];
                  count++;
                }
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const avg = sum / count;
              scratch[si++] =
                heightData[iz * VERTS + ix] +
                (avg - heightData[iz * VERTS + ix]) * falloff * strength * 2;
            }
          }
          si = 0;
          for (let iz = izMin; iz <= izMax; iz++)
            for (let ix = ixMin; ix <= ixMax; ix++)
              heightData[iz * VERTS + ix] = scratch[si++];
        } else if (mode === "flatten") {
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const smooth = falloff * falloff;
              const current = heightData[iz * VERTS + ix];
              heightData[iz * VERTS + ix] += (flattenTargetY - current) * smooth * strength * 2;
            }
          }
        } else {
          const dir = mode === "raise" ? 1 : -1;
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const smooth = falloff * falloff;
              heightData[iz * VERTS + ix] += dir * smooth * strength;
            }
          }
        }
        syncGeometry();
      }

      function syncGeometry() {
        if (!terrainGeo) return;
        const pos = terrainGeo.attributes.position;
        for (let iz = 0; iz <= DISPLAY_RES; iz++) {
          for (let ix = 0; ix <= DISPLAY_RES; ix++) {
            const wx = (-0.5 + ix / DISPLAY_RES) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / DISPLAY_RES) * TERRAIN_SIZE;
            pos.setY(iz * DISPLAY_VERTS + ix, sampleHeight(wx, wz));
          }
        }
        pos.needsUpdate = true;
        terrainGeo.computeVertexNormals();
        syncHeightmapPreview();
      }

      // ─── LIVE FOLIAGE ────────────────────────
      function generateObjects(scene) {
        if (instancedObjs) {
          scene.remove(instancedObjs);
          instancedObjs.geometry.dispose();
          instancedObjs.material.dispose();
          instancedObjs = null;
        }

        const pixels = splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES).data;
        const positions = [];
        const STEP = 4;

        for (let iy = 0; iy < SPLAT_RES; iy += STEP) {
          for (let ix = 0; ix < SPLAT_RES; ix += STEP) {
            const idx = (iy * SPLAT_RES + ix) * 4;
            const r = pixels[idx],
              g = pixels[idx + 1],
              b = pixels[idx + 2];
            if (r >= SPHERE_THRESHOLD && r > g + 20 && r > b + 20) {
              const { x, z } = uvToWorld(ix / SPLAT_RES, iy / SPLAT_RES);
              const cellSize = TERRAIN_SIZE / (SPLAT_RES / STEP);
              const jx = (Math.random() - 0.5) * cellSize;
              const jz = (Math.random() - 0.5) * cellSize;
              const wx = x + jx,
                wz = z + jz;
              // Slope exclusion: skip steep faces
              const eps = 1.5;
              const dydx =
                (sampleHeight(wx + eps, wz) - sampleHeight(wx - eps, wz)) /
                (2 * eps);
              const dydz =
                (sampleHeight(wx, wz + eps) - sampleHeight(wx, wz - eps)) /
                (2 * eps);
              const slope = Math.sqrt(dydx * dydx + dydz * dydz);
              if (slope > 1.2) continue; // skip cliffs
              positions.push(new THREE.Vector3(wx, sampleHeight(wx, wz), wz));
            }
          }
        }

        if (positions.length === 0) {
          document.getElementById("obj-count").textContent = "0 objects";
          return;
        }

        const geo = new THREE.SphereGeometry(0.5, 8, 6);
        const mat = new THREE.MeshStandardMaterial({
          color: 0x2d8c2d,
          roughness: 0.8,
        });
        instancedObjs = new THREE.InstancedMesh(geo, mat, positions.length);
        instancedObjs.castShadow = true;
        instancedObjs.receiveShadow = true;

        const dummy = new THREE.Object3D();
        positions.forEach((pos, i) => {
          dummy.position.set(pos.x, pos.y + 0.5, pos.z);
          dummy.scale.setScalar(0.5 + Math.random() * 0.9);
          dummy.updateMatrix();
          instancedObjs.setMatrixAt(i, dummy.matrix);
        });
        instancedObjs.instanceMatrix.needsUpdate = true;
        scene.add(instancedObjs);
        document.getElementById("obj-count").textContent =
          `${positions.length.toLocaleString()} objects`;
      }

      // ─── SAVE / LOAD ─────────────────────────
      function saveSplatmap() {
        const a = document.createElement("a");
        a.download = "splatmap.png";
        a.href = splatCanvas.toDataURL("image/png");
        a.click();
      }
      function loadSplatmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            splatCtx.clearRect(0, 0, SPLAT_RES, SPLAT_RES);
            splatCtx.drawImage(img, 0, 0, SPLAT_RES, SPLAT_RES);
            syncPreview();
            if (splatTex) splatTex.needsUpdate = true;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // ─── HEIGHTMAP SAVE / LOAD ───────────────
      function saveHeightmap() {
        const c = document.createElement("canvas");
        c.width = c.height = VERTS;
        const ctx = c.getContext("2d");
        const imgData = ctx.createImageData(VERTS, VERTS);
        for (let i = 0; i < heightData.length; i++) {
          const v = Math.round(((heightData[i] + HEIGHT_SCALE) / (HEIGHT_SCALE * 2)) * 255);
          imgData.data[i * 4 + 0] = Math.max(0, Math.min(255, v));
          imgData.data[i * 4 + 1] = Math.max(0, Math.min(255, v));
          imgData.data[i * 4 + 2] = Math.max(0, Math.min(255, v));
          imgData.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
        const a = document.createElement("a");
        a.download = "heightmap.png";
        a.href = c.toDataURL("image/png");
        a.click();
      }
      function loadHeightmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas");
            c.width = c.height = VERTS;
            const ctx = c.getContext("2d");
            ctx.drawImage(img, 0, 0, VERTS, VERTS);
            const pixels = ctx.getImageData(0, 0, VERTS, VERTS).data;
            for (let i = 0; i < heightData.length; i++) {
              heightData[i] = (pixels[i * 4] / 255) * HEIGHT_SCALE * 2 - HEIGHT_SCALE;
            }
            syncGeometry();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // ─── CLIFF SAVE ──────────────────────────
      function saveCliffs() {
        const data = cliffObjects.map(root => ({
          modelIndex: root.userData.modelIndex ?? 0,
          x: root.position.x, y: root.position.y, z: root.position.z,
          rx: root.rotation.x, ry: root.rotation.y, rz: root.rotation.z,
          sx: root.scale.x, sy: root.scale.y, sz: root.scale.z,
        }));
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.download = "cliffs.json";
        a.href = URL.createObjectURL(blob);
        a.click();
      }

      // ─── MAIN ────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU")
            ? "WebGPU ✓"
            : "WebGL fallback";

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 500, 1500);

        const camera = new THREE.PerspectiveCamera(
          60,
          innerWidth / innerHeight,
          0.5,
          6000,
        );
        camera.position.set(0, 250, 450);
        camera.lookAt(0, 0, 0);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 10, 0);
        orbit.maxPolarAngle = PI * 0.48;
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        orbit.mouseButtons = {
          LEFT: THREE.MOUSE.ROTATE,
          MIDDLE: THREE.MOUSE.DOLLY,
          RIGHT: THREE.MOUSE.PAN,
        };
        orbit.update();

        // ── LIGHTING ──
        function sunDir(azDeg, elDeg) {
          const az = (azDeg * PI) / 180,
            el = (elDeg * PI) / 180;
          return new THREE.Vector3(
            Math.cos(el) * Math.cos(az),
            Math.sin(el),
            Math.cos(el) * Math.sin(az),
          ).normalize();
        }
        const sun = sunDir(135, 43);
        const dirLight = new THREE.DirectionalLight("#fff5e0", 2.2);
        dirLight.position.copy(sun.clone().multiplyScalar(600));
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 1500;
        dirLight.shadow.camera.left = dirLight.shadow.camera.bottom =
          -TERRAIN_SIZE * 0.7;
        dirLight.shadow.camera.right = dirLight.shadow.camera.top =
          TERRAIN_SIZE * 0.7;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);
        const shadowTarget = new THREE.Object3D();
        scene.add(shadowTarget);
        dirLight.target = shadowTarget;
        scene.add(new THREE.HemisphereLight("#c8e0ff", "#88aa55", 1));

        // ── TERRAIN GEOMETRY ──
        terrainGeo = new THREE.PlaneGeometry(
          TERRAIN_SIZE,
          TERRAIN_SIZE,
          DISPLAY_RES,
          DISPLAY_RES,
        );
        terrainGeo.rotateX(-PI / 2);
        syncGeometry(); // apply initial heightData

        const terrain = new THREE.Mesh(
          terrainGeo,
          new THREE.MeshStandardMaterial({ color: 0x4a6a30, roughness: 0.95 }),
        );
        terrain.receiveShadow = true;
        scene.add(terrain);

        splatTex = new THREE.CanvasTexture(splatCanvas);
        splatTex.wrapS = splatTex.wrapT = THREE.ClampToEdgeWrapping;

        // ── LOAD TEXTURES ──
        const texLoader = new THREE.TextureLoader();
        const loadTex = (url) =>
          new Promise((res, rej) => texLoader.load(url, res, undefined, rej));
        const [grassColorTex, groundColorTex, grassNormalTex, groundNormalTex] =
          await Promise.all([
            loadTex("textures/Grass005_1K-JPG_Color.jpg"),
            loadTex("textures/Ground037_1K-JPG_Color.jpg"),
            loadTex("textures/Grass005_1K-JPG_NormalGL.jpg"),
            loadTex("textures/Ground037_1K-JPG_NormalGL.jpg"),
          ]);
        for (const t of [grassColorTex, groundColorTex]) {
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.colorSpace = THREE.SRGBColorSpace;
        }
        for (const t of [grassNormalTex, groundNormalTex])
          t.wrapS = t.wrapT = THREE.RepeatWrapping;

        // ── TSL SPLAT MATERIAL ──
        const uTerrainHalf = float(TERRAIN_SIZE * 0.5);
        const uTerrainSize = float(TERRAIN_SIZE);
        const uTileScaleGrass  = uniform(PARAMS.tileGrass);
        const uTileScaleGround = uniform(PARAMS.tileGround);
        const uSlopeStart      = uniform(PARAMS.slopeStart);
        const uSlopeEnd        = uniform(PARAMS.slopeEnd);

        const getSplatUV  = () => positionWorld.xz.add(uTerrainHalf).div(uTerrainSize);
        const getGrassUV  = () => positionWorld.xz.mul(uTileScaleGrass);
        const getGroundUV = () => positionWorld.xz.mul(uTileScaleGround);
        const getFlatness = () => clamp(dot(normalWorld, vec3(0, 1, 0)), float(0), float(1));
        const getSlopeMask = () => smoothstep(uSlopeStart, uSlopeEnd, getFlatness());
        const getHeightMask = () =>
          smoothstep(
            float(HEIGHT_SCALE * 0.65),
            float(HEIGHT_SCALE * 0.92),
            positionWorld.y,
          );

        const splatMat = new MeshStandardNodeMaterial({
          roughness: 0.9,
          metalness: 0,
        });
        // Wet zone: terrain near/below water level gets dark wet sand color
        const getWetMask = () => smoothstep(float(3.5), float(0.0), positionWorld.y);

        splatMat.colorNode = Fn(() => {
          const splat = texture(splatTex, getSplatUV());
          const grassCol  = texture(grassColorTex,  getGrassUV()).rgb;
          const groundCol = texture(groundColorTex, getGroundUV()).rgb;
          const rockCol = groundCol.mul(float(0.65));
          const wetCol = groundCol.mul(float(0.35)); // dark wet sand
          const baseCol = vec3(0.28, 0.32, 0.22);
          let col = mix(baseCol, grassCol, splat.r);
          col = mix(col, grassCol.mul(float(1.1)), splat.g);
          col = mix(col, groundCol, splat.b);
          col = mix(rockCol, col, getSlopeMask());
          col = mix(col, groundCol.mul(float(0.75)), getHeightMask());
          col = mix(col, wetCol, getWetMask()); // shoreline wet blend
          return col;
        })();
        splatMat.normalNode = Fn(() => {
          const splat = texture(splatTex, getSplatUV());
          const grassNorm  = texture(grassNormalTex,  getGrassUV());
          const groundNorm = texture(groundNormalTex, getGroundUV());
          let blended = mix(grassNorm, groundNorm, splat.b);
          blended = mix(groundNorm, blended, getSlopeMask());
          blended = mix(blended, groundNorm, getHeightMask());
          return normalMap(blended);
        })();
        terrain.material.dispose();
        terrain.material = splatMat;

        // ── WATER PLANE ──
        const waterGeo = new THREE.PlaneGeometry(TERRAIN_SIZE * 4, TERRAIN_SIZE * 4);
        waterGeo.rotateX(-PI / 2);
        const waterMat = new MeshStandardNodeMaterial({
          transparent: true,
          depthWrite: false,
        });
        waterMat.colorNode = vec3(0.05, 0.28, 0.45);
        waterMat.opacityNode = float(0.72);
        waterMat.roughnessNode = float(0.05);
        waterMat.metalnessNode = float(0.6);
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.y = -0.5;
        water.renderOrder = 1;
        scene.add(water);

        // ── CLIFF TEMPLATES ──
        const gltfLoader = new GLTFLoader();
        const CLIFF_FALLBACK_COLORS = [0x8a7a6a, 0x6a5a4a, 0x7a6858];
        cliffTemplates = await Promise.all(CLIFF_MODELS.map(async (url, i) => {
          try {
            const gltf = await gltfLoader.loadAsync(url);
            gltf.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
            return gltf.scene;
          } catch {
            const mesh = new THREE.Mesh(
              new THREE.BoxGeometry(10, 15, 8),
              new THREE.MeshStandardMaterial({ color: CLIFF_FALLBACK_COLORS[i], roughness: 0.9 })
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            const g = new THREE.Group();
            g.add(mesh);
            return g;
          }
        }));

        // ── TRANSFORM CONTROLS ──
        transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.addEventListener("dragging-changed", e => {
          orbit.enabled = e.value ? false : currentMode === "view";
        });
        transformControls.enabled = false;
        tcHelper = transformControls.getHelper();
        tcHelper.visible = false;
        scene.add(tcHelper);

        // ── CLIFF HELPERS ──
        function getCliffRoot(object) {
          let obj = object;
          while (obj) {
            if (cliffObjects.includes(obj)) return obj;
            obj = obj.parent;
          }
          return null;
        }

        function selectCliff(root) {
          selectedCliff = root;
          if (root) {
            tcHelper.visible = true;
            transformControls.attach(root);
          } else {
            tcHelper.visible = false;
            transformControls.detach();
          }
        }

        function placeCliff(wx, wy, wz, modelIndex) {
          const root = cliffTemplates[modelIndex].clone();
          root.position.set(wx, wy - cliffSinkOffset, wz);
          root.userData.modelIndex = modelIndex;
          root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
          scene.add(root);
          cliffObjects.push(root);
          selectCliff(root);
        }

        function loadCliffs(file) {
          const reader = new FileReader();
          reader.onload = ev => {
            try {
              const data = JSON.parse(ev.target.result);
              cliffObjects.forEach(r => scene.remove(r));
              cliffObjects = [];
              selectCliff(null);
              data.forEach(d => {
                const idx = Math.max(0, Math.min(cliffTemplates.length - 1, d.modelIndex ?? 0));
                const root = cliffTemplates[idx].clone();
                root.position.set(d.x, d.y, d.z);
                root.rotation.set(d.rx, d.ry, d.rz);
                root.scale.set(d.sx, d.sy, d.sz);
                root.userData.modelIndex = idx;
                root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
                scene.add(root);
                cliffObjects.push(root);
              });
            } catch (err) { console.error("Failed to load cliffs.json", err); }
          };
          reader.readAsText(file);
        }

        // ── BRUSH RING ──
        const brushRingGeo = new THREE.RingGeometry(1, 1.06, 48);
        brushRingGeo.rotateX(-PI / 2);
        const brushRing = new THREE.Mesh(
          brushRingGeo,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            side: THREE.DoubleSide,
            depthWrite: false,
            transparent: true,
            opacity: 0.9,
          }),
        );
        brushRing.visible = false;
        brushRing.renderOrder = 2;
        scene.add(brushRing);

        // ── RAYCASTER ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getTerrainHit(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObject(terrain);
          return hits.length > 0 ? hits[0].point : null;
        }

        function updateBrushRing(p) {
          if (!p) {
            brushRing.visible = false;
            return;
          }
          brushRing.visible = true;
          // Color: white for paint, orange for sculpt
          brushRing.material.color.set(
            currentMode === "sculpt" ? 0xff9900 : 0xffffff,
          );
          brushRing.position.set(p.x, p.y + 0.15, p.z);
          brushRing.scale.setScalar(brushWorldRadius());
        }

        // ── TWEAKPANE ──
        const pane = new Pane({ title: "Terrain Editor" });

        // Mode selector
        const modeBinding = pane.addBinding(PARAMS, "mode", {
          label: "Mode",
          options: { View: "view", Paint: "paint", Sculpt: "sculpt", Place: "place" },
        });
        modeBinding.on("change", (ev) => setMode(ev.value));

        pane.addBlade({ view: "separator" });

        // Brush (always visible)
        const brushFolder = pane.addFolder({ title: "Brush", expanded: true });
        brushFolder.addBinding(PARAMS, "brushSize", { label: "Size", min: 2, max: 80, step: 1 })
          .on("change", (ev) => { brushSize = ev.value; });
        brushFolder.addBinding(PARAMS, "brushStrength", { label: "Strength", min: 5, max: 100, step: 1 })
          .on("change", (ev) => { brushStr = ev.value; });

        // History (always visible)
        const histFolder = pane.addFolder({ title: "History", expanded: true });
        histFolder.addButton({ title: "↩ Undo" }).on("click", () => { undo(); generateObjects(scene); });
        histFolder.addButton({ title: "↪ Redo" }).on("click", () => { redo(); generateObjects(scene); });

        // Material (always visible, collapsed by default)
        const matFolder = pane.addFolder({ title: "Material", expanded: false });
        matFolder.addBinding(PARAMS, "tileGrass",  { label: "Grass tile",  min: 0.005, max: 0.2, step: 0.001 })
          .on("change", (ev) => { uTileScaleGrass.value  = ev.value; });
        matFolder.addBinding(PARAMS, "tileGround", { label: "Ground tile", min: 0.005, max: 0.2, step: 0.001 })
          .on("change", (ev) => { uTileScaleGround.value = ev.value; });
        matFolder.addBlade({ view: "separator" });
        matFolder.addBinding(PARAMS, "slopeStart", { label: "Rock start", min: 0, max: 1, step: 0.01 })
          .on("change", (ev) => { uSlopeStart.value = ev.value; });
        matFolder.addBinding(PARAMS, "slopeEnd",   { label: "Rock end",   min: 0, max: 1, step: 0.01 })
          .on("change", (ev) => { uSlopeEnd.value   = ev.value; });

        pane.addBlade({ view: "separator" });

        // Paint folder
        const paintFolder = pane.addFolder({ title: "Paint", expanded: true });
        paintFolder.addBinding(PARAMS, "biome", {
          label: "Biome",
          options: { Forest: "forest", Grass: "grass", Village: "village", Erase: "erase" },
        }).on("change", (ev) => { currentBiome = ev.value; });
        paintFolder.addButton({ title: "Clear Map" }).on("click", () => {
          splatCtx.fillStyle = "#000";
          splatCtx.fillRect(0, 0, SPLAT_RES, SPLAT_RES);
          syncPreview();
          if (splatTex) splatTex.needsUpdate = true;
          generateObjects(scene);
        });
        paintFolder.addButton({ title: "Save Splatmap" }).on("click", saveSplatmap);
        paintFolder.addButton({ title: "Load Splatmap" }).on("click", () =>
          document.getElementById("file-input").click()
        );

        // Sculpt folder
        const sculptFolder = pane.addFolder({ title: "Sculpt", expanded: true });
        sculptFolder.addBinding(PARAMS, "sculptTool", {
          label: "Tool",
          options: { Raise: "raise", Lower: "lower", Smooth: "smooth" },
        }).on("change", (ev) => { sculptMode = ev.value; });
        sculptFolder.addButton({ title: "Reset Terrain" }).on("click", () => {
          pushUndo();
          buildHeightData();
          syncGeometry();
          generateObjects(scene);
        });
        sculptFolder.addButton({ title: "Save Heightmap" }).on("click", saveHeightmap);
        sculptFolder.addButton({ title: "Load Heightmap" }).on("click", () =>
          document.getElementById("hmap-file-input").click()
        );

        // Place folder
        const placeFolder = pane.addFolder({ title: "Place  [ W move · E rotate · R scale · Del remove ]", expanded: true });
        placeFolder.addBinding(PARAMS, "cliffModel", {
          label: "Model",
          options: { "Cliff 1": 0, "Cliff 2": 1, "Cliff 3": 2 },
        }).on("change", (ev) => { activeCliffModel = ev.value; });
        placeFolder.addBinding(PARAMS, "sinkOffset", { label: "Sink", min: 0, max: 20, step: 0.5 })
          .on("change", (ev) => { cliffSinkOffset = ev.value; });
        placeFolder.addButton({ title: "Save Cliffs JSON" }).on("click", saveCliffs);
        placeFolder.addButton({ title: "Load Cliffs JSON" }).on("click", () =>
          document.getElementById("cliffs-file-input").click()
        );

        // Wire up file inputs
        document.getElementById("file-input").addEventListener("change", (e) => {
          if (e.target.files[0]) loadSplatmap(e.target.files[0]);
        });
        document.getElementById("hmap-file-input").addEventListener("change", (e) => {
          if (e.target.files[0]) loadHeightmap(e.target.files[0]);
        });
        document.getElementById("cliffs-file-input").addEventListener("change", (e) => {
          if (e.target.files[0]) loadCliffs(e.target.files[0]);
        });

        // ── MODE SYSTEM ──
        function setMode(mode) {
          currentMode = mode;
          PARAMS.mode = mode;
          pane.refresh();

          orbit.enabled = mode === "view";

          paintFolder.hidden  = mode !== "paint";
          sculptFolder.hidden = mode !== "sculpt";
          placeFolder.hidden  = mode !== "place";
          brushFolder.hidden  = mode === "view" || mode === "place";

          if (mode !== "place" && transformControls) {
            if (tcHelper) tcHelper.visible = false;
            transformControls.enabled = false;
            transformControls.detach();
            selectedCliff = null;
          } else if (mode === "place" && transformControls) {
            transformControls.enabled = true;
          }

          const badge = document.getElementById("mode-badge");
          badge.textContent =
            mode === "view" ? "VIEW MODE" :
            mode === "paint" ? "PAINT MODE" :
            mode === "sculpt" ? "SCULPT MODE" : "PLACE MODE";
          badge.className = mode;
          renderer.domElement.style.cursor = mode === "view" ? "default" : "crosshair";
          if (mode === "view" || mode === "place") brushRing.visible = false;
        }
        setMode("view");

        // ── KEYBOARD ──
        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyP")
            setMode(currentMode === "paint" ? "view" : "paint");
          if (e.code === "KeyS" && currentMode !== "place")
            setMode(currentMode === "sculpt" ? "view" : "sculpt");
          if (e.code === "KeyO")
            setMode(currentMode === "place" ? "view" : "place");
          if (e.code === "Escape") setMode("view");
          if (currentMode === "place") {
            if (e.code === "KeyW") { e.preventDefault(); transformControls.setMode("translate"); }
            if (e.code === "KeyE") { e.preventDefault(); transformControls.setMode("rotate"); }
            if (e.code === "KeyR") { e.preventDefault(); transformControls.setMode("scale"); }
            if (e.code === "Delete" && selectedCliff) {
              scene.remove(selectedCliff);
              cliffObjects = cliffObjects.filter(c => c !== selectedCliff);
              selectCliff(null);
            }
          }
        });

        // ── MOUSE ──
        renderer.domElement.addEventListener("contextmenu", (e) =>
          e.preventDefault(),
        );

        renderer.domElement.addEventListener("mousemove", (e) => {
          if (currentMode === "view" || currentMode === "place") return;
          const p = getTerrainHit(e);
          updateBrushRing(p);
          if (!isMouseDown || !p) return;
          if (currentMode === "paint") paintAt(p.x, p.z);
          if (currentMode === "sculpt") sculptAt(p.x, p.z, e);
        });

        renderer.domElement.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          if (currentMode === "view") return;

          if (currentMode === "place") {
            if (transformControls.axis !== null) return; // clicking gizmo handle
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const cliffMeshes = [];
            cliffObjects.forEach(root => root.traverse(o => { if (o.isMesh) cliffMeshes.push(o); }));
            const cliffHits = raycaster.intersectObjects(cliffMeshes, false);
            if (cliffHits.length > 0) {
              const root = getCliffRoot(cliffHits[0].object);
              if (root) { selectCliff(root); return; }
            }
            const p = getTerrainHit(e);
            if (p) placeCliff(p.x, p.y, p.z, activeCliffModel);
            return;
          }

          isMouseDown = true;
          if (currentMode === "paint" || currentMode === "sculpt") pushUndo();
          const p = getTerrainHit(e);
          if (!p) return;
          if (currentMode === "sculpt" && e.altKey) flattenTargetY = sampleHeight(p.x, p.z);
          if (currentMode === "paint") paintAt(p.x, p.z);
          if (currentMode === "sculpt") sculptAt(p.x, p.z, e);
        });

        renderer.domElement.addEventListener("mouseup", () => {
          if (!isMouseDown) return;
          isMouseDown = false;
          if (currentMode === "paint" || currentMode === "sculpt") {
            generateObjects(scene);
          }
        });

        renderer.domElement.addEventListener("mouseleave", () => {
          isMouseDown = false;
          brushRing.visible = false;
        });

        // ── RESIZE ──
        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        // ── RENDER LOOP ──
        renderer.setAnimationLoop(() => {
          orbit.update();
          stats.update();
          renderer.render(scene, camera);
        });
      }

      init();
    </script>
  </body>
</html>
