<!doctype html>
<!-- Modular twin of splatmap-chunks.html (unchanged). Resync CSS: npm run extract:splatmap — JS is splatmap-chunks-main.js + modules. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splatmap Chunks — modular entry</title>
    <link rel="stylesheet" href="splatmap-chunks-app.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.9/build/index.module.js",
          "tweakpane": "https://esm.sh/tweakpane@4.0.4"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">booting...</div>
    <div id="mode-badge" class="view">VIEW MODE</div>
    <div id="fly-hud">
      <div class="fly-gauge">
        <span class="label">SPEED</span>
        <span class="value"
          ><span id="fly-spd">0</span><span class="unit">m/s</span></span
        >
      </div>
      <div class="fly-gauge">
        <span class="label">ALTITUDE</span>
        <span class="value"
          ><span id="fly-alt">0</span><span class="unit">m</span></span
        >
      </div>
    </div>
    <input
      type="file"
      id="load-terrain-input"
      accept="application/json,.json"
      style="display: none"
    />
    <input
      type="file"
      id="load-cliffs-input"
      accept="application/json,.json"
      style="display: none"
    />
    <input
      type="file"
      id="cliff-inst-glb-input"
      accept=".glb,.gltf"
      style="display: none"
    />
    <input
      type="file"
      id="hdr-file-input"
      accept=".hdr,.exr,image/*"
      style="display: none"
    />
    <input
      type="file"
      id="prop-glb-input"
      accept=".glb,.gltf"
      style="display: none"
    />
    <input
      type="file"
      id="props-json-input"
      accept=".json,application/json"
      style="display: none"
      multiple
    />
    <input
      type="file"
      id="decal-json-input"
      accept=".json,application/json"
      style="display: none"
    />
    <input
      type="file"
      id="water-json-input"
      accept=".json,application/json"
      style="display: none"
    />

    <script type="module" src="splatmap-chunks-main.js"></script>
  </body>
</html>
