      // ─── NOISE ───────────────────────────────
      function hash(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
      }
      function smoothNoise(x, y) {
        const ix = Math.floor(x),
          iy = Math.floor(y);
        const fx = x - ix,
          fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx),
          uy = fy * fy * (3 - 2 * fy);
        const a = hash(ix, iy),
          b = hash(ix + 1, iy);
        const c = hash(ix, iy + 1),
          d = hash(ix + 1, iy + 1);
        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }
      function fbm(x, y, oct = 6) {
        let v = 0,
          amp = 1,
          freq = 1,
          tot = 0;
        for (let i = 0; i < oct; i++) {
          v += smoothNoise(x * freq, y * freq) * amp;
          tot += amp;
          amp *= 0.5;
          freq *= 2.1;
        }
        return v / tot;
      }
      function ridged(x, y, oct = 4) {
        let v = 0,
          amp = 1,
          freq = 1,
          tot = 0;
        for (let i = 0; i < oct; i++) {
          let n = smoothNoise(x * freq, y * freq);
          n = 1 - Math.abs(n * 2 - 1);
          n *= n;
          v += n * amp;
          tot += amp;
          amp *= 0.5;
          freq *= 2.1;
        }
        return v / tot;
      }

      // ─── CONSTANTS ───────────────────────────
      const TERRAIN_SIZE = 800;
      const TERRAIN_RES = 512; // data resolution — heightData array + saved PNG
      const DISPLAY_RES = 128; // display resolution — visible mesh (fast to render)
      const HEIGHT_SCALE = 40;
      const NOISE_FREQ = 0.0045;
      const SPLAT_RES = 512;
      const VERTS = TERRAIN_RES + 1; // 513 — heightData dimensions
      const DISPLAY_VERTS = DISPLAY_RES + 1; // 129 — geometry vertex count per side
      const PI = Math.PI;

      // ─── HEIGHT DATA (mutable, drives both geometry and sampleHeight) ───
      const heightData = new Float32Array(VERTS * VERTS);

      function buildHeightData() {
        heightData.fill(0);
      }
      buildHeightData();

      // Bilinear sample from heightData — used for sphere placement + sculpt falloff
      // Samples height using the same DISPLAY_RES (128) grid the visual mesh uses.
      // Used for heightTex so grass sits flush with what you actually see, not the
      // finer 512-res heightData which the mesh smooths over.
      function sampleHeightDisplay(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * DISPLAY_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * DISPLAY_RES;
        const ix0 = Math.max(0, Math.min(DISPLAY_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(DISPLAY_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(DISPLAY_RES, ix0 + 1);
        const iz1 = Math.min(DISPLAY_RES, iz0 + 1);
        const tx = fx - ix0,
          tz = fz - iz0;
        const wx00 = (-0.5 + ix0 / DISPLAY_RES) * TERRAIN_SIZE;
        const wx10 = (-0.5 + ix1 / DISPLAY_RES) * TERRAIN_SIZE;
        const wz00 = (-0.5 + iz0 / DISPLAY_RES) * TERRAIN_SIZE;
        const wz01 = (-0.5 + iz1 / DISPLAY_RES) * TERRAIN_SIZE;
        const h00 = sampleHeight(wx00, wz00),
          h10 = sampleHeight(wx10, wz00);
        const h01 = sampleHeight(wx00, wz01),
          h11 = sampleHeight(wx10, wz01);
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );
      }

      function sampleHeight(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const ix0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(TERRAIN_RES, ix0 + 1);
        const iz1 = Math.min(TERRAIN_RES, iz0 + 1);
        const tx = fx - ix0,
          tz = fz - iz0;
        const h00 = heightData[iz0 * VERTS + ix0],
          h10 = heightData[iz0 * VERTS + ix1];
        const h01 = heightData[iz1 * VERTS + ix0],
          h11 = heightData[iz1 * VERTS + ix1];
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );
      }

      // ─── BIOME COLORS ────────────────────────
      const BIOME_COLORS = {
        forest: { r: 180, g: 60, b: 40 },
        grass: { r: 40, g: 180, b: 40 },
        village: { r: 40, g: 60, b: 200 },

      // ─── SPLATMAP CANVAS ─────────────────────
      const splatCanvas = document.createElement("canvas");
      splatCanvas.width = splatCanvas.height = SPLAT_RES;
      const splatCtx = splatCanvas.getContext("2d", {

      // ─── GRASS DENSITY CANVAS ─────────────────

      const grassDensityCtx = grassDensityCanvas.getContext("2d", {

      // ─── MEADOW DENSITY CANVAS ────────────────

      // ─── CLIFF GRASS DENSITY CANVAS ──────────

      cliffDensityCanvas.width = cliffDensityCanvas.height = SPLAT_RES;
      const cliffDensityCtx = cliffDensityCanvas.getContext("2d", {
        willReadFrequently: true,

      cliffDensityCtx.fillStyle = "#000";
      cliffDensityCtx.fillRect(0, 0, SPLAT_RES, SPLAT_RES);

      // ─── IMAGE TEXTURE SPLATMAP ──────────────
      // Uint8Array avoids canvas premultiplied-alpha zeroing our channels (R*alpha=0 bug)
      // RGBA: R=slot0 weight, G=slot1, B=slot2, A=slot3
      const imgSplatData = new Uint8Array(SPLAT_RES * SPLAT_RES * 4); // all zeros

      const previewCanvas = document.getElementById("splatmap-preview");
      const previewCtx = previewCanvas.getContext("2d");
      function syncPreview() {
        previewCtx.drawImage(splatCanvas, 0, 0, 128, 128);
      }
      syncPreview();

      const hmapCanvas = document.getElementById("heightmap-preview");
      const hmapCtx = hmapCanvas.getContext("2d", { willReadFrequently: true });
      const hmapImg = hmapCtx.createImageData(128, 128);
      function syncHeightmapPreview() {
        for (let py = 0; py < 128; py++) {
          for (let px = 0; px < 128; px++) {
            // sample heightData with bilinear interpolation via sampleHeight
            const wx = (px / 127) * TERRAIN_SIZE - TERRAIN_SIZE / 2;
            const wz = (py / 127) * TERRAIN_SIZE - TERRAIN_SIZE / 2;
            const h = sampleHeight(wx, wz);
            const v = Math.round(
              ((h + HEIGHT_SCALE) / (HEIGHT_SCALE * 2)) * 255,
            );
            const c = Math.max(0, Math.min(255, v));
            const i = (py * 128 + px) * 4;
            hmapImg.data[i] = c;
            hmapImg.data[i + 1] = c;
            hmapImg.data[i + 2] = c;
            hmapImg.data[i + 3] = 255;
          }
        }
        hmapCtx.putImageData(hmapImg, 0, 0);
      }

      // ─── COORDINATE HELPERS ──────────────────
      function worldToUV(wx, wz) {
        return {
          u: (wx + TERRAIN_SIZE / 2) / TERRAIN_SIZE,
          v: 1.0 - (wz + TERRAIN_SIZE / 2) / TERRAIN_SIZE,
        };
      }
      function uvToWorld(u, v) {
        return {
          x: u * TERRAIN_SIZE - TERRAIN_SIZE / 2,
          z: (1.0 - v) * TERRAIN_SIZE - TERRAIN_SIZE / 2,
        };
      }

      // ─── TWEAKPANE PARAMS ────────────────────
      const PARAMS = {
        mode: "view",
        biome: "forest",
        sculptTool: "raise",

      // ─── FOLIAGE SYSTEM ──────────────────────
      const FOLIAGE_SLOTS = [
        {

      // ─── IMAGE TEXTURE SLOTS ─────────────────
      // Use THREE.Texture(canvas) — NOT DataTexture — so image reassignment works in WebGPU
      const _makeSlotTex = (r, g, b) => {

      // ─── BVH HEIGHT GRID ─────────────────────
      const HTEX_RES = 512;
      const bvhGrid = new Float32Array(HTEX_RES * HTEX_RES); // baked heights: terrain + cliffs
      const aoData = new Float32Array(HTEX_RES * HTEX_RES * 4);
      const nmData = new Float32Array(HTEX_RES * HTEX_RES * 4);

      function bvhHeight(wx, wz) {
        // Bilinear sample from baked BVH grid — falls back to heightData before first bake
        if (!bakeBVH) return sampleHeight(wx, wz);
        const fx = (wx / TERRAIN_SIZE + 0.5) * HTEX_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * HTEX_RES;
        const ix0 = Math.max(0, Math.min(HTEX_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(HTEX_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(HTEX_RES - 1, ix0 + 1);
        const iz1 = Math.min(HTEX_RES - 1, iz0 + 1);
        const tx = fx - ix0,
          tz = fz - iz0;
        const h00 = bvhGrid[iz0 * HTEX_RES + ix0];
        const h10 = bvhGrid[iz0 * HTEX_RES + ix1];
        const h01 = bvhGrid[iz1 * HTEX_RES + ix0];
        const h11 = bvhGrid[iz1 * HTEX_RES + ix1];
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );
      }

      // ─── UNDO / REDO ─────────────────────────
      const MAX_UNDO = 30;

      function snapshotState() {
        return {
          height: heightData.slice(),
          splat: splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES),
        };
      }
      function pushUndo() {
        undoStack.push(snapshotState());
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0; // new action clears redo
      }
      function applySnapshot(snap) {
        heightData.set(snap.height);
        syncGeometry();
        splatCtx.putImageData(snap.splat, 0, 0);
        syncPreview();

      }
      function undo() {
        if (!undoStack.length) return;
        redoStack.push(snapshotState());
        applySnapshot(undoStack.pop());

      function redo() {
        if (!redoStack.length) return;

        applySnapshot(redoStack.pop());

      // ─── PAINT ───────────────────────────────
      // ─── NOISE / FBM (CPU, used by sculpt + paint brushes) ──────────
      function _h2(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
      }
      function _sn2(x, y) {
        const ix = Math.floor(x),
          iy = Math.floor(y);
        const fx = x - ix,
          fy = y - iy;
        const u = fx * fx * (3 - 2 * fx),
          v = fy * fy * (3 - 2 * fy);
        return (
          _h2(ix, iy) * (1 - u) * (1 - v) +
          _h2(ix + 1, iy) * u * (1 - v) +
          _h2(ix, iy + 1) * (1 - u) * v +
          _h2(ix + 1, iy + 1) * u * v
        );
      }
      function _fbm(x, y, oct = 5) {
        let s = 0,
          a = 0.5,
          f = 1,
          m = 0;
        for (let i = 0; i < oct; i++) {
          s += _sn2(x * f, y * f) * a;
          m += a;
          a *= 0.5;
          f *= 2;
        }
        return s / m;
      }
      // Ridge noise: creates sharp ridges/spires instead of smooth bumps
      function _fbmRidge(x, y, oct = 6) {
        let s = 0,
          a = 0.5,
          f = 1,
          m = 0;
        for (let i = 0; i < oct; i++) {
          const n = _sn2(x * f, y * f);
          s += (1.0 - Math.abs(n * 2.0 - 1.0)) * a; // invert valleys into ridges
          m += a;
          a *= 0.5;
          f *= 2.1;
        }
        return s / m;
      }

      // ─── PAINT BRUSH HELPERS ────────────────────────────────────────
      function _paintSmooth(ctx, cx, cy, r, g, b, alpha) {
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, brushSize);
        grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
        grad.addColorStop(0.5, `rgba(${r},${g},${b},${alpha * 0.55})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, brushSize, 0, PI * 2);
        ctx.fill();
      }

      function _paintFbmSplat(ctx, cx, cy, r, g, b, alpha) {
        const rad = Math.ceil(brushSize) + 1;
        const oc = document.createElement("canvas");
        oc.width = oc.height = rad * 2;
        const octx = oc.getContext("2d");
        const imgData = octx.createImageData(rad * 2, rad * 2);
        const data = imgData.data;
        const sc = 4.0 / brushSize;
        for (let py = 0; py < rad * 2; py++) {
          for (let px = 0; px < rad * 2; px++) {
            const dx = px - rad,
              dy = py - rad;
            const t = Math.sqrt(dx * dx + dy * dy) / brushSize;
            if (t >= 1) continue;
            const n = _fbm(
              dx * sc + brushNoiseSeed,
              dy * sc + brushNoiseSeed + 77,
              4,
            );
            const blend = Math.max(0, (t - 0.4) / 0.6);
            const edgeMod = 1 - blend + blend * (0.3 + n * 1.6);
            const base = Math.max(0, (1 - t) * (1 - t));
            const w = Math.min(1, Math.max(0, base * edgeMod)) * alpha;
            const idx = (py * rad * 2 + px) * 4;
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = Math.round(w * 255);
          }
        }
        octx.putImageData(imgData, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(oc, cx - rad, cy - rad);
      }

      function _paintScatter(ctx, cx, cy, r, g, b, alpha) {
        const count = Math.round(brushSize * 0.25 + 4);
        const dotR = Math.max(2, brushSize * 0.12);
        ctx.globalCompositeOperation = "source-over";
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * PI * 2;
          const dist = Math.random() * brushSize * 0.85;
          const dx = cx + Math.cos(angle) * dist;
          const dy = cy + Math.sin(angle) * dist;
          const a = alpha * (0.5 + Math.random() * 0.5);
          const grad = ctx.createRadialGradient(dx, dy, 0, dx, dy, dotR);
          grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
          grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(dx, dy, dotR, 0, PI * 2);
          ctx.fill();
        }
      }

      function _applyBrushToCanvas(ctx, cx, cy, r, g, b, alpha) {
        if (PARAMS.paintBrush === "fbm_splat")
          _paintFbmSplat(ctx, cx, cy, r, g, b, alpha);
        else if (PARAMS.paintBrush === "scatter")
          _paintScatter(ctx, cx, cy, r, g, b, alpha);
        else _paintSmooth(ctx, cx, cy, r, g, b, alpha);

      function paintAt(wx, wz) {
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES,
          cy = v * SPLAT_RES;
        const alpha = brushStr / 100;

        // Meadow uses its own density canvas (like grass), not the splatmap
        if (currentBiome === "meadow") {
          _applyBrushToCanvas(meadowCtx, cx, cy, 255, 255, 255, alpha);

        if (currentBiome.startsWith("img")) {
          const slotIdx = parseInt(currentBiome[3]);
          paintImgAt(wx, wz, slotIdx, imgEraseMode);

        const col = BIOME_COLORS[currentBiome];
        _applyBrushToCanvas(splatCtx, cx, cy, col.r, col.g, col.b, alpha);
        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;
      }

      // ─── PATH PAINT + FLATTEN ────────────────
      function pathPaintAt(wx, wz) {
        // Paint path texture to splatmap blue channel (same as "village" biome)
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES,
          cy = v * SPLAT_RES;
        _applyBrushToCanvas(splatCtx, cx, cy, 0, 0, 255, brushStr / 100);
        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;

        // Gently flatten terrain under brush toward center height
        if (PARAMS.path.flattenStrength <= 0) return;
        const targetY = sampleHeight(wx, wz);
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const cellSize = TERRAIN_SIZE / TERRAIN_RES;
        const gridR = Math.ceil(radius / cellSize) + 1;
        const cgx = Math.round((wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cgz = Math.round((wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const ixMin = Math.max(0, cgx - gridR),
          ixMax = Math.min(TERRAIN_RES, cgx + gridR);
        const izMin = Math.max(0, cgz - gridR),
          izMax = Math.min(TERRAIN_RES, cgz + gridR);
        for (let iz = izMin; iz <= izMax; iz++) {
          for (let ix = ixMin; ix <= ixMax; ix++) {
            const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
            const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
            const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
            if (distSq > radiusSq) continue;
            const t = Math.sqrt(distSq) / radius;
            const falloff = (1 - t) * (1 - t);
            const cur = heightData[iz * VERTS + ix];
            heightData[iz * VERTS + ix] +=
              (targetY - cur) * falloff * PARAMS.path.flattenStrength * 0.08;
          }

        syncGeometry();
      }

      // ─── GRASS DENSITY PAINT ─────────────────
      function paintGrassAt(wx, wz, erase) {

        } else {
          grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
          grad.addColorStop(0.5, `rgba(255,255,255,${alpha * 0.55})`);
          grad.addColorStop(1, `rgba(255,255,255,0)`);
          grassDensityCtx.globalCompositeOperation = "source-over";

        grassDensityCtx.fillStyle = grad;

      // ─── TREE PAINT ──────────────────────────

      // ─── IMAGE TEXTURE PAINT ─────────────────────────────────────────────
      // Direct Uint8Array write — no canvas premultiplied-alpha issues
      function paintImgAt(wx, wz, slotIdx, erase) {
        const { u, v } = worldToUV(wx, wz);
        const cx = Math.floor(u * SPLAT_RES);
        const cy = Math.floor(v * SPLAT_RES);
        const rad = Math.ceil(brushSize);
        const alpha = brushStr / 100;
        for (let py = cy - rad; py <= cy + rad; py++) {
          for (let px = cx - rad; px <= cx + rad; px++) {
            if (px < 0 || px >= SPLAT_RES || py < 0 || py >= SPLAT_RES)
              continue;
            const dx = px - cx,
              dy = py - cy;
            const t = Math.sqrt(dx * dx + dy * dy) / brushSize;
            if (t >= 1) continue;
            const falloff = (1 - t) * (1 - t);
            const idx = (py * SPLAT_RES + px) * 4 + slotIdx; // R=0, G=1, B=2, A=3
            const cur = imgSplatData[idx] / 255;
            if (erase) {
              imgSplatData[idx] = Math.max(
                0,
                Math.round((cur - falloff * alpha) * 255),
              );
            } else {
              imgSplatData[idx] = Math.min(
                255,
                Math.round((cur + falloff * alpha) * 255),
              );
            }
          }
        }
        if (imgSplatTex) imgSplatTex.needsUpdate = true;
      }

      // ─── BRUSH RADIUS (module-level so sculptAt + paintAt can use it) ───
      function brushWorldRadius() {
        return (brushSize / SPLAT_RES) * TERRAIN_SIZE;
      }

      // ─── SCULPT ──────────────────────────────
      // plain drag = raise | shift+drag = lower | ctrl+drag = smooth
      function sculptAt(wx, wz, e) {
        if (!terrainGeo) return;
        if (sculptMode === "ramp") return; // ramp is click-click, not drag
        const mode = e?.altKey
          ? "flatten"
          : e?.ctrlKey
            ? "smooth"
            : e?.shiftKey
              ? "lower"
              : sculptMode === "noise"
                ? "noise"
                : sculptMode === "erosion"
                  ? "erosion"
                  : "raise";
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const strength = (brushStr / 100) * 0.4;

        // Limit iteration to affected grid region
        const cellSize = TERRAIN_SIZE / TERRAIN_RES;
        const gridR = Math.ceil(radius / cellSize) + 1;
        const cx = Math.round((wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cz = Math.round((wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const ixMin = Math.max(0, cx - gridR),
          ixMax = Math.min(TERRAIN_RES, cx + gridR);
        const izMin = Math.max(0, cz - gridR),
          izMax = Math.min(TERRAIN_RES, cz + gridR);

        if (mode === "smooth") {
          // Two-pass: read then write to avoid order dependency
          const scratch = new Float32Array(
            (ixMax - ixMin + 1) * (izMax - izMin + 1),
          );
          let si = 0;
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) {
                scratch[si++] = heightData[iz * VERTS + ix];
                continue;
              }
              // Average 3x3 neighbors
              let sum = 0,
                count = 0;
              for (let dz = -1; dz <= 1; dz++)
                for (let dx = -1; dx <= 1; dx++) {
                  const nx2 = Math.max(0, Math.min(TERRAIN_RES, ix + dx));
                  const nz2 = Math.max(0, Math.min(TERRAIN_RES, iz + dz));
                  sum += heightData[nz2 * VERTS + nx2];
                  count++;
                }
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const avg = sum / count;
              scratch[si++] =
                heightData[iz * VERTS + ix] +
                (avg - heightData[iz * VERTS + ix]) * falloff * strength * 2;
            }
          }
          si = 0;
          for (let iz = izMin; iz <= izMax; iz++)
            for (let ix = ixMin; ix <= ixMax; ix++)
              heightData[iz * VERTS + ix] = scratch[si++];
        } else if (mode === "flatten") {
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const smooth = falloff * falloff;
              const current = heightData[iz * VERTS + ix];
              heightData[iz * VERTS + ix] +=
                (flattenTargetY - current) * smooth * strength * 2;
            }
          }
        } else if (mode === "erosion") {
          // Hydraulic erosion brush — same physics as full bake, local droplets only
          const Ke = PARAMS.erosion.erosionRate;
          const Kd = PARAMS.erosion.depositionRate;
          const Kev = PARAMS.erosion.evaporation;
          const Kin = PARAMS.erosion.inertia;
          const Kc = PARAMS.erosion.capacity;
          const erRad = PARAMS.erosion.radius;
          const G = 4, maxSteps = 60, minSlope = 0.001;
          const N = Math.max(1, Math.round(brushStr * 1.5));

          // Brush center in grid space
          const gcx = (wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
          const gcz = (wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
          const gridR = (radius / TERRAIN_SIZE) * TERRAIN_RES;

          // Precompute soft erode kernel
          const er = Math.ceil(erRad);
          const bOX = [], bOZ = [], bWt = [];
          let totW = 0;
          for (let dz2 = -er; dz2 <= er; dz2++) {
            for (let dx2 = -er; dx2 <= er; dx2++) {
              const d = Math.sqrt(dx2 * dx2 + dz2 * dz2);
              if (d >= erRad) continue;
              const w = erRad - d; bOX.push(dx2); bOZ.push(dz2); bWt.push(w); totW += w;
            }
          }
          for (let i = 0; i < bWt.length; i++) bWt[i] /= totW;

          const sHG = (px, pz) => {
            const x0 = Math.floor(px), z0 = Math.floor(pz);
            const x1 = Math.min(TERRAIN_RES, x0+1), z1 = Math.min(TERRAIN_RES, z0+1);
            const tx = px-x0, tz = pz-z0;
            const h00=heightData[z0*VERTS+x0], h10=heightData[z0*VERTS+x1];
            const h01=heightData[z1*VERTS+x0], h11=heightData[z1*VERTS+x1];
            return {
              h:  h00*(1-tx)*(1-tz)+h10*tx*(1-tz)+h01*(1-tx)*tz+h11*tx*tz,
              gx: (h10-h00)*(1-tz)+(h11-h01)*tz,
              gz: (h01-h00)*(1-tx)+(h11-h10)*tx,
            };
          };
          const dep = (px, pz, amt) => {
            const x0=Math.floor(px), z0=Math.floor(pz);
            const x1=Math.min(TERRAIN_RES,x0+1), z1=Math.min(TERRAIN_RES,z0+1);
            const tx=px-x0, tz=pz-z0;
            heightData[z0*VERTS+x0]+=amt*(1-tx)*(1-tz);
            heightData[z0*VERTS+x1]+=amt*tx*(1-tz);
            heightData[z1*VERTS+x0]+=amt*(1-tx)*tz;
            heightData[z1*VERTS+x1]+=amt*tx*tz;
          };

          for (let iter = 0; iter < N; iter++) {
            // Uniform disk sampling within brush radius
            const angle = Math.random() * 2 * Math.PI;
            const rr = Math.sqrt(Math.random()) * gridR;
            let px = gcx + Math.cos(angle) * rr;
            let pz = gcz + Math.sin(angle) * rr;
            if (px < 1 || px >= VERTS-2 || pz < 1 || pz >= VERTS-2) continue;

            let ddx=0, ddz=0, speed=1, water=1, sediment=0;
            for (let step = 0; step < maxSteps; step++) {
              const { h, gx, gz } = sHG(px, pz);
              ddx = ddx*Kin - gx*(1-Kin);
              ddz = ddz*Kin - gz*(1-Kin);
              const len = Math.sqrt(ddx*ddx+ddz*ddz) || 1;
              ddx /= len; ddz /= len;
              const nx2=px+ddx, nz2=pz+ddz;
              if (nx2<0||nx2>=VERTS-1||nz2<0||nz2>=VERTS-1) break;
              const dh = sHG(nx2, nz2).h - h;
              const cap = Math.max(minSlope,-dh)*speed*water*Kc;
              if (sediment > cap || dh > 0) {
                const amt = dh>0 ? Math.min(sediment,dh) : (sediment-cap)*Kd;
                sediment -= amt; dep(px, pz, amt);
              } else {
                const amt = Math.min((cap-sediment)*Ke, -dh+0.001);
                sediment += amt;
                const cx2=Math.floor(px), cz2=Math.floor(pz);
                for (let i=0; i<bWt.length; i++) {
                  const ex=cx2+bOX[i], ez=cz2+bOZ[i];
                  if (ex<0||ex>=VERTS||ez<0||ez>=VERTS) continue;
                  heightData[ez*VERTS+ex] -= amt*bWt[i];
                }
              }
              speed = Math.min(8, Math.sqrt(Math.max(0, speed*speed-dh*G)));
              water *= 1-Kev;
              if (water < 0.005) break;
              px=nx2; pz=nz2;
            }
            dep(px, pz, sediment*Kd);
          }
        } else if (mode === "noise") {
          const freq = PARAMS.noiseScale / radius;
          const oct = Math.round(PARAMS.noiseOctaves);
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const t = Math.sqrt(distSq) / radius;
              const falloff = (1 - t) * (1 - t);
              // _fbm returns [0,1] — subtract 0.5 for bipolar [-0.5, 0.5]
              const n = _fbm(
                vx * freq + brushNoiseSeed,
                vz * freq + brushNoiseSeed * 1.3,
                oct
              ) - 0.5;
              heightData[iz * VERTS + ix] += n * falloff * strength * 4;
            }
          }
        } else {
          const dir = mode === "raise" ? 1 : -1;
          const brush = PARAMS.sculptBrush;
          const sc = 3.0 / radius; // FBM frequency scale
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const t = Math.sqrt(distSq) / radius;
              let delta = 0;
              if (brush === "fbm_peak") {
                const ridgeSc = 3.5 / radius;
                const ridge = _fbmRidge(
                  (vx - wx) * ridgeSc + brushNoiseSeed,
                  (vz - wz) * ridgeSc + brushNoiseSeed,
                  6,
                );
                // Sharp spike falloff ensures center always peaks
                const spike = Math.pow(Math.max(0, 1 - t), 2.5);
                // Ridge noise creates the jagged spires; center biased toward full spike
                const shape = spike * (0.35 + ridge * 1.8);
                delta = dir * Math.max(0, shape) * strength * 2.0;
              } else if (brush === "crater") {
                const rim = Math.exp(-Math.pow(t - 0.55, 2) / 0.04) * 1.2;
                const pit = Math.max(0, 1 - t * 4) * 0.6;
                delta = dir * (rim - pit) * strength * 0.8;
              } else if (brush === "plateau") {
                const flat = Math.max(
                  0,
                  1 - Math.pow(Math.max(0, t - 0.6) / 0.4, 2),
                );
                delta = dir * flat * strength * 0.7;
              } else {
                // smooth (default)
                const f = 1 - t;
                delta = dir * f * f * strength;
              }
              heightData[iz * VERTS + ix] += delta;
            }
          }
        }
        syncGeometry();
      }

      // ─── RAMP TOOL ───────────────────────────
      function applyRamp(ptA, ptB) {
        const dx = ptB.x - ptA.x;
        const dz = ptB.z - ptA.z;
        const lenSq = dx * dx + dz * dz;
        if (lenSq < 0.001) return;
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const strength = brushStr / 100;

        const minX = Math.min(ptA.x, ptB.x) - radius;
        const maxX = Math.max(ptA.x, ptB.x) + radius;
        const minZ = Math.min(ptA.z, ptB.z) - radius;
        const maxZ = Math.max(ptA.z, ptB.z) + radius;
        const ixMin = Math.max(0, Math.floor((minX / TERRAIN_SIZE + 0.5) * TERRAIN_RES));
        const ixMax = Math.min(TERRAIN_RES, Math.ceil((maxX / TERRAIN_SIZE + 0.5) * TERRAIN_RES));
        const izMin = Math.max(0, Math.floor((minZ / TERRAIN_SIZE + 0.5) * TERRAIN_RES));
        const izMax = Math.min(TERRAIN_RES, Math.ceil((maxZ / TERRAIN_SIZE + 0.5) * TERRAIN_RES));

        for (let iz = izMin; iz <= izMax; iz++) {
          for (let ix = ixMin; ix <= ixMax; ix++) {
            const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
            const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
            // Project vertex onto A→B line, get t [0,1]
            const t = Math.max(0, Math.min(1,
              ((vx - ptA.x) * dx + (vz - ptA.z) * dz) / lenSq
            ));
            // Perpendicular distance from the A→B line
            const perpX = ptA.x + t * dx - vx;
            const perpZ = ptA.z + t * dz - vz;
            const perpSq = perpX * perpX + perpZ * perpZ;
            if (perpSq > radiusSq) continue;
            const falloff = Math.pow(1 - Math.sqrt(perpSq) / radius, 2);
            const targetY = ptA.y + t * (ptB.y - ptA.y);
            const current = heightData[iz * VERTS + ix];
            heightData[iz * VERTS + ix] += (targetY - current) * falloff * strength;
          }
        }
        syncGeometry();
      }

      // ─── NORMAL MAP BAKE ─────────────────────────────────────────────
      function bakeNormalMap() {
        const N = HTEX_RES;
        const cellW = TERRAIN_SIZE / N;
        // For terrain tangent=(1,0,0), bitangent=(0,0,-1) due to V=1-z/TS mapping.
        // Tangent-space encoding: R=-dH/dx, G=dH/dz (V-flip), B=up
        for (let iz = 0; iz < N; iz++) {
          for (let ix = 0; ix < N; ix++) {
            const wx = (-0.5 + ix / N) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / N) * TERRAIN_SIZE;
            const hR = sampleHeight(wx + cellW, wz);
            const hL = sampleHeight(wx - cellW, wz);
            const hU = sampleHeight(wx, wz + cellW);
            const hD = sampleHeight(wx, wz - cellW);
            const dxH = (hR - hL) / (2 * cellW);
            const dzH = (hU - hD) / (2 * cellW);
            const mag = Math.sqrt(dxH * dxH + dzH * dzH + 1);
            const idx = (iz * N + ix) * 4;
            nmData[idx] = (-dxH / mag) * 0.5 + 0.5; // R — tangent X
            nmData[idx + 1] = (dzH / mag) * 0.5 + 0.5; // G — bitangent (V-flipped Z)
            nmData[idx + 2] = (1 / mag) * 0.5 + 0.5; // B — up
            nmData[idx + 3] = 1;
          }
        }
        normalMapTex.needsUpdate = true;
      }

      // ─── AO BAKE ─────────────────────────────────────────────────────
      function bakeAO() {
        const N = HTEX_RES;
        const NUM_DIRS = 8;
        const MAX_STEPS = Math.max(1, Math.round(PARAMS.ao.reach));
        const stepDist = TERRAIN_SIZE / N; // world units per step
        const biasRad = (PARAMS.ao.bias * Math.PI) / 2; // ignore angles below this
        const halfPI = Math.PI / 2;
        const contrast = PARAMS.ao.contrast;

        for (let iz = 0; iz < N; iz++) {
          for (let ix = 0; ix < N; ix++) {
            const wx = (-0.5 + ix / N) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / N) * TERRAIN_SIZE;
            const curH = sampleHeight(wx, wz);
            let totalOcc = 0;
            for (let d = 0; d < NUM_DIRS; d++) {
              const angle = (d / NUM_DIRS) * Math.PI * 2;
              const dX = Math.cos(angle),
                dZ = Math.sin(angle);
              let maxElev = 0;
              for (let s = 1; s <= MAX_STEPS; s++) {
                const sx = wx + dX * s * stepDist;
                const sz = wz + dZ * s * stepDist;
                if (
                  sx < -TERRAIN_SIZE * 0.5 ||
                  sx > TERRAIN_SIZE * 0.5 ||
                  sz < -TERRAIN_SIZE * 0.5 ||
                  sz > TERRAIN_SIZE * 0.5
                )
                  break;
                const elev = Math.atan2(
                  sampleHeight(sx, sz) - curH,
                  s * stepDist,
                );
                if (elev > maxElev) maxElev = elev;
              }
              // Bias: subtract threshold angle — shallow horizons don't contribute
              totalOcc += Math.max(0, maxElev - biasRad) / (halfPI - biasRad);
            }
            // Raw AO 0-1, then power-curve for contrast
            const raw = Math.max(0, 1 - totalOcc / NUM_DIRS);
            const ao = Math.pow(raw, contrast);
            const idx = (iz * N + ix) * 4;
            aoData[idx] = aoData[idx + 1] = aoData[idx + 2] = ao;
            aoData[idx + 3] = 1;
          }
        }
        aoTex.needsUpdate = true;
      }

      // ─── HYDRAULIC EROSION ───────────────────────────────────────────
      function runErosion() {
        pushUndo();
        const N = PARAMS.erosion.iterations;
        const Ke = PARAMS.erosion.erosionRate;
        const Kd = PARAMS.erosion.depositionRate;
        const Kev = PARAMS.erosion.evaporation;
        const Kin = PARAMS.erosion.inertia;
        const Kc = PARAMS.erosion.capacity;
        const erRad = PARAMS.erosion.radius;
        const G = 4; // gravity strength
        const maxSteps = 80;
        const minSlope = 0.001;

        // Precompute soft erosion brush (offsets + normalized weights)
        const r = Math.ceil(erRad);
        const bOffX = [],
          bOffZ = [],
          bW = [];
        let totalW = 0;
        for (let dz = -r; dz <= r; dz++) {
          for (let dx = -r; dx <= r; dx++) {
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist >= erRad) continue;
            const w = erRad - dist;
            bOffX.push(dx);
            bOffZ.push(dz);
            bW.push(w);
            totalW += w;
          }
        }
        for (let i = 0; i < bW.length; i++) bW[i] /= totalW;

        // Bilinear sample → height + gradient (in grid-cell units)
        function sampleHG(px, pz) {
          const x0 = Math.floor(px),
            z0 = Math.floor(pz);
          const x1 = Math.min(TERRAIN_RES, x0 + 1);
          const z1 = Math.min(TERRAIN_RES, z0 + 1);
          const tx = px - x0,
            tz = pz - z0;
          const h00 = heightData[z0 * VERTS + x0],
            h10 = heightData[z0 * VERTS + x1];
          const h01 = heightData[z1 * VERTS + x0],
            h11 = heightData[z1 * VERTS + x1];
          return {
            h:
              h00 * (1 - tx) * (1 - tz) +
              h10 * tx * (1 - tz) +
              h01 * (1 - tx) * tz +
              h11 * tx * tz,
            gx: (h10 - h00) * (1 - tz) + (h11 - h01) * tz,
            gz: (h01 - h00) * (1 - tx) + (h11 - h10) * tx,
          };
        }

        // Bilinear deposit at droplet position
        function deposit(px, pz, amt) {
          const x0 = Math.floor(px),
            z0 = Math.floor(pz);
          const x1 = Math.min(TERRAIN_RES, x0 + 1),
            z1 = Math.min(TERRAIN_RES, z0 + 1);
          const tx = px - x0,
            tz = pz - z0;
          heightData[z0 * VERTS + x0] += amt * (1 - tx) * (1 - tz);
          heightData[z0 * VERTS + x1] += amt * tx * (1 - tz);
          heightData[z1 * VERTS + x0] += amt * (1 - tx) * tz;
          heightData[z1 * VERTS + x1] += amt * tx * tz;
        }

        // Soft-brush erode centred at droplet position
        function erode(px, pz, amt) {
          const cx = Math.floor(px),
            cz = Math.floor(pz);
          for (let i = 0; i < bW.length; i++) {
            const nx = cx + bOffX[i],
              nz = cz + bOffZ[i];
            if (nx < 0 || nx >= VERTS || nz < 0 || nz >= VERTS) continue;
            heightData[nz * VERTS + nx] -= amt * bW[i];
          }
        }

        // Simulate droplets
        for (let iter = 0; iter < N; iter++) {
          let px = 1 + Math.random() * (VERTS - 3);
          let pz = 1 + Math.random() * (VERTS - 3);
          let dx = 0,
            dz = 0;
          let speed = 1,
            water = 1,
            sediment = 0;

          for (let step = 0; step < maxSteps; step++) {
            const { h, gx, gz } = sampleHG(px, pz);

            // Direction: blend inertia + downhill gradient
            dx = dx * Kin - gx * (1 - Kin);
            dz = dz * Kin - gz * (1 - Kin);
            const len = Math.sqrt(dx * dx + dz * dz) || 1;
            dx /= len;
            dz /= len;

            const nx = px + dx,
              nz = pz + dz;
            if (nx < 0 || nx >= VERTS - 1 || nz < 0 || nz >= VERTS - 1) break;

            const newH = sampleHG(nx, nz).h;
            const dh = newH - h;

            // Sediment capacity: higher on steep fast-moving slopes
            const slope = Math.max(minSlope, -dh);
            const cap = slope * speed * water * Kc;

            if (sediment > cap || dh > 0) {
              // Slow/uphill → deposit
              const amt =
                dh > 0
                  ? Math.min(sediment, dh) // fill hollow just enough
                  : (sediment - cap) * Kd;
              sediment -= amt;
              deposit(px, pz, amt);
            } else {
              // Fast downhill → erode (capped by available height drop)
              const amt = Math.min((cap - sediment) * Ke, -dh + 0.001);
              sediment += amt;
              erode(px, pz, amt);
            }

            speed = Math.sqrt(Math.max(0, speed * speed - dh * G));
            speed = Math.min(speed, 8); // cap runaway speed
            water *= 1 - Kev;
            if (water < 0.005) break;
            px = nx;
            pz = nz;
          }

          // Deposit remaining carried sediment
          deposit(px, pz, sediment * Kd);
        }

        syncGeometry();
        if (bakeBVH) bakeBVH();
        if (treeSystem) treeSystem.syncHeights();
        FOLIAGE_SLOTS.forEach((s) => {
          if (s.system) s.system.syncHeights();
        });
        propObjects.forEach((root) => {
          root.position.y = bvhHeight(root.position.x, root.position.z);
        });
      }

      function syncGeometry() {
        if (!terrainGeo) return;
        const pos = terrainGeo.attributes.position;
        for (let iz = 0; iz <= DISPLAY_RES; iz++) {
          for (let ix = 0; ix <= DISPLAY_RES; ix++) {
            const wx = (-0.5 + ix / DISPLAY_RES) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / DISPLAY_RES) * TERRAIN_SIZE;
            pos.setY(iz * DISPLAY_VERTS + ix, sampleHeight(wx, wz));
          }
        }
        pos.needsUpdate = true;
        terrainGeo.computeVertexNormals();

        // Update skirt top vertices to match terrain edges
        if (skirtGeo && skirtEdgeXZ.length > 0) {
          const sp = skirtGeo.attributes.position;
          const NV = DISPLAY_VERTS;
          for (let s = 0; s < 4; s++) {
            for (let i = 0; i < NV; i++) {
              const { wx, wz } = skirtEdgeXZ[s * NV + i];
              sp.setY(s * NV * 2 + i * 2, sampleHeight(wx, wz)); // top vertex
            }
          }
          sp.needsUpdate = true;
          skirtGeo.computeVertexNormals();
        }

        syncHeightmapPreview();
      }

      // ─── LIVE FOLIAGE ────────────────────────
      function generateObjects(scene) {
        if (instancedObjs) {
          scene.remove(instancedObjs);
          instancedObjs.geometry.dispose();
          instancedObjs.material.dispose();
          instancedObjs = null;
        }

        const pixels = splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES).data;
        const positions = [];
        const STEP = 4;

        for (let iy = 0; iy < SPLAT_RES; iy += STEP) {
          for (let ix = 0; ix < SPLAT_RES; ix += STEP) {
            const idx = (iy * SPLAT_RES + ix) * 4;
            const r = pixels[idx],
              g = pixels[idx + 1],
              b = pixels[idx + 2];
            if (r >= SPHERE_THRESHOLD && r > g + 20 && r > b + 20) {
              const { x, z } = uvToWorld(ix / SPLAT_RES, iy / SPLAT_RES);
              const cellSize = TERRAIN_SIZE / (SPLAT_RES / STEP);
              const jx = (Math.random() - 0.5) * cellSize;
              const jz = (Math.random() - 0.5) * cellSize;
              const wx = x + jx,
                wz = z + jz;
              // Slope exclusion: skip steep faces
              const eps = 1.5;
              const dydx =
                (sampleHeight(wx + eps, wz) - sampleHeight(wx - eps, wz)) /
                (2 * eps);
              const dydz =
                (sampleHeight(wx, wz + eps) - sampleHeight(wx, wz - eps)) /
                (2 * eps);
              const slope = Math.sqrt(dydx * dydx + dydz * dydz);
              if (slope > 1.2) continue; // skip cliffs
              positions.push(new THREE.Vector3(wx, sampleHeight(wx, wz), wz));
            }
          }
        }

        if (positions.length === 0) {
          document.getElementById("obj-count").textContent = "0 objects";
          return;
        }

        const geo = new THREE.SphereGeometry(0.5, 8, 6);
        const mat = new THREE.MeshStandardMaterial({
          color: 0x2d8c2d,
          roughness: 0.8,
        });
        instancedObjs = new THREE.InstancedMesh(geo, mat, positions.length);
        instancedObjs.castShadow = true;
        instancedObjs.receiveShadow = true;

        const dummy = new THREE.Object3D();
        positions.forEach((pos, i) => {
          dummy.position.set(pos.x, pos.y + 0.5, pos.z);
          dummy.scale.setScalar(0.5 + Math.random() * 0.9);
          dummy.updateMatrix();
          instancedObjs.setMatrixAt(i, dummy.matrix);
        });
        instancedObjs.instanceMatrix.needsUpdate = true;
        scene.add(instancedObjs);
        document.getElementById("obj-count").textContent =
          `${positions.length.toLocaleString()} objects`;
      }

      // ─── SAVE / LOAD ─────────────────────────
      function saveSplatmap() {
        const pixels = splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES).data;
        const blob = new Blob([pixels.buffer], {
          type: "application/octet-stream",
        });
        const a = document.createElement("a");
        a.download = "splatmap.bin";
        a.href = URL.createObjectURL(blob);
        a.click();
      }
      function loadSplatmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const loaded = new Uint8ClampedArray(e.target.result);
          const imgData = splatCtx.createImageData(SPLAT_RES, SPLAT_RES);
          imgData.data.set(loaded.subarray(0, imgData.data.length));
          splatCtx.putImageData(imgData, 0, 0);
          syncPreview();
          if (splatTex) splatTex.needsUpdate = true;
        };
        reader.readAsArrayBuffer(file);
      }

      // ─── HEIGHTMAP SAVE / LOAD ───────────────
      // Saves raw Float32Array as .bin — perfectly lossless, no PNG gamma issues.
      function saveHeightmap() {
        const blob = new Blob([heightData.buffer], {
          type: "application/octet-stream",
        });
        const a = document.createElement("a");
        a.download = "heightmap.bin";
        a.href = URL.createObjectURL(blob);
        a.click();
      }
      function loadHeightmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const loaded = new Float32Array(e.target.result);
          if (loaded.length === heightData.length) {
            heightData.set(loaded);
          } else {
            console.warn(
              `Heightmap size mismatch: got ${loaded.length}, expected ${heightData.length}`,
            );
            // Copy as much as fits
            heightData.set(
              loaded.subarray(0, Math.min(loaded.length, heightData.length)),
            );
          }
          syncGeometry();
          syncHeightmapPreview();
          if (bakeBVH) bakeBVH();
          if (treeSystem) treeSystem.syncHeights();
          FOLIAGE_SLOTS.forEach((s) => {
            if (s.system) s.system.syncHeights();
          });
        };
        reader.readAsArrayBuffer(file);
      }

      // ─── CLIFF SAVE ──────────────────────────
      function saveCliffs() {
        const data = cliffObjects.map((root) => ({
          modelIndex: root.userData.modelIndex ?? 0,
          x: root.position.x,
          y: root.position.y,
          z: root.position.z,
          rx: root.rotation.x,
          ry: root.rotation.y,
          rz: root.rotation.z,
          sx: root.scale.x,
          sy: root.scale.y,
          sz: root.scale.z,
        }));
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.download = "cliffs.json";
        a.href = URL.createObjectURL(blob);
        a.click();
      }

      // ─── POST-PROCESSING PARAMS ──────────────
      const postParams = {
        enabled: false,
        bloom: { enabled: false, strength: 0.35, radius: 0.5, threshold: 0.55 },
        lensflare: {
          enabled: false,
          bloomThreshold: 0.72,
          threshold: 0.6,
          ghostAttenuation: 25,
          ghostSpacing: 0.25,
        },
        godRays: {
          enabled: true,
          strength: 0.12,
          decay: 0.96,
          density: 0.8,
          samples: 32,
        },
        dof: {
          enabled: false,
          focusDistance: 40,
          blurStart: 10,
          blurEnd: 80,
          blurSize: 1,
          blurSpread: 3,
        },
        gtao: {
          enabled: false,
          intensity: 1.2,
          radius: 5,
          samples: 14,
          resolutionScale: 0.5,
          scale: 1,
          distanceFallOff: 1,
          distanceExponent: 1,
          thickness: 1,
          denoiseEnabled: true,
          denoiseRadius: 5,
          denoiseLumaPhi: 5,
          denoiseDepthPhi: 5,
          denoiseNormalPhi: 5,
        },
      };

      // ─── MAIN ────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({
          antialias: true,
          requiredLimits: { maxSampledTexturesPerShaderStage: 32 },
        });
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU")
            ? "WebGPU ✓"
            : "WebGL fallback";

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
          60,
          innerWidth / innerHeight,
          0.5,
          6000,
        );
        camera.position.set(0, 250, 450);
        camera.lookAt(0, 0, 0);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 10, 0);
        orbit.maxPolarAngle = PI * 0.48;
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        orbit.mouseButtons = {
          MIDDLE: THREE.MOUSE.ROTATE,
          RIGHT: THREE.MOUSE.PAN,
        };
        orbit.update();

        // ── LIGHTING ──
        function sunDirectionFromAngles(azDeg, elDeg) {
          const az = (azDeg * PI) / 180,
            el = (elDeg * PI) / 180;
          return new THREE.Vector3(
            Math.cos(el) * Math.cos(az),
            Math.sin(el),
            Math.cos(el) * Math.sin(az),
          ).normalize();
        }
        const _sunDir = sunDirectionFromAngles(
          PARAMS.light.sunAzimuth,
          PARAMS.light.sunElevation,
        );
        const dirLight = new THREE.DirectionalLight(
          PARAMS.light.dirColor,
          PARAMS.light.dirIntensity,
        );
        dirLight.position.copy(_sunDir.clone().multiplyScalar(600));
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 300;
        dirLight.shadow.camera.left = dirLight.shadow.camera.bottom = -100;
        dirLight.shadow.camera.right = dirLight.shadow.camera.top = 100;
        dirLight.shadow.bias = PARAMS.shadowBias;
        dirLight.shadow.normalBias = PARAMS.shadowNormalBias;
        const csm = new CSMShadowNode(dirLight, {
          cascades: PARAMS.csm.cascades,
          maxFar: PARAMS.csm.maxFar,
          mode: "practical",
          lightMargin: PARAMS.csm.lightMargin,
        });
        if (PARAMS.csm.enabled) dirLight.shadow.shadowNode = csm;

        function setCsmEnabled(on) {
          dirLight.shadow.shadowNode = on ? csm : null;
        }
        scene.add(dirLight);
        const shadowTarget = new THREE.Object3D();
        scene.add(shadowTarget);
        dirLight.target = shadowTarget;
        const hemiLight = new THREE.HemisphereLight(
          PARAMS.light.hemiSkyColor,
          PARAMS.light.hemiGroundColor,
          PARAMS.light.hemiIntensity,
        );
        scene.add(hemiLight);

        // ── TERRAIN GEOMETRY ──
        terrainGeo = new THREE.PlaneGeometry(
          TERRAIN_SIZE,
          TERRAIN_SIZE,
          DISPLAY_RES,
          DISPLAY_RES,
        );
        terrainGeo.rotateX(-PI / 2);
        syncGeometry(); // apply initial heightData

        const terrain = new THREE.Mesh(
          terrainGeo,
          new THREE.MeshStandardMaterial({ color: 0x4a6a30, roughness: 0.95 }),
        );
        terrain.receiveShadow = true;
        scene.add(terrain);

        // ── TILE MATERIAL (default view — toggle with ~ key) ──
        const tileMat = createTileMaterial({
          roughness: 0.95,
          textureScale: 400,
          tileColor: 0x999999,
          gridColor: 0x444444,
          gridLineColor: 0x111111,
        });
        terrain.material = tileMat;
        let usingTileMat = true;

        // ── TERRAIN EDGE SKIRT ──
        {
          const N = DISPLAY_RES;
          const NV = DISPLAY_VERTS;
          const SKIRT_BOTTOM = -(HEIGHT_SCALE + 20);

          // Build edge XZ lookup (4 sides, traversed so each side faces outward)
          // Side 0: North  (z=-half, x left→right)
          // Side 1: East   (x=+half, z top→bottom)
          // Side 2: South  (z=+half, x right→left — reversed for outward winding)
          // Side 3: West   (x=-half, z bottom→top — reversed)
          const half = TERRAIN_SIZE / 2;
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: (-0.5 + i / N) * TERRAIN_SIZE, wz: -half }); // North
          }
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: half, wz: (-0.5 + i / N) * TERRAIN_SIZE }); // East
          }
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: (0.5 - i / N) * TERRAIN_SIZE, wz: half }); // South (reversed)
          }
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: -half, wz: (0.5 - i / N) * TERRAIN_SIZE }); // West (reversed)
          }

          // Vertex buffer: per side, NV top + NV bottom interleaved: [top0, bot0, top1, bot1, ...]
          const skirtPos = new Float32Array(4 * NV * 2 * 3);
          const skirtIdx = [];

          for (let s = 0; s < 4; s++) {
            for (let i = 0; i < NV; i++) {
              const { wx, wz } = skirtEdgeXZ[s * NV + i];
              const hy = sampleHeight(wx, wz);
              const vi = (s * NV * 2 + i * 2) * 3;
              // top
              skirtPos[vi] = wx;
              skirtPos[vi + 1] = hy;
              skirtPos[vi + 2] = wz;
              // bottom
              skirtPos[vi + 3] = wx;
              skirtPos[vi + 4] = SKIRT_BOTTOM;
              skirtPos[vi + 5] = wz;
            }
            // Quad indices for this side
            const base = s * NV * 2;
            for (let i = 0; i < N; i++) {
              const tl = base + i * 2,
                bl = base + i * 2 + 1;
              const tr = base + (i + 1) * 2,
                br = base + (i + 1) * 2 + 1;
              skirtIdx.push(tl, bl, tr, bl, br, tr);
            }
          }

          skirtGeo = new THREE.BufferGeometry();
          skirtGeo.setAttribute(
            "position",
            new THREE.BufferAttribute(skirtPos, 3),
          );
          skirtGeo.setIndex(skirtIdx);
          skirtGeo.computeVertexNormals();

          const skirtMesh = new THREE.Mesh(
            skirtGeo,
            new THREE.MeshStandardMaterial({
              color: 0x5a4a3a,
              roughness: 0.95,
              side: THREE.DoubleSide,
            }),
          );
          skirtMesh.castShadow = true;
          skirtMesh.receiveShadow = true;
          scene.add(skirtMesh);
        }

        splatTex = new THREE.CanvasTexture(splatCanvas);
        splatTex.wrapS = splatTex.wrapT = THREE.ClampToEdgeWrapping;
        imgSplatTex = new THREE.DataTexture(
          imgSplatData,
          SPLAT_RES,
          SPLAT_RES,
          THREE.RGBAFormat,
        );
        imgSplatTex.wrapS = imgSplatTex.wrapT = THREE.ClampToEdgeWrapping;
        imgSplatTex.needsUpdate = true;

        // ── Auto-load project textures into image slots ───────────────────
        const _slotLoader = new THREE.TextureLoader();
        IMG_TEX_SLOTS.forEach((slot) => {
          if (slot.initAlbedo) {
            _slotLoader.load(slot.initAlbedo, (tex) => {
              slot.albedoTex.image = tex.image;
              slot.albedoTex.colorSpace = THREE.SRGBColorSpace;
              slot.albedoTex.wrapS = slot.albedoTex.wrapT =
                THREE.RepeatWrapping;
              slot.albedoTex.needsUpdate = true;
              slot.uHasAlbedo.value = 1;
            });
          }
          if (slot.initNormal) {
            _slotLoader.load(slot.initNormal, (tex) => {
              slot.normalTex.image = tex.image;
              slot.normalTex.colorSpace = THREE.LinearSRGBColorSpace;
              slot.normalTex.wrapS = slot.normalTex.wrapT =
                THREE.RepeatWrapping;
              slot.normalTex.needsUpdate = true;
              slot.uHasNormal.value = 1;
            });
          }
        });

        // ── GRASS DENSITY TEX ─────────────────────────────────────────────
        grassDensityTex = new THREE.CanvasTexture(grassDensityCanvas);
        grassDensityTex.wrapS = grassDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── MEADOW DENSITY TEX ────────────────────────────────────────────
        meadowDensityTex = new THREE.CanvasTexture(meadowCanvas);
        meadowDensityTex.wrapS = meadowDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── CLIFF DENSITY TEX ─────────────────────────────────────────────
        cliffDensityTex = new THREE.CanvasTexture(cliffDensityCanvas);
        cliffDensityTex.wrapS = cliffDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── HEIGHT TEX (for grass blade positioning) ──────────────────────
        const heightTexData = new Float32Array(HTEX_RES * HTEX_RES * 4);
        heightTex = new THREE.DataTexture(
          heightTexData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        heightTex.wrapS = heightTex.wrapT = THREE.ClampToEdgeWrapping;
        heightTex.magFilter = heightTex.minFilter = THREE.LinearFilter;

        // ── CLIFF HEIGHT TEX (cliff-only flat surfaces; -9999 where no cliff) ──
        const cliffHeightTexData = new Float32Array(HTEX_RES * HTEX_RES * 4);
        // Pre-fill with -9999 so grass blades go underground and are invisible by default
        for (let i = 0; i < HTEX_RES * HTEX_RES; i++) {
          cliffHeightTexData[i * 4] = cliffHeightTexData[i * 4 + 1] =
            cliffHeightTexData[i * 4 + 2] = -9999;
          cliffHeightTexData[i * 4 + 3] = 1;
        }
        cliffHeightTex = new THREE.DataTexture(
          cliffHeightTexData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        cliffHeightTex.wrapS = cliffHeightTex.wrapT = THREE.ClampToEdgeWrapping;
        cliffHeightTex.magFilter = cliffHeightTex.minFilter = THREE.LinearFilter;

        // ── AO + NORMAL MAP TEXTURES ──────────────────────────────────────────
        // Fill AO with 1.0 (no occlusion) and NM with flat (0.5, 0.5, 1.0) until baked
        for (let i = 0; i < HTEX_RES * HTEX_RES; i++) {
          aoData[i * 4] = aoData[i * 4 + 1] = aoData[i * 4 + 2] = 1;
          aoData[i * 4 + 3] = 1;
          nmData[i * 4] = 0.5;
          nmData[i * 4 + 1] = 0.5;
          nmData[i * 4 + 2] = 1;
          nmData[i * 4 + 3] = 1;
        }
        aoTex = new THREE.DataTexture(
          aoData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        aoTex.wrapS = aoTex.wrapT = THREE.ClampToEdgeWrapping;
        aoTex.magFilter = aoTex.minFilter = THREE.LinearFilter;
        aoTex.needsUpdate = true;

        normalMapTex = new THREE.DataTexture(
          nmData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        normalMapTex.wrapS = normalMapTex.wrapT = THREE.ClampToEdgeWrapping;
        normalMapTex.magFilter = normalMapTex.minFilter = THREE.LinearFilter;
        normalMapTex.needsUpdate = true;

        // ── BVH BAKE — cliff objects only; terrain uses full-res sampleHeight ──
        // Raycasting the 128-vertex terrain mesh introduces triangle-diagonal interpolation
        // errors on steep slopes (one slope under-sampled → grass goes underground).
        // Fix: use sampleHeight (512-res heightData) as baseline; only raycast cliffs
        // to detect surfaces above the terrain, then take max(terrain, cliff).
        const _bvhV = new THREE.Vector3();
        const _bvhRay = new THREE.Ray(
          new THREE.Vector3(),
          new THREE.Vector3(0, -1, 0),
        );
        bakeBVH = function () {
          scene.updateMatrixWorld(true);

          // Build BVH from cliff objects only (not terrain mesh)
          const positions = [],
            idxList = [];
          let vOffset = 0;
          function addMesh(mesh) {
            const geo = mesh.geometry;
            const posAttr = geo.attributes.position;
            const mat = mesh.matrixWorld;
            for (let i = 0; i < posAttr.count; i++) {
              _bvhV.fromBufferAttribute(posAttr, i).applyMatrix4(mat);
              positions.push(_bvhV.x, _bvhV.y, _bvhV.z);
            }
            if (geo.index) {
              const idx = geo.index.array;
              for (let i = 0; i < idx.length; i++)
                idxList.push(idx[i] + vOffset);
            } else {
              for (let i = 0; i < posAttr.count; i++) idxList.push(i + vOffset);
            }
            vOffset += posAttr.count;
          }
          function addGeoWithMatrix(geo, mat) {
            const posAttr = geo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
              _bvhV.fromBufferAttribute(posAttr, i).applyMatrix4(mat);
              positions.push(_bvhV.x, _bvhV.y, _bvhV.z);
            }
            if (geo.index) {
              const idx = geo.index.array;
              for (let i = 0; i < idx.length; i++)
                idxList.push(idx[i] + vOffset);
            } else {
              for (let i = 0; i < posAttr.count; i++) idxList.push(i + vOffset);
            }
            vOffset += posAttr.count;
          }
          cliffObjects.forEach((root) =>
            root.traverse((o) => {
              if (o.isMesh) addMesh(o);
            }),
          );
          // Also include all instances from the Cliffs Mode instancer
          if (cliffInstancer)
            cliffInstancer.forEachMeshInstance((geo, mat) => addGeoWithMatrix(geo, mat));

          // Build cliff BVH only if there are any cliff meshes
          let cliffBvh = null;
          if (positions.length > 0) {
            const mergedGeo = new THREE.BufferGeometry();
            mergedGeo.setAttribute(
              "position",
              new THREE.BufferAttribute(new Float32Array(positions), 3),
            );
            mergedGeo.setIndex(
              new THREE.BufferAttribute(new Uint32Array(idxList), 1),
            );
            cliffBvh = new MeshBVH(mergedGeo);
            // mergedGeo can be GC'd after MeshBVH stores its internal data
          }

          // Build a BVH from the actual terrain mesh geometry so heightTexData
          // gets the exact same triangle-interpolated heights the GPU renders.
          // This is the village5.html approach and is the only way to be exact.
          const terrainBvh = new MeshBVH(terrainGeo);
          const _terrainRay = new THREE.Ray(
            new THREE.Vector3(0, 99999, 0),
            new THREE.Vector3(0, -1, 0),
          );

          for (let iz = 0; iz < HTEX_RES; iz++) {
            for (let ix = 0; ix < HTEX_RES; ix++) {
              // CPU grid positions for bvhGrid (bilinear lookup — no half-texel needed)
              const wx = (-0.5 + ix / HTEX_RES) * TERRAIN_SIZE;
              const wz = (-0.5 + iz / HTEX_RES) * TERRAIN_SIZE;
              // GPU texel-center positions for heightTexData (LinearFilter reads centers)
              const wxG = (-0.5 + (ix + 0.5) / HTEX_RES) * TERRAIN_SIZE;
              const wzG = (-0.5 + (iz + 0.5) / HTEX_RES) * TERRAIN_SIZE;

              // GPU: raycast at texel-center — matches LinearFilter reads in grass shader
              _terrainRay.origin.set(wxG, 99999, wzG);
              const terrainHitG = terrainBvh.raycastFirst(
                _terrainRay,
                THREE.DoubleSide,
              );
              let hGpu = terrainHitG
                ? terrainHitG.point.y
                : sampleHeight(wxG, wzG);

              // CPU: raycast at grid-corner — matches bvhHeight() bilinear lookup positions
              _terrainRay.origin.set(wx, 99999, wz);
              const terrainHitC = terrainBvh.raycastFirst(
                _terrainRay,
                THREE.DoubleSide,
              );
              let hCpu = terrainHitC
                ? terrainHitC.point.y
                : sampleHeight(wx, wz);

              if (cliffBvh) {
                _bvhRay.origin.set(wx, 99999, wz);
                const hit = cliffBvh.raycastFirst(_bvhRay, THREE.DoubleSide);
                if (hit && hit.point.y > hCpu) {
                  hCpu = hit.point.y; // bvhGrid always gets cliff height (props/trees/player)
                  // NOTE: terrain heightTex (hGpu) intentionally NOT updated with cliff height.
                  // Layer 1 (terrain grass) ignores cliffs entirely — cliff mesh naturally occludes it.
                }
              }

              bvhGrid[iz * HTEX_RES + ix] = hCpu;
              const i4 = (iz * HTEX_RES + ix) * 4;
              heightTexData[i4] =
                heightTexData[i4 + 1] =
                heightTexData[i4 + 2] =
                  hGpu;
              heightTexData[i4 + 3] = 1;

              // ── CLIFF HEIGHT TEX: only flat cliff surfaces (face.normal.y > 0.3) ──
              // Blades positioned here root at the cliff top. All other positions = -9999
              // so blades stay underground (invisible) without needing a density mask.
              {
                const cliffI4 = (iz * HTEX_RES + ix) * 4;
                let cliffH = -9999;
                if (cliffBvh) {
                  _bvhRay.origin.set(wxG, 99999, wzG);
                  const cliffHit = cliffBvh.raycastFirst(_bvhRay, THREE.DoubleSide);
                  if (cliffHit && cliffHit.face.normal.y > 0.3) {
                    cliffH = cliffHit.point.y;
                  }
                }
                cliffHeightTexData[cliffI4] =
                  cliffHeightTexData[cliffI4 + 1] =
                  cliffHeightTexData[cliffI4 + 2] = cliffH;
                cliffHeightTexData[cliffI4 + 3] = 1;
              }
            }
          }
          heightTex.needsUpdate = true;
          cliffHeightTex.needsUpdate = true;
        };
        bakeBVH();

        // ── DUMMY TRAIL TEX ───────────────────────────────────────────────
        const trailTex = new THREE.DataTexture(
          new Float32Array(4),
          1,
          1,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        trailTex.needsUpdate = true;

        // ── GRASS SETUP ───────────────────────────────────────────────────
        const grassParams = {
          grassWidth: 0.08,
          grassHeight: 0.7,
          lodDistance: 28,
          maxDistance: 80,
          lodBlendStart: 0.35,
          nearRingExtent: 3,
          nearFadeRange: 8,
          grassBladesRegular: 1.0,
          grassBladesNear: 1.0,
          gradientCurve: 2.0,
          baseColor1: "#143210",
          baseColor2: "#183a12",
          tipColor1: "#a6cc40",
          tipColor2: "#cce666",
          colorVariation: 0.3,
          lushColor: "#1a4a0a",
          bleachedColor: "#d4cc80",
          windSpeed: 1.0,
          windStrength: 0.4,
          windWaveScale: 0.08,
          windDir: 0.7,
          windGust: 0.3,
          windMicroSway: 0.15,
          interactionRange: 1.8,
          interactionStrength: 0.35,
          interactionHeightThreshold: 1.5,
          minSkyBlend: 0.55,
          maxSkyBlend: 0.7,
          aoEnabled: true,
          aoIntensity: 1.0,
          bsIntensity: 0.4,
          bsColor: "#51cc66",
          bsPower: 2.0,
          frontScatter: 0.3,
          rimSSS: 0.4,
          specV1Enabled: false,
          specV1Intensity: 1.5,
          specV1Color: "#ffffff",
          specV1DirX: -1.0,
          specV1DirY: 1.0,
          specV1DirZ: 0.5,
          specV2Enabled: false,
          specV2Intensity: 1.0,
          specV2Color: "#ffffff",
          specV2DirX: -1.0,
          specV2DirY: 0.45,
          specV2DirZ: 1.0,
          specV2NoiseScale: 3.0,
          specV2NoiseStr: 0.6,
          specV2Power: 12.0,
          specV2TipBias: 0.5,
          seasonalScale: 0.02,
          seasonalDryColor: "#8b7d3c",
          sunAzimuth: PARAMS.light.sunAzimuth,
          sunElevation: PARAMS.light.sunElevation,
        };
        grassUniforms = createUniforms(grassParams, TERRAIN_SIZE, 1);
        const grassCtx = {
          ...grassUniforms,
          heightTex,
          grassDensityTex,
          trailTex,
          PI: Math.PI,
        };
        const PATCH_SPACING = GRASS_PATCH_SIZE;
        const GRID_SIZE = 12;
        const geoLow = createGrassGeometry(
          GRASS_SEGMENTS_LOW,
          GRASS_DENSITY_LOW,
          GRASS_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const geoMid = createGrassGeometry(
          GRASS_SEGMENTS_MID,
          GRASS_DENSITY_MID,
          GRASS_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const geoHigh = createGrassGeometry(
          GRASS_SEGMENTS_HIGH,
          GRASS_DENSITY,
          GRASS_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const geoNear = createGrassGeometry(
          GRASS_SEGMENTS_HIGH,
          GRASS_DENSITY,
          NEAR_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const matLow = createGrassMaterial(
          GRASS_SEGMENTS_LOW,
          GRASS_VERTS_LOW,
          false,
          "regular",
          grassCtx,
        );
        const matMid = createGrassMaterial(
          GRASS_SEGMENTS_MID,
          GRASS_VERTS_MID,
          false,
          "regular",
          grassCtx,
        );
        const matHigh = createGrassMaterial(
          GRASS_SEGMENTS_HIGH,
          GRASS_VERTS_HIGH,
          false,
          "regular",
          grassCtx,
        );
        const matNear = createGrassMaterial(
          GRASS_SEGMENTS_HIGH,
          GRASS_VERTS_HIGH,
          false,
          "near",
          grassCtx,
        );
        const grassGroup = new THREE.Group();
        scene.add(grassGroup);
        grassPatchSystem = setupGrassPatches(
          scene,
          camera,
          grassGroup,
          {
            geoLow,
            geoMid,
            geoHigh,
            geoNear,
            matLowSimple: matLow,
            matMidSimple: matMid,
            matHighSimple: matHigh,
            matHighSimpleNear: matNear,
          },
          {
            PATCH_SPACING,
            GRID_SIZE,
            NEAR_PATCH_SIZE,
            nearRingExtent: grassParams.nearRingExtent,
            lodDistance: grassParams.lodDistance,
            lodDistanceMid: grassParams.lodDistance * 1.4,
            maxDistance: grassParams.maxDistance,
          },
        );

        // ── CLIFF GRASS PATCH SYSTEM (Layer 2) ───────────────────────────────
        // Reuses the same geometry and uniforms as terrain grass but with
        // cliffHeightTex (flat cliff surfaces only) and cliffDensityTex.
        // Blades underground (-9999) are invisible — opaque cliff mesh occludes terrain grass below.
        const cliffGrassCtx = {
          ...grassUniforms,
          heightTex: cliffHeightTex,
          grassDensityTex: cliffDensityTex,
          trailTex,
          PI: Math.PI,
        };
        const cliffMatLow = createGrassMaterial(
          GRASS_SEGMENTS_LOW, GRASS_VERTS_LOW, false, "regular", cliffGrassCtx,
        );
        const cliffMatMid = createGrassMaterial(
          GRASS_SEGMENTS_MID, GRASS_VERTS_MID, false, "regular", cliffGrassCtx,
        );
        const cliffMatHigh = createGrassMaterial(
          GRASS_SEGMENTS_HIGH, GRASS_VERTS_HIGH, false, "regular", cliffGrassCtx,
        );
        const cliffMatNear = createGrassMaterial(
          GRASS_SEGMENTS_HIGH, GRASS_VERTS_HIGH, false, "near", cliffGrassCtx,
        );
        const cliffGrassGroup = new THREE.Group();
        scene.add(cliffGrassGroup);
        cliffGrassPatchSystem = setupGrassPatches(
          scene,
          camera,
          cliffGrassGroup,
          {
            geoLow,
            geoMid,
            geoHigh,
            geoNear,
            matLowSimple: cliffMatLow,
            matMidSimple: cliffMatMid,
            matHighSimple: cliffMatHigh,
            matHighSimpleNear: cliffMatNear,
          },
          {
            PATCH_SPACING,
            GRID_SIZE,
            NEAR_PATCH_SIZE,
            nearRingExtent: grassParams.nearRingExtent,
            lodDistance: grassParams.lodDistance,
            lodDistanceMid: grassParams.lodDistance * 1.4,
            maxDistance: grassParams.maxDistance,
          },
        );

        // ── COLOR HELPER — hex sRGB → linear THREE.Color (matches testtsushimaplayer2) ──
        function toLinear(hex) {
          return new THREE.Color(hex).convertSRGBToLinear();
        }

        // ── PROCEDURAL GROUND SHADER — same layer system as tsl-texture-editor ──
        function noiseTypeToIndex(s) {
          return (
            { value: 0, perlin: 1, simplex: 2, voronoi: 3, white: 4 }[s] ?? 0
          );
        }

        function selectGroundNoise(nVal, nPerl, nSim, nVoro, nWhite, uType) {
          let n = nVal;
          n = mix(n, nPerl, step(float(0.5), uType));
          n = mix(n, nSim, step(float(1.5), uType));
          n = mix(n, nVoro, step(float(2.5), uType));
          n = mix(n, nWhite, step(float(3.5), uType));
          return n;
        }

        function groundLayerUniforms(L) {
          return {
            enable: uniform(L.enable ? 1 : 0),
            noiseType: uniform(noiseTypeToIndex(L.noiseType)),
            color: uniform(new THREE.Color(L.color).convertSRGBToLinear()),
            strength: uniform(L.strength, "float"),
            useFbm: uniform(L.useFbm ? 1 : 0),
            octaves: uniform(L.octaves, "float"),
            lacunarity: uniform(L.lacunarity, "float"),
            gain: uniform(L.gain, "float"),
            scale: uniform(L.scale, "float"),
            offsetX: uniform(L.offsetX, "float"),
            offsetY: uniform(L.offsetY, "float"),
            invert: uniform(L.invert ? 1 : 0),
            maskLow: uniform(L.maskLow, "float"),
            maskHigh: uniform(L.maskHigh, "float"),
            maskSharpness: uniform(L.maskSharpness, "float"),
            voronoiJitter: uniform(L.voronoiJitter, "float"),
          };
        }

        const gPARAMS = {
          brightness: 1.0,
          contrast: 1.0,
          baseColor: "#3a5a25",
          layer1: {
            enable: true,
            noiseType: "perlin",
            color: "#2a4518",
            strength: 0.6,
            useFbm: true,
            octaves: 3,
            lacunarity: 2.0,
            gain: 0.5,
            scale: 0.015,
            offsetX: 0,
            offsetY: 0,
            invert: false,
            maskLow: 0.35,
            maskHigh: 0.7,
            maskSharpness: 1.0,
            voronoiJitter: 0.8,
          },
          layer2: {
            enable: false,
            noiseType: "perlin",
            color: "#5aaa30",
            strength: 0.4,
            useFbm: true,
            octaves: 2.5,
            lacunarity: 2.2,
            gain: 0.5,
            scale: 0.04,
            offsetX: 13.7,
            offsetY: 31.1,
            invert: false,
            maskLow: 0.4,
            maskHigh: 0.75,
            maskSharpness: 1.0,
            voronoiJitter: 0.7,
          },
        };

        const gBase = uniform(
          new THREE.Color(gPARAMS.baseColor).convertSRGBToLinear(),
        );
        const gContrast = uniform(gPARAMS.contrast, "float");
        const gBrightness = uniform(gPARAMS.brightness, "float");
        const gL1 = groundLayerUniforms(gPARAMS.layer1);
        const gL2 = groundLayerUniforms(gPARAMS.layer2);

        function groundLayerMask(U) {
          const p = vec2(
            positionWorld.x.mul(U.scale).add(U.offsetX),
            positionWorld.z.mul(U.scale).add(U.offsetY),
          );
          const nVal = valueNoise2D(p);
          const nPerlS = perlinNoise2D(p);
          const nPerlF = fbmPerlin2D(p, U.octaves, U.lacunarity, U.gain);
          const nPerl = mix(nPerlS, nPerlF, U.useFbm);
          const nSim = simplexNoise2D(p);
          const nVoro = voronoiF1Normalized(p, U.voronoiJitter);
          const nWhite = whiteNoise2D(p);
          let n = selectGroundNoise(
            nVal,
            nPerl,
            nSim,
            nVoro,
            nWhite,
            U.noiseType,
          );
          n = mix(n, float(1).sub(n), U.invert);
          const raw = smoothstep(U.maskLow, U.maskHigh, n);
          const mask = pow(raw.max(float(0.0001)), U.maskSharpness)
            .mul(U.strength)
            .mul(U.enable);
          return mask;
        }

        const groundProc = Fn(() => {
          let col = gBase;
          col = mix(col, gL1.color, groundLayerMask(gL1));
          col = mix(col, gL2.color, groundLayerMask(gL2));
          col = clamp(
            col.sub(float(0.5)).mul(gContrast).add(float(0.5)).mul(gBrightness),
            0,
            1,
          );
          return col;
        });

        // ── PROCEDURAL MEADOW SHADER — yellowish variant of groundProc ──
        const sPARAMS = {
          brightness: 1.05,
          contrast: 1.1,
          baseColor: "#c8a832",
          layer1: {
            enable: true,
            noiseType: "perlin",
            color: "#a07818",
            strength: 0.55,
            useFbm: true,
            octaves: 3,
            lacunarity: 2.0,
            gain: 0.5,
            scale: 0.018,
            offsetX: 17.3,
            offsetY: 42.6,
            invert: false,
            maskLow: 0.3,
            maskHigh: 0.65,
            maskSharpness: 1.0,
            voronoiJitter: 0.8,
          },
          layer2: {
            enable: true,
            noiseType: "perlin",
            color: "#e0c850",
            strength: 0.35,
            useFbm: true,
            octaves: 2.5,
            lacunarity: 2.2,
            gain: 0.5,
            scale: 0.045,
            offsetX: 88.1,
            offsetY: 16.4,
            invert: false,
            maskLow: 0.45,
            maskHigh: 0.78,
            maskSharpness: 1.0,
            voronoiJitter: 0.7,
          },
        };
        const sBase = uniform(
          new THREE.Color(sPARAMS.baseColor).convertSRGBToLinear(),
        );
        const sContrast = uniform(sPARAMS.contrast, "float");
        const sBrightness = uniform(sPARAMS.brightness, "float");
        const sL1 = groundLayerUniforms(sPARAMS.layer1);
        const sL2 = groundLayerUniforms(sPARAMS.layer2);

        const meadowProc = Fn(() => {
          let col = sBase;
          col = mix(col, sL1.color, groundLayerMask(sL1));
          col = mix(col, sL2.color, groundLayerMask(sL2));
          col = clamp(
            col.sub(float(0.5)).mul(sContrast).add(float(0.5)).mul(sBrightness),
            0,
            1,
          );
          return col;
        });

        // ── PROCEDURAL CLIFF SHADER — rocky grey-brown for steep slopes ──
        const cPARAMS = {
          brightness: 1.0,
          contrast: 1.2,
          baseColor: "#6b5e52",
          layer1: {
            enable: true,
            noiseType: "voronoi",
            color: "#3d3228",
            strength: 0.7,
            useFbm: false,
            octaves: 3,
            lacunarity: 2.0,
            gain: 0.5,
            scale: 0.03,
            offsetX: 5.3,
            offsetY: 9.7,
            invert: false,
            maskLow: 0.3,
            maskHigh: 0.65,
