        // ── MODE SYSTEM ──
        function setMode(mode) {
          const leavingPlay = currentMode === "play" && mode !== "play";
          currentMode = mode;
          PARAMS.mode = mode;

          if (leavingPlay) exitPlayMode();

          if (mode === "play") {
            enterPlayMode();
            const badge = document.getElementById("mode-badge");
            badge.textContent = "PLAY MODE  [ F / Esc to exit ]";
            badge.className = "play";
            renderer.domElement.style.cursor = "none";
            return;
          }

          pane.refresh();
          orbit.enabled = mode !== "play";

          paintFolder.hidden = mode !== "paint";
          sculptFolder.hidden = mode !== "sculpt";
          placeFolder.hidden = mode !== "place";
          grassFolder.hidden = mode !== "grass";
          treesFolder.hidden = mode !== "trees";
          foliageFolder.hidden = mode !== "foliage";
          propsFolder.hidden = mode !== "props";
          pathFolder.hidden = mode !== "path";
          waterFolder.hidden = mode !== "water";
          cliffsFolder.hidden = mode !== "cliffs";
          brushFolder.hidden =
            mode === "view" ||
            mode === "place" ||
            mode === "props" ||
            mode === "water" ||
            mode === "cliffs";

          const usingTC =
            mode === "place" || mode === "props" || mode === "water" || mode === "cliffs";
          if (!usingTC && transformControls) {
            if (tcHelper) tcHelper.visible = false;
            transformControls.enabled = false;
            transformControls.detach();
            selectedCliff = null;
            selectedProp = null;
            selectWater(null);
          } else if (usingTC && transformControls) {
            transformControls.enabled = true;
            if (mode === "place") {
              selectedProp = null;
              selectWater(null);
            }
            if (mode === "props") {
              selectedCliff = null;
              selectWater(null);
            }
            if (mode === "water") {
              selectedCliff = null;
              selectedProp = null;
            }
            if (mode === "cliffs") {
              selectedCliff = null;
              selectedProp = null;
              selectWater(null);
              // Re-attach gizmo if an instance was already selected
              if (cliffInstancer.hasSelection()) {
                transformControls.attach(cliffInstancer.proxyObject);
                tcHelper.visible = true;
              } else {
                transformControls.detach();
                tcHelper.visible = false;
              }
            }
          }

          const badge = document.getElementById("mode-badge");
          badge.textContent =
            mode === "view"
              ? "VIEW MODE"
              : mode === "paint"
                ? "PAINT MODE"
                : mode === "sculpt"
                  ? "SCULPT MODE"
                  : mode === "grass"
                    ? "GRASS MODE"
                    : mode === "trees"
                      ? "TREES MODE"
                      : mode === "foliage"
                        ? "FOLIAGE MODE  [ N ]"
                        : mode === "props"
                          ? "PROPS MODE  [ I ]"
                          : mode === "water"
                            ? "WATER BODIES  [ W ]"
                            : mode === "path"
                              ? "PATH MODE  [ L ]"
                              : mode === "cliffs"
                                ? "CLIFFS MODE  [ C ]"
                                : mode === "cliffgrass"
                                  ? "CLIFF GRASS MODE"
                                  : "PLACE MODE"; // play handled above
          badge.className = mode;
          renderer.domElement.style.cursor =
            mode === "view" ? "default" : "crosshair";
          if (
            mode === "view" ||
            mode === "place" ||
            mode === "props" ||
            mode === "water" ||
            mode === "cliffs"
          )
            brushRing.visible = false;
          else if (mode === "cliffgrass")
            brushRing.visible = true;
        }
        setMode("view");

        // ── KEYBOARD ──
        window.addEventListener("keyup", (e) => {
          keysHeld[e.code] = false;
        });

        window.addEventListener("keydown", (e) => {
          // Play mode: track WASD, only allow exit keys
          if (currentMode === "play") {
            keysHeld[e.code] = true;
            if (e.code.startsWith("Arrow")) e.preventDefault();
            if (e.code === "Escape" || e.code === "KeyF") setMode("view");
            return;
          }
          if (e.code === "KeyF") {
            setMode("play");
            return;
          }
          if (e.code === "KeyP")
            setMode(currentMode === "paint" ? "view" : "paint");
          if (e.code === "KeyS" && currentMode !== "place")
            setMode(currentMode === "sculpt" ? "view" : "sculpt");
          if (e.code === "KeyO")
            setMode(currentMode === "place" ? "view" : "place");
          if (e.code === "KeyG")
            setMode(currentMode === "grass" ? "view" : "grass");
          if (e.code === "KeyT" && currentMode !== "water")
            setMode(currentMode === "trees" ? "view" : "trees");
          if (e.code === "KeyN")
            setMode(currentMode === "foliage" ? "view" : "foliage");
          if (e.code === "KeyI")
            setMode(currentMode === "props" ? "view" : "props");
          if (e.code === "KeyL")
            setMode(currentMode === "path" ? "view" : "path");
          if (
            e.code === "KeyW" &&
            currentMode !== "place" &&
            currentMode !== "props" &&
            currentMode !== "cliffs" &&
            currentMode !== "water"
          )
            setMode("water");
          else if (e.code === "KeyW" && currentMode === "water")
            setMode("view");
          if (e.code === "Escape") {
            if (rampPointA) { rampPointA = null; rampMarker.visible = false; }
            else setMode("view");
          }
          if (e.code === "Backquote") toggleTerrainMat();
          if (e.code === "KeyC")
            setMode(currentMode === "cliffs" ? "view" : "cliffs");
          if (currentMode === "cliffs") {
            if (e.code === "KeyW") { e.preventDefault(); transformControls.setMode("translate"); }
            if (e.code === "KeyE") { e.preventDefault(); transformControls.setMode("rotate"); }
            if (e.code === "KeyR") { e.preventDefault(); transformControls.setMode("scale"); }
            if (e.code === "Delete") {
              cliffInstancer.deleteSelected();
              transformControls.detach();
              if (tcHelper) tcHelper.visible = false;
              ciRefreshProxy();
              pane.refresh();
            }
          }
          if (currentMode === "place") {
            if (e.code === "KeyW") {
              e.preventDefault();
              transformControls.setMode("translate");
            }
            if (e.code === "KeyE") {
              e.preventDefault();
              transformControls.setMode("rotate");
            }
            if (e.code === "KeyR") {
              e.preventDefault();
              transformControls.setMode("scale");
            }
            if (e.code === "Delete" && selectedCliff) {
              scene.remove(selectedCliff);
              cliffObjects = cliffObjects.filter((c) => c !== selectedCliff);
              selectCliff(null);
              if (bakeBVH) bakeBVH();
            }
          }
          if (currentMode === "props") {
            if (e.code === "KeyW") {
              e.preventDefault();
              transformControls.setMode("translate");
            }
            if (e.code === "KeyE") {
              e.preventDefault();
              transformControls.setMode("rotate");
            }
            if (e.code === "KeyR") {
              e.preventDefault();
              transformControls.setMode("scale");
            }
            if (e.code === "Delete" && selectedProp) {
              scene.remove(selectedProp);
              propObjects = propObjects.filter((p) => p !== selectedProp);
              selectProp(null);
            }
          }
          if (currentMode === "water") {
            if (e.code === "KeyE") {
              e.preventDefault();
              transformControls.setMode("translate");
            }
            if (e.code === "KeyR") {
              e.preventDefault();
              transformControls.setMode("rotate");
            }
            if (e.code === "KeyT") {
              e.preventDefault();
              transformControls.setMode("scale");
            }
            if (e.code === "Delete" && selectedWater) {
              scene.remove(selectedWater);
              waterObjects = waterObjects.filter((m) => m !== selectedWater);
              selectWater(null);
            }
          }
        });

        // ── MOUSE ──
        renderer.domElement.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          if (currentMode !== "cliffs") return;
          // Right click = select existing instance
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const ciHit = cliffInstancer.raycastInstances(raycaster);
          if (ciHit) {
            cliffInstancer.selectInstance(ciHit.typeIdx, ciHit.instIdx);
            transformControls.attach(cliffInstancer.proxyObject);
            tcHelper.visible = true;
            ciRefreshProxy();
            pane.refresh();
          } else {
            cliffInstancer.clearSelection();
            transformControls.detach();
            tcHelper.visible = false;
            ciRefreshProxy();
            pane.refresh();
          }
        });

        renderer.domElement.addEventListener("mousemove", (e) => {
          if (
            currentMode === "view" ||
            currentMode === "place" ||
            currentMode === "props" ||
            currentMode === "water" ||
            currentMode === "cliffs"
          )
            return;
          const p = getTerrainHit(e);
          updateBrushRing(p);
          if (!isMouseDown || !p) return;
          if (currentMode === "paint") paintAt(p.x, p.z);
          if (currentMode === "sculpt") sculptAt(p.x, p.z, e);
          if (currentMode === "path") pathPaintAt(p.x, p.z);
          if (currentMode === "grass")
            paintGrassAt(p.x, p.z, grassEraseMode || e.shiftKey);
          if (currentMode === "cliffgrass")
            paintCliffGrassAt(p.x, p.z, cliffGrassEraseMode || e.shiftKey);
          if (currentMode === "trees")
            paintTreesAt(p.x, p.z, treeEraseMode || e.shiftKey);
          if (currentMode === "foliage")
            paintFoliageAt(p.x, p.z, foliageEraseMode || e.shiftKey);
        });

        // ── BRUSH SCROLL SHORTCUTS ──────────────────────────────────────
        // Shift + scroll = radius  |  Alt + scroll = strength
        renderer.domElement.addEventListener("wheel", (e) => {
          if (!e.shiftKey && !e.altKey) return; // let OrbitControls handle plain scroll
          e.preventDefault();
          e.stopPropagation();
          const dir = e.deltaY < 0 ? 1 : -1;
          if (e.shiftKey) {
            PARAMS.brushSize = Math.min(80, Math.max(2, PARAMS.brushSize + dir * 2));
            brushSize = PARAMS.brushSize;
          } else {
            PARAMS.brushStrength = Math.min(100, Math.max(5, PARAMS.brushStrength + dir * 5));
            brushStr = PARAMS.brushStrength;
          }
          pane.refresh();
        }, { passive: false, capture: true });

        renderer.domElement.addEventListener("mousedown", (e) => {
          if (e.button !== 0) return;
          // Ripple on ocean water click (any mode)
          {
            const rect = renderer.domElement.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const my = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);
            const wHit = raycaster.intersectObject(water, false);
            if (wHit.length > 0) rippleAdd(wHit[0].point.x, wHit[0].point.z);
          }
          if (currentMode === "view") return;

          if (currentMode === "place") {
            if (transformControls.axis !== null) return; // clicking gizmo handle
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const cliffMeshes = [];
            cliffObjects.forEach((root) =>
              root.traverse((o) => {
                if (o.isMesh) cliffMeshes.push(o);
              }),
            );
            const cliffHits = raycaster.intersectObjects(cliffMeshes, false);
            if (cliffHits.length > 0) {
              const root = getCliffRoot(cliffHits[0].object);
              if (root) {
                selectCliff(root);
                return;
              }
            }
            const p = getTerrainHit(e);
            if (p) placeCliff(p.x, p.y, p.z, activeCliffModel);
            return;
          }

          if (currentMode === "props") {
            if (transformControls.axis !== null) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const propMeshes = [];
            propObjects.forEach((root) =>
              root.traverse((o) => {
                if (o.isMesh) propMeshes.push(o);
              }),
            );
            const propHits = raycaster.intersectObjects(propMeshes, false);
            if (propHits.length > 0) {
              const root = getPropRoot(propHits[0].object);
              if (root) {
                selectProp(root);
                return;
              }
            }
            // Click on terrain → place new prop
            const pt = getTerrainHit(e);
            if (pt) placeProp(pt.x, pt.y, pt.z);
            return;
          }

          if (currentMode === "cliffs") {
            if (transformControls.axis !== null) return; // clicking gizmo handle
            // Left click = place new instance on terrain
            const pt = getTerrainHit(e);
            if (pt) {
              cliffInstancer.placeAt(pt.x, pt.y, pt.z);
              ciRefreshProxy();
            }
            return;
          }

          if (currentMode === "water") {
            if (transformControls.axis !== null) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            // Try hitting an existing water body first
            const waterHits = raycaster.intersectObjects(waterObjects, false);
            if (waterHits.length > 0) {
              selectWater(
                getWaterRoot(waterHits[0].object) ?? waterHits[0].object,
              );
              return;
            }
            // Click on terrain → place new water body
            const pt = getTerrainHit(e);
            if (pt) placeWater(pt.x, pt.y, pt.z);
            return;
          }

          isMouseDown = true;
          brushNoiseSeed = Math.random() * 1000;
          if (
            currentMode === "paint" ||
            currentMode === "sculpt" ||
            currentMode === "path"
          )
            pushUndo();
          const p = getTerrainHit(e);
          if (!p) return;
          if (currentMode === "sculpt" && sculptMode === "ramp") {
            if (!rampPointA) {
              rampPointA = { x: p.x, y: sampleHeight(p.x, p.z), z: p.z };
              rampMarker.position.set(p.x, rampPointA.y + 1, p.z);
              rampMarker.visible = true;
            } else {
              applyRamp(rampPointA, { x: p.x, y: sampleHeight(p.x, p.z), z: p.z });
              rampPointA = null;
              rampMarker.visible = false;
            }
            return;
          }
          if (currentMode === "sculpt" && e.altKey)
            flattenTargetY = sampleHeight(p.x, p.z);
          if (currentMode === "paint") paintAt(p.x, p.z);
          if (currentMode === "sculpt") sculptAt(p.x, p.z, e);
          if (currentMode === "path") pathPaintAt(p.x, p.z);
          if (currentMode === "trees")
            paintTreesAt(p.x, p.z, treeEraseMode || e.shiftKey);
          if (currentMode === "foliage")
            paintFoliageAt(p.x, p.z, foliageEraseMode || e.shiftKey);
        });

        renderer.domElement.addEventListener("mouseup", () => {
          if (!isMouseDown) return;
          isMouseDown = false;
          if (
            currentMode === "paint" ||
            currentMode === "sculpt" ||
            currentMode === "path"
          ) {
            generateObjects(scene);
          }
          if (currentMode === "sculpt" || currentMode === "path") {
            if (bakeBVH) bakeBVH();
            if (treeSystem) treeSystem.syncHeights();
            FOLIAGE_SLOTS.forEach((s) => {
              if (s.system) s.system.syncHeights();
            });
            propObjects.forEach((root) => {
              root.position.y = bvhHeight(root.position.x, root.position.z);
            });
          }
        });

        renderer.domElement.addEventListener("mouseleave", () => {
          isMouseDown = false;
          brushRing.visible = false;
        });

        // ── RESIZE ──
        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        // ── RENDER PIPELINE (post-processing) ──
        const renderPipeline = new THREE.RenderPipeline(renderer);
        renderPipeline.outputColorTransform = false;

        // MRT: beauty + normal (for GTAO)
        const scenePass = pass(scene, camera);
        scenePass.setMRT(
          mrt({
            output,
            emissive,
            normal: directionToColor(normalView),
          }),
        );
        const scenePassColor = scenePass.getTextureNode("output");
        const emissivePass = scenePass.getTextureNode("emissive");
        const scenePassDepth = scenePass.getTextureNode("depth");
        const scenePassNormalEncoded = scenePass.getTextureNode("normal");
        const scenePassNormal = sample((uvCoord) =>
          colorToDirection(scenePassNormalEncoded.sample(uvCoord)),
        );
        const normalTexture = scenePass.getTexture("normal");
        if (normalTexture) normalTexture.type = THREE.UnsignedByteType;

        // Emissive bloom (water glow, etc.)
        const emissiveBloomPass = bloom(emissivePass, 2);
        let postBaseColor = scenePassColor.add(emissiveBloomPass);

        // GTAO (screen-space ambient occlusion)
        const uGtaoEnabled = uniform(
          postParams.enabled && postParams.gtao.enabled ? 1 : 0,
        );
        const uGtaoIntensity = uniform(postParams.gtao.intensity);
        const gtaoPass = gtaoEffect(scenePassDepth, scenePassNormal, camera);
        gtaoPass.resolutionScale = postParams.gtao.resolutionScale;
        gtaoPass.radius.value = postParams.gtao.radius;
        gtaoPass.samples.value = postParams.gtao.samples;
        gtaoPass.scale.value = postParams.gtao.scale;
        gtaoPass.distanceFallOff.value = postParams.gtao.distanceFallOff;
        gtaoPass.distanceExponent.value = postParams.gtao.distanceExponent;
        gtaoPass.thickness.value = postParams.gtao.thickness;
        const gtaoTex = gtaoPass.getTextureNode();
        const denoisePass = denoise(
          gtaoTex,
          scenePassDepth,
          scenePassNormal,
          camera,
        );
        denoisePass.updateBefore = () => {};
        denoisePass.radius.value = postParams.gtao.denoiseRadius;
        denoisePass.lumaPhi.value = postParams.gtao.denoiseLumaPhi;
        denoisePass.depthPhi.value = postParams.gtao.denoiseDepthPhi;
        denoisePass.normalPhi.value = postParams.gtao.denoiseNormalPhi;
        const uGtaoDenoiseEnabled = uniform(
          postParams.gtao.denoiseEnabled ? 1 : 0,
        );
        const rawAoVal = gtaoTex.sample(screenUV).r;
        const denoisedAoVal = denoisePass.r;
        const aoVal = mix(rawAoVal, denoisedAoVal, uGtaoDenoiseEnabled);
        postBaseColor = vec4(
          postBaseColor.rgb.mul(
            sub(1, mul(mul(aoVal, uGtaoIntensity), uGtaoEnabled)),
          ),
          postBaseColor.a,
        );

        // Depth for DoF + sky mask
        const linearDepth = scenePass.getLinearDepthNode
          ? scenePass.getLinearDepthNode()
          : float(0.5);
        const uCameraFar = uniform(camera.far);
        const worldDepth = mul(linearDepth, uCameraFar);
        const skyMask = step(float(0.999), linearDepth);

        // Depth of Field
        const uDofEnabled = uniform(
          postParams.enabled && postParams.dof.enabled ? 1 : 0,
        );
        const uDofFocusDistance = uniform(postParams.dof.focusDistance);
        const uDofBlurStart = uniform(postParams.dof.blurStart);
        const uDofBlurEnd = uniform(postParams.dof.blurEnd);
        const uDofBlurSize = uniform(postParams.dof.blurSize);
        const uDofBlurSpread = uniform(postParams.dof.blurSpread);
        const sceneBlurred = boxBlur(postBaseColor, {
          size: uDofBlurSize,
          separation: uDofBlurSpread,
        });
        const dofBlurAmount = smoothstep(
          uDofBlurStart,
          uDofBlurEnd,
          abs(sub(worldDepth, uDofFocusDistance)),
        );
        postBaseColor = mix(
          postBaseColor,
          sceneBlurred,
          mul(dofBlurAmount, uDofEnabled),
        );

        // Scene Bloom
        const uBloomEnabled = uniform(
          postParams.enabled && postParams.bloom.enabled ? 1 : 0,
        );
        const bloomScenePass = bloom(
          postBaseColor,
          postParams.bloom.strength,
          postParams.bloom.radius,
          postParams.bloom.threshold,
        );

        // Lens Flare (sky-only bloom → lensflare)
        const skyOnlyColor = mix(vec4(0, 0, 0, 0), postBaseColor, skyMask);
        const skyBloomPass = bloom(
          skyOnlyColor,
          1,
          0.5,
          postParams.lensflare.bloomThreshold,
        );
        const flareThreshold = uniform(postParams.lensflare.threshold);
        const flareGhostAttenuation = uniform(
          postParams.lensflare.ghostAttenuation,
        );
        const flareGhostSpacing = uniform(postParams.lensflare.ghostSpacing);
        const flarePass = lensflare(skyBloomPass, {
          threshold: flareThreshold,
          ghostAttenuationFactor: flareGhostAttenuation,
          ghostSpacing: flareGhostSpacing,
        });
        const flareBlurPass = gaussianBlur(flarePass, null, 8);
        const uLensflareEnabled = uniform(
          postParams.enabled && postParams.lensflare.enabled ? 1 : 0,
        );

        // God Rays (volumetric sunlight radial blur)
        const uSunScreenPos = uniform(new THREE.Vector2(0.5, 0.5));
        const uGodRaysEnabled = uniform(
          postParams.enabled && postParams.godRays.enabled ? 1 : 0,
        );
        const uGodRaysStrength = uniform(postParams.godRays.strength);
        const uGodRaysDecay = uniform(postParams.godRays.decay);
        const uGodRaysDensity = uniform(postParams.godRays.density);
        const uGodRaysSamples = uniform(postParams.godRays.samples);
        const sceneTex = convertToTexture(postBaseColor);
        const godRaysFn = Fn(() => {
          const uvNode = uv();
          const stepUV = sub(nodeObject(uSunScreenPos), uvNode)
            .mul(uGodRaysDensity)
            .div(uGodRaysSamples);
          const illumination = float(0).toVar();
          const decayVar = float(1).toVar();
          Loop(
            {
              start: int(0),
              end: int(uGodRaysSamples),
              type: "int",
              condition: "<",
            },
            ({ i }) => {
              const sampleUV = add(uvNode, stepUV.mul(float(i)));
              const s = sceneTex.sample(sampleUV);
              const lum = add(
                add(mul(s.r, 0.299), mul(s.g, 0.587)),
                mul(s.b, 0.114),
              );
              illumination.addAssign(mul(lum, decayVar));
              decayVar.mulAssign(uGodRaysDecay);
            },
          );
          const normalized = illumination.div(uGodRaysSamples);
          return vec4(normalized, normalized, normalized, 1)
            .mul(uGodRaysStrength)
            .mul(uGodRaysEnabled);
        });
        const godRaysNode = godRaysFn();

        // Final composite
        const finalOutput = postBaseColor
          .add(bloomScenePass.mul(uBloomEnabled))
          .add(flareBlurPass.mul(uLensflareEnabled))
          .add(godRaysNode);

        renderPipeline.outputNode = fxaa(renderOutput(finalOutput));

        // ── RENDER LOOP ──
        const clock = new THREE.Timer();
        const _grassFrustum = new THREE.Frustum();
        const _grassProjMatrix = new THREE.Matrix4();
        // _init() is called by the renderer on first render — mainFrustum is null until then
        let _lastCsmCascades = PARAMS.csm.cascades;
        let _lastCsmMaxFar = PARAMS.csm.maxFar;
        let _lastCsmMargin = PARAMS.csm.lightMargin;
        let _lastCsmMapSize = PARAMS.csm.mapSize;
        renderer.setAnimationLoop(() => {
          clock.update();
          const elapsed = clock.getElapsed();
          const dt = clock.getDelta();

          // ── PLAY MODE UPDATE ──
          if (currentMode === "play") {
            // WASD movement relative to camera yaw
            let mx = 0,
              mz = 0;
            if (keysHeld["KeyW"] || keysHeld["ArrowUp"]) {
              mx -= Math.sin(camYaw);
              mz -= Math.cos(camYaw);
            }
            if (keysHeld["KeyS"] || keysHeld["ArrowDown"]) {
              mx += Math.sin(camYaw);
              mz += Math.cos(camYaw);
            }
            if (keysHeld["KeyA"] || keysHeld["ArrowLeft"]) {
              mx -= Math.cos(camYaw);
              mz += Math.sin(camYaw);
            }
            if (keysHeld["KeyD"] || keysHeld["ArrowRight"]) {
              mx += Math.cos(camYaw);
              mz -= Math.sin(camYaw);
            }
            const mlen = Math.sqrt(mx * mx + mz * mz);
            if (mlen > 0) {
              playerPos.x += (mx / mlen) * PLAYER_SPEED * dt;
              playerPos.z += (mz / mlen) * PLAYER_SPEED * dt;
              playerPos.x = Math.max(
                -TERRAIN_SIZE / 2,
                Math.min(TERRAIN_SIZE / 2, playerPos.x),
              );
              playerPos.z = Math.max(
                -TERRAIN_SIZE / 2,
                Math.min(TERRAIN_SIZE / 2, playerPos.z),
              );
            }
            // Snap Y to terrain (bvhHeight includes cliff surfaces)
            playerPos.y = bvhHeight(playerPos.x, playerPos.z);
            const capsuleCY = playerPos.y + PLAYER_CAP_R + PLAYER_CAP_H * 0.5;
            capsuleMesh.position.set(playerPos.x, capsuleCY, playerPos.z);
            // Face direction of movement
            if (mlen > 0) capsuleMesh.rotation.y = Math.atan2(mx, mz) + PI;
            // Third-person camera
            const lookAtY = capsuleCY + 0.6;
            const hDist = CAM_DIST * Math.cos(camPitch);
            const vDist = CAM_DIST * Math.sin(camPitch);
            camera.position.set(
              playerPos.x + Math.sin(camYaw) * hDist,
              lookAtY + vDist,
              playerPos.z + Math.cos(camYaw) * hDist,
            );
            camera.lookAt(playerPos.x, lookAtY, playerPos.z);
            // Feed player pos to grass interaction
            if (grassUniforms)
              grassUniforms.uPlayerPos.value.set(
                playerPos.x,
                playerPos.y,
                playerPos.z,
              );
          }

          if (grassUniforms) grassUniforms.uTime.value = elapsed;
          uWaterTime.value = elapsed;
          uWCamXZ.value.set(camera.position.x, camera.position.z);
          _syncRipples();
          if (grassPatchSystem || cliffGrassPatchSystem) {
            camera.updateMatrixWorld();
            _grassProjMatrix.multiplyMatrices(
              camera.projectionMatrix,
              camera.matrixWorldInverse,
            );
            _grassFrustum.setFromProjectionMatrix(_grassProjMatrix);
            if (grassPatchSystem)
              grassPatchSystem.update(camera.position, _grassFrustum);
            if (cliffGrassPatchSystem)
              cliffGrassPatchSystem.update(camera.position, _grassFrustum);
          }
          // Sync lighting & sky from PARAMS every frame
          const sunDir = sunDirectionFromAngles(
            PARAMS.light.sunAzimuth,
            PARAMS.light.sunElevation,
          );
          dirLight.position.copy(sunDir.clone().multiplyScalar(600));
          dirLight.color.set(PARAMS.light.dirColor);
          dirLight.intensity = PARAMS.light.dirIntensity;
          dirLight.shadow.bias = PARAMS.shadowBias;
          dirLight.shadow.normalBias = PARAMS.shadowNormalBias;

          // CSM: rebuild cascades if params changed
          const _csmChanged =
            PARAMS.csm.enabled &&
            (PARAMS.csm.cascades !== _lastCsmCascades ||
              PARAMS.csm.maxFar !== _lastCsmMaxFar ||
              PARAMS.csm.lightMargin !== _lastCsmMargin ||
              PARAMS.csm.mapSize !== _lastCsmMapSize);
          if (csm.mainFrustum && _csmChanged) {
            _lastCsmCascades = PARAMS.csm.cascades;
            _lastCsmMaxFar = PARAMS.csm.maxFar;
            _lastCsmMargin = PARAMS.csm.lightMargin;
            _lastCsmMapSize = PARAMS.csm.mapSize;
            csm.cascades = PARAMS.csm.cascades;
            csm.maxFar = PARAMS.csm.maxFar;
            csm.lightMargin = PARAMS.csm.lightMargin;
            dirLight.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
            csm.updateFrustums();
          }
          if (
            csm.mainFrustum &&
            PARAMS.csm.enabled &&
            PARAMS.csm.updateEveryFrame
          )
            csm.updateFrustums();
          hemiLight.color.set(PARAMS.light.hemiSkyColor);
          hemiLight.groundColor.set(PARAMS.light.hemiGroundColor);
          hemiLight.intensity = PARAMS.light.hemiIntensity;
          if (skyMode === "physical") {
            sky.turbidity.value = PARAMS.sky.turbidity;
            sky.rayleigh.value = PARAMS.sky.rayleigh;
            sky.mieCoefficient.value = PARAMS.sky.mie;
            sky.mieDirectionalG.value = PARAMS.sky.mieG;
            sky.cloudCoverage.value = PARAMS.sky.cloudCoverage;
            sky.cloudDensity.value = PARAMS.sky.cloudDensity;
            sky.cloudElevation.value = PARAMS.sky.cloudElevation;
            sky.sunPosition.value.copy(sunDir);
          }
          stylizedSky.update(sunDir, camera.position);
          scene.environmentIntensity = PARAMS.light.envIntensity;
          renderer.toneMappingExposure = PARAMS.light.exposure;

          if (currentMode !== "play") orbit.update();

          // Post-processing uniform sync
          uGtaoEnabled.value =
            postParams.enabled && postParams.gtao.enabled ? 1 : 0;
          uGtaoIntensity.value = postParams.gtao.intensity;
          gtaoPass.radius.value = postParams.gtao.radius;
          gtaoPass.samples.value = postParams.gtao.samples;
          gtaoPass.scale.value = postParams.gtao.scale;
          gtaoPass.distanceFallOff.value = postParams.gtao.distanceFallOff;
          gtaoPass.distanceExponent.value = postParams.gtao.distanceExponent;
          gtaoPass.thickness.value = postParams.gtao.thickness;
          denoisePass.radius.value = postParams.gtao.denoiseRadius;
          denoisePass.lumaPhi.value = postParams.gtao.denoiseLumaPhi;
          denoisePass.depthPhi.value = postParams.gtao.denoiseDepthPhi;
          denoisePass.normalPhi.value = postParams.gtao.denoiseNormalPhi;
          uGtaoDenoiseEnabled.value = postParams.gtao.denoiseEnabled ? 1 : 0;
          if (denoisePass._resolution) {
            const _sz = renderer.getDrawingBufferSize(new THREE.Vector2());
            denoisePass._resolution.value.set(_sz.x, _sz.y);
          }

          uDofEnabled.value =
            postParams.enabled && postParams.dof.enabled ? 1 : 0;
          uDofFocusDistance.value = postParams.dof.focusDistance;
          uDofBlurStart.value = postParams.dof.blurStart;
          uDofBlurEnd.value = postParams.dof.blurEnd;
          uDofBlurSize.value = postParams.dof.blurSize;
          uDofBlurSpread.value = postParams.dof.blurSpread;

          uBloomEnabled.value =
            postParams.enabled && postParams.bloom.enabled ? 1 : 0;
          bloomScenePass.strength.value = postParams.bloom.strength;
          bloomScenePass.radius.value = postParams.bloom.radius;
          bloomScenePass.threshold.value = postParams.bloom.threshold;

          uLensflareEnabled.value =
            postParams.enabled && postParams.lensflare.enabled ? 1 : 0;
          skyBloomPass.threshold.value = postParams.lensflare.bloomThreshold;
          flareThreshold.value = postParams.lensflare.threshold;
          flareGhostAttenuation.value = postParams.lensflare.ghostAttenuation;
          flareGhostSpacing.value = postParams.lensflare.ghostSpacing;

          uGodRaysEnabled.value =
            postParams.enabled && postParams.godRays.enabled ? 1 : 0;
          uGodRaysStrength.value = postParams.godRays.strength;
          uGodRaysDecay.value = postParams.godRays.decay;
          uGodRaysDensity.value = postParams.godRays.density;
          uGodRaysSamples.value = postParams.godRays.samples;

          // Project sun direction to screen space for god rays
          const _sunWorld = camera.position
            .clone()
            .add(sunDir.clone().multiplyScalar(500000));
          const _v4 = new THREE.Vector4(
            _sunWorld.x,
            _sunWorld.y,
            _sunWorld.z,
            1,
          );
          _v4.applyMatrix4(camera.matrixWorldInverse);
          _v4.applyMatrix4(camera.projectionMatrix);
          uSunScreenPos.value.set(
            (_v4.x / _v4.w) * 0.5 + 0.5,
            (_v4.y / _v4.w) * 0.5 + 0.5,
          );
          uCameraFar.value = camera.far;

          stats.update();
          renderPipeline.render();
        });
      }

      init();
    </script>
  </body>
</html>
