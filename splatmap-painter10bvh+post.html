        }
        scene.add(dirLight);
        const shadowTarget = new THREE.Object3D();
        scene.add(shadowTarget);
        dirLight.target = shadowTarget;
        const hemiLight = new THREE.HemisphereLight(
          PARAMS.light.hemiSkyColor,
          PARAMS.light.hemiGroundColor,
          PARAMS.light.hemiIntensity,
        );
        scene.add(hemiLight);

        // ── TERRAIN GEOMETRY ──
        terrainGeo = new THREE.PlaneGeometry(
          TERRAIN_SIZE,
          TERRAIN_SIZE,
          DISPLAY_RES,
          DISPLAY_RES,
        );
        terrainGeo.rotateX(-PI / 2);
        syncGeometry(); // apply initial heightData

        const terrain = new THREE.Mesh(
          terrainGeo,
          new THREE.MeshStandardMaterial({ color: 0x4a6a30, roughness: 0.95 }),
        );
        terrain.receiveShadow = true;
        scene.add(terrain);

        // ── TILE MATERIAL (default view — toggle with ~ key) ──
        const tileMat = createTileMaterial({
          roughness: 0.95,
          textureScale: 400,
          tileColor: 0x999999,
          gridColor: 0x444444,
          gridLineColor: 0x111111,
        });
        terrain.material = tileMat;
        let usingTileMat = true;

        // ── TERRAIN EDGE SKIRT ──
        {
          const N = DISPLAY_RES;
          const NV = DISPLAY_VERTS;
          const SKIRT_BOTTOM = -(HEIGHT_SCALE + 20);

          // Build edge XZ lookup (4 sides, traversed so each side faces outward)
          // Side 0: North  (z=-half, x left→right)
          // Side 1: East   (x=+half, z top→bottom)
          // Side 2: South  (z=+half, x right→left — reversed for outward winding)
          // Side 3: West   (x=-half, z bottom→top — reversed)
          const half = TERRAIN_SIZE / 2;
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: (-0.5 + i / N) * TERRAIN_SIZE, wz: -half }); // North
          }
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: half, wz: (-0.5 + i / N) * TERRAIN_SIZE }); // East
          }
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: (0.5 - i / N) * TERRAIN_SIZE, wz: half }); // South (reversed)
          }
          for (let i = 0; i < NV; i++) {
            skirtEdgeXZ.push({ wx: -half, wz: (0.5 - i / N) * TERRAIN_SIZE }); // West (reversed)
          }

          // Vertex buffer: per side, NV top + NV bottom interleaved: [top0, bot0, top1, bot1, ...]
          const skirtPos = new Float32Array(4 * NV * 2 * 3);
          const skirtIdx = [];

          for (let s = 0; s < 4; s++) {
            for (let i = 0; i < NV; i++) {
              const { wx, wz } = skirtEdgeXZ[s * NV + i];
              const hy = sampleHeight(wx, wz);
              const vi = (s * NV * 2 + i * 2) * 3;
              // top
              skirtPos[vi] = wx;
              skirtPos[vi + 1] = hy;
              skirtPos[vi + 2] = wz;
              // bottom
              skirtPos[vi + 3] = wx;
              skirtPos[vi + 4] = SKIRT_BOTTOM;
              skirtPos[vi + 5] = wz;
            }
            // Quad indices for this side
            const base = s * NV * 2;
            for (let i = 0; i < N; i++) {
              const tl = base + i * 2,
                bl = base + i * 2 + 1;
              const tr = base + (i + 1) * 2,
                br = base + (i + 1) * 2 + 1;
              skirtIdx.push(tl, bl, tr, bl, br, tr);
            }
          }

          skirtGeo = new THREE.BufferGeometry();
          skirtGeo.setAttribute(
            "position",
            new THREE.BufferAttribute(skirtPos, 3),
          );
          skirtGeo.setIndex(skirtIdx);
          skirtGeo.computeVertexNormals();

          const skirtMesh = new THREE.Mesh(
            skirtGeo,
            new THREE.MeshStandardMaterial({
              color: 0x5a4a3a,
              roughness: 0.95,
              side: THREE.DoubleSide,
            }),
          );
          skirtMesh.castShadow = true;
          skirtMesh.receiveShadow = true;
          scene.add(skirtMesh);
        }

        splatTex = new THREE.CanvasTexture(splatCanvas);
        splatTex.wrapS = splatTex.wrapT = THREE.ClampToEdgeWrapping;
        imgSplatTex = new THREE.DataTexture(
          imgSplatData,
          SPLAT_RES,
          SPLAT_RES,
          THREE.RGBAFormat,
        );
        imgSplatTex.wrapS = imgSplatTex.wrapT = THREE.ClampToEdgeWrapping;
        imgSplatTex.minFilter = imgSplatTex.magFilter = THREE.LinearFilter;
        imgSplatTex.needsUpdate = true;

        // ── Auto-load project textures into image slots ───────────────────
        const _slotLoader = new THREE.TextureLoader();
        // Draw loaded image onto the existing canvas — keeps same source type
        // so WebGPU re-uploads correctly (replacing .image breaks WebGPU upload)
        const _drawOntoTex = (slotTex, imgEl, colorSpace) => {
          const canvas = slotTex.image;
          // Draw scaled into existing fixed-size canvas — no resize = no GPU texture recreation
          canvas.getContext("2d").drawImage(imgEl, 0, 0, canvas.width, canvas.height);
          slotTex.colorSpace = colorSpace;
          slotTex.wrapS = slotTex.wrapT = THREE.RepeatWrapping;
          slotTex.needsUpdate = true;
        };
        // Pack a greyscale image into one channel of a DataTexture (avoids premult-alpha issues)
        const _packChannelIntoDT = (dt, imgEl, channelIdx) => {
          const size = dt.image.width;
          const tmp = document.createElement("canvas");
          tmp.width = tmp.height = size;
          const tmpCtx = tmp.getContext("2d", { willReadFrequently: true });
          tmpCtx.drawImage(imgEl, 0, 0, size, size);
          const src = tmpCtx.getImageData(0, 0, size, size).data;
          const dst = dt.image.data;
          for (let i = 0, n = dst.length >> 2; i < n; i++)
            dst[i * 4 + channelIdx] = src[i * 4];
          dt.needsUpdate = true;
        };
        // Pack a normal map (RG→BA) into a DataTexture, reconstructing Z in shader later
        const _packNormalIntoDT = (dt, imgEl) => {
          const size = dt.image.width;
          const tmp = document.createElement("canvas");
          tmp.width = tmp.height = size;
          const tmpCtx = tmp.getContext("2d", { willReadFrequently: true });
          tmpCtx.drawImage(imgEl, 0, 0, size, size);
          const src = tmpCtx.getImageData(0, 0, size, size).data;
          const dst = dt.image.data;
          for (let i = 0, n = dst.length >> 2; i < n; i++) {
            dst[i * 4 + 2] = src[i * 4];     // normal R → B
            dst[i * 4 + 3] = src[i * 4 + 1]; // normal G → A
          }
          dt.needsUpdate = true;
        };
        // Pack a greyscale image into one channel (0=R,1=G,2=B) of an existing canvas texture
        const _packChannelIntoTex = (slotTex, imgEl, channelIdx) => {
          const canvas = slotTex.image;
          const size = canvas.width;
          const ctx2d = canvas.getContext("2d");
          const tmp = document.createElement("canvas");
          tmp.width = tmp.height = size;
          const tmpCtx = tmp.getContext("2d", { willReadFrequently: true });
          tmpCtx.drawImage(imgEl, 0, 0, size, size);
          const src = tmpCtx.getImageData(0, 0, size, size);
          const dst = ctx2d.getImageData(0, 0, size, size);
          for (let i = 0; i < dst.data.length; i += 4)
            dst.data[i + channelIdx] = src.data[i]; // copy R of src → target channel
          ctx2d.putImageData(dst, 0, 0);
          slotTex.colorSpace = THREE.LinearSRGBColorSpace;
          slotTex.wrapS = slotTex.wrapT = THREE.RepeatWrapping;
          slotTex.needsUpdate = true;
        };
        IMG_TEX_SLOTS.forEach((slot) => {
          if (slot.initAlbedo) {
            _slotLoader.load(slot.initAlbedo, (tex) => {
              _drawOntoTex(slot.albedoTex, tex.image, THREE.SRGBColorSpace);
              slot.uHasAlbedo.value = 1;
            });
          }
          if (slot.initNormal) {
            _slotLoader.load(slot.initNormal, (tex) => {
              if (slot.ormTex?.isDataTexture) {
                _packNormalIntoDT(slot.ormTex, tex.image); // normal RG → ormTex BA
              } else if (slot.normalTex) {
                _drawOntoTex(slot.normalTex, tex.image, THREE.LinearSRGBColorSpace);
              }
              slot.uHasNormal.value = 1;
            });
          }
          if (slot.initAO && slot.ormTex) {
            _slotLoader.load(slot.initAO, (tex) => {
              if (slot.ormTex.isDataTexture) _packChannelIntoDT(slot.ormTex, tex.image, 0);
              else _packChannelIntoTex(slot.ormTex, tex.image, 0);
              slot.uHasAO.value = 1;
            });
          }
          if (slot.initRoughness && slot.ormTex) {
            _slotLoader.load(slot.initRoughness, (tex) => {
              if (slot.ormTex.isDataTexture) _packChannelIntoDT(slot.ormTex, tex.image, 1);
              else _packChannelIntoTex(slot.ormTex, tex.image, 1);
              slot.uHasRough.value = 1;
            });
          }
        });

        // ── ROCK028 SLOPE TEXTURES ───────────────────────────────────────────
        // WebGPU limit: 16 samplers/stage. Pack rough+AO+normalXY into one DataTexture.
        const uRockScale       = uniform(0.05);
        const uRockBrightness  = uniform(0.85);
        const uRockContrast    = uniform(1.1);
        const uRockTint        = uniform(new THREE.Color(1.0, 1.0, 1.0));
        const uRockNormalStr   = uniform(1.0);
        const uRockBlendSharp  = uniform(1.0); // exponent on slope mask: >1 = sharper edge
        const uRockRoughMul    = uniform(1.0);
        const uTriplanarSharp  = uniform(4.0); // triplanar blend sharpness: higher = harder axis transitions
        const _rockLoader = new THREE.TextureLoader();

        // Color (sRGB, stays separate)
        const rock028ColorTex = _rockLoader.load("textures/ground_tiles_01_2k/ground_tiles_01_color_2k.png");
        rock028ColorTex.wrapS = rock028ColorTex.wrapT = THREE.RepeatWrapping;
        rock028ColorTex.colorSpace = THREE.SRGBColorSpace;

        // Packed linear DataTexture: R=roughness, G=AO, B=normalX, A=normalY
        const _rock028Res = 1024;
        const rock028DataTex = new THREE.DataTexture(
          new Uint8Array(_rock028Res * _rock028Res * 4),
          _rock028Res, _rock028Res, THREE.RGBAFormat);
        rock028DataTex.wrapS = rock028DataTex.wrapT = THREE.RepeatWrapping;
        rock028DataTex.colorSpace = THREE.LinearSRGBColorSpace;
        _rockLoader.load("textures/ground_tiles_01_2k/ground_tiles_01_roughness_2k.png",         (t) => { _packChannelIntoDT(rock028DataTex, t.image, 0); }); // R
        _rockLoader.load("textures/ground_tiles_01_2k/ground_tiles_01_ambient_occlusion_2k.png",  (t) => { _packChannelIntoDT(rock028DataTex, t.image, 1); }); // G
        _rockLoader.load("textures/ground_tiles_01_2k/ground_tiles_01_normal_gl_2k.png",          (t) => { _packNormalIntoDT(rock028DataTex, t.image); });      // BA

        // ── GRASS DENSITY TEX ─────────────────────────────────────────────
        grassDensityTex = new THREE.CanvasTexture(grassDensityCanvas);
        grassDensityTex.wrapS = grassDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── GEMINI GRASS DENSITY TEX ──────────────────────────────────────
        geminiDensityTex = new THREE.CanvasTexture(geminiDensityCanvas);
        geminiDensityTex.wrapS = geminiDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── MEADOW DENSITY TEX ────────────────────────────────────────────
        meadowDensityTex = new THREE.CanvasTexture(meadowCanvas);
        meadowDensityTex.wrapS = meadowDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── FLOWER DENSITY TEX ────────────────────────────────────────────
        flowerDensityTex = new THREE.CanvasTexture(flowerDensityCanvas);
        flowerDensityTex.wrapS = flowerDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── CLIFF DENSITY TEX ─────────────────────────────────────────────
        cliffDensityTex = new THREE.CanvasTexture(cliffDensityCanvas);
        cliffDensityTex.wrapS = cliffDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── CLIFF PAINT TEX (separate splatmap for cliff blend surfaces) ──
        cliffPaintTex = new THREE.CanvasTexture(cliffPaintCanvas);
        cliffPaintTex.wrapS = cliffPaintTex.wrapT = THREE.ClampToEdgeWrapping;

        // ── BARRIER TEX + OVERLAY MESH ──────────────────────────────────
        barrierTex = new THREE.CanvasTexture(barrierCanvas);
        barrierTex.flipY = false;
        barrierTex.wrapS = barrierTex.wrapT = THREE.ClampToEdgeWrapping;
        {
          const overlayGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, 1, 1);
          overlayGeo.rotateX(-Math.PI / 2);
          const overlayMat = new THREE.MeshBasicMaterial({
            map: barrierTex,
            transparent: true,
            opacity: 0.35,
            depthWrite: false,
            side: THREE.DoubleSide,
          });
          barrierOverlayMesh = new THREE.Mesh(overlayGeo, overlayMat);
          barrierOverlayMesh.position.y = 0.6;
          barrierOverlayMesh.renderOrder = 10;
          barrierOverlayMesh.visible = false;
          scene.add(barrierOverlayMesh);
        }

        // ── GEMINI CLIFF DENSITY TEX ──────────────────────────────────────
        geminiCliffDensityTex = new THREE.CanvasTexture(geminiCliffDensityCanvas);
        geminiCliffDensityTex.wrapS = geminiCliffDensityTex.wrapT =
          THREE.ClampToEdgeWrapping;

        // ── HEIGHT TEX (for grass blade positioning) ──────────────────────
        const heightTexData = new Float32Array(HTEX_RES * HTEX_RES * 4);
        heightTex = new THREE.DataTexture(
          heightTexData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        heightTex.wrapS = heightTex.wrapT = THREE.ClampToEdgeWrapping;
        heightTex.magFilter = heightTex.minFilter = THREE.LinearFilter;

        // ── CLIFF HEIGHT TEX (cliff-only flat surfaces; -9999 where no cliff) ──
        const cliffHeightTexData = new Float32Array(HTEX_RES * HTEX_RES * 4);
        // Pre-fill with -9999 so grass blades go underground and are invisible by default
        for (let i = 0; i < HTEX_RES * HTEX_RES; i++) {
          cliffHeightTexData[i * 4] = cliffHeightTexData[i * 4 + 1] =
            cliffHeightTexData[i * 4 + 2] = -9999;
          cliffHeightTexData[i * 4 + 3] = 1;
        }
        cliffHeightTex = new THREE.DataTexture(
          cliffHeightTexData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        cliffHeightTex.wrapS = cliffHeightTex.wrapT = THREE.ClampToEdgeWrapping;
        cliffHeightTex.magFilter = cliffHeightTex.minFilter = THREE.NearestFilter;

        // ── AO + NORMAL MAP TEXTURES ──────────────────────────────────────────
        // Fill AO with 1.0 (no occlusion) and NM with flat (0.5, 0.5, 1.0) until baked
        for (let i = 0; i < HTEX_RES * HTEX_RES; i++) {
          aoData[i * 4] = aoData[i * 4 + 1] = aoData[i * 4 + 2] = 1;
          aoData[i * 4 + 3] = 1;
          nmData[i * 4] = 0.5;
          nmData[i * 4 + 1] = 0.5;
          nmData[i * 4 + 2] = 1;
          nmData[i * 4 + 3] = 1;
        }
        aoTex = new THREE.DataTexture(
          aoData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        aoTex.wrapS = aoTex.wrapT = THREE.ClampToEdgeWrapping;
        aoTex.magFilter = aoTex.minFilter = THREE.LinearFilter;
        aoTex.needsUpdate = true;

        normalMapTex = new THREE.DataTexture(
          nmData,
          HTEX_RES,
          HTEX_RES,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        normalMapTex.wrapS = normalMapTex.wrapT = THREE.ClampToEdgeWrapping;
        normalMapTex.magFilter = normalMapTex.minFilter = THREE.LinearFilter;
        normalMapTex.needsUpdate = true;

        // ── BVH BAKE — cliff objects only; terrain uses full-res sampleHeight ──
        // Raycasting the 128-vertex terrain mesh introduces triangle-diagonal interpolation
        // errors on steep slopes (one slope under-sampled → grass goes underground).
        // Fix: use sampleHeight (512-res heightData) as baseline; only raycast cliffs
        // to detect surfaces above the terrain, then take max(terrain, cliff).
        const _bvhV = new THREE.Vector3();
        const _bvhRay = new THREE.Ray(
          new THREE.Vector3(),
          new THREE.Vector3(0, -1, 0),
        );
        // region: optional {xMin,xMax,zMin,zMax} in world space — partial bake for sculpt
        bakeBVH = function (region) {
          scene.updateMatrixWorld(true);

          // ── Cliff BVH — skip rebuild when only terrain changed (partial bake) ──
          let cliffBvh = _camCliffBvh; // reuse previous cliff BVH by default
          if (!region) {
            // Full bake: rebuild cliff BVH from scratch
            const positions = [],
              idxList = [];
            let vOffset = 0;
            function addMesh(mesh) {
              const geo = mesh.geometry;
              const posAttr = geo.attributes.position;
              const mat = mesh.matrixWorld;
              for (let i = 0; i < posAttr.count; i++) {
                _bvhV.fromBufferAttribute(posAttr, i).applyMatrix4(mat);
                positions.push(_bvhV.x, _bvhV.y, _bvhV.z);
              }
              if (geo.index) {
                const idx = geo.index.array;
                for (let i = 0; i < idx.length; i++)
                  idxList.push(idx[i] + vOffset);
              } else {
                for (let i = 0; i < posAttr.count; i++) idxList.push(i + vOffset);
              }
              vOffset += posAttr.count;
            }
            function addGeoWithMatrix(geo, mat) {
              const posAttr = geo.attributes.position;
              for (let i = 0; i < posAttr.count; i++) {
                _bvhV.fromBufferAttribute(posAttr, i).applyMatrix4(mat);
                positions.push(_bvhV.x, _bvhV.y, _bvhV.z);
              }
              if (geo.index) {
                const idx = geo.index.array;
                for (let i = 0; i < idx.length; i++)
                  idxList.push(idx[i] + vOffset);
              } else {
                for (let i = 0; i < posAttr.count; i++) idxList.push(i + vOffset);
              }
              vOffset += posAttr.count;
            }
            cliffObjects.forEach((root) =>
              root.traverse((o) => {
                if (o.isMesh) addMesh(o);
              }),
            );
            cliffBlendObjects.forEach((root) =>
              root.traverse((o) => {
                if (o.isMesh) addMesh(o);
              }),
            );
            if (cliffInstancer)
              cliffInstancer.forEachMeshInstance((geo, mat) => addGeoWithMatrix(geo, mat));

            cliffBvh = null;
            if (positions.length > 0) {
              const mergedGeo = new THREE.BufferGeometry();
              mergedGeo.setAttribute(
                "position",
                new THREE.BufferAttribute(new Float32Array(positions), 3),
              );
              mergedGeo.setIndex(
                new THREE.BufferAttribute(new Uint32Array(idxList), 1),
              );
              cliffBvh = new MeshBVH(mergedGeo);
            }
          }

          // Terrain BVH always rebuilt (cheap — 129x129 display mesh)
          const terrainBvh = new MeshBVH(terrainGeo);
          const _terrainRay = new THREE.Ray(
            new THREE.Vector3(0, 99999, 0),
            new THREE.Vector3(0, -1, 0),
          );

          // Grid bounds — full or partial
          const half = TERRAIN_SIZE / 2;
          let iz0 = 0, iz1 = HTEX_RES, ix0 = 0, ix1 = HTEX_RES;
          if (region) {
            ix0 = Math.max(0, Math.floor((region.xMin / TERRAIN_SIZE + 0.5) * HTEX_RES) - 1);
            ix1 = Math.min(HTEX_RES, Math.ceil((region.xMax / TERRAIN_SIZE + 0.5) * HTEX_RES) + 1);
            iz0 = Math.max(0, Math.floor((region.zMin / TERRAIN_SIZE + 0.5) * HTEX_RES) - 1);
            iz1 = Math.min(HTEX_RES, Math.ceil((region.zMax / TERRAIN_SIZE + 0.5) * HTEX_RES) + 1);
          }

          for (let iz = iz0; iz < iz1; iz++) {
            for (let ix = ix0; ix < ix1; ix++) {
              const wx = (-0.5 + ix / HTEX_RES) * TERRAIN_SIZE;
              const wz = (-0.5 + iz / HTEX_RES) * TERRAIN_SIZE;
              const wxG = (-0.5 + (ix + 0.5) / HTEX_RES) * TERRAIN_SIZE;
              const wzG = (-0.5 + (iz + 0.5) / HTEX_RES) * TERRAIN_SIZE;

              _terrainRay.origin.set(wxG, 99999, wzG);
              const terrainHitG = terrainBvh.raycastFirst(
                _terrainRay,
                THREE.DoubleSide,
              );
              let hGpu = terrainHitG
                ? terrainHitG.point.y
                : sampleHeight(wxG, wzG);

              _terrainRay.origin.set(wx, 99999, wz);
              const terrainHitC = terrainBvh.raycastFirst(
                _terrainRay,
                THREE.DoubleSide,
              );
              let hCpu = terrainHitC
                ? terrainHitC.point.y
                : sampleHeight(wx, wz);

              if (cliffBvh) {
                _bvhRay.origin.set(wx, 99999, wz);
                const hit = cliffBvh.raycastFirst(_bvhRay, THREE.DoubleSide);
                if (hit && hit.point.y > hCpu) {
                  hCpu = hit.point.y;
                }
              }

              bvhGrid[iz * HTEX_RES + ix] = hCpu;
              const i4 = (iz * HTEX_RES + ix) * 4;
              heightTexData[i4] =
                heightTexData[i4 + 1] =
                heightTexData[i4 + 2] =
                  hGpu;
              heightTexData[i4 + 3] = 1;

              {
                const cliffI4 = (iz * HTEX_RES + ix) * 4;
                let cliffH = -9999;
                if (cliffBvh) {
                  _bvhRay.origin.set(wxG, 99999, wzG);
                  const cliffHit = cliffBvh.raycastFirst(_bvhRay, THREE.DoubleSide);
                  if (cliffHit && cliffHit.face.normal.y > 0.3) {
                    cliffH = cliffHit.point.y;
                  }
                }
                cliffHeightTexData[cliffI4] =
                  cliffHeightTexData[cliffI4 + 1] =
                  cliffHeightTexData[cliffI4 + 2] = cliffH;
                cliffHeightTexData[cliffI4 + 3] = 1;
              }
            }
          }
          heightTex.needsUpdate = true;
          cliffHeightTex.needsUpdate = true;
          _camTerrainBvh = terrainBvh;
          if (!region) _camCliffBvh = cliffBvh; // only update cliff BVH ref on full bake
        };
        bakeBVH();

        // ── DUMMY TRAIL TEX ───────────────────────────────────────────────
        const trailTex = new THREE.DataTexture(
          new Float32Array(4),
          1,
          1,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        trailTex.needsUpdate = true;

        // ── GRASS SETUP ───────────────────────────────────────────────────
        if (USE_OLD_GRASS) {
        const grassParams = {
          grassWidth: 0.08,
          grassHeight: 0.7,
          lodDistance: 28,
          maxDistance: 80,
          lodBlendStart: 0.35,
          nearRingExtent: 3,
          nearFadeRange: 8,
          grassBladesRegular: 1.0,
          grassBladesNear: 1.0,
          gradientCurve: 2.0,
          baseColor1: "#143210",
          baseColor2: "#183a12",
          tipColor1: "#a6cc40",
          tipColor2: "#cce666",
          colorVariation: 0.3,
          lushColor: "#1a4a0a",
          bleachedColor: "#d4cc80",
          windSpeed: 1.0,
          windStrength: 0.4,
          windWaveScale: 0.08,
          windDir: 0.7,
          windGust: 0.3,
          windMicroSway: 0.15,
          interactionRange: 1.8,
          interactionStrength: 0.35,
          interactionHeightThreshold: 1.5,
          minSkyBlend: 0.55,
          maxSkyBlend: 0.7,
          aoEnabled: true,
          aoIntensity: 1.0,
          bsIntensity: 0.4,
          bsColor: "#51cc66",
          bsPower: 2.0,
          frontScatter: 0.3,
          rimSSS: 0.4,
          specV1Enabled: false,
          specV1Intensity: 1.5,
          specV1Color: "#ffffff",
          specV1DirX: -1.0,
          specV1DirY: 1.0,
          specV1DirZ: 0.5,
          specV2Enabled: false,
          specV2Intensity: 1.0,
          specV2Color: "#ffffff",
          specV2DirX: -1.0,
          specV2DirY: 0.45,
          specV2DirZ: 1.0,
          specV2NoiseScale: 3.0,
          specV2NoiseStr: 0.6,
          specV2Power: 12.0,
          specV2TipBias: 0.5,
          seasonalScale: 0.02,
          seasonalDryColor: "#8b7d3c",
          sunAzimuth: PARAMS.light.sunAzimuth,
          sunElevation: PARAMS.light.sunElevation,
        };
        grassUniforms = createUniforms(grassParams, TERRAIN_SIZE, 1);
        const grassCtx = {
          ...grassUniforms,
          heightTex,
          grassDensityTex,
          trailTex,
          PI: Math.PI,
        };
        const PATCH_SPACING = GRASS_PATCH_SIZE;
        const GRID_SIZE = 12;
        const geoLow = createGrassGeometry(
          GRASS_SEGMENTS_LOW,
          GRASS_DENSITY_LOW,
          GRASS_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const geoMid = createGrassGeometry(
          GRASS_SEGMENTS_MID,
          GRASS_DENSITY_MID,
          GRASS_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const geoHigh = createGrassGeometry(
          GRASS_SEGMENTS_HIGH,
          GRASS_DENSITY,
          GRASS_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const geoNear = createGrassGeometry(
          GRASS_SEGMENTS_HIGH,
          GRASS_DENSITY,
          NEAR_PATCH_SIZE,
          setSeed,
          randRange,
        );
        const matLow = createGrassMaterial(
          GRASS_SEGMENTS_LOW,
          GRASS_VERTS_LOW,
          false,
          "regular",
          grassCtx,
        );
        const matMid = createGrassMaterial(
          GRASS_SEGMENTS_MID,
          GRASS_VERTS_MID,
          false,
          "regular",
          grassCtx,
        );
        const matHigh = createGrassMaterial(
          GRASS_SEGMENTS_HIGH,
          GRASS_VERTS_HIGH,
          false,
          "regular",
          grassCtx,
        );
        const matNear = createGrassMaterial(
          GRASS_SEGMENTS_HIGH,
          GRASS_VERTS_HIGH,
          false,
          "near",
          grassCtx,
        );
        const grassGroup = new THREE.Group();
        scene.add(grassGroup);
        grassPatchSystem = setupGrassPatches(
          scene,
          camera,
          grassGroup,
          {
            geoLow,
            geoMid,
            geoHigh,
            geoNear,
            matLowSimple: matLow,
            matMidSimple: matMid,
            matHighSimple: matHigh,
            matHighSimpleNear: matNear,
          },
          {
            PATCH_SPACING,
            GRID_SIZE,
            NEAR_PATCH_SIZE,
            nearRingExtent: grassParams.nearRingExtent,
            lodDistance: grassParams.lodDistance,
            lodDistanceMid: grassParams.lodDistance * 1.4,
            maxDistance: grassParams.maxDistance,
          },
        );
        } // END USE_OLD_GRASS — regular grass

        // ── FLOWER PATCH SYSTEM ───────────────────────────────────────────────
        if (USE_OLD_FLOWERS) {
          const petalTex = new THREE.TextureLoader().load("./textures/petal-alpha.png");
          flowerCtx = createFlowerUniforms({ terrainSize: TERRAIN_SIZE });
          flowerCtx.uHeightTex  = heightTex;
          flowerCtx.uDensityTex = flowerDensityTex;
          const flowerGeos = createFlowerGeometry(FLOWER_DENSITY, FLOWER_PATCH_SIZE);
          const flowerMats = createFlowerMaterials(petalTex, flowerCtx);
          const flowerGroup = new THREE.Group();
          scene.add(flowerGroup);
          flowerPatchSystem = setupFlowerPatches(
            scene,
            camera,
            flowerGroup,
            { ...flowerGeos, ...flowerMats },
            {
              PATCH_SIZE: FLOWER_PATCH_SIZE,
              GRID_SIZE: FLOWER_GRID_SIZE,
              MAX_DIST: FLOWER_MAX_DIST,
            },
          );
        } // END USE_OLD_FLOWERS

        // ── CLIFF GRASS PATCH SYSTEM (Layer 2) ───────────────────────────────
        if (USE_OLD_GRASS) {
        const cliffGrassCtx = {
          ...grassUniforms,
          heightTex: cliffHeightTex,
          grassDensityTex: cliffDensityTex,
          trailTex,
          PI: Math.PI,
        };
        const cliffMatLow = createGrassMaterial(
          GRASS_SEGMENTS_LOW, GRASS_VERTS_LOW, false, "regular", cliffGrassCtx,
        );
        const cliffMatMid = createGrassMaterial(
          GRASS_SEGMENTS_MID, GRASS_VERTS_MID, false, "regular", cliffGrassCtx,
        );
        const cliffMatHigh = createGrassMaterial(
          GRASS_SEGMENTS_HIGH, GRASS_VERTS_HIGH, false, "regular", cliffGrassCtx,
        );
        const cliffMatNear = createGrassMaterial(
          GRASS_SEGMENTS_HIGH, GRASS_VERTS_HIGH, false, "near", cliffGrassCtx,
        );
        const cliffGrassGroup = new THREE.Group();
        scene.add(cliffGrassGroup);
        cliffGrassPatchSystem = setupGrassPatches(
          scene,
          camera,
          cliffGrassGroup,
          {
            geoLow,
            geoMid,
            geoHigh,
            geoNear,
            matLowSimple: cliffMatLow,
            matMidSimple: cliffMatMid,
            matHighSimple: cliffMatHigh,
            matHighSimpleNear: cliffMatNear,
          },
          {
            PATCH_SPACING,
            GRID_SIZE,
            NEAR_PATCH_SIZE,
            nearRingExtent: grassParams.nearRingExtent,
            lodDistance: grassParams.lodDistance,
            lodDistanceMid: grassParams.lodDistance * 1.4,
            maxDistance: grassParams.maxDistance,
          },
        );
        } // END USE_OLD_GRASS — cliff grass

        // ── GEMINI GRASS PATCH SYSTEM ────────────────────────────────────
        // New grass renderer from geminiblades.html — arc bending, Voronoi
        // clumping, crossed ribbons, SSS, dual specular.
        // Shares the same grassDensityTex + heightTex as the old grass.
        {
          const gp = {
            bladeHeight: 1.0,
            bladeWidth: 0.15,
            tipTaperStart: 0.5,
            bladeYSegments: 7,
            grassCount: 1516,
            fieldSize: 10,
            grassDensity: 1.0,
            windSpeed: 0.2,
            windStrength: 1.4,
            maxAngle: 1.4,
            naturalLean: 0.9,
            windAngle: 0,
            windWaveScale: 0.12,
            windGust: 0.3,
            bendFocus: 0.5,
            stiffness: 0.0,
            clumpScale: 1.5,
            clumpStrength: 0.7,
            crossed: true,
            bladeColor: "#0e300e",
            tipColor: "#004d05",
            skyBlend: 0.8,
            cylindrical: 0.3,
            viewThicken: 0.45,
            aoBase: 0.25,
            aoPower: 2.0,
            colorVariation: false,
            cvHueSpread: 0.08,
            cvSatSpread: 0.3,
            cvDryAmount: 0.15,
            cvDryColor: "#8a7a3a",
            bssIntensity: 1.2,
            bssPower: 2.0,
            bssColor: "#2d7a2d",
            frontScatter: 0.3,
            rimSSS: 0.25,
            specV1Enabled: false,
            specV1Intensity: 1.5,
            specV1Color: "#ffffff",
            specV1DirX: -1.0,
            specV1DirY: 1.0,
            specV1DirZ: 0.5,
            specV1Power: 25.6,
            specV2Enabled: false,
            specV2Intensity: 1.0,
            specV2Color: "#ffffff",
            specV2DirX: -1.0,
            specV2DirY: 0.45,
            specV2DirZ: 1.0,
            specV2NoiseScale: 3.0,
            specV2NoiseStr: 0.6,
            specV2Power: 12.0,
            specV2TipBias: 0.5,
            lodEnabled: true,
            lodMidDistance: 40,
            lodFarDistance: 80,
            lodMaxDistance: 200,
            lodFadeStart: 0.75,
            lodMidPatchSize: 18,
            lodMidSegments: 3,
            lodMidGrassCount: 150,
            lodFarPatchSize: 28,
            lodFarSegments: 1,
            lodFarGrassCount: 80,
            lodDebug: false,
            interactionRadius: 1.5,
            interactionStrength: 0.7,
            grassReceiveShadow: true,
          };
          // Store params on window-level variable for GUI access
          window._geminiGrassParams = gp;

          // No sRGB→linear conversion — matches geminiblades.html which uses
          // plain THREE.Color(hex) for colorNode uniforms.
          function col(hex) { return new THREE.Color(hex); }
          const sunDir = sunDirectionFromAngles(
            PARAMS.light.sunAzimuth,
            PARAMS.light.sunElevation,
          );

          const gu = {
            uTerrainSize:          uniform(TERRAIN_SIZE),
            uSunDir:               uniform(sunDir),
            uPlayerPos:            uniform(new THREE.Vector3(0, 0, 0)),
            uBladeHeight:          uniform(gp.bladeHeight),
            uGrassDensity:         uniform(gp.grassDensity),
            uWindSpeed:            uniform(gp.windSpeed),
            uWindStrength:         uniform(gp.windStrength),
            uMaxAngle:             uniform(gp.maxAngle),
            uNaturalLean:          uniform(gp.naturalLean),
            uWindDirX:             uniform(Math.cos(gp.windAngle)),
            uWindDirZ:             uniform(Math.sin(gp.windAngle)),
            uWindWaveScale:        uniform(gp.windWaveScale),
            uWindGust:             uniform(gp.windGust),
            uBendFocus:            uniform(gp.bendFocus),
            uStiffness:            uniform(gp.stiffness),
            uClumpScale:           uniform(gp.clumpScale),
            uClumpStrength:        uniform(gp.clumpStrength),
            uCrossed:              uniform(gp.crossed ? 1 : 0),
            uBladeCol:             uniform(col(gp.bladeColor)),
            uTipCol:               uniform(col(gp.tipColor)),
            uSkyBlend:             uniform(gp.skyBlend),
            uCylindrical:          uniform(gp.cylindrical),
            uViewThicken:          uniform(gp.viewThicken),
            uAoBase:               uniform(gp.aoBase),
            uAoPower:              uniform(gp.aoPower),
            uColorVar:             uniform(gp.colorVariation ? 1 : 0),
            uCvHueSpread:          uniform(gp.cvHueSpread),
            uCvSatSpread:          uniform(gp.cvSatSpread),
            uCvDryAmount:          uniform(gp.cvDryAmount),
            uCvDryCol:             uniform(col(gp.cvDryColor)),
            uBssCol:               uniform(col(gp.bssColor)),
            uBssIntensity:         uniform(gp.bssIntensity),
            uBssPower:             uniform(gp.bssPower),
            uFrontScatter:         uniform(gp.frontScatter),
            uRimSSS:               uniform(gp.rimSSS),
            uSpecV1Enabled:        uniform(gp.specV1Enabled ? 1 : 0),
            uSpecV1Intensity:      uniform(gp.specV1Intensity),
            uSpecV1Col:            uniform(col(gp.specV1Color)),
            uSpecV1Dir:            uniform(new THREE.Vector3(gp.specV1DirX, gp.specV1DirY, gp.specV1DirZ).normalize()),
            uSpecV1Power:          uniform(gp.specV1Power),
            uSpecV2Enabled:        uniform(gp.specV2Enabled ? 1 : 0),
            uSpecV2Intensity:      uniform(gp.specV2Intensity),
            uSpecV2Col:            uniform(col(gp.specV2Color)),
            uSpecV2Dir:            uniform(new THREE.Vector3(gp.specV2DirX, gp.specV2DirY, gp.specV2DirZ).normalize()),
            uSpecV2NoiseScale:     uniform(gp.specV2NoiseScale),
            uSpecV2NoiseStr:       uniform(gp.specV2NoiseStr),
            uSpecV2Power:          uniform(gp.specV2Power),
            uSpecV2TipBias:        uniform(gp.specV2TipBias),
            uLodEnabled:           uniform(gp.lodEnabled ? 1 : 0),
            uLodMidDist:           uniform(gp.lodMidDistance),
            uLodFarDist:           uniform(gp.lodFarDistance),
            uLodMaxDist:           uniform(gp.lodMaxDistance),
            uLodFadeStart:         uniform(gp.lodFadeStart),
            uLodDebug:             uniform(gp.lodDebug ? 1 : 0),
            uInteractionEnabled:   uniform(1),
            uInteractionRadius:    uniform(gp.interactionRadius),
            uInteractionStrength:  uniform(gp.interactionStrength),
          };
          geminiGrassUniforms = gu;

          const geminiCtx = {
            ...gu,
            heightTex,
            grassDensityTex: geminiDensityTex,
            cliffHeightTex,
            cliffDensityTex: geminiCliffDensityTex,
            terrainRes: HTEX_RES,
          };

          const geminiMat = geminiGrassMat(geminiCtx);

          // Build 3-tier geometries
          function buildGeminiGeos() {
            const highBase = geminiBladeGeo(gp.bladeHeight, gp.bladeWidth, Math.round(gp.bladeYSegments), gp.tipTaperStart);
            const geoHigh = geminiFieldGeo(highBase, gp.fieldSize, Math.round(gp.grassCount), gp.bladeHeight, true);
            highBase.dispose();

            const midBase = geminiBladeGeo(gp.bladeHeight, gp.bladeWidth, Math.round(gp.lodMidSegments), gp.tipTaperStart);
            const geoMid = geminiFieldGeo(midBase, gp.lodMidPatchSize, Math.round(gp.lodMidGrassCount), gp.bladeHeight, true);
            midBase.dispose();

            const farBase = geminiBladeGeo(gp.bladeHeight, gp.bladeWidth, Math.round(gp.lodFarSegments), gp.tipTaperStart);
            const geoFar = geminiFieldGeo(farBase, gp.lodFarPatchSize, Math.round(gp.lodFarGrassCount), gp.bladeHeight, false);
            farBase.dispose();

            return { geoHigh, geoMid, geoFar };
          }
          let geminiGeos = buildGeminiGeos();

          geminiGrassGroup = new THREE.Group();
          geminiGrassGroup.visible = true; // always visible — density map controls where blades appear
          scene.add(geminiGrassGroup);

          geminiGrassPatchSystem = geminiSetupPatches(
            scene,
            camera,
            geminiGrassGroup,
            { ...geminiGeos, material: geminiMat },
            {
              patchSize: gp.fieldSize,
              patchSizeMid: gp.lodMidPatchSize,
              patchSizeFar: gp.lodFarPatchSize,
              lodMidDistance: gp.lodMidDistance,
              lodFarDistance: gp.lodFarDistance,
              maxDistance: gp.lodMaxDistance,
              lodHysteresis: 2,
              lodEnabled: gp.lodEnabled,
              grassReceiveShadow: gp.grassReceiveShadow,
            },
          );

          // Expose rebuild function for GUI
          window._geminiRebuildGeos = () => {
            const oldGeos = geminiGeos;
            geminiGeos = buildGeminiGeos();
            geminiGrassPatchSystem.updateGeometries(geminiGeos);
            if (oldGeos.geoHigh) oldGeos.geoHigh.dispose();
            if (oldGeos.geoMid) oldGeos.geoMid.dispose();
            if (oldGeos.geoFar) oldGeos.geoFar.dispose();
          };
        }

        // ── COLOR HELPER — hex sRGB → linear THREE.Color (matches testtsushimaplayer2) ──
        function toLinear(hex) {
