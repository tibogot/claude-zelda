      // ─── CONSTANTS ───────────────────────────
      const TERRAIN_SIZE = 800;
      const TERRAIN_RES = 512; // data resolution — heightData array + saved PNG
      const DISPLAY_RES = 128; // display resolution — visible mesh (fast to render)
      const HEIGHT_SCALE = 40;
      const NOISE_FREQ = 0.0045;
      const SPLAT_RES = 512;
      const VERTS = TERRAIN_RES + 1; // 513 — heightData dimensions
      const DISPLAY_VERTS = DISPLAY_RES + 1; // 129 — geometry vertex count per side
      const PI = Math.PI;

      // ─── HEIGHT DATA (mutable, drives both geometry and sampleHeight) ───
      const heightData = new Float32Array(VERTS * VERTS);

      function buildHeightData() {
        heightData.fill(0);
      }
      buildHeightData();

      function generateTerrainNoise() {
        const g = PARAMS.gen;
        const sc = g.scale;
        const oct = Math.round(g.octaves);
        const H = g.height;
        const seed = g.seed * 100;
        const warp = g.domainWarp;
        const drop = g.dropoff;
        const cx = 0.5 + g.offsetX;
        const cz = 0.5 + g.offsetZ;

        for (let iz = 0; iz < VERTS; iz++) {
          for (let ix = 0; ix < VERTS; ix++) {
            const nx = ix / (VERTS - 1);
            const nz = iz / (VERTS - 1);

            // Domain warp
            const wx = warp > 0 ? _fbm(nx * sc * 3 + seed + 31.7, nz * sc * 3 + seed + 17.3, 4) * warp * 0.08 : 0;
            const wz = warp > 0 ? _fbm(nx * sc * 3 + seed + 55.1, nz * sc * 3 + seed + 89.2, 4) * warp * 0.08 : 0;

            const sx = nx * sc + seed + wx;
            const sz = nz * sc + seed + wz;

            let raw = g.mode === "ridge"
              ? _fbmRidge(sx, sz, oct)
              : _fbm(sx, sz, oct);

            // Dropoff — offset centre, variable shape
            const dx = (nx - cx) * 2;
            const dz = (nz - cz) * 2;
            let r;
            if (g.dropoffShape === "box") {
              r = Math.max(Math.abs(dx), Math.abs(dz));
            } else if (g.dropoffShape === "noise") {
              const nr = _fbm(nx * 3.1 + seed + 7.3, nz * 3.1 + seed + 12.1, 3) * 0.45;
              r = Math.sqrt(dx * dx + dz * dz) - nr;
            } else {
              r = Math.sqrt(dx * dx + dz * dz);
            }
            const falloff = Math.max(0, 1 - Math.pow(Math.max(0, r), drop));

            // Tilt — linear directional lean
            const tilt = g.tiltX * (nx - 0.5) * 2 + g.tiltZ * (nz - 0.5) * 2;

            let h = (raw + tilt * 0.5) * H * falloff;

            // Plains — flatten everything below threshold to 0
            if (g.plains > 0) {
              const thresh = g.plains * H * 0.6;
              h = h < thresh ? 0 : h - thresh;
            }

            if (g.additive) {
              heightData[iz * VERTS + ix] = Math.max(0, heightData[iz * VERTS + ix] + h);
            } else {
              heightData[iz * VERTS + ix] = Math.max(0, h);
            }
          }
        }
      }

      // Bilinear sample from heightData — used for sphere placement + sculpt falloff
      // Samples height using the same DISPLAY_RES (128) grid the visual mesh uses.
      // Used for heightTex so grass sits flush with what you actually see, not the
      // finer 512-res heightData which the mesh smooths over.
      function sampleHeightDisplay(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * DISPLAY_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * DISPLAY_RES;
        const ix0 = Math.max(0, Math.min(DISPLAY_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(DISPLAY_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(DISPLAY_RES, ix0 + 1);
        const iz1 = Math.min(DISPLAY_RES, iz0 + 1);
        const tx = fx - ix0,
          tz = fz - iz0;
        const wx00 = (-0.5 + ix0 / DISPLAY_RES) * TERRAIN_SIZE;
        const wx10 = (-0.5 + ix1 / DISPLAY_RES) * TERRAIN_SIZE;
        const wz00 = (-0.5 + iz0 / DISPLAY_RES) * TERRAIN_SIZE;
        const wz01 = (-0.5 + iz1 / DISPLAY_RES) * TERRAIN_SIZE;
        const h00 = sampleHeight(wx00, wz00),
          h10 = sampleHeight(wx10, wz00);
        const h01 = sampleHeight(wx00, wz01),
          h11 = sampleHeight(wx10, wz01);
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );
      }

      function sampleHeight(wx, wz) {
        const fx = (wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const fz = (wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
        const ix0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fx)));
        const iz0 = Math.max(0, Math.min(TERRAIN_RES - 1, Math.floor(fz)));
        const ix1 = Math.min(TERRAIN_RES, ix0 + 1);
        const iz1 = Math.min(TERRAIN_RES, iz0 + 1);
        const tx = fx - ix0,
          tz = fz - iz0;
        const h00 = heightData[iz0 * VERTS + ix0],
          h10 = heightData[iz0 * VERTS + ix1];
        const h01 = heightData[iz1 * VERTS + ix0],
          h11 = heightData[iz1 * VERTS + ix1];
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );
      }

      // ─── BIOME COLORS ────────────────────────
      const BIOME_COLORS = {
        forest: { r: 180, g: 60, b: 40 },
        grass: { r: 40, g: 180, b: 40 },
        village: { r: 40, g: 60, b: 200 },

        erase: { r: 0, g: 0, b: 0 },
      };

      // ─── SPLATMAP CANVAS ─────────────────────
      const splatCanvas = document.createElement("canvas");

      // ─── CLIFF PAINT CANVAS (separate from terrain splatmap) ──────
      const cliffPaintCanvas = document.createElement("canvas");
      cliffPaintCanvas.width = cliffPaintCanvas.height = SPLAT_RES;
      const cliffPaintCtx = cliffPaintCanvas.getContext("2d", {
        willReadFrequently: true,
      });
      cliffPaintCtx.fillStyle = "#000";
      cliffPaintCtx.fillRect(0, 0, SPLAT_RES, SPLAT_RES);
      let cliffPaintTex = null; // created after renderer init

      // ─── BARRIER CANVAS (play-mode collision boundaries) ──────
      const BARRIER_RES = SPLAT_RES;
      const barrierCanvas = document.createElement("canvas");
      barrierCanvas.width = barrierCanvas.height = BARRIER_RES;
      const barrierCtx = barrierCanvas.getContext("2d", {
        willReadFrequently: true,
      });
      barrierCtx.fillStyle = "#000";
      barrierCtx.fillRect(0, 0, BARRIER_RES, BARRIER_RES);
      let barrierTex = null;

      // ─── IMAGE TEXTURE SPLATMAP ──────────────
      // Uint8Array avoids canvas premultiplied-alpha zeroing our channels (R*alpha=0 bug)
      // RGBA: R=slot0 weight, G=slot1, B=slot2, A=slot3
      const imgSplatData = new Uint8Array(SPLAT_RES * SPLAT_RES * 4); // all zeros

      const previewCanvas = document.getElementById("splatmap-preview");
      const previewCtx = previewCanvas.getContext("2d");
      function syncPreview() {
        previewCtx.drawImage(splatCanvas, 0, 0, 128, 128);
      }
      syncPreview();

      const hmapCanvas = document.getElementById("heightmap-preview");
      const hmapCtx = hmapCanvas.getContext("2d", { willReadFrequently: true });
      const hmapImg = hmapCtx.createImageData(128, 128);
      function syncHeightmapPreview() {
        for (let py = 0; py < 128; py++) {
          for (let px = 0; px < 128; px++) {
            // sample heightData with bilinear interpolation via sampleHeight
            const wx = (px / 127) * TERRAIN_SIZE - TERRAIN_SIZE / 2;
            const wz = (py / 127) * TERRAIN_SIZE - TERRAIN_SIZE / 2;
            const h = sampleHeight(wx, wz);
            const v = Math.round(
              ((h + HEIGHT_SCALE) / (HEIGHT_SCALE * 2)) * 255,
            );
            const c = Math.max(0, Math.min(255, v));
            const i = (py * 128 + px) * 4;
            hmapImg.data[i] = c;
            hmapImg.data[i + 1] = c;
            hmapImg.data[i + 2] = c;
            hmapImg.data[i + 3] = 255;

      // ─── BVH HEIGHT GRID ─────────────────────
      const HTEX_RES = 512;
      const bvhGrid = new Float32Array(HTEX_RES * HTEX_RES); // baked heights: terrain + cliffs
      const aoData = new Float32Array(HTEX_RES * HTEX_RES * 4);

      function bvhHeight(wx, wz) {

        const h10 = bvhGrid[iz0 * HTEX_RES + ix1];
        const h01 = bvhGrid[iz1 * HTEX_RES + ix0];
        const h11 = bvhGrid[iz1 * HTEX_RES + ix1];
        return (
          h00 +
          (h10 - h00) * tx +
          (h01 - h00) * tz +
          (h00 - h10 - h01 + h11) * tx * tz
        );

      // ─── AMBIENT FX STATE ──────────────────────────────────────────────
      let ambientFXSystem  = null;
      let ambientFXErase   = false;

      const ambientFXParams = {

      let skirtGeo = null; // edge skirt geometry, updated with terrain

      let _camCurrentDist = 8; // smoothed actual camera distance (lerped toward target)

      // ─── CLIFF STATE ─────────────────────────
      const CLIFF_MODELS = [
        "models/cliff1.glb",

      let cliffObjects = [];
      let cliffBlendObjects = [];
      let selectedCliff = null;
      let activeCliffModel = 0;
      let cliffSinkOffset = 2;

      // ─── UNDO / REDO ─────────────────────────
      const MAX_UNDO = 30;
      const undoStack = [];
      const redoStack = [];

      function snapshotState() {
        return {
          height: heightData.slice(),
          splat: splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES),
        };
      }
      function pushUndo() {
        undoStack.push(snapshotState());
        if (undoStack.length > MAX_UNDO) undoStack.shift();

      function applySnapshot(snap) {

      function undo() {
        if (!undoStack.length) return;

        if (!redoStack.length) return;

      // ─── PAINT ───────────────────────────────
      // ─── NOISE / FBM (CPU, used by sculpt + paint brushes) ──────────
      function _h2(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
      }
      function _sn2(x, y) {
        const ix = Math.floor(x),
          iy = Math.floor(y);
        const fx = x - ix,
          fy = y - iy;
        const u = fx * fx * (3 - 2 * fx),
          v = fy * fy * (3 - 2 * fy);
        return (
          _h2(ix, iy) * (1 - u) * (1 - v) +
          _h2(ix + 1, iy) * u * (1 - v) +
          _h2(ix, iy + 1) * (1 - u) * v +
          _h2(ix + 1, iy + 1) * u * v
        );
      }
      function _fbm(x, y, oct = 5) {
        let s = 0,
          a = 0.5,
          f = 1,
          m = 0;
        for (let i = 0; i < oct; i++) {
          s += _sn2(x * f, y * f) * a;
          m += a;
          a *= 0.5;
          f *= 2;
        }
        return s / m;
      }
      // Ridge noise: creates sharp ridges/spires instead of smooth bumps
      function _fbmRidge(x, y, oct = 6) {
        let s = 0,
          a = 0.5,
          f = 1,
          m = 0;
        for (let i = 0; i < oct; i++) {
          const n = _sn2(x * f, y * f);
          s += (1.0 - Math.abs(n * 2.0 - 1.0)) * a; // invert valleys into ridges
          m += a;
          a *= 0.5;
          f *= 2.1;
        }
        return s / m;
      }

      // ─── UNIVERSAL FALLOFF ───────────────────────────────────────────
      function brushFalloff(t) {
        if (t >= 1) return 0;
        if (t <= 0) return 1;
        switch (PARAMS.brushFalloff) {
          case "linear": return 1 - t;
          case "sphere": return Math.sqrt(1 - t * t);
          case "hard":   return 1; // constant, sharp edge
          default:       return (1 + Math.cos(t * Math.PI)) * 0.5; // smooth cosine
        }
      }

      // Build a radial gradient using the current falloff curve
      function _radialGrad(ctx, cx, cy, r, g, b, alpha) {
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, brushSize);
        [0, 0.25, 0.5, 0.75, 0.95].forEach(t => {
          grad.addColorStop(t, `rgba(${r},${g},${b},${alpha * brushFalloff(t)})`);
        });
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        return grad;
      }

      // ─── PAINT BRUSH HELPERS ────────────────────────────────────────
      function _paintSmooth(ctx, cx, cy, r, g, b, alpha) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = _radialGrad(ctx, cx, cy, r, g, b, alpha);

        ctx.arc(cx, cy, brushSize, 0, PI * 2);
        ctx.fill();
      }

      const _fbmSplatCanvas = document.createElement("canvas");
      _fbmSplatCanvas.width = _fbmSplatCanvas.height = 162; // max brush rad*2
      const _fbmSplatCtx = _fbmSplatCanvas.getContext("2d");

      function _paintFbmSplat(ctx, cx, cy, r, g, b, alpha) {
        const pf = PARAMS.paintFbm;
        const oct = Math.max(1, Math.min(8, Math.round(pf.octaves)));
        const edgeStart = Math.max(0.05, Math.min(0.95, pf.edgeStart));
        const edgeSpan = Math.max(1e-3, 1 - edgeStart);
        const edgeBase = Math.max(0, Math.min(1, pf.edgeBase));
        const edgeNoise = Math.max(0, pf.edgeNoise);
        const centerPower = Math.max(0.25, Math.min(6, pf.centerPower));
        const noiseScale = Math.max(0.05, pf.noiseScale);
        const rad = Math.ceil(brushSize) + 1;
        const side = rad * 2;
        if (_fbmSplatCanvas.width < side) _fbmSplatCanvas.width = side;
        if (_fbmSplatCanvas.height < side) _fbmSplatCanvas.height = side;
        const imgData = _fbmSplatCtx.createImageData(side, side);
        const data = imgData.data;
        const sc = noiseScale / Math.max(brushSize, 1e-6);
        for (let py = 0; py < rad * 2; py++) {
          for (let px = 0; px < rad * 2; px++) {
            const dx = px - rad,
              dy = py - rad;
            const t = Math.sqrt(dx * dx + dy * dy) / brushSize;
            if (t >= 1) continue;
            const n = _fbm(
              dx * sc + brushNoiseSeed,
              dy * sc + brushNoiseSeed + 77,
              oct,
            );
            const blend = Math.max(0, (t - edgeStart) / edgeSpan);
            const edgeMod = 1 - blend + blend * (edgeBase + n * edgeNoise);
            const base = Math.max(0, Math.pow(Math.max(0, 1 - t), centerPower));
            const w = Math.min(1, Math.max(0, base * edgeMod)) * alpha;
            const idx = (py * rad * 2 + px) * 4;
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = Math.round(w * 255);
          }
        }
        _fbmSplatCtx.putImageData(imgData, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(_fbmSplatCanvas, 0, 0, side, side, cx - rad, cy - rad, side, side);
      }

      function _paintScatter(ctx, cx, cy, r, g, b, alpha) {
        const ps = PARAMS.paintScatter;
        const densityMult = Math.max(0.05, ps.densityMult);
        const dotRel = Math.max(0.02, Math.min(0.5, ps.dotRelSize));
        const radiusRel = Math.max(0.1, Math.min(1, ps.radiusRel));
        const alphaMin = Math.max(0, Math.min(1, ps.alphaMin));
        const alphaVar = Math.max(0, Math.min(1, ps.alphaVar));
        const count = Math.max(
          1,
          Math.round((brushSize * 0.25 + 4) * densityMult),
        );
        const dotR = Math.max(2, brushSize * dotRel);
        ctx.globalCompositeOperation = "source-over";
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * PI * 2;
          const dist = Math.random() * brushSize * radiusRel;
          const dx = cx + Math.cos(angle) * dist;
          const dy = cy + Math.sin(angle) * dist;
          const a =
            alpha *
            Math.min(1, alphaMin + Math.random() * alphaVar);
          const grad = ctx.createRadialGradient(dx, dy, 0, dx, dy, dotR);
          grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
          grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(dx, dy, dotR, 0, PI * 2);
          ctx.fill();

      }

      // ─── SMEAR / BLUR BRUSH ─────────────────────────────────────────
      // Reads existing canvas pixels, blurs them in-place weighted by brush falloff
      function _smearCanvas(ctx, cx, cy) {
        const rad = Math.ceil(brushSize);
        const cw = ctx.canvas.width, ch = ctx.canvas.height;
        const x0 = Math.max(0, Math.floor(cx - rad));
        const y0 = Math.max(0, Math.floor(cy - rad));
        const x1 = Math.min(cw, Math.ceil(cx + rad));
        const y1 = Math.min(ch, Math.ceil(cy + rad));
        const w = x1 - x0, h = y1 - y0;
        if (w <= 0 || h <= 0) return;
        const imgData = ctx.getImageData(x0, y0, w, h);
        const src = new Uint8ClampedArray(imgData.data); // read-only copy
        const dst = imgData.data;
        const alpha = brushStr / 100;
        const kr = Math.max(1, Math.round(brushSize * 0.18)); // blur kernel radius
        for (let py = 0; py < h; py++) {
          for (let px = 0; px < w; px++) {
            const dx = (x0 + px) - cx, dy = (y0 + py) - cy;
            const t = Math.sqrt(dx * dx + dy * dy) / brushSize;
            if (t >= 1) continue;
            const str = brushFalloff(t) * alpha;
            let r = 0, g = 0, b = 0, a = 0, n = 0;
            for (let ky = -kr; ky <= kr; ky++) {
              for (let kx = -kr; kx <= kr; kx++) {
                const nx = Math.max(0, Math.min(w - 1, px + kx));
                const ny = Math.max(0, Math.min(h - 1, py + ky));
                const ni = (ny * w + nx) * 4;
                r += src[ni]; g += src[ni+1]; b += src[ni+2]; a += src[ni+3]; n++;
              }
            }
            const i = (py * w + px) * 4;
            dst[i]   = src[i]   + (r/n - src[i])   * str;
            dst[i+1] = src[i+1] + (g/n - src[i+1]) * str;
            dst[i+2] = src[i+2] + (b/n - src[i+2]) * str;
            dst[i+3] = src[i+3] + (a/n - src[i+3]) * str;
          }

        ctx.putImageData(imgData, x0, y0);
      }

      // Smear imgSplatData (DataTexture) — only blurs the target slot channel
      function _smearImgSlot(cx, cy, slotIdx) {
        const rad = Math.ceil(brushSize);
        const alpha = brushStr / 100;
        const kr = Math.max(1, Math.round(brushSize * 0.18));
        const x0 = Math.max(0, Math.floor(cx - rad));
        const y0 = Math.max(0, Math.floor(cy - rad));
        const x1 = Math.min(SPLAT_RES - 1, Math.ceil(cx + rad));
        const y1 = Math.min(SPLAT_RES - 1, Math.ceil(cy + rad));
        const copy = imgSplatData.slice(); // read-only snapshot
        for (let py = y0; py <= y1; py++) {
          for (let px = x0; px <= x1; px++) {
            const dx = px - cx, dy = py - cy;
            const t = Math.sqrt(dx * dx + dy * dy) / brushSize;
            if (t >= 1) continue;
            const str = brushFalloff(t) * alpha;
            let sum = 0, n = 0;
            for (let ky = -kr; ky <= kr; ky++) {
              for (let kx = -kr; kx <= kr; kx++) {
                const nx = Math.max(0, Math.min(SPLAT_RES - 1, px + kx));
                const ny = Math.max(0, Math.min(SPLAT_RES - 1, py + ky));
                sum += copy[(ny * SPLAT_RES + nx) * 4 + slotIdx]; n++;
              }
            }
            const i = (py * SPLAT_RES + px) * 4 + slotIdx;
            imgSplatData[i] = Math.round(copy[i] + (sum/n - copy[i]) * str);
          }

      function _applyBrushToCanvas(ctx, cx, cy, r, g, b, alpha) {

          _paintScatter(ctx, cx, cy, r, g, b, alpha);
        else _paintSmooth(ctx, cx, cy, r, g, b, alpha);

      function paintAt(wx, wz) {
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES,
          cy = v * SPLAT_RES;
        const alpha = brushStr / 100;

        // Meadow uses its own density canvas (like grass), not the splatmap
        if (currentBiome === "meadow") {
          _applyBrushToCanvas(meadowCtx, cx, cy, 255, 255, 255, alpha);

        // Rock biome — paints into image slot 2 (blue channel of imgSplatTex)
        if (currentBiome === "rock") {
          if (PARAMS.paintBrush === "smear") {
            const { u, v } = worldToUV(wx, wz);
            _smearImgSlot(Math.floor(u * SPLAT_RES), SPLAT_RES - 1 - Math.floor(v * SPLAT_RES), 2);

          const slotIdx = parseInt(currentBiome[3]);
          paintImgAt(wx, wz, slotIdx, imgEraseMode);

        const col = BIOME_COLORS[currentBiome];
        _applyBrushToCanvas(splatCtx, cx, cy, col.r, col.g, col.b, alpha);
        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;
      }

      // ─── PATH PAINT + FLATTEN ────────────────
      function pathPaintAt(wx, wz) {
        // Paint path texture to splatmap blue channel (same as "village" biome)
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES,
          cy = v * SPLAT_RES;
        _applyBrushToCanvas(splatCtx, cx, cy, 0, 0, 255, brushStr / 100);
        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;

        // Gently flatten terrain under brush toward center height
        if (PARAMS.path.flattenStrength <= 0) return;
        const targetY = sampleHeight(wx, wz);
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const cellSize = TERRAIN_SIZE / TERRAIN_RES;
        const gridR = Math.ceil(radius / cellSize) + 1;
        const cgx = Math.round((wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cgz = Math.round((wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const ixMin = Math.max(0, cgx - gridR),
          ixMax = Math.min(TERRAIN_RES, cgx + gridR);
        const izMin = Math.max(0, cgz - gridR),
          izMax = Math.min(TERRAIN_RES, cgz + gridR);
        for (let iz = izMin; iz <= izMax; iz++) {
          for (let ix = ixMin; ix <= ixMax; ix++) {
            const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
            const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
            const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
            if (distSq > radiusSq) continue;
            const t = Math.sqrt(distSq) / radius;
            const falloff = (1 - t) * (1 - t);
            const cur = heightData[iz * VERTS + ix];
            heightData[iz * VERTS + ix] +=
              (targetY - cur) * falloff * PARAMS.path.flattenStrength * 0.08;
          }
        }
        // Expand sculpt dirty region for path flatten
        {
          const bx0 = wx - radius, bx1 = wx + radius;
          const bz0 = wz - radius, bz1 = wz + radius;
          if (!_sculptDirtyMin) {
            _sculptDirtyMin = { x: bx0, z: bz0 };
            _sculptDirtyMax = { x: bx1, z: bz1 };
          } else {
            if (bx0 < _sculptDirtyMin.x) _sculptDirtyMin.x = bx0;
            if (bz0 < _sculptDirtyMin.z) _sculptDirtyMin.z = bz0;
            if (bx1 > _sculptDirtyMax.x) _sculptDirtyMax.x = bx1;
            if (bz1 > _sculptDirtyMax.z) _sculptDirtyMax.z = bz1;
          }
        }
        syncGeometry();
      }

      // ─── GRASS DENSITY PAINT ─────────────────
      function paintGrassAt(wx, wz, erase) {
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES, cy = v * SPLAT_RES;
        if (PARAMS.paintBrush === "smear") {
          _smearCanvas(grassDensityCtx, cx, cy);
        } else {
          const alpha = brushStr / 100;
          const [gr, gg, gb] = erase ? [0, 0, 0] : [255, 255, 255];
          grassDensityCtx.globalCompositeOperation = "source-over";
          grassDensityCtx.fillStyle = _radialGrad(grassDensityCtx, cx, cy, gr, gg, gb, alpha);
          grassDensityCtx.beginPath();
          grassDensityCtx.arc(cx, cy, brushSize, 0, PI * 2);

          const [gr, gg, gb] = erase ? [0, 0, 0] : [255, 255, 255];
          geminiDensityCtx.globalCompositeOperation = "source-over";
          geminiDensityCtx.fillStyle = _radialGrad(geminiDensityCtx, cx, cy, gr, gg, gb, alpha);
          geminiDensityCtx.beginPath();

      // ─── BARRIER PAINT ────────────────────────
      function paintBarrierAt(wx, wz, erase) {
        const { u, v } = worldToUV(wx, wz);

        invalidateBarrierCache();
        syncBarrierOverlay();

      let _barrierCache = null;
      let _barrierCacheDirty = true;
      function _getBarrierPixels() {
        if (_barrierCacheDirty || !_barrierCache) {
          _barrierCache = barrierCtx.getImageData(0, 0, BARRIER_RES, BARRIER_RES).data;
          _barrierCacheDirty = false;
        }
        return _barrierCache;
      }
      function invalidateBarrierCache() { _barrierCacheDirty = true; }

      function isBarrierBlocked(wx, wz) {
        const pixels = _getBarrierPixels();
        const { u, v } = worldToUV(wx, wz);
        const px = Math.max(0, Math.min(BARRIER_RES - 1, Math.floor(u * BARRIER_RES)));
        const py = Math.max(0, Math.min(BARRIER_RES - 1, Math.floor(v * BARRIER_RES)));
        return pixels[(py * BARRIER_RES + px) * 4] > 64;
      }

      function syncBarrierOverlay() {
        if (!barrierOverlayMesh) return;
        barrierOverlayMesh.material.map.needsUpdate = true;
      }

      // ─── TREE PAINT ──────────────────────────
      function paintTreesAt(wx, wz, erase) {

      // ─── TREE LOD HEIGHT SYNC — re-sample Y after terrain sculpt ────────
      function syncLODHeights() {
        LOD_SLOTS.forEach(slot => {
          if (!slot.ready || slot.positions.length === 0) return;
          slot.positions.forEach((p) => {
            p.y = bvhHeight(p.x, p.z);
          });
          _rebuildLODChunks(slot);
        });
      }

      // ─── FTREE HELPERS ───────────────────────────────────────────────────
      // LCG cluster sampler — pure JS, same as sandbox
      function _ftreeSampleClusters(preset) {
        const all = [];
        preset.clusters.forEach((c, ci) => {
          if (!c.enabled) return;
          let lcg = ((ci * 999983 + 12345) >>> 0);
          lcg = ((lcg * 1664525 + 1013904223) >>> 0);
          const rng = () => { lcg = (lcg * 1664525 + 1013904223) >>> 0; return lcg / 0xffffffff; };
          const maxTry = c.count * 12;
          let tries = 0, added = 0;
          while (added < c.count && tries++ < maxTry) {
            const rx = rng() * 2 - 1;
            const ry = rng() * 2 - 1;
            const rz = rng() * 2 - 1;
            const d  = Math.sqrt(rx*rx + ry*ry + rz*rz);
            if (d > 1.0) continue;
            const innerR = 1.0 - c.shellThick;
            if (d < innerR && rng() < c.shell) continue;
            all.push({ lx: c.x + rx * c.rx, ly: c.y + ry * c.ry, lz: c.z + rz * c.rx,
                       leafSize: c.leafSize, scaleVar: c.scaleVar, tiltMax: c.tiltMax });
            added++;
          }
        });
        return all;
      }

      // Build TSL leaf material for a slot from its clusterPreset
      function _ftreeBuildLeafMat(slot) {
        const m = slot.clusterPreset.material;
        const w = slot.clusterPreset.wind;
        const mapNode = texture(new THREE.Texture());
        slot.leafMapNode = mapNode;
        const u = {
          yMin:        uniform(0.0),
          yMax:        uniform(10.0),
          bottomColor: uniform(new THREE.Color(m.bottomColor)),
          topColor:    uniform(new THREE.Color(m.topColor)),
          colorVar:    uniform(m.colorVar),
          alphaCutoff: uniform(m.alphaCutoff),
          sssColor:    uniform(new THREE.Color(m.sssColor)),
          sssStr:      uniform(m.sssStr),
          sssPow:      uniform(m.sssPow),
          rimColor:    uniform(new THREE.Color(m.rimColor)),
          rimStr:      uniform(m.rimStr),
          rimPow:      uniform(m.rimPow),
          aoStr:       uniform(m.aoStr),
          sunDir:      uniform(new THREE.Vector3(5, 12, 4).normalize()),
          windSpeed:   uniform(w.windSpeed),
          windStr:     uniform(w.windStr),
          windMicro:   uniform(w.windMicro),
        };
        slot.uniforms = u;
        const aRand = attribute("aRand", "vec2");
        const positionNode = Fn(() => {
          const phase     = aRand.x.mul(6.2832);
          const tipFactor = positionLocal.y.add(0.5);
          const sway      = sin(uFTreeTime.mul(u.windSpeed).add(phase)).mul(u.windStr).mul(tipFactor);
          const micro     = sin(uFTreeTime.mul(3.1).add(phase.mul(2.6))).mul(u.windMicro).mul(tipFactor);
          const swayZ     = cos(uFTreeTime.mul(u.windSpeed.mul(0.8)).add(phase.mul(1.3))).mul(u.windStr.mul(0.5)).mul(tipFactor);
          return positionLocal.add(vec3(sway.add(micro), float(0), swayZ));
        })();
        const colorNode = Fn(() => {
          const h1 = aRand.x;
          const h2 = aRand.y;
          const heightFactor = clamp(
            positionWorld.y.sub(u.yMin).div(max(u.yMax.sub(u.yMin), float(0.001))),
            float(0), float(1)
          );
          let col = mix(u.bottomColor, u.topColor, heightFactor);
          col = col.mul(h1.mul(u.colorVar.mul(2.0)).add(float(1.0).sub(u.colorVar)));
          const hueShift = h2.sub(0.5).mul(u.colorVar.mul(0.4));
          col = vec3(col.x.add(hueShift.mul(0.3)), col.y, col.z.sub(hueShift.mul(0.2)));
          col = col.mul(mix(float(1.0).sub(u.aoStr), float(1.0), heightFactor.mul(0.8).add(0.2)));
          const viewDir = normalize(cameraPosition.sub(positionWorld));
          const n       = normalWorld;
          const sss     = pow(max(dot(negate(u.sunDir), n), float(0)), u.sssPow).mul(u.sssStr);
          col = col.add(u.sssColor.mul(sss));
          const rim = pow(float(1.0).sub(max(dot(n, viewDir), float(0))), u.rimPow).mul(u.rimStr);
          col = col.add(u.rimColor.mul(rim));
          return clamp(col, float(0), float(2));
        })();
        const opacityNode = Fn(() =>
          smoothstep(u.alphaCutoff.sub(0.05), u.alphaCutoff.add(0.05), mapNode.r)
        )();
        const mat = new MeshStandardNodeMaterial({
          side: THREE.DoubleSide, transparent: false, alphaTest: 0.01,
          roughness: m.roughness, metalness: 0.0, depthWrite: true,
          alphaToCoverage: true,
        });
        mat.positionNode = positionNode;
        mat.colorNode    = colorNode;
        mat.opacityNode  = opacityNode;
        slot.leafMat = mat;
      }

      function syncFTreeHeights() {
        FTREE_SLOTS.forEach(slot => {
          if (slot.positions.length === 0) return;
          slot.positions.forEach(p => { p.y = sampleHeight(p.x, p.z); });
          _rebuildFTreeChunks(slot);
          _ftreeRebuildLeaves(slot);
        });
      }

      function paintFTreeAt(wx, wz, erase) {
        const slot = FTREE_SLOTS[activeFTreeSlot];
        if (!slot.clusterPreset && !slot.trunkPath) return; // empty slot
        const radius = brushWorldRadius();
        if (erase) {
          const r2 = radius * radius;
          slot.positions = slot.positions.filter(
            p => (p.x - wx) ** 2 + (p.z - wz) ** 2 > r2
          );
        } else {
          const target = slot.treesPerStroke;
          const ms2    = slot.minSpacing * slot.minSpacing;
          let added    = 0;
          for (let attempt = 0; attempt < target * 4 && added < target; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const dist  = Math.sqrt(Math.random()) * radius;
            const x = wx + Math.cos(angle) * dist;
            const z = wz + Math.sin(angle) * dist;
            if (ms2 > 0 && slot.positions.some(p => (p.x - x) ** 2 + (p.z - z) ** 2 < ms2)) continue;
            const y     = sampleHeight(x, z);
            const scale = slot.scaleMin + Math.random() * (slot.scaleMax - slot.scaleMin);
            slot.positions.push({ x, y, z, scale });
            added++;
          }
        }
        if (slot.ready) _rebuildFTreeChunks(slot);
        _ftreeRebuildLeaves(slot);
      }

      // ─── TREE LOD PAINT ──────────────────────────────────────────────────
      function paintLODAt(wx, wz, erase) {
        const slot = LOD_SLOTS[activeLodSlot];
        if (!slot.ready) return;
        const radius = brushWorldRadius();
        if (erase) {
          const r2 = radius * radius;
          slot.positions = slot.positions.filter(
            (p) => (p.x - wx) ** 2 + (p.z - wz) ** 2 > r2,
          );
        } else {
          const target = slot.treesPerStroke;
          const ms2 = slot.minSpacing * slot.minSpacing;
          let added = 0;
          for (let attempt = 0; attempt < target * 4 && added < target; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.sqrt(Math.random()) * radius;
            const x = wx + Math.cos(angle) * dist;
            const z = wz + Math.sin(angle) * dist;
            if (ms2 > 0 && slot.positions.some(p => (p.x - x) ** 2 + (p.z - z) ** 2 < ms2)) continue;
            const y = bvhHeight(x, z);
            const scale = slot.scaleMin + Math.random() * (slot.scaleMax - slot.scaleMin);
            slot.positions.push({ x, y, z, scale });
            added++;
          }
        }
        _rebuildLODChunks(slot);
      }

      // ─── IMAGE TEXTURE PAINT ─────────────────────────────────────────────
      // Direct Uint8Array write — no canvas premultiplied-alpha issues
      function paintImgAt(wx, wz, slotIdx, erase) {
        const { u, v } = worldToUV(wx, wz);
        const cx = Math.floor(u * SPLAT_RES);
        // DataTexture has flipY=false unlike CanvasTexture (flipY=true),
        // so invert cy to cancel the double-flip mismatch
        const cy = SPLAT_RES - 1 - Math.floor(v * SPLAT_RES);
        const rad = Math.ceil(brushSize);
        const alpha = brushStr / 100;
        for (let py = cy - rad; py <= cy + rad; py++) {
          for (let px = cx - rad; px <= cx + rad; px++) {
            if (px < 0 || px >= SPLAT_RES || py < 0 || py >= SPLAT_RES)
              continue;
            const dx = px - cx,
              dy = py - cy;
            const t = Math.sqrt(dx * dx + dy * dy) / brushSize;
            if (t >= 1) continue;
            const falloff = brushFalloff(t);
            const idx = (py * SPLAT_RES + px) * 4 + slotIdx; // R=0, G=1, B=2, A=3
            const cur = imgSplatData[idx] / 255;
            if (erase) {
              imgSplatData[idx] = Math.max(
                0,
                Math.round((cur - falloff * alpha) * 255),
              );
            } else {
              imgSplatData[idx] = Math.min(
                255,
                Math.round((cur + falloff * alpha) * 255),
              );
            }
          }
        }
        if (imgSplatTex) imgSplatTex.needsUpdate = true;
      }

      // ─── BRUSH RADIUS (module-level so sculptAt + paintAt can use it) ───
      function brushWorldRadius() {
        return (brushSize / SPLAT_RES) * TERRAIN_SIZE;
      }

      // ─── SCULPT ──────────────────────────────
      // plain drag = raise | shift+drag = lower | ctrl+drag = smooth
      function sculptAt(wx, wz, e) {
        if (!terrainGeo) return;
        if (sculptMode === "ramp")  return; // ramp is click-click, not drag
        if (sculptMode === "stamp") return; // stamp is click-only, handled in mousedown
        const mode = e?.altKey
          ? "flatten"
          : e?.ctrlKey
            ? "smooth"
            : e?.shiftKey
              ? "lower"
              : sculptMode === "noise"
                ? "noise"
                : sculptMode === "erosion"
                  ? "erosion"
                  : sculptMode === "terrace"
                    ? "terrace"
                    : "raise";
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const strength = (brushStr / 100) * 0.4;

        // Limit iteration to affected grid region
        const cellSize = TERRAIN_SIZE / TERRAIN_RES;
        const gridR = Math.ceil(radius / cellSize) + 1;
        const cx = Math.round((wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cz = Math.round((wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const ixMin = Math.max(0, cx - gridR),
          ixMax = Math.min(TERRAIN_RES, cx + gridR);
        const izMin = Math.max(0, cz - gridR),
          izMax = Math.min(TERRAIN_RES, cz + gridR);

        if (mode === "smooth") {
          // Two-pass: read then write to avoid order dependency
          const scratch = new Float32Array(
            (ixMax - ixMin + 1) * (izMax - izMin + 1),
          );
          let si = 0;
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) {
                scratch[si++] = heightData[iz * VERTS + ix];
                continue;
              }
              // Average 3x3 neighbors
              let sum = 0,
                count = 0;
              for (let dz = -1; dz <= 1; dz++)
                for (let dx = -1; dx <= 1; dx++) {
                  const nx2 = Math.max(0, Math.min(TERRAIN_RES, ix + dx));
                  const nz2 = Math.max(0, Math.min(TERRAIN_RES, iz + dz));
                  sum += heightData[nz2 * VERTS + nx2];
                  count++;
                }
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const avg = sum / count;
              scratch[si++] =
                heightData[iz * VERTS + ix] +
                (avg - heightData[iz * VERTS + ix]) * falloff * strength * 2;
            }
          }
          si = 0;
          for (let iz = izMin; iz <= izMax; iz++)
            for (let ix = ixMin; ix <= ixMax; ix++)
              heightData[iz * VERTS + ix] = scratch[si++];
        } else if (mode === "flatten") {
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const falloff = 1 - Math.sqrt(distSq) / radius;
              const smooth = falloff * falloff;
              const current = heightData[iz * VERTS + ix];
              heightData[iz * VERTS + ix] +=
                (flattenTargetY - current) * smooth * strength * 2;
            }
          }
        } else if (mode === "erosion") {
          // Hydraulic erosion brush — same physics as full bake, local droplets only
          const Ke = PARAMS.erosion.erosionRate;
          const Kd = PARAMS.erosion.depositionRate;
          const Kev = PARAMS.erosion.evaporation;
          const Kin = PARAMS.erosion.inertia;
          const Kc = PARAMS.erosion.capacity;
          const erRad = PARAMS.erosion.radius;
          const G = 4, maxSteps = 60, minSlope = 0.001;
          const N = Math.max(1, Math.round(brushStr * 1.5));

          // Brush center in grid space
          const gcx = (wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
          const gcz = (wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES;
          const gridR = (radius / TERRAIN_SIZE) * TERRAIN_RES;

          // Precompute soft erode kernel
          const er = Math.ceil(erRad);
          const bOX = [], bOZ = [], bWt = [];
          let totW = 0;
          for (let dz2 = -er; dz2 <= er; dz2++) {
            for (let dx2 = -er; dx2 <= er; dx2++) {
              const d = Math.sqrt(dx2 * dx2 + dz2 * dz2);
              if (d >= erRad) continue;
              const w = erRad - d; bOX.push(dx2); bOZ.push(dz2); bWt.push(w); totW += w;
            }
          }
          for (let i = 0; i < bWt.length; i++) bWt[i] /= totW;

          const sHG = (px, pz) => {
            const x0 = Math.floor(px), z0 = Math.floor(pz);
            const x1 = Math.min(TERRAIN_RES, x0+1), z1 = Math.min(TERRAIN_RES, z0+1);
            const tx = px-x0, tz = pz-z0;
            const h00=heightData[z0*VERTS+x0], h10=heightData[z0*VERTS+x1];
            const h01=heightData[z1*VERTS+x0], h11=heightData[z1*VERTS+x1];
            return {
              h:  h00*(1-tx)*(1-tz)+h10*tx*(1-tz)+h01*(1-tx)*tz+h11*tx*tz,
              gx: (h10-h00)*(1-tz)+(h11-h01)*tz,
              gz: (h01-h00)*(1-tx)+(h11-h10)*tx,
            };
          };
          const dep = (px, pz, amt) => {
            const x0=Math.floor(px), z0=Math.floor(pz);
            const x1=Math.min(TERRAIN_RES,x0+1), z1=Math.min(TERRAIN_RES,z0+1);
            const tx=px-x0, tz=pz-z0;
            heightData[z0*VERTS+x0]+=amt*(1-tx)*(1-tz);
            heightData[z0*VERTS+x1]+=amt*tx*(1-tz);
            heightData[z1*VERTS+x0]+=amt*(1-tx)*tz;
            heightData[z1*VERTS+x1]+=amt*tx*tz;
          };

          for (let iter = 0; iter < N; iter++) {
            // Uniform disk sampling within brush radius
            const angle = Math.random() * 2 * Math.PI;
            const rr = Math.sqrt(Math.random()) * gridR;
            let px = gcx + Math.cos(angle) * rr;
            let pz = gcz + Math.sin(angle) * rr;
            if (px < 1 || px >= VERTS-2 || pz < 1 || pz >= VERTS-2) continue;

            let ddx=0, ddz=0, speed=1, water=1, sediment=0;
            for (let step = 0; step < maxSteps; step++) {
              const { h, gx, gz } = sHG(px, pz);
              ddx = ddx*Kin - gx*(1-Kin);
              ddz = ddz*Kin - gz*(1-Kin);
              const len = Math.sqrt(ddx*ddx+ddz*ddz) || 1;
              ddx /= len; ddz /= len;
              const nx2=px+ddx, nz2=pz+ddz;
              if (nx2<0||nx2>=VERTS-1||nz2<0||nz2>=VERTS-1) break;
              const dh = sHG(nx2, nz2).h - h;
              const cap = Math.max(minSlope,-dh)*speed*water*Kc;
              if (sediment > cap || dh > 0) {
                const amt = dh>0 ? Math.min(sediment,dh) : (sediment-cap)*Kd;
                sediment -= amt; dep(px, pz, amt);
              } else {
                const amt = Math.min((cap-sediment)*Ke, -dh+0.001);
                sediment += amt;
                const cx2=Math.floor(px), cz2=Math.floor(pz);
                for (let i=0; i<bWt.length; i++) {
                  const ex=cx2+bOX[i], ez=cz2+bOZ[i];
                  if (ex<0||ex>=VERTS||ez<0||ez>=VERTS) continue;
                  heightData[ez*VERTS+ex] -= amt*bWt[i];
                }
              }
              speed = Math.min(8, Math.sqrt(Math.max(0, speed*speed-dh*G)));
              water *= 1-Kev;
              if (water < 0.005) break;
              px=nx2; pz=nz2;
            }
            dep(px, pz, sediment*Kd);
          }
        } else if (mode === "terrace") {
          const step = PARAMS.terraceStep;
          const sharpness = PARAMS.terraceSharpness; // 0=smooth blend, 1=hard snap
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const t = Math.sqrt(distSq) / radius;
              const falloff = (1 - t * t) * (1 - t * t); // smooth quartic falloff
              const h = heightData[iz * VERTS + ix];
              // Snap height to nearest multiple of step, with sharpness controlling blend
              const floored = Math.floor(h / step) * step;
              const frac = (h - floored) / step; // 0..1 within the step
              // Sharpness curves the fraction: at 1.0 everything snaps to floor except near the top
              const curved = frac < sharpness
                ? frac * (1 - sharpness) / sharpness
                : (frac - sharpness) / (1 - sharpness) * sharpness + (1 - sharpness);
              const snapped = floored + curved * step;
              heightData[iz * VERTS + ix] += (snapped - h) * falloff * strength * 3;
            }
          }
        } else if (mode === "noise") {
          const freq = PARAMS.noiseScale / radius;
          const oct = Math.round(PARAMS.noiseOctaves);
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const t = Math.sqrt(distSq) / radius;
              const falloff = (1 - t) * (1 - t);
              // _fbm returns [0,1] — subtract 0.5 for bipolar [-0.5, 0.5]
              const n = _fbm(
                vx * freq + brushNoiseSeed,
                vz * freq + brushNoiseSeed * 1.3,
                oct
              ) - 0.5;
              heightData[iz * VERTS + ix] += n * falloff * strength * 4;
            }
          }
        } else {
          const dir = mode === "raise" ? 1 : -1;
          const brush = PARAMS.sculptBrush;
          const sc = 3.0 / radius; // FBM frequency scale
          for (let iz = izMin; iz <= izMax; iz++) {
            for (let ix = ixMin; ix <= ixMax; ix++) {
              const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
              const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
              const distSq = (vx - wx) * (vx - wx) + (vz - wz) * (vz - wz);
              if (distSq > radiusSq) continue;
              const t = Math.sqrt(distSq) / radius;
              let delta = 0;
              if (brush === "fbm_peak") {
                const ridgeSc = 3.5 / radius;
                const ridge = _fbmRidge(
                  (vx - wx) * ridgeSc + brushNoiseSeed,
                  (vz - wz) * ridgeSc + brushNoiseSeed,
                  6,
                );
                // Sharp spike falloff ensures center always peaks
                const spike = Math.pow(Math.max(0, 1 - t), 2.5);
                // Ridge noise creates the jagged spires; center biased toward full spike
                const shape = spike * (0.35 + ridge * 1.8);
                delta = dir * Math.max(0, shape) * strength * 2.0;
              } else if (brush === "crater") {
                const rim = Math.exp(-Math.pow(t - 0.55, 2) / 0.04) * 1.2;
                const pit = Math.max(0, 1 - t * 4) * 0.6;
                delta = dir * (rim - pit) * strength * 0.8;
              } else if (brush === "plateau") {
                const flat = Math.max(
                  0,
                  1 - Math.pow(Math.max(0, t - 0.6) / 0.4, 2),
                );
                delta = dir * flat * strength * 0.7;
              } else {
                // raise/lower — respects brushFalloff curve
                delta = dir * brushFalloff(t) * strength;
              }
              heightData[iz * VERTS + ix] += delta;
            }
          }
        }
        // Expand sculpt dirty region
        {
          const bx0 = wx - radius, bx1 = wx + radius;
          const bz0 = wz - radius, bz1 = wz + radius;
          if (!_sculptDirtyMin) {
            _sculptDirtyMin = { x: bx0, z: bz0 };
            _sculptDirtyMax = { x: bx1, z: bz1 };
          } else {
            if (bx0 < _sculptDirtyMin.x) _sculptDirtyMin.x = bx0;
            if (bz0 < _sculptDirtyMin.z) _sculptDirtyMin.z = bz0;
            if (bx1 > _sculptDirtyMax.x) _sculptDirtyMax.x = bx1;
            if (bz1 > _sculptDirtyMax.z) _sculptDirtyMax.z = bz1;
          }
        }
        syncGeometry();
      }

      // ─── STAMP TOOL ──────────────────────────
      function sampleStamp(u, v) {
        if (!stampImageData) return 0;
        const w = stampImageData.width, h = stampImageData.height;
        const px = Math.max(0, Math.min(w - 1, u * (w - 1)));
        const py = Math.max(0, Math.min(h - 1, v * (h - 1)));
        const x0 = Math.floor(px), x1 = Math.min(x0 + 1, w - 1);
        const y0 = Math.floor(py), y1 = Math.min(y0 + 1, h - 1);
        const fx = px - x0, fy = py - y0;
        const d = stampImageData.data;
        const s = (xi, yi) => d[(yi * w + xi) * 4] / 255; // red channel = grayscale
        return (s(x0,y0)*(1-fx) + s(x1,y0)*fx) * (1-fy)
             + (s(x0,y1)*(1-fx) + s(x1,y1)*fx) * fy;
      }

      function applyStamp(wx, wz) {
        if (!stampImageData || !terrainGeo) return;
        const radius    = brushWorldRadius();
        const radiusSq  = radius * radius;
        const cellSize  = TERRAIN_SIZE / TERRAIN_RES;
        const gridR     = Math.ceil(radius / cellSize) + 1;
        const cx        = Math.round((wx / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cz        = Math.round((wz / TERRAIN_SIZE + 0.5) * TERRAIN_RES);
        const cos       = Math.cos(PARAMS.stampRotation);
        const sin       = Math.sin(PARAMS.stampRotation);
        const strength  = brushStr / 100;

        for (let dz = -gridR; dz <= gridR; dz++) {
          for (let dx = -gridR; dx <= gridR; dx++) {
            const gx = cx + dx, gz = cz + dz;
            if (gx < 0 || gx >= VERTS || gz < 0 || gz >= VERTS) continue;
            const vx = (-0.5 + gx / TERRAIN_RES) * TERRAIN_SIZE;
            const vz = (-0.5 + gz / TERRAIN_RES) * TERRAIN_SIZE;
            const lx = vx - wx, lz = vz - wz;
            const distSq = lx * lx + lz * lz;
            if (distSq > radiusSq) continue;

            // Rotate into stamp local space
            const rx = lx * cos - lz * sin;
            const rz = lx * sin + lz * cos;

            // Smooth radial falloff at edges so stamp blends into existing terrain
            const t = Math.sqrt(distSq) / radius;
            const falloff = 1 - t * t;

            // Sample stamp grayscale (0=black/low, 1=white/high) with bilinear filter
            const stampH = sampleStamp(rx / radius * 0.5 + 0.5, rz / radius * 0.5 + 0.5);

            const idx = gz * VERTS + gx;
            if (PARAMS.stampBlendMode === "add") {
              heightData[idx] += stampH * falloff * strength * HEIGHT_SCALE;
            } else {
              // Replace: lerp current height toward the stamp target height
              const targetH = stampH * HEIGHT_SCALE * strength;
              heightData[idx] += (targetH - heightData[idx]) * falloff * strength;
            }
          }
        }
        syncGeometry();
        if (bakeBVH) bakeBVH();
      }

      // ─── RAMP TOOL ───────────────────────────
      function applyRamp(ptA, ptB) {
        const dx = ptB.x - ptA.x;
        const dz = ptB.z - ptA.z;
        const lenSq = dx * dx + dz * dz;
        if (lenSq < 0.001) return;
        const radius = brushWorldRadius();
        const radiusSq = radius * radius;
        const strength = brushStr / 100;

        const minX = Math.min(ptA.x, ptB.x) - radius;
        const maxX = Math.max(ptA.x, ptB.x) + radius;
        const minZ = Math.min(ptA.z, ptB.z) - radius;
        const maxZ = Math.max(ptA.z, ptB.z) + radius;
        const ixMin = Math.max(0, Math.floor((minX / TERRAIN_SIZE + 0.5) * TERRAIN_RES));
        const ixMax = Math.min(TERRAIN_RES, Math.ceil((maxX / TERRAIN_SIZE + 0.5) * TERRAIN_RES));
        const izMin = Math.max(0, Math.floor((minZ / TERRAIN_SIZE + 0.5) * TERRAIN_RES));
        const izMax = Math.min(TERRAIN_RES, Math.ceil((maxZ / TERRAIN_SIZE + 0.5) * TERRAIN_RES));

        for (let iz = izMin; iz <= izMax; iz++) {
          for (let ix = ixMin; ix <= ixMax; ix++) {
            const vx = (-0.5 + ix / TERRAIN_RES) * TERRAIN_SIZE;
            const vz = (-0.5 + iz / TERRAIN_RES) * TERRAIN_SIZE;
            // Project vertex onto A→B line, get t [0,1]
            const t = Math.max(0, Math.min(1,
              ((vx - ptA.x) * dx + (vz - ptA.z) * dz) / lenSq
            ));
            // Perpendicular distance from the A→B line
            const perpX = ptA.x + t * dx - vx;
            const perpZ = ptA.z + t * dz - vz;
            const perpSq = perpX * perpX + perpZ * perpZ;
            if (perpSq > radiusSq) continue;
            const falloff = Math.pow(1 - Math.sqrt(perpSq) / radius, 2);
            const targetY = ptA.y + t * (ptB.y - ptA.y);
            const current = heightData[iz * VERTS + ix];
            heightData[iz * VERTS + ix] += (targetY - current) * falloff * strength;
          }
        }
        syncGeometry();
      }

      // ─── NORMAL MAP BAKE ─────────────────────────────────────────────
      function bakeNormalMap() {
        const N = HTEX_RES;
        const cellW = TERRAIN_SIZE / N;
        // For terrain tangent=(1,0,0), bitangent=(0,0,-1) due to V=1-z/TS mapping.
        // Tangent-space encoding: R=-dH/dx, G=dH/dz (V-flip), B=up
        for (let iz = 0; iz < N; iz++) {
          for (let ix = 0; ix < N; ix++) {
            const wx = (-0.5 + ix / N) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / N) * TERRAIN_SIZE;
            const hR = sampleHeight(wx + cellW, wz);
            const hL = sampleHeight(wx - cellW, wz);
            const hU = sampleHeight(wx, wz + cellW);
            const hD = sampleHeight(wx, wz - cellW);
            const dxH = (hR - hL) / (2 * cellW);
            const dzH = (hU - hD) / (2 * cellW);
            const mag = Math.sqrt(dxH * dxH + dzH * dzH + 1);
            const idx = (iz * N + ix) * 4;
            nmData[idx] = (-dxH / mag) * 0.5 + 0.5; // R — tangent X
            nmData[idx + 1] = (dzH / mag) * 0.5 + 0.5; // G — bitangent (V-flipped Z)
            nmData[idx + 2] = (1 / mag) * 0.5 + 0.5; // B — up
            nmData[idx + 3] = 1;
          }
        }
        normalMapTex.needsUpdate = true;
      }

      // ─── AO BAKE ─────────────────────────────────────────────────────
      function bakeAO() {
        const N = HTEX_RES;
        const NUM_DIRS = 8;
        const MAX_STEPS = Math.max(1, Math.round(PARAMS.ao.reach));
        const stepDist = TERRAIN_SIZE / N; // world units per step
        const biasRad = (PARAMS.ao.bias * Math.PI) / 2; // ignore angles below this
        const halfPI = Math.PI / 2;
        const contrast = PARAMS.ao.contrast;

        for (let iz = 0; iz < N; iz++) {
          for (let ix = 0; ix < N; ix++) {
            const wx = (-0.5 + ix / N) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / N) * TERRAIN_SIZE;
            const curH = sampleHeight(wx, wz);
            let totalOcc = 0;
            for (let d = 0; d < NUM_DIRS; d++) {
              const angle = (d / NUM_DIRS) * Math.PI * 2;
              const dX = Math.cos(angle),
                dZ = Math.sin(angle);
              let maxElev = 0;
              for (let s = 1; s <= MAX_STEPS; s++) {
                const sx = wx + dX * s * stepDist;
                const sz = wz + dZ * s * stepDist;
                if (
                  sx < -TERRAIN_SIZE * 0.5 ||
                  sx > TERRAIN_SIZE * 0.5 ||
                  sz < -TERRAIN_SIZE * 0.5 ||
                  sz > TERRAIN_SIZE * 0.5
                )
                  break;
                const elev = Math.atan2(
                  sampleHeight(sx, sz) - curH,
                  s * stepDist,
                );
                if (elev > maxElev) maxElev = elev;
              }
              // Bias: subtract threshold angle — shallow horizons don't contribute
              totalOcc += Math.max(0, maxElev - biasRad) / (halfPI - biasRad);
            }
            // Raw AO 0-1, then power-curve for contrast
            const raw = Math.max(0, 1 - totalOcc / NUM_DIRS);
            const ao = Math.pow(raw, contrast);
            const idx = (iz * N + ix) * 4;
            aoData[idx] = aoData[idx + 1] = aoData[idx + 2] = ao;
            aoData[idx + 3] = 1;
          }
        }
        aoTex.needsUpdate = true;
      }

      // ─── HYDRAULIC EROSION ───────────────────────────────────────────
      function runErosion() {
        pushUndo();
        const N = PARAMS.erosion.iterations;
        const Ke = PARAMS.erosion.erosionRate;
        const Kd = PARAMS.erosion.depositionRate;
        const Kev = PARAMS.erosion.evaporation;
        const Kin = PARAMS.erosion.inertia;
        const Kc = PARAMS.erosion.capacity;
        const erRad = PARAMS.erosion.radius;
        const G = 4; // gravity strength
        const maxSteps = 80;
        const minSlope = 0.001;

        // Precompute soft erosion brush (offsets + normalized weights)
        const r = Math.ceil(erRad);
        const bOffX = [],
          bOffZ = [],
          bW = [];
        let totalW = 0;
        for (let dz = -r; dz <= r; dz++) {
          for (let dx = -r; dx <= r; dx++) {
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist >= erRad) continue;
            const w = erRad - dist;
            bOffX.push(dx);
            bOffZ.push(dz);
            bW.push(w);
            totalW += w;
          }
        }
        for (let i = 0; i < bW.length; i++) bW[i] /= totalW;

        // Bilinear sample → height + gradient (in grid-cell units)
        function sampleHG(px, pz) {
          const x0 = Math.floor(px),
            z0 = Math.floor(pz);
          const x1 = Math.min(TERRAIN_RES, x0 + 1);
          const z1 = Math.min(TERRAIN_RES, z0 + 1);
          const tx = px - x0,
            tz = pz - z0;
          const h00 = heightData[z0 * VERTS + x0],
            h10 = heightData[z0 * VERTS + x1];
          const h01 = heightData[z1 * VERTS + x0],
            h11 = heightData[z1 * VERTS + x1];
          return {
            h:
              h00 * (1 - tx) * (1 - tz) +
              h10 * tx * (1 - tz) +
              h01 * (1 - tx) * tz +
              h11 * tx * tz,
            gx: (h10 - h00) * (1 - tz) + (h11 - h01) * tz,
            gz: (h01 - h00) * (1 - tx) + (h11 - h10) * tx,
          };
        }

        // Bilinear deposit at droplet position
        function deposit(px, pz, amt) {
          const x0 = Math.floor(px),
            z0 = Math.floor(pz);
          const x1 = Math.min(TERRAIN_RES, x0 + 1),
            z1 = Math.min(TERRAIN_RES, z0 + 1);
          const tx = px - x0,
            tz = pz - z0;
          heightData[z0 * VERTS + x0] += amt * (1 - tx) * (1 - tz);
          heightData[z0 * VERTS + x1] += amt * tx * (1 - tz);
          heightData[z1 * VERTS + x0] += amt * (1 - tx) * tz;
          heightData[z1 * VERTS + x1] += amt * tx * tz;
        }

        // Soft-brush erode centred at droplet position
        function erode(px, pz, amt) {
          const cx = Math.floor(px),
            cz = Math.floor(pz);
          for (let i = 0; i < bW.length; i++) {
            const nx = cx + bOffX[i],
              nz = cz + bOffZ[i];
            if (nx < 0 || nx >= VERTS || nz < 0 || nz >= VERTS) continue;
            heightData[nz * VERTS + nx] -= amt * bW[i];
          }
        }

        // Simulate droplets
        for (let iter = 0; iter < N; iter++) {
          let px = 1 + Math.random() * (VERTS - 3);
          let pz = 1 + Math.random() * (VERTS - 3);
          let dx = 0,
            dz = 0;
          let speed = 1,
            water = 1,
            sediment = 0;

          for (let step = 0; step < maxSteps; step++) {
            const { h, gx, gz } = sampleHG(px, pz);

            // Direction: blend inertia + downhill gradient
            dx = dx * Kin - gx * (1 - Kin);
            dz = dz * Kin - gz * (1 - Kin);
            const len = Math.sqrt(dx * dx + dz * dz) || 1;
            dx /= len;
            dz /= len;

            const nx = px + dx,
              nz = pz + dz;
            if (nx < 0 || nx >= VERTS - 1 || nz < 0 || nz >= VERTS - 1) break;

            const newH = sampleHG(nx, nz).h;
            const dh = newH - h;

            // Sediment capacity: higher on steep fast-moving slopes
            const slope = Math.max(minSlope, -dh);
            const cap = slope * speed * water * Kc;

            if (sediment > cap || dh > 0) {
              // Slow/uphill → deposit
              const amt =
                dh > 0
                  ? Math.min(sediment, dh) // fill hollow just enough
                  : (sediment - cap) * Kd;
              sediment -= amt;
              deposit(px, pz, amt);
            } else {
              // Fast downhill → erode (capped by available height drop)
              const amt = Math.min((cap - sediment) * Ke, -dh + 0.001);
              sediment += amt;
              erode(px, pz, amt);
            }

            speed = Math.sqrt(Math.max(0, speed * speed - dh * G));
            speed = Math.min(speed, 8); // cap runaway speed
            water *= 1 - Kev;
            if (water < 0.005) break;
            px = nx;
            pz = nz;
          }

          // Deposit remaining carried sediment
          deposit(px, pz, sediment * Kd);
        }

        syncGeometry();
        if (bakeBVH) bakeBVH();
        if (treeSystem) treeSystem.syncHeights();
        syncLODHeights();
        syncFTreeHeights();
        FOLIAGE_SLOTS.forEach((s) => {
          if (s.system) s.system.syncHeights();
        });
        OBJECT_SLOTS.forEach((s) => {
          if (s.system) s.system.syncHeights();
        });
        if (fleurSystem) fleurSystem.syncHeights();
        if (ambientFXSystem) ambientFXSystem.syncHeights();
        propObjects.forEach((root) => {
          root.position.y = bvhHeight(root.position.x, root.position.z);
        });
      }

      function syncGeometry() {
        if (!terrainGeo) return;
        const pos = terrainGeo.attributes.position;
        for (let iz = 0; iz <= DISPLAY_RES; iz++) {
          for (let ix = 0; ix <= DISPLAY_RES; ix++) {
            const wx = (-0.5 + ix / DISPLAY_RES) * TERRAIN_SIZE;
            const wz = (-0.5 + iz / DISPLAY_RES) * TERRAIN_SIZE;
            pos.setY(iz * DISPLAY_VERTS + ix, sampleHeight(wx, wz));
          }
        }
        pos.needsUpdate = true;
        terrainGeo.computeVertexNormals();

        // Update skirt top vertices to match terrain edges
        if (skirtGeo && skirtEdgeXZ.length > 0) {
          const sp = skirtGeo.attributes.position;
          const NV = DISPLAY_VERTS;
          for (let s = 0; s < 4; s++) {
            for (let i = 0; i < NV; i++) {
              const { wx, wz } = skirtEdgeXZ[s * NV + i];
              sp.setY(s * NV * 2 + i * 2, sampleHeight(wx, wz)); // top vertex
            }
          }
          sp.needsUpdate = true;
          skirtGeo.computeVertexNormals();
        }

        syncHeightmapPreview();
      }

      // ─── LIVE FOLIAGE ────────────────────────
      function generateObjects(scene) {
        if (instancedObjs) {
          scene.remove(instancedObjs);
          instancedObjs.geometry.dispose();
          instancedObjs.material.dispose();
          instancedObjs = null;
        }

        const pixels = splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES).data;
        const positions = [];
        const STEP = 4;

        for (let iy = 0; iy < SPLAT_RES; iy += STEP) {
          for (let ix = 0; ix < SPLAT_RES; ix += STEP) {
            const idx = (iy * SPLAT_RES + ix) * 4;
            const r = pixels[idx],
              g = pixels[idx + 1],
              b = pixels[idx + 2];
            if (r >= SPHERE_THRESHOLD && r > g + 20 && r > b + 20) {
              const { x, z } = uvToWorld(ix / SPLAT_RES, iy / SPLAT_RES);
              const cellSize = TERRAIN_SIZE / (SPLAT_RES / STEP);
              const jx = (Math.random() - 0.5) * cellSize;
              const jz = (Math.random() - 0.5) * cellSize;
              const wx = x + jx,
                wz = z + jz;
              // Slope exclusion: skip steep faces
              const eps = 1.5;
              const dydx =
                (sampleHeight(wx + eps, wz) - sampleHeight(wx - eps, wz)) /
                (2 * eps);
              const dydz =
                (sampleHeight(wx, wz + eps) - sampleHeight(wx, wz - eps)) /
                (2 * eps);
              const slope = Math.sqrt(dydx * dydx + dydz * dydz);
              if (slope > 1.2) continue; // skip cliffs
              positions.push(new THREE.Vector3(wx, sampleHeight(wx, wz), wz));
            }
          }
        }

        if (positions.length === 0) {
          document.getElementById("obj-count").textContent = "0 objects";
          return;
        }

        const geo = new THREE.SphereGeometry(0.5, 8, 6);
        const emissiveColor = color(0x44ff44);
        const emissiveIntensity = uniform(3.0);
        const mat = new MeshBasicNodeMaterial();
        mat.colorNode = emissiveColor.div(luminance(emissiveColor)).mul(emissiveIntensity);
        instancedObjs = new THREE.InstancedMesh(geo, mat, positions.length);
        instancedObjs.castShadow = true;
        instancedObjs.receiveShadow = true;

        const dummy = new THREE.Object3D();
        positions.forEach((pos, i) => {
          dummy.position.set(pos.x, pos.y + 0.5, pos.z);
          dummy.scale.setScalar(0.5 + Math.random() * 0.9);
          dummy.updateMatrix();
          instancedObjs.setMatrixAt(i, dummy.matrix);
        });
        instancedObjs.instanceMatrix.needsUpdate = true;
        scene.add(instancedObjs);
        document.getElementById("obj-count").textContent =
          `${positions.length.toLocaleString()} objects`;
      }

      // ─── SAVE / LOAD ─────────────────────────
      function saveSplatmap() {
        const pixels = splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES).data;
        const blob = new Blob([pixels.buffer], {
          type: "application/octet-stream",
        });
        const a = document.createElement("a");
        a.download = "splatmap.bin";
        a.href = URL.createObjectURL(blob);
        a.click();
      }
      function loadSplatmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const loaded = new Uint8ClampedArray(e.target.result);
          const imgData = splatCtx.createImageData(SPLAT_RES, SPLAT_RES);
          imgData.data.set(loaded.subarray(0, imgData.data.length));
          splatCtx.putImageData(imgData, 0, 0);
          syncPreview();
          if (splatTex) splatTex.needsUpdate = true;
        };
        reader.readAsArrayBuffer(file);
      }

      // ─── HEIGHTMAP SAVE / LOAD ───────────────
      // Saves raw Float32Array as .bin — perfectly lossless, no PNG gamma issues.
      function saveHeightmap() {
        const blob = new Blob([heightData.buffer], {
          type: "application/octet-stream",
        });
        const a = document.createElement("a");
        a.download = "heightmap.bin";
        a.href = URL.createObjectURL(blob);
        a.click();
      }
      function loadHeightmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          if (e.target.result.byteLength % 4 !== 0) {
            alert("Heightmap load failed: file is not a valid .bin heightmap.\nUse the Stamp tool to load PNG images as stamps instead.");
            return;
          }
          const loaded = new Float32Array(e.target.result);
          if (loaded.length === heightData.length) {
            heightData.set(loaded);
          } else {
            console.warn(
              `Heightmap size mismatch: got ${loaded.length}, expected ${heightData.length}`,
            );
            // Copy as much as fits
            heightData.set(
              loaded.subarray(0, Math.min(loaded.length, heightData.length)),
            );
          }
          syncGeometry();
          syncHeightmapPreview();
          if (bakeBVH) bakeBVH();
          if (treeSystem) treeSystem.syncHeights();
          syncLODHeights();
          syncFTreeHeights();
          FOLIAGE_SLOTS.forEach((s) => {
            if (s.system) s.system.syncHeights();
          });
          OBJECT_SLOTS.forEach((s) => {
            if (s.system) s.system.syncHeights();
          });
          if (fleurSystem) fleurSystem.syncHeights();
          if (ambientFXSystem) ambientFXSystem.syncHeights();
        };
        reader.readAsArrayBuffer(file);
      }

      // ─── CLIFF SAVE ──────────────────────────

          ry: root.rotation.y,
          rz: root.rotation.z,
          sx: root.scale.x,
          sy: root.scale.y,
          sz: root.scale.z,

        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.download = "cliffs.json";
        a.href = URL.createObjectURL(blob);
        a.click();
      }

      // ─── MAIN ────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({
          antialias: true,

        const camera = new THREE.PerspectiveCamera(

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 10, 0);
        orbit.maxPolarAngle = PI * 0.48;
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        orbit.mouseButtons = {
          MIDDLE: THREE.MOUSE.ROTATE,
          RIGHT: THREE.MOUSE.PAN,
        };
        orbit.update();

        // ── LIGHTING ──
        const _sunDirResult = new THREE.Vector3();
        const _tmpSunVec = new THREE.Vector3();
        const _tmpSunV4 = new THREE.Vector4();
        const _tmpPineSunCol = new THREE.Vector3();
        const _tmpPineAmbCol = new THREE.Vector3();
        const _tmpPineHemiSky = new THREE.Vector3();
        const _tmpPineHemiGnd = new THREE.Vector3();
        const _tmpDrawBufSize = new THREE.Vector2();
        const _geminiUpdateOpts = { patchSize: 0, patchSizeMid: 0, patchSizeFar: 0, lodMidDistance: 0, lodFarDistance: 0, maxDistance: 0, lodEnabled: false, grassReceiveShadow: false };
        function sunDirectionFromAngles(azDeg, elDeg) {
          const az = (azDeg * PI) / 180,
            el = (elDeg * PI) / 180;
          return _sunDirResult.set(
            Math.cos(el) * Math.cos(az),
            Math.sin(el),
            Math.cos(el) * Math.sin(az),
          ).normalize();
        }
        const _sunDir = sunDirectionFromAngles(
          PARAMS.light.sunAzimuth,
          PARAMS.light.sunElevation,
        );
        const dirLight = new THREE.DirectionalLight(
          PARAMS.light.dirColor,
          PARAMS.light.dirIntensity,
        );
        dirLight.position.copy(_sunDir).multiplyScalar(600);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 300;
        dirLight.shadow.camera.left = dirLight.shadow.camera.bottom = -300;
        dirLight.shadow.camera.right = dirLight.shadow.camera.top = 300;
        dirLight.shadow.bias = PARAMS.shadowBias;
        dirLight.shadow.normalBias = PARAMS.shadowNormalBias;
        const csm = new CSMShadowNode(dirLight, {
          cascades: PARAMS.csm.cascades,
          maxFar: PARAMS.csm.maxFar,
          mode: "practical",
          lightMargin: PARAMS.csm.lightMargin,
        });
        // Far cascade at half resolution — sharpness imperceptible at distance
        if (csm.lights.length > 2) csm.lights[2].shadow.mapSize.set(1024, 1024);
        if (PARAMS.csm.enabled) dirLight.shadow.shadowNode = csm;

        function setCsmEnabled(on) {
