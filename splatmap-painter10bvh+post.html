          .catch(() =>
            console.warn(
              "pine2.glb not found — trees mode active but no model loaded",
            ),
          );

        // ── TREE LOD — slot-based chunk instancing ────────────────────────
        function _extractLODDefs(gltf) {
          const defs = [];
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((child) => {
            if (child.isMesh) {
              let mat = child.material;
              if (mat && (mat.transparent || mat.alphaTest > 0)) {
                mat = mat.clone();
                mat.transparent = false;
                mat.alphaTest = 0.5;
                mat.depthWrite = true;
              }
              defs.push({ geometry: child.geometry, material: mat, localMatrix: child.matrixWorld.clone() });
            }
          });
          return defs;
        }
        function _makeChunkIMs(defs) {
          return defs.map(({ geometry, material, localMatrix }) => {
            const im = new THREE.InstancedMesh(geometry, material, LOD_MAX_PER_CHUNK);
            im.count = 0;
            im.castShadow = true;
            im.receiveShadow = true;
            im.frustumCulled = false;
            scene.add(im);
            return { im, localMatrix };
          });
        }
        let _lodDirty = true;
        function _markLodDirty() {
          _lodDirty = true;
        }
        function _schedulePineImpostorBuild(slot) {
          if (
            slot.name !== "Pine" ||
            slot.pineImpostorBusy ||
            slot.pineImpostorApi ||
            slot.positions.length === 0
          )
            return;
          slot.pineImpostorBusy = true;
          createOctahedralImpostorForestWebgpu(renderer, dirLight, {
            modelPath: slot.modelPath,
            skipNearMeshes: true,
            fixedPlacements: slot.positions.slice(),
            impostorStandalone: true,
            treeScale: 1,
            lodDistance: lodParams.pineImpCrossfadeDist,
            centerPosition: [0, 0, 0],
            placementCapacity: Math.max(1024, slot.positions.length + 512),
            impostorSettings: {
              lod2Distance: 9999,
              fadeRange: lodParams.pineImpBlendWidth,
              textureSize: Math.max(
                256,
                Math.min(8192, Math.round(lodParams.pineAtlasTextureSize)),
              ),
              spritesPerSide: Math.max(
                2,
                Math.min(32, Math.round(lodParams.pineAtlasSpritesPerSide)),
              ),
              lightScale: lodParams.pineLightScale,
              normalStrength: lodParams.pineNormalStrength,
              rimStrength: lodParams.pineRimStrength,
              rimPower: lodParams.pineRimPower,
              diffuseWrap: lodParams.pineDiffuseWrap,
              parallaxStrength: lodParams.pineParallaxStrength,
              lodDither: lodParams.pineLodDither,
              edgeSmoothScale: lodParams.pineEdgeSmoothScale,
              alphaClamp: lodParams.pineAlphaClamp,
              fogEnabled: lodParams.pineFogEnabled,
              fogNear: lodParams.pineFogNear,
              fogFar: lodParams.pineFogFar,
              fogColor: new THREE.Color().set(lodParams.pineFogColor).getHex(),
              rimColor: new THREE.Color().set(lodParams.pineRimColor),
              /** false = bake trunk + foliage; true picks one mesh by volume (often leaves-only on pines) */
              bakeOnlyLargestMesh: false,
              fullOctahedral: lodParams.pineFullOctahedral,
              /** CSM / compare samplers break WGSL in this editor; no real-time shadow on billboards */
              skipShadow: true,
              /** Let scene.fogNode (height + distance TSL fog) affect impostor billboards */
              useSceneFog: true,
            },
          })
            .then((api) => {
              slot.pineImpostorBusy = false;
              slot.pineImpostorApi = api;
              scene.add(api.group);
              applyPineImpostorMaterialFromLodParams();
              applyLodTierVisibility();
              if (!api.rebuildPlacements(slot.positions)) {
                scene.remove(api.group);
                api.dispose();
                slot.pineImpostorApi = null;
                _schedulePineImpostorBuild(slot);
                return;
              }
              _markLodDirty();
            })
            .catch((err) => {
              slot.pineImpostorBusy = false;
              console.warn("[TREE LOD] Pine impostor bake failed:", err);
            });
        }
        function _rebakePineImpostorAtlas() {
          const slot = LOD_SLOTS[0];
          if (!slot || slot.name !== "Pine") return;
          if (slot.pineImpostorApi) {
            scene.remove(slot.pineImpostorApi.group);
            slot.pineImpostorApi.dispose();
            slot.pineImpostorApi = null;
          }
          slot.pineImpostorBusy = false;
          _markLodDirty();
          if (slot.positions.length > 0) _schedulePineImpostorBuild(slot);
        }
        _rebuildLODChunks = function(slot) {
          _markLodDirty();
          if (!slot || !slot.ready) return;
          const byChunk = new Map();
          slot.positions.forEach(pos => {
            const key = `${Math.floor(pos.x / LOD_CHUNK_SIZE)},${Math.floor(pos.z / LOD_CHUNK_SIZE)}`;
            if (!byChunk.has(key)) byChunk.set(key, []);
            byChunk.get(key).push(pos);
          });
          // Remove dead chunks
          for (const key of [...slot.chunks.keys()]) {
            if (!byChunk.has(key)) {
              const c = slot.chunks.get(key);
              c.lod0ims.forEach(g => scene.remove(g.im));
              if (c.lod1ims) c.lod1ims.forEach(g => scene.remove(g.im));
              slot.chunks.delete(key);
            }
          }
          // Update / create chunks
          for (const [key, positions] of byChunk) {
            let chunk = slot.chunks.get(key);
            if (!chunk) {
              chunk = {
                positions: [],
                sphere: new THREE.Sphere(),
                lod0ims: _makeChunkIMs(slot.lod0Defs),
                lod1ims: slot.lod1Defs ? _makeChunkIMs(slot.lod1Defs) : null,
              };
              slot.chunks.set(key, chunk);
            }
            chunk.positions = positions;
            let cx = 0, cy = 0, cz = 0;
            positions.forEach(p => { cx += p.x; cy += p.y; cz += p.z; });
            cx /= positions.length; cy /= positions.length; cz /= positions.length;
            let r = 0;
            positions.forEach(p => { const d = Math.sqrt((p.x-cx)**2+(p.y-cy)**2+(p.z-cz)**2); if (d > r) r = d; });
            chunk.sphere.set(new THREE.Vector3(cx, cy, cz), r + 20);
          }
          slot.positions.forEach((p, i) => { p._lodIdx = i; });
          if (slot.name === "Pine") {
            if (
              slot.pineImpostorApi &&
              slot.positions.length > slot.pineImpostorApi.capacity
            ) {
              scene.remove(slot.pineImpostorApi.group);
              slot.pineImpostorApi.dispose();
              slot.pineImpostorApi = null;
            }
            _schedulePineImpostorBuild(slot);
            if (slot.pineImpostorApi) {
              slot.pineImpostorApi.rebuildPlacements(slot.positions);
            }
          }
          applyLodTierVisibility();
        };
        function _tryBuildSlot(slot) {
          if (!slot.lod0Defs) return;
          slot.ready = true;
          _rebuildLODChunks(slot); // apply positions loaded before model
        }
        // Load models for all slots that have a modelPath
        LOD_SLOTS.forEach(slot => {
          if (!slot.modelPath) return;
          gltfLoader.load(slot.modelPath, (g) => {
            slot.lod0Defs = _extractLODDefs(g);
            if (slot.lod1Path) {
              gltfLoader.load(slot.lod1Path, (g2) => { slot.lod1Defs = _extractLODDefs(g2); _tryBuildSlot(slot); });
            } else {
              _tryBuildSlot(slot);
            }
          });
        });

        // ── FOLIAGE SYSTEMS ──
        FOLIAGE_SLOTS.forEach((slot) => {
          slot.system = createFoliageSlot(scene, bvhHeight, slot.wind || null);
          slot.system.setCastShadow(slot.castShadow);
          if (slot.modelPath) {
            gltfLoader
              .loadAsync(slot.modelPath)
              .then((gltf) => {
                slot.system.setModel(gltf);
              })
              .catch(() =>
                console.warn(
                  `Foliage: ${slot.modelPath} not found — slot active but no model`,
                ),
              );
          }
        });

        // ── OBJECT SYSTEMS ──
        OBJECT_SLOTS.forEach((slot) => {
          slot.system = createFoliageSlot(scene, bvhHeight);
          slot.system.setCastShadow(slot.castShadow);
          if (slot.modelPath) {
            gltfLoader.loadAsync(slot.modelPath).then((gltf) => {
              slot.system.setModel(gltf);
            }).catch(() => console.warn(`Objects: ${slot.modelPath} not found — slot active but no model`));
          }
        });

        // ── FTREE INIT ──
        // Auto-fetch preset files: tree-presets/slot1.json … slot6.json
        FTREE_SLOTS.forEach((slot, i) => {
          fetch(`tree-presets/${slot.presetFile}`)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
              slot.clusterPreset = data;
              slot.leafTexPath = data.leafTexFile
                ? `textures/leaves/${data.leafTexFile}`
                : "textures/leaves/foliage_alpha3.png";
              _ftreeBuildLeafMat(slot);
              _ftreeLoadLeafTex(slot);
              if (slot.positions.length > 0) _ftreeRebuildLeaves(slot);
              console.log(`FTree slot ${i + 1} (${slot.name}): preset loaded`);
            })
            .catch(() => { /* silent — slot stays empty until preset file is saved */ });
        });

        // Real _ftreeRebuildLeaves — needs scene in scope
        _ftreeRebuildLeaves = function(slot) {
          if (slot.leafMesh) {
            scene.remove(slot.leafMesh);
            slot.leafMesh.geometry.dispose();
            slot.leafMesh = null;
          }
          if (!slot.leafMat || !slot.clusterPreset || slot.positions.length === 0) return;
          const localLeaves = _ftreeSampleClusters(slot.clusterPreset);
          if (localLeaves.length === 0) return;
          // Bush presets: shift leaves down so bottom of cluster sits at ground
          let yGroundShift = 0;
          if (slot.clusterPreset.bushMode) {
            const minLy = Math.min(...localLeaves.map(l => l.ly));
            yGroundShift = -Math.max(0, minLy);
          }
          const n = slot.positions.length * localLeaves.length;
          // Update Y range for gradient uniform
          let yMin = Infinity, yMax = -Infinity;
          slot.positions.forEach(p => {
            localLeaves.forEach(l => {
              const wy = p.y + (l.ly + yGroundShift) * p.scale;
              if (wy < yMin) yMin = wy;
              if (wy > yMax) yMax = wy;
            });
          });
          if (slot.uniforms) { slot.uniforms.yMin.value = yMin - 0.3; slot.uniforms.yMax.value = yMax + 0.5; }
          const geo      = new THREE.PlaneGeometry(1, 1);
          const randData = new Float32Array(n * 2);
          for (let i = 0; i < n; i++) { randData[i*2] = Math.random(); randData[i*2+1] = Math.random(); }
          geo.setAttribute("aRand", new THREE.InstancedBufferAttribute(randData, 2));
          const mesh = new THREE.InstancedMesh(geo, slot.leafMat, n);
          mesh.frustumCulled = false;
          mesh.castShadow    = true;
          mesh.receiveShadow = false;
          const dummy   = new THREE.Object3D();
          const DEG2RAD = Math.PI / 180;
          let idx = 0;
          slot.positions.forEach(p => {
            localLeaves.forEach(l => {
              dummy.position.set(p.x + l.lx * p.scale, p.y + (l.ly + yGroundShift) * p.scale, p.z + l.lz * p.scale);
              dummy.rotation.order = "YXZ";
              dummy.rotation.y = Math.random() * Math.PI * 2;
              dummy.rotation.x = (Math.random() - 0.5) * l.tiltMax * DEG2RAD * 2;
              dummy.rotation.z = (Math.random() - 0.5) * l.tiltMax * DEG2RAD * 2;
              const s = Math.max(0.05, l.leafSize * p.scale * (1 + (Math.random() - 0.5) * 2 * l.scaleVar));
              dummy.scale.setScalar(s);
              dummy.updateMatrix();
              mesh.setMatrixAt(idx++, dummy.matrix);
            });
          });
          mesh.instanceMatrix.needsUpdate = true;
          scene.add(mesh);
          slot.leafMesh = mesh;
        };

        // Real _rebuildFTreeChunks — needs scene + _makeChunkIMs in scope
        _rebuildFTreeChunks = function(slot) {
          _markFtreeDirty();
          if (!slot || !slot.ready || !slot.trunkDefs) return;
          const byChunk = new Map();
          slot.positions.forEach(pos => {
            const key = `${Math.floor(pos.x / FTREE_CHUNK_SIZE)},${Math.floor(pos.z / FTREE_CHUNK_SIZE)}`;
            if (!byChunk.has(key)) byChunk.set(key, []);
            byChunk.get(key).push(pos);
          });
          for (const key of [...slot.chunks.keys()]) {
            if (!byChunk.has(key)) {
              slot.chunks.get(key).ims.forEach(g => scene.remove(g.im));
              slot.chunks.delete(key);
            }
          }
          for (const [key, positions] of byChunk) {
            let chunk = slot.chunks.get(key);
            if (!chunk) {
              chunk = { positions: [], sphere: new THREE.Sphere(), ims: _makeChunkIMs(slot.trunkDefs) };
              slot.chunks.set(key, chunk);
            }
            chunk.positions = positions;
            let cx = 0, cy = 0, cz = 0;
            positions.forEach(p => { cx += p.x; cy += p.y; cz += p.z; });
            cx /= positions.length; cy /= positions.length; cz /= positions.length;
            let r = 0;
            positions.forEach(p => { const d = Math.sqrt((p.x-cx)**2+(p.y-cy)**2+(p.z-cz)**2); if (d > r) r = d; });
            chunk.sphere.set(new THREE.Vector3(cx, cy, cz), r + 20);
          }
        };

        // Load leaf texture from path if specified
        function _ftreeLoadLeafTex(slot) {
          if (!slot.leafTexPath || !slot.leafMapNode) return;
          new THREE.TextureLoader().load(slot.leafTexPath, tex => {
            tex.colorSpace        = THREE.SRGBColorSpace;
            tex.generateMipmaps   = true;
            tex.minFilter         = THREE.LinearMipmapLinearFilter;
            tex.magFilter         = THREE.LinearFilter;
            tex.anisotropy        = renderer.capabilities?.maxAnisotropy ?? 8;
            tex.needsUpdate       = true;
            slot.leafMapNode.value = tex;
          });
        }

        // Load trunk GLBs
        FTREE_SLOTS.forEach(slot => {
          if (!slot.trunkPath) {
            slot.ready = true; // bush / no trunk — ready immediately
            return;
          }
          gltfLoader.load(slot.trunkPath, g => {
            slot.trunkDefs = _extractLODDefs(g);
            slot.ready = true;
            _rebuildFTreeChunks(slot);
            _ftreeRebuildLeaves(slot);
          }, undefined, () => {
            console.warn(`FTree: ${slot.trunkPath} not found — leaves only`);
            slot.ready = true;
            _ftreeRebuildLeaves(slot);
          });
          _ftreeLoadLeafTex(slot);
        });

        // ── TRANSFORM CONTROLS ──
        transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.addEventListener("dragging-changed", (e) => {
          orbit.enabled = e.value ? false : currentMode !== "play";
          // On drag end in cliffs mode: refresh panel sliders to match final position
          if (!e.value && currentMode === "cliffs") {
            ciRefreshProxy();
            pane.refresh();
          }
        });
        transformControls.addEventListener("change", () => {
          if (currentMode === "cliffs" && cliffInstancer.hasSelection()) {
            cliffInstancer.syncFromProxy();
          }
        });
        transformControls.enabled = false;
        tcHelper = transformControls.getHelper();
        tcHelper.visible = false;
        scene.add(tcHelper);

        // ── CLIFF HELPERS ──
        function getCliffRoot(object) {
          let obj = object;
          while (obj) {
            if (cliffObjects.includes(obj)) return obj;
            obj = obj.parent;
          }
          return null;
        }

        function selectCliff(root) {
          selectedCliff = root;
          if (root) {
            tcHelper.visible = true;
            transformControls.attach(root);
          } else {
            tcHelper.visible = false;
            transformControls.detach();
          }
        }

        function placeCliff(wx, wy, wz, modelIndex) {
          const root = cliffTemplates[modelIndex].clone();
          root.position.set(wx, wy - cliffSinkOffset, wz);
          root.userData.modelIndex = modelIndex;
          root.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });
          scene.add(root);
          cliffObjects.push(root);
          selectCliff(root);
          if (bakeBVH) bakeBVH();
        }

        function applyCliffs(data) {
          cliffObjects.forEach((r) => scene.remove(r));
          cliffObjects = [];
          selectCliff(null);
          data.forEach((d) => {
            const idx = Math.max(
              0,
              Math.min(cliffTemplates.length - 1, d.modelIndex ?? 0),
            );
            const root = cliffTemplates[idx].clone();
            root.position.set(d.x, d.y, d.z);
            root.rotation.set(d.rx, d.ry, d.rz);
            root.scale.set(d.sx, d.sy, d.sz);
            root.userData.modelIndex = idx;
            root.traverse((o) => {
              if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
              }
            });
            scene.add(root);
            cliffObjects.push(root);
          });
          if (bakeBVH) bakeBVH();
        }

        function loadCliffs(file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              applyCliffs(JSON.parse(ev.target.result));
            } catch (err) {
              console.error("Failed to load cliffs.json", err);
            }
          };
          reader.readAsText(file);
        }

        // ── PROPS FUNCTIONS ──────────────────────────────────────────────

        function getPropRoot(object) {
          let obj = object;
          while (obj) {
            if (propObjects.includes(obj)) return obj;
            obj = obj.parent;
          }
          return null;
        }

        function selectProp(root) {
          selectedProp = root;
          if (root) {
            tcHelper.visible = true;
            transformControls.attach(root);
          } else {
            tcHelper.visible = false;
            transformControls.detach();
          }
        }

        function placeProp(wx, wy, wz) {
          if (activePropIndex < 0 || activePropIndex >= propLibrary.length)
            return;
          const root = propLibrary[activePropIndex].scene.clone();
          root.position.set(wx, wy + PARAMS.propSinkOffset, wz);
          root.userData.propName = propLibrary[activePropIndex].name;
          root.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });
          scene.add(root);
          propObjects.push(root);
          selectProp(root);
        }

        function saveProps() {
          const data = propObjects.map((root) => ({
            propName: root.userData.propName ?? "unknown",
            x: root.position.x,
            y: root.position.y,
            z: root.position.z,
            rx: root.rotation.x,
            ry: root.rotation.y,
            rz: root.rotation.z,
            sx: root.scale.x,
            sy: root.scale.y,
            sz: root.scale.z,
          }));
          const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.download = "props.json";
          a.href = URL.createObjectURL(blob);
          a.click();
        }

        function applyProps(data) {
          propObjects.forEach((r) => scene.remove(r));
          propObjects = [];
          selectProp(null);
          data.forEach((d) => {
            const entry = propLibrary.find((e) => e.name === d.propName);
            if (!entry) {
              console.warn(
                `Props: model "${d.propName}" not in library — import it first`,
              );
              return;
            }
            const root = entry.scene.clone();
            root.position.set(d.x, d.y, d.z);
            root.rotation.set(d.rx, d.ry, d.rz);
            root.scale.set(d.sx, d.sy, d.sz);
            root.userData.propName = d.propName;
            root.traverse((o) => {
              if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
              }
            });
            scene.add(root);
            propObjects.push(root);
          });
        }

        function loadPropsJson(file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              applyProps(JSON.parse(ev.target.result));
            } catch (err) {
              console.error("Failed to load props.json", err);
            }
          };
          reader.readAsText(file);
        }

        // ── SCENE SAVE / LOAD (zip-based, lossless) ──────────────────────
        function _canvasToRawBin(canvas, ctx) {
          return ctx.getImageData(0, 0, canvas.width, canvas.height).data
            .buffer;
        }
        function _rawBinToCanvas(buffer, canvas, ctx, tex) {
          const loaded = new Uint8ClampedArray(buffer);
          const imgData = ctx.createImageData(canvas.width, canvas.height);
          imgData.data.set(loaded.subarray(0, imgData.data.length));
          ctx.putImageData(imgData, 0, 0);
          if (tex) tex.needsUpdate = true;
        }

        async function saveScene() {
          const zip = new JSZip();

          // Lossless binary blobs
          zip.file("heightmap.bin", heightData.buffer);
          zip.file("splatmap.bin", _canvasToRawBin(splatCanvas, splatCtx));
          zip.file(
            "grass-density.bin",
            _canvasToRawBin(grassDensityCanvas, grassDensityCtx),
          );
          zip.file("meadow.bin", _canvasToRawBin(meadowCanvas, meadowCtx));
          zip.file("cliff-grass-density.bin", _canvasToRawBin(cliffDensityCanvas, cliffDensityCtx));
          zip.file("gemini-grass-density.bin", _canvasToRawBin(geminiDensityCanvas, geminiDensityCtx));
          zip.file("gemini-cliff-grass-density.bin", _canvasToRawBin(geminiCliffDensityCanvas, geminiCliffDensityCtx));
          zip.file("flower-density.bin", _canvasToRawBin(flowerDensityCanvas, flowerDensityCtx));
          zip.file("img-splat.bin", imgSplatData.buffer);
          zip.file("barrier.bin", _canvasToRawBin(barrierCanvas, barrierCtx));

          // JSON for object positions (already lossless)
          const meta = {
            version: 2,
            trees: treeSystem ? treeSystem.getPositions() : [],
            fleurs: fleurSystem ? fleurSystem.getPositions() : [],
            ambientFX: ambientFXSystem ? ambientFXSystem.getEmitters() : [],
            lodSlots:   LOD_SLOTS.map(s   => ({ name: s.name, positions: s.positions })),
            ftreeSlots: FTREE_SLOTS.map(s  => ({ name: s.name, positions: s.positions })),
            foliage: FOLIAGE_SLOTS.map((s) => ({
              name: s.name,
              positions: s.system ? s.system.getPositions() : [],
            })),
            objects: OBJECT_SLOTS.map((s) => ({
              name: s.name,
              positions: s.system ? s.system.getPositions() : [],
            })),
            cliffs: cliffObjects.map((root) => ({
              modelIndex: root.userData.modelIndex ?? 0,
              x: root.position.x,
              y: root.position.y,
              z: root.position.z,
              rx: root.rotation.x,
              ry: root.rotation.y,
              rz: root.rotation.z,
              sx: root.scale.x,
              sy: root.scale.y,
              sz: root.scale.z,
            })),
            props: propObjects.map((root) => ({
              propName: root.userData.propName ?? "unknown",
              x: root.position.x,
              y: root.position.y,
              z: root.position.z,
              rx: root.rotation.x,
              ry: root.rotation.y,
              rz: root.rotation.z,
              sx: root.scale.x,
              sy: root.scale.y,
              sz: root.scale.z,
            })),
            cliffInstances: cliffInstancer.exportData(),
            waterfalls: waterfallObjects.map(m => ({ x:m.position.x, y:m.position.y, z:m.position.z, rx:m.rotation.x, ry:m.rotation.y, rz:m.rotation.z, sx:m.scale.x, sy:m.scale.y, sz:m.scale.z })),
            glowOrbs: glowOrbPositions,
            riverPoints: riverPoints.map(p => ({ x:p.x, y:p.y, z:p.z })),
            splinePoints: splinePoints.map(p => ({ x:p.x, y:p.y, z:p.z })),
            waterBodies: waterObjects.map((m) => ({
              x: m.position.x,
              y: m.position.y,
              z: m.position.z,
              rx: m.rotation.x,
              ry: m.rotation.y,
              rz: m.rotation.z,
              sx: m.scale.x,
              sy: m.scale.y,
              sz: m.scale.z,
            })),
            settings: {
              light:           JSON.parse(JSON.stringify(PARAMS.light)),
              sky:             JSON.parse(JSON.stringify(PARAMS.sky)),
              skyMode:         skyMode,
              ocean:           JSON.parse(JSON.stringify(PARAMS.ocean)),
              fog:             JSON.parse(JSON.stringify(PARAMS.fog)),
              slopeStart:      PARAMS.slopeStart,
              slopeEnd:        PARAMS.slopeEnd,
              shadowBias:      PARAMS.shadowBias,
              shadowNormalBias: PARAMS.shadowNormalBias,
              csm:             JSON.parse(JSON.stringify(PARAMS.csm)),
              postFx:          JSON.parse(JSON.stringify(postParams)),
              river:           JSON.parse(JSON.stringify(PARAMS.river)),
              spline:          JSON.parse(JSON.stringify(PARAMS.spline)),
              paintFbm:        JSON.parse(JSON.stringify(PARAMS.paintFbm)),
              paintScatter:    JSON.parse(JSON.stringify(PARAMS.paintScatter)),
              brushSize:       PARAMS.brushSize,
              brushStrength:   PARAMS.brushStrength,
              paintBrush:      PARAMS.paintBrush,
              brushFalloff:    PARAMS.brushFalloff,
              sculptBrush:     PARAMS.sculptBrush,
            },
          };
          zip.file("scene.json", JSON.stringify(meta, null, 2));

          const blob = await zip.generateAsync({
            type: "blob",
            compression: "DEFLATE",
          });
          const a = document.createElement("a");
          a.download = "scene.zip";
          a.href = URL.createObjectURL(blob);
          a.click();
        }

        async function loadScene(file) {
          try {
            const zip = await JSZip.loadAsync(file);

            // Heightmap
            const hmFile = zip.file("heightmap.bin");
            if (hmFile) {
              const buf = await hmFile.async("arraybuffer");
              const loaded = new Float32Array(buf);
              heightData.set(loaded.subarray(0, heightData.length));
              syncGeometry();
              syncHeightmapPreview();
              if (bakeBVH) bakeBVH();
              if (treeSystem) treeSystem.syncHeights();
              syncLODHeights();
              syncFTreeHeights();
              FOLIAGE_SLOTS.forEach((s) => {
                if (s.system) s.system.syncHeights();
              });
              OBJECT_SLOTS.forEach((s) => {
                if (s.system) s.system.syncHeights();
              });
              if (fleurSystem) fleurSystem.syncHeights();
              if (ambientFXSystem) ambientFXSystem.syncHeights();
            }

            // Canvases
            const splatFile = zip.file("splatmap.bin");
            if (splatFile) {
              _rawBinToCanvas(
                await splatFile.async("arraybuffer"),
                splatCanvas,
                splatCtx,
                splatTex,
              );
              syncPreview();
            }
            const grassFile = zip.file("grass-density.bin");
            if (grassFile)
              _rawBinToCanvas(
                await grassFile.async("arraybuffer"),
                grassDensityCanvas,
                grassDensityCtx,
                grassDensityTex,
              );

            const meadowFile = zip.file("meadow.bin");
            if (meadowFile)
              _rawBinToCanvas(
                await meadowFile.async("arraybuffer"),
                meadowCanvas,
                meadowCtx,
                meadowDensityTex,
              );
            const cliffGrassDensityFile = zip.file("cliff-grass-density.bin");
            if (cliffGrassDensityFile)
              _rawBinToCanvas(
                await cliffGrassDensityFile.async("arraybuffer"),
                cliffDensityCanvas,
                cliffDensityCtx,
                cliffDensityTex,
              );
            const geminiGrassDensityFile = zip.file("gemini-grass-density.bin");
            if (geminiGrassDensityFile)
              _rawBinToCanvas(
                await geminiGrassDensityFile.async("arraybuffer"),
                geminiDensityCanvas,
                geminiDensityCtx,
                geminiDensityTex,
              );
            const geminiCliffGrassDensityFile = zip.file("gemini-cliff-grass-density.bin");
            if (geminiCliffGrassDensityFile)
              _rawBinToCanvas(
                await geminiCliffGrassDensityFile.async("arraybuffer"),
                geminiCliffDensityCanvas,
                geminiCliffDensityCtx,
                geminiCliffDensityTex,
              );
            const flowerDensityFile = zip.file("flower-density.bin");
            if (flowerDensityFile)
              _rawBinToCanvas(
                await flowerDensityFile.async("arraybuffer"),
                flowerDensityCanvas,
                flowerDensityCtx,
                flowerDensityTex,
              );
            const imgSplatFile = zip.file("img-splat.bin");
            if (imgSplatFile) {
              imgSplatData.set(
                new Uint8Array(await imgSplatFile.async("arraybuffer")),
              );
              if (imgSplatTex) imgSplatTex.needsUpdate = true;
            }
            const barrierFile = zip.file("barrier.bin");
            if (barrierFile) {
              _rawBinToCanvas(
                await barrierFile.async("arraybuffer"),
                barrierCanvas,
                barrierCtx,
                barrierTex,
              );
              invalidateBarrierCache();
            }

            // Object positions
            const metaFile = zip.file("scene.json");
            if (metaFile) {
              const meta = JSON.parse(await metaFile.async("string"));
              if (meta.trees  && treeSystem)  treeSystem.setPositions(meta.trees);
              if (meta.fleurs && fleurSystem) fleurSystem.setPositions(meta.fleurs);
              if (meta.ambientFX && ambientFXSystem) ambientFXSystem.setEmitters(meta.ambientFX);
              if (meta.lodSlots) {
                meta.lodSlots.forEach((saved, i) => {
                  if (i < LOD_SLOTS.length) {
                    LOD_SLOTS[i].positions = saved.positions || [];
                    _rebuildLODChunks(LOD_SLOTS[i]);
                  }
                });
              }
              if (meta.ftreeSlots) {
                meta.ftreeSlots.forEach((saved, i) => {
                  if (i < FTREE_SLOTS.length) {
                    FTREE_SLOTS[i].positions = saved.positions || [];
                    _rebuildFTreeChunks(FTREE_SLOTS[i]);
                    _ftreeRebuildLeaves(FTREE_SLOTS[i]);
                  }
                });
              }
              if (meta.foliage) {
                meta.foliage.forEach((fd, idx) => {
                  if (
                    idx < FOLIAGE_SLOTS.length &&
                    FOLIAGE_SLOTS[idx].system &&
                    fd.positions
                  )
                    FOLIAGE_SLOTS[idx].system.setPositions(fd.positions);
                });
              }
              if (meta.objects) {
                meta.objects.forEach((od, idx) => {
                  if (idx < OBJECT_SLOTS.length && OBJECT_SLOTS[idx].system && od.positions)
                    OBJECT_SLOTS[idx].system.setPositions(od.positions);
                });
              }
              if (meta.cliffs) applyCliffs(meta.cliffs);
              if (meta.cliffInstances) cliffInstancer.importData(meta.cliffInstances);
              if (meta.props) applyProps(meta.props);
              if (meta.waterBodies) applyWaterBodies(meta.waterBodies);
              if (meta.waterfalls) applyWaterfalls(meta.waterfalls);
              if (meta.glowOrbs) {
                glowOrbPositions = meta.glowOrbs;
                _rebuildGlowOrbs();
              }
              if (meta.riverPoints) {
                riverPoints = meta.riverPoints.map(p => new THREE.Vector3(p.x, p.y, p.z));
                riverSelectedIdx = -1;
                riverRebuildVisual();
                if (riverPoints.length >= 2) riverGenerate();
              }
              if (meta.splinePoints) {
                splinePoints = meta.splinePoints.map(p => new THREE.Vector3(p.x, p.y, p.z));
                splineSelectedIdx = -1;
                splineRebuildVisual();
              }
              if (meta.settings) {
                const s = meta.settings;
                if (s.light)  Object.assign(PARAMS.light, s.light);
                if (s.sky)    Object.assign(PARAMS.sky, s.sky);
                if (s.ocean) {
                  Object.assign(PARAMS.ocean, s.ocean);
                  syncOceanMat();
                  setWaterStyle(PARAMS.ocean.stylized);
                }
                if (s.fog) {
                  Object.assign(PARAMS.fog.height,   s.fog.height   ?? {});
                  Object.assign(PARAMS.fog.distance, s.fog.distance ?? {});
                  syncFog();
                }
                if (s.slopeStart != null) { PARAMS.slopeStart = s.slopeStart; uSlopeStart.value = s.slopeStart; }
                if (s.slopeEnd   != null) { PARAMS.slopeEnd   = s.slopeEnd;   uSlopeEnd.value   = s.slopeEnd; }
                if (s.shadowBias      != null) PARAMS.shadowBias      = s.shadowBias;
                if (s.shadowNormalBias != null) PARAMS.shadowNormalBias = s.shadowNormalBias;
                if (s.csm) Object.assign(PARAMS.csm, s.csm);
                if (s.postFx) {
                  postParams.enabled = s.postFx.enabled ?? postParams.enabled;
                  if (s.postFx.bloom)     Object.assign(postParams.bloom,     s.postFx.bloom);
                  if (s.postFx.lensflare) Object.assign(postParams.lensflare, s.postFx.lensflare);
                  if (s.postFx.godRays)   Object.assign(postParams.godRays,   s.postFx.godRays);
                  if (s.postFx.dof)       Object.assign(postParams.dof,       s.postFx.dof);
                  if (s.postFx.gtao)      Object.assign(postParams.gtao,      s.postFx.gtao);
                }
                if (s.skyMode) setSkyMode(s.skyMode);
                if (s.river)  Object.assign(PARAMS.river,  s.river);
                if (s.spline) Object.assign(PARAMS.spline, s.spline);
                if (s.paintFbm)
                  Object.assign(PARAMS.paintFbm, s.paintFbm);
                if (s.paintScatter)
                  Object.assign(PARAMS.paintScatter, s.paintScatter);
                if (s.brushSize != null) {
                  PARAMS.brushSize = s.brushSize;
                  brushSize = s.brushSize;
                }
                if (s.brushStrength != null) {
                  PARAMS.brushStrength = s.brushStrength;
                  brushStr = s.brushStrength;
                }
                if (s.paintBrush != null) PARAMS.paintBrush = s.paintBrush;
                if (s.brushFalloff != null) PARAMS.brushFalloff = s.brushFalloff;
                if (s.sculptBrush != null) PARAMS.sculptBrush = s.sculptBrush;
                pane.refresh();
              }
              if (bakeBVH) bakeBVH();
            }
          } catch (err) {
            console.error("Failed to load scene.zip", err);
          }
        }

        // ── BRUSH RING ──
        const brushRingGeo = new THREE.RingGeometry(1, 1.06, 48);
        brushRingGeo.rotateX(-PI / 2);
        const brushRing = new THREE.Mesh(
          brushRingGeo,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            side: THREE.DoubleSide,
            depthWrite: false,
            transparent: true,
            opacity: 0.9,
          }),
        );
        brushRing.visible = false;
        brushRing.renderOrder = 2;
        scene.add(brushRing);

        // ── RAMP POINT-A MARKER ──
        const rampMarker = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 10, 8),
          new THREE.MeshBasicMaterial({ color: 0xff6600, depthTest: false })
        );
        rampMarker.visible = false;
        rampMarker.renderOrder = 999;
        scene.add(rampMarker);

        // ── SPLINE VISUALIZATION ──
        splineGroup = new THREE.Group();
        scene.add(splineGroup);
        // ── RIVER VISUALIZATION ──
        riverGroup = new THREE.Group();
        scene.add(riverGroup);
        const splinePreviewGroup = new THREE.Group();
        scene.add(splinePreviewGroup);

        // ── SPLINE TRAIN (debug follower) ──
        const trainMesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 0.8, 2.4),
          new THREE.MeshBasicMaterial({ color: 0xff2200, depthTest: true })
        );
        trainMesh.visible = false;
        scene.add(trainMesh);

        // ── PLAY MODE CAPSULE ──
        const capsuleGeo = new THREE.CapsuleGeometry(
          PLAYER_CAP_R,
          PLAYER_CAP_H,
          4,
          8,
        );
        const capsuleMat = new THREE.MeshStandardMaterial({
          color: 0xff6633,
          roughness: 0.7,
        });
        const capsuleMesh = new THREE.Mesh(capsuleGeo, capsuleMat);
        capsuleMesh.castShadow = true;
        capsuleMesh.visible = false;
        scene.add(capsuleMesh);

        function enterPlayMode() {
          savedCamPos = camera.position.clone();
          savedOrbitTarget = orbit.target.clone();
          // Spawn at orbit target, snapped to terrain
          playerPos.set(orbit.target.x, 0, orbit.target.z);
          playerPos.y = bvhHeight(playerPos.x, playerPos.z);
          camYaw = 0;
          camPitch = 0.35;
          _camCurrentDist = playParams.camDist;
          capsuleMesh.visible = true;
          orbit.enabled = false;
          // Hide editor UI
          const tpEl = document.querySelector(".tp-dfwv");
          if (tpEl) tpEl.style.display = "none";
          document.getElementById("info").style.display = "none";
          document.getElementById("heightmap-preview").style.display = "none";
          document.getElementById("splatmap-preview").style.display = "none";
          document
            .querySelectorAll(".preview-label")
            .forEach((el) => (el.style.display = "none"));
          brushRing.visible = false;
          if (barrierOverlayMesh) barrierOverlayMesh.visible = false;
          renderer.domElement.requestPointerLock();
        }

        function exitPlayMode() {
          capsuleMesh.visible = false;
          if (savedCamPos) camera.position.copy(savedCamPos);
          if (savedOrbitTarget) orbit.target.copy(savedOrbitTarget);
          camera.lookAt(orbit.target);
          // Restore editor UI
          const tpEl = document.querySelector(".tp-dfwv");
          if (tpEl) tpEl.style.display = "";
          document.getElementById("info").style.display = "";
          document.getElementById("heightmap-preview").style.display = "";
          document.getElementById("splatmap-preview").style.display = "";
          document
            .querySelectorAll(".preview-label")
            .forEach((el) => (el.style.display = ""));
          if (document.pointerLockElement) document.exitPointerLock();
        }

        // Mouse look (pointer lock)
        document.addEventListener("mousemove", (e) => {
          if (currentMode !== "play" || !document.pointerLockElement) return;
          camYaw -= e.movementX * playParams.camSensX;
          camPitch += e.movementY * playParams.camSensY;
          camPitch = Math.max(0.05, Math.min(PI * 0.45, camPitch));
        });
        document.addEventListener("pointerlockchange", () => {
          if (!document.pointerLockElement && currentMode === "play")
            setMode("view");
        });

        // ── RAYCASTER ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ── CLIFF INSTANCER ──
        let cliffBlendMat = null;
        const ciTypeSelect = { index: 0 };
        cliffInstancer = createCliffInstancer(scene, { maxInstances: 500 });
        // Proxy for per-instance sliders
        const ciProxy = { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0, sx: 1, sy: 1, sz: 1 };
        let ciActiveLabel = "none";
        let ciCount = 0;
        let ciLastTypeCount = 0;
        let ciPaneBindings = null; // will hold refs to refresh

        function ciRefreshProxy() {
          const sel = cliffInstancer.getSelected();
          if (sel) {
            ciProxy.px = +sel.px.toFixed(2); ciProxy.py = +sel.py.toFixed(2); ciProxy.pz = +sel.pz.toFixed(2);
            ciProxy.rx = +sel.rx.toFixed(1); ciProxy.ry = +sel.ry.toFixed(1); ciProxy.rz = +sel.rz.toFixed(1);
            ciProxy.sx = +sel.sx.toFixed(3); ciProxy.sy = +sel.sy.toFixed(3); ciProxy.sz = +sel.sz.toFixed(3);
          }
          ciCount = cliffInstancer.getTotalCount();
          const types = cliffInstancer.getTypes();
          const active = types[cliffInstancer.getActiveTypeIdx()];
          ciActiveLabel = active ? `${active.name}  (${active.count} placed)` : "— none loaded —";
          ciTypeSelect.index = cliffInstancer.getActiveTypeIdx();
          if (typeof ciRebuildTypeSelector === "function" && types.length !== ciLastTypeCount) {
            ciLastTypeCount = types.length;
            ciRebuildTypeSelector();
          }
          if (ciPaneBindings) ciPaneBindings.pane.refresh();
        }

          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;

          raycaster.setFromCamera(mouse, camera);

          return hits.length > 0 ? hits[0].point : null;

          inp.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            new THREE.TextureLoader().load(url, (loaded) => {
              // slotTex is THREE.Texture(canvas) — safe to reassign image (not DataTexture)
              slotTex.image = loaded.image;
              slotTex.colorSpace = colorSpace;
              slotTex.wrapS = slotTex.wrapT = THREE.RepeatWrapping;
              slotTex.flipY = loaded.flipY;
              slotTex.needsUpdate = true;
              URL.revokeObjectURL(url);
              if (onDone) onDone();

          const name = filename.replace(/\.glb$/i, "");

            .loadAsync(url)
            .then((gltf) => {

              propActivePARAMS.name = name;
              PARAMS.activePropName = name;
              pane.refresh();

            .catch((err) => console.error(`Failed to load ${url}`, err));

        // TSL material: blend groundProc() on flat tops, triplanar rock on steep faces

        // Helper: get cliff paint UV (same world-space mapping as terrain splatmap)
        const getCBPaintUV = () =>
          positionWorld.xz.add(float(TERRAIN_SIZE * 0.5)).div(float(TERRAIN_SIZE));

        cliffBlendMat.colorNode = Fn(() => {
          // Ground layer — same procedural as terrain, with adjustable scale
          const ground = groundProc();

          // Rock layer — triplanar Rock028, with adjustable scale multiplier
          const cbRockScale = uRockScale.mul(uCBRockScaleMul);
          const rockUV_XZ = positionWorld.xz.mul(cbRockScale);
          const rockUV_XY = positionWorld.xy.mul(cbRockScale);
          const rockUV_ZY = positionWorld.zy.mul(cbRockScale);
          const triWRaw = normalWorld.abs().pow(uTriplanarSharp);
          const triW = triWRaw.div(triWRaw.x.add(triWRaw.y).add(triWRaw.z));
          const rawRock = texture(rock028ColorTex, rockUV_XZ).rgb.mul(triW.y)
            .add(texture(rock028ColorTex, rockUV_XY).rgb.mul(triW.z))
            .add(texture(rock028ColorTex, rockUV_ZY).rgb.mul(triW.x));
          const cRock = clamp(rawRock.sub(float(0.5)).mul(uRockContrast).add(float(0.5)), 0.0, 1.0);
          const rock = cRock.mul(uRockBrightness).mul(uRockTint);

          // Slope blend: normalWorld.y = 1 on flat tops, 0 on vertical faces
          const noiseOffset = mx_noise_float(positionWorld.xz.mul(uCBNoiseScale)).mul(uCBNoiseStr);
          const slopeVal = normalWorld.y.add(noiseOffset);
          const blend = smoothstep(uCBSlopeLow, uCBSlopeHigh, slopeVal);

          let col = mix(rock, ground, blend);

          // Cliff paint layer on top (separate canvas, independent from terrain splatmap)
          const cpaint = texture(cliffPaintTex, getCBPaintUV());
          // R channel = paint strength, paint applies the terrain procedural color as override
          const paintCol = groundProc();
          col = mix(col, paintCol, cpaint.r);

          return col;
        })();

        // Normal node: triplanar rock028 normal on steep, flat terrain normal on top
        cliffBlendMat.normalNode = (() => {
          const cbRockScaleN = uRockScale.mul(uCBRockScaleMul);
          const _nuvXZ = positionWorld.xz.mul(cbRockScaleN);
          const _nuvXY = positionWorld.xy.mul(cbRockScaleN);
          const _nuvZY = positionWorld.zy.mul(cbRockScaleN);
          const _ntWRaw = normalWorld.abs().pow(uTriplanarSharp);
          const _ntW = _ntWRaw.div(_ntWRaw.x.add(_ntWRaw.y).add(_ntWRaw.z));
          const rNrmBA_XZ = texture(rock028DataTex, _nuvXZ).ba;
          const rNrmBA_XY = texture(rock028DataTex, _nuvXY).ba;
          const rNrmBA_ZY = texture(rock028DataTex, _nuvZY).ba;
          const rNrmBA = rNrmBA_XZ.mul(_ntW.y).add(rNrmBA_XY.mul(_ntW.z)).add(rNrmBA_ZY.mul(_ntW.x));
          const rNrmVec = vec3(rNrmBA.x, rNrmBA.y, float(1.0));
          const noiseOffset2 = mx_noise_float(positionWorld.xz.mul(uCBNoiseScale)).mul(uCBNoiseStr);
          const blend2 = smoothstep(uCBSlopeLow, uCBSlopeHigh, normalWorld.y.add(noiseOffset2));
          const flatNm = vec3(0.5, 0.5, 1.0);
          return normalMap(mix(rNrmVec, flatNm, blend2));

        function selectDecal(obj) {
          selectedDecal = obj;

        function placeDecal(x, y, z) {
          if (!decalTexture) {
            console.warn("Load a PNG image first");
            return;
          }
          const geo = new THREE.PlaneGeometry(1, 1);
          geo.rotateX(-Math.PI / 2);
          const mat = new THREE.MeshBasicMaterial({
            map: decalTexture,
            transparent: true,
            alphaTest: 0.01,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -4,
            polygonOffsetUnits: -4,
            side: THREE.DoubleSide,
            opacity: PARAMS.decal.opacity,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y + PARAMS.decal.heightOffset, z);
          mesh.scale.set(4, 1, 4); // default 4×4 metres
          mesh.renderOrder = 3;
          mesh.userData.decalTextureUrl = decalTextureUrl;
          mesh.userData.isDecal = true;
          scene.add(mesh);
          decalObjects.push(mesh);
          selectDecal(mesh);
        }

        function loadDecalPng() {
          const inp = document.createElement("input");
          inp.type = "file";
          inp.accept = "image/*";
          inp.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              decalTextureUrl = ev.target.result;
              new THREE.TextureLoader().load(decalTextureUrl, (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                if (decalTexture) decalTexture.dispose();
                decalTexture = tex;
              });
            };
            reader.readAsDataURL(file);
          };
          inp.click();
        }

        function saveDecals() {
          const data = decalObjects.map((obj) => ({
            x: obj.position.x, y: obj.position.y, z: obj.position.z,
            rx: obj.rotation.x, ry: obj.rotation.y, rz: obj.rotation.z,
            sx: obj.scale.x, sy: obj.scale.y, sz: obj.scale.z,
            opacity: obj.material.opacity,
            textureUrl: obj.userData.decalTextureUrl,
          }));
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.download = "decals.json";
          a.href = URL.createObjectURL(blob);
          a.click();
        }

        function applyDecals(data) {
          data.forEach((item) => {
            new THREE.TextureLoader().load(item.textureUrl, (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              const geo = new THREE.PlaneGeometry(1, 1);
              geo.rotateX(-Math.PI / 2);
              const mat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                alphaTest: 0.01,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -4,
                polygonOffsetUnits: -4,
                side: THREE.DoubleSide,
                opacity: item.opacity ?? 1.0,
              });
              const mesh = new THREE.Mesh(geo, mat);
              mesh.position.set(item.x, item.y, item.z);
              mesh.rotation.set(item.rx, item.ry, item.rz);
              mesh.scale.set(item.sx, item.sy, item.sz);
              mesh.renderOrder = 3;
              mesh.userData.decalTextureUrl = item.textureUrl;
              mesh.userData.isDecal = true;
              scene.add(mesh);
              decalObjects.push(mesh);
            });
          });
        }

        function loadDecalsJson(file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            try { applyDecals(JSON.parse(ev.target.result)); }
            catch (err) { console.error("Failed to load decals.json", err); }
          };
          reader.readAsText(file);
        }

        function clearDecals() {
