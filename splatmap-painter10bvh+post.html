        function refitDecalToTerrain() {
          if (!selectedDecal) return;
          const mesh = selectedDecal;
          mesh.updateMatrixWorld(true);

          // Build subdivided geometry — 32×32 gives smooth draping
          const newGeo = new THREE.PlaneGeometry(1, 1, 32, 32);
          newGeo.rotateX(-Math.PI / 2); // lie flat

          const pos = newGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            // Local vertex → world space
            const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
            mesh.localToWorld(v);

            // Snap world Y to terrain + height offset
            v.y = sampleHeight(v.x, v.z) + PARAMS.decal.heightOffset;

            // World space → back to local
            mesh.worldToLocal(v);
            pos.setXYZ(i, v.x, v.y, v.z);
          }
          pos.needsUpdate = true;
          newGeo.computeVertexNormals();

          mesh.geometry.dispose();
          mesh.geometry = newGeo;
        }

        // ── SPLINE FUNCTIONS ──────────────────────────────────────────────
        function splineRebuildVisual() {
          // Dispose and remove old children
          while (splineGroup.children.length) {
            const child = splineGroup.children[0];
            splineGroup.remove(child);
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          }
          splinePointMeshes = [];
          _cachedTrainCurve = null;
          _cachedTrainLen = 0;
          if (splinePoints.length === 0) return;

          // Draw curve line if 2+ points
          if (splinePoints.length >= 2) {
            const curve = new THREE.CatmullRomCurve3(splinePoints, PARAMS.spline.closed, "catmullrom", 0.5);
            _cachedTrainCurve = curve;
            _cachedTrainLen = curve.getLength();
            const pts = curve.getPoints(Math.max(60, splinePoints.length * 20));
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({ color: 0x00ccff, depthTest: false });
            const line = new THREE.Line(geo, mat);
            line.renderOrder = 99;
            splineGroup.add(line);
          }

          // Draw control point spheres on top of line
          splinePoints.forEach((pt, i) => {
            const geo = new THREE.SphereGeometry(0.45, 8, 6);
            const mat = new THREE.MeshBasicMaterial({
              color: i === splineSelectedIdx ? 0xffff00 : 0xff4400,
              depthTest: false,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pt);
            mesh.renderOrder = 100;
            splineGroup.add(mesh);
            splinePointMeshes.push(mesh);
          });
        }

        function splineAddPoint(pos) {
          splinePoints.push(pos.clone());
          splineSelectedIdx = splinePoints.length - 1;
          splineRebuildVisual();
          splineUpdateSelectedYParam();
        }

        function splineMoveSelected(pos) {
          if (splineSelectedIdx < 0) return;
          const currentY = splinePoints[splineSelectedIdx].y;
          splinePoints[splineSelectedIdx].copy(pos);
          splinePoints[splineSelectedIdx].y = currentY; // preserve custom height
          splineRebuildVisual();
        }

        function splineUpdateSelectedYParam() {
          if (splineSelectedIdx >= 0 && splineSelectedIdx < splinePoints.length) {
            PARAMS.spline.selectedPointY = splinePoints[splineSelectedIdx].y;
          }
          pane.refresh();
        }

        function splineDeleteSelected() {
          if (splineSelectedIdx < 0 || splinePoints.length === 0) return;
          splinePoints.splice(splineSelectedIdx, 1);
          splineSelectedIdx = Math.min(splineSelectedIdx, splinePoints.length - 1);
          splineRebuildVisual();
          splineUpdateSelectedYParam();
        }

        function splineClearAll() {
          splinePoints = [];
          splineSelectedIdx = -1;
          splineDragging = false;
          splineRebuildVisual();
          splineClearPreview();
        }

        function splinePickPoint(e) {
          const rect = renderer.domElement.getBoundingClientRect();
          const mx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const my = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(new THREE.Vector2(mx, my), camera);
          const hits = raycaster.intersectObjects(splinePointMeshes, false);
          if (hits.length > 0) return splinePointMeshes.indexOf(hits[0].object);
          return -1;
        }

        function splineClearPreview() {
          while (splinePreviewGroup.children.length) {
            const child = splinePreviewGroup.children[0];
            splinePreviewGroup.remove(child);
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          }
        }

        function splineGetSamples() {
          if (splinePoints.length < 2) return [];
          const curve = new THREE.CatmullRomCurve3(splinePoints, PARAMS.spline.closed, "catmullrom", 0.5);
          const totalLength = curve.getLength();
          const count = Math.max(1, Math.floor(totalLength / PARAMS.spline.spacing));
          const samples = [];
          for (let i = 0; i <= count; i++) {
            const t = i / count;
            const pos = curve.getPoint(t);
            const tangent = curve.getTangent(t);
            const angleY = Math.atan2(tangent.x, tangent.z);
            samples.push({ pos, angleY });
          }
          return samples;
        }

        function splinePreview() {
          splineClearPreview();
          const samples = splineGetSamples();
          if (samples.length === 0) return;
          const geo = new THREE.SphereGeometry(0.35, 6, 4);
          const mat = new THREE.MeshBasicMaterial({ color: 0x00ff88, depthTest: false });
          samples.forEach(({ pos }) => {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pos.x, pos.y + 0.5, pos.z);
            mesh.renderOrder = 101;
            splinePreviewGroup.add(mesh);
          });
        }

        function splineBake() {
          const samples = splineGetSamples();
          if (samples.length === 0) return;
          const type = PARAMS.spline.objectType;
          const scaleRange = PARAMS.spline.scaleMax - PARAMS.spline.scaleMin;

          if (type === "trees" && treeSystem) {
            const existing = treeSystem.getPositions();
            samples.forEach(({ pos, angleY }) => {
              const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
              const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
              existing.push({ x: pos.x, z: pos.z, rot, scale });
            });
            treeSystem.setPositions(existing);
            if (treeSystem.syncHeights) treeSystem.syncHeights();
          } else if (type === "glorborbs") {
            samples.forEach(({ pos }) => {
              const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
              glowOrbPositions.push({ x: pos.x, y: pos.y + scale * 0.5, z: pos.z, scale });
            });
            _rebuildGlowOrbs();
          } else if (type.startsWith("foliage")) {
            const slotIdx = parseInt(type.replace("foliage", ""));
            const slot = FOLIAGE_SLOTS[slotIdx];
            if (slot && slot.system) {
              const existing = slot.system.getPositions();
              samples.forEach(({ pos, angleY }) => {
                const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
                const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
                existing.push({ x: pos.x, z: pos.z, rot, scale });
              });
              slot.system.setPositions(existing);
              if (slot.system.syncHeights) slot.system.syncHeights();
            }
          } else if (type.startsWith("object")) {
            const slotIdx = parseInt(type.replace("object", ""));
            const slot = OBJECT_SLOTS[slotIdx];
            if (slot && slot.system) {
              const existing = slot.system.getPositions();
              samples.forEach(({ pos, angleY }) => {
                const scale = PARAMS.spline.scaleMin + Math.random() * scaleRange;
                const rot = PARAMS.spline.alignToPath ? angleY : Math.random() * Math.PI * 2;
                existing.push({ x: pos.x, z: pos.z, rot, scale });
              });
              slot.system.setPositions(existing);
              if (slot.system.syncHeights) slot.system.syncHeights();
            }
          }

          splineClearPreview();
          splineClearAll();
          if (bakeBVH) bakeBVH();
        }

        function setMode(mode) {
          const leavingPlay = currentMode === "play" && mode !== "play";
          currentMode = mode;
          PARAMS.mode = mode;

          if (leavingPlay) exitPlayMode();

          if (mode === "play") {
            enterPlayMode();
            const badge = document.getElementById("mode-badge");
            badge.textContent = "PLAY MODE  [ F / Esc to exit ]";
            badge.className = "play";
            renderer.domElement.style.cursor = "none";
            return;
          }

          pane.refresh();
          orbit.enabled = mode !== "play";

          playFolder.hidden = mode !== "view";
          paintFolder.hidden = mode !== "paint";
          sculptFolder.hidden = mode !== "sculpt";
          placeFolder.hidden = mode !== "place";
          grassFolder.hidden = mode !== "grass";
          treesFolder.hidden = mode !== "trees";
          if (lodFolder)    lodFolder.hidden    = mode !== "pinelod";
          if (ftreeFolder)  ftreeFolder.hidden  = mode !== "ftrees";
          foliageFolder.hidden = mode !== "foliage";
          if (objectsFolder) objectsFolder.hidden = mode !== "objects";
          propsFolder.hidden = mode !== "props";
          pathFolder.hidden = mode !== "path";
          splineFolder.hidden = mode !== "spline";
          if (mode !== "spline") splineClearPreview();
          riverFolder.hidden = mode !== "river";
          decalFolder.hidden = mode !== "decal";
          waterFolder.hidden = mode !== "water";
          waterfallFolder.hidden = mode !== "waterfall";
          cliffsFolder.hidden = mode !== "cliffs";
          if (fleurFolder) fleurFolder.hidden = mode !== "fleurs";
          if (ambientFXFolder) ambientFXFolder.hidden = mode !== "ambientfx";
          if (ambientFXSystem) ambientFXSystem.setRingsVisible(mode === "ambientfx");
          geminiGrassFolder.hidden = mode !== "geminigrass";
          if (typeof geminiCliffGrassFolder !== "undefined") geminiCliffGrassFolder.hidden = mode !== "geminicliffgrass";
          cliffBlendFolder.hidden = mode !== "cliffblend";
          cliffPaintFolder.hidden = mode !== "cliffpaint";
          barrierFolder.hidden = mode !== "barrier";
          syncBarrierOverlayFromParams();
          brushFolder.hidden =
            mode === "view" ||
            mode === "place" ||
            mode === "props" ||
            mode === "water" ||
            mode === "waterfall" ||
            mode === "cliffs" ||
            mode === "spline" ||
            mode === "decal" ||
            mode === "cliffblend";

          const usingTC =
            mode === "place" || mode === "props" || mode === "water" || mode === "waterfall" || mode === "cliffs" || mode === "decal" || mode === "cliffblend";
          if (!usingTC && transformControls) {
            if (tcHelper) tcHelper.visible = false;
            transformControls.enabled = false;
            transformControls.detach();
            selectedCliff = null;
            selectedProp = null;
            selectWater(null);
            selectWaterfall(null);
            selectDecal(null);
            selectCliffBlend(null);
          } else if (usingTC && transformControls) {
            transformControls.enabled = true;
            if (mode === "place") {
              selectedProp = null;
              selectWater(null);
              selectWaterfall(null);
              selectDecal(null);
            }
            if (mode === "props") {
              selectedCliff = null;
              selectWater(null);
              selectWaterfall(null);
              selectDecal(null);
            }
            if (mode === "water") {
              selectedCliff = null;
              selectedProp = null;
              selectWaterfall(null);
              selectDecal(null);
            }
            if (mode === "waterfall") {
              selectedCliff = null;
              selectedProp = null;
              selectWater(null);
              selectDecal(null);
            }
            if (mode === "decal") {
              selectedCliff = null;
              selectedProp = null;
              selectWater(null);
              selectWaterfall(null);
              selectDecal(selectedDecal); // re-attach if already selected
            }
            if (mode === "cliffs") {
              selectedCliff = null;
              selectedProp = null;
              selectWater(null);
              selectWaterfall(null);
              selectDecal(null);
              selectCliffBlend(null);
              // Re-attach gizmo if an instance was already selected
              if (cliffInstancer.hasSelection()) {
                transformControls.attach(cliffInstancer.proxyObject);
                tcHelper.visible = true;
              } else {
                transformControls.detach();
                tcHelper.visible = false;
              }
            }
            if (mode === "cliffblend") {
              selectedCliff = null;
              selectedProp = null;
              selectWater(null);
              selectWaterfall(null);
              selectDecal(null);
              if (selectedCliffBlend) {
                transformControls.attach(selectedCliffBlend);
                tcHelper.visible = true;
              } else {
                transformControls.detach();
                tcHelper.visible = false;
              }
            }
          }

          const badge = document.getElementById("mode-badge");
          badge.textContent =
            mode === "view"
              ? "VIEW MODE"
              : mode === "paint"
                ? "PAINT MODE"
                : mode === "sculpt"
                  ? "SCULPT MODE"
                  : mode === "grass"
                    ? "GRASS MODE"
                    : mode === "trees"
                      ? "TREES MODE"
                        : mode === "foliage"
                        ? "FOLIAGE MODE  [ N ]"
                        : mode === "objects"
                        ? "OBJECTS MODE  [ E ]"
                        : mode === "props"
                          ? "PROPS MODE  [ I ]"
                          : mode === "water"
                            ? "WATER BODIES  [ W ]"
                            : mode === "path"
                              ? "PATH MODE  [ L ]"
                              : mode === "cliffs"
                                ? "CLIFFS MODE  [ C ]"
                                : mode === "cliffgrass"
                                  ? "CLIFF GRASS MODE"
                                  : mode === "spline"
                                    ? "SPLINE MODE  [ K ]"
                                    : mode === "decal"
                                      ? "DECAL MODE  [ D ]"
                                      : mode === "river"
                                        ? "RIVER MODE  [ V ]"
                                        : mode === "waterfall"
                                          ? "WATERFALL MODE  [ H ]"
                                          : mode === "pinelod"
                                            ? "TREE LOD  [ J ]"
                                            : mode === "ftrees"
                                              ? "FOLIAGE TREES  [ U ]"
                                              : mode === "ambientfx"
                                                ? "AMBIENT FX  [ X ]"
                                                : mode === "geminigrass"
                                                  ? "GEMINI GRASS MODE  [ G ]"
                                                  : mode === "geminicliffgrass"
                                                    ? "GEMINI CLIFF GRASS MODE"
                                                    : mode === "cliffblend"
                                                      ? "CLIFF BLEND TEST"
                                                      : mode === "cliffpaint"
                                                        ? "CLIFF PAINT"
                                                        : mode === "barrier"
                                                          ? "BARRIER MODE"
                                                          : "PLACE MODE"; // play handled above
          badge.className = mode;
          renderer.domElement.style.cursor =
            mode === "view" ? "default" : "crosshair";
          if (
            mode === "view" ||
            mode === "place" ||
            mode === "props" ||
            mode === "water" ||
            mode === "waterfall" ||
            mode === "cliffs" ||
            mode === "spline" ||
            mode === "river" ||
            mode === "decal" ||
            mode === "cliffblend"
          )
            brushRing.visible = false;
          else if (mode === "cliffgrass" || mode === "geminicliffgrass" || mode === "pinelod")
            brushRing.visible = true;
        }
        setMode("view");

        // ── KEYBOARD ──
        window.addEventListener("keyup", (e) => {
          keysHeld[e.code] = false;
        });

        window.addEventListener("keydown", (e) => {
          // Play mode: track WASD, only allow exit keys
          if (currentMode === "play") {
            keysHeld[e.code] = true;
            if (e.code.startsWith("Arrow")) e.preventDefault();
            if (e.code === "Escape" || e.code === "KeyF") setMode("view");
            return;
          }
          if (e.code === "KeyF") {
            setMode("play");
            return;
          }
          if (e.code === "KeyP")
            setMode(currentMode === "paint" ? "view" : "paint");
          if (e.code === "KeyS" && currentMode !== "place")
            setMode(currentMode === "sculpt" ? "view" : "sculpt");
          if (e.code === "KeyO")
            setMode(currentMode === "place" ? "view" : "place");
          if (e.code === "KeyG")
            setMode(currentMode === "geminigrass" ? "view" : "geminigrass");
          if (e.code === "KeyB")
            setMode(currentMode === "flowers" ? "view" : "flowers");
          if (e.code === "KeyM")
            setMode(currentMode === "fleurs" ? "view" : "fleurs");
          if (e.code === "KeyX")
            setMode(currentMode === "ambientfx" ? "view" : "ambientfx");
          if (e.code === "KeyT" && currentMode !== "water")
            setMode(currentMode === "trees" ? "view" : "trees");
          if (e.code === "KeyN")
            setMode(currentMode === "foliage" ? "view" : "foliage");
          if (e.code === "KeyE" && !["water","waterfall","cliffs","decal","place","props","cliffblend"].includes(currentMode))
            setMode(currentMode === "objects" ? "view" : "objects");
          if (e.code === "KeyJ")
            setMode(currentMode === "pinelod" ? "view" : "pinelod");
          if (currentMode === "pinelod" && e.code.match(/^Digit[1-6]$/)) {
            const idx = parseInt(e.code[5]) - 1;
            activeLodSlot = idx;
            const _s = LOD_SLOTS[idx];
            lodParams.slotName   = _s.name;
            lodParams.threshold  = _s.lodThreshold;
            lodParams.lodImpostorDist = _s.lodImpostorDist ?? 115;
            lodParams.lodMegaDist = _s.lodMegaDist ?? 220;
            lodParams.minSpacing = _s.minSpacing;
            lodParams.scaleMin   = _s.scaleMin;
            lodParams.scaleMax   = _s.scaleMax;
            lodParams.density        = _s.density;
            lodParams.treesPerStroke = _s.treesPerStroke;
            if (lodFolder) pane.refresh();
          }
          if (e.code === "KeyU")
            setMode(currentMode === "ftrees" ? "view" : "ftrees");
          if (currentMode === "ftrees" && e.code.match(/^Digit[1-6]$/)) {
            const idx = parseInt(e.code[5]) - 1;
            activeFTreeSlot = idx;
            const _s = FTREE_SLOTS[idx];
            ftreeParams.slotName       = _s.name;
            ftreeParams.threshold      = _s.lodThreshold;
            ftreeParams.minSpacing     = _s.minSpacing;
            ftreeParams.scaleMin       = _s.scaleMin;
            ftreeParams.scaleMax       = _s.scaleMax;
            ftreeParams.density        = _s.density;
            ftreeParams.treesPerStroke = _s.treesPerStroke;
            if (ftreeFolder) pane.refresh();
          }
          if (e.code === "KeyI")
            setMode(currentMode === "props" ? "view" : "props");
          if (e.code === "KeyL")
            setMode(currentMode === "path" ? "view" : "path");
          if (e.code === "KeyK")
            setMode(currentMode === "spline" ? "view" : "spline");
          if (e.code === "KeyV")
            setMode(currentMode === "river" ? "view" : "river");
          if (e.code === "KeyH")
            setMode(currentMode === "waterfall" ? "view" : "waterfall");
          if (e.code === "KeyD")
            setMode(currentMode === "decal" ? "view" : "decal");
          if (
            e.code === "KeyW" &&
            currentMode !== "place" &&
            currentMode !== "props" &&
            currentMode !== "cliffs" &&
            currentMode !== "decal" &&
            currentMode !== "water" &&
            currentMode !== "waterfall" &&
            currentMode !== "cliffblend"
          )
            setMode("water");
          else if (e.code === "KeyW" && currentMode === "water")
            setMode("view");
          if (e.code === "Escape") {
            if (rampPointA) { rampPointA = null; rampMarker.visible = false; }
            else if (currentMode === "spline" && splineSelectedIdx >= 0) { splineSelectedIdx = -1; splineRebuildVisual(); }
            else if (currentMode === "river" && riverSelectedIdx >= 0) { riverSelectedIdx = -1; riverRebuildVisual(); }
            else setMode("view");
          }
          if (e.code === "Backquote") toggleTerrainMat();
          if (e.code === "KeyC")
            setMode(currentMode === "cliffs" ? "view" : "cliffs");
          if (currentMode === "spline" && e.code === "Delete") splineDeleteSelected();
          if (currentMode === "river"  && e.code === "Delete") riverDeleteSelected();
          if (currentMode === "waterfall") {
            if (e.code === "KeyW") { e.preventDefault(); transformControls.setMode("translate"); }
            if (e.code === "KeyE") { e.preventDefault(); transformControls.setMode("rotate"); }
            if (e.code === "KeyR") { e.preventDefault(); transformControls.setMode("scale"); }
          }
          if (currentMode === "decal") {
            if (e.code === "KeyW") { e.preventDefault(); transformControls.setMode("translate"); }
            if (e.code === "KeyE") { e.preventDefault(); transformControls.setMode("rotate"); }
            if (e.code === "KeyR") { e.preventDefault(); transformControls.setMode("scale"); }
            if (e.code === "Delete" && selectedDecal) {
              scene.remove(selectedDecal);
              selectedDecal.geometry.dispose();
              selectedDecal.material.dispose();
              decalObjects = decalObjects.filter((d) => d !== selectedDecal);
              selectDecal(null);
            }
          }
          if (currentMode === "cliffs") {
            if (e.code === "KeyW") { e.preventDefault(); transformControls.setMode("translate"); }
            if (e.code === "KeyE") { e.preventDefault(); transformControls.setMode("rotate"); }
            if (e.code === "KeyR") { e.preventDefault(); transformControls.setMode("scale"); }
            if (e.code === "Delete") {
              cliffInstancer.deleteSelected();
              transformControls.detach();
              if (tcHelper) tcHelper.visible = false;
              ciRefreshProxy();
              pane.refresh();
            }
          }
          if (currentMode === "place") {
            if (e.code === "KeyW") {
              e.preventDefault();
              transformControls.setMode("translate");
            }
            if (e.code === "KeyE") {
              e.preventDefault();
              transformControls.setMode("rotate");
            }
            if (e.code === "KeyR") {
              e.preventDefault();
              transformControls.setMode("scale");
            }
            if (e.code === "Delete" && selectedCliff) {
              scene.remove(selectedCliff);
              cliffObjects = cliffObjects.filter((c) => c !== selectedCliff);
              selectCliff(null);
              if (bakeBVH) bakeBVH();
            }
          }
          if (currentMode === "props") {
            if (e.code === "KeyW") {
              e.preventDefault();
              transformControls.setMode("translate");
            }
            if (e.code === "KeyE") {
              e.preventDefault();
              transformControls.setMode("rotate");
            }
            if (e.code === "KeyR") {
              e.preventDefault();
              transformControls.setMode("scale");
            }
            if (e.code === "Delete" && selectedProp) {
              scene.remove(selectedProp);
              propObjects = propObjects.filter((p) => p !== selectedProp);
              selectProp(null);
            }
          }
          if (currentMode === "water") {
            if (e.code === "KeyE") {
              e.preventDefault();
              transformControls.setMode("translate");
            }
            if (e.code === "KeyR") {
              e.preventDefault();
              transformControls.setMode("rotate");
            }
            if (e.code === "KeyT") {
              e.preventDefault();
              transformControls.setMode("scale");
            }
            if (e.code === "Delete" && selectedWater) {
              scene.remove(selectedWater);
              waterObjects = waterObjects.filter((m) => m !== selectedWater);
              selectWater(null);
            }
            if (e.code === "Delete" && selectedWaterfall) {
              scene.remove(selectedWaterfall);
              waterfallObjects = waterfallObjects.filter(m => m !== selectedWaterfall);
              selectWaterfall(null);
            }
          }
          if (currentMode === "cliffblend") {
            if (e.code === "KeyW") { e.preventDefault(); transformControls.setMode("translate"); }
            if (e.code === "KeyE") { e.preventDefault(); transformControls.setMode("rotate"); }
            if (e.code === "KeyR") { e.preventDefault(); transformControls.setMode("scale"); }
            if (e.code === "Delete" && selectedCliffBlend) {
              scene.remove(selectedCliffBlend);
              const idx = cliffBlendObjects.indexOf(selectedCliffBlend);
              if (idx !== -1) cliffBlendObjects.splice(idx, 1);
              selectCliffBlend(null);
            }
          }
        });

        // ── MOUSE ──
        renderer.domElement.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          if (currentMode !== "cliffs") return;
          // Right click = select existing instance
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const ciHit = cliffInstancer.raycastInstances(raycaster);
          if (ciHit) {
            cliffInstancer.selectInstance(ciHit.typeIdx, ciHit.instIdx);
            transformControls.attach(cliffInstancer.proxyObject);
            tcHelper.visible = true;
            ciRefreshProxy();
            pane.refresh();
          } else {
            cliffInstancer.clearSelection();
            transformControls.detach();
            tcHelper.visible = false;
            ciRefreshProxy();
            pane.refresh();
          }
        });

        renderer.domElement.addEventListener("mousemove", (e) => {
          // Spline: drag selected point along terrain
          if (currentMode === "spline" && splineDragging && splineSelectedIdx >= 0) {
            const p = getTerrainHit(e);
            if (p) splineMoveSelected(p);
            return;
          }
          // River: drag selected point along terrain
          if (currentMode === "river" && riverDragging && riverSelectedIdx >= 0) {
            const p = getTerrainHit(e);
            if (p) riverMoveSelected(p);
            return;
          }
          if (
            currentMode === "view" ||
            currentMode === "play" ||
            currentMode === "place" ||
            currentMode === "props" ||
            currentMode === "water" ||
            currentMode === "cliffs" ||
            currentMode === "spline"
          )
            return;
          const p = getTerrainHit(e);
          updateBrushRing(p);
          if (!isMouseDown || !p) return;
          if (currentMode === "paint") paintAt(p.x, p.z);
          if (currentMode === "sculpt") sculptAt(p.x, p.z, e);
          if (currentMode === "path") pathPaintAt(p.x, p.z);
          if (currentMode === "grass")
            paintGrassAt(p.x, p.z, grassEraseMode || e.shiftKey);
          if (currentMode === "flowers")
            paintFlowersAt(p.x, p.z, flowerEraseMode || e.shiftKey);
          if (currentMode === "cliffgrass")
            paintCliffGrassAt(p.x, p.z, cliffGrassEraseMode || e.shiftKey);
          if (currentMode === "geminigrass")
            paintGeminiGrassAt(p.x, p.z, geminiGrassEraseMode || e.shiftKey);
          if (currentMode === "geminicliffgrass")
            paintGeminiCliffGrassAt(p.x, p.z, geminiCliffGrassEraseMode || e.shiftKey);
          if (currentMode === "trees")
            paintTreesAt(p.x, p.z, treeEraseMode || e.shiftKey);
          if (currentMode === "foliage")
            paintFoliageAt(p.x, p.z, foliageEraseMode || e.shiftKey);
          if (currentMode === "objects")
            paintObjectAt(p.x, p.z, objectEraseMode || e.shiftKey);
          if (currentMode === "fleurs")
            paintFleurAt(p.x, p.z, fleurEraseMode || e.shiftKey);
          if (currentMode === "ambientfx")
            paintAmbientFXAt(p.x, p.z, ambientFXErase || e.shiftKey);
          if (currentMode === "pinelod")
            paintLODAt(p.x, p.z, e.shiftKey);
          if (currentMode === "ftrees")
            paintFTreeAt(p.x, p.z, e.shiftKey);
          if (currentMode === "cliffpaint")
            paintCliffBlendAt(p.x, p.z, cliffPaintEraseMode || e.shiftKey);
          if (currentMode === "barrier")
            paintBarrierAt(p.x, p.z, barrierEraseMode || e.shiftKey);
        });

        // ── BRUSH SCROLL SHORTCUTS ──────────────────────────────────────
        // Shift + scroll = radius  |  Alt + scroll = strength
        renderer.domElement.addEventListener("wheel", (e) => {
          if (!e.shiftKey && !e.altKey) return; // let OrbitControls handle plain scroll
          e.preventDefault();

              }
              chunk.lod0ims.forEach(g => { if (g.im.count > 0) g.im.instanceMatrix.needsUpdate = true; });
              if (chunk.lod1ims) chunk.lod1ims.forEach(g => { if (g.im.count > 0) g.im.instanceMatrix.needsUpdate = true; });
              count0 += chunk.lod0ims[0]?.im.count ?? 0;
              if (chunk.lod1ims) count1 += chunk.lod1ims[0]?.im.count ?? 0;
            }
            if (pineImpostor) {
              pineImpostor.paintFinishImpostorMega(pineImpW, pineMegaW);
              count2 += pineImpW;
              count3 += pineMegaW;
            }
          }
          const active = LOD_SLOTS[activeLodSlot];
          lodParams.slotName   = active.name;
          lodParams.threshold  = active.lodThreshold;
          lodParams.lodImpostorDist = active.lodImpostorDist ?? 115;
          lodParams.lodMegaDist = active.lodMegaDist ?? 220;
          lodParams.minSpacing = active.minSpacing;
          lodParams.scaleMin   = active.scaleMin;
          lodParams.scaleMax   = active.scaleMax;
          lodParams.density        = active.density;
          lodParams.treesPerStroke = active.treesPerStroke;
          lodParams.count0    = count0;
          lodParams.count1    = count1;
          lodParams.count2    = count2;
          lodParams.count3    = count3;
          lodParams.totalTrees = totalTrees;
          lodParams.chunks    = totalChunks;
          lodParams.chunksVisible = totalVisible;
        }

        let _ftreeDirty = true;
        const _ftreeLastPos = new THREE.Vector3(Infinity, Infinity, Infinity);
        const _ftreeLastQuat = new THREE.Quaternion();
        function _markFtreeDirty() { _ftreeDirty = true; }

        function updateFTreeInstances() {
          if (!FTREE_SLOTS.some(s => s.ready && s.chunks.size > 0)) return;
          const posMoved = _ftreeLastPos.distanceToSquared(camera.position) > _LOD_POS_THR * _LOD_POS_THR;
          const camQ = camera.quaternion;
          const rotChanged = Math.abs(_ftreeLastQuat.dot(camQ)) < _LOD_ROT_THR;
          if (!_ftreeDirty && !posMoved && !rotChanged) return;
          _ftreeDirty = false;
          _ftreeLastPos.copy(camera.position);
          _ftreeLastQuat.copy(camQ);
          _ftreeProjMat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          _ftreeFrustum.setFromProjectionMatrix(_ftreeProjMat);
          let totalVisible = 0, totalChunks = 0, totalTrunks = 0, totalLeaves = 0;
          for (const slot of FTREE_SLOTS) {
            if (!slot.ready || !slot.trunkDefs) continue;
            totalTrunks += slot.positions.length;
            const ts = slot.clusterPreset ? slot.clusterPreset.trunkScale : 1.0;
            for (const chunk of slot.chunks.values()) {
              totalChunks++;
              chunk.ims.forEach(g => { g.im.count = 0; });
              if (!_ftreeFrustum.intersectsSphere(chunk.sphere)) continue;
              totalVisible++;
              for (const { x, y, z, scale } of chunk.positions) {
                _ftreeDummy.position.set(x, y, z);
                _ftreeDummy.scale.setScalar(scale * ts);
                _ftreeDummy.rotation.set(0, Math.PI * 2 * ((x * 13.7 + z * 7.3) % 1), 0);
                _ftreeDummy.updateMatrix();
                chunk.ims.forEach(({ im, localMatrix }) => {
                  if (im.count >= FTREE_MAX_PER_CHUNK) return;
                  _ftreeFinalMat.multiplyMatrices(_ftreeDummy.matrix, localMatrix);
                  im.setMatrixAt(im.count++, _ftreeFinalMat);
                });
              }
              chunk.ims.forEach(g => { if (g.im.count > 0) g.im.instanceMatrix.needsUpdate = true; });
            }
            if (slot.leafMesh) totalLeaves += slot.leafMesh.count;
          }
          const active = FTREE_SLOTS[activeFTreeSlot];
          ftreeParams.slotName       = active.name;
          ftreeParams.minSpacing     = active.minSpacing;
          ftreeParams.scaleMin       = active.scaleMin;
          ftreeParams.scaleMax       = active.scaleMax;
          ftreeParams.density        = active.density;
          ftreeParams.treesPerStroke = active.treesPerStroke;
          ftreeParams.totalTrunks    = totalTrunks;
          ftreeParams.totalLeaves    = totalLeaves;
          ftreeParams.chunks         = totalChunks;
          ftreeParams.chunksVisible  = totalVisible;
        }

        renderer.setAnimationLoop(() => {
          clock.update();
          const elapsed = clock.getElapsed();
          const dt = clock.getDelta();

          // ── AMBIENT FX UPDATE ──
          if (ambientFXSystem) {
            ambientFXSystem.update(dt, elapsed,
              ambientFXParams.windX, ambientFXParams.windZ, ambientFXParams.windStrength);
          }

          // ── PLAY MODE UPDATE ──
          if (currentMode === "play") {
            // WASD movement relative to camera yaw
            let mx = 0,
              mz = 0;
            if (keysHeld["KeyW"] || keysHeld["ArrowUp"]) {
              mx -= Math.sin(camYaw);
              mz -= Math.cos(camYaw);
            }
            if (keysHeld["KeyS"] || keysHeld["ArrowDown"]) {
              mx += Math.sin(camYaw);
              mz += Math.cos(camYaw);
            }
            if (keysHeld["KeyA"] || keysHeld["ArrowLeft"]) {
              mx -= Math.cos(camYaw);
              mz += Math.sin(camYaw);
            }
            if (keysHeld["KeyD"] || keysHeld["ArrowRight"]) {
              mx += Math.cos(camYaw);
              mz -= Math.sin(camYaw);
            }
            const mlen = Math.sqrt(mx * mx + mz * mz);
            if (mlen > 0) {
              const stepX = (mx / mlen) * playParams.speed * dt;
              const stepZ = (mz / mlen) * playParams.speed * dt;
              let newX = playerPos.x + stepX;
              let newZ = playerPos.z + stepZ;
              newX = Math.max(-TERRAIN_SIZE / 2, Math.min(TERRAIN_SIZE / 2, newX));
              newZ = Math.max(-TERRAIN_SIZE / 2, Math.min(TERRAIN_SIZE / 2, newZ));
              if (isBarrierBlocked(newX, newZ)) {
                const slideX = !isBarrierBlocked(newX, playerPos.z);
                const slideZ = !isBarrierBlocked(playerPos.x, newZ);
                if (slideX) newZ = playerPos.z;
                else if (slideZ) newX = playerPos.x;
                else { newX = playerPos.x; newZ = playerPos.z; }
              }
              playerPos.x = newX;
              playerPos.z = newZ;
            }
            // Snap Y to terrain (bvhHeight includes cliff surfaces)
            playerPos.y = bvhHeight(playerPos.x, playerPos.z);
            const capsuleCY = playerPos.y + PLAYER_CAP_R + PLAYER_CAP_H * 0.5;
            capsuleMesh.position.set(playerPos.x, capsuleCY, playerPos.z);
            // Face direction of movement
            if (mlen > 0) capsuleMesh.rotation.y = Math.atan2(mx, mz) + PI;
            // Third-person camera
            const lookAtY = capsuleCY + 0.6;
            const hDist = playParams.camDist * Math.cos(camPitch);
            const vDist = playParams.camDist * Math.sin(camPitch);
            camera.position.set(
              playerPos.x + Math.sin(camYaw) * hDist,
              lookAtY + vDist,
              playerPos.z + Math.cos(camYaw) * hDist,
            );
            // Camera collision — raycast from lookAt point toward desired camera position.
            // Lerps in fast on hit, eases back out slowly when clear. Zero allocs per frame.
            {
              _camTarget.set(playerPos.x, lookAtY, playerPos.z);
              _camDir.subVectors(camera.position, _camTarget);
              const desiredDist = playParams.camDist;
              _camDir.set(
                Math.sin(camYaw) * Math.cos(camPitch),
                Math.sin(camPitch),
                Math.cos(camYaw) * Math.cos(camPitch)
              ).normalize();
              let targetDist = desiredDist;
              if (_camTerrainBvh) {
                _camRay.set(_camTarget, _camDir);
                const tHit = _camTerrainBvh.raycastFirst(_camRay, THREE.DoubleSide);
                if (tHit && tHit.distance - playParams.collisionGap < targetDist)
                  targetDist = tHit.distance - playParams.collisionGap;
                if (_camCliffBvh) {
                  const cHit = _camCliffBvh.raycastFirst(_camRay, THREE.DoubleSide);
                  if (cHit && cHit.distance - playParams.collisionGap < targetDist)
                    targetDist = cHit.distance - playParams.collisionGap;
                }
              }
              if (targetDist < playParams.collisionMin) targetDist = playParams.collisionMin;
              // Fast lerp when pushing in (avoid clipping), slow lerp when pulling back out
              const lerpRate = targetDist < _camCurrentDist ? 25 : 5;
              _camCurrentDist += (targetDist - _camCurrentDist) * Math.min(1, lerpRate * dt);
              camera.position.copy(_camTarget).addScaledVector(_camDir, _camCurrentDist);
            }
            camera.lookAt(playerPos.x, lookAtY, playerPos.z);
            // Feed player pos to grass interaction
            if (grassUniforms)
              grassUniforms.uPlayerPos.value.set(
                playerPos.x,
                playerPos.y,
                playerPos.z,
              );
            // Feed player pos to flower interaction
            if (flowerCtx)
              flowerCtx.uPlayerPos.value.set(
                playerPos.x,
                playerPos.y,
                playerPos.z,
              );
            // Feed player pos to gemini grass interaction
            if (geminiGrassUniforms)
              geminiGrassUniforms.uPlayerPos.value.set(
                playerPos.x,
                playerPos.y,
                playerPos.z,
              );
            // Feed player pos to wind-enabled foliage
            FOLIAGE_SLOTS.forEach(s => {
              if (s.system) s.system.update(elapsed, playerPos);
            });
          }

          if (grassUniforms) grassUniforms.uTime.value = elapsed;
          // Foliage wind time (always ticks — player interaction only in play mode above)
          if (currentMode !== "play") {
            FOLIAGE_SLOTS.forEach(s => { if (s.system) s.system.update(elapsed, null); });
          }
          uWaterTime.value = elapsed;
          // Update lake shader (time + bob for Lake-style water bodies)
          const lakeBodies = waterObjects.filter(m => m.userData.waterStyle === "Lake");
          lakeShader.update(dt, elapsed, lakeBodies);
          if (waterfallObjects.length > 0) wfU.wfFlowTime.value += dt * wfU.wfFlowSpeed.value;
          uWCamXZ.value.set(camera.position.x, camera.position.z);
          _syncRipples();
          if (grassPatchSystem || cliffGrassPatchSystem || flowerPatchSystem) {
            camera.updateMatrixWorld();
            _grassProjMatrix.multiplyMatrices(
              camera.projectionMatrix,
              camera.matrixWorldInverse,
            );
            _grassFrustum.setFromProjectionMatrix(_grassProjMatrix);
            if (grassPatchSystem)
              grassPatchSystem.update(camera.position, _grassFrustum);
            if (cliffGrassPatchSystem)
              cliffGrassPatchSystem.update(camera.position, _grassFrustum);
            if (flowerPatchSystem)
              flowerPatchSystem.update(camera.position, _grassFrustum);
          }
          // Gemini grass — update patches + sync sun direction
          if (geminiGrassPatchSystem && geminiGrassGroup) {
            const gp = window._geminiGrassParams;
            _geminiUpdateOpts.patchSize = gp.fieldSize;
            _geminiUpdateOpts.patchSizeMid = gp.lodMidPatchSize;
            _geminiUpdateOpts.patchSizeFar = gp.lodFarPatchSize;
            _geminiUpdateOpts.lodMidDistance = gp.lodMidDistance;
            _geminiUpdateOpts.lodFarDistance = gp.lodFarDistance;
            _geminiUpdateOpts.maxDistance = gp.lodMaxDistance;
            _geminiUpdateOpts.lodEnabled = gp.lodEnabled;
            _geminiUpdateOpts.grassReceiveShadow = gp.grassReceiveShadow;
            geminiGrassPatchSystem.update(_geminiUpdateOpts);
            // Keep sun direction in sync with editor lighting
            const sd = sunDirectionFromAngles(
              PARAMS.light.sunAzimuth,
              PARAMS.light.sunElevation,
            );
            geminiGrassUniforms.uSunDir.value.copy(sd);
          }
          // Day/night cycle animation
          if (PARAMS.dayNight.enabled) {
            PARAMS.dayNight.time = ((PARAMS.dayNight.time + dt * PARAMS.dayNight.speed * (1 / 60)) % 24 + 24) % 24;
            syncDayNight(PARAMS.dayNight.time);
          }
          // Sync lighting & sky from PARAMS every frame
          shadowTarget.position.set(camera.position.x, 0, camera.position.z);
          const sunDir = sunDirectionFromAngles(
            PARAMS.light.sunAzimuth,
            PARAMS.light.sunElevation,
          );
          dirLight.position.copy(sunDir).multiplyScalar(600);
          dirLight.color.set(PARAMS.light.dirColor);
          dirLight.intensity = PARAMS.light.dirIntensity;
          dirLight.shadow.bias = PARAMS.shadowBias;
          dirLight.shadow.normalBias = PARAMS.shadowNormalBias;

          // CSM: rebuild cascades if params changed
          const _csmChanged =
            PARAMS.csm.enabled &&
            (PARAMS.csm.cascades !== _lastCsmCascades ||
              PARAMS.csm.maxFar !== _lastCsmMaxFar ||
              PARAMS.csm.lightMargin !== _lastCsmMargin ||
              PARAMS.csm.mapSize !== _lastCsmMapSize);
          if (csm.mainFrustum && _csmChanged) {
            _lastCsmCascades = PARAMS.csm.cascades;
            _lastCsmMaxFar = PARAMS.csm.maxFar;
            _lastCsmMargin = PARAMS.csm.lightMargin;
            _lastCsmMapSize = PARAMS.csm.mapSize;
            csm.cascades = PARAMS.csm.cascades;
            csm.maxFar = PARAMS.csm.maxFar;
            csm.lightMargin = PARAMS.csm.lightMargin;
            dirLight.shadow.mapSize.set(PARAMS.csm.mapSize, PARAMS.csm.mapSize);
            csm.updateFrustums();
          }
          if (
            csm.mainFrustum &&
            PARAMS.csm.enabled &&
            PARAMS.csm.updateEveryFrame
          )
            csm.updateFrustums();
          hemiLight.color.set(PARAMS.light.hemiSkyColor);
          hemiLight.groundColor.set(PARAMS.light.hemiGroundColor);
          hemiLight.intensity = PARAMS.light.hemiIntensity;
          {
            const _pineSlot = LOD_SLOTS[0];
            const _pineApi = _pineSlot?.pineImpostorApi;
            if (_pineApi && _pineSlot.name === "Pine") {
              const _sd = sunDirectionFromAngles(
                PARAMS.light.sunAzimuth,
                PARAMS.light.sunElevation,
              );
              _pineApi.updateSunDir(_sd);
              const _dc = dirLight.color;
              _tmpPineSunCol.set(
                _dc.r * dirLight.intensity,
                _dc.g * dirLight.intensity,
                _dc.b * dirLight.intensity,
              );
              _pineApi.updateSunColor(_tmpPineSunCol);
              _tmpPineAmbCol.set(0.22, 0.24, 0.28);
              _pineApi.updateAmbColor(_tmpPineAmbCol);
              const _hi = hemiLight.intensity * 0.5;
              _tmpPineHemiSky.set(
                hemiLight.color.r * _hi,
                hemiLight.color.g * _hi,
                hemiLight.color.b * _hi,
              );
              _tmpPineHemiGnd.set(
                hemiLight.groundColor.r * _hi,
                hemiLight.groundColor.g * _hi,
                hemiLight.groundColor.b * _hi,
              );
              _pineApi.updateHemiColors(_tmpPineHemiSky, _tmpPineHemiGnd);
            }
          }
          if (skyMode === "physical") {
            sky.turbidity.value = PARAMS.sky.turbidity;
            sky.rayleigh.value = PARAMS.sky.rayleigh;
            sky.mieCoefficient.value = PARAMS.sky.mie;
            sky.mieDirectionalG.value = PARAMS.sky.mieG;
            sky.cloudCoverage.value = PARAMS.sky.cloudCoverage;
            sky.cloudDensity.value = PARAMS.sky.cloudDensity;
            sky.cloudElevation.value = PARAMS.sky.cloudElevation;
            sky.sunPosition.value.copy(sunDir);
          }
          stylizedSky.update(sunDir, camera.position);
          // Scale cloud wind speed with day/night animation speed (timelapse effect)
          if (PARAMS.dayNight.enabled) {
            const ws = stylizedSky.windState;
            const s1 = ws.c1Speed, s2 = ws.c2Speed;
            ws.c1Speed = s1 * PARAMS.dayNight.speed;
            ws.c2Speed = s2 * PARAMS.dayNight.speed;
            stylizedSky.updateWind();
            ws.c1Speed = s1; ws.c2Speed = s2;
          }
          scene.environmentIntensity = PARAMS.light.envIntensity;
          renderer.toneMappingExposure = PARAMS.light.exposure;

          if (currentMode !== "play") orbit.update();

          // Post-processing uniform sync — skip entirely when master post is off
          if (postParams.enabled) {
            uGtaoEnabled.value = postParams.gtao.enabled ? 1 : 0;
            uGtaoIntensity.value = postParams.gtao.intensity;
            gtaoPass.radius.value = postParams.gtao.radius;
            gtaoPass.samples.value = postParams.gtao.samples;
            gtaoPass.scale.value = postParams.gtao.scale;
            gtaoPass.distanceFallOff.value = postParams.gtao.distanceFallOff;
            gtaoPass.distanceExponent.value = postParams.gtao.distanceExponent;
            gtaoPass.thickness.value = postParams.gtao.thickness;
            denoisePass.radius.value = postParams.gtao.denoiseRadius;
            denoisePass.lumaPhi.value = postParams.gtao.denoiseLumaPhi;
            denoisePass.depthPhi.value = postParams.gtao.denoiseDepthPhi;
            denoisePass.normalPhi.value = postParams.gtao.denoiseNormalPhi;
            uGtaoDenoiseEnabled.value = postParams.gtao.denoiseEnabled ? 1 : 0;
            if (denoisePass._resolution) {
              const _sz = renderer.getDrawingBufferSize(_tmpDrawBufSize);
              denoisePass._resolution.value.set(_sz.x, _sz.y);
            }

            uDofEnabled.value = postParams.dof.enabled ? 1 : 0;
            uDofFocusDistance.value = postParams.dof.focusDistance;
            uDofBlurStart.value = postParams.dof.blurStart;
            uDofBlurEnd.value = postParams.dof.blurEnd;
            uDofBlurSize.value = postParams.dof.blurSize;
            uDofBlurSpread.value = postParams.dof.blurSpread;

            uBloomEnabled.value = postParams.bloom.enabled ? 1 : 0;
            bloomScenePass.strength.value = postParams.bloom.strength;
            bloomScenePass.radius.value = postParams.bloom.radius;
            bloomScenePass.threshold.value = postParams.bloom.threshold;

            uLensflareEnabled.value = postParams.lensflare.enabled ? 1 : 0;
            skyBloomPass.threshold.value = postParams.lensflare.bloomThreshold;
            flareThreshold.value = postParams.lensflare.threshold;
            flareGhostAttenuation.value = postParams.lensflare.ghostAttenuation;
            flareGhostSpacing.value = postParams.lensflare.ghostSpacing;

            uGodRaysEnabled.value = postParams.godRays.enabled ? 1 : 0;
            uGodRaysStrength.value = postParams.godRays.strength;
            uGodRaysDecay.value = postParams.godRays.decay;
            uGodRaysDensity.value = postParams.godRays.density;
            uGodRaysSamples.value = postParams.godRays.samples;

            uOutlineEnabled.value = postParams.outline.enabled ? 1 : 0;
            uOutlineThickness.value = postParams.outline.thickness;
            uOutlineStrength.value = postParams.outline.strength;
            uOutlineDepthThresh.value = postParams.outline.depthThreshold;
            uOutlineRes.value.set(renderer.domElement.width, renderer.domElement.height);

            _tmpSunVec.copy(sunDir).multiplyScalar(500000).add(camera.position);
            _tmpSunV4.set(_tmpSunVec.x, _tmpSunVec.y, _tmpSunVec.z, 1);
            _tmpSunV4.applyMatrix4(camera.matrixWorldInverse);
            _tmpSunV4.applyMatrix4(camera.projectionMatrix);
            uSunScreenPos.value.set(
              (_tmpSunV4.x / _tmpSunV4.w) * 0.5 + 0.5,
              (_tmpSunV4.y / _tmpSunV4.w) * 0.5 + 0.5,
            );
            uCameraFar.value = camera.far;
          }

          // ── RIVER TIME ──
          uRiverTime.value += dt;

          // ── SPLINE TRAIN UPDATE ──
          if (PARAMS.spline.showTrain && _cachedTrainCurve && _cachedTrainLen > 0) {
            splineTrainT = (splineTrainT + dt * PARAMS.spline.trainSpeed / _cachedTrainLen) % 1;
            const pos = _cachedTrainCurve.getPoint(splineTrainT);
            const tangent = _cachedTrainCurve.getTangent(splineTrainT);
            trainMesh.position.copy(pos);
            trainMesh.scale.setScalar(PARAMS.spline.trainScale);
            trainMesh.lookAt(pos.x + tangent.x, pos.y + tangent.y, pos.z + tangent.z);
            trainMesh.visible = true;
          } else {
            trainMesh.visible = false;
          }

          uFTreeTime.value = elapsed;
          updateLODInstances();
          updateFTreeInstances();
          // Throttled Tweakpane refresh for LOD/FTree readonly stats
          {
            const _now = performance.now();
            if ((lodFolder || ftreeFolder) && _now - _lastPaneRefresh > _PANE_REFRESH_INTERVAL) {
              _lastPaneRefresh = _now;
              pane.refresh();
            }
          }
          stats.update();
          // Lake planar reflection pre-pass (only when lake bodies exist)
          if (lakeBodies.length > 0) renderLakeReflection(lakeBodies);
          (postParams.enabled ? renderPipeline : simplePipeline).render();
          // Throttled chunk stats DOM update (reuses _lastPaneRefresh timer)
          if (performance.now() - _lastPaneRefresh < _PANE_REFRESH_INTERVAL) {
            // skip — pane refresh block already updated recently or will soon
          } else {
            const lines = [];
            if (treeSystem) {
              const cs = treeSystem.getChunkStats(camera);
              if (cs.total > 0) lines.push(`Trees: ${cs.visible}/${cs.total} chunks`);
            }
            let fv = 0, ft = 0;
            FOLIAGE_SLOTS.forEach(s => {
              if (s.system) {
                const cs = s.system.getChunkStats(camera);
                fv += cs.visible; ft += cs.total;
              }
            });
            if (ft > 0) lines.push(`Foliage: ${fv}/${ft} chunks`);
            let ov = 0, ot = 0;
            OBJECT_SLOTS.forEach(s => {
              if (s.system) { const cs = s.system.getChunkStats(camera); ov += cs.visible; ot += cs.total; }
            });
            if (ot > 0) lines.push(`Objects: ${ov}/${ot} chunks`);
            const _totalLodChunks = LOD_SLOTS.reduce((s, sl) => s + sl.chunks.size, 0);
            if (_totalLodChunks > 0) lines.push(`TreeLOD: ${lodParams.chunksVisible}/${_totalLodChunks} chunks`);
            chunkInfoDiv.textContent = lines.length ? lines.join('\n') : '';
          }
        });
      }

      init();
    </script>
  </body>
