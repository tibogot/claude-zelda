<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splatmap Painter 2 — Procedural Terrain</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #ui {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 20;
        font: 13px/1.6 "SF Mono", "Fira Code", monospace;
        color: #e0f0c0;
        background: rgba(0,0,0,0.6);
        padding: 12px 16px;
        border-radius: 8px;
        backdrop-filter: blur(4px);
        user-select: none;
        min-width: 220px;
      }
      #ui h3 { color: #fff; margin-bottom: 8px; font-size: 14px; letter-spacing: 0.05em; }

      .biome-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
      .biome-btn {
        padding: 4px 10px;
        border-radius: 4px;
        border: 2px solid transparent;
        cursor: pointer;
        font: 12px "SF Mono", monospace;
        font-weight: 600;
        color: #fff;
        transition: border-color 0.15s;
      }
      .biome-btn.active { border-color: #fff; }
      .biome-btn[data-biome="forest"]  { background: rgba(160,60,40,0.8); }
      .biome-btn[data-biome="grass"]   { background: rgba(40,160,40,0.8); }
      .biome-btn[data-biome="village"] { background: rgba(40,80,200,0.8); }
      .biome-btn[data-biome="erase"]   { background: rgba(80,80,80,0.8); }

      .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .slider-row label { width: 70px; font-size: 11px; color: #aaa; }
      .slider-row input[type=range] { flex: 1; }
      .slider-row span { width: 30px; text-align: right; font-size: 11px; }

      .action-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .action-btn {
        padding: 5px 12px; border-radius: 4px; border: none; cursor: pointer;
        font: 12px "SF Mono", monospace; font-weight: 600; color: #fff;
        background: rgba(255,255,255,0.15); transition: background 0.15s;
      }
      .action-btn:hover { background: rgba(255,255,255,0.3); }
      .action-btn.generate { background: rgba(255,160,0,0.7); }
      .action-btn.generate:hover { background: rgba(255,160,0,0.9); }
      .action-btn.clear { background: rgba(180,40,40,0.7); }
      .action-btn.clear:hover { background: rgba(180,40,40,0.9); }

      #info {
        position: fixed; bottom: 16px; left: 16px; z-index: 10;
        font: 12px/1.5 "SF Mono", monospace; color: #b0d890;
        background: rgba(0,0,0,0.55); padding: 8px 12px;
        border-radius: 6px; pointer-events: none; backdrop-filter: blur(4px);
      }
      #info span { color: #e0f0c0; font-weight: 600; }

      #mode-badge {
        position: fixed; top: 16px; right: 16px; z-index: 20;
        font: bold 13px "SF Mono", monospace; padding: 6px 14px;
        border-radius: 6px; pointer-events: none; transition: background 0.2s, color 0.2s;
      }
      #mode-badge.view  { background: rgba(40,40,40,0.8); color: #888; }
      #mode-badge.paint { background: rgba(40,160,80,0.9); color: #fff; }

      #splatmap-preview {
        position: fixed; bottom: 16px; right: 16px; z-index: 20;
        border: 2px solid rgba(255,255,255,0.3); border-radius: 6px;
        image-rendering: pixelated; width: 128px; height: 128px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl/dist/main.js"
        }
      }
    </script>
  </head>
  <body>

    <div id="ui">
      <h3>Splatmap Painter 2</h3>
      <div style="font-size:11px; color:#aaa; margin-bottom:8px;">
        <b style="color:#fff">P</b> — paint mode &nbsp;|&nbsp;
        <b style="color:#fff">G</b> — generate<br>
        Orbit: middle-mouse / alt+drag
      </div>
      <div class="biome-row">
        <button class="biome-btn active" data-biome="forest">Forest</button>
        <button class="biome-btn" data-biome="grass">Grass</button>
        <button class="biome-btn" data-biome="village">Village</button>
        <button class="biome-btn" data-biome="erase">Erase</button>
      </div>
      <div class="slider-row">
        <label>Size</label>
        <input type="range" id="brush-size" min="2" max="80" value="20" step="1">
        <span id="brush-size-val">20</span>
      </div>
      <div class="slider-row">
        <label>Strength</label>
        <input type="range" id="brush-str" min="5" max="100" value="60" step="1">
        <span id="brush-str-val">60</span>
      </div>
      <div class="action-row">
        <button class="action-btn generate" id="btn-generate">Generate (G)</button>
        <button class="action-btn clear" id="btn-clear">Clear</button>
        <button class="action-btn" id="btn-save">Save PNG</button>
        <button class="action-btn" id="btn-load">Load PNG</button>
        <input type="file" id="file-input" accept="image/png" style="display:none">
      </div>
    </div>

    <div id="mode-badge" class="view">VIEW MODE</div>

    <div id="info">
      Splatmap Painter 2 &mdash; <span id="backend">loading…</span>
      &bull; <span id="sphere-count">0 spheres</span>
    </div>

    <canvas id="splatmap-preview" width="128" height="128"></canvas>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import Stats from "stats-gl";

      // ─────────────────────────────────────────
      //  NOISE (self-contained, no external imports)
      // ─────────────────────────────────────────
      function hash(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return n - Math.floor(n);
      }
      function smoothNoise(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const ux = fx * fx * (3 - 2 * fx);
        const uy = fy * fy * (3 - 2 * fy);
        const a = hash(ix,   iy),   b = hash(ix+1, iy);
        const c = hash(ix,   iy+1), d = hash(ix+1, iy+1);
        return a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy;
      }
      function fbm(x, y, octaves = 6) {
        let v = 0, amp = 1, freq = 1, total = 0;
        for (let i = 0; i < octaves; i++) {
          v     += smoothNoise(x * freq, y * freq) * amp;
          total += amp;
          amp   *= 0.5;
          freq  *= 2.1;
        }
        return v / total;
      }
      function ridged(x, y, octaves = 4) {
        let v = 0, amp = 1, freq = 1, total = 0;
        for (let i = 0; i < octaves; i++) {
          let n = smoothNoise(x * freq, y * freq);
          n = 1 - Math.abs(n * 2 - 1);
          n = n * n;
          v     += n * amp;
          total += amp;
          amp   *= 0.5;
          freq  *= 2.1;
        }
        return v / total;
      }

      // ─────────────────────────────────────────
      //  CONSTANTS
      // ─────────────────────────────────────────
      const TERRAIN_SIZE = 200;
      const TERRAIN_RES  = 128;
      const HEIGHT_SCALE = 22;
      const NOISE_FREQ   = 0.018;
      const SPLAT_RES    = 512;
      const PI           = Math.PI;

      // ─────────────────────────────────────────
      //  sampleHeight  — same noise as geometry
      // ─────────────────────────────────────────
      function sampleHeight(wx, wz) {
        const nx = wx * NOISE_FREQ;
        const nz = wz * NOISE_FREQ;
        const base   = fbm(nx, nz, 6);
        const detail = ridged(nx * 2.5, nz * 2.5, 4) * 0.25;
        // Flatten the center gently (good for a village later)
        const d2 = Math.min(1, (wx*wx + wz*wz) / (TERRAIN_SIZE * TERRAIN_SIZE * 0.12));
        return (base + detail) * HEIGHT_SCALE * d2;
      }

      // ─────────────────────────────────────────
      //  BIOME COLORS  (R=forest, G=grass, B=village)
      // ─────────────────────────────────────────
      const BIOME_COLORS = {
        forest:  { r: 180, g: 60,  b: 40  },
        grass:   { r: 40,  g: 180, b: 40  },
        village: { r: 40,  g: 60,  b: 200 },
        erase:   { r: 0,   g: 0,   b: 0   },
      };
      const SPHERE_THRESHOLD = 80;

      // ─────────────────────────────────────────
      //  SPLATMAP CANVAS
      // ─────────────────────────────────────────
      const splatCanvas = document.createElement("canvas");
      splatCanvas.width = splatCanvas.height = SPLAT_RES;
      const splatCtx = splatCanvas.getContext("2d");
      splatCtx.fillStyle = "#000";
      splatCtx.fillRect(0, 0, SPLAT_RES, SPLAT_RES);

      const previewCanvas = document.getElementById("splatmap-preview");
      const previewCtx    = previewCanvas.getContext("2d");
      function syncPreview() { previewCtx.drawImage(splatCanvas, 0, 0, 128, 128); }
      syncPreview();

      // ─────────────────────────────────────────
      //  COORDINATE HELPERS
      // ─────────────────────────────────────────
      function worldToUV(wx, wz) {
        return {
          u: (wx + TERRAIN_SIZE / 2) / TERRAIN_SIZE,
          v: (wz + TERRAIN_SIZE / 2) / TERRAIN_SIZE,
        };
      }
      function uvToWorld(u, v) {
        return {
          x: u * TERRAIN_SIZE - TERRAIN_SIZE / 2,
          z: v * TERRAIN_SIZE - TERRAIN_SIZE / 2,
        };
      }

      // ─────────────────────────────────────────
      //  STATE
      // ─────────────────────────────────────────
      let paintMode    = false;
      let isMouseDown  = false;
      let currentBiome = "forest";
      let brushSize    = 20;
      let brushStr     = 60;
      let instancedSpheres = null;
      let splatTex = null;

      // ─────────────────────────────────────────
      //  PAINT
      // ─────────────────────────────────────────
      function paintAt(wx, wz) {
        const { u, v } = worldToUV(wx, wz);
        const cx = u * SPLAT_RES;
        const cy = v * SPLAT_RES;
        const col = BIOME_COLORS[currentBiome];
        const alpha = brushStr / 100;

        const grad = splatCtx.createRadialGradient(cx, cy, 0, cx, cy, brushSize);
        grad.addColorStop(0,   `rgba(${col.r},${col.g},${col.b},${alpha})`);
        grad.addColorStop(0.5, `rgba(${col.r},${col.g},${col.b},${alpha * 0.55})`);
        grad.addColorStop(1,   `rgba(${col.r},${col.g},${col.b},0)`);

        splatCtx.globalCompositeOperation = "source-over";
        splatCtx.fillStyle = grad;
        splatCtx.beginPath();
        splatCtx.arc(cx, cy, brushSize, 0, PI * 2);
        splatCtx.fill();

        syncPreview();
        if (splatTex) splatTex.needsUpdate = true;
      }

      // ─────────────────────────────────────────
      //  GENERATE SPHERES
      // ─────────────────────────────────────────
      function generateSpheres(scene) {
        if (instancedSpheres) {
          scene.remove(instancedSpheres);
          instancedSpheres.geometry.dispose();
          instancedSpheres.material.dispose();
          instancedSpheres = null;
        }

        const pixels = splatCtx.getImageData(0, 0, SPLAT_RES, SPLAT_RES).data;
        const positions = [];
        const STEP = 4;

        for (let iy = 0; iy < SPLAT_RES; iy += STEP) {
          for (let ix = 0; ix < SPLAT_RES; ix += STEP) {
            const idx = (iy * SPLAT_RES + ix) * 4;
            const r = pixels[idx], g = pixels[idx+1], b = pixels[idx+2];
            if (r >= SPHERE_THRESHOLD && r > g + 20 && r > b + 20) {
              const u = ix / SPLAT_RES;
              const v = iy / SPLAT_RES;
              const { x, z } = uvToWorld(u, v);
              const cellSize = TERRAIN_SIZE / (SPLAT_RES / STEP);
              const jx = (Math.random() - 0.5) * cellSize;
              const jz = (Math.random() - 0.5) * cellSize;
              const wx = x + jx, wz = z + jz;
              positions.push(new THREE.Vector3(wx, sampleHeight(wx, wz), wz));
            }
          }
        }

        if (positions.length === 0) {
          document.getElementById("sphere-count").textContent = "0 spheres";
          return;
        }

        const geo = new THREE.SphereGeometry(0.5, 8, 6);
        const mat = new THREE.MeshStandardMaterial({ color: 0x2d8c2d, roughness: 0.8 });
        instancedSpheres = new THREE.InstancedMesh(geo, mat, positions.length);
        instancedSpheres.castShadow = true;
        instancedSpheres.receiveShadow = true;

        const dummy = new THREE.Object3D();
        positions.forEach((pos, i) => {
          dummy.position.set(pos.x, pos.y + 0.5, pos.z);
          dummy.scale.setScalar(0.5 + Math.random() * 0.9);
          dummy.updateMatrix();
          instancedSpheres.setMatrixAt(i, dummy.matrix);
        });
        instancedSpheres.instanceMatrix.needsUpdate = true;
        scene.add(instancedSpheres);

        document.getElementById("sphere-count").textContent =
          `${positions.length.toLocaleString()} spheres`;
      }

      // ─────────────────────────────────────────
      //  SAVE / LOAD
      // ─────────────────────────────────────────
      function saveSplatmap() {
        const a = document.createElement("a");
        a.download = "splatmap.png";
        a.href = splatCanvas.toDataURL("image/png");
        a.click();
      }
      function loadSplatmap(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            splatCtx.clearRect(0, 0, SPLAT_RES, SPLAT_RES);
            splatCtx.drawImage(img, 0, 0, SPLAT_RES, SPLAT_RES);
            syncPreview();
            if (splatTex) splatTex.needsUpdate = true;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // ─────────────────────────────────────────
      //  MAIN
      // ─────────────────────────────────────────
      async function init() {
        const renderer = new THREE.WebGPURenderer({ antialias: true });
        await renderer.init();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        document.getElementById("backend").textContent =
          renderer.backend?.constructor?.name?.includes("WebGPU") ? "WebGPU ✓" : "WebGL fallback";

        const stats = new Stats({ trackGPU: false });
        stats.init(renderer);
        document.body.appendChild(stats.dom);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 150, 350);

        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 2000);
        camera.position.set(0, 60, 100);
        camera.lookAt(0, 0, 0);

        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 5, 0);
        orbit.maxPolarAngle = PI * 0.48;
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.05;
        orbit.update();

        // ── LIGHTING ──
        function sunDir(azDeg, elDeg) {
          const az = azDeg * PI / 180, el = elDeg * PI / 180;
          return new THREE.Vector3(
            Math.cos(el) * Math.cos(az),
            Math.sin(el),
            Math.cos(el) * Math.sin(az)
          ).normalize();
        }
        const sun = sunDir(135, 43);
        const dirLight = new THREE.DirectionalLight("#fff5e0", 2.2);
        dirLight.position.copy(sun.clone().multiplyScalar(200));
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        dirLight.shadow.camera.near   = 1;
        dirLight.shadow.camera.far    = 600;
        dirLight.shadow.camera.left   = dirLight.shadow.camera.bottom = -TERRAIN_SIZE * 0.7;
        dirLight.shadow.camera.right  = dirLight.shadow.camera.top    =  TERRAIN_SIZE * 0.7;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);
        const shadowTarget = new THREE.Object3D();
        scene.add(shadowTarget);
        dirLight.target = shadowTarget;
        scene.add(new THREE.HemisphereLight("#c8e0ff", "#88aa55", 1));

        // ── PROCEDURAL TERRAIN ──
        const terrainGeo = new THREE.PlaneGeometry(
          TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_RES, TERRAIN_RES
        );
        terrainGeo.rotateX(-PI / 2);

        const pos = terrainGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          pos.setY(i, sampleHeight(pos.getX(i), pos.getZ(i)));
        }
        pos.needsUpdate = true;
        terrainGeo.computeVertexNormals();

        // Height-based vertex colors
        const vcol = new Float32Array(pos.count * 3);
        for (let i = 0; i < pos.count; i++) {
          const t = Math.max(0, Math.min(1, pos.getY(i) / HEIGHT_SCALE));
          // low=dark green, mid=bright green, high=rocky grey
          const r = 0.22 + t * 0.28;
          const g = 0.38 + t * 0.08 - t * t * 0.15;
          const b = 0.12 + t * 0.26;
          vcol[i*3] = r; vcol[i*3+1] = g; vcol[i*3+2] = b;
        }
        terrainGeo.setAttribute("color", new THREE.BufferAttribute(vcol, 3));

        const terrainMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.95,
          metalness: 0,
        });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        scene.add(terrain);

        splatTex = new THREE.CanvasTexture(splatCanvas);
        splatTex.wrapS = splatTex.wrapT = THREE.ClampToEdgeWrapping;

        // ── BRUSH RING ──
        const brushRingGeo = new THREE.RingGeometry(1, 1.06, 48);
        brushRingGeo.rotateX(-PI / 2);
        const brushRing = new THREE.Mesh(brushRingGeo, new THREE.MeshBasicMaterial({
          color: 0xffffff, side: THREE.DoubleSide,
          depthWrite: false, transparent: true, opacity: 0.9,
        }));
        brushRing.visible = false;
        brushRing.renderOrder = 2;
        scene.add(brushRing);

        // ── RAYCASTER (hits terrain mesh directly) ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function getTerrainHit(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x =  ((event.clientX - rect.left) / rect.width)  * 2 - 1;
          mouse.y = -((event.clientY - rect.top)  / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObject(terrain);
          return hits.length > 0 ? hits[0].point : null;
        }

        function brushWorldRadius() {
          return (brushSize / SPLAT_RES) * TERRAIN_SIZE;
        }
        function updateBrushRing(p) {
          if (!p) { brushRing.visible = false; return; }
          brushRing.visible = true;
          brushRing.position.set(p.x, p.y + 0.15, p.z);
          brushRing.scale.setScalar(brushWorldRadius());
        }

        // ── PAINT MODE ──
        function setPaintMode(on) {
          paintMode = on;
          orbit.enabled = !on;
          document.getElementById("mode-badge").textContent = on ? "PAINT MODE" : "VIEW MODE";
          document.getElementById("mode-badge").className   = on ? "paint" : "view";
          renderer.domElement.style.cursor = on ? "crosshair" : "default";
          if (!on) brushRing.visible = false;
        }

        // ── KEYBOARD ──
        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyP") setPaintMode(!paintMode);
          if (e.code === "KeyG") generateSpheres(scene);
        });

        // ── MOUSE ──
        renderer.domElement.addEventListener("mousemove", (e) => {
          if (!paintMode) return;
          const p = getTerrainHit(e);
          updateBrushRing(p);
          if (isMouseDown && p) paintAt(p.x, p.z);
        });
        renderer.domElement.addEventListener("mousedown", (e) => {
          if (!paintMode || e.button !== 0) return;
          isMouseDown = true;
          const p = getTerrainHit(e);
          if (p) paintAt(p.x, p.z);
        });
        renderer.domElement.addEventListener("mouseup",    () => { isMouseDown = false; });
        renderer.domElement.addEventListener("mouseleave", () => { isMouseDown = false; brushRing.visible = false; });

        // ── UI ──
        document.querySelectorAll(".biome-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".biome-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentBiome = btn.dataset.biome;
          });
        });
        const szSlider = document.getElementById("brush-size");
        const szVal    = document.getElementById("brush-size-val");
        szSlider.addEventListener("input", () => { brushSize = +szSlider.value; szVal.textContent = brushSize; });
        const stSlider = document.getElementById("brush-str");
        const stVal    = document.getElementById("brush-str-val");
        stSlider.addEventListener("input", () => { brushStr = +stSlider.value; stVal.textContent = brushStr; });

        document.getElementById("btn-generate").addEventListener("click", () => generateSpheres(scene));
        document.getElementById("btn-clear").addEventListener("click", () => {
          splatCtx.fillStyle = "#000";
          splatCtx.fillRect(0, 0, SPLAT_RES, SPLAT_RES);
          syncPreview();
          if (splatTex) splatTex.needsUpdate = true;
          generateSpheres(scene);
        });
        document.getElementById("btn-save").addEventListener("click", saveSplatmap);
        document.getElementById("btn-load").addEventListener("click", () => document.getElementById("file-input").click());
        document.getElementById("file-input").addEventListener("change", (e) => {
          if (e.target.files[0]) loadSplatmap(e.target.files[0]);
        });

        // ── RESIZE ──
        window.addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        // ── RENDER LOOP ──
        renderer.setAnimationLoop(() => {
          orbit.update();
          stats.update();
          renderer.render(scene, camera);
        });
      }

      init();
    </script>
  </body>
</html>
