<!doctype html>
<html lang="en">
  <head>
    <title>WebGPU TSL — Volumetric Clouds (leoawen/volumetric-clouds port)</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      body {

        overflow: hidden;

      }

        top: 10px;

    </style>

  <body>
    <div id="info">
      Scalable Cloud Generator with Advanced Material<br />
      Customizable cloud shape with PBR-style lighting material.
    </div>
    <div id="progress-container">
      <div id="progress-text">Generating 3D Texture...</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        float,
        vec2,
        vec3,
        vec4,
        Fn,
        Loop,
        If,
        Break,
        Discard,
        dot,
        exp,
        normalize,
        texture,
        texture3D,
        uniform,
        uv,
        screenUV,
        modelViewMatrix,
        modelWorldMatrixInverse,
        cameraPosition,
        positionGeometry,
        varying,
        max,
        min,
        abs,
        pow,
        smoothstep,
        length,
        fract,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { ImprovedNoise } from "three/addons/math/ImprovedNoise.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";
      import Stats from "three/addons/libs/stats.module.js";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";

      const SOLID_LAYER = 1;
      const VOLUME_LAYER = 2;

      const HDRI_LOCAL = "assets/golden_gate_hills_1k.hdr";
      const HDRI_FALLBACK =
        "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/golden_gate_hills_1k.hdr";
      const BLUE_NOISE_LOCAL = "assets/HDR_L_0.png";

      const PI_VAL = 3.14159265359;
      const MAX_RM_STEPS = 120;
      const MAX_LIGHT_STEPS = 32;
      const MAX_GOD_SAMPLES = 250;

      /* ——— Repo: seeded random ——— */
      function createSeededRandom(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function smoothstepJS(edge0, edge1, x) {
        const t = Math.max(
          0,
          Math.min(1, (x - edge0) / Math.max(1e-5, edge1 - edge0)),
        );
        return t * t * (3 - 2 * t);
      }

      function fbm(perlin, x, y, z, octaves, persistence, lacunarity) {
        let total = 0.0,
          frequency = 1.0,
          amplitude = 1.0,
          maxValue = 0.0;
        for (let i = 0; i < octaves; i++) {
          total += perlin.noise(x * frequency, y * frequency, z * frequency) * amplitude;
          maxValue += amplitude;
          amplitude *= persistence;
          frequency *= lacunarity;
        }
        return total / Math.max(1e-6, maxValue);
      }

      /* Repo-style permutation-table noise (mask textures) */
      function createNoiseGeneratorFromPermutation(permTable) {
        const fade = (t) => t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
        const lerp = (t, a, b) => a + t * (b - a);
        const grad = (hash, x, y, z) => {
          const h = hash & 15;
          const u = h < 8 ? x : y;
          const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
          return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        };
        return function noise(p) {
          const P = new THREE.Vector3(
            Math.floor(p.x),
            Math.floor(p.y),
            Math.floor(p.z),
          );
          const p_fract = p.clone().sub(P);
          const f = new THREE.Vector3(
            fade(p_fract.x),
            fade(p_fract.y),
            fade(p_fract.z),
          );
          const xi = P.x & 255,
            yi = P.y & 255,
            zi = P.z & 255;
          const A = permTable[xi],
            B = permTable[(xi + 1) & 255];
          const AA = permTable[(A + yi) & 255],
            BA = permTable[(B + yi) & 255];
          const AB = permTable[(A + yi + 1) & 255],
            BB = permTable[(B + yi + 1) & 255];
          const AAA = permTable[(AA + zi) & 255],
            BAA = permTable[(BA + zi) & 255];
          const ABA = permTable[(AB + zi) & 255],
            BBA = permTable[(BB + zi) & 255];
          const AAB = permTable[(AA + zi + 1) & 255],
            BAB = permTable[(BA + zi + 1) & 255];
          const ABB = permTable[(AB + zi + 1) & 255],
            BBB = permTable[(BB + zi + 1) & 255];
          const g1 = grad(AAA, p_fract.x, p_fract.y, p_fract.z),
            g2 = grad(BAA, p_fract.x - 1, p_fract.y, p_fract.z);
          const g3 = grad(ABA, p_fract.x, p_fract.y - 1, p_fract.z),
            g4 = grad(BBA, p_fract.x - 1, p_fract.y - 1, p_fract.z);
          const g5 = grad(AAB, p_fract.x, p_fract.y, p_fract.z - 1),
            g6 = grad(BAB, p_fract.x - 1, p_fract.y, p_fract.z - 1);
          const g7 = grad(ABB, p_fract.x, p_fract.y - 1, p_fract.z - 1),
            g8 = grad(BBB, p_fract.x - 1, p_fract.y - 1, p_fract.z - 1);
          return lerp(
            f.z,
            lerp(
              f.y,
              lerp(f.x, g1, g2),
              lerp(f.x, g3, g4),
            ),
            lerp(
              f.y,
              lerp(f.x, g5, g6),
              lerp(f.x, g7, g8),
            ),
          );
        };
      }

      function buildMaskTexture3D(maskSize, freq, seed) {
        const rnd = createSeededRandom(seed);
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(rnd() * (i + 1));
          [p[i], p[j]] = [p[j], p[i]];
        }
        const permTable = new Uint8Array(512);
        for (let i = 0; i < 256; i++) permTable[i] = permTable[i + 256] = p[i];
        const noiseGen = createNoiseGeneratorFromPermutation(permTable);
        const noiseMaskData = new Uint8Array(
          maskSize * maskSize * maskSize,
        );
        const directionVector = new THREE.Vector3();
        for (let z = 0; z < maskSize; z++) {
          for (let y = 0; y < maskSize; y++) {
            for (let x = 0; x < maskSize; x++) {
              directionVector.set(
                (x / (maskSize - 1)) * 2.0 - 1.0,
                (y / (maskSize - 1)) * 2.0 - 1.0,
                (z / (maskSize - 1)) * 2.0 - 1.0,
              );
              if (directionVector.lengthSq() > 0) {
                directionVector.normalize();
                const noiseValue = noiseGen(
                  directionVector.multiplyScalar(freq),
                );
                noiseMaskData[z * maskSize * maskSize + y * maskSize + x] =
                  noiseValue * 128 + 128;
              }
            }
          }
        }
        const t = new THREE.Data3DTexture(
          noiseMaskData,
          maskSize,
          maskSize,
          maskSize,
        );
        t.format = THREE.RedFormat;
        t.minFilter = THREE.LinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.unpackAlignment = 1;
        t.needsUpdate = true;
        return t;
      }

      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.autoClear = false;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);
      await renderer.init();

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0561a0);

      const textureLoader = new THREE.TextureLoader();
      const pmremGenerator = new THREE.PMREMGenerator(renderer);

      async function loadHdri() {
        const tryLoad = (url) =>
          new Promise((resolve, reject) => {
            new HDRLoader().load(url, resolve, undefined, reject);
          });
        try {
          return await tryLoad(HDRI_LOCAL);
        } catch {
          return await tryLoad(HDRI_FALLBACK);
        }
      }

      const hdrTexture = await loadHdri().catch(() => null);
      if (hdrTexture) {
        hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = pmremGenerator.fromEquirectangular(hdrTexture);
        scene.environment = pmrem.texture;
        hdrTexture.dispose();
        pmremGenerator.dispose();
      }

      const progressContainer = document.getElementById("progress-container");
      const progressFill = document.getElementById("progress-fill");

      const stats = new Stats();
      stats.dom.style.position = "absolute";
      stats.dom.style.left = "10px";
      stats.dom.style.top = "10px";
      document.body.appendChild(stats.dom);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        1.0,
        20000,
      );
      camera.position.set(-90, -30, -30);
      camera.layers.enableAll();
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      const timer = new THREE.Timer();
      timer.connect(document);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);
      const sun = new THREE.DirectionalLight(0xffffff, 2.5);
      sun.position.set(1, 1, 1).normalize();
      sun.castShadow = true;
      sun.shadow.camera.left = -50;
      sun.shadow.camera.right = 50;
      sun.shadow.camera.top = 50;
      sun.shadow.camera.bottom = -50;
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = 500;
      sun.shadow.mapSize.width = 2048;
      sun.shadow.mapSize.height = 2048;
      scene.add(sun);

      const sunMaterial = new THREE.MeshBasicMaterial({
        color: 0xffddaa,
        transparent: true,
      });
      const sunSphere = new THREE.Mesh(
        new THREE.SphereGeometry(200, 32, 32),
        sunMaterial,
      );
      sunSphere.position.copy(sun.position).normalize().multiplyScalar(9000);
      sunSphere.layers.set(VOLUME_LAYER);
      scene.add(sunSphere);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({
          color: 0x666666,
          roughness: 0.8,
          side: THREE.DoubleSide,
        }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -40;
      ground.receiveShadow = true;
      ground.layers.set(SOLID_LAYER);
      scene.add(ground);

      const grid = new THREE.GridHelper(200, 50, 0x999999, 0x666666);
      grid.position.y = -39.9;
      grid.layers.set(SOLID_LAYER);
      scene.add(grid);

      const sphereGeom = new THREE.SphereGeometry(15, 32, 16);
      const greenSphere = new THREE.Mesh(
        sphereGeom,
        new THREE.MeshStandardMaterial({
          color: 0x00ff00,
          roughness: 0.3,
          metalness: 0.1,
        }),
      );
      greenSphere.position.set(0, 0, 0);
      greenSphere.castShadow = true;
      greenSphere.layers.set(SOLID_LAYER);
      scene.add(greenSphere);

      const magentaSphere = new THREE.Mesh(
        sphereGeom,
        new THREE.MeshStandardMaterial({
          color: 0xff00ff,
          roughness: 0.3,
          metalness: 0.1,
        }),
      );
      magentaSphere.position.set(0, 0, -50);
      magentaSphere.castShadow = true;
      magentaSphere.layers.set(SOLID_LAYER);
      scene.add(magentaSphere);

      const occluderMeshes = [ground, grid, greenSphere, magentaSphere];

      const renderTargetDefaults = {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat,
        type: THREE.HalfFloatType,
      };

      let w = window.innerWidth;
      let h = window.innerHeight;
      let hw = Math.max(1, Math.floor(w * 0.5));
      let hh = Math.max(1, Math.floor(h * 0.5));

      const depthTarget = new THREE.RenderTarget(w, h);
      depthTarget.depthTexture = new THREE.DepthTexture(w, h);
      depthTarget.depthTexture.format = THREE.DepthFormat;
      depthTarget.depthTexture.type = THREE.UnsignedShortType;

      const occlusionRT = new THREE.RenderTarget(hw, hh, renderTargetDefaults);
      const godraysRT = new THREE.RenderTarget(hw, hh, renderTargetDefaults);
      const finalRT = new THREE.RenderTarget(w, h, renderTargetDefaults);

      const occlusionMaterialBlack = new THREE.MeshBasicMaterial({
        color: 0x000000,
      });
      const occlusionLineBlack = new THREE.LineBasicMaterial({
        color: 0x000000,
      });
      const occlusionMaterialWhite = new THREE.MeshBasicMaterial({
        color: 0xffffff,
      });

      const postScene = new THREE.Scene();
      const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
      postScene.add(postQuad);

      const depthPlaceholder = new THREE.DataTexture(
        new Uint8Array([255]),
        1,
        1,
        THREE.RedFormat,
      );
      depthPlaceholder.needsUpdate = true;
      const depthTexNode = texture(depthPlaceholder, screenUV);

      const parameters = {
        textureSize: 96,
        cloudCoverage: 0.55,
        cloudSoftness: 0.05,
        noiseScale: 3.5,
        octaves: 5,
        persistence: 0.5,
        lacunarity: 3.0,
        noiseIntensity: 1.0,
        seed: Math.random() * 1000.0,
        regenerateTexture() {
          bake3DTexture();
        },
        textureTiling: 2.0,
        densityThreshold: 0.0,
        densityMultiplier: 50.0,
        opacity: 6.0,
        raymarchSteps: 44,
        lightSteps: 1,
        containerScale: 120.0,
        isAnimating: true,
        animationSpeedX: 0.02,
        animationSpeedY: 0.0,
        animationSpeedZ: 0.01,
        ambientLightIntensity: 1.2,
        directionalLightIntensity: 2.5,
        maskSeed: 1,
        raio: 0.52,
        maskSoftness: 0.17,
        forcaRuido: 0.05,
        frequenciaRuido: 2.7,
        achatamentoCima: 0.7,
        achatamentoBaixo: 0.3,
        achatamentoXpos: 0.9,
        achatamentoXneg: 0.9,
        achatamentoZpos: 0.9,
        achatamentoZneg: 0.9,
        seedDetalhe: 10,
        forcaRuidoDetalhe: 0.036,
        frequenciaRuidoDetalhe: 10.5,
        visualizeMask: false,
      };

      let volumeTexture = new THREE.Data3DTexture(new Uint8Array(8), 2, 2, 2);
      volumeTexture.format = THREE.RedFormat;
      volumeTexture.minFilter = THREE.LinearFilter;
      volumeTexture.magFilter = THREE.LinearFilter;
      volumeTexture.needsUpdate = true;

      const volumeTex = texture3D(volumeTexture, null, 0);

      function bake3DTexture() {
        progressContainer.style.display = "block";
        setTimeout(() => {
          const size = parameters.textureSize;
          const data = new Uint8Array(size * size * size);
          const seededRandom = createSeededRandom(parameters.seed);
          const perlin = new ImprovedNoise(seededRandom);
          let index = 0;
          for (let z = 0; z < size; z++) {
            for (let y = 0; y < size; y++) {
              for (let x = 0; x < size; x++) {
                const p = parameters;
                const nx_norm = x / (size - 1);
                const ny_norm = y / (size - 1);
                const nz_norm = z / (size - 1);
                const base_x = nx_norm * p.noiseScale + p.seed;
                const base_y = ny_norm * p.noiseScale + p.seed;
                const base_z = nz_norm * p.noiseScale + p.seed;
                const scale = p.noiseScale;
                const fbmArgs = [p.octaves, p.persistence, p.lacunarity];
                const n1 = fbm(perlin, base_x, base_y, base_z, ...fbmArgs);
                const n2 = fbm(perlin, base_x - scale, base_y, base_z, ...fbmArgs);
                const n3 = fbm(perlin, base_x, base_y - scale, base_z, ...fbmArgs);
                const n4 = fbm(perlin, base_x, base_y, base_z - scale, ...fbmArgs);
                const n5 = fbm(
                  perlin,
                  base_x - scale,
                  base_y - scale,
                  base_z,
                  ...fbmArgs,
                );
                const n6 = fbm(
                  perlin,
                  base_x - scale,
                  base_y,
                  base_z - scale,
                  ...fbmArgs,
                );
                const n7 = fbm(
                  perlin,
                  base_x,
                  base_y - scale,
                  base_z - scale,
                  ...fbmArgs,
                );
                const n8 = fbm(
                  perlin,
                  base_x - scale,
                  base_y - scale,
                  base_z - scale,
                  ...fbmArgs,
                );
                const w_x = 1 - nx_norm;
                const w_y = 1 - ny_norm;
                const w_z = 1 - nz_norm;
                let noiseValue =
                  n1 * w_x * w_y * w_z +
                  n2 * nx_norm * w_y * w_z +
                  n3 * w_x * ny_norm * w_z +
                  n4 * w_x * w_y * nz_norm +
                  n5 * nx_norm * ny_norm * w_z +
                  n6 * nx_norm * w_y * nz_norm +
                  n7 * w_x * ny_norm * nz_norm +
                  n8 * nx_norm * ny_norm * nz_norm;
                noiseValue = (noiseValue + 1.0) / 2.0;
                const finalValue = Math.pow(noiseValue, parameters.noiseIntensity);
                const density = smoothstepJS(
                  p.cloudCoverage - p.cloudSoftness,
                  p.cloudCoverage + p.cloudSoftness,
                  finalValue,
                );
                data[index++] = Math.floor(density * 255);
              }
            }
            progressFill.style.width = ((z + 1) / size) * 100 + "%";
          }
          if (volumeTexture) volumeTexture.dispose();
          volumeTexture = new THREE.Data3DTexture(data, size, size, size);
          volumeTexture.format = THREE.RedFormat;
          volumeTexture.minFilter = THREE.LinearFilter;
          volumeTexture.magFilter = THREE.LinearFilter;
          volumeTexture.unpackAlignment = 1;
          volumeTexture.wrapS = THREE.RepeatWrapping;
          volumeTexture.wrapT = THREE.RepeatWrapping;
          volumeTexture.wrapR = THREE.RepeatWrapping;
          volumeTexture.needsUpdate = true;
          volumeTex.value = volumeTexture;
          progressContainer.style.display = "none";
          progressFill.style.width = "0%";
        }, 10);
      }

      let maskTexture = buildMaskTexture3D(
        128,
        parameters.frequenciaRuido,
        parameters.maskSeed,
      );
      let detailMaskTexture = buildMaskTexture3D(
        128,
        parameters.frequenciaRuidoDetalhe,
        parameters.seedDetalhe,
      );

      let blueNoise2D = null;
      try {
        blueNoise2D = await textureLoader.loadAsync(BLUE_NOISE_LOCAL);
      } catch {
        blueNoise2D = null;
      }
      if (!blueNoise2D) {
        const data = new Uint8Array(128 * 128 * 4);
        let state = 1337 >>> 0;
        const rnd = () => {
          state ^= state << 13;
          state ^= state >>> 17;
          state ^= state << 5;
          return (state >>> 0) % 256;
        };
        for (let i = 0; i < 128 * 128; i++) {
          const v = rnd();
          data[i * 4] = v;
          data[i * 4 + 1] = v;
          data[i * 4 + 2] = v;
          data[i * 4 + 3] = 255;
        }
        blueNoise2D = new THREE.DataTexture(data, 128, 128, THREE.RGBAFormat);
        blueNoise2D.needsUpdate = true;
      }
      blueNoise2D.wrapS = THREE.RepeatWrapping;
      blueNoise2D.wrapT = THREE.RepeatWrapping;
      blueNoise2D.minFilter = THREE.NearestFilter;
      blueNoise2D.magFilter = THREE.NearestFilter;

      const uTextureTiling = uniform(parameters.textureTiling);
      const uTextureOffset = uniform(new THREE.Vector3());
      const uOpacity = uniform(parameters.opacity);
      const uMaxSteps = uniform(parameters.raymarchSteps);
      const uLightSteps = uniform(parameters.lightSteps);
      const uDensityThreshold = uniform(parameters.densityThreshold);
      const uDensityMultiplier = uniform(parameters.densityMultiplier);
      const uCameraNear = uniform(camera.near);
      const uCameraFar = uniform(camera.far);
      const uResolution = uniform(new THREE.Vector2(w, h));
      const uBlueNoiseSize = uniform(
        new THREE.Vector2(
          blueNoise2D.image.width,
          blueNoise2D.image.height,
        ),
      );
      const uSunColor = uniform(sun.color.clone());
      const uSunIntensity = uniform(parameters.directionalLightIntensity);
      const uAmbientIntensity = uniform(parameters.ambientLightIntensity);
      const uAmbientColor = uniform(ambientLight.color.clone());
      const uLightDir = uniform(sun.position.clone());
      const uOcclusionMode = uniform(0);

      const u_mask_raio = uniform(parameters.raio);
      const u_mask_achatamentoCima = uniform(parameters.achatamentoCima);
      const u_mask_achatamentoBaixo = uniform(parameters.achatamentoBaixo);
      const u_mask_achatamentoXpos = uniform(parameters.achatamentoXpos);
      const u_mask_achatamentoXneg = uniform(parameters.achatamentoXneg);
      const u_mask_achatamentoZpos = uniform(parameters.achatamentoZpos);
      const u_mask_achatamentoZneg = uniform(parameters.achatamentoZneg);
      const u_mask_softness = uniform(parameters.maskSoftness);
      const u_mask_forcaRuido = uniform(parameters.forcaRuido);
      const u_mask_forcaRuidoDetalhe = uniform(parameters.forcaRuidoDetalhe);
      const u_mask_visualize = uniform(parameters.visualizeMask ? 1 : 0);

      const maskTex = texture3D(maskTexture, null, 0);
      const detailMaskTex = texture3D(detailMaskTexture, null, 0);

      function rebuildMaskTextures() {
        if (maskTexture) maskTexture.dispose();
        if (detailMaskTexture) detailMaskTexture.dispose();
        maskTexture = buildMaskTexture3D(
          128,
          parameters.frequenciaRuido,
          parameters.maskSeed,
        );
        detailMaskTexture = buildMaskTexture3D(
          128,
          parameters.frequenciaRuidoDetalhe,
          parameters.seedDetalhe,
        );
        maskTex.value = maskTexture;
        detailMaskTex.value = detailMaskTexture;
      }

      const hitBox = Fn(({ orig, dir }) => {
        const box_min = vec3(-0.5);
        const box_max = vec3(0.5);
        const inv_dir = vec3(1).div(dir);
        const tmin_tmp = box_min.sub(orig).mul(inv_dir);
        const tmax_tmp = box_max.sub(orig).mul(inv_dir);
        const tmin = min(tmin_tmp, tmax_tmp);
        const tmax = max(tmin_tmp, tmax_tmp);
        const t0 = max(tmin.x, max(tmin.y, tmin.z));
        const t1 = min(tmax.x, min(tmax.y, tmax.z));
        return vec2(t0, t1);
      });

      const EXTINCTION_MULT = vec3(0.6, 0.65, 0.7);
      const DUAL_LOBE_WEIGHT = float(0.8);
      const PHASE_G = float(0.3);

      const HenyeyGreenstein = Fn(([g, mu]) => {
        const gg = g.mul(g);
        const denom = float(1.0).add(gg).sub(g.mul(mu).mul(2.0));
        return float(1.0)
          .sub(gg)
          .div(pow(denom, float(1.5)))
          .mul(float(1.0 / (4.0 * PI_VAL)));
      });

      const PhaseFunction = Fn(([mu]) =>
        HenyeyGreenstein(PHASE_G.negate(), mu)
          .mul(float(1.0).sub(DUAL_LOBE_WEIGHT))
          .add(HenyeyGreenstein(PHASE_G, mu).mul(DUAL_LOBE_WEIGHT)),
      );

      const linearizeDepth = Fn(([d, zNear, zFar]) => {
        const lin = zNear.mul(zFar).div(zFar.add(d.mul(zNear.sub(zFar))));
        return d.greaterThanEqual(float(0.999999)).select(zFar, lin);
      });

      const vOriginVar = varying(
        vec3(modelWorldMatrixInverse.mul(vec4(cameraPosition, 1.0)).xyz),
      );
      const vDirectionVar = varying(positionGeometry.sub(vOriginVar));

      const getMaskFactor = Fn(([p]) => {
        const sy = u_mask_achatamentoCima
          .add(u_mask_achatamentoBaixo)
          .mul(0.5)
          .add(
            p.y
              .sign()
              .mul(u_mask_achatamentoCima.sub(u_mask_achatamentoBaixo))
              .mul(0.5),
          )
          .max(0.05);
        const sx = u_mask_achatamentoXpos
          .add(u_mask_achatamentoXneg)
          .mul(0.5)
          .add(
            p.x
              .sign()
              .mul(u_mask_achatamentoXpos.sub(u_mask_achatamentoXneg))
              .mul(0.5),
          )
          .max(0.05);
        const sz = u_mask_achatamentoZpos
          .add(u_mask_achatamentoZneg)
          .mul(0.5)
          .add(
            p.z
              .sign()
              .mul(u_mask_achatamentoZpos.sub(u_mask_achatamentoZneg))
              .mul(0.5),
          )
          .max(0.05);
        const pDistorted = vec3(
          p.x.div(sx),
          p.y.div(sy),
          p.z.div(sz),
        );
        const dist = length(pDistorted);
        const dir = normalize(pDistorted.add(vec3(0.0001)));
        const tex_coord = dir
          .mul(u_mask_raio)
          .mul(0.5)
          .add(0.5)
          .clamp(0.0, 1.0);
        const noisePrincipal = maskTex
          .sample(tex_coord)
          .r.mul(2.0)
          .sub(1.0);
        const noiseDet = detailMaskTex
          .sample(tex_coord)
          .r.mul(2.0)
          .sub(1.0);
        const dispP = noisePrincipal.mul(u_mask_forcaRuido);
        const dispD = noiseDet.mul(u_mask_forcaRuidoDetalhe);
        const sdf = u_mask_raio.add(dispP).add(dispD).sub(dist);
        return smoothstep(float(0.0), u_mask_softness, sdf);
      });

      const getDensity = Fn(([p]) => {
        const maskFactor = getMaskFactor(p);
        const texCoord = p
          .add(0.5)
          .mul(uTextureTiling)
          .add(uTextureOffset)
          .fract();
        const noiseDensity = volumeTex.sample(texCoord).r;
        const visualize = u_mask_visualize.greaterThan(0.5);
        const finalDensity = visualize.select(float(1.0), noiseDensity);
        const passThresh = visualize.or(
          noiseDensity.greaterThanEqual(uDensityThreshold),
        );
        const contrib = finalDensity
          .mul(uDensityMultiplier)
          .mul(maskFactor);
        const inner = passThresh.select(contrib, float(0));
        return maskFactor.greaterThan(0.0).select(inner, float(0));
      });

      const CalculateLightEnergy = Fn(([samplePos, lightDirWorld]) => {
        const stepLength = float(1.0).div(uLightSteps.max(1));
        const lightRayDensity = float(0.0).toVar();
        Loop(MAX_LIGHT_STEPS, ({ i: li }) => {
          If(uLightSteps.lessThanEqual(0), () => Break());
          If(float(li).greaterThanEqual(uLightSteps), () => Break());
          const t = float(li).add(0.5).mul(stepLength);
          const lp = samplePos.add(lightDirWorld.mul(t));
          const inB = lp.x
            .greaterThan(-0.5)
            .and(lp.x.lessThan(0.5))
            .and(lp.y.greaterThan(-0.5))
            .and(lp.y.lessThan(0.5))
            .and(lp.z.greaterThan(-0.5))
            .and(lp.z.lessThan(0.5));
          If(inB, () => {
            lightRayDensity.addAssign(getDensity(lp).mul(stepLength));
          });
        });
        return exp(lightRayDensity.negate());
      });

      const blueNoiseSample = texture(
        blueNoise2D,
        fract(screenUV.mul(uResolution).div(uBlueNoiseSize)),
      );

      const cloudColorNode = Fn(() => {
        const rayDir = normalize(vDirectionVar);
        const bounds = hitBox({ orig: vOriginVar, dir: rayDir }).toVar();
        If(bounds.x.greaterThanEqual(bounds.y), () => Discard());
        bounds.x.assign(max(bounds.x, 0.0));
        const rayLength = bounds.y.sub(bounds.x);
        If(rayLength.lessThan(0.001), () => Discard());

        const stepSize = rayLength.div(uMaxSteps.max(1));
        const jitter = blueNoiseSample.r;
        const sceneDepthSample = depthTexNode.r;
        const sceneLinearDistance = linearizeDepth(
          sceneDepthSample,
          uCameraNear,
          uCameraFar,
        );

        const mu = dot(rayDir, normalize(uLightDir)).toVar();
        const fade_zone = stepSize.mul(2.0);

        const accumulatedColor = vec3(0.0).toVar();
        const transmittance = vec3(1.0, 1.0, 1.0).toVar();
        const lightDirWorld = normalize(uLightDir);

        Loop(MAX_RM_STEPS, ({ i: ii }) => {
          If(float(ii).greaterThanEqual(uMaxSteps), () => Break());

          const dist_traveled = float(ii)
            .mul(stepSize)
            .add(jitter.mul(stepSize));
          const dist_remaining = rayLength.sub(dist_traveled);
          If(dist_remaining.lessThan(0.0), () => Break());

          const travel = bounds.x.add(jitter.mul(stepSize)).add(float(ii).mul(stepSize));
          const p = vOriginVar.add(rayDir.mul(travel));

          const viewSpacePos = modelViewMatrix.mul(vec4(p, 1.0));
          const rayPointDistance = abs(
            viewSpacePos.z.div(viewSpacePos.w.max(1e-6)),
          );
          If(rayPointDistance.greaterThan(sceneLinearDistance), () => Break());

          const density = getDensity(p).toVar();

          If(density.greaterThan(0.01), () => {
            const lightEnergy = CalculateLightEnergy(p, lightDirWorld);
            const sunLuminance = uSunColor
              .mul(uSunIntensity)
              .mul(lightEnergy);
            const sunScattering = sunLuminance.mul(PhaseFunction(mu));
            const ambientLuminance = uAmbientColor.mul(
              uAmbientIntensity,
            );
            const ambientScattering = ambientLuminance;
            const totalScattering = sunScattering
              .add(ambientScattering)
              .mul(density)
              .mul(stepSize);
            const fade_alpha = smoothstep(
              float(0.0),
              fade_zone,
              dist_remaining,
            );
            const scaledScatter = totalScattering.mul(fade_alpha);
            const stepTransmittance = exp(
              density
                .mul(stepSize)
                .mul(uOpacity)
                .mul(EXTINCTION_MULT)
                .negate(),
            );
            accumulatedColor.addAssign(transmittance.mul(scaledScatter));
            transmittance.mulAssign(stepTransmittance);
            If(length(transmittance).lessThan(0.01), () => Break());
          });
        });

        If(uOcclusionMode.greaterThan(0.5), () => {
          accumulatedColor.assign(vec3(0.0));
        });

        const alpha = float(1.0).sub(transmittance.r);
        return vec4(accumulatedColor, alpha);
      });

      const cloudMat = new THREE.MeshBasicNodeMaterial();
      cloudMat.colorNode = cloudColorNode();
      cloudMat.transparent = true;
      cloudMat.side = THREE.BackSide;
      cloudMat.depthWrite = false;
      cloudMat.depthTest = false;

      const cloudMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        cloudMat,
      );
      cloudMesh.scale.setScalar(parameters.containerScale);
      cloudMesh.layers.set(VOLUME_LAYER);
      scene.add(cloudMesh);

      occluderMeshes.push(cloudMesh);

      const originalMaterials = new Map();

      /* TextureNode (not uniform(texture)): `texture(uniform(tex))` breaks TSL texture(). */
      const occlusionTexForGodRays = texture(occlusionRT.texture);
      const godraysResultTex = texture(godraysRT.texture);
      /* Screen UV matching TSL getScreenPosition (y=0 top); not raw NDC. */
      const godRaysLightUv = uniform(new THREE.Vector2(0.5, 0.5));
      const godRaysSunColor = uniform(new THREE.Color(0xffddaa));
      const godRaysDensity = uniform(0.98);
      const godRaysDecay = uniform(0.98);
      const godRaysWeight = uniform(0.4);
      const godRaysExposure = uniform(0.4);
      const godRaysSamples = uniform(120);

      const godRaysNodeFixed = Fn(() => {
        /* Same radial march as reference; lightPos must be WebGPU post UV (getScreenPosition). */
        const vUv = uv();
        const lightPos = vec2(godRaysLightUv.x, godRaysLightUv.y);
        const delta = lightPos.sub(vUv);
        const step = delta.div(godRaysSamples.max(1));
        const colorAcc = vec3(0).toVar();
        const illuminationDecay = float(1.0).toVar();
        Loop(MAX_GOD_SAMPLES, ({ i: gi }) => {
          If(float(gi).greaterThanEqual(godRaysSamples), () => Break());
          const sampleCoord = vUv.add(float(gi).mul(step));
          const sc = texture(occlusionTexForGodRays, sampleCoord);
          colorAcc.addAssign(
            sc.rgb.mul(illuminationDecay).mul(godRaysWeight),
          );
          illuminationDecay.mulAssign(godRaysDecay);
        });
        return vec4(
          colorAcc
            .mul(godRaysSunColor)
            .mul(godRaysDensity)
            .mul(godRaysExposure),
          1.0,
        );
      });

      const godRaysMat = new THREE.MeshBasicNodeMaterial();
      godRaysMat.colorNode = godRaysNodeFixed();
      godRaysMat.depthTest = false;
      godRaysMat.depthWrite = false;

      const finalSceneTex = texture(finalRT.texture);
      const compositeMat = new THREE.MeshBasicNodeMaterial();
      compositeMat.colorNode = texture(godraysResultTex, uv());
      compositeMat.transparent = true;
      compositeMat.blending = THREE.AdditiveBlending;
      compositeMat.depthTest = false;
      compositeMat.depthWrite = false;

      const screenMat = new THREE.MeshBasicNodeMaterial();
      /* WebGPU: RT → canvas blit is Y-flipped vs WebGL-style UV; fix upright scene. */
      const blitUV = vec2(uv().x, float(1.0).sub(uv().y));
      screenMat.colorNode = texture(finalSceneTex, blitUV);
      screenMat.depthTest = false;
      screenMat.depthWrite = false;

      bake3DTexture();

      const gui = new GUI({ title: "Controls" });
      const folderGen = gui.addFolder("Texture Generation (Requires Regenerate)");
      folderGen
        .add(parameters, "textureSize", [32, 64, 96, 128, 256])
        .name("Texture Resolution");
      folderGen
        .add(parameters, "cloudCoverage", 0.0, 1.0, 0.01)
        .name("Coverage / Threshold");
      folderGen
        .add(parameters, "cloudSoftness", 0.0, 0.5, 0.005)
        .name("Edge Softness");
      folderGen
        .add(parameters, "noiseScale", 0.1, 20.0, 0.1)
        .name("Scale (Zoom)");
      folderGen.add(parameters, "octaves", 1, 8, 1).name("Octaves (Detail)");
      folderGen
        .add(parameters, "persistence", 0.1, 1.0, 0.01)
        .name("Persistence");
      folderGen
        .add(parameters, "lacunarity", 1.1, 4.0, 0.1)
        .name("Lacunarity");
      folderGen
        .add(parameters, "noiseIntensity", 0.1, 5.0, 0.05)
        .name("Noise Intensity");
      folderGen.add(parameters, "seed", 0, 1000, 0.01).name("Seed");
      folderGen
        .add(parameters, "regenerateTexture")
        .name("▶ Generate New Texture");
      folderGen.open();

      const folderShape = gui.addFolder("Cloud Shape (Real-time)");
      folderShape
        .add(parameters, "textureTiling", 1, 10, 1)
        .name("Tiling")
        .onChange((v) => (uTextureTiling.value = v));
      folderShape.open();

      const folderRender = gui.addFolder("Material & Rendering (Real-time)");
      folderRender
        .add(parameters, "densityThreshold", 0.0, 1.0, 0.01)
        .name("Density Threshold")
        .onChange((v) => (uDensityThreshold.value = v));
      folderRender
        .add(parameters, "densityMultiplier", 0.0, 100.0, 0.1)
        .name("Density Multiplier")
        .onChange((v) => (uDensityMultiplier.value = v));
      folderRender
        .add(parameters, "opacity", 0, 20, 0.1)
        .name("Overall Opacity")
        .onChange((v) => (uOpacity.value = v));
      folderRender
        .add(parameters, "raymarchSteps", 10, MAX_RM_STEPS, 1)
        .name("Quality (Steps)")
        .onChange((v) => (uMaxSteps.value = v));
      folderRender
        .add(parameters, "lightSteps", 0, MAX_LIGHT_STEPS, 1)
        .name("Internal Shadow Quality")
        .onChange((v) => (uLightSteps.value = v));
      folderRender
        .add(parameters, "containerScale", 1.0, 10000.0, 1.0)
        .name("Container Scale")
        .onChange((v) => cloudMesh.scale.setScalar(v));
      folderRender.open();

      const maskFolder = gui.addFolder("Cloud Shape (Mask)");
      maskFolder
        .add(parameters, "visualizeMask")
        .name("Visualize Mask")
        .onChange((v) => (u_mask_visualize.value = v ? 1 : 0));
      maskFolder
        .add(parameters, "maskSeed", 0, 100, 1)
        .name("Seed")
        .onChange(() => rebuildMaskTextures());
      maskFolder
        .add(parameters, "frequenciaRuido", 0.1, 10.0, 0.1)
        .name("Noise Frequency")
        .onChange(() => rebuildMaskTextures());
      maskFolder
        .add(parameters, "raio", 0.1, 0.7, 0.01)
        .name("Mask Radius")
        .onChange((v) => (u_mask_raio.value = v));
      maskFolder
        .add(parameters, "maskSoftness", 0.0, 0.5, 0.005)
        .name("Edge Softness")
        .onChange((v) => (u_mask_softness.value = v));
      maskFolder
        .add(parameters, "forcaRuido", 0, 0.5, 0.01)
        .name("Noise Strength (Deform.)")
        .onChange((v) => (u_mask_forcaRuido.value = v));
      const flatFolder = maskFolder.addFolder("Flattening");
      flatFolder
        .add(parameters, "achatamentoCima", 0.1, 2.0, 0.05)
        .name("Top (Y+)")
        .onChange((v) => (u_mask_achatamentoCima.value = v));
      flatFolder
        .add(parameters, "achatamentoBaixo", 0.1, 2.0, 0.05)
        .name("Bottom (Y-)")
        .onChange((v) => (u_mask_achatamentoBaixo.value = v));
      flatFolder
        .add(parameters, "achatamentoXpos", 0.1, 2.0, 0.05)
        .name("Right (X+)")
        .onChange((v) => (u_mask_achatamentoXpos.value = v));
      flatFolder
        .add(parameters, "achatamentoXneg", 0.1, 2.0, 0.05)
        .name("Left (X-)")
        .onChange((v) => (u_mask_achatamentoXneg.value = v));
      flatFolder
        .add(parameters, "achatamentoZpos", 0.1, 2.0, 0.05)
        .name("Front (Z+)")
        .onChange((v) => (u_mask_achatamentoZpos.value = v));
      flatFolder
        .add(parameters, "achatamentoZneg", 0.1, 2.0, 0.05)
        .name("Back (Z-)")
        .onChange((v) => (u_mask_achatamentoZneg.value = v));
      const detailFolder = maskFolder.addFolder("Detail Noise");
      detailFolder
        .add(parameters, "seedDetalhe", 0, 100, 1)
        .name("Seed")
        .onChange(() => rebuildMaskTextures());
      detailFolder
        .add(parameters, "frequenciaRuidoDetalhe", 0.1, 25.0, 0.1)
        .name("Detail Frequency")
        .onChange(() => rebuildMaskTextures());
      detailFolder
        .add(parameters, "forcaRuidoDetalhe", 0, 0.1, 0.001)
        .name("Detail Strength")
        .onChange((v) => (u_mask_forcaRuidoDetalhe.value = v));
      maskFolder.open();

      const folderAnim = gui.addFolder("Texture Animation");
      folderAnim.add(parameters, "isAnimating").name("▶ Animate Cloud");
      folderAnim
        .add(parameters, "animationSpeedX", -0.2, 0.2, 0.001)
        .name("Speed X");
      folderAnim
        .add(parameters, "animationSpeedY", -0.2, 0.2, 0.001)
        .name("Speed Y");
      folderAnim
        .add(parameters, "animationSpeedZ", -0.2, 0.2, 0.001)
        .name("Speed Z");
      folderAnim.open();

      const folderLighting = gui.addFolder("Lighting");
      folderLighting
        .add(parameters, "ambientLightIntensity", 0.0, 10.0, 0.05)
        .name("Ambient Light")
        .onChange((v) => {
          ambientLight.intensity = v;
          uAmbientIntensity.value = v;
        });
      folderLighting
        .add(parameters, "directionalLightIntensity", 0.0, 10.0, 0.1)
        .name("Directional Light")
        .onChange((v) => {
          sun.intensity = v;
          uSunIntensity.value = v;
        });
      folderLighting.open();

      const folderGodRays = gui.addFolder("God Rays");
      folderGodRays
        .add(godRaysDensity, "value", 0, 1, 0.01)
        .name("Density");
      folderGodRays.add(godRaysDecay, "value", 0.8, 1, 0.001).name("Decay");
      folderGodRays.add(godRaysWeight, "value", 0, 1, 0.01).name("Weight");
      folderGodRays
        .add(godRaysExposure, "value", 0, 1, 0.01)
        .name("Exposure");
      folderGodRays
        .add(godRaysSamples, "value", 10, MAX_GOD_SAMPLES, 1)
        .name("Samples");
      folderGodRays.open();

      function resizeTargets() {
        w = window.innerWidth;
        h = window.innerHeight;
        hw = Math.max(1, Math.floor(w * 0.5));
        hh = Math.max(1, Math.floor(h * 0.5));
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        depthTarget.setSize(w, h);
        if (depthTarget.depthTexture) depthTarget.depthTexture.dispose();
        depthTarget.depthTexture = new THREE.DepthTexture(w, h);
        depthTarget.depthTexture.format = THREE.DepthFormat;
        depthTarget.depthTexture.type = THREE.UnsignedShortType;
        depthTexNode.value = depthTarget.depthTexture;
        occlusionRT.setSize(hw, hh);
        godraysRT.setSize(hw, hh);
        finalRT.setSize(w, h);
        occlusionTexForGodRays.value = occlusionRT.texture;
        godraysResultTex.value = godraysRT.texture;
        finalSceneTex.value = finalRT.texture;
        uResolution.value.set(w, h);
        uCameraNear.value = camera.near;
        uCameraFar.value = camera.far;
      }

      window.addEventListener("resize", resizeTargets);

      renderer.setAnimationLoop(() => {
        stats.update();
        controls.update();
        timer.update();
        const delta = timer.getDelta();

        sunSphere.position.copy(sun.position).normalize().multiplyScalar(9000);
        uLightDir.value.copy(sun.position);
        uSunColor.value.copy(sun.color);
        uAmbientColor.value.copy(ambientLight.color);

        if (parameters.isAnimating) {
          uTextureOffset.value.x += parameters.animationSpeedX * delta;
          uTextureOffset.value.y += parameters.animationSpeedY * delta;
          uTextureOffset.value.z += parameters.animationSpeedZ * delta;
          uTextureOffset.value.x -= Math.floor(uTextureOffset.value.x);
          uTextureOffset.value.y -= Math.floor(uTextureOffset.value.y);
          uTextureOffset.value.z -= Math.floor(uTextureOffset.value.z);
        }

        camera.layers.set(SOLID_LAYER);
        renderer.setRenderTarget(depthTarget);
        renderer.clear();
        renderer.render(scene, camera);

        depthTexNode.value = depthTarget.depthTexture;

        const bgSaved = scene.background;
        scene.background = new THREE.Color(0x000000);
        sunSphere.material = occlusionMaterialWhite;
        uOcclusionMode.value = 1;
        for (const o of occluderMeshes) {
          if (o !== cloudMesh) {
            originalMaterials.set(o.uuid, o.material);
            o.material = o.isLineSegments
              ? occlusionLineBlack
              : occlusionMaterialBlack;
          }
        }

        camera.layers.enable(SOLID_LAYER);
        camera.layers.enable(VOLUME_LAYER);
        renderer.setRenderTarget(occlusionRT);
        renderer.clear();
        renderer.render(scene, camera);

        sunSphere.material = sunMaterial;
        uOcclusionMode.value = 0;
        for (const o of occluderMeshes) {
          if (o !== cloudMesh && originalMaterials.has(o.uuid)) {
            o.material = originalMaterials.get(o.uuid);
          }
        }
        originalMaterials.clear();
        scene.background = bgSaved;
        camera.layers.enableAll();

        occlusionTexForGodRays.value = occlusionRT.texture;
        const sunNdc = new THREE.Vector3()
          .copy(sunSphere.position)
          .project(camera);
        godRaysLightUv.value.set(
          sunNdc.x * 0.5 + 0.5,
          1.0 - (sunNdc.y * 0.5 + 0.5),
        );

        postQuad.material = godRaysMat;
        renderer.setRenderTarget(godraysRT);
        renderer.clear();
        renderer.render(postScene, postCam);
        godraysResultTex.value = godraysRT.texture;

        camera.layers.enableAll();
        renderer.setRenderTarget(finalRT);
        renderer.clear();
        renderer.render(scene, camera);

        finalSceneTex.value = finalRT.texture;
        postQuad.material = compositeMat;
        renderer.autoClear = false;
        renderer.setRenderTarget(finalRT);
        renderer.render(postScene, postCam);
        renderer.autoClear = true;

        postQuad.material = screenMat;
        renderer.setRenderTarget(null);
        renderer.clear();
        renderer.render(postScene, postCam);
      });
    </script>
  </body>
</html>
