<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient FX Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

      .tp-dfwv {
        position: fixed !important;
        top: 16px !important;
        right: 16px !important;
        width: 280px !important;
        z-index: 20;
        max-height: calc(100vh - 32px) !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
      }

      #info {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 20;
        font: 12px/1.5 "SF Mono", monospace;
        color: #aaa;
        background: rgba(0,0,0,0.6);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
      }

      #fx-label {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 20;
        font: bold 14px "SF Mono", monospace;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(40, 40, 40, 0.85);
        color: #7df;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="fx-label">Ambient FX Editor</div>
    <div id="info">Select an effect type to begin</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        color, cos, float, mix, normalWorld, sin, smoothstep, step,
        texture, time, uniform, uv, vec2, vec3, vec4,
        positionLocal, positionWorld, instanceIndex, hash, attribute,
        mx_noise_float,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import { createButterflyFX, buildButterflyUI } from "./fx-butterflies.js";
      import { createEmberFX, buildEmberUI } from "./fx-embers.js";
      import { createFlowingLines } from "./flowing-lines.js";
      import { createFloatingLeavesFX, buildFloatingLeavesUI } from "./fx-floating-leaves.js";
      import { createRainFX, buildRainUI } from "./fx-rain.js";
      import {
        createBillboardCloudFX,
        buildBillboardCloudUI,
      } from "./fx-billboard-clouds.js";

      // ─── Globals ──────────────────────────────────────────────────────
      let camera, scene, renderer, controls, timer;
      let cloudShadowUniforms = null;
      const infoEl = document.getElementById("info");
      const labelEl = document.getElementById("fx-label");

      // ─── Shared params ────────────────────────────────────────────────
      const shared = {
        effect:    "none",
        timeOfDay: 0.35,       // 0 = midnight, 0.5 = noon, 1 = midnight
        windX:     1.0,
        windZ:     0.3,
        windStrength: 1.0,
        density:   1.0,
        groundY:   0.0,
        volume:    30,         // spawn volume radius
        showGround: true,
        bgColor:   "#87CEEB",
      };

      // ─── Cloud shadow params (terrain-side, procedural) ───────────────
      const cloudShadow = {
        enabled:       true,
        intensity:     0.55,   // 0 = no darkening, 1 = full darken
        coverage:      0.5,    // noise threshold center
        softness:      0.18,   // smoothstep half-width around threshold
        scale:         0.04,   // spatial frequency (1/world-units)
        speed:         2.5,    // world-units of drift per second
        useSharedWind: true,
        windX:         1.0,
        windZ:         0.3,
      };

      // ─── Effect registry ──────────────────────────────────────────────
      // Each effect module will register here: { create, update, dispose }
      const effects = {};
      let activeEffect = null;
      let activeEffectName = "none";

      // ─── Tweakpane refs (must be declared before init) ────────────────
      let pane, fxFolder;

      // Simple terrain height used for both the ground mesh and flowing lines.
      function terrainHeight(x, z) {
        const base =
          (Math.sin(x * 0.25) * Math.cos(z * 0.2) * 0.5 +
            Math.sin(x * 0.15 + z * 0.1) * 0.3 +
            Math.cos(z * 0.3 + x * 0.05) * 0.2);
        // Slight overall scaling so bumps are clearly visible
        return base * 3.0;
      }

      // ─── Init ─────────────────────────────────────────────────────────
      init();

      async function init() {
        timer = new THREE.Timer();

        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(shared.bgColor);

        // Camera
        camera = new THREE.PerspectiveCamera(
          50, window.innerWidth / window.innerHeight, 0.1, 600
        );
        camera.position.set(12, 10, 18);

        // Renderer
        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 2, 0);

        // ─── Lighting ───────────────────────────────────────────────
        const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        scene.add(dirLight);

        // Store refs for time-of-day updates
        scene.userData.dirLight = dirLight;
        scene.userData.ambLight = ambLight;

        // ─── Ground plane with gentle bumps ─────────────────────────
        const groundSize = 80;
        const groundRes  = 64;
        const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, groundRes, groundRes);

        // Cloud-shadow uniforms (synced each frame in animate()).
        const uCsEnabled   = uniform(cloudShadow.enabled ? 1.0 : 0.0);
        const uCsIntensity = uniform(cloudShadow.intensity);
        const uCsCoverage  = uniform(cloudShadow.coverage);
        const uCsSoftness  = uniform(cloudShadow.softness);
        const uCsScale     = uniform(cloudShadow.scale);
        const uCsSpeed     = uniform(cloudShadow.speed);
        const uCsWind      = uniform(new THREE.Vector2(cloudShadow.windX, cloudShadow.windZ));
        const uCsBaseColor = uniform(new THREE.Color(0x3b6a3b));
        cloudShadowUniforms = {
          enabled: uCsEnabled,
          intensity: uCsIntensity,
          coverage: uCsCoverage,
          softness: uCsSoftness,
          scale: uCsScale,
          speed: uCsSpeed,
          wind: uCsWind,
        };

        const groundMat = new THREE.MeshStandardNodeMaterial({
          roughness: 0.9,
          metalness: 0.0,
        });
        // Terrain-side cloud shadows: 2-octave FBM at world XZ, drifting with wind.
        // The cloud-shadow term multiplies into albedo BEFORE lighting, so shadowed
        // patches read as cooler/darker even under direct sun. Pure procedural — no
        // 1:1 match with billboard cards above, just visually coherent drift.
        const csDrift = uCsWind.mul(time).mul(uCsSpeed);
        const csWXZ = positionWorld.xz.add(csDrift).mul(uCsScale);
        const csN1 = mx_noise_float(vec3(csWXZ.x, 0.0, csWXZ.y));
        const csN2 = mx_noise_float(vec3(csWXZ.x.mul(2.13), 1.0, csWXZ.y.mul(2.07)));
        const csNoise01 = csN1.mul(0.65).add(csN2.mul(0.35)).mul(0.5).add(0.5);
        const csLo = uCsCoverage.sub(uCsSoftness);
        const csHi = uCsCoverage.add(uCsSoftness);
        const csCover = smoothstep(csLo, csHi, csNoise01);
        const csShadowAmount = csCover.mul(uCsIntensity).mul(uCsEnabled);
        groundMat.colorNode = uCsBaseColor.mul(float(1.0).sub(csShadowAmount));
        const ground = new THREE.Mesh(groundGeo, groundMat);
        // Displace vertices along local Z, then rotate the plane so this becomes world Y.
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          const h = terrainHeight(x, y);
          pos.setZ(i, h);
        }
        pos.needsUpdate = true;
        groundGeo.computeVertexNormals();
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);
        scene.userData.ground = ground;

        // ─── Optional grid helper (kept off to avoid flattening the look) ─────
        const grid = new THREE.GridHelper(80, 40, 0x222222, 0x151515);
        grid.position.y = 0.02;
        grid.visible = false;
        scene.add(grid);
        scene.userData.grid = grid;

        // ─── Tweakpane ──────────────────────────────────────────────
        buildUI();

        // ─── Resize ─────────────────────────────────────────────────
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─── Render loop ────────────────────────────────────────────
        await renderer.init();
        renderer.setAnimationLoop(animate);
      }

      // ─── Animate ──────────────────────────────────────────────────────
      function animate() {
        timer.update();
        const dt = timer.getDelta();
        const t  = timer.getElapsed();

        controls.update();

        // Update time-of-day lighting
        updateLighting();

        // Sync cloud-shadow uniforms (terrain side).
        if (cloudShadowUniforms) {
          cloudShadowUniforms.enabled.value   = cloudShadow.enabled ? 1.0 : 0.0;
          cloudShadowUniforms.intensity.value = cloudShadow.intensity;
          cloudShadowUniforms.coverage.value  = cloudShadow.coverage;
          cloudShadowUniforms.softness.value  = cloudShadow.softness;
          cloudShadowUniforms.scale.value     = cloudShadow.scale;
          cloudShadowUniforms.speed.value     = cloudShadow.speed;
          if (cloudShadow.useSharedWind) {
            cloudShadowUniforms.wind.value.set(shared.windX, shared.windZ);
          } else {
            cloudShadowUniforms.wind.value.set(cloudShadow.windX, cloudShadow.windZ);
          }
        }

        // Update active effect
        if (activeEffect && activeEffect.update) {
          activeEffect.update(dt, t, shared);
        }

        // Info overlay
        const fps = Math.round(1 / Math.max(dt, 0.001));
        const effLabel = activeEffectName === "none" ? "None" : activeEffectName;
        infoEl.textContent = `FX: ${effLabel}  |  ${fps} fps`;

        renderer.render(scene, camera);
      }

      // ─── Time-of-day lighting ─────────────────────────────────────────
      function updateLighting() {
        const t = shared.timeOfDay;
        const dirLight = scene.userData.dirLight;
        const ambLight = scene.userData.ambLight;

        // Sun angle: 0.25 = sunrise, 0.5 = noon, 0.75 = sunset
        const sunAngle = (t - 0.25) * Math.PI * 2;
        const sunY = Math.sin(sunAngle);
        const sunX = Math.cos(sunAngle) * 0.5;

        dirLight.position.set(sunX * 20, Math.max(sunY * 15, 0.5), 8);

        // Intensity based on sun height
        const dayFactor = Math.max(sunY, 0);
        dirLight.intensity = 0.3 + dayFactor * 1.7;
        ambLight.intensity = 0.15 + dayFactor * 0.45;

        // Sky color shift: warm sunrise/sunset, blue midday, dark night
        const isDay = dayFactor > 0.05;
        if (isDay) {
          const warmth = 1 - dayFactor; // more warm near horizon
          const r = 0.53 + warmth * 0.35;
          const g = 0.73 + warmth * 0.05 - warmth * 0.15;
          const b = 0.87 - warmth * 0.35;
          scene.background.setRGB(r, g, b);
        } else {
          scene.background.setRGB(0.05, 0.05, 0.12);
        }
      }

      // ─── Switch effect ────────────────────────────────────────────────
      function switchEffect(name) {
        // Dispose current
        if (activeEffect && activeEffect.dispose) {
          activeEffect.dispose(scene);
        }
        activeEffect = null;
        activeEffectName = name;

        // Remove effect-specific UI folder if it exists
        if (fxFolder) {
          fxFolder.dispose();
          fxFolder = null;
        }

        if (name === "none") {
          labelEl.textContent = "Ambient FX Editor";
          labelEl.style.color = "#7df";
          return;
        }

        // Create new effect if registered
        if (effects[name]) {
          activeEffect = effects[name].create(scene, shared, renderer);
          // Build effect-specific UI
          if (effects[name].buildUI) {
            fxFolder = pane.addFolder({ title: name, expanded: true });
            effects[name].buildUI(fxFolder, activeEffect, shared);
          }
          labelEl.textContent = `FX: ${name}`;
          labelEl.style.color = getFXColor(name);
        }
      }

      function getFXColor(name) {
        const colors = {
          Butterflies:    "#f7b",
          Embers:         "#fa3",
          Fireflies:      "#bf5",
          "Flowing Lines":"#adf",
          "Floating Leaves":"#9f6",
          Rain:           "#8cf",
          "Billboard Clouds": "#def",
        };
        return colors[name] || "#7df";
      }

      // ─── Tweakpane UI ─────────────────────────────────────────────────
      function buildUI() {
        pane = new Pane({ title: "Ambient FX" });

        // Effect selector
        pane.addBinding(shared, "effect", {
          label: "Effect",
          options: {
            "None":         "none",
            "Butterflies":  "Butterflies",
            "Embers":       "Embers",
            "Fireflies":    "Fireflies",
            "Flowing Lines":"Flowing Lines",
            "Floating Leaves":"Floating Leaves",
            "Rain":         "Rain",
            "Billboard Clouds": "Billboard Clouds",
          },
        }).on("change", (ev) => switchEffect(ev.value));

        pane.addBlade({ view: "separator" });

        // ── Shared environment controls ──
        const envFolder = pane.addFolder({ title: "Environment", expanded: true });

        envFolder.addBinding(shared, "timeOfDay", {
          label: "Time of Day",
          min: 0, max: 1, step: 0.01,
        });

        envFolder.addBinding(shared, "windStrength", {
          label: "Wind Strength",
          min: 0, max: 3, step: 0.05,
        });

        envFolder.addBinding(shared, "windX", {
          label: "Wind X",
          min: -3, max: 3, step: 0.1,
        });

        envFolder.addBinding(shared, "windZ", {
          label: "Wind Z",
          min: -3, max: 3, step: 0.1,
        });

        envFolder.addBlade({ view: "separator" });

        envFolder.addBinding(shared, "density", {
          label: "Density",
          min: 0.1, max: 3, step: 0.1,
        });

        envFolder.addBinding(shared, "volume", {
          label: "Volume Radius",
          min: 5, max: 60, step: 1,
        });

        envFolder.addBinding(shared, "groundY", {
          label: "Ground Y",
          min: -5, max: 5, step: 0.1,
        });

        envFolder.addBlade({ view: "separator" });

        envFolder.addBinding(shared, "showGround", { label: "Show Ground" })
          .on("change", (ev) => {
            scene.userData.ground.visible = ev.value;
            scene.userData.grid.visible = ev.value;
          });

        // Cloud shadows (terrain side).
        const csFolder = envFolder.addFolder({ title: "Cloud shadows", expanded: false });
        csFolder.addBinding(cloudShadow, "enabled", { label: "Enabled" });
        csFolder.addBinding(cloudShadow, "intensity", {
          label: "Intensity", min: 0, max: 1, step: 0.01,
        });
        csFolder.addBinding(cloudShadow, "coverage", {
          label: "Coverage", min: 0, max: 1, step: 0.01,
        });
        csFolder.addBinding(cloudShadow, "softness", {
          label: "Softness", min: 0.005, max: 0.5, step: 0.005,
        });
        csFolder.addBinding(cloudShadow, "scale", {
          label: "Scale (freq)", min: 0.005, max: 0.2, step: 0.005,
        });
        csFolder.addBinding(cloudShadow, "speed", {
          label: "Drift speed", min: 0, max: 10, step: 0.1,
        });
        csFolder.addBinding(cloudShadow, "useSharedWind", { label: "Use env wind dir" });

        // Placeholder for effect-specific folder (created dynamically)
        fxFolder = null;
      }

      // Flowing Lines effect wired directly to flowing-lines.js and terrainHeight().
      function createFlowingLinesFX(scene, shared) {
        const params = {
          lineCount: 12,
          lineLength: 14,
          lineWidth: 0.18,
          segments: 24,
          heightOffset: 0.4,
          verticalWave: 0.1,
          animationSpeed: 1.2,
          pathRadius: 30,
          pathFrequency: 0.9,
          lineColor: "#a8d8ea",
          lineOpacity: 0.75,
          pathNoise: 0.0,
          windStrength: 0.0,
          depthFadeNear: 0.0,
          depthFadeFar: 0.0,
        };

        let flowing = null;

        function buildInstance() {
          if (flowing && flowing.group) {
            scene.remove(flowing.group);
            for (const line of flowing.linesData) {
              line.mesh.geometry.dispose();
            }
          }

          flowing = createFlowingLines({
            scene,
            getTerrainHeight: (x, z) => terrainHeight(x, z) + shared.groundY,
            lineCount: params.lineCount,
            lineLength: params.lineLength,
            lineWidth: params.lineWidth,
            segments: params.segments,
            heightOffset: params.heightOffset,
            verticalWave: params.verticalWave,
            animationSpeed: params.animationSpeed,
            pathRadius: params.pathRadius,
            pathFrequency: params.pathFrequency,
            lineColor: params.lineColor,
            lineOpacity: params.lineOpacity,
            pathNoise: params.pathNoise,
            windDirX: shared.windX,
            windDirZ: shared.windZ,
            windSpeed: params.windStrength * shared.windStrength * 0.05,
            depthFadeNear: params.depthFadeNear,
            depthFadeFar: params.depthFadeFar,
          });
        }

        buildInstance();

        function update(_dt, elapsed) {
          if (!flowing) return;

          flowing.params.heightOffset = params.heightOffset;
          flowing.params.verticalWave = params.verticalWave;
          flowing.params.animationSpeed = params.animationSpeed;
          flowing.params.pathRadius = params.pathRadius;
          flowing.params.pathFrequency = params.pathFrequency;
          flowing.params.pathNoise = params.pathNoise;
          flowing.params.windDirX = shared.windX;
          flowing.params.windDirZ = shared.windZ;
          flowing.params.windSpeed = params.windStrength * shared.windStrength * 0.05;

          flowing.setParams({
            lineColor: params.lineColor,
            lineOpacity: params.lineOpacity,
            depthFadeNear: params.depthFadeNear,
            depthFadeFar: params.depthFadeFar,
          });

          flowing.update(elapsed);
        }

        function dispose(sc) {
          if (!flowing) return;
          sc.remove(flowing.group);
          for (const line of flowing.linesData) {
            line.mesh.geometry.dispose();
          }
          flowing = null;
        }

        function rebuild() {
          buildInstance();
        }

        return { update, dispose, params, rebuild };
      }

      function buildFlowingLinesUI(folder, state) {
        const p = state.params;

        folder.addButton({ title: "Apply geometry" }).on("click", () => {
          state.rebuild();
        });

        folder.addBinding(p, "lineCount", {
          label: "Line Count",
          min: 1, max: 24, step: 1,
        });
        folder.addBinding(p, "lineLength", {
          label: "Line Length",
          min: 4, max: 30, step: 1,
        });
        folder.addBinding(p, "lineWidth", {
          label: "Line Width",
          min: 0.05, max: 0.5, step: 0.01,
        });
        folder.addBinding(p, "segments", {
          label: "Segments",
          min: 8, max: 48, step: 2,
        });
        folder.addBinding(p, "heightOffset", {
          label: "Height Offset",
          min: 0, max: 3, step: 0.05,
        });
        folder.addBinding(p, "verticalWave", {
          label: "Vertical Wave",
          min: 0, max: 0.3, step: 0.01,
        });
        folder.addBinding(p, "animationSpeed", {
          label: "Anim Speed",
          min: 0.2, max: 3, step: 0.05,
        });
        folder.addBinding(p, "pathRadius", {
          label: "Path Radius",
          min: 10, max: 80, step: 2,
        });
        folder.addBinding(p, "pathFrequency", {
          label: "Path Freq",
          min: 0.2, max: 2, step: 0.05,
        });
        folder.addBinding(p, "lineColor", { label: "Line Color" });
        folder.addBinding(p, "lineOpacity", {
          label: "Opacity",
          min: 0.2, max: 1, step: 0.05,
        });

        const adv = folder.addFolder({ title: "Advanced", expanded: false });
        adv.addBinding(p, "pathNoise", {
          label: "Path Noise",
          min: 0, max: 4, step: 0.1,
        });
        adv.addBinding(p, "windStrength", {
          label: "Wind Coupling",
          min: 0, max: 3, step: 0.05,
        });
        adv.addBinding(p, "depthFadeNear", {
          label: "Depth Fade Near",
          min: 0, max: 80, step: 1,
        });
        adv.addBinding(p, "depthFadeFar", {
          label: "Depth Fade Far",
          min: 0, max: 200, step: 1,
        });
      }

      // ─── Effect registration ────────────────────────────────────────────
      effects["Butterflies"] = {
        create: (sc, sh) => createButterflyFX(sc, sh),
        buildUI: (folder, state, sh) => buildButterflyUI(folder, state),
      };
      effects["Embers"] = {
        create: (sc, sh) => createEmberFX(sc, sh),
        buildUI: (folder, state, sh) => buildEmberUI(folder, state),
      };
      effects["Flowing Lines"] = {
        create: (sc, sh) => createFlowingLinesFX(sc, sh),
        buildUI: (folder, state, sh) => buildFlowingLinesUI(folder, state),
      };
      effects["Floating Leaves"] = {
        create: (sc, sh) => createFloatingLeavesFX(sc, sh, terrainHeight),
        buildUI: (folder, state, sh) => buildFloatingLeavesUI(folder, state),
      };
      effects["Rain"] = {
        create: (sc, sh) => {
          const rain = createRainFX(sc, sh, terrainHeight);
          rain.setCamera(camera);
          return rain;
        },
        buildUI: (folder, state, sh) => buildRainUI(folder, state),
      };
      effects["Billboard Clouds"] = {
        create: (sc, sh) => {
          const clouds = createBillboardCloudFX(sc, sh);
          clouds.setCamera(camera);
          return clouds;
        },
        buildUI: (folder, state) => buildBillboardCloudUI(folder, state),
      };
    </script>
  </body>
</html>
