<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient FX Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

      .tp-dfwv {
        position: fixed !important;
        top: 16px !important;
        right: 16px !important;
        width: 280px !important;
        z-index: 20;
        max-height: calc(100vh - 32px) !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
      }

      #info {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 20;
        font: 12px/1.5 "SF Mono", monospace;
        color: #aaa;
        background: rgba(0,0,0,0.6);
        padding: 8px 12px;
        border-radius: 6px;
        pointer-events: none;
      }

      #fx-label {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 20;
        font: bold 14px "SF Mono", monospace;
        padding: 6px 14px;
        border-radius: 6px;
        background: rgba(40, 40, 40, 0.85);
        color: #7df;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="fx-label">Ambient FX Editor</div>
    <div id="info">Select an effect type to begin</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/+esm"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        color, cos, float, mix, normalWorld, sin, smoothstep, step,
        texture, time, uniform, uv, vec2, vec3, vec4,
        positionLocal, instanceIndex, hash, attribute,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { Pane } from "tweakpane";
      import { createButterflyFX, buildButterflyUI } from "./fx-butterflies.js";
      import { createEmberFX, buildEmberUI } from "./fx-embers.js";

      // ─── Globals ──────────────────────────────────────────────────────
      let camera, scene, renderer, controls, timer;
      const infoEl = document.getElementById("info");
      const labelEl = document.getElementById("fx-label");

      // ─── Shared params ────────────────────────────────────────────────
      const shared = {
        effect:    "none",
        timeOfDay: 0.35,       // 0 = midnight, 0.5 = noon, 1 = midnight
        windX:     1.0,
        windZ:     0.3,
        windStrength: 1.0,
        density:   1.0,
        groundY:   0.0,
        volume:    30,         // spawn volume radius
        showGround: true,
        bgColor:   "#87CEEB",
      };

      // ─── Effect registry ──────────────────────────────────────────────
      // Each effect module will register here: { create, update, dispose }
      const effects = {};
      let activeEffect = null;
      let activeEffectName = "none";

      // ─── Tweakpane refs (must be declared before init) ────────────────
      let pane, fxFolder;

      // ─── Init ─────────────────────────────────────────────────────────
      init();

      async function init() {
        timer = new THREE.Timer();

        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(shared.bgColor);

        // Camera
        camera = new THREE.PerspectiveCamera(
          50, window.innerWidth / window.innerHeight, 0.1, 500
        );
        camera.position.set(12, 10, 18);

        // Renderer
        renderer = new THREE.WebGPURenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // Controls
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 2, 0);

        // ─── Lighting ───────────────────────────────────────────────
        const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 12, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(1024, 1024);
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        scene.add(dirLight);

        // Store refs for time-of-day updates
        scene.userData.dirLight = dirLight;
        scene.userData.ambLight = ambLight;

        // ─── Ground plane ───────────────────────────────────────────
        const groundGeo = new THREE.PlaneGeometry(80, 80);
        const groundMat = new THREE.MeshStandardMaterial({
          color: 0x4a7a3a,
          roughness: 0.9,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);
        scene.userData.ground = ground;

        // ─── Some reference props (small rocks/bumps for scale) ─────
        const bumpGeo = new THREE.SphereGeometry(0.8, 6, 4);
        const bumpMat = new THREE.MeshStandardMaterial({ color: 0x5a6a4a, roughness: 0.95 });
        for (let i = 0; i < 8; i++) {
          const bump = new THREE.Mesh(bumpGeo, bumpMat);
          const angle = (i / 8) * Math.PI * 2;
          const r = 6 + Math.random() * 12;
          bump.position.set(
            Math.cos(angle) * r,
            -0.3 + Math.random() * 0.2,
            Math.sin(angle) * r
          );
          bump.scale.set(
            0.6 + Math.random() * 1.2,
            0.3 + Math.random() * 0.5,
            0.6 + Math.random() * 1.2
          );
          bump.castShadow = true;
          bump.receiveShadow = true;
          scene.add(bump);
        }

        // ─── Grid helper for spatial reference ──────────────────────
        const grid = new THREE.GridHelper(80, 40, 0x333333, 0x222222);
        grid.position.y = 0.01;
        scene.add(grid);
        scene.userData.grid = grid;

        // ─── Tweakpane ──────────────────────────────────────────────
        buildUI();

        // ─── Resize ─────────────────────────────────────────────────
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─── Render loop ────────────────────────────────────────────
        await renderer.init();
        renderer.setAnimationLoop(animate);
      }

      // ─── Animate ──────────────────────────────────────────────────────
      function animate() {
        timer.update();
        const dt = timer.getDelta();
        const t  = timer.getElapsed();

        controls.update();

        // Update time-of-day lighting
        updateLighting();

        // Update active effect
        if (activeEffect && activeEffect.update) {
          activeEffect.update(dt, t, shared);
        }

        // Info overlay
        const fps = Math.round(1 / Math.max(dt, 0.001));
        const effLabel = activeEffectName === "none" ? "None" : activeEffectName;
        infoEl.textContent = `FX: ${effLabel}  |  ${fps} fps`;

        renderer.render(scene, camera);
      }

      // ─── Time-of-day lighting ─────────────────────────────────────────
      function updateLighting() {
        const t = shared.timeOfDay;
        const dirLight = scene.userData.dirLight;
        const ambLight = scene.userData.ambLight;

        // Sun angle: 0.25 = sunrise, 0.5 = noon, 0.75 = sunset
        const sunAngle = (t - 0.25) * Math.PI * 2;
        const sunY = Math.sin(sunAngle);
        const sunX = Math.cos(sunAngle) * 0.5;

        dirLight.position.set(sunX * 20, Math.max(sunY * 15, 0.5), 8);

        // Intensity based on sun height
        const dayFactor = Math.max(sunY, 0);
        dirLight.intensity = 0.3 + dayFactor * 1.7;
        ambLight.intensity = 0.15 + dayFactor * 0.45;

        // Sky color shift: warm sunrise/sunset, blue midday, dark night
        const isDay = dayFactor > 0.05;
        if (isDay) {
          const warmth = 1 - dayFactor; // more warm near horizon
          const r = 0.53 + warmth * 0.35;
          const g = 0.73 + warmth * 0.05 - warmth * 0.15;
          const b = 0.87 - warmth * 0.35;
          scene.background.setRGB(r, g, b);
        } else {
          scene.background.setRGB(0.05, 0.05, 0.12);
        }
      }

      // ─── Switch effect ────────────────────────────────────────────────
      function switchEffect(name) {
        // Dispose current
        if (activeEffect && activeEffect.dispose) {
          activeEffect.dispose(scene);
        }
        activeEffect = null;
        activeEffectName = name;

        // Remove effect-specific UI folder if it exists
        if (fxFolder) {
          fxFolder.dispose();
          fxFolder = null;
        }

        if (name === "none") {
          labelEl.textContent = "Ambient FX Editor";
          labelEl.style.color = "#7df";
          return;
        }

        // Create new effect if registered
        if (effects[name]) {
          activeEffect = effects[name].create(scene, shared, renderer);
          // Build effect-specific UI
          if (effects[name].buildUI) {
            fxFolder = pane.addFolder({ title: name, expanded: true });
            effects[name].buildUI(fxFolder, activeEffect, shared);
          }
          labelEl.textContent = `FX: ${name}`;
          labelEl.style.color = getFXColor(name);
        }
      }

      function getFXColor(name) {
        const colors = {
          Butterflies: "#f7b",
          Embers:      "#fa3",
          Fireflies:   "#bf5",
          "Wind Lines":"#adf",
        };
        return colors[name] || "#7df";
      }

      // ─── Tweakpane UI ─────────────────────────────────────────────────
      function buildUI() {
        pane = new Pane({ title: "Ambient FX" });

        // Effect selector
        pane.addBinding(shared, "effect", {
          label: "Effect",
          options: {
            "None":       "none",
            "Butterflies":"Butterflies",
            "Embers":     "Embers",
            "Fireflies":  "Fireflies",
            "Wind Lines": "Wind Lines",
          },
        }).on("change", (ev) => switchEffect(ev.value));

        pane.addBlade({ view: "separator" });

        // ── Shared environment controls ──
        const envFolder = pane.addFolder({ title: "Environment", expanded: true });

        envFolder.addBinding(shared, "timeOfDay", {
          label: "Time of Day",
          min: 0, max: 1, step: 0.01,
        });

        envFolder.addBinding(shared, "windStrength", {
          label: "Wind Strength",
          min: 0, max: 3, step: 0.05,
        });

        envFolder.addBinding(shared, "windX", {
          label: "Wind X",
          min: -3, max: 3, step: 0.1,
        });

        envFolder.addBinding(shared, "windZ", {
          label: "Wind Z",
          min: -3, max: 3, step: 0.1,
        });

        envFolder.addBlade({ view: "separator" });

        envFolder.addBinding(shared, "density", {
          label: "Density",
          min: 0.1, max: 3, step: 0.1,
        });

        envFolder.addBinding(shared, "volume", {
          label: "Volume Radius",
          min: 5, max: 60, step: 1,
        });

        envFolder.addBinding(shared, "groundY", {
          label: "Ground Y",
          min: -5, max: 5, step: 0.1,
        });

        envFolder.addBlade({ view: "separator" });

        envFolder.addBinding(shared, "showGround", { label: "Show Ground" })
          .on("change", (ev) => {
            scene.userData.ground.visible = ev.value;
            scene.userData.grid.visible = ev.value;
          });

        // Placeholder for effect-specific folder (created dynamically)
        fxFolder = null;
      }

      // ─── Effect registration ────────────────────────────────────────────
      effects["Butterflies"] = {
        create: (sc, sh) => createButterflyFX(sc, sh),
        buildUI: (folder, state, sh) => buildButterflyUI(folder, state),
      };
      effects["Embers"] = {
        create: (sc, sh) => createEmberFX(sc, sh),
        buildUI: (folder, state, sh) => buildEmberUI(folder, state),
      };
    </script>
  </body>
</html>
