<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghibli Sky — WebGPU</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
          "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #fff;
        font-size: 12px;
        opacity: 0.75;
        pointer-events: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }

      .tp-dfwv {
        max-height: calc(100vh - 20px);
        overflow-y: auto;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hint">
      Orbit: LMB rotate · RMB pan · wheel zoom · Try Day/Night animate + Sunset preset
    </div>

    <script type="module">
      import { createGhibliSkyScene } from "./ghibli-sky-scene.js";

      createGhibliSkyScene({ container: document.getElementById("app") }).catch(
        (err) => {
          console.error(err);
          const msg = document.createElement("div");
          msg.style.cssText =
            "position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:8px;background:rgba(20,20,20,.9);color:#fff;font:14px/1.4 system-ui,sans-serif";
          msg.textContent =
            "Failed to start Ghibli sky. Check WebGPU support and console.";
          document.body.appendChild(msg);
        },
      );
    </script>
  </body>
</html>
